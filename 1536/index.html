<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Worried Note</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d0c10; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- sizing: Visual Viewport API, canvas pinned in draw() ----------
  var W = 720, H = 720, fieldX = 0, fieldY = 0, fieldW = 720, fieldH = 720, phone = false;
  function size() {
    var vw = 720, vh = 720;
    if (typeof window !== 'undefined') {
      if (window.visualViewport && window.visualViewport.width) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      } else if (window.innerWidth) {
        vw = window.innerWidth; vh = window.innerHeight;
      }
    }
    W = vw; H = vh;
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width; sh = window.screen.height; }
    var minDim = Math.min(sw || vw, sh || vh);
    phone = (sw && sh && minDim < 700) || (H > W * 1.15);
    if (phone) { fieldX = 0; fieldY = 0; fieldW = W; fieldH = H; }
    else {
      var side = Math.min(W, H);
      fieldX = (W - side) / 2; fieldY = (H - side) / 2; fieldW = side; fieldH = side;
    }
  }

  // ---------- seeded PRNG (mulberry32), phrase table built once ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(1536000);
  var BASE = [
    ['fast', 2.0], ['freeze', 1.5], ['replay', 2.5], ['slow', 3.0], ['freeze', 1.5]
  ];
  var PHRASES = [];
  var S_TOTAL = 0;
  var T_TOTAL = 0;
  for (var p = 0; p < 4; p++) {
    var beats = [];
    var sCursor = S_TOTAL;
    var tRel = 0; // beat starts are phrase-relative; phrase start stays absolute
    for (var b = 0; b < BASE.length; b++) {
      var type = BASE[b][0];
      var dur = BASE[b][1] * (0.85 + 0.3 * rand());
      var beat = { type: type, dur: dur, start: tRel, sStart: sCursor };
      if (type === 'fast') {
        var adv = 0.085 + 0.03 * rand();
        beat.adv = adv; beat.rate = adv / dur;
        sCursor += adv;
      } else if (type === 'slow') {
        var adv2 = 0.035 + 0.02 * rand();
        beat.adv = adv2; beat.rate = adv2 / dur;
        sCursor += adv2;
      } else if (type === 'replay') {
        beat.delta = 0.06 + 0.03 * rand();
        // net zero: jump back delta, then re-advance delta over the beat
      }
      beats.push(beat);
      tRel += dur;
    }
    PHRASES.push({ beats: beats, start: T_TOTAL, dur: tRel });
    S_TOTAL = sCursor;
    T_TOTAL += tRel;
  }
  var LOOP = T_TOTAL;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // Loop-local time, snapped to a 1e-9 grid so t=LOOP lands exactly on 0.
  function loopLocal(t) {
    var u = t % LOOP;
    if (u < 0) u += LOOP;
    u = Math.round(u * 1e9) / 1e9;
    if (u >= LOOP) u = 0;
    return u;
  }

  // Closed-form path coordinate s (fraction of one full traverse) at loop-local u.
  function sAt(u) {
    for (var pi = 0; pi < PHRASES.length; pi++) {
      var ph = PHRASES[pi];
      if (u < ph.start + ph.dur || pi === PHRASES.length - 1) {
        var lu = u - ph.start;
        for (var bi = 0; bi < ph.beats.length; bi++) {
          var beat = ph.beats[bi];
          if (lu < beat.start + beat.dur || bi === ph.beats.length - 1) {
            var bt = lu - beat.start;
            if (beat.type === 'fast' || beat.type === 'slow') return beat.sStart + beat.rate * bt;
            if (beat.type === 'freeze') return beat.sStart;
            if (beat.type === 'replay') return beat.sStart - beat.delta + (beat.delta / beat.dur) * bt;
          }
        }
      }
    }
    return S_TOTAL;
  }

  // Phrase / beat containing loop-local u (for the probe hook).
  function phraseAt(u) {
    for (var pi = 0; pi < PHRASES.length; pi++) {
      var ph = PHRASES[pi];
      if (u < ph.start + ph.dur || pi === PHRASES.length - 1) {
        var lu = u - ph.start;
        for (var bi = 0; bi < ph.beats.length; bi++) {
          var beat = ph.beats[bi];
          if (lu < beat.start + beat.dur || bi === ph.beats.length - 1) {
            return { phrase: pi, beat: bi, type: beat.type };
          }
        }
      }
    }
    return { phrase: 0, beat: 0, type: 'fast' };
  }

  function xFromS(s) {
    return fieldX + (0.12 + 0.76 * (s / S_TOTAL)) * fieldW;
  }

  // ---------- drag state: pure functions of recorded events ----------
  var lastT = 0;
  var dragMode = null; // null | 'mark' | ghost phrase index
  var dragX = 0, dragY = 0, grabS = 0, grabLoop = 0;
  var erased = []; // {loop, phrase} — erasure applies to its own loop only

  function markPos(t) {
    var u = loopLocal(t);
    var s = sAt(u);
    return { x: xFromS(s), y: fieldY + fieldH * 0.5, u: u, s: s };
  }

  function onDown(e) {
    size();
    var px = e.clientX, py = e.clientY;
    var pos = markPos(lastT);
    var minDim = Math.min(fieldW, fieldH);
    var stemLen = 0.13 * minDim;
    var hitR = Math.max(34, stemLen * 0.8);
    var dx = px - pos.x, dy = py - pos.y;
    if (dx * dx + dy * dy <= hitR * hitR) {
      dragMode = 'mark';
      dragX = px; dragY = py;
      grabS = pos.s;
      grabLoop = Math.floor(lastT / LOOP);
      if (e.preventDefault) e.preventDefault();
      return;
    }
    // Ghost hit: nearest visible ghost segment within 18 px vertically.
    var u = pos.u;
    var loopIdx = Math.floor(lastT / LOOP);
    for (var pi = 0; pi < PHRASES.length; pi++) {
      var ph = PHRASES[pi];
      var rb = ph.beats[2];
      if (u >= ph.start + rb.start) {
        var gx0 = xFromS(rb.sStart - rb.delta);
        var gx1 = xFromS(rb.sStart);
        var lo = Math.min(gx0, gx1) - 10, hi = Math.max(gx0, gx1) + 10;
        if (py >= pos.y - 18 && py <= pos.y + 18 && px >= lo && px <= hi) {
          var already = false;
          for (var k = 0; k < erased.length; k++) {
            if (erased[k].loop === loopIdx && erased[k].phrase === pi) already = true;
          }
          if (!already) erased.push({ loop: loopIdx, phrase: pi });
          dragMode = pi;
          if (e.preventDefault) e.preventDefault();
          return;
        }
      }
    }
  }
  function onMove(e) {
    if (dragMode === 'mark') { dragX = e.clientX; dragY = e.clientY; }
  }
  function onUp() {
    dragMode = null;
  }
  canvas.addEventListener('pointerdown', onDown);
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', size);
    }
    window.addEventListener('resize', size);
  }

  function draw(t) {
    size();
    lastT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (canvas.width !== W) canvas.width = W;
    if (canvas.height !== H) canvas.height = H;

    var u = loopLocal(t);
    var loopIdx = Math.floor(t / LOOP);
    var pos = markPos(t);
    var s = pos.s;
    var minDim = Math.min(fieldW, fieldH);
    var stemLen = 0.13 * minDim;
    var thick = Math.max(2, 0.02 * minDim);
    var tipLen = 0.05 * minDim;

    // Displayed mark position: scheduled, or pointer + phrase offset while dragged.
    var mx = pos.x, my = pos.y;
    if (dragMode === 'mark') {
      var offPx = ((s - grabS) / S_TOTAL) * 0.76 * fieldW;
      mx = clamp(dragX + offPx, fieldX + 8, fieldX + fieldW - 8);
      my = clamp(dragY, fieldY + 8, fieldY + fieldH - 8);
    }

    ctx.fillStyle = '#0d0c10';
    ctx.fillRect(0, 0, W, H);

    // Ghosts: one per replay beat already started in this loop, unless erased.
    var hookGhosts = [];
    for (var pi = 0; pi < PHRASES.length; pi++) {
      var ph = PHRASES[pi];
      var rb = ph.beats[2];
      if (u >= ph.start + rb.start) {
        var gx0 = xFromS(rb.sStart - rb.delta);
        var gx1 = xFromS(rb.sStart);
        var isErased = false;
        for (var k = 0; k < erased.length; k++) {
          if (erased[k].loop === loopIdx && erased[k].phrase === pi) isErased = true;
        }
        hookGhosts.push({ x0: gx0, x1: gx1, phrase: pi, erased: isErased });
        if (!isErased) {
          ctx.strokeStyle = '#4a4438';
          ctx.lineWidth = Math.max(2, 0.016 * minDim);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(gx0, pos.y);
          ctx.lineTo(gx1, pos.y);
          ctx.stroke();
        }
      }
    }

    // The mark: thick short bar with a rounded end, like a bent note stem.
    // Stem in bone; the bent tip is the red "worried" segment, always the same.
    var tilt = -0.12;
    var sx = Math.sin(tilt) * stemLen * 0.5, sy = Math.cos(tilt) * stemLen * 0.5;
    var topX = mx + sx, topY = my - sy;
    var botX = mx - sx, botY = my + sy;
    ctx.strokeStyle = '#ddd3b8';
    ctx.lineWidth = thick;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(botX, botY);
    ctx.lineTo(topX, topY);
    ctx.stroke();
    ctx.strokeStyle = '#b33324';
    ctx.lineWidth = thick;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(topX, topY);
    ctx.lineTo(topX + tipLen * 0.9, topY + tipLen * 0.45);
    ctx.stroke();

    if (typeof window !== 'undefined') {
      var pa = phraseAt(u);
      window.__t36 = {
        loop: LOOP, u: u, loopIdx: loopIdx, phrase: pa.phrase, beat: pa.beat,
        beatType: pa.type, s: s, sTotal: S_TOTAL,
        mark: { x: mx, y: my, schedX: pos.x },
        ghosts: hookGhosts, dragMode: dragMode,
        field: { x: fieldX, y: fieldY, w: fieldW, h: fieldH }
      };
    }
  }

  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    draw((ts - startT) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  draw(0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
