<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Island That Rose and Sank</title>
<style>html,body{margin:0;padding:0;background:#0e1420;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var SEA = '#0e1420';
  var ISLAND = '#8a8a80';
  var FOAM = '#4a5a6a';
  var FLAGS = ['#2a4d8f', '#a33327', '#c9a227', '#e8e8e0'];
  var SHIFT = 15;
  var CYCLE = 40;
  var SUPER = 160;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1512000);
  var RAD = [];
  var i;
  for (i = 0; i < 26; i++) { RAD.push(0.84 + 0.28 * rng()); }

  function ss(x) {
    x = Math.max(0, Math.min(1, x));
    return x * x * (3 - 2 * x);
  }
  function a4(x) { return Math.round(x * 10000) / 10000; }

  var canvas = null;
  var ctx = null;
  if (typeof document !== 'undefined' && document.getElementById) {
    canvas = document.getElementById('c');
    if (canvas && canvas.getContext) { ctx = canvas.getContext('2d'); }
  }

  var lastW = 720, lastH = 720;
  var nowT = 0;
  var segments = [];
  var activeSeg = null;

  function size() {
    var w = 720, h = 720;
    if (typeof window !== 'undefined') {
      if (window.visualViewport && window.visualViewport.width) {
        w = window.visualViewport.width; h = window.visualViewport.height;
      } else if (window.innerWidth) {
        w = window.innerWidth; h = window.innerHeight;
      }
    }
    return { w: w, h: h };
  }
  function isPhone(w, h) {
    if (typeof window !== 'undefined' && window.screen) {
      var m = Math.min(window.screen.width, window.screen.height);
      if (m < 700) { return true; }
    }
    return h > w * 1.15;
  }
  function geom(w, h) {
    var minWH = Math.min(w, h);
    var iw = Math.min(0.62 * minWH, 0.8 * w);
    var ih = 0.34 * iw;
    var cx = 0.5 * w;
    var bottomUp = 0.97 * h;
    var centerUpY = bottomUp - ih / 2;
    return { iw: iw, ih: ih, cx: cx, centerUpY: centerUpY, sink: ih + 0.06 * h };
  }
  function phaseAt(eff) {
    var st = (eff + SHIFT) % SUPER;
    var ct = st % CYCLE;
    var cycle = Math.floor(st / CYCLE) % 4;
    var phase = 'rest';
    if (ct < 10) { phase = 'rise'; }
    else if (ct < 26) { phase = 'hold'; }
    else if (ct < 36) { phase = 'sink'; }
    return { st: st, ct: ct, cycle: cycle, phase: phase };
  }
  function islandOffset(ct, g, h) {
    if (ct < 10) { return (1 - ss(ct / 10)) * g.sink; }
    if (ct < 26) { return 0; }
    if (ct < 36) { return ss((ct - 26) / 10) * g.sink; }
    return g.sink;
  }
  function flagAlpha(ct) {
    if (ct < 2) { return 0; }
    if (ct < 4) { return (ct - 2) / 2; }
    if (ct < 36) { return 1; }
    if (ct < 39) { return 1 - (ct - 36) / 3; }
    return 0;
  }
  function effT(t) {
    var frozen = 0;
    var k, seg, effStart, endT;
    for (k = 0; k < segments.length; k++) {
      seg = segments[k];
      if (seg.tDown >= t) { break; }
      effStart = seg.tDown - frozen;
      endT = (seg.tUp === null || seg.tUp === undefined) ? t : Math.min(seg.tUp, t);
      if (seg.onIsland && (seg.y1 - seg.y0) < -20 && phaseAt(effStart).phase === 'hold') {
        if (t <= (seg.tUp === null || seg.tUp === undefined ? Infinity : seg.tUp)) {
          return effStart;
        }
        frozen += (seg.tUp - seg.tDown);
      }
    }
    return t - frozen;
  }

  function draw(tReal) {
    if (!ctx) { return; }
    nowT = tReal;
    var s = size();
    var w = s.w, h = s.h;
    lastW = w; lastH = h;
    var dpr = 1;
    if (typeof window !== 'undefined' && window.devicePixelRatio) { dpr = window.devicePixelRatio; }
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var eff = effT(tReal);
    var ph = phaseAt(eff);
    var ct = ph.ct;
    var g = geom(w, h);
    var off = islandOffset(ct, g, h);
    var cy = g.centerUpY + off;
    var upness = 1 - off / g.sink;

    ctx.fillStyle = SEA;
    ctx.fillRect(0, 0, w, h);

    var rows = [0.14, 0.30, 0.46, 0.62, 0.78];
    var r, x, y;
    ctx.lineWidth = 1;
    for (r = 0; r < rows.length; r++) {
      ctx.beginPath();
      for (x = 0; x <= w; x += Math.max(8, w / 48)) {
        y = rows[r] * h + Math.sin(x * 0.02 + r * 1.7 + 2 * Math.PI * tReal / SUPER) * 0.006 * h;
        if (x === 0) { ctx.moveTo(x, y); } else { ctx.lineTo(x, y); }
      }
      ctx.strokeStyle = 'rgba(74,90,106,' + a4(0.55) + ')';
      ctx.stroke();
    }

    var a, px, py;
    ctx.beginPath();
    for (i = 0; i < 26; i++) {
      a = -Math.PI / 2 + i / 26 * 2 * Math.PI;
      px = g.cx + Math.cos(a) * g.iw / 2 * RAD[i];
      py = cy + Math.sin(a) * g.ih / 2 * RAD[i];
      if (i === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
    }
    ctx.closePath();
    ctx.fillStyle = ISLAND;
    ctx.fill();

    if (upness > 0) {
      var k, fx, fy;
      ctx.fillStyle = 'rgba(74,90,106,' + a4(0.5 * upness) + ')';
      for (k = 0; k < 12; k++) {
        fx = g.cx - g.iw / 2 + (k + 0.5) / 12 * g.iw;
        fy = cy + g.ih * 0.42 + Math.sin(k * 2.3 + ct) * 0.004 * h;
        ctx.fillRect(fx - 6, fy, 12, 2);
      }
    }

    var topY = cy - g.ih * 0.5;
    var poleTop = topY - 0.13 * h;
    ctx.fillStyle = FOAM;
    ctx.fillRect(g.cx - 1, poleTop, 2, topY - poleTop);

    var fa = flagAlpha(ct);
    if (fa > 0) {
      var wave = Math.sin(2 * Math.PI * ct / 3) * 0.006 * h;
      ctx.globalAlpha = a4(fa);
      ctx.beginPath();
      ctx.moveTo(g.cx, poleTop);
      ctx.lineTo(g.cx + 0.11 * w, poleTop + 0.02 * h + wave);
      ctx.lineTo(g.cx, poleTop + 0.05 * h);
      ctx.closePath();
      ctx.fillStyle = FLAGS[ph.cycle];
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function onDown(x, y) {
    var effStart = effT(nowT);
    var g = geom(lastW, lastH);
    var dx = (x - g.cx) / (g.iw * 0.65);
    var dy = (y - g.centerUpY) / (g.ih * 0.75);
    var onIs = (dx * dx + dy * dy) <= 1;
    activeSeg = { tDown: nowT, tUp: null, x0: x, y0: y, x1: x, y1: y, onIsland: onIs };
    segments.push(activeSeg);
  }
  function onMove(x, y) {
    if (activeSeg) { activeSeg.x1 = x; activeSeg.y1 = y; }
  }
  function onUp(x, y) {
    if (activeSeg) {
      activeSeg.x1 = x; activeSeg.y1 = y;
      activeSeg.tUp = nowT;
      activeSeg = null;
    }
  }

  if (canvas && canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX || 0, e.clientY || 0); });
    canvas.addEventListener('pointermove', function (e) { onMove(e.clientX || 0, e.clientY || 0); });
    canvas.addEventListener('pointerup', function (e) { onUp(e.clientX || 0, e.clientY || 0); });
    canvas.addEventListener('pointercancel', function (e) { onUp(e.clientX || 0, e.clientY || 0); });
  }
  if (typeof window !== 'undefined') {
    var resizeFn = function () { draw(nowT); };
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resizeFn);
    }
    if (window.addEventListener) { window.addEventListener('resize', resizeFn); }
    window.__piece = {
      drawAt: function (t) { draw(t); },
      stateAt: function (t) {
        var eff = effT(t);
        var ph = phaseAt(eff);
        var g = geom(lastW, lastH);
        return {
          eff: eff, st: ph.st, cycle: ph.cycle, ct: ph.ct, phase: ph.phase,
          flag: FLAGS[ph.cycle], flagAlpha: flagAlpha(ph.ct),
          offset: islandOffset(ph.ct, g, lastH)
        };
      },
      pointerDown: function (x, y, t) { nowT = t; onDown(x, y); },
      pointerMove: function (x, y, t) { nowT = t; onMove(x, y); },
      pointerUp: function (x, y, t) { nowT = t; onUp(x, y); },
      reset: function () { segments.length = 0; activeSeg = null; }
    };
  }

  draw(0);
  var startT = null;
  function loop(ts) {
    if (startT === null) { startT = ts; }
    draw((ts - startT) / 1000);
    if (typeof requestAnimationFrame === 'function') { requestAnimationFrame(loop); }
  }
  if (typeof requestAnimationFrame === 'function') { requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
