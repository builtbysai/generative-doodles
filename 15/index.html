<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№15 · Modules</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f2ecdc; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(60,54,44,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(242,236,220,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another modules</div>
<script>
'use strict';
// No15 Modules.
// A Bauhaus block composition on a coarse 6x6 module grid. Most
// modules are left empty: the target is about 70 percent negative
// space, so the composition breathes. Each filled module holds
// exactly one primitive (quarter disc, semicircle, bar, or full
// disc), flat in red, yellow, blue or black on cream, rotated by
// seeded quarter turns. Placement, primitive, color and rotation all
// come from one seeded stream; occupancy is gated to the empty band.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '15', 10) || 15;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f2ecdc';
const COLORS = ['#b3402a', '#d9a821', '#2b4d9b', '#1d1a14'];
const GRID = 6;

function compose(s) {
  const rnd = mulberry32(s);
  const mods = [];
  let filled = 0;
  for (let j = 0; j < GRID; j++) {
    for (let i = 0; i < GRID; i++) {
      if (rnd() < 0.30) {
        filled++;
        mods.push({ i, j, prim: (rnd() * 4) | 0, ci: (rnd() * 4) | 0, rot: (rnd() * 4) | 0 });
      }
    }
  }
  const occ = filled / (GRID * GRID);
  const bottomHalf = mods.filter(modd => modd.j >= GRID / 2).length;
  return { mods, occ, ok: occ > 0.16 && occ < 0.42 && bottomHalf >= 3 };
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 24; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best || Math.abs(p.occ - 0.29) < Math.abs(best.occ - 0.29)) best = p;
    if (p.ok) return p;
  }
  return best;
}

let piece = null;

function drawPrim(x, y, m, rot) {
  ctx.save();
  ctx.translate(x + m / 2, y + m / 2);
  ctx.rotate(rot * Math.PI / 2);
  ctx.translate(-m / 2, -m / 2);
  return m;
}

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  // Centered composition; page ground is the piece's ground.
  const S = Math.min(w, h) * 0.88;
  const ox = (w - S) / 2, oy = (h - S) / 2;
  const m = S / GRID;

  for (const mod of p.mods) {
    const x = ox + mod.i * m, y = oy + mod.j * m;
    ctx.fillStyle = COLORS[mod.ci];
    ctx.save();
    ctx.translate(x + m / 2, y + m / 2);
    ctx.rotate(mod.rot * Math.PI / 2);
    ctx.beginPath();
    if (mod.prim === 0) {            // quarter disc: corner arc
      ctx.moveTo(-m / 2, -m / 2);
      ctx.arc(-m / 2, -m / 2, m, 0, Math.PI / 2);
      ctx.closePath();
    } else if (mod.prim === 1) {     // semicircle on the top edge
      ctx.arc(0, -m / 2, m / 2, 0, Math.PI);
      ctx.closePath();
    } else if (mod.prim === 2) {     // vertical bar, left third
      ctx.rect(-m / 2, -m / 2, m / 3, m);
    } else {                          // full disc inscribed
      ctx.arc(0, 0, m / 2, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.restore();
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
