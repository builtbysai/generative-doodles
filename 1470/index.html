<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Cutting Room</title>
<style>
html,body{margin:0;padding:0;background:#f2ead8;overflow:hidden;height:100%}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
// Palette only: desk wood, book ivory, dress black, skin ivory, TV blue-grey,
// news scarlet, gold, teal. No other colour anywhere.
var WOOD = '#6b4a2f', IVORY = '#f2ead8', BLACK = '#1c1c22',
    TV = '#7a8a94', SCARLET = '#c1272d', GOLD = '#d9a441', TEAL = '#2e6f6a',
    WHITE = '#ffffff';
var W = 0, H = 0, tNow = 0, booted = false;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rnd(seed){var r = mulberry32(seed); return r();}
function size(){
  var w, h;
  if (typeof visualViewport !== 'undefined' && visualViewport) { w = visualViewport.width; h = visualViewport.height; }
  else { w = window.innerWidth; h = window.innerHeight; }
  W = w; H = h;
  canvas.width = Math.round(w); canvas.height = Math.round(h);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
}
function isPhone(){
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    return Math.min(window.screen.width, window.screen.height) < 700;
  }
  return H > W * 1.15;
}
// Page-turn timeline: auto turn every 6 s; drag inserts an early turn.
var TURN_EVERY = 6, TURN_LEN = 0.9;
var extraTurns = []; // sorted times of drag-triggered turns
function turnStartsUpTo(t){
  var starts = [];
  for (var k = 0; k * TURN_EVERY <= t + 0.0001; k++) starts.push(k * TURN_EVERY);
  for (var i = 0; i < extraTurns.length; i++) if (extraTurns[i] <= t + 0.0001) starts.push(extraTurns[i]);
  starts.sort(function(a,b){return a-b;});
  return starts;
}
function turnState(t){
  // returns {turnIndex, phase} where phase 0..1 during the turn animation, else -1
  var starts = turnStartsUpTo(t);
  if (!starts.length) return {idx: 0, phase: -1};
  var last = starts[starts.length - 1];
  var idx = starts.length - 1; // real turns so far (the t=0 entry is not a turn)
  var age = t - last;
  if (last === 0) return {idx: 0, phase: -1}; // no turn at t=0
  if (age < TURN_LEN) return {idx: idx, phase: age / TURN_LEN};
  return {idx: idx, phase: -1};
}
function flashOn(t){
  var starts = turnStartsUpTo(t);
  if (!starts.length) return false;
  var last = starts[starts.length - 1];
  if (last === 0) return false;
  return (t - last) < 0.08;
}
function sceneShift(scene){
  // slight image shift per scene, seeded
  var r1 = rnd(1470000 + scene * 7919);
  var r2 = rnd(1470000 + scene * 7919 + 13);
  return {dx: (r1 - 0.5) * 10, dy: (r2 - 0.5) * 8};
}
function rect(x, y, w, h, col){ ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function disc(x, y, r, col){
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
function drawTVScene(tx, ty, tw, th, scene, t){
  var sh = sceneShift(scene);
  var sx = tx + sh.dx, sy = ty + sh.dy;
  rect(tx, ty, tw, th, TV);
  ctx.save();
  ctx.beginPath(); ctx.rect(tx, ty, tw, th); ctx.clip();
  if (scene % 4 === 0) {
    // marching blocks: rows of small rects marching right
    var cols = [SCARLET, GOLD, TEAL];
    for (var r = 0; r < 3; r++) {
      for (var i = 0; i < 5; i++) {
        var bx = sx + 6 + i * (tw / 5) + ((t * 12 + r * 7) % (tw / 5));
        if (bx > tx + tw - 14) bx -= tw / 5;
        rect(bx, sy + 8 + r * (th / 3.4), tw / 7, th / 5, cols[(r + i) % 3]);
      }
    }
  } else if (scene % 4 === 1) {
    // flashing border
    var on = Math.floor(t * 2) % 2 === 0;
    var bc = on ? SCARLET : GOLD;
    rect(sx + 3, sy + 3, tw - 6, 4, bc);
    rect(sx + 3, sy + th - 7, tw - 6, 4, bc);
    rect(sx + 3, sy + 3, 4, th - 6, bc);
    rect(sx + tw - 7, sy + 3, 4, th - 6, bc);
    rect(sx + tw * 0.2, sy + th * 0.4, tw * 0.6, th * 0.2, TEAL);
  } else if (scene % 4 === 2) {
    // map with arrows
    rect(sx + 6, sy + 6, tw - 12, th - 12, TEAL);
    ctx.fillStyle = GOLD;
    ctx.beginPath();
    ctx.moveTo(sx + tw * 0.15, sy + th * 0.6);
    ctx.lineTo(sx + tw * 0.55, sy + th * 0.3);
    ctx.lineTo(sx + tw * 0.55, sy + th * 0.45);
    ctx.lineTo(sx + tw * 0.85, sy + th * 0.45);
    ctx.lineTo(sx + tw * 0.85, sy + th * 0.6);
    ctx.lineTo(sx + tw * 0.55, sy + th * 0.6);
    ctx.lineTo(sx + tw * 0.55, sy + th * 0.75);
    ctx.closePath(); ctx.fill();
    rect(sx + tw * 0.1, sy + th * 0.7, tw * 0.25, th * 0.12, SCARLET);
  } else {
    // borders + blocks mix
    rect(sx + 4, sy + 4, tw - 8, 3, GOLD);
    rect(sx + 4, sy + th - 7, tw - 8, 3, GOLD);
    for (var j = 0; j < 4; j++) {
      rect(sx + 8 + j * (tw / 4.5), sy + th * 0.3 + (j % 2) * th * 0.25, tw / 6, th / 4, j % 2 ? SCARLET : TEAL);
    }
  }
  ctx.restore();
}
function draw(t){
  tNow = t;
  if (!W) size();
  var s = Math.min(W, H);
  var ox = W / 2, oy = H / 2;
  // Wall: book ivory ground.
  rect(0, 0, W, H, IVORY);
  // Desk: horizontal wood band.
  var deskY = oy + 0.16 * s;
  rect(0, deskY, W, H - deskY, WOOD);
  rect(0, deskY, W, 3, BLACK);
  var ts = turnState(t);
  var scene = ts.idx % 4;
  // Reader: centered, large. Head bobs slightly; hand turns pages.
  var headY = oy - 0.30 * s + Math.sin(t * Math.PI * 2 / 4) * 0.008 * s;
  var headR = 0.085 * s;
  // Dress: trapezoid from shoulders to desk.
  ctx.fillStyle = BLACK;
  ctx.beginPath();
  ctx.moveTo(ox - 0.13 * s, oy - 0.20 * s);
  ctx.lineTo(ox + 0.13 * s, oy - 0.20 * s);
  ctx.lineTo(ox + 0.17 * s, deskY);
  ctx.lineTo(ox - 0.17 * s, deskY);
  ctx.closePath(); ctx.fill();
  // Arms down to the book.
  rect(ox - 0.16 * s, oy - 0.18 * s, 0.035 * s, 0.30 * s, BLACK);
  rect(ox + 0.125 * s, oy - 0.18 * s, 0.035 * s, 0.30 * s, BLACK);
  disc(ox - 0.142 * s, oy + 0.14 * s, 0.022 * s, IVORY);
  // Hand on the turning page: lifts during the turn.
  var handY = oy + 0.14 * s;
  if (ts.phase >= 0) handY -= Math.sin(ts.phase * Math.PI) * 0.05 * s;
  disc(ox + 0.16 * s, handY, 0.024 * s, IVORY);
  // Head: skin disc with a thin black outline so the face reads against the
  // ivory wall (same palette, no new colour), black hair cap, dot eyes, mouth.
  disc(ox, headY, headR, IVORY);
  ctx.strokeStyle = BLACK; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(ox + headR, headY); ctx.arc(ox, headY, headR, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = BLACK;
  ctx.beginPath();
  ctx.moveTo(ox - headR, headY);
  ctx.arc(ox, headY, headR, Math.PI, 0);
  ctx.closePath(); ctx.fill();
  disc(ox - 0.032 * s, headY + 0.018 * s, 0.008 * s, BLACK);
  disc(ox + 0.032 * s, headY + 0.018 * s, 0.008 * s, BLACK);
  rect(ox - 0.025 * s, headY + 0.045 * s, 0.05 * s, 0.006 * s, BLACK);
  // Open book on the desk, in front of her.
  var bookW = 0.46 * s, bookH = 0.15 * s;
  var bookX = ox - bookW / 2, bookY = deskY + 0.02 * s;
  rect(bookX - 2, bookY - 2, bookW + 4, bookH + 4, BLACK);
  rect(bookX, bookY, bookW / 2, bookH, IVORY);
  rect(bookX + bookW / 2, bookY, bookW / 2, bookH, IVORY);
  rect(bookX + bookW / 2 - 1, bookY, 2, bookH, BLACK);
  // Turning page: right page narrows and lifts during the turn.
  if (ts.phase >= 0) {
    var p = ts.phase;
    var pw = (bookW / 2) * Math.abs(Math.cos(p * Math.PI));
    var lift = Math.sin(p * Math.PI) * 0.05 * s;
    rect(bookX + bookW / 2, bookY - lift, Math.max(pw, 2), bookH, IVORY);
    rect(bookX + bookW / 2, bookY - lift, Math.max(pw, 2), 2, BLACK);
  }
  // TV: small at lower right, angled slightly toward the viewer.
  var tvW = 0.24 * s, tvH = 0.17 * s;
  var tvX = ox + 0.30 * s, tvY = deskY + 0.05 * s;
  if (tvX + tvW > W - 6) tvX = W - tvW - 6;
  ctx.save();
  ctx.translate(tvX + tvW / 2, tvY + tvH / 2);
  ctx.rotate(-0.06);
  ctx.translate(-tvW / 2, -tvH / 2);
  rect(-4, -4, tvW + 8, tvH + 8, BLACK);
  drawTVScene(0, 0, tvW, tvH, scene, t);
  if (flashOn(t)) rect(0, 0, tvW, tvH, WHITE);
  ctx.restore();
}
function loop(ts){
  var t = ts / 1000;
  draw(t);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
function dragPageAt(t){
  // Drag on the page edge: trigger an early turn now (if not mid-turn).
  var st = turnState(t);
  if (st.phase >= 0) return;
  extraTurns.push(t);
  extraTurns.sort(function(a,b){return a-b;});
}
if (typeof window !== 'undefined') {
  window.__piece = {
    draw: draw,
    dragPageAt: dragPageAt,
    getScene: function(){ return turnState(tNow).idx % 4; },
    getTurnCount: function(){ return turnStartsUpTo(tNow).length - 1; },
    flashOn: flashOn,
    turnState: turnState
  };
  canvas.addEventListener('pointerdown', function(e){
    var r = canvas.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    var s = Math.min(W, H), ox = W / 2, oy = H / 2;
    var deskY = oy + 0.16 * s;
    var bookX = ox - 0.23 * s, bookY = deskY + 0.02 * s;
    // Page edge zone: right half of the open book.
    if (x >= bookX + 0.23 * s && x <= bookX + 0.46 * s && y >= bookY - 0.05 * s && y <= bookY + 0.20 * s) {
      dragPageAt(tNow);
    }
  });
  window.addEventListener('resize', size);
  if (typeof visualViewport !== 'undefined' && visualViewport) visualViewport.addEventListener('resize', size);
}
size();
draw(0);
booted = true;
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
