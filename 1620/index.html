<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birb Study 47</title>
<style>
html, body { margin: 0; padding: 0; background: #F7F5EF; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#F7F5EF';
var INK = '#1C1C1E';
var HEART = '#D43A2E';
var PHASE = 1.0;
var FADE_S = 1.0;
var SEED = 1620007;
var COLS = 6, ROWS = 5, N = COLS * ROWS;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
var INK_RGB = hexRgb(INK);
var HEART_RGB = hexRgb(HEART);
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Centered square sheet; on phones the sheet is the full viewport. */
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH) * 0.86;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* Birb field: the sheet, minus the title strip at top and hint strip at
   bottom on phones where the sheet is full-bleed. On desktop the title and
   hint sit outside the sheet, so the field is the whole sheet. */
function fieldRect(rect) {
  if (isPhone) {
    var top = 66, bot = 40;
    return { x: rect.x, y: rect.y + top, w: rect.w, h: rect.h - top - bot };
  }
  return rect;
}
var compRectCache = { x: 0, y: 0, w: 0, h: 0 };

/* ---- parametric birb: pure function of clutch index n ---- */
function clutchSeed(n) { return (SEED + n * 7919) >>> 0; }
function genClutch(n) {
  var rng = mulberry32(clutchSeed(n));
  var birbs = [], i, col, row;
  for (i = 0; i < N; i++) {
    col = i % COLS; row = Math.floor(i / COLS);
    birbs.push({
      col: col, row: row,
      jx: (rng() - 0.5) * 0.56, jy: (rng() - 0.5) * 0.56,
      scale: 1 + rng() * 1.5,
      dir: rng() < 0.5 ? 1 : -1,
      beakTilt: (rng() - 0.5) * 1.1,
      eyeGap: 0.10 + rng() * 0.20,
      eyeDrop: 0.05 + rng() * 0.22,
      tailLen: 0.30 + rng() * 0.55,
      tailFan: 0.25 + rng() * 0.45,
      wingA: rng() * TAU,
      lw: 1.1 + rng() * 1.1,
      alpha: 0.72 + rng() * 0.28,
      w1: rng() * TAU, w2: rng() * TAU, w3: rng() * TAU,
      bobAmp: 1.2 + rng() * 2.2,
      bobPeriod: 2.2 + rng() * 2.4,
      bobPhase: rng() * TAU,
      legSplay: (rng() - 0.5) * 0.5
    });
  }
  /* Heart birb: seeded, never a centre cell (cols 2-3, row 2). */
  var heart = -1, guard = 0;
  while (guard++ < 40) {
    heart = Math.floor(rng() * N);
    var hc = heart % COLS, hr = Math.floor(heart / COLS);
    if (!(hr === 2 && (hc === 2 || hc === 3))) break;
  }
  var specks = [], s;
  for (s = 0; s < 10; s++) {
    specks.push({ fx: rng(), fy: rng(), r: 0.6 + rng() * 1.4, a: 0.25 + rng() * 0.35 });
  }
  return { birbs: birbs, heart: heart, heartRot: (rng() - 0.5) * 0.5, specks: specks };
}
var clutchN = 0;
var clutch = genClutch(0);
var prevClutch = null;
var fadeStart = -1e9;

function birbGeom(b, f) {
  var cw = f.w / COLS, ch = f.h / ROWS;
  var cx = f.x + (b.col + 0.5) * cw + b.jx * cw;
  var cy = f.y + (b.row + 0.5) * ch + b.jy * ch;
  var r = Math.min(cw, ch) * 0.17 * b.scale;
  return { cx: cx, cy: cy, r: r };
}
function wobPt(g, ang, b, k) {
  var rr = g.r * (1 + 0.055 * Math.sin(3 * ang + b.w1) + 0.035 * Math.sin(5 * ang + b.w2) + 0.02 * Math.sin(9 * ang + b.w3));
  return { x: g.cx + rr * Math.cos(ang), y: g.cy + rr * Math.sin(ang) * 0.96 };
}
function strokeLine(x0, y0, x1, y1) {
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();
}
function drawBirb(b, f, t, alphaMul) {
  var g = birbGeom(b, f);
  var bob = reduced ? 0 : b.bobAmp * Math.sin(TAU * t / b.bobPeriod + b.bobPhase);
  var cx = g.cx, cy = g.cy + bob, r = g.r;
  var gg = { cx: cx, cy: cy, r: r };
  ctx.strokeStyle = rgba(INK_RGB, b.alpha * alphaMul);
  ctx.fillStyle = rgba(INK_RGB, b.alpha * alphaMul);
  ctx.lineWidth = Math.max(0.9, b.lw * r * 0.055);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  /* Body: wobbled closed stroke, drawn twice for a sketchy double pass. */
  var SEG = 26, k, p;
  ctx.beginPath();
  for (k = 0; k <= SEG; k++) {
    p = wobPt(gg, (k / SEG) * TAU, b, k);
    if (k === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  ctx.save();
  var ga = ctx.globalAlpha;
  ctx.globalAlpha = ga * 0.45;
  ctx.beginPath();
  var a0 = b.w3, a1 = b.w3 + 4.6;
  for (k = 0; k <= 18; k++) {
    var ang = a0 + (k / 18) * (a1 - a0);
    p = wobPt(gg, ang, b, k);
    var rr2 = r * 1.03;
    var px = cx + rr2 * Math.cos(ang) * 1.0, py = cy + rr2 * Math.sin(ang) * 0.96;
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.restore();
  /* Beak: two short lines, tilted, pointing along dir. */
  var ba = b.dir > 0 ? b.beakTilt : Math.PI - b.beakTilt;
  var bx = cx + Math.cos(ba) * r * 0.92, by = cy + Math.sin(ba) * r * 0.92;
  var bl = r * 0.38;
  var tipX = bx + Math.cos(ba) * bl, tipY = by + Math.sin(ba) * bl;
  var perp = ba + Math.PI / 2;
  strokeLine(bx + Math.cos(perp) * r * 0.10, by + Math.sin(perp) * r * 0.10, tipX, tipY);
  strokeLine(bx - Math.cos(perp) * r * 0.10, by - Math.sin(perp) * r * 0.10, tipX, tipY);
  /* Eyes: two dots, spacing and drop seeded. */
  var ex = cx + b.dir * r * 0.28, ey = cy - r * (0.28 + b.eyeDrop * 0.4);
  var gap = b.eyeGap * r;
  ctx.beginPath(); ctx.moveTo(ex - gap + r * 0.055, ey); ctx.arc(ex - gap, ey, r * 0.055, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ex + gap + r * 0.055, ey); ctx.arc(ex + gap, ey, r * 0.055, 0, TAU); ctx.fill();
  /* Tail: two or three flicks at the back. */
  var ta = b.dir > 0 ? Math.PI : 0;
  var tx = cx + Math.cos(ta) * r * 0.92, ty = cy + Math.sin(ta) * r * 0.92;
  var tl = r * b.tailLen;
  strokeLine(tx, ty, tx + Math.cos(ta - b.tailFan) * tl, ty + Math.sin(ta - b.tailFan) * tl);
  strokeLine(tx, ty, tx + Math.cos(ta) * tl * 1.15, ty + Math.sin(ta) * tl * 1.15);
  strokeLine(tx, ty, tx + Math.cos(ta + b.tailFan) * tl, ty + Math.sin(ta + b.tailFan) * tl);
  /* Wing tick: a short arc on the body flank. */
  ctx.beginPath();
  ctx.moveTo(cx - b.dir * r * 0.15 + Math.cos(b.wingA) * r * 0.55, cy + Math.sin(b.wingA) * r * 0.55);
  ctx.arc(cx - b.dir * r * 0.15, cy, r * 0.55, b.wingA, b.wingA + 1.1);
  ctx.stroke();
  /* Legs: two short splayed lines under the body. */
  var lx = cx - r * 0.18, rx = cx + r * 0.18, ly = cy + r * 0.94;
  strokeLine(lx, ly, lx + b.legSplay * r * 0.4, ly + r * 0.28);
  strokeLine(rx, ly, rx - b.legSplay * r * 0.4, ly + r * 0.28);
  return gg;
}
function drawHeart(x, y, s, rot, alphaMul) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = rgba(HEART_RGB, 0.95 * alphaMul);
  ctx.beginPath();
  ctx.moveTo(0, s * 0.85);
  ctx.bezierCurveTo(-s * 1.15, -s * 0.05, -s * 0.62, -s * 0.95, 0, -s * 0.28);
  ctx.bezierCurveTo(s * 0.62, -s * 0.95, s * 1.15, -s * 0.05, 0, s * 0.85);
  ctx.fill();
  ctx.restore();
}
function drawClutch(c, f, t, alphaMul) {
  var i, b;
  ctx.save();
  for (i = 0; i < c.specks.length; i++) {
    var sp = c.specks[i];
    ctx.fillStyle = rgba(INK_RGB, sp.a * alphaMul);
    ctx.beginPath();
    ctx.moveTo(f.x + sp.fx * f.w + sp.r, f.y + sp.fy * f.h);
    ctx.arc(f.x + sp.fx * f.w, f.y + sp.fy * f.h, sp.r, 0, TAU);
    ctx.fill();
  }
  for (i = 0; i < c.birbs.length; i++) {
    b = c.birbs[i];
    var g = drawBirb(b, f, t, alphaMul);
    if (i === c.heart) {
      drawHeart(g.cx + g.r * 0.55, g.cy - g.r * 1.25, g.r * 0.42, c.heartRot, alphaMul);
    }
  }
  ctx.restore();
}
function onTap() {
  prevClutch = clutch;
  clutchN += 1;
  clutch = genClutch(clutchN);
  fadeStart = lastT;
  draw(lastT);
}
function draw(t) {
  lastT = t;
  size();
  var rect = compRect();
  compRectCache = rect;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  var titlePx = isPhone ? 16 : 18;
  var smallPx = isPhone ? 11 : 12;
  var f = fieldRect(rect);
  var titleY, dateY, hintY;
  if (isPhone) {
    titleY = 16;
    dateY = 16 + titlePx + 5;
    hintY = VH - smallPx - 12;
  } else {
    titleY = rect.y - titlePx - smallPx - 10;
    dateY = rect.y - smallPx - 6;
    hintY = rect.y + rect.h + 12;
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = INK;
  ctx.fillText('Birb Study 47', rect.x + rect.w / 2, titleY);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK_RGB, 0.65);
  ctx.fillText('2006 · 06 · 19', rect.x + rect.w / 2, dateY);
  /* Birbs, clipped to the field so edge birds are cropped by the frame. */
  ctx.save();
  ctx.beginPath();
  ctx.rect(f.x, f.y, f.w, f.h);
  ctx.clip();
  var p = clamp((t - fadeStart) / FADE_S, 0, 1);
  var sp = smooth(p);
  if (prevClutch !== null && p < 1) {
    drawClutch(prevClutch, f, t, 1 - sp);
  }
  drawClutch(clutch, f, t, sp);
  ctx.restore();
  ctx.textAlign = 'center';
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK_RGB, 0.7);
  ctx.fillText('Tap to hatch a new clutch.', rect.x + rect.w / 2, hintY);
}
if (typeof canvas.addEventListener === 'function') canvas.addEventListener('pointerdown', onTap);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
