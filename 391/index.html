<!DOCTYPE html>
<html lang="en">
<head>

<title>No.391 What Does This Bean Become?</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F7F2E9; }
  canvas { display:block; }

</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.391 What Does This Bean Become? (maryna-lagereva).
// Her interactive constraint game: one ink bean on
// watercolor paper refuses to stay a bean. TAP
// morphs it one stage (bean -> creature -> scene)
// over 1.2s, the eight control points interpolating
// easeInOut on fixed ticks while the watercolor fill
// blooms in behind the ink as stepped flat alpha and
// the stage accessories fade through. After stage 3
// the next tap grows the next transformation's bean;
// DOUBLE-TAP skips straight to a fresh bean. The six
// transformations are a fixed authored table, never
// runtime random. The only text is the designed
// stage caption beneath the blob (the batch's text
// exception), drawn on this ONE canvas in a serif
// face. No offscreen canvas, no gradients, no
// filters, no shadowBlur. All colour is flat and
// closed at paper, ink and the four watercolor fills.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#F7F2E9', INK = '#3A2E2A';
var PUMPKIN = '#D97B29', PLUM = '#7A3B5C', SAGE = '#8A9B6E', BORSCHT = '#A63A4A';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var TICK = 1 / 60;
var MORPH_LEN = 1.2;
var CX = 640, CY = 400; // blob centre; bean spans ~330px tall
var CAP_Y = 716;        // caption baseline row

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every jitter is
// baked from this at load and never changes between
// frames or renders.
var seed = 391;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// ---- the blob ------------------------------------------
// Eight control points at fixed angles (-90 top, then
// clockwise every 45 degrees). Each stage of each
// transformation is one radius set; the bean of each
// transformation is the base bean with a baked jitter.
var ANG = [];
(function () { for (var i = 0; i < 8; i++) ANG.push(-90 + 45 * i); })();
var BEAN_R = [160, 205, 175, 195, 172, 203, 222, 195];
var STAGE_R = [
  // T1 acorn -> Napoleon (pumpkin)
  [[148, 168, 174, 178, 196, 178, 174, 168],
   [142, 158, 164, 170, 184, 170, 164, 158]],
  // T2 rabbit -> borscht bowl (borscht red)
  [[168, 188, 182, 176, 158, 176, 188, 182],
   [118, 196, 224, 196, 138, 196, 224, 196]],
  // T3 egg -> chick (plum)
  [[188, 164, 150, 164, 176, 164, 150, 164],
   [158, 176, 182, 176, 164, 176, 182, 176]],
  // T4 mushroom -> cottage (pumpkin)
  [[128, 208, 218, 178, 148, 178, 218, 208],
   [134, 202, 212, 184, 158, 184, 212, 202]],
  // T5 snail -> flower garden (sage)
  [[168, 186, 186, 176, 158, 176, 186, 182],
   [170, 188, 188, 178, 160, 178, 188, 184]],
  // T6 cloud -> rain and umbrella (plum)
  [[118, 188, 208, 168, 104, 168, 208, 188],
   [118, 188, 208, 168, 104, 168, 208, 188]]
];
var TRANS = [
  { fill: PUMPKIN },
  { fill: BORSCHT },
  { fill: PLUM },
  { fill: PUMPKIN },
  { fill: SAGE },
  { fill: PLUM }
];
if (TRANS.length !== 6) throw new Error('bean game needs exactly 6 transformations');
var CAPTIONS = [
  ['stage 1: just a bean', 'stage 2: the acorn dreams', 'stage 3: Napoleon, obviously'],
  ['stage 1: still just a bean', 'stage 2: a rabbit, ears first', 'stage 3: swimming in the borscht'],
  ['stage 1: a bean, holding its breath', 'stage 2: an egg, mostly', 'stage 3: the chick has opinions'],
  ['stage 1: a bean, underground', 'stage 2: a mushroom moves in', 'stage 3: home, with a door'],
  ['stage 1: a bean, in no hurry', 'stage 2: a snail, house included', 'stage 3: the garden comes along'],
  ['stage 1: a bean, looking up', 'stage 2: a cloud, passing through', 'stage 3: rain, met prepared']
];
(function () {
  var n = 0, i;
  for (i = 0; i < CAPTIONS.length; i++) n += CAPTIONS[i].length;
  if (n !== 18) throw new Error('bean game needs exactly 18 captions');
})();

function ptsFromRadii(radii) {
  var pts = [], i, a;
  for (i = 0; i < 8; i++) {
    a = ANG[i] * Math.PI / 180;
    pts.push({ x: CX + Math.cos(a) * radii[i], y: CY + Math.sin(a) * radii[i] });
  }
  return pts;
}
// STAGE_PTS[ti][stage 0..2] as absolute point sets.
var STAGE_PTS = [];
(function () {
  var ti, i, radii;
  for (ti = 0; ti < 6; ti++) {
    radii = [];
    for (i = 0; i < 8; i++) radii.push(BEAN_R[i] * (0.95 + rnd() * 0.1));
    STAGE_PTS.push([ptsFromRadii(radii), ptsFromRadii(STAGE_R[ti][0]), ptsFromRadii(STAGE_R[ti][1])]);
  }
})();

function blobPath(pts) {
  var i, mx, my, nx, ny;
  mx = (pts[7].x + pts[0].x) / 2; my = (pts[7].y + pts[0].y) / 2;
  ctx.beginPath();
  ctx.moveTo(mx, my);
  for (i = 0; i < 8; i++) {
    nx = (pts[i].x + pts[(i + 1) % 8].x) / 2;
    ny = (pts[i].y + pts[(i + 1) % 8].y) / 2;
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, nx, ny);
  }
  ctx.closePath();
}
// Point on the (unsmoothed) anchor polygon at a
// design angle in degrees, scaled about the centre.
function pointAt(pts, deg, scale) {
  var d = ((deg % 360) + 360) % 360; // 0 = east, clockwise
  var pos = (d - 270 + 360) % 360;   // anchors start at 270 (top)
  var i = Math.floor(pos / 45) % 8;
  var f = (pos - Math.floor(pos / 45) * 45) / 45;
  var a = pts[i], b = pts[(i + 1) % 8];
  var x = a.x + (b.x - a.x) * f, y = a.y + (b.y - a.y) * f;
  return { x: CX + (x - CX) * scale, y: CY + (y - CY) * scale };
}

// ---- accessories ---------------------------------------
// Ink line drawings per stage (stage index 1 and 2
// only; the bean wears nothing). Each takes the
// current display points and a visibility 0..1: they
// fade and gently scale in as their stage arrives.
function ink(a) { ctx.strokeStyle = INK; ctx.globalAlpha = a; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function fillInk(a) { ctx.fillStyle = INK; ctx.globalAlpha = a; }
function topY(pts) { return pointAt(pts, 270, 1).y; }

function accAcorn(pts, a, col) {
  var i, p;
  ctx.beginPath();
  for (i = 0; i <= 18; i++) { p = pointAt(pts, 180 + i * 10, 1.03); if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }
  for (i = 18; i >= 0; i--) { p = pointAt(pts, 180 + i * 10, 0.84); ctx.lineTo(p.x, p.y); }
  ctx.closePath();
  ctx.fillStyle = col; ctx.globalAlpha = 0.85 * a; ctx.fill();
  ink(a); ctx.lineWidth = 5; ctx.stroke();
  // stem twig
  var t = pointAt(pts, 270, 1.02);
  ink(a); ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.quadraticCurveTo(t.x + 4, t.y - 14, t.x + 12, t.y - 22); ctx.stroke();
  // bottom tip
  var b = pointAt(pts, 90, 1.02), l = pointAt(pts, 76, 0.94), r = pointAt(pts, 104, 0.94);
  fillInk(a);
  ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(b.x, b.y + 10); ctx.lineTo(r.x, r.y); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
}
function accNapoleon(pts, a, col) {
  accAcorn(pts, a, col);
  var ty = topY(pts);
  // tricorn: crown and wide crescent brim, ink filled
  fillInk(a);
  ctx.beginPath();
  ctx.moveTo(CX - 60, ty - 12);
  ctx.quadraticCurveTo(CX, ty - 66, CX + 60, ty - 12);
  ctx.quadraticCurveTo(CX, ty + 2, CX - 60, ty - 12);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(CX - 132, ty + 30);
  ctx.quadraticCurveTo(CX, ty - 44, CX + 132, ty + 30);
  ctx.quadraticCurveTo(CX, ty + 8, CX - 132, ty + 30);
  ctx.closePath(); ctx.fill();
  // epaulettes: three-stroke fans at the shoulders
  ink(a); ctx.lineWidth = 5;
  var s, sg;
  for (s = -1; s <= 1; s += 2) {
    var px = CX + s * 168, py = CY - 6;
    for (sg = -1; sg <= 1; sg++) {
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + s * (26 + Math.abs(sg) * 4), py + sg * 16 + 8);
      ctx.stroke();
    }
  }
  // sash: colour band with an ink centre line
  ctx.strokeStyle = col; ctx.globalAlpha = 0.8 * a; ctx.lineWidth = 13;
  ctx.beginPath(); ctx.moveTo(CX - 92, CY - 44); ctx.lineTo(CX + 78, CY + 96); ctx.stroke();
  ink(a); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(CX - 92, CY - 44); ctx.lineTo(CX + 78, CY + 96); ctx.stroke();
  // medal
  ink(a); ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(CX + 26, CY + 58, 10, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;
}
function leaf(x0, y0, x1, y1, bend, a) {
  ink(a); ctx.lineWidth = 4.5;
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.quadraticCurveTo(x0 + bend, (y0 + y1) / 2, x1, y1);
  ctx.quadraticCurveTo(x0 - bend, (y0 + y1) / 2, x0, y0);
  ctx.closePath();
  ctx.fillStyle = PAPER; ctx.globalAlpha = a; ctx.fill();
  ink(a); ctx.lineWidth = 4.5; ctx.stroke();
}
function accRabbit(pts, a, col) {
  var ty = topY(pts);
  leaf(CX - 50, ty + 18, CX - 80, ty - 116, 20, a);
  leaf(CX + 16, ty + 10, CX + 30, ty - 126, 18, a);
  fillInk(a);
  ctx.beginPath(); ctx.arc(CX - 34, CY - 28, 6.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(CX + 40, CY - 28, 6.5, 0, Math.PI * 2); ctx.fill();
  ink(a); ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(CX - 2, CY + 4, 7, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  ctx.beginPath(); ctx.arc(CX + 10, CY + 4, 7, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  var s, i;
  for (s = -1; s <= 1; s += 2) for (i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(CX + s * 52, CY + 2 + i * 4);
    ctx.lineTo(CX + s * 100, CY - 8 + i * 11);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function accBorscht(pts, a, col) {
  // soup rim across the top of the wide blob
  ctx.fillStyle = col; ctx.globalAlpha = 0.35 * a;
  ctx.beginPath(); ctx.ellipse(CX, CY - 56, 214, 30, 0, 0, Math.PI * 2); ctx.fill();
  ink(a); ctx.lineWidth = 5;
  ctx.beginPath(); ctx.ellipse(CX, CY - 56, 214, 30, 0, 0, Math.PI * 2); ctx.stroke();
  // ripples on the soup
  ink(a); ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(CX + 84, CY - 48); ctx.quadraticCurveTo(CX + 112, CY - 58, CX + 140, CY - 48); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX + 108, CY - 34); ctx.quadraticCurveTo(CX + 130, CY - 42, CX + 152, CY - 34); ctx.stroke();
  // the rabbit, head and ears above the rim
  leaf(CX - 96, CY - 148, CX - 118, CY - 226, 16, a);
  leaf(CX - 48, CY - 154, CX - 40, CY - 234, 15, a);
  ctx.fillStyle = PAPER; ctx.globalAlpha = a;
  ctx.beginPath(); ctx.arc(CX - 62, CY - 112, 47, 0, Math.PI * 2); ctx.fill();
  ink(a); ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(CX - 62, CY - 112, 47, 0, Math.PI * 2); ctx.stroke();
  fillInk(a);
  ctx.beginPath(); ctx.arc(CX - 76, CY - 118, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(CX - 48, CY - 118, 5.5, 0, Math.PI * 2); ctx.fill();
  ink(a); ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(CX - 65, CY - 98, 6, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  ctx.beginPath(); ctx.arc(CX - 55, CY - 98, 6, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  // spoon resting at the right rim
  ink(a); ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(CX + 148, CY - 66); ctx.lineTo(CX + 198, CY - 122); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(CX + 204, CY - 130, 17, 10, -0.7, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;
}
function accEgg(pts, a, col) {
  var x0 = pointAt(pts, 180, 0.97).x, x1 = pointAt(pts, 0, 0.97).x;
  ink(a); ctx.lineWidth = 5;
  ctx.beginPath();
  var n = 9, i, x, y;
  for (i = 0; i <= n; i++) {
    x = x0 + (x1 - x0) * i / n;
    y = CY - 4 + (i % 2 === 0 ? -13 : 13);
    if (i === 0) ctx.moveTo(x, CY - 4); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function accChick(pts, a, col) {
  var i, p;
  // bottom shell: jagged cup along the lower arc
  ctx.beginPath();
  for (i = 0; i <= 12; i++) { p = pointAt(pts, 28 + i * (124 / 12), 1.02); if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); }
  for (i = 12; i >= 0; i--) { p = pointAt(pts, 28 + i * (124 / 12), i % 2 === 0 ? 0.9 : 0.99); ctx.lineTo(p.x, p.y); }
  ctx.closePath();
  ctx.fillStyle = PAPER; ctx.globalAlpha = a; ctx.fill();
  ink(a); ctx.lineWidth = 5; ctx.stroke();
  // top shell fragment, tilted like a cap
  ctx.save();
  ctx.translate(CX + 4, CY - 208); ctx.rotate(-0.14);
  ctx.beginPath();
  ctx.arc(0, 26, 76, Math.PI * 1.08, Math.PI * 1.92);
  var j;
  for (j = 0; j <= 6; j++) {
    var an = Math.PI * (1.92 - j * (0.84 / 6));
    var rr = j % 2 === 0 ? 62 : 74;
    ctx.lineTo(Math.cos(an) * rr, 26 + Math.sin(an) * rr * 0.9 + 34);
  }
  ctx.closePath();
  ctx.fillStyle = PAPER; ctx.globalAlpha = a; ctx.fill();
  ink(a); ctx.lineWidth = 5; ctx.stroke();
  ctx.restore();
  // face and wing
  fillInk(a);
  ctx.beginPath(); ctx.arc(CX + 36, CY - 40, 6.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(CX + 54, CY - 26); ctx.lineTo(CX + 84, CY - 14); ctx.lineTo(CX + 52, CY - 2);
  ctx.closePath(); ctx.fill();
  ink(a); ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(CX - 92, CY - 8); ctx.quadraticCurveTo(CX - 116, CY + 30, CX - 62, CY + 60); ctx.stroke();
  ctx.globalAlpha = 1;
}
function accMushroom(pts, a, col) {
  // stem below the cap
  ctx.beginPath();
  ctx.moveTo(CX - 58, CY + 92);
  ctx.lineTo(CX - 46, CY + 206);
  ctx.quadraticCurveTo(CX, CY + 218, CX + 46, CY + 206);
  ctx.lineTo(CX + 58, CY + 92);
  ctx.closePath();
  ctx.fillStyle = PAPER; ctx.globalAlpha = a; ctx.fill();
  ink(a); ctx.lineWidth = 5; ctx.stroke();
  // gill arcs under the cap
  ink(a); ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(CX - 96, CY + 92); ctx.quadraticCurveTo(CX, CY + 116, CX + 96, CY + 92); ctx.stroke();
  // cap spots
  var spots = [[-88, -76, 20], [32, -102, 15], [106, -50, 17], [-14, -38, 11]];
  ctx.fillStyle = PAPER;
  for (var i = 0; i < spots.length; i++) {
    ctx.globalAlpha = 0.92 * a;
    ctx.beginPath(); ctx.arc(CX + spots[i][0], CY + spots[i][1], spots[i][2], 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function accCottage(pts, a, col) {
  // wider stem, door and a step of stones
  ctx.beginPath();
  ctx.moveTo(CX - 76, CY + 92);
  ctx.lineTo(CX - 64, CY + 214);
  ctx.quadraticCurveTo(CX, CY + 226, CX + 64, CY + 214);
  ctx.lineTo(CX + 76, CY + 92);
  ctx.closePath();
  ctx.fillStyle = PAPER; ctx.globalAlpha = a; ctx.fill();
  ink(a); ctx.lineWidth = 5; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(CX - 27, CY + 214); ctx.lineTo(CX - 27, CY + 148);
  ctx.quadraticCurveTo(CX, CY + 122, CX + 27, CY + 148); ctx.lineTo(CX + 27, CY + 214);
  ctx.closePath();
  ctx.fillStyle = col; ctx.globalAlpha = 0.55 * a; ctx.fill();
  ink(a); ctx.lineWidth = 4.5; ctx.stroke();
  fillInk(a);
  ctx.beginPath(); ctx.arc(CX + 14, CY + 182, 4, 0, Math.PI * 2); ctx.fill();
  // round window on the cap
  ctx.fillStyle = PAPER; ctx.globalAlpha = a;
  ctx.beginPath(); ctx.arc(CX + 98, CY - 60, 18, 0, Math.PI * 2); ctx.fill();
  ink(a); ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(CX + 98, CY - 60, 18, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX + 80, CY - 60); ctx.lineTo(CX + 116, CY - 60); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX + 98, CY - 78); ctx.lineTo(CX + 98, CY - 42); ctx.stroke();

  ctx.fillStyle = PAPER; ctx.globalAlpha = a;
  ctx.beginPath(); ctx.rect(CX - 128, CY - 148, 27, 48); ctx.fill();
  ink(a); ctx.lineWidth = 4.5; ctx.stroke();

  ctx.fillStyle = INK;
  var st = [[-40, 232, 15], [2, 238, 12], [42, 232, 14]];
  for (var i = 0; i < st.length; i++) {
    ctx.globalAlpha = 0.55 * a;
    ctx.beginPath(); ctx.ellipse(CX + st[i][0], CY + st[i][1], st[i][2], st[i][2] * 0.42, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function accSnail(pts, a, col) {
  // spiral on the shell
  ink(a); ctx.lineWidth = 4.5;
  ctx.beginPath();
  var t, r, px, py, cx0 = CX - 28, cy0 = CY - 4;
  for (t = 0; t <= 28; t++) {
    var ph = t / 28 * Math.PI * 4.6;
    r = 68 * (1 - (t / 28) * 0.8);

  ctx.fillStyle = PAPER; ctx.globalAlpha = a;

  ink(a); ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.arc(CX + 180, CY + 112, 21, 0, Math.PI * 2); ctx.stroke();
  ink(a); ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(CX + 172, CY + 94); ctx.lineTo(CX + 164, CY + 58); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX + 188, CY + 94); ctx.lineTo(CX + 192, CY + 56); ctx.stroke();
  fillInk(a);
  ctx.beginPath(); ctx.arc(CX + 163, CY + 55, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(CX + 193, CY + 53, 5, 0, Math.PI * 2); ctx.fill();

function accGarden(pts, a, col) {
  accSnail(pts, a, col);

  var fl = [[-96, -188], [-8, -216], [82, -182]];
  var i, fx, fy, k;
  for (i = 0; i < fl.length; i++) {
    fx = CX + fl[i][0]; fy = CY + fl[i][1];
    ctx.strokeStyle = col; ctx.globalAlpha = 0.9 * a; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(fx + 6, CY - 108); ctx.quadraticCurveTo(fx - 6, (CY - 108 + fy) / 2, fx, fy + 16); ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(CX + gx[i] - 12, CY + 152);

function accCloud(pts, a, col) {
  ink(a); ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(CX - 168, CY + 88); ctx.lineTo(CX + 168, CY + 88); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(CX - 108, CY - 54); ctx.quadraticCurveTo(CX - 40, CY - 102, CX + 54, CY - 60); ctx.stroke();
  ctx.globalAlpha = 1;

function accRain(pts, a, col) {
  accCloud(pts, a, col);
  ink(a); ctx.lineWidth = 4.5;
  var i, x;
  for (i = 0; i < 10; i++) {
    x = CX - 148 + i * 33;
    ctx.beginPath(); ctx.moveTo(x, CY + 118 + (i % 3) * 14); ctx.lineTo(x - 8, CY + 144 + (i % 3) * 14); ctx.stroke();

  ink(a); ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(ux, uy, 76, Math.PI, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(ux - 76, uy);
  ctx.quadraticCurveTo(ux - 50, uy + 14, ux - 25, uy);
  ctx.quadraticCurveTo(ux, uy + 14, ux + 25, uy);
  ctx.quadraticCurveTo(ux + 50, uy + 14, ux + 76, uy);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ux, uy); ctx.lineTo(ux, uy + 52); ctx.quadraticCurveTo(ux, uy + 68, ux - 16, uy + 64); ctx.stroke();
  ctx.strokeStyle = col; ctx.globalAlpha = 0.9 * a; ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.moveTo(ux, uy - 76); ctx.lineTo(ux, uy - 98); ctx.stroke();
  leaf(ux, uy - 98, ux - 22, uy - 114, 8, a);
  leaf(ux, uy - 98, ux + 22, uy - 116, 8, a);
  ctx.globalAlpha = 1;
}
var ACC = [
  [null, accAcorn, accNapoleon],
  [null, accRabbit, accBorscht],
  [null, accEgg, accChick],
  [null, accMushroom, accCottage],
  [null, accSnail, accGarden],
  [null, accCloud, accRain]
];

// ---- state ---------------------------------------------
// Frame one: transformation 1, stage 1, the bean
// complete, caption showing, no morph running. The
// piece is still between taps by design; the clock
// exists for tap timing and morph ticks only.
var ti = 0, stage = 0; // stage 0,1,2 = bean, creature, scene
var morph = null;      // {fp, tp, fti, fst, tti, tst, t, grow}
var lastTapT = -10;
var T = 4.25;          // constant first-frame phase anchor
var lastNow = -1, acc = 0;

function ease(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
function smooth(p) { p = Math.max(0, Math.min(1, p)); return p * p * (3 - 2 * p); }
function lerpPts(a, b, f) {
  var out = [], i;
  for (i = 0; i < 8; i++) out.push({ x: a[i].x + (b[i].x - a[i].x) * f, y: a[i].y + (b[i].y - a[i].y) * f });
  return out;
}
function displayPts() {
  if (!morph) return STAGE_PTS[ti][stage];
  var f = ease(Math.min(1, morph.t / MORPH_LEN));
  var pts = lerpPts(morph.fp, morph.tp, f);
  if (morph.grow) {
    var sc = 1 - 0.72 * Math.sin(Math.PI * Math.min(1, morph.t / MORPH_LEN));
    for (var i = 0; i < 8; i++) { pts[i] = { x: CX + (pts[i].x - CX) * sc, y: CY + (pts[i].y - CY) * sc }; }
  }
  return pts;
}
function startMorph(tTi, tStage, grow) {
  morph = {
    fp: displayPts(), tp: STAGE_PTS[tTi][tStage],
    fti: ti, fst: stage, tti: tTi, tst: tStage,
    t: 0, grow: !!grow
  };
}
function onTap() {
  var dbl = (T - lastTapT) < 0.5;
  lastTapT = T;
  if (dbl) { startMorph((ti + 1) % 6, 0, true); return; }
  if (morph) return;
  if (stage < 2) startMorph(ti, stage + 1, false);
  else startMorph((ti + 1) % 6, 0, true);
}
function step() {
  if (!morph) return;
  morph.t += TICK;
  if (morph.t >= MORPH_LEN) { ti = morph.tti; stage = morph.tst; morph = null; }
}

// ---- drawing -------------------------------------------
function qstep(a) { return Math.round(a * 6) / 6; } // stepped bloom alpha
function draw() {
  ctx.fillStyle = PAPER;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);
  var pts = displayPts();
  var p = morph ? Math.min(1, morph.t / MORPH_LEN) : 1;
  // watercolor fill: crossfades in stepped flat alpha
  // behind the ink; the bean stage wears no fill.
  if (morph) {
    if (morph.fst > 0) {
      ctx.fillStyle = TRANS[morph.fti].fill;
      ctx.globalAlpha = qstep(0.85 * (1 - p));
      blobPath(pts); ctx.fill();
    }
    if (morph.tst > 0) {
      ctx.fillStyle = TRANS[morph.tti].fill;
      ctx.globalAlpha = qstep(0.85 * p);
      blobPath(pts); ctx.fill();
    }
  } else if (stage > 0) {
    ctx.fillStyle = TRANS[ti].fill;
    ctx.globalAlpha = 0.85;
    blobPath(pts); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // outgoing accessories fade across the first half
  if (morph && morph.fst > 0) {
    ACC[morph.fti][morph.fst](pts, 1 - smooth(p / 0.45), TRANS[morph.fti].fill);
  }
  // ink outline of the blob
  ctx.strokeStyle = INK;
  ctx.globalAlpha = 1;
  ctx.lineWidth = 6;
  ctx.lineJoin = 'round';
  blobPath(pts); ctx.stroke();
  // incoming accessories arrive across the second half
  if (morph) {
    if (morph.tst > 0) ACC[morph.tti][morph.tst](pts, smooth((p - 0.55) / 0.45), TRANS[morph.tti].fill);
  } else if (stage > 0) {
    ACC[ti][stage](pts, 1, TRANS[ti].fill);
  }
  // caption: the designed stage line, crossfading
  ctx.fillStyle = INK;
  ctx.font = '30px Georgia, "Times New Roman", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (morph) {
    ctx.globalAlpha = 1 - smooth(p / 0.5);
    ctx.fillText(CAPTIONS[morph.fti][morph.fst], CX, CAP_Y);
    ctx.globalAlpha = smooth((p - 0.5) / 0.5);
    ctx.fillText(CAPTIONS[morph.tti][morph.tst], CX, CAP_Y);
  } else {
    ctx.globalAlpha = 0.92;
    ctx.fillText(CAPTIONS[ti][stage], CX, CAP_Y);
  }
  ctx.globalAlpha = 1;
}

// ---- tap: advance the metamorphosis ---------------------
var downX = -1, downY = -1, downT = 0;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y; downT = T;
});
canvas.addEventListener('pointerup', function (e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  var moved = Math.sqrt(dx * dx + dy * dy);
  var held = T - downT;
  downX = -1;
  if (moved < 28 && held < 0.8) onTap();
});

// ---- sizing: centred fit, page ground = paper ----------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
