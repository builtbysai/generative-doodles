<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&#8470;9027 &middot; Trellis</title>
<style>
  :root{
    --paper:#f6f1e2; --ink:#3d3125; --ink-soft:#6b5c48;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--paper)}
  body{font-family:"Noto Serif","DejaVu Serif",Georgia,serif;color:var(--ink);
       -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #wrap{position:fixed;inset:0;overflow:hidden}
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
  #plate{
    position:absolute;top:14px;left:18px;pointer-events:none;user-select:none;
    font-size:13px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;
  }
  #plate b{color:var(--ink);font-weight:700}
  #bar{
    position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
    width:min(92vw,560px);
  }
  #controls{display:flex;gap:8px;align-items:center;pointer-events:auto;
    background:rgba(246,241,226,.88);border:1px solid rgba(61,49,37,.28);
    border-radius:999px;padding:7px 10px;backdrop-filter:blur(3px);
    box-shadow:0 2px 10px rgba(61,49,37,.10)}
  #word{
    font:inherit;font-size:15px;color:var(--ink);background:transparent;border:none;outline:none;
    width:130px;padding:2px 6px;border-bottom:1px solid rgba(61,49,37,.35);
  }
  #word::placeholder{color:#a2937c;font-style:italic}
  .btn{
    font:inherit;font-size:13px;letter-spacing:.06em;color:var(--paper);background:var(--ink);
    border:none;border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;
  }
  .btn:active{transform:translateY(1px)}
  .btn.ghost{color:var(--ink);background:transparent;border:1px solid rgba(61,49,37,.45)}
  #hint{font-size:12px;font-style:italic;color:var(--ink-soft);text-align:center;
    text-shadow:0 1px 0 rgba(246,241,226,.9);user-select:none}
  @media (max-width:520px){
    #plate{font-size:11px;top:10px;left:12px}
    #word{width:96px;font-size:14px}
    .btn{font-size:12px;padding:6px 11px}
    #hint{font-size:11px;padding:0 12px}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="stage"></canvas>
  <div id="plate"><b>&#8470;9027 &middot; Trellis</b></div>
  <div id="bar">
    <div id="controls">
      <input id="word" maxlength="14" autocomplete="off" spellcheck="false"
             placeholder="type a word" aria-label="word to grow">
      <button class="btn" id="growBtn" type="button">grow it</button>
      <button class="btn ghost" id="wildBtn" type="button">new word</button>
    </div>
    <div id="hint">type a word and press enter &middot; tap the garden to regrow it</div>
  </div>
</div>
<script>
"use strict";
/* №9027 Trellis — seed 118 "Skeleton Trellis".
   The typed word is rasterized, reduced to stroke skeletons by Zhang-Suen
   thinning, then leaves and flowers sprout along the skeleton, each oriented
   perpendicular to the local stroke tangent. Foliage is drawn first and the
   skeleton vine drawn over it, so leaves never cross or cover the letterforms:
   the hedge stays readable. */

/* ---------- seeded rng ---------- */
function xmur3(str){for(var i=0,h=1779033703^str.length;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0}}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rngFrom(seed){return mulberry32(xmur3(String(seed))())}
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOutBack=t=>{t=clamp(t,0,1);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};

/* ---------- word -> skeleton ---------- */
const AW=460;                 // analysis width in px
const FONT=s=>`italic 700 ${s}px "Noto Serif","DejaVu Serif",Georgia,serif`;

function thin(bin,w,h){
  const sk=bin.slice();
  const N=p=>sk[p-w]?1:0,S=p=>sk[p+w]?1:0,E=p=>sk[p+1]?1:0,W=p=>sk[p-1]?1:0;
  const NE=p=>sk[p-w+1]?1:0,NW=p=>sk[p-w-1]?1:0,SE=p=>sk[p+w+1]?1:0,SW=p=>sk[p+w-1]?1:0;
  let changed=true,guard=0;
  while(changed&&guard++<400){
    changed=false;
    for(let step=0;step<2;step++){
      const rem=[];
      for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
        const p=y*w+x;if(!sk[p])continue;
        const n=[N(p),NE(p),E(p),SE(p),S(p),SW(p),W(p),NW(p)];
        let tr=0,ct=0;
        for(let i=0;i<8;i++){if(n[i])ct++;if(!n[i]&&n[(i+1)%8])tr++}
        if(ct<2||ct>6||tr!==1)continue;
        if(step===0){if(N(p)&&E(p)&&S(p))continue;if(E(p)&&S(p)&&W(p))continue}
        else{if(N(p)&&E(p)&&W(p))continue;if(N(p)&&S(p)&&W(p))continue}
        rem.push(p);
      }
      if(rem.length){changed=true;for(const p of rem)sk[p]=0}
    }
  }
  return sk;
}

function skeletonize(word){
  const meas=document.createElement("canvas").getContext("2d");
  meas.font=FONT(100);
  const m=meas.measureText(word);
  if(!m.width||m.width<1)return null;
  const asc=m.actualBoundingBoxAscent||70, desc=m.actualBoundingBoxDescent||25;
  const scale=AW/m.width;
  const cw=AW+10, ch=Math.max(10,Math.ceil((asc+desc)*scale)+10);
  const cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
  const g=cv.getContext("2d",{willReadFrequently:true});
  g.fillStyle="#000";g.fillRect(0,0,cw,ch);
  g.font=FONT(100*scale);g.textBaseline="alphabetic";g.fillStyle="#fff";
  g.fillText(word,5,5+asc*scale);
  const id=g.getImageData(0,0,cw,ch).data;
  const w=cw+2,h=ch+2,bin=new Uint8Array(w*h);
  for(let y=0;y<ch;y++)for(let x=0;x<cw;x++)
    if(id[(y*cw+x)*4]>110)bin[(y+1)*w+x+1]=1;
  let sk=thin(bin,w,h);
  const NB=[-w-1,-w,-w+1,-1,1,w-1,w,w+1];
  const ncount=p=>{let c=0;for(const o of NB)if(sk[p+o])c++;return c};
  const pts=[];for(let p=0;p<w*h;p++)if(sk[p])pts.push(p);
  if(!pts.length)return null;
  /* connected components (BFS) */
  const seen=new Uint8Array(w*h),comps=[];
  for(const s of pts){
    if(seen[s])continue;
    const comp=[],q=[s];seen[s]=1;
    while(q.length){const p=q.pop();comp.push(p);
      for(const o of NB){const n2=p+o;if(sk[n2]&&!seen[n2]){seen[n2]=1;q.push(n2)}}}
    comps.push(comp);
  }
  /* prune short spurs on larger components */
  for(let k=0;k<7;k++){
    const rem=[];
    for(const comp of comps){
      if(comp.length<14)continue;
      for(const p of comp)if(sk[p]&&ncount(p)===1)rem.push(p);
    }
    if(!rem.length)break;
    for(const p of rem)sk[p]=0;
  }
  const live=[];for(let p=0;p<w*h;p++)if(sk[p])live.push(p);
  if(!live.length)return null;
  /* BFS depths from the leftmost surviving pixel */
  let start=live[0];for(const p of live)if(p%w<start%w)start=p;
  const depth=new Int32Array(w*h).fill(-1),order=[];
  depth[start]=0;const q=[start];
  while(q.length){const p=q.shift();order.push(p);
    for(const o of NB){const n2=p+o;if(sk[n2]&&depth[n2]<0){depth[n2]=depth[p]+1;q.push(n2)}}}
  /* disconnected leftovers: graft with continued depths */
  let dmax=0;for(const p of live)if(depth[p]>dmax)dmax=depth[p];
  for(const p of live)if(depth[p]<0){depth[p]=++dmax;order.push(p)}
  /* local tangent by PCA over a small neighborhood */
  const tang=new Float32Array(w*h),R=4;
  for(const p of order){
    const px=p%w,py=(p/w)|0;let sx=0,sy=0,sxx=0,sxy=0,syy=0,n=0;
    for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
      const q2=(py+dy)*w+px+dx;
      if(q2<0||q2>=w*h||!sk[q2])continue;
      n++;sx+=dx;sy+=dy;sxx+=dx*dx;sxy+=dx*dy;syy+=dy*dy;
    }
    if(n>1){const cxx=sxx-sx*sx/n,cxy=sxy-sx*sy/n,cyy=syy-sy*sy/n;
      tang[p]=0.5*Math.atan2(2*cxy,cxx-cyy);}
  }
  return {w,h,sk,order,depth,tang,tiny:comps.filter(c=>c.length<10)};
}

/* ---------- garden generation ---------- */
const LEAF_GREENS=["#6f8f57","#87a765","#57744a","#9bb878","#4c6a3f","#7fa06b"];
const PETALS=["#c4705c","#d18a6a","#b95f6e"];
const VINE="#3d3125", STEMC="#5a6b43";

function quadPoint(ax,ay,cx,cy,ex,ey,t){
  const u=1-t;return [u*u*ax+2*u*t*cx+t*t*ex, u*u*ay+2*u*t*cy+t*t*ey];
}
function quadTangent(ax,ay,cx,cy,ex,ey,t){
  return Math.atan2(2*(1-t)*(cy-ay)+2*t*(ey-cy), 2*(1-t)*(cx-ax)+2*t*(ex-cx));
}

function growGarden(skel,seed){
  const rng=rngFrom(seed);
  const {w,h,sk,order,depth,tang,tiny}=skel;
  const sprouts=[],flowers=[];
  const cell=5,taken=new Set();
  const j=()=> (rng()*2-1);
  for(const p of order){
    const px=p%w,py=(p/w)|0;
    const key=((px/cell)|0)+"_"+((py/cell)|0);
    if(taken.has(key)||rng()>0.80)continue;
    taken.add(key);
    const t=tang[p],birth=depth[p]*4.2;
    const sides=rng()<0.22?[-1,1]:(rng()<0.5?[-1]:[1]);
    for(const side of sides){
      const na=t+side*Math.PI/2+j()*0.28;
      const L=8+rng()*10;
      const ax=px,ay=py;
      const cx=ax+Math.cos(na)*L*0.55+Math.cos(t)*j()*5;
      const cy=ay+Math.sin(na)*L*0.55+Math.sin(t)*j()*5;
      const ex=ax+Math.cos(na)*L+Math.cos(t)*j()*7;
      const ey=ay+Math.sin(na)*L+Math.sin(t)*j()*7;
      const stemW=1.4+rng()*0.9;
      const nLeaves=2+((rng()*2)|0);
      const leaves=[];
      for(let i=0;i<nLeaves;i++){
        const lt=0.42+0.5*(i+1)/(nLeaves+1)+j()*0.05;
        const [bx,by]=quadPoint(ax,ay,cx,cy,ex,ey,clamp(lt,0.05,0.98));
        const st=quadTangent(ax,ay,cx,cy,ex,ey,clamp(lt,0.05,0.98));
        const la=st+(i%2?1:-1)*(0.55+rng()*0.5)+j()*0.2;
        leaves.push({
          bx,by,ang:la,len:8+rng()*11,wid:0.44+rng()*0.12,
          col:LEAF_GREENS[(rng()*LEAF_GREENS.length)|0],
          phase:rng()*TAU,vein:"#3c5232"
        });
      }
      sprouts.push({ax,ay,cx,cy,ex,ey,stemW,leaves,birth,
        phase:rng()*TAU,flower:rng()<0.075});
    }
  }
  /* tittles and dots become blossoms */
  for(const comp of tiny){
    let sx=0,sy=0;for(const p of comp){sx+=p%w;sy+=(p/w)|0}
    const cxp=sx/comp.length,cyp=sy/comp.length;
    flowers.push({x:cxp,y:cyp,r:5.5+rng()*2,
      col:PETALS[(rng()*PETALS.length)|0],phase:rng()*TAU,birth:0});
  }
  /* some stem tips carry a flower */
  const frng=rngFrom(seed+"f");
  for(const s of sprouts)if(s.flower)
    flowers.push({x:s.ex,y:s.ey,r:4+frng()*2.5,
      col:PETALS[(frng()*PETALS.length)|0],phase:frng()*TAU,birth:s.birth+260,
      stemRef:s});
  let maxBirth=0;
  for(const s of sprouts)if(s.birth>maxBirth)maxBirth=s.birth;
  for(const f of flowers)if(f.birth>maxBirth)maxBirth=f.birth;
  return {sprouts,flowers,sk,w,h,wordW:w,wordH:h,totalMs:maxBirth+650};
}

/* ---------- rendering ---------- */
const cv=document.getElementById("stage"),ctx=cv.getContext("2d");
let W=0,H=0,DPR=1,grain=null;
function makeGrain(){
  grain=document.createElement("canvas");grain.width=grain.height=140;
  const g=grain.getContext("2d"),id=g.createImageData(140,140),r=rngFrom("paper");
  for(let i=0;i<id.data.length;i+=4){const v=(r()*255)|0;
    id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=14}
  g.putImageData(id,0,0);
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
}
window.addEventListener("resize",resize);resize();makeGrain();

let garden=null,word="",seed=118,t0=performance.now(),S=1,ox=0,oy=0;
function layout(){
  if(!garden)return;
  const mW=W*0.88,mH=H*0.62;
  S=Math.min(mW/garden.wordW,mH/garden.wordH);
  ox=(W-garden.wordW*S)/2;oy=(H-garden.wordH*S)/2;
}
function drawLeaf(l,t,sc){
  const sway=Math.sin(t*0.0009+l.phase)*0.05;
  const a=l.ang+sway,len=l.len*sc,wd=l.wid;
  const tx=l.bx+Math.cos(a)*len,ty=l.by+Math.sin(a)*len;
  const nx=-Math.sin(a),ny=Math.cos(a);
  const mx=l.bx+Math.cos(a)*len*0.45,my=l.by+Math.sin(a)*len*0.45;
  ctx.beginPath();
  ctx.moveTo(l.bx,l.by);
  ctx.quadraticCurveTo(mx+nx*len*wd,my+ny*len*wd,tx,ty);
  ctx.quadraticCurveTo(mx-nx*len*wd,my-ny*len*wd,l.bx,l.by);
  ctx.fillStyle=l.col;ctx.fill();
  ctx.beginPath();ctx.moveTo(l.bx,l.by);ctx.lineTo(tx,ty);
  ctx.strokeStyle=l.vein;ctx.lineWidth=Math.max(0.6,1.0*S*0.14);ctx.stroke();
}
function drawFlower(f,t,sc){
  const bob=Math.sin(t*0.0011+f.phase)*1.6*S;
  const x=f.x,y=f.y+bob/S,r=f.r*sc;
  ctx.fillStyle=f.col;
  for(let i=0;i<5;i++){
    const a=f.phase+i*TAU/5+t*0.00012;
    const px=x+Math.cos(a)*r*0.72,py=y+Math.sin(a)*r*0.72;
    ctx.beginPath();ctx.ellipse(px,py,r*0.52,r*0.30,a,0,TAU);ctx.fill();
  }
  ctx.beginPath();ctx.arc(x,y,r*0.34,0,TAU);ctx.fillStyle="#e5b84e";ctx.fill();
}
function frame(now){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle="#f6f1e2";ctx.fillRect(0,0,W,H);
  ctx.fillStyle=ctx.createPattern(grain,"repeat");ctx.fillRect(0,0,W,H);
  /* soft vignette */
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
  vg.addColorStop(0,"rgba(61,49,37,0)");vg.addColorStop(1,"rgba(61,49,37,0.10)");
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  /* faint plate frame */
  ctx.strokeStyle="rgba(61,49,37,0.30)";ctx.lineWidth=1;
  ctx.strokeRect(10.5,10.5,W-21,H-21);
  if(garden){
    const t=now-t0;
    ctx.setTransform(DPR*S,0,0,DPR*S,DPR*ox,DPR*oy);
    /* foliage first */
    ctx.lineCap="round";
    for(const s of garden.sprouts){
      const gt=easeOutBack((t-s.birth)/520);
      if(gt<=0)continue;
      const sway=Math.sin(t*0.001+s.phase)*0.9;
      const ex=s.ex+sway*0.4,ey=s.ey;
      const cx=s.cx+sway*0.25,cy=s.cy;
      ctx.beginPath();ctx.moveTo(s.ax,s.ay);
      ctx.quadraticCurveTo(cx,cy,ex,ey);
      ctx.strokeStyle=STEMC;ctx.lineWidth=s.stemW;ctx.stroke();
      for(const l of s.leaves)drawLeaf(l,t,gt);
    }
    for(const f of garden.flowers){
      const gt=easeOutBack((t-f.birth)/520);
      if(gt<=0)continue;
      if(f.stemRef){/* keep blossom glued to its swaying tip */
        const s=f.stemRef,sway=Math.sin(t*0.001+s.phase)*0.9;
        f.x=s.ex+sway*0.4;f.y=s.ey;
      }
      drawFlower(f,t,gt);
    }
    /* skeleton vine drawn over the foliage: leaves never cross the word */
    ctx.beginPath();
    const {sk,w}=garden;
    for(let p=0;p<sk.length;p++){
      if(!sk[p])continue;
      const px=p%w;
      if(sk[p+1]){ctx.moveTo(px,(p/w)|0);ctx.lineTo(px+1,(p/w)|0)}
      if(sk[p+w+1]){ctx.moveTo(px,(p/w)|0);ctx.lineTo(px+1,((p+w+1)/w)|0)}
      if(sk[p+w]){ctx.moveTo(px,(p/w)|0);ctx.lineTo(px,((p+w)/w)|0)}
      if(sk[p+w-1]){ctx.moveTo(px,(p/w)|0);ctx.lineTo(px-1,((p+w-1)/w)|0)}
    }
    ctx.strokeStyle=VINE;ctx.lineWidth=3.1;ctx.lineCap="round";ctx.stroke();
    /* thin light core so the vine reads as a stem, not a wire */
    ctx.strokeStyle="rgba(246,241,226,0.28)";ctx.lineWidth=1.1;ctx.stroke();
  }
  requestAnimationFrame(frame);
}

function sanitize(s){return s.replace(/[^A-Za-z' -]/g,"").trim().slice(0,14)}
function grow(newWord,newSeed){
  newWord=sanitize(newWord);
  if(!newWord)return false;
  const skel=skeletonize(newWord);
  if(!skel)return false;
  word=newWord;seed=newSeed;
  garden=growGarden(skel,seed);
  layout();t0=performance.now();
  document.getElementById("hint").textContent=
    "\u201c"+word+"\u201d \u00b7 seed "+seed+" \u00b7 type a word and press enter \u00b7 tap the garden to regrow it";
  return true;
}

/* ---------- interaction ---------- */
const input=document.getElementById("word");
document.getElementById("growBtn").addEventListener("click",()=>{
  if(grow(input.value||word,(Math.random()*1e9)|0))input.blur();
});
const CURATED=["fern","garden","meadow","briar","willow","moss","clover","thyme","wild","trellis"];
let wildIx=CURATED.indexOf("trellis");
document.getElementById("wildBtn").addEventListener("click",()=>{
  wildIx=(wildIx+1+((Math.random()*(CURATED.length-1))|0))%CURATED.length;
  const w2=CURATED[wildIx];
  input.value=w2;grow(w2,(Math.random()*1e9)|0);input.blur();
});
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){if(grow(input.value,(Math.random()*1e9)|0))input.blur();e.preventDefault()}
});
let pdown=null;
cv.addEventListener("pointerdown",e=>{pdown=[e.clientX,e.clientY,performance.now()]});
cv.addEventListener("pointerup",e=>{
  if(!pdown)return;
  const [x,y,tm]=pdown;pdown=null;
  if(Math.hypot(e.clientX-x,e.clientY-y)<12&&performance.now()-tm<600)
    grow(word,(Math.random()*1e9)|0);
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)t0+=0;});

/* ---------- boot ---------- */
const qs=new URLSearchParams(location.search);
const startWord=sanitize(qs.get("word")||"trellis")||"trellis";
const startSeed=qs.has("seed")?(parseInt(qs.get("seed"),10)>>>0)||118:118;
input.value=startWord==="trellis"?"":startWord;
grow(startWord,startSeed);
requestAnimationFrame(frame);
</script>
</body>
</html>
