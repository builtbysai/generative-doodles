<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hazlo Como en Francia</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F5EEDA; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (strict, from the prompt): vivienda teal, banner cream,
  // guillotine steel, revolution red, baguette gold, ink.
  // Flat fills only, no gradients.
  var TEAL = '#2E8B8B', CREAM = '#F5EEDA', STEEL = '#8A8A8A',
      RED = '#B23A3A', GOLD = '#D9A441', INK = '#141414';

  var PHASE0 = 2.1;         // constant first-frame phase
  var DW = 1080, DH = 1440; // portrait design space
  var FONT = 'Arial, Helvetica, sans-serif';

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function mod(a, n) { return ((a % n) + n) % n; }

  // ---- geometry (design space) ----
  var PAN = { x: 48, y: 56, w: 984, h: 1256 };  // the one visible panel
  var FOOT_Y = 1372;                            // footer baseline

  // ---- small canvas helpers ----
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
  function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
  function fillStroke(fill, lw, strokeCol) {
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (lw) { ctx.strokeStyle = strokeCol || INK; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function line(x1, y1, x2, y2, w, color) {
    ctx.strokeStyle = color || INK; ctx.lineWidth = w || 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r); ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h); ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r); ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }
  // Wobbly hand-drawn rectangle: jitter from a fixed seed, identical every frame.
  function wobblyRect(x, y, w, h, seed, amp) {
    var r = mulberry32(seed);
    function j() { return (r() - 0.5) * 2 * (amp || 5); }
    var pts = [
      [x + j(), y + j()], [x + w / 2 + j(), y + j()], [x + w + j(), y + j()],
      [x + w + j(), y + h / 2 + j()], [x + w + j(), y + h + j()],
      [x + w / 2 + j(), y + h + j()], [x + j(), y + h + j()],
      [x + j(), y + h / 2 + j()]
    ];
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }
  function text(str, x, y, size, weight, color, align) {
    ctx.font = weight + ' ' + size + 'px ' + FONT;
    ctx.fillStyle = color || INK;
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }
  function lines(arr, x, y0, size, lh, weight, color, align) {
    for (var i = 0; i < arr.length; i++)
      text(arr[i], x, y0 + i * lh, size, weight || 700, color || INK, align);
  }
  // Hand-lettered line: per-letter jitter from a fixed seed (stable forever).
  function jitterText(str, cx, y, size, seed, color, weight) {
    var r = mulberry32(seed);
    ctx.font = (weight || 900) + ' ' + size + 'px ' + FONT;
    var widths = [], total = 0, i, w;
    for (i = 0; i < str.length; i++) { w = ctx.measureText(str[i]).width; widths.push(w); total += w; }
    var x = cx - total / 2;
    ctx.fillStyle = color || INK;
    ctx.textBaseline = 'middle';
    for (i = 0; i < str.length; i++) {
      ctx.save();
      ctx.translate(x + widths[i] / 2 + (r() - 0.5) * 4, y + (r() - 0.5) * 6);
      ctx.rotate((r() - 0.5) * 0.055);
      ctx.textAlign = 'center';
      ctx.fillText(str[i], 0, 0);
      ctx.restore();
      x += widths[i];
    }
  }
  // Speech bubble: wobbly cream box + little tail.
  function bubble(x, y, w, h, seed, tailX, tailY) {
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(x + w * 0.40, y + h);
    ctx.lineTo(x + w * 0.58, y + h);
    ctx.closePath();
    fillStroke(CREAM, 5);
    wobblyRect(x, y, w, h, seed, 4);
    fillStroke(CREAM, 5);
  }
  function clipPanel() {
    ctx.beginPath();
    ctx.rect(PAN.x, PAN.y, PAN.w, PAN.h);
    ctx.clip();
  }

  // ---- figures ----
  // The woman: teal dress, ink bun, composed face, papers in hand.
  function drawWoman(cx, baseY, s, bob) {
    ctx.save();
    ctx.translate(cx, baseY + bob);
    ctx.scale(s, s);
    // dress
    ctx.beginPath();
    ctx.moveTo(-52, 0); ctx.lineTo(-30, -218); ctx.lineTo(30, -218); ctx.lineTo(52, 0);
    ctx.closePath(); fillStroke(TEAL, 6);
    // arm holding papers up
    line(28, -196, 84, -238, 13, INK);
    ctx.save(); ctx.translate(102, -256); ctx.rotate(0.16);
    rrect(-34, -46, 68, 92, 4); fillStroke(CREAM, 5);
    line(-18, -22, 20, -22, 4, STEEL); line(-18, 0, 20, 0, 4, STEEL); line(-18, 22, 8, 22, 4, STEEL);
    ctx.restore();
    // other arm, calm at side
    line(-28, -196, -58, -104, 13, INK);
    // head
    circ(0, -286, 56); fillStroke(CREAM, 6);
    // hair: cap + bun
    ctx.beginPath(); ctx.arc(0, -296, 57, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath();
    fillStroke(INK, 4);
    circ(46, -336, 20); fillStroke(INK, 4);
    // composed face: level brows, calm eyes, straight mouth
    line(-30, -292, -8, -292, 5); line(8, -292, 30, -292, 5);
    circ(-19, -278, 4.5); ctx.fillStyle = INK; ctx.fill();
    circ(19, -278, 4.5); ctx.fillStyle = INK; ctx.fill();
    line(-14, -252, 14, -252, 5);
    ctx.restore();
  }
  // The man: steel shirt, ink hair cap. mood: 'shrug' | 'rage' | 'glee'
  function drawMan(cx, baseY, s, bob, mood) {
    ctx.save();
    ctx.translate(cx, baseY + bob);
    ctx.scale(s, s);
    // legs
    line(-20, -96, -24, 0, 15, INK); line(20, -96, 24, 0, 15, INK);
    // torso
    rrect(-56, -238, 112, 150, 16); fillStroke(STEEL, 6);
    if (mood === 'shrug') {
      // one hand waved off to the side, head turned away
      line(52, -212, 108, -238, 13, INK);
      line(-52, -212, -84, -140, 13, INK);
    } else if (mood === 'rage') {
      line(52, -212, 96, -292, 14, INK);   // fist up (baguette hand drawn separately)
      line(-52, -212, -88, -150, 13, INK);
    } else { // glee: both arms out, one toward the rope
      line(52, -212, 116, -178, 13, INK);
      line(-52, -212, -104, -248, 13, INK);
    }
    // head
    circ(0, -306, 54); fillStroke(CREAM, 6);
    ctx.beginPath(); ctx.arc(0, -316, 55, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath();
    fillStroke(INK, 4);
    if (mood === 'shrug') {
      // eyes slid away, flat dismissive mouth
      circ(-26, -300, 4.5); ctx.fillStyle = INK; ctx.fill();
      circ(-6, -300, 4.5); ctx.fillStyle = INK; ctx.fill();
      line(-16, -272, 12, -276, 5);
      line(-34, -318, -12, -314, 5); line(2, -314, 24, -318, 5);
    } else if (mood === 'rage') {
      line(-32, -322, -8, -314, 6); line(32, -322, 8, -314, 6);
      circ(-18, -298, 5); ctx.fillStyle = INK; ctx.fill();
      circ(18, -298, 5); ctx.fillStyle = INK; ctx.fill();
      ell(0, -268, 13, 17); fillStroke(INK, 4); // open shouting mouth
    } else {
      // gleeful: arched brows, wide grin with teeth
      ctx.beginPath(); ctx.arc(-19, -308, 9, Math.PI * 1.1, Math.PI * 1.9); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
      ctx.beginPath(); ctx.arc(19, -308, 9, Math.PI * 1.1, Math.PI * 1.9); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
      circ(-19, -294, 4.5); ctx.fillStyle = INK; ctx.fill();
      circ(19, -294, 4.5); ctx.fillStyle = INK; ctx.fill();
      ctx.beginPath(); ctx.arc(0, -276, 22, Math.PI * 0.12, Math.PI * 0.88); ctx.closePath();
      fillStroke(CREAM, 5);
      line(-20, -266, 20, -266, 3);
    }
    ctx.restore();
  }
  // The sacred object: a golden baguette, drawn along +x from origin.
  function drawBaguette(len, thick) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, -thick / 2);
    ctx.lineTo(len, -thick / 2);
    ctx.quadraticCurveTo(len + thick * 0.7, 0, len, thick / 2);
    ctx.lineTo(0, thick / 2);
    ctx.quadraticCurveTo(-thick * 0.7, 0, 0, -thick / 2);
    ctx.closePath();
    fillStroke(GOLD, 6);
    // score marks
    ctx.strokeStyle = CREAM; ctx.lineWidth = 6; ctx.lineCap = 'round';
    for (var i = 0; i < 4; i++) {
      var sx = len * (0.18 + i * 0.21);
      ctx.beginPath(); ctx.moveTo(sx, -thick * 0.28); ctx.lineTo(sx + thick * 0.5, thick * 0.28); ctx.stroke();
    }
    ctx.restore();
  }

  // ---- panels 1-4: the split guide ----
  var HER = [
    ['Las SOCIMI compran', 'barrios enteros y', 'apenas pagan', 'impuestos por ello.'],
    ['Cada subida del', 'alquiler expulsa a', 'vecinos de toda', 'la vida.'],
    ['Hay que limitar', 'por ley la compra', 'masiva de vivienda', 'para especular.'],
    ['Si una vía se', 'cierra, abrimos', 'otra: organización', 'y presión vecinal.']
  ];
  var HIM = [
    ['Ya, ya... ¿y por', 'qué no te depilas', 'las axilas, para', 'empezar?'],
    ['Uf... ¿ese olor', 'a pachulí viene', 'de ti o de una', 'tiendecita?'],
    ['Con pantalones', 'de cáñamo no te', 'toma en serio', 'ni el banco.'],
    ['Tú eres una', 'comunista', 'progresista', 'de Chanel.']
  ];
  function drawGuide(idx, t) {
    ctx.fillStyle = CREAM; ctx.fillRect(PAN.x, PAN.y, PAN.w, PAN.h);
    ctx.save(); clipPanel();
    // header band
    ctx.fillStyle = TEAL; ctx.fillRect(PAN.x, PAN.y, PAN.w, 196);
    jitterText('CÓMO LUCHAR POR', PAN.x + PAN.w / 2, PAN.y + 66, 74, 566101, CREAM);
    text('tus derechos', PAN.x + PAN.w / 2, PAN.y + 148, 56, 700, GOLD);
    // divider
    line(PAN.x + 566, PAN.y + 330, PAN.x + 566, PAN.y + PAN.h - 88, 4, STEEL);
    var bobW = Math.sin(t * (Math.PI * 2 / 4)) * 4;      // 4 s bob
    var bobM = Math.sin(t * (Math.PI * 2 / 4) + 1.3) * 4;
    // left: her argument banner + figure
    text('ELLA EXPONE', PAN.x + 292, PAN.y + 262, 30, 900, TEAL);
    wobblyRect(PAN.x + 40, PAN.y + 316, 492, 330, 566110 + idx, 5);
    fillStroke(CREAM, 6);
    ctx.fillStyle = TEAL; ctx.fillRect(PAN.x + 40, PAN.y + 316, 492, 46);
    text('PASO ' + (idx + 1) + ' DE 4', PAN.x + 286, PAN.y + 340, 27, 900, CREAM);
    lines(HER[idx], PAN.x + 286, PAN.y + 424, 38, 54, 700, INK);
    drawWoman(PAN.x + 286, PAN.y + PAN.h - 88, 1.06, bobW);
    // right: his insult bubble + figure
    text('ÉL, A LO SUYO', PAN.x + 772, PAN.y + 262, 30, 900, RED);
    bubble(PAN.x + 592, PAN.y + 316, 356, 300, 566130 + idx, PAN.x + 800, PAN.y + 796);
    lines(HIM[idx], PAN.x + 770, PAN.y + 398, 36, 54, 700, INK);
    drawMan(PAN.x + 786, PAN.y + PAN.h - 88, 1.06, bobM, 'shrug');
    // ground
    line(PAN.x + 30, PAN.y + PAN.h - 84, PAN.x + PAN.w - 30, PAN.y + PAN.h - 84, 5, INK);
    ctx.restore();
  }

  // ---- panel 5: Francia en 1936 ----
  var GRAIN = [];
  (function () {
    var r = mulberry32(566055);
    for (var i = 0; i < 620; i++) {
      GRAIN.push({ x: r() * PAN.w, y: r() * PAN.h, s: 1.5 + r() * 3.2, g: r() });
    }
  })();
  var swirl = 0; // drag-driven grain swirl, decays back to 0
  function drawFrance(t) {
    // sepia ground built from the palette: gold wash over cream
    ctx.fillStyle = GOLD; ctx.fillRect(PAN.x, PAN.y, PAN.w, PAN.h);
    ctx.globalAlpha = 0.55; ctx.fillStyle = CREAM;
    ctx.fillRect(PAN.x, PAN.y, PAN.w, PAN.h); ctx.globalAlpha = 1;
    ctx.save(); clipPanel();
    // header card
    wobblyRect(PAN.x + 172, PAN.y + 44, 640, 130, 566150, 5);
    fillStroke(CREAM, 6);
    jitterText('FRANCIA EN 1936', PAN.x + PAN.w / 2, PAN.y + 110, 68, 566151, INK);
    var bobM = Math.sin(t * (Math.PI * 2 / 4)) * 4;
    // the same man, outraged, baguette raised in his right hand
    drawMan(PAN.x + 330, PAN.y + PAN.h - 120, 1.5, bobM, 'rage');
    ctx.save();
    ctx.translate(PAN.x + 474, PAN.y + PAN.h - 446);
    ctx.rotate(-0.62 + Math.sin(t * (Math.PI * 2 / 2)) * 0.03);
    drawBaguette(430, 74);
    ctx.restore();
    // price tag hanging off the baguette
    ctx.save();
    ctx.translate(PAN.x + 742, PAN.y + PAN.h - 520);
    ctx.rotate(0.14);
    line(0, -52, 0, 0, 4, INK);
    rrect(-72, 0, 144, 84, 8); fillStroke(CREAM, 5);
    text('2,10', 0, 44, 46, 900, RED);
    ctx.restore();
    // his outrage bubble
    bubble(PAN.x + 470, PAN.y + 250, 440, 240, 566160, PAN.x + 560, PAN.y + 640);
    lines(['¿¡2,10 por una', 'baguette!? ¡Esto', 'es un atraco!'],
      PAN.x + 690, PAN.y + 322, 42, 58, 700, INK);
    // cobble ground
    line(PAN.x + 30, PAN.y + PAN.h - 116, PAN.x + PAN.w - 30, PAN.y + PAN.h - 116, 5, INK);
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.globalAlpha = 0.5;
    for (var i = 0; i < 7; i++) {
      ctx.beginPath();
      ctx.arc(PAN.x + 110 + i * 128, PAN.y + PAN.h - 84, 44, Math.PI * 1.08, Math.PI * 1.55);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    // sepia grain: precomputed specks, swirled by drag (clipped to panel)
    ctx.save(); clipPanel();
    ctx.translate(PAN.x + PAN.w / 2, PAN.y + PAN.h / 2);
    ctx.rotate(swirl * 0.35);
    ctx.translate(swirl * 26, swirl * 14);
    for (var k = 0; k < GRAIN.length; k++) {
      var g = GRAIN[k];
      ctx.fillStyle = g.g > 0.5 ? INK : CREAM;
      ctx.globalAlpha = 0.10 + g.g * 0.13;
      ctx.fillRect(g.x - PAN.w / 2, g.y - PAN.h / 2, g.s, g.s);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---- panel 6: the tribunal ----
  var dropT0 = -1;    // simT when the blade was released (-1 = blade up)
  var dropped = false;
  function flame(x, y, w, h, fill) {
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y);
    ctx.quadraticCurveTo(x - w / 2, y - h * 0.55, x, y - h);
    ctx.quadraticCurveTo(x + w / 2, y - h * 0.55, x + w / 2, y);
    ctx.quadraticCurveTo(x, y - h * 0.18, x - w / 2, y);
    ctx.closePath();
    fillStroke(fill, 4);
  }
  function drawTribunal(t) {
    var p = 0; // blade progress 0..1
    if (dropT0 >= 0) p = clamp((t - dropT0) / 0.45, 0, 1);
    var sep = p > 0.75 ? (p - 0.75) / 0.25 : 0; // baguette halves separate at the end
    var shake = 0;
    if (dropT0 >= 0 && t - dropT0 > 0.45 && t - dropT0 < 0.9)
      shake = Math.sin((t - dropT0) * 61) * 7 * (1 - (t - dropT0 - 0.45) / 0.45);
    ctx.save();
    ctx.translate(shake, shake * 0.4);
    ctx.fillStyle = RED; ctx.fillRect(PAN.x - 16, PAN.y - 16, PAN.w + 32, PAN.h + 32);
    ctx.save(); clipPanel();
    var fl = Math.floor(t * 2) % 2; // 2-frame flame flicker
    var i, fx;
    // back flames along the bottom and sides
    for (i = 0; i < 11; i++) {
      fx = PAN.x + 50 + i * 92;
      flame(fx, PAN.y + PAN.h - 150, 96, 300 + ((i + fl) % 2) * 60, i % 2 ? GOLD : RED);
    }
    for (i = 0; i < 4; i++) {
      flame(PAN.x + 52, PAN.y + 240 + i * 210, 84, 190 + ((i + fl) % 2) * 44, i % 2 ? RED : GOLD);
      flame(PAN.x + PAN.w - 52, PAN.y + 240 + i * 210, 84, 190 + ((i + 1 + fl) % 2) * 44, i % 2 ? GOLD : RED);
    }
    // platform
    ctx.fillStyle = INK; ctx.fillRect(PAN.x + 130, PAN.y + PAN.h - 246, 724, 26);
    var gx = PAN.x + 400, gy = PAN.y + PAN.h - 220; // guillotine base point
    // guillotine: two steel posts, crossbar, angled blade
    ctx.fillStyle = STEEL;
    ctx.fillRect(gx - 118, gy - 690, 30, 690);
    ctx.fillRect(gx + 88, gy - 690, 30, 690);
    ctx.fillRect(gx - 140, gy - 726, 280, 40);
    ctx.strokeStyle = INK; ctx.lineWidth = 5;
    ctx.strokeRect(gx - 118, gy - 690, 30, 690);
    ctx.strokeRect(gx + 88, gy - 690, 30, 690);
    ctx.strokeRect(gx - 140, gy - 726, 280, 40);
    var bladeY = gy - 640 + p * 400;
    ctx.beginPath();
    ctx.moveTo(gx - 88, bladeY); ctx.lineTo(gx + 88, bladeY - 58);
    ctx.lineTo(gx + 88, bladeY + 6); ctx.lineTo(gx - 88, bladeY + 64);
    ctx.closePath(); fillStroke(STEEL, 5);
    line(gx - 88, bladeY + 64, gx + 88, bladeY + 6, 4, CREAM);
    // rope from the crossbar to the man's hand
    line(gx + 118, gy - 700, gx + 268, gy - 420 + (dropped ? 60 : 0), 5, GOLD);
    // the baguette on the lunette: whole, or two halves rotating apart
    if (sep <= 0) {
      ctx.save(); ctx.translate(gx - 150, gy - 26); drawBaguette(300, 52); ctx.restore();
    } else {
      ctx.save(); ctx.translate(gx - 150 - sep * 26, gy - 26);
      ctx.rotate(-sep * 0.45); drawBaguette(148, 52); ctx.restore();
      ctx.save(); ctx.translate(gx + 2 + sep * 26, gy - 26);
      ctx.rotate(sep * 0.45); drawBaguette(148, 52); ctx.restore();
    }
    // the same man, gleeful, working the rope
    var bobM = Math.sin(t * (Math.PI * 2 / 2)) * 4;
    drawMan(PAN.x + 756, PAN.y + PAN.h - 220, 1.28, bobM, 'glee');
    // front flames
    for (i = 0; i < 11; i++) {
      fx = PAN.x + 50 + i * 92;
      flame(fx, PAN.y + PAN.h - 128, 78, 130 + ((i + 1 + fl) % 2) * 38, i % 2 ? RED : GOLD);
    }
    ctx.restore();
    // caption band
    wobblyRect(PAN.x + 60, PAN.y + PAN.h - 128, PAN.w - 120, 96, 566170, 4);
    fillStroke(CREAM, 6);
    jitterText('HAZLO COMO EN FRANCIA! (del 36)', PAN.x + PAN.w / 2, PAN.y + PAN.h - 79, 47, 566171, RED);
    ctx.restore();
  }

  // ---- main draw ----
  var panelIdx = 0;
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(SC, SC);
    if (panelIdx < 4) drawGuide(panelIdx, t);
    else if (panelIdx === 4) drawFrance(t);
    else drawTribunal(t);
    wobblyRect(PAN.x, PAN.y, PAN.w, PAN.h, 566020, 5);
    ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.stroke();
    // footer: hint + panel counter (the only UI)
    text('tap', PAN.x + 6, FOOT_Y, 30, 400, STEEL, 'left');
    text((panelIdx + 1) + '/6', PAN.x + PAN.w - 6, FOOT_Y, 30, 700, INK, 'right');
    ctx.restore();
  }

  // ---- sizing (Visual Viewport API) ----
  var W = 0, H = 0, SC = 1, OX = 0, OY = 0;
  var simT = PHASE0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) {
      SC = W / DW;
      OX = 0; OY = (H - DH * SC) / 2;
    } else {
      SC = Math.min(W / DW, H / DH);
      OX = (W - DW * SC) / 2; OY = (H - DH * SC) / 2;
    }
    draw(simT);
  }

  // ---- interaction ----
  // tap: advance the carousel. Panel 6: a tap on the guillotine drops the
  // blade (or resets it) instead of advancing. Panel 5: drag swirls the grain.
  function toDesign(p) { return { x: (p.x - OX) / (SC || 1), y: (p.y - OY) / (SC || 1) }; }
  function inGuillotine(d) {
    var gx = PAN.x + 400, gy = PAN.y + PAN.h - 220;
    return d.x > gx - 190 && d.x < gx + 310 && d.y > gy - 780 && d.y < gy + 40;
  }
  var downPos = null, downDesign = null, lastX = 0, downStamp = -1e9, lastPtrStamp = -1e9;
  function evtPos(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return { x: cx - rect.left, y: cy - rect.top };
  }
  function onDown(e) {
    if (e.timeStamp !== undefined) {
      if (e.timeStamp - downStamp < 350) return;
      downStamp = e.timeStamp;
    }
    var p = evtPos(e);
    downPos = p; downDesign = toDesign(p); lastX = p.x;
  }
  function onMove(e) {
    if (!downPos || panelIdx !== 4) return;
    var p = evtPos(e);
    var dx = (p.x - lastX) / (SC || 1);
    lastX = p.x;
    swirl = clamp(swirl + dx / 260, -1.6, 1.6);
    draw(simT);
    if (e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    if (!downPos) return;
    var p = evtPos(e);
    var moved = Math.abs(p.x - downPos.x) + Math.abs(p.y - downPos.y);
    var wasPanel = panelIdx, at = downDesign;
    downPos = null; downDesign = null;
    if (moved >= 16) return;
    if (wasPanel === 5 && at && inGuillotine(at)) {
      if (!dropped) { dropT0 = simT; dropped = true; }
      else { dropT0 = -1; dropped = false; }
      draw(simT);
      return;
    }
    panelIdx = mod(panelIdx + 1, 6);
    if (panelIdx !== 5) { dropT0 = -1; dropped = false; }
    draw(simT);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) { lastPtrStamp = e.timeStamp || 0; onDown(e); });
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { downPos = null; downDesign = null; });
    canvas.addEventListener('touchstart', function (e) {
      if ((e.timeStamp || 0) - lastPtrStamp < 700) return;
      onDown(e);
    });
    canvas.addEventListener('touchmove', function (e) {
      if ((e.timeStamp || 0) - lastPtrStamp < 700) return;
      onMove(e);
    });
    canvas.addEventListener('touchend', function (e) {
      if ((e.timeStamp || 0) - lastPtrStamp < 700) return;
      onUp(e.changedTouches && e.changedTouches[0] ? { clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY, timeStamp: e.timeStamp } : e);
    });
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    if (swirl !== 0 && !downPos) {
      swirl *= 0.94; // settle after release
      if (Math.abs(swirl) < 0.002) swirl = 0;
    }
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
