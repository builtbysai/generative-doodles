<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.306 Wagtail Loop</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1B2A4A; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.306 Wagtail Loop (Ali Fisher).
// A willy wagtail in white linework on deep navy, perched
// upper-centre on a diagonal eucalyptus branch, its long tail
// cocked up behind it. Banksia pods in ochre are scattered in
// the lower third like a specimen arrangement. Watch-only:
// nothing the viewer does changes the piece. The loop is 12
// seconds and seamless. The tail pumps on a hand-authored
// keyframe curve, three quick pumps, a pause, two pumps, then
// a settle, never a sine. The body bobs in counter-phase from
// the same curve. Each pump kicks the eucalyptus leaves, which
// tremble as spring-damped oscillators. Exactly one pod
// detaches at 8 seconds, rolls a short seeded distance and is
// fully faded by 11.5 seconds, so frame 12 seconds matches
// frame 0 exactly. Fixed seeds, no randomness at runtime.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var NAVY = '#1B2A4A', WHITE = '#F5F5F0', OCHRE = '#C98A3D', SAGE = '#7A8B6F';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 12;
// Start mid-first-burst, so frame one already shows the tail
// cocked inside its first pump and the leaves mid-tremble.
var T = 0.48, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, u) { return a + (b - a) * u; }
function smooth(u) { return u * u * (3 - 2 * u); }
function oval(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }

// ---- tail keyframe curve -------------------------------------------
// Hand-authored table: [time in seconds, pump angle in degrees].
// Positive angle rotates the cocked tail downward. Keys come in
// quick pairs inside a burst, plateaus hold between bursts, and
// the value is flat from the settle at 5 seconds to the loop end.
var TAIL_KEYS = [
  [0.00, 0], [0.35, 14], [0.60, 2], [0.85, 13], [1.10, 2],
  [1.35, 14], [1.60, 0], [3.20, 0], [3.60, 13], [3.85, 2],
  [4.10, 14], [4.35, 1], [5.00, 0], [12.00, 0]
];
if (TAIL_KEYS.length !== 14) throw new Error('Wagtail Loop needs exactly 14 tail keys');
var KICKS = [0.35, 0.85, 1.35, 3.60, 4.10];
if (KICKS.length !== 5) throw new Error('Wagtail Loop needs exactly 5 pump kicks');
function tailPumpDeg(t) {
  for (var i = 0; i < TAIL_KEYS.length - 1; i++) {
    var a = TAIL_KEYS[i], b = TAIL_KEYS[i + 1];
    if (t >= a[0] && t <= b[0]) {
      if (b[0] === a[0]) return b[1];
      // ease only inside a pump stroke, hold on the plateaus
      return lerp(a[1], b[1], smooth((t - a[0]) / (b[0] - a[0])));
    }
  }
  return 0;
}
// Spring-damped tremble: the summed impulse response of one
// kicked oscillator per pump keyframe. Damping is strong enough
// that the response is long gone before the loop wraps.
function tremble(t, freq, phase) {
  var v = 0;
  for (var i = 0; i < KICKS.length; i++) {
    var dt = t - KICKS[i];
    if (dt > 0) v += Math.exp(-3.0 * dt) * Math.sin(6.28318 * freq * dt + phase);
  }
  return v;
}

// ---- branch ----------------------------------------------------------
// Diagonal branch from lower left to upper right, upper-centre.
var BX0 = 240, BY0 = 470, BX1 = 1040, BY1 = 270;
function branchY(x) { return BY0 + (BY1 - BY0) * (x - BX0) / (BX1 - BX0); }

// Eucalyptus leaves on short twigs along the branch. Fields:
// branch parameter u, side (1 hangs below, -1 reaches above),
// length, tremble frequency, phase and gain, all seeded by hand.
var LEAVES = [
  { u: 0.05, side: 1, len: 74, f: 1.9, p: 0.0, g: 1.0 },
  { u: 0.11, side: -1, len: 62, f: 2.2, p: 1.3, g: 0.8 },
  { u: 0.18, side: 1, len: 86, f: 1.7, p: 2.1, g: 1.1 },
  { u: 0.26, side: 1, len: 68, f: 2.4, p: 0.6, g: 0.9 },
  { u: 0.33, side: -1, len: 58, f: 2.0, p: 2.8, g: 0.7 },
  { u: 0.62, side: -1, len: 64, f: 2.3, p: 1.8, g: 0.8 },
  { u: 0.70, side: 1, len: 80, f: 1.8, p: 0.4, g: 1.0 },
  { u: 0.78, side: -1, len: 60, f: 2.1, p: 2.5, g: 0.9 },
  { u: 0.85, side: 1, len: 88, f: 1.6, p: 1.1, g: 1.1 },
  { u: 0.91, side: 1, len: 70, f: 2.5, p: 3.0, g: 0.8 },
  { u: 0.97, side: -1, len: 56, f: 2.0, p: 0.9, g: 0.7 },
  { u: 0.99, side: 1, len: 64, f: 2.2, p: 2.2, g: 0.9 },
  { u: 0.45, side: 1, len: 60, f: 2.4, p: 1.6, g: 0.6 }
];
if (LEAVES.length !== 13) throw new Error('Wagtail Loop needs exactly 13 leaves');
var BRANCH_ANG = Math.atan2(BY1 - BY0, BX1 - BX0);
function drawLeaf(lf, t) {
  var bx = lerp(BX0, BX1, lf.u), by = lerp(BY0, BY1, lf.u);
  var twig = 26;
  var ta = BRANCH_ANG + lf.side * 1.15;
  var lx = bx + Math.cos(ta) * twig, ly = by + Math.sin(ta) * twig;
  var ang = BRANCH_ANG + lf.side * 1.85 + tremble(t, lf.f, lf.p) * 0.22 * lf.g;
  ctx.strokeStyle = WHITE; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(lx, ly); ctx.stroke();
  ctx.save();
  ctx.translate(lx, ly); ctx.rotate(ang);
  var L = lf.len, Wd = L * 0.26;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(L * 0.3, -Wd, L * 0.78, -Wd * 0.7, L, 0);
  ctx.bezierCurveTo(L * 0.78, Wd * 0.7, L * 0.3, Wd, 0, 0);
  ctx.closePath();
  ctx.fillStyle = SAGE; ctx.fill();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 2.2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(L - 6, 0);
  ctx.strokeStyle = WHITE; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.restore();
}
function drawBranch(t) {
  var i;
  for (i = 0; i < LEAVES.length; i++) drawLeaf(LEAVES[i], t);
  ctx.strokeStyle = WHITE; ctx.lineCap = 'round';
  ctx.lineWidth = 15;
  ctx.beginPath(); ctx.moveTo(BX0, BY0); ctx.lineTo(BX1, BY1); ctx.stroke();
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(BX0 + 8, BY0 - 6); ctx.lineTo(BX1 - 10, BY1 - 5); ctx.stroke();
  // short bark ticks along the lower edge
  ctx.lineWidth = 2.2;
  var ticks = [0.14, 0.30, 0.52, 0.74, 0.88];
  for (i = 0; i < ticks.length; i++) {
    var x = lerp(BX0, BX1, ticks[i]), y = lerp(BY0, BY1, ticks[i]);
    ctx.beginPath(); ctx.moveTo(x, y + 4); ctx.lineTo(x + 16, y); ctx.stroke();
  }
}

// ---- banksia pods ------------------------------------------------------
// One pod, centred at the origin: an ochre barrel with a spiky
// crown and rows of navy follicle pits edged in white.
function podShape(s) {
  ctx.save();
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.moveTo(-21, -26);
  ctx.bezierCurveTo(-27, -6, -26, 16, -15, 30);
  ctx.bezierCurveTo(-6, 39, 6, 39, 15, 30);
  ctx.bezierCurveTo(26, 16, 27, -6, 21, -26);
  ctx.closePath();
  ctx.fillStyle = OCHRE; ctx.fill();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 2.6; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-21, -26); ctx.lineTo(-14, -40); ctx.lineTo(-6, -28);
  ctx.lineTo(0, -43); ctx.lineTo(7, -29); ctx.lineTo(14, -41); ctx.lineTo(21, -26);
  ctx.closePath();
  ctx.fillStyle = OCHRE; ctx.fill();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.stroke();
  var rows = [-14, 0, 14, 26], i, j;
  ctx.fillStyle = NAVY;
  for (i = 0; i < rows.length; i++) {
    var n = i === 3 ? 2 : 3;
    for (j = 0; j < n; j++) {
      var px = (j - (n - 1) / 2) * 13 + (i % 2 ? 3 : -2);
      oval(px, rows[i], 4.2, 5.4); ctx.fill();
      ctx.strokeStyle = WHITE; ctx.lineWidth = 1.2; ctx.stroke();
    }
  }
  ctx.restore();
}
// Static specimen pods in the lower third: x, y, scale, rotation.
var PODS = [
  [168, 706, 1.00, -0.4], [306, 772, 1.15, 0.3], [452, 700, 0.85, 0.9],
  [566, 788, 1.05, -0.2], [706, 716, 0.90, 0.5], [836, 782, 1.10, -0.6],
  [972, 706, 0.95, 0.2], [1096, 772, 1.05, 1.1], [1048, 648, 0.72, -0.9],
  [212, 626, 0.70, 0.7]
];
if (PODS.length !== 10) throw new Error('Wagtail Loop needs exactly 10 static pods');
function drawPods() {
  for (var i = 0; i < PODS.length; i++) {
    ctx.save();
    ctx.translate(PODS[i][0], PODS[i][1]); ctx.rotate(PODS[i][3]);
    podShape(PODS[i][2]);
    ctx.restore();
    // a short specimen stem under each pod
    ctx.strokeStyle = WHITE; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(PODS[i][0], PODS[i][1] + 36 * PODS[i][2]);
    ctx.lineTo(PODS[i][0] + 8 * Math.sin(PODS[i][3]), PODS[i][1] + 52 * PODS[i][2]);
    ctx.stroke();
  }
}
// The one travelling pod. It hangs under the branch at rest, lets
// go at 8 seconds, drops to the pod field, rolls a short seeded
// distance to the right while turning, and fades out across the
// last second and a half of the roll window, gone by 11.5.
var DROP_X = 884, DROP_GROUND = 700;
function drawDropPod(t) {
  if (t >= 11.5) return;
  var x = DROP_X, y = branchY(DROP_X) + 58, rot = 0, alpha = 1;
  if (t >= 8) {
    var f = (t - 8) / 0.9;
    if (f < 1) {
      var e = f * f;
      y = lerp(branchY(DROP_X) + 58, DROP_GROUND, e);
      x = DROP_X + 10 * e;
      rot = 0.5 * e;
    } else {
      var r = clamp((t - 8.9) / 1.9, 0, 1);
      var re = smooth(r);
      x = DROP_X + 10 + 72 * re;
      y = DROP_GROUND - Math.sin(Math.min(1, (t - 8.9) / 0.35) * 3.14159) * 7 * (t < 9.25 ? 1 : 0);
      rot = 0.5 + 2.1 * re;
      if (t > 10.0) alpha = 1 - (t - 10.0) / 1.5;
    }
  }
  ctx.save();
  ctx.globalAlpha = clamp(alpha, 0, 1);
  if (t < 8) {
    ctx.strokeStyle = WHITE; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(DROP_X, branchY(DROP_X) + 4); ctx.lineTo(DROP_X, y - 38); ctx.stroke();
  }
  ctx.translate(x, y); ctx.rotate(rot);
  podShape(0.95);
  ctx.restore();
}

// ---- the wagtail -------------------------------------------------------
// Tail built from chained segments so the pump bends along its
// length. Segment angles follow the keyframe pump value, with a
// little more travel at the tip than at the base.
var TAIL_SEGS = 5, TAIL_SEG_LEN = 54;
if (TAIL_SEGS !== 5) throw new Error('Wagtail Loop tail needs exactly 5 segments');
function tailPoints(pumpDeg) {
  var baseA = -2.71; // cocked up and back, radians
  var pts = [[542, 288]];
  var a = baseA, x = 542, y = 288;
  for (var i = 0; i < TAIL_SEGS; i++) {
    var segA = baseA + pumpDeg * 0.01745 * (0.55 + 0.28 * i) - 0.05 * i;
    x += Math.cos(segA) * TAIL_SEG_LEN;
    y += Math.sin(segA) * TAIL_SEG_LEN;
    pts.push([x, y]);
    a = segA;
  }
  return pts;
}
function drawTail(pumpDeg) {
  var pts = tailPoints(pumpDeg);
  var i;
  // tapered ribbon through the chain points
  ctx.beginPath();
  for (i = 0; i < pts.length; i++) { if (i === 0) ctx.moveTo(pts[i][0], pts[i][1] - 13); else ctx.lineTo(pts[i][0], pts[i][1] - 11 + i * 1.2); }
  for (i = pts.length - 1; i >= 0; i--) ctx.lineTo(pts[i][0], pts[i][1] + 13 - i * 1.2);
  ctx.closePath();
  ctx.fillStyle = NAVY; ctx.fill();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 3.4; ctx.lineJoin = 'round'; ctx.stroke();
  // central shaft and two fine feather lines
  ctx.strokeStyle = WHITE; ctx.lineWidth = 2;
  ctx.beginPath();
  for (i = 0; i < pts.length; i++) { if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]); else ctx.lineTo(pts[i][0], pts[i][1]); }
  ctx.stroke();
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  for (i = 0; i < pts.length; i++) { if (i === 0) ctx.moveTo(pts[i][0], pts[i][1] - 6); else ctx.lineTo(pts[i][0], pts[i][1] - 6 + i * 0.6); }
  ctx.stroke();
  ctx.beginPath();
  for (i = 0; i < pts.length; i++) { if (i === 0) ctx.moveTo(pts[i][0], pts[i][1] + 6); else ctx.lineTo(pts[i][0], pts[i][1] + 6 - i * 0.6); }
  ctx.stroke();
  // white tip band across the last segment
  var p4 = pts[4], p5 = pts[5];
  ctx.strokeStyle = WHITE; ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(lerp(p4[0], p5[0], 0.45), lerp(p4[1], p5[1], 0.45) - 9);
  ctx.lineTo(lerp(p4[0], p5[0], 0.45), lerp(p4[1], p5[1], 0.45) + 9);
  ctx.stroke();
}
function drawBird(t) {
  var pump = tailPumpDeg(t);
  var bob = -pump * 0.55; // body rides against the tail, counter-phase
  ctx.save();
  ctx.translate(640, 368 + bob);
  ctx.rotate(-pump * 0.0022);
  ctx.translate(-640, -368 - bob);
  ctx.translate(0, bob);
  drawTail(pump);
  // legs and gripping feet, drawn before the body so the tops tuck in
  ctx.strokeStyle = WHITE; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(618, 338); ctx.lineTo(614, 366); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(664, 336); ctx.lineTo(668, 356); ctx.stroke();
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(600, branchY(614) + 2); ctx.lineTo(628, branchY(614) - 1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(654, branchY(668) - 1); ctx.lineTo(682, branchY(668) - 3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(614, 368); ctx.quadraticCurveTo(606, 378, 598, 376); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(668, 358); ctx.quadraticCurveTo(660, 368, 652, 366); ctx.stroke();
  // body: white belly first, then the dark back over the top
  ctx.save();
  ctx.translate(632, 300); ctx.rotate(-0.10);
  oval(0, 0, 98, 55);
  ctx.fillStyle = WHITE; ctx.fill();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 3.4; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-98, 2);
  ctx.bezierCurveTo(-80, -46, -20, -55, 30, -50);
  ctx.bezierCurveTo(72, -45, 96, -22, 98, 0);
  ctx.bezierCurveTo(50, -16, -40, -14, -98, 2);
  ctx.closePath();
  ctx.fillStyle = NAVY; ctx.fill();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 2.6; ctx.stroke();
  ctx.restore();
  // wing on the body side, dark with a white bar and feather lines
  ctx.beginPath();
  ctx.moveTo(566, 284);
  ctx.bezierCurveTo(596, 258, 664, 256, 692, 282);
  ctx.bezierCurveTo(668, 318, 600, 324, 572, 306);
  ctx.bezierCurveTo(562, 298, 562, 292, 566, 284);
  ctx.closePath();
  ctx.fillStyle = NAVY; ctx.fill();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 3; ctx.stroke();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(584, 292); ctx.bezierCurveTo(620, 280, 656, 280, 682, 290); ctx.stroke();
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(590, 306); ctx.bezierCurveTo(620, 298, 650, 298, 672, 304); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(600, 316); ctx.bezierCurveTo(624, 310, 646, 310, 660, 314); ctx.stroke();
  // head: white face, dark cap and bib, fine pointed beak
  oval(722, 246, 41, 39);
  ctx.fillStyle = WHITE; ctx.fill();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 3.2; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(684, 232);
  ctx.bezierCurveTo(690, 206, 712, 207, 722, 207);
  ctx.bezierCurveTo(748, 207, 762, 222, 761, 240);
  ctx.bezierCurveTo(736, 228, 706, 228, 684, 232);
  ctx.closePath();
  ctx.fillStyle = NAVY; ctx.fill();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 2.4; ctx.stroke();
  // bib under the beak
  ctx.beginPath();
  ctx.moveTo(700, 272);
  ctx.bezierCurveTo(716, 262, 744, 262, 756, 274);
  ctx.bezierCurveTo(748, 292, 706, 294, 700, 272);
  ctx.closePath();
  ctx.fillStyle = NAVY; ctx.fill();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 2.2; ctx.stroke();
  // beak
  ctx.beginPath();
  ctx.moveTo(756, 240); ctx.lineTo(800, 250); ctx.lineTo(756, 258);
  ctx.closePath();
  ctx.fillStyle = WHITE; ctx.fill();
  ctx.strokeStyle = WHITE; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(758, 249); ctx.lineTo(794, 250);
  ctx.strokeStyle = NAVY; ctx.lineWidth = 1.6; ctx.stroke();
  // eye on the white face, with a fine brow line
  oval(730, 244, 6.5, 7.5); ctx.fillStyle = NAVY; ctx.fill();
  oval(732, 241, 2.2, 2.6); ctx.fillStyle = WHITE; ctx.fill();
  ctx.strokeStyle = NAVY; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(712, 234); ctx.quadraticCurveTo(730, 228, 748, 235); ctx.stroke();
  ctx.restore();
}

function draw() {
  var t = T % LOOP;
  ctx.fillStyle = NAVY;
  ctx.fillRect(0, 0, DW, DH);
  drawPods();
  drawBranch(t);
  drawDropPod(t);
  drawBird(t);
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = NAVY;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
