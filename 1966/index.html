<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1966 Worn Loops</title>
<style>
  html, body { margin: 0; padding: 0; background: #e7e3d8; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Worn Loops, CW7 / PP1213, study #256 caius-williams.
  // A near-white scanned sketch: faint hand-drawn grids, small
  // loops, and one long looping diagonal line wandering across
  // the sheet, after the 'Worn' release art. The marks are
  // alive: the long line redraws itself endlessly, loops form
  // and dissolve, the grid breathes. The score handles itself.
  // Drag the long line: take hold of it and redirect its
  // wandering path; release and it resumes its own looping
  // logic. Handling the score is the interaction, per the
  // sketch-as-score. No grid-perfect geometry, no plotter-clean
  // lines; the line looks hand-drawn at every moment.
  var PAPER = '#f8f6f1';   // paper near-white
  var PENCIL = '#8f8f86';  // pencil gray
  var GRID = '#a9a9a0';    // faint grid gray
  var GRAPHITE = '#4c4c48'; // the long line, soft graphite
  var SOFT = '#6e6e68';    // soft graphite, secondary marks
  var LOOPC = '#75756c';   // loop gray
  var EDGE = '#b7b2a4';    // paper edge
  var INK = '#2b2b28';     // caption ink
  var GRAY = '#6f6f68';    // caption gray
  var TAU = Math.PI * 2;

  // Fixed-phase first frame: FIRST_T = 10 s. The wandering path
  // is a pure function of t, so at t = 10 the sheet already
  // carries a 45 s trail behind the head, two loops mid-life,
  // and a breathing grid: a lived-in sketch, never random.
  var FIRST_T = 10;
  var SEED = 1966;
  var TRAIL = 45; // seconds of path history drawn behind the head

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // ?drag=x,y (or @x,y inside the seed value, e.g.
  // ?seed=10@400,300) holds the long line toward stage point
  // (x, y) at load, so a drag probe can be rendered
  // deterministically. Read at load only.
  var probeT = null;
  var probeDrag = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
    var md = qs.match(/drag=([0-9.]+),([0-9.]+)/) || qs.match(/@([0-9.]+),([0-9.]+)/);
    if (md) { probeDrag = { x: parseFloat(md[1]), y: parseFloat(md[2]) }; }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and fixed salts, so every frame is a pure
  // function of t and the drag state.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  // Drag state: the pointer the line is being pulled toward.
  // ended is the release time; after release the pull decays
  // over ~3 s and the line resumes its own wandering logic.
  // A probe drag is a pointer held at the probe point.
  var drag = null;
  if (probeDrag) { drag = { x: probeDrag.x, y: probeDrag.y, ended: null }; }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  var L = {};
  function layout() {
    var u = Math.min(W, H);
    L.u = u;
    L.m = u * 0.055; // grid inset from the sheet edge
    L.edge = u * 0.028; // wobbly paper edge inset
    L.sideX = Math.max(14, W * 0.045);
    // Loops: seeded fractions of the sheet, fixed births on a
    // 45 s cycle so frame one already shows two mid-life loops.
    var rng = mulberry32(SEED * 31 + 7);
    var births = [1, 5, 8, 13, 19];
    var i;
    L.loops = [];
    for (i = 0; i < 5; i++) {
      L.loops.push({
        fx: 0.24 + rng() * 0.52,
        fy: 0.26 + rng() * 0.48,
        fR: 0.045 + rng() * 0.05,
        birth: births[i],
        p1: rng() * TAU,
        p2: rng() * TAU,
        p3: rng() * TAU
      });
    }
    // Grid wobble phases, one per line, seeded once.
    var grng = mulberry32(SEED * 17 + 3);
    L.gridPhase = [];
    for (i = 0; i < 9; i++) { L.gridPhase.push(grng() * TAU); }
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- The wandering path --------------------------------------
  // The head roams the sheet as a pure function of t: a slow
  // diagonal sweep (140 s period) plus faster wandering sines,
  // so the line reads as one long looping diagonal that never
  // sits still. No Math.random anywhere; same t, same line.
  function pathAt(t) {
    var s = 0.5 + 0.42 * Math.sin(TAU * t / 140 + 0.9);
    var x = W * (0.08 + 0.84 * s)
          + W * 0.07 * Math.sin(TAU * t / 31 + 2.0)
          + W * 0.03 * Math.sin(TAU * t / 17 + 5.0);
    var y = H * (0.16 + 0.70 * s)
          + H * 0.06 * Math.sin(TAU * t / 27 + 0.6)
          + H * 0.03 * Math.sin(TAU * t / 13 + 3.3);
    return { x: x, y: y };
  }

  // The drag pull vector at time t: the head is drawn 85% of
  // the way toward the pointer, the pull decaying along the
  // trail with a 6 s constant and, after release, over ~3 s.
  // Clamped so a wild drag never tears the line off the sheet.
  function dragVector(t, head) {
    if (!drag) { return null; }
    var decay = 1;
    if (drag.ended !== null && drag.ended !== undefined) {
      decay = Math.exp(-(t - drag.ended) / 3);
      if (decay < 0.01) { drag = null; return null; }
    }
    var vx = (drag.x - head.x) * 0.85 * decay;
    var vy = (drag.y - head.y) * 0.85 * decay;
    var mag = Math.sqrt(vx * vx + vy * vy);
    var cap = L.u * 0.4;
    if (mag > cap) { vx *= cap / mag; vy *= cap / mag; }
    return { x: vx, y: vy };
  }

  // Hand-drawn wobble: small deterministic sinusoidal jitter
  // perpendicular to the path, so the line never reads
  // plotter-clean.
  function wobble(t, u) {
    return (2.2 * Math.sin(TAU * t / 1.7 + 1.2) + 1.1 * Math.sin(TAU * t / 0.9 + 0.4)) * (u / 720);
  }

  // ---- Grid ----------------------------------------------------
  // Faint hand-drawn grid: each line a polyline with a slight
  // uneven wobble, alpha breathing slowly per line.
  function drawGrid(t) {
    var m = L.m, i, j, x, y;
    var span = W - 2 * m, hspan = H - 2 * m;
    var segs = 10;
    ctx.lineWidth = 1;
    for (i = 0; i < 9; i++) {
      var gx = m + (span * i) / 8;
      var ph = L.gridPhase[i];
      var al = 0.045 + 0.02 * Math.sin(TAU * t / 26 + i * 0.9);
      ctx.strokeStyle = hexA(GRID, a4(al));
      ctx.beginPath();
      for (j = 0; j <= segs; j++) {
        var gy = m + (hspan * j) / segs;
        var wob = 1.2 * Math.sin((j / segs) * TAU * 2 + ph) * (L.u / 720);
        if (j === 0) { ctx.moveTo(gx + wob, gy); } else { ctx.lineTo(gx + wob, gy); }
      }
      ctx.stroke();
      var hy = m + (hspan * i) / 8;
      var al2 = 0.045 + 0.02 * Math.sin(TAU * t / 26 + i * 1.3 + 2);
      ctx.strokeStyle = hexA(GRID, a4(al2));
      ctx.beginPath();
      for (j = 0; j <= segs; j++) {
        var hx = m + (span * j) / segs;
        var wob2 = 1.2 * Math.sin((j / segs) * TAU * 2 + ph + 1.1) * (L.u / 720);
        if (j === 0) { ctx.moveTo(hx, hy + wob2); } else { ctx.lineTo(hx, hy + wob2); }
      }
      ctx.stroke();
    }
  }

  // ---- Loops ---------------------------------------------------
  // Small imperfect ovals: a polyline ring whose radius wobbles
  // with seeded sines, so no loop is ever a clean ellipse.
  // Each loop forms over 2 s, holds, and dissolves over its
  // last 2 s of a 7 s life, on a 45 s cycle.
  function drawLoops(t) {
    var i, k;
    for (i = 0; i < L.loops.length; i++) {
      var lp = L.loops[i];
      var age = ((t - lp.birth) % 45 + 45) % 45;
      if (age > 7) { continue; }
      var env = 1;
      if (age < 2) { env = age / 2; } else if (age > 5) { env = (7 - age) / 2; }
      if (env <= 0.01) { continue; }
      var cx = lp.fx * W, cy = lp.fy * H, R = lp.fR * L.u;
      ctx.strokeStyle = hexA(LOOPC, a4(0.5 * env));
      ctx.lineWidth = Math.max(1, L.u * 0.0022);
      ctx.beginPath();
      var N = 44;
      for (k = 0; k <= N; k++) {
        var a = (k / N) * TAU;
        var r = R * (1 + 0.06 * Math.sin(3 * a + lp.p1) + 0.04 * Math.sin(7 * a + lp.p2));
        var px = cx + Math.cos(a) * r * 1.15 + 1.5 * Math.sin(a * 2 + lp.p3) * (L.u / 720);
        var py = cy + Math.sin(a) * r * 0.9;
        if (k === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
      }
      ctx.stroke();
    }
  }

  // ---- The long line -------------------------------------------
  // The trail is the path's last 45 s, drawn in short chunks
  // with alpha and width rising toward the head: the line
  // redraws itself endlessly and the head is always the
  // freshest, darkest graphite. Drag shifts recent samples
  // toward the pointer, oldest samples barely moving.
  function drawLine(t) {
    var head = pathAt(t);
    var V = dragVector(t, head);
    var step = 0.12;
    var n = Math.round(TRAIL / step);
    var i, j;
    var pts = [];
    for (i = 0; i <= n; i++) {
      var tt = t - TRAIL + i * step;
      var p = pathAt(tt);
      var x = p.x, y = p.y;
      if (V) {
        var f = Math.exp(-(t - tt) / 6);
        x += V.x * f; y += V.y * f;
      }
      pts.push({ x: x, y: y, tt: tt });
    }
    // Wobble perpendicular to the local direction.
    for (i = 0; i < pts.length; i++) {
      var a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      var dx = b.x - a.x, dy = b.y - a.y;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var w = wobble(pts[i].tt, L.u);
      pts[i].x += (-dy / len) * w;
      pts[i].y += (dx / len) * w;
    }
    var chunk = 5;
    for (i = 0; i < pts.length - 1; i += chunk) {
      var mid = pts[Math.min(pts.length - 1, i + Math.floor(chunk / 2))];
      var age = t - mid.tt;
      var fresh = 1 - age / TRAIL;
      var al = 0.08 + 0.78 * Math.pow(fresh, 1.4);
      ctx.strokeStyle = hexA(GRAPHITE, a4(al));
      ctx.lineWidth = Math.max(1, L.u * 0.0028 * (0.55 + 0.45 * fresh));
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(pts[i].x, pts[i].y);
      for (j = 1; j <= chunk && i + j < pts.length; j++) {
        ctx.lineTo(pts[i + j].x, pts[i + j].y);
      }
      ctx.stroke();
    }
    // The pen: a small graphite dot where the head is now.
    var hx = head.x, hy = head.y;
    if (V) { hx += V.x; hy += V.y; }
    var hr = Math.max(1.6, L.u * 0.0042);
    ctx.fillStyle = hexA(GRAPHITE, a4(0.85));
    ctx.beginPath();
    ctx.moveTo(hx + hr, hy);
    ctx.arc(hx, hy, hr, 0, TAU);
    ctx.fill();
  }

  // Wobbly paper edge: a hand-drawn hairline frame inset from
  // the sheet edge, never a straight plotter rectangle.
  function drawEdge() {
    var e = L.edge, segs = 16, i;
    ctx.strokeStyle = hexA(EDGE, a4(0.5));
    ctx.lineWidth = 1;
    ctx.beginPath();
    var corners = [
      [e, e, W - e, e], [W - e, e, W - e, H - e],
      [W - e, H - e, e, H - e], [e, H - e, e, e]
    ];
    for (var c = 0; c < 4; c++) {
      var x0 = corners[c][0], y0 = corners[c][1], x1 = corners[c][2], y1 = corners[c][3];
      for (i = 0; i <= segs; i++) {
        var s = i / segs;
        var px = x0 + (x1 - x0) * s + 1.1 * Math.sin(s * TAU * 3 + c * 2.4) * (L.u / 720);
        var py = y0 + (y1 - y0) * s + 1.1 * Math.sin(s * TAU * 3 + c * 1.7) * (L.u / 720);
        if (c === 0 && i === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
      }
    }
    ctx.stroke();
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    // Paper near-white ground.
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    drawGrid(t);
    drawLoops(t);
    drawLine(t);
    drawEdge();

    // ---- Vertical side text along the left.
    var fsSide = Math.round(12 * clamp(W / 560, 0.85, 1.1));
    ctx.save();
    ctx.translate(L.sideX + 2, H * 0.82);
    ctx.rotate(-Math.PI / 2);
    ctx.font = '600 ' + fsSide + 'px Georgia, "Times New Roman", serif';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = hexA(INK, a4(0.55));
    ctx.fillText('W O R N   L O O P S', 0, 0);
    ctx.font = fsSide + 'px Georgia, "Times New Roman", serif';
    ctx.fillStyle = hexA(GRAY, a4(0.55));
    ctx.fillText('C W 7   ·   P P 1 2 1 3', 0, fsSide + 7);
    ctx.restore();

    // ---- Plates: title top-left, number and date below it.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Worn Loops', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(GRAY, a4(0.9));
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1966 · 2007 · 05 · 31', 18, 18 + fsTitle * 0.8 + fsSub + 8);

    // ---- Hint, centered at the bottom, ink on a faint paper
    // pill so it stays legible over the sheet.
    var hint = 'Drag the long line to redirect it.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(INK, a4(0.05));
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = hexA(INK, a4(0.2));
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
    ctx.fillStyle = hexA(INK, a4(0.9));
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  // Drag is the redirect, not a reseed: pointer down takes hold
  // of the long line, pointer move pulls its head toward the
  // pointer, pointer up releases it and the pull decays over
  // ~3 s while the line resumes its own wandering logic.
  function posFromEvent(e) {
    var cx = (e.clientX !== undefined) ? e.clientX : 0;
    var cy = (e.clientY !== undefined) ? e.clientY : 0;
    return { x: cx - stageX, y: cy - stageY };
  }
  function onDown(e) {
    var p = posFromEvent(e);
    drag = { x: p.x, y: p.y, ended: null };
    draw(lastT);
    if (e.preventDefault) { e.preventDefault(); }
  }
  function onMove(e) {
    if (!drag || drag.ended !== null) { return; }
    var p = posFromEvent(e);
    drag.x = p.x; drag.y = p.y;
    draw(lastT);
  }
  function onUp() {
    if (drag && drag.ended === null) { drag.ended = lastT; }
    draw(lastT);
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1966 exposes the drag state and first frame.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1966 = {
      drag: function (x, y) { drag = { x: x, y: y, ended: null }; return true; },
      release: function () { if (drag) { drag.ended = lastT; } return true; },
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the head wanders on multi-second timescales,
  // loops form and dissolve over seconds, the grid breathes
  // over ~26 s, all well under the 14 Hz ceiling. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
