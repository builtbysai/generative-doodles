<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blake in Three Colours</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e2d4; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1434000);

  // Static speckle, seeded once.
  var SPECKS = [];
  for (var i = 0; i < 90; i++) {
    SPECKS.push([rnd(), rnd(), 0.5 + rnd() * 1.5]);
  }

  var PARCH = '#e8e2d4';
  var SHADOW = '#141210';
  var LAYERS = [
    { name: 'red',    color: '#c01818', bx: -0.030, by: -0.020 },
    { name: 'yellow', color: '#e8c832', bx:  0.030, by: -0.016 },
    { name: 'blue',   color: '#1a4a8a', bx:  0.000, by:  0.030 }
  ];

  // Combination sequencer: [layers on, hold seconds].
  // Singles held only ~1.2 s (a beat); pairs and the triple held longer.
  var SEQ = [
    { on: [0, 1, 2], hold: 4.8 },
    { on: [0, 1],    hold: 3.6 },
    { on: [0],       hold: 1.2 },
    { on: [1, 2],    hold: 3.6 },
    { on: [1],       hold: 1.2 },
    { on: [0, 2],    hold: 3.6 },
    { on: [2],       hold: 1.2 },
    { on: [0, 1, 2], hold: 4.8 }
  ];
  var LOOP = 0;
  for (var s = 0; s < SEQ.length; s++) LOOP += SEQ[s].hold;
  var FADE = 0.8;

  function smooth(x) { return x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x); }

  // Layer visibility weights at time t, crossfaded over FADE at each boundary.
  function weightsAt(t) {
    var tt = ((t % LOOP) + LOOP) % LOOP;
    var acc = 0, idx = 0;
    for (var k = 0; k < SEQ.length; k++) {
      if (tt < acc + SEQ[k].hold) { idx = k; break; }
      acc += SEQ[k].hold;
    }
    var prev = (idx + SEQ.length - 1) % SEQ.length;
    var into = tt - acc;
    var f = smooth(into / FADE);
    var w = [0, 0, 0];
    for (var li = 0; li < 3; li++) {
      var was = SEQ[prev].on.indexOf(li) >= 0 ? 1 : 0;
      var now = SEQ[idx].on.indexOf(li) >= 0 ? 1 : 0;
      w[li] = was + (now - was) * f;
    }
    return w;
  }

  // Drag state: closed-form over the recorded event list.
  var drags = []; // {layer, dx, dy, t0, t1}
  var active = null;

  function layerOffset(li, t, W, H) {
    var L = LAYERS[li];
    var m = Math.min(W, H);
    var ox = L.bx * m, oy = L.by * m;
    for (var d = 0; d < drags.length; d++) {
      var g = drags[d];
      if (g.layer !== li) continue;
      if (t <= g.t1) {
        if (g.t0 <= t) { ox += g.dx; oy += g.dy; }
      } else {
        var dec = Math.exp(-(t - g.t1) / 4);
        ox += g.dx * dec; oy += g.dy * dec;
      }
    }
    if (active && active.layer === li) { ox += active.dx; oy += active.dy; }
    var cap = 0.06 * m;
    if (ox > cap) ox = cap; if (ox < -cap) ox = -cap;
    if (oy > cap) oy = cap; if (oy < -cap) oy = -cap;
    return [ox, oy];
  }

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    return [w, h];
  }
  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    var wh = size();
    return wh[1] > wh[0] * 1.15;
  }

  function round4(x) { return Math.round(x * 10000) / 10000; }

  function dot(x, y, r, color, a) {
    ctx.beginPath();
    ctx.fillStyle = color;
    ctx.globalAlpha = round4(a);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  function rect(x, y, w, h, color, a) {
    ctx.fillStyle = color;
    ctx.globalAlpha = round4(a);
    ctx.fillRect(x, y, w, h);
    ctx.globalAlpha = 1;
  }
  function poly(pts, color, a) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.globalAlpha = round4(a);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  function line(x1, y1, x2, y2, color, a, wd) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.globalAlpha = round4(a);
    ctx.lineWidth = wd;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // One procedural Last Judgment motif, drawn in a single colour at an offset.
  // The figures themselves never move; only layer weights and offsets change.
  function drawMotif(color, ox, oy, a, W, H) {
    var cx = W / 2 + ox, cy = H * 0.46 + oy;
    var u = Math.min(W, H) / 720;
    ctx.save();
    ctx.globalAlpha = 1;
    // Radiant halo rays behind the judge.
    for (var r = 0; r < 24; r++) {
      var ang = -Math.PI / 2 + (r - 11.5) * 0.11;
      var len = (150 + ((r * 37) % 60)) * u;
      line(cx, cy - 150 * u,
        cx + Math.cos(ang) * len, cy - 150 * u + Math.sin(ang) * len,
        color, a * 0.55, 2.5 * u);
    }
    // Halo ring.
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.globalAlpha = round4(a * 0.9);
    ctx.lineWidth = 3 * u;
    ctx.arc(cx, cy - 150 * u, 34 * u, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // Judge: head, robe drawn as outline + folds only (a solid robe would
    // triple-overlap into muddy brown; line work keeps the interference
    // in clean orange/violet/green), raised arms.
    dot(cx, cy - 150 * u, 22 * u, color, a);
    line(cx - 52 * u, cy + 110 * u, cx + 52 * u, cy + 110 * u, color, a * 0.9, 6 * u);
    line(cx + 52 * u, cy + 110 * u, cx + 26 * u, cy - 118 * u, color, a * 0.9, 6 * u);
    line(cx + 26 * u, cy - 118 * u, cx - 26 * u, cy - 118 * u, color, a * 0.9, 6 * u);
    line(cx - 26 * u, cy - 118 * u, cx - 52 * u, cy + 110 * u, color, a * 0.9, 6 * u);
    line(cx - 18 * u, cy + 110 * u, cx - 10 * u, cy - 100 * u, color, a * 0.6, 3 * u);
    line(cx + 18 * u, cy + 110 * u, cx + 10 * u, cy - 100 * u, color, a * 0.6, 3 * u);
    poly([[cx - 26 * u, cy - 100 * u], [cx - 110 * u, cy - 170 * u],
          [cx - 96 * u, cy - 140 * u], [cx - 20 * u, cy - 70 * u]], color, a);
    poly([[cx + 26 * u, cy - 100 * u], [cx + 110 * u, cy - 170 * u],
          [cx + 96 * u, cy - 140 * u], [cx + 20 * u, cy - 70 * u]], color, a);
    // Tumbling figures: head dot + body bar, fixed angles.
    var tumb = [
      [-190, -60, -0.9], [200, -40, 0.8], [-150, 90, -2.2],
      [170, 110, 2.4], [-60, -230, 0.4], [90, -210, -0.5]
    ];
    for (var ti = 0; ti < tumb.length; ti++) {
      var tx = cx + tumb[ti][0] * u, ty = cy + tumb[ti][1] * u, ta = tumb[ti][2];
      var c = Math.cos(ta), s2 = Math.sin(ta);
      dot(tx, ty, 10 * u, color, a * 0.9);
      line(tx, ty, tx + c * 52 * u, ty + s2 * 52 * u, color, a * 0.8, 7 * u);
      line(tx + c * 52 * u, ty + s2 * 52 * u,
        tx + c * 52 * u - s2 * 18 * u, ty + s2 * 52 * u + c * 18 * u, color, a * 0.8, 4 * u);
      line(tx + c * 52 * u, ty + s2 * 52 * u,
        tx + c * 52 * u + s2 * 18 * u, ty + s2 * 52 * u - c * 18 * u, color, a * 0.8, 4 * u);
    }
    // Descending hosts: winged figures above the judge.
    var hosts = [[-260, -260], [260, -260], [-320, -120], [320, -120]];
    for (var hi = 0; hi < hosts.length; hi++) {
      var hx = cx + hosts[hi][0] * u, hy = cy + hosts[hi][1] * u;
      poly([[hx - 34 * u, hy], [hx, hy - 12 * u], [hx + 34 * u, hy],
            [hx, hy + 12 * u]], color, a * 0.7);
      dot(hx, hy, 8 * u, color, a * 0.9);
    }
    // Cloud / ground band the figures fall toward.
    for (var ci = 0; ci < 9; ci++) {
      var gx = cx - 300 * u + ci * 75 * u;
      dot(gx, cy + 190 * u + ((ci * 13) % 17) * u, 26 * u, color, a * 0.35);
    }
    ctx.restore();
  }

  function draw(t) {
    var wh = size();
    var W = wh[0], H = wh[1];
    if (canvas.width !== W) canvas.width = W;
    if (canvas.height !== H) canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (typeof document !== 'undefined' && document.body) {
      document.body.style.background = PARCH;
    }
    ctx.clearRect(0, 0, W, H);
    rect(0, 0, W, H, PARCH, 1);
    // Seeded speckle on the ground.
    for (var i = 0; i < SPECKS.length; i++) {
      var sp = SPECKS[i];
      rect(sp[0] * W, sp[1] * H, sp[2], sp[2], SHADOW, 0.05);
    }
    var w = weightsAt(t);
    for (var li = 0; li < 3; li++) {
      if (w[li] <= 0.001) continue;
      var off = layerOffset(li, t, W, H);
      drawMotif(LAYERS[li].color, off[0], off[1], 0.55 * w[li], W, H);
    }
    // Thin shadow frame, so the scene sits on the page.
    ctx.beginPath();
    ctx.strokeStyle = SHADOW;
    ctx.globalAlpha = 0.25;
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, W - 2, H - 2);
    ctx.globalAlpha = 1;
  }

  // Pointer: pick the layer whose motif centre is nearest the pointer,
  // then drag shifts that layer's registration; it decays back on release.
  function pos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return [e.clientX - r.left, e.clientY - r.top];
  }
  function pickLayer(x, y, t) {
    var wh = size();
    var best = 0, bestD = 1e18;
    for (var li = 0; li < 3; li++) {
      var off = layerOffset(li, t, wh[0], wh[1]);
      var dx = x - (wh[0] / 2 + off[0]);
      var dy = y - (wh[1] * 0.46 + off[1]);
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = li; }
    }
    return best;
  }
  var clockStart = null;
  function now() {
    return clockStart === null ? 0 : (Date.now() - clockStart) / 1000;
  }
  function onDown(e) {
    var p = pos(e);
    var t = now();
    active = { layer: pickLayer(p[0], p[1], t), x0: p[0], y0: p[1], dx: 0, dy: 0, t0: t };
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!active) return;
    var p = pos(e);
    active.dx = p[0] - active.x0;
    active.dy = p[1] - active.y0;
  }
  function onUp(e) {
    if (!active) return;
    var t = now();
    drags.push({ layer: active.layer, dx: active.dx, dy: active.dy, t0: active.t0, t1: t });
    if (drags.length > 24) drags.shift();
    active = null;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { draw(now()); });
    }
    window.addEventListener('resize', function () { draw(now()); });
  }

  // Frame one is a constant phase; the clock starts only with the rAF loop.
  draw(0);
  function loop() {
    if (clockStart === null) clockStart = Date.now();
    draw(now());
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
