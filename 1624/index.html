<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rippling</title>
<style>
html, body { margin: 0; padding: 0; background: #0C0C0C; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var WATER = '#0C0C0C';
var RING = 218;
var STREAK = 74;
var SPATTER = 139;
var PHASE = 1.0;
var SEED = 1624007;
var RATE = 9;
var T_START = -10;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gray(v, a) {
  return 'rgba(' + v + ',' + v + ',' + v + ',' + a.toFixed(4) + ')';
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
  buildSky();
}
/* Portrait field: the pond fills the frame edge to edge on every screen. */
function compRect() {
  return { x: 0, y: 0, w: VW, h: VH };
}

/* ---- seeded rain: Poisson drop schedule, generated on demand ---- */
var rainRng = mulberry32(SEED);
var nextDropT = T_START;
var drops = [];
function genDrop(t0, x, y) {
  return {
    x: (x !== undefined) ? x : rainRng() * VW,
    y: (y !== undefined) ? y : rainRng() * VH,
    t0: t0,
    n: 4 + Math.floor(rainRng() * 3),
    speed: 40 + rainRng() * 22,
    maxR: 180 + rainRng() * 140,
    baseA: 0.45 + rainRng() * 0.35
  };
}
function ensureDrops(t) {
  while (nextDropT <= t) {
    drops.push(genDrop(nextDropT));
    nextDropT += -Math.log(1 - rainRng()) / RATE;
  }
  /* Prune drops whose last ring has fully faded; they can never draw again. */
  var i, keep = [];
  for (i = 0; i < drops.length; i++) {
    if (t - drops[i].t0 < 10) keep.push(drops[i]);
  }
  drops = keep;
}

/* ---- rain streaks (upper frame) and edge spatter, seeded per size ---- */
var streaks = [], spatters = [];
function buildSky() {
  var rng = mulberry32(SEED + 55);
  var i, s;
  streaks = [];
  for (i = 0; i < 56; i++) {
    var len = 14 + rng() * 20;
    streaks.push({
      x: rng() * VW, y0: rng() * VH * 0.42,
      len: len, dx: len * 0.28,
      fall: 50 + rng() * 60,
      a: 0.14 + rng() * 0.18
    });
  }
  spatters = [];
  for (i = 0; i < 70; i++) {
    var edge = Math.floor(rng() * 4);
    var px, py, m = 0.07;
    if (edge === 0) { px = rng() * VW; py = rng() * VH * m; }
    else if (edge === 1) { px = rng() * VW; py = VH - rng() * VH * m; }
    else if (edge === 2) { px = rng() * VW * m; py = rng() * VH; }
    else { px = VW - rng() * VW * m; py = rng() * VH; }
    spatters.push({ x: px, y: py, r: 0.6 + rng() * 1.3, a: 0.12 + rng() * 0.26 });
  }
}

/* ---- press and hold: the pointer is a storm cell ---- */
var stormRng = mulberry32(SEED + 101);
var pointer = { down: false, x: 0, y: 0, lastSpawn: -1e9 };
function pointerPos(e) {
  var x = 0, y = 0;
  if (typeof e.clientX === 'number') { x = e.clientX; y = e.clientY; }
  if (canvas.getBoundingClientRect) {
    try {
      var r = canvas.getBoundingClientRect();
      x -= r.left; y -= r.top;
    } catch (err) { /* canvas is full-viewport; client coords already match */ }
  }
  return { x: x, y: y };
}
function onDown(e) {
  var p = pointerPos(e);
  pointer.down = true; pointer.x = p.x; pointer.y = p.y;
  pointer.lastSpawn = lastT - 0.06;
  if (reduced) {
    /* Static frame: drop a burst whose rings are already mid-flight. */
    var i;
    for (i = 0; i < 8; i++) {
      drops.push(genDrop(lastT - 0.15 - i * 0.1,
        p.x + (stormRng() - 0.5) * 28, p.y + (stormRng() - 0.5) * 28));
    }
    draw(lastT);
  }
}
function onMove(e) {
  if (!pointer.down) return;
  var p = pointerPos(e);
  pointer.x = p.x; pointer.y = p.y;
}
function onUp() { pointer.down = false; }
function spawnStorm(t) {
  while (pointer.down && pointer.lastSpawn + 0.055 <= t) {
    pointer.lastSpawn += 0.055;
    drops.push(genDrop(pointer.lastSpawn,
      pointer.x + (stormRng() - 0.5) * 28,
      pointer.y + (stormRng() - 0.5) * 28));
  }
}

function drawDrop(d, t) {
  var i, age, r, a;
  for (i = 0; i < d.n; i++) {
    age = t - (d.t0 + i * 0.13);
    if (age <= 0) continue;
    r = age * d.speed;
    if (r > d.maxR) continue;
    a = d.baseA * (1 - r / d.maxR) * clamp(age / 0.12, 0, 1);
    if (a <= 0.004) continue;
    ctx.strokeStyle = gray(RING, a);
    ctx.lineWidth = Math.max(0.8, 1.5 * (1 - (r / d.maxR) * 0.5));
    ctx.beginPath();
    ctx.moveTo(d.x + r, d.y);
    ctx.arc(d.x, d.y, r, 0, TAU);
    ctx.stroke();
  }
}
function draw(t) {
  lastT = t;
  size();
  var rect = compRect();
  ctx.fillStyle = WATER;
  ctx.fillRect(0, 0, VW, VH);
  ensureDrops(t);
  spawnStorm(t);
  var titlePx = isPhone ? 16 : 18;
  var smallPx = isPhone ? 11 : 12;
  /* Rain streaks slant across the upper frame, falling and wrapping. */
  var upperH = VH * 0.42;
  var i, s;
  ctx.lineCap = 'round';
  for (i = 0; i < streaks.length; i++) {
    s = streaks[i];
    var sy = (s.y0 + t * s.fall) % upperH;
    ctx.strokeStyle = gray(STREAK, s.a);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(s.x, sy);
    ctx.lineTo(s.x + s.dx, sy + s.len);
    ctx.stroke();
  }
  /* Spatter peppering the edges. */
  for (i = 0; i < spatters.length; i++) {
    s = spatters[i];
    ctx.fillStyle = gray(SPATTER, s.a);
    ctx.beginPath();
    ctx.moveTo(s.x + s.r, s.y);
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }
  /* Rings, drawn with lighter blending: interference emerges where they
     overlap, and older rings fade as new ones arrive. */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (i = 0; i < drops.length; i++) drawDrop(drops[i], t);
  ctx.restore();
  /* Title, date, hint: light grey on the dark water, no UI. Each line is
     first stroked in the water colour, a halo that clears any bright ring
     crossing behind the glyphs, then filled. */
  var titleY = isPhone ? 18 : 26;
  var dateY = titleY + titlePx + 6;
  var hintY = VH - smallPx - (isPhone ? 14 : 20);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.strokeStyle = WATER;
  ctx.lineWidth = 5;
  ctx.lineJoin = 'round';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.strokeText('Rippling', rect.x + rect.w / 2, titleY);
  ctx.fillStyle = gray(RING, 0.92);
  ctx.fillText('Rippling', rect.x + rect.w / 2, titleY);
  ctx.font = smallPx + 'px monospace';
  ctx.strokeText('2006 · 06 · 23', rect.x + rect.w / 2, dateY);
  ctx.fillStyle = gray(RING, 0.60);
  ctx.fillText('2006 · 06 · 23', rect.x + rect.w / 2, dateY);
  ctx.strokeText('Press and hold to call the rain.', rect.x + rect.w / 2, hintY);
  ctx.fillStyle = gray(RING, 0.66);
  ctx.fillText('Press and hold to call the rain.', rect.x + rect.w / 2, hintY);
}
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('pointerleave', onUp);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
