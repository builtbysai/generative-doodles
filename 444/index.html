<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gilded Object</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1E3A6E; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---- palette (from the prompt) ----
  var PAGE = '#1E3A6E';
  var CARD = '#E8E2D4';
  var ARCH = '#D9C9B4';
  var ARCH_EDGE = '#C4AE8D';
  var ACCENT = '#C75B2B';
  var VINE = '#7BA05B';
  var VINE_DARK = '#5C7D42';
  var POM = '#A02838';
  var MOON = '#F5F0DC';
  var CREAM = '#F2ECDC';
  var GOLD = '#C89B3C';
  var GOLD_HI = '#F5D78E';
  var GOLD_DEEP = '#8A6A2A';
  var BORDER = '#9A865F';

  // ---- fixed authored deck (index 0 at load) ----
  var DECK = [
    { num: 'I',   name: 'THE KEY' },
    { num: 'II',  name: 'THE VESSEL' },
    { num: 'III', name: 'THE RING' },
    { num: 'IV',  name: 'THE MOTH' },
    { num: 'V',   name: 'THE APPLE' }
  ];

  // ---- state ----
  var current = 0;
  var dealtStack = [0];
  var dealAnim = null;      // {from, to, start} in seconds of elapsed time
  var fan = 0;              // -1..1 horizontal fan factor while dragging
  var fanReturn = null;     // {from, start} easing fan back to 0
  var pointer = null;       // {x, y, t, dragging}

  // ---- deterministic speckle for the card paper (fixed seed) ----
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var speckles = [];
  (function () {
    var rnd = mulberry32(444);
    for (var i = 0; i < 260; i++) {
      speckles.push({ x: rnd(), y: rnd(), r: 0.6 + rnd() * 1.1, a: 0.02 + rnd() * 0.035 });
    }
  })();

  // ---- viewport ----
  function viewSize() {
    var vv = window.visualViewport;
    if (vv && vv.width) return { w: vv.width, h: vv.height };
    return { w: window.innerWidth || 720, h: window.innerHeight || 720 };
  }
  function isPhone() {
    var s = window.screen;
    if (s && Math.min(s.width, s.height) < 700) return true;
    var v = viewSize();
    return v.h > v.w * 1.15;
  }
  function resize() {
    var v = viewSize();
    canvas.width = Math.round(v.w);
    canvas.height = Math.round(v.h);
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- helpers ----
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
  function easeInOut(u) { return u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; }
  function easeOut(u) { return 1 - Math.pow(1 - u, 3); }
  function trackedText(text, cx, y, tracking) {
    var widths = [], total = 0, i, wch;
    for (i = 0; i < text.length; i++) {
      wch = ctx.measureText(text.charAt(i)).width;
      widths.push(wch);
      total += wch + (i > 0 ? tracking : 0);
    }
    var x = cx - total / 2;
    var prevAlign = ctx.textAlign;
    ctx.textAlign = 'left';
    for (i = 0; i < text.length; i++) {
      ctx.fillText(text.charAt(i), x, y);
      x += widths[i] + tracking;
    }
    ctx.textAlign = prevAlign;
  }
  function leaf(x, y, len, ang, flip) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.scale(flip, 1);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(len * 0.55, -len * 0.42, len, 0);
    ctx.quadraticCurveTo(len * 0.55, len * 0.30, 0, 0);
    ctx.closePath();
    ctx.fillStyle = VINE;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(len * 0.08, 0);
    ctx.quadraticCurveTo(len * 0.5, -len * 0.10, len * 0.92, -len * 0.02);
    ctx.strokeStyle = VINE_DARK;
    ctx.lineWidth = Math.max(1, len * 0.05);
    ctx.stroke();
    ctx.restore();
  }

  // ---- the five gilded objects: one parametric grammar ----
  // Each is drawn centred at (cx, cy) inside a box w x h, gold body,
  // deep-gold outline, one burnt-orange accent, one pale highlight.
  function goldGrad(x0, y0, x1, y1) {
    var g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, GOLD_HI);
    g.addColorStop(0.45, GOLD);
    g.addColorStop(1, '#A87F2C');
    return g;
  }
  function drawKey(cx, cy, w, h) {
    var bw = w * 0.27;                       // bow ring radius
    var bowY = cy - h * 0.30;
    var shaftW = w * 0.085;
    var shaftTop = bowY + bw * 0.55;
    var shaftBot = cy + h * 0.44;
    ctx.lineCap = 'round';
    // shaft
    ctx.beginPath();
    ctx.rect(cx - shaftW / 2, shaftTop, shaftW, shaftBot - shaftTop);
    ctx.fillStyle = goldGrad(cx - shaftW, cy - h / 2, cx + shaftW, cy + h / 2);
    ctx.fill();
    ctx.strokeStyle = GOLD_DEEP; ctx.lineWidth = w * 0.016; ctx.stroke();
    // teeth
    ctx.beginPath();
    ctx.rect(cx, shaftBot - h * 0.20, w * 0.16, h * 0.075);
    ctx.rect(cx, shaftBot - h * 0.085, w * 0.115, h * 0.075);
    ctx.fillStyle = goldGrad(cx, cy, cx + w * 0.2, cy + h / 2);
    ctx.fill();
    ctx.strokeStyle = GOLD_DEEP; ctx.stroke();
    // collar
    ctx.beginPath();
    ctx.rect(cx - shaftW * 1.15, shaftTop + h * 0.045, shaftW * 2.3, h * 0.055);
    ctx.fillStyle = GOLD; ctx.fill();
    ctx.strokeStyle = GOLD_DEEP; ctx.lineWidth = w * 0.012; ctx.stroke();
    // bow ring
    ctx.beginPath();
    ctx.arc(cx, bowY, bw, 0, Math.PI * 2);
    ctx.strokeStyle = goldGrad(cx - bw, bowY - bw, cx + bw, bowY + bw);
    ctx.lineWidth = w * 0.068;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, bowY, bw + w * 0.034, 0, Math.PI * 2);
    ctx.strokeStyle = GOLD_DEEP; ctx.lineWidth = w * 0.013; ctx.stroke();
    // accent gem at bow centre
    ctx.beginPath();
    ctx.arc(cx, bowY, w * 0.052, 0, Math.PI * 2);
    ctx.fillStyle = ACCENT; ctx.fill();
    ctx.beginPath();
    ctx.arc(cx - w * 0.018, bowY - w * 0.018, w * 0.016, 0, Math.PI * 2);
    ctx.fillStyle = GOLD_HI; ctx.fill();
  }
  function drawVessel(cx, cy, w, h) {
    var top = cy - h * 0.46, bot = cy + h * 0.46;
    var neckW = w * 0.16, bodyW = w * 0.34;
    ctx.beginPath();
    ctx.moveTo(cx - neckW * 1.35, top);
    ctx.lineTo(cx + neckW * 1.35, top);
    ctx.quadraticCurveTo(cx + neckW * 1.1, top + h * 0.07, cx + neckW * 0.8, top + h * 0.13);
    ctx.bezierCurveTo(cx + bodyW, top + h * 0.30, cx + bodyW * 0.92, bot - h * 0.16, cx + w * 0.13, bot - h * 0.05);
    ctx.lineTo(cx - w * 0.13, bot - h * 0.05);
    ctx.bezierCurveTo(cx - bodyW * 0.92, bot - h * 0.16, cx - bodyW, top + h * 0.30, cx - neckW * 0.8, top + h * 0.13);
    ctx.quadraticCurveTo(cx - neckW * 1.1, top + h * 0.07, cx - neckW * 1.35, top);
    ctx.closePath();
    ctx.fillStyle = goldGrad(cx - bodyW, cy - h / 2, cx + bodyW, cy + h / 2);
    ctx.fill();
    ctx.strokeStyle = GOLD_DEEP; ctx.lineWidth = w * 0.016; ctx.stroke();
    // handles
    ctx.beginPath();
    ctx.arc(cx - bodyW * 0.98, top + h * 0.26, w * 0.105, Math.PI * 0.55, Math.PI * 1.55);
    ctx.arc(cx + bodyW * 0.98, top + h * 0.26, w * 0.105, Math.PI * 1.45, Math.PI * 0.45);
    ctx.strokeStyle = GOLD; ctx.lineWidth = w * 0.045; ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx - bodyW * 0.98, top + h * 0.26, w * 0.105, Math.PI * 0.55, Math.PI * 1.55);
    ctx.arc(cx + bodyW * 0.98, top + h * 0.26, w * 0.105, Math.PI * 1.45, Math.PI * 0.45);
    ctx.strokeStyle = GOLD_DEEP; ctx.lineWidth = w * 0.012; ctx.stroke();
    // accent band
    ctx.save();
    ctx.beginPath();
    ctx.rect(cx - bodyW, cy + h * 0.02, bodyW * 2, h * 0.085);
    ctx.clip();
    ctx.beginPath();
    ctx.ellipse(cx, cy + h * 0.06, bodyW * 0.98, h * 0.30, 0, 0, Math.PI * 2);
    ctx.fillStyle = ACCENT; ctx.fill();
    ctx.restore();
    // foot + highlight
    ctx.beginPath();
    ctx.rect(cx - w * 0.15, bot - h * 0.05, w * 0.30, h * 0.05);
    ctx.fillStyle = GOLD; ctx.fill();
    ctx.strokeStyle = GOLD_DEEP; ctx.lineWidth = w * 0.012; ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(cx - bodyW * 0.45, cy + h * 0.16, w * 0.035, h * 0.13, 0.25, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(245,215,142,0.75)'; ctx.fill();
  }
  function drawRing(cx, cy, w, h) {
    var r = w * 0.30, bandY = cy + h * 0.08;
    // band
    ctx.beginPath();
    ctx.arc(cx, bandY, r, 0, Math.PI * 2);
    ctx.strokeStyle = goldGrad(cx - r, bandY - r, cx + r, bandY + r);
    ctx.lineWidth = w * 0.085;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, bandY, r + w * 0.043, 0, Math.PI * 2);
    ctx.strokeStyle = GOLD_DEEP; ctx.lineWidth = w * 0.013; ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, bandY, r - w * 0.043, 0, Math.PI * 2);
    ctx.strokeStyle = GOLD_DEEP; ctx.stroke();
    // highlight on band
    ctx.beginPath();
    ctx.arc(cx, bandY, r, Math.PI * 1.05, Math.PI * 1.45);
    ctx.strokeStyle = 'rgba(245,215,142,0.9)'; ctx.lineWidth = w * 0.04; ctx.stroke();
    // setting prongs
    ctx.strokeStyle = GOLD_DEEP; ctx.lineWidth = w * 0.02;
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.07, bandY - r - w * 0.02);
    ctx.lineTo(cx - w * 0.045, bandY - r - w * 0.10);
    ctx.moveTo(cx + w * 0.07, bandY - r - w * 0.02);
    ctx.lineTo(cx + w * 0.045, bandY - r - w * 0.10);
    ctx.stroke();
    // accent gem (kite diamond)
    var gy = bandY - r - w * 0.115, gw = w * 0.105, gh = h * 0.13;
    ctx.beginPath();
    ctx.moveTo(cx, gy - gh);
    ctx.lineTo(cx + gw, gy - gh * 0.25);
    ctx.lineTo(cx + gw * 0.55, gy + gh * 0.55);
    ctx.lineTo(cx, gy + gh * 0.85);
    ctx.lineTo(cx - gw * 0.55, gy + gh * 0.55);
    ctx.lineTo(cx - gw, gy - gh * 0.25);
    ctx.closePath();
    ctx.fillStyle = ACCENT; ctx.fill();
    ctx.strokeStyle = '#7E3418'; ctx.lineWidth = w * 0.013; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, gy - gh);
    ctx.lineTo(cx + gw * 0.4, gy - gh * 0.28);
    ctx.lineTo(cx, gy + gh * 0.1);
    ctx.lineTo(cx - gw * 0.4, gy - gh * 0.28);
    ctx.closePath();
    ctx.fillStyle = 'rgba(245,215,142,0.45)'; ctx.fill();
  }
  function drawMoth(cx, cy, w, h) {
    function wing(side) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(side, 1);
      // upper wing
      ctx.beginPath();
      ctx.moveTo(w * 0.03, -h * 0.10);
      ctx.bezierCurveTo(w * 0.16, -h * 0.46, w * 0.46, -h * 0.44, w * 0.47, -h * 0.18);
      ctx.bezierCurveTo(w * 0.47, -h * 0.02, w * 0.22, h * 0.02, w * 0.03, h * 0.02);
      ctx.closePath();
      ctx.fillStyle = goldGrad(0, -h / 2, w * 0.5, 0);
      ctx.fill();
      ctx.strokeStyle = GOLD_DEEP; ctx.lineWidth = w * 0.014; ctx.stroke();
      // lower wing
      ctx.beginPath();
      ctx.moveTo(w * 0.03, h * 0.05);
      ctx.bezierCurveTo(w * 0.24, h * 0.03, w * 0.38, h * 0.14, w * 0.33, h * 0.30);
      ctx.bezierCurveTo(w * 0.29, h * 0.42, w * 0.10, h * 0.36, w * 0.03, h * 0.20);
      ctx.closePath();
      ctx.fillStyle = goldGrad(0, 0, w * 0.4, h * 0.4);
      ctx.fill();
      ctx.strokeStyle = GOLD_DEEP; ctx.stroke();
      // wing spots (accent)
      ctx.beginPath();
      ctx.arc(w * 0.30, -h * 0.20, w * 0.052, 0, Math.PI * 2);
      ctx.fillStyle = ACCENT; ctx.fill();
      ctx.beginPath();
      ctx.arc(w * 0.20, h * 0.19, w * 0.034, 0, Math.PI * 2);
      ctx.fillStyle = ACCENT; ctx.fill();
      ctx.beginPath();
      ctx.arc(w * 0.335, -h * 0.235, w * 0.016, 0, Math.PI * 2);
      ctx.fillStyle = GOLD_HI; ctx.fill();
      ctx.restore();
    }
    wing(1); wing(-1);
    // antennae
    ctx.beginPath();
    ctx.moveTo(cx, cy - h * 0.30);
    ctx.quadraticCurveTo(cx - w * 0.10, cy - h * 0.48, cx - w * 0.20, cy - h * 0.47);
    ctx.moveTo(cx, cy - h * 0.30);
    ctx.quadraticCurveTo(cx + w * 0.10, cy - h * 0.48, cx + w * 0.20, cy - h * 0.47);
    ctx.strokeStyle = GOLD_DEEP; ctx.lineWidth = w * 0.016; ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx - w * 0.205, cy - h * 0.47, w * 0.02, 0, Math.PI * 2);
    ctx.arc(cx + w * 0.205, cy - h * 0.47, w * 0.02, 0, Math.PI * 2);
    ctx.fillStyle = GOLD; ctx.fill();
    // body
    ctx.beginPath();
    ctx.ellipse(cx, cy + h * 0.02, w * 0.055, h * 0.30, 0, 0, Math.PI * 2);
    ctx.fillStyle = goldGrad(cx - w * 0.06, cy - h * 0.3, cx + w * 0.06, cy + h * 0.3);
    ctx.fill();
    ctx.strokeStyle = GOLD_DEEP; ctx.lineWidth = w * 0.013; ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy - h * 0.30, w * 0.055, 0, Math.PI * 2);
    ctx.fillStyle = GOLD; ctx.fill(); ctx.strokeStyle = GOLD_DEEP; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.05, cy - h * 0.02);
    ctx.lineTo(cx + w * 0.05, cy - h * 0.02);
    ctx.moveTo(cx - w * 0.052, cy + h * 0.10);
    ctx.lineTo(cx + w * 0.052, cy + h * 0.10);
    ctx.strokeStyle = 'rgba(138,106,42,0.7)'; ctx.lineWidth = w * 0.012; ctx.stroke();
  }
  function drawApple(cx, cy, w, h) {
    var r = w * 0.335, ay = cy + h * 0.06;
    ctx.beginPath();
    ctx.moveTo(cx, ay - r * 0.72);
    ctx.bezierCurveTo(cx - r * 1.05, ay - r * 0.85, cx - r * 1.02, ay + r * 0.55, cx - r * 0.42, ay + r * 0.88);
    ctx.bezierCurveTo(cx - r * 0.14, ay + r * 1.02, cx + r * 0.14, ay + r * 1.02, cx + r * 0.42, ay + r * 0.88);
    ctx.bezierCurveTo(cx + r * 1.02, ay + r * 0.55, cx + r * 1.05, ay - r * 0.85, cx, ay - r * 0.72);
    ctx.closePath();
    ctx.fillStyle = goldGrad(cx - r, ay - r, cx + r, ay + r);
    ctx.fill();
    ctx.strokeStyle = GOLD_DEEP; ctx.lineWidth = w * 0.015; ctx.stroke();
    // stem
    ctx.beginPath();
    ctx.moveTo(cx, ay - r * 0.70);
    ctx.quadraticCurveTo(cx + w * 0.02, ay - r * 1.05, cx + w * 0.075, ay - r * 1.18);
    ctx.strokeStyle = '#6E4F22'; ctx.lineWidth = w * 0.028; ctx.lineCap = 'round'; ctx.stroke();
    // leaf (vine green, botanical)
    leaf(cx + w * 0.05, ay - r * 1.02, w * 0.17, -0.5, 1);
    // highlight
    ctx.beginPath();
    ctx.ellipse(cx - r * 0.48, ay - r * 0.18, w * 0.045, h * 0.085, 0.35, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(245,215,142,0.85)'; ctx.fill();
    // accent star low on the body
    var sx = cx + r * 0.34, sy = ay + r * 0.38, sr = w * 0.045;
    ctx.beginPath();
    for (var i = 0; i < 8; i++) {
      var ang = -Math.PI / 2 + i * Math.PI / 4;
      var rad = (i % 2 === 0) ? sr : sr * 0.42;
      var px = sx + Math.cos(ang) * rad, py = sy + Math.sin(ang) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = ACCENT; ctx.fill();
  }
  var OBJECT_DRAW = [drawKey, drawVessel, drawRing, drawMoth, drawApple];

  // ---- one vine side; mirrored by the caller. Exactly one pomegranate
  // is drawn in the whole card: on the left vine, flagged by withPom. ----
  function drawVine(baseX, topY, botY, dir, sway, cw, withPom) {
    var segs = 26, i, px, py;
    ctx.beginPath();
    for (i = 0; i <= segs; i++) {
      var u = i / segs;
      px = baseX + dir * Math.sin(u * Math.PI * 2.2) * cw * 0.012 + sway * Math.sin(u * Math.PI);
      py = botY - u * (botY - topY);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.strokeStyle = VINE_DARK;
    ctx.lineWidth = Math.max(1.2, cw * 0.006);
    ctx.stroke();
    // leaves, alternating sides of the stem
    var leafLen = cw * 0.055;
    for (i = 0; i < 6; i++) {
      var u2 = 0.10 + i * 0.15;
      var lx = baseX + dir * Math.sin(u2 * Math.PI * 2.2) * cw * 0.012 + sway * Math.sin(u2 * Math.PI);
      var ly = botY - u2 * (botY - topY);
      var side = (i % 2 === 0) ? dir : -dir;
      leaf(lx, ly, leafLen, side > 0 ? -0.55 : Math.PI + 0.55, side > 0 ? 1 : -1);
    }
    if (withPom) {
      var pu = 0.30;
      var gx = baseX + dir * Math.sin(pu * Math.PI * 2.2) * cw * 0.012 + sway * Math.sin(pu * Math.PI) + dir * cw * 0.034;
      var gy = botY - pu * (botY - topY) + cw * 0.034;
      var gr = cw * 0.040;
      // hanging stem from the vine to the crown
      ctx.beginPath();
      ctx.moveTo(gx - dir * cw * 0.026, gy - gr * 1.25);
      ctx.quadraticCurveTo(gx - dir * cw * 0.006, gy - gr * 1.05, gx, gy - gr * 0.92);
      ctx.strokeStyle = VINE_DARK; ctx.lineWidth = Math.max(1, cw * 0.005); ctx.stroke();
      // fruit
      ctx.beginPath();
      ctx.arc(gx, gy, gr, 0, Math.PI * 2);
      ctx.fillStyle = POM; ctx.fill();
      ctx.strokeStyle = '#6E1622'; ctx.lineWidth = Math.max(0.8, cw * 0.0035); ctx.stroke();
      // crown: three clear spikes on top
      ctx.beginPath();
      ctx.moveTo(gx - gr * 0.34, gy - gr * 0.86);
      ctx.lineTo(gx - gr * 0.20, gy - gr * 1.22);
      ctx.lineTo(gx - gr * 0.05, gy - gr * 0.94);
      ctx.lineTo(gx + gr * 0.04, gy - gr * 1.26);
      ctx.lineTo(gx + gr * 0.14, gy - gr * 0.94);
      ctx.lineTo(gx + gr * 0.30, gy - gr * 1.16);
      ctx.lineTo(gx + gr * 0.36, gy - gr * 0.84);
      ctx.closePath();
      ctx.fillStyle = POM; ctx.fill();
      ctx.strokeStyle = '#6E1622'; ctx.lineWidth = Math.max(0.8, cw * 0.003); ctx.stroke();
      ctx.beginPath();
      ctx.arc(gx - gr * 0.32, gy - gr * 0.30, gr * 0.20, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(232,180,184,0.8)'; ctx.fill();
    }
  }

  // ---- the whole card, drawn at a vertical/horizontal offset ----
  function drawCard(idx, t, offX, offY, vw, vh) {
    // card geometry: strict 2 : 3.4, centred, keeps its shape on phones
    var ch = Math.min(vh * 0.94, vw * 1.7 * 0.94);
    var cw = ch / 1.7;
    if (cw > vw * 0.94) { cw = vw * 0.94; ch = cw * 1.7; }
    var cx = vw / 2 + offX;
    var x = cx - cw / 2;
    var y = vh / 2 - ch / 2 + offY;

    ctx.save();
    // soft shadow on the page ground
    rr(x + cw * 0.018, y + ch * 0.014, cw, ch, cw * 0.035);
    ctx.fillStyle = 'rgba(8,18,40,0.35)';
    ctx.fill();
    // card ground
    rr(x, y, cw, ch, cw * 0.035);
    ctx.fillStyle = CARD;
    ctx.fill();
    ctx.save();
    rr(x, y, cw, ch, cw * 0.035);
    ctx.clip();

    // paper speckle
    ctx.fillStyle = '#8A7A5C';
    for (var i = 0; i < speckles.length; i++) {
      var sp = speckles[i];
      ctx.globalAlpha = sp.a;
      ctx.beginPath();
      ctx.arc(x + sp.x * cw, y + sp.y * ch, sp.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ---- moon + glow above the arch ----
    var moonX = cx, moonY = y + ch * 0.085, moonR = cw * 0.052;
    var glowR = moonR * (2.5 + 0.35 * Math.sin(t * Math.PI * 2 / 6));
    var gg = ctx.createRadialGradient(moonX, moonY, moonR * 0.4, moonX, moonY, glowR);
    gg.addColorStop(0, 'rgba(245,240,220,0.40)');
    gg.addColorStop(1, 'rgba(245,240,220,0)');
    ctx.beginPath();
    ctx.arc(moonX, moonY, glowR, 0, Math.PI * 2);
    ctx.fillStyle = gg; ctx.fill();

    // ---- arched niche, centre 60% wide ----
    var archW = cw * 0.60;
    var archX = cx - archW / 2;
    var archTop = y + ch * 0.155;
    var archBot = y + ch * 0.845;
    var archR = archW / 2;
    function archPath() {
      ctx.beginPath();
      ctx.moveTo(archX, archBot);
      ctx.lineTo(archX, archTop + archR);
      ctx.arc(cx, archTop + archR, archR, Math.PI, 0);
      ctx.lineTo(archX + archW, archBot);
      ctx.closePath();
    }
    var ag = ctx.createLinearGradient(archX, 0, archX + archW, 0);
    ag.addColorStop(0, ARCH_EDGE);
    ag.addColorStop(0.18, ARCH);
    ag.addColorStop(0.82, ARCH);
    ag.addColorStop(1, ARCH_EDGE);
    archPath();
    ctx.fillStyle = ag; ctx.fill();
    ctx.strokeStyle = '#A98F66';
    ctx.lineWidth = Math.max(1, cw * 0.005);
    ctx.stroke();

    // crescent moon (over the glow, above the arch): one path, two arcs
    ctx.beginPath();
    ctx.arc(moonX, moonY, moonR, Math.PI * 0.42, Math.PI * 1.58, false);
    ctx.arc(moonX + moonR * 0.52, moonY, moonR * 0.80, Math.PI * 1.42, Math.PI * 0.58, true);
    ctx.closePath();
    ctx.fillStyle = MOON; ctx.fill();
    ctx.strokeStyle = 'rgba(169,143,102,0.55)';
    ctx.lineWidth = Math.max(0.8, cw * 0.0035);
    ctx.stroke();

    // ---- vines, symmetric, sway 2px; one pomegranate only ----
    var sway = 2 * Math.sin(t * Math.PI * 2 / 8);
    var vineTop = archTop + ch * 0.03;
    var vineBot = archBot - ch * 0.015;
    drawVine(x + cw * 0.115, vineTop, vineBot, 1, sway, cw, true);
    drawVine(x + cw * 0.885, vineTop, vineBot, -1, sway, cw, false);

    // ---- the gilded object, 40% of card height, inside the arch ----
    var objH = ch * 0.40;
    var objW = cw * 0.44;
    var objCY = archTop + (archBot - archTop) * 0.54;
    // small plinth line under the object
    ctx.beginPath();
    ctx.moveTo(cx - objW * 0.42, archBot - ch * 0.055);
    ctx.lineTo(cx + objW * 0.42, archBot - ch * 0.055);
    ctx.strokeStyle = 'rgba(169,143,102,0.8)';
    ctx.lineWidth = Math.max(1, cw * 0.005);
    ctx.stroke();
    OBJECT_DRAW[idx](cx, objCY, objW, objH);

    // ---- title band, bottom 10% ----
    var bandY = y + ch * 0.90;
    ctx.beginPath();
    ctx.rect(x, bandY, cw, ch * 0.10);
    ctx.fillStyle = PAGE;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x, bandY);
    ctx.lineTo(x + cw, bandY);
    ctx.strokeStyle = BORDER;
    ctx.lineWidth = Math.max(1, cw * 0.004);
    ctx.stroke();
    ctx.fillStyle = CREAM;
    ctx.font = '600 ' + Math.round(ch * 0.037) + 'px Georgia, "Times New Roman", serif';
    ctx.textBaseline = 'middle';
    trackedText(DECK[idx].num + '  ' + DECK[idx].name, cx, bandY + ch * 0.052, cw * 0.012);

    ctx.restore(); // unclip

    // thin outer border line
    rr(x + cw * 0.028, y + ch * 0.0165, cw * 0.944, ch * 0.967, cw * 0.022);
    ctx.strokeStyle = BORDER;
    ctx.lineWidth = Math.max(1, cw * 0.0045);
    ctx.stroke();
    ctx.restore();
  }

  // ---- frame ----
  var PHASE0 = 2.4; // constant loop phase for the synchronous first frame
  function draw(t, elapsed) {
    var v = viewSize();
    var w = Math.round(v.w), h = Math.round(v.h);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.fillStyle = PAGE;
    ctx.fillRect(0, 0, w, h);

    // fan easing after release
    var fanNow = fan;
    if (fanReturn) {
      var fu = (elapsed - fanReturn.start) / 0.32;
      if (fu >= 1) { fanNow = 0; fan = 0; fanReturn = null; }
      else fanNow = fanReturn.from * (1 - easeOut(fu));
    }

    if (dealAnim) {
      var u = (elapsed - dealAnim.start) / 0.7;
      if (u >= 1) {
        current = dealAnim.to;
        dealAnim = null;
        drawCard(current, t, 0, 0, w, h);
      } else {
        var e = easeInOut(u);
        var travel = h * 0.72;
        drawCard(dealAnim.from, t, 0, -e * travel, w, h);
        drawCard(dealAnim.to, t, 0, (1 - e) * travel, w, h);
      }
    } else if (Math.abs(fanNow) > 0.01 && dealtStack.length > 1) {
      // fan the last three dealt cards; current stays on top
      var cwEst = Math.min(h * 0.94, w * 1.7 * 0.94) / 1.7;
      var n = dealtStack.length;
      if (n >= 3) drawCard(dealtStack[n - 3], t, -fanNow * cwEst * 0.62, 0, w, h);
      if (n >= 2) drawCard(dealtStack[n - 2], t, -fanNow * cwEst * 0.34, 0, w, h);
      drawCard(current, t, fanNow * cwEst * 0.10, 0, w, h);
    } else {
      drawCard(current, t, 0, 0, w, h);
    }
  }

  // ---- interaction: tap deals, horizontal drag fans ----
  function startDeal(elapsed) {
    if (dealAnim) return;
    var next = (current + 1) % DECK.length;
    dealAnim = { from: current, to: next, start: elapsed };
    dealtStack.push(next);
    if (dealtStack.length > 6) dealtStack.shift();
    current = next; // logical card; draw catches up through the animation
    dealAnim.from = dealtStack[dealtStack.length - 2];
  }
  function evtPos(ev) {
    if (ev.clientX !== undefined) return { x: ev.clientX, y: ev.clientY };
    if (ev.touches && ev.touches.length) return { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
    if (ev.changedTouches && ev.changedTouches.length) return { x: ev.changedTouches[0].clientX, y: ev.changedTouches[0].clientY };
    return { x: 0, y: 0 };
  }
  var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsedNow() {
    if (typeof performance !== 'undefined' && performance.now) {
      return (performance.now() - startStamp) / 1000;
    }
    return 0;
  }
  canvas.addEventListener('pointerdown', function (ev) {
    var p = evtPos(ev);
    pointer = { x: p.x, y: p.y, t: elapsedNow(), dragging: false };
    fanReturn = null;
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (!pointer) return;
    var p = evtPos(ev);
    var dx = p.x - pointer.x;
    if (Math.abs(dx) > 10) pointer.dragging = true;
    if (pointer.dragging) {
      var v = viewSize();
      fan = Math.max(-1, Math.min(1, dx / (v.w * 0.35)));
    }
  });
  function endPointer(ev) {
    if (!pointer) return;
    var wasDrag = pointer.dragging;
    var dt = elapsedNow() - pointer.t;
    pointer = null;
    if (wasDrag) {
      fanReturn = { from: fan, start: elapsedNow() };
    } else if (dt < 0.6) {
      startDeal(elapsedNow());
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('touchstart', function (ev) {
    var p = evtPos(ev);
    pointer = { x: p.x, y: p.y, t: elapsedNow(), dragging: false };
    fanReturn = null;
  });
  canvas.addEventListener('touchmove', function (ev) {
    if (!pointer) return;
    var p = evtPos(ev);
    var dx = p.x - pointer.x;
    if (Math.abs(dx) > 10) pointer.dragging = true;
    if (pointer.dragging) {
      var v = viewSize();
      fan = Math.max(-1, Math.min(1, dx / (v.w * 0.35)));
    }
  });
  canvas.addEventListener('touchend', endPointer);

  // ---- boot: one developed frame synchronously, then the loop ----
  draw(PHASE0, 0);
  if (typeof requestAnimationFrame === 'function') {
    var rafStart = null;
    var loop = function (ts) {
      if (rafStart === null) rafStart = ts;
      var elapsed = (ts - rafStart) / 1000;
      draw(PHASE0 + elapsed, elapsed);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
