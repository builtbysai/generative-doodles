<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.325 Buffalo Plaid Bee</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F2EBD8; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.325 Buffalo Plaid Bee (meohmy_graphics).
// A bold buffalo plaid fills the frame edge to edge: a cream
// ground, then two check data sets drawn in order on this one
// canvas, vertical bands first and horizontal bands second,
// both with the composite operation set to multiply so the
// crossings darken where the bands overlap. The operation is
// reset to source-over before the bees are drawn. Exactly 12
// bees rest on the plaid, one per block of a 4 by 3 lattice of
// blocks, each block holding a 3 by 3 group of checks and each
// bee sitting at its own authored offset from the block
// centre. Idle is a 20s seamless loop: the bees run tiny
// wing-shiver cycles on staggered phases and nothing else
// moves, so the frame at 20s is identical to frame 0. Drag
// across the plaid: any bee whose centre sits within 140
// design units of the pointer lifts off, flies one small
// authored circle in 1.2s, and when the pointer lifts it
// lands on the centre of the nearest check, keeping its own
// authored resting offset inside that check. A drag that
// touches no bee does nothing. All marks are data drawn each
// frame on one canvas.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var RED = '#B33A2B', CREAM = '#F2EBD8', BLACK = '#1C1A17', HONEY = '#D9A441', SMOKE = '#8A8A86';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 20;
var T = 7.3, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

// ---- plaid geometry: checks, blocks, bands -------------------
// The frame is a lattice of 4 by 3 blocks. Each block is a
// 3 by 3 group of checks, so the check grid is 12 by 9.
var BCOLS = 4, BROWS = 3;
var BW = DW / BCOLS, BH = DH / BROWS;
var CHECK_W = BW / 3, CHECK_H = BH / 3;
var GUT = 16;
// Two check data sets. Each pattern lists one letter per
// check, R for a red band run and K for a black band run;
// consecutive equal letters merge into one wider band, which
// is what makes the checks bold. Vertical bands run the full
// height, horizontal bands the full width, and each band is
// inset by half a gutter so thin cream lines separate them.
var V_PATTERN = ['R', 'R', 'K', 'K', 'R', 'R', 'K', 'K', 'R', 'R', 'K', 'K'];
var H_PATTERN = ['R', 'R', 'K', 'K', 'R', 'R', 'K', 'K', 'R'];
function buildBands(pattern, checkSize) {
  var bands = [], i = 0;
  while (i < pattern.length) {
    var j = i;
    while (j + 1 < pattern.length && pattern[j + 1] === pattern[i]) j++;
    var isRed = pattern[i] === 'R';
    bands.push({
      start: i * checkSize,
      size: (j - i + 1) * checkSize,
      color: isRed ? RED : BLACK,
      alpha: isRed ? 0.92 : 0.88
    });
    i = j + 1;
  }
  return bands;
}
var VBANDS = buildBands(V_PATTERN, CHECK_W);
var HBANDS = buildBands(H_PATTERN, CHECK_H);
if (VBANDS.length !== 6) throw new Error('Buffalo Plaid Bee needs exactly 6 vertical bands');
if (HBANDS.length !== 5) throw new Error('Buffalo Plaid Bee needs exactly 5 horizontal bands');
(function () {
  var i, end;
  end = 0; for (i = 0; i < VBANDS.length; i++) end = Math.max(end, VBANDS[i].start + VBANDS[i].size);
  if (Math.abs(end - DW) > 0.01) throw new Error('vertical bands must cover the full width');
  end = 0; for (i = 0; i < HBANDS.length; i++) end = Math.max(end, HBANDS[i].start + HBANDS[i].size);
  if (Math.abs(end - DH) > 0.01) throw new Error('horizontal bands must cover the full height');
})();

// ---- bees: exactly 12, one per block, authored rests ---------
// dx and dy are the authored resting offset from the block
// centre, small enough to sit inside one check, and the same
// offset is kept inside whichever check a bee lands on. ph is
// the wing-shiver phase, sc the scale, flip the facing, rad
// the radius of the small circle a lifted bee flies.
var REST = [
  { dx: -14, dy: 10,  ph: 0.0,  sc: 1.00, flip: false, rad: 30 },
  { dx: 16,  dy: -12, ph: 1.37, sc: 0.94, flip: true,  rad: 26 },
  { dx: -6,  dy: -16, ph: 2.74, sc: 1.06, flip: false, rad: 34 },
  { dx: 20,  dy: 8,   ph: 4.11, sc: 0.97, flip: true,  rad: 28 },
  { dx: 10,  dy: 14,  ph: 5.48, sc: 1.03, flip: true,  rad: 32 },
  { dx: -18, dy: -6,  ph: 0.83, sc: 0.92, flip: false, rad: 25 },
  { dx: 4,   dy: -18, ph: 2.20, sc: 1.08, flip: true,  rad: 36 },
  { dx: -12, dy: 16,  ph: 3.57, sc: 0.95, flip: false, rad: 29 },
  { dx: 18,  dy: -4,  ph: 4.94, sc: 1.01, flip: false, rad: 33 },
  { dx: -20, dy: 12,  ph: 6.31, sc: 0.98, flip: true,  rad: 27 },
  { dx: 8,   dy: 18,  ph: 1.66, sc: 1.05, flip: false, rad: 35 },
  { dx: -8,  dy: -14, ph: 3.03, sc: 0.93, flip: true,  rad: 31 }
];
var BEES = [];
(function () {
  var br, bc, idx, r;
  for (br = 0; br < BROWS; br++) {
    for (bc = 0; bc < BCOLS; bc++) {
      idx = br * BCOLS + bc;
      r = REST[idx];
      BEES.push({
        bc: bc, br: br,
        dx: r.dx, dy: r.dy, ph: r.ph, sc: r.sc, flip: r.flip, rad: r.rad,
        cx: bc * BW + BW / 2 + r.dx, cy: br * BH + BH / 2 + r.dy,
        ax: 0, ay: 0, flyT0: -10, flyP: 0, dropT: -1,
        state: 'rest',
        landFromX: 0, landFromY: 0, landToX: 0, landToY: 0, landT0: -10
      });
    }
  }
})();
if (BEES.length !== 12) throw new Error('Buffalo Plaid Bee needs exactly 12 bees');
(function () {
  var counts = {}, i, b, key;
  for (i = 0; i < BEES.length; i++) {
    b = BEES[i];
    if (b.cx <= b.bc * BW || b.cx >= (b.bc + 1) * BW) throw new Error('bee outside its block column');
    if (b.cy <= b.br * BH || b.cy >= (b.br + 1) * BH) throw new Error('bee outside its block row');
    key = b.bc + ',' + b.br;
    counts[key] = (counts[key] || 0) + 1;
  }
  for (var br = 0; br < BROWS; br++) for (var bc = 0; bc < BCOLS; bc++) {
    if (counts[bc + ',' + br] !== 1) throw new Error('Buffalo Plaid Bee needs exactly one bee per block');
  }
})();

function nearestCheck(x, y) {
  var c = clamp(Math.floor(x / CHECK_W), 0, BCOLS * 3 - 1);
  var r = clamp(Math.floor(y / CHECK_H), 0, BROWS * 3 - 1);
  return [c * CHECK_W + CHECK_W / 2, r * CHECK_H + CHECK_H / 2];
}

// Advance one bee through its flight and landing states.
function updateBee(b) {
  if (b.state === 'fly' && b.dropT >= 0) {
    var start = Math.max(b.dropT, b.flyT0 + 1.2);
    if (T >= start) {
      var c = nearestCheck(b.ax, b.ay);
      b.landFromX = b.ax; b.landFromY = b.ay;
      b.landToX = clamp(c[0] + b.dx, 36, DW - 36);
      b.landToY = clamp(c[1] + b.dy, 30, DH - 30);
      b.landT0 = T; b.state = 'land'; b.dropT = -1;
    }
  }
  if (b.state === 'land' && (T - b.landT0) >= 0.3) {
    b.cx = b.landToX; b.cy = b.landToY; b.state = 'rest';
  }
}
function beeXY(b) {
  if (b.state === 'fly') {
    var p = clamp((T - b.flyT0) / 1.2, 0, 1);
    b.flyP = p;
    var th = p * Math.PI * 2;
    // One small circle of radius rad, tangent at the resting
    // point, so the flight starts and ends where the bee sat.
    return [b.ax + b.rad * Math.sin(th), b.ay - b.rad * (1 - Math.cos(th))];
  }
  if (b.state === 'land') {
    var q = clamp((T - b.landT0) / 0.3, 0, 1);
    var e = 1 - Math.pow(1 - q, 3);
    return [b.landFromX + (b.landToX - b.landFromX) * e,
            b.landFromY + (b.landToY - b.landFromY) * e];
  }
  return [b.cx, b.cy];
}

function drawPlaid() {
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = CREAM;
  ctx.fillRect(0, 0, DW, DH);
  ctx.globalCompositeOperation = 'multiply';
  var i, b;
  for (i = 0; i < VBANDS.length; i++) {
    b = VBANDS[i];
    ctx.globalAlpha = b.alpha;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.start + GUT / 2, 0, b.size - GUT, DH);
  }
  for (i = 0; i < HBANDS.length; i++) {
    b = HBANDS[i];
    ctx.globalAlpha = b.alpha;
    ctx.fillStyle = b.color;
    ctx.fillRect(0, b.start + GUT / 2, DW, b.size - GUT);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function drawBee(b, x, y) {
  var tl = T % LOOP;
  var shiver = Math.sin((tl / LOOP) * Math.PI * 2 * 60 + b.ph);
  var flying = b.state === 'fly';
  var amp = flying ? 0.34 : 0.15;
  var tilt = flying ? 0.26 * Math.sin((b.flyP || 0) * Math.PI * 2) : 0;
  ctx.save();
  ctx.translate(x, y);
  if (b.flip) ctx.scale(-1, 1);
  ctx.rotate(tilt);
  ctx.scale(b.sc, b.sc);
  // Wings, behind the body, shivering on the bee phase.
  ctx.fillStyle = SMOKE;
  ctx.globalAlpha = flying ? 0.75 : 0.58;
  ctx.save();
  ctx.translate(-4, -13); ctx.rotate(-0.55 + shiver * amp);
  ctx.beginPath(); ctx.ellipse(0, -12, 9, 16, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = flying ? 0.62 : 0.45;
  ctx.save();
  ctx.translate(10, -13); ctx.rotate(0.25 - shiver * amp * 0.8);
  ctx.beginPath(); ctx.ellipse(0, -11, 8, 14, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
  // Legs.
  st(BLACK, 2);
  ctx.beginPath(); ctx.moveTo(-10, 15); ctx.lineTo(-14, 23); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 17); ctx.lineTo(0, 25); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, 15); ctx.lineTo(14, 23); ctx.stroke();
  // Stinger.
  ctx.fillStyle = BLACK;
  ctx.beginPath();
  ctx.moveTo(-28, -4); ctx.lineTo(-38, 0); ctx.lineTo(-28, 4);
  ctx.closePath(); ctx.fill();
  // Body: honey oval with two black stripe bands clipped in.
  ctx.fillStyle = HONEY;
  ctx.beginPath(); ctx.ellipse(0, 0, 30, 20, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, 0, 30, 20, 0, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = BLACK;
  ctx.fillRect(-16, -20, 9, 40);
  ctx.fillRect(0, -20, 9, 40);
  ctx.restore();
  st(BLACK, 2.4);
  ctx.beginPath(); ctx.ellipse(0, 0, 30, 20, 0, 0, Math.PI * 2); ctx.stroke();
  // Head with a cream eye and two antennae.
  ctx.fillStyle = BLACK; circ(25, 0, 11, true);
  ctx.fillStyle = CREAM; circ(28, -3, 2.6, true);
  st(BLACK, 1.8);
  ctx.beginPath(); ctx.moveTo(28, -8); ctx.lineTo(34, -16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(21, -9); ctx.lineTo(23, -18); ctx.stroke();
  ctx.fillStyle = BLACK; circ(34, -16, 1.6, true); circ(23, -18, 1.6, true);
  ctx.restore();
}

function draw() {
  drawPlaid();
  var i, b, pos;
  for (i = 0; i < BEES.length; i++) updateBee(BEES[i]);
  // Resting and landing bees first, flying bees on top.
  for (i = 0; i < BEES.length; i++) {
    b = BEES[i];
    if (b.state === 'fly') continue;
    pos = beeXY(b);
    drawBee(b, pos[0], pos[1]);
  }
  for (i = 0; i < BEES.length; i++) {
    b = BEES[i];
    if (b.state !== 'fly') continue;
    pos = beeXY(b);
    var lifted = b.ay - pos[1];
    if (lifted > 2) {
      ctx.save();
      ctx.globalAlpha = 0.16 * (1 - lifted / (2 * b.rad + 1)) + 0.05;
      ctx.fillStyle = BLACK;
      ctx.beginPath();
      ctx.ellipse(b.ax, b.ay + 24, 26 * b.sc, 8 * b.sc, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    drawBee(b, pos[0], pos[1]);
  }
}

// ---- interaction: drag to lift the bees near the pointer -----
var drag = null;
function liftNear(x, y) {
  for (var i = 0; i < BEES.length; i++) {
    var b = BEES[i];
    if (b.state !== 'rest') continue;
    var dx = b.cx - x, dy = b.cy - y;
    if (dx * dx + dy * dy <= 140 * 140) {
      b.state = 'fly';
      b.ax = b.cx; b.ay = b.cy;
      b.flyT0 = T; b.flyP = 0; b.dropT = -1;
    }
  }
}
function releaseBees() {
  for (var i = 0; i < BEES.length; i++) {
    if (BEES[i].state === 'fly' && BEES[i].dropT < 0) BEES[i].dropT = T;
  }
}
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  drag = { x: p[0], y: p[1] };
  liftNear(p[0], p[1]);
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var p = toDesign(e);
  drag.x = p[0]; drag.y = p[1];
  liftNear(p[0], p[1]);
});
canvas.addEventListener('pointerup', function () {
  if (drag) releaseBees();
  drag = null;
});
canvas.addEventListener('pointercancel', function () {
  if (drag) releaseBees();
  drag = null;
});

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = CREAM;
  ctx.fillRect(0, 0, W, H);
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
