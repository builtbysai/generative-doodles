<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1929 The Long Ferment</title>
<style>
  html, body { margin: 0; padding: 0; background: #20140d; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt. The study
  // file studies/chris-hyson.md does not exist in the repo, so these hex
  // values are chosen from the prompt's own color names.
  var WALL = '#20140d';     // dark room behind the shelf
  var WALL_LT = '#2c1c10';  // wall wash, slightly lighter
  var WOOD = '#4a2f1d';     // shelf, dark wood brown
  var WOOD_DK = '#33200f';  // shelf shadow and lid
  var AMBER = '#c98f2e';    // jar liquid, cloudy amber
  var TEAL = '#3f7d78';     // jar liquid, cloudy teal
  var BONE = '#d8cbb2';     // jar liquid, cloudy bone
  var RUST = '#a6502a';     // jar liquid, cloudy rust
  var CHALK = '#e8e2d2';    // season clock and plate ink, pale chalk
  var GLASS = '#e8e2d2';    // jar glass outline, chalk pale

  // Fixed-phase first frame: t = 96 s. The year is 240 s (four seasons
  // of 60 s); a jar is released every 120 s, twice a year. At t = 96 the
  // first jar is halfway through its rise off the shelf, the clock reads
  // spring, and one jar sits freshly stirred from the last hour. Frame
  // one is byte-reproducible: every jar, cloud and hand is a pure
  // function of t and the seeded PRNG.
  var FIRST_T = 96;
  var YEAR = 240;      // one full seasonal cycle, seconds
  var SEASON = 60;     // one season, seconds
  var REL_EVERY = 120; // one release per half year
  var REL_RISE = 12;   // seconds a jar takes to leave the frame
  var REL_GAP = 6;     // seconds the slot stands empty
  var REL_FILL = 12;   // seconds a new jar takes to settle in
  var STIR_JAR = 5;    // the jar that is opened and stirred each year
  var STIR_AT = 60;    // stir begins 60 s into the year
  var STIR_LEN = 12;   // lid up and swirl visible for 12 s
  var N_JARS = 8;

  var LIQUIDS = [AMBER, TEAL, BONE, RUST, AMBER, TEAL, BONE, RUST];
  var SEASONS = ['winter', 'spring', 'summer', 'autumn'];

  // Seeded PRNG, mulberry32. A fresh instance is built per draw from the
  // piece number, so every frame is reproducible regardless of call order.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function mixHex(h1, h2, t) {
    var r1 = parseInt(h1.slice(1, 3), 16), g1 = parseInt(h1.slice(3, 5), 16), b1 = parseInt(h1.slice(5, 7), 16);
    var r2 = parseInt(h2.slice(1, 3), 16), g2 = parseInt(h2.slice(3, 5), 16), b2 = parseInt(h2.slice(5, 7), 16);
    var r = Math.round(lerp(r1, r2, t)), g = Math.round(lerp(g1, g2, t)), b = Math.round(lerp(b1, b2, t));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function smooth(a, b, x) {
    var u = clamp((x - a) / (b - a), 0, 1);
    return u * u * (3 - 2 * u);
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // How many times jar j has been released and replaced before time t.
  // Releases happen in blocks of REL_EVERY seconds; block r releases
  // jar r mod 8. A replacement counts once its settling window opens.
  function jarGen(j, t) {
    var block = Math.floor(t / REL_EVERY);
    var bph = t - block * REL_EVERY;
    var count = 0;
    var r;
    for (r = j; r < block; r += N_JARS) { count++; }
    if (r === block && bph >= 90 + REL_RISE + REL_GAP) { count++; }
    return count;
  }

  // A jar's fixed character for its current generation: liquid color,
  // cloud phase, fill level, motif, and cloud blob positions. Seeded
  // from the piece number, jar index and generation, so a new jar that
  // fills an empty slot has a fresh, deterministic character.
  function jarProps(j, gen) {
    var rng = mulberry32(1929 * 1000 + j * 37 + gen * 13);
    var blobs = [];
    for (var b = 0; b < 5; b++) {
      blobs.push({ x: 0.15 + rng() * 0.7, y: 0.25 + rng() * 0.6, r: 0.10 + rng() * 0.10, ph: rng() * Math.PI * 2 });
    }
    return {
      liquid: LIQUIDS[(j + gen) % LIQUIDS.length],
      cloudPhase: rng() * Math.PI * 2,
      cloudBase: 0.45 + rng() * 0.25,
      fill: 0.55 + rng() * 0.25,
      motif: (j + gen) % 4, // 0 stems, 1 piano figure, 2 drum loop, 3 vocal line
      blobs: blobs
    };
  }

  // Cloudiness of a jar at time t: slow seasonal drift. Jar 1 is clouded
  // in winter and clears by summer; the other jars peak in their own
  // seasons, so the row is never uniformly cloudy or clear.
  function cloudiness(P, t) {
    var c = P.cloudBase + 0.42 * Math.sin((t / YEAR) * Math.PI * 2 + P.cloudPhase);
    return clamp(c, 0.06, 0.97);
  }

  // Release state of jar j at time t: 'rest', 'rising', 'gone' or
  // 'settling', with a 0..1 progress for the moving states. The release
  // happens late in each 120 s block: rising 90..102, slot empty
  // 102..108, new jar settling 108..120.
  function releaseState(j, t) {
    var block = Math.floor(t / REL_EVERY);
    var bph = t - block * REL_EVERY;
    if (block % N_JARS !== j) { return { mode: 'rest', p: 0 }; }
    if (bph < 90) { return { mode: 'rest', p: 0 }; }
    if (bph < 90 + REL_RISE) { return { mode: 'rising', p: (bph - 90) / REL_RISE }; }
    if (bph < 90 + REL_RISE + REL_GAP) { return { mode: 'gone', p: 0 }; }
    return { mode: 'settling', p: (bph - 90 - REL_RISE - REL_GAP) / REL_FILL };
  }

  // Stir state of the stirred jar: 0 at rest, rising to 1 while the lid
  // is up and the liquid swirls, back to 0 once it is closed again.
  function stirAmount(t) {
    var yph = t - Math.floor(t / YEAR) * YEAR;
    var aIn = smooth(STIR_AT, STIR_AT + 3, yph);
    var aOut = 1 - smooth(STIR_AT + STIR_LEN - 3, STIR_AT + STIR_LEN, yph);
    return clamp(Math.min(aIn, aOut), 0, 1);
  }

  function phaseWord(t) {
    var block = Math.floor(t / REL_EVERY);
    var bph = t - block * REL_EVERY;
    if (bph >= 90 && bph < 90 + REL_RISE) { return 'a jar leaves'; }
    if (bph >= 90 + REL_RISE && bph < 90 + REL_RISE + REL_GAP) { return 'an empty slot'; }
    if (bph >= 90 + REL_RISE + REL_GAP) { return 'a new jar settles'; }
    var yph = t - Math.floor(t / YEAR) * YEAR;
    if (yph >= STIR_AT && yph < STIR_AT + STIR_LEN) { return 'one jar stirred'; }
    return 'the ferment waits';
  }

  // One motif, drawn inside the liquid: stems, a piano figure, a drum
  // loop, or a vocal line. Faint, half hidden by the cloud.
  function drawMotif(m, x0, y0, w, h, t, alpha) {
    ctx.strokeStyle = hexA(CHALK, a4(alpha));
    ctx.fillStyle = hexA(CHALK, a4(alpha));
    ctx.lineWidth = Math.max(1, h * 0.03);
    ctx.lineCap = 'round';
    if (m === 0) {
      // stems: three vertical lines with note heads
      for (var s = 0; s < 3; s++) {
        var sx = x0 + w * (0.22 + s * 0.28);
        var top = y0 + h * (0.25 + 0.18 * Math.sin(s * 2.1));
        ctx.beginPath(); ctx.moveTo(sx, y0 + h * 0.85); ctx.lineTo(sx, top); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sx + h * 0.07, top); ctx.arc(sx, top, h * 0.07, 0, Math.PI * 2); ctx.fill();
      }
    } else if (m === 1) {
      // piano figure: a zigzag run with two key blocks
      ctx.beginPath();
      ctx.moveTo(x0 + w * 0.1, y0 + h * 0.7);
      ctx.lineTo(x0 + w * 0.3, y0 + h * 0.35);
      ctx.lineTo(x0 + w * 0.5, y0 + h * 0.62);
      ctx.lineTo(x0 + w * 0.7, y0 + h * 0.3);
      ctx.lineTo(x0 + w * 0.9, y0 + h * 0.58);
      ctx.stroke();
      ctx.fillRect(x0 + w * 0.18, y0 + h * 0.78, w * 0.14, h * 0.12);
      ctx.fillRect(x0 + w * 0.62, y0 + h * 0.78, w * 0.14, h * 0.12);
    } else if (m === 2) {
      // drum loop: a ring with four beats around it
      var cx = x0 + w * 0.5, cy = y0 + h * 0.5, r = h * 0.22;
      ctx.beginPath(); ctx.moveTo(cx + r, cy); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      for (var d = 0; d < 4; d++) {
        var ang = d * Math.PI / 2 + 0.4;
        var dx = cx + Math.cos(ang) * h * 0.38;
        var dy = cy + Math.sin(ang) * h * 0.38;
        ctx.beginPath(); ctx.moveTo(dx + h * 0.045, dy); ctx.arc(dx, dy, h * 0.045, 0, Math.PI * 2); ctx.fill();
      }
    } else {
      // vocal line: a slow sine across the jar
      ctx.beginPath();
      var step = Math.max(2, w / 40);
      for (var x = 0; x <= w; x += step) {
        var y = y0 + h * 0.5 + Math.sin((x / w) * Math.PI * 2 * 1.5 + 0.8) * h * 0.22;
        if (x === 0) { ctx.moveTo(x0 + x, y); } else { ctx.lineTo(x0 + x, y); }
      }
      ctx.stroke();
    }
  }

  function drawJar(j, P, cloud, rs, stir, t, cx, shelfY, jw, jh) {
    var lidH = jh * 0.10;
    var bodyTop = shelfY - jh;
    var bodyH = jh - lidH;
    var yOff = 0, alpha = 1;
    if (rs.mode === 'rising') {
      var e = rs.p * rs.p;
      yOff = -e * H * 0.55;
      alpha = 1 - 0.75 * e;
    } else if (rs.mode === 'settling') {
      yOff = (1 - smooth(0, 1, rs.p)) * jh * 0.35;
      alpha = smooth(0, 1, rs.p);
    }
    if (alpha <= 0.01) { return; }

    var x0 = cx - jw / 2;
    var y0 = bodyTop + yOff;
    var lidY = y0 - lidH + lidH * 0.28;
    var lidLift = (j === STIR_JAR) ? stir * jh * 0.16 : 0;

    ctx.save();
    ctx.globalAlpha = a4(alpha);

    // Lid, lifted while the jar is stirred.
    ctx.fillStyle = WOOD_DK;
    ctx.fillRect(x0 + jw * 0.08, lidY - lidLift, jw * 0.84, lidH * 0.72);
    ctx.fillStyle = hexA(CHALK, a4(0.25));
    ctx.fillRect(x0 + jw * 0.08, lidY - lidLift, jw * 0.84, Math.max(1, lidH * 0.12));

    // Glass body.
    ctx.fillStyle = hexA(CHALK, a4(0.06));
    ctx.fillRect(x0, y0, jw, bodyH);
    ctx.strokeStyle = hexA(GLASS, a4(0.55));
    ctx.lineWidth = Math.max(1, jw * 0.03);
    ctx.strokeRect(x0, y0, jw, bodyH);

    // Liquid: fill level from the seed, surface waving gently.
    var fillH = bodyH * P.fill;
    var liqTop = y0 + bodyH - fillH;
    ctx.beginPath();
    ctx.moveTo(x0 + 1, liqTop);
    var lstep = Math.max(2, jw / 24);
    for (var lx = 0; lx <= jw; lx += lstep) {
      var ly = liqTop + Math.sin((lx / jw) * Math.PI * 2 * 1.5 + t * 0.11 + j) * jh * 0.008;
      ctx.lineTo(x0 + lx, ly);
    }
    ctx.lineTo(x0 + jw - 1, y0 + bodyH - 1);
    ctx.lineTo(x0 + 1, y0 + bodyH - 1);
    ctx.closePath();
    ctx.fillStyle = hexA(P.liquid, a4(0.35 + 0.5 * (1 - cloud)));
    ctx.fill();

    // Cloud blobs drifting almost imperceptibly inside the liquid.
    ctx.fillStyle = hexA(BONE, a4(0.30 * cloud));
    for (var b = 0; b < P.blobs.length; b++) {
      var bl = P.blobs[b];
      var bx = x0 + jw * (bl.x + 0.03 * Math.sin(t * 0.05 + bl.ph));
      var by = liqTop + fillH * bl.y;
      var br = jw * bl.r;
      ctx.beginPath(); ctx.moveTo(bx + br, by); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
    }

    // The half-finished idea, seen through the cloud.
    drawMotif(P.motif, x0 + jw * 0.12, liqTop + fillH * 0.12, jw * 0.76, fillH * 0.76, t, 0.5 * (1 - cloud * 0.65));

    // Stir swirl: two arcs turning slowly while the lid is up.
    if (j === STIR_JAR && stir > 0.02) {
      var swR = jw * 0.30;
      var swC = { x: cx, y: liqTop + fillH * 0.45 };
      ctx.strokeStyle = hexA(CHALK, a4(0.55 * stir));
      ctx.lineWidth = Math.max(1, jh * 0.012);
      var swA = t * 0.9;
      ctx.beginPath(); ctx.moveTo(swC.x + Math.cos(swA) * swR, swC.y + Math.sin(swA) * swR * 0.6);
      ctx.arc(swC.x, swC.y, swR, swA, swA + Math.PI * 1.2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(swC.x + Math.cos(swA + Math.PI) * swR * 0.6, swC.y + Math.sin(swA + Math.PI) * swR * 0.36);
      ctx.arc(swC.x, swC.y, swR * 0.6, swA + Math.PI, swA + Math.PI * 1.9); ctx.stroke();
    }

    ctx.restore();
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var yph = t - Math.floor(t / YEAR) * YEAR;
    var seasonIdx = Math.floor(yph / SEASON) % 4;
    var stir = stirAmount(t);

    // Wall: dark room, faintly lighter toward the clock.
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);
    var wg = ctx.createRadialGradient(W / 2, H * 0.14, 0, W / 2, H * 0.14, Math.min(W, H) * 0.6);
    wg.addColorStop(0, hexA(WALL_LT, 0.9));
    wg.addColorStop(1, hexA(WALL_LT, 0));
    ctx.fillStyle = wg;
    ctx.fillRect(0, 0, W, H);

    // Shelf plank.
    var shelfY = H * 0.60;
    var plankH = Math.max(8, H * 0.045);
    ctx.fillStyle = WOOD;
    ctx.fillRect(0, shelfY, W, plankH);
    ctx.fillStyle = WOOD_DK;
    ctx.fillRect(0, shelfY + plankH, W, Math.max(3, H * 0.008));
    ctx.strokeStyle = hexA(WOOD_DK, a4(0.6));
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, shelfY + plankH * 0.45); ctx.lineTo(W, shelfY + plankH * 0.45);
    ctx.stroke();
    // Brackets under the shelf.
    ctx.fillStyle = WOOD_DK;
    ctx.fillRect(W * 0.06, shelfY + plankH, W * 0.02, H * 0.05);
    ctx.fillRect(W * 0.92, shelfY + plankH, W * 0.02, H * 0.05);

    // Season clock above center: chalk ring, four season ticks, a hand
    // that turns once a year, and a faint arc of the year already past.
    var ccx = W / 2, ccy = H * 0.15;
    var cr = Math.min(W, H) * 0.088;
    ctx.strokeStyle = hexA(CHALK, a4(0.9));
    ctx.lineWidth = Math.max(1.5, cr * 0.045);
    ctx.beginPath(); ctx.moveTo(ccx + cr, ccy); ctx.arc(ccx, ccy, cr, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = hexA(CHALK, a4(0.35));
    ctx.lineWidth = Math.max(1.5, cr * 0.05);
    ctx.beginPath(); ctx.moveTo(ccx + cr, ccy); ctx.arc(ccx, ccy, cr, -Math.PI / 2, -Math.PI / 2 + (yph / YEAR) * Math.PI * 2); ctx.stroke();
    for (var s = 0; s < 4; s++) {
      var sa = -Math.PI / 2 + s * Math.PI / 2;
      var tx1 = ccx + Math.cos(sa) * cr * 0.82, ty1 = ccy + Math.sin(sa) * cr * 0.82;
      var tx2 = ccx + Math.cos(sa) * cr * 0.98, ty2 = ccy + Math.sin(sa) * cr * 0.98;
      ctx.strokeStyle = hexA(CHALK, a4(s === seasonIdx ? 0.95 : 0.5));
      ctx.lineWidth = Math.max(1.5, cr * (s === seasonIdx ? 0.07 : 0.045));
      ctx.beginPath(); ctx.moveTo(tx1, ty1); ctx.lineTo(tx2, ty2); ctx.stroke();
    }
    var ha = -Math.PI / 2 + (yph / YEAR) * Math.PI * 2;
    ctx.strokeStyle = hexA(CHALK, a4(0.95));
    ctx.lineWidth = Math.max(1.5, cr * 0.05);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ccx, ccy); ctx.lineTo(ccx + Math.cos(ha) * cr * 0.72, ccy + Math.sin(ha) * cr * 0.72); ctx.stroke();
    ctx.fillStyle = hexA(CHALK, a4(0.95));
    ctx.beginPath(); ctx.moveTo(ccx + cr * 0.09, ccy); ctx.arc(ccx, ccy, cr * 0.09, 0, Math.PI * 2); ctx.fill();

    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'center';
    ctx.fillStyle = hexA(CHALK, a4(0.9));
    ctx.font = 'italic ' + fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(SEASONS[seasonIdx], ccx, ccy + cr + fs2 + 10);
    ctx.textAlign = 'left';

    // The eight jars across the middle, on the shelf.
    var jw = W * 0.088, jh = H * 0.26;
    for (var j = 0; j < N_JARS; j++) {
      var jcx = W * (0.075 + j * 0.115);
      var gen = jarGen(j, t);
      var P = jarProps(j, gen);
      var cloud = cloudiness(P, t);
      var rs = releaseState(j, t);
      if (rs.mode === 'gone') {
        // Empty slot: a faint chalk outline and a dust ring where the
        // jar stood, waiting for its replacement.
        ctx.strokeStyle = hexA(CHALK, a4(0.28));
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(jcx - jw / 2, shelfY - jh, jw, jh);
        ctx.setLineDash([]);
        ctx.strokeStyle = hexA(CHALK, a4(0.18));
        ctx.beginPath(); ctx.moveTo(jcx - jw * 0.3, shelfY + 2); ctx.arc(jcx, shelfY + 2, jw * 0.3, 0, Math.PI); ctx.stroke();
        continue;
      }
      drawJar(j, P, cloud, rs, stir, t, jcx, shelfY, jw, jh);
    }

    // A low chalk line under the shelf: the ferment resists measurement,
    // so the only marks are the jars themselves.
    ctx.fillStyle = hexA(CHALK, a4(0.4));
    ctx.textAlign = 'center';
    ctx.font = 'italic ' + fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('eight jars, none finished', W / 2, shelfY + plankH + H * 0.085);
    ctx.textAlign = 'left';

    // Plates: title top-left, season and jar count top-right.
    ctx.fillStyle = CHALK;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('The Long Ferment', 18, 34);
    ctx.fillStyle = hexA(CHALK, 0.75);
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1929 · 2007 · 04 · 24', 18, 34 + fs2 + 8);

    ctx.textAlign = 'right';
    ctx.fillStyle = CHALK;
    ctx.font = '600 ' + fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('8 jars · ' + SEASONS[seasonIdx], W - 18, 34);
    ctx.fillStyle = hexA(CHALK, 0.75);
    ctx.font = 'italic ' + fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(phaseWord(t), W - 18, 34 + fs2 + 8);
    ctx.textAlign = 'left';

    // Hint, centered at the bottom. Watch only.
    ctx.fillStyle = hexA(CHALK, 0.85);
    ctx.textAlign = 'center';
    var hint = 'Watch only. The ferment takes its time.';
    ctx.font = Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    if (W < 560) {
      ctx.fillText('Watch only. The ferment', W / 2, H - 34);
      ctx.fillText('takes its time.', W / 2, H - 16);
    } else {
      ctx.fillText(hint, W / 2, H - 20);
    }
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Watch only: no pointer handlers, no audio. All motion runs far under
  // the 14 Hz ceiling; the year turns once in 240 seconds.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
