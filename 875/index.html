<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№875 Pay Phone Portal</title>
<style>
  html, body { margin: 0; padding: 0; background: #1c1a26; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №875 Pay Phone Portal, SOA5 / PP1275, study #264 sheldon-omar-abba.
  // The driver is a felt phenomenon first: a dead pay phone on a
  // city corner at dusk, its booth holding a photograph behind
  // the glass that glows faintly while the street goes on around
  // it. The phone is the frame and the neighborhood is the
  // gallery. Street life drifts past and headlights sweep the
  // brick, but the photograph inside stays. A tap steps through
  // the portal to the next dead phone in the city, because the
  // mechanism is momentary portals and the city is the network.
  // The booth is never repaired, there are no white walls, no
  // admission, no threshold. Tap to step, never click-to-reload.
  var GROUND = '#1c1a26'; // page ground, dusk street

  // Fixed-phase first frame: FIRST_T = 5 s into a 60 s cycle.
  // Pedestrians, headlights and the photo glow are pure
  // functions of (t - FIRST_T) / CYCLE, so the frame at
  // FIRST_T + 60 equals the frame at FIRST_T exactly.
  var FIRST_T = 5;
  var CYCLE = 60;
  var SEED = 875;
  var TRANSIT = 0.9; // portal hop duration, seconds

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // ?node=<0..2> selects the portal node at load. Read at load only.
  var probeT = null;
  var probeNode = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
    var mn = qs.match(/[?&]node=([0-9]+)/);
    if (mn) { probeNode = parseInt(mn[1], 10) % 3; }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;
  var nodeIndex = (probeNode !== null) ? probeNode : 0;
  var pendingNode = -1;
  var tapT = -1; // virtual time of the last tap, -1 when idle

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }
  function circle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }
  function ellipsePath(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  }
  function rr(x, y, w, h, r) {
    // Rounded rect path, started at its own first point.
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function wrap01(v) { return ((v % 1) + 1) % 1; }

  // Palette: dusk street, metal grey booth, glowing photograph,
  // red brick. Each node keeps its own wall tone and photo.
  var DUSK_TOP = [26, 28, 52];
  var DUSK_HORIZON = [122, 74, 62];
  var BRICK = [[122, 59, 46], [104, 50, 44], [131, 64, 47]];
  var BRICK_DARK = [[94, 44, 34], [80, 38, 34], [100, 48, 35]];
  var MORTAR = [168, 138, 120];
  var METAL = [138, 143, 148];
  var METAL_DARK = [88, 92, 96];
  var METAL_LIGHT = [178, 182, 186];
  var INTERIOR = [30, 34, 42];
  var SIDEWALK = [112, 106, 100];
  var ASPHALT = [52, 52, 58];
  var CREAM = [242, 237, 226]; // caption and hint
  var GLOW = [255, 196, 120];

  // Node data: street sign lines, photo kind, wall accent.
  var NODES = [
    { line1: 'GIRARD AVE', line2: 'LAWRENCE ST', photo: 'sea', accent: [196, 148, 84] },
    { line1: '13TH ST', line2: 'MARKET ST', photo: 'mountain', accent: [120, 150, 180] },
    { line1: 'GIRARD AVE', line2: 'MARSHALL ST', photo: 'forest', accent: [140, 170, 110] }
  ];

  // ---- Seeded texture tables, fixed at load -----------------------
  // Brick vertical joints: per-course offsets, fixed.
  var brickRng = mulberry32(SEED * 7 + 3);
  var JOINTS = [];
  var ji;
  for (ji = 0; ji < 40; ji++) { JOINTS.push(brickRng()); }
  // Sidewalk cracks and stains.
  var crackRng = mulberry32(SEED * 13 + 5);
  var CRACKS = [];
  var ci;
  for (ci = 0; ci < 9; ci++) {
    CRACKS.push({ x: crackRng(), y: 0.63 + crackRng() * 0.13,
      dx: (crackRng() - 0.5) * 0.06, dy: 0.01 + crackRng() * 0.03 });
  }
  // Window lights in the far rooftops, fixed on/off per node seed.
  var winRng = mulberry32(SEED * 17 + 9);
  var WINDOWS = [];
  var wi;
  for (wi = 0; wi < 26; wi++) {
    WINDOWS.push({ x: winRng(), lit: winRng() > 0.55,
      warm: winRng() > 0.5 });
  }
  // Stars in the dusk sky, faint and fixed.
  var starRng = mulberry32(SEED * 23 + 2);
  var STARS = [];
  var sti;
  for (sti = 0; sti < 30; sti++) {
    STARS.push({ x: starRng(), y: starRng() * 0.14,
      r: 0.0008 + starRng() * 0.0012, a: 0.25 + starRng() * 0.45 });
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.fsSign = Math.round(clamp(W * 0.014, 8, 11));
    L.fsPhoto = Math.round(clamp(W * 0.013, 8, 10));
    // Booth: bus-stop height, centred on the block. Height is a
    // share of the stage height, width follows the booth's own
    // proportion so it reads on tall phones too.
    L.boothH = H * 0.52;
    L.boothW = L.boothH * 0.52;
    L.boothX = (W - L.boothW) / 2;
    L.boothTop = H * 0.13;
    L.boothBot = L.boothTop + L.boothH;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // u is 0..1 across the 60 s cycle.
  function phaseU(t) {
    return wrap01((t - FIRST_T) / CYCLE);
  }
  // Portal transition progress at time t: -1 when idle, else 0..1.
  // The node swaps at the midpoint, when the glow is brightest.
  function transitQ(t) {
    if (tapT < 0) { return -1; }
    var q = (t - tapT) / TRANSIT;
    if (q >= 1) { return -1; }
    return q;
  }

  // ---- Street: sky, rooftops, brick wall, sidewalk, road ---------
  function drawStreet(t) {
    var u = phaseU(t);
    var i, x, y;
    // Dusk sky, deep indigo to a warm band at the horizon.
    var sky = ctx.createLinearGradient(0, 0, 0, H * 0.22);
    sky.addColorStop(0, rgb(DUSK_TOP));
    sky.addColorStop(1, rgb(DUSK_HORIZON));
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H * 0.22);
    // Faint early stars.
    for (i = 0; i < STARS.length; i++) {
      ctx.fillStyle = rgba(CREAM, a4(STARS[i].a * 0.7));
      circle(W * STARS[i].x, H * STARS[i].y, W * STARS[i].r);
      ctx.fill();
    }
    // Far rooftops: a dark silhouette with a few lit windows.
    ctx.fillStyle = rgb([38, 32, 44]);
    ctx.fillRect(0, H * 0.155, W, H * 0.065);
    ctx.fillRect(W * 0.06, H * 0.125, W * 0.16, H * 0.03);
    ctx.fillRect(W * 0.68, H * 0.135, W * 0.12, H * 0.02);
    ctx.fillRect(W * 0.84, H * 0.11, W * 0.05, H * 0.045);
    for (i = 0; i < WINDOWS.length; i++) {
      if (!WINDOWS[i].lit) { continue; }
      ctx.fillStyle = WINDOWS[i].warm ? rgba([255, 196, 110], a4(0.85)) : rgba([180, 200, 220], a4(0.7));
      ctx.fillRect(W * (0.03 + WINDOWS[i].x * 0.94), H * 0.175, W * 0.008, H * 0.012);
    }
    // Red brick wall, the block's face, with mortar courses.
    ctx.fillStyle = rgb(BRICK[nodeIndex]);
    ctx.fillRect(0, H * 0.22, W, H * 0.40);
    var courseH = H * 0.02;
    var row;
    ctx.strokeStyle = rgba(MORTAR, a4(0.35));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    ctx.beginPath();
    for (row = 0; row < 20; row++) {
      y = H * 0.22 + row * courseH;
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    ctx.stroke();
    // Vertical joints, staggered per course, index-stepped so the
    // last joint always lands exactly on the edge.
    ctx.beginPath();
    for (row = 0; row < 20; row++) {
      y = H * 0.22 + row * courseH;
      var off = JOINTS[row % JOINTS.length];
      var cols = 12;
      for (i = 0; i <= cols; i++) {
        x = ((i + (row % 2 ? off : 1 - off)) / cols) * W;
        if (x < 0 || x > W) { continue; }
        ctx.moveTo(x, y); ctx.lineTo(x, y + courseH);
      }
    }
    ctx.stroke();
    // Brick shading: a darker band low on the wall, a warm wash
    // high where the last sun catches it.
    ctx.fillStyle = rgba(BRICK_DARK[nodeIndex], a4(0.35));
    ctx.fillRect(0, H * 0.52, W, H * 0.10);
    ctx.fillStyle = rgba(DUSK_HORIZON, a4(0.12));
    ctx.fillRect(0, H * 0.22, W, H * 0.06);
    // Node accent: a painted sign or awning on the wall.
    if (nodeIndex === 0) {
      // Corner store awning, left of the booth.
      ctx.fillStyle = rgb([46, 74, 58]);
      ctx.beginPath();
      ctx.moveTo(W * 0.02, H * 0.30);
      ctx.lineTo(W * 0.20, H * 0.30);
      ctx.lineTo(W * 0.18, H * 0.36);
      ctx.lineTo(W * 0.04, H * 0.36);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = rgba(CREAM, a4(0.85));
      ctx.font = '600 ' + L.fsSign + 'px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText(W >= 600 ? 'CORNER STORE' : 'STORE', W * 0.11, H * 0.345);
      ctx.textAlign = 'left';
      // Shop window, warm and lit.
      ctx.fillStyle = rgba([255, 196, 110], a4(0.55));
      ctx.fillRect(W * 0.03, H * 0.40, W * 0.15, H * 0.10);
      ctx.strokeStyle = rgba(METAL_DARK, a4(0.8));
      ctx.lineWidth = Math.max(1, W * 0.002);
      ctx.strokeRect(W * 0.03, H * 0.40, W * 0.15, H * 0.10);
    } else if (nodeIndex === 1) {
      // A streetlamp, right of the booth, its cone of warm light.
      // On phones it steps to the left so it never meets the
      // bus-stop pole.
      var lx = isPhone ? W * 0.12 : W * 0.86, lyTop = H * 0.24, lyBot = H * 0.62;
      ctx.fillStyle = rgba(GLOW, a4(0.10));
      ctx.beginPath();
      ctx.moveTo(lx - W * 0.01, lyTop);
      ctx.lineTo(lx + W * 0.01, lyTop);
      ctx.lineTo(lx + W * 0.09, lyBot);
      ctx.lineTo(lx - W * 0.09, lyBot);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = rgb(METAL_DARK);
      ctx.fillRect(lx - W * 0.004, lyTop, W * 0.008, lyBot - lyTop);
      ctx.fillStyle = rgb(GLOW);
      circle(lx, lyTop, W * 0.012);
      ctx.fill();
      ctx.fillStyle = rgba(GLOW, a4(0.35));
      circle(lx, lyTop, W * 0.022);
      ctx.fill();
    } else {
      // Painted wall sign, faded, left of the booth.
      ctx.fillStyle = rgba(CREAM, a4(0.28));
      ctx.font = '600 ' + Math.round(L.fsSign * 1.6) + 'px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText('FRESH', W * 0.11, H * 0.32);
      ctx.fillText('BREAD', W * 0.11, H * 0.32 + L.fsSign * 1.8);
      ctx.textAlign = 'left';
      ctx.strokeStyle = rgba(CREAM, a4(0.28));
      ctx.lineWidth = Math.max(1, W * 0.002);
      ctx.strokeRect(W * 0.03, H * 0.27, W * 0.16, H * 0.11);
    }
    // Sidewalk slabs with seams and cracks.
    ctx.fillStyle = rgb(SIDEWALK);
    ctx.fillRect(0, H * 0.62, W, H * 0.16);
    ctx.strokeStyle = rgba([80, 76, 72], a4(0.5));
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.beginPath();
    for (i = 0; i <= 5; i++) {
      x = i * W * 0.2;
      ctx.moveTo(x, H * 0.62); ctx.lineTo(x, H * 0.78);
    }
    ctx.moveTo(0, H * 0.70); ctx.lineTo(W, H * 0.70);
    ctx.stroke();
    ctx.strokeStyle = rgba([70, 66, 62], a4(0.6));
    ctx.beginPath();
    for (i = 0; i < CRACKS.length; i++) {
      ctx.moveTo(W * CRACKS[i].x, H * CRACKS[i].y);
      ctx.lineTo(W * (CRACKS[i].x + CRACKS[i].dx), H * (CRACKS[i].y + CRACKS[i].dy));
    }
    ctx.stroke();
    // Kerb, then the street.
    ctx.fillStyle = rgb([150, 144, 136]);
    ctx.fillRect(0, H * 0.775, W, H * 0.008);
    ctx.fillStyle = rgb(ASPHALT);
    ctx.fillRect(0, H * 0.783, W, H * 0.217);
    // Dashed centre line.
    ctx.strokeStyle = rgba([216, 212, 200], a4(0.5));
    ctx.lineWidth = Math.max(1.5, W * 0.004);
    ctx.setLineDash([W * 0.05, W * 0.04]);
    ctx.beginPath();
    ctx.moveTo(0, H * 0.895); ctx.lineTo(W, H * 0.895);
    ctx.stroke();
    ctx.setLineDash([]);
    // A drain grate near the kerb.
    ctx.strokeStyle = rgba([30, 30, 34], a4(0.9));
    ctx.lineWidth = Math.max(1, W * 0.002);
    ctx.strokeRect(W * 0.08, H * 0.81, W * 0.06, H * 0.02);
    void u;
  }

  // ---- The photograph inside the booth, one per node -------------
  // The photograph stays: it never moves with the street, only
  // its glow breathes, slowly, once per cycle.
  function drawPhoto(t, px, py, pw, ph) {
    var kind = NODES[nodeIndex].photo;
    var i, x, y;
    if (kind === 'sea') {
      var seaSky = ctx.createLinearGradient(0, py, 0, py + ph);
      seaSky.addColorStop(0, '#e8b25e');
      seaSky.addColorStop(0.55, '#c97e4e');
      seaSky.addColorStop(0.55, '#3d6a8a');
      seaSky.addColorStop(1, '#274b66');
      ctx.fillStyle = seaSky;
      ctx.fillRect(px, py, pw, ph);
      ctx.fillStyle = rgb([255, 226, 150]);
      circle(px + pw * 0.68, py + ph * 0.42, pw * 0.10);
      ctx.fill();
      ctx.strokeStyle = rgba([255, 226, 150], a4(0.7));
      ctx.lineWidth = Math.max(1, pw * 0.02);
      ctx.beginPath();
      for (i = 0; i < 3; i++) {
        y = py + ph * (0.62 + i * 0.10);
        ctx.moveTo(px + pw * 0.15, y);
        ctx.lineTo(px + pw * 0.85, y);
      }
      ctx.stroke();
      // A small sailboat on the horizon.
      ctx.fillStyle = rgb([30, 40, 52]);
      ctx.beginPath();
      ctx.moveTo(px + pw * 0.30, py + ph * 0.55);
      ctx.lineTo(px + pw * 0.30, py + ph * 0.38);
      ctx.lineTo(px + pw * 0.44, py + ph * 0.55);
      ctx.closePath();
      ctx.fill();
      ctx.fillRect(px + pw * 0.26, py + ph * 0.55, pw * 0.22, ph * 0.03);
    } else if (kind === 'mountain') {
      var mtSky = ctx.createLinearGradient(0, py, 0, py + ph);
      mtSky.addColorStop(0, '#5a3a6e');
      mtSky.addColorStop(0.6, '#c96a3e');
      mtSky.addColorStop(1, '#e8a05e');
      ctx.fillStyle = mtSky;
      ctx.fillRect(px, py, pw, ph);
      ctx.fillStyle = rgb([255, 210, 140]);
      circle(px + pw * 0.50, py + ph * 0.52, pw * 0.09);
      ctx.fill();
      // Two layered ridges, far then near.
      ctx.fillStyle = rgb([74, 52, 92]);
      ctx.beginPath();
      ctx.moveTo(px, py + ph * 0.62);
      ctx.lineTo(px + pw * 0.28, py + ph * 0.30);
      ctx.lineTo(px + pw * 0.55, py + ph * 0.62);
      ctx.lineTo(px + pw * 0.78, py + ph * 0.40);
      ctx.lineTo(px + pw, py + ph * 0.62);
      ctx.lineTo(px + pw, py + ph);
      ctx.lineTo(px, py + ph);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = rgb([44, 32, 58]);
      ctx.beginPath();
      ctx.moveTo(px, py + ph * 0.78);
      ctx.lineTo(px + pw * 0.35, py + ph * 0.48);
      ctx.lineTo(px + pw * 0.62, py + ph * 0.78);
      ctx.lineTo(px + pw * 0.85, py + ph * 0.58);
      ctx.lineTo(px + pw, py + ph * 0.78);
      ctx.lineTo(px + pw, py + ph);
      ctx.lineTo(px, py + ph);
      ctx.closePath();
      ctx.fill();
    } else {
      // Forest path: green canopy, a pale path, trunks, light.
      var foSky = ctx.createLinearGradient(0, py, 0, py + ph);
      foSky.addColorStop(0, '#9dbb6a');
      foSky.addColorStop(0.5, '#5d7a3c');
      foSky.addColorStop(1, '#33471f');
      ctx.fillStyle = foSky;
      ctx.fillRect(px, py, pw, ph);
      ctx.fillStyle = rgba([232, 220, 170], a4(0.85));
      ctx.beginPath();
      ctx.moveTo(px + pw * 0.42, py + ph);
      ctx.lineTo(px + pw * 0.48, py + ph * 0.55);
      ctx.lineTo(px + pw * 0.54, py + ph * 0.55);
      ctx.lineTo(px + pw * 0.62, py + ph);
      ctx.closePath();
      ctx.fill();
      // Trunks, dark against the light.
      ctx.fillStyle = rgb([38, 48, 26]);
      for (i = 0; i < 5; i++) {
        x = px + pw * (0.08 + i * 0.20);
        ctx.fillRect(x, py + ph * 0.18, pw * 0.03, ph * 0.82);
      }
      // A shaft of light through the canopy.
      ctx.fillStyle = rgba([255, 240, 180], a4(0.25));
      ctx.beginPath();
      ctx.moveTo(px + pw * 0.55, py);
      ctx.lineTo(px + pw * 0.68, py);
      ctx.lineTo(px + pw * 0.58, py + ph);
      ctx.lineTo(px + pw * 0.48, py + ph);
      ctx.closePath();
      ctx.fill();
    }
  }

  // ---- The booth --------------------------------------------------
  function drawBooth(t) {
    var u = phaseU(t);
    var bx = L.boothX, by = L.boothTop, bw = L.boothW, bh = L.boothH;
    var px = bx + bw * 0.14, py = by + bh * 0.16;
    var pw = bw * 0.72, ph = bh * 0.24;
    var i;
    // Booth shadow, flat on the sidewalk.
    ctx.fillStyle = rgba([12, 12, 16], a4(0.35));
    ellipsePath(bx + bw * 0.55, L.boothBot + H * 0.012, bw * 0.55, H * 0.012, 0);
    ctx.fill();
    // Roof cap and the TELEPHONE sign band.
    ctx.fillStyle = rgb(METAL_DARK);
    rr(bx - bw * 0.04, by - bh * 0.035, bw * 1.08, bh * 0.055, bw * 0.02);
    ctx.fill();
    ctx.fillStyle = rgb([30, 34, 40]);
    ctx.fillRect(bx, by + bh * 0.015, bw, bh * 0.035);
    ctx.fillStyle = rgba(CREAM, a4(0.9));
    ctx.font = '600 ' + Math.round(bw * 0.055) + 'px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('TELEPHONE', bx + bw / 2, by + bh * 0.042);
    ctx.textAlign = 'left';
    // Side posts and base.
    ctx.fillStyle = rgb(METAL);
    ctx.fillRect(bx, by + bh * 0.05, bw * 0.07, bh * 0.90);
    ctx.fillRect(bx + bw * 0.93, by + bh * 0.05, bw * 0.07, bh * 0.90);
    ctx.fillStyle = rgb(METAL_DARK);
    ctx.fillRect(bx - bw * 0.02, L.boothBot - bh * 0.03, bw * 1.04, bh * 0.03);
    // Back panel, dark interior.
    ctx.fillStyle = rgb(INTERIOR);
    ctx.fillRect(bx + bw * 0.07, by + bh * 0.05, bw * 0.86, bh * 0.90);
    // The photograph's glow, breathing once per cycle, spills
    // onto the back panel before the photograph is drawn.
    var breathe = 0.10 + 0.05 * Math.sin(2 * Math.PI * u);
    var glow = ctx.createRadialGradient(
      px + pw / 2, py + ph / 2, pw * 0.2,
      px + pw / 2, py + ph / 2, pw * 1.1);
    glow.addColorStop(0, rgba(GLOW, a4(0.55 + breathe)));
    glow.addColorStop(1, rgba(GLOW, a4(0)));
    ctx.fillStyle = glow;
    ctx.fillRect(bx, by + bh * 0.05, bw, bh * 0.55);
    // The photograph, framed, glowing faintly inside.
    ctx.fillStyle = rgb([196, 164, 110]);
    ctx.fillRect(px - bw * 0.015, py - bh * 0.008, pw + bw * 0.03, ph + bh * 0.016);
    drawPhoto(t, px, py, pw, ph);
    ctx.strokeStyle = rgba([60, 48, 30], a4(0.8));
    ctx.lineWidth = Math.max(1, bw * 0.008);
    ctx.strokeRect(px - bw * 0.015, py - bh * 0.008, pw + bw * 0.03, ph + bh * 0.016);
    // The phone: a dark box, dial, handset on its cradle, cord.
    var phx = bx + bw * 0.16, phy = by + bh * 0.52;
    var phw = bw * 0.34, phh = bh * 0.20;
    ctx.fillStyle = rgb([24, 26, 30]);
    rr(phx, phy, phw, phh, bw * 0.02);
    ctx.fill();
    ctx.strokeStyle = rgba(METAL_LIGHT, a4(0.5));
    ctx.lineWidth = Math.max(1, bw * 0.006);
    rr(phx, phy, phw, phh, bw * 0.02);
    ctx.stroke();
    // Dial: a pale circle with a finger hole ring.
    ctx.fillStyle = rgb([210, 208, 200]);
    circle(phx + phw * 0.32, phy + phh * 0.42, bw * 0.055);
    ctx.fill();
    ctx.fillStyle = rgb([24, 26, 30]);
    circle(phx + phw * 0.32, phy + phh * 0.42, bw * 0.03);
    ctx.fill();
    // Coin slot and return.
    ctx.fillStyle = rgb(METAL_LIGHT);
    ctx.fillRect(phx + phw * 0.68, phy + phh * 0.18, bw * 0.02, phh * 0.30);
    ctx.fillStyle = rgb([24, 26, 30]);
    ctx.fillRect(phx + phw * 0.62, phy + phh * 0.62, bw * 0.16, phh * 0.14);
    // Handset hanging on the right side of the box.
    ctx.fillStyle = rgb([18, 20, 24]);
    rr(phx + phw * 0.86, phy + phh * 0.08, bw * 0.10, phh * 0.84, bw * 0.04);
    ctx.fill();
    // Cord, a loose curve from handset to box.
    ctx.strokeStyle = rgba([18, 20, 24], a4(0.95));
    ctx.lineWidth = Math.max(1, bw * 0.012);
    ctx.beginPath();
    ctx.moveTo(phx + phw * 0.91, phy + phh * 0.85);
    ctx.bezierCurveTo(phx + phw * 0.75, phy + phh * 1.05,
      phx + phw * 0.55, phy + phh * 1.02, phx + phw * 0.45, phy + phh * 0.88);
    ctx.stroke();
    // A small shelf under the phone, and a tattered directory.
    ctx.fillStyle = rgb(METAL_DARK);
    ctx.fillRect(bx + bw * 0.10, by + bh * 0.78, bw * 0.80, bh * 0.015);
    ctx.fillStyle = rgb([150, 140, 110]);
    ctx.fillRect(bx + bw * 0.14, by + bh * 0.745, bw * 0.20, bh * 0.035);
    // Glass side panels: a faint sheen over the interior, with
    // two vertical streaks so the glass reads.
    ctx.fillStyle = rgba([200, 210, 220], a4(0.05));
    ctx.fillRect(bx + bw * 0.07, by + bh * 0.05, bw * 0.86, bh * 0.90);
    ctx.fillStyle = rgba([255, 255, 255], a4(0.07));
    ctx.fillRect(bx + bw * 0.24, by + bh * 0.05, bw * 0.02, bh * 0.90);
    ctx.fillRect(bx + bw * 0.68, by + bh * 0.05, bw * 0.015, bh * 0.90);
    // A dent in the lower left post: the booth is never repaired.
    ctx.fillStyle = rgba([20, 20, 24], a4(0.8));
    ellipsePath(bx + bw * 0.035, by + bh * 0.82, bw * 0.03, bh * 0.02, 0.4);
    ctx.fill();
    void i;
  }

  // ---- Street life: pedestrians drifting past ---------------------
  // Three walkers, each a pure function of the cycle phase, so
  // every walker is back where it started at FIRST_T + CYCLE.
  // Speeds are whole crossings per cycle, so the wrap is exact.
  function drawWalker(x, yBase, h, dir, stepPhase, coat) {
    var bob = Math.abs(Math.sin(stepPhase * Math.PI)) * h * 0.03;
    var y = yBase - bob;
    var legSwing = Math.sin(stepPhase * Math.PI * 2) * h * 0.06;
    ctx.fillStyle = rgb(coat);
    // Coat: a rounded body.
    rr(x - h * 0.09, y - h * 0.62, h * 0.18, h * 0.62, h * 0.05);
    ctx.fill();
    // Head.
    ctx.fillStyle = rgb([26, 22, 20]);
    circle(x, y - h * 0.72, h * 0.09);
    ctx.fill();
    // Legs, two strokes swinging against each other.
    ctx.strokeStyle = rgb([22, 20, 22]);
    ctx.lineWidth = Math.max(1.5, h * 0.05);
    ctx.beginPath();
    ctx.moveTo(x - h * 0.03, y - h * 0.02);
    ctx.lineTo(x - h * 0.03 + legSwing, y + h * 0.28);
    ctx.moveTo(x + h * 0.03, y - h * 0.02);
    ctx.lineTo(x + h * 0.03 - legSwing, y + h * 0.28);
    ctx.stroke();
    // A bag on the shoulder, swinging the other way.
    ctx.fillStyle = rgb([40, 34, 28]);
    rr(x + dir * h * 0.10 - h * 0.05, y - h * 0.42 - legSwing * 0.3, h * 0.10, h * 0.14, h * 0.02);
    ctx.fill();
  }
  function drawStreetLife(t) {
    var u = phaseU(t);
    var yBase = H * 0.755;
    var h = H * 0.085;
    // Walker A: one crossing, left to right, dark coat.
    var xa = wrap01(0.05 + u) * 1.2 - 0.1;
    drawWalker(W * xa, yBase, h, 1, u * 9, [30, 30, 38]);
    // Walker B: two crossings, right to left, rust coat.
    var xb = wrap01(0.80 - 2 * u) * 1.2 - 0.1;
    drawWalker(W * xb, yBase + H * 0.012, h * 0.92, -1, u * 18 + 0.4, [96, 52, 40]);
    // Walker C: one crossing, left to right, slower, grey coat,
    // half a cycle behind A so the sidewalk is never empty.
    var xc = wrap01(0.55 + u) * 1.2 - 0.1;
    drawWalker(W * xc, yBase + H * 0.006, h * 1.05, 1, u * 9 + 0.5, [58, 58, 64]);
  }

  // ---- Headlights: one car per cycle, sweeping the brick ---------
  // The car is fully off-screen at both p = 0 and p = 1, so the
  // frame at FIRST_T + CYCLE matches the frame at FIRST_T.
  function drawHeadlights(t) {
    var u = phaseU(t);
    var p = clamp((u - 0.30) / 0.25, 0, 1);
    if (p <= 0 || p >= 1) { return; }
    var ease = p * p * (3 - 2 * p);
    var carX = (-0.18 + ease * 1.36) * W;
    var carY = H * 0.845;
    var carW = W * 0.20, carH = H * 0.055;
    // Warm wash thrown ahead of the car onto the wall and booth.
    var washA = 0.14 * Math.sin(Math.PI * ease);
    var wash = ctx.createLinearGradient(carX, 0, carX + W * 0.35, 0);
    wash.addColorStop(0, rgba(GLOW, a4(washA)));
    wash.addColorStop(1, rgba(GLOW, a4(0)));
    ctx.fillStyle = wash;
    ctx.fillRect(carX, H * 0.22, W * 0.35, H * 0.40);
    // Headlight beams: two translucent cones ahead of the car.
    ctx.fillStyle = rgba(GLOW, a4(0.20 * Math.sin(Math.PI * ease)));
    ctx.beginPath();
    ctx.moveTo(carX + carW * 0.92, carY + carH * 0.30);
    ctx.lineTo(carX + carW * 1.55, carY + carH * 0.05);
    ctx.lineTo(carX + carW * 1.55, carY + carH * 0.75);
    ctx.closePath();
    ctx.fill();
    // The car itself: a dark sedan, roofline, windows, wheels.
    ctx.fillStyle = rgb([24, 26, 32]);
    rr(carX, carY, carW, carH, carH * 0.28);
    ctx.fill();
    ctx.fillStyle = rgb([24, 26, 32]);
    rr(carX + carW * 0.18, carY - carH * 0.45, carW * 0.58, carH * 0.55, carH * 0.2);
    ctx.fill();
    ctx.fillStyle = rgb([70, 84, 96]);
    ctx.fillRect(carX + carW * 0.24, carY - carH * 0.38, carW * 0.46, carH * 0.34);
    // Headlights on, taillight a red dot behind.
    ctx.fillStyle = rgb([255, 230, 160]);
    circle(carX + carW * 0.96, carY + carH * 0.45, carH * 0.14);
    ctx.fill();
    circle(carX + carW * 0.96, carY + carH * 0.72, carH * 0.14);
    ctx.fill();
    ctx.fillStyle = rgb([180, 40, 36]);
    circle(carX + carW * 0.03, carY + carH * 0.55, carH * 0.10);
    ctx.fill();
    // Wheels.
    ctx.fillStyle = rgb([12, 12, 14]);
    circle(carX + carW * 0.22, carY + carH * 0.95, carH * 0.22);
    ctx.fill();
    circle(carX + carW * 0.78, carY + carH * 0.95, carH * 0.22);
    ctx.fill();
  }

  // ---- Bus stop sign, carrying the node name ----------------------
  function drawBusStop() {
    var node = NODES[nodeIndex];
    // On phones the booth is wide, so the pole steps to the edge.
    var sx = isPhone ? W * 0.88 : W * 0.76, syTop = H * 0.30, poleBot = H * 0.70;
    ctx.fillStyle = rgb([52, 54, 56]);
    ctx.fillRect(sx - W * 0.003, syTop, W * 0.006, poleBot - syTop);
    // Blue BUS STOP sign.
    ctx.fillStyle = rgb([28, 78, 140]);
    rr(sx - W * 0.055, syTop - H * 0.045, W * 0.11, H * 0.045, 3);
    ctx.fill();
    ctx.fillStyle = rgba(CREAM, a4(0.95));
    ctx.font = '600 ' + L.fsSign + 'px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('BUS STOP', sx, syTop - H * 0.045 + L.fsSign * 1.5);
    // Green street signs, the node name, one line each.
    ctx.fillStyle = rgb([30, 92, 54]);
    ctx.fillRect(sx - W * 0.075, syTop + H * 0.012, W * 0.15, H * 0.028);
    ctx.fillRect(sx - W * 0.075, syTop + H * 0.046, W * 0.15, H * 0.028);
    ctx.fillStyle = rgba(CREAM, a4(0.95));
    ctx.fillText(node.line1, sx, syTop + H * 0.012 + L.fsSign * 1.45);
    ctx.fillText(node.line2, sx, syTop + H * 0.046 + L.fsSign * 1.45);
    ctx.textAlign = 'left';
  }

  // ---- Portal transition glow -------------------------------------
  // A warm white glow blooms out of the photograph, peaks at the
  // midpoint when the node swaps, and settles again.
  function drawPortal(t) {
    var q = transitQ(t);
    if (q < 0) { return; }
    var bloom = q < 0.5 ? q * 2 : (1 - q) * 2;
    var px = L.boothX + L.boothW / 2;
    var py = L.boothTop + L.boothH * 0.28;
    var glow = ctx.createRadialGradient(px, py, 1, px, py, W * 0.55);
    glow.addColorStop(0, rgba([255, 240, 210], a4(0.85 * bloom)));
    glow.addColorStop(0.6, rgba([255, 220, 170], a4(0.35 * bloom)));
    glow.addColorStop(1, rgba([255, 220, 170], a4(0)));
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- Caption and hint, on dark scrim plates ---------------------
  function drawText() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    var padX = W * 0.018, padY = L.fsCap * 0.55;
    var capW = W * 0.30, capH = L.fsCap + L.fsDate + padY * 2 + 8;
    ctx.fillStyle = rgba([10, 10, 10], a4(0.45));
    rr(W * 0.04 - padX, H * 0.04 - padY, capW, capH, 6);
    ctx.fill();
    ctx.fillStyle = rgba(CREAM, a4(0.92));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№875 · Pay Phone Portal', W * 0.04, H * 0.04 + L.fsCap * 0.8);
    ctx.fillStyle = rgba(CREAM, a4(0.62));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 06 · 04', W * 0.04, H * 0.04 + L.fsCap + L.fsDate + 8);
    // Hint pill, centred at the bottom.
    var hint = 'Tap to step to the next phone.';
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var pillW = hw + L.fsHint * 1.6, pillH = L.fsHint * 2.1;
    ctx.fillStyle = rgba([10, 10, 10], a4(0.45));
    rr(W / 2 - pillW / 2, H - pillH - L.fsHint * 0.7, pillW, pillH, pillH / 2);
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(CREAM, a4(0.88));
    ctx.fillText(hint, W / 2, H - L.fsHint * 0.7 - pillH / 2 + L.fsHint * 0.38);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Swap the node at the transition midpoint, when the glow
    // is brightest, so the hop reads as stepping through. The
    // raw progress is used, not the clamped one, so a long
    // frame gap can never strand a pending swap.
    if (tapT >= 0) {
      var rawQ = (t - tapT) / TRANSIT;
      if (rawQ >= 0.5 && pendingNode >= 0) {
        nodeIndex = pendingNode;
        pendingNode = -1;
      }
      if (rawQ >= 1) { tapT = -1; }
    }
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawStreet(t);
    drawBooth(t);
    drawStreetLife(t);
    drawHeadlights(t);
    drawBusStop();
    drawPortal(t);
    drawText();
  }

  // Tap steps through the portal to the next dead phone, in
  // order, wrapping: Girard/Lawrence, 13th and Market,
  // Girard/Marshall, then back. A tap mid-transition is
  // ignored; the hop has to finish before the next one starts.
  // With reduced motion the hop is instant, no bloom.
  function onTap() {
    if (transitQ(lastT) >= 0) { return; }
    if (reduced) {
      nodeIndex = (nodeIndex + 1) % 3;
      draw(lastT);
      return;
    }
    pendingNode = (nodeIndex + 1) % 3;
    tapT = lastT;
    draw(lastT);
  }
  try {
    if (typeof canvas.addEventListener === 'function') {
      canvas.addEventListener('pointerdown', onTap);
    }
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece875 exposes the clock, the cycle, the node list
  // and the tap hop.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece875 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      node: function () { return nodeIndex; },
      nodeName: function () { return NODES[nodeIndex].line1 + ' / ' + NODES[nodeIndex].line2; },
      setNode: function (i) { nodeIndex = ((i % 3) + 3) % 3; pendingNode = -1; tapT = -1; draw(lastT); },
      tap: function () { onTap(); },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: 60 s cycle, closed-form. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
