<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>№5002 · The Scale Mark</title><meta name="description" content="A repeating square tessellation recedes toward a movable vanishing point. Drag to alter the perspective; tap for a new composition."><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e4d5}canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;outline:none;cursor:grab}canvas:active{cursor:grabbing}canvas:focus-visible{outline:1px solid #343a31;outline-offset:-4px}
</style></head><body><canvas id="art" tabindex="0" aria-label="The Scale Mark. Drag to move the vanishing point. Tap or press Enter for another variation."></canvas><script>
'use strict';
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function scaleMark(seed,override){
  const r=rng(seed);
  const palettes=[["#e9e1d0","#252b2e","#a74e38","#b5a17f","#d4c8ad"],["#eae2cf","#253a3a","#a34b37","#8a9b8f","#d0bea2"],["#e8e1d5","#292d37","#b06a49","#92979b","#cec5b4"]];
  const [bg,ink,red,stone,pale]=palettes[Math.floor(r()*palettes.length)];
  const shapes=[],poly=(pts,c)=>shapes.push({kind:"poly",pts,c,t:0}),line=(x1,y1,x2,y2,w,c)=>shapes.push({kind:"line",x1,y1,x2,y2,w,c,t:0});
  const count=13+Math.floor(r()*5),sub=9+Math.floor(r()*6),cx=override?override.x:260+r()*200,cy=override?override.y:250+r()*220;
  const decay=.76+r()*.055;
  const corners=[[73,73],[647,73],[647,647],[73,647]];
  const frame=k=>corners.map(([x,y])=>[cx+(x-cx)*decay**k,cy+(y-cy)*decay**k]);
  const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
  poly(corners,ink);
  // One rule: project a repeated square grid towards a vanishing point.
  // Each level changes parity; narrow and wide modules are rhythmic, not random noise.
  for(let k=0;k<count;k++){
    const a=frame(k),b=frame(k+1),modules=Math.max(2,sub-Math.floor(k/2));
    for(let side=0;side<4;side++){
      const next=(side+1)%4,weights=Array.from({length:modules},(_,j)=>1+((j+side*2+k)%5===0?.8:0)+((j+k)%7===0?.22:0));
      const sum=weights.reduce((x,y)=>x+y,0);let u=0;
      for(let j=0;j<modules;j++){
        const v=u+weights[j]/sum,pts=[lerp(a[side],a[next],u),lerp(a[side],a[next],v),lerp(b[side],b[next],v),lerp(b[side],b[next],u)];
        const parity=(j+k+side)%2,accent=(j*3+side*5+k*2+seed%11)%17===0;
        const c=accent?red:side===0||side===2?(parity?bg:ink):(parity?stone:ink);
        poly(pts,c);
        if(k<7&&parity&&side%2===1&&!accent){
          const p0=lerp(pts[0],pts[1],.14),p1=lerp(pts[3],pts[2],.14),q0=lerp(pts[0],pts[1],.2),q1=lerp(pts[3],pts[2],.2);
          poly([p0,q0,q1,p1],pale);
        }
        u=v;
      }
    }
    if(k<9)for(let i=0;i<4;i++){const p=a[i],q=a[(i+1)%4];line(p[0],p[1],q[0],q[1],Math.max(.45,1.1*decay**k),ink);}
  }
  poly(frame(count),bg);
  const f=frame(count);
  for(let i=0;i<4;i++){const p=f[i],q=f[(i+1)%4];line(p[0],p[1],q[0],q[1],.75,ink);}
  // The tiny terminal square is the scale mark, not a figure.
  const m=Math.max(1.4,2.4*decay**(count-13));poly([[cx-m,cy-m],[cx+m,cy-m],[cx+m,cy+m],[cx-m,cy+m]],red);
  return {bg,shapes,maxT:0,stats:{levels:count,modules:sub,vanishingPoint:[cx,cy],decay}};
}
const build=scaleMark, GROWTH=false, DEFAULT=5002;
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion:reduce)');
let seed=Number(new URLSearchParams(location.search).get('seed')||DEFAULT)>>>0,model,frame=0,start=0,elapsed=0,lastSize=null,pointer=null,override=null;
function draw(progress=1){
 const vv=window.visualViewport,w=vv?vv.width:innerWidth,h=vv?vv.height:innerHeight,dpr=Math.min(devicePixelRatio||1,2.5);
 if(!lastSize||lastSize[0]!==w||lastSize[1]!==h||lastSize[2]!==dpr){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';lastSize=[w,h,dpr];}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=model.bg;ctx.fillRect(0,0,w,h);document.body.style.background=model.bg;
 const unit=Math.min(w,h)/720;ctx.translate((w-720*unit)/2,(h-720*unit)/2);ctx.scale(unit,unit);ctx.lineCap='round';ctx.lineJoin='round';
 const limit=model.maxT*progress;
 for(const q of model.shapes){if(q.t>limit)continue;ctx.fillStyle=q.c;ctx.strokeStyle=q.c;ctx.beginPath();
 if(q.kind==='line'){ctx.lineWidth=q.w;ctx.moveTo(q.x1,q.y1);ctx.lineTo(q.x2,q.y2);ctx.stroke();}
 else if(q.kind==='circle'){ctx.arc(q.x,q.y,q.rad,0,Math.PI*2);ctx.fill();}
 else{ctx.moveTo(...q.pts[0]);for(let i=1;i<q.pts.length;i++)ctx.lineTo(...q.pts[i]);ctx.closePath();ctx.fill();}}
}
function tick(t){frame=0;if(!start)start=t;elapsed=Math.min(1,(t-start)/4200);draw(elapsed);if(elapsed<1&&!document.hidden)frame=requestAnimationFrame(tick);}
function rebuild(animate){if(frame)cancelAnimationFrame(frame);frame=0;model=build(seed,override);start=0;elapsed=GROWTH&&animate&&!reduced.matches?0:1;draw(elapsed);if(elapsed<1&&!document.hidden)frame=requestAnimationFrame(tick);}
function newSeed(){seed=(Math.random()*4294967296)>>>0;override=null;history.replaceState(null,'','?seed='+seed);rebuild(true);}
function locationInArt(e){const r=canvas.getBoundingClientRect(),s=Math.min(r.width,r.height),x=(e.clientX-r.left-(r.width-s)/2)/s*720,y=(e.clientY-r.top-(r.height-s)/2)/s*720;return{x:Math.max(160,Math.min(560,x)),y:Math.max(160,Math.min(560,y))};}
canvas.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.id||GROWTH)return;if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>5)pointer.moved=true;if(pointer.moved){override=locationInArt(e);model=build(seed,override);draw(1);}});
canvas.addEventListener('pointerup',e=>{if(!pointer||e.pointerId!==pointer.id)return;const p=pointer;pointer=null;if(!p.moved&&Math.hypot(e.clientX-p.x,e.clientY-p.y)<7)newSeed();});
canvas.addEventListener('pointercancel',()=>{pointer=null;});canvas.addEventListener('lostpointercapture',()=>{pointer=null;});
canvas.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();newSeed();}});
function resize(){draw(elapsed);}
window.addEventListener('resize',resize);if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(frame)cancelAnimationFrame(frame);frame=0;}else if(elapsed<1&&!frame){start=performance.now()-elapsed*4200;frame=requestAnimationFrame(tick);}});
reduced.addEventListener('change',()=>{if(reduced.matches&&elapsed<1){if(frame)cancelAnimationFrame(frame);frame=0;elapsed=1;draw(1);}});
rebuild(false);
</script></body></html>
