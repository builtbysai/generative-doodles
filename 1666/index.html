<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Averaging, Generation 40</title>
<style>
html, body { margin: 0; padding: 0; background: #a89aa4; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#a89aa4';
var PLATE = '#f2efe8';
var INK = '#1c1c22';
/* Jos Vromans' 2021 pixel-averaging experiment as a living loop.
   Random colored noise is replaced, generation by generation, by the
   average of each pixel and its eight neighbours, edges wrapping to
   the far side. Speckles become islands, islands become continents,
   and because the averaging is toroidal the finished field tiles
   the plane seamlessly: once a cycle the field is shown repeated
   2x2 with a hairline grid marking the seams, then it reseeds to
   noise and starts again. Frame one is t = 8.0, generation 53:
   islands already visible, continents not yet settled. */
var RES = 128;
var GENS = 120;
var GEN_DT = 0.15;
var TILE_START = 18.0;
var CYCLE = 24.0;
var FIRST_T = 8.0;
/* One fixed seed per cycle, index 0 at load. Same laws, new noise. */
var SEEDS = [11, 29, 53, 97, 181, 349, 701, 1409];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smoothstep(a, b, x) {
  var f = clamp((x - a) / (b - a), 0, 1);
  return f * f * (3 - 2 * f);
}
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* Full-color noise: a uniform random hue at high saturation and
   value, converted to RGB. No palette is chosen by hand; the muted
   rainbow regions and mauve ground emerge from averaging alone. */
function hsvToRgb(h, s, v) {
  var i = Math.floor(h * 6), f = h * 6 - i;
  var p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  if (i === 0) return [v, t, p];
  if (i === 1) return [q, v, p];
  if (i === 2) return [p, v, t];
  if (i === 3) return [p, q, v];
  if (i === 4) return [t, p, v];
  return [v, p, q];
}
var N = RES * RES;
var bufR = new Float32Array(N);
var bufG = new Float32Array(N);
var bufB = new Float32Array(N);
var tmpR = new Float32Array(N);
var tmpG = new Float32Array(N);
var tmpB = new Float32Array(N);
var curGen = -1;
var curSeedIdx = -1;
function seedBuffer(seed) {
  var rng = mulberry32(seed);
  var i, c;
  for (i = 0; i < N; i++) {
    c = hsvToRgb(rng(), 0.85, 0.8);
    bufR[i] = c[0]; bufG[i] = c[1]; bufB[i] = c[2];
  }
  curGen = 0;
}
function stepGeneration() {
  var x, y, xx, yy, idx, s;
  var r, g, b;
  for (y = 0; y < RES; y++) {
    for (x = 0; x < RES; x++) {
      r = 0; g = 0; b = 0;
      for (yy = -1; yy <= 1; yy++) {
        for (xx = -1; xx <= 1; xx++) {
          idx = ((y + yy + RES) % RES) * RES + ((x + xx + RES) % RES);
          r += bufR[idx]; g += bufG[idx]; b += bufB[idx];
        }
      }
      s = y * RES + x;
      tmpR[s] = r / 9; tmpG[s] = g / 9; tmpB[s] = b / 9;
    }
  }
  bufR.set(tmpR); bufG.set(tmpG); bufB.set(tmpB);
  curGen++;
}
/* Ensure the working buffer holds exactly generation g of the cycle
   whose seed index is seedIdx. Steps forward from the cached state,
   or reseeds when the cycle wrapped. */
function ensureGen(g, seedIdx) {
  if (seedIdx !== curSeedIdx || g < curGen) {
    seedBuffer(SEEDS[seedIdx % SEEDS.length]);
    curSeedIdx = seedIdx;
  }
  while (curGen < g) stepGeneration();
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
var imgCache = null, imgW = 0, imgH = 0;
function getImage(w, h) {
  if (!imgCache || imgW !== w || imgH !== h) {
    imgCache = ctx.createImageData(w, h);
    imgW = w; imgH = h;
  }
  return imgCache;
}
/* Blit the working buffer into an on-screen rectangle by nearest
   neighbour sampling. The same buffer feeds every tile, so the 2x2
   proof repeats one field, never a second render. */
function blitBuffer(ox, oy, w, h) {
  var img = getImage(w, h);
  var data = img.data;
  var x, y, bx, by, src, dst;
  for (y = 0; y < h; y++) {
    by = Math.floor(y * RES / h);
    for (x = 0; x < w; x++) {
      bx = Math.floor(x * RES / w);
      src = by * RES + bx;
      dst = (y * w + x) * 4;
      data[dst] = Math.round(bufR[src] * 255);
      data[dst + 1] = Math.round(bufG[src] * 255);
      data[dst + 2] = Math.round(bufB[src] * 255);
      data[dst + 3] = 255;
    }
  }
  ctx.putImageData(img, ox, oy);
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Averaging, Generation 40').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Averaging, Generation 40').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 04').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = 'rgba(28,28,34,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Averaging, Generation 40', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = 'rgba(28,28,34,0.8)';
  ctx.fillText('2006 · 08 · 04', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = 'rgba(28,28,34,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = 'rgba(28,28,34,0.9)';
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var cycleIdx = Math.floor(t / CYCLE);
  var ct = t - cycleIdx * CYCLE;
  var seedIdx = cycleIdx % SEEDS.length;
  var tiling = ct >= TILE_START;
  var gen = tiling ? GENS - 1 : Math.min(GENS - 1, Math.floor(ct / GEN_DT));
  ensureGen(gen, seedIdx);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var S, ox, oy;
  if (isPhone) {
    S = Math.min(VW, VH);
    ox = 0; oy = 0;
    if (tiling) {
      var hw = Math.floor(VW / 2), hh = Math.floor(VH / 2);
      blitBuffer(0, 0, hw, hh);
      blitBuffer(hw, 0, hw, hh);
      blitBuffer(0, hh, hw, hh);
      blitBuffer(hw, hh, hw, hh);
    } else {
      blitBuffer(0, 0, VW, VH);
    }
  } else {
    S = Math.min(VW, VH);
    ox = Math.floor((VW - S) / 2); oy = Math.floor((VH - S) / 2);
    if (tiling) {
      var half = Math.floor(S / 2);
      blitBuffer(ox, oy, half, half);
      blitBuffer(ox + half, oy, half, half);
      blitBuffer(ox, oy + half, half, half);
      blitBuffer(ox + half, oy + half, half, half);
    } else {
      blitBuffer(ox, oy, S, S);
    }
  }
  if (tiling) {
    /* Hairline grid marks the seam positions, fading in and out as
       a closed-form function of cycle time. */
    var tt = ct - TILE_START;
    var alpha = 0.55 * smoothstep(0, 1, tt) * (1 - smoothstep(CYCLE - TILE_START - 1, CYCLE - TILE_START, tt));
    var gx, gy;
    ctx.strokeStyle = 'rgba(28,28,34,' + alpha.toFixed(4) + ')';
    ctx.lineWidth = 1;
    if (isPhone) {
      gx = Math.floor(VW / 2) + 0.5; gy = Math.floor(VH / 2) + 0.5;
      ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, VH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(VW, gy); ctx.stroke();
    } else {
      gx = ox + Math.floor(S / 2) + 0.5; gy = oy + Math.floor(S / 2) + 0.5;
      ctx.beginPath(); ctx.moveTo(gx, oy); ctx.lineTo(gx, oy + S); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ox, gy); ctx.lineTo(ox + S, gy); ctx.stroke();
    }
  }
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    generation: function () { return curGen; },
    resolution: function () { return RES; },
    generationsPerCycle: function () { return GENS; },
    cycleLength: function () { return CYCLE; }
  };
}
/* ---- frame one: t = 8.0, cycle 0, generation 53, islands ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = 0, prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(FIRST_T + clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
