<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Foraging Quipu</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #12100D; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict): cord, seed brown, leaf rust, root tan, petal red,
  // plastic blue, feather gray, background. Nothing else.
  var CORD = '#C9B896';
  var SEED_BROWN = '#5C3A21';
  var LEAF_RUST = '#A85A2E';
  var ROOT_TAN = '#C9A96A';
  var PETAL_RED = '#A83232';
  var PLASTIC_BLUE = '#3E7C8C';
  var FEATHER_GRAY = '#8A8A86';
  var GROUND = '#12100D';

  var BASE_SEED = 693001;
  var N_CORDS = 12;
  var BASE_COUNT = 5;      // a fresh archive already holds five objects
  var MAX_ITEMS = 60;      // the archive fills, then rests
  var STORE_KEY = 'foraging-quipu-693';
  var FORCE_T = -1;        // QA hook: -1 = live clock, else fixed elapsed seconds

  // QA seed hook: ?seed=tNN pins the elapsed time (used by the headless
  // renderer to inspect later phases). Inert in normal viewing.
  try {
    if (typeof location !== 'undefined' && location.search) {
      var qm = /[?&]seed=t([0-9]+(?:\.[0-9]+)?)/.exec(location.search);
      if (qm) FORCE_T = parseFloat(qm[1]);
    }
  } catch (e) { /* live mode */ }

  // Seeded RNG (mulberry32). Cord layout, the found-object sequence and
  // every glyph variant come from this stream family, so the archive is
  // the same archive on every machine that reaches the same day-count.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // ---- The archive -----------------------------------------------------
  // Schema: { v: 1, lastDay: "Mon Oct ..." (Date#toDateString, compared
  // only, never drawn), items: [ { t, c, k, s } ] } where t = glyph type
  // 0..6, c = cord index 0..11, k = knot position 0..1 down the cord,
  // s = glyph variant 0..1. Storage is a courtesy, not a dependency:
  // every access is guarded, and absence of storage simply means the
  // fresh archive (base set) is rebuilt in memory on each load.

  function genItem(i) {
    var rng = mulberry32(BASE_SEED + i * 7919);
    return {
      t: Math.floor(rng() * 7),
      c: Math.floor(rng() * N_CORDS),
      k: 0.55 + 0.45 * rng(),
      s: rng()
    };
  }

  function freshArchive(today) {
    var items = [];
    var usedCords = {};
    for (var i = 0; i < BASE_COUNT; i++) {
      var it = genItem(i);
      // Spread the base set across distinct cords so a first frame is a
      // beginning, not a cluster.
      var guard = 0;
      while (usedCords[it.c] && guard < N_CORDS) { it.c = (it.c + 3) % N_CORDS; guard++; }
      usedCords[it.c] = true;
      items.push(it);
    }
    return { v: 1, lastDay: today, items: items };
  }

  function sanitizeItem(raw) {
    if (!raw || typeof raw !== 'object') return null;
    var t = Math.floor(raw.t), c = Math.floor(raw.c);
    if (!(t >= 0 && t <= 6) || !(c >= 0 && c < N_CORDS)) return null;
    return { t: t, c: c, k: clamp(+raw.k || 0.8, 0.3, 1), s: clamp(+raw.s || 0, 0, 1) };
  }

  function storageGet() {
    try {
      if (typeof localStorage === 'undefined' || !localStorage) return null;
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.items)) return null;
      var items = [];
      for (var i = 0; i < parsed.items.length; i++) {
        var it = sanitizeItem(parsed.items[i]);
        if (it) items.push(it);
      }
      if (!items.length) return null;
      return { v: 1, lastDay: String(parsed.lastDay || ''), items: items };
    } catch (e) { return null; }
  }

  function storageSet(archive) {
    try {
      if (typeof localStorage === 'undefined' || !localStorage) return;
      localStorage.setItem(STORE_KEY, JSON.stringify(archive));
    } catch (e) { /* storage full or denied: the piece lives without it */ }
  }

  // Resolve the archive for this load: one new object per day, tied on
  // silently. The date is read only for this comparison; never drawn.
  var today = '';
  try { today = new Date().toDateString(); } catch (e) { today = ''; }
  var archive = storageGet();
  if (!archive) {
    archive = freshArchive(today);
    storageSet(archive);
  } else if (archive.lastDay !== today && archive.items.length < MAX_ITEMS) {
    archive.items.push(genItem(archive.items.length));
    archive.lastDay = today;
    storageSet(archive);
  }

  // ---- Cords -----------------------------------------------------------
  // Twelve cords across the top; lengths and sway phases seeded once.
  var cordRng = mulberry32(BASE_SEED ^ 0x9E3779B9);
  var cords = [];
  for (var ci = 0; ci < N_CORDS; ci++) {
    cords.push({
      fx: (ci + 0.5) / N_CORDS + (cordRng() - 0.5) * 0.03, // anchor, fraction of width
      lenF: 0.34 + cordRng() * 0.30,                       // length, fraction of height
      phase: cordRng() * Math.PI * 2,
      speed: 0.45 + cordRng() * 0.25,                      // sway rate
      amp: 0.6 + cordRng() * 0.7                           // sway weight
    });
  }

  // Per-object live state (drag offset + spring), kept off the archive.
  var live = archive.items.map(function () {
    return { ox: 0, oy: 0, vx: 0, vy: 0, x: 0, y: 0 };
  });

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, U = 1, isPhone = false;

  function viewportSize() {
    var w = 0, h = 0;
    try {
      if (typeof window !== 'undefined' && window.visualViewport) {
        w = window.visualViewport.width; h = window.visualViewport.height;
      }
    } catch (e) { /* fall through */ }
    if (!w || !h) {
      w = (typeof window !== 'undefined' && window.innerWidth) || 300;
      h = (typeof window !== 'undefined' && window.innerHeight) || 300;
    }
    return { w: w, h: h };
  }

  function resize() {
    var s = viewportSize();
    W = s.w; H = s.h;
    canvas.width = W; canvas.height = H;
    U = Math.min(W, H) / 720;
    if (U < 0.45) U = 0.45;
    var sw = 0, sh = 0;
    try {
      if (typeof window !== 'undefined' && window.screen) {
        sw = window.screen.width; sh = window.screen.height;
      }
    } catch (e) { /* fall through */ }
    var minDim = Math.min(sw || W, sh || H);
    isPhone = minDim < 700 || H > W * 1.15;
  }

  // Point on a cord at parameter u (0 = anchor, 1 = loose end) at time t.
  // The cord is a quadratic curve whose control and end points lean with
  // a closed-form pendulum sway: no integration, so any t is exact.
  function cordPoint(cord, u, t) {
    var ax = cord.fx * W;
    var ay = -12;
    var len = cord.lenF * H;
    var sway = Math.sin(t * cord.speed + cord.phase) * 14 * U * cord.amp
             + Math.sin(t * 0.23 + cord.phase * 1.7) * 5 * U * cord.amp;
    var ex = ax + sway, ey = ay + len;
    var cx = ax + sway * 0.35, cy = ay + len * 0.55;
    var v = 1 - u;
    return {
      x: v * v * ax + 2 * v * u * cx + u * u * ex,
      y: v * v * ay + 2 * v * u * cy + u * u * ey
    };
  }

  // ---- Found-object glyphs --------------------------------------------
  // All glyphic, flat palette colors, drawn centered at origin with the
  // knot at the top. size is the rough radius in px.
  function drawGlyph(type, variant, size) {
    var j = (variant - 0.5); // deterministic per-object jitter
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    if (type === 0) {
      // Seed: ellipse with a hilum dot.
      ctx.fillStyle = SEED_BROWN;
      ctx.beginPath();
      ctx.ellipse(0, size * 0.12, size * 0.62, size * 0.88, j * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = GROUND;
      ctx.beginPath();
      ctx.arc(j * size * 0.2, size * 0.05, size * 0.13, 0, Math.PI * 2);
      ctx.fill();
    } else if (type === 1) {
      // Leaf: pointed oval with a vein.
      ctx.fillStyle = LEAF_RUST;
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.quadraticCurveTo(size * 0.85, -size * 0.1, 0, size);
      ctx.quadraticCurveTo(-size * 0.85, -size * 0.1, 0, -size);
      ctx.fill();
      ctx.strokeStyle = GROUND;
      ctx.lineWidth = Math.max(1, size * 0.07);
      ctx.beginPath();
      ctx.moveTo(0, -size * 0.8);
      ctx.quadraticCurveTo(j * size * 0.2, 0, 0, size * 0.82);
      ctx.stroke();
    } else if (type === 2) {
      // Root: a curling spiral line.
      ctx.strokeStyle = ROOT_TAN;
      ctx.lineWidth = Math.max(1.4, size * 0.16);
      ctx.beginPath();
      var turns = 2.2 + variant * 0.8;
      for (var a = 0; a <= turns * Math.PI * 2; a += 0.25) {
        var r = size * (0.12 + 0.75 * a / (turns * Math.PI * 2));
        var px = Math.cos(a + j) * r, py = Math.sin(a + j) * r * 0.9;
        if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    } else if (type === 3) {
      // Wood chip: irregular polygon.
      ctx.fillStyle = ROOT_TAN;
      var rng = mulberry32(BASE_SEED + Math.floor(variant * 100000));
      ctx.beginPath();
      var n = 6;
      for (var i2 = 0; i2 < n; i2++) {
        var ang = (i2 / n) * Math.PI * 2 + j * 0.4;
        var rad = size * (0.55 + rng() * 0.5);
        var vx = Math.cos(ang) * rad, vy = Math.sin(ang) * rad * 0.8;
        if (i2 === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = SEED_BROWN;
      ctx.beginPath();
      ctx.arc(j * size * 0.3, -j * size * 0.2, size * 0.1, 0, Math.PI * 2);
      ctx.fill();
    } else if (type === 4) {
      // Petal: a soft folded arc.
      ctx.fillStyle = PETAL_RED;
      ctx.beginPath();
      ctx.moveTo(0, -size * 0.9);
      ctx.quadraticCurveTo(size * 0.95, -size * 0.2, size * 0.25, size * 0.85);
      ctx.quadraticCurveTo(0, size * 1.05, -size * 0.25, size * 0.85);
      ctx.quadraticCurveTo(-size * 0.95, -size * 0.2, 0, -size * 0.9);
      ctx.fill();
      ctx.strokeStyle = GROUND;
      ctx.lineWidth = Math.max(1, size * 0.06);
      ctx.beginPath();
      ctx.moveTo(0, -size * 0.7);
      ctx.quadraticCurveTo(j * size * 0.25, 0, 0, size * 0.8);
      ctx.stroke();
    } else if (type === 5) {
      // Plastic fragment: a translucent shard.
      ctx.save();
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = PLASTIC_BLUE;
      ctx.beginPath();
      ctx.moveTo(-size * 0.7, size * 0.6);
      ctx.lineTo(size * 0.15, -size * 0.9);
      ctx.lineTo(size * 0.8, size * 0.25);
      ctx.lineTo(size * 0.3 + j * size * 0.2, size * 0.85);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else {
      // Feather: a shaft with barbs.
      ctx.strokeStyle = FEATHER_GRAY;
      ctx.lineWidth = Math.max(1.2, size * 0.1);
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.quadraticCurveTo(j * size * 0.3, 0, 0, size);
      ctx.stroke();
      ctx.lineWidth = Math.max(1, size * 0.07);
      for (var b = -0.75; b <= 0.75; b += 0.25) {
        var by = b * size;
        var bl = size * (0.62 - Math.abs(b) * 0.3);
        ctx.beginPath();
        ctx.moveTo(j * size * 0.15, by);
        ctx.lineTo(j * size * 0.15 - bl, by + size * 0.22);
        ctx.moveTo(j * size * 0.15, by);
        ctx.lineTo(j * size * 0.15 + bl, by + size * 0.22);
        ctx.stroke();
      }
    }
  }

  // ---- Draw -------------------------------------------------------------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var size = (isPhone ? 20 : 23) * U + 6;

    // Cords, back to front in archive order for the objects.
    var i, cord, p0, p1, p2;
    ctx.strokeStyle = CORD;
    ctx.lineWidth = Math.max(1, 1.6 * U);
    for (i = 0; i < N_CORDS; i++) {
      cord = cords[i];
      p0 = cordPoint(cord, 0, t);
      p1 = cordPoint(cord, 0.55, t);
      p2 = cordPoint(cord, 1, t);
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.quadraticCurveTo(p1.x, p1.y, p2.x, p2.y);
      ctx.stroke();
    }

    // Found objects at their knots.
    for (i = 0; i < archive.items.length; i++) {
      var item = archive.items[i];
      var st = live[i];
      cord = cords[item.c];
      var kp = cordPoint(cord, item.k, t);
      var ox = kp.x + st.ox;
      var oy = kp.y + st.oy + size * 0.9;
      st.x = ox; st.y = oy;

      // The tie: a short wrap of cord above the object.
      ctx.strokeStyle = CORD;
      ctx.lineWidth = Math.max(1, 2 * U);
      ctx.beginPath();
      ctx.moveTo(kp.x, kp.y);
      ctx.lineTo(ox, oy - size * 0.75);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(kp.x, kp.y, Math.max(1.6, 2.6 * U), 0, Math.PI * 2);
      ctx.fillStyle = CORD;
      ctx.fill();

      // Slow turn as it hangs; the turn follows any drag swing.
      var rot = (item.s - 0.5) * 0.5
              + Math.sin(t * 0.4 + item.c * 1.3 + item.s * 6.0) * 0.3
              + st.ox * 0.004;
      ctx.save();
      ctx.translate(ox, oy);
      ctx.rotate(rot);
      drawGlyph(item.t, item.s, size);
      ctx.restore();
    }
  }

  // ---- Interaction -------------------------------------------------------
  // Drag an object: it swings on its cord and turns, then settles.
  var dragIdx = -1;
  var grabDX = 0, grabDY = 0; // pointer position relative to the object center

  function pointerPos(ev) {
    var x = 0, y = 0;
    if (ev.clientX !== undefined) { x = ev.clientX; y = ev.clientY; }
    else if (ev.touches && ev.touches.length) { x = ev.touches[0].clientX; y = ev.touches[0].clientY; }
    else if (ev.changedTouches && ev.changedTouches.length) { x = ev.changedTouches[0].clientX; y = ev.changedTouches[0].clientY; }
    return { x: x, y: y };
  }

  function onDown(ev) {
    var p = pointerPos(ev);
    var best = -1, bestD = 46 * U + 18;
    for (var i = 0; i < live.length; i++) {
      var dx = live[i].x - p.x, dy = live[i].y - p.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best >= 0) {
      dragIdx = best;
      grabDX = p.x - live[best].x;
      grabDY = p.y - live[best].y;
      live[best].vx = 0; live[best].vy = 0;
    }
    if (ev.preventDefault) ev.preventDefault();
  }

  function onMove(ev) {
    if (dragIdx < 0) return;
    var p = pointerPos(ev);
    var item = archive.items[dragIdx];
    var kp = cordPoint(cords[item.c], item.k, elapsed());
    var st = live[dragIdx];
    var size = (isPhone ? 20 : 23) * U + 6;
    // Desired object center is the pointer minus the grab offset; the
    // stored offset is relative to the object's resting hang point.
    st.ox = clamp((p.x - grabDX) - kp.x, -W * 0.22, W * 0.22);
    st.oy = clamp((p.y - grabDY) - (kp.y + size * 0.9), -H * 0.12, H * 0.3);
    if (ev.preventDefault) ev.preventDefault();
  }

  function onUp() { dragIdx = -1; }

  // Spring the released objects home (live mode only; the headless
  // renderer never reaches the rAF loop, so frame one is untouched).
  function stepSprings(dt) {
    for (var i = 0; i < live.length; i++) {
      if (i === dragIdx) continue;
      var st = live[i];
      if (st.ox === 0 && st.oy === 0 && st.vx === 0 && st.vy === 0) continue;
      var k = 26, damp = 4.2;
      st.vx += (-k * st.ox - damp * st.vx) * dt;
      st.vy += (-k * st.oy - damp * st.vy) * dt;
      st.ox += st.vx * dt;
      st.oy += st.vy * dt;
      if (Math.abs(st.ox) < 0.05 && Math.abs(st.vx) < 0.05) { st.ox = 0; st.vx = 0; }
      if (Math.abs(st.oy) < 0.05 && Math.abs(st.vy) < 0.05) { st.oy = 0; st.vy = 0; }
    }
  }

  // ---- Clock --------------------------------------------------------------
  var startMs = 0;
  try { startMs = Date.now(); } catch (e) { startMs = 0; }
  function elapsed() {
    if (FORCE_T >= 0) return FORCE_T;
    try { return (Date.now() - startMs) / 1000; } catch (e) { return 0; }
  }

  var lastMs = 0;
  function frame(nowMs) {
    var t = elapsed();
    var dt = lastMs ? Math.min(0.05, (nowMs - lastMs) / 1000) : 0.016;
    lastMs = nowMs;
    if (dt > 0) stepSprings(dt);
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  function onResize() { resize(); draw(elapsed()); }

  try {
    if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
  } catch (e) { /* optional */ }
  try {
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('resize', onResize);
    }
  } catch (e) { /* optional */ }

  try {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  } catch (e) { /* optional */ }
  try {
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onUp);
  } catch (e) { /* optional */ }

  resize();
  // Frame one: synchronous, sway phase 0, archive as presented. Under
  // the QA seed hook the boot frame uses the pinned phase instead, so
  // later phases can be inspected headlessly; live mode is unaffected.
  draw(FORCE_T >= 0 ? FORCE_T : 0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
