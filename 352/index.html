<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.352 Colorway Machine</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0D0B08; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.352 Colorway Machine (emibeebuzz).
// After Emi Bee's coordinate-family machine: ONE hero motif, a
// twisty floral sprig held as parametric path data, rendered 12
// times in a 4 x 3 grid (exactly 12 cells, asserted). Each cell is
// a colourway: a ground plus a 3-colour palette, both taken from a
// fixed list of exactly 6 curated palettes over the four specced
// grounds (three near-black variants and paper). Never random RGB,
// never an offscreen tint pass: the sprig is redrawn directly in
// every cell in that cell's own palette. Each cell breathes gently
// (scale oscillation) on its own phase inside a shared 24s master
// loop (LOOP below), so frame 24s is pixel-identical to frame 0.
// Dragging sideways scrubs a position through a fixed table of
// authored colourway arrangements; cell colours blend between the
// neighbouring authored arrangements while scrubbing and ease to a
// stop exactly on an arrangement when released, so at rest every
// colour on screen is a curated palette colour and the breathing
// seam holds. Flat colour only, no text, no chrome.
// Determinism: the first frame is drawn synchronously at the
// constant phase T = 7.4 (never Date.now() minus an offset), and
// the animation advances from that anchor in fixed 1/60 ticks.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DW = 1280, DH = 900;
var COLS = 4, ROWS = 3, CELLS = 12;
var LOOP = 24;
var GUT = 8;
var PAGE = '#0D0B08';
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 7.4, lastNow = -1, acc = 0;
var TICK = 1 / 60;

// ---- exactly 6 curated palettes, as data -----------------------
// Each entry: ground + [stem, petal, accent]. Grounds are drawn
// only from the four specced grounds.
var GROUNDS = ['#0D0B08', '#14121E', '#0D0F0C', '#F4EFE3'];
var PALETTES = [
  { ground: '#0D0B08', cols: ['#7FB069', '#E8DCC8', '#E4572E'] }, // night garden
  { ground: '#14121E', cols: ['#5B7B9A', '#B76E79', '#C9A227'] }, // indigo damask
  { ground: '#0D0F0C', cols: ['#2E8B8B', '#F5E6C8', '#F2B134'] }, // forest floor
  { ground: '#F4EFE3', cols: ['#2D4A2B', '#8C2F39', '#C9A227'] }, // paper day
  { ground: '#0D0B08', cols: ['#A89B82', '#E4572E', '#E8DCC8'] }, // ember room
  { ground: '#14121E', cols: ['#7FB069', '#C9A227', '#B76E79'] }  // violet hour
];
if (PALETTES.length !== 6) throw new Error('Colorway Machine needs exactly 6 palettes');
PALETTES.forEach(function (p, i) {
  if (GROUNDS.indexOf(p.ground) < 0) throw new Error('palette ' + i + ' ground outside the specced four');
  if (p.cols.length !== 3) throw new Error('palette ' + i + ' must hold exactly 3 colours');
});

// ---- fixed colourway arrangements (the seeded table) -----------
// Each arrangement assigns one palette index to each of the 12
// cells. Authored constraints: every palette appears at least
// once per arrangement, and the paper palette (index 3) appears
// exactly once, as the spec's single paper cell.
var ARRANGEMENTS = [
  [0, 1, 2, 4, 5, 0, 1, 2, 4, 5, 3, 0],
  [3, 2, 5, 1, 0, 4, 2, 5, 1, 0, 4, 2],
  [1, 4, 0, 5, 2, 3, 4, 1, 0, 5, 2, 4],
  [2, 5, 1, 0, 4, 2, 5, 3, 1, 0, 4, 5],
  [4, 0, 3, 2, 5, 1, 0, 4, 2, 5, 1, 0],
  [5, 1, 4, 0, 2, 5, 3, 4, 1, 0, 2, 5]
];
(function () {
  var a, i;
  for (a = 0; a < ARRANGEMENTS.length; a++) {
    var seen = [0, 0, 0, 0, 0, 0];
    if (ARRANGEMENTS[a].length !== CELLS) throw new Error('arrangement ' + a + ' must hold exactly 12 cells');
    for (i = 0; i < CELLS; i++) {
      if (ARRANGEMENTS[a][i] < 0 || ARRANGEMENTS[a][i] > 5) throw new Error('arrangement entry outside the palette list');
      seen[ARRANGEMENTS[a][i]]++;
    }
    for (i = 0; i < 6; i++) if (seen[i] === 0) throw new Error('every palette must appear in arrangement ' + a);
    if (seen[3] !== 1) throw new Error('exactly one paper cell per arrangement');
  }
})();

// per-cell breathing phases, fixed data
var PHASE = [0.0, 1.7, 3.4, 5.1, 2.6, 0.9, 4.3, 1.2, 5.8, 3.1, 0.4, 2.2];
if (PHASE.length !== CELLS) throw new Error('one breathing phase per cell');

// ---- colour helpers --------------------------------------------
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mixRgb(a, b, f) {
  var r = Math.round(a[0] + (b[0] - a[0]) * f);
  var g = Math.round(a[1] + (b[1] - a[1]) * f);
  var bl = Math.round(a[2] + (b[2] - a[2]) * f);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
var PAL_RGB = PALETTES.map(function (p) {
  return { ground: hexRgb(p.ground), cols: p.cols.map(hexRgb) };
});

// ---- the hero sprig, as parametric path data -------------------
// Local space: origin at the cell centre, stem base at y = 125,
// bloom centre at (0, -72). Drawn fresh in every cell, in that
// cell's colours. Stem and leaves take cols[0], petals cols[1],
// bloom heart and buds cols[2].
var LEAVES = [
  { x: -6, y: 74, a: Math.PI + 0.45, len: 52, wid: 15 },
  { x: 6, y: 30, a: -0.45, len: 48, wid: 14 },
  { x: -4, y: -6, a: Math.PI + 0.35, len: 40, wid: 12 }
];
var BUDS = [
  { x1: 4, y1: 52, cx: 22, cy: 46, x2: 34, y2: 38, r: 9 },
  { x1: -6, y1: 10, cx: -22, cy: 6, x2: -34, y2: -2, r: 7.5 }
];
var PETALS = 6;

function drawSprig(cols) {
  var i, k, b;
  // stem: one twisty S-curve stroke up to the bloom base
  ctx.strokeStyle = cols[0];
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 125);
  ctx.bezierCurveTo(-28, 82, 26, 56, 6, 16);
  ctx.bezierCurveTo(-6, -8, -2, -28, 0, -46);
  ctx.stroke();
  // tendril curl off the upper stem
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(-21, -33, 11, Math.PI * 0.35, Math.PI * 2.15);
  ctx.stroke();
  // bud stems and buds
  ctx.lineWidth = 4;
  for (i = 0; i < BUDS.length; i++) {
    b = BUDS[i];
    ctx.beginPath();
    ctx.moveTo(b.x1, b.y1);
    ctx.quadraticCurveTo(b.cx, b.cy, b.x2, b.y2);
    ctx.stroke();
  }
  ctx.fillStyle = cols[2];
  for (i = 0; i < BUDS.length; i++) {
    b = BUDS[i];
    ctx.beginPath();
    ctx.arc(b.x2, b.y2, b.r, 0, Math.PI * 2);
    ctx.fill();
  }
  // leaves
  ctx.fillStyle = cols[0];
  for (i = 0; i < LEAVES.length; i++) {
    var L = LEAVES[i];
    ctx.save();
    ctx.translate(L.x, L.y);
    ctx.rotate(L.a);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(L.len * 0.5, -L.wid, L.len, 0);
    ctx.quadraticCurveTo(L.len * 0.5, L.wid, 0, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  // bloom: six flat petals around the heart
  ctx.fillStyle = cols[1];
  for (k = 0; k < PETALS; k++) {
    ctx.save();
    ctx.translate(0, -72);
    ctx.rotate(k * Math.PI * 2 / PETALS - Math.PI / 2);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(13, -24, 0, -46);
    ctx.quadraticCurveTo(-13, -24, 0, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = cols[2];
  ctx.beginPath();
  ctx.arc(0, -72, 11, 0, Math.PI * 2);
  ctx.fill();
}

// ---- scrub state -------------------------------------------------
// scrub is a float position in arrangement space. While dragging
// it follows the pointer; on release it eases onto the nearest
// authored arrangement and stops exactly there.
var scrub = 0, scrubGoal = 0, dragging = false;

function cellColours(i) {
  var lo = Math.floor(scrub), hi = Math.min(ARRANGEMENTS.length - 1, lo + 1);
  var f = scrub - lo;
  var A = PAL_RGB[ARRANGEMENTS[lo][i]], B = PAL_RGB[ARRANGEMENTS[hi][i]];
  if (f === 0 || lo === hi) {
    return {
      ground: PALETTES[ARRANGEMENTS[lo][i]].ground,
      cols: PALETTES[ARRANGEMENTS[lo][i]].cols
    };
  }
  return {
    ground: mixRgb(A.ground, B.ground, f),
    cols: [mixRgb(A.cols[0], B.cols[0], f), mixRgb(A.cols[1], B.cols[1], f), mixRgb(A.cols[2], B.cols[2], f)]
  };
}

// ---- drawing -----------------------------------------------------
function draw() {
  var cw = DW / COLS, ch = DH / ROWS;
  var cyc = ((T % LOOP) + LOOP) % LOOP;
  var col, row, i, cx, cy, cc, breathe;
  ctx.fillStyle = PAGE;
  ctx.fillRect(0, 0, DW, DH);
  i = 0;
  for (row = 0; row < ROWS; row++) {
    for (col = 0; col < COLS; col++) {
      cx = (col + 0.5) * cw;
      cy = (row + 0.5) * ch;
      cc = cellColours(i);
      ctx.fillStyle = cc.ground;
      ctx.fillRect(col * cw + GUT / 2, row * ch + GUT / 2, cw - GUT, ch - GUT);
      breathe = 1 + 0.035 * Math.sin((cyc / LOOP) * Math.PI * 2 + PHASE[i]);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(breathe, breathe);
      drawSprig(cc.cols);
      ctx.restore();
      i++;
    }
  }
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drag scrubs the colourway table -----------------------------
var lastDX = 0;
function toDesign(e) {
  return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  dragging = true; lastDX = p.x;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  var dx = p.x - lastDX;
  lastDX = p.x;
  // one authored arrangement per 160 design px of horizontal drag
  scrub += dx / 160;
  if (scrub < 0) scrub = 0;
  if (scrub > ARRANGEMENTS.length - 1) scrub = ARRANGEMENTS.length - 1;
  scrubGoal = scrub;
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  scrubGoal = Math.round(scrub);
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) {
    T += TICK;
    if (!dragging && scrub !== scrubGoal) {
      var step = (scrubGoal - scrub) * 0.12;
      scrub += step;
      if (Math.abs(scrubGoal - scrub) < 0.001) scrub = scrubGoal;
    }
    acc -= TICK; guard++;
  }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loopFn = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loopFn); };
  requestAnimationFrame(loopFn);
}
})();
</script>
</body>
</html>
