<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Stack</title>
<style>
  html, body { margin: 0; padding: 0; background: #141414; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict): silver panels between #A9A9A9 and #BFBFBF, tarnish
  // #5A3A1E, plinth #F2F2F2, room #141414, floor #232323. Nothing else;
  // every in-between tone is one of these colours at partial alpha, or a
  // mix inside the silver range.
  var SILVER_LO = [169, 169, 169]; // #A9A9A9
  var SILVER_HI = [191, 191, 191]; // #BFBFBF
  var WEAVE = [189, 189, 189];     // inside the silver range
  var TARNISH = [90, 58, 30];      // #5A3A1E
  var PLINTH = '#F2F2F2';
  var ROOM = '#141414';
  var FLOOR = '#232323';
  var ROOM_RGB = [20, 20, 20];

  var N = 7;               // panels in the stack
  var FLIP_DUR = 1.15;     // seconds, panel arc aside
  var RESET_DUR = 0.95;    // seconds, panel ease back

  // Event model: the only thing that ever changes the piece is a recorded
  // list of events on the piece's own timeline (seconds since load).
  //   { type: 'flip',  t } - the top remaining panel arcs off the stack
  //   { type: 'reset', t } - every flipped panel eases back onto the stack
  // A panel's pose is a closed-form function of this list and t: replaying
  // the list rebuilds each panel's current animation segment, and the
  // amount (0 = stacked, 1 = leaning beside the plinth) is eased from it.
  // Nothing is integrated frame to frame, so frame one at t = 0 with an
  // empty list is exact and reproducible.
  var events = [];

  // Inert QA hook (house pattern): ?seed=flips2 pre-records two flips at
  // negative times, long settled before frame one, so a still render can
  // show the flipped state. No effect in normal viewing.
  var SEARCH = (typeof location !== 'undefined' && location.search) || '';
  var fm = /flips(\d)/.exec(SEARCH);
  if (fm) {
    var fn = Math.min(N, parseInt(fm[1], 10));
    for (var fi = 0; fi < fn; fi++) events.push({ type: 'flip', t: -9.5 + fi * 1.35 });
  }

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function mixRgb(a, b, f) {
    return [Math.round(a[0] + (b[0] - a[0]) * f),
            Math.round(a[1] + (b[1] - a[1]) * f),
            Math.round(a[2] + (b[2] - a[2]) * f)];
  }
  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function easeOutCubic(q) { return 1 - Math.pow(1 - q, 3); }
  function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function smooth(x) { x = clamp01(x); return x * x * (3 - 2 * x); }

  // Per-panel seeded surface data: fog blobs in the silver, weave streaks,
  // burnt-edge strength per side, dark mottling for the underside. The hand
  // lives in this data only; the geometry is regular.
  var panels = [];
  for (var pi = 0; pi < N; pi++) {
    var rng = mulberry32(810100 + pi * 977);
    var p = {
      tone: 0.15 + rng() * 0.7,               // position in the silver range
      jx: (rng() - 0.5) * 0.006,              // stack placement jitter (of W)
      blobs: [], streaks: [], dark: [],
      edge: [0.45 + rng() * 0.55, 0.45 + rng() * 0.55, 0.45 + rng() * 0.55, 0.45 + rng() * 0.55]
    };
    for (var b = 0; b < 12; b++) p.blobs.push({ u: rng(), v: rng(), ru: 0.10 + rng() * 0.22, rv: 0.10 + rng() * 0.22, light: rng() > 0.45, a: 0.05 + rng() * 0.08 });
    for (var s = 0; s < 16; s++) p.streaks.push({ u: rng(), v: rng() * 0.7, len: 0.10 + rng() * 0.22, a: 0.04 + rng() * 0.05 });
    for (var d = 0; d < 14; d++) p.dark.push({ u: rng(), v: rng(), ru: 0.05 + rng() * 0.11, rv: 0.05 + rng() * 0.11, a: 0.05 + rng() * 0.10 });
    panels.push(p);
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function viewportSize() {
    var w, h;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    } else {
      w = window.innerWidth;
      h = window.innerHeight;
    }
    return { w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)) };
  }

  function isPhone(w, h) {
    var sw = 0, sh = 0;
    if (window.screen) { sw = window.screen.width || 0; sh = window.screen.height || 0; }
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    return h > w * 1.15;
  }

  function makeLayout(w, h) {
    var phone = isPhone(w, h);
    var L = { w: w, h: h, phone: phone };
    L.floorY = Math.round(h * 0.70);
    L.cx = w / 2;
    L.plinthW = w * (phone ? 0.64 : 0.44);
    L.plinthTopY = h * 0.795;
    L.plinthFront = h * 0.055;
    L.plinthSlantX = w * 0.045;
    L.plinthSlantY = -h * 0.026;
    L.panelW = w * (phone ? 0.50 : 0.33);
    L.panelSlantX = w * (phone ? 0.062 : 0.082);
    L.panelSlantY = -h * (phone ? 0.040 : 0.050);
    L.thk = Math.max(3, h * 0.0165);
    L.stackBase = L.plinthTopY - h * 0.010; // front bottom edge of panel 0
    L.leanH = h * (phone ? 0.27 : 0.33);
    L.floorRestY = h * 0.935;
    return L;
  }

  var layout = null;
  var L = null;
  var currentT = 0;

  // ---- pose computation: closed form in (events, t) ----

  function amountAt(seg, t) {
    if (t <= seg.start) return seg.from;
    var q = (t - seg.start) / seg.dur;
    if (q >= 1) return seg.to;
    return seg.from + (seg.to - seg.from) * easeOutCubic(q);
  }

  // Replay the event list up to t; returns per-panel { a, side, fan }.
  function panelPoses(t) {
    var segs = [], meta = [], i;
    for (i = 0; i < N; i++) { segs.push({ from: 0, to: 0, start: 0, dur: 0.001 }); meta.push({ side: 1, fan: 0 }); }
    var remaining = [];
    for (i = 0; i < N; i++) remaining.push(i);
    var flipCount = 0, sideCount = [0, 0];
    for (var e = 0; e < events.length; e++) {
      var ev = events[e];
      if (ev.t > t) break;
      if (ev.type === 'flip') {
        if (!remaining.length) continue;
        var idx = remaining.pop();
        var side = flipCount % 2; // 0 = right, 1 = left, alternating
        meta[idx] = { side: side, fan: sideCount[side]++ };
        flipCount++;
        segs[idx] = { from: amountAt(segs[idx], ev.t), to: 1, start: ev.t, dur: FLIP_DUR };
      } else if (ev.type === 'reset') {
        var k = 0;
        for (i = 0; i < N; i++) {
          var cur = amountAt(segs[i], ev.t);
          if (cur > 0 || segs[i].to === 1) {
            segs[i] = { from: cur, to: 0, start: ev.t + k * 0.07, dur: RESET_DUR };
            k++;
          }
        }
        remaining = [];
        for (i = 0; i < N; i++) remaining.push(i);
        flipCount = 0; sideCount = [0, 0];
      }
    }
    var out = [];
    for (i = 0; i < N; i++) out.push({ a: amountAt(segs[i], t), side: meta[i].side, fan: meta[i].fan });
    return out;
  }

  // Bilinear point in a quad A(u0,v0) B(u1,v0) C(u1,v1) D(u0,v1).
  function bilerp(q, u, v) {
    var w0 = (1 - u) * (1 - v), w1 = u * (1 - v), w2 = u * v, w3 = (1 - u) * v;
    return [q[0][0] * w0 + q[1][0] * w1 + q[2][0] * w2 + q[3][0] * w3,
            q[0][1] * w0 + q[1][1] * w1 + q[2][1] * w2 + q[3][1] * w3];
  }
  function quadPath(q) {
    ctx.beginPath();
    ctx.moveTo(q[0][0], q[0][1]);
    ctx.lineTo(q[1][0], q[1][1]);
    ctx.lineTo(q[2][0], q[2][1]);
    ctx.lineTo(q[3][0], q[3][1]);
    ctx.closePath();
  }
  function insetQuad(q, f) {
    var cx = (q[0][0] + q[1][0] + q[2][0] + q[3][0]) / 4;
    var cy = (q[0][1] + q[1][1] + q[2][1] + q[3][1]) / 4;
    return q.map(function (pt) { return [pt[0] + (cx - pt[0]) * f, pt[1] + (cy - pt[1]) * f]; });
  }

  // A panel face in quad space: silver fog + weave on top, dark tarnished
  // underside as undersideMix goes 0 -> 1, burnt edges in both states.
  function drawFace(q, p, undersideMix) {
    var silver = mixRgb(SILVER_LO, SILVER_HI, p.tone);
    var base = mixRgb(silver, TARNISH, undersideMix);
    quadPath(q);
    ctx.fillStyle = rgba(base, 1);
    ctx.fill();
    ctx.save();
    quadPath(q);
    ctx.clip();
    var i, pt;
    // fog blobs in the silver
    for (i = 0; i < p.blobs.length; i++) {
      var bl = p.blobs[i];
      pt = bilerp(q, bl.u, bl.v);
      var tone = bl.light ? SILVER_HI : SILVER_LO;
      ctx.fillStyle = rgba(tone, bl.a * (1 - undersideMix));
      ctx.beginPath();
      ctx.ellipse(pt[0], pt[1], bl.ru * L.panelW, bl.rv * L.panelW * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // weave streaks
    ctx.strokeStyle = rgba(WEAVE, 1);
    ctx.lineWidth = 1;
    for (i = 0; i < p.streaks.length; i++) {
      var st = p.streaks[i];
      var a1 = bilerp(q, st.u, st.v), a2 = bilerp(q, st.u, Math.min(1, st.v + st.len));
      ctx.globalAlpha = st.a * (1 - undersideMix);
      ctx.beginPath(); ctx.moveTo(a1[0], a1[1]); ctx.lineTo(a2[0], a2[1]); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // underside mottling
    for (i = 0; i < p.dark.length; i++) {
      var dk = p.dark[i];
      pt = bilerp(q, dk.u, dk.v);
      ctx.fillStyle = rgba(ROOM_RGB, dk.a * undersideMix);
      ctx.beginPath();
      ctx.ellipse(pt[0], pt[1], dk.ru * L.panelW, dk.rv * L.panelW * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // burnt edges: nested inset strokes of tarnish, strongest at the rim
    var steps = 4;
    for (i = 0; i < steps; i++) {
      var f = 0.015 + i * 0.028;
      var iq = insetQuad(q, f);
      quadPath(iq);
      ctx.strokeStyle = rgba(TARNISH, (0.34 - i * 0.075) * (0.45 + 0.55 * Math.max(undersideMix, 0.25)));
      ctx.lineWidth = Math.max(1.5, L.panelW * 0.016);
      ctx.stroke();
    }
    ctx.restore();
    quadPath(q);
    ctx.strokeStyle = rgba(ROOM_RGB, 0.28);
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // The flat top-face quad of panel i in the stack.
  function stackQuad(L, i) {
    var x0 = L.cx - L.panelW / 2 + panels[i].jx * L.w;
    var ty = L.stackBase - (i + 1) * L.thk;
    return [[x0, ty], [x0 + L.panelW, ty],
            [x0 + L.panelW + L.panelSlantX, ty + L.panelSlantY],
            [x0 + L.panelSlantX, ty + L.panelSlantY]];
  }

  // The leaning quad of a flipped panel: it stands on its long edge on the
  // floor, tucked against the plinth with its inner portion overlapping
  // the plinth front, face toward the viewer, top edge tilted back a
  // little. Later panels on the same side fan slightly further out.
  // The panel's upright height is its stack depth (the slant in the stack
  // is that depth foreshortened), so the size stays the panel's own.
  function leanQuad(L, pose) {
    var dir = pose.side === 0 ? 1 : -1;
    var pw = L.panelW * (L.phone ? 0.84 : 0.94);
    var overlap = pw * (L.phone ? 0.62 : 0.28);
    var d = L.plinthW / 2 - overlap + pose.fan * L.w * (L.phone ? 0.008 : 0.028);
    var baseX = dir > 0 ? L.cx + d : L.cx - d - pw;
    baseX = Math.max(4, Math.min(L.w - pw - 4, baseX));
    var by = L.floorRestY - pose.fan * L.h * 0.006;
    var tiltX = -dir * L.w * 0.028;
    var tiltY = -L.h * 0.012;
    var lh = L.leanH * (1 - pose.fan * 0.05);
    return [[baseX, by], [baseX + pw, by - L.h * 0.004],
            [baseX + pw + tiltX, by - lh + tiltY],
            [baseX + tiltX, by - lh + tiltY]];
  }

  function draw(t) {
    currentT = t;
    var size = viewportSize();
    if (!layout || layout.w !== size.w || layout.h !== size.h) {
      canvas.width = size.w;
      canvas.height = size.h;
      layout = makeLayout(size.w, size.h);
    }
    canvas.style.width = size.w + 'px';
    canvas.style.height = size.h + 'px';
    L = layout;
    var w = L.w, h = L.h;

    // room and floor
    ctx.globalAlpha = 1;
    ctx.fillStyle = ROOM;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = FLOOR;
    ctx.fillRect(0, L.floorY, w, h - L.floorY);
    // floor seams, perspective hints in the room tone
    ctx.strokeStyle = rgba(ROOM_RGB, 0.4);
    ctx.lineWidth = 1;
    var sy;
    for (var fi = 1; fi <= 3; fi++) {
      sy = L.floorY + (h - L.floorY) * fi * fi * 0.11;
      ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(w, sy); ctx.stroke();
    }
    // dim wall wash behind the plinth
    ctx.fillStyle = 'rgba(242,242,242,0.045)';
    ctx.fillRect(L.cx - L.plinthW * 0.95, h * 0.16, L.plinthW * 1.9, L.floorY - h * 0.16);
    // floor shadow under the plinth
    ctx.fillStyle = rgba(ROOM_RGB, 0.5);
    ctx.beginPath();
    ctx.ellipse(L.cx, L.plinthTopY + L.plinthFront + h * 0.028, L.plinthW * 0.62, h * 0.016, 0, 0, Math.PI * 2);
    ctx.fill();

    var poses = panelPoses(t);
    var i, q, pose;

    // plinth: top face, front face, right face
    var px0 = L.cx - L.plinthW / 2, px1 = L.cx + L.plinthW / 2;
    var pTop = [[px0, L.plinthTopY], [px1, L.plinthTopY],
                [px1 + L.plinthSlantX, L.plinthTopY + L.plinthSlantY],
                [px0 + L.plinthSlantX, L.plinthTopY + L.plinthSlantY]];
    ctx.fillStyle = rgba(ROOM_RGB, 0.10);
    ctx.beginPath();
    ctx.moveTo(pTop[1][0], pTop[1][1]); ctx.lineTo(pTop[2][0], pTop[2][1]);
    ctx.lineTo(pTop[2][0], pTop[2][1] + L.plinthFront); ctx.lineTo(pTop[1][0], pTop[1][1] + L.plinthFront);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = PLINTH;
    ctx.fillRect(px0, L.plinthTopY, L.plinthW, L.plinthFront);
    ctx.fillStyle = rgba(ROOM_RGB, 0.09);
    ctx.fillRect(px0, L.plinthTopY, L.plinthW, L.plinthFront);
    quadPath(pTop);
    ctx.fillStyle = PLINTH;
    ctx.fill();
    // contact shadow where the stack sits
    ctx.fillStyle = rgba(ROOM_RGB, 0.20);
    var sq0 = stackQuad(L, 0);
    quadPath(insetQuad(sq0, -0.03));
    ctx.fill();

    // rested flipped panels (leaning beside the plinth), far side first
    var order = [];
    for (i = 0; i < N; i++) if (poses[i].a >= 1) order.push(i);
    order.sort(function (a, b) { return poses[b].fan - poses[a].fan; });
    for (i = 0; i < order.length; i++) {
      pose = poses[order[i]];
      q = leanQuad(L, pose);
      drawFlippedPanel(L, q, panels[order[i]], 1);
    }

    // the stack itself, bottom panel to top
    for (i = 0; i < N; i++) {
      if (poses[i].a > 0) continue;
      q = stackQuad(L, i);
      // right side strip
      ctx.fillStyle = rgba(mixRgb(SILVER_LO, SILVER_HI, panels[i].tone), 1);
      ctx.beginPath();
      ctx.moveTo(q[1][0], q[1][1]); ctx.lineTo(q[2][0], q[2][1]);
      ctx.lineTo(q[2][0], q[2][1] + L.thk); ctx.lineTo(q[1][0], q[1][1] + L.thk);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = rgba(TARNISH, 0.30);
      ctx.fill();
      // front strip: the layered sheet edge, tarnish creeping at the rim
      ctx.fillStyle = rgba(mixRgb(SILVER_LO, SILVER_HI, panels[i].tone), 1);
      ctx.fillRect(q[0][0], q[0][1], L.panelW, L.thk);
      ctx.fillStyle = rgba(TARNISH, 0.22 + 0.2 * panels[i].edge[0]);
      ctx.fillRect(q[0][0], q[0][1] + L.thk - Math.max(1.5, L.thk * 0.38), L.panelW, Math.max(1.5, L.thk * 0.38));
      ctx.fillStyle = rgba(ROOM_RGB, 0.18);
      ctx.fillRect(q[0][0], q[0][1], L.panelW, 1);
    }
    // top face of the topmost stacked panel
    var topIdx = -1;
    for (i = N - 1; i >= 0; i--) if (poses[i].a <= 0) { topIdx = i; break; }
    if (topIdx >= 0) drawFace(stackQuad(L, topIdx), panels[topIdx], 0);

    // panels in the air (flipping or returning), above everything
    for (i = 0; i < N; i++) {
      pose = poses[i];
      if (pose.a <= 0 || pose.a >= 1) continue;
      var from = stackQuad(L, i);
      var to = leanQuad(L, pose);
      var lift = Math.sin(pose.a * Math.PI) * h * 0.085;
      var dir = pose.side === 0 ? 1 : -1;
      var push = Math.sin(pose.a * Math.PI) * dir * w * 0.018;
      q = from.map(function (pt, k) {
        return [pt[0] + (to[k][0] - pt[0]) * pose.a + push,
                pt[1] + (to[k][1] - pt[1]) * pose.a - lift];
      });
      drawFlippedPanel(L, q, panels[i], smooth((pose.a - 0.30) / 0.40));
    }
  }

  // A panel off the stack: silver rim of thickness behind, face in front,
  // its underside mix carried by the flip amount.
  function drawFlippedPanel(L, q, p, undersideMix) {
    var rim = q.map(function (pt) { return [pt[0] + 3, pt[1] + 3]; });
    quadPath(rim);
    ctx.fillStyle = rgba(TARNISH, 0.9);
    ctx.fill();
    // floor shadow while it leans
    ctx.fillStyle = rgba(ROOM_RGB, 0.35);
    ctx.beginPath();
    ctx.ellipse((q[0][0] + q[1][0]) / 2, Math.max(q[0][1], q[1][1]) + L.h * 0.008, L.panelW * 0.42, L.h * 0.010, 0, 0, Math.PI * 2);
    ctx.fill();
    drawFace(q, p, undersideMix);
  }

  // frame one: synchronous, t = 0, the full stack of seven
  draw(0);

  var start = null;
  var nowT = 0;
  function frame(ts) {
    if (start === null) start = ts;
    nowT = (ts - start) / 1000;
    draw(nowT);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);

  function onResize() { draw(currentT); }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);

  // Interaction: a horizontal drag across the stack flips the top panel;
  // a double-tap restores the stack. Event times are taken from the
  // piece's own rAF clock, never the wall clock.
  var dragStart = null;
  var lastTap = null;

  function evtPos(e) {
    if (e.clientX !== undefined) return { x: e.clientX, y: e.clientY };
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: 0, y: 0 };
  }

  canvas.addEventListener('pointerdown', function (e) {
    dragStart = { p: evtPos(e), t: nowT, flipped: false };
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragStart || dragStart.flipped) return;
    var p = evtPos(e);
    var size = viewportSize();
    if (Math.abs(p.x - dragStart.p.x) > Math.max(42, size.w * 0.09)) {
      events.push({ type: 'flip', t: nowT });
      dragStart.flipped = true;
    }
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!dragStart) return;
    var p = evtPos(e);
    var moved = Math.abs(p.x - dragStart.p.x) + Math.abs(p.y - dragStart.p.y);
    if (!dragStart.flipped && moved < 12) {
      // a tap: two in quick succession restore the stack
      if (lastTap !== null && nowT - lastTap < 0.38) {
        events.push({ type: 'reset', t: nowT });
        lastTap = null;
      } else {
        lastTap = nowT;
      }
    }
    dragStart = null;
  });
  canvas.addEventListener('pointercancel', function () { dragStart = null; });
})();
</script>
</body>
</html>
