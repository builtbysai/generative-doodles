<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>River Panes</title>
<style>
  html, body { margin: 0; padding: 0; background: #0D0E12; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.737 "River Panes" - EXPANSION #90 spencer-finch, prompt block 2.
   A slow procedural river pans behind a growing wall of glass panes.
   Every 0.5 s the center of the scene is sampled and locked into the
   next pane as a purple-grey square. Watch-only; tap force-samples. */

// ---------- seeded RNG (mulberry32) ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const SEED = 737090;

// ---------- palette (strict) ----------
const GROUND = '#0D0E12';
const GROUT = '#14161B';
const WATER = [16, 20, 28];    // #10141C
const STREAK = [199, 208, 224]; // #C7D0E0
// pane tones with approximate relative luminance, sorted dark to light
const TONES = [
  { hex: '#4A4458', lum: 0.278 },
  { hex: '#5C4A6B', lum: 0.314 },
  { hex: '#6B5B7E', lum: 0.380 },
  { hex: '#8A7BA0', lum: 0.504 },
  { hex: '#9AA0B8', lum: 0.629 }
];

// ---------- canvas / viewport ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, isPhone = false;
let cols = 0, rows = 0, N = 0, pitchX = 0, pitchY = 0, grout = 3;

function layout() {
  const vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  let ph = false;
  if (window.screen && Math.min(window.screen.width, window.screen.height) < 700) ph = true;
  else if (H > W * 1.15) ph = true;
  isPhone = ph;
  let pitch = Math.sqrt(W * H / 700);
  pitch = Math.max(27, Math.min(54, pitch));
  cols = Math.max(1, Math.round(W / pitch));
  rows = Math.max(1, Math.round(H / pitch));
  pitchX = W / cols; pitchY = H / rows;
  grout = Math.max(2, Math.round(pitch * 0.09));
  N = cols * rows;
}
layout();
if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', () => { layout(); draw(stateNow()); });
}
window.addEventListener('resize', () => { layout(); draw(stateNow()); });

// ---------- the river: closed-form brightness field ----------
// Streak parameters are seeded once; everything else is a pure
// function of (x, y, t), so the center sample is evaluated
// analytically from the same field that is drawn. No offscreen buffer.
const rng = mulberry32(SEED);
const streaks = [];
for (let i = 0; i < 30; i++) {
  streaks.push({
    yFrac: rng(),                       // vertical position, fraction of H
    x0: rng() * 1600 - 200,             // start x in a 1600-wide wrap field
    len: 60 + rng() * 190,              // streak length, px
    speed: 4 + rng() * 11,              // drift, px per second
    peak: 0.10 + rng() * 0.20,          // brightness contribution
    thick: 5 + rng() * 9,               // vertical falloff scale
    wob: rng() * Math.PI * 2            // wobble phase
  });
}
function brightness(x, y, t) {
  // layered horizontal sine bands, slowly panning
  let b = 0.19
    + 0.075 * Math.sin(y * 0.020 + t * 0.11 + 1.2 * Math.sin(y * 0.0035 - t * 0.045))
    + 0.04 * Math.sin(y * 0.085 - t * 0.17 + x * 0.0006)
    + 0.03 * Math.sin((x + y) * 0.006 + t * 0.06);
  // drifting light streaks
  for (let i = 0; i < streaks.length; i++) {
    const s = streaks[i];
    const span = W + 480;
    let cx = (s.x0 + t * s.speed) % span; if (cx < 0) cx += span;
    cx -= 240;
    const cy = s.yFrac * H + 5 * Math.sin(t * 0.10 + s.wob);
    const dx = (x - cx) / (s.len * 0.5);
    const dy = (y - cy) / s.thick;
    b += s.peak * Math.exp(-dx * dx * 2.2) * Math.exp(-dy * dy);
  }
  if (b < 0) b = 0; if (b > 0.85) b = 0.85;
  return b;
}
// precomputed water-to-streak color ramp for the drawn field
const RAMP = [];
for (let i = 0; i < 48; i++) {
  const f = i / 47;
  const r = Math.round(WATER[0] + (STREAK[0] - WATER[0]) * f);
  const g = Math.round(WATER[1] + (STREAK[1] - WATER[1]) * f);
  const bl = Math.round(WATER[2] + (STREAK[2] - WATER[2]) * f);
  RAMP.push('rgb(' + r + ',' + g + ',' + bl + ')');
}
function toneFor(b) {
  let best = TONES[0], bd = Infinity;
  for (let i = 0; i < TONES.length; i++) {
    const d = Math.abs(TONES[i].lum - b);
    if (d < bd) { bd = d; best = TONES[i]; }
  }
  return best.hex;
}

// ---------- cycle state ----------
// Piece time t runs from load. A cycle: panes fill one per 0.5 s tick
// (plus one extra per tap), hold 10 s, clear in reading order over
// 10 s, then the next cycle begins. cycleStart and the tap list are
// the only live state; all rendering derives from (SEED, taps, t).
const HOLD = 10, CLEAR_DUR = 10, TICK = 0.5;
let cycleStart = 0;          // piece-time at which the current cycle began
let taps = [];               // local times of taps in the current cycle
let lastT = 0;

function mergedEvents() {
  const ev = [];
  for (let k = 0; k < N; k++) ev.push(TICK * k);
  for (let i = 0; i < taps.length; i++) ev.push(taps[i]);
  ev.sort((a, b) => a - b);
  return ev;
}
function cycleInfo(local) {
  const ev = mergedEvents();
  let filled = 0;
  while (filled < N && filled < ev.length && ev[filled] <= local) filled++;
  let fillEnd = Infinity;
  if (N > 0 && ev.length >= N) fillEnd = ev[N - 1];
  const holdEnd = fillEnd + HOLD;
  const clearEnd = holdEnd + CLEAR_DUR;
  let shown = filled;
  if (local >= holdEnd) {
    const cleared = Math.floor((local - holdEnd) / CLEAR_DUR * N);
    shown = Math.max(0, N - Math.min(N, cleared));
  } else if (local >= fillEnd) {
    shown = N;
  }
  return { ev, filled, fillEnd, holdEnd, clearEnd, shown };
}
function stateNow() { return lastT; }
function advanceCycles(t) {
  // settle the cycle bookkeeping for absolute piece-time t
  let guard = 0;
  while (guard++ < 1000) {
    const local = t - cycleStart;
    const info = cycleInfo(local);
    if (local < info.clearEnd) break;
    cycleStart += info.clearEnd;
    taps = [];
  }
}

// ---------- interaction: tap force-samples the center ----------
// A tap is an extra sampling event: the next pane fills immediately,
// its color sampled from the scene center at the tap instant.
function onTap() {
  const local = lastT - cycleStart;
  const info = cycleInfo(local);
  if (local < info.fillEnd) taps.push(local);
}
canvas.addEventListener('pointerdown', onTap);
window.addEventListener('pointerdown', onTap);

// ---------- draw ----------
function draw(t) {
  lastT = t;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // river field: horizontal segments shaded by the brightness field
  const segW = 48, segH = 8;
  for (let y = 0; y < H; y += segH) {
    const hh = Math.min(segH, H - y);
    for (let x = 0; x < W; x += segW) {
      const ww = Math.min(segW, W - x);
      const b = brightness(x + ww / 2, y + hh / 2, t);
      ctx.fillStyle = RAMP[Math.round(b / 0.85 * 47)];
      ctx.fillRect(x, y, ww + 1, hh + 1);
    }
  }
  // panes locked so far this cycle
  const local = t - cycleStart;
  const info = cycleInfo(local);
  const cx = W / 2, cy = H / 2;
  const g = grout;
  for (let k = 0; k < info.shown; k++) {
    const sampleT = cycleStart + info.ev[k];
    const tone = toneFor(brightness(cx, cy, sampleT));
    const col = k % cols, row = Math.floor(k / cols);
    const px = col * pitchX, py = row * pitchY;
    ctx.fillStyle = GROUT;
    ctx.fillRect(px, py, pitchX + 1, pitchY + 1);
    ctx.fillStyle = tone;
    ctx.fillRect(px + g / 2, py + g / 2, pitchX - g, pitchY - g);
    // bevel: light top and left, shade bottom and right
    ctx.fillStyle = 'rgba(199,208,224,0.20)';
    ctx.fillRect(px + g / 2, py + g / 2, pitchX - g, 1);
    ctx.fillRect(px + g / 2, py + g / 2, 1, pitchY - g);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(px + g / 2, py + pitchY - g / 2 - 1, pitchX - g, 1);
    ctx.fillRect(px + pitchX - g / 2 - 1, py + g / 2, 1, pitchY - g);
    // soft inner glow
    ctx.fillStyle = 'rgba(199,208,224,0.05)';
    ctx.fillRect(px + g / 2 + 3, py + g / 2 + 3, pitchX - g - 6, pitchY - g - 6);
  }
  // progress readout (specced content)
  ctx.fillStyle = 'rgba(199,208,224,0.55)';
  ctx.font = (isPhone ? 10 : 11) + 'px monospace';
  ctx.textBaseline = 'bottom';
  ctx.fillText('pane ' + info.shown + ' / ' + N, 8, H - 6);
  // house rule: pin the canvas element size in px inside draw()
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}

// ---------- time: frame one is the synchronous draw at t = 0 ----------
let FORCED = null;
if (typeof location !== 'undefined' && location.search) {
  const m = String(location.search).match(/seed=t(\d+)/);
  if (m) FORCED = parseInt(m[1], 10);
}
if (FORCED !== null) {
  advanceCycles(FORCED);
  draw(FORCED);
} else {
  draw(0);
  if (typeof requestAnimationFrame === 'function') {
    let startTs = null;
    const frame = (ts) => {
      if (startTs === null) startTs = ts;
      const t = (ts - startTs) / 1000;
      advanceCycles(t);
      draw(t);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
}
</script>
</body>
</html>
