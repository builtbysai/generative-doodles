<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9016 · Interference — Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #14120d;
    color: #e8e2d2;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 600px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8f8875; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; }
  header h1 .num { color: #a33b2e; }
  header p { color: #8f8875; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #c9c2ad; font-weight: normal; }
  #stage {
    width: min(92vw, 760px);
    aspect-ratio: 1 / 1;
    background: #f2ecdd;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  footer { margin-top: 4vmin; color: #6b6455; font-size: 13px; font-style: italic; }
  footer a { color: #a33b2e; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№9016</span> · Interference</h1>
  <p>Wheels of fine lines turn at different speeds, and where they cross, new
  patterns bloom and dissolve. This one moves. <b>Click the piece for a new
  variation.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 90210;
const frozenT = parseFloat(params.get("t") || "");
const freeze = Number.isFinite(frozenT);
const reducedMotion = window.matchMedia &&
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const PAPER = "#f2ecdd";
const INK = "#23201a";
const RUST = "#a33b2e";
const TAU = Math.PI * 2;
const VU = 1000;

// ---- seeded composition ----
const rnd = mulberry32(seed);
const wheels = [];
{
  const nWheels = 2 + (rnd() < 0.45 ? 1 : 0); // 2 or 3
  const ccx = 500 + (rnd() - 0.5) * 60, ccy = 500 + (rnd() - 0.5) * 60;
  for (let i = 0; i < nWheels; i++){
    // wheel 0 is always radial: a rings-only piece would look frozen, since
    // rotating concentric circles are invisible in animation
    const radial = i === 0 ? true : rnd() < 0.55;
    // each wheel drifts a little further off the shared center, so the
    // overlap always produces interference instead of a perfect bullseye
    const drift = i === 0 ? 0 : i === 1 ? 160 : 340;
    const band = i === 0 ? [38, 58] : i === 1 ? [62, 92] : [30, 70];
    // the second wheel stays closer in, so it reads as its own inner system
    const rOutScale = i === 1 ? 0.68 + rnd() * 0.17 : 1;
    wheels.push({
      radial,
      cx: ccx + (rnd() - 0.5) * drift,
      cy: ccy + (rnd() - 0.5) * drift,
      count: radial ? band[0] + ((rnd() * (band[1] - band[0])) | 0)
                    : 26 + ((rnd() * 30) | 0),
      speed: (0.05 + rnd() * 0.22) * (rnd() < 0.5 ? -1 : 1),
      phase: rnd() * TAU,
      rIn: 40 + rnd() * 50,
      rOut: (400 + rnd() * 70) * rOutScale,
      ringGap: 9 + rnd() * 9,
      color: (i === 1 && rnd() < 0.6) ? RUST : INK,
      alpha: 0.42 + rnd() * 0.22
    });
  }
  // never two rust wheels; keep the accent rare
  let rustSeen = false;
  for (const w of wheels){
    if (w.color === RUST){
      if (rustSeen) w.color = INK;
      rustSeen = true;
    }
  }
}

// ---- static grain overlay (drawn once, stamped each frame) ----
let grainCanvas = null;
function buildGrain(){
  const g = document.createElement("canvas");
  g.width = 500; g.height = 500;
  const gx = g.getContext("2d");
  const rg = mulberry32(seed ^ 0x9e37);
  const img = gx.createImageData(500, 500);
  for (let i = 0; i < img.data.length; i += 4){
    const v = 200 + ((rg() * 55) | 0);
    img.data[i] = v; img.data[i + 1] = v - 8; img.data[i + 2] = v - 22;
    img.data[i + 3] = 14 + ((rg() * 22) | 0);
  }
  gx.putImageData(img, 0, 0);
  grainCanvas = g;
}
buildGrain();

const canvas = document.getElementById("c");
const stage = document.getElementById("stage");
const ctx = canvas.getContext("2d");
let K = 1, dpr = 1;

function sizeCanvas(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const S = stage.clientWidth;
  K = S / VU;
  canvas.width = Math.round(S * dpr);
  canvas.height = Math.round(S * dpr);
}

function frame(t){
  ctx.setTransform(dpr * K, 0, 0, dpr * K, 0, 0);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VU, VU);

  for (const w of wheels){
    ctx.save();
    ctx.translate(w.cx, w.cy);
    ctx.rotate(w.phase + w.speed * t);
    ctx.strokeStyle = w.color;
    ctx.globalAlpha = w.alpha;
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    if (w.radial){
      for (let i = 0; i < w.count; i++){
        const a = (i / w.count) * TAU;
        const ca = Math.cos(a), sa = Math.sin(a);
        ctx.moveTo(ca * w.rIn, sa * w.rIn);
        ctx.lineTo(ca * w.rOut, sa * w.rOut);
      }
    } else {
      for (let r = w.rIn; r <= w.rOut; r += w.ringGap){
        ctx.moveTo(r, 0);
        ctx.arc(0, 0, r, 0, TAU);
      }
    }
    ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // grain + vignette
  ctx.drawImage(grainCanvas, 0, 0, VU, VU);
  const vg = ctx.createRadialGradient(500, 500, 380, 500, 500, 780);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(74,64,46,0.12)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VU, VU);
}

sizeCanvas();
window.addEventListener("resize", () => { sizeCanvas(); if (static_) frame(staticT); });

let static_ = false, staticT = 0;
if (freeze){ static_ = true; staticT = frozenT; frame(staticT); }
else if (reducedMotion){ static_ = true; staticT = 8; frame(staticT); }
else {
  const t0 = performance.now();
  (function loop(){
    frame((performance.now() - t0) / 1000);
    requestAnimationFrame(loop);
  })();
}

document.getElementById("stage").addEventListener("click", () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, "", "?seed=" + seed);
  location.reload();
});
</script>
</body>
</html>
