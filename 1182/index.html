<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rubber Chicken Orchestra</title>
<style>
  html, body { margin: 0; padding: 0; background: #141216; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- Rubber Chicken Orchestra — Jason Soliday study SD7 ----------
  // Six flat-icon instruments on a shelf take aleatoric turns, one at a
  // time, never repeating the last. Each turn's "sound" is drawn: squeal
  // rings, creak zigzags, spark arcs, quack bubbles, glitch pixels, saw
  // waves. Turns are addressed from a seeded hash stream (not accumulated),
  // so any moment is a pure function of piece time plus the visitor's taps.
  // A tap steals the turn for that object; the stream re-anchors and the
  // baton hands off from there. Silent by design.

  var BG = '#141216';
  var SHELF = '#3A3340';
  var INK = '#E8E2F0';
  var DIMNAME = '#6E6878';
  var TITLEC = '#CFC8D8';

  var NAMES = ['CHICKEN', 'ACCORDION', 'WHEEL', 'DUCK', 'CIRCUIT', 'GEAR'];
  var SEED = 19;
  var T0 = 1.9; // fixed first-frame phase: inside turn 0 (the chicken)

  // ---------- seeded hashes ----------
  function hash01(seed, a, b) {
    var x = (seed ^ Math.imul(a + 1, 374761393) ^ Math.imul(b + 1, 668265263)) >>> 0;
    x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  }
  function pickInst(j, prev) {
    var cand = Math.floor(hash01(SEED, j, 11) * 6);
    if (cand === prev) cand = (cand + 1 + Math.floor(hash01(SEED, j, 12) * 5)) % 6;
    return cand;
  }
  function pickDur(j) { return 3 + 0.25 * Math.floor(hash01(SEED, j, 13) * 13); } // 3.00..6.00

  // ---------- turn stream with steal re-anchoring ----------
  var taps = []; // {t, inst} in piece time, sorted by t
  function buildSegments() {
    var segs = [{ start: 0, j0: 0, forced: -1, prev: -1 }];
    for (var i = 0; i < taps.length; i++) {
      var cur = turnAtWith(segs, taps[i].t);
      segs.push({ start: taps[i].t, j0: cur.j + 1, forced: taps[i].inst, prev: -1 });
    }
    return segs;
  }
  function turnAtWith(segs, t) {
    var seg = segs[0];
    for (var i = 0; i < segs.length; i++) if (segs[i].start <= t) seg = segs[i];
    var j = seg.j0, prev = seg.prev, start = seg.start;
    for (var guard = 0; guard < 100000; guard++) {
      var inst = (j === seg.j0 && seg.forced >= 0) ? seg.forced : pickInst(j, prev);
      var dur = pickDur(j);
      if (t < start + dur) return { j: j, inst: inst, tau: t - start, dur: dur, start: start };
      prev = inst; start += dur; j++;
    }
    return { j: j, inst: 0, tau: 0, dur: 1, start: start };
  }
  function turnAt(t) { return turnAtWith(buildSegments(), t); }

  // ---------- view / canvas ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, lastT = T0;
  var cells = []; // hit/layout rects per instrument for the current frame

  function viewW() {
    var vv = window.visualViewport;
    if (vv && vv.width) return vv.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    var vv = window.visualViewport;
    if (vv && vv.height) return vv.height;
    return window.innerHeight || 600;
  }
  function isPhone() {
    var sw = 0, sh = 0;
    if (window.screen) { sw = window.screen.width || 0; sh = window.screen.height || 0; }
    if (sw && sh) return Math.min(sw, sh) < 700;
    return H > W * 1.15;
  }
  function fit() {
    W = viewW(); H = viewH();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // ---------- layout ----------
  function layout() {
    var phone = isPhone();
    var M = Math.max(14, W * 0.03);
    var iconH = Math.max(58, Math.min(118, H * 0.155));
    var list = [];
    var baton;
    if (!phone) {
      var shelfY = Math.round(H * 0.80);
      var batonW = 56;
      var cw = (W - 2 * M - batonW) / 6;
      for (var i = 0; i < 6; i++) {
        list.push({ x: M + i * cw, w: cw, cx: M + i * cw + cw / 2, base: shelfY, iconH: iconH });
      }
      baton = { x: W - M - batonW / 2, base: shelfY };
      return { phone: false, M: M, rows: [shelfY], cells: list, baton: baton, iconH: iconH };
    }
    var rowY = [Math.round(H * 0.685), Math.round(H * 0.885)];
    var bw = 44;
    for (var r = 0; r < 2; r++) {
      var n = 3, w2 = (r === 1) ? (W - 2 * M - bw) / n : (W - 2 * M) / n;
      for (var k = 0; k < n; k++) {
        list.push({ x: M + k * w2, w: w2, cx: M + k * w2 + w2 / 2, base: rowY[r], iconH: iconH });
      }
    }
    baton = { x: W - M - bw / 2, base: rowY[1] };
    return { phone: true, M: M, rows: rowY, cells: list, baton: baton, iconH: iconH };
  }

  // ---------- small draw helpers ----------
  function circle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, 6.2831853);
  }
  function ellipseFill(x, y, rx, ry) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(rx, ry);
    ctx.beginPath();
    ctx.moveTo(1, 0);
    ctx.arc(0, 0, 1, 0, 6.2831853);
    ctx.fill();
    ctx.restore();
  }
  function line(x1, y1, x2, y2) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  function poly(pts, close) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    if (close) ctx.closePath();
  }

  // ---------- shelf icons ----------
  // Each icon draws in a box: center cx, baseline base, height s.
  function drawChicken(cx, base, s, active, tau) {
    var bob = active ? Math.sin(tau * 2.2) * 0.05 : 0;
    ctx.save();
    ctx.translate(cx, base);
    ctx.rotate(bob);
    ctx.translate(-cx, -base);
    // legs
    ctx.strokeStyle = '#E63946'; ctx.lineWidth = 2.5;
    line(cx - s * 0.08, base - s * 0.16, cx - s * 0.08, base);
    line(cx + s * 0.10, base - s * 0.16, cx + s * 0.10, base);
    line(cx - s * 0.15, base, cx - s * 0.01, base);
    line(cx + s * 0.03, base, cx + s * 0.17, base);
    // tail feathers
    ctx.strokeStyle = '#FFD23F'; ctx.lineWidth = 4;
    line(cx - s * 0.24, base - s * 0.52, cx - s * 0.42, base - s * 0.78);
    line(cx - s * 0.27, base - s * 0.46, cx - s * 0.47, base - s * 0.62);
    line(cx - s * 0.25, base - s * 0.40, cx - s * 0.44, base - s * 0.44);
    // body
    ctx.fillStyle = '#FFD23F';
    ellipseFill(cx - s * 0.04, base - s * 0.40, s * 0.30, s * 0.25);
    // wing
    ctx.strokeStyle = '#D9A91F'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.20, base - s * 0.44);
    ctx.arc(cx - s * 0.05, base - s * 0.44, s * 0.15, 0.3, 2.6);
    ctx.stroke();
    // head
    var hx = cx + s * 0.235, hy = base - s * 0.74;
    ctx.fillStyle = '#FFD23F';
    circle(hx, hy, s * 0.135); ctx.fill();
    // comb
    ctx.fillStyle = '#E63946';
    circle(hx - s * 0.05, hy - s * 0.13, s * 0.045); ctx.fill();
    circle(hx + s * 0.015, hy - s * 0.155, s * 0.05); ctx.fill();
    circle(hx + s * 0.075, hy - s * 0.12, s * 0.042); ctx.fill();
    // beak: opens/closes in 0.3 s steps while performing
    var open = active && (Math.floor(tau / 0.3) % 2 === 0);
    ctx.fillStyle = '#E63946';
    if (open) {
      poly([[hx + s * 0.10, hy - s * 0.03], [hx + s * 0.30, hy - s * 0.115], [hx + s * 0.115, hy + s * 0.015]], true); ctx.fill();
      poly([[hx + s * 0.10, hy + s * 0.035], [hx + s * 0.28, hy + s * 0.135], [hx + s * 0.11, hy + s * 0.06]], true); ctx.fill();
    } else {
      poly([[hx + s * 0.10, hy - s * 0.03], [hx + s * 0.30, hy + s * 0.01], [hx + s * 0.10, hy + s * 0.05]], true); ctx.fill();
    }
    // eye
    ctx.fillStyle = '#141216';
    circle(hx + s * 0.045, hy - s * 0.03, s * 0.02); ctx.fill();
    ctx.restore();
  }

  function drawAccordion(cx, base, s, active, tau) {
    var boxW = s * 0.21, boxH = s * 0.64, top = base - boxH;
    var spread = active ? Math.sin(tau * 1.8) * s * 0.045 : 0;
    var belW = s * 0.30 + spread;
    var lx = cx - belW / 2 - boxW, rx = cx + belW / 2;
    // bellows (black folds)
    ctx.fillStyle = '#0B0B0D';
    ctx.fillRect(cx - belW / 2, top + s * 0.05, belW, boxH - s * 0.10);
    ctx.strokeStyle = '#3A3340'; ctx.lineWidth = 2;
    var folds = 5;
    for (var i = 1; i < folds; i++) {
      var fx = cx - belW / 2 + (belW * i) / folds;
      line(fx, top + s * 0.05, fx, top + boxH - s * 0.05);
    }
    // end boxes
    ctx.fillStyle = '#B5651D';
    ctx.fillRect(lx, top, boxW, boxH);
    ctx.fillRect(rx, top, boxW, boxH);
    ctx.strokeStyle = '#7A4413'; ctx.lineWidth = 2;
    ctx.strokeRect(lx, top, boxW, boxH);
    ctx.strokeRect(rx, top, boxW, boxH);
    // bass buttons on left box, keys on right box
    ctx.fillStyle = '#E8E0D0';
    for (var b = 0; b < 3; b++) { circle(lx + boxW / 2, top + boxH * (0.25 + b * 0.25), s * 0.022); ctx.fill(); }
    ctx.fillStyle = '#141216';
    for (var k = 0; k < 4; k++) ctx.fillRect(rx + boxW * 0.22, top + boxH * (0.14 + k * 0.2), boxW * 0.56, boxH * 0.09);
  }

  function drawWheel(cx, base, s, active, tau) {
    var cy = base - s * 0.44, r = s * 0.335;
    // stand
    ctx.strokeStyle = '#5A5D63'; ctx.lineWidth = 3;
    line(cx, cy, cx - s * 0.30, base);
    line(cx, cy, cx + s * 0.30, base);
    line(cx - s * 0.36, base, cx + s * 0.36, base);
    // tire
    ctx.strokeStyle = '#8A8D93'; ctx.lineWidth = Math.max(4, s * 0.055);
    circle(cx, cy, r); ctx.stroke();
    // spokes
    var a0 = active ? tau * 4 : 0.6;
    ctx.strokeStyle = '#C9CCD2'; ctx.lineWidth = 2.5;
    for (var i = 0; i < 3; i++) {
      var a = a0 + (i * 6.2831853) / 3;
      line(cx, cy, cx + Math.cos(a) * r * 0.92, cy + Math.sin(a) * r * 0.92);
    }
    ctx.fillStyle = '#8A8D93';
    circle(cx, cy, s * 0.05); ctx.fill();
  }

  function drawDuck(cx, base, s, active, tau) {
    var dy = active ? Math.sin(tau * 3) * s * 0.03 : 0;
    // tail
    ctx.fillStyle = '#FFE66D';
    poly([[cx - s * 0.26, base - s * 0.42 + dy], [cx - s * 0.44, base - s * 0.58 + dy], [cx - s * 0.20, base - s * 0.28 + dy]], true); ctx.fill();
    // body
    ellipseFill(cx - s * 0.02, base - s * 0.30 + dy, s * 0.33, s * 0.215);
    // head
    var hx = cx + s * 0.235, hy = base - s * 0.575 + dy;
    circle(hx, hy, s * 0.145); ctx.fill();
    // beak
    ctx.fillStyle = '#FF9F1C';
    poly([[hx + s * 0.11, hy - s * 0.025], [hx + s * 0.27, hy + s * 0.01], [hx + s * 0.11, hy + s * 0.05]], true); ctx.fill();
    // eye
    ctx.fillStyle = '#141216';
    circle(hx + s * 0.05, hy - s * 0.035, s * 0.02); ctx.fill();
    // water line
    ctx.strokeStyle = '#3A3340'; ctx.lineWidth = 2;
    line(cx - s * 0.40, base - s * 0.015, cx + s * 0.40, base - s * 0.015);
  }

  function drawCircuit(cx, base, s, active, tau) {
    var bw = s * 0.72, bh = s * 0.62, x = cx - bw / 2, y = base - bh;
    ctx.fillStyle = '#1A3B2A';
    ctx.fillRect(x, y, bw, bh);
    ctx.strokeStyle = '#2ECC71'; ctx.lineWidth = 1.6;
    ctx.strokeRect(x, y, bw, bh);
    // traces
    ctx.beginPath();
    ctx.moveTo(x + bw * 0.08, y + bh * 0.78);
    ctx.lineTo(x + bw * 0.38, y + bh * 0.78);
    ctx.lineTo(x + bw * 0.38, y + bh * 0.30);
    ctx.moveTo(x + bw * 0.60, y + bh * 0.86);
    ctx.lineTo(x + bw * 0.60, y + bh * 0.52);
    ctx.lineTo(x + bw * 0.90, y + bh * 0.52);
    ctx.moveTo(x + bw * 0.10, y + bh * 0.18);
    ctx.lineTo(x + bw * 0.30, y + bh * 0.18);
    ctx.stroke();
    // chips
    ctx.fillStyle = '#0B0B0D';
    ctx.fillRect(x + bw * 0.40, y + bh * 0.30, bw * 0.20, bh * 0.24);
    ctx.fillRect(x + bw * 0.68, y + bh * 0.62, bw * 0.16, bh * 0.20);
    // scorch (finger-fried)
    ctx.strokeStyle = '#0B0B0D'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x + bw * 0.14, y + bh * 0.55);
    ctx.lineTo(x + bw * 0.20, y + bh * 0.44);
    ctx.lineTo(x + bw * 0.17, y + bh * 0.36);
    ctx.lineTo(x + bw * 0.24, y + bh * 0.27);
    ctx.stroke();
    // pins along the bottom
    ctx.fillStyle = '#C9CCD2';
    for (var i = 0; i < 6; i++) ctx.fillRect(x + bw * (0.08 + i * 0.15), base - s * 0.015, bw * 0.05, s * 0.015);
    // LED
    var on = active && (Math.floor(tau * 3) % 2 === 0);
    ctx.fillStyle = on ? '#E63946' : '#5A2326';
    circle(x + bw * 0.90, y + bh * 0.16, s * 0.032); ctx.fill();
    // trace dots
    ctx.fillStyle = '#2ECC71';
    circle(x + bw * 0.38, y + bh * 0.30, s * 0.018); ctx.fill();
    circle(x + bw * 0.60, y + bh * 0.52, s * 0.018); ctx.fill();
  }

  function gearPath(cx, cy, rOut, rIn, teeth, rot) {
    ctx.beginPath();
    var steps = teeth * 4;
    for (var i = 0; i <= steps; i++) {
      var a = rot + (i / steps) * 6.2831853;
      var seg = i % 4;
      var r = (seg === 1 || seg === 2) ? rOut : rIn;
      var px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }
  function drawGear(cx, base, s, active, tau) {
    var cy = base - s * 0.42, rO = s * 0.35, rI = s * 0.275;
    var rot = active ? tau * 1.5 : 0.3;
    ctx.fillStyle = '#9A9AA5';
    gearPath(cx, cy, rO, rI, 9, rot);
    ctx.fill();
    ctx.fillStyle = BG;
    circle(cx, cy, s * 0.115); ctx.fill();
    ctx.fillStyle = '#5A5D63';
    circle(cx, cy, s * 0.045); ctx.fill();
    // stand
    ctx.strokeStyle = '#5A5D63'; ctx.lineWidth = 3;
    line(cx, cy + rO * 0.6, cx, base);
    line(cx - s * 0.22, base, cx + s * 0.22, base);
  }

  var DRAWERS = [drawChicken, drawAccordion, drawWheel, drawDuck, drawCircuit, drawGear];

  // ---------- emissions (functions of turn-local time) ----------
  function emitChicken(cx, cy, tau, fade, j) {
    var RMAX = Math.max(280, Math.min(560, Math.min(W, H) * 0.68));
    ctx.strokeStyle = '#FF9F1C';
    for (var k = 0; k < 9; k++) {
      var r = (tau * 95 - k * 38) % RMAX;
      if (r < 10) continue;
      ctx.globalAlpha = fade * (1 - r / RMAX) * 0.85;
      ctx.lineWidth = 3;
      circle(cx, cy, r); ctx.stroke();
    }
    // jagged squawk burst at the centre, pulsing with the beak steps
    var amp = (Math.floor(tau / 0.3) % 2 === 0) ? 1 : 0.5;
    ctx.globalAlpha = fade * 0.9;
    ctx.strokeStyle = '#FFD23F'; ctx.lineWidth = 3;
    ctx.beginPath();
    var n = 7, w = 46 * amp, h = 15 * amp;
    for (var i = 0; i <= n; i++) {
      var px = cx - w + (2 * w * i) / n;
      var py = cy + (i % 2 === 0 ? -h : h) * (i === 0 || i === n ? 0.2 : 1);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function emitAccordion(cx, cy, tau, fade, j) {
    var L = Math.min(W, H) * 0.44;
    ctx.strokeStyle = '#E0A458'; ctx.lineWidth = 2.5;
    for (var m = 0; m < 6; m++) {
      var age = tau - m * 0.65;
      if (age < 0 || age > 2.4) continue;
      var ang = -2.75 + m * 0.47; // fan across the upper half
      var len = Math.min(age * 300, L);
      ctx.globalAlpha = fade * (1 - age / 2.4) * 0.9;
      ctx.beginPath();
      var segs = 6;
      for (var i = 0; i <= segs; i++) {
        var d = (len * i) / segs;
        var off = (i % 2 === 0 ? -7 : 7) * (i === 0 || i === segs ? 0 : 1);
        var px = cx + Math.cos(ang) * d - Math.sin(ang) * off;
        var py = cy + Math.sin(ang) * d + Math.cos(ang) * off;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function emitWheel(cx, cy, tau, fade, j) {
    // spinning dashed ring
    ctx.strokeStyle = '#8A8D93'; ctx.lineWidth = 3;
    for (var i = 0; i < 6; i++) {
      var a0 = tau * 3 + (i * 6.2831853) / 6;
      ctx.globalAlpha = fade * 0.45;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a0) * 52, cy + Math.sin(a0) * 52);
      ctx.arc(cx, cy, 52, a0, a0 + 0.55);
      ctx.stroke();
    }
    // spark bursts every 0.4 s
    var bmax = Math.floor(tau / 0.4);
    for (var b = bmax - 1; b <= bmax; b++) {
      if (b < 0) continue;
      var age = tau - b * 0.4;
      if (age < 0 || age > 0.75) continue;
      for (var rI = 0; rI < 9; rI++) {
        var h1 = hash01(SEED, j * 131 + b, rI * 3);
        var h2 = hash01(SEED, j * 131 + b, rI * 3 + 1);
        var ang = h1 * 6.2831853;
        var len = (14 + h2 * 52) * (0.4 + age * 1.15);
        ctx.globalAlpha = fade * (1 - age / 0.75) * 0.95;
        ctx.strokeStyle = rI % 3 === 0 ? '#FF9F1C' : '#FFD76A';
        ctx.lineWidth = 2;
        line(cx + Math.cos(ang) * 12, cy + Math.sin(ang) * 12,
             cx + Math.cos(ang) * (12 + len), cy + Math.sin(ang) * (12 + len));
      }
    }
    ctx.globalAlpha = 1;
  }

  function emitDuck(cx, cy, tau, fade, j) {
    ctx.strokeStyle = '#A8E6CF'; ctx.lineWidth = 2;
    for (var k = 0; k < 12; k++) {
      var age = tau - k * 0.5;
      if (age < 0 || age > 3.4) continue;
      var bx = cx + (hash01(SEED, j * 7 + 3, k) - 0.5) * W * 0.30 + Math.sin(age * 2.1 + k) * 14;
      var by = cy + 66 - age * 64;
      var r = 5 + age * 4.5;
      ctx.globalAlpha = fade * (1 - age / 3.4) * 0.9;
      circle(bx, by, r); ctx.stroke();
      ctx.globalAlpha = fade * (1 - age / 3.4) * 0.5;
      ctx.fillStyle = '#A8E6CF';
      circle(bx - r * 0.3, by - r * 0.3, r * 0.18); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function emitCircuit(cx, cy, tau, fade, j) {
    var step = Math.floor(tau / 0.12);
    var w = Math.min(W * 0.52, 540), h = Math.min(H * 0.36, 300);
    var cols = ['#2ECC71', '#7BE495', '#1F9D55', '#B8FF2E'];
    for (var i = 0; i < 110; i++) {
      var px = cx + (hash01(SEED, j * 101 + step, i * 2) - 0.5) * w;
      var py = cy + (hash01(SEED, j * 101 + step, i * 2 + 1) - 0.5) * h;
      var sz = 2 + Math.floor(hash01(SEED, j * 101 + step, i * 3) * 3) * 2;
      ctx.globalAlpha = fade * (0.35 + 0.65 * hash01(SEED, j * 101 + step, i * 5));
      ctx.fillStyle = cols[i % 4];
      ctx.fillRect(px, py, sz, sz);
    }
    ctx.globalAlpha = 1;
  }

  function emitGear(cx, cy, tau, fade, j) {
    var half = Math.min(W * 0.37, 440);
    ctx.strokeStyle = '#9A9AA5'; ctx.lineWidth = 2.5;
    ctx.globalAlpha = fade * 0.9;
    var rows = [cy - 48, cy + 40];
    for (var ri = 0; ri < 2; ri++) {
      var phase = tau * 150 * (ri === 0 ? 1 : -1);
      ctx.beginPath();
      var tooth = 18, started = false;
      for (var x = -half; x <= half; x += 6) {
        var f = (((x + phase) % tooth) + tooth) % tooth / tooth;
        var yy = rows[ri] - 13 + f * 26;
        if (!started) { ctx.moveTo(cx + x, yy); started = true; } else ctx.lineTo(cx + x, yy);
      }
      ctx.stroke();
    }
    // ghost gear turning at the centre
    ctx.globalAlpha = fade * 0.4;
    ctx.strokeStyle = '#9A9AA5'; ctx.lineWidth = 2;
    gearPath(cx, cy, 34, 27, 9, tau * 1.5);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  var EMITTERS = [emitChicken, emitAccordion, emitWheel, emitDuck, emitCircuit, emitGear];

  // ---------- baton ----------
  function drawBaton(bx, base, turn) {
    var dip = 0;
    var p = turn.tau - (turn.dur - 0.5);
    if (p >= 0 && p < 0.5) {
      for (var k = 0; k < 2; k++) {
        var lt = p - k * 0.25;
        if (lt >= 0 && lt < 0.18) dip = Math.max(dip, Math.sin((lt / 0.18) * Math.PI) * 0.45);
      }
    }
    var th = 0.55 - dip; // lean from vertical
    var len = 48;
    var ex = bx + Math.sin(th) * len, ey = base - 6 - Math.cos(th) * len;
    ctx.strokeStyle = '#C9A86A'; ctx.lineWidth = 3;
    line(bx, base - 6, ex, ey);
    ctx.fillStyle = INK;
    circle(ex, ey, 4.5); ctx.fill();
    ctx.fillStyle = '#5A5D63';
    circle(bx, base - 4, 3); ctx.fill();
  }

  // ---------- draw ----------
  function draw(t) {
    lastT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var L = layout();
    cells = L.cells;
    var turn = turnAt(t);
    var active = turn.inst;
    var fade = Math.min(1, turn.tau / 0.25);
    if (turn.tau > turn.dur - 0.8) fade *= Math.max(0, (turn.dur - turn.tau) / 0.8);

    // title
    ctx.fillStyle = TITLEC;
    ctx.font = '600 13px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('RUBBER CHICKEN ORCHESTRA', L.M, 30);

    // emission (upper area), centred over the performing object
    var ac = L.cells[active];
    var topShelf = L.rows[0];
    var ecy = L.phone ? H * 0.30 : (64 + (topShelf - ac.iconH - 60)) / 2 + 40;
    EMITTERS[active](ac.cx, ecy, turn.tau, fade, turn.j);

    // shelves + objects
    for (var r = 0; r < L.rows.length; r++) {
      ctx.fillStyle = SHELF;
      ctx.fillRect(8, L.rows[r], W - 16, 7);
      ctx.fillRect(8, L.rows[r] + 7, W - 16, 2);
    }
    for (var i = 0; i < 6; i++) {
      var c = L.cells[i];
      var isA = i === active;
      ctx.globalAlpha = isA ? 1 : 0.55;
      DRAWERS[i](c.cx, c.base, c.iconH, isA, isA ? turn.tau : 0);
      ctx.globalAlpha = 1;
      ctx.fillStyle = isA ? INK : DIMNAME;
      ctx.font = (isA ? '700 ' : '400 ') + '10px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(NAMES[i], c.cx, c.base + 24);
    }
    ctx.textAlign = 'left';

    drawBaton(L.baton.x, L.baton.base, turn);
  }

  // ---------- interaction: tap an object to steal its turn ----------
  function onTap(px, py) {
    for (var i = 0; i < cells.length; i++) {
      var c = cells[i];
      if (px >= c.x && px <= c.x + c.w && py >= c.base - c.iconH - 14 && py <= c.base + 30) {
        taps.push({ t: lastT, inst: i });
        taps.sort(function (a, b) { return a.t - b.t; });
        draw(lastT);
        return;
      }
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) { onTap(e.clientX || 0, e.clientY || 0); });
    canvas.addEventListener('touchstart', function (e) {
      if (e.touches && e.touches[0]) onTap(e.touches[0].clientX || 0, e.touches[0].clientY || 0);
    });
    canvas.addEventListener('mousedown', function (e) { onTap(e.clientX || 0, e.clientY || 0); });
  }

  // ---------- run ----------
  function clockNow() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return Date.now() / 1000;
  }
  fit();
  draw(T0);
  var bootStamp = clockNow();
  function frame() {
    draw(T0 + (clockNow() - bootStamp));
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(lastT); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { fit(); draw(lastT); });
  }
})();
</script>
</body>
</html>
