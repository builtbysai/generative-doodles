<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.334 Spring Convenor</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#121110; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.334 Spring Convenor (arunima-dazess-wangchuk).
// After her 2023 protest installation: an arched bamboo
// mirror stands on black fabric, its face covered in
// hand written red backed paper strips, each carrying a
// single short line. The mirror itself records nobody:
// its reflection is a soft abstract sheen drawn as data,
// muted silver grey shapes drifting very slowly on the
// arch interior, a presence implied and never depicted.
// Exactly twelve strips (asserted) sit in an authored
// hand placed rhythm across the mirror. One strip, the
// wide one near the top, carries the study's quoted line
// as hand lettered stroke paths; the other eleven carry
// short authored script lines, stroke paths only, no
// fonts anywhere. When a pointer passes near, the strips
// close to it lift and lean toward it on spring data, as
// if the words notice the reader, and settle back over
// about ten seconds once it has gone. No tap action, no
// camera, no microphone, no permission prompt of any
// kind: proximity is pointer position only. One canvas.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var SILVER = '#B9B4A8', BAMBOO = '#C9A876', RED = '#C22F24';
var FABRIC = '#121110', PAPER = '#EFE9DC', GROUND = '#121110';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 23.7, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function fl(col) { ctx.fillStyle = col; }

// ---- the arch ---------------------------------------------------
// Centred on the design space, filling it vertically: side
// posts at x = 340 and 940, spring line at y = 370, apex at
// y = 70, feet at y = 868.
var AX = 640, AR = 300, ASY = 370, ABOT = 868;
function archPath(r) {
  ctx.beginPath();
  ctx.moveTo(AX - r, ABOT);
  ctx.lineTo(AX - r, ASY);
  ctx.arc(AX, ASY, r, Math.PI, 0, false);
  ctx.lineTo(AX + r, ABOT);
  ctx.closePath();
}
function archOutline(r) {
  ctx.beginPath();
  ctx.moveTo(AX - r, ABOT);
  ctx.lineTo(AX - r, ASY);
  ctx.arc(AX, ASY, r, Math.PI, 0, false);
  ctx.lineTo(AX + r, ABOT);
}

// ---- the abstract reflection ------------------------------------
// Six soft sheen shapes held as JS data: centre, radii, a
// slow drift amplitude and period, and a kind. Light blobs
// are the silver grey itself at layered alpha, pale blobs
// borrow the strip paper at very low alpha, dark blobs are
// the fabric black pooling at low alpha. Nothing here is
// an image of anyone; the shapes only drift, on periods
// between sixty seven and one hundred thirteen seconds.
var SHEEN = [
  { cx: 560, cy: 330, rx: 190, ry: 260, amp: 26, per: 89, ph: 0.5, kind: 'light' },
  { cx: 740, cy: 560, rx: 150, ry: 210, amp: 20, per: 67, ph: 2.4, kind: 'light' },
  { cx: 650, cy: 180, rx: 170, ry: 90, amp: 16, per: 113, ph: 4.1, kind: 'pale' },
  { cx: 470, cy: 620, rx: 130, ry: 170, amp: 14, per: 79, ph: 1.2, kind: 'dark' },
  { cx: 800, cy: 250, rx: 110, ry: 140, amp: 18, per: 97, ph: 5.3, kind: 'dark' },
  { cx: 620, cy: 760, rx: 200, ry: 110, amp: 22, per: 73, ph: 3.0, kind: 'light' }
];
var SHEEN_STYLE = {
  light: { col: SILVER, a: [0.10, 0.16, 0.22] },
  pale: { col: PAPER, a: [0.05, 0.08, 0.11] },
  dark: { col: FABRIC, a: [0.08, 0.12, 0.16] }
};
function blobPath(cx, cy, rx, ry) {
  var i, a, x, y;
  ctx.beginPath();
  for (i = 0; i <= 28; i++) {
    a = (i / 28) * Math.PI * 2;
    x = cx + Math.cos(a) * rx;
    y = cy + Math.sin(a) * ry;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function drawMirror(t) {
  // Silver grey body of the mirror over the black fabric.
  archPath(AR);
  ctx.globalAlpha = 0.58;
  fl(SILVER);
  ctx.fill();
  ctx.globalAlpha = 1;
  // Sheen shapes, clipped to the arch interior, each one
  // three nested fills of the same blob, wide and faint,
  // then smaller and stronger, then a soft core, so the
  // glow is layered translucency only.
  ctx.save();
  archPath(AR);
  ctx.clip();
  var i, b, sty, cx, cy, lay, sc;
  var scales = [1.35, 1.0, 0.6];
  for (i = 0; i < SHEEN.length; i++) {
    b = SHEEN[i];
    sty = SHEEN_STYLE[b.kind];
    cx = b.cx + b.amp * Math.sin(t * 2 * Math.PI / b.per + b.ph);
    cy = b.cy + b.amp * 0.6 * Math.cos(t * 2 * Math.PI / (b.per * 1.31) + b.ph * 1.7);
    for (lay = 0; lay < 3; lay++) {
      sc = scales[lay];
      ctx.globalAlpha = sty.a[lay];
      fl(sty.col);
      blobPath(cx, cy, b.rx * sc, b.ry * sc);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // Edge shading: two soft dark strokes just inside the
  // rim so the mirror reads as a set surface, not a hole.
  archOutline(AR - 4);
  ctx.globalAlpha = 0.16;
  st(FABRIC, 30);
  ctx.stroke();
  archOutline(AR - 2);
  ctx.globalAlpha = 0.12;
  st(FABRIC, 10);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// ---- the bamboo frame -------------------------------------------
// Node points along the outer rail: up both posts and
// around the arc, where lashings cross the rail.
function railPoint(side, y) { return [AX + side * AR, y]; }
function arcPoint(deg) {
  var a = deg * Math.PI / 180;
  return [AX + AR * Math.cos(a), ASY - AR * Math.sin(a), Math.cos(a), -Math.sin(a)];
}
function drawLashing(x, y, nx, ny) {
  // One straight wrap across the rail and one diagonal
  // cross wrap, the suggestion of a bound bamboo joint.
  ctx.globalAlpha = 0.75;
  st(BAMBOO, 5);
  ctx.beginPath();
  ctx.moveTo(x - nx * 17, y - ny * 17);
  ctx.lineTo(x + nx * 17, y + ny * 17);
  ctx.stroke();
  var tx = -ny, ty = nx;
  var dx = (nx * 0.6 + tx * 0.8), dy = (ny * 0.6 + ty * 0.8);
  ctx.beginPath();
  ctx.moveTo(x - dx * 13, y - dy * 13);
  ctx.lineTo(x + dx * 13, y + dy * 13);
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawFrame() {
  // Outer rail, inner rail, and a thin groove line between.
  archOutline(AR);
  ctx.globalAlpha = 0.95;
  st(BAMBOO, 16);
  ctx.stroke();
  archOutline(AR - 15);
  ctx.globalAlpha = 0.45;
  st(BAMBOO, 2);
  ctx.stroke();
  archOutline(AR - 30);
  ctx.globalAlpha = 0.85;
  st(BAMBOO, 7);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // Lashings at the nodes.
  var ys = [500, 640, 780], i, p;
  for (i = 0; i < ys.length; i++) {
    p = railPoint(-1, ys[i]); drawLashing(p[0], p[1], 1, 0);
    p = railPoint(1, ys[i]); drawLashing(p[0], p[1], 1, 0);
  }
  var degs = [155, 115, 90, 65, 25];
  for (i = 0; i < degs.length; i++) {
    p = arcPoint(degs[i]);
    drawLashing(p[0], p[1], p[2], p[3]);
  }
  // Feet: two short ground strokes under the posts.
  ctx.globalAlpha = 0.9;
  st(BAMBOO, 8);
  ctx.beginPath(); ctx.moveTo(AX - AR - 26, ABOT + 5); ctx.lineTo(AX - AR + 26, ABOT + 5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(AX + AR - 26, ABOT + 5); ctx.lineTo(AX + AR + 26, ABOT + 5); ctx.stroke();
  ctx.globalAlpha = 1;
}

// ---- hand lettering: stroke path glyphs --------------------------
// A small stick hand drawn in a 10 by 14 box per glyph,
// baseline at y = 14, descenders reaching y = 17. Every
// glyph is polylines only; nothing is a font and nothing
// is rasterised text.
function ellPts(cx, cy, rx, ry, n) {
  var pts = [], i, a;
  for (i = 0; i <= n; i++) {
    a = (i / n) * Math.PI * 2;
    pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
  }
  return pts;
}
function arcPts(cx, cy, rx, ry, n, a0, a1) {
  var pts = [], i, a;
  for (i = 0; i <= n; i++) {
    a = a0 + (i / n) * (a1 - a0);
    pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
  }
  return pts;
}
var GLYPHS = {
  'I': [[[5, 2], [5, 14]], [[2, 2], [8, 2]], [[2, 14], [8, 14]]],
  'f': [[[7, 1.8], [5, 2.2], [4.2, 4], [4.2, 14]], [[2, 7], [8, 7]]],
  'o': [ellPts(5, 10, 3.6, 4, 14)],
  'n': [[[2, 14], [2, 6]], [[2, 8.2], [4, 6.2], [6.8, 6.2], [8.5, 8.2], [8.5, 14]]],
  'l': [[[5, 2], [5, 13], [7.2, 14]]],
  'y': [[[2, 6], [5, 10.5]], [[8, 6], [5, 10.5], [3.6, 15.8], [1.8, 16.6]]],
  'N': [[[2, 14], [2, 2], [8, 14], [8, 2]]],
  'a': [ellPts(4.6, 10, 3.4, 4, 14), [[8, 6], [8, 14]]],
  't': [[[5, 4], [5, 13], [7.2, 14]], [[2.5, 7], [7.5, 7]]],
  'u': [[[2, 6], [2, 11], [4, 13.8], [6.8, 13.8], [8, 11], [8, 6]], [[8, 8], [8, 14]]],
  'r': [[[2, 14], [2, 6]], [[2, 8.6], [4.5, 6.2], [8, 6.6]]],
  'e': [[[8.4, 10], [7.4, 6.8], [5, 6], [2.8, 6.8], [2.1, 10], [2.4, 12.6], [4.2, 13.8], [6.6, 13.8], [8.4, 12.8]], [[2.1, 10], [8.4, 10]]],
  'w': [[[1, 6], [3, 14], [5, 8], [7, 14], [9, 6]]],
  's': [[[8, 7.6], [6, 6.1], [3.6, 6.2], [2.6, 8.2], [4.2, 10.2], [6.6, 11.2], [8, 12.6], [6.4, 14], [3.2, 13.9]]],
  'G': [arcPts(5, 8, 4, 6, 16, 0.6, Math.PI * 2 - 0.6), [[5.2, 9.6], [8.6, 9.6], [8.6, 13.2]]],
  'd': [ellPts(4.4, 10, 3.4, 4, 14), [[8, 2], [8, 14]]]
};
function advance(ch) {
  if (ch === ' ') return 6;
  if (ch === '.') return 5;
  return 10;
}
function drawQuoteLine(text, cx, cy, scale) {
  var total = 0, i, ch;
  for (i = 0; i < text.length; i++) total += advance(text[i]) * scale;
  var x = cx - total / 2;
  var baseY = cy + 1.5 * scale;
  ctx.globalAlpha = 0.92;
  st(RED, 1.9 * scale);
  for (i = 0; i < text.length; i++) {
    ch = text[i];
    if (ch === '.') {
      fl(RED);
      ctx.beginPath();
      ctx.arc(x + 2.5 * scale, baseY - 0.6 * scale, 1.15 * scale, 0, Math.PI * 2);
      ctx.fill();
    } else if (GLYPHS[ch]) {
      var g = GLYPHS[ch], si, pi, pts;
      for (si = 0; si < g.length; si++) {
        pts = g[si];
        ctx.beginPath();
        for (pi = 0; pi < pts.length; pi++) {
          var px = x + pts[pi][0] * scale;
          var py = baseY + (pts[pi][1] - 14) * scale;
          if (pi === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
    }
    x += advance(ch) * scale;
  }
  ctx.globalAlpha = 1;
}

// ---- the strips ---------------------------------------------------
// Twelve authored strips: centre, size, tilt, kind. Strip
// zero is the quote strip, the widest, high on the mirror.
// The rest carry authored script lines: word humps per word
// and a phase, resolved into cursive stroke paths below.
var QUOTE = 'If only... Nature was our God.';
var STRIPS = [
  { cx: 640, cy: 302, w: 404, h: 52, ang: -2, kind: 'quote' },
  { cx: 548, cy: 185, w: 196, h: 40, ang: 5, kind: 'script', words: [3, 2], ph: 0.7 },
  { cx: 745, cy: 185, w: 172, h: 38, ang: -6, kind: 'script', words: [2, 3], ph: 2.1 },
  { cx: 452, cy: 428, w: 192, h: 42, ang: 3, kind: 'script', words: [4], ph: 1.3 },
  { cx: 806, cy: 436, w: 202, h: 40, ang: -4, kind: 'script', words: [3, 2], ph: 3.9 },
  { cx: 642, cy: 528, w: 232, h: 44, ang: 2, kind: 'script', words: [3, 3], ph: 5.1 },
  { cx: 492, cy: 646, w: 182, h: 38, ang: -5, kind: 'script', words: [2, 2], ph: 0.2 },
  { cx: 778, cy: 652, w: 216, h: 42, ang: 4, kind: 'script', words: [4, 2], ph: 2.8 },
  { cx: 636, cy: 738, w: 252, h: 44, ang: -2, kind: 'script', words: [3, 2, 2], ph: 4.4 },
  { cx: 470, cy: 252, w: 140, h: 36, ang: 8, kind: 'script', words: [2], ph: 1.9 },
  { cx: 812, cy: 250, w: 138, h: 36, ang: 7, kind: 'script', words: [2], ph: 3.3 },
  { cx: 448, cy: 800, w: 172, h: 38, ang: 6, kind: 'script', words: [3], ph: 5.7 }
];
(function () {
  if (STRIPS.length !== 12) throw new Error('Spring Convenor needs exactly 12 strips');
  var quotes = 0, i;
  for (i = 0; i < STRIPS.length; i++) if (STRIPS[i].kind === 'quote') quotes++;
  if (quotes !== 1) throw new Error('Spring Convenor needs exactly one quote strip');
  for (i = 0; i < STRIPS.length; i++) {
    STRIPS[i].lean = 0; STRIPS[i].leanV = 0;
    STRIPS[i].lx = 0; STRIPS[i].ly = 0; STRIPS[i].lvx = 0; STRIPS[i].lvy = 0;
  }
})();

// One authored script line as a cursive stroke path: a
// chain of humps per word, an occasional tall loop rising
// off the chain, dots above two of the humps, and a short
// flourish at the end. Fixed per strip from its authored
// word table and phase; nothing is random at runtime.
function drawScriptLine(s) {
  var innerW = s.w - 30;
  var words = s.words;
  var totalHumps = 0, i;
  for (i = 0; i < words.length; i++) totalHumps += words[i];
  var unit = innerW / (totalHumps + (words.length - 1) * 0.9);
  var x = -innerW / 2;
  var baseY = 3;
  ctx.globalAlpha = 0.88;
  st(RED, 2);
  var wi, humps, wlen, steps, si, u, px, py, lift;
  for (wi = 0; wi < words.length; wi++) {
    humps = words[wi];
    wlen = humps * unit;
    steps = humps * 7;
    ctx.beginPath();
    for (si = 0; si <= steps; si++) {
      u = si / steps;
      px = x + u * wlen;
      py = baseY - Math.abs(Math.sin(u * humps * Math.PI + s.ph)) * (3.4 + 1.3 * Math.sin(s.ph + wi * 1.7));
      lift = Math.exp(-Math.pow((u - 0.34) * 4.2, 2)) * (wi === 0 ? 7.5 : 0);
      py -= lift;
      if (si === 0) ctx.moveTo(px - 4, baseY + 2.5);
      ctx.lineTo(px, py);
    }
    // Flourish tail on the final word only.
    if (wi === words.length - 1) {
      ctx.lineTo(x + wlen + 9, baseY - 2.5);
      ctx.lineTo(x + wlen + 15, baseY - 4.5);
    }
    ctx.stroke();
    // A dot above the second hump, like a dotted letter.
    if (humps >= 2) {
      var dxp = x + wlen * (1.5 / humps);
      ctx.beginPath();
      ctx.moveTo(dxp, baseY - 10.5);
      ctx.lineTo(dxp, baseY - 9);
      ctx.stroke();
    }
    x += wlen + unit * 0.9;
  }
  ctx.globalAlpha = 1;
}

function drawStrip(s) {
  ctx.save();
  ctx.translate(s.cx + s.lx, s.cy + s.ly);
  ctx.rotate(s.ang * Math.PI / 180 + s.lean);
  // Red backing, offset down and right so it peeks out
  // along two edges of the paper.
  fl(RED);
  ctx.fillRect(-s.w / 2 + 4, -s.h / 2 + 5, s.w, s.h);
  fl(PAPER);
  ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
  ctx.save();
  ctx.beginPath();
  ctx.rect(-s.w / 2, -s.h / 2, s.w, s.h);
  ctx.clip();
  if (s.kind === 'quote') drawQuoteLine(QUOTE, 0, 0, 1.32);
  else drawScriptLine(s);
  ctx.restore();
  ctx.restore();
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  drawMirror(T);
  drawFrame();
  var i;
  for (i = 0; i < STRIPS.length; i++) drawStrip(STRIPS[i]);
}

// ---- proximity springs ---------------------------------------------
// Per strip lean and lift on underdamped springs. Stiffness
// 1.7 and damping 0.55 put the visible settle near ten
// seconds after the pointer has passed, as specced.
var pointer = null;
function stepPhysics(dt) {
  var i, s, dx, dy, d, inf, leanT, lxT, lyT;
  for (i = 0; i < STRIPS.length; i++) {
    s = STRIPS[i];
    leanT = 0; lxT = 0; lyT = 0;
    if (pointer) {
      dx = pointer[0] - s.cx; dy = pointer[1] - s.cy;
      d = Math.sqrt(dx * dx + dy * dy);
      if (d < 280) {
        inf = 1 - d / 280;
        inf = inf * inf;
        leanT = inf * 0.26 * Math.max(-1, Math.min(1, dx / 160));
        if (d > 1) { lxT = (dx / d) * inf * 9; lyT = (dy / d) * inf * 9; }
      }
    }
    s.leanV += (-1.7 * (s.lean - leanT) - 0.55 * s.leanV) * dt;
    s.lean += s.leanV * dt;
    s.lvx += (-2.2 * (s.lx - lxT) - 0.7 * s.lvx) * dt;
    s.lvy += (-2.2 * (s.ly - lyT) - 0.7 * s.lvy) * dt;
    s.lx += s.lvx * dt;
    s.ly += s.lvy * dt;
  }
}

// ---- interaction: pointer proximity only ---------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointermove', function (e) { pointer = toDesign(e); });
canvas.addEventListener('pointerdown', function (e) { pointer = toDesign(e); });
canvas.addEventListener('pointerleave', function () { pointer = null; });
canvas.addEventListener('pointercancel', function () { pointer = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; stepPhysics(TICK); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
