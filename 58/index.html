<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№58 · Pentagon Swarm</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b0b0e; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(245,242,233,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to swirl the swarm</div>
<script>
'use strict';
const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '58', 10) || 0;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
const ctx = canvas.getContext('2d');
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}
function smooth(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }

let swirl=0, swirlVel=0;
function polyPoints(cx,cy,R,rot,star){
  const pts=[];
  for(let k=0;k<5;k++){ const a=rot-Math.PI/2+k*Math.PI*2/5; pts.push([cx+R*Math.cos(a), cy+R*Math.sin(a)]); }
  if(!star) return pts;
  return [pts[0],pts[2],pts[4],pts[1],pts[3]];
}
function pathPoint(pts,s){
  // perimeter uniform by segment (all equal length within each shape approx)
  const seg=1/5; let idx=Math.min(4,Math.floor(s/seg)); let f=(s-idx*seg)/seg;
  const a=pts[idx], b=pts[(idx+1)%5];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f];
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#0b0b0e'; ctx.fillRect(0,0,w,h);
  swirl*=0.98;
  const total=10, t=(nowMs/1000)%total;
  const rot=(nowMs/1000)*(Math.PI*2/total)+swirl;
  const cx=w/2, cy=h/2, R=Math.min(w,h)*0.375;
  const pent=polyPoints(cx,cy,R,rot,false), star=polyPoints(cx,cy,R,rot,true);
  let mix=0, snap=false;
  if(t<4) mix=0; else if(t<5){ mix=smooth((t-4)/1); snap=true; } else if(t<9) mix=1; else { mix=1-smooth((t-9)/1); snap=true; }
  // edges
  ctx.strokeStyle='#1d5c59'; ctx.lineWidth=1; ctx.beginPath();
  const shape=[];
  for(let k=0;k<5;k++){ shape.push([pent[k][0]+(star[k][0]-pent[k][0])*0,0]); }
  // draw current interpolated closed path outline
  ctx.beginPath();
  for(let sI=0;sI<=100;sI++){
    const s=sI/100;
    const p1=pathPoint(pent,s), p2=pathPoint(star,s);
    const x=p1[0]+(p2[0]-p1[0])*mix, y=p1[1]+(p2[1]-p1[1])*mix;
    if(sI===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.stroke();
  if(snap){
    ctx.strokeStyle='#e83a8a'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,R*1.08,0,Math.PI*2); ctx.stroke();
  }
  const N=90;
  for(let i=0;i<N;i++){
    for(let g=6;g>=0;g--){
      const s=((nowMs/1000)*0.08 + i/N - g*0.007)%1; const ss=s<0?s+1:s;
      const p1=pathPoint(pent,ss), p2=pathPoint(star,ss);
      const x=p1[0]+(p2[0]-p1[0])*mix, y=p1[1]+(p2[1]-p1[1])*mix;
      if(g===0){ ctx.globalAlpha=1; ctx.fillStyle='#35e0d8'; ctx.fillRect(x-1.5,y-1.5,3,3); }
      else { ctx.globalAlpha=0.16; ctx.fillStyle='#35e0d8'; ctx.fillRect(x-1,y-1,2,2); }
    }
  }
  ctx.globalAlpha=1;
  return {};
}

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(2000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);

let lastA=null;
function angOf(ev){ const [w,h]=viewportWH(); return Math.atan2(ev.clientY-h/2, ev.clientX-w/2); }
canvas.addEventListener('pointerdown',ev=>{lastA=angOf(ev);});
canvas.addEventListener('pointermove',ev=>{ if(lastA===null) return; const a=angOf(ev); let d=a-lastA; if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; swirl+=d*1.5; lastA=a; });
function endDrag58(){ lastA=null; }
canvas.addEventListener('pointerup',endDrag58); canvas.addEventListener('pointercancel',endDrag58);

window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
