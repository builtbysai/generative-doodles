<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.299 Never Clock Off Wall</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#EDE6D6; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.299 Never Clock Off Wall (Ruby Waters).
// A gallery wall of five creature-clocks: puffer, octopus,
// tengu, boar and kokeshi-face, salon hung on a warm white
// wall, brass name plate below each. All five tell real time
// via Date, black hands over the painted faces, no numerals
// and no digital readout. Tap a clock: it springs up for a
// closer look, the others dim, and its face wakes with a
// three second happy wobble, then settles back. Every minute,
// on the minute, all five do a tiny synchronized tick-nod.
// DATA-ONLY: every mark is JS path data drawn each frame.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var WALL = '#EDE6D6', VERM = '#D23A2A', COBALT = '#2B5EA7', YELLOW = '#E8B93B',
    ORANGE = '#E8722A', INK = '#141414', CREAM = '#FBF3E4', BRASS = '#B08D3E';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 0, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }

// ---- the five creature-clocks (asserted) -------------------------
var CLOCKS = [
  { name: 'Puffer',  kind: 'puffer',  x: 262,  y: 258, r: 108 },
  { name: 'Tengu',   kind: 'tengu',   x: 640,  y: 238, r: 112 },
  { name: 'Boar',    kind: 'boar',    x: 1018, y: 268, r: 104 },
  { name: 'Octopus', kind: 'octopus', x: 432,  y: 602, r: 100 },
  { name: 'Kokeshi', kind: 'kokeshi', x: 852,  y: 592, r: 102 }
];
if (CLOCKS.length !== 5) throw new Error('Never Clock Off Wall needs exactly 5 clocks');
for (var ci = 0; ci < CLOCKS.length; ci++) {
  CLOCKS[ci].scale = 1; CLOCKS[ci].sv = 0; CLOCKS[ci].dim = 0;
}
var focused = -1, focusStart = 0, focusUntil = -1;
var lastMinuteKey = -1, nodStart = -10;

function stepSim() {
  T += TICK;
  if (focused >= 0 && T > focusUntil) focused = -1;
  for (var i = 0; i < CLOCKS.length; i++) {
    var c = CLOCKS[i];
    var sTarget = (i === focused) ? 1.34 : 1;
    c.sv += ((sTarget - c.scale) * 110 - c.sv * 13) * TICK;
    c.scale += c.sv * TICK;
    var dTarget = (focused >= 0 && i !== focused) ? 1 : 0;
    c.dim += (dTarget - c.dim) * Math.min(1, TICK * 7);
  }
}
function wakeEnv(i) {
  if (i !== focused) return 0;
  var p = clamp((T - focusStart) / 3, 0, 1);
  return Math.sin(p * Math.PI);
}

// ---- drawing helpers ----------------------------------------------
function circle(x, y, r, col) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = col; ctx.fill();
}
function ring(x, y, r, col, lw) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke();
}
function ell(x, y, rx, ry, col) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = col; ctx.fill();
}
function ellRing(x, y, rx, ry, col, lw) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke();
}
function line(x1, y1, x2, y2, col, lw) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke();
}
function drawTicks(fr) {
  ctx.strokeStyle = INK; ctx.lineCap = 'round';
  for (var i = 0; i < 12; i++) {
    var a = i / 12 * Math.PI * 2;
    var big = (i % 3 === 0);
    var r1 = fr * (big ? 0.82 : 0.87), r2 = fr * 0.96;
    ctx.lineWidth = big ? 5 : 3;
    ctx.beginPath();
    ctx.moveTo(Math.sin(a) * r1, -Math.cos(a) * r1);
    ctx.lineTo(Math.sin(a) * r2, -Math.cos(a) * r2);
    ctx.stroke();
  }
}
function drawHands(fr) {
  var d = new Date();
  var s = d.getSeconds() + d.getMilliseconds() / 1000;
  var m = d.getMinutes() + s / 60;
  var h = (d.getHours() % 12) + m / 60;
  var ha = h / 12 * Math.PI * 2, ma = m / 60 * Math.PI * 2, sa = s / 60 * Math.PI * 2;
  ctx.strokeStyle = INK; ctx.lineCap = 'round';
  ctx.lineWidth = fr * 0.10;
  ctx.beginPath(); ctx.moveTo(-Math.sin(ha) * fr * 0.10, Math.cos(ha) * fr * 0.10);
  ctx.lineTo(Math.sin(ha) * fr * 0.50, -Math.cos(ha) * fr * 0.50); ctx.stroke();
  ctx.lineWidth = fr * 0.07;
  ctx.beginPath(); ctx.moveTo(-Math.sin(ma) * fr * 0.12, Math.cos(ma) * fr * 0.12);
  ctx.lineTo(Math.sin(ma) * fr * 0.74, -Math.cos(ma) * fr * 0.74); ctx.stroke();
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-Math.sin(sa) * fr * 0.18, Math.cos(sa) * fr * 0.18);
  ctx.lineTo(Math.sin(sa) * fr * 0.80, -Math.cos(sa) * fr * 0.80); ctx.stroke();
  circle(0, 0, fr * 0.075, INK);
  circle(0, 0, fr * 0.028, BRASS);
}
function eyesPair(dx, dy, r, eyeS) {
  circle(-dx, dy, r * eyeS, INK);
  circle(dx, dy, r * eyeS, INK);
}

// ---- the five faces -------------------------------------------------
function drawPuffer(c, eyeS) {
  var r = c.r, i, a;
  // side fins
  ell(-r * 1.02, r * 0.18, r * 0.20, r * 0.11, ORANGE);
  ellRing(-r * 1.02, r * 0.18, r * 0.20, r * 0.11, INK, 3.5);
  ell(r * 1.02, r * 0.18, r * 0.20, r * 0.11, ORANGE);
  ellRing(r * 1.02, r * 0.18, r * 0.20, r * 0.11, INK, 3.5);
  // spikes
  ctx.fillStyle = YELLOW; ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineJoin = 'round';
  for (i = 0; i < 18; i++) {
    a = i / 18 * Math.PI * 2;
    var bx = Math.cos(a) * r * 0.94, by = Math.sin(a) * r * 0.94;
    var px = Math.cos(a - 0.13) * r * 0.90, py = Math.sin(a - 0.13) * r * 0.90;
    var qx = Math.cos(a + 0.13) * r * 0.90, qy = Math.sin(a + 0.13) * r * 0.90;
    var tx = Math.cos(a) * r * 1.14, ty = Math.sin(a) * r * 1.14;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(tx, ty); ctx.lineTo(qx, qy); ctx.closePath();
    ctx.fill(); ctx.stroke();
    void bx; void by;
  }
  // body
  circle(0, 0, r, YELLOW); ring(0, 0, r, INK, 5);
  // spots on the yellow ring
  var spots = [[0.85, -0.35], [0.92, 0.28], [-0.88, -0.28], [-0.80, 0.45], [0.35, -0.90], [-0.30, -0.92], [0.10, 0.94]];
  for (i = 0; i < spots.length; i++) circle(spots[i][0] * r, spots[i][1] * r, r * 0.05, INK);
  // belly face
  var fr = r * 0.70;
  circle(0, 0, fr, CREAM); ring(0, 0, fr, INK, 3.5);
  drawTicks(fr);
  eyesPair(r * 0.27, -r * 0.24, r * 0.055, eyeS);
  ctx.beginPath(); ctx.arc(0, r * 0.40, r * 0.07, 0, Math.PI * 2);
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
  drawHands(fr);
}
function drawTengu(c, eyeS) {
  var r = c.r;
  circle(0, -r * 1.08, r * 0.17, INK); // topknot
  circle(0, 0, r, VERM); ring(0, 0, r, INK, 5);
  // black hair cap
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = INK;
  ctx.fillRect(-r, -r, r * 2, r * 0.30);
  circle(0, -r * 0.95, r * 0.55, INK);
  // yellow flecks on the rim
  circle(-r * 0.88, r * 0.30, r * 0.045, YELLOW);
  circle(r * 0.88, r * 0.30, r * 0.045, YELLOW);
  circle(-r * 0.70, r * 0.68, r * 0.045, YELLOW);
  circle(r * 0.70, r * 0.68, r * 0.045, YELLOW);
  ctx.restore();
  drawTicks(r * 0.97);
  // long nose, behind the hands
  ell(0, r * 0.26, r * 0.15, r * 0.40, ORANGE);
  ellRing(0, r * 0.26, r * 0.15, r * 0.40, INK, 3.5);
  circle(0, r * 0.60, r * 0.05, INK);
  // cream eyes with angry brows
  ell(-r * 0.33, -r * 0.22, r * 0.14, r * 0.11 * eyeS + r * 0.03, CREAM);
  ellRing(-r * 0.33, -r * 0.22, r * 0.14, r * 0.11 * eyeS + r * 0.03, INK, 3);
  ell(r * 0.33, -r * 0.22, r * 0.14, r * 0.11 * eyeS + r * 0.03, CREAM);
  ellRing(r * 0.33, -r * 0.22, r * 0.14, r * 0.11 * eyeS + r * 0.03, INK, 3);
  circle(-r * 0.33, -r * 0.21, r * 0.05 * eyeS, INK);
  circle(r * 0.33, -r * 0.21, r * 0.05 * eyeS, INK);
  line(-r * 0.50, -r * 0.44, -r * 0.16, -r * 0.34, INK, 6);
  line(r * 0.50, -r * 0.44, r * 0.16, -r * 0.34, INK, 6);
  drawHands(r * 0.90);
}
function drawBoar(c, eyeS) {
  var r = c.r, i, a;
  // ears
  ctx.fillStyle = ORANGE; ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.lineJoin = 'round';
  var ears = [[-0.72, -0.78, -0.98, -1.12, -0.38, -0.98], [0.72, -0.78, 0.98, -1.12, 0.38, -0.98]];
  for (i = 0; i < 2; i++) {
    var e = ears[i];
    ctx.beginPath();
    ctx.moveTo(e[0] * r, e[1] * r); ctx.lineTo(e[2] * r, e[3] * r); ctx.lineTo(e[4] * r, e[5] * r);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // head
  ctx.beginPath(); ctx.ellipse(0, 0, r * 1.04, r * 0.94, 0, 0, Math.PI * 2);
  ctx.fillStyle = ORANGE; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
  // bristles along the top
  ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (i = 0; i < 7; i++) {
    a = Math.PI * (1.15 + i * 0.117);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.92, Math.sin(a) * r * 0.86);
    ctx.lineTo(Math.cos(a) * r * 1.06, Math.sin(a) * r * 1.00);
    ctx.stroke();
  }
  // dark arcs on the orange ring
  ctx.beginPath(); ctx.arc(0, 0, r * 0.86, Math.PI * 0.72, Math.PI * 0.92); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.86, Math.PI * 0.08, Math.PI * 0.28); ctx.stroke();
  // face disc
  var fr = r * 0.76;
  circle(0, 0, fr, CREAM); ring(0, 0, fr, INK, 3.5);
  drawTicks(fr);
  eyesPair(r * 0.30, -r * 0.34, r * 0.055, eyeS);
  // snout below the pivot
  ell(0, r * 0.30, r * 0.34, r * 0.25, YELLOW);
  ellRing(0, r * 0.30, r * 0.34, r * 0.25, INK, 3.5);
  circle(-r * 0.13, r * 0.30, r * 0.045, INK);
  circle(r * 0.13, r * 0.30, r * 0.045, INK);
  // tusks up from under the snout
  ctx.fillStyle = CREAM; ctx.strokeStyle = INK; ctx.lineWidth = 3;
  var tusks = [[-1, -0.40, 0.48, -0.24, 0.62, -0.44, 0.62], [1, 0.40, 0.48, 0.24, 0.62, 0.44, 0.62]];
  for (i = 0; i < 2; i++) {
    var t = tusks[i];
    ctx.beginPath();
    ctx.moveTo(t[1] * r, t[2] * r); ctx.lineTo(t[3] * r, t[4] * r); ctx.lineTo(t[5] * r, t[6] * r);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  drawHands(fr);
}
function drawOctopus(c, eyeS) {
  var r = c.r, i, a;
  // tentacles: thick wavy strokes around the lower half
  ctx.strokeStyle = COBALT; ctx.lineCap = 'round';
  for (i = 0; i < 7; i++) {
    a = Math.PI * (0.08 + i * 0.14);
    var sx = Math.cos(a) * r * 0.62, sy = Math.sin(a) * r * 0.62;
    var mx = Math.cos(a) * r * 1.22, my = Math.sin(a) * r * 1.22;
    var ex = Math.cos(a + 0.38) * r * 1.08, ey = Math.sin(a + 0.38) * r * 1.26;
    ctx.lineWidth = r * 0.20;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(mx, my, ex, ey); ctx.stroke();
    ctx.lineWidth = 3.5; ctx.strokeStyle = INK;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(mx, my, ex, ey); ctx.stroke();
    ctx.strokeStyle = COBALT;
    circle(ex, ey, r * 0.045, CREAM);
  }
  // head
  circle(0, 0, r * 0.96, COBALT); ring(0, 0, r * 0.96, INK, 5);
  circle(-r * 0.45, -r * 0.62, r * 0.06, YELLOW);
  circle(r * 0.20, -r * 0.78, r * 0.05, YELLOW);
  circle(r * 0.62, -r * 0.48, r * 0.055, YELLOW);
  // face
  var fr = r * 0.62;
  ctx.beginPath(); ctx.ellipse(0, r * 0.06, fr, fr * 0.94, 0, 0, Math.PI * 2);
  ctx.fillStyle = CREAM; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.stroke();
  ctx.save();
  ctx.beginPath(); ctx.ellipse(0, r * 0.06, fr, fr * 0.94, 0, 0, Math.PI * 2); ctx.clip();
  ctx.translate(0, r * 0.06);
  drawTicks(fr);
  ctx.restore();
  ctx.save();
  ctx.translate(0, r * 0.06);
  eyesPair(r * 0.24, -r * 0.18, r * 0.055, eyeS);
  ctx.beginPath(); ctx.arc(0, r * 0.22, r * 0.10, Math.PI * 0.15, Math.PI * 0.85);
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.stroke();
  drawHands(fr);
  ctx.restore();
}
function drawKokeshi(c, eyeS) {
  var r = c.r;
  // body below the head
  ctx.beginPath();
  ctx.moveTo(-r * 0.34, r * 0.42); ctx.lineTo(r * 0.34, r * 0.42);
  ctx.lineTo(r * 0.48, r * 1.04); ctx.lineTo(-r * 0.48, r * 1.04);
  ctx.closePath();
  ctx.fillStyle = COBALT; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.stroke();
  ctx.fillStyle = VERM;
  ctx.fillRect(-r * 0.415, r * 0.66, r * 0.83, r * 0.16);
  line(-r * 0.415, r * 0.66, r * 0.415, r * 0.66, INK, 3);
  line(-r * 0.45, r * 0.82, r * 0.45, r * 0.82, INK, 3);
  circle(0, r * 0.92, r * 0.05, YELLOW);
  circle(-r * 0.22, r * 0.92, r * 0.04, CREAM);
  circle(r * 0.22, r * 0.92, r * 0.04, CREAM);
  // bob: black shell behind the face
  circle(0, -r * 0.20, r * 0.90, INK);
  // face
  var fr = r * 0.76, fy = -r * 0.10;
  circle(0, fy, fr, CREAM); ring(0, fy, fr, INK, 3.5);
  ctx.save();
  ctx.beginPath(); ctx.arc(0, fy, fr, 0, Math.PI * 2); ctx.clip();
  // fringe and side locks
  circle(0, fy - fr * 1.02, fr * 0.72, INK);
  circle(-fr * 0.96, fy + fr * 0.30, fr * 0.30, INK);
  circle(fr * 0.96, fy + fr * 0.30, fr * 0.30, INK);
  ctx.translate(0, fy);
  drawTicks(fr);
  ctx.restore();
  // flower in the hair
  circle(r * 0.46, -r * 0.66, r * 0.10, VERM);
  circle(r * 0.46, -r * 0.66, r * 0.045, YELLOW);
  ctx.save();
  ctx.translate(0, fy);
  eyesPair(r * 0.26, -r * 0.02, r * 0.052, eyeS);
  // cheeks and lips
  ctx.globalAlpha = 0.55;
  circle(-r * 0.38, r * 0.20, r * 0.075, VERM);
  circle(r * 0.38, r * 0.20, r * 0.075, VERM);
  ctx.globalAlpha = 1;
  ell(0, r * 0.30, r * 0.075, r * 0.045, VERM);
  drawHands(fr);
  ctx.restore();
}
var DRAWERS = { puffer: drawPuffer, tengu: drawTengu, boar: drawBoar, octopus: drawOctopus, kokeshi: drawKokeshi };

function drawPlate(c) {
  var pw = 124, ph = 27, py = c.r * 1.34;
  ctx.fillStyle = BRASS;
  ctx.fillRect(-pw / 2, py, pw, ph);
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.strokeRect(-pw / 2, py, pw, ph);
  circle(-pw / 2 + 8, py + ph / 2, 2.2, INK);
  circle(pw / 2 - 8, py + ph / 2, 2.2, INK);
  ctx.fillStyle = INK;
  ctx.font = '600 15px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(c.name, 0, py + ph / 2 + 1);
}
function draw() {
  ctx.fillStyle = WALL;
  ctx.fillRect(-OX / S - 10, -OY / S - 10, W / S + 20, H / S + 20);
  // minute tick-nod state, read from real time
  var nowD = new Date();
  var mKey = nowD.getHours() * 60 + nowD.getMinutes();
  if (lastMinuteKey >= 0 && mKey !== lastMinuteKey) nodStart = T;
  lastMinuteKey = mKey;
  var nodP = (T - nodStart) / 0.7;
  var nodY = (nodP >= 0 && nodP < 1) ? Math.sin(nodP * Math.PI) * 6 : 0;
  for (var i = 0; i < CLOCKS.length; i++) {
    var c = CLOCKS[i];
    var env = wakeEnv(i);
    var rot = env * Math.sin((T - focusStart) * 16) * 0.055;
    ctx.save();
    ctx.globalAlpha = 1 - c.dim * 0.55;
    ctx.translate(c.x, c.y + nodY);
    // hanger nail
    circle(0, -c.r * 1.52, 4, INK);
    ctx.save();
    ctx.scale(c.scale, c.scale);
    ctx.rotate(rot);
    line(0, -c.r * 1.50, 0, -c.r * 1.22, INK, 2.5);
    DRAWERS[c.kind](c, 1 + env * 0.65);
    drawPlate(c);
    ctx.restore();
    ctx.restore();
  }
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
  void phone;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  var best = -1, bestD = 1e9;
  for (var i = 0; i < CLOCKS.length; i++) {
    var c = CLOCKS[i];
    var dx = p[0] - c.x, dy = p[1] - c.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < c.r * 1.30 * c.scale && d < bestD) { best = i; bestD = d; }
  }
  if (best >= 0) {
    focused = best; focusStart = T; focusUntil = T + 3;
    CLOCKS[best].sv += 3.2; // spring kick: the jump down
  }
});

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = WALL;
  ctx.fillRect(0, 0, W, H);
  // centred fit: salon wall keeps its shape on every screen
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { stepSim(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
