<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Colors Only Where They Touch</title>
<style>
html, body { margin: 0; padding: 0; background: #E83A2A; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var VERMILION = [232, 58, 42];
var TEAL = [30, 78, 78];
var PINK = [232, 154, 168];
var WHITE = [245, 242, 234];
var PHASE = 0.0;
var TWEEN_S = 2.0;
var SEED0 = 1606919;
var COLS = 4, ROWS = 5, N = 20;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function easeInOutCubic(p) {
  return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH) * 0.96;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function gridRect(comp) {
  return { x: comp.x + 0.08 * comp.w, y: comp.y + 0.10 * comp.h, w: 0.84 * comp.w, h: 0.76 * comp.h };
}
function genColors(seed) {
  var rng = mulberry32(seed);
  var bag = [];
  var i, j, tmp;
  for (i = 0; i < 7; i++) bag.push(TEAL);
  for (i = 0; i < 7; i++) bag.push(PINK);
  for (i = 0; i < 6; i++) bag.push(WHITE);
  for (i = bag.length - 1; i > 0; i--) {
    j = Math.floor(rng() * (i + 1));
    tmp = bag[i]; bag[i] = bag[j]; bag[j] = tmp;
  }
  return bag;
}
function genLayout(seed) {
  var rng = mulberry32(seed);
  var out = [];
  var i, r, c;
  for (i = 0; i < N; i++) {
    r = Math.floor(i / COLS); c = i % COLS;
    var gx = (c + 0.5) / COLS + ((rng() - 0.5) * 2 * 0.22) / COLS;
    var gy = (r + 0.5) / ROWS + ((rng() - 0.5) * 2 * 0.18) / ROWS;
    var gw = 0.74 + rng() * 0.12;
    var gh = 0.88 + rng() * 0.14;
    out.push({ gx: gx, gy: gy, gw: gw, gh: gh });
  }
  return out;
}
function lerpGeo(a, b, p) {
  var out = [];
  for (var i = 0; i < N; i++) {
    out.push({
      gx: a[i].gx + (b[i].gx - a[i].gx) * p,
      gy: a[i].gy + (b[i].gy - a[i].gy) * p,
      gw: a[i].gw + (b[i].gw - a[i].gw) * p,
      gh: a[i].gh + (b[i].gh - a[i].gh) * p
    });
  }
  return out;
}
var colors = genColors(SEED0);
var toGeo = genLayout(SEED0);
var fromGeo = null;
var tweenStart = -10;
var dealCount = 0;
function currentGeo(t) {
  if (fromGeo && t < tweenStart + TWEEN_S) {
    var p = easeInOutCubic(clamp((t - tweenStart) / TWEEN_S, 0, 1));
    return lerpGeo(fromGeo, toGeo, p);
  }
  return toGeo;
}
function deal(t) {
  fromGeo = currentGeo(t);
  dealCount++;
  toGeo = genLayout(SEED0 + dealCount * 7919);
  tweenStart = t;
  if (reduced) fromGeo = null;
}
function rrPath(cx, cy, w, h, r) {
  var x = cx - w / 2, y = cy - h / 2;
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function draw(t) {
  lastT = t;
  size();
  var comp = compRect();
  var g = gridRect(comp);
  var cellW = g.w / COLS, cellH = g.h / ROWS;
  var geo = currentGeo(t);
  var i;
  ctx.globalCompositeOperation = 'multiply';
  for (i = 0; i < N; i++) {
    var s = geo[i];
    var cx = g.x + s.gx * g.w;
    var cy = g.y + s.gy * g.h;
    var w = s.gw * cellW, h = s.gh * cellH;
    ctx.fillStyle = rgb(colors[i]);
    rrPath(cx, cy, w, h, Math.min(w, h) * 0.18);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'destination-over';
  ctx.fillStyle = rgb(VERMILION);
  ctx.fillRect(0, 0, VW, VH);
  ctx.globalCompositeOperation = 'source-over';
  var titlePx = isPhone ? 15 : 17;
  var smallPx = isPhone ? 11 : 12;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = rgba(WHITE, 0.92);
  ctx.fillText('New Colors Only Where They Touch', comp.x + comp.w / 2, comp.y + Math.max(6, 0.012 * comp.h));
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(WHITE, 0.62);
  ctx.fillText('2006 · 05 · 29', comp.x + comp.w / 2, comp.y + Math.max(6, 0.012 * comp.h) + titlePx + 5);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(WHITE, 0.78);
  ctx.fillText('Tap to deal a new layout.', comp.x + comp.w / 2, comp.y + comp.h - smallPx - 10);
}
var pDown = null;
canvas.addEventListener('pointerdown', function (e) {
  pDown = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointerup', function (e) {
  if (!pDown) return;
  var dx = e.clientX - pDown.x, dy = e.clientY - pDown.y;
  if (Math.sqrt(dx * dx + dy * dy) < 12) deal(lastT);
  pDown = null;
});
canvas.addEventListener('pointercancel', function () { pDown = null; });
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
if (typeof window !== 'undefined') {
  window.__ny1599 = {
    draw: draw, deal: deal, genLayout: genLayout, genColors: genColors,
    colors: colors,
    getGeo: function (t) { return currentGeo(t); },
    getToGeo: function () { return toGeo; }
  };
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
