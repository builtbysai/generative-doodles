<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№83 · Interference Bloom</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#060809; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(255,248,236,0.6); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to move the bloom</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function smooth(x){ x=clamp(x,0,1); return x*x*(3-2*x); }
function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mixc(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function css(c){ return 'rgb('+Math.round(clamp(c[0],0,255))+','+Math.round(clamp(c[1],0,255))+','+Math.round(clamp(c[2],0,255))+')'; }
function cosPal(v, cols){ const x=((v%1)+1)%1; const seg=x* (cols.length-1); const i=Math.min(cols.length-2, Math.floor(seg)); return mixc(cols[i], cols[i+1], seg-i); }

// No.83 Interference Bloom: exactly 2 wave systems, loop 20s
const WAVES=2;
const BG=hexRGB('#060809'), EMB=hexRGB('#FF7A2F'), TEA=hexRGB('#2FD8C0'), BLOOM=hexRGB('#FFF8EC');
let cxo=0, cyo=0, dragging=false;
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h); const t=nowMs/1000;
  ctx.fillStyle='#060809'; ctx.fillRect(0,0,w,h);
  const cell=isPhone()?9:11, cols=Math.ceil(w/cell), rows=Math.ceil(h/cell);
  const breath=0.5-0.5*Math.cos(2*Math.PI*t/20);
  const cyOff=isPhone()? -0.12:0;
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
    let u=((i+0.5)*cell-w/2)/(Math.min(w,h)/2)-cxo, v=((j+0.5)*cell-h/2)/(Math.min(w,h)/2)-cyo+cyOff;
    const w1=Math.sin((u*3.1+v*1.2)*1.05 + 2*Math.PI*t/20*2);
    const w2=Math.sin((u*-1.4+v*3.4)*0.95 - 2*Math.PI*t/20*1.4);
    const prod=w1*w2;
    const fringe=smooth((Math.abs(prod)-0.15)/0.7);
    const r=Math.hypot(u,v);
    const mask=Math.max(0,1-smooth((r-(0.55+0.55*breath))/0.55));
    let col=mixc(BG, prod>=0? EMB:TEA, fringe*mask);
    if(prod>0.82) col=mixc(col,BLOOM, (prod-0.82)/0.18*mask*0.85);
    ctx.fillStyle=css(col); ctx.fillRect(i*cell,j*cell,cell+1,cell+1);
  }
  if(WAVES!==2) console.assert(false,'waves',WAVES);
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; const [w,h]=viewportWH(); cxo=(e.clientX-w/2)/(Math.min(w,h)/2)*0.6; cyo=(e.clientY-h/2)/(Math.min(w,h)/2)*0.6; });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; const [w,h]=viewportWH(); cxo=(e.clientX-w/2)/(Math.min(w,h)/2)*0.6; cyo=(e.clientY-h/2)/(Math.min(w,h)/2)*0.6; });
function endP(){ dragging=false; cxo=0; cyo=0; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(6000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
