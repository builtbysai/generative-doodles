<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#020305">
<title>Long exposure &mdash; Generative Doodle No.826</title>
<style>
  html, body { margin: 0; height: 100%; background: #020305; overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
// Long exposure &mdash; Generative Doodle No.9151
// Extracted from the IK Arthropods background ideas (No.9109) test bench Hans saved. Background only:
// no creatures. Drag (or move the mouse) to paint light. The plate fades slowly.
// <!-- long-exposure-9151 -->
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => Math.random() * (b - a) + a;
const mulberry32 = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const hex = c => [parseInt(c.slice(1, 3), 16) / 255, parseInt(c.slice(3, 5), 16) / 255, parseInt(c.slice(5, 7), 16) / 255];
const hashN = (x, y) => { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967295; };
const vnoise = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf); return lerp(lerp(hashN(xi, yi), hashN(xi + 1, yi), u), lerp(hashN(xi, yi + 1), hashN(xi + 1, yi + 1), u), v); };
const fbm = (x, y) => (vnoise(x, y) * .5 + vnoise(x * 2, y * 2) * .25 + vnoise(x * 4, y * 4) * .125 + vnoise(x * 8, y * 8) * .0625) / .9375;
class Layer {
  constructor(w) { this.w = w; this.c = document.createElement('canvas'); this.resize(); }
  resize() { const w = this.w; this.c.width = w.canvas.width; this.c.height = w.canvas.height; this.x = this.c.getContext('2d'); this.x.setTransform(w.dpr, 0, 0, w.dpr, 0, 0); }
  fade(a) { const x = this.x; x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'destination-out'; x.fillStyle = `rgba(0,0,0,${a})`; x.fillRect(0, 0, this.c.width, this.c.height); x.restore(); }
  clear() { this.x.save(); this.x.setTransform(1, 0, 0, 1, 0, 0); this.x.clearRect(0, 0, this.c.width, this.c.height); this.x.restore(); }
  blit(ctx, alpha = 1, mode = 'source-over') { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = alpha; ctx.globalCompositeOperation = mode; ctx.drawImage(this.c, 0, 0); ctx.restore(); }
}
class FieldImage {
  constructor(gw, gh) { this.c = document.createElement('canvas'); this.c.width = gw; this.c.height = gh; this.x = this.c.getContext('2d'); this.img = this.x.createImageData(gw, gh); this.d = this.img.data; for (let i = 3; i < this.d.length; i += 4) this.d[i] = 255; }
  blit(ctx, w) { this.x.putImageData(this.img, 0, 0); ctx.imageSmoothingEnabled = true; ctx.drawImage(this.c, 0, 0, w.width, w.height); }
}
function glowSprite(rgb, size = 64) {
  const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d'), g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0, `rgba(${rgb},1)`); g.addColorStop(.25, `rgba(${rgb},.45)`); g.addColorStop(1, `rgba(${rgb},0)`); x.fillStyle = g; x.fillRect(0, 0, size, size); return c;
}
const bgFill = (ctx, w, c1, c2) => { const g = ctx.createLinearGradient(0, 0, 0, w.height); g.addColorStop(0, c1); g.addColorStop(1, c2 || c1); ctx.fillStyle = g; ctx.fillRect(0, 0, w.width, w.height); };
class Backdrop {
  constructor(world) { this.w = world; }
  resize() {}
  update() {}
  draw(ctx) { ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, this.w.width, this.w.height); }
  drawTop() {}
  onFootfall() {}
  onScare() {}
}
class ExposureBackdrop extends Backdrop {
  static title = 'Long exposure';
  static blurb = 'A light painting. Spines and feet trace glowing paths that build up over time. Press C to wipe the plate.';
  constructor(w) { super(w); this.plate = new Layer(w); this.n = 0; }
  resize() { this.plate.resize(); }
  onFootfall(c, leg) { const g = this.plate.x; g.globalCompositeOperation = 'lighter'; g.fillStyle = c.g.accent; g.globalAlpha = .45; g.beginPath(); g.arc(leg.footX, leg.footY, 1.5, 0, TAU); g.fill(); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
  update() {
    const g = this.plate.x; g.globalCompositeOperation = 'lighter'; g.lineCap = 'round'; g.lineJoin = 'round';
    for (const c of this.w.creatures) {
      g.beginPath(); c.segments.forEach((s, i) => i ? g.lineTo(s.x, s.y) : g.moveTo(s.x, s.y)); g.strokeStyle = c.g.primary; g.globalAlpha = .06; g.lineWidth = 2; g.stroke();
      const h = c.head; g.fillStyle = c.g.accent; g.globalAlpha = .12; g.beginPath(); g.arc(h.x, h.y, 2.2, 0, TAU); g.fill();
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; if (++this.n % 20 === 0) this.plate.fade(.012);
  }
  draw(ctx) { ctx.fillStyle = '#020305'; ctx.fillRect(0, 0, this.w.width, this.w.height); this.plate.blit(ctx); }
  clear() { this.plate.clear(); }
}
// ---- exciter helpers: a stand-in footstep, no creature attached ----
const PALETTE = ['#3dffc8', '#ff9eff', '#ff7a33', '#eeff44', '#38d6ff'];
let palI = 0;
function fakeStep(x, y, angle) {
  const accent = PALETTE[palI++ % PALETTE.length];
  return { c: { g: { accent, primary: '#c982ff', size: 1 }, segments: [{ angle: angle || 0 }] }, leg: { footX: x, footY: y, segIndex: 0 } };
}
function footstep(x, y, angle) { const f = fakeStep(x, y, angle); backdrop.onFootfall(f.c, f.leg); }
let lastExcite = 0;
function throttled(ms) { const now = world.t; if (now - lastExcite < ms) return false; lastExcite = now; return true; }

let px = -1, py = -1;
const EXP_PRIMARY = '#c982ff', EXP_ACCENT = '#ff9eff';
function paintTo(x, y) {
  const g = backdrop.plate.x;
  g.globalCompositeOperation = 'lighter'; g.lineCap = 'round'; g.lineJoin = 'round';
  if (px >= 0) { g.beginPath(); g.moveTo(px, py); g.lineTo(x, y); g.strokeStyle = EXP_PRIMARY; g.globalAlpha = .06; g.lineWidth = 2; g.stroke(); }
  g.fillStyle = EXP_ACCENT; g.globalAlpha = .12; g.beginPath(); g.arc(x, y, 2.2, 0, TAU); g.fill();
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  px = x; py = y;
}
// ---- autonomous exciter: the plate paints itself, so the piece is alive on load ----
// The bench's exciter was a stub and there are no creatures, so with no pointer
// the plate stayed empty. A slow noise-driven light wanders the canvas and paints
// the same strokes the pointer would. It keeps its own last point (ax, ay) so it
// never draws a stray line to the visitor's pointer position.
let ax = -1, ay = -1;
const excRnd = mulberry32((Math.random() * 1e9) | 0);
const exPhase = excRnd() * Math.PI * 2, eyPhase = excRnd() * Math.PI * 2;
function exciterStep() {
  const t = world.t / 1000;
  const nx = fbm(t * 0.05 + exPhase, 3.7) - 0.5, ny = fbm(9.1, t * 0.05 + eyPhase) - 0.5;
  const x = world.width * (0.5 + 0.42 * Math.sin(t * 0.11 + exPhase) + 0.18 * nx);
  const y = world.height * (0.5 + 0.42 * Math.cos(t * 0.083 + eyPhase) + 0.18 * ny);
  const g = backdrop.plate.x;
  g.globalCompositeOperation = 'lighter'; g.lineCap = 'round'; g.lineJoin = 'round';
  if (ax >= 0) { g.beginPath(); g.moveTo(ax, ay); g.lineTo(x, y); g.strokeStyle = EXP_PRIMARY; g.globalAlpha = .06; g.lineWidth = 2; g.stroke(); }
  g.fillStyle = EXP_ACCENT; g.globalAlpha = .12; g.beginPath(); g.arc(x, y, 2.2, 0, TAU); g.fill();
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  ax = x; ay = y;
}
function onPointerMove(e) { if (world.pointer.down || e.pointerType === 'mouse') paintTo(world.pointer.x, world.pointer.y); }
function onPointerDown(e) { px = -1; paintTo(world.pointer.x, world.pointer.y); }
function onPointerUp(e) { px = -1; py = -1; }

// ---- world shim: what the backdrop expects, with no creatures ----
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const world = { canvas: cv, ctx, width: 0, height: 0, dpr: 1, t: 0, creatures: [], view: { grid: true }, ripples: [], pointer: { x: 0, y: 0, active: false, down: false }, predator: null };
const backdrop = new ExposureBackdrop(world);
function resize() {
  world.dpr = Math.min(devicePixelRatio || 1, 2);
  world.width = innerWidth; world.height = innerHeight;
  cv.width = Math.round(world.width * world.dpr); cv.height = Math.round(world.height * world.dpr);
  ctx.setTransform(world.dpr, 0, 0, world.dpr, 0, 0);
  backdrop.resize();
}
addEventListener('resize', resize);
resize();

// ---- pointer ----
cv.addEventListener('pointermove', e => { const p = world.pointer; p.x = e.clientX; p.y = e.clientY; p.active = true; onPointerMove(e); });
cv.addEventListener('pointerdown', e => { const p = world.pointer; p.x = e.clientX; p.y = e.clientY; p.active = true; p.down = true; onPointerDown(e); });
addEventListener('pointerup', e => { world.pointer.down = false; onPointerUp(e); });
addEventListener('pointercancel', () => { world.pointer.down = false; });
cv.addEventListener('pointerleave', () => { if (!world.pointer.down) { world.pointer.active = false; world.predator = null; } });

// ---- loop (fixed 16.667 ms steps, as in the bench) ----
let last = 0, acc = 0;
function step() {
  world.t += 16.667;
  backdrop.update();
  exciterStep();
  for (let i = world.ripples.length - 1; i >= 0; i--) { const r = world.ripples[i]; r.r += (r.max - r.r) * .12; r.a -= .026; if (r.a < .02) world.ripples.splice(i, 1); }
}
function loop(ts) {
  const dt = Math.min(ts - last, 60); last = ts;
  acc += dt; let n = 0;
  while (acc >= 16.667 && n++ < 5) { acc -= 16.667; step(); }
  if (n >= 5) acc = 0;
  ctx.globalAlpha = 1;
  backdrop.draw(ctx, world.t);
  ctx.globalAlpha = 1;
  backdrop.drawTop(ctx, world.t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(ts => { last = ts; loop(ts); });

</script>
</body>
</html>
