<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glitch-Alike Lab</title>
<style>
  html, body { margin:0; padding:0; background:#060606; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function(){
'use strict';

// ---------- seeded determinism: mulberry32 + integer hash ----------
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; var t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
var rng = mulberry32(1167008);
var SEED_JITTER = rng(); // consumes the stream once; all per-frame values come from h2
function h2(a,b){ var x=(Math.imul((a|0)+1,374761393)+Math.imul((b|0)+1,668265263))^0x5bf03635; x=Math.imul(x^(x>>>13),1274126177); return ((x^(x>>>16))>>>0)/4294967296; }

// ---------- palette ----------
// idx: 0 bg, 1 pink, 2 cyan, 3 yellow, 4 blue, 5 dark violet, 6 dark amber
var PAL = [
  [10,10,10], [255,46,110], [0,255,194], [255,225,77],
  [61,90,254], [30,12,52], [52,30,12]
];
function rgbStr(col){ return 'rgb('+col[0]+','+col[1]+','+col[2]+')'; }
var PAL_STR = PAL.map(rgbStr);
var HALO_STR = PAL.map(function(col){
  return rgbStr([ Math.round(col[0]+(255-col[0])*0.5), Math.round(col[1]+(255-col[1])*0.5), Math.round(col[2]+(255-col[2])*0.5) ]);
});

// ---------- the source image, as a function (flat geometric) ----------
function pointInTri(u,v, ax,ay, bx,by, cx,cy){
  var d=(by-cy)*(ax-cx)+(cx-bx)*(ay-cy);
  var a=((by-cy)*(u-cx)+(cx-bx)*(v-cy))/d;
  var b=((cy-ay)*(u-cx)+(ax-cx)*(v-cy))/d;
  var c=1-a-b;
  return a>=0 && b>=0 && c>=0;
}
function srcIdx(c, r, COLS, ROWS){
  var u=(c+0.5)/COLS, v=(r+0.5)/ROWS;
  var idx=0;
  if (v>0.60 && v<0.72 && u>0.08 && u<0.94) idx=2;                    // horizontal bar, cyan
  if (u>0.60 && u<0.70 && v>0.08 && v<0.92) idx=2;                    // vertical bar, cyan
  if (u>0.08 && u<0.20 && v>0.10 && v<0.22) idx=3;                    // small square, yellow
  if (pointInTri(u,v, 0.80,0.16, 0.97,0.52, 0.63,0.52)) idx=3;       // triangle, yellow
  var dx=(u-0.30)*COLS, dy=(v-0.36)*ROWS;                            // circle, pink
  var rad=0.21*COLS;
  if (dx*dx+dy*dy < rad*rad) idx=1;
  return idx;
}
function srcRGBat(c, r, COLS, ROWS){
  c=((c%COLS)+COLS)%COLS;
  if (r<0) r=0; if (r>ROWS-1) r=ROWS-1;
  return PAL[srcIdx(c, r, COLS, ROWS)];
}

// ---------- loop / envelopes ----------
var LOOP=16, T0=9;
function baseEnv(k, lt){
  if (lt>=15.5) return 0;
  var start=k*2;                                  // stagger: 0s, 2s, 4s, 6s
  if (lt<start) return 0;
  if (lt<start+3){ var dt=lt-start; return Math.min(1,(Math.floor(dt/0.6)+1)*0.2); }  // stepped ramp, full by +3s
  return 1;
}
function panelEnv(k, lt, centerX, compX, compW){
  var e=baseEnv(k, lt);
  if (lt>=14.5 && lt<15.5){                        // reset wipe sweeps the grid
    var wx=compX+((lt-14.5)/1.0)*compW;
    if (centerX<wx) e=0;
  }
  return e;
}

// ---------- panel corruption languages (all sampled as data) ----------
// (1) PROMPTED: smoothed / melted. Neighbourhood blend computed in the data, no filter.
function cfPrompted(c, r, env, t, COLS, ROWS){
  var u=(c+0.5)/COLS, v=(r+0.5)/ROWS;
  var br=1+0.03*env*Math.sin(t*0.9);
  u=0.5+(u-0.5)*br+0.012*env*Math.sin(t*0.55);
  v=0.5+(v-0.5)*br+0.008*env*Math.cos(t*0.7);
  var ru=0.004+env*0.030, rv=ru*COLS/ROWS;
  var cu=u*COLS-0.5, cv=v*ROWS-0.5, du=ru*COLS, dv=rv*ROWS;
  var offs=[[0,0,2],[du,0,1],[-du,0,1],[0,dv,1],[0,-dv,1]];
  var R=0,G=0,B=0,W=0,i,cc,rr,col,w;
  for (i=0;i<offs.length;i++){
    cc=Math.round(cu+offs[i][0]); rr=Math.round(cv+offs[i][1]);
    if (cc<0) cc=0; if (cc>COLS-1) cc=COLS-1;
    if (rr<0) rr=0; if (rr>ROWS-1) rr=ROWS-1;
    col=PAL[srcIdx(cc,rr,COLS,ROWS)]; w=offs[i][2];
    R+=col[0]*w; G+=col[1]*w; B+=col[2]*w; W+=w;
  }
  function q(x){ var n=Math.round((x/W)/6)*6; return n>255?255:n; }
  return 'rgb('+q(R)+','+q(G)+','+q(B)+')';
}
// (2) DATABEND: per-row tears, channel splits, burst blocks.
function cfDatabend(c, r, env, t, COLS, ROWS){
  if (env>0.45 && h2(r,771)<env*0.45){
    var st=Math.floor(h2(r,772)*COLS*0.72), ln=3+Math.floor(h2(r,773)*9);
    if (c>=st && c<st+ln) return PAL_STR[1+Math.floor(h2(r,774)*3)];
  }
  var step=Math.floor(t*2.5);
  var tear=Math.round(env*(h2(r,step)*2-1)*7 + env*(h2(r,991)*2-1)*2);
  var cc=c-tear, s=Math.round(env*2);
  var cR=srcRGBat(cc-s, r, COLS, ROWS);
  var cG=srcRGBat(cc,   r, COLS, ROWS);
  var cB=srcRGBat(cc+s, r, COLS, ROWS);
  return 'rgb('+cR[0]+','+cG[1]+','+cB[2]+')';
}
// (3) TOKEN SWAP: scrambled palette lookup + token blocks at the wrong generation.
var LUT0=[0,1,2,3], LUT1=[5,4,1,2], LUT2=[6,3,4,1];
function cfToken(c, r, env, t, COLS, ROWS){
  var idx=srcIdx(c, r, COLS, ROWS);
  var bc=Math.floor(c/6), brw=Math.floor(r/6);
  var hb=h2(bc*31+brw*57, 555);
  var gen=0;
  if (hb<env) gen=(env>0.6 && h2(bc+brw*131, 556)<0.3) ? 2 : 1;
  var LUT = gen===0 ? LUT0 : (gen===1 ? LUT1 : LUT2);
  return PAL_STR[LUT[idx]];
}
var CELL_FN=[cfPrompted, cfDatabend, cfToken, null]; // panel 4 drawn by blocks

// (4) UPSCALED: low-res nearest sampling + halo edges on colour boundaries.
function drawUpscaled(ctx, x, y, w, h, env, COLS, ROWS){
  var f = env<0.2 ? 1 : env<0.45 ? 2 : env<0.7 ? 3 : 4;
  var cw=w/COLS, ch=h/ROWS;
  var BC=Math.ceil(COLS/f), BR=Math.ceil(ROWS/f);
  var g=[], bc, brw, sc, sr;
  for (brw=0; brw<BR; brw++){ g.push([]); for (bc=0; bc<BC; bc++){
    sc=Math.min(COLS-1, bc*f+((f-1)>>1)); sr=Math.min(ROWS-1, brw*f+((f-1)>>1));
    g[brw].push(srcIdx(sc, sr, COLS, ROWS));
  }}
  for (brw=0; brw<BR; brw++) for (bc=0; bc<BC; bc++){
    var idx=g[brw][bc], bx=x+bc*f*cw, by=y+brw*f*ch, bw=f*cw, bh=f*ch;
    ctx.fillStyle=PAL_STR[idx];
    ctx.fillRect(bx, by, bw+0.6, bh+0.6);
    if (env>0.3){
      ctx.fillStyle=HALO_STR[idx];
      if (bc+1<BC && g[brw][bc+1]!==idx) ctx.fillRect(bx+bw-2, by, 2, bh);
      if (brw+1<BR && g[brw+1][bc]!==idx) ctx.fillRect(bx, by+bh-2, bw, 2);
      if (bc>0 && g[brw][bc-1]!==idx) ctx.fillRect(bx, by, 2, bh);
      if (brw>0 && g[brw-1][bc]!==idx) ctx.fillRect(bx, by, bw, 2);
    }
  }
}

// ---------- phone detection ----------
var sw=(window.screen && window.screen.width)||0;
var sh=(window.screen && window.screen.height)||0;
var minScreen=Math.min(sw||9999, sh||9999);
var isPhone=minScreen<700;

// ---------- view / canvas ----------
var canvas=document.getElementById('stage');
var ctx=canvas.getContext('2d');
var W=0, H=0;
function viewW(){ if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width; return window.innerWidth||800; }
function viewH(){ if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height; return window.innerHeight||800; }
function fit(){
  W=viewW(); H=viewH();
  canvas.width=W; canvas.height=H;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
}

// ---------- panels ----------
var PANELS=[
  { title:'PROMPTED',   verdict:'GLITCH-ALIKE', vcol:'#FFB000' },
  { title:'DATABEND',   verdict:'REAL BREAK',   vcol:'#33FF66' },
  { title:'TOKEN SWAP', verdict:'REAL BREAK',   vcol:'#33FF66' },
  { title:'UPSCALED',   verdict:'GLITCH-ALIKE', vcol:'#FFB000' }
];
var COLS=48;
var isolated=-1;
var lastBlocks=[];

function drawCells(x, y, w, h, COLS, ROWS, fn, env, t){
  var cw=w/COLS, ch=h/ROWS, r, c, col, runCol, runStart;
  for (r=0;r<ROWS;r++){
    runCol=null; runStart=0;
    for (c=0;c<=COLS;c++){
      col = c<COLS ? fn(c, r, env, t, COLS, ROWS) : null;
      if (col!==runCol){
        if (runCol!==null){ ctx.fillStyle=runCol; ctx.fillRect(x+runStart*cw, y+r*ch, (c-runStart)*cw+0.6, ch+0.6); }
        runCol=col; runStart=c;
      }
    }
  }
}

function layout(){
  var M=Math.max(14, Math.min(W,H)*0.03);
  var labelH=18, stripH=Math.max(40, Math.min(64, H*0.09));
  var compX=M, compW=W-2*M;
  var compTop=M+labelH+8+stripH+14;
  var compBot=H-M, compH=compBot-compTop;
  var portrait = H > W*1.15;
  var blocks=[], i, bx, by, bw, bh;
  var titleH=16, verdictH=18, g=14;
  function block(k, x, y, w, h){
    return { k:k, x:x, y:y, w:w, h:h,
             px:x, py:y+titleH+4, pw:w, ph:h-titleH-verdictH-8,
             vx:x, vy:y+h-verdictH, vw:w, vh:verdictH };
  }
  if (isolated>=0){
    blocks.push(block(isolated, compX, compTop, compW, compH));
  } else if (portrait){
    bh=(compH-3*g)/4;
    for (i=0;i<4;i++) blocks.push(block(i, compX, compTop+i*(bh+g), compW, bh));
  } else {
    bw=(compW-g)/2; bh=(compH-g)/2;
    for (i=0;i<4;i++){
      bx=compX+(i%2)*(bw+g); by=compTop+Math.floor(i/2)*(bh+g);
      blocks.push(block(i, bx, by, bw, bh));
    }
  }
  return { M:M, labelH:labelH, stripH:stripH, stripY:M+labelH+8, compX:compX, compW:compW, compTop:compTop, compBot:compBot, blocks:blocks };
}

function draw(t){
  fit();
  var lt=((t%LOOP)+LOOP)%LOOP;
  var L=layout();
  lastBlocks=L.blocks;

  ctx.fillStyle='#060606'; ctx.fillRect(0,0,W,H);

  // top label
  ctx.fillStyle='#E8E8E8'; ctx.font='bold 13px monospace';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('GLITCH-ALIKE LAB', L.M, L.M+L.labelH/2);
  ctx.fillStyle='#8a8a8a'; ctx.font='10px monospace'; ctx.textAlign='right';
  ctx.fillText('SAME SOURCE x4', W-L.M, L.M+L.labelH/2);
  ctx.textAlign='left';

  // source thumbnail strip
  ctx.fillStyle='#9a9a9a'; ctx.font='10px monospace';
  ctx.fillText('SOURCE', L.M, L.stripY+L.stripH/2);
  var th=L.stripH, tw=th*1.5, tx=L.M+52, i;
  for (i=0;i<3;i++){
    if (tx+tw > W-L.M) break;
    drawCells(tx, L.stripY, tw, th, 24, 16, function(c,r){ return PAL_STR[srcIdx(c,r,24,16)]; }, 0, 0);
    ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=1;
    ctx.strokeRect(tx+0.5, L.stripY+0.5, tw-1, th-1);
    tx+=tw+10;
  }

  // panels
  for (i=0;i<L.blocks.length;i++){
    var b=L.blocks[i], P=PANELS[b.k];
    var env=panelEnv(b.k, lt, b.x+b.w/2, L.compX, L.compW);
    // title
    ctx.fillStyle='#E8E8E8'; ctx.font='bold 11px monospace'; ctx.textAlign='left';
    ctx.fillText(P.title, b.x, b.y+8);
    // content
    var cell=b.pw/COLS;
    var ROWS=Math.max(16, Math.round(b.ph/cell));
    if (b.k===3) drawUpscaled(ctx, b.px, b.py, b.pw, b.ph, env, COLS, ROWS);
    else drawCells(b.px, b.py, b.pw, b.ph, COLS, ROWS, CELL_FN[b.k], env, t);
    // frame
    ctx.strokeStyle='#FFFFFF'; ctx.lineWidth=1;
    ctx.strokeRect(b.px+0.5, b.py+0.5, b.pw-1, b.ph-1);
    // verdict strip
    ctx.fillStyle='#101010'; ctx.fillRect(b.vx, b.vy, b.vw, b.vh);
    ctx.fillStyle=P.vcol; ctx.fillRect(b.vx, b.vy, 3, b.vh);
    ctx.font='bold 11px monospace'; ctx.textAlign='center';
    ctx.fillText(P.verdict, b.vx+b.vw/2, b.vy+b.vh/2+0.5);
    ctx.textAlign='left';
  }

  // reset wipe bar
  if (lt>=14.5 && lt<15.5){
    var wx=L.compX+((lt-14.5)/1.0)*L.compW;
    ctx.fillStyle='rgba(255,255,255,0.92)';
    ctx.fillRect(wx-8, L.compTop, 16, L.compBot-L.compTop);
  }
}

// ---------- interaction: tap a panel to isolate, tap again to return ----------
if (canvas.addEventListener){
  canvas.addEventListener('pointerdown', function(ev){
    var x=ev.clientX, y=ev.clientY, i, b;
    if (isolated>=0){ isolated=-1; draw(lastT); return; }
    for (i=0;i<lastBlocks.length;i++){
      b=lastBlocks[i];
      if (x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h){ isolated=b.k; break; }
    }
    draw(lastT);
  });
}

// ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
var lastT=T0;
if (window.addEventListener){
  window.addEventListener('resize', function(){ draw(lastT); });
}
if (window.visualViewport && window.visualViewport.addEventListener){
  window.visualViewport.addEventListener('resize', function(){ draw(lastT); });
}
draw(T0);
var startStamp=null;
function frame(stamp){
  if (startStamp===null) startStamp=stamp;
  var t=T0+(stamp-startStamp)/1000;
  lastT=t;
  draw(t);
  if (typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
