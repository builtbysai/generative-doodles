<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrim Dissolve</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #EDEEEB;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');

  // Strict palette. Nothing else is ever drawn.
  var SCRIM = [250, 250, 248];   // #FAFAF8
  var ROOM = [237, 238, 235];    // #EDEEEB
  var TENSION = [216, 217, 213]; // #D8D9D5
  var CURVE = [201, 202, 198];   // #C9CAC6
  var LEAK = [255, 253, 245];    // #FFFDF5

  var CYCLE = 480; // 8-minute ambient cycle, seamless.

  function cl(v) { return Math.max(0, Math.min(255, Math.round(v))); }

  function rgbString(c, a) {
    if (typeof a === 'number') {
      return 'rgba(' + cl(c[0]) + ',' + cl(c[1]) + ',' + cl(c[2]) + ',' + a + ')';
    }
    return 'rgb(' + cl(c[0]) + ',' + cl(c[1]) + ',' + cl(c[2]) + ')';
  }

  // Seeded RNG (mulberry32) for the scrim sheen band placement.
  function mulberry32(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var z = s;
      z = Math.imul(z ^ (z >>> 15), z | 1);
      z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
      return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Sheen bands inside the scrim: fixed fractions of the scrim width,
  // seeded once. Each entry: [center fraction, width fraction, alpha].
  var SHEEN = (function () {
    var rnd = mulberry32(75492);
    var bands = [];
    var x = 0.06;
    while (x < 0.94) {
      var wdt = 0.05 + rnd() * 0.13;
      bands.push([x + wdt / 2, wdt, 0.04 + rnd() * 0.08]);
      x += wdt + 0.03 + rnd() * 0.10;
    }
    return bands;
  })();

  // Ambient levels as pure closed-form functions of cycle time t (seconds).
  // Integer ratios only, so the 480 s cycle closes exactly.
  function leakLevel(t) {
    var tt = ((t % CYCLE) + CYCLE) % CYCLE;
    // One slow swell per cycle; 0.55 at t = 0 (mid-glow).
    return 0.55 + 0.45 * Math.sin((tt / CYCLE) * Math.PI * 2);
  }

  function tensionAlpha(t) {
    var tt = ((t % CYCLE) + CYCLE) % CYCLE;
    // Two fades per cycle, phase-shifted against the leak: intermittency
    // on a different rhythm, so the two never peak together for long.
    var s = 0.5 + 0.5 * Math.sin((tt / CYCLE) * Math.PI * 4 + 0.9);
    return 0.05 + 0.17 * s;
  }

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  // The coved corner: a soft vertical band of shadow where the wall turns.
  // Drawn as layered strokes of the curve tone; wider spread and lower
  // alpha = softer (the out-of-focus pass behind the scrim).
  function coveBand(cxFrac, spreadFrac, alpha, y0, y1) {
    var cx = cxFrac * W;
    var spread = spreadFrac * W;
    var layers = [1.0, 0.72, 0.48, 0.28];
    for (var i = 0; i < layers.length; i++) {
      ctx.fillStyle = rgbString(CURVE, alpha * 0.30);
      ctx.fillRect(cx - spread * layers[i] / 2, y0, spread * layers[i], y1 - y0);
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var phone = isPhone();
    var ceilY = 0.055 * H;          // faint ceiling line
    var floorY = 0.80 * H;          // floor line
    var cornerF = 0.42;             // the room corner, off-center
    var scrimF = phone ? 0.40 : 0.36; // scrim spans the left portion
    var scrimX = scrimF * W;
    var lag = 0.007 * W;            // parallax lag behind the scrim

    // Room field.
    ctx.fillStyle = rgbString(ROOM);
    ctx.fillRect(0, 0, W, H);

    // Wall shading: the right wall sits a whisper darker past the corner,
    // the floor a whisper darker below its line. Tonal steps only.
    ctx.fillStyle = rgbString(CURVE, 0.10);
    ctx.fillRect(cornerF * W, 0, W - cornerF * W, floorY);
    ctx.fillStyle = rgbString(CURVE, 0.13);
    ctx.fillRect(0, floorY, W, H - floorY);

    // Ceiling and floor lines.
    ctx.fillStyle = rgbString(TENSION, 0.35);
    ctx.fillRect(0, ceilY, W, 1.2);
    ctx.fillStyle = rgbString(TENSION, 0.55);
    ctx.fillRect(0, floorY, W, 1.5);

    // The true corner, exposed right of the scrim: a coved, curved turn,
    // so the shadow is a soft band rather than a line.
    ctx.save();
    ctx.beginPath();
    ctx.rect(scrimX, 0, W - scrimX, floorY);
    ctx.clip();
    coveBand(cornerF, 0.085, 1.0, ceilY, floorY);
    ctx.restore();

    // The same curve behind the scrim: offset by the lag, spread wider,
    // laid down in more and fainter passes. It reads out of focus.
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, scrimX, floorY);
    ctx.clip();
    coveBand(cornerF - lag / W, 0.13, 0.55, ceilY, floorY);
    coveBand(cornerF - lag / W, 0.19, 0.30, ceilY, floorY);
    // The edit: behind the scrim the turn is replaced by one straight,
    // quiet shadow at the scrim's inner edge. The corner reads squared.
    ctx.fillStyle = rgbString(CURVE, 0.30);
    ctx.fillRect(scrimX - 0.012 * W, ceilY, 1.6, floorY - ceilY);
    ctx.fillStyle = rgbString(CURVE, 0.16);
    ctx.fillRect(scrimX - 0.012 * W - 2.5, ceilY, 2.5, floorY - ceilY);
    ctx.restore();

    // The scrim itself: a translucent plane, floor to ceiling.
    ctx.fillStyle = rgbString(SCRIM, 0.35);
    ctx.fillRect(0, ceilY, scrimX, floorY - ceilY);
    // Vertical sheen: layered bands of the scrim tone, fixed by the seed.
    for (var b = 0; b < SHEEN.length; b++) {
      ctx.fillStyle = rgbString(SCRIM, SHEEN[b][2]);
      ctx.fillRect(SHEEN[b][0] * scrimX - SHEEN[b][1] * scrimX / 2, ceilY,
        SHEEN[b][1] * scrimX, floorY - ceilY);
    }
    ctx.fillStyle = rgbString(LEAK, 0.05);
    ctx.fillRect(scrimX * 0.62, ceilY, scrimX * 0.10, floorY - ceilY);

    // The tension line: one faint vertical thread down the scrim,
    // fading in and out of legibility on its own rhythm.
    var tx = 0.185 * W;
    ctx.fillStyle = rgbString(TENSION, tensionAlpha(t));
    ctx.fillRect(tx, ceilY, 1.4, floorY - ceilY);
    ctx.fillStyle = rgbString(TENSION, tensionAlpha(t) * 0.4);
    ctx.fillRect(tx - 2, ceilY, 5.4, floorY - ceilY);

    // The light leak at the scrim's far edge: layered warm-white bands,
    // swelling and dimming over the cycle.
    var lv = leakLevel(t);
    var leakBands = [
      [30, 0.08],
      [19, 0.13],
      [11, 0.20],
      [5, 0.30]
    ];
    for (var k = 0; k < leakBands.length; k++) {
      var lw = leakBands[k][0] * (Math.min(W, H) / 720);
      ctx.fillStyle = rgbString(LEAK, leakBands[k][1] * lv);
      ctx.fillRect(scrimX - lw / 2, ceilY, lw, floorY - ceilY);
    }

    if (document.body && document.body.style) document.body.style.background = rgbString(ROOM);
  }

  // Inert QA hook (house convention): ?seed=tNN draws frame one at cycle
  // time NN seconds. Without the parameter the piece starts at t = 0.
  var startT = 0;
  var searchStr = (window.location && window.location.search) ||
    (typeof location !== 'undefined' ? location.search : '') || '';
  var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(searchStr);
  if (m) startT = parseFloat(m[1]);

  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(startT); });
  }
  window.addEventListener('resize', function () { resize(); draw(startT); });

  // Frame one: the synchronous draw at cycle t = 0 (leak at mid-glow,
  // tension line faintly present).
  draw(startT);

  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var frame = function (ts) {
      if (t0 === null) t0 = ts;
      draw(startT + (ts - t0) / 1000);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
