<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No.171 Ripple Emergence</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0A0A0C; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// Fathauer's recipe, literally: one ripple of concentric rings at the
// centre, then copies at one third scale placed by the Koch construction,
// generation after generation. Ripple centres are the midpoints of Koch
// segments: the seed midpoint of each snowflake side, mapped by all words
// of the four Koch IFS maps. Rings are stroked with 'lighter' composite
// on black, so overlaps brighten into interference bands. The Koch curve
// is never drawn; it stands out of the overlaps alone.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0;
var LOOP = 40000, OFFSET = 30000;

// ---------- Koch IFS in local segment coords (u along, v outward) ----
var SQ = Math.sqrt(3) / 2;
function rot60(p) { return [p[0] * 0.5 - p[1] * SQ, p[0] * SQ + p[1] * 0.5]; }
function rotm60(p) { return [p[0] * 0.5 + p[1] * SQ, -p[0] * SQ + p[1] * 0.5]; }
var MAPS = [
  function (p) { return [p[0] / 3, p[1] / 3]; },
  function (p) { var q = rot60(p); return [1 / 3 + q[0] / 3, q[1] / 3]; },
  function (p) { var q = rotm60(p); return [0.5 + q[0] / 3, (Math.sqrt(3) / 6) + q[1] / 3]; },
  function (p) { return [2 / 3 + p[0] / 3, p[1] / 3]; }
];
// centres per generation for one side, local coords; seed = midpoint
var sideGens = [];
(function () {
  var cur = [[0.5, 0]];
  for (var d = 1; d <= 5; d++) {
    var next = [];
    for (var i = 0; i < cur.length; i++)
      for (var m = 0; m < 4; m++) next.push(MAPS[m](cur[i]));
    sideGens.push(next);
    cur = next;
  }
})();

// ---------- snowflake sides -------------------------------------------
// local point (u,v) -> world: S + u*d + v*perp(d), perp chosen outward
function sideTransform(S, E, C) {
  var d = [E[0] - S[0], E[1] - S[1]];
  var perp = [d[1], -d[0]];
  var mid = [(S[0] + E[0]) / 2, (S[1] + E[1]) / 2];
  if ((perp[0] * (mid[0] - C[0]) + perp[1] * (mid[1] - C[1])) < 0) perp = [-perp[0], -perp[1]];
  return function (p) {
    return [S[0] + p[0] * d[0] + p[1] * perp[0], S[1] + p[0] * d[1] + p[1] * perp[1]];
  };
}

// ripples: {x, y (unit snowflake coords), gen, R in unit coords, rings}
var ripples = [];
(function () {
  var T = [[0, 0], [1, 0], [0.5, -Math.sqrt(3) / 2]];
  var C = [0.5, -Math.sqrt(3) / 6];
  var seen = {};
  function add(x, y, gen, rings) {
    var key = Math.round(x * 4000) + ':' + Math.round(y * 4000) + ':' + gen;
    if (seen[key]) return;
    seen[key] = 1;
    ripples.push({ x: x, y: y, gen: gen, R: 0.52 * Math.pow(1 / 3, gen), rings: rings });
  }
  add(C[0], C[1], 0, 16); // the central ripple
  var ringCounts = [0, 12, 10, 8, 6, 2];
  for (var s = 0; s < 3; s++) {
    var tr = sideTransform(T[s], T[(s + 1) % 3], C);
    for (var d = 1; d <= 5; d++) {
      var pts = sideGens[d - 1];
      for (var i = 0; i < pts.length; i++) {
        var w = tr(pts[i]);
        add(w[0], w[1], d, ringCounts[d]);
      }
    }
  }
})();

var fit = { cx: 0, cy: 0, L: 100 };
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  // snowflake unit bbox: x 0..1, y about -0.29..0.87 (bumps outward)
  var L = Math.min(H * 0.85 / 1.155, W * 0.92);
  fit.L = L;
  fit.cx = W / 2 - 0.5 * L;
  fit.cy = H / 2 + 0.289 * L;
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function ease(k) { return k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }

function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var t = ((now + OFFSET) % LOOP) / 1000; // seconds in loop
  ctx.fillStyle = '#0A0A0C';
  ctx.fillRect(0, 0, W, H);
  // global fade for the soft reset (36-40 s) and gentle start
  var gAlpha = 1;
  if (t > 36) gAlpha = 1 - (t - 36) / 4;
  else if (t < 1) gAlpha = 0.35 + 0.65 * t;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = Math.max(0.7, fit.L / 620);
  for (var i = 0; i < ripples.length; i++) {
    var rp = ripples[i];
    // appearance: gen 0 expands over 0-8 s; gens 1-5 arrive one per 4 s
    var ap = 0, grow = 1;
    if (rp.gen === 0) {
      var k0 = Math.min(1, t / 8);
      ap = 1; grow = 0.12 + 0.88 * ease(k0);
    } else {
      var start = 8 + (rp.gen - 1) * 4;
      if (t < start) continue;
      var k = Math.min(1, (t - start) / 4);
      ap = ease(k); grow = 0.35 + 0.65 * ease(k);
    }
    var cx = fit.cx + rp.x * fit.L, cy = fit.cy + rp.y * fit.L;
    var R = rp.R * fit.L * grow;
    if (R < 0.8) continue;
    for (var j = 0; j < rp.rings; j++) {
      var f = Math.pow((j + 1) / rp.rings, 0.85);
      var a = (1 - 0.85 * f) * 0.31 * ap * gAlpha * (rp.gen === 0 ? 0.8 : 1);
      if (a <= 0.004) continue;
      ctx.strokeStyle = 'rgba(220,233,245,' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(cx, cy, R * f, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
