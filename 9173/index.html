<!DOCTYPE html>
<!-- 9173-the-story-pain-suffering -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Story — №9173</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #efe9dc;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: Georgia, "Times New Roman", serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage {
    position: fixed; inset: 0;
    display: block;
    touch-action: none;
    cursor: pointer;
  }
  .label {
    position: fixed;
    z-index: 2;
    color: #5a5148;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .label.hidden { opacity: 0; }
  #corner {
    top: 20px; left: 22px;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #6b6156;
  }
  #foot {
    left: 0; right: 0; bottom: 22px;
    text-align: center;
    padding: 0 20px;
  }
  #foot .q {
    font-size: 16px;
    font-style: italic;
    letter-spacing: 0.03em;
    color: #4c443b;
  }
  #foot .a {
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a7f71;
  }
  #foot .r {
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #6b6156;
  }
  #foot .h {
    margin-top: 4px;
    font-size: 11px;
    font-style: italic;
    letter-spacing: 0.04em;
    color: #9a8f80;
  }
  @media (max-width: 600px) {
    #foot .q { font-size: 14px; }
    #corner { font-size: 12px; top: 16px; left: 16px; }
    #foot { bottom: 16px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="corner" class="label">№ 9173 · The Story</div>
<div id="foot" class="label">
  <div class="q">Pain is unavoidable, but suffering is optional.</div>
  <div class="a">after Haruki Murakami</div>
  <div class="r" id="readout">pain 0 · stories 0</div>
  <div class="h">a bare fact arrives and passes on its own. tap it and a ring of words wraps around it, each ring keeping it alive longer. double-tap a fact to strip its stories.</div>
</div>
<script>
(function () {
  "use strict";

  // Pain is unavoidable, but suffering is optional.
  //
  // A second reading of the quote. Pain is a fact, and a fact is
  // wordless: a plain disc arrives on its own schedule and dissolves
  // on its own. Suffering is the story the mind wraps around the fact,
  // and the story is made of words. Each tap wraps one more ring of
  // words around the fact, and every ring keeps the fact alive longer:
  // the pain you narrate outlives the pain you leave alone. Double-tap
  // a fact and the stories fall away, and the fact passes quickly.
  // The story is never forced on you. You add it, one tap at a time.

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  var readout = document.getElementById("readout");
  var labels = document.querySelectorAll(".label");

  var W = 0, H = 0, DPR = 1;
  var discs = [];
  var nextFact = 1200; // ms until the first fact
  var last = performance.now();
  var labelsShown = true;
  var grain = null;

  var INK = [26, 23, 20];
  var BLOOD = [74, 26, 22];
  var MAX_DISCS = 12;
  var MAX_RINGS = 5;
  var BASE_LIFE = 12;    // seconds a bare fact lives
  var RING_LIFE = 6;     // seconds each ring adds
  var WORDS = ["why me", "always", "never", "unfair", "again", "ruined",
               "should have", "can't bear it", "what if", "not fair",
               "every time", "my fault", "too much", "no way out"];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildGrain();
  }

  function buildGrain() {
    var g = document.createElement("canvas");
    var s = 180;
    g.width = s; g.height = s;
    var gc = g.getContext("2d");
    var img = gc.createImageData(s, s);
    for (var i = 0; i < img.data.length; i += 4) {
      var v = 228 + Math.floor(Math.random() * 24) - 12;
      img.data[i] = v; img.data[i + 1] = v - 4; img.data[i + 2] = v - 12;
      img.data[i + 3] = 255;
    }
    gc.putImageData(img, 0, 0);
    grain = ctx.createPattern(g, "repeat");
  }

  function mulberry(seed) {
    var t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5;
      var r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  function fact(x, y) {
    if (discs.length >= MAX_DISCS) return null;
    var rnd = mulberry((Math.random() * 1e9) | 0);
    var d = {
      x: x, y: y,
      r0: 13 + rnd() * 6,
      life: BASE_LIFE,
      rings: [],
      born: performance.now(),
      seed: rnd() * Math.PI * 2
    };
    discs.push(d);
    return d;
  }

  function scheduleFact() {
    nextFact = 3000 + Math.random() * 4000; // 3-7s, on its own schedule
  }

  function mix(c1, c2, t) {
    return [
      Math.round(c1[0] + (c2[0] - c1[0]) * t),
      Math.round(c1[1] + (c2[1] - c1[1]) * t),
      Math.round(c1[2] + (c2[2] - c1[2]) * t)
    ];
  }

  function addRing(d) {
    if (d.rings.length >= MAX_RINGS) return false;
    var rnd = mulberry((Math.random() * 1e9) | 0);
    var n = 3 + Math.floor(rnd() * 3); // 3-5 words on the ring
    var words = [];
    var used = {};
    while (words.length < n) {
      var w = WORDS[Math.floor(rnd() * WORDS.length)];
      if (!used[w]) { used[w] = true; words.push(w); }
    }
    d.rings.push({
      words: words,
      spin: (0.05 + rnd() * 0.08) * (d.rings.length % 2 === 0 ? 1 : -1),
      phase: rnd() * Math.PI * 2
    });
    d.life += RING_LIFE; // the story keeps the fact alive longer
    return true;
  }

  function stripRings(d) {
    d.rings.length = 0;
    d.life = Math.min(d.life, 6); // stories dropped, the fact passes quickly
  }

  function update(dt) {
    nextFact -= dt * 1000;
    if (nextFact <= 0) {
      var fx = 70 + Math.random() * Math.max(20, W - 140);
      var fy = 80 + Math.random() * Math.max(20, H - 220);
      fact(fx, fy);
      scheduleFact();
    }
    for (var i = discs.length - 1; i >= 0; i--) {
      var d = discs[i];
      d.life -= dt;
      if (d.life <= 0) discs.splice(i, 1);
    }
  }

  function drawDisc(d, now) {
    var dark = d.rings.length / MAX_RINGS;
    var col = mix(INK, BLOOD, dark);
    // Fade in the last 2s of life; fade in briefly at birth.
    var a = 0.85;
    if (d.life < 2) a *= d.life / 2;
    var age = (now - d.born) / 1000;
    if (age < 0.6) a *= age / 0.6;
    if (a <= 0.01) return;

    var r = d.r0 + d.rings.length * 2;
    var g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, r);
    g.addColorStop(0, "rgba(" + col[0] + "," + col[1] + "," + col[2] + "," + (a * 0.92).toFixed(3) + ")");
    g.addColorStop(0.55, "rgba(" + col[0] + "," + col[1] + "," + col[2] + "," + (a * 0.75).toFixed(3) + ")");
    g.addColorStop(1, "rgba(" + col[0] + "," + col[1] + "," + col[2] + ",0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
    ctx.fill();

    // Rings of words, orbiting slowly, alternating direction.
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (var i = 0; i < d.rings.length; i++) {
      var ring = d.rings[i];
      var rr = r + 16 + i * 16;
      var rot = ring.phase + (now / 1000) * ring.spin;
      ctx.font = "italic " + (11 - Math.min(2, i)) + "px Georgia, serif";
      ctx.fillStyle = "rgba(" + col[0] + "," + col[1] + "," + col[2] + "," + (a * 0.72).toFixed(3) + ")";
      for (var j = 0; j < ring.words.length; j++) {
        var ang = rot + (j / ring.words.length) * Math.PI * 2;
        var wx = d.x + Math.cos(ang) * rr;
        var wy = d.y + Math.sin(ang) * rr;
        ctx.save();
        ctx.translate(wx, wy);
        ctx.rotate(ang + Math.PI / 2);
        ctx.fillText(ring.words[j], 0, 0);
        ctx.restore();
      }
    }
  }

  function draw(now) {
    ctx.fillStyle = grain || "#efe9dc";
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < discs.length; i++) drawDisc(discs[i], now);
  }

  function counts() {
    var stories = 0;
    for (var i = 0; i < discs.length; i++) stories += discs[i].rings.length;
    return { pain: discs.length, stories: stories };
  }

  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw(now);
    var c = counts();
    readout.textContent = "pain " + c.pain + " · stories " + c.stories;
    requestAnimationFrame(frame);
  }

  function discAt(x, y) {
    for (var i = discs.length - 1; i >= 0; i--) {
      var d = discs[i];
      var dx = x - d.x, dy = y - d.y;
      var gr = d.r0 + d.rings.length * 2 + 26;
      if (dx * dx + dy * dy < gr * gr) return d;
    }
    return null;
  }

  function setLabels(show) {
    labelsShown = show;
    for (var i = 0; i < labels.length; i++) {
      labels[i].classList.toggle("hidden", !show);
    }
  }

  function clearAll() {
    discs.length = 0;
    scheduleFact();
  }

  // Single tap vs double tap: a 300ms window decides. A single tap on a
  // disc adds a ring; a double tap on the same disc strips its rings. A
  // single tap on empty space toggles the labels; a double tap there
  // begins again. The single action fires when the window closes, so the
  // ring forms a beat after the touch, like a thought forming.
  var pending = null;
  var pendingTimer = null;
  var downPos = null;
  var downTime = 0;

  function firePending() {
    if (!pending) return;
    var p = pending;
    pending = null;
    if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
    if (p.type === "disc" && discs.indexOf(p.disc) !== -1) addRing(p.disc);
    else if (p.type === "empty") setLabels(!labelsShown);
  }

  function sameTarget(a, b) {
    if (a.type !== b.type) return false;
    if (a.type === "empty") return true;
    return a.disc === b.disc;
  }

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    downPos = { x: e.clientX, y: e.clientY };
    downTime = performance.now();
  });

  canvas.addEventListener("pointerup", function (e) {
    if (!downPos) return;
    var dt = performance.now() - downTime;
    var dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
    var moved = Math.sqrt(dx * dx + dy * dy);
    var x = e.clientX, y = e.clientY;
    downPos = null;
    if (dt > 500 || moved > 12) return; // a drag, not a tap
    var d = discAt(x, y);
    var tap = d ? { type: "disc", disc: d } : { type: "empty" };
    if (pending && sameTarget(pending, tap)) {
      // Double tap: strip the disc's rings, or begin again.
      if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; }
      pending = null;
      if (tap.type === "disc" && discs.indexOf(tap.disc) !== -1) stripRings(tap.disc);
      else clearAll();
      return;
    }
    if (pending) firePending(); // different target: the first tap stands
    pending = tap;
    pendingTimer = setTimeout(firePending, 300);
  });

  canvas.addEventListener("pointercancel", function () {
    downPos = null;
  });

  document.addEventListener("visibilitychange", function () {
    last = performance.now();
  });

  window.addEventListener("resize", resize);

  // Harness hook: read-only state for verification, not part of the piece.
  window.__9173 = {
    discs: function () {
      return discs.map(function (d) {
        return { x: d.x, y: d.y, r: d.r0 + d.rings.length * 2,
                 rings: d.rings.length, life: d.life };
      });
    },
    counts: counts,
    factAt: function (x, y) { return fact(x, y); },
    clear: clearAll,
    labelsShown: function () { return labelsShown; }
  };

  resize();
  scheduleFact();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
