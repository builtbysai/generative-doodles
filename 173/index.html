<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No.173 Infinity Strand</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #050505; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// No.173 Infinity Strand. One copper strand, five generations.
// The base motif is the (2,3) torus knot projected to the plane:
//   x = (2 + 0.85 cos 3t) cos 2t,  y = (2 + 0.85 cos 3t) sin 2t,
//   z = sin 3t,
// a single closed parametric curve: the angle winds twice while the
// radius breathes three times, giving exactly three self-crossings
// whose over/under alternates with the sign of z. Each generation stamps two smaller whole
// copies of the knot inside two of the parent lobes; every copy is
// itself one continuous closed path, placed against the parent
// strand, so the whole figure stays one connected, pen-never-lifted
// drawing. Watch only: the strand draws on, generations grow in
// nested sequence, the knot holds and breathes, then fades from the
// innermost generation outward.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#050505', COPPER = '#B87333', HI = '#E8B06A';
var W = 0, H = 0;
var T = 45000, OFFSET = 30000;
var SIGMA = 0.30, MAXGEN = 5, M = 220;

// ---------- base trefoil ----------------------------------------------
var base = []; // {x, y, z}
var BC = { x: 0, y: 0 }; // bbox centre, subtracted so the knot is centred
(function () {
  for (var i = 0; i < M; i++) {
    var t = i / M * Math.PI * 2;
    var r = 2 + 0.85 * Math.cos(3 * t);
    base.push({
      x: r * Math.cos(2 * t),
      y: r * Math.sin(2 * t),
      z: Math.sin(3 * t), t: t
    });
  }
  var mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9;
  base.forEach(function (p) {
    mnx = Math.min(mnx, p.x); mxx = Math.max(mxx, p.x);
    mny = Math.min(mny, p.y); mxy = Math.max(mxy, p.y);
  });
  BC.x = (mnx + mxx) / 2; BC.y = (mny + mxy) / 2;
  base.forEach(function (p) { p.x -= BC.x; p.y -= BC.y; });
})();
// crossings: pairs of distant samples whose segments intersect.
// Returns {i, j, x, y} with i the over-strand sample (higher z).
var crossings = [];
(function () {
  function segInt(a, b, c, d) {
    var r = [b.x - a.x, b.y - a.y], s = [d.x - c.x, d.y - c.y];
    var den = r[0] * s[1] - r[1] * s[0];
    if (Math.abs(den) < 1e-12) return null;
    var qp = [c.x - a.x, c.y - a.y];
    var tt = (qp[0] * s[1] - qp[1] * s[0]) / den;
    var uu = (qp[0] * r[1] - qp[1] * r[0]) / den;
    if (tt > 0.02 && tt < 0.98 && uu > 0.02 && uu < 0.98)
      return { x: a.x + tt * r[0], y: a.y + tt * r[1], t: tt, u: uu };
    return null;
  }
  for (var i = 0; i < M; i++) {
    for (var j = i + 12; j < M; j++) {
      if (i === 0 && j > M - 12) continue;
      var p = base[i], q = base[(i + 1) % M], r2 = base[j], s2 = base[(j + 1) % M];
      var hit = segInt(p, q, r2, s2);
      if (hit) {
        var zi = p.z + (q.z - p.z) * hit.t;
        var zj = r2.z + (s2.z - r2.z) * hit.u;
        var over = zi > zj ? i : j, under = zi > zj ? j : i;
        var cand = { x: hit.x, y: hit.y, over: over, under: under };
        var dup = false;
        for (var q2 = 0; q2 < crossings.length; q2++) {
          var dx = crossings[q2].x - cand.x, dy = crossings[q2].y - cand.y;
          if (dx * dx + dy * dy < 0.16) { dup = true; break; }
        }
        if (!dup) crossings.push(cand);
      }
    }
  }
})();
// lobe tip parameters: the three radius maxima (cos 3t = 1)
var LOBES = [0, 2 * Math.PI / 3, 4 * Math.PI / 3];
function curveAt(t) {
  var r = 2 + 0.85 * Math.cos(3 * t);
  return { x: r * Math.cos(2 * t) - BC.x, y: r * Math.sin(2 * t) - BC.y };
}

// ---------- instance tree ----------------------------------------------
// An instance: similarity transform (scale s, translation tx, ty; the
// copies are unrotated, matching the parent orientation), generation,
// centre (for grow scaling), world-space polyline.
var instances = [];
function addInstance(s, tx, ty, gen) {
  var pts = base.map(function (p) { return [tx + s * p.x, ty + s * p.y]; });
  var inst = { s: s, tx: tx, ty: ty, gen: gen, pts: pts, cx: tx, cy: ty };
  instances.push(inst);
  if (gen >= MAXGEN) return;
  for (var li = 0; li < 2; li++) {
    var tip = curveAt(LOBES[li]);
    // child centre sits along the lobe axis at radius 1.62 (local units)
    var rad = Math.sqrt(tip.x * tip.x + tip.y * tip.y);
    var ux = tip.x / rad, uy = tip.y / rad;
    var cs = s * SIGMA;
    var ctx2 = tx + s * 1.62 * ux, cty2 = ty + s * 1.62 * uy;
    addInstance(cs, ctx2, cty2, gen + 1);
  }
}
addInstance(1, 0, 0, 1);

// arc-length prefixes per instance for the gen 1 draw-on
instances.forEach(function (inst) {
  var cum = [0];
  for (var i = 1; i <= inst.pts.length; i++) {
    var a = inst.pts[i - 1], b = inst.pts[i % inst.pts.length];
    cum.push(cum[i - 1] + Math.sqrt((b[0] - a[0]) * (b[0] - a[0]) + (b[1] - a[1]) * (b[1] - a[1])));
  }
  inst.cum = cum; inst.len = cum[cum.length - 1];
});

// ---------- layout -------------------------------------------------------
var fit = { cx: 0, cy: 0, u: 100 };
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  fit.u = (0.375 * Math.min(W, H)) / 2.85; // curve max radius 2.85 -> 37.5% of min
  fit.cx = W / 2; fit.cy = H / 2;
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
function easeOut(k) { return 1 - Math.pow(1 - k, 3); }
var WIDTHS = [0, 0.046, 0.027, 0.017, 0.011, 0.008];

function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var ts = ((now + OFFSET) % T) / 1000;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);

  // phases: draw-on 0-8, gens 2-5 grow 8-24, hold+breathe 24-40, fade 40-45
  var breathe = 1;
  if (ts >= 24 && ts < 40) breathe = 1 + 0.006 * Math.sin((ts - 24) / 16 * Math.PI * 2);
  function X(p) { return [fit.cx + p[0] * fit.u * breathe, fit.cy + p[1] * fit.u * breathe]; }

  instances.forEach(function (inst) {
    var g = inst.gen;
    var alpha = 1, grow = 1, reveal = 1;
    if (g === 1) {
      reveal = ts < 8 ? clamp01(ts / 8) : 1;
    } else {
      var start = 8 + (g - 2) * 4;
      if (ts < start) return;
      var k = clamp01((ts - start) / 4);
      grow = 0.15 + 0.85 * easeOut(k);
      alpha = k;
    }
    if (ts >= 40) {
      var fs = 40 + (5 - g) * 0.7;
      if (ts > fs) alpha *= clamp01(1 - (ts - fs) / (45 - fs));
    }
    if (alpha <= 0.003) return;
    var lwPx = Math.max(0.6, WIDTHS[g] * fit.u * breathe);
    ctx.lineWidth = lwPx;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    function mapPt(p) {
      var x = inst.cx + (p[0] - inst.cx) * grow;
      var y = inst.cy + (p[1] - inst.cy) * grow;
      return X([x, y]);
    }
    // main strand (possibly a revealed prefix for generation 1)
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = COPPER;
    ctx.beginPath();
    var upto = inst.len * reveal;
    var acc = 0, started = false, last = null;
    for (var i = 0; i < inst.pts.length; i++) {
      var p = mapPt(inst.pts[i]);
      if (!started) { ctx.moveTo(p[0], p[1]); started = true; last = p; continue; }
      var segLen = inst.cum[i] - inst.cum[i - 1];
      if (acc + segLen <= upto) { ctx.lineTo(p[0], p[1]); acc += segLen; last = p; }
      else {
        var f = segLen > 0 ? (upto - acc) / segLen : 0;
        ctx.lineTo(last[0] + (p[0] - last[0]) * f, last[1] + (p[1] - last[1]) * f);
        acc = upto;
        break;
      }
    }
    if (reveal >= 1) ctx.closePath();
    ctx.stroke();

    // crossing treatment once the strand is substantially present
    var treat = g === 1 ? clamp01((reveal - 0.55) / 0.45) : alpha;
    if (treat > 0.05 && reveal >= 0.6) {
      crossings.forEach(function (cr) {
        function sampleAt(idx) { return mapPt(inst.pts[idx % M]); }
        // under gap: short ground segment around the under sample
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = GROUND;
        ctx.lineWidth = lwPx + 1.4;
        ctx.beginPath();
        for (var d = -1; d <= 1; d++) {
          var p = sampleAt(cr.under + d);
          if (d === -1) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
        }
        ctx.stroke();
        // over segment in highlight
        ctx.strokeStyle = HI;
        ctx.lineWidth = lwPx * 0.96;
        ctx.beginPath();
        for (var d2 = -2; d2 <= 2; d2++) {
          var p2 = sampleAt(cr.over + d2);
          if (d2 === -2) ctx.moveTo(p2[0], p2[1]); else ctx.lineTo(p2[0], p2[1]);
        }
        ctx.stroke();
      });
    }
    ctx.globalAlpha = 1;
  });
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
