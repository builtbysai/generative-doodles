<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Transformations</title>
<style>
html, body { margin: 0; padding: 0; background: #050508; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#050508';
var PLATE = '#f4fbff';
var INK = '#14141c';
var CYAN = '#00b7d4';
var MAX_SOURCES = 8;
var PHASE = 6;
/* Summed wave sources paint a color field whose hot bands are the
   crests themselves. Frame one is at t = 6 s: the field is developed,
   the crest bands are formed, the sources are on their orbits. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function rgb(c) {
  return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
}
var CYAN_RGB = hexRgb(CYAN);
var INK_RGB = hexRgb(INK);
var WHITE_RGB = [255, 255, 255];
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* ---- authored wave sources: three point emitters from the edges,
   one diagonal plane wave from the top edge. Every color event in
   the field traces to one of these. ---- */
var sources = [
  { kind: 'point', bx: 0.05, by: 0.40, ox: 0.05, oy: 0.07,
    s1: 0.11, s2: 0.09, p1: 0.4, p2: 2.1, amp: 0.85, k: 0.034, w: 1.05, ph: 0.0 },
  { kind: 'point', bx: 0.95, by: 0.60, ox: 0.05, oy: 0.06,
    s1: 0.08, s2: 0.12, p1: 3.6, p2: 0.9, amp: 0.85, k: 0.028, w: 0.85, ph: 2.2 },
  { kind: 'point', bx: 0.56, by: 0.04, ox: 0.08, oy: 0.04,
    s1: 0.10, s2: 0.07, p1: 1.7, p2: 4.4, amp: 0.80, k: 0.040, w: 1.20, ph: 4.1 },
  { kind: 'plane', ang: -0.61, amp: 0.55, k: 0.030, w: 0.90, ph: 0.8 }
];
/* Fixed authored table for tap-added sources, dealt in order. */
var TAP_TABLE = [
  { amp: 0.70, k: 0.036, w: 1.10, ph: 1.3, ox: 0.03, oy: 0.04, s1: 0.13, s2: 0.10, p1: 0.2, p2: 5.0 },
  { amp: 0.70, k: 0.030, w: 0.95, ph: 3.0, ox: 0.04, oy: 0.03, s1: 0.09, s2: 0.14, p1: 2.8, p2: 1.1 },
  { amp: 0.70, k: 0.042, w: 1.25, ph: 5.2, ox: 0.03, oy: 0.05, s1: 0.15, s2: 0.08, p1: 4.6, p2: 3.3 },
  { amp: 0.70, k: 0.026, w: 0.80, ph: 0.6, ox: 0.05, oy: 0.03, s1: 0.07, s2: 0.11, p1: 5.9, p2: 2.4 }
];
function sourcePos(s, t) {
  return {
    x: (s.bx + s.ox * Math.sin(s.s1 * t + s.p1)) * VW,
    y: (s.by + s.oy * Math.cos(s.s2 * t + s.p2)) * VH
  };
}
function sourceValue(s, x, y, t) {
  var d, dx, dy;
  if (s.kind === 'plane') {
    return s.amp * Math.sin(s.k * (x * Math.cos(s.ang) + y * Math.sin(s.ang)) - s.w * t + s.ph);
  }
  var sp = sourcePos(s, t);
  dx = x - sp.x; dy = y - sp.y;
  d = Math.sqrt(dx * dx + dy * dy);
  return s.amp * Math.sin(s.k * d - s.w * t + s.ph);
}
function maxAmp() {
  var m = 0, i;
  for (i = 0; i < sources.length; i++) m += sources[i].amp;
  return m;
}
/* ---- hot/cool ramp: crests run near-black to dark red to
   red-orange to yellow to near-white; troughs run near-black
   through deep blue to cyan. Mid-field is near-black ground. ---- */
var HOT = [
  [0.00, 7, 7, 14], [0.25, 74, 10, 16], [0.50, 196, 38, 10],
  [0.70, 255, 120, 0], [0.85, 255, 196, 0], [1.00, 255, 243, 192]
];
var COOL = [
  [0.00, 7, 7, 14], [0.35, 10, 26, 74], [0.70, 0, 90, 140], [1.00, 0, 183, 212]
];
function ramp(u) {
  var stops, s, i, f;
  if (u >= 0) { stops = HOT; s = u; } else { stops = COOL; s = -u; }
  if (s <= 0) return [stops[0][1], stops[0][2], stops[0][3]];
  for (i = 1; i < stops.length; i++) {
    if (s <= stops[i][0]) {
      f = (s - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]);
      return [
        Math.round(lerp(stops[i - 1][1], stops[i][1], f)),
        Math.round(lerp(stops[i - 1][2], stops[i][2], f)),
        Math.round(lerp(stops[i - 1][3], stops[i][3], f))
      ];
    }
  }
  var last = stops[stops.length - 1];
  return [last[1], last[2], last[3]];
}
/* ---- field on a coarse grid, painted as a low-resolution image ---- */
var grid = { cs: 12, nx: 0, ny: 0, u: [], maxU: 0 };
function computeField(t) {
  var cs = isPhone ? 14 : 12;
  grid.cs = cs;
  var nx = Math.ceil(VW / cs) + 1, ny = Math.ceil(VH / cs) + 1;
  grid.nx = nx; grid.ny = ny;
  var mA = maxAmp(), u = new Array(nx * ny), i, j, x, y, s, v, mU = 0;
  for (j = 0; j < ny; j++) {
    y = j * cs + cs / 2;
    for (i = 0; i < nx; i++) {
      x = i * cs + cs / 2;
      v = 0;
      for (s = 0; s < sources.length; s++) v += sourceValue(sources[s], x, y, t);
      u[j * nx + i] = clamp(v / mA, -1, 1);
      if (u[j * nx + i] > mU) mU = u[j * nx + i];
    }
  }
  grid.u = u;
  grid.maxU = mU;
}
function drawDisc(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
}
function drawField() {
  var cs = grid.cs, nx = grid.nx, ny = grid.ny;
  var i, j, u, col;
  for (j = 0; j < ny; j++) {
    for (i = 0; i < nx; i++) {
      u = grid.u[j * nx + i];
      col = ramp(u);
      ctx.fillStyle = rgb(col);
      ctx.fillRect(i * cs, j * cs, cs + 1, cs + 1);
    }
  }
  /* Crest cores: white-hot discs only where the field is a real
     constructive maximum, so the hot bands read as crests.
     Threshold is relative to this frame's own maximum, so the
     crests stay visible as tap-added sources join the sum. */
  var crestAt = 0.85 * grid.maxU;
  for (j = 0; j < ny; j++) {
    for (i = 0; i < nx; i++) {
      u = grid.u[j * nx + i];
      if (u > crestAt && u > 0.55) {
        ctx.fillStyle = rgba(WHITE_RGB, 0.75 * (u - crestAt) / (grid.maxU - crestAt));
        drawDisc(i * cs + cs / 2, j * cs + cs / 2, cs * 0.30);
        ctx.fill();
      }
    }
  }
}
function drawSources(t) {
  var s, sp, pr, a;
  for (s = 0; s < sources.length; s++) {
    if (sources[s].kind !== 'point') continue;
    sp = sourcePos(sources[s], t);
    /* Expanding pulse ring, fading as it travels. */
    pr = ((t * 34 + sources[s].ph * 40) % 150) + 12;
    a = (1 - (pr - 12) / 150) * 0.45;
    if (a > 0.01) {
      ctx.strokeStyle = rgba(CYAN_RGB, a);
      ctx.lineWidth = 1.4;
      drawDisc(sp.x, sp.y, pr);
      ctx.stroke();
    }
    /* Source marker: cool cyan core with a steady ring. */
    ctx.fillStyle = rgba(CYAN_RGB, 0.9);
    drawDisc(sp.x, sp.y, 4.5);
    ctx.fill();
    ctx.strokeStyle = rgba(CYAN_RGB, 0.7);
    ctx.lineWidth = 1.2;
    drawDisc(sp.x, sp.y, 10 + 3 * Math.sin(t * 0.8 + sources[s].ph));
    ctx.stroke();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Field Transformations').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Field Transformations').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 07 · 21').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(INK_RGB, 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Field Transformations', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK_RGB, 0.8);
  ctx.fillText('2006 · 07 · 21', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Tap to add a wave source.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba(INK_RGB, 0.35);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = rgba(INK_RGB, 0.9);
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
/* ---- tap interaction: append a wave source at the tap point,
   parameters dealt from the fixed table; capped at 8, never removed. ---- */
function addSource(px, py) {
  if (sources.length >= MAX_SOURCES) return false;
  var e = TAP_TABLE[sources.length - 4];
  if (!e) return false;
  sources.push({
    kind: 'point', bx: px / VW, by: py / VH,
    ox: e.ox, oy: e.oy, s1: e.s1, s2: e.s2, p1: e.p1, p2: e.p2,
    amp: e.amp, k: e.k, w: e.w, ph: e.ph
  });
  return true;
}
function onPointerDown(e) {
  if (!e) return;
  var x = (typeof e.clientX === 'number') ? e.clientX : VW / 2;
  var y = (typeof e.clientY === 'number') ? e.clientY : VH / 2;
  addSource(x, y);
  if (e.preventDefault) e.preventDefault();
}
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('mousedown', onPointerDown);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
function draw(t) {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  computeField(t);
  drawField();
  drawSources(t);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
/* Exposed for the QA probe harness only. */
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    sourceCount: function () { return sources.length; },
    addSource: function (x, y) { return addSource(x, y); },
    fieldStats: function () {
      var m = 0, hot = 0, cool = 0, i, u;
      var crestAt = 0.85 * grid.maxU;
      for (i = 0; i < grid.u.length; i++) {
        u = grid.u[i];
        if (Math.abs(u) > m) m = Math.abs(u);
        if (u > crestAt && u > 0.55) hot++;
        if (u < -0.7) cool++;
      }
      return { cells: grid.u.length, maxAbs: m, hotCells: hot, coolCells: cool };
    }
  };
}
/* ---- frame one: fixed phase, fixed seeds, no wall clock ---- */
size();
var clockT = PHASE, prevTs = null, t0 = null;
draw(PHASE);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
