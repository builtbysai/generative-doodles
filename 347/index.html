<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.347 Cheater Quilt</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#14121E; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.347 Cheater Quilt (emibeebuzz).
// After Emi Bee's cheater-quilt patchwork fabric, printed
// with sew-lines "so you can sew along the lines": a 5 x 4
// quilt of twenty squares on deep indigo, divided by printed
// sew-line gutters. Exactly five mini pattern generators,
// no sixth: celestial (sun/moon), faux tweed, pinstripe,
// twisty-floral damask, 8-point star, each appearing exactly
// four times in a fixed authored layout. Every square loops
// on its own slow animation inside a shared 20s master loop,
// all phases completing whole cycles in 20s, so the piece is
// seamless. DOUBLE-TAP a square (350ms window) and only that
// square advances to the next seed in its fixed per-cell
// seed table, with a quick stitch-flash; a single tap does
// nothing, nothing ever reseeds the whole piece, and no seed
// ever comes from runtime random. The faux tweed is thread
// strokes held as JS data and drawn every frame, never an
// offscreen layer. Frame one is drawn synchronously at the
// constant phase T = 7.35 and the animation clock advances
// from that anchor only, so the thumbnail reproduces
// byte-identically from this script.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#14121E', BONE = '#E8DCC8', GOLD = '#C9A227', ROSE = '#B76E79', SLATE = '#5B7B9A';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 7.35, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var TAU = Math.PI * 2;

// ---- master loop: 20s, asserted ------------------------------
var LOOP = 20;
if (LOOP !== 20) throw new Error('Cheater Quilt master loop must be 20s');

// ---- grid: 5 x 4 = 20 squares, asserted ----------------------
var COLS = 5, ROWS = 4;
var PITCHX = DW / COLS, PITCHY = DH / ROWS; // 256 x 225
var GUT = 16; // sew-line gutter between squares
var IW = PITCHX - GUT, IH = PITCHY - GUT; // 240 x 209 inner square
// Fixed authored layout. C celestial, T tweed, P pinstripe,
// D damask, S star. Each generator appears exactly 4 times.
var LAYOUT = [
  'C', 'T', 'P', 'D', 'S',
  'P', 'D', 'S', 'C', 'T',
  'D', 'S', 'T', 'P', 'C',
  'S', 'C', 'D', 'T', 'P'
];
if (LAYOUT.length !== COLS * ROWS) throw new Error('layout must hold exactly 20 squares');
(function () {
  var counts = { C: 0, T: 0, P: 0, D: 0, S: 0 };
  for (var i = 0; i < LAYOUT.length; i++) {
    if (!(LAYOUT[i] in counts)) throw new Error('layout holds a sixth generator');
    counts[LAYOUT[i]]++;
  }
  var keys = ['C', 'T', 'P', 'D', 'S'];
  for (var k = 0; k < keys.length; k++) {
    if (counts[keys[k]] !== 4) throw new Error('each generator must appear exactly 4 times');
  }
})();

// ---- fixed per-cell seed tables (data, never runtime random) -
// Each square owns four authored seeds; a double-tap steps to
// the next one. Variant parameters derive from the seed by a
// deterministic integer hash, so every state is reproducible.
var SEEDS = [
  [1201, 5150, 9021, 3347], [2210, 7811, 1450, 6632],
  [3317, 2084, 7741, 5093], [4411, 6602, 2187, 8850],
  [5523, 3141, 9260, 4708], [6139, 8472, 1055, 2984],
  [7241, 4368, 5519, 9027], [8153, 2690, 6431, 3876],
  [9347, 5012, 1763, 7209], [1029, 8845, 3610, 5471],
  [2468, 1357, 8024, 6913], [3571, 9246, 2130, 4685],
  [4682, 5793, 3014, 8157], [5793, 4026, 9581, 1364],
  [6804, 7135, 2649, 5028], [7915, 3680, 4271, 9543],
  [8026, 6194, 5837, 2410], [9137, 4508, 7269, 3085],
  [1248, 8359, 4916, 6723], [2359, 5841, 3072, 8196]
];
if (SEEDS.length !== 20) throw new Error('seed table must hold 20 cells');
for (var si = 0; si < SEEDS.length; si++) {
  if (SEEDS[si].length !== 4) throw new Error('each cell must hold exactly 4 seeds');
}

// Deterministic integer hash of an integer key, giving [0, 1).
function hashN(n) {
  n = n | 0;
  n = Math.imul(n ^ (n >>> 16), 2246822507);
  n = Math.imul(n ^ (n >>> 13), 3266489909);
  n = n ^ (n >>> 16);
  return (n >>> 0) / 4294967296;
}

// ---- variant parameters per generator, derived from a seed ---
function makeParams(gen, seed) {
  var i, key;
  if (gen === 'C') { // celestial: moon, sun, twinkling stars
    var stars = [];
    var n = 8 + Math.floor(hashN(seed + 11) * 6);
    for (i = 0; i < n; i++) {
      stars.push({
        fx: 0.08 + hashN(seed + 100 + i * 3) * 0.84,
        fy: 0.08 + hashN(seed + 200 + i * 3) * 0.84,
        r: 1.4 + hashN(seed + 300 + i) * 1.9,
        k: 1 + Math.floor(hashN(seed + 400 + i) * 3),
        ph: hashN(seed + 500 + i) * TAU
      });
    }
    var moonLeft = hashN(seed + 21) < 0.5;
    return {
      stars: stars,
      moonX: moonLeft ? 0.70 : 0.30, moonY: 0.34, moonR: 27 + hashN(seed + 22) * 8,
      sunX: moonLeft ? 0.28 : 0.72, sunY: 0.70, sunR: 15 + hashN(seed + 23) * 5
    };
  }
  if (gen === 'T') { // faux tweed: thread strokes as JS data
    var threads = [];
    var herring = hashN(seed + 31) < 0.5;
    var baseA = (hashN(seed + 32) - 0.5) * 0.14;
    var ri = 0;
    for (var yy = 7; yy < IH - 4; yy += 11, ri++) {
      var rowA = baseA + (herring && (ri % 2) ? 0.17 : -0.02);
      var xx = -6, ti = 0;
      while (xx < IW - 2) {
        key = seed + ri * 131 + ti * 17;
        var len = 13 + hashN(key) * 11;
        var cr = hashN(key + 5000);
        threads.push({
          x: xx + len / 2, y: yy, len: len,
          a: rowA + (hashN(key + 9000) - 0.5) * 0.3,
          col: cr < 0.40 ? BONE : (cr < 0.66 ? ROSE : (cr < 0.92 ? SLATE : BONE))
        });
        ti++;
        xx += len + 3 + hashN(key + 3000) * 5;
      }
    }
    return { threads: threads };
  }
  if (gen === 'P') { // pinstripe
    return {
      ang: [0, Math.PI / 2, 0.6, -0.6][Math.floor(hashN(seed + 41) * 4)],
      sp: [13, 17, 21][Math.floor(hashN(seed + 42) * 3)],
      dir: hashN(seed + 43) < 0.5 ? 1 : -1,
      shift: hashN(seed + 44)
    };
  }
  if (gen === 'D') { // twisty-floral damask
    return {
      cols: hashN(seed + 51) < 0.5 ? 2 : 3,
      flipAlt: hashN(seed + 52) < 0.6,
      twist: (hashN(seed + 53) - 0.5)
    };
  }
  // 'S': 8-point star
  return {
    mode: Math.floor(hashN(seed + 61) * 3),
    baseRot: hashN(seed + 62) * Math.PI / 4
  };
}

// ---- cells ----------------------------------------------------
var cells = [];
for (var ci = 0; ci < 20; ci++) {
  var gen = LAYOUT[ci];
  cells.push({
    gen: gen,
    seeds: SEEDS[ci],
    vi: 0,
    p: makeParams(gen, SEEDS[ci][0]),
    phase: ci * 2.399963,
    bandOff: (ci % 4) * 0.25,
    flashT: -10,
    x: (ci % COLS) * PITCHX + GUT / 2,
    y: Math.floor(ci / COLS) * PITCHY + GUT / 2,
    bg: gen === 'C' ? SLATE : GROUND
  });
}

// ---- the five mini generators (and no sixth) ------------------
function genCelestial(cell, x, y, w, h) {
  var p = cell.p, i, a;
  // sun: bone rays turning once per loop, gold disc
  var sx = x + p.sunX * w, sy = y + p.sunY * h;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(TAU * (T / LOOP));
  ctx.strokeStyle = BONE;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  for (i = 0; i < 8; i++) {
    a = i * Math.PI / 4;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * p.sunR * 1.3, Math.sin(a) * p.sunR * 1.3);
    ctx.lineTo(Math.cos(a) * p.sunR * 1.78, Math.sin(a) * p.sunR * 1.78);
    ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = GOLD;
  ctx.beginPath(); ctx.arc(sx, sy, p.sunR, 0, TAU); ctx.fill();
  // crescent moon: gold disc cut by a ground-of-cell disc
  var mx = x + p.moonX * w, my = y + p.moonY * h;
  ctx.fillStyle = GOLD;
  ctx.beginPath(); ctx.arc(mx, my, p.moonR, 0, TAU); ctx.fill();
  ctx.fillStyle = cell.bg;
  ctx.beginPath(); ctx.arc(mx + p.moonR * 0.42, my - p.moonR * 0.22, p.moonR * 0.86, 0, TAU); ctx.fill();
  // stars, twinkling on whole cycles of the master loop
  for (i = 0; i < p.stars.length; i++) {
    var st = p.stars[i];
    var tw = 0.5 + 0.5 * Math.sin(TAU * (st.k * T / LOOP) + st.ph + cell.phase);
    ctx.save();
    ctx.globalAlpha = 0.4 + 0.6 * tw;
    ctx.fillStyle = BONE;
    ctx.beginPath(); ctx.arc(x + st.fx * w, y + st.fy * h, st.r, 0, TAU); ctx.fill();
    if (st.r > 2.5) {
      ctx.strokeStyle = BONE;
      ctx.lineWidth = 1.6;
      var px = x + st.fx * w, py = y + st.fy * h, pl = st.r * 2.6;
      ctx.beginPath();
      ctx.moveTo(px - pl, py); ctx.lineTo(px + pl, py);
      ctx.moveTo(px, py - pl); ctx.lineTo(px, py + pl);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function genTweed(cell, x, y, w, h) {
  var p = cell.p;
  var frac = ((T / LOOP) + cell.bandOff) % 1;
  var bx = x - 70 + frac * (w + 140); // one sheen sweep per loop
  ctx.lineCap = 'round';
  for (var i = 0; i < p.threads.length; i++) {
    var th = p.threads[i];
    var cx = x + th.x, cy = y + th.y;
    var bright = Math.abs(cx - bx) < 30;
    ctx.strokeStyle = bright ? BONE : th.col;
    ctx.lineWidth = bright ? 3 : 2.2;
    var dx = Math.cos(th.a) * th.len / 2, dy = Math.sin(th.a) * th.len / 2;
    ctx.beginPath();
    ctx.moveTo(cx - dx, cy - dy);
    ctx.lineTo(cx + dx, cy + dy);
    ctx.stroke();
  }
}

function genPinstripe(cell, x, y, w, h) {
  var p = cell.p;
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  ctx.rotate(p.ang);
  var per = p.sp;
  var off = ((T / LOOP) * per * 2 * p.dir + p.shift * per) % per;
  if (off < 0) off += per;
  var R = Math.sqrt(w * w + h * h) / 2 + per;
  for (var lx = -R - per + off; lx < R + per; lx += per) {
    ctx.fillStyle = SLATE; ctx.fillRect(lx, -R, per * 0.36, 2 * R);
    ctx.fillStyle = ROSE; ctx.fillRect(lx + per * 0.52, -R, per * 0.22, 2 * R);
    ctx.fillStyle = BONE; ctx.fillRect(lx + per * 0.84, -R, per * 0.07, 2 * R);
  }
  ctx.restore();
}

function damaskMotif(cx, cy, tw, th, flip, twist, ph) {
  ctx.save();
  ctx.translate(cx, cy);
  if (flip) ctx.scale(-1, 1);
  var br = 1 + 0.03 * Math.sin(TAU * (T / LOOP) + ph);
  ctx.scale(br, br);
  // twisty stem
  ctx.strokeStyle = SLATE;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, th * 0.42);
  ctx.quadraticCurveTo(twist * tw * 0.55, th * 0.05, 0, -th * 0.06);
  ctx.stroke();
  // bone leaves
  ctx.fillStyle = BONE;
  for (var s = -1; s <= 1; s += 2) {
    ctx.save();
    ctx.translate(s * tw * 0.15, th * 0.15);
    ctx.rotate(s * 0.6);
    ctx.beginPath();
    ctx.ellipse(0, 0, tw * 0.13, th * 0.07, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  // bloom: six rose petals around a gold heart
  for (var i = 0; i < 6; i++) {
    var a = i * Math.PI / 3;
    ctx.fillStyle = ROSE;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * th * 0.085, -th * 0.17 + Math.sin(a) * th * 0.085, th * 0.075, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = GOLD;
  ctx.beginPath(); ctx.arc(0, -th * 0.17, th * 0.05, 0, TAU); ctx.fill();
  // flanking bone dots
  ctx.fillStyle = BONE;
  ctx.beginPath(); ctx.arc(-tw * 0.3, th * 0.3, 2.5, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(tw * 0.3, th * 0.3, 2.5, 0, TAU); ctx.fill();
  ctx.restore();
}

function genDamask(cell, x, y, w, h) {
  var p = cell.p;
  var cols = p.cols, rows = 2;
  var tw = w / cols, th = h / rows;
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      var flip = p.flipAlt && ((r + c) % 2 === 1);
      damaskMotif(x + c * tw + tw / 2, y + r * th + th / 2, tw, th, flip, p.twist, cell.phase + (r * cols + c) * 0.7);
    }
  }
}

function star8(cx, cy, R, rot, fill) {
  ctx.beginPath();
  for (var i = 0; i < 16; i++) {
    var a = rot + i * Math.PI / 8;
    var rad = (i % 2) ? R * 0.48 : R;
    var px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
}

function oneStar(cx, cy, R, rot, sparkle, ph) {
  star8(cx, cy, R, rot, GOLD);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.fillStyle = BONE;
  ctx.beginPath();
  ctx.moveTo(0, -R * 0.34); ctx.lineTo(R * 0.34, 0); ctx.lineTo(0, R * 0.34); ctx.lineTo(-R * 0.34, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = GROUND;
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.1, 0, TAU); ctx.fill();
  if (sparkle) {
    var tw = 0.5 + 0.5 * Math.sin(TAU * (2 * T / LOOP) + ph);
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.65 * tw;
    ctx.strokeStyle = BONE;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (var i = 0; i < 4; i++) {
      var a = Math.PI / 4 + i * Math.PI / 2;
      var px = cx + Math.cos(a) * R * 1.3, py = cy + Math.sin(a) * R * 1.3;
      ctx.beginPath();
      ctx.moveTo(px - 6, py); ctx.lineTo(px + 6, py);
      ctx.moveTo(px, py - 6); ctx.lineTo(px, py + 6);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function genStar(cell, x, y, w, h) {
  var p = cell.p;
  var rot = p.baseRot + TAU * (T / LOOP); // one whole turn per loop
  if (p.mode === 0) {
    oneStar(x + w / 2, y + h / 2, 56, rot, true, cell.phase);
  } else if (p.mode === 1) {
    var fx = [0.28, 0.72], fy = [0.30, 0.70];
    for (var r = 0; r < 2; r++) for (var c = 0; c < 2; c++) {
      oneStar(x + fx[c] * w, y + fy[r] * h, 26, rot, false, cell.phase);
    }
  } else {
    oneStar(x + w / 2, y + h / 2, 42, rot, true, cell.phase);
    var gx = [0.16, 0.84], gy = [0.18, 0.82];
    for (var r2 = 0; r2 < 2; r2++) for (var c2 = 0; c2 < 2; c2++) {
      oneStar(x + gx[c2] * w, y + gy[r2] * h, 12, rot, false, cell.phase);
    }
  }
}

var GEN = { C: genCelestial, T: genTweed, P: genPinstripe, D: genDamask, S: genStar };
if (Object.keys(GEN).length !== 5) throw new Error('exactly five mini generators, no sixth');

// ---- drawing ----------------------------------------------------
function drawCell(cell) {
  var x = cell.x, y = cell.y;
  ctx.save();
  ctx.fillStyle = cell.bg;
  ctx.fillRect(x, y, IW, IH);
  ctx.beginPath();
  ctx.rect(x, y, IW, IH);
  ctx.clip();
  GEN[cell.gen](cell, x, y, IW, IH);
  ctx.restore();
  // stitch-flash: a dashed seam flashing inside the square
  // right after a double-tap advances it
  var age = T - cell.flashT;
  if (age >= 0 && age < 0.45) {
    var fa = 1 - age / 0.45;
    ctx.save();
    ctx.globalAlpha = fa * 0.16;
    ctx.fillStyle = BONE;
    ctx.fillRect(x, y, IW, IH);
    ctx.globalAlpha = fa;
    ctx.strokeStyle = BONE;
    ctx.lineWidth = 3;
    ctx.setLineDash([9, 7]);
    ctx.strokeRect(x + 4.5, y + 4.5, IW - 9, IH - 9);
    ctx.restore();
    ctx.setLineDash([]);
  }
}

function sewLines() {
  ctx.save();
  ctx.strokeStyle = BONE;
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = 2.5;
  ctx.setLineDash([10, 8]);
  ctx.beginPath();
  for (var k = 1; k < COLS; k++) { ctx.moveTo(k * PITCHX, 6); ctx.lineTo(k * PITCHX, DH - 6); }
  for (var k2 = 1; k2 < ROWS; k2++) { ctx.moveTo(6, k2 * PITCHY); ctx.lineTo(DW - 6, k2 * PITCHY); }
  ctx.stroke();
  ctx.beginPath();
  ctx.rect(4, 4, DW - 8, DH - 8);
  ctx.stroke();
  ctx.restore();
  ctx.setLineDash([]);
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  for (var i = 0; i < cells.length; i++) drawCell(cells[i]);
  sewLines();
}

// ---- sizing: full-bleed field, cover-fit ------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- double-tap: advance one square in its fixed seed table ---
function toDesign(e) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
function advance(idx) {
  var cell = cells[idx];
  cell.vi = (cell.vi + 1) % cell.seeds.length;
  cell.p = makeParams(cell.gen, cell.seeds[cell.vi]);
  cell.flashT = T;
}
var lastTapCell = -1, lastTapTime = -100000;
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  var col = Math.floor(p[0] / PITCHX), row = Math.floor(p[1] / PITCHY);
  if (col < 0 || col >= COLS || row < 0 || row >= ROWS) { lastTapCell = -1; return; }
  var idx = row * COLS + col;
  var now = (typeof e.timeStamp === 'number') ? e.timeStamp : 0;
  if (idx === lastTapCell && now - lastTapTime <= 350) {
    advance(idx);
    lastTapCell = -1;
    lastTapTime = -100000;
  } else {
    lastTapCell = idx;
    lastTapTime = now;
  }
});

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
