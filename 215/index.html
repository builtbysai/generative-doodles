<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.215 Debris Sun</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#07080A; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.215 Debris Sun (David Bowen, after SPACEJUNK). Fifty twigs
// planted in the dark, all leaning the same way like sunflowers,
// tracking the oldest piece of space debris currently above the
// horizon from a small catalog of objects launched 1958 to 1972.
// The tracked object is only a tiny dim amber point, high in the
// frame. Bowen never labeled them; neither does this. When the
// object sets, every twig lowers to rest, pointing down, and waits
// for the next oldest to rise. Double tap advances early.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#07080A';
var TWIG = '#5C4A33', TIP = '#7A6244', GLOW = '#D8B46A';
var W = 0, H = 0, phone = false;
var seed = 215215;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
var T = 0, lastNow = -1;

// ---- the catalog: twelve objects, 1958-1972 -----------------------------------------
// angle(t) = phase + 2pi * t / period. Elevation uses inclination;
// azimuth runs with the angle. Speeds are chosen so a pass lasts
// roughly a minute or two: the oldest is not always up.
var CATALOG = [
  { year: 1958, period: 150, incl: 0.92, phase: 2.2 },
  { year: 1959, period: 118, incl: 0.78, phase: 5.1 },
  { year: 1960, period: 175, incl: 1.00, phase: 0.4 },
  { year: 1961, period: 132, incl: 0.66, phase: 3.6 },
  { year: 1962, period: 196, incl: 0.88, phase: 1.2 },
  { year: 1963, period: 108, incl: 0.74, phase: 4.4 },
  { year: 1965, period: 162, incl: 0.95, phase: 2.9 },
  { year: 1966, period: 124, incl: 0.70, phase: 0.9 },
  { year: 1968, period: 186, incl: 0.84, phase: 5.6 },
  { year: 1969, period: 142, incl: 0.90, phase: 1.7 },
  { year: 1971, period: 114, incl: 0.72, phase: 3.1 },
  { year: 1972, period: 205, incl: 0.98, phase: 4.9 }
];
var skipTime = 0; // double tap advances the piece's private sky clock
function skyT() { return T + skipTime; }
function objPos(o, t) {
  var a = o.phase + 6.28318 * t / o.period;
  return { az: a, el: Math.sin(a) * o.incl };
}
function trackedAt(t) {
  for (var i = 0; i < CATALOG.length; i++) {
    var p = objPos(CATALOG[i], t);
    if (p.el > 0.02) return { o: CATALOG[i], p: p, ix: i };
  }
  return null;
}
var REST = 1.5708; // lean angle for rest: straight down
function targetLean(t) {
  var tr = trackedAt(t);
  if (!tr) return { ang: REST, tracked: null, el: 0 };
  // lean angle: 0 = straight up, positive tilts toward +x azimuth
  var dirx = Math.cos(tr.p.az), diry = -Math.abs(Math.sin(tr.p.az)) * 0 - tr.p.el;
  var ang = Math.atan2(dirx, tr.p.el + 0.18);
  return { ang: clamp(ang, -1.25, 1.25), tracked: tr, el: tr.p.el, az: tr.p.az };
}

// ---- the twigs -----------------------------------------------------------------------
var TWIGS = 50;
var twigs = [];
(function build() {
  var cols = 10, rows = 5;
  for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
    twigs.push({
      fx: (c + 0.5) / cols + (rand() - 0.5) * 0.045,
      fy: r / (rows - 1),
      len: 0.55 + rand() * 0.5,
      lag: 5.5 + rand() * 5.5,          // spring rate: plants, not robots
      ph: rand() * 6.28,
      nubs: [0.35 + rand() * 0.2, 0.6 + rand() * 0.2],
      nubSide: rand() < 0.5 ? -1 : 1,
      ang: 0, vel: 0
    });
  }
})();
// pre-settle: run the springs against a shifted clock so frame one
// already leans in unison, tremor on
(function settle() {
  var tgt = targetLean(0).ang;
  for (var i = 0; i < twigs.length; i++) { twigs[i].ang = tgt + (rand() - 0.5) * 0.05; }
})();
function stepTwigs(dt, tAbs) {
  var tgt = targetLean(tAbs).ang;
  for (var i = 0; i < twigs.length; i++) {
    var tw = twigs[i];
    var k = tw.lag, c = 2 * Math.sqrt(k); // critically damped
    var acc = (tgt - tw.ang) * k - tw.vel * c;
    tw.vel += acc * dt;
    tw.ang += tw.vel * dt;
  }
  return tgt;
}

// ---- input ---------------------------------------------------------------------------------
var lastDownT = -9;
canvas.addEventListener('pointerdown', function (e) {
  if (T - lastDownT < 0.35) {
    // advance: jump the sky clock to just before the next rise
    var t = skyT(), best = Infinity;
    for (var i = 0; i < CATALOG.length; i++) {
      var o = CATALOG[i];
      var aNow = (o.phase + 6.28318 * t / o.period) % 6.28318;
      if (aNow < 0) aNow += 6.28318;
      var dA = (6.28318 - aNow) % 6.28318;      // angle until az wraps (el rising through 0)
      var dtRise = dA / 6.28318 * o.period + 0.5;
      if (dtRise < best) best = dtRise;
    }
    if (best < Infinity) skipTime += best;
    lastDownT = -9;
  } else lastDownT = T;
});

// ---- resize -----------------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drawing -------------------------------------------------------------------------------------
function draw(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  if (dt > 0) { var steps = Math.max(1, Math.round(dt / (1 / 120))); for (var s = 0; s < steps; s++) stepTwigs(dt / steps, skyT()); }
  var tl = targetLean(skyT());
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var horizonY = H * 0.34;
  // the tracked object: a tiny dim amber point, high in the frame
  if (tl.tracked) {
    var mx = W * (0.5 + Math.cos(tl.az) * 0.34);
    var my = horizonY - tl.el * H * 0.20;
    var pulse = 0.75 + 0.25 * Math.sin(T * 1.7);
    var gr = ctx.createRadialGradient(mx, my, 0, mx, my, H * 0.035);
    gr.addColorStop(0, 'rgba(216,180,106,' + (0.5 * pulse).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(216,180,106,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(mx, my, H * 0.035, 0, 6.2832); ctx.fill();
    ctx.fillStyle = GLOW;
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(mx, my, Math.max(1.6, H * 0.0028), 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // the twigs: lower two-thirds, bases stepping up with depth
  ctx.lineCap = 'round';
  for (var i = 0; i < twigs.length; i++) {
    var tw = twigs[i];
    var bx = tw.fx * W;
    var by = lerp(H * 0.70, H * 0.985, tw.fy);
    var len = tw.len * H * (0.16 + tw.fy * 0.13);
    var tremor = Math.sin(T * 2.1 + tw.ph) * 0.006 + Math.sin(T * 5.3 + tw.ph * 1.7) * 0.003;
    var ang = tw.ang + tremor;
    var dx = Math.sin(ang), dy = -Math.cos(ang);
    var tipx = bx + dx * len, tipy = by + dy * len;
    var lwBase = Math.max(1.6, H * 0.0042) * (0.7 + tw.fy * 0.5);
    // tapered shaft: two passes, thick base to thin tip
    ctx.strokeStyle = TWIG;
    ctx.lineWidth = lwBase;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + dx * len * 0.45, by + dy * len * 0.45); ctx.stroke();
    ctx.strokeStyle = TIP;
    ctx.lineWidth = Math.max(1, lwBase * 0.55);
    ctx.beginPath(); ctx.moveTo(bx + dx * len * 0.45, by + dy * len * 0.45); ctx.lineTo(tipx, tipy); ctx.stroke();
    // broken side-branch nubs
    ctx.strokeStyle = TWIG;
    ctx.lineWidth = Math.max(0.8, lwBase * 0.5);
    for (var nb = 0; nb < 2; nb++) {
      var f0 = tw.nubs[nb];
      var px = bx + dx * len * f0, py = by + dy * len * f0;
      var na = ang + tw.nubSide * (0.7 + nb * 0.25);
      var nl = len * 0.12;
      ctx.beginPath(); ctx.moveTo(px, py);
      ctx.lineTo(px + Math.sin(na) * nl, py - Math.cos(na) * nl); ctx.stroke();
    }
    // the planted foot: a breath of shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(bx, by + 2, lwBase * 1.7, lwBase * 0.55, 0, 0, 6.2832); ctx.fill();
  }
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
