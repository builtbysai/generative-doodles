<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Seven Corrugation</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0B0D; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  buildStars();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

var PAPER = [239, 233, 218], VALLEY = [90, 107, 140], CREASE = '#D8D0BE';
function mix(a, b, f) {
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
var stars = [];
function buildStars() {
  stars = [];
  var R = Math.min(W, H) / 8.6;
  var dx = R * 1.66, dy = R * 1.47;
  var sheetR = W * 0.945, sheetB = H * 0.93;
  var row = 0;
  for (var y = R * 0.4; y < sheetB + R; y += dy, row++) {
    for (var x = R * 0.4 + (row % 2 ? dx / 2 : 0); x < sheetR + R; x += dx) {
      stars.push({ x: x, y: y, R: R });
    }
  }
  buildStars.sheet = { r: sheetR, b: sheetB, R: R };
}
function starOutline(cx, cy, R) {
  var pts = [];
  for (var k = 0; k < 7; k++) {
    var a = -Math.PI / 2 + k * 2 * Math.PI / 7;
    pts.push([cx + Math.cos(a) * R, cy + Math.sin(a) * R]);
    var a2 = a + Math.PI / 7;
    pts.push([cx + Math.cos(a2) * R * 0.60, cy + Math.sin(a2) * R * 0.60]);
  }
  return pts;
}
function poly(pts, fill) {
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath(); ctx.fill();
}
function drawStar(s, lightAz) {
  var pts = starOutline(s.x, s.y, s.R);
  // valley shadow: the star silhouette cast onto the sheet valleys
  var ox = Math.cos(lightAz) * s.R * 0.16, oy = Math.sin(lightAz) * s.R * 0.16;
  var sh = [];
  for (var i = 0; i < pts.length; i++) sh.push([pts[i][0] + ox, pts[i][1] + oy]);
  ctx.globalAlpha = 0.55;
  poly(sh, 'rgb(90,107,140)');
  ctx.globalAlpha = 1;
  // 7 petals, two flat triangles each
  for (var k = 0; k < 7; k++) {
    var o1 = pts[k * 2], in1 = pts[k * 2 + 1], o2 = pts[(k * 2 + 2) % 14];
    var c = [s.x, s.y];
    var mid1 = Math.atan2((o1[1] + in1[1]) / 2 - s.y, (o1[0] + in1[0]) / 2 - s.x);
    var mid2 = Math.atan2((in1[1] + o2[1]) / 2 - s.y, (in1[0] + o2[0]) / 2 - s.x);
    var v1 = 0.5 + 0.5 * Math.cos(mid1 - lightAz);
    var v2 = 0.5 + 0.5 * Math.cos(mid2 - lightAz);
    poly([c, o1, in1], mix(VALLEY, PAPER, 0.25 + 0.75 * v1 * v1));
    poly([c, in1, o2], mix(VALLEY, PAPER, 0.25 + 0.75 * v2 * v2 * 0.82));
  }
  ctx.strokeStyle = CREASE; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var j = 1; j < pts.length; j++) ctx.lineTo(pts[j][0], pts[j][1]);
  ctx.closePath(); ctx.stroke();
  for (var m = 0; m < 7; m++) {
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(pts[m * 2][0], pts[m * 2][1]);
    ctx.stroke();
  }
}
function draw(t) {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#0B0B0D'; ctx.fillRect(0, 0, W, H);
  var sheet = buildStars.sheet || { r: W * 0.945, b: H * 0.93, R: 40 };
  var lightAz = t < 24 ? (t / 24) * Math.PI * 2 : 0;
  // sheet side edge (thickness) along right and bottom, then the top face
  ctx.fillStyle = mix(VALLEY, PAPER, 0.30);
  ctx.fillRect(sheet.r, 0, W - sheet.r > 14 ? 14 : W - sheet.r, sheet.b + 10);
  ctx.fillRect(0, sheet.b, sheet.r + 10, 10);
  ctx.fillStyle = '#D8D0BE';
  ctx.fillRect(0, 0, sheet.r, sheet.b);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, sheet.r, sheet.b); ctx.clip();
  for (var i = 0; i < stars.length; i++) drawStar(stars[i], lightAz);
  ctx.restore();
}
resize();
var T0 = Date.now() - 6000;
function frame() {
  var t = ((Date.now() - T0) / 1000) % 30;
  draw(t);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
draw(6);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
