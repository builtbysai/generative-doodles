<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lost in the Rain</title>
<style>
  html, body { margin: 0; padding: 0; background: #3A3F45; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never unseeded randomness.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1375000);

  // Rain field: seeded fractions, speeds, lengths, slants.
  var NDROPS = 240;
  var drops = [];
  for (var i = 0; i < NDROPS; i++) {
    var r = mulberry32(1375000 + i * 7919);
    drops.push({
      fx: r(), fy: r(),
      speed: 260 + r() * 420,
      len: 10 + r() * 14,
      slant: -14 - r() * 18,
      a: 0.18 + r() * 0.30
    });
  }
  // Crackle speckles: seeded positions for the vinyl crackle flash.
  var speckles = [];
  for (var j = 0; j < 48; j++) {
    var rs = mulberry32(1375000 + 9000 + j * 7919);
    speckles.push({ fx: rs(), fy: rs(), s: 1 + rs() * 2 });
  }
  // Fire circle geometry (B-side), seeded flicker phases.
  var fires = [];
  for (var k = 0; k < 7; k++) {
    var rf = mulberry32(1375000 + 5000 + k * 7919);
    fires.push({ ang: (k / 7) * Math.PI * 2, ph: rf() * Math.PI * 2 });
  }

  var side = 0; // 0 = A-side (highway rain), 1 = B-side (night rain)
  var drag = null; // {startY, curY}
  var anim = null; // {t0, dur, from, to, target}
  var nowT = 0;

  function viewport() {
    var w, h;
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    return { w: w, h: h };
  }
  function isPhone(w, h) {
    var sw = w, sh = h;
    if (typeof window.screen !== 'undefined' && window.screen &&
        window.screen.width && window.screen.height) {
      sw = window.screen.width; sh = window.screen.height;
    }
    if (Math.min(sw, sh) < 700) return true;
    return h > w * 1.15;
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function mod(v, m) { var r = v % m; return r < 0 ? r + m : r; }
  function ease(t) { return t * t * (3 - 2 * t); }

  // Wipe state: returns {wipe, target} where wipe in [0,1] reveals target side.
  function wipeState(t) {
    if (drag) {
      var dy = drag.curY - drag.startY;
      if (side === 0) {
        if (dy <= 0) return { wipe: 0, target: 1 };
        return { wipe: clamp(dy / drag.h, 0, 1), target: 1 };
      }
      if (dy >= 0) return { wipe: 0, target: 0 };
      return { wipe: clamp(-dy / drag.h, 0, 1), target: 0 };
    }
    if (anim) {
      var p = clamp((t - anim.t0) / anim.dur, 0, 1);
      var w = anim.from + (anim.to - anim.from) * ease(p);
      if (p >= 1) {
        if (anim.to === 1) side = anim.target;
        anim = null;
        return { wipe: 0, target: side };
      }
      return { wipe: w, target: anim.target };
    }
    return { wipe: 0, target: side };
  }

  function hillPath(ctx2, w, base, amp, ph, n) {
    ctx2.beginPath();
    ctx2.moveTo(0, base);
    for (var x = 0; x <= w; x += 16) {
      var y = base
        + Math.sin(x * 0.004 + ph) * amp
        + Math.sin(x * 0.011 + ph * 2.0) * amp * 0.4;
      ctx2.lineTo(x, y);
    }
    ctx2.lineTo(w, base + amp * 2);
    ctx2.lineTo(0, base + amp * 2);
    ctx2.closePath();
  }

  function drawRain(w, h, t, rising) {
    ctx.lineWidth = 1;
    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      var x = mod(d.fx * w + d.slant * t, w);
      var y = rising
        ? mod(d.fy * h - d.speed * t, h)
        : mod(d.fy * h + d.speed * t, h);
      var dir = rising ? -1 : 1;
      ctx.strokeStyle = 'rgba(216,222,228,' + d.a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(x, y - dir * d.len);
      ctx.lineTo(x, y);
      ctx.stroke();
    }
  }

  function drawSide(s, w, h, t) {
    if (s === 0) {
      // A-side: rain over a highway landscape.
      ctx.fillStyle = '#7A838C';
      ctx.fillRect(0, 0, w, h);
      // Layered experience bands: translucent hills drifting slowly.
      ctx.fillStyle = 'rgba(58,63,69,0.35)';
      hillPath(ctx, w, h * 0.52 + Math.sin(t * 0.1) * 8, 26, 1.2, 0);
      ctx.fill();
      ctx.fillStyle = 'rgba(46,50,55,0.45)';
      hillPath(ctx, w, h * 0.60, 34, 4.1, 0);
      ctx.fill();
      // Shoulder strip, then the wet asphalt road band.
      ctx.fillStyle = '#2E3338';
      ctx.fillRect(0, h * 0.68, w, h * 0.04);
      ctx.fillStyle = '#3A3F45';
      ctx.fillRect(0, h * 0.72, w, h * 0.28);
      // Road dashes.
      ctx.fillStyle = 'rgba(232,217,160,0.55)';
      var dashW = 46, gap = 54;
      for (var dx = 0; dx < w + dashW; dx += dashW + gap) {
        ctx.fillRect(dx, h * 0.845, dashW, 3);
      }
      // Headlights: a pair of pale glows drifting across the road.
      var hx = mod(0.15 * w + 34 * t, w + 240) - 120;
      ctx.fillStyle = 'rgba(232,217,160,0.28)';
      ctx.beginPath();
      ctx.ellipse(hx, h * 0.80, 46, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(hx + 64, h * 0.80, 46, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(232,217,160,0.16)';
      ctx.beginPath();
      ctx.moveTo(hx - 10, h * 0.80);
      ctx.lineTo(hx - 150, h * 0.72);
      ctx.lineTo(hx - 150, h * 0.88);
      ctx.closePath();
      ctx.fill();
      // Rain falls downward.
      drawRain(w, h, t, false);
    } else {
      // B-side: the same landscape at night, stranger.
      ctx.fillStyle = '#0B0E14';
      ctx.fillRect(0, 0, w, h);
      // Faint night hills.
      ctx.fillStyle = 'rgba(20,26,34,0.9)';
      hillPath(ctx, w, h * 0.55, 30, 2.6, 0);
      ctx.fill();
      // Ground band.
      ctx.fillStyle = '#12161D';
      ctx.fillRect(0, h * 0.72, w, h * 0.28);
      // Peyote-meeting circle of small fires.
      var cx = w * 0.5, cy = h * 0.82, rad = Math.min(w, h) * 0.16;
      for (var f = 0; f < fires.length; f++) {
        var fa = fires[f];
        var fx = cx + Math.cos(fa.ang) * rad;
        var fy = cy + Math.sin(fa.ang) * rad * 0.55;
        var fl = 0.75 + 0.25 * Math.sin(t * 7 + fa.ph);
        ctx.fillStyle = 'rgba(212,105,42,0.20)';
        ctx.beginPath();
        ctx.ellipse(fx, fy, 16 * fl, 7 * fl, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#D4692A';
        ctx.beginPath();
        ctx.moveTo(fx, fy - 16 * fl);
        ctx.bezierCurveTo(fx + 8, fy - 6, fx + 5, fy + 4, fx, fy + 6);
        ctx.bezierCurveTo(fx - 5, fy + 4, fx - 8, fy - 6, fx, fy - 16 * fl);
        ctx.fill();
      }
      // Lone figure walking against the rain's slant (rain slants left
      // as it rises, so the figure walks right), head bowed.
      var figX = mod(0.1 * w + 22 * t, w + 120) - 60;
      var figY = h * 0.60 + Math.sin(t * 2.4) * 2;
      ctx.strokeStyle = '#D8D2C2';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(figX, figY - 26);
      ctx.lineTo(figX + 3, figY);
      ctx.stroke();
      ctx.fillStyle = '#D8D2C2';
      ctx.beginPath();
      ctx.arc(figX + 5, figY - 33, 6, 0, Math.PI * 2);
      ctx.fill();
      // Rain falls upward.
      drawRain(w, h, t, true);
    }
  }

  function draw(t) {
    nowT = t;
    var vp = viewport();
    var w = vp.w, h = vp.h;
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    void isPhone(w, h); // composition is full-bleed on every size.

    var ws = wipeState(t);
    drawSide(side, w, h, t);
    if (ws.wipe > 0) {
      var target = ws.target;
      ctx.save();
      ctx.beginPath();
      if (side === 0) {
        // Dragging down: target revealed from the top.
        ctx.rect(0, 0, w, ws.wipe * h);
      } else {
        // Dragging up: target revealed from the bottom.
        ctx.rect(0, h - ws.wipe * h, w, ws.wipe * h);
      }
      ctx.clip();
      drawSide(target, w, h, t);
      ctx.restore();
      // Vinyl crackle flash: brief flat-alpha flicker while wiping.
      var flash = 0.30 * (0.5 + 0.5 * Math.sin(t * 47));
      ctx.fillStyle = 'rgba(232,232,228,' + flash.toFixed(3) + ')';
      for (var s = 0; s < speckles.length; s++) {
        var sp = speckles[s];
        ctx.fillRect(sp.fx * w, sp.fy * h, sp.s, sp.s);
      }
    }
    // Side indicator: a thin pulsing label-circle at the right edge,
    // no words, never letters. Colour marks the side: headlight pale
    // for A, fire orange for B.
    var col = side === 0 ? '#E8D9A0' : '#D4692A';
    var pr = 13 + 3 * Math.sin(t * Math.PI * 2 / 4);
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(w - 26, h * 0.5, pr, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(w - 26, h * 0.5, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  function onDown(e) {
    if (anim) return;
    var y = (typeof e.clientY !== 'undefined') ? e.clientY : 0;
    drag = { startY: y, curY: y, h: viewport().h };
  }
  function onMove(e) {
    if (!drag) return;
    drag.curY = (typeof e.clientY !== 'undefined') ? e.clientY : drag.curY;
  }
  function onUp() {
    if (!drag) return;
    var ws = wipeState(nowT);
    var target = side === 0 ? 1 : 0;
    if (ws.wipe >= 0.35) {
      anim = { t0: nowT, dur: 0.6, from: ws.wipe, to: 1, target: target };
    } else {
      anim = { t0: nowT, dur: 0.5, from: ws.wipe, to: 0, target: target };
    }
    drag = null;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // Frame one is the A-side at a constant phase.
  draw(0);

  var startTime = null;
  function loop(ts) {
    if (startTime === null) startTime = ts;
    var t = (ts - startTime) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
