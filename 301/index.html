<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.301 Babushka Stack</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#141414; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.301 Babushka Stack (Ali Fisher).
// Three zone doll: a head in a babushka scarf on top, a peony
// flower torso in the middle, a striped pot as the base. Bold
// ink outlines, flat colour accents, black field behind like
// flash printed on a black tee. Tap the head and the animal
// changes: grumpy cat, chihuahua, croc, mermaid, each with its
// own scarf pattern. The petal spiral turns on a 30 second
// loop and the pot sways two degrees. Tapping never reloads.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var INK = '#141414', PAPER = '#F3E9DC', SCARF = '#C73E1D', WHITE = '#FFFFFF';
var PINK = '#E8A0A8', NAVY = '#1B2A4A', MUSTARD = '#E0A437';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 7.5, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var CX = 640;

var ZONES = ['head', 'torso', 'pot'];
if (ZONES.length !== 3) throw new Error('Babushka Stack needs exactly 3 zones');
var HEADS = ['cat', 'chihuahua', 'croc', 'mermaid'];
if (HEADS.length !== 4) throw new Error('Babushka Stack needs exactly 4 heads');
var headIdx = 0;

function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function oval(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }

// ---- scarf --------------------------------------------------------
// One babushka silhouette for every head: a rounded hood that
// frames the face and ties in a knot under the chin. Only the
// pattern clipped inside changes with the animal.
function scarfPath() {
  ctx.beginPath();
  ctx.moveTo(CX, 62);
  ctx.bezierCurveTo(742, 62, 786, 132, 782, 224);
  ctx.bezierCurveTo(779, 286, 752, 322, 706, 344);
  ctx.lineTo(690, 322);
  ctx.bezierCurveTo(730, 300, 742, 262, 740, 214);
  ctx.bezierCurveTo(738, 146, 700, 104, CX, 104);
  ctx.bezierCurveTo(580, 104, 542, 146, 540, 214);
  ctx.bezierCurveTo(538, 262, 550, 300, 590, 322);
  ctx.lineTo(574, 344);
  ctx.bezierCurveTo(528, 322, 501, 286, 498, 224);
  ctx.bezierCurveTo(494, 132, 538, 62, CX, 62);
  ctx.closePath();
}
function drawScarfPattern(kind) {
  ctx.save();
  scarfPath();
  ctx.clip();
  var i, x, y;
  if (kind === 'cat') {
    // white polka dots
    ctx.fillStyle = WHITE;
    var rows = [[96, 540], [96, 640], [96, 740], [132, 590], [132, 690], [168, 530], [168, 750], [210, 515], [252, 545], [252, 735], [292, 600], [292, 690]];
    // dots placed in the hood ring only; face drawn after covers centre
    var dots = [[540, 110], [640, 88], [740, 110], [515, 180], [765, 180], [520, 258], [760, 258], [575, 322], [705, 322], [640, 338]];
    for (i = 0; i < dots.length; i++) { ctx.beginPath(); ctx.arc(dots[i][0], dots[i][1], 11, 0, Math.PI * 2); ctx.fill(); }
    for (i = 0; i < rows.length; i++) { /* data kept simple, dots above are the pattern */ }
  } else if (kind === 'chihuahua') {
    // white diagonal stripes
    ctx.strokeStyle = WHITE; ctx.lineWidth = 13; ctx.lineCap = 'butt';
    for (i = -2; i < 9; i++) {
      x = 470 + i * 46;
      ctx.beginPath(); ctx.moveTo(x, 360); ctx.lineTo(x + 130, 50); ctx.stroke();
    }
  } else if (kind === 'croc') {
    // white barbed wire zigzag bands
    ctx.strokeStyle = WHITE; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    var bands = [118, 168, 222, 300];
    for (var b = 0; b < bands.length; b++) {
      y = bands[b];
      ctx.beginPath();
      for (x = 492; x <= 788; x += 24) {
        var yy = y + (((x - 492) / 24) % 2 === 0 ? -10 : 10);
        if (x === 492) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
      }
      ctx.stroke();
      ctx.lineWidth = 4;
      for (x = 504; x <= 780; x += 48) {
        ctx.beginPath(); ctx.moveTo(x - 6, y - 16); ctx.lineTo(x + 6, y + 16); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + 6, y - 16); ctx.lineTo(x - 6, y + 16); ctx.stroke();
      }
      ctx.lineWidth = 6;
    }
  } else {
    // white waves
    ctx.strokeStyle = WHITE; ctx.lineWidth = 7; ctx.lineCap = 'round';
    var wy = [112, 158, 214, 258, 292, 326];
    for (var w2 = 0; w2 < wy.length; w2++) {
      y = wy[w2];
      ctx.beginPath();
      for (x = 490; x <= 790; x += 6) {
        var yv = y + Math.sin((x - 490) * 0.055) * 9;
        if (x === 490) ctx.moveTo(x, yv); else ctx.lineTo(x, yv);
      }
      ctx.stroke();
    }
  }
  ctx.restore();
}
function drawScarf() {
  var kind = HEADS[headIdx];
  scarfPath();
  ctx.fillStyle = SCARF;
  ctx.fill();
  drawScarfPattern(kind);
  scarfPath();
  ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.stroke();
  // knot under the chin
  oval(CX, 352, 26, 20);
  ctx.fillStyle = SCARF; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
}

// ---- heads ----------------------------------------------------------
function faceBase(rx, ry, cy) {
  oval(CX, cy, rx, ry);
  ctx.fillStyle = PAPER; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 6.5; ctx.stroke();
}
function drawCat() {
  // ears poking above the scarf line, inside the hood top
  ctx.fillStyle = PAPER; ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(556, 128); ctx.lineTo(566, 76); ctx.lineTo(606, 112); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(724, 128); ctx.lineTo(714, 76); ctx.lineTo(674, 112); ctx.closePath(); ctx.fill(); ctx.stroke();
  faceBase(102, 96, 212);
  // heavy lidded grumpy eyes: lids half down, pupils low
  ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(566, 196); ctx.lineTo(622, 202); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(658, 202); ctx.lineTo(714, 196); ctx.stroke();
  oval(594, 218, 13, 10); ctx.fillStyle = INK; ctx.fill();
  oval(686, 218, 13, 10); ctx.fillStyle = INK; ctx.fill();
  ctx.beginPath(); ctx.moveTo(566, 190); ctx.quadraticCurveTo(594, 182, 622, 196); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(658, 196); ctx.quadraticCurveTo(686, 182, 714, 190); ctx.stroke();
  // small nose and a flat, unimpressed mouth
  ctx.beginPath(); ctx.moveTo(628, 238); ctx.lineTo(652, 238); ctx.lineTo(640, 250); ctx.closePath();
  ctx.fillStyle = INK; ctx.fill();
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(600, 272); ctx.lineTo(680, 272); ctx.stroke();
  // whiskers
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(552, 244); ctx.lineTo(518, 236); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(552, 260); ctx.lineTo(520, 264); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(728, 244); ctx.lineTo(762, 236); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(728, 260); ctx.lineTo(760, 264); ctx.stroke();
}
function drawChihuahua() {
  // big upright ears outside the face, under the hood edge
  ctx.fillStyle = PAPER; ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(560, 150); ctx.lineTo(520, 62); ctx.lineTo(596, 96); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(720, 150); ctx.lineTo(760, 62); ctx.lineTo(684, 96); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(556, 138); ctx.lineTo(538, 88); ctx.lineTo(578, 108); ctx.closePath();
  ctx.fillStyle = PINK; ctx.fill();
  ctx.beginPath(); ctx.moveTo(724, 138); ctx.lineTo(742, 88); ctx.lineTo(702, 108); ctx.closePath(); ctx.fill();
  faceBase(96, 92, 216);
  // long little snout
  oval(CX, 262, 42, 30);
  ctx.fillStyle = PAPER; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 5.5; ctx.stroke();
  oval(CX, 246, 16, 11); ctx.fillStyle = INK; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(CX, 257); ctx.lineTo(CX, 272); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX, 272); ctx.quadraticCurveTo(624, 284, 610, 276); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX, 272); ctx.quadraticCurveTo(656, 284, 670, 276); ctx.stroke();
  // big round eyes
  oval(592, 204, 17, 20); ctx.fillStyle = INK; ctx.fill();
  oval(688, 204, 17, 20); ctx.fillStyle = INK; ctx.fill();
  oval(597, 197, 6, 7); ctx.fillStyle = WHITE; ctx.fill();
  oval(693, 197, 6, 7); ctx.fillStyle = WHITE; ctx.fill();
  // worried brows
  ctx.strokeStyle = INK; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(570, 168); ctx.quadraticCurveTo(592, 158, 614, 166); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(666, 166); ctx.quadraticCurveTo(688, 158, 710, 168); ctx.stroke();
}
function drawCroc() {
  // broad flat head first, then the long snout below the eyes
  faceBase(100, 88, 196);
  ctx.beginPath();
  ctx.moveTo(566, 232);
  ctx.lineTo(714, 232);
  ctx.quadraticCurveTo(732, 232, 730, 264);
  ctx.quadraticCurveTo(728, 300, 690, 304);
  ctx.lineTo(590, 304);
  ctx.quadraticCurveTo(552, 300, 550, 264);
  ctx.quadraticCurveTo(548, 232, 566, 232);
  ctx.closePath();
  ctx.fillStyle = PAPER; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 6.5; ctx.stroke();
  // a few scale arcs near the top of the snout only
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (var i = 0; i < 4; i++) {
    ctx.beginPath(); ctx.arc(592 + i * 32, 252, 11, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  }
  // nostrils near the snout tip
  oval(600, 282, 8, 6); ctx.fillStyle = INK; ctx.fill();
  oval(680, 282, 8, 6); ctx.fillStyle = INK; ctx.fill();
  // jaw line, then big jagged teeth hanging from it
  ctx.strokeStyle = INK; ctx.lineWidth = 5.5;
  ctx.beginPath(); ctx.moveTo(556, 296); ctx.lineTo(724, 296); ctx.stroke();
  ctx.fillStyle = WHITE; ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineJoin = 'round';
  for (var t = 0; t < 6; t++) {
    var tx = 570 + t * 27;
    ctx.beginPath(); ctx.moveTo(tx, 296); ctx.lineTo(tx + 15, 296); ctx.lineTo(tx + 7, 316); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // eye bumps riding on top of the head, pupils inside
  oval(588, 116, 27, 23); ctx.fillStyle = PAPER; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
  oval(692, 116, 27, 23); ctx.fillStyle = PAPER; ctx.fill(); ctx.stroke();
  oval(588, 120, 9, 12); ctx.fillStyle = INK; ctx.fill();
  oval(692, 120, 9, 12); ctx.fillStyle = INK; ctx.fill();
  // heavy brow ridges above the snout
  ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(560, 196); ctx.quadraticCurveTo(596, 184, 624, 194); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(656, 194); ctx.quadraticCurveTo(684, 184, 720, 196); ctx.stroke();
}
function drawMermaid() {
  // wavy hair in navy falling either side of the face
  ctx.fillStyle = NAVY; ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(548, 300);
  ctx.quadraticCurveTo(520, 220, 540, 150);
  ctx.quadraticCurveTo(556, 96, 640, 92);
  ctx.quadraticCurveTo(724, 96, 740, 150);
  ctx.quadraticCurveTo(760, 220, 732, 300);
  ctx.quadraticCurveTo(712, 322, 700, 292);
  ctx.quadraticCurveTo(716, 240, 704, 190);
  ctx.lineTo(576, 190);
  ctx.quadraticCurveTo(564, 240, 580, 292);
  ctx.quadraticCurveTo(568, 322, 548, 300);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // wave lines in the hair
  ctx.strokeStyle = WHITE; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (var i = 0; i < 3; i++) {
    var hx = 552 + i * 8, hy = 180 + i * 42;
    ctx.beginPath();
    for (var x = 0; x <= 30; x += 5) { var yv = hy + Math.sin(x * 0.3) * 5; if (x === 0) ctx.moveTo(hx, yv); else ctx.lineTo(hx + x * 0.4, yv); }
    ctx.stroke();
    ctx.beginPath();
    for (var x2 = 0; x2 <= 30; x2 += 5) { var yv2 = hy + Math.sin(x2 * 0.3) * 5; if (x2 === 0) ctx.moveTo(728 - x2 * 0.4, yv2); else ctx.lineTo(728 - x2 * 0.4, yv2); }
    ctx.stroke();
  }
  faceBase(88, 92, 214);
  // shell clip in mustard
  ctx.fillStyle = MUSTARD; ctx.strokeStyle = INK; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(690, 138);
  ctx.quadraticCurveTo(724, 118, 730, 146);
  ctx.quadraticCurveTo(714, 164, 694, 156);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(698, 150); ctx.lineTo(722, 132); ctx.stroke();
  // calm eyes, lashes, small mouth
  ctx.strokeStyle = INK; ctx.lineWidth = 5.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(578, 206); ctx.quadraticCurveTo(596, 194, 614, 206); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(666, 206); ctx.quadraticCurveTo(684, 194, 702, 206); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(578, 206); ctx.lineTo(568, 198); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(702, 206); ctx.lineTo(712, 198); ctx.stroke();
  oval(596, 214, 7, 9); ctx.fillStyle = INK; ctx.fill();
  oval(684, 214, 7, 9); ctx.fillStyle = INK; ctx.fill();
  oval(CX, 252, 13, 8); ctx.fillStyle = SCARF; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
  // scale dots on the forehead
  ctx.fillStyle = NAVY;
  oval(618, 152, 6, 6); ctx.fill();
  oval(640, 144, 6, 6); ctx.fill();
  oval(662, 152, 6, 6); ctx.fill();
}
function drawHead() {
  drawScarf();
  var kind = HEADS[headIdx];
  if (kind === 'cat') drawCat();
  else if (kind === 'chihuahua') drawChihuahua();
  else if (kind === 'croc') drawCroc();
  else drawMermaid();
  // re-draw the knot so it sits over the chin of every variant
  oval(CX, 352, 26, 20);
  ctx.fillStyle = SCARF; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
}

// ---- peony torso ------------------------------------------------------
function torsoPath() {
  ctx.beginPath();
  ctx.moveTo(CX - 118, 370);
  ctx.bezierCurveTo(CX - 168, 420, CX - 182, 520, CX - 168, 614);
  ctx.lineTo(CX + 168, 614);
  ctx.bezierCurveTo(CX + 182, 520, CX + 168, 420, CX + 118, 370);
  ctx.quadraticCurveTo(CX, 350, CX - 118, 370);
  ctx.closePath();
}
function petal(x, y, r, a, fill) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(a);
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.bezierCurveTo(r * 0.72, -r * 0.55, r * 0.62, r * 0.42, 0, r);
  ctx.bezierCurveTo(-r * 0.62, r * 0.42, -r * 0.72, -r * 0.55, 0, -r);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3.2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -r * 0.6); ctx.lineTo(0, r * 0.55);
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}
function drawTorso() {
  torsoPath();
  ctx.fillStyle = PAPER; ctx.fill();
  ctx.save();
  torsoPath(); ctx.clip();
  // outer petal ring, fixed to the torso
  var i, a;
  for (i = 0; i < 10; i++) {
    a = i / 10 * Math.PI * 2 + 0.3;
    petal(CX + Math.cos(a) * 118, 502 + Math.sin(a) * 86, 52, a + Math.PI / 2, i % 2 ? PAPER : PINK);
  }
  // rotating phyllotaxis spiral, 30 second loop
  var rot = (T % 30) / 30 * Math.PI * 2;
  var N = 34;
  for (i = N - 1; i >= 0; i--) {
    var fr = i / N;
    var ang = i * 2.39996 + rot;
    var rad = 12 + Math.sqrt(fr) * 82;
    petal(CX + Math.cos(ang) * rad, 502 + Math.sin(ang) * rad * 0.82, 15 + fr * 26, ang + Math.PI / 2, i % 3 === 0 ? PAPER : PINK);
  }
  oval(CX, 502, 17, 15);
  ctx.fillStyle = MUSTARD; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
  ctx.restore();
  torsoPath();
  ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.stroke();
}

// ---- striped pot base ---------------------------------------------------
function potPath() {
  ctx.beginPath();
  ctx.moveTo(CX - 184, 622);
  ctx.lineTo(CX + 184, 622);
  ctx.lineTo(CX + 148, 806);
  ctx.quadraticCurveTo(CX + 144, 828, CX + 118, 828);
  ctx.lineTo(CX - 118, 828);
  ctx.quadraticCurveTo(CX - 144, 828, CX - 148, 806);
  ctx.closePath();
}
function drawPot() {
  var sway = Math.sin(T * Math.PI * 2 / 6) * 2 * Math.PI / 180;
  ctx.save();
  ctx.translate(CX, 622); ctx.rotate(sway); ctx.translate(-CX, -622);
  potPath();
  ctx.fillStyle = NAVY; ctx.fill();
  ctx.save();
  potPath(); ctx.clip();
  // mustard stripes across the navy pot
  ctx.fillStyle = MUSTARD;
  var bands = [660, 716, 772];
  for (var i = 0; i < bands.length; i++) ctx.fillRect(CX - 200, bands[i], 400, 22);
  // thin paper pinstripes between bands
  ctx.fillStyle = PAPER;
  ctx.fillRect(CX - 200, 694, 400, 6);
  ctx.fillRect(CX - 200, 750, 400, 6);
  ctx.restore();
  // rim, exactly the pot top width so nothing sticks out
  ctx.fillStyle = MUSTARD;
  ctx.fillRect(CX - 184, 614, 368, 26);
  potPath();
  ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.stroke();
  ctx.strokeStyle = INK; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(CX - 184, 614); ctx.lineTo(CX + 184, 614); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX - 184, 640); ctx.lineTo(CX + 184, 640); ctx.stroke();
  ctx.restore();
}

function seam(y, half) {
  // a row of stitch dots along the zone boundary, inside the doll only
  ctx.fillStyle = INK;
  for (var x = CX - half; x <= CX + half; x += 28) {
    var u = (x - CX) / half;
    ctx.beginPath(); ctx.arc(x, y + (1 - u * u) * 7, 3.2, 0, Math.PI * 2); ctx.fill();
  }
}

function draw() {
  ctx.fillStyle = INK;
  ctx.fillRect(0, 0, DW, DH);
  drawPot();
  drawTorso();
  seam(606, 150);
  drawHead();
  seam(378, 118);
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  // head zone only: tapping cycles the animal, nothing else
  if (p[0] > 470 && p[0] < 810 && p[1] > 40 && p[1] < 385) {
    headIdx = (headIdx + 1) % HEADS.length;
  }
});

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = INK;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
