<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burn Into Light</title>
<style>
html, body { margin: 0; padding: 0; background: #1C2A45; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a winter forest at dusk. Hooded figures in ornate red robes move
   between the trees carrying candles and an open book, the procession
   advancing in a slow loop along an S-curve, never arriving. As each figure
   passes a tree, the tree's bark briefly flushes crimson and a faint ring
   spreads from its trunk. The book is read aloud in fragments, one short
   phrase per lap. The candles gutter but never go out. Watch only: the
   ritual completes itself, and the viewer's stillness is the participation. */
var TAU = Math.PI * 2;
var GROUND = '#1C2A45';
var DUSK_TOP = '#16233A';
var DUSK_MID = '#223252';
var DUSK_LOW = '#2E3E5C';
var SNOW = '#AEB6C0';
var SNOW_HI = '#C9CED4';
var SNOW_LO = '#8A97A8';
var TREE = '#141F33';
var TREE_HI = '#1B2C46';
var TRUNK = '#2A2118';
var CRIMSON = '#A4121F';
var CRIMSON_DEEP = '#7E0E1B';
var CRIMSON_HI = '#C22430';
var GOLD = '#F2C14E';
var GOLD_DEEP = '#E8A44A';
var PAGE = '#F5F1E6';
var PLATE = '#F5F1E6';
var PLATE_LINE = 'rgba(22,35,58,0.35)';
var TITLE_INK = '#16233A';
var HINT_INK = '#3A4A66';
var FRAME_T = 60.0;        /* fixed phase for frame one */
var LOOP = 90.0;           /* seconds for one full procession lap */
var N_FIG = 5;
var FIG_GAP = 0.13;        /* path fraction between figures */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- the forest, seeded once ---- */
var rng = mulberry32(1862);
var TREES = [];
var i, tx, ty;
for (i = 0; i < 15; i++) {
  tx = 0.05 + rng() * 0.90;
  ty = 0.24 + rng() * 0.64;
  TREES.push({ x: tx, y: ty, s: 0.50 + rng() * 0.50, ph: rng() * TAU, lean: (rng() - 0.5) * 0.10 });
}
var FLAKES = [];
for (i = 0; i < 110; i++) {
  FLAKES.push({ x: rng(), y: rng(), r: 0.0012 + rng() * 0.0028, sp: 0.010 + rng() * 0.020, sw: 0.3 + rng() * 0.9, ph: rng() * TAU });
}
var FRAGMENTS = ['keep the light', 'walk slowly', 'the snow remembers', 'one candle is enough', 'do not hurry home'];
/* ---- the S-curve path, in fractions of the field rect ---- */
function pathAt(u) {
  return {
    x: 0.5 + 0.31 * Math.sin(TAU * 0.9 * u + 0.9),
    y: 0.94 - 0.82 * u
  };
}
function pathSlope(u) {
  var a = pathAt(Math.max(0, u - 0.01));
  var b = pathAt(Math.min(1, u + 0.01));
  return Math.atan2(b.y - a.y, b.x - a.x);
}
/* lead figure path position at time t; figures trail behind it */
function figureU(k, t) {
  var u0 = 0.42; /* lead figure path position at frame one */
  var u = ((t - FRAME_T) / LOOP + u0 - k * FIG_GAP) % 1;
  return u < 0 ? u + 1 : u;
}
function lapIndex(t) {
  var laps = Math.floor((t - FRAME_T) / LOOP + 0.42);
  return ((laps % FRAGMENTS.length) + FRAGMENTS.length) % FRAGMENTS.length;
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;

  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';

}
/* Field-like composition: full-bleed on phones, a centered square on desktop. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);

}
function toPx(fx, fy, rc) {
  return { x: rc.x + fx * rc.w, y: rc.y + fy * rc.h };
}
function drawSky(rc, t) {
  var g = ctx.createLinearGradient(0, rc.y, 0, rc.y + rc.h);
  g.addColorStop(0, DUSK_TOP);
  g.addColorStop(0.45, DUSK_MID);
  g.addColorStop(0.72, DUSK_LOW);
  g.addColorStop(1, '#3A4A66');
  ctx.fillStyle = g;
  ctx.fillRect(rc.x, rc.y, rc.w, rc.h);
  /* a pale low moon, the only light in the sky */
  var m = Math.min(rc.w, rc.h);
  var mx = rc.x + rc.w * 0.80, my = rc.y + rc.h * 0.13;
  var mg = ctx.createRadialGradient(mx, my, 0, mx, my, m * 0.075);
  mg.addColorStop(0, rgba(PAGE, 0.85));
  mg.addColorStop(0.5, rgba(PAGE, 0.28));
  mg.addColorStop(1, rgba(PAGE, 0));
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.moveTo(mx + m * 0.075, my);
  ctx.arc(mx, my, m * 0.075, 0, TAU);
  ctx.fill();
  ctx.fillStyle = rgba(PAGE, 0.9);
  ctx.beginPath();
  ctx.moveTo(mx + m * 0.028, my);
  ctx.arc(mx, my, m * 0.028, 0, TAU);
  ctx.fill();
  /* snow ground: a pale drift rising from the bottom */
  var gg = ctx.createLinearGradient(0, rc.y + rc.h * 0.58, 0, rc.y + rc.h);
  gg.addColorStop(0, rgba(SNOW_LO, 0));
  gg.addColorStop(0.35, rgba(SNOW_LO, 0.55));
  gg.addColorStop(1, rgba(SNOW, 0.95));
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.moveTo(rc.x, rc.y + rc.h * 0.62);
  ctx.quadraticCurveTo(rc.x + rc.w * 0.30, rc.y + rc.h * 0.585, rc.x + rc.w * 0.52, rc.y + rc.h * 0.625);
  ctx.quadraticCurveTo(rc.x + rc.w * 0.76, rc.y + rc.h * 0.66, rc.x + rc.w, rc.y + rc.h * 0.615);
  ctx.lineTo(rc.x + rc.w, rc.y + rc.h);
  ctx.lineTo(rc.x, rc.y + rc.h);
  ctx.closePath();
  ctx.fill();
}
/* How strongly a tree is answering right now: 1 when a figure is at its
   trunk, fading with distance. A pure function of t, so frame one is fixed. */
function treeFlush(tr, t) {
  var best = 0, k, u, p, dx, dy, d;
  for (k = 0; k < N_FIG; k++) {
    u = figureU(k, t);
    p = pathAt(u);
    dx = (p.x - tr.x) * 1.15;
    dy = (p.y - tr.y) * 1.6;
    d = Math.sqrt(dx * dx + dy * dy);
    best = Math.max(best, clamp(1 - d / 0.16, 0, 1));
  }
  return best;
}
/* Seconds since the most recent figure passed this tree, or -1 if none in
   the last lap. Pure function of t. */
function treeRingAge(tr, t) {
  var k, u, p, dx, dy, d, bestU = -1, bestD = 1e9;
  /* find the figure path point nearest this tree */
  for (k = 0; k < N_FIG; k++) {
    u = figureU(k, t);
    p = pathAt(u);
    dx = (p.x - tr.x) * 1.15;
    dy = (p.y - tr.y) * 1.6;
    d = Math.sqrt(dx * dx + dy * dy);
    if (d < bestD) { bestD = d; bestU = u; }
  }
  if (bestD > 0.16 || bestU < 0) return -1;
  /* the tree answers when a figure is at the path point nearest it; work
     out when that was by walking the lead figure's u backwards */
  var uTree = 0, uu, pp, dd, bd = 1e9;
  for (uu = 0; uu <= 200; uu++) {
    pp = pathAt(uu / 200);
    dd = Math.abs(pp.x - tr.x) * 1.15 + Math.abs(pp.y - tr.y) * 1.6;
    if (dd < bd) { bd = dd; uTree = uu / 200; }
  }
  var du = (bestU - uTree + 1) % 1;
  var age = du * LOOP;

  return age < 7 ? age : -1;
}
function drawTree(tr, rc, t) {
  var m = Math.min(rc.w, rc.h);
  var p = toPx(tr.x, tr.y, rc);
  var h = m * 0.30 * tr.s;
  var w = h * 0.42;
  var flush = treeFlush(tr, t);
  var age = treeRingAge(tr, t);
  /* faint ring spreading from the trunk while the tree answers */
  if (age >= 0) {
    var rr = m * (0.02 + age * 0.011);
    var ra = 0.34 * (1 - age / 7);
    ctx.strokeStyle = rgba(CRIMSON_HI, ra);
    ctx.lineWidth = Math.max(1, m * 0.003);
    ctx.beginPath();
    ctx.moveTo(p.x + rr, p.y);
    ctx.arc(p.x, p.y, rr, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = rgba(GOLD, ra * 0.5);
    ctx.lineWidth = Math.max(1, m * 0.0018);
    ctx.beginPath();
    ctx.moveTo(p.x + rr * 0.7, p.y);
    ctx.arc(p.x, p.y, rr * 0.7, 0, TAU);
    ctx.stroke();
  }
  /* trunk, flushing crimson as a figure passes */
  var tw = Math.max(1.5, m * 0.006 * tr.s);
  ctx.strokeStyle = TRUNK;
  ctx.lineWidth = tw;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x + tr.lean * m, p.y - h * 0.42);
  ctx.stroke();
  if (flush > 0.02) {
    ctx.strokeStyle = rgba(CRIMSON, 0.55 * flush);
    ctx.lineWidth = tw * 1.6;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + tr.lean * m, p.y - h * 0.42);
    ctx.stroke();
  }
  /* conifer tiers, darkest at the back of the frame */
  var tiers = 3, ti, ty0, twi, th;
  for (ti = 0; ti < tiers; ti++) {
    th = h * (0.34 + ti * 0.10);
    twi = w * (1 - ti * 0.22);
    ty0 = p.y - h * 0.14 - ti * h * 0.19;
    ctx.fillStyle = ti === 0 ? TREE : TREE_HI;
    ctx.beginPath();
    ctx.moveTo(p.x + tr.lean * m - twi / 2, ty0);
    ctx.lineTo(p.x + tr.lean * m, ty0 - th);
    ctx.lineTo(p.x + tr.lean * m + twi / 2, ty0);
    ctx.closePath();
    ctx.fill();
    /* snow resting on the tier's edge */
    ctx.strokeStyle = rgba(SNOW_HI, 0.38);
    ctx.lineWidth = Math.max(1, m * 0.003);
    ctx.beginPath();
    ctx.moveTo(p.x + tr.lean * m - twi / 2, ty0);
    ctx.lineTo(p.x + tr.lean * m, ty0 - th * 0.32);
    ctx.lineTo(p.x + tr.lean * m + twi / 2, ty0);
    ctx.stroke();

}
function drawFlame(x, y, s, t, ph) {
  var fl = 0.85 + 0.15 * Math.sin(TAU * t / 0.9 + ph) + 0.08 * Math.sin(TAU * t / 0.31 + ph * 2.1);
  var r = s * fl;
  var g = ctx.createRadialGradient(x, y, 0, x, y, r * 3.2);
  g.addColorStop(0, rgba(GOLD, 0.55));
  g.addColorStop(0.45, rgba(GOLD_DEEP, 0.20));
  g.addColorStop(1, rgba(GOLD_DEEP, 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x + r * 3.2, y);
  ctx.arc(x, y, r * 3.2, 0, TAU);
  ctx.fill();
  /* teardrop flame */
  ctx.fillStyle = GOLD;
  ctx.beginPath();
  ctx.moveTo(x, y - r * 1.7);
  ctx.quadraticCurveTo(x + r * 0.9, y - r * 0.2, x, y + r * 0.7);
  ctx.quadraticCurveTo(x - r * 0.9, y - r * 0.2, x, y - r * 1.7);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = rgba(PAGE, 0.9);
  ctx.beginPath();
  ctx.moveTo(x + r * 0.45, y);
  ctx.arc(x, y + r * 0.1, r * 0.45, 0, TAU);
  ctx.fill();

function drawFigure(k, rc, t) {

  var u = figureU(k, t);
  var p = pathAt(u);

  ctx.fillStyle = CRIMSON_DEEP;
  ctx.beginPath();
  ctx.moveTo(topX + w * 0.20, hy);
  ctx.arc(topX, hy, w * 0.20, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#1A0A0C';
  ctx.beginPath();
  ctx.moveTo(topX + w * 0.13, hy + h * 0.01);
  ctx.arc(topX, hy + h * 0.01, w * 0.13, 0, TAU);
  ctx.fill();

    ctx.moveTo(bx - w * 0.16, by);
    ctx.lineTo(bx, by - h * 0.02);
    ctx.lineTo(bx + w * 0.16, by);
    ctx.lineTo(bx + w * 0.14, by + h * 0.05);
    ctx.lineTo(bx, by + h * 0.035);
    ctx.lineTo(bx - w * 0.14, by + h * 0.05);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = rgba(TITLE_INK, 0.45);
    ctx.lineWidth = Math.max(0.75, m * 0.0012);
    ctx.beginPath();
    ctx.moveTo(bx - w * 0.11, by + h * 0.005);
    ctx.lineTo(bx - w * 0.02, by - h * 0.005);

function drawSnow(rc, t) {
  var m = Math.min(rc.w, rc.h);
  var f, x, y;
  ctx.fillStyle = rgba(SNOW_HI, 0.85);
  for (var i = 0; i < FLAKES.length; i++) {
    f = FLAKES[i];
    y = (f.y + t * f.sp * 0.5) % 1;
    x = f.x + Math.sin(TAU * t / (7 + f.sw * 4) + f.ph) * 0.012;

function drawPlates(t) {

  ctx.font = smallPx + 'px monospace';

  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);

  var fragPlateW = fragW + 24;
  var fragPlateH = smallPx + 14;
  var fragPlateX = VW - fragPlateW - 12;
  var fragPlateY = VH - fragPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(fragPlateX, fragPlateY, fragPlateW, fragPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(fragPlateX + 0.5, fragPlateY + 0.5, fragPlateW - 1, fragPlateH - 1);

function draw() {
  size();

  var t = phaseT;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawSky(sc, t);
  /* trees behind the procession first, then figures, then near trees */
  var k;
  for (k = 0; k < TREES.length; k++) {
    if (TREES[k].y < 0.55) drawTree(TREES[k], sc, t);

  var order = [];

/* ---- frame one: fixed phase t = 60.0 s, lead figure mid-curve ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);

  })();
}
</script>
