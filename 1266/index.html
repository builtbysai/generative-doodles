<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Knot Seen</title>
<style>
  html, body { margin: 0; padding: 0; background: #1A1712; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  /* ---------- seeded PRNG: integer hash only, no unseeded randomness ---------- */
  function hash(n) {
    var x = n >>> 0;
    x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
    return x >>> 0;
  }
  function makeRnd(seed) {
    var s = hash(seed);
    return function () {
      s = hash(s + 0x9E3779B9);
      return (s >>> 0) / 4294967296;
    };
  }

  var CRIMSON = "#B03A2E", HEMP = "#C8B48A", HANJI = "#EFE8D2", INK = "#1A1712";

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var W = 0, H = 0, U = 1; /* U = unit scale from min dimension */
  function isPhone() {
    try {
      var s = window.screen;
      if (s && s.width && s.height) return Math.min(s.width, s.height) < 700;
    } catch (e) {}
    return H > W * 1.15;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (window.visualViewport) { vw = window.visualViewport.width; vh = window.visualViewport.height; }
    } catch (e) {}
    if (!vw) { vw = window.innerWidth || 720; vh = window.innerHeight || 720; }
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    U = Math.min(W, H) / 720;
    if (U < 0.5) U = 0.5;
    if (U > 1.6) U = 1.6;
  }
  resize();
  if (typeof window.addEventListener === "function") {
    window.addEventListener("resize", function () { resize(); draw(0); });
    try {
      if (window.visualViewport && window.visualViewport.addEventListener) {
        window.visualViewport.addEventListener("resize", function () { resize(); draw(0); });
      }
    } catch (e) {}
  }

  /* ---------- knot path generation: one continuous stroke, seeded ---------- */
  function ellipseLoop(pts, cx, cy, rx, ry, a0, a1, steps, rnd, jitAmt) {
    var j = (typeof jitAmt === "number") ? jitAmt : 0.10;
    for (var i = 0; i <= steps; i++) {
      var a = a0 + (a1 - a0) * (i / steps);
      var jit = 1 + (rnd() - 0.5) * j;
      pts.push([cx + Math.cos(a) * rx * jit, cy + Math.sin(a) * ry * jit]);
    }
  }
  function knotPath(kind, seed, R) {
    var rnd = makeRnd(seed);
    var pts = [];
    if (kind === 0) {
      /* butterfly: two wing loops joined at the centre */
      pts.push([0, -0.12 * R]);
      pts.push([-0.50 * R, -0.34 * R]);
      ellipseLoop(pts, -0.50 * R, 0, 0.50 * R, 0.34 * R, -Math.PI / 2, Math.PI * 1.5, 26, rnd);
      pts.push([0, 0]);
      pts.push([0.50 * R, -0.34 * R]);
      ellipseLoop(pts, 0.50 * R, 0, 0.50 * R, 0.34 * R, -Math.PI / 2, Math.PI * 1.5, 26, rnd);
      pts.push([0, 0.10 * R]);
    } else if (kind === 1) {
      /* chrysanthemum: petal loops radiating from the centre */
      var petals = 5 + Math.floor(rnd() * 3);
      for (var p = 0; p < petals; p++) {
        var base = (p / petals) * Math.PI * 2 + (rnd() - 0.5) * 0.22;
        var dx = Math.cos(base), dy = Math.sin(base);
        var px = dx * 0.55 * R, py = dy * 0.55 * R;
        var ex = -dy, ey = dx;
        pts.push([0, 0]);
        pts.push([px + ex * 0.22 * R, py + ey * 0.22 * R]);
        ellipseLoop(pts, px, py, 0.50 * R, 0.22 * R, Math.atan2(ey, ex) - Math.PI / 2, Math.atan2(ey, ex) + Math.PI * 1.5, 18, rnd);
        pts.push([0, 0]);
      }
    } else {
      /* maedeup braid: a vertical stack of alternating, taller, irregular loops */
      var links = 4 + Math.floor(rnd() * 2);
      for (var i = 0; i < links; i++) {
        var cy = -R + (i / (links - 1)) * 2 * R;
        var cx = (i % 2 === 0 ? -0.30 : 0.30) * R + (rnd() - 0.5) * 0.10 * R;
        var lr = 0.36 * R * (0.85 + rnd() * 0.30);
        if (i === 0) pts.push([cx, cy - 0.42 * R]);
        ellipseLoop(pts, cx, cy, lr * 0.85, lr * 1.15, -Math.PI / 2, Math.PI * 1.5, 20, rnd, 0.18);
      }
      pts.push([0, R]);
    }
    return pts;
  }

  /* ---------- knot registry: pure function of t + recorded events ---------- */
  var TIE = 8, RETIE = 2.5, SPAWN_GAP = 14, FIRST_SPAWN = 12, MAX_KNOTS = 16;
  var initialAnchors = [0.12, 0.27, 0.44, 0.60, 0.76, 0.89];
  var initialKinds = [0, 1, 2, 1, 0, 2];

  function knotDef(index, seedBase) {
    var rnd = makeRnd(seedBase + index * 7919);
    return {
      anchor: 0, /* filled by caller */
      lenFrac: 0.30 + rnd() * 0.42,
      kind: Math.floor(rnd() * 3),
      seed: seedBase + index * 7919,
      sizeMul: 0.85 + rnd() * 0.45,
      period: 5 + rnd() * 4,
      phase: rnd() * Math.PI * 2,
      amp: 0.03 + rnd() * 0.03,
      crimson: rnd() < 0.62,
      bow: (rnd() - 0.5) * 0.05
    };
  }

  /* events recorded from the visitor: drags and double-taps, closed-form only */
  var dragEvents = [];   /* {knot, startT, endT, stretch} */
  var tapKnots = [];     /* {tieStart, anchor, kind, seed, lenFrac, sizeMul, period, phase, amp, crimson, bow} */
  var activeDrag = null; /* {knot, startX, startY, curY} */
  var lastTap = null;    /* {t, x, y} */

  function knotsAt(t) {
    var list = [];
    for (var i = 0; i < initialAnchors.length; i++) {
      var d = knotDef(i, 12345);
      d.anchor = initialAnchors[i] + (i % 2 === 0 ? 0.008 : -0.008);
      d.kind = initialKinds[i]; /* one of each family visible at frame one */
      d.tieStart = (i < 5) ? -30 : -4; /* five tied, one half-tied at frame one */
      d.index = i;
      list.push(d);
    }
    var spawned = 0;
    for (var st = FIRST_SPAWN; st <= t && list.length < MAX_KNOTS; st += SPAWN_GAP) {
      var si = 6 + spawned;
      var sd = knotDef(si, 12345);
      sd.anchor = freeAnchor(list, si);
      sd.tieStart = st;
      sd.index = si;
      list.push(sd);
      spawned++;
    }
    for (var j = 0; j < tapKnots.length; j++) {
      if (list.length >= MAX_KNOTS) break;
      var tk = tapKnots[j];
      tk.index = 100 + j;
      list.push(tk);
    }
    return list;
  }
  function freeAnchor(list, seedIdx) {
    var rnd = makeRnd(777 + seedIdx * 104729);
    for (var tries = 0; tries < 24; tries++) {
      var a = 0.08 + rnd() * 0.84;
      var ok = true;
      for (var i = 0; i < list.length; i++) {
        if (Math.abs(list[i].anchor - a) < 0.09) { ok = false; break; }
      }
      if (ok) return a;
    }
    return 0.08 + rnd() * 0.84;
  }

  function dragState(knotIdx, t) {
    /* latest completed drag for this knot drives stretch decay + re-tie */
    var latest = null;
    for (var i = 0; i < dragEvents.length; i++) {
      var e = dragEvents[i];
      if (e.knot !== knotIdx) continue;
      if (t < e.endT) continue;
      latest = e;
    }
    if (!latest) return { stretch: 0, progress: 1 };
    var dt = t - latest.endT;
    return {
      stretch: latest.stretch * Math.exp(-dt * 2.0),
      progress: Math.min(1, dt / RETIE)
    };
  }

  function knotCenter(k, t) {
    return { x: k.anchor * W, y: k.lenFrac * H };
  }

  function draw(t) {
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, W, H);
    var knots = knotsAt(t);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (var i = 0; i < knots.length; i++) {
      var k = knots[i];
      var ax = k.anchor * W;
      var R = 0.055 * Math.min(W, H) * k.sizeMul;
      var len = k.lenFrac * H;
      var sway = k.amp * Math.sin((Math.PI * 2 * t) / k.period + k.phase);

      var tieP = 1;
      if (t < k.tieStart + TIE) tieP = Math.max(0, Math.min(1, (t - k.tieStart) / TIE));

      var stretch = 0, retieP = 1;
      if (activeDrag && activeDrag.knot === k.index) {
        stretch = Math.max(0, Math.min(140 * U, activeDrag.curY - activeDrag.startY));
      } else {
        var ds = dragState(k.index, t);
        stretch = ds.stretch;
        retieP = ds.progress;
      }
      var progress = Math.min(tieP, retieP);
      var effLen = len + stretch;

      ctx.save();
      ctx.translate(ax, 0);
      ctx.rotate(sway);
      /* cord */
      ctx.strokeStyle = k.crimson ? HEMP : CRIMSON;
      ctx.lineWidth = Math.max(1.2, 2.2 * U);
      ctx.beginPath();
      ctx.moveTo(0, -4);
      ctx.quadraticCurveTo(k.bow * W, effLen * 0.5, 0, effLen);
      ctx.stroke();
      /* knot stroke, partial while tying */
      var path = knotPath(k.kind, k.seed, R);
      var total = path.length - 1;
      var upto = progress * total;
      var full = Math.floor(upto);
      ctx.save();
      ctx.translate(0, effLen);
      ctx.scale(1, 1 + (stretch / (140 * U)) * 0.25);
      ctx.strokeStyle = k.crimson ? CRIMSON : HEMP;
      ctx.lineWidth = Math.max(1.6, 3.4 * U);
      ctx.beginPath();
      ctx.moveTo(path[0][0], path[0][1]);
      for (var p = 1; p <= full && p < path.length; p++) ctx.lineTo(path[p][0], path[p][1]);
      if (full < total) {
        var frac = upto - full;
        var ax0 = path[full], ax1 = path[full + 1];
        ctx.lineTo(ax0[0] + (ax1[0] - ax0[0]) * frac, ax0[1] + (ax1[1] - ax0[1]) * frac);
      }
      ctx.stroke();
      /* hanji accent dot at the knot heart when fully tied */
      if (progress >= 1) {
        ctx.fillStyle = HANJI;
        ctx.beginPath();
        ctx.moveTo(0, -2.2 * U);
        ctx.lineTo(2.2 * U, 0);
        ctx.lineTo(0, 2.2 * U);
        ctx.lineTo(-2.2 * U, 0);
        ctx.closePath();
        ctx.fill();
      }
      /* short dangling tail below the knot */
      if (progress >= 1) {
        ctx.strokeStyle = k.crimson ? CRIMSON : HEMP;
        ctx.lineWidth = Math.max(1.2, 2.0 * U);
        ctx.beginPath();
        ctx.moveTo(0, R * 0.9);
        ctx.quadraticCurveTo(0.12 * R, R * 1.15, 0.05 * R, R * 1.35);
        ctx.stroke();
      }
      ctx.restore();
      ctx.restore();
    }
  }

  /* ---------- pointer interaction ---------- */
  function pointerPos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function nowT() {
    if (typeof performance !== "undefined" && performance.now) return (performance.now() - t0) / 1000;
    return 0;
  }
  function hitKnot(x, y, t) {
    var knots = knotsAt(t);
    var best = -1, bestD = 1e9;
    for (var i = 0; i < knots.length; i++) {
      var c = knotCenter(knots[i], t);
      var R = 0.055 * Math.min(W, H) * knots[i].sizeMul;
      var d = Math.sqrt((x - c.x) * (x - c.x) + (y - c.y) * (y - c.y));
      if (d < R * 1.9 && d < bestD) { bestD = d; best = knots[i].index; }
    }
    return best;
  }

  canvas.addEventListener("pointerdown", function (e) {
    var p = pointerPos(e);
    var t = nowT();
    var idx = hitKnot(p.x, p.y, t);
    if (idx >= 0) {
      activeDrag = { knot: idx, startX: p.x, startY: p.y, curY: p.y, moved: false, downT: t };
    }
    activeDrag = activeDrag || { knot: -1, startX: p.x, startY: p.y, curY: p.y, moved: false, downT: t };
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!activeDrag) return;
    var p = pointerPos(e);
    if (Math.abs(p.y - activeDrag.startY) > 8 || Math.abs(p.x - activeDrag.startX) > 8) activeDrag.moved = true;
    activeDrag.curY = p.y;
  });
  canvas.addEventListener("pointerup", function (e) {
    if (!activeDrag) return;
    var p = pointerPos(e);
    var t = nowT();
    var d = activeDrag;
    activeDrag = null;
    if (d.knot >= 0 && d.moved) {
      var stretch = Math.max(0, Math.min(140 * U, d.curY - d.startY));
      dragEvents.push({ knot: d.knot, startT: d.downT, endT: t, stretch: stretch });
      draw(t);
      return;
    }
    if (!d.moved) {
      /* tap: possible double-tap -> tie a new seeded knot */
      if (lastTap && (t - lastTap.t) < 0.4 &&
          Math.abs(p.x - lastTap.x) < 30 && Math.abs(p.y - lastTap.y) < 30) {
        lastTap = null;
        var list = knotsAt(t);
        if (list.length < MAX_KNOTS) {
          var ni = 1000 + tapKnots.length * 31;
          var nd = knotDef(ni, 4242);
          nd.anchor = freeAnchor(list, ni);
          nd.tieStart = t;
          tapKnots.push(nd);
        }
      } else {
        lastTap = { t: t, x: p.x, y: p.y };
      }
      draw(t);
    }
  });
  canvas.addEventListener("pointercancel", function () { activeDrag = null; });

  /* ---------- frame loop: fixed phase at load, elapsed since load ---------- */
  var t0 = 0;
  if (typeof performance !== "undefined" && performance.now) t0 = performance.now();
  draw(0);
  if (typeof requestAnimationFrame === "function") {
    (function loop() {
      var t = 0;
      if (typeof performance !== "undefined" && performance.now) t = (performance.now() - t0) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
