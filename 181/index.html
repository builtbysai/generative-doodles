<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.181 Light Organ 24</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#050505; }
  canvas { display:block; touch-action:none; }
  #hint { position:fixed; left:0; right:0; bottom:10px; text-align:center;
    font:12px system-ui, sans-serif; color:#77777F; opacity:0.6;
    pointer-events:none; letter-spacing:0.04em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">drag to spin, tap to relight</div>
<script>
(function () {
'use strict';
// No.181 Light Organ 24 (Goodman-Strauss). The 24-cell drawn as
// light tubing: its 96 edges stereographically projected from 4D,
// each edge a circular arc. Lighting states recolour the edges by
// their axis class (the coordinate an edge runs along or differs
// in), so each state lights a different sub symmetry of the whole;
// one axis class rests dim in each state. States advance on a 60s
// scripted cycle (the quiescent sequence), tap advances one state,
// drag rotates the cell in 4D before projection. The prompt feeds
// states from a microphone; gallery pieces do not request mic
// permission, so the mic is omitted by design and the scripted
// sequence, the prompt's own fallback, is the shipped behaviour.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0;
var GROUND = '#050505', IDLE = '#3A3A40';
var PALETTE = ['#E4572E', '#F2B233', '#4CAF7D', '#2E6BE6'];
var dragXW = 0, dragZW = 0, shift = 0;

// ---- the 24-cell -------------------------------------------------
var verts = [];
(function () {
  var i, j, s1, s2, s3, s4;
  for (i = 0; i < 4; i++) {
    for (var sgn = -1; sgn <= 1; sgn += 2) {
      var v = [0, 0, 0, 0];
      v[i] = sgn;
      verts.push(v);
    }
  }
  for (s1 = -1; s1 <= 1; s1 += 2) for (s2 = -1; s2 <= 1; s2 += 2)
    for (s3 = -1; s3 <= 1; s3 += 2) for (s4 = -1; s4 <= 1; s4 += 2)
      verts.push([s1 / 2, s2 / 2, s3 / 2, s4 / 2]);
})();
var edges = [];
(function () {
  for (var a = 0; a < verts.length; a++) {
    for (var b = a + 1; b < verts.length; b++) {
      var d2 = 0, diffAxis = -1;
      for (var k = 0; k < 4; k++) {
        var dd = verts[a][k] - verts[b][k];
        d2 += dd * dd;
        if (Math.abs(dd) > 0.01) diffAxis = k;
      }
      if (Math.abs(d2 - 1) > 0.001) continue;
      var axis;
      if (a < 8 && b >= 8) axis = Math.floor(a / 2);       // A vertex's axis
      else if (a >= 8) axis = diffAxis;                    // B-B: differing coordinate
      else axis = Math.floor(a / 2);
      edges.push({ a: a, b: b, axis: axis });
    }
  }
})();

function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function rotPlane(v, i, j, ang) {
  var c = Math.cos(ang), s = Math.sin(ang);
  var a = v[i], b = v[j];
  v[i] = a * c - b * s;
  v[j] = a * s + b * c;
}
function project(v, S, cx, cy) {
  var s = 2.4 / (2.4 - v[3]);
  var x = v[0] * s, y = v[1] * s, z = v[2] * s;
  var s2 = 3.4 / (3.4 - z);
  return [cx + x * s2 * S, cy + y * s2 * S, s];
}
function stateColor(axis, state) {
  if (axis === state % 4) return IDLE;
  return PALETTE[(axis + state) % 4];
}

function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var t = now / 1000;
  var phase = (((now + shift + 5000) % 60000) + 60000) % 60000;
  var idx = Math.floor(phase / 10000) % 6;
  var prev = (idx + 5) % 6;
  var fade = Math.min(1, (phase % 10000) / 1500);
  var aXW = 0.6 + t * 0.045 + dragXW;
  var aYZ = 0.35 + t * 0.033;
  var aZW = 0.4 + dragZW;
  var aXZ = 0.2 + t * 0.021;
  var S = 0.40 * Math.min(W, H);
  var cx = W / 2, cy = H / 2;
  var P = [], i, e;
  for (i = 0; i < verts.length; i++) {
    var v = verts[i].slice();
    rotPlane(v, 0, 3, aXW);
    rotPlane(v, 1, 2, aYZ);
    rotPlane(v, 2, 3, aZW);
    rotPlane(v, 0, 2, aXZ);
    P.push(project(v, S, cx, cy));
  }
  function edgePath(e) {
    var va = verts[e.a], vb = verts[e.b];
    var m = [0, 0, 0, 0], n = 0;
    for (var k = 0; k < 4; k++) { m[k] = va[k] + vb[k]; n += m[k] * m[k]; }
    n = Math.sqrt(n);
    for (k = 0; k < 4; k++) m[k] /= n;
    rotPlane(m, 0, 3, aXW);
    rotPlane(m, 1, 2, aYZ);
    rotPlane(m, 2, 3, aZW);
    rotPlane(m, 0, 2, aXZ);
    var pm = project(m, S, cx, cy);
    var p0 = P[e.a], p1 = P[e.b];
    var qx = 2 * pm[0] - (p0[0] + p1[0]) / 2;
    var qy = 2 * pm[1] - (p0[1] + p1[1]) / 2;
    ctx.beginPath();
    ctx.moveTo(p0[0], p0[1]);
    ctx.quadraticCurveTo(qx, qy, p1[0], p1[1]);
    return (p0[2] + p1[2]) / 2; // mean stereo scale, the depth cue
  }
  ctx.lineCap = 'round';
  // idle underlay: the full tubing, always present
  ctx.strokeStyle = IDLE;
  ctx.lineWidth = 3;
  for (i = 0; i < edges.length; i++) {
    ctx.globalAlpha = 0.13;
    edgePath(edges[i]);
    ctx.stroke();
  }
  // lit states, crossfading
  for (var pass = 0; pass < 2; pass++) {
    var st = pass === 0 ? prev : idx;
    var wgt = pass === 0 ? 1 - fade : fade;
    if (wgt <= 0.01) continue;
    for (i = 0; i < edges.length; i++) {
      e = edges[i];
      var col = stateColor(e.axis, st);
      if (col === IDLE) continue;
      var depth = edgePath(e);
      var al = (0.30 + 0.62 * Math.min(1, Math.max(0, (depth - 0.7) / 1.0))) * wgt;
      ctx.globalAlpha = al;
      ctx.strokeStyle = col;
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.globalAlpha = al * 0.4;
      ctx.lineWidth = 1.1;
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

var downAt = 0, downX = 0, downY = 0, startX = 0, startY = 0, dragging = false;
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; downAt = e.timeStamp; downX = startX = e.clientX; downY = startY = e.clientY;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  dragXW += (e.clientX - downX) * 0.008;
  dragZW += (e.clientY - downY) * 0.008;
  downX = e.clientX; downY = e.clientY;
});
canvas.addEventListener('pointerup', function (e) {
  dragging = false;
  var moved = Math.sqrt((e.clientX - startX) * (e.clientX - startX) + (e.clientY - startY) * (e.clientY - startY));
  if (e.timeStamp - downAt < 350 && moved < 8) {
    var phase = (((e.timeStamp + shift + 5000) % 60000) + 60000) % 60000;
    shift += 10000 - (phase % 10000); // jump to the next state boundary
  }
});
canvas.addEventListener('pointercancel', function () { dragging = false; });

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
