<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>The Barrier and the Island</title>
<style>
html, body { margin: 0; padding: 0; background: #14201a; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var LOOP = 48;
  var SEED = 1514000;
  var FIELD = '#14201a';
  var BARRIER = '#d8cdb4';
  var RUST = '#a3552f';
  var SLATE = '#3f5a78';
  var MOSS = '#7fae5a';
  var RIVER = '#1d3a3a';

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function a4(v) {
    var r = Math.round(v * 10000) / 10000;
    if (r < 0) r = 0; if (r > 1) r = 1;
    return r;
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720;
  var forced = null;
  var startTs = null;
  var lastTs = 0;

  function resize() {
    var vp = (typeof window.visualViewport !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vp ? vp.width : window.innerWidth;
    var h = vp ? vp.height : window.innerHeight;
    if (!w || !h) { w = 720; h = 720; }
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  }

  // ---- Seeded layout (built once, never re-randomized) ----
  var rng = mulberry32(SEED);
  function mkSide(color, side) {
    var arr = [];
    for (var i = 0; i < 10; i++) {
      arr.push({
        color: color, side: side,
        kind: Math.floor(rng() * 3),
        a: 0.10 + rng() * 0.80,
        yf: 0.08 + rng() * 0.52,
        size: 0.020 + rng() * 0.015,
        ampX: 0.006 + rng() * 0.006,
        ampY: 0.005 + rng() * 0.008,
        tx: [48, 24, 16, 12][Math.floor(rng() * 4)],
        ty: [48, 24, 16, 12][Math.floor(rng() * 4)],
        ph: rng() * Math.PI * 2,
        ph2: rng() * Math.PI * 2
      });
    }
    return arr;
  }
  var leftShapes = mkSide(RUST, -1);
  var rightShapes = mkSide(SLATE, 1);
  var islandShapes = [];
  for (var i = 0; i < 8; i++) {
    islandShapes.push({
      kind: Math.floor(rng() * 3),
      r: 0.30 + rng() * 0.65,
      a0: i * Math.PI / 4 + (rng() - 0.5) * 0.5,
      T: [12, 8, 6, 16, 24][Math.floor(rng() * 5)],
      S: [12, 8, 6, 16][Math.floor(rng() * 4)],
      ph: rng() * Math.PI * 2,
      size: 0.020 + rng() * 0.014
    });
  }
  var streaks = [];
  for (var k = 0; k < 10; k++) {
    streaks.push({ off: rng() * 720, spd: (k % 2 === 0) ? 1 : 2, len: 0.10 + rng() * 0.08 });
  }

  // ---- Drag state: closed-form over recorded events ----
  var drags = [];       // {tDown, anchorBx, anchorX, moves:[{t,x}], tUp, finalX}
  var activeDrag = null; // {mode:'barrier'|'island', ...} (barrier drags also in drags[])
  var scatters = [];    // {t0, dirs:[{dx,dy}]}
  var lastScatterT = -1e9;

  function nowPiece() {
    if (forced !== null) return forced;
    if (startTs === null) return 0;
    return (lastTs - startTs) / 1000;
  }
  function islandCenter() {
    var U = Math.min(W, H);
    return { x: 0.5 * W, y: 0.74 * H, R: 0.085 * U };
  }
  function barrierX(t) {
    var x = 0.5 * W;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i];
      if (t < d.tDown) break;
      var bx = d.anchorBx;
      for (var j = 0; j < d.moves.length; j++) {
        if (d.moves[j].t <= t) bx = d.moves[j].x; else break;
      }
      if (d.tUp !== null && t >= d.tUp) bx = d.finalX;
      x = bx;
    }
    return x;
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function onDown(e) {
    var t = nowPiece();
    var x = e.clientX, y = e.clientY;
    var ic = islandCenter();
    var dx = x - ic.x, dy = y - ic.y;
    if (dx * dx + dy * dy <= (ic.R * 1.6) * (ic.R * 1.6)) {
      activeDrag = { mode: 'island' };
      addScatter(t);
      lastScatterT = t;
      return;
    }
    if (Math.abs(x - barrierX(t)) <= 30) {
      var d = { tDown: t, anchorBx: barrierX(t), anchorX: x, moves: [], tUp: null, finalX: null };
      drags.push(d);
      activeDrag = { mode: 'barrier', drag: d };
    }
  }
  function addScatter(t) {
    var r2 = mulberry32(SEED + 1000 * (scatters.length + 1));
    var ic = islandCenter();
    var dirs = [];
    for (var i = 0; i < islandShapes.length; i++) {
      var ang = r2() * Math.PI * 2;
      var mag = (0.5 + r2() * 0.5) * ic.R * 1.4;
      dirs.push({ dx: Math.cos(ang) * mag, dy: Math.sin(ang) * mag });
    }
    scatters.push({ t0: t, dirs: dirs });
  }
  function onMove(e) {
    var t = nowPiece();
    if (!activeDrag) return;
    if (activeDrag.mode === 'barrier') {
      var d = activeDrag.drag;
      var x = clamp(d.anchorBx + (e.clientX - d.anchorX), 0.22 * W, 0.78 * W);
      d.moves.push({ t: t, x: x });
    } else if (activeDrag.mode === 'island') {
      if (t - lastScatterT >= 0.5) { addScatter(t); lastScatterT = t; }
    }
  }
  function onUp() {
    if (!activeDrag) return;
    if (activeDrag.mode === 'barrier') {
      var d = activeDrag.drag;
      d.tUp = nowPiece();
      d.finalX = d.moves.length ? d.moves[d.moves.length - 1].x : d.anchorBx;
    }
    activeDrag = null;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(nowPiece()); });
  }
  if (typeof window.visualViewport !== 'undefined' && window.visualViewport && typeof window.visualViewport.addEventListener === 'function') {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(nowPiece()); });
  }

  // ---- Drawing ----
  function drawShape(kind, x, y, s, rot, fill, stroke) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = fill;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (kind === 0) {
      ctx.moveTo(0, -s);
      ctx.lineTo(s * 0.9, s * 0.8);
      ctx.lineTo(-s * 0.9, s * 0.8);
      ctx.closePath();
      ctx.fill();
      if (stroke) ctx.stroke();
    } else if (kind === 1) {
      ctx.fillRect(-s * 0.8, -s * 0.8, s * 1.6, s * 1.6);
      if (stroke) ctx.strokeRect(-s * 0.8, -s * 0.8, s * 1.6, s * 1.6);
    } else {
      ctx.moveTo(s, 0);
      ctx.arc(0, 0, s, 0, Math.PI * 2);
      ctx.fill();
      if (stroke) ctx.stroke();
    }
    ctx.restore();
  }

  function draw(t) {
    var lt = ((t % LOOP) + LOOP) % LOOP;
    var U = Math.min(W, H);
    var bx = barrierX(t);
    var ic = islandCenter();
    var bandY0 = 0.66 * H, bandY1 = 0.82 * H, bandH = bandY1 - bandY0;

    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);

    // River band + horizontal drift field (closed-form, period divides LOOP).
    ctx.fillStyle = RIVER;
    ctx.fillRect(0, bandY0, W, bandH);
    ctx.fillStyle = 'rgba(20,32,26,' + a4(0.35) + ')';
    for (var s = 0; s < streaks.length; s++) {
      var st = streaks[s];
      var span = W + 240;
      var sx = ((st.off + (W / LOOP) * st.spd * lt) % span + span) % span - 120;
      var sy = bandY0 + ((s + 0.5) / streaks.length) * bandH;
      ctx.fillRect(sx, sy, st.len * W, 2);
    }

    // Side clusters: anchor fraction of their own half, slow loop-local drift,
    // clamped inside the half so no shape ever crosses the barrier.
    function drawSide(list) {
      for (var i = 0; i < list.length; i++) {
        var p = list[i];
        var hs = (p.side < 0) ? 0 : bx;
        var he = (p.side < 0) ? bx : W;
        var hw = he - hs;
        var s = p.size * U;
        var x = hs + p.a * hw + p.ampX * W * Math.sin(2 * Math.PI * lt / p.tx + p.ph);
        var y = p.yf * H + p.ampY * H * Math.sin(2 * Math.PI * lt / p.ty + p.ph2);
        x = clamp(x, hs + s + 2, he - s - 2);
        y = clamp(y, s + 2, H - s - 2);
        drawShape(p.kind, x, y, s, 0, p.color, null);
      }
    }
    drawSide(leftShapes);
    drawSide(rightShapes);

    // Barrier line (drawn before the island, so the island ignores it).
    ctx.fillStyle = BARRIER;
    var bw = Math.max(2, 0.004 * W);
    ctx.fillRect(bx - bw / 2, 0, bw, H);

    // Island landmass: blobby polygon, slow loop-local morph.
    ctx.beginPath();
    for (var v = 0; v < 12; v++) {
      var ang = v * Math.PI / 6;
      var rr = ic.R * (1 + 0.14 * Math.sin(2 * Math.PI * lt / LOOP + v * 0.9));
      var px = ic.x + Math.cos(ang) * rr * 1.4;
      var py = ic.y + Math.sin(ang) * rr * 0.8;
      if (v === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(127,174,90,' + a4(0.55) + ')';
    ctx.fill();
    ctx.strokeStyle = MOSS;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Island shapes: fast closed-form orbits + spin, plus decaying scatter.
    for (var j = 0; j < islandShapes.length; j++) {
      var q = islandShapes[j];
      var ang2 = q.a0 + 2 * Math.PI * lt / q.T + q.ph;
      var ox = 0, oy = 0;
      for (var e = 0; e < scatters.length; e++) {
        var sc = scatters[e];
        if (t >= sc.t0) {
          var dec = Math.exp(-(t - sc.t0) / 6);
          ox += sc.dirs[j].dx * dec;
          oy += sc.dirs[j].dy * dec;
        }
      }
      var ix = ic.x + Math.cos(ang2) * q.r * ic.R + ox;
      var iy = ic.y + Math.sin(ang2) * q.r * ic.R * 0.7 + oy;
      var rot = 2 * Math.PI * lt / q.S + q.ph;
      drawShape(q.kind, ix, iy, q.size * U, rot, MOSS, FIELD);
    }

    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function loop(ts) {
    if (startTs === null) startTs = ts;
    lastTs = ts;
    draw(nowPiece());
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }

  resize();
  draw(0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  if (typeof window !== 'undefined') {
    window.__piece = {
      drawAt: function (t) { draw(t); },
      setForced: function (t) { forced = t; },
      barrierXAt: function (t) { return barrierX(t); },
      islandInfo: function () { var ic = islandCenter(); return { cx: ic.x, cy: ic.y, R: ic.R }; },
      scatterCount: function () { return scatters.length; },
      loopLength: LOOP
    };
  }
})();
</script>
</body>
</html>
