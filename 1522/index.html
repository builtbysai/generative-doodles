<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaving the Frame</title>
<style>
  html, body { margin: 0; padding: 0; background: #1c2226; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var FIELD = '#1c2226';
  var FRAME_LINE = '#ddd3b8';
  var INSIDE = '#6a7a8a';
  var OCHRE = '#c98f3d';
  var BRICK = '#a34a2e';
  var GROUND = '#3a444a';
  var L = 240; // loop length in seconds
  var NMARKS = 10;
  var SEED = 1522000;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function smooth(u) {
    u = clamp(u, 0, 1);
    return u * u * (3 - 2 * u);
  }
  function normAngle(a) {
    while (a > Math.PI) a -= 2 * Math.PI;
    while (a < -Math.PI) a += 2 * Math.PI;
    return a;
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function size() {
    var w = 720, h = 720;
    try {
      if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
        w = window.visualViewport.width; h = window.visualViewport.height;
      } else if (typeof window !== 'undefined' && window.innerWidth) {
        w = window.innerWidth; h = window.innerHeight;
      }
    } catch (e) {}
    canvas.width = w; canvas.height = h;
    return { w: w, h: h };
  }
  function isPhone() {
    try {
      if (typeof window !== 'undefined' && window.screen) {
        var m = Math.min(window.screen.width, window.screen.height);
        if (m < 700) return true;
      }
    } catch (e) {}
    var s = size();
    return s.h > s.w * 1.15;
  }

  // Layout: landscape puts the frame left and the circle right, same row.
  // Portrait (phones) stacks them diagonally so neither clips.
  function layout(W, H) {
    var portrait = isPhone() || H > W;
    var lay;
    if (portrait) {
      lay = {
        fx: 0.30 * W, fy: 0.30 * H, fw: 0.52 * W, fh: 0.28 * H,
        cx: 0.68 * W, cy: 0.70 * H, cr: 0.27 * W
      };
    } else {
      lay = {
        fx: 0.27 * W, fy: 0.50 * H, fw: 0.30 * W, fh: 0.46 * H,
        cx: 0.70 * W, cy: 0.50 * H, cr: 0.30 * Math.min(W, H)
      };
    }
    lay.tilt = -0.10;
    return lay;
  }

  // Inside-path waypoints: 6 per mark, seeded, visited on a periodic path
  // that returns exactly to its start at the loop boundary.
  var rng = mulberry32(SEED);
  var waypoints = [];
  (function () {
    var m, k;
    for (m = 0; m < NMARKS; m++) {
      var list = [];
      for (k = 0; k < 6; k++) {
        list.push([rng() * 2 - 1, rng() * 2 - 1]);
      }
      waypoints.push(list);
    }
  })();
  // Per-mark phase constants, also seeded.
  var phases = [];
  (function () {
    var m;
    for (m = 0; m < NMARKS; m++) {
      phases.push([rng() * 2 * Math.PI, rng() * 2 * Math.PI, rng() * 2 * Math.PI]);
    }
  })();

  function insidePos(m, tau, lay) {
    var seg = 40; // 240 / 6
    var idx = Math.floor(tau / seg) % 6;
    var nxt = (idx + 1) % 6;
    var u = (tau - idx * seg) / seg;
    var e = smooth(u / 0.7);
    var mx = lay.fx + lerp(waypoints[m][idx][0], waypoints[m][nxt][0], e) * (lay.fw / 2 - 44);
    var my = lay.fy + lerp(waypoints[m][idx][1], waypoints[m][nxt][1], e) * (lay.fh / 2 - 44);
    var ph = phases[m];
    mx += 2 * Math.sin(2 * Math.PI * tau / 30 + ph[0]);
    my += 1.5 * Math.sin(2 * Math.PI * tau / 24 + ph[1]);
    return [mx, my];
  }
  function spin(tau) { return -2 * Math.PI * tau / 60; }
  function circlePos(m, tau, lay) {
    var slot = m; // marks leave in order 0..8 and take slots in that order
    var ph = phases[m];
    var ang = spin(tau) + slot * 2 * Math.PI / 9 + 0.08 * Math.sin(2 * Math.PI * tau / 40 + ph[2]);
    var r = lay.cr * (0.94 + 0.08 * Math.sin(2 * Math.PI * tau / 48 + ph[0]));
    return [lay.cx + r * Math.cos(ang), lay.cy + r * Math.sin(ang), ang];
  }

  // Schedule (loop-local seconds). Mark 9 never leaves: the frame always
  // holds at least one mark.
  function exitTime(m) { return m < 9 ? 10 + 10 * m : Infinity; }
  function returnTime(m) {
    if (m === 0) return 100;
    if (m < 9) return 126 + 14 * (m - 1);
    return Infinity;
  }

  // Drag sessions, recorded with loop-local times. Closed-form: every
  // position is a pure function of (tau, sessions).
  var sessions = [];
  var active = null;
  var curT = 0;

  function effExit(m, tau) {
    var e = exitTime(m);
    if (e === Infinity) return Infinity;
    var best = e;
    var i, s;
    for (i = 0; i < sessions.length; i++) {
      s = sessions[i];
      if (s.kind !== 'inside' || s.mark !== m) continue;
      if (s.t1 === null || s.t1 > tau) continue;
      if (s.hurry && s.t1 < best) best = s.t1;
    }
    return best;
  }
  function spinOffset(tau) {
    var off = 0, i, s;
    for (i = 0; i < sessions.length; i++) {
      s = sessions[i];
      if (s.kind !== 'circle') continue;
      if (s.t0 > tau) continue;
      if (s.t1 === null) off += s.delta;
      else off += s.delta * Math.exp(-(tau - s.t1) / 3);
    }
    return off;
  }
  function circlePosDragged(m, tau, lay) {
    var slot = m;
    var ph = phases[m];
    var ang = spin(tau) + spinOffset(tau) + slot * 2 * Math.PI / 9 + 0.08 * Math.sin(2 * Math.PI * tau / 40 + ph[2]);
    var r = lay.cr * (0.94 + 0.08 * Math.sin(2 * Math.PI * tau / 48 + ph[0]));
    return [lay.cx + r * Math.cos(ang), lay.cy + r * Math.sin(ang), ang];
  }

  // Returns {x, y, state, color, scale} for one mark at loop-local tau.
  // States: 'inside', 'exiting', 'circle', 'returning'.
  function computeMark(m, tau, lay) {
    var e = effExit(m, tau);
    var r = returnTime(m);
    var ip = insidePos(m, tau, lay);
    var cp = circlePosDragged(m, tau, lay);
    var inColor = INSIDE;
    var outColor = (m % 2 === 0) ? OCHRE : BRICK;
    if (active && active.kind === 'inside' && active.mark === m && tau >= active.t0) {
      return { x: active.x, y: active.y, state: 'inside', color: inColor, scale: 1 };
    }
    if (e !== Infinity && tau >= e && tau < e + 8) {
      var u = smooth((tau - e) / 8);
      return {
        x: lerp(ip[0], cp[0], u), y: lerp(ip[1], cp[1], u),
        state: 'exiting', color: u < 0.5 ? inColor : outColor, scale: lerp(1, 1.6, u)
      };
    }
    if (e !== Infinity && tau >= e + 8 && tau < r) {
      return { x: cp[0], y: cp[1], state: 'circle', color: outColor, scale: 1.6, angle: cp[2] };
    }
    if (r !== Infinity && tau >= r && tau < r + 12) {
      var v = smooth((tau - r) / 12);
      return {
        x: lerp(cp[0], ip[0], v), y: lerp(cp[1], ip[1], v),
        state: 'returning', color: v < 0.5 ? outColor : inColor, scale: lerp(1.6, 1, v)
      };
    }
    return { x: ip[0], y: ip[1], state: 'inside', color: inColor, scale: 1 };
  }

  function stateAt(tau, lay) {
    var out = [], m;
    for (m = 0; m < NMARKS; m++) out.push(computeMark(m, tau, lay));
    return out;
  }

  function drawGlyph(x, y, s, tau, m, color) {
    var ph = phases[m];
    var wild = s > 1.3;
    var armAmp = wild ? 5 : 2.5;
    var armPer = wild ? 8 : 12;
    var aSwing = armAmp * Math.sin(2 * Math.PI * tau / armPer + ph[0]);
    var lSwing = armAmp * 0.8 * Math.sin(2 * Math.PI * tau / armPer + ph[1] + 1.3);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y - 9 * s); ctx.lineTo(x, y + 8 * s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y - 4 * s); ctx.lineTo(x - 7 * s, y - 2 * s + aSwing); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y - 4 * s); ctx.lineTo(x + 7 * s, y - 2 * s - aSwing); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y + 8 * s); ctx.lineTo(x - 6 * s, y + 16 * s + lSwing); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y + 8 * s); ctx.lineTo(x + 6 * s, y + 16 * s - lSwing); ctx.stroke();
  }

  function draw(t) {
    var tau = ((t % L) + L) % L;
    curT = tau;
    var s = size();
    var W = s.w, H = s.h;
    var lay = layout(W, H);
    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = GROUND;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, 0.88 * H); ctx.lineTo(W, 0.88 * H); ctx.stroke();
    var marks = stateAt(tau, lay);
    var m;
    for (m = 0; m < NMARKS; m++) {
      var g = 0.0028 * Math.min(W, H);
      drawGlyph(marks[m].x, marks[m].y, g * marks[m].scale, tau, m, marks[m].color);
    }
    // The frame line is drawn after the marks so it stays intact behind
    // every crossing: a mark steps through it, the line never breaks.
    ctx.save();
    ctx.translate(lay.fx, lay.fy);
    ctx.rotate(lay.tilt);
    ctx.strokeStyle = FRAME_LINE;
    ctx.lineWidth = 2;
    ctx.strokeRect(-lay.fw / 2, -lay.fh / 2, lay.fw, lay.fh);
    ctx.restore();
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function edgeDist(x, y, lay) {
    // Signed distance to the nearest frame edge (positive inside).
    var c = Math.cos(-lay.tilt), sn = Math.sin(-lay.tilt);
    var dx = x - lay.fx, dy = y - lay.fy;
    var lx = dx * c - dy * sn, ly = dx * sn + dy * c;
    return Math.min(lx + lay.fw / 2, lay.fw / 2 - lx, ly + lay.fh / 2, lay.fh / 2 - ly);
  }
  function pointOf(e) {
    var x = (typeof e.clientX === 'number') ? e.clientX : (e.offsetX || 0);
    var y = (typeof e.clientY === 'number') ? e.clientY : (e.offsetY || 0);
    return [x, y];
  }
  function onDown(e) {
    var p = pointOf(e);
    var s = size();
    var lay = layout(s.w, s.h);
    var marks = stateAt(curT, lay);
    var m, best = -1, bestD = 42;
    for (m = 0; m < NMARKS; m++) {
      var d = Math.hypot(marks[m].x - p[0], marks[m].y - p[1]);
      if (d < bestD) { bestD = d; best = m; }
    }
    if (best >= 0 && marks[best].state === 'inside') {
      active = { kind: 'inside', mark: best, t0: curT, t1: null, x: p[0], y: p[1], x0: p[0], y0: p[1], hurry: false };
      sessions.push(active);
      return;
    }
    var dc = Math.hypot(p[0] - lay.cx, p[1] - lay.cy);
    if (dc > lay.cr * 0.55 && dc < lay.cr * 1.45) {
      active = { kind: 'circle', t0: curT, t1: null, delta: 0, prevAng: Math.atan2(p[1] - lay.cy, p[0] - lay.cx), cx: lay.cx, cy: lay.cy };
      sessions.push(active);
    }
  }
  function onMove(e) {
    if (!active) return;
    var p = pointOf(e);
    if (active.kind === 'inside') { active.x = p[0]; active.y = p[1]; }
    else {
      var a = Math.atan2(p[1] - active.cy, p[0] - active.cx);
      active.delta += normAngle(a - active.prevAng);
      active.prevAng = a;
    }
  }
  function onUp(e) {
    if (!active) return;
    var p = pointOf(e);
    var s = size();
    var lay = layout(s.w, s.h);
    if (active.kind === 'inside') {
      active.x = p[0]; active.y = p[1];
      var d0 = edgeDist(active.x0, active.y0, lay);
      var d1 = edgeDist(active.x, active.y, lay);
      active.hurry = (d0 - d1) >= 40;
    }
    active.t1 = curT;
    active = null;
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    }
    try {
      if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
        window.visualViewport.addEventListener('resize', function () { draw(curT); });
      }
      if (typeof window !== 'undefined' && window.addEventListener) {
        window.addEventListener('resize', function () { draw(curT); });
      }
    } catch (e) {}
  }

  if (typeof window !== 'undefined') {
    window.__bd3 = {
      draw: draw,
      stateAt: function (tau) {
        var s = size();
        return stateAt(((tau % L) + L) % L, layout(s.w, s.h));
      },
      layout: function () {
        var s = size();
        return layout(s.w, s.h);
      },
      sessions: sessions
    };
  }

  size();
  draw(0);
  var startT = null;
  function loop(now) {
    if (startT === null) startT = now;
    var t = (now - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
