<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.213 Fly Brain</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#EDE6D2; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.213 Fly Brain (David Bowen). On warm paper: a glass sphere of
// about a hundred houseflies on the left, a drawing sheet on the
// right, and a small red CNC carriage bridging them. The flies are
// the brain; the sheet is the record. Bowen's mapping, kept exact:
// if one fly is isolated the carriage follows that fly and carves
// a hairline; if several are active it follows the centroid of the
// densest cluster and the line gouges as deep as the cluster is
// dense. After about three minutes the sheet scrolls away intact
// and a fresh one starts. Double tap inside the sphere for a new
// swarm and a fresh sheet.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#EDE6D2';
var SPECK = '#2A2A28', CHAR = '#1A1A18', GLASS = '#9FB8C4', CAR = '#8A2A1A';
var W = 0, H = 0, phone = false;
var seed = 213213;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
var T = 0, lastNow = -1;

// ---- geometry ---------------------------------------------------------------------
function sphereGeom() {
  var s = Math.min(W, H);
  if (phone) return { cx: W * 0.5, cy: H * 0.30, r: Math.min(W * 0.34, H * 0.20) };
  return { cx: W * 0.175, cy: H * 0.5, r: Math.min(W * 0.155, H * 0.21) };
}
function sheetGeom() {
  if (phone) return { x: W * 0.07, y: H * 0.56, w: W * 0.86, h: H * 0.38 };
  return { x: W * 0.335, y: H * 0.09, w: W * 0.615, h: H * 0.82 };
}

// ---- the flies ---------------------------------------------------------------------
var FLIES = 100;
var flies = [];
var frand = rng(seed ^ 0x5eed);
function seedFlies() {
  flies = [];
  var g = sphereGeom();
  for (var i = 0; i < FLIES; i++) {
    var a = frand() * 6.283, rr = Math.sqrt(frand()) * 0.8;
    flies.push({
      x: g.cx + Math.cos(a) * rr * g.r, y: g.cy + Math.sin(a) * rr * g.r,
      vx: (frand() - 0.5) * 60, vy: (frand() - 0.5) * 60,
      ph: frand() * 6.28
    });
  }
}
var startleT = -10;
function stepFlies(dt) {
  var g = sphereGeom();
  if (T - startleT > 7 + frand() * 9 && frand() < dt * 0.2) startleT = T;
  var burst = clamp(1 - (T - startleT) / 0.9, 0, 1);
  // coarse density grid over the sphere: 6 x 6 cells
  var cell = (g.r * 2) / 6, gx0 = g.cx - g.r, gy0 = g.cy - g.r;
  var counts = new Array(36).fill(0), sx = new Array(36).fill(0), sy = new Array(36).fill(0);
  var i, f;
  for (i = 0; i < FLIES; i++) {
    f = flies[i];
    var ci = clamp(((f.x - gx0) / cell) | 0, 0, 5), cj = clamp(((f.y - gy0) / cell) | 0, 0, 5);
    var ix = cj * 6 + ci;
    counts[ix]++; sx[ix] += f.x; sy[ix] += f.y;
  }
  for (i = 0; i < FLIES; i++) {
    f = flies[i];
    var ax = 0, ay = 0, n = 0, cxm = 0, cym = 0, avx = 0, avy = 0;
    for (var j = 0; j < FLIES; j++) {
      if (j === i) continue;
      var o = flies[j], dx = o.x - f.x, dy = o.y - f.y, d2 = dx * dx + dy * dy;
      if (d2 < 3600) { n++; cxm += o.x; cym += o.y; avx += o.vx; avy += o.vy;
        if (d2 < 260 && d2 > 0.01) { var d = Math.sqrt(d2); ax -= dx / d * 26; ay -= dy / d * 26; } }
    }
    if (n > 0) {
      cxm /= n; cym /= n; avx /= n; avy /= n;
      ax += (cxm - f.x) * 0.9 + (avx - f.vx) * 0.3;
      ay += (cym - f.y) * 0.9 + (avy - f.vy) * 0.3;
    }
    // a slow lure point roams the interior; the swarm condenses on it
    var la = T * 0.10 + Math.sin(T * 0.041) * 1.3;
    var lx = g.cx + Math.cos(la) * g.r * 0.38, ly = g.cy + Math.sin(la * 1.3) * g.r * 0.34;
    ax += (lx - f.x) * 0.10; ay += (ly - f.y) * 0.10;
    ax += Math.cos(T * 1.7 + f.ph) * 10 + (frand() - 0.5) * 22;
    ay += Math.sin(T * 2.3 + f.ph * 1.7) * 10 + (frand() - 0.5) * 22;
    if (burst > 0) { var bx = f.x - g.cx, by = f.y - g.cy, bd = Math.sqrt(bx * bx + by * by) || 1;
      ax += bx / bd * 340 * burst; ay += by / bd * 340 * burst; }
    f.vx += ax * dt; f.vy += ay * dt;
    f.vx *= (1 - 0.55 * dt); f.vy *= (1 - 0.55 * dt); // air drag: flies may hang
    var sp = Math.sqrt(f.vx * f.vx + f.vy * f.vy), maxSp = 120 + burst * 170;
    if (sp > maxSp) { f.vx *= maxSp / sp; f.vy *= maxSp / sp; }
    f.x += f.vx * dt; f.y += f.vy * dt;
    var wx = f.x - g.cx, wy = f.y - g.cy, wd = Math.sqrt(wx * wx + wy * wy);
    if (wd > g.r * 0.8) { // soft containment first, so the rim stays empty
      var inw = (wd - g.r * 0.8) * 6;
      f.vx -= (wx / (wd || 1)) * inw * dt * 10; f.vy -= (wy / (wd || 1)) * inw * dt * 10;
    }
    if (wd > g.r * 0.96) { // the glass itself, a true bounce
      var nx = wx / wd, ny = wy / wd;
      f.x = g.cx + nx * g.r * 0.96; f.y = g.cy + ny * g.r * 0.96;
      var vn = f.vx * nx + f.vy * ny;
      if (vn > 0) { f.vx -= 2 * vn * nx; f.vy -= 2 * vn * ny; }
    }
  }
  // the mapping table state: densest cell, and the loneliest fly
  var best = 0, bi = 0;
  for (i = 0; i < 36; i++) if (counts[i] > best) { best = counts[i]; bi = i; }
  var iso = null, isoScore = -1;
  for (i = 0; i < FLIES; i++) {
    f = flies[i];
    var nd = 1e9;
    for (j = 0; j < FLIES; j++) { if (j === i) continue; var p = flies[j];
      var q = (p.x - f.x) * (p.x - f.x) + (p.y - f.y) * (p.y - f.y); if (q < nd) nd = q; }
    if (nd > isoScore) { isoScore = nd; iso = f; }
  }
  return {
    density: best,
    centroid: best > 0 ? { x: sx[bi] / best, y: sy[bi] / best } : { x: g.cx, y: g.cy },
    isolated: iso, isoDist: Math.sqrt(isoScore)
  };
}

// ---- the sheet ----------------------------------------------------------------------
var segs = [];           // {x1,y1,x2,y2,w} in sheet-normalised coords
var sheetStart = 0, SHEET_LEN = 180, scrollK = 0;
var carPos = null, carPrev = null, carAng = 0;
function stepCarriage(mode, dt) {
  var g = sphereGeom(), sh = sheetGeom();
  var target, depth;
  var isoMode = mode.isolated && mode.isoDist > g.r * 0.34 && mode.density < 13;
  if (isoMode) { target = mode.isolated; depth = 0.5; }
  else { target = mode.centroid; depth = 0.5 + mode.density * 0.30; }
  var tx = (target.x - (g.cx - g.r)) / (2 * g.r), ty = (target.y - (g.cy - g.r)) / (2 * g.r);
  tx = clamp(tx, 0.02, 0.98); ty = clamp(ty, 0.02, 0.98);
  if (!carPos) { carPos = { x: tx, y: ty }; carPrev = { x: tx, y: ty }; return; }
  carPrev = { x: carPos.x, y: carPos.y };
  carPos.x += (tx - carPos.x) * Math.min(1, dt * 5.5);
  carPos.y += (ty - carPos.y) * Math.min(1, dt * 5.5);
  var dx = carPos.x - carPrev.x, dy = carPos.y - carPrev.y;
  var moved = Math.sqrt(dx * dx + dy * dy);
  if (moved > 0.0006) {
    carAng = Math.atan2(dy, dx);
    segs.push({ x1: carPrev.x, y1: carPrev.y, x2: carPos.x, y2: carPos.y, w: depth });
    if (segs.length > 5200) segs.splice(0, segs.length - 5200);
  }
}
function stepSim(dt) {
  var mode = stepFlies(dt);
  if (scrollK > 0) { scrollK = Math.max(0, scrollK - dt / 1.6); return; }
  if (T - sheetStart > SHEET_LEN) { scrollK = 1; sheetStart = T; segs = []; carPos = null; return; }
  stepCarriage(mode, dt);
}
// pre-run: the swarm mid-cluster, the sheet already carved.
// Runs after the first resize() (see bottom), never before it.
function preRun() {
  seedFlies();
  var saveT = T;
  for (var i = 0; i < 1500; i++) { T = i / 30; stepSim(1 / 30); }
  sheetStart = T; // the visible sheet's own clock starts now
  T = saveT;
}

// ---- input ----------------------------------------------------------------------------
var lastDownT = -9, pendingTap = false;
canvas.addEventListener('pointerdown', function (e) {
  var g = sphereGeom();
  var dx = e.clientX - g.cx, dy = e.clientY - g.cy;
  if (dx * dx + dy * dy > g.r * g.r * 1.2) return; // only inside the sphere
  if (T - lastDownT < 0.35) {
    pendingTap = false;
    seedFlies(); segs = []; carPos = null; scrollK = 0; sheetStart = T;
    lastDownT = -9;
  } else {
    pendingTap = true; lastDownT = T;
  }
});

// ---- resize ------------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drawing --------------------------------------------------------------------------------
function draw(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  if (dt > 0) { var steps = Math.max(1, Math.round(dt / (1 / 60))); for (var s = 0; s < steps; s++) { T += dt / steps; stepSim(dt / steps); } }
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  var g = sphereGeom(), sh = sheetGeom();
  // faint paper grain, deterministic
  ctx.fillStyle = 'rgba(120,105,80,0.05)';
  var gr = rng(99);
  for (var i = 0; i < 130; i++) ctx.fillRect(gr() * W, gr() * H, 1.3, 1.3);
  // the sheet: a whisper of a border and its shadow edge
  var scrollOff = scrollK * scrollK * sh.h * 1.06;
  ctx.fillStyle = 'rgba(90,80,60,0.16)';
  ctx.fillRect(sh.x + 3, sh.y + 4 + scrollOff, sh.w, sh.h);
  ctx.fillStyle = '#F2ECDC';
  ctx.fillRect(sh.x, sh.y + scrollOff, sh.w, sh.h);
  ctx.strokeStyle = 'rgba(90,80,60,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(sh.x, sh.y + scrollOff, sh.w, sh.h);
  // the carved record
  ctx.strokeStyle = CHAR;
  ctx.lineCap = 'round';
  for (i = 0; i < segs.length; i++) {
    var sg = segs[i];
    ctx.globalAlpha = 0.78;
    ctx.lineWidth = Math.max(0.5, sg.w * (phone ? 0.9 : 1.15));
    ctx.beginPath();
    ctx.moveTo(sh.x + sg.x1 * sh.w, sh.y + scrollOff + sg.y1 * sh.h);
    ctx.lineTo(sh.x + sg.x2 * sh.w, sh.y + scrollOff + sg.y2 * sh.h);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // the sphere
  ctx.beginPath();
  ctx.arc(g.cx, g.cy, g.r, 0, 6.2832);
  ctx.fillStyle = 'rgba(159,184,196,0.10)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(110,135,148,0.55)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  // specular arc
  ctx.beginPath();
  ctx.arc(g.cx, g.cy, g.r * 0.86, -2.45, -1.55);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = Math.max(1.5, g.r * 0.045);
  ctx.stroke();
  // the flies: dark specks, a slight smear along their motion
  ctx.strokeStyle = SPECK;
  ctx.lineCap = 'round';
  for (i = 0; i < FLIES; i++) {
    var f = flies[i];
    ctx.lineWidth = Math.max(1.5, g.r * 0.02);
    ctx.beginPath();
    ctx.moveTo(f.x - f.vx * 0.02, f.y - f.vy * 0.02);
    ctx.lineTo(f.x, f.y);
    ctx.stroke();
  }
  // the carriage: a small red CNC marker riding the record's head
  if (carPos && scrollK <= 0) {
    var px = sh.x + carPos.x * sh.w, py = sh.y + carPos.y * sh.h;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(carAng);
    ctx.fillStyle = CAR;
    var cs = Math.max(5, Math.min(W, H) * 0.011);
    ctx.beginPath();
    ctx.moveTo(cs * 1.5, 0); ctx.lineTo(-cs, -cs * 0.72); ctx.lineTo(-cs * 0.35, 0); ctx.lineTo(-cs, cs * 0.72);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    // its gantry thread back toward the sphere
    ctx.strokeStyle = 'rgba(138,42,26,0.30)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(g.cx + g.r * 0.96, g.cy);
    ctx.quadraticCurveTo((g.cx + px) / 2, Math.min(g.cy, py) - H * 0.05, px, py);
    ctx.stroke();
  }
}

resize();
preRun();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
