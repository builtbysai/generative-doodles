<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№119 · Grassline</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#F4F1E6; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(26,26,24,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to blow the wind</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// No.119 Grassline (after Zancan's grass.js): a thicket built only from 1px
// vector strokes. Growing tips rise from three root points on the bottom edge,
// fork at golden-angle jitter, and lay down short curved segments; the oldest
// segments fade and recycle so the field grows forever, dense at the roots and
// sparse at the tips. Growth is pre-rolled at load so the first frame already
// shows a developed thicket. The fingertip is wind: a drag builds a gust that
// bends nearby stems, and on release they spring back.
// Palette: paper #F4F1E6, ink #1A1A18, one seeded accent family. Nothing else.
const PAPER='#F4F1E6', INK='#1A1A18';
const rng=mulberry32(119119);
const ACCENT = rng()<0.5 ? '#2E4B2F' : '#8A2A1A';
const CAP=38000, MAXTIPS=95;
let W=0, H=0, roots=[], tips=[], segs=[];
let gust=0, gustX=0, lastPX=null, dragging=false, lastMs=null, simT=0;

function spawnTip(x,y,ang,acc,life){
  tips.push({x:x,y:y,ang:ang,acc:acc,age:0,life:life,homeX:x});
}
function stepLen(){ return Math.max(2.2, Math.min(W,H)*0.0045); }
function lifeSteps(){ return Math.round((0.55+rng()*0.65)*(H/stepLen())); }
function seedRoots(){
  roots=[W*0.24, W*0.52, W*0.76];
  tips=[]; segs=[];
  for(let i=0;i<34;i++){
    const rx=roots[i%roots.length]+(rng()-0.5)*W*0.05;
    spawnTip(rx, H+4, -Math.PI/2+(rng()-0.5)*0.55, rng()<0.10, lifeSteps());
  }
}
function growStep(){
  simT+=0.016;
  const sl=stepLen();
  const born=[];
  for(let i=tips.length-1;i>=0;i--){
    const tp=tips[i];
    const nx=tp.x+Math.cos(tp.ang)*sl;
    const ny=tp.y+Math.sin(tp.ang)*sl;
    segs.push({x1:tp.x,y1:tp.y,x2:nx,y2:ny,acc:tp.acc});
    tp.x=nx; tp.y=ny; tp.age++;
    tp.ang+=(rng()-0.5)*0.30 + Math.sin(tp.x*0.008+simT*0.7)*0.03;
    const up=-Math.PI/2;
    let d=up-tp.ang; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
    tp.ang+=d*0.05;
    tp.ang+=clamp((tp.homeX-tp.x)*0.0004,-0.018,0.018);
    if(rng()<0.05 && tips.length+born.length<MAXTIPS){
      const side=rng()<0.5?-1:1;
      born.push({x:tp.x,y:tp.y,ang:tp.ang+side*(0.30+rng()*0.25),acc:tp.acc,age:0,life:Math.round(lifeSteps()*0.7),homeX:tp.homeX});
    }
    if(tp.age>tp.life || tp.y<-24 || tp.x<-24 || tp.x>W+24){
      tips.splice(i,1);
      if(tips.length<42){
        const rx=roots[Math.floor(rng()*roots.length)]+(rng()-0.5)*W*0.05;
        spawnTip(rx, H+4, -Math.PI/2+(rng()-0.5)*0.55, rng()<0.10, lifeSteps());
      }
    }
  }
  for(let b=0;b<born.length;b++) tips.push(born[b]);
  if(segs.length>CAP) segs.splice(0, segs.length-CAP);
}
const BUCKET_ALPHA=[0.55,0.63,0.70,0.77,0.83,0.89,0.93,0.97];
const DEPTH_ALPHA=[0.60,0.82,1.0]; // tips (top) lightest, roots (bottom) full weight
function bend(x,y){
  if(gust===0) return 0;
  const dx=x-gustX;
  const prox=Math.exp(-(dx*dx)/(2*150*150));
  return gust*30*Math.pow(clamp(1-y/H,0,1),1.6)*prox;
}
function drawField(alphaScale){
  const total=segs.length;
  if(!total) return;
  ctx.lineWidth=1;
  for(let c=0;c<2;c++){
    for(let b=0;b<8;b++){
      const lo=Math.floor(total*b/8), hi=Math.floor(total*(b+1)/8);
      for(let d=0;d<3;d++){
        ctx.beginPath();
        for(let i=lo;i<hi;i++){
          const s=segs[i];
          if((s.acc?1:0)!==c) continue;
          const db=s.y1<H*0.4?0:(s.y1<H*0.75?1:2);
          if(db!==d) continue;
          ctx.moveTo(s.x1+bend(s.x1,s.y1), s.y1);
          ctx.lineTo(s.x2+bend(s.x2,s.y2), s.y2);
        }
        ctx.strokeStyle=c?ACCENT:INK;
        ctx.globalAlpha=BUCKET_ALPHA[b]*DEPTH_ALPHA[d]*alphaScale;
        ctx.stroke();
      }
    }
  }
  ctx.globalAlpha=1;
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  let dt=0; if(lastMs!==null) dt=Math.min(0.05,(nowMs-lastMs)/1000); lastMs=nowMs;
  if(w!==W||h!==H){ W=w; H=h; seedRoots(); const pre=Math.min(Math.ceil(H/stepLen()*1.2), Math.ceil(CAP*0.85/MAXTIPS)); for(let s=0;s<pre;s++) growStep(); }
  if(!dragging && gust!==0){ gust*=Math.pow(0.02,dt); if(Math.abs(gust)<0.002) gust=0; }
  growStep();
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,w,h);
  drawField(1);
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; lastPX=e.clientX; gustX=e.clientX; });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; gust=clamp(gust+(e.clientX-lastPX)*0.03,-1.6,1.6); lastPX=e.clientX; gustX=e.clientX; });
function endP(){ dragging=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(2400);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
