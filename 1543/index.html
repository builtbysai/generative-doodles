<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Binder, Open</title>
<style>
html, body { margin: 0; padding: 0; background: #0d0c10; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var SEED = 1543000;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rand = mulberry32(SEED);
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rand() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
var ORDER0 = shuffle([0, 1, 2, 3, 4, 5]);
var ORDER1 = shuffle([0, 1, 2, 3, 4, 5]);
while (ORDER1.join(',') === ORDER0.join(',')) {
  ORDER1 = shuffle([0, 1, 2, 3, 4, 5]);
}
var ORDERS = [ORDER0, ORDER1];
var HOLDS = [];
for (var hi = 0; hi < 12; hi++) HOLDS.push(8 + rand() * 7);

var FAMILY = {
  disc: 'round', wheel: 'round', ring: 'round', tire: 'round', dots: 'round',
  bars: 'straight', grid: 'straight',
  totem: 'pointed', zigzag: 'pointed'
};
// Each spread: pair declares its pairing rule. Primary mark = marks[0] on each page.
var SPREADS = [
  { pair: { kind: 'outline', family: 'round' },
    left: [
      { k: 'disc', c: '#cfc8b8', x: 0.30, y: 0.38, s: 0.26 },
      { k: 'ring', c: '#b8b8b8', x: 0.68, y: 0.62, s: 0.18 }
    ],
    right: [
      { k: 'wheel', c: '#cfc8b8', x: 0.32, y: 0.40, s: 0.28 },
      { k: 'dots', c: '#b8b8b8', x: 0.70, y: 0.66, s: 0.14 }
    ] },
  { pair: { kind: 'outline', family: 'straight' },
    left: [
      { k: 'bars', c: '#5a7a72', x: 0.30, y: 0.42, s: 0.26 },
      { k: 'grid', c: '#cfc8b8', x: 0.68, y: 0.60, s: 0.20 }
    ],
    right: [
      { k: 'grid', c: '#5a7a72', x: 0.34, y: 0.40, s: 0.24 },
      { k: 'bars', c: '#cfc8b8', x: 0.70, y: 0.64, s: 0.20 }
    ] },
  { pair: { kind: 'outline', family: 'pointed' },
    left: [
      { k: 'totem', c: '#c98f3d', x: 0.30, y: 0.42, s: 0.26 },
      { k: 'zigzag', c: '#b33324', x: 0.68, y: 0.62, s: 0.20 }
    ],
    right: [
      { k: 'zigzag', c: '#c98f3d', x: 0.32, y: 0.40, s: 0.24 },
      { k: 'totem', c: '#b33324', x: 0.70, y: 0.64, s: 0.22 }
    ] },
  { pair: { kind: 'color', answer: ['#cfc8b8', '#c98f3d'] },
    left: [
      { k: 'ring', c: '#cfc8b8', x: 0.30, y: 0.40, s: 0.26 },
      { k: 'dots', c: '#c98f3d', x: 0.68, y: 0.62, s: 0.14 }
    ],
    right: [
      { k: 'disc', c: '#c98f3d', x: 0.32, y: 0.40, s: 0.28 },
      { k: 'ring', c: '#cfc8b8', x: 0.70, y: 0.64, s: 0.18 }
    ] },
  { pair: { kind: 'color', answer: ['#b33324', '#5a7a72'] },
    left: [
      { k: 'tire', c: '#b33324', x: 0.30, y: 0.40, s: 0.28 },
      { k: 'bars', c: '#5a7a72', x: 0.68, y: 0.62, s: 0.20 }
    ],
    right: [
      { k: 'bars', c: '#5a7a72', x: 0.32, y: 0.40, s: 0.24 },
      { k: 'grid', c: '#b33324', x: 0.70, y: 0.62, s: 0.20 }
    ] },
  { pair: { kind: 'outline', family: 'round' },
    left: [
      { k: 'wheel', c: '#b8b8b8', x: 0.30, y: 0.40, s: 0.28 },
      { k: 'disc', c: '#cfc8b8', x: 0.68, y: 0.62, s: 0.20 }
    ],
    right: [
      { k: 'tire', c: '#b8b8b8', x: 0.32, y: 0.40, s: 0.28 },
      { k: 'ring', c: '#cfc8b8', x: 0.70, y: 0.64, s: 0.18 }
    ] }
];

var SLOTS = [];
(function () {
  var t = 0;
  for (var c = 0; c < 2; c++) {
    for (var p = 0; p < 6; p++) {
      var h = HOLDS[c * 6 + p];
      SLOTS.push({ cycle: c, pos: p, spread: ORDERS[c][p], start: t, end: t + h });
      t += h;
    }
  }
})();
var LOOP = SLOTS[SLOTS.length - 1].end;

var W = 0, H = 0;
var binder = { x: 0, y: 0, w: 0, h: 0, pw: 0, seam: 0 };
var lastT = 0;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function loopLocal(t) {
  var u = t % LOOP;
  if (u < 0) u += LOOP;
  return u;
}
function slotAt(u) {
  for (var i = 0; i < SLOTS.length; i++) {
    if (u < SLOTS[i].end) return SLOTS[i];
  }
  return SLOTS[SLOTS.length - 1];
}
function findInOrders(spread) {
  for (var c = 0; c < 2; c++) {
    for (var p = 0; p < 6; p++) {
      if (ORDERS[c][p] === spread) return { cycle: c, pos: p };
    }
  }
  return { cycle: 0, pos: 0 };
}

var pageEvents = []; // { side: 'L'|'R', t, to }
var markEvents = []; // { side, spread, mi, dx, dy, epoch }
var grab = null; // { side, spread, mi, epoch, startX, startY, dx, dy }

function displayedSpread(side, t) {
  var sched = slotAt(loopLocal(t)).spread;
  var last = null;
  for (var i = 0; i < pageEvents.length; i++) {
    var e = pageEvents[i];
    if (e.side === side && e.t <= t) last = e;
  }
  if (!last) return sched;
  var lu = loopLocal(last.t);
  var slot = slotAt(lu);
  var boundary = Math.floor(last.t / LOOP) * LOOP + slot.end;
  if (t < boundary) return last.to;
  return sched;
}
function displayEpoch(side, t) {
  var loops = Math.floor(t / LOOP);
  var u = loopLocal(t);
  var c = 0;
  for (var i = 0; i < SLOTS.length; i++) {
    if (SLOTS[i].end <= u) c++;
  }
  var count = loops * 12 + c;
  for (var j = 0; j < pageEvents.length; j++) {
    if (pageEvents[j].side === side && pageEvents[j].t <= t) count++;
  }
  return count;
}
function markOffset(side, spread, mi, t) {
  var epoch = displayEpoch(side, t);
  var dx = 0, dy = 0;
  for (var i = 0; i < markEvents.length; i++) {
    var e = markEvents[i];
    if (e.side === side && e.spread === spread && e.mi === mi && e.epoch === epoch) {
      dx = e.dx; dy = e.dy;
    }
  }
  if (grab && grab.side === side && grab.spread === spread && grab.mi === mi && grab.epoch === epoch) {
    dx = grab.dx; dy = grab.dy;
  }
  return { dx: dx, dy: dy };
}
function pageRect(side) {
  if (side === 'L') return { x: binder.x, y: binder.y, w: binder.pw, h: binder.h };
  return { x: binder.x + binder.pw + binder.seam, y: binder.y, w: binder.pw, h: binder.h };
}
function marksFor(side, t) {
  var spread = displayedSpread(side, t);
  var rect = pageRect(side);
  var list = SPREADS[spread][side === 'L' ? 'left' : 'right'];
  var out = [];
  for (var i = 0; i < list.length; i++) {
    var m = list[i];
    var off = markOffset(side, spread, i, t);
    out.push({
      k: m.k, c: m.c, x: m.x, y: m.y, s: m.s,
      px: rect.x + (m.x + off.dx) * rect.w,
      py: rect.y + (m.y + off.dy) * rect.h,
      off: off
    });
  }
  return { spread: spread, rect: rect, marks: out };
}

function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  } else { vw = 720; vh = 720; }
  W = vw; H = vh;
  var maxW = 0.88 * W, maxH = 0.84 * H;
  var aspect = 2.03 / 1.3889; // two pages (0.72 w/h each) plus a 0.03-page seam
  var bh = Math.min(maxH, maxW / aspect);
  var bw = bh * aspect;
  binder.x = (W - bw) / 2; binder.y = (H - bh) / 2;
  binder.w = bw; binder.h = bh;
  binder.pw = bw / 2.03; binder.seam = 0.03 * binder.pw;
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}

function hitMark(side, t, cx, cy) {
  var info = marksFor(side, t);
  for (var i = 0; i < info.marks.length; i++) {
    var m = info.marks[i];
    var r = m.s * info.rect.w * 0.6 + 12;
    var dx = cx - m.px, dy = cy - m.py;
    if (dx * dx + dy * dy <= r * r) return i;
  }
  return -1;
}
function sideAt(cx, cy) {
  var l = pageRect('L'), r = pageRect('R');
  if (cx >= l.x && cx <= l.x + l.w && cy >= l.y && cy <= l.y + l.h) return 'L';
  if (cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h) return 'R';
  return null;
}
function onDown(e) {
  size();
  var side = sideAt(e.clientX, e.clientY);
  if (!side) return;
  var mi = hitMark(side, lastT, e.clientX, e.clientY);
  if (mi >= 0) {
    grab = {
      side: side, spread: displayedSpread(side, lastT), mi: mi,
      epoch: displayEpoch(side, lastT),
      startX: e.clientX, startY: e.clientY, dx: 0, dy: 0
    };
  } else {
    var cur = displayedSpread(side, lastT);
    var loc = findInOrders(cur);
    var to = ORDERS[loc.cycle][(loc.pos + 1) % 6];
    pageEvents.push({ side: side, t: lastT, to: to });
  }
  if (e.preventDefault) e.preventDefault();
}
function onMove(e) {
  if (!grab) return;
  var rect = pageRect(grab.side);
  var px = e.clientX - grab.startX, py = e.clientY - grab.startY;
  var maxLen = 0.10 * rect.w;
  var len = Math.sqrt(px * px + py * py);
  if (len > maxLen && len > 0) { px *= maxLen / len; py *= maxLen / len; }
  // Clamp so the mark center stays inside its page with a small margin.
  var base = SPREADS[grab.spread][grab.side === 'L' ? 'left' : 'right'][grab.mi];
  var cx = rect.x + base.x * rect.w + px;
  var cy = rect.y + base.y * rect.h + py;
  var mg = 0.03;
  cx = clamp(cx, rect.x + mg * rect.w, rect.x + (1 - mg) * rect.w);
  cy = clamp(cy, rect.y + mg * rect.h, rect.y + (1 - mg) * rect.h);
  grab.dx = (cx - (rect.x + base.x * rect.w)) / rect.w;
  grab.dy = (cy - (rect.y + base.y * rect.h)) / rect.h;
}
function onUp() {
  if (grab) {
    if (grab.dx !== 0 || grab.dy !== 0) {
      markEvents.push({
        side: grab.side, spread: grab.spread, mi: grab.mi,
        dx: grab.dx, dy: grab.dy, epoch: grab.epoch
      });
    }
    grab = null;
  }
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', size);
  }
  if (window.addEventListener) window.addEventListener('resize', size);
}

function circlePath(cx, cy, r) {
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
}
function drawMark(m, rect) {
  var cx = m.px, cy = m.py;
  var r = m.s * rect.w / 2;
  ctx.lineCap = 'butt';
  ctx.lineJoin = 'miter';
  if (m.k === 'disc') {
    ctx.fillStyle = m.c;
    circlePath(cx, cy, r);
    ctx.fill();
  } else if (m.k === 'ring') {
    ctx.strokeStyle = m.c;
    ctx.lineWidth = Math.max(2, r * 0.18);
    circlePath(cx, cy, r);
    ctx.stroke();
  } else if (m.k === 'wheel') {
    ctx.strokeStyle = m.c;
    ctx.lineWidth = Math.max(2, r * 0.16);
    circlePath(cx, cy, r);
    ctx.stroke();
    ctx.lineWidth = Math.max(2, r * 0.14);
    for (var a = 0; a < 4; a++) {
      var ang = a * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(cx - Math.cos(ang) * r, cy - Math.sin(ang) * r);
      ctx.lineTo(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r);
      ctx.stroke();
    }
  } else if (m.k === 'tire') {
    ctx.strokeStyle = m.c;
    ctx.lineWidth = Math.max(3, r * 0.42);
    circlePath(cx, cy, r * 0.78);
    ctx.stroke();
    ctx.strokeStyle = '#26221e';
    ctx.lineWidth = Math.max(2, r * 0.10);
    for (var ti = 0; ti < 12; ti++) {
      var ta = ti * Math.PI / 6 + 0.35;
      var x1 = cx + Math.cos(ta) * r * 0.52, y1 = cy + Math.sin(ta) * r * 0.52;
      var x2 = cx + Math.cos(ta) * r * 1.02, y2 = cy + Math.sin(ta) * r * 1.02;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
  } else if (m.k === 'bars') {
    ctx.fillStyle = m.c;
    var bw = r * 0.42, gap = r * 0.16;
    var hs = [0.9, 0.6, 1.0, 0.7];
    var total = 4 * bw + 3 * gap;
    for (var bi = 0; bi < 4; bi++) {
      var bx = cx - total / 2 + bi * (bw + gap);
      var bh2 = hs[bi] * r * 2;
      ctx.fillRect(bx, cy - bh2 / 2, bw, bh2);
    }
  } else if (m.k === 'grid') {
    ctx.strokeStyle = m.c;
    ctx.lineWidth = 2;
    var g = r * 2;
    ctx.strokeRect(cx - g / 2, cy - g / 2, g, g);
    ctx.beginPath();
    ctx.moveTo(cx - g / 6, cy - g / 2);
    ctx.lineTo(cx - g / 6, cy + g / 2);
    ctx.moveTo(cx + g / 6, cy - g / 2);
    ctx.lineTo(cx + g / 6, cy + g / 2);
    ctx.moveTo(cx - g / 2, cy - g / 6);
    ctx.lineTo(cx + g / 2, cy - g / 6);
    ctx.moveTo(cx - g / 2, cy + g / 6);
    ctx.lineTo(cx + g / 2, cy + g / 6);
    ctx.stroke();
    ctx.fillStyle = m.c;
    ctx.fillRect(cx - g / 6, cy - g / 6, g / 3, g / 3);
  } else if (m.k === 'totem') {
    ctx.fillStyle = m.c;
    for (var si = 0; si < 3; si++) {
      var ty = cy - r + si * (r * 2 / 3);
      var th = r * 2 / 3;
      ctx.beginPath();
      ctx.moveTo(cx, ty);
      ctx.lineTo(cx - r * 0.55, ty + th);
      ctx.lineTo(cx + r * 0.55, ty + th);
      ctx.closePath();
      ctx.fill();
    }
  } else if (m.k === 'zigzag') {
    ctx.strokeStyle = m.c;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - r, cy + r * 0.5);
    ctx.lineTo(cx - r * 0.5, cy - r * 0.5);
    ctx.lineTo(cx, cy + r * 0.5);
    ctx.lineTo(cx + r * 0.5, cy - r * 0.5);
    ctx.lineTo(cx + r, cy + r * 0.5);
    ctx.stroke();
  } else if (m.k === 'dots') {
    ctx.fillStyle = m.c;
    var offs = [[-0.6, -0.6], [0.6, -0.6], [0, 0], [-0.6, 0.6], [0.6, 0.6]];
    for (var di = 0; di < offs.length; di++) {
      var ds = Math.max(3, r * 0.22);
      ctx.fillRect(cx + offs[di][0] * r - ds / 2, cy + offs[di][1] * r - ds / 2, ds, ds);
    }
  }
}

function draw(t) {
  size();
  lastT = t;
  ctx.fillStyle = '#0d0c10';
  ctx.fillRect(0, 0, W, H);

  var l = pageRect('L'), r = pageRect('R');
  ctx.fillStyle = '#26221e';
  ctx.fillRect(l.x, l.y, l.w, l.h);
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = '#3a352e';
  ctx.fillRect(l.x + l.w, l.y, binder.seam, l.h);

  var li = marksFor('L', t);
  for (var i = 0; i < li.marks.length; i++) drawMark(li.marks[i], l);
  var ri = marksFor('R', t);
  for (var j = 0; j < ri.marks.length; j++) drawMark(ri.marks[j], r);

  if (typeof window !== 'undefined') {
    window.__t43 = {
      loop: LOOP, slots: SLOTS, orders: ORDERS, holds: HOLDS,
      spreads: SPREADS, families: FAMILY,
      binder: { x: binder.x, y: binder.y, w: binder.w, h: binder.h, pw: binder.pw, seam: binder.seam },
      leftSpread: displayedSpread('L', t),
      rightSpread: displayedSpread('R', t),
      left: li, right: ri,
      spreadAt: function (u) { return slotAt(loopLocal(u)).spread; },
      epochL: displayEpoch('L', t),
      epochR: displayEpoch('R', t)
    };
  }
}

var startT = null;
function loop(ts) {
  if (startT === null) startT = ts;
  draw((ts - startT) / 1000);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
draw(0);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
