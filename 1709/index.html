<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quilt of Jittered Cells</title>
<style>
html, body { margin: 0; padding: 0; background: #3B1F5E; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#3B1F5E';
var PLATE = '#241040';
var PLATE_LINE = 'rgba(242,214,30,0.55)';
var TITLE_INK = '#F7F2E8';
var HINT_INK = '#F2D61E';
var YELLOW = '#F2D61E';
var ORANGE = '#E8481F';
var BLUE = '#2545D3';
var TEAL = '#12807A';
var PURPLE = '#3B1F5E';
var PERIOD = 24;
var FRAME_T = 6.0;
var COLS = 6;
var ROWS = 6;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* ---- seeded 1D value noise / fbm ---- */
function hash1(n) {
  var h = Math.imul(n | 0, 0x27D4EB2D) ^ 0x9E3779B9;
  h = Math.imul(h ^ (h >>> 15), 0x85EBCA6B);
  h = h ^ (h >>> 13);
  return ((h >>> 0) / 4294967296);
}
function vnoise(x) {
  var i = Math.floor(x), f = x - i;
  var a = hash1(i), b = hash1(i + 1);
  return a + (b - a) * smooth(f);
}
function fbm1(x) {
  var v = 0, amp = 0.5, f = 1, o;
  for (o = 0; o < 4; o++) { v += amp * vnoise(x * f); f *= 2.03; amp *= 0.5; }
  return v;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1709);
var FILLS = [YELLOW, ORANGE, TEAL];
/* per-cell fill colors and stitch marks are pure hash functions of (i, j),
   so the assignment is deterministic for any grid size (phone rows differ) */
function cellFillAt(i, j) {
  var h = hash1(i * 57.31 + j * 91.17 + 1709.5);
  return FILLS[Math.floor(h * FILLS.length)];
}
function stitchAt(i, j) {
  return hash1(i * 13.7 + j * 41.3 + 1709.25) < 0.4;
}
/* seeded grain dots, fixed positions in stage space */
var grain = [];
var gi;
for (gi = 0; gi < 320; gi++) {
  grain.push({ x: rng(), y: rng(), r: 0.6 + rng() * 1.3, a: 0.03 + rng() * 0.06 });
}
var phaseT = FRAME_T;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: square on desktop, full-bleed on phones ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- hand-drawn jittered rounded rect, centered at (cx, cy), in local coords ---- */
function jitteredRect(cx, cy, w, h, r, seed, jit) {
  var seg = 7, s, t, x, y, nx, ny;
  var pts = [];
  /* top edge, left to right */
  for (s = 0; s <= seg; s++) {
    t = s / seg;
    x = cx - w / 2 + r + t * (w - 2 * r);
    y = cy - h / 2 + (fbm1(seed + t * 3.1) - 0.5) * 2 * jit;
    pts.push([x, y]);
  }
  /* right edge, top to bottom */
  for (s = 1; s <= seg; s++) {
    t = s / seg;
    x = cx + w / 2 + (fbm1(seed + 11.7 + t * 3.1) - 0.5) * 2 * jit;
    y = cy - h / 2 + r + t * (h - 2 * r);
    pts.push([x, y]);
  }
  /* bottom edge, right to left */
  for (s = 1; s <= seg; s++) {
    t = s / seg;
    x = cx + w / 2 - r - t * (w - 2 * r);
    y = cy + h / 2 + (fbm1(seed + 23.3 + t * 3.1) - 0.5) * 2 * jit;
    pts.push([x, y]);
  }
  /* left edge, bottom to top */
  for (s = 1; s <= seg; s++) {
    t = s / seg;
    x = cx - w / 2 + (fbm1(seed + 37.9 + t * 3.1) - 0.5) * 2 * jit;
    y = cy + h / 2 - r - t * (h - 2 * r);
    pts.push([x, y]);
  }
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (s = 1; s < pts.length; s++) ctx.lineTo(pts[s][0], pts[s][1]);
  ctx.closePath();
}
/* shared-phase ripple: every cell breathes from one slow global wave */
function cellWave(cx, cy) {
  var g = TAU * phaseT / PERIOD;
  var s = 0.9 * (cx + cy);
  return {
    dx: 0.0045 * Math.sin(g + s) + 0.0025 * Math.sin(g * 0.5 + s * 0.6 + 1.3),
    dy: 0.0045 * Math.cos(g * 0.85 + s * 0.8) + 0.0025 * Math.sin(g * 0.5 + s + 2.1),
    rot: 0.022 * Math.sin(g + s * 0.7),
    sc: 1 + 0.014 * Math.sin(g + s * 0.5)
  };
}
/* ---- plate metrics: shared by the grid layout and drawPlates,
   so the grid always clears both plates ---- */
function plateMetrics() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Quilt of Jittered Cells').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Quilt of Jittered Cells').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 16').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var hint = 'Watch the quilt breathe.';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  return {
    smallPx: smallPx, titlePx: titlePx, titleW: titleW,
    plateW: plateW, plateH: plateH, plateBottom: 12 + plateH,
    hintPlateW: hintPlateW, hintPlateH: hintPlateH,
    hintTop: VH - hintPlateH - 12
  };
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var sw = st.w, sh = st.h;
  var margin = Math.min(sw, sh) * 0.045;
  var gap = Math.min(sw, sh) * 0.030;
  var gw = sw - margin * 2, gh = sh - margin * 2;
  /* rows follow the stage aspect so cells stay near-square on tall phones */
  var rows = Math.max(ROWS, Math.round(COLS * gh / gw));
  /* grid rect: top edge below the title plate, bottom edge above the
     hint plate, fitted so cells stay square (grid aspect COLS/rows) */
  var pm = plateMetrics();
  var clear = 14;
  var availTop = Math.max(st.y + margin, pm.plateBottom + clear);
  var availBottom = Math.min(st.y + sh - margin, pm.hintTop - clear);
  var availH = availBottom - availTop;
  var availW = sw - margin * 2;
  var gridH = availH, gridW = availH * COLS / rows;
  if (gridW > availW) { gridW = availW; gridH = gridW * rows / COLS; }
  var gx = st.x + (sw - gridW) / 2;
  var gy = availTop + (availH - gridH) / 2;
  var cw = (gridW - gap * (COLS - 1)) / COLS;
  var ch = (gridH - gap * (rows - 1)) / rows;
  var frame = Math.min(cw, ch) * 0.11;
  var jit = Math.min(cw, ch) * 0.020;
  var i, j;
  ctx.save();
  ctx.beginPath();
  ctx.rect(st.x, st.y, sw, sh);
  ctx.clip();
  for (j = 0; j < rows; j++) {
    for (i = 0; i < COLS; i++) {
      var cx = gx + cw / 2 + i * (cw + gap);
      var cy = gy + ch / 2 + j * (ch + gap);
      var wv = cellWave(i, j);
      ctx.save();
      ctx.translate(cx + wv.dx * sh, cy + wv.dy * sh);
      ctx.rotate(wv.rot);
      ctx.scale(wv.sc, wv.sc);
      /* cobalt blue frame, slightly larger than the fill */
      jitteredRect(0, 0, cw + frame * 1.6, ch + frame * 1.6, Math.min(cw, ch) * 0.10, i * 7.31 + j * 13.7, jit * 1.4);
      ctx.fillStyle = BLUE;
      ctx.fill();
      /* bold flat fill, hand-painted edges */
      jitteredRect(0, 0, cw, ch, Math.min(cw, ch) * 0.08, i * 3.17 + j * 9.41 + 100, jit);
      ctx.fillStyle = cellFillAt(i, j);
      ctx.fill();
      /* faint inner seam, a hand-stitched hint */
      ctx.lineWidth = Math.max(0.75, Math.min(cw, ch) * 0.012);
      ctx.strokeStyle = rgba('#241040', 0.22);
      jitteredRect(0, 0, cw * 0.82, ch * 0.82, Math.min(cw, ch) * 0.06, i * 5.03 + j * 2.29 + 200, jit * 0.8);
      ctx.stroke();
      /* small stitch dot at the cell center, on some cells only */
      if (stitchAt(i, j)) {
        ctx.fillStyle = rgba('#241040', 0.35);
        var ds = Math.min(cw, ch) * 0.055;
        ctx.fillRect(-ds / 2, -ds / 2, ds, ds);
      }
      ctx.restore();
    }
  }
  /* grain speckle, fixed seeded positions */
  for (gi = 0; gi < grain.length; gi++) {
    var gx = st.x + grain[gi].x * sw;
    var gy = st.y + grain[gi].y * sh;
    ctx.fillStyle = 'rgba(36,16,64,' + grain[gi].a.toFixed(4) + ')';
    ctx.fillRect(gx - grain[gi].r / 2, gy - grain[gi].r / 2, grain[gi].r, grain[gi].r);
  }
  ctx.restore();
  drawPlates();
}
function drawPlates() {
  var pm = plateMetrics();
  var smallPx = pm.smallPx;
  var titlePx = pm.titlePx;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  var plateW = pm.plateW;
  var plateH = pm.plateH;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Quilt of Jittered Cells', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 16', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the quilt breathe.';
  ctx.font = smallPx + 'px monospace';
  var hintPlateW = pm.hintPlateW;
  var hintPlateH = pm.hintPlateH;
  var hintPlateX = 12;
  var hintPlateY = pm.hintTop;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    cellCount: function () {
      var st = stageRect();
      var rows = Math.max(ROWS, Math.round(COLS * (st.h - 0.09 * Math.min(st.w, st.h)) / (st.w - 0.09 * Math.min(st.w, st.h))));
      return COLS * rows;
    },
    cellOffsetAt: function (ci, cj) {
      var wv = cellWave(ci, cj);
      return { dx: wv.dx, dy: wv.dy, rot: wv.rot };
    },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed pre-roll t = 6s ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
