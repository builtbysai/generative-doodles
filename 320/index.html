<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.320 Cockatoo Press</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#2F7E7B; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.320 Cockatoo Press (Coral Cockatoo).
// The brand bird as a flat screen print: one sulphur-crested
// cockatoo perched on a diagonal eucalyptus branch, bold flat
// shapes only, no gradients, no text anywhere. Ground is
// eucalyptus teal; the bird is white with a sulphur crest and
// a black beak and eye; the branch is sage.
// Idle is a 16 second seamless loop: the crest slowly raises
// and lowers, the tail tips, and there is one slow blink at
// 9 seconds, so frame 16s is identical to frame 0. Frame one
// has the crest half-raised, mid-gesture. A tap plays exactly
// 3 quick head-bobs inside a 1.2 second keyframed burst on
// the head group only, then it settles and the loop carries
// on unrestarted. All marks are drawn each frame on ONE
// canvas, no offscreen canvases.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var WHITE = '#F5F5F0', SULPHUR = '#E8B93C', BLACK = '#1A1A1A', SAGE = '#7A8B6F', TEAL = '#2F7E7B';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 0, lastNow = -1, acc = 0;
var TICK = 1 / 60;
var LOOP = 16;

function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }
function smooth(a, b, x) { var t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

// ---- composition: exactly 1 cockatoo, exactly 8 crest feathers ----
var COCKATOOS = 1;
if (COCKATOOS !== 1) throw new Error('Cockatoo Press needs exactly 1 cockatoo');
// Feather fan: folded angles cluster narrow and lean back,
// raised angles open into a wide fan. Lengths are authored
// with a small seeded jitter, longest in the middle.
var FEATHERS = [];
(function () {
  var r = rng(32007);
  var folded = [-1.92, -1.85, -1.78, -1.71, -1.64, -1.57, -1.50, -1.43];
  var raised = [-2.42, -2.22, -2.02, -1.82, -1.62, -1.42, -1.22, -1.02];
  var baseLen = [92, 108, 124, 134, 134, 124, 108, 92];
  for (var i = 0; i < 8; i++) {
    FEATHERS.push({ folded: folded[i], raised: raised[i], len: baseLen[i] + (r() - 0.5) * 8, wid: 40 });
  }
})();
if (FEATHERS.length !== 8) throw new Error('Cockatoo Press needs exactly 8 crest feathers');
var CREST_PIVOT = { x: 692, y: 148 };

// Head-bob burst: keyframed, exactly 3 bobs in exactly 1.2s.
var BOB_KEYS = [
  { t: 0.00, dy: 0, rot: 0 },
  { t: 0.20, dy: 18, rot: 0.07 },
  { t: 0.40, dy: 0, rot: 0 },
  { t: 0.60, dy: 18, rot: 0.07 },
  { t: 0.80, dy: 0, rot: 0 },
  { t: 1.00, dy: 18, rot: 0.07 },
  { t: 1.20, dy: 0, rot: 0 }
];
var BOB_DUR = 1.2;
var BOB_COUNT = 0;
for (var bi = 0; bi < BOB_KEYS.length; bi++) if (BOB_KEYS[bi].dy === 18) BOB_COUNT++;
if (BOB_COUNT !== 3) throw new Error('Cockatoo Press head-bob needs exactly 3 bobs');
var bobStart = -1;

var HEAD = { x: 715, y: 212, r: 84 };
var NECK = { x: 665, y: 278 };
var EYE = { x: 742, y: 202, r: 13 };
var BODY = { x: 595, y: 382, rx: 142, ry: 168, rot: -0.16 };
var TAIL_PIVOT = { x: 548, y: 498 };
var BRANCH = { x1: 195, y1: 695, x2: 1085, y2: 315 };
var LEAVES = [
  { x: 262, y: 548, len: 84, wid: 26, ang: -2.25 },
  { x: 322, y: 618, len: 72, wid: 22, ang: 0.55 },
  { x: 948, y: 300, len: 88, wid: 27, ang: -0.85 },
  { x: 1006, y: 372, len: 70, wid: 21, ang: 0.95 },
  { x: 232, y: 660, len: 76, wid: 23, ang: 2.65 }
];

function drawLeaf(l) {
  ctx.save();
  ctx.translate(l.x, l.y); ctx.rotate(l.ang);
  ctx.beginPath();
  ctx.moveTo(-l.len / 2, 0);
  ctx.quadraticCurveTo(-l.len * 0.1, -l.wid, l.len / 2, 0);
  ctx.quadraticCurveTo(-l.len * 0.1, l.wid, -l.len / 2, 0);
  ctx.closePath();
  ctx.fillStyle = SAGE; ctx.fill();
  ctx.restore();
}
function drawBranch() {
  ctx.strokeStyle = SAGE; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = 38;
  ctx.beginPath(); ctx.moveTo(BRANCH.x1, BRANCH.y1); ctx.lineTo(BRANCH.x2, BRANCH.y2); ctx.stroke();
  ctx.lineWidth = 16;
  ctx.beginPath(); ctx.moveTo(348, 622); ctx.lineTo(268, 552); ctx.stroke();
  ctx.lineWidth = 14;
  ctx.beginPath(); ctx.moveTo(884, 400); ctx.lineTo(944, 306); ctx.stroke();
  for (var i = 0; i < LEAVES.length; i++) drawLeaf(LEAVES[i]);
}
function drawTail(tailAng) {
  ctx.save();
  ctx.translate(TAIL_PIVOT.x, TAIL_PIVOT.y); ctx.rotate(tailAng);
  ctx.beginPath();
  ctx.moveTo(-30, -6);
  ctx.quadraticCurveTo(-38, 130, -64, 268);
  ctx.quadraticCurveTo(-58, 288, -38, 284);
  ctx.quadraticCurveTo(8, 272, 30, 120);
  ctx.quadraticCurveTo(38, 50, 34, -6);
  ctx.closePath();
  ctx.fillStyle = WHITE; ctx.fill();
  ctx.restore();
}
function drawBody() {
  ctx.save();
  ctx.translate(BODY.x, BODY.y); ctx.rotate(BODY.rot);
  ctx.beginPath(); ctx.ellipse(0, 0, BODY.rx, BODY.ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = WHITE; ctx.fill();
  ctx.restore();
  // Wing: a white shape on the body, edged and feathered with
  // ground teal lines so it reads against the white body.
  ctx.save();
  ctx.translate(572, 392); ctx.rotate(-0.28);
  ctx.beginPath(); ctx.ellipse(0, 0, 86, 124, 0, 0, Math.PI * 2);
  ctx.fillStyle = WHITE; ctx.fill();
  ctx.strokeStyle = TEAL; ctx.lineWidth = 5; ctx.stroke();
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-38, -62); ctx.quadraticCurveTo(28, -6, -18, 74); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-58, -30); ctx.quadraticCurveTo(2, 22, -34, 92); ctx.stroke();
  ctx.restore();
}
function drawFeet() {
  ctx.fillStyle = BLACK;
  ctx.save(); ctx.translate(576, 532); ctx.rotate(-0.43);
  ctx.beginPath(); ctx.ellipse(0, 0, 24, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(648, 502); ctx.rotate(-0.43);
  ctx.beginPath(); ctx.ellipse(0, 0, 24, 10, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}
function featherPath(f, ang) {
  ctx.save();
  ctx.translate(CREST_PIVOT.x, CREST_PIVOT.y); ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(f.len * 0.32, -f.wid, f.len, 0);
  ctx.quadraticCurveTo(f.len * 0.32, f.wid, 0, 0);
  ctx.closePath();
  ctx.fillStyle = SULPHUR; ctx.fill();
  ctx.restore();
}
function bobPose() {
  if (bobStart < 0) return { dy: 0, rot: 0 };
  var bt = T - bobStart;
  if (bt < 0 || bt >= BOB_DUR) { if (bt >= BOB_DUR) bobStart = -1; return { dy: 0, rot: 0 }; }
  for (var i = 0; i + 1 < BOB_KEYS.length; i++) {
    var a = BOB_KEYS[i], b = BOB_KEYS[i + 1];
    if (bt >= a.t && bt <= b.t) {
      var f = (bt - a.t) / (b.t - a.t);
      f = f * f * (3 - 2 * f);
      return { dy: a.dy + (b.dy - a.dy) * f, rot: a.rot + (b.rot - a.rot) * f };
    }
  }
  return { dy: 0, rot: 0 };
}
function drawHead(lt) {
  var raised = 0.5 + 0.5 * Math.sin(Math.PI * 2 * lt / LOOP);
  // One slow blink at 9s: the eye bead scales shut and back.
  var eyeScale = 1;
  var bd = Math.abs(lt - 9);
  if (bd < 0.24) { var bp = 1 - bd / 0.24; eyeScale = 1 - 0.92 * (bp * bp * (3 - 2 * bp)); }
  var bob = bobPose();
  ctx.save();
  ctx.translate(NECK.x, NECK.y); ctx.rotate(bob.rot); ctx.translate(0, bob.dy); ctx.translate(-NECK.x, -NECK.y);
  // Crest fan behind the head, exactly 8 feather paths.
  for (var i = 0; i < FEATHERS.length; i++) {
    var f = FEATHERS[i];
    featherPath(f, f.folded + (f.raised - f.folded) * raised);
  }
  // Head: one round white shape joining the body at the neck.
  ctx.fillStyle = WHITE; circ(HEAD.x, HEAD.y, HEAD.r, true);
  ctx.save();
  ctx.translate(648, 268); ctx.rotate(0.5);
  ctx.beginPath(); ctx.ellipse(0, 0, 52, 34, 0, 0, Math.PI * 2);
  ctx.fillStyle = WHITE; ctx.fill();
  ctx.restore();
  // Beak: one hooked upper beak and a small lower beak, black.
  ctx.fillStyle = BLACK;
  ctx.beginPath();
  ctx.moveTo(762, 160);
  ctx.quadraticCurveTo(848, 182, 852, 242);
  ctx.quadraticCurveTo(853, 268, 828, 272);
  ctx.quadraticCurveTo(782, 272, 760, 232);
  ctx.quadraticCurveTo(748, 196, 762, 160);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(762, 252);
  ctx.quadraticCurveTo(798, 256, 794, 280);
  ctx.quadraticCurveTo(790, 292, 776, 286);
  ctx.quadraticCurveTo(760, 274, 762, 252);
  ctx.closePath(); ctx.fill();
  // Eye: a single black bead with one white catchlight.
  ctx.save();
  ctx.translate(EYE.x, EYE.y); ctx.scale(1, Math.max(0.08, eyeScale));
  ctx.fillStyle = BLACK; circ(0, 0, EYE.r, true);
  ctx.fillStyle = WHITE; circ(3.5, -3.5, 3.4, true);
  ctx.restore();
  ctx.restore();
}

function draw() {
  ctx.fillStyle = TEAL;
  ctx.fillRect(0, 0, DW, DH);
  var lt = ((T % LOOP) + LOOP) % LOOP;
  var tailAng = 0.08 * Math.sin(Math.PI * 2 * lt / LOOP + 1.1);
  drawTail(tailAng);
  drawBranch();
  drawBody();
  drawFeet();
  drawHead(lt);
}

// ---- interaction -----------------------------------------------------
var tapTrack = null;
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  tapTrack = { x: p[0], y: p[1] };
});
canvas.addEventListener('pointerup', function (e) {
  if (tapTrack) {
    var p = toDesign(e);
    var moved = Math.max(Math.abs(p[0] - tapTrack.x), Math.abs(p[1] - tapTrack.y));
    if (moved < 9) bobStart = T;
  }
  tapTrack = null;
});
canvas.addEventListener('pointercancel', function () { tapTrack = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = TEAL;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
