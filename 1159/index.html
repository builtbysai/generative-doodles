<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kopimashin</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- Kopimashin — Antonio Roberts study AR8 ----------
  // After Peter Sunde's Kopimashin (shown in Roberts's Copy/Paste, 2020):
  // a machine that copies infinitely but produces nothing. One flat shape
  // spawns at the center; every 0.5s tick every shape is copied, the copies
  // radiating outward on a spiral, each generation 15% closer to gray mush
  // (#555555). The cascade caps at 60 shapes, jitters in place, and at 8s a
  // hard vertical wipe sweeps right-to-left and erases everything. Then
  // 3.5s of empty canvas — the machine "thinking" — and the 12s loop turns.
  // Watch-only. Everything is closed-form: the spawn tree and the jitter
  // table are precomputed once from the seed; the frame at time t is a
  // pure function of t.

  var T0 = 4.6;                // fixed phase for the deterministic first frame (tick 9)
  var LOOP = 12;               // seconds
  var TICK = 0.5;              // cascade tick length
  var WIPE_T = 8, WIPE_END = 8.5;
  var CAP = 60;                // max shapes on screen
  var CAP_TICK = 5;            // tick at which the cap is reached (tree shape below)
  var BG = '#0A0A0A';
  var MUSH = [0x55, 0x55, 0x55];
  var BASE_COLORS = [
    [0xFF, 0x2E, 0x88],        // #FF2E88
    [0x00, 0xF0, 0xFF],        // #00F0FF
    [0xFF, 0xD8, 0x00]         // #FFD800
  ];
  var DEGRADE = 0.15;          // each generation moves 15% closer to mush

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hex2(r, g, b) {
    function h(v) { var s = Math.round(v).toString(16); return s.length < 2 ? '0' + s : s; }
    return '#' + h(r) + h(g) + h(b);
  }

  // ---------- per-generation degraded colors (precomputed hex) ----------
  // color(gen) = base moved toward #555555 by a factor 1 - 0.85^gen
  var MAXGEN = 8;
  var GEN_COLORS = BASE_COLORS.map(function (base) {
    var row = [];
    for (var g = 0; g <= MAXGEN; g++) {
      var f = 1 - Math.pow(1 - DEGRADE, g);
      row.push(hex2(
        base[0] + (MUSH[0] - base[0]) * f,
        base[1] + (MUSH[1] - base[1]) * f,
        base[2] + (MUSH[2] - base[2]) * f
      ));
    }
    return row;
  });

  // ---------- spawn tree (precomputed once, breadth-first, cap enforced) ----------
  // Positions are polar around the center, in fractions of the composition
  // size S: each child sits one radial step beyond its parent (the step
  // grows with generation, so the spiral fills the square) at a seeded
  // angular offset, rotated +3 degrees from its parent plus seeded jitter.
  var seed = 1159008;
  var shapes = [];
  var jitter = [];             // jitter[i][tick - (CAP_TICK+1)] = {dx, dy}, ticks CAP_TICK+1..15
  (function buildTree() {
    var rng = mulberry32(seed);
    var TYPES = ['circle', 'square', 'triangle'];
    function pickType() { return TYPES[Math.floor(rng() * 3)]; }
    var first = {
      gen: 0, birthTick: 0,
      r: 0, theta: rng() * Math.PI * 2,
      x: 0, y: 0,
      rot: rng() * Math.PI * 2,
      type: pickType(),
      color: Math.floor(rng() * 3),
      size: 0.062
    };
    shapes.push(first);
    var i = 0;
    while (i < shapes.length && shapes.length < CAP) {
      var p = shapes[i++];
      for (var k = 0; k < 2 && shapes.length < CAP; k++) {
        var gen = p.gen + 1;
        var step = 0.05 + 0.02 * p.gen;                       // radial step, grows per generation
        var dTheta = (0.55 + rng() * 0.6) * (k === 0 ? 1 : -1); // fan out on both sides
        var theta = p.theta + dTheta;
        var r = p.r + step + (rng() * 0.03 - 0.015);
        var type = rng() < 0.7 ? p.type : pickType();          // copies mostly inherit
        var color = rng() < 0.75 ? p.color : Math.floor(rng() * 3);
        var size = Math.max(0.024, 0.062 * Math.pow(0.92, gen)) * (0.85 + rng() * 0.3);
        shapes.push({
          gen: gen, birthTick: p.birthTick + 1,
          r: r, theta: theta,
          x: r * Math.cos(theta), y: r * Math.sin(theta),
          rot: p.rot + 3 * Math.PI / 180 + (rng() * 20 - 10) * Math.PI / 180,
          type: type, color: color, size: size
        });
      }
    }
    // post-cap jitter: one seeded offset per shape per tick, a step function
    // of tick, used only while the cascade phase lasts (ticks CAP_TICK+1..15)
    for (var s = 0; s < shapes.length; s++) {
      var row = [];
      for (var tk = CAP_TICK + 1; tk <= 15; tk++) {
        row.push({ dx: (rng() * 2 - 1) * 0.007, dy: (rng() * 2 - 1) * 0.007 });
      }
      jitter.push(row);
    }
  })();

  // ---------- viewport / sizing ----------
  var W = 0, H = 0, DPR = 1;
  function viewSize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 800);
    var h = vv ? vv.height : (window.innerHeight || 600);
    return { w: w, h: h };
  }
  function isPhone() {
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr && scr.width && scr.height) {
      if (Math.min(scr.width, scr.height) < 700) return true;
    }
    return H > W * 1.15;
  }
  function fit() {
    var s = viewSize();
    W = s.w; H = s.h;
    DPR = Math.min((window.devicePixelRatio || 1), 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }
  fit();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', fit);
  }
  window.addEventListener('resize', fit);

  // ---------- time ----------
  function nowSec() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : Date.now() / 1000;
  }
  var startStamp = nowSec();
  function pieceT() { return T0 + (nowSec() - startStamp); }

  // ---------- drawing ----------
  function drawShape(s, cx, cy, S) {
    var rad = s.size * S;
    ctx.fillStyle = GEN_COLORS[s.color][Math.min(s.gen, MAXGEN)];
    if (s.type === 'circle') {
      // standalone path per shape: beginPath + moveTo before every arc
      ctx.beginPath();
      ctx.moveTo(cx + rad, cy);
      ctx.arc(cx, cy, rad, 0, Math.PI * 2);
      ctx.fill();
    } else if (s.type === 'square') {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(s.rot);
      ctx.fillRect(-rad, -rad, rad * 2, rad * 2);
      ctx.restore();
    } else { // triangle
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(s.rot);
      ctx.beginPath();
      ctx.moveTo(0, -rad * 1.15);
      ctx.lineTo(rad * 1.05, rad * 0.85);
      ctx.lineTo(-rad * 1.05, rad * 0.85);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  function draw(T) {
    // pin CSS size every draw (house rule for high-DPR phones)
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var t = T % LOOP;
    if (t >= WIPE_END) return;   // silence: the machine "thinking"

    // square composition, centered; phones go near full-bleed
    var phone = isPhone();
    var S = phone ? Math.min(W * 0.98, H * 0.98) : Math.min(W, H) * 0.92;
    var ox = (W - S) / 2, oy = (H - S) / 2;

    var tick = Math.floor(t / TICK);
    var wiping = t >= WIPE_T;
    // wipe front, in composition fractions: 1 (right edge) -> 0 (left edge)
    var wipeU = wiping ? 1 - (t - WIPE_T) / (WIPE_END - WIPE_T) : 1;
    var wipeX = ox + wipeU * S;
    // positions freeze at the last cascade tick's jitter during the wipe
    var jitTick = Math.min(tick, 15);

    for (var i = 0; i < shapes.length; i++) {
      var s = shapes[i];
      if (s.birthTick > tick) continue;
      var jx = 0, jy = 0;
      if (jitTick > CAP_TICK) {
        var j = jitter[i][jitTick - (CAP_TICK + 1)];
        jx = j.dx; jy = j.dy;
      }
      var cx = ox + (0.5 + s.x + jx) * S;
      var cy = oy + (0.5 + s.y + jy) * S;
      if (wiping && cx > wipeX) continue;   // already swept away
      drawShape(s, cx, cy, S);
    }

    if (wiping) {
      // the hard wipe bar: a solid slab of background covering everything
      // behind the front as it passes
      ctx.fillStyle = BG;
      ctx.fillRect(wipeX, oy, ox + S - wipeX, S);
    }
  }

  // ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
  draw(T0);
  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(pieceT());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
