<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Él Es Así</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #4A2E5A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: strict, nothing else. Flat fills only, no gradients.
  var PURPLE = '#4A2E5A', DIRT = '#6B4A2E', GREY = '#9A9A9A',
      WHITE = '#F5F5F5', INK = '#141414', AMBER = '#E8A33D';

  var PHASE0 = 1.7; // constant first-frame phase

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  // ---- panel geometry (1080 x 1080 design space) ----
  var PL = { x: 160, y: 70, w: 760, h: 940 };
  var FLOOR = 918; // ground line inside the panel

  // ---- carousel state ----
  var panel = 0;              // 0..9
  var fadeStart = -1;         // simT when the panel-4 fade began, -1 = no fade
  var pileGrow = 0;           // drag-fed dirt growth, shared by every dirt pile

  // ---- small canvas helpers ----
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
  function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
  function fs(fill, lw) {
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (lw) { ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function line(x1, y1, x2, y2, color, lw) {
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }

  // wobbly rounded-rect path, jitter seeded per id so it never shimmers
  function wobRect(x, y, w, h, r, id) {
    var rng = mulberry32(567000 + id * 131);
    function j(v) { return v + (rng() - 0.5) * 5; }
    ctx.beginPath();
    ctx.moveTo(j(x + r), j(y));
    ctx.lineTo(j(x + w - r), j(y)); ctx.quadraticCurveTo(j(x + w), j(y), j(x + w), j(y + r));
    ctx.lineTo(j(x + w), j(y + h - r)); ctx.quadraticCurveTo(j(x + w), j(y + h), j(x + w - r), j(y + h));
    ctx.lineTo(j(x + r), j(y + h)); ctx.quadraticCurveTo(j(x), j(y + h), j(x), j(y + h - r));
    ctx.lineTo(j(x), j(y + r)); ctx.quadraticCurveTo(j(x), j(y), j(x + r), j(y));
    ctx.closePath();
  }

  // ---- hand lettering: per-letter jitter seeded by the string itself ----
  function setFont(size, weight) {
    ctx.font = (weight || 700) + ' ' + size + 'px "Arial Rounded MT Bold","Trebuchet MS",Verdana,sans-serif';
  }
  function lettered(str, cx, y, size, color, weight) {
    setFont(size, weight);
    var rng = mulberry32(567100 + hashStr(str));
    var widths = [], total = 0, i, w;
    for (i = 0; i < str.length; i++) { w = ctx.measureText(str[i]).width; widths.push(w); total += w; }
    var x = cx - total / 2;
    ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    for (i = 0; i < str.length; i++) {
      var jx = (rng() - 0.5) * size * 0.07, jy = (rng() - 0.5) * size * 0.09;
      ctx.save();
      ctx.translate(x + widths[i] / 2 + jx, y + jy);
      ctx.rotate((rng() - 0.5) * 0.05);
      ctx.fillText(str[i], -widths[i] / 2, 0);
      ctx.restore();
      x += widths[i];
    }
    return total;
  }
  function wrapLines(str, size, maxW) {
    setFont(size, 700);
    var words = str.split(' '), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i]; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }
  function letteredBlock(str, cx, cy, size, color, maxW, weight) {
    var lines = wrapLines(str, size, maxW);
    var lh = size * 1.22, y = cy - (lines.length - 1) * lh / 2;
    for (var i = 0; i < lines.length; i++) { lettered(lines[i], cx, y + i * lh, size, color, weight); }
    return lines.length * lh;
  }

  // ---- bubbles ----
  function speechBubble(cx, cy, w, h, tailX, tailY, id) {
    wobRect(cx - w / 2, cy - h / 2, w, h, 26, id); fs(WHITE, 5);
    ctx.beginPath();
    ctx.moveTo(tailX - 14, cy + h / 2 - 8);
    ctx.lineTo(tailX + 14, cy + h / 2 - 8);
    ctx.lineTo(tailX + (tailX < cx ? -6 : 6), tailY);
    ctx.closePath(); fs(WHITE, 5);
    ctx.fillStyle = WHITE;
    ctx.fillRect(tailX - 15, cy + h / 2 - 12, 30, 8);
  }
  function say(cx, cy, w, h, tailX, tailY, id, text, size) {
    speechBubble(cx, cy, w, h, tailX, tailY, id);
    letteredBlock(text, cx, cy, size || 30, INK, w - 56);
  }

  function panelFrame(bg, id) {
    wobRect(PL.x, PL.y, PL.w, PL.h, 30, id); fs(bg, 6);
  }
  function clipPanel(id) {
    wobRect(PL.x, PL.y, PL.w, PL.h, 30, id); ctx.clip();
  }

  function partyLights(t) {
    ctx.strokeStyle = INK; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(PL.x + 26, PL.y + 40);
    ctx.quadraticCurveTo(PL.x + PL.w / 2, PL.y + 92, PL.x + PL.w - 26, PL.y + 40);
    ctx.stroke();
    for (var i = 0; i <= 10; i++) {
      var u = i / 10;
      var bx = PL.x + 26 + (PL.w - 52) * u;
      var by = PL.y + 40 + 2 * 52 * u * (1 - u) + 8;
      var tw = 0.6 + 0.4 * Math.sin(t * 2.0 + i * 1.9);
      ctx.save(); ctx.globalAlpha = tw;
      circ(bx, by, 8); fs(AMBER, 3);
      ctx.restore();
    }
  }

  // ---- characters ----
  // A standing woman rig. hair/dress are palette fills; feet at (cx, baseY).
  // opts: beer (friend holds a glass), armsCrossed, glance (-1..1 pupil offset)
  function woman(cx, baseY, s, hair, dress, opts) {
    opts = opts || {};
    ctx.save();
    ctx.translate(cx, baseY);
    ctx.scale(s, s);
    // dress
    ctx.beginPath();
    ctx.moveTo(-27, -196); ctx.lineTo(27, -196); ctx.lineTo(58, 0); ctx.lineTo(-58, 0);
    ctx.closePath(); fs(dress, 5);
    ell(-26, 2, 16, 8); fs(INK, 0);
    ell(26, 2, 16, 8); fs(INK, 0);
    // arms
    if (opts.armsCrossed) {
      line(-25, -172, 30, -128, WHITE, 14);
      line(25, -172, -30, -128, WHITE, 14);
    } else if (opts.beer) {
      line(-25, -172, -50, -122, WHITE, 14);
      line(25, -172, 56, -150, WHITE, 14);
      // the beer: glass with amber fill, held up at the end of the right arm
      ctx.beginPath();
      ctx.moveTo(44, -196); ctx.lineTo(72, -196); ctx.lineTo(68, -148); ctx.lineTo(48, -148);
      ctx.closePath(); fs(AMBER, 4);
      ell(58, -197, 15, 6); fs(WHITE, 3);
    } else {
      line(-25, -172, -50, -122, WHITE, 14);
      line(25, -172, 50, -122, WHITE, 14);
    }
    // hair mass behind the head
    ell(0, -246, 55, 62); fs(hair, 0);
    // head
    circ(0, -238, 50); fs(WHITE, 5);
    // hair cap over the top of the head
    ctx.beginPath(); ctx.arc(0, -244, 50, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath(); fs(hair, 0);
    ctx.beginPath(); ctx.arc(0, -238, 50, Math.PI * 1.25, Math.PI * 1.75, true); ctx.closePath();
    // face: calm dots and a flat mouth; the friend never plays the fool
    var gx = (opts.glance || 0) * 5;
    circ(-18 + gx, -240, 5); fs(INK, 0);
    circ(18 + gx, -240, 5); fs(INK, 0);
    if (opts.outraged) {
      line(-28 + gx, -258, -9 + gx, -252, INK, 4);
      line(28 + gx, -258, 9 + gx, -252, INK, 4);
      ell(0, -206, 8, 10); fs(INK, 0);
    } else if (opts.sad) {
      line(-28 + gx, -252, -9 + gx, -259, INK, 4);
      line(28 + gx, -252, 9 + gx, -259, INK, 4);
      ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, -196, 10, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    } else {
      line(-8, -208, 9, -208, INK, 4);
    }
    ctx.restore();
  }

  // The boyfriend: ONE fixed crouched pose, reused identically everywhere.
  // Ground point at (cx, baseY); he faces left, staring back at the room.
  // chew = 0 or 1 (the 2-frame chew). The dirt pile sits in front of him.
  function boyfriend(cx, baseY, s, chew) {
    ctx.save();
    ctx.translate(cx, baseY);
    ctx.scale(s, s);
    var bob = chew ? 3 : 0;
    // crouched legs: haunches and feet flat on the ground
    ctx.beginPath();
    ctx.moveTo(-58, -64); ctx.lineTo(-6, -64); ctx.lineTo(-16, 0); ctx.lineTo(-62, 0);
    ctx.closePath(); fs(GREY, 5);
    ctx.beginPath();
    ctx.moveTo(16, -58); ctx.lineTo(62, -52); ctx.lineTo(66, 0); ctx.lineTo(22, 0);
    ctx.closePath(); fs(GREY, 5);
    ell(-46, 3, 20, 8); fs(INK, 0);
    ell(52, 3, 20, 8); fs(INK, 0);
    // hunched torso, leaning forward over the pile
    ctx.save();
    ctx.translate(-6, -118 + bob); ctx.rotate(-0.16);
    ell(0, 0, 56, 52); fs(INK, 5);
    ctx.restore();
    // scooping arm, down toward the pile (drawn by dirtPile side)
    line(-34, -96 + bob, -86, -34, WHITE, 14);
    circ(-88, -30, 10); fs(WHITE, 4);
    // eating arm: hand with a dirt clump, at the mouth (frame 0) or lowered (frame 1)
    var hy = chew ? -128 : -142 + bob;
    line(20, -100 + bob, -22, hy + 26, WHITE, 14);
    circ(-26, hy + 22, 11); fs(WHITE, 4);
    circ(-30, hy + 16, 13); fs(DIRT, 4);
    // head, low and forward, eyes locked to the left
    circ(-34, -158 + bob, 42); fs(WHITE, 5);
    ctx.beginPath(); ctx.arc(-34, -164 + bob, 42, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath(); fs(INK, 0);
    // the stare: pupils pushed hard left, toward her
    circ(-56, -156 + bob, 5.5); fs(INK, 0);
    circ(-27, -156 + bob, 5.5); fs(INK, 0);
    line(-61, -170 + bob, -47, -168 + bob, INK, 3.5);
    line(-20, -170 + bob, -33, -168 + bob, INK, 3.5);
    // mouth: dirt-smeared; open with dirt in frame 1
    ell(-40, -128 + bob, 15, 8); fs(DIRT, 0);
    if (chew) { ell(-40, -126 + bob, 7, 6); fs(INK, 0); }
    else line(-48, -129 + bob, -32, -129 + bob, INK, 3.5);
    ctx.restore();
  }

  // The dirt pile: a seeded mound of clods. It never runs out.
  function dirtPile(cx, baseY, s) {
    var g = s * (1 + Math.min(pileGrow, 2.4) * 0.22);
    ctx.save();
    ctx.translate(cx, baseY);
    ctx.scale(g, g);
    ell(0, 0, 86, 20); fs(DIRT, 5);
    ell(-26, -16, 46, 22); fs(DIRT, 5);
    ell(22, -20, 40, 26); fs(DIRT, 5);
    ell(-2, -38, 26, 18); fs(DIRT, 5);
    var rng = mulberry32(567300);
    ctx.fillStyle = INK;
    for (var i = 0; i < 14; i++) {
      var px = (rng() - 0.5) * 130, py = -rng() * 40 - 2;
      circ(px, py, 2.4); ctx.fill();
    }
    ctx.restore();
  }
  function pileScaleNow(s) { return s * (1 + Math.min(pileGrow, 2.4) * 0.22); }

  function cornerShadow(x, y, rx, ry) {
    ctx.save(); ctx.globalAlpha = 0.4;
    ell(x, y, rx, ry); fs(INK, 0);
    ctx.restore();
  }

  function chewFrame(t) { return Math.floor(t / 0.45) % 2; }

  // ---- panels ----
  // Panel layout shared by 1 and 2: friend left, woman centre, boyfriend small in the corner.
  function partyScene(t, speaker) {
    panelFrame(PURPLE, 10 + panel);
    ctx.save(); clipPanel(10 + panel);
    partyLights(t);
    line(PL.x + 8, FLOOR, PL.x + PL.w - 8, FLOOR, INK, 4);
    cornerShadow(838, 800, 128, 150);
    woman(308, FLOOR, 1.12, AMBER, WHITE, { beer: true, glance: speaker === 1 ? 0.4 : 0 });
    woman(548, FLOOR, 1.12, DIRT, GREY, { glance: speaker === 0 ? 0.8 : -0.5 });
    boyfriend(852, FLOOR, 0.66, chewFrame(t));
    dirtPile(756, FLOOR + 4, 0.62);
    ctx.restore();
  }
  function panel1(t) {
    partyScene(t, 0);
    say(330, 268, 430, 118, 330, 560, 11, 'Ve a hablar con tu novio.', 31);
  }
  function panel2(t) {
    partyScene(t, 1);
    say(520, 262, 560, 140, 545, 560, 12, 'Es que es muy introvertido. Está escondido en un rincón.', 29);
  }
  // The wide shot used by panel 3 and, silently, by panel 9 (visual rhyme).
  function wideScene(t) {
    panelFrame(PURPLE, 13);
    ctx.save(); clipPanel(13);
    partyLights(t);
    line(PL.x + 8, FLOOR, PL.x + PL.w - 8, FLOOR, INK, 4);
    cornerShadow(806, 780, 168, 180);
    woman(268, FLOOR, 1.0, AMBER, WHITE, { glance: 0.8 });
    woman(452, FLOOR, 1.0, DIRT, GREY, { glance: 0.8 });
    boyfriend(818, FLOOR, 1.02, chewFrame(t));
    dirtPile(688, FLOOR + 4, 0.95);
    ctx.restore();
  }
  function panel3(t) {
    wideScene(t);
    say(446, 240, 620, 132, 300, 545, 14, 'Está en el rincón, sí: comiendo tierra y mirándote fijamente.', 28);
    say(430, 420, 520, 108, 300, 560, 15, 'Eso significa que se quiere ir a casa.', 28);
  }
  function panel4(t) {
    panelFrame(INK, 20);
    ctx.save(); clipPanel(20);
    ctx.fillStyle = INK; ctx.fillRect(PL.x, PL.y, PL.w, PL.h);
    letteredBlock('SEIS MESES DESPUÉS', PL.x + PL.w / 2, PL.y + PL.h / 2, 64, WHITE, PL.w - 120, 800);
    ctx.restore();
  }
  // The doorstep, six months later. Grey tones, her front door behind her.
  function doorScene(t) {
    panelFrame(GREY, 30 + panel);
    ctx.save(); clipPanel(30 + panel);
    // the door
    ctx.beginPath();
    ctx.moveTo(238, 300); ctx.lineTo(478, 300); ctx.lineTo(478, FLOOR); ctx.lineTo(238, FLOOR);
    ctx.closePath(); fs(PURPLE, 6);
    circ(452, 640, 10); fs(AMBER, 4);
    line(PL.x + 8, FLOOR, PL.x + PL.w - 8, FLOOR, INK, 4);
    ctx.restore();
  }
  function panel5(t) {
    doorScene(t);
    woman(370, FLOOR, 1.18, DIRT, PURPLE, { sad: true });
    woman(716, FLOOR, 1.12, AMBER, WHITE, { glance: -0.6 });
    say(400, 268, 520, 118, 385, 545, 31, 'Perdí al bebé a los tres meses.', 29);
  }
  function panel6(t) {
    doorScene(t);
    woman(370, FLOOR, 1.18, DIRT, PURPLE, { sad: true });
    woman(716, FLOOR, 1.12, AMBER, WHITE, { glance: -0.6 });
    say(420, 262, 620, 150, 390, 545, 32, 'Rompió la norma de la relación abierta. Volvió borracho, con una ETS, y me la pasó.', 27);
  }
  function panel7(t) {
    doorScene(t);
    woman(370, FLOOR, 1.18, DIRT, PURPLE, { outraged: true });
    woman(716, FLOOR, 1.12, AMBER, WHITE, { glance: -0.6 });
    say(672, 240, 400, 108, 690, 545, 33, '¿Sigue comiendo tierra?', 29);
    say(392, 428, 430, 108, 385, 560, 34, '¡Eres una tóxica!', 31);
  }
  function panel8(t) {
    doorScene(t);
    woman(370, FLOOR, 1.18, DIRT, PURPLE, { sad: true });
    woman(716, FLOOR, 1.12, AMBER, WHITE, { glance: -0.6 });
    say(620, 262, 560, 118, 690, 545, 35, 'Con la boca llena de tierra, te lo dijo.', 29);
  }
  function panel9(t) {
    wideScene(t); // identical rig, position and scale to panel 3; no words
  }
  function panel10(t) {
    panelFrame(WHITE, 40);
    ctx.save(); clipPanel(40);
    letteredBlock('En otros seis meses, se habrá olvidado de lo de la ETS también.',
      PL.x + PL.w / 2, PL.y + PL.h / 2 - 30, 40, INK, PL.w - 150);
    dirtPile(PL.x + PL.w - 130, PL.y + PL.h - 60, 0.55);
    ctx.restore();
  }

  var PANELS = [panel1, panel2, panel3, panel4, panel5, panel6, panel7, panel8, panel9, panel10];
  // dirt-pile hit zones per panel index (design coords), null = no pile
  var PILES = [
    { x: 756, y: FLOOR + 4, r: 95 },
    { x: 756, y: FLOOR + 4, r: 95 },
    { x: 688, y: FLOOR + 4, r: 130 },
    null, null, null, null, null,
    { x: 688, y: FLOOR + 4, r: 130 },
    { x: PL.x + PL.w - 130, y: PL.y + PL.h - 60, r: 80 }
  ];

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = PURPLE;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);
    ctx.lineJoin = 'round';

    // the panel-4 fade: tap holds on black for about a second, then panel 5 fades in
    var fading = fadeStart >= 0;
    var e = fading ? t - fadeStart : 0;
    var current = panel;
    if (fading) {
      if (e >= 1.5 && panel === 3) panel = 4;
      current = panel;
    }
    PANELS[current](t);
    if (fading) {
      var a = 0;
      if (e < 0.45) a = e / 0.45;                    // fade out of the black card
      else if (e < 1.5) a = 1;                        // hold on black
      else if (e < 1.95) a = 1 - (e - 1.5) / 0.45;    // fade in on panel 5
      else fadeStart = -1;
      if (a > 0) {
        ctx.save(); ctx.globalAlpha = Math.min(a, 1);
        ctx.fillStyle = INK;
        ctx.fillRect(0, 0, 1080, 1080);
        ctx.restore();
      }
    }

    // counter + hint, lettered in silence white over the purple ground
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = WHITE;
    setFont(25, 700);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('panel ' + (panel + 1) + ' / 10', 20, 1062);
    ctx.textAlign = 'right';
    ctx.fillText('tap', 1060, 1062);
    ctx.restore();

    ctx.restore();
  }

  // ---- sizing (Visual Viewport API; square stage; page ground is the night purple) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) {
      S = W;
      OX = 0; OY = (H - S) / 2;
    } else {
      S = Math.min(W, H);
      OX = (W - S) / 2; OY = (H - S) / 2;
    }
    draw(simT);
  }

  // ---- interaction ----
  function toDesign(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return {
      x: (e.clientX - rect.left - OX) / S * 1080,
      y: (e.clientY - rect.top - OY) / S * 1080
    };
  }
  function inPile(p) {
    var z = PILES[panel];
    if (!z) return false;
    var dx = p.x - z.x, dy = p.y - z.y;
    return dx * dx + dy * dy < z.r * z.r;
  }

  var downInfo = null;
  function onDown(e) {
    var p = toDesign(e);
    downInfo = { x: p.x, y: p.y, t: e.timeStamp || 0, pile: inPile(p), lastX: p.x, lastY: p.y, moved: 0 };
  }
  function onMove(e) {
    if (!downInfo) return;
    var p = toDesign(e);
    var d = Math.sqrt((p.x - downInfo.lastX) * (p.x - downInfo.lastX) +
                      (p.y - downInfo.lastY) * (p.y - downInfo.lastY));
    downInfo.moved += d;
    downInfo.lastX = p.x; downInfo.lastY = p.y;
    if (downInfo.pile) {
      pileGrow = Math.min(pileGrow + d * 0.004, 2.4); // the pile grows; it never runs out
      draw(simT);
    }
  }
  function onUp(e) {
    if (!downInfo) return;
    var dt = (e.timeStamp || 0) - downInfo.t;
    var wasTap = downInfo.moved < 14 && dt < 500;
    var onPile = downInfo.pile;
    downInfo = null;
    if (!wasTap || onPile) return;
    if (fadeStart >= 0) return; // mid-fade taps do nothing
    if (panel === 3) {
      fadeStart = simT; // the time-skip card takes its slow fade through black
    } else {
      panel = (panel + 1) % 10;
    }
    draw(simT);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { downInfo = null; });
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
