<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Better Ghost</title>
<style>
  html, body { margin:0; padding:0; background:#04050A; height:100%; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
"use strict";
var T0 = 31;              // fixed first-frame phase, seconds of piece time
var LOOP = 75;            // one mourning, seconds
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;

/* ---------- seeded hash: the only source of variation ---------- */
function hash(n){
  n = (n|0);
  n = Math.imul(n ^ (n>>>16), 2246822507);
  n = Math.imul(n ^ (n>>>13), 3266489909);
  n ^= (n>>>16);
  return (n>>>0)/4294967296;
}

/* ---------- stutter schedule (hashed gaps of 5-9 s) ---------- */
var EV = [];
(function(){
  var tt = 3.2 + hash(77001)*1.6, i = 0;
  while (tt < 73.5){
    EV.push({start:tt, dur:0.5, idx:i, seam:false});
    tt += 5 + hash(77002+i)*4;
    i++;
  }
  EV.push({start:74.4, dur:0.6, idx:i, seam:true});   // loop seam, masked
})();

/* ---------- layout ---------- */
var F = {x:0,y:0,w:0,h:0};       // the movie field
var phone = false;
function fit(){
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = w; H = h;
  canvas.width = Math.round(w*DPR);
  canvas.height = Math.round(h*DPR);
  var sm = Math.min(window.screen ? window.screen.width : w,
                    window.screen ? window.screen.height : h);
  phone = (sm < 700) || (h > w*1.15);
  var fw = Math.min(w*0.88, h*0.72*1.45);
  if (phone) fw = Math.min(w*0.94, h*0.6*1.45);
  F.w = fw; F.h = fw/1.45;
  F.x = (w - F.w)/2; F.y = (h - F.h)/2;
}
function relayout(){
  fit();
  draw(pieceNow());
}

/* ---------- seance: recorded hold intervals ---------- */
var holds = [];      // {down, up (null while held), x, y} in piece time
function summon(t){
  var s = 0, last = 0, i, iv, seg;
  for (i=0;i<holds.length;i++){
    iv = holds[i];
    if (iv.down > t) break;
    seg = iv.down - last;                       // released stretch: decay
    if (seg > 0) s = Math.max(0, s - seg/3);
    var up = (iv.up === null) ? t : Math.min(iv.up, t);
    seg = up - iv.down;                          // held stretch: rise
    if (seg > 0) s = Math.min(1, s + seg/1.5);
    last = up;
    if (iv.up === null) return s;
  }
  seg = t - last;
  if (seg > 0) s = Math.max(0, s - seg/3);
  return s;
}
function pointerPos(e){
  var r = canvas.getBoundingClientRect();
  return {x:(e.clientX - r.left), y:(e.clientY - r.top)};
}
canvas.addEventListener('pointerdown', function(e){
  var p = pointerPos(e);
  try { canvas.setPointerCapture(e.pointerId); } catch(err){}
  holds.push({down:pieceNow(), up:null, x:p.x, y:p.y});
});
function endHold(e){
  var t = pieceNow(), i;
  for (i=holds.length-1;i>=0;i--) if (holds[i].up === null){ holds[i].up = t; break; }
}
canvas.addEventListener('pointerup', endHold);
canvas.addEventListener('pointercancel', endHold);

/* ---------- the walking figure glyph ---------- */
/* local space: ground y=0, top y=-100, facing +x. unit u = figH/100 */
function figurePath(u, pose, bob){
  var s = u;
  ctx.beginPath();
  // torso (leaning slightly forward)
  ctx.moveTo(-5*s, -50*s + bob);
  ctx.lineTo(5*s, -52*s + bob);
  ctx.lineTo(12*s, -82*s + bob);
  ctx.lineTo(2*s, -86*s + bob);
  ctx.closePath();
  ctx.fill();
  // head
  ctx.beginPath();
  ctx.arc(9*s, -93*s + bob, 7*s, 0, Math.PI*2);
  ctx.fill();
  // limbs: thick strokes
  ctx.lineCap = 'round';
  ctx.lineWidth = 6.2*s;
  var hip = {x:0, y:-50*s + bob}, sho = {x:8*s, y:-80*s + bob};
  var legF, legB, arm;
  if (pose === 0){           // stride: front leg reaching, back leg trailing
    legF = [{x:13*s, y:-27*s + bob*0.4}, {x:22*s, y:0}];
    legB = [{x:-9*s, y:-29*s + bob*0.4}, {x:-17*s, y:-3*s}];
    arm  = [{x:-2*s, y:-58*s + bob*0.6}, {x:-9*s, y:-40*s + bob*0.6}];
  } else {                   // passing: legs crossed under, arm swung forward
    legF = [{x:6*s,  y:-26*s + bob*0.4}, {x:4*s,  y:0}];
    legB = [{x:-4*s, y:-26*s + bob*0.4}, {x:-13*s, y:0}];
    arm  = [{x:16*s, y:-60*s + bob*0.6}, {x:21*s, y:-44*s + bob*0.6}];
  }
  ctx.beginPath();
  ctx.moveTo(hip.x, hip.y); ctx.lineTo(legF[0].x, legF[0].y); ctx.lineTo(legF[1].x, legF[1].y);
  ctx.moveTo(hip.x, hip.y); ctx.lineTo(legB[0].x, legB[0].y); ctx.lineTo(legB[1].x, legB[1].y);
  ctx.moveTo(sho.x, sho.y); ctx.lineTo(arm[0].x, arm[0].y);  ctx.lineTo(arm[1].x, arm[1].y);
  ctx.stroke();
}
function drawFigure(cx, groundY, figH, tau, alpha){
  if (alpha <= 0.003) return;
  var pose = Math.floor(tau*2) % 2;
  var bob = (Math.floor(tau*2) % 2 === 0) ? 0 : -figH*0.012;
  ctx.save();
  ctx.translate(cx, groundY);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#0D0D10';
  ctx.strokeStyle = '#0D0D10';
  figurePath(figH/100, pose, bob/(figH/100));
  ctx.restore();
}

/* ---------- walk + fade laws ---------- */
var WALK_OFF = 5.85;   /* phases the walk so lt=31 finds the lead mid-crossing */
function walkX(tau){
  var p = (((tau + WALK_OFF) % 15) + 15) % 15 / 15;
  return F.x + (p*1.16 - 0.08) * F.w;
}
function leadOpacity(lt){
  var n = 0, i;
  for (i=0;i<EV.length;i++) if (!EV[i].seam && EV[i].start + EV[i].dur <= lt) n++;
  return Math.max(0.16, 1 - 0.09*n);
}
function activeStutter(lt){
  var i;
  for (i=0;i<EV.length;i++)
    if (lt >= EV[i].start && lt < EV[i].start + EV[i].dur) return EV[i];
  return null;
}

/* ---------- drawing ---------- */
var BANDS = 18;
function bandOffset(bi, ev, lt, ghost){
  if (ghost){                                   // permanent shear scars
    if (bi % (5 - ghost.g) === ghost.g % 3)
      return (hash(5000 + ghost.g*131 + bi) - 0.35) * 0.028 * F.w * ghost.g;
    return 0;
  }
  if (!ev) return 0;
  var a = lt - ev.start;
  var step = Math.floor(a/0.08);
  var amp = (ev.seam ? 0.10 : 0.055) * F.w;
  return (hash(900 + ev.idx*977 + bi*57 + step*13) - 0.5) * amp;
}

function drawScene(t){
  var lt = ((t % LOOP) + LOOP) % LOOP;
  var s = summon(t);
  var ev = activeStutter(lt);
  var op = leadOpacity(lt) + s*0.2;
  if (op > 0.98) op = 0.98;
  var groundY = F.y + F.h*0.68;
  var figH = F.h*0.36;
  var i, bi;

  /* room */
  ctx.fillStyle = '#04050A';
  ctx.fillRect(0, 0, W, H);
  /* projector glow of the room: a flat, barely-there panel behind the screen */
  ctx.fillStyle = '#070912';
  ctx.fillRect(F.x - F.w*0.035, F.y - F.h*0.06, F.w*1.07, F.h*1.12);
  /* screen bezel */
  ctx.fillStyle = '#0B0D14';
  ctx.fillRect(F.x - 5, F.y - 5, F.w + 10, F.h + 10);

  var ghosts = [ {g:1, f:0.40}, {g:2, f:0.25}, {g:3, f:0.12} ];

  /* the movie, drawn in horizontal slices so shear is native */
  for (bi=0; bi<BANDS; bi++){
    var by = F.y + (bi/BANDS)*F.h;
    var bh = F.h/BANDS + 1;
    ctx.save();
    ctx.beginPath(); ctx.rect(F.x, by, F.w, bh); ctx.clip();
    /* field: sky above horizon, deep below (flat tones, no gradient) */
    ctx.fillStyle = '#12308A';
    ctx.fillRect(F.x, F.y, F.w, F.h);
    ctx.fillStyle = '#0A1E5E';
    ctx.fillRect(F.x, groundY, F.w, F.y + F.h - groundY);
    /* horizon hairline */
    ctx.fillStyle = '#1D3E96';
    ctx.fillRect(F.x, groundY - 1, F.w, 1.5);
    /* walk-path dust */
    ctx.fillStyle = '#3A4A7A';
    for (i=0;i<46;i++){
      var dx = F.x + hash(3100+i)*F.w;
      var dy = groundY + (hash(3200+i)-0.3)*F.h*0.05;
      ctx.globalAlpha = 0.25 + hash(3300+i)*0.5;
      ctx.fillRect(dx, dy, 2, 2);
    }
    ctx.globalAlpha = 1;
    /* ghosts first (oldest = faintest = g3), then the lead */
    for (i=ghosts.length-1;i>=0;i--){
      var gh = ghosts[i];
      var gt = lt - gh.g*1.1;
      var off = bandOffset(bi, null, lt, gh);
      ctx.save();
      ctx.translate(off, 0);
      var ga = op * gh.f * (1 + s*1.8);
      if (ga > 0.95) ga = 0.95;
      drawFigure(walkX(gt), groundY, figH, gt, ga);
      ctx.restore();
    }
    ctx.save();
    ctx.translate(bandOffset(bi, ev, lt, null), 0);
    drawFigure(walkX(lt), groundY, figH, lt, op);
    ctx.restore();
    ctx.restore();
    /* cyan fringe on the hardest-sheared slice edges, while stuttering */
    if (ev && Math.abs(bandOffset(bi, ev, lt, null)) > 0.03*F.w){
      ctx.fillStyle = '#00E5FF';
      ctx.globalAlpha = 0.30;
      ctx.fillRect(F.x, by, F.w, 1);
      ctx.globalAlpha = 1;
    }
  }

  /* magenta chew band sweeping the frame during a stutter */
  if (ev){
    var a = (lt - ev.start)/ev.dur;
    var cy = F.y + a*(F.h*1.1) - F.h*0.05;
    ctx.fillStyle = '#FF2B8D';
    ctx.globalAlpha = 0.45;
    ctx.fillRect(F.x, cy, F.w, F.h*0.075);
    ctx.globalAlpha = 0.75;
    ctx.fillRect(F.x, cy + F.h*0.028, F.w, F.h*0.02);
    ctx.globalAlpha = 1;
  }
  /* seam stutter: the room itself darkens to mask the loop reset */
  if (ev && ev.seam){
    var sa = (lt - ev.start)/ev.dur;
    ctx.fillStyle = '#04050A';
    ctx.globalAlpha = Math.sin(sa*Math.PI)*0.55;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  /* seance ring at the held touch */
  if (s > 0.02){
    var cur = null;
    for (i=holds.length-1;i>=0;i--) if (holds[i].up === null){ cur = holds[i]; break; }
    if (cur){
      ctx.strokeStyle = '#BFD0FF';
      ctx.globalAlpha = 0.18 + 0.25*s;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cur.x, cur.y, 14 + 26*s, 0, Math.PI*2);
      ctx.stroke();
      ctx.globalAlpha = (0.10 + 0.14*s);
      ctx.fillStyle = '#8FA8E8';
      ctx.beginPath();
      ctx.arc(cur.x, cur.y, 14 + 26*s, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

var startStamp = null;
function pieceNow(){
  if (startStamp === null) return T0;
  return T0 + (performance.now() - startStamp)/1000;
}
function draw(t){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  drawScene(t);
}
function frame(now){
  if (startStamp === null) startStamp = now;
  draw(T0 + (now - startStamp)/1000);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}

fit();
draw(T0);                                    /* synchronous fixed-phase first frame */
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);
window.addEventListener('resize', relayout);
})();
</script>
</body>
</html>
