<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.235 Pulse</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0A0A0A; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.235 Pulse (James Woodfill). After Pulse, 2003, the lamp array
// in the 11th & Oak parking garage stairwells: nine rows of sixty
// square lamp dots across near black, each row offset by half a dot
// so the chase reads as a diagonal drift. Brightness travels in
// long packets: a wave rises in one row, holds, releases, and the
// next row answers a beat later. Two packets run against each other
// and where they cross they interfere, brightening instead of
// cancelling. The light is flat, on or off, with no glow falloff
// and no atmosphere: Woodfill's lamps are devices, not weather.
// Watch only, nothing to touch.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0A0A0A';
var OFF = [42, 42, 42], DIM = [90, 58, 18], FULL = [245, 166, 35];
var ROWS = 9, COLS = 60; // 540 lamp dots, exact
var W = 0, H = 0, phone = false;
var T = 16, lastNow = -1; // frame one: one packet mid array, a second entering right

// packet clocks (seeded constants): A runs right at 2.4 columns a
// second, B runs left at 1.8; widths and gaps fixed per the seed.
var SIGMA = 4.2;
function posA(t) { return -12 + ((t * 2.4) % 88); }
function posB(t) { return 84 - ((t * 1.8) % 96); }

function hash(c, r) {
  var s = Math.sin(c * 127.1 + r * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

function shade(b) {
  var a, z, f;
  if (b < 0.5) { a = OFF; z = DIM; f = b * 2; }
  else { a = DIM; z = FULL; f = (b - 0.5) * 2; }
  var r = Math.round(a[0] + (z[0] - a[0]) * f);
  var g = Math.round(a[1] + (z[1] - a[1]) * f);
  var bl = Math.round(a[2] + (z[2] - a[2]) * f);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

function panel() {
  var pw = W * (phone ? 1 : 0.96);
  var ph = pw / 3;
  if (ph > H * 0.92) { ph = H * 0.92; pw = ph * 3; }
  return { x: (W - pw) / 2, y: (H - ph) / 2, w: pw, h: ph };
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var p = panel();
  var cellW = p.w / (COLS + 0.5);
  var cellH = p.h / ROWS;
  var dot = Math.min(cellW, cellH) * 0.66;
  var pa = posA(T), pb = posB(T);
  for (var r = 0; r < ROWS; r++) {
    var lag = (r - 4) * 1.15; // rows answer in sequence: the diagonal drift
    var ca = pa - lag, cb = pb - lag;
    var cy = p.y + cellH * (r + 0.5);
    for (var c = 0; c < COLS; c++) {
      var da = c - ca, db = c - cb;
      var b = Math.exp(-(da * da) / (2 * SIGMA * SIGMA))
            + Math.exp(-(db * db) / (2 * SIGMA * SIGMA))
            + 0.15 * hash(c, r)
            + 0.06 * (0.5 + 0.5 * Math.sin(2 * Math.PI * T / 9 + r * 0.9 + c * 0.35));
      if (b > 1) b = 1;
      var cx = p.x + cellW * (c + 0.5) + (r % 2) * cellW * 0.5;
      ctx.fillStyle = shade(b);
      ctx.fillRect(cx - dot / 2, cy - dot / 2, dot, dot);
    }
  }
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
