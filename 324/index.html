<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.324 Thirty Days, One Palette</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F4EFE3; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.324 Thirty Days, One Palette (meohmy_graphics).
// Thirty tiles in a 6 by 5 grid, one prompt motif per tile, all
// drawn in the same five colours and nothing else. Exactly one
// tile redraws per 2 second beat, in a fixed seeded order that
// covers all 30 tiles in 60 seconds, and each redraw advances
// that tile to the next of its 3 authored variants. Tapping a
// tile enlarges it for exactly 1.6 seconds with its prompt name
// under the motif, then it settles back. The only text is a
// small day number on each tile and the tapped prompt name.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var FOREST = '#2F5233', BERRY = '#A0342F', TWIG = '#6B4A35', SNOW = '#F4EFE3', OCHRE = '#C98A3D';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 37.35, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }
function ell(x, y, rx, ry, rot, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill();
}
function tri(x1, y1, x2, y2, x3, y3, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.closePath(); ctx.fill();
}
function poly(pts, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fill();
}
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function line(x1, y1, x2, y2, col, lw) {
  st(col, lw); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function leaf(x, y, len, wid, ang, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(0, -len);
  ctx.quadraticCurveTo(wid, -len * 0.35, 0, 0);
  ctx.quadraticCurveTo(-wid, -len * 0.35, 0, -len);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function star(x, y, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  for (var i = 0; i < 10; i++) {
    var a = -Math.PI / 2 + i * Math.PI / 5;
    var rr = (i % 2 === 0) ? r : r * 0.45;
    var px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
}
function petal(x, y, r, ang, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(r * 0.7, -r * 0.55, 0, -r * 1.55);
  ctx.quadraticCurveTo(-r * 0.7, -r * 0.55, 0, 0);
  ctx.closePath(); ctx.fill(); ctx.restore();
}

// ---- the 30 prompts, days 1 to 30 in order --------------------
// The prompt list named 28 prompts. Days 29 and 30 revisit days
// 1 and 2 (foxes, holly) as second showings, so the grid holds
// exactly 30 tiles.
var PROMPTS = [
  'foxes', 'holly', 'wreath', 'birds', 'pine cones', 'dried fruits',
  'snow', 'berries', 'owls', 'twigs', 'deer', 'cosy',
  'bears', 'tree', 'sleigh', 'gift wrap', 'starlight', 'christmas cards',
  'mushrooms', 'garland', 'snowman', 'presents', 'squirrel', 'poinsettia',
  'ribbons', 'ornaments', 'fire', 'yarn', 'foxes', 'holly'
];
var BGS = [
  SNOW, SNOW, SNOW, OCHRE, SNOW, SNOW,
  FOREST, SNOW, SNOW, SNOW, SNOW, FOREST,
  SNOW, SNOW, SNOW, BERRY, FOREST, OCHRE,
  SNOW, SNOW, FOREST, SNOW, SNOW, SNOW,
  SNOW, SNOW, FOREST, SNOW, SNOW, SNOW
];
if (PROMPTS.length !== 30) throw new Error('Thirty Days needs exactly 30 prompts');
if (BGS.length !== 30) throw new Error('Thirty Days needs exactly 30 tile grounds');

var COLS = 6, ROWS = 5, GAP = 5;
var TILES = [];
(function () {
  var tw = DW / COLS, th = DH / ROWS, i;
  for (i = 0; i < 30; i++) {
    TILES.push({
      idx: i, day: i + 1, name: PROMPTS[i], bg: BGS[i],
      col: i % COLS, row: Math.floor(i / COLS),
      x: (i % COLS) * tw, y: Math.floor(i / COLS) * th, w: tw, h: th,
      cx: (i % COLS) * tw + tw / 2, cy: Math.floor(i / COLS) * th + th / 2,
      variant: (i * 2 + Math.floor(i / 5)) % 3,
      redrawT0: -10
    });
  }
})();
if (TILES.length !== 30) throw new Error('Thirty Days needs exactly 30 tiles');
(function () {
  var counts = [0, 0, 0], i;
  for (i = 0; i < TILES.length; i++) counts[TILES[i].variant]++;
  if (counts[0] === 0 || counts[1] === 0 || counts[2] === 0) throw new Error('Thirty Days needs mixed variants in frame one');
})();

// Fixed seeded redraw order: a shuffled permutation of 0 to 29.
var ORDER = [];
(function () {
  var r = rng(32407), i, j, tmp;
  for (i = 0; i < 30; i++) ORDER.push(i);
  for (i = 29; i > 0; i--) {
    j = Math.floor(r() * (i + 1));
    tmp = ORDER[i]; ORDER[i] = ORDER[j]; ORDER[j] = tmp;
  }
})();
if (ORDER.length !== 30) throw new Error('Thirty Days schedule needs exactly 30 entries');
(function () {
  var seen = {}, i;
  for (i = 0; i < ORDER.length; i++) {
    if (seen[ORDER[i]]) throw new Error('Thirty Days schedule repeats a tile');
    seen[ORDER[i]] = true;
  }
})();
var lastBeat = Math.floor(T / 2);
TILES[ORDER[lastBeat % 30]].redrawT0 = T - 0.22;

function advanceSchedule() {
  var beat = Math.floor(T / 2);
  while (lastBeat < beat) {
    lastBeat++;
    var tile = TILES[ORDER[lastBeat % 30]];
    tile.variant = (tile.variant + 1) % 3;
    tile.redrawT0 = T;
  }
}

// ---- parametric flat motifs, palette colours only --------------
function drawMotif(name, v, bg) {
  var i, a, x, y;
  var flip = (v === 1) ? -1 : 1;
  if (name === 'foxes') {
    ell(30 * flip, 24, 27, 11, -0.55 * flip, OCHRE);
    ell(42 * flip, 12, 10, 8, 0, SNOW);
    ctx.fillStyle = OCHRE; circ(0, 2, 31, true);
    tri(-27, -14, -31, -42, -7, -27, OCHRE);
    tri(27, -14, 31, -42, 7, -27, OCHRE);
    tri(-22, -20, -25, -36, -11, -25, FOREST);
    tri(22, -20, 25, -36, 11, -25, FOREST);
    ell(0, 14, 19, 13, 0, SNOW);
    ctx.fillStyle = TWIG; circ(0, 8, 5, true); circ(-12, -6, 3.4, true); circ(12, -6, 3.4, true);
    if (v === 2) { ctx.fillStyle = BERRY; circ(-20, 16, 4, true); circ(20, 16, 4, true); }
  } else if (name === 'holly') {
    var leaves = 3 + v;
    for (i = 0; i < leaves; i++) {
      a = -Math.PI / 2 + (i - (leaves - 1) / 2) * 0.85;
      leaf(Math.cos(a + Math.PI / 2) * 8, 18 + Math.sin(a) * 6, 46, 15, a + Math.PI, FOREST);
    }
    ctx.fillStyle = BERRY; circ(-9, 4, 9, true); circ(10, 0, 9, true); circ(0, 15, 9, true);
    ctx.fillStyle = SNOW; circ(-12, 1, 2.6, true); circ(7, -3, 2.6, true);
  } else if (name === 'wreath') {
    var n = 10 + v * 2;
    for (i = 0; i < n; i++) {
      a = i / n * Math.PI * 2;
      leaf(Math.cos(a) * 36, Math.sin(a) * 36, 24, 8, a + Math.PI / 2 + 0.5, FOREST);
    }
    for (i = 0; i < 5; i++) {
      a = i / 5 * Math.PI * 2 + v * 0.6;
      ctx.fillStyle = BERRY; circ(Math.cos(a) * 36, Math.sin(a) * 36, 5.5, true);
    }
    star(0, 42, 9, OCHRE);
  } else if (name === 'birds') {
    var birds = (v === 2) ? 2 : 1;
    for (i = 0; i < birds; i++) {
      ctx.save();
      ctx.translate(birds === 2 ? (i === 0 ? -22 : 24) : 0, birds === 2 ? (i === 0 ? -8 : 10) : 0);
      ctx.scale((birds === 2 ? 0.72 : 1) * flip, birds === 2 ? 0.72 : 1);
      ell(0, 6, 32, 22, -0.15, BERRY);
      ctx.fillStyle = BERRY; circ(26, -12, 15, true);
      tri(38, -14, 52, -9, 38, -4, OCHRE);
      ell(-4, 8, 17, 10, -0.4, FOREST);
      poly([-28, 2, -48, -10, -44, 10, -28, 14], OCHRE);
      ctx.fillStyle = SNOW; circ(29, -15, 3.2, true);
      line(-8, 26, -8, 38, TWIG, 3); line(8, 26, 8, 38, TWIG, 3);
      ctx.restore();
    }
    line(-52, 46, 52, 46, TWIG, 4);
  } else if (name === 'pine cones') {
    ctx.save(); ctx.rotate((v - 1) * 0.14);
    for (i = 0; i < 3; i++) leaf(-14 + i * 14, -26, 26, 7, (i - 1) * 0.5 + Math.PI, FOREST);
    for (var row = 0; row < 5; row++) {
      var rw = 30 - Math.abs(2 - row) * 4, cnt = 3;
      for (i = 0; i < cnt; i++) {
        ell(-rw / 2 + i * (rw / (cnt - 1 || 1)), -14 + row * 15, 13.5, 8, 0, TWIG);
        ell(-rw / 2 + i * (rw / (cnt - 1 || 1)), -17 + row * 15, 8.5, 4.5, 0, OCHRE);
      }
    }
    ctx.restore();
  } else if (name === 'dried fruits') {
    var slices = 1 + v;
    for (i = 0; i < slices; i++) {
      x = slices === 1 ? 0 : (i - (slices - 1) / 2) * 40;
      y = slices === 1 ? 0 : (i % 2 === 0 ? -12 : 14);
      ctx.save(); ctx.translate(x, y); ctx.scale(slices === 1 ? 1 : 0.68, slices === 1 ? 1 : 0.68);
      ctx.fillStyle = OCHRE; circ(0, 0, 32, true);
      ctx.fillStyle = SNOW; circ(0, 0, 25, true);
      for (var k = 0; k < 6; k++) {
        a = k / 6 * Math.PI * 2;
        tri(0, 0, Math.cos(a - 0.22) * 21, Math.sin(a - 0.22) * 21, Math.cos(a + 0.22) * 21, Math.sin(a + 0.22) * 21, OCHRE);
      }
      ctx.restore();
    }
    leaf(26, -30, 20, 7, 0.7, FOREST);
  } else if (name === 'snow') {
    st(SNOW, 5);
    for (i = 0; i < 6; i++) {
      a = i / 6 * Math.PI * 2 + v * 0.3;
      x = Math.cos(a), y = Math.sin(a);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(x * 40, y * 40); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x * 24, y * 24); ctx.lineTo(x * 24 + Math.cos(a + 0.7) * 11, y * 24 + Math.sin(a + 0.7) * 11); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x * 24, y * 24); ctx.lineTo(x * 24 + Math.cos(a - 0.7) * 11, y * 24 + Math.sin(a - 0.7) * 11); ctx.stroke();
      ctx.fillStyle = SNOW; circ(x * 47, y * 47, 3.4, true);
    }
    ctx.fillStyle = OCHRE; circ(0, 0, 5, true);
  } else if (name === 'berries') {
    leaf(-8, -28, 30, 10, -0.5, FOREST); leaf(12, -28, 30, 10, 0.5, FOREST);
    line(0, -30, 0, -12, TWIG, 4);
    var pts = [[-20, -6], [4, -14], [24, 2], [-6, 8], [14, 24], [-24, 22], [30, -18]];
    var bn = 5 + v;
    for (i = 0; i < bn; i++) {
      ctx.fillStyle = BERRY; circ(pts[i][0], pts[i][1], 11, true);
      ctx.fillStyle = SNOW; circ(pts[i][0] - 3.5, pts[i][1] - 3.5, 3, true);
    }
  } else if (name === 'owls') {
    tri(-24, -28, -30, -46, -8, -34, TWIG); tri(24, -28, 30, -46, 8, -34, TWIG);
    ell(0, 2, 30, 38, 0, TWIG);
    ell(0, 16, 19, 22, 0, SNOW);
    ctx.fillStyle = SNOW; circ(-12, -12, 10, true); circ(12, -12, 10, true);
    ctx.fillStyle = TWIG; circ(-12, -12, 4.6, true); circ(12, -12, 4.6, true);
    tri(-5, -2, 5, -2, 0, 6, OCHRE);
    if (v === 2) { ctx.fillStyle = BERRY; circ(-19, 14, 4, true); circ(0, 24, 4, true); circ(19, 14, 4, true); }
    line(-14, 40, -14, 47, OCHRE, 3); line(14, 40, 14, 47, OCHRE, 3);
  } else if (name === 'twigs') {
    line(0, 46, 0, -38, TWIG, 6);
    var br = [[0, 8, -34, -12], [0, -8, 34, -28], [0, -22, -28, -42], [0, 22, 30, 2]];
    for (i = 0; i < br.length; i++) line(br[i][0] * flip, br[i][1], br[i][2] * flip, br[i][3], TWIG, 4);
    ctx.fillStyle = BERRY;
    circ(-34 * flip, -14, 5, true); circ(34 * flip, -30, 5, true); circ(0, -42, 5, true);
    if (v === 2) { circ(-28 * flip, -44, 4.4, true); circ(30 * flip, 0, 4.4, true); }
  } else if (name === 'deer') {
    line(-18, -30, -30, -50, TWIG, 4); line(-18, -30, -10, -50, TWIG, 4);
    line(18, -30, 30, -50, TWIG, 4); line(18, -30, 10, -50, TWIG, 4);
    line(-24, -42, -34, -46, TWIG, 3); line(24, -42, 34, -46, TWIG, 3);
    ell(-32, -12, 13, 7, -0.5, TWIG); ell(32, -12, 13, 7, 0.5, TWIG);
    ell(0, 4, 26, 34, 0, TWIG);
    ell(0, 20, 15, 16, 0, OCHRE);
    ctx.fillStyle = BERRY; circ(0, 12, 6, true);
    ctx.fillStyle = SNOW; circ(-10, -4, 3.4, true); circ(10, -4, 3.4, true);
    if (v === 1) { ctx.fillStyle = SNOW; circ(-14, 14, 3, true); circ(14, 22, 3, true); }
  } else if (name === 'cosy') {
    st(SNOW, 4);
    for (i = 0; i < 3; i++) {
      x = -16 + i * 16;
      ctx.beginPath(); ctx.moveTo(x, -28);
      ctx.quadraticCurveTo(x + (v === 1 ? -7 : 7), -40, x, -50); ctx.stroke();
    }
    rect(-32, -18, 64, 52, SNOW);
    rect(-32, 2, 64, 12, BERRY);
    ell(0, -18, 32, 8, 0, OCHRE);
    st(SNOW, 6); ctx.beginPath(); ctx.arc(42, 8, 13, -Math.PI / 2, Math.PI / 2); ctx.stroke();
    ctx.fillStyle = FOREST; circ(0, 8, 4.5, true);
  } else if (name === 'bears') {
    ctx.fillStyle = TWIG; circ(-24, -26, 13, true); circ(24, -26, 13, true);
    ctx.fillStyle = OCHRE; circ(-24, -26, 6.5, true); circ(24, -26, 6.5, true);
    ctx.fillStyle = TWIG; circ(0, 0, 34, true);
    ell(0, 13, 17, 12, 0, OCHRE);
    ctx.fillStyle = BERRY; circ(0, 7, 6, true);
    ctx.fillStyle = SNOW; circ(-12, -8, 3.6, true); circ(12, -8, 3.6, true);
    if (v === 2) star(28, 26, 8, BERRY);
  } else if (name === 'tree') {
    rect(-5, 22, 10, 20, TWIG);
    tri(-36, 26, 36, 26, 0, -8, FOREST);
    tri(-29, 2, 29, 2, 0, -28, FOREST);
    tri(-21, -20, 21, -20, 0, -44, FOREST);
    star(0, -50, 9, OCHRE);
    var orn = [[-14, 12], [12, 16], [0, -4], [-8, -24], [14, -14]];
    for (i = 0; i < 3 + v; i++) { ctx.fillStyle = (i % 2 === 0) ? BERRY : OCHRE; circ(orn[i][0], orn[i][1], 4.4, true); }
  } else if (name === 'sleigh') {
    poly([-44, 4, 44, 4, 34, 28, -30, 28], BERRY);
    poly([30, -12, 48, -12, 44, 4, 30, 4], BERRY);
    st(TWIG, 5); ctx.beginPath(); ctx.moveTo(-48, 38); ctx.lineTo(40, 38); ctx.quadraticCurveTo(52, 38, 52, 28); ctx.stroke();
    line(28, 28, 36, 38, TWIG, 4); line(-24, 28, -18, 38, TWIG, 4);
    rect(-26, -24, 28, 26, FOREST); line(-12, -24, -12, 2, OCHRE, 4); line(-26, -11, 2, -11, OCHRE, 4);
    if (v === 2) star(18, -20, 9, OCHRE);
  } else if (name === 'gift wrap') {
    rect(-34, -26, 68, 56, OCHRE);
    rect(-34, -5, 68, 10, SNOW); rect(-5, -26, 10, 56, SNOW);
    ell(-13, -34, 14, 8, -0.6, SNOW); ell(13, -34, 14, 8, 0.6, SNOW);
    ctx.fillStyle = BERRY; circ(0, -30, 6, true);
    if (v === 1) { ctx.fillStyle = FOREST; circ(-20, 18, 4, true); circ(20, -16, 4, true); circ(20, 18, 4, true); circ(-20, -16, 4, true); }
    if (v === 2) { line(-34, -26, 34, 30, FOREST, 3); line(34, -26, -34, 30, FOREST, 3); }
  } else if (name === 'starlight') {
    var stars = [[-28, -24, 13], [18, -34, 10], [4, 2, 16], [-24, 28, 10], [30, 24, 12], [34, -4, 8]];
    for (i = 0; i < 4 + v; i++) star(stars[i][0], stars[i][1], stars[i][2], OCHRE);
    ctx.fillStyle = SNOW; circ(-38, 8, 3, true); circ(22, 42, 3, true); circ(40, -24, 2.6, true); circ(-6, -42, 2.6, true);
  } else if (name === 'christmas cards') {
    ctx.save(); ctx.rotate((v - 1) * 0.12);
    rect(-36, -26, 72, 52, BERRY);
    rect(-29, -19, 58, 38, SNOW);
    tri(-13, 8, 13, 8, 0, -12, FOREST);
    rect(-2, 8, 4, 6, TWIG);
    star(0, -15, 5.5, OCHRE);
    ctx.restore();
    if (v === 2) { ctx.save(); ctx.translate(24, 24); ctx.rotate(0.35); rect(-16, -11, 32, 22, FOREST); rect(-12, -7, 24, 14, SNOW); ctx.restore(); }
  } else if (name === 'mushrooms') {
    var shrooms = [[-18, 6, 1], [20, 14, 0.72]];
    for (i = 0; i < shrooms.length; i++) {
      ctx.save(); ctx.translate(shrooms[i][0], shrooms[i][1]); ctx.scale(shrooms[i][2], shrooms[i][2]);
      rect(-6, 0, 12, 24, OCHRE);
      ctx.fillStyle = BERRY; ctx.beginPath(); ctx.arc(0, 2, 24, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = SNOW; circ(-9, -8, 4, true); circ(8, -13, 3.2, true); circ(2, -4, 2.6, true);
      ctx.restore();
    }
    leaf(-34, 34, 16, 5, -0.7, FOREST); leaf(34, 34, 16, 5, 0.7, FOREST);
    if (v === 2) { ctx.fillStyle = BERRY; circ(2, -26, 5, true); }
  } else if (name === 'garland') {
    st(FOREST, 6); ctx.beginPath(); ctx.moveTo(-52, -22); ctx.quadraticCurveTo(0, 26, 52, -22); ctx.stroke();
    st(FOREST, 5); ctx.beginPath(); ctx.moveTo(-52, 6); ctx.quadraticCurveTo(0, 48, 52, 6); ctx.stroke();
    for (i = 0; i < 7; i++) {
      var tt = i / 6;
      x = -52 + tt * 104; y = -22 + Math.sin(tt * Math.PI) * 24 + (1 - Math.abs(tt - 0.5) * 2) * 8;
      ctx.fillStyle = (i % 2 === 0) ? BERRY : OCHRE; circ(x, y + 4, 5.2, true);
      if (v === 2) leaf(x, y + 12, 13, 4.5, Math.PI, FOREST);
    }
    ell(-11, 2, 11, 6, -0.6, BERRY); ell(11, 2, 11, 6, 0.6, BERRY);
  } else if (name === 'snowman') {
    ctx.fillStyle = SNOW; circ(0, 22, 26, true); circ(0, -16, 19, true);
    rect(-16, -42, 32, 9, TWIG); rect(-9, -56, 18, 15, TWIG);
    ctx.fillStyle = TWIG; circ(-7, -19, 2.8, true); circ(7, -19, 2.8, true); circ(0, 14, 2.8, true); circ(0, 28, 2.8, true);
    tri(2, -13, 2, -8, 18, -10, OCHRE);
    rect(-18, -2, 36, 8, BERRY); rect(8, 2, 8, 20, BERRY);
    line(-18, 12, -38, 2, TWIG, 4); line(18, 12, 38, 2, TWIG, 4);
    if (v === 1) star(-30, -34, 7, OCHRE);
  } else if (name === 'presents') {
    rect(-40, -2, 38, 34, FOREST); rect(-40, 12, 38, 7, OCHRE); rect(-24, -2, 7, 34, OCHRE);
    rect(4, -22, 34, 54, BERRY); rect(4, 0, 34, 7, SNOW); rect(18, -22, 7, 54, SNOW);
    ell(-28, -8, 10, 5.5, -0.6, OCHRE); ell(-14, -8, 10, 5.5, 0.6, OCHRE);
    ell(14, -28, 10, 5.5, -0.6, SNOW); ell(28, -28, 10, 5.5, 0.6, SNOW);
    if (v === 2) star(-21, 15, 7, SNOW);
  } else if (name === 'squirrel') {
    ell(30 * flip, -8, 17, 30, 0.45 * flip, TWIG);
    ell(28 * flip, -10, 10, 20, 0.45 * flip, OCHRE);
    ell(-4, 12, 26, 20, -0.25, OCHRE);
    ctx.fillStyle = OCHRE; circ(-16, -14, 16, true);
    tri(-26, -24, -28, -38, -16, -28, OCHRE);
    ell(-12, 18, 11, 8, 0, SNOW);
    ctx.fillStyle = TWIG; circ(-21, -16, 3, true); circ(-6, -2, 5, true);
    ell(-2, 24, 9, 7, 0.5, TWIG); tri(-2, 17, 3, 24, -7, 24, FOREST);
    line(-24, 30, -38, 36, TWIG, 4);
  } else if (name === 'poinsettia') {
    for (i = 0; i < 5; i++) { a = i / 5 * Math.PI * 2 + 0.3; petal(Math.cos(a) * 10, Math.sin(a) * 10, 25, a + Math.PI / 2 + Math.PI, FOREST); }
    for (i = 0; i < 6; i++) { a = i / 6 * Math.PI * 2 + v * 0.35; petal(Math.cos(a) * 6, Math.sin(a) * 6, 26, a + Math.PI / 2 + Math.PI, BERRY); }
    ctx.fillStyle = OCHRE; circ(0, 0, 6, true); circ(-10, 6, 4, true); circ(10, 6, 4, true); circ(0, -10, 4, true);
  } else if (name === 'ribbons') {
    ell(-18, -10, 19, 11, -0.55, BERRY); ell(18, -10, 19, 11, 0.55, BERRY);
    ell(-16, -10, 9, 5, -0.55, SNOW); ell(16, -10, 9, 5, 0.55, SNOW);
    poly([-8, 4, -22, 40, -8, 34, 0, 42, 2, 6], BERRY);
    poly([8, 4, 22, 40, 8, 34, 0, 42, -2, 6], BERRY);
    ctx.fillStyle = OCHRE; circ(0, -4, 9, true);
    if (v === 2) { line(-34, -30, 34, -30, OCHRE, 3); }
  } else if (name === 'ornaments') {
    var orns = [[-30, 2, BERRY], [0, 12, OCHRE], [30, 2, FOREST]];
    for (i = 0; i < orns.length; i++) {
      var drop = (v === 1 && i === 1) ? 10 : 0;
      line(orns[i][0], -48, orns[i][0], orns[i][1] - 16 + drop, TWIG, 3);
      ctx.fillStyle = orns[i][2]; circ(orns[i][0], orns[i][1] + drop, 16, true);
      rect(orns[i][0] - 5, orns[i][1] - 21 + drop, 10, 6, OCHRE);
      ctx.fillStyle = SNOW; circ(orns[i][0] - 5.5, orns[i][1] - 5 + drop, 4, true);
    }
  } else if (name === 'fire') {
    ctx.save(); ctx.translate(0, 26); ctx.rotate(0.5); rect(-34, -5, 68, 10, TWIG); ctx.restore();
    ctx.save(); ctx.translate(0, 26); ctx.rotate(-0.5); rect(-34, -5, 68, 10, TWIG); ctx.restore();
    petal(0, 28, 26, 0, BERRY);
    petal(-13 * flip, 28, 18, -0.25 * flip, OCHRE);
    petal(13 * flip, 28, 18, 0.25 * flip, OCHRE);
    petal(0, 28, 15, 0, OCHRE);
    petal(0, 28, 8.5, 0, SNOW);
    if (v === 2) { ctx.fillStyle = OCHRE; circ(-30, -22, 3, true); circ(26, -30, 3, true); circ(6, -38, 2.6, true); }
  } else if (name === 'yarn') {
    ctx.fillStyle = BERRY; circ(-6, 4, 30, true);
    st(SNOW, 3.4);
    for (i = 0; i < 4; i++) {
      ctx.beginPath(); ctx.arc(-6, 4, 10 + i * 6, 0.5 + i * 0.7, 2.5 + i * 0.7); ctx.stroke();
      ctx.beginPath(); ctx.arc(-6, 4, 10 + i * 6, 3.4 + i * 0.6, 5.2 + i * 0.6); ctx.stroke();
    }
    line(8, -18, 44, -44, TWIG, 4); line(18, -8, 48, -28, TWIG, 4);
    st(BERRY, 4); ctx.beginPath(); ctx.moveTo(16, 26); ctx.quadraticCurveTo(38, 34, 30, 46); ctx.quadraticCurveTo(24, 52, 38, 52); ctx.stroke();
    if (v === 1) { ctx.fillStyle = OCHRE; circ(-30, -26, 6, true); }
  }
}

function textColour(bg) { return (bg === SNOW || bg === OCHRE) ? TWIG : SNOW; }

function drawTile(tile, scaleMotif, showName) {
  rect(tile.x + GAP, tile.y + GAP, tile.w - GAP * 2, tile.h - GAP * 2, tile.bg);
  var p = (T - tile.redrawT0) / 0.45;
  var rs = 1;
  if (p >= 0 && p < 1) rs = 0.86 + 0.14 * Math.sin(p * Math.PI);
  ctx.save();
  ctx.translate(tile.cx, tile.cy);
  ctx.scale(rs * scaleMotif, rs * scaleMotif);
  drawMotif(tile.name, tile.variant, tile.bg);
  ctx.restore();
  ctx.fillStyle = textColour(tile.bg);
  ctx.font = '600 19px Arial, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(String(tile.day), tile.x + GAP + 9, tile.y + GAP + 7);
  if (showName) {
    ctx.font = '600 15px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(tile.name, tile.cx, tile.y + tile.h - GAP - 24);
  }
}

// ---- enlarged tapped tile ---------------------------------------
var enlargedIdx = -1, enlargedT0 = -10;
function drawEnlarged() {
  if (enlargedIdx < 0) return;
  var age = T - enlargedT0;
  if (age >= 1.6) { enlargedIdx = -1; return; }
  var tile = TILES[enlargedIdx];
  var w = tile.w * 1.72, h = tile.h * 1.72;
  var x = Math.max(6, Math.min(DW - w - 6, tile.cx - w / 2));
  var y = Math.max(6, Math.min(DH - h - 6, tile.cy - h / 2));
  rect(x, y, w, h, tile.bg);
  st(SNOW, 8); ctx.strokeRect(x + 4, y + 4, w - 8, h - 8);
  st(FOREST, 3); ctx.strokeRect(x + 10, y + 10, w - 20, h - 20);
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2 - 22);
  ctx.scale(2.05, 2.05);
  drawMotif(tile.name, tile.variant, tile.bg);
  ctx.restore();
  ctx.fillStyle = textColour(tile.bg);
  ctx.font = '600 21px Arial, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(String(tile.day), x + 18, y + 14);
  ctx.font = '600 27px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(tile.name, x + w / 2, y + h - 52);
}

function draw() {
  ctx.fillStyle = SNOW;
  ctx.fillRect(0, 0, DW, DH);
  var i;
  for (i = 0; i < TILES.length; i++) drawTile(TILES[i], 1, false);
  drawEnlarged();
}

// ---- interaction: tap a tile to enlarge it -----------------------
var tap = null;
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect2 = canvas.getBoundingClientRect();
  return [((e.clientX - rect2.left) - OX) / S, ((e.clientY - rect2.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  tap = { sx: p[0], sy: p[1], moved: 0 };
});
canvas.addEventListener('pointermove', function (e) {
  if (!tap) return;
  var p = toDesign(e);
  tap.moved = Math.max(tap.moved, Math.abs(p[0] - tap.sx), Math.abs(p[1] - tap.sy));
});
canvas.addEventListener('pointerup', function (e) {
  if (tap && tap.moved < 9) {
    var p = toDesign(e);
    var col = Math.floor(p[0] / (DW / COLS));
    var row = Math.floor(p[1] / (DH / ROWS));
    if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
      enlargedIdx = row * COLS + col;
      enlargedT0 = T;
    }
  }
  tap = null;
});
canvas.addEventListener('pointercancel', function () { tap = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = SNOW;
  ctx.fillRect(0, 0, W, H);
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  advanceSchedule();
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
