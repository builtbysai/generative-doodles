<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Memory Wall</title>
<style>
  html, body { margin: 0; padding: 0; background: #14453F; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (Giulia Dall'Ara flat mural register, exactly as briefed)
  var TEAL = '#14453F';
  var MUSTARD = '#E3A92C';
  var RUST = '#C33E21';
  var CREAM = '#F4EBD3';
  var LAV = '#B9A8E0';
  var GLYPH_COLS = [MUSTARD, RUST, CREAM, LAV];

  var HOUSE_SEED = 488731;
  var TYPES = ['leaf', 'coral', 'sun', 'fish', 'house', 'figure'];

  // Seeded RNG (mulberry32, fixed seed)
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var vw = 300, vh = 300, dpr = 1, isPhone = false;

  function wallW() { return vw * 1.25; }
  function bandH() { return Math.max(26, vh * 0.075); }

  // ---- State (in-memory only) -------------------------------------------
  // glyphs: { u, v } fractions of wall width / viewport height, rFrac is
  // the glyph radius as a fraction of min(vw, vh) (diameter 3.8-6.0% of
  // the canvas), type index, colour index, rotation, variant seed.
  var rng = null;
  var glyphs = [];
  var panX = 0;

  // Starter anchors, spread across the part of the wall visible at load
  // (the visible fraction of the 1.25x wall is u 0 to 0.8 at pan 0), with
  // generous air between them: her walls keep enormous flat resting areas.
  var STARTER = [
    { u: 0.13, v: 0.30 },
    { u: 0.30, v: 0.56 },
    { u: 0.42, v: 0.24 },
    { u: 0.55, v: 0.50 },
    { u: 0.67, v: 0.28 },
    { u: 0.22, v: 0.74 },
    { u: 0.60, v: 0.70 }
  ];

  // Collision check in wall pixel space. A candidate is free when its
  // centre clears every placed glyph by both radii plus a breathing gap.
  function isFree(wx, wy, r) {
    var W = wallW();
    for (var i = 0; i < glyphs.length; i++) {
      var g = glyphs[i];
      var gx = g.u * W, gy = g.v * vh;
      var gr = g.rFrac * Math.min(vw, vh);
      var dx = wx - gx, dy = wy - gy;
      var need = r + gr + Math.min(vw, vh) * 0.018;
      if (dx * dx + dy * dy < need * need) return false;
    }
    return true;
  }

  // Spiral search for the nearest free spot around the wanted point.
  function findFree(wx, wy, r) {
    var W = wallW(), U = Math.min(vw, vh);
    var top = r + 8, bot = vh - bandH() - r - 4;
    function clampPt(x, y) {
      if (x < r + 8) x = r + 8;
      if (x > W - r - 8) x = W - r - 8;
      if (y < top) y = top;
      if (y > bot) y = bot;
      return { x: x, y: y };
    }
    var c = clampPt(wx, wy);
    if (isFree(c.x, c.y, r)) return c;
    for (var k = 1; k <= 60; k++) {
      var rad = k * U * 0.012;
      var steps = 10;
      for (var s = 0; s < steps; s++) {
        var a = (s / steps) * Math.PI * 2 + k * 0.7;
        var p = clampPt(wx + Math.cos(a) * rad, wy + Math.sin(a) * rad);
        if (isFree(p.x, p.y, r)) return p;
      }
    }
    return c; // wall is full around there; accept the clamped point
  }

  function addGlyph(wx, wy, type, colIdx, rFrac, rot, variant) {
    var r = rFrac * Math.min(vw, vh);
    var p = findFree(wx, wy, r);
    glyphs.push({
      u: p.x / wallW(), v: p.y / vh,
      type: type, col: colIdx, rFrac: rFrac, rot: rot, variant: variant
    });
  }

  // Build the starter cluster from the fixed house seed. The type list is
  // a seeded shuffle of all six glyph types plus one repeat, so the load
  // frame always shows the full library. The RNG stream is left open:
  // taps keep drawing from the same stream where the starter stopped.
  function buildStarter() {
    rng = mulberry32(HOUSE_SEED);
    glyphs = [];
    panX = 0;
    var order = [0, 1, 2, 3, 4, 5, Math.floor(rng() * 6)];
    for (var i = order.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    for (var k = 0; k < STARTER.length; k++) {
      var type = order[k];
      var col = Math.floor(rng() * GLYPH_COLS.length);
      var rFrac = 0.019 + rng() * 0.011;
      var upright = (type === 4 || type === 5);
      var rot = upright ? (rng() - 0.5) * 0.08 : (rng() - 0.5) * 0.6;
      var variant = rng();
      var jx = (rng() - 0.5) * 0.02, jy = (rng() - 0.5) * 0.03;
      addGlyph((STARTER[k].u + jx) * wallW(), (STARTER[k].v + jy) * vh,
        type, col, rFrac, rot, variant);
    }
  }

  function plantAt(wx, wy) {
    var type = Math.floor(rng() * 6);
    var col = Math.floor(rng() * GLYPH_COLS.length);
    var rFrac = 0.019 + rng() * 0.011;
    var upright = (type === 4 || type === 5);
    var rot = upright ? (rng() - 0.5) * 0.08 : (rng() - 0.5) * 0.6;
    var variant = rng();
    addGlyph(wx, wy, type, col, rFrac, rot, variant);
  }

  function resize() {
    var vv = window.visualViewport;
    vw = vv ? vv.width : window.innerWidth;
    vh = vv ? vv.height : window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    if (window.screen && window.screen.width && window.screen.height) {
      isPhone = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      isPhone = vh > vw * 1.15;
    }
    var minPan = -(wallW() - vw);
    if (panX < minPan) panX = minPan;
    if (panX > 0) panX = 0;
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
  }
  window.addEventListener('resize', function () { resize(); draw(); });
  resize();

  // ---- Glyph library -----------------------------------------------------
  // Every glyph is drawn in a local box of radius 1 (scaled by r), flat
  // fills in one palette colour, details cut in the teal ground colour.

  function drawLeaf(r, col) {
    ctx.strokeStyle = col;
    ctx.lineWidth = 0.14;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0.82);
    ctx.lineTo(0.06, 1.12);
    ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0, 1);
    ctx.bezierCurveTo(-0.95, 0.35, -0.8, -0.55, 0, -1);
    ctx.bezierCurveTo(0.8, -0.55, 0.95, 0.35, 0, 1);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = TEAL;
    ctx.lineWidth = 0.10;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0.82);
    ctx.quadraticCurveTo(0.08, 0, 0, -0.78);
    ctx.stroke();
  }

  function drawCoral(r, col, variant) {
    ctx.strokeStyle = col;
    ctx.lineCap = 'round';
    ctx.lineWidth = 0.30;
    var lean = (variant - 0.5) * 0.3;
    ctx.beginPath();
    ctx.moveTo(0, 1);
    ctx.quadraticCurveTo(lean * 0.4, 0.3, lean, -0.35);
    ctx.stroke();
    ctx.lineWidth = 0.24;
    ctx.beginPath();
    ctx.moveTo(lean * 0.5, 0.25);
    ctx.quadraticCurveTo(-0.45, 0.05, -0.68, -0.55);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(lean * 0.7, -0.02);
    ctx.quadraticCurveTo(0.5, -0.2, 0.66, -0.72);
    ctx.stroke();
    ctx.lineWidth = 0.18;
    ctx.beginPath();
    ctx.moveTo(lean, -0.35);
    ctx.quadraticCurveTo(lean - 0.1, -0.65, lean - 0.28, -0.88);
    ctx.stroke();
    ctx.fillStyle = col;
    var tips = [[-0.68, -0.55], [0.66, -0.72], [lean - 0.28, -0.88], [lean, -0.35]];
    for (var i = 0; i < tips.length; i++) {
      ctx.beginPath();
      ctx.arc(tips[i][0], tips[i][1], 0.16, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawSun(r, col) {
    ctx.fillStyle = col;
    for (var i = 0; i < 8; i++) {
      var a = (i / 8) * Math.PI * 2;
      var ca = Math.cos(a), sa = Math.sin(a);
      var px = -sa, py = ca;
      ctx.beginPath();
      ctx.moveTo(ca * 0.98, sa * 0.98);
      ctx.lineTo(ca * 0.62 + px * 0.14, sa * 0.62 + py * 0.14);
      ctx.lineTo(ca * 0.62 - px * 0.14, sa * 0.62 - py * 0.14);
      ctx.closePath();
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(0, 0, 0.52, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = TEAL;
    ctx.beginPath();
    ctx.arc(0, 0, 0.20, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawFish(r, col, variant) {
    var flip = variant > 0.5 ? -1 : 1;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.ellipse(0, 0, 0.78, 0.44, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(flip * 0.62, 0);
    ctx.lineTo(flip * 1.02, -0.42);
    ctx.lineTo(flip * 1.02, 0.42);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(flip * -0.12, -0.36);
    ctx.lineTo(flip * 0.10, -0.68);
    ctx.lineTo(flip * 0.30, -0.34);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = TEAL;
    ctx.beginPath();
    ctx.arc(flip * -0.42, -0.10, 0.10, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawHouse(r, col) {
    ctx.fillStyle = col;
    ctx.fillRect(-0.58, -0.05, 1.16, 0.92);
    ctx.beginPath();
    ctx.moveTo(-0.78, -0.05);
    ctx.lineTo(0, -0.82);
    ctx.lineTo(0.78, -0.05);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = TEAL;
    ctx.fillRect(-0.15, 0.28, 0.30, 0.59);
    ctx.fillRect(0.28, -0.0 + 0.14, 0.22, 0.22);
  }

  function drawFigure(r, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(0, -0.62, 0.30, 0, Math.PI * 2);
    ctx.fill();
    // Dress: one flat trapezoid mass for the body.
    ctx.beginPath();
    ctx.moveTo(-0.20, -0.28);
    ctx.lineTo(0.20, -0.28);
    ctx.lineTo(0.52, 0.88);
    ctx.lineTo(-0.52, 0.88);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.lineCap = 'round';
    ctx.lineWidth = 0.20;
    ctx.beginPath();
    ctx.moveTo(-0.24, -0.18);
    ctx.lineTo(-0.58, 0.34);
    ctx.moveTo(0.24, -0.18);
    ctx.lineTo(0.58, 0.34);
    ctx.stroke();
  }

  function drawGlyph(g) {
    var W = wallW();
    var x = g.u * W + panX, y = g.v * vh;
    var r = g.rFrac * Math.min(vw, vh);
    if (x < -r * 2 || x > vw + r * 2) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(g.rot);
    ctx.scale(r, r);
    var col = GLYPH_COLS[g.col % GLYPH_COLS.length];
    var t = TYPES[g.type % TYPES.length];
    if (t === 'leaf') drawLeaf(r, col);
    else if (t === 'coral') drawCoral(r, col, g.variant);
    else if (t === 'sun') drawSun(r, col);
    else if (t === 'fish') drawFish(r, col, g.variant);
    else if (t === 'house') drawHouse(r, col);
    else drawFigure(r, col);
    ctx.restore();
  }

  // ---- Scallop band -------------------------------------------------------
  // Segments are a pure function of the glyph count: floor(count / 12).
  // Each segment is one eighth of the wall and carries four scallops
  // along the top edge of the bottom band, in wall space, so panning
  // reveals the growth.
  function drawBand() {
    var W = wallW();
    var h = bandH();
    var y0 = vh - h;
    var segments = Math.floor(glyphs.length / 12);
    if (segments <= 0) return;
    ctx.save();
    ctx.translate(panX, 0);
    ctx.fillStyle = 'rgba(244,235,211,0.10)';
    ctx.fillRect(0, y0, W, h);
    var segW = W / 8;
    var cols = [MUSTARD, RUST, CREAM, LAV];
    for (var s = 0; s < segments && s < 8; s++) {
      for (var q = 0; q < 4; q++) {
        var cx = s * segW + (q + 0.5) * (segW / 4);
        ctx.fillStyle = cols[(s * 4 + q) % 4];
        ctx.beginPath();
        ctx.arc(cx, y0, segW / 8, Math.PI, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = cols[s % 4];
      ctx.fillRect(s * segW, y0, segW, 3);
    }
    ctx.restore();
  }

  function draw() {
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // The wall itself: dark teal, full frame.
    ctx.fillStyle = TEAL;
    ctx.fillRect(0, 0, vw, vh);

    // Faint cream panel grid in wall space: five columns, three rows.
    // It suggests the panel layout but never forces placement.
    var W = wallW();
    ctx.save();
    ctx.translate(panX, 0);
    ctx.strokeStyle = 'rgba(244,235,211,0.07)';
    ctx.lineWidth = 1;
    for (var i = 1; i < 5; i++) {
      var gx = (W / 5) * i;
      ctx.beginPath();
      ctx.moveTo(gx, 0);
      ctx.lineTo(gx, vh);
      ctx.stroke();
    }
    for (var j = 1; j < 3; j++) {
      var gy = (vh / 3) * j;
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.lineTo(W, gy);
      ctx.stroke();
    }
    ctx.restore();

    drawBand();

    for (var k = 0; k < glyphs.length; k++) drawGlyph(glyphs[k]);

    // The one word of instruction, quiet in the top-right corner.
    var U = Math.min(vw, vh);
    ctx.fillStyle = CREAM;
    ctx.globalAlpha = 0.32;
    ctx.font = '600 ' + Math.round(U * 0.028) + 'px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('tap', vw - U * 0.035, U * 0.055);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  // One synchronous first frame: the starter cluster of 7 glyphs from the
  // fixed house seed, faint grid visible, no band yet (7 < 12). Never
  // derived from a clock. No rAF loop: the wall is still, and redraws
  // happen on resize and on interaction only.
  buildStarter();
  draw();

  // ---- Interaction ---------------------------------------------------------
  // Tap plants one glyph at the tap point. Drag pans the wall (1.25x the
  // viewport, so the pan range stays modest). Double-tap clears the wall
  // back to the starter cluster and restarts the seeded stream. Never
  // click-to-reload.
  function nowMs() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now();
    return Date.now();
  }
  function pos(e) {
    var x = e.clientX, y = e.clientY;
    if (typeof canvas.getBoundingClientRect === 'function') {
      var r = canvas.getBoundingClientRect();
      x -= r.left; y -= r.top;
    }
    return { x: x, y: y };
  }

  var downAt = 0, downX = 0, downY = 0, startPan = 0, moved = false, dragging = false;
  var lastTapAt = -10000, lastTapX = 0, lastTapY = 0;

  function onDown(e) {
    var p = pos(e);
    downAt = nowMs(); downX = p.x; downY = p.y;
    startPan = panX; moved = false; dragging = true;
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var p = pos(e);
    var dx = p.x - downX;
    if (Math.abs(dx) + Math.abs(p.y - downY) > 9) moved = true;
    if (moved) {
      var minPan = -(wallW() - vw);
      panX = startPan + dx;
      if (panX < minPan) panX = minPan;
      if (panX > 0) panX = 0;
      draw();
    }
    if (e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var wasTap = !moved && (nowMs() - downAt) < 400;
    if (!wasTap) return;
    var p = pos(e);
    var t = nowMs();
    var nearLast = Math.abs(p.x - lastTapX) + Math.abs(p.y - lastTapY) < 60;
    if (t - lastTapAt < 450 && nearLast) {
      // Double-tap: clear and restart from the house seed.
      buildStarter();
      lastTapAt = -10000;
      draw();
      return;
    }
    lastTapAt = t; lastTapX = p.x; lastTapY = p.y;
    plantAt(p.x - panX, p.y);
    draw();
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { dragging = false; });
  }
})();
</script>
</body>
</html>
