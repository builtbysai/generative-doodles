<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Keeper Test</title>
<style>
html, body { margin: 0; padding: 0; background: #F7F4EE; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#F7F4EE';
var GRAPHITE = '#55524C';
var GRAPHITE_SOFT = 'rgba(85,82,76,0.55)';
var GRAPHITE_FAINT = 'rgba(85,82,76,0.28)';
var SIGNAL = '#B0463A';
var SIGNAL_SOFT = 'rgba(176,70,58,0.35)';
var PLATE = '#FFFFFF';
var PLATE_LINE = 'rgba(85,82,76,0.30)';
var TITLE_INK = '#3A3833';
var HINT_INK = 'rgba(58,56,51,0.75)';
var FILL_START = 0.42;
var FILL_SECONDS = 45;
var STILL_THRESH = 2.2;
var BREACH_EVERY = 13;
var BREACH_JITTER = 5;
var RESEED_EASE = 1.4;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smoothstep(p) { p = clamp(p, 0, 1); return p * p * (3 - 2 * p); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
/* seeded once: frame one always shows this motif at this fill */
var rng = mulberry32(1737);
var MARK_COUNT = 6;
var marks = [];
var i;
for (i = 0; i < MARK_COUNT; i++) {
  marks.push({
    ang: (i / MARK_COUNT) * TAU + (rng() - 0.5) * 0.5,
    rad: 0.88 + rng() * 0.22,
    size: 7 + rng() * 7,
    alpha: 0.45 + rng() * 0.4,
    w1: 0.11 + rng() * 0.10,
    w2: 0.07 + rng() * 0.08,
    p1: rng() * TAU,
    p2: rng() * TAU,
    amp: 1.2 + rng() * 1.6
  });
}
var simTime = 0;
var fill = FILL_START;
var prevPos = null;
var breachCount = 0;
var nextBreach = BREACH_EVERY + mulberry32(1737 * 31 + 7)() * BREACH_JITTER;
var reseedT = -10;
var reseedFrom = null;
var breachDir = 0;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* layout: motif oval centered, zone bar a quiet vertical rule at the right margin */
function layout() {
  var cx = VW / 2, cy = VH / 2;
  var rx = Math.min(VW, VH) * (isPhone ? 0.26 : 0.21);
  var ry = rx * 0.62;
  var barH = Math.min(VH * 0.42, 340);
  var barX = VW - (isPhone ? 34 : 58);
  var barY = (VH - barH) / 2;
  return { cx: cx, cy: cy, rx: rx, ry: ry, barX: barX, barY: barY, barH: barH };
}
/* mark positions at time t: base oval point plus a tiny slow wobble.
   A breach adds a brief jump to one mark, then the motif reseeds. */
function markPos(m, t, L, breachAmp) {
  var blend = smoothstep((t - reseedT) / RESEED_EASE);
  var ang = m.ang, rad = m.rad;
  if (reseedFrom) {
    var f = reseedFrom[marks.indexOf(m)];
    ang = f.ang + (m.ang - f.ang) * blend;
    rad = f.rad + (m.rad - f.rad) * blend;
  }
  var x = L.cx + Math.cos(ang) * L.rx * rad;
  var y = L.cy + Math.sin(ang) * L.ry * rad;
  x += Math.sin(t * m.w1 + m.p1) * m.amp;
  y += Math.cos(t * m.w2 + m.p2) * m.amp * 0.8;
  if (breachAmp > 0 && marks.indexOf(m) === breachCount % MARK_COUNT) {
    x += Math.cos(breachDir) * breachAmp;
    y += Math.sin(breachDir) * breachAmp;
  }
  return { x: x, y: y };
}
function positionsAt(t, L, breachAmp) {
  var out = [], k;
  for (k = 0; k < MARK_COUNT; k++) out.push(markPos(marks[k], t, L, breachAmp));
  return out;
}
function breachAmpAt(t) {
  var d = t - nextBreach;
  if (d < -0.4 || d > 0.4) return 0;
  return 26 * Math.exp(-(d * d) / (2 * 0.09 * 0.09));
}
function reseed() {
  reseedFrom = [];
  var k;
  for (k = 0; k < MARK_COUNT; k++) reseedFrom.push({ ang: marks[k].ang, rad: marks[k].rad });
  var r2 = mulberry32(1737 * 101 + breachCount * 17 + 5);
  for (k = 0; k < MARK_COUNT; k++) {
    marks[k].ang = (k / MARK_COUNT) * TAU + (r2() - 0.5) * 0.5;
    marks[k].rad = 0.88 + r2() * 0.22;
    marks[k].size = 7 + r2() * 7;
    marks[k].alpha = 0.45 + r2() * 0.4;
    marks[k].p1 = r2() * TAU;
    marks[k].p2 = r2() * TAU;
  }
  reseedT = simTime;
  breachDir = mulberry32(1737 * 7 + breachCount * 13)() * TAU;
}
function update(dt) {
  simTime += dt;
  var L = layout();
  var amp = breachAmpAt(simTime);
  var pos = positionsAt(simTime, L, amp);
  var disp = 0, k;
  if (prevPos) {
    for (k = 0; k < MARK_COUNT; k++) {
      var dx = pos[k].x - prevPos[k].x;
      var dy = pos[k].y - prevPos[k].y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d > disp) disp = d;
    }
  }
  prevPos = pos;
  if (disp > STILL_THRESH && simTime > nextBreach - 0.4 && simTime < nextBreach + 0.4) {
    /* the stray mark empties the bar; the motif reseeds calmly, no flash */
    fill = 0;
    breachCount++;
    reseed();
    nextBreach = simTime + BREACH_EVERY + mulberry32(1737 * 31 + breachCount * 7)() * BREACH_JITTER;
  } else if (disp <= STILL_THRESH) {
    fill = Math.min(1, fill + dt / FILL_SECONDS);
  }
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var L = layout();
  var amp = breachAmpAt(simTime);
  var pos = positionsAt(simTime, L, amp);
  var k;
  /* faint oval guide the motif loops on */
  ctx.beginPath();
  ctx.ellipse(L.cx, L.cy, L.rx, L.ry, 0, 0, TAU);
  ctx.strokeStyle = GRAPHITE_FAINT;
  ctx.lineWidth = 1;
  ctx.stroke();
  /* the soft marks */
  for (k = 0; k < MARK_COUNT; k++) {
    var m = marks[k];
    ctx.beginPath();
    ctx.ellipse(pos[k].x, pos[k].y, m.size, m.size * 0.72, m.ang * 0.3, 0, TAU);
    ctx.fillStyle = 'rgba(85,82,76,' + m.alpha.toFixed(4) + ')';
    ctx.fill();
  }
  /* zone bar: quiet vertical rule at the right margin, red fill rising from the bottom */
  ctx.fillStyle = GRAPHITE_FAINT;
  ctx.fillRect(L.barX - 1, L.barY, 2, L.barH);
  var fillH = L.barH * fill;
  ctx.fillStyle = SIGNAL;
  ctx.fillRect(L.barX - 1, L.barY + L.barH - fillH, 2, fillH);
  ctx.beginPath();
  ctx.arc(L.barX, L.barY + L.barH - fillH, 3, 0, TAU);
  ctx.fillStyle = SIGNAL;
  ctx.fill();
  var capPx = isPhone ? 10 : 11;
  ctx.font = '600 ' + capPx + 'px Helvetica, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = GRAPHITE_SOFT;
  ctx.fillText('ZONE', L.barX, L.barY + L.barH + 8);
  /* caption under the motif */
  var capLine = 'TAYLOR DEUPREE · PP984 · TD2';
  var capPx2 = isPhone ? 11 : 12;
  ctx.font = '600 ' + capPx2 + 'px Helvetica, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = GRAPHITE_SOFT;
  ctx.fillText(capLine, L.cx, L.cy + L.ry + 26);
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  while (titlePx > 9 && ctx.measureText('The Keeper Test').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  }
  var titleW = ctx.measureText('The Keeper Test').width;
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  var dateW = ctx.measureText('2006 · 10 · 14').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px Helvetica, Arial, sans-serif';
  ctx.fillText('The Keeper Test', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 14', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only. Stillness earns the bar.';
  ctx.font = smallPx + 'px Helvetica, Arial, sans-serif';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { simTime = t; draw(); },
    fill: function () { return fill; },
    simTime: function () { return simTime; },
    breachCount: function () { return breachCount; }
  };
}
/* ---- frame one: fixed phase, simTime 0, fill 0.42, no breach yet ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) { update(dt); draw(); }
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
