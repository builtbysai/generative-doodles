<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1962 Camera 07</title>
<style>
  html, body { margin: 0; padding: 0; background: #232b26; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Camera 07, CW3 / PP1209, study #256 caius-williams.
  // A surveillance camera wide shot of a crowded dim room.
  // Five double basses sound from different corners: five low
  // drones, slightly detuned, beating against each other,
  // swelling and receding as the crowd shifts. A paper moon
  // hangs over the scene. The timestamp ticks in the lower
  // right and never stops. The piece is the room seen by a
  // camera that does not care.
  var ROOM = '#232b26';   // CCTV green gray room
  var WALL = '#2e3831';   // wall, lighter green gray
  var FLOOR = '#171d19';  // floor, dark green gray
  var PHOS = '#7fd08a';   // timestamp phosphor green
  var PHOS_DIM = '#5d9a68'; // dim phosphor
  var MOON = '#f4f1e6';   // paper moon white
  var CROWD = '#10140f';  // crowd shadow
  var CROWD2 = '#1c241d'; // crowd shadow, second tone
  var WOOD = '#5a4a33';   // bass wood, dark warm
  var WOOD_DK = '#3d3222'; // bass wood, dark
  var BREATH = '#e8ece4'; // pale breath white

  // Fixed-phase first frame: FIRST_T = 47 s. At t = 47 the
  // drones are mid swell (bass 1 near its peak, bass 4 near
  // its trough), the crowd has drifted off its start pose,
  // and the timestamp reads 06-11-2025 19:24:49, so frame
  // one already shows the room mid watch.
  var FIRST_T = 47;
  var SEED = 1962;
  var CYCLE = 96; // one drone cycle, in seconds
  // Timestamp base: 06-11-2025 19:24:02, in seconds of day.
  var TS_BASE = 19 * 3600 + 24 * 60 + 2;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is accepted as an alias for the same clock,
  // so the node-canvas render tool (which passes its probe value
  // as ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  // Five basses: left, right, center, and two in the crowd.
  // Each has its own detune period, so the swells beat against
  // each other instead of moving together.
  var BASSES = [
    { x: 0.13, y: 0.52, s: 1.00, per: 23, ph: 0.0 },
    { x: 0.87, y: 0.52, s: 1.00, per: 31, ph: 1.7 },
    { x: 0.50, y: 0.44, s: 1.12, per: 37, ph: 3.1 },
    { x: 0.31, y: 0.66, s: 0.82, per: 43, ph: 4.4 },
    { x: 0.69, y: 0.66, s: 0.82, per: 53, ph: 5.6 }
  ];

  // The crowd: seeded heads and shoulders across the lower
  // room. Positions are fixed by seed; only the drift moves.
  var CROWD_N = 30;
  var crowd = [];
  (function () {
    var rng = mulberry32(SEED * 13 + 5);
    var i;
    for (i = 0; i < CROWD_N; i++) {
      crowd.push({
        x: 0.03 + rng() * 0.94,
        y: 0.74 + rng() * 0.16,
        r: 0.016 + rng() * 0.014,
        drift: 0.008 + rng() * 0.016,
        sp: 0.03 + rng() * 0.05,
        ph: rng() * Math.PI * 2,
        tone: (rng() < 0.5) ? CROWD : CROWD2
      });
    }
  })();

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function lerp(a, b, f) { return a + (b - a) * f; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  // Timestamp from the fixed timeline, never from a wall clock:
  // 06-11-2025 19:24:02 plus t seconds. Determinism wins over
  // the prompt's real clock overlay; see process.md.
  function timestamp(t) {
    var s = TS_BASE + Math.floor(t);
    var hh = Math.floor(s / 3600) % 24;
    var mm = Math.floor(s / 60) % 60;
    var ss = s % 60;
    return '06-11-2025 ' + pad2(hh) + ':' + pad2(mm) + ':' + pad2(ss);
  }

  var L = {};
  function layout() {
    var u = Math.min(W, H);
    L.u = u;
    L.horizon = H * 0.62;
    L.moonX = W * 0.72;
    L.moonY = H * 0.16;
    L.moonR = u * 0.085;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // One double bass: two stacked body lobes, a neck, a scroll,
  // four strings. Drawn as separate beginPath shapes so the
  // node-canvas ellipse quirk cannot join them into polygons.
  function drawBass(b, t, u) {
    var cx = b.x * W, cy = b.y * H;
    var s = b.s * u;
    var amp = 0.5 + 0.5 * Math.sin((2 * Math.PI * t) / b.per + b.ph);
    // Drone glow: a soft phosphor ring that swells with the voice.
    var glowR = s * (0.16 + 0.10 * amp);
    ctx.fillStyle = hexA(PHOS, a4(0.05 + 0.09 * amp));
    ctx.beginPath();
    ctx.moveTo(cx + glowR, cy);
    ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = hexA(PHOS, a4(0.10 + 0.22 * amp));
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(cx + glowR * 0.82, cy);
    ctx.arc(cx, cy, glowR * 0.82, 0, Math.PI * 2);
    ctx.stroke();
    // Neck and scroll.
    ctx.strokeStyle = WOOD_DK;
    ctx.lineWidth = Math.max(3, s * 0.018);
    ctx.beginPath();
    ctx.moveTo(cx, cy - s * 0.10);
    ctx.lineTo(cx, cy - s * 0.24);
    ctx.stroke();
    ctx.fillStyle = WOOD_DK;
    ctx.beginPath();
    ctx.moveTo(cx + s * 0.022, cy - s * 0.245);
    ctx.arc(cx, cy - s * 0.245, s * 0.022, 0, Math.PI * 2);
    ctx.fill();
    // Body: lower lobe large, upper lobe smaller, waist implied
    // by the overlap.
    ctx.fillStyle = WOOD;
    ctx.beginPath();
    ctx.moveTo(cx + s * 0.085, cy + s * 0.02);
    ctx.ellipse(cx, cy + s * 0.06, s * 0.085, s * 0.075, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = WOOD_DK;
    ctx.beginPath();
    ctx.moveTo(cx + s * 0.062, cy - s * 0.055);
    ctx.ellipse(cx, cy - s * 0.035, s * 0.062, s * 0.055, 0, 0, Math.PI * 2);
    ctx.fill();
    // Rim light on the body edge.
    ctx.strokeStyle = hexA(PHOS, a4(0.18 + 0.15 * amp));
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.085, cy + s * 0.06);
    ctx.ellipse(cx, cy + s * 0.06, s * 0.085, s * 0.075, 0, Math.PI * 0.6, Math.PI * 1.4);
    ctx.stroke();
    // Four strings down the body.
    var i;
    ctx.strokeStyle = hexA(BREATH, a4(0.35));
    ctx.lineWidth = 0.8;
    for (i = -1.5; i <= 1.5; i += 1) {
      ctx.beginPath();
      ctx.moveTo(cx + i * s * 0.012, cy - s * 0.24);
      ctx.lineTo(cx + i * s * 0.016, cy + s * 0.12);
      ctx.stroke();
    }
    // Bridge tick.
    ctx.strokeStyle = hexA(BREATH, a4(0.5));
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.045, cy + s * 0.045);
    ctx.lineTo(cx + s * 0.045, cy + s * 0.045);
    ctx.stroke();
    return amp;
  }

  function drawCrowd(t) {
    var i;
    for (i = 0; i < crowd.length; i++) {
      var p = crowd[i];
      var dx = Math.sin(t * p.sp + p.ph) * p.drift * W;
      var bob = Math.sin(t * p.sp * 1.7 + p.ph) * L.u * 0.003;
      var hx = p.x * W + dx;
      var hy = p.y * H + bob;
      var hr = p.r * L.u;
      // Shoulders.
      ctx.fillStyle = p.tone;
      ctx.beginPath();
      ctx.moveTo(hx + hr * 2.1, hy + hr * 3.2);
      ctx.ellipse(hx, hy + hr * 1.6, hr * 2.1, hr * 1.7, 0, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(hx - hr * 2.1, hy + hr * 1.6, hr * 4.2, hr * 1.6);
      // Head.
      ctx.beginPath();
      ctx.moveTo(hx + hr, hy);
      ctx.arc(hx, hy, hr, 0, Math.PI * 2);
      ctx.fill();
      // A faint phosphor rim on the side facing the moon.
      ctx.strokeStyle = hexA(PHOS, a4(0.10));
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(hx + hr * 0.7, hy - hr * 0.7);
      ctx.arc(hx, hy, hr, -Math.PI * 0.25, Math.PI * 0.25);
      ctx.stroke();
    }
  }

  function drawNoise(t) {
    // Camera static: dots seeded by a 7 Hz quantized clock, so
    // the flicker stays well under the 14 Hz ceiling.
    var q = Math.floor(t * 7);
    var rng = mulberry32(SEED * 7 + q * 101 + 3);
    var i, n = 260;
    for (i = 0; i < n; i++) {
      var x = rng() * W, y = rng() * H;
      var v = rng();
      ctx.fillStyle = (v < 0.5) ? hexA(BREATH, a4(0.02 + rng() * 0.04)) : hexA(CROWD, a4(0.03 + rng() * 0.05));
      ctx.fillRect(x, y, 1.6, 1.6);
    }
    // One faint static band drifting down the frame.
    var bandY = ((t * 9) % H);
    ctx.fillStyle = hexA(BREATH, a4(0.03));
    ctx.fillRect(0, bandY, W, 2);
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
    var u = L.u;

    // Room ground: wall above the horizon, floor below.
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = FLOOR;
    ctx.fillRect(0, L.horizon, W, H - L.horizon);
    // Wall panel seams, faint.
    ctx.strokeStyle = hexA(CROWD, a4(0.25));
    ctx.lineWidth = 1;
    var i;
    for (i = 1; i <= 4; i++) {
      var px = (i / 5) * W;
      ctx.beginPath();
      ctx.moveTo(px, 0);
      ctx.lineTo(px, L.horizon);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(0, L.horizon);
    ctx.lineTo(W, L.horizon);
    ctx.stroke();

    // The paper moon, hanging on a string, swaying slowly.
    var sway = Math.sin(t * 0.03) * 0.02;
    var mx = L.moonX + Math.sin(sway) * u * 0.01;
    var my = L.moonY;
    ctx.strokeStyle = hexA(BREATH, a4(0.4));
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(mx, 0);
    ctx.lineTo(mx, my - L.moonR);
    ctx.stroke();
    ctx.fillStyle = MOON;
    ctx.beginPath();
    ctx.moveTo(mx + L.moonR, my);
    ctx.arc(mx, my, L.moonR, 0, Math.PI * 2);
    ctx.fill();
    // Paper creases across the moon.
    ctx.strokeStyle = hexA(CROWD, a4(0.12));
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(mx - L.moonR * 0.7, my - L.moonR * 0.2);
    ctx.lineTo(mx + L.moonR * 0.5, my + L.moonR * 0.35);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(mx - L.moonR * 0.3, my + L.moonR * 0.7);
    ctx.lineTo(mx + L.moonR * 0.7, my - L.moonR * 0.55);
    ctx.stroke();
    // Moon glow, faint phosphor halo.
    ctx.fillStyle = hexA(MOON, a4(0.05));
    ctx.beginPath();
    ctx.moveTo(mx + L.moonR * 1.6, my);
    ctx.arc(mx, my, L.moonR * 1.6, 0, Math.PI * 2);
    ctx.fill();

    // Five basses, center first so the crowd basses overlap it
    // last where they stand in front.
    var amps = [];
    amps.push(drawBass(BASSES[2], t, u));
    amps.push(drawBass(BASSES[0], t, u));
    amps.push(drawBass(BASSES[1], t, u));
    amps.push(drawBass(BASSES[3], t, u));
    amps.push(drawBass(BASSES[4], t, u));

    // The crowd drifts across the lower room.
    drawCrowd(t);

    // Low drone lines: five faint horizontal waves near the
    // floor, one per bass, breathing with its swell.
    for (i = 0; i < 5; i++) {
      var a = amps[i];
      var wy = H * (0.90 + i * 0.014);
      ctx.strokeStyle = hexA(PHOS, a4(0.05 + 0.10 * a));
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(W * 0.08, wy);
      var x;
      for (x = 0; x <= 24; x++) {
        var fx = W * 0.08 + (x / 24) * W * 0.84;
        var fy = wy + Math.sin(x * 0.9 + t * 0.4 + i * 1.3) * u * 0.004 * (0.5 + a);
        ctx.lineTo(fx, fy);
      }
      ctx.stroke();
    }

    // Scanlines across the whole frame.
    ctx.fillStyle = hexA(CROWD, a4(0.05));
    var sy;
    for (sy = 0; sy < H; sy += 4) {
      ctx.fillRect(0, sy, W, 1);
    }

    // Camera static and vignette.
    drawNoise(t);
    var vg = ctx.createRadialGradient(W / 2, H / 2, u * 0.35, W / 2, H / 2, u * 0.75);
    vg.addColorStop(0, hexA(CROWD, a4(0)));
    vg.addColorStop(1, hexA(CROWD, a4(0.45)));
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    // ---- CCTV overlays: Camera 07 top-left, REC top-right,
    // corner brackets, timestamp lower right.
    var fsMono = Math.round(13 * clamp(W / 560, 0.85, 1.15));
    var fsCam = Math.round(18 * clamp(W / 560, 0.85, 1.15));
    var fsTs = Math.round(14 * clamp(W / 560, 0.85, 1.15));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = hexA(PHOS, a4(0.95));
    ctx.font = 'bold ' + fsCam + 'px "Courier New", monospace';
    ctx.fillText('CAMERA 07', 18, 18 + fsCam * 0.8);
    ctx.fillStyle = hexA(PHOS, a4(0.7));
    ctx.font = fsMono + 'px "Courier New", monospace';
    ctx.fillText('№1962 · 2007 · 05 · 27', 18, 18 + fsCam * 0.8 + fsMono + 8);
    // REC dot, blinking at 1 Hz.
    var recOn = (Math.floor(t) % 2 === 0);
    ctx.textAlign = 'right';
    if (recOn) {
      ctx.fillStyle = hexA('#e05a4e', a4(0.95));
      ctx.beginPath();
      ctx.moveTo(W - 18 - fsMono * 3.2, 18 + fsCam * 0.4);
      ctx.arc(W - 18 - fsMono * 3.2, 18 + fsCam * 0.4, fsMono * 0.32, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = hexA(PHOS, a4(0.9));
    ctx.font = 'bold ' + fsMono + 'px "Courier New", monospace';
    ctx.fillText('REC', W - 18, 18 + fsCam * 0.8);
    // Corner brackets.
    ctx.strokeStyle = hexA(PHOS, a4(0.55));
    ctx.lineWidth = 1.5;
    var bl = Math.max(14, u * 0.03), m = 10;
    var corners = [
      [m, m, 1, 1], [W - m, m, -1, 1],
      [m, H - m, 1, -1], [W - m, H - m, -1, -1]
    ];
    for (i = 0; i < corners.length; i++) {
      var c = corners[i];
      ctx.beginPath();
      ctx.moveTo(c[0] + c[2] * bl, c[1]);
      ctx.lineTo(c[0], c[1]);
      ctx.lineTo(c[0], c[1] + c[3] * bl);
      ctx.stroke();
    }
    // Timestamp, lower right.
    ctx.fillStyle = hexA(PHOS, a4(0.95));
    ctx.font = 'bold ' + fsTs + 'px "Courier New", monospace';
    ctx.fillText(timestamp(t), W - 18, H - 18);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom, breath white on a faint
    // dark pill so it stays legible over the crowd.
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    var hint = 'Watch the room.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px2 = (W - hw) / 2 - 12, py = H - fsHint - 46, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(BREATH, a4(0.08));
    ctx.fillRect(px2, py, pw, ph);
    ctx.strokeStyle = hexA(BREATH, a4(0.25));
    ctx.lineWidth = 1;
    ctx.strokeRect(px2 + 0.5, py + 0.5, pw - 1, ph - 1);
    ctx.fillStyle = hexA(BREATH, a4(0.9));
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 40);
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1962 exposes the timestamp and the drone
  // amplitudes at any t.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1962 = {
      timestamp: function (t) { return timestamp(t); },
      amps: function (t) {
        var out = [], i;
        for (i = 0; i < BASSES.length; i++) {
          out.push(0.5 + 0.5 * Math.sin((2 * Math.PI * t) / BASSES[i].per + BASSES[i].ph));
        }
        return out;
      },
      cycle: CYCLE,
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the drones swell on 23 to 53 s periods, the
  // crowd drifts at about 0.05 Hz, the static flickers at 7 Hz,
  // all well under the 14 Hz ceiling. Guarded so node-canvas
  // QA (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
