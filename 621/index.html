<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Watch It Being Made</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F5F1E8; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ================= palette families =================
  // The series cycles families and creatures. Each painting's palette is
  // discovered at its blank page, never mixed with another family's.
  var PAPER = '#F5F1E8';
  var FAMILIES = [
    { ground: '#F5F1E8', pigments: ['#2B3A67'], washAlpha: 0.27 },              // indigo monochrome
    { ground: '#F5F1E8', pigments: ['#5C8A4D', '#E87B9C', '#F2C14E'], washAlpha: 0.26 }, // garden brights
    { ground: '#14100C', pigments: ['#E2725B', '#E8B93B'], washAlpha: 0.34 }     // dusk
  ];
  var CREATURES = ['fox', 'bird', 'serpent', 'fish'];
  var BASE_SEED = 621075;

  // ================= timing =================
  var BREATHE = 2, PAINT = 40, REST = 6, FADE = 4;
  var CYCLE = BREATHE + PAINT + REST + FADE; // 52 s per painting

  // ================= seeded rng =================
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ================= canvas / viewport =================
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 300, H = 300;

  function viewSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.width === 'number') {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && typeof window.innerWidth === 'number') {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = W; h = H; }
    return { w: Math.max(50, Math.floor(w)), h: Math.max(50, Math.floor(h)) };
  }

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999; sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var s = viewSize();
    W = s.w; H = s.h;
    canvas.width = W; canvas.height = H;
    draw(currentT());
  }

  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    if (window.addEventListener) window.addEventListener('resize', resize);
  }

  // ================= geometry helpers =================
  // Unit space: (0.5, 0.5) is canvas centre, 1 unit = min(W, H).
  function unit() { return Math.min(W, H); }
  function toPx(u, v) {
    var s = unit();
    return [W / 2 + (u - 0.5) * s, H / 2 + (v - 0.5) * s];
  }
  function fromPx(x, y) {
    var s = unit();
    return [(x - W / 2) / s + 0.5, (y - H / 2) / s + 0.5];
  }
  function smooth(pts, per) {
    if (pts.length < 3) return pts.slice();
    var out = [];
    var P = [pts[0]].concat(pts, [pts[pts.length - 1]]);
    for (var i = 1; i < P.length - 2; i++) {
      for (var j = 0; j < per; j++) {
        var t = j / per, t2 = t * t, t3 = t2 * t;
        var x = 0.5 * ((2 * P[i][0]) + (-P[i - 1][0] + P[i + 1][0]) * t +
          (2 * P[i - 1][0] - 5 * P[i][0] + 4 * P[i + 1][0] - P[i + 2][0]) * t2 +
          (-P[i - 1][0] + 3 * P[i][0] - 3 * P[i + 1][0] + P[i + 2][0]) * t3);
        var y = 0.5 * ((2 * P[i][1]) + (-P[i - 1][1] + P[i + 1][1]) * t +
          (2 * P[i - 1][1] - 5 * P[i][1] + 4 * P[i + 1][1] - P[i + 2][1]) * t2 +
          (-P[i - 1][1] + 3 * P[i][1] - 3 * P[i + 1][1] + P[i + 2][1]) * t3);
        out.push([x, y]);
      }
    }
    out.push(pts[pts.length - 1]);
    return out;
  }
  function pathLen(pts) {
    var L = 0;
    for (var i = 1; i < pts.length; i++) {
      var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
      L += Math.sqrt(dx * dx + dy * dy);
    }
    return L;
  }
  // Point at arc-length fraction f along pts; also returns tangent angle.
  function pointAt(pts, f) {
    var total = pathLen(pts);
    if (total <= 0) return { p: pts[0], a: 0 };
    var target = total * Math.max(0, Math.min(1, f));
    var acc = 0;
    for (var i = 1; i < pts.length; i++) {
      var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
      var seg = Math.sqrt(dx * dx + dy * dy);
      if (acc + seg >= target || i === pts.length - 1) {
        var t = seg > 0 ? (target - acc) / seg : 0;
        t = Math.max(0, Math.min(1, t));
        return { p: [pts[i - 1][0] + dx * t, pts[i - 1][1] + dy * t], a: Math.atan2(dy, dx) };
      }
      acc += seg;
    }
    return { p: pts[pts.length - 1], a: 0 };
  }
  // First portion of pts covering arc-length fraction f.
  function partialPath(pts, f) {
    if (f >= 1) return pts;
    if (f <= 0) return [pts[0]];
    var total = pathLen(pts), target = total * f, acc = 0, out = [pts[0]];
    for (var i = 1; i < pts.length; i++) {
      var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
      var seg = Math.sqrt(dx * dx + dy * dy);
      if (acc + seg >= target) {
        var t = seg > 0 ? (target - acc) / seg : 0;
        out.push([pts[i - 1][0] + dx * t, pts[i - 1][1] + dy * t]);
        return out;
      }
      out.push(pts[i]); acc += seg;
    }
    return out;
  }

  // ================= creature templates =================
  // Local coords, creature facing right, roughly +-0.55 box.
  // Each entry: list of strokes {subs:[[pts],...], w} then details fn.
  function creatureStrokes(name) {
    if (name === 'fox') return [
      { subs: [[[-0.34, -0.02], [-0.52, -0.10], [-0.50, -0.30], [-0.34, -0.24]]], w: 0.092 }, // tail
      { subs: [[[-0.32, -0.05], [-0.10, -0.16], [0.12, -0.16], [0.28, -0.08]]], w: 0.056 },   // back
      { subs: [[[0.27, -0.09], [0.38, -0.15], [0.51, -0.06], [0.43, 0.02]]], w: 0.046 },     // head (open wedge)
      { subs: [[[0.30, -0.11], [0.27, -0.23]], [[0.38, -0.12], [0.40, -0.24]]], w: 0.028 },  // ears
      { subs: [[[-0.30, 0.03], [-0.04, 0.11], [0.24, 0.06]]], w: 0.046 },                    // belly
      { subs: [[[0.24, 0.07], [0.25, 0.26]], [[-0.26, 0.06], [-0.27, 0.26]]], w: 0.032 }     // legs
    ];
    if (name === 'bird') return [
      { subs: [[[-0.30, 0.10], [-0.18, -0.10], [0.05, -0.18], [0.24, -0.08], [0.28, 0.06], [0.12, 0.16], [-0.12, 0.16], [-0.28, 0.14]]], w: 0.052 }, // body
      { subs: [[[0.22, -0.06], [0.28, -0.18], [0.40, -0.21], [0.47, -0.13]]], w: 0.042 }, // head (open arc)
      { subs: [[[0.46, -0.14], [0.59, -0.10], [0.46, -0.06]]], w: 0.022 },                   // beak
      { subs: [[[-0.06, -0.06], [0.09, 0.02], [-0.01, 0.11], [-0.15, 0.02]]], w: 0.036 },    // wing
      { subs: [[[-0.28, 0.08], [-0.47, 0.20]], [[-0.26, 0.13], [-0.41, 0.28]]], w: 0.028 },  // tail
      { subs: [[[0.05, 0.16], [0.05, 0.31]], [[0.16, 0.15], [0.17, 0.30]]], w: 0.018 }       // legs
    ];
    if (name === 'serpent') return [
      { subs: [[[-0.50, 0.16], [-0.32, -0.07], [-0.09, 0.11], [0.10, -0.11], [0.30, -0.02], [0.42, -0.14]]], w: 0.062 }, // body S
      { subs: [[[0.40, -0.15], [0.52, -0.18], [0.57, -0.09]]], w: 0.042 },     // head (open)
      { subs: [[[0.56, -0.10], [0.64, -0.13]], [[0.64, -0.13], [0.68, -0.17]], [[0.64, -0.13], [0.69, -0.10]]], w: 0.012 }, // tongue
      { subs: [[[-0.48, 0.23], [-0.30, 0.01], [-0.08, 0.18], [0.11, -0.04], [0.29, 0.05]]], w: 0.020 } // belly line
    ];
    // fish, facing left
    return [
      { subs: [[[0.40, 0.00], [0.15, -0.18], [-0.15, -0.19], [-0.38, -0.08]]], w: 0.052 },    // top arc
      { subs: [[[-0.38, -0.08], [-0.15, 0.11], [0.12, 0.14], [0.40, 0.00]]], w: 0.052 },      // bottom arc
      { subs: [[[0.40, 0.00], [0.53, -0.15]], [[0.40, 0.00], [0.53, 0.15]], [[0.53, -0.15], [0.53, 0.15]]], w: 0.034 }, // tail
      { subs: [[[-0.05, -0.17], [-0.02, -0.29], [0.09, -0.16]]], w: 0.026 },                 // fin
      { subs: [[[-0.27, -0.11], [-0.23, 0.00], [-0.27, 0.10]]], w: 0.020 }                   // gill
    ];
  }
  function creatureEye(name) {
    if (name === 'fox') return [0.42, -0.05];
    if (name === 'bird') return [0.40, -0.14];
    if (name === 'serpent') return [0.50, -0.11];
    return [-0.30, -0.03]; // fish
  }
  function creatureDots(name) {
    if (name === 'fox') return [[-0.20, -0.09], [0.00, -0.115], [0.18, -0.095]];
    if (name === 'bird') return [[-0.02, -0.01], [0.05, 0.05], [-0.09, 0.05]];
    if (name === 'serpent') return [[-0.38, 0.03], [-0.19, 0.02], [0.00, 0.01], [0.20, -0.06], [0.33, -0.09]];
    return [[-0.10, -0.05], [0.05, 0.02], [-0.02, 0.06], [0.16, -0.06]];
  }

  // ================= painting generation =================
  // A painting is pure data: an ordered stroke list on a normalised
  // timeline. Playback is a function of the anchored clock only.
  function genPainting(k) {
    var rng = mulberry32(BASE_SEED + k * 7919);
    var fam = FAMILIES[k % FAMILIES.length];
    var creature = CREATURES[k % CREATURES.length];
    var pig = fam.pigments;
    var strokes = [];
    var i, j;

    // --- layer 0: washes (broad translucent blobs) ---
    var nWash = (k === 0) ? 3 : 3 + Math.floor(rng() * 2); // painting 1 lays exactly 3
    for (i = 0; i < nWash; i++) {
      var cx = 0.5 + (rng() - 0.5) * 0.58;
      var cy = 0.5 + (rng() - 0.5) * 0.50;
      var r = 0.10 + rng() * 0.09;
      var nP = 13, blob = [];
      var ph = rng() * Math.PI * 2;
      for (j = 0; j < nP; j++) {
        var a = (j / nP) * Math.PI * 2;
        var rr = r * (0.74 + rng() * 0.5);
        blob.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.82]);
      }
      blob.push(blob[0]);
      strokes.push({
        layer: 0, kind: 'wash', color: pig[Math.floor(rng() * pig.length)],
        alpha: fam.washAlpha * (0.75 + rng() * 0.6),
        blob: smooth(blob, 3), cx: cx, cy: cy,
        dur: 2.0 + rng() * 0.9, pause: 0.5 + rng() * 0.4
      });
    }

    // --- creature transform ---
    var ccx = 0.5 + (rng() - 0.5) * 0.07;
    var ccy = 0.51 + (rng() - 0.5) * 0.06;
    var cs = 0.60 + rng() * 0.12;
    var flip = rng() < 0.5 ? -1 : 1;
    function T(p) { return [ccx + flip * p[0] * cs, ccy + p[1] * cs]; }
    function jit(p, amt) { return [p[0] + (rng() - 0.5) * amt, p[1] + (rng() - 0.5) * amt]; }

    // --- layer 1: creature shape strokes ---
    var tmpl = creatureStrokes(creature);
    var pigOff = Math.floor(rng() * pig.length);
    for (i = 0; i < tmpl.length; i++) {
      var subs = [];
      for (j = 0; j < tmpl[i].subs.length; j++) {
        var raw = tmpl[i].subs[j], pts = [];
        for (var q = 0; q < raw.length; q++) pts.push(T(jit(raw[q], 0.018)));
        subs.push(smooth(pts, 4));
      }
      strokes.push({
        layer: 1, kind: 'ribbon', color: pig[(pigOff + i) % pig.length],
        alpha: 0.88, width: tmpl[i].w, subs: subs,
        dur: 1.3 + rng() * 0.8, pause: 0.45 + rng() * 0.55
      });
    }

    // --- layer 1: leaves and blossoms around the creature ---
    var nAcc = 4 + Math.floor(rng() * 3);
    for (i = 0; i < nAcc; i++) {
      var ang = rng() * Math.PI * 2;
      var dist = 0.34 + rng() * 0.15;
      var lx = ccx + Math.cos(ang) * dist, ly = ccy + Math.sin(ang) * dist * 0.85;
      var col = pig[Math.floor(rng() * pig.length)];
      if (rng() < 0.5) {
        // leaf: pointed outline, rotated
        var rot = rng() * Math.PI * 2, ls = 0.045 + rng() * 0.03;
        var leafLocal = [[0, 0], [0.35, -0.30], [1, 0], [0.35, 0.26], [0, 0]];
        var leaf = [];
        for (j = 0; j < leafLocal.length; j++) {
          var lp = leafLocal[j];
          leaf.push([lx + (lp[0] * Math.cos(rot) - lp[1] * Math.sin(rot)) * ls,
                     ly + (lp[0] * Math.sin(rot) + lp[1] * Math.cos(rot)) * ls]);
        }
        strokes.push({ layer: 1, kind: 'ribbon', color: col, alpha: 0.8, width: 0.020,
          subs: [smooth(leaf, 3)], dur: 0.9 + rng() * 0.5, pause: 0.35 + rng() * 0.4 });
      } else {
        // blossom: five petal dots around a centre
        var bs = 0.030 + rng() * 0.012, dots = [];
        for (j = 0; j < 5; j++) {
          var ba = (j / 5) * Math.PI * 2 + rng() * 0.4;
          dots.push({ p: [lx + Math.cos(ba) * bs, ly + Math.sin(ba) * bs], r: 0.016 });
        }
        dots.push({ p: [lx, ly], r: 0.011 });
        strokes.push({ layer: 1, kind: 'dots', color: col, alpha: 0.85, dots: dots,
          dur: 0.8, pause: 0.35 + rng() * 0.4 });
      }
    }

    // --- layer 2: details ---
    var eye = T(creatureEye(creature));
    strokes.push({ layer: 2, kind: 'dot', color: fam.ground, alpha: 0.95,
      p: eye, r: 0.0135, dur: 0.55, pause: 0.3 + rng() * 0.3 });
    var dloc = creatureDots(creature), ddots = [];
    for (i = 0; i < dloc.length; i++) ddots.push({ p: T(dloc[i]), r: 0.0105 });
    strokes.push({ layer: 2, kind: 'dots', color: fam.ground, alpha: 0.75, dots: ddots,
      dur: 0.85, pause: 0.3 + rng() * 0.3 });
    // two fine lines: a ground line and a short flourish
    var gy = ccy + 0.30 * cs + 0.03;
    strokes.push({ layer: 2, kind: 'ribbon', color: pig[pigOff % pig.length], alpha: 0.55,
      width: 0.012,
      subs: [smooth([[ccx - 0.34 * cs, gy], [ccx, gy + 0.012], [ccx + 0.34 * cs, gy]], 4)],
      dur: 0.8, pause: 0.3 });
    var fx = ccx + flip * 0.42 * cs, fy = ccy - 0.30 * cs;
    strokes.push({ layer: 2, kind: 'ribbon', color: pig[(pigOff + 1) % pig.length], alpha: 0.7,
      width: 0.014,
      subs: [smooth([[fx - 0.05, fy + 0.03], [fx, fy - 0.02], [fx + 0.05, fy + 0.02]], 4)],
      dur: 0.7, pause: 0.3 });

    // --- normalise timeline to PAINT seconds ---
    var total = 0;
    for (i = 0; i < strokes.length; i++) total += strokes[i].dur + strokes[i].pause;
    var scale = PAINT / total, cursor = 0;
    var layerStart = { 1: -1, 2: -1 };
    var shapeCount = 0, frame1Time = 0;
    for (i = 0; i < strokes.length; i++) {
      var st = strokes[i];
      st.start = cursor;
      cursor += st.dur * scale;
      st.end = cursor;
      st.durN = st.dur * scale;
      cursor += st.pause * scale;
      if (st.layer === 1 && layerStart[1] < 0) layerStart[1] = st.start;
      if (st.layer === 2 && layerStart[2] < 0) layerStart[2] = st.start;
      if (st.layer === 1) { shapeCount++; if (shapeCount === 4) frame1Time = st.end; }
    }
    return { fam: fam, creature: creature, strokes: strokes,
             layerStart: layerStart, frame1Time: frame1Time };
  }

  var cacheIdx = -1, cacheP = null;
  function getPainting(k) {
    if (k !== cacheIdx) { cacheP = genPainting(k); cacheIdx = k; }
    return cacheP;
  }
  var painting0 = getPainting(0);
  var T1 = BREATHE + painting0.frame1Time; // frame-one global time

  // ================= interaction state =================
  var bonus = 0;             // seconds added by tap layer-jumps
  var lastT = T1;            // last drawn global time
  var uIdx = -1, uStrokes = [], uCount = 0;
  var dragging = false, dragPts = [], downInfo = null;

  function currentT() { return lastT; }
  function nowMs() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now();
    return 0;
  }
  function phaseOf(t) {
    var idx = Math.floor(t / CYCLE);
    var local = t - idx * CYCLE;
    return { idx: idx, local: local };
  }

  // ================= stroke rendering =================
  // Resample a polyline to evenly spaced points so per-segment width
  // steps stay small and the ribbon reads as one tapered stroke.
  function resample(pts, step) {
    var out = [pts[0]], acc = 0;
    for (var i = 1; i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i];
      var seg = Math.sqrt(Math.pow(b[0] - a[0], 2) + Math.pow(b[1] - a[1], 2));
      var d = step - acc;
      while (d < seg) {
        var t = d / seg;
        out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
        d += step;
      }
      acc = (acc + seg) % step;
    }
    out.push(pts[pts.length - 1]);
    return out;
  }

  function drawRibbon(pts, widthU, color, alpha, frac) {
    if (frac <= 0 || pts.length < 2) return;
    var part = resample(partialPath(pts, frac), Math.max(0.0025, widthU * 0.32));
    if (part.length < 2) return;
    var s = unit();
    var total = pathLen(part);
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var acc = 0;
    for (var i = 1; i < part.length; i++) {
      var a = toPx(part[i - 1][0], part[i - 1][1]);
      var b = toPx(part[i][0], part[i][1]);
      var seg = Math.sqrt(Math.pow(part[i][0] - part[i - 1][0], 2) + Math.pow(part[i][1] - part[i - 1][1], 2));
      var mid = total > 0 ? (acc + seg / 2) / total : 0;
      var taper = 0.45 + 0.55 * Math.sin(Math.PI * Math.min(1, Math.max(0.02, mid)));
      ctx.beginPath();
      ctx.lineWidth = Math.max(1, widthU * s * taper);
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.stroke();
      acc += seg;
    }
    ctx.globalAlpha = 1;
  }

  function drawStroke(st, paintTime) {
    var f = (paintTime - st.start) / st.durN;
    if (f <= 0) return;
    if (f > 1) f = 1;
    var s = unit(), i;
    if (st.kind === 'wash') {
      var grow = 0.62 + 0.38 * f;
      ctx.beginPath();
      for (i = 0; i < st.blob.length; i++) {
        var u = st.cx + (st.blob[i][0] - st.cx) * grow;
        var v = st.cy + (st.blob[i][1] - st.cy) * grow;
        var p = toPx(u, v);
        if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
      }
      ctx.closePath();
      ctx.globalAlpha = st.alpha * (0.35 + 0.65 * f);
      ctx.fillStyle = st.color;
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (st.kind === 'ribbon') {
      for (i = 0; i < st.subs.length; i++) {
        // subpaths share the stroke's fraction sequentially by length
        drawRibbon(st.subs[i], st.width, st.color, st.alpha, f);
      }
    } else if (st.kind === 'dot') {
      var pp = toPx(st.p[0], st.p[1]);
      ctx.beginPath();
      ctx.arc(pp[0], pp[1], Math.max(0.8, st.r * s * Math.min(1, f * 1.6)), 0, Math.PI * 2);
      ctx.globalAlpha = st.alpha;
      ctx.fillStyle = st.color;
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (st.kind === 'dots') {
      var n = st.dots.length;
      for (i = 0; i < n; i++) {
        var fi = f * n - i;
        if (fi <= 0) continue;
        var d = st.dots[i], dp = toPx(d.p[0], d.p[1]);
        ctx.beginPath();
        ctx.arc(dp[0], dp[1], Math.max(0.8, d.r * s * Math.min(1, fi)), 0, Math.PI * 2);
        ctx.globalAlpha = st.alpha;
        ctx.fillStyle = st.color;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  // Where is the brush for a given stroke at fraction f?
  function brushOnStroke(st, f) {
    var i;
    if (st.kind === 'wash') {
      var a = -Math.PI / 2 + f * Math.PI * 1.6;
      // ride the blob outline point nearest that angle
      var best = st.blob[0], bd = 1e9;
      for (i = 0; i < st.blob.length; i++) {
        var ang = Math.atan2(st.blob[i][1] - st.cy, st.blob[i][0] - st.cx);
        var d = Math.abs(((ang - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
        if (d < bd) { bd = d; best = st.blob[i]; }
      }
      return { p: best, a: a + Math.PI / 2, color: st.color };
    }
    if (st.kind === 'ribbon') {
      var sub = st.subs[0];
      var pt = pointAt(sub, f);
      return { p: pt.p, a: pt.a, color: st.color };
    }
    if (st.kind === 'dot') return { p: st.p, a: -0.6, color: st.color };
    var di = Math.min(st.dots.length - 1, Math.floor(f * st.dots.length));
    return { p: st.dots[di].p, a: -0.6, color: st.color };
  }

  function drawBrush(bp, lifted, ground) {
    var s = unit();
    var p = toPx(bp.p[0], bp.p[1]);
    var lift = lifted ? 0.016 : 0.0;
    var bx = p[0] - lift * s * 0.7, by = p[1] - lift * s;
    // hand shadow: soft flat blob trailing up-left of the tip
    var shA = lifted ? 0.08 : 0.14;
    ctx.beginPath();
    ctx.ellipse(bx - 0.030 * s, by - 0.034 * s, 0.055 * s, 0.032 * s, -0.45, 0, Math.PI * 2);
    ctx.globalAlpha = shA;
    ctx.fillStyle = ground === '#14100C' ? '#000000' : '#3A362E';
    ctx.fill();
    ctx.globalAlpha = 1;
    // brush: bristle (pigment) -> ferrule -> handle stub, pointing back along -a
    var a = bp.a, dx = Math.cos(a), dy = Math.sin(a);
    var nx = -dy, ny = dx;
    function segPoly(t0, t1, w0, w1, color, alpha) {
      var x0 = bx - dx * t0 * s, y0 = by - dy * t0 * s;
      var x1 = bx - dx * t1 * s, y1 = by - dy * t1 * s;
      ctx.beginPath();
      ctx.moveTo(x0 + nx * w0 * s, y0 + ny * w0 * s);
      ctx.lineTo(x1 + nx * w1 * s, y1 + ny * w1 * s);
      ctx.lineTo(x1 - nx * w1 * s, y1 - ny * w1 * s);
      ctx.lineTo(x0 - nx * w0 * s, y0 - ny * w0 * s);
      ctx.closePath();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    segPoly(0.0, 0.038, 0.0012, 0.0105, bp.color, 0.95);  // loaded bristle tip
    segPoly(0.038, 0.060, 0.0105, 0.0098, '#9A958C', 0.95); // ferrule
    segPoly(0.060, 0.104, 0.0098, 0.0072, '#B09A7A', 0.9);  // handle hint
  }

  // ================= main draw =================
  function draw(t) {
    lastT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var ph = phaseOf(t);
    var P = getPainting(ph.idx);
    var ground = P.fam.ground;
    ctx.fillStyle = ground;
    ctx.fillRect(0, 0, W, H);
    try {
      if (typeof document !== 'undefined' && document.body && document.body.style) {
        document.body.style.background = ground;
      }
    } catch (e) {}

    if (ph.idx !== uIdx) { uIdx = ph.idx; uStrokes = []; uCount = 0; }

    var local = ph.local;
    var paintTime = local - BREATHE;
    var i;
    if (local < BREATHE) {
      // blank paper breathes: nothing but ground
    } else if (local < BREATHE + PAINT) {
      for (i = 0; i < P.strokes.length; i++) drawStroke(P.strokes[i], paintTime);
    } else {
      for (i = 0; i < P.strokes.length; i++) drawStroke(P.strokes[i], PAINT + 1);
    }

    // user strokes (part of the current painting, fade with it)
    for (i = 0; i < uStrokes.length; i++) {
      drawRibbon(uStrokes[i].pts, uStrokes[i].width, uStrokes[i].color, 0.88, 1);
    }
    if (dragging && dragPts.length > 1 && ph.idx === uIdx) {
      var dc = P.fam.pigments[uCount % P.fam.pigments.length];
      drawRibbon(smooth(dragPts, 2), 0.017, dc, 0.88, 1);
    }

    // brush
    if (local >= BREATHE && local < BREATHE + PAINT) {
      var cur = null, curF = 0, lastDone = null;
      for (i = 0; i < P.strokes.length; i++) {
        var st = P.strokes[i];
        if (paintTime >= st.start && paintTime < st.end) { cur = st; curF = (paintTime - st.start) / st.durN; }
        if (paintTime >= st.end) lastDone = st;
      }
      if (cur) {
        drawBrush(brushOnStroke(cur, curF), false, ground);
      } else if (lastDone) {
        var bp = brushOnStroke(lastDone, 1);
        drawBrush(bp, true, ground); // paused between strokes, lifted
      }
    } else if (local >= BREATHE + PAINT && local < BREATHE + PAINT + REST) {
      var last = P.strokes[P.strokes.length - 1];
      drawBrush(brushOnStroke(last, 1), true, ground);
    }

    // fade: paper-coloured overlay takes the painting back to blank
    if (local >= BREATHE + PAINT + REST) {
      var ff = (local - BREATHE - PAINT - REST) / FADE;
      ff = ff * ff * (3 - 2 * ff);
      ctx.globalAlpha = Math.max(0, Math.min(1, ff));
      ctx.fillStyle = ground;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  // ================= pointer interaction =================
  function evtPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (typeof e.clientX === 'number' ? e.clientX : 0) - r.left;
    var y = (typeof e.clientY === 'number' ? e.clientY : 0) - r.top;
    return fromPx(x, y);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true;
      dragPts = [evtPos(e)];
      downInfo = { p: dragPts[0], ms: nowMs(), moved: 0 };
      if (canvas.setPointerCapture && e.pointerId !== undefined) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      }
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var p = evtPos(e);
      var last = dragPts[dragPts.length - 1];
      var d = Math.sqrt(Math.pow(p[0] - last[0], 2) + Math.pow(p[1] - last[1], 2));
      if (downInfo) downInfo.moved += d;
      if (d > 0.004) dragPts.push(p);
      draw(lastT);
    });
    function endPointer(e) {
      if (!dragging) return;
      dragging = false;
      var ph = phaseOf(lastT);
      var P = getPainting(ph.idx);
      var isTap = downInfo && downInfo.moved < 0.010 && (nowMs() - downInfo.ms) < 350;
      if (isTap) {
        // tap: brush lifts, artist jumps to the next layer
        if (ph.local >= BREATHE && ph.local < BREATHE + PAINT) {
          var paintTime = ph.local - BREATHE;
          var bounds = [P.layerStart[1], P.layerStart[2], PAINT];
          for (var i = 0; i < bounds.length; i++) {
            if (bounds[i] > paintTime + 0.01) { bonus += bounds[i] - paintTime; break; }
          }
        }
      } else if (dragPts.length > 1) {
        if (ph.idx !== uIdx) { uIdx = ph.idx; uStrokes = []; uCount = 0; }
        uStrokes.push({
          pts: smooth(dragPts, 2),
          width: 0.017,
          color: P.fam.pigments[uCount % P.fam.pigments.length]
        });
        uCount++;
      }
      dragPts = [];
      downInfo = null;
      draw(lastT);
    }
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
  }

  // ================= playback =================
  // Frame one is drawn synchronously: painting 1 (indigo fox) with its
  // washes complete and its first four shape strokes laid, the brush
  // parked at the end of stroke four. The loop anchors from that time.
  resize();
  draw(T1);
  if (typeof requestAnimationFrame === 'function') {
    var startTs = null;
    var loop = function (ts) {
      if (startTs === null) startTs = ts;
      var elapsed = (ts - startTs) / 1000;
      draw(T1 + elapsed + bonus);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
