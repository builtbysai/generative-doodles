<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every Circle Has a Face</title>
<style>
html, body { margin: 0; padding: 0; background: #7A8B7A; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#7A8B7A';
var CREAM = '#EDE6D0';
var TAN = '#C9B98F';
var RUST = '#A05A3A';
var CHARCOAL = '#2E2E2E';
var FILLS = [CREAM, TAN, RUST, CHARCOAL];
// Character types: 0 face (two-dot eyes), 1 ring, 2 hatching, 3 dot cluster.
// Squares are a shape, not a character: a square still carries one of 0-3.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var seed = 1571;
var swapStart = 0;
var circles = [];
var blob = [];
var placedW = 0, placedH = 0;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Deterministic hash to [0,1): pure function of its integer inputs.
function hash01(a, b, c) {
  var x = ((a * 374761393) ^ (b * 668265263) ^ (c * 2246822519)) >>> 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;
  x = x ^ (x >>> 16);
  return (x >>> 0) / 4294967296;
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;

    vw = window.innerWidth; vh = window.innerHeight;

  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';

function isPhone() {
  if (typeof window !== 'undefined' && window.screen && window.screen.width && window.screen.height) {
    if (Math.min(window.screen.width, window.screen.height) < 700) return true;
  }
  return VH > VW * 1.15;
}
// Organic central void: a union of circles, ~25% of the frame area.
function buildBlob() {
  var cx = VW / 2, cy = VH / 2;
  var R = Math.sqrt(0.25 * VW * VH / Math.PI);
  blob = [{ x: cx, y: cy, r: R }];
  var i, a;
  for (i = 0; i < 6; i++) {
    a = i * TAU / 6 + 0.26;
    blob.push({ x: cx + Math.cos(a) * R * 0.72, y: cy + Math.sin(a) * R * 0.72, r: R * 0.42 });

  blob.push({ x: cx - R * 0.35, y: cy + R * 0.45, r: R * 0.30 });
  blob.push({ x: cx + R * 0.40, y: cy - R * 0.42, r: R * 0.28 });
}
function insideBlob(x, y, pad) {
  for (var i = 0; i < blob.length; i++) {
    var dx = x - blob[i].x, dy = y - blob[i].y;
    if (dx * dx + dy * dy < (blob[i].r + pad) * (blob[i].r + pad)) return true;

  return false;
}
// Circle packing via rejection sampling from the seeded PRNG.
function place() {
  buildBlob();
  var rnd = mulberry32(seed);
  var u = Math.min(VW, VH) / 900;
  var gap = 2 * u;
  var placed = [];
  var attempts = 0, maxAttempts = 60000, maxCircles = 520;
  while (placed.length < maxCircles && attempts < maxAttempts) {
    attempts++;
    var roll = rnd();
    var r;
    if (roll < 0.60) r = (9 + rnd() * 6) * u;
    else if (roll < 0.85) r = (16 + rnd() * 10) * u;
    else if (roll < 0.97) r = (27 + rnd() * 13) * u;
    else r = (41 + rnd() * 11) * u;
    var x = rnd() * VW, y = rnd() * VH;
    if (insideBlob(x, y, r + gap)) continue;
    var ok = true;
    for (var i = 0; i < placed.length; i++) {
      var dx = x - placed[i].x, dy = y - placed[i].y;
      var rr = r + placed[i].r + gap;
      if (dx * dx + dy * dy < rr * rr) { ok = false; break; }
    }
    if (!ok) continue;
    var fill = FILLS[Math.floor(rnd() * FILLS.length)];
    var decor = (fill === CREAM || fill === TAN) ? CHARCOAL : CREAM;
    var isSquare = rnd() < 0.06;

      x: x, y: y, r: r, fill: fill, decor: decor,
      ch: Math.floor(rnd() * 4),
      square: isSquare,
      rot: rnd() * TAU,
      phase: rnd() * TAU,
      hatchAng: rnd() * Math.PI

  var fillAttempts = 0, fillMax = 60000, fillCap = 340;
  while (fillCap > 0 && fillAttempts < fillMax) {
    fillAttempts++;
    var fr = (4.5 + rnd() * 5) * u;
    var fx = rnd() * VW, fy = rnd() * VH;
    if (insideBlob(fx, fy, fr + gap)) continue;
    var fok = true;
    for (var j = 0; j < placed.length; j++) {
      var fdx = fx - placed[j].x, fdy = fy - placed[j].y;
      var frr = fr + placed[j].r + gap;
      if (fdx * fdx + fdy * fdy < frr * frr) { fok = false; break; }
    }
    if (!fok) continue;
    var ffill = FILLS[Math.floor(rnd() * FILLS.length)];
    var fdecor = (ffill === CREAM || ffill === TAN) ? CHARCOAL : CREAM;
    placed.push({
      x: fx, y: fy, r: fr, fill: ffill, decor: fdecor,
      ch: Math.floor(rnd() * 4),
      square: rnd() < 0.05,
      rot: rnd() * TAU,
      phase: rnd() * TAU,
      hatchAng: rnd() * Math.PI

  placedW = VW; placedH = VH;

// Swap schedule: epoch k starts at swapStart + 6k seconds. Epoch 0 swaps
// nothing, so frame one is the original crowd. Later epochs swap 6 circles,
// chosen deterministically from (seed, epoch). Pure function of time + seed.
function swapMap(t) {
  var epoch = Math.floor((t - swapStart) / 6);
  var map = {};
  if (epoch <= 0 || circles.length === 0) return map;
  for (var j = 0; j < 6; j++) {
    var idx = Math.floor(hash01(seed, epoch, j * 2 + 1) * circles.length);
    var nc = Math.floor(hash01(seed, epoch, j * 2 + 2) * 4);
    if (nc === circles[idx].ch) nc = (nc + 1) % 4;
    map[idx] = nc;
  }
  return map;
}
function drawCircleChar(c, ch) {
  var r = c.r;
  ctx.strokeStyle = c.decor;
  ctx.fillStyle = c.decor;
  if (ch === 0) {
    // Face: two dots only. Pareidolia, not illustration.
    var ex = r * 0.35, ey = -r * 0.10, er = Math.max(1.2, r * 0.11);
    ctx.beginPath(); ctx.moveTo(c.x - ex + er, c.y + ey); ctx.arc(c.x - ex, c.y + ey, er, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(c.x + ex + er, c.y + ey); ctx.arc(c.x + ex, c.y + ey, er, 0, TAU); ctx.fill();
  } else if (ch === 1) {
    ctx.lineWidth = Math.max(1.2, r * 0.09);
    ctx.beginPath(); ctx.moveTo(c.x + r * 0.55, c.y); ctx.arc(c.x, c.y, r * 0.55, 0, TAU); ctx.stroke();
  } else if (ch === 2) {
    ctx.save();
    ctx.beginPath(); ctx.moveTo(c.x + r, c.y); ctx.arc(c.x, c.y, r * 0.92, 0, TAU); ctx.clip();
    ctx.lineWidth = Math.max(1, r * 0.07);
    var step = r * 0.38, ca = Math.cos(c.hatchAng), sa = Math.sin(c.hatchAng);
    var k;
    for (k = -3; k <= 3; k++) {
      var off = k * step;
      var px = -ca * off, py = -sa * off;
      ctx.beginPath();
      ctx.moveTo(c.x + px - sa * r, c.y + py + ca * r);
      ctx.lineTo(c.x + px + sa * r, c.y + py - ca * r);
      ctx.stroke();
    }
    ctx.restore();
  } else {
    var dr = Math.max(1.2, r * 0.10);
    var offs = [[-0.3, -0.3], [0.3, -0.25], [-0.05, 0.15], [0.35, 0.3]];
    for (var i = 0; i < offs.length; i++) {
      ctx.beginPath();
      ctx.moveTo(c.x + offs[i][0] * r + dr, c.y + offs[i][1] * r);
      ctx.arc(c.x + offs[i][0] * r, c.y + offs[i][1] * r, dr, 0, TAU);
      ctx.fill();
    }
  }
}
function drawSquareChar(c, ch) {
  // A square that refused to be a circle: same character language, squared.
  var s = c.r * 1.55, half = s / 2;
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(c.rot);
  ctx.fillStyle = c.fill;
  ctx.fillRect(-half, -half, s, s);
  ctx.fillStyle = c.decor;
  ctx.strokeStyle = c.decor;
  if (ch === 0) {
    var ex = half * 0.5, ey = -half * 0.12, er = Math.max(1.2, half * 0.14);
    ctx.beginPath(); ctx.moveTo(-ex + er, ey); ctx.arc(-ex, ey, er, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(ex + er, ey); ctx.arc(ex, ey, er, 0, TAU); ctx.fill();
  } else if (ch === 1) {
    ctx.lineWidth = Math.max(1.2, half * 0.10);
    ctx.strokeRect(-half * 0.55, -half * 0.55, half * 1.1, half * 1.1);
  } else if (ch === 2) {
    ctx.lineWidth = Math.max(1, half * 0.09);
    var k;
    for (k = -1; k <= 1; k++) {
      var yy = k * half * 0.45;
      ctx.beginPath();
      ctx.moveTo(-half * 0.8, yy);
      ctx.lineTo(half * 0.8, yy);
      ctx.stroke();
    }
  } else {
    var dr = Math.max(1.2, half * 0.12);
    var offs = [[-0.4, -0.4], [0.4, -0.35], [-0.1, 0.2], [0.45, 0.4]];
    for (var i = 0; i < offs.length; i++) {
      ctx.beginPath();
      ctx.moveTo(offs[i][0] * half + dr, offs[i][1] * half);
      ctx.arc(offs[i][0] * half, offs[i][1] * half, dr, 0, TAU);
      ctx.fill();
    }
  }
  ctx.restore();
}
// Symmetric fern: mirrored recursive branch strokes in the same line language.
function fernBranch(x, y, ang, len, depth, lw) {
  var nx = x + Math.cos(ang) * len, ny = y + Math.sin(ang) * len;
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(nx, ny);
  ctx.stroke();
  if (depth <= 0) {
    var dr = Math.max(1.2, lw * 1.1);
    ctx.fillStyle = CREAM;
    ctx.beginPath(); ctx.moveTo(nx + dr, ny); ctx.arc(nx, ny, dr, 0, TAU); ctx.fill();
    return;
  }
  var spread = 0.55;
  fernBranch(nx, ny, ang - spread, len * 0.72, depth - 1, Math.max(0.8, lw * 0.72));
  fernBranch(nx, ny, ang + spread, len * 0.72, depth - 1, Math.max(0.8, lw * 0.72));

function drawFern() {
  var cx = VW / 2, cy = VH / 2;
  var R = blob.length ? blob[0].r : Math.sqrt(0.25 * VW * VH / Math.PI);
  var baseY = cy + R * 0.62;
  var stemLen = R * 1.18;
  var u = Math.min(VW, VH) / 900;
  ctx.strokeStyle = CHARCOAL;
  ctx.fillStyle = CHARCOAL;
  ctx.lineCap = 'round';
  // Central stem.
  ctx.lineWidth = Math.max(1.5, 3.2 * u);
  ctx.beginPath();
  ctx.moveTo(cx, baseY);
  ctx.lineTo(cx, baseY - stemLen);
  ctx.stroke();

  // tip, each a recursive branch, so the silhouette reads as a fern frond.
  var levels = 6, li;
  for (li = 0; li < levels; li++) {
    var f = li / (levels - 1); // 0 base, 1 tip
    var py = baseY - stemLen * (0.12 + 0.80 * f);
    var plen = R * (0.38 - 0.24 * f);
    var pang = 0.62 + 0.35 * f;
    fernBranch(cx, py, -Math.PI / 2 - pang, plen, 3, Math.max(1, 2.2 * u * (1 - 0.5 * f)));
    fernBranch(cx, py, -Math.PI / 2 + pang, plen, 3, Math.max(1, 2.2 * u * (1 - 0.5 * f)));

  fernBranch(tipX, tipY, -Math.PI / 2 - 0.45, R * 0.18, 3, Math.max(1, 1.8 * u));

function draw(t) {

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var swaps = swapMap(t);
  for (var i = 0; i < circles.length; i++) {
    var c = circles[i];
    var ch = (swaps[i] !== undefined) ? swaps[i] : c.ch;
    // Slow internal shimmer: gentle alpha breathing, pure function of t.
    var a = 0.93 + 0.07 * Math.sin(t * 0.5 + c.phase);
    ctx.globalAlpha = Number(a.toFixed(4));
    if (c.square) {
      drawSquareChar(c, ch);

      ctx.fillStyle = c.fill;
      ctx.beginPath(); ctx.moveTo(c.x + c.r, c.y); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.fill();
      drawCircleChar(c, ch);

    ctx.globalAlpha = 1;
  }
  drawFern();
  // Caption: title, formula date, tap hint. Cream chip, charcoal text.
  var fs = Math.max(9, Math.round(minDim * 0.016));
  var label = 'Every Circle Has a Face  ·  2006 · 05 · 01  ·  Tap for a new crowd.';
  ctx.font = fs + 'px sans-serif';
  var tw = ctx.measureText(label).width;
  var pad = Math.round(fs * 0.7);
  var bx = Math.round(fs * 0.8), by = Math.round(VH - fs * 0.8 - (fs + 2 * pad));
  ctx.fillStyle = CREAM;
  ctx.fillRect(bx - pad, by, Math.ceil(tw) + 2 * pad, fs + 2 * pad);

      t: t, seed: seed, circles: circles.length,

      voidR: blob.length ? blob[0].r : 0, phone: phone,

var downX = 0, downY = 0;
function onDown(e) { downX = e.clientX; downY = e.clientY; }

  place();

if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointerup', onUp);

function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;

if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
