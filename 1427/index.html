<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seven Deadly Accidents in the Household</title>
<style>
html,body{margin:0;padding:0;background:#e8e2d4;overflow:hidden}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var W=0,H=0,nowT=0;

// ---------- seeded PRNG (mulberry32), never Math.random ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rng=mulberry32(1427000);
// wall speckles, precomputed fractions
var speckles=[];
for(var i=0;i<140;i++){speckles.push([rng(),rng()*0.68]);}
// rug stripes, precomputed
var rugStripes=[];
for(var j=0;j<9;j++){rugStripes.push(rng());}
// mirror crack jag, precomputed offsets (fractions of mirror height)
var crackPts=[];
for(var k=0;k<8;k++){crackPts.push([(rng()-0.5)*0.06,(rng()-0.5)*0.02]);}

// ---------- helpers ----------
function a4(v){var r=Math.round(v*10000)/10000;return r<0?0:(r>1?1:r);}
function sstep(x){x=x<0?0:(x>1?1:x);return x*x*(3-2*x);}
function clamp(x,a,b){return x<a?a:(x>b?b:x);}
function dot(x,y,r,color){ctx.fillStyle=color;ctx.fillRect(x-r,y-r,r*2,r*2);}
function circ(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h);}
function line(x1,y1,x2,y2,color,wd){ctx.strokeStyle=color;ctx.lineWidth=wd;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function poly(pts,color,wd,fill){
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++){ctx.lineTo(pts[i][0],pts[i][1]);}
  if(fill){ctx.fillStyle=color;ctx.fill();}else{ctx.strokeStyle=color;ctx.lineWidth=wd;ctx.stroke();}
}

// ---------- palette ----------
var PAPER='#e8e2d4',WOOD='#8a6a44',LAMPW='#f2c879',STEEL='#8a8f94',
    CRACKW='#f2efe8',RED='#b01e24',FLOOR='#b8b2a2',WALLD='#d8d2c2';

// ---------- accident schedule (seconds) ----------
var SCHED={lamp:6,kettle:18,mirror:30,chair:42,rug:54,window:66,table:78};
var DUR=2.5;
var events=[]; // {kind:'trig'|'mod',obj,t,d}
function trigTime(obj,t){
  var tr=SCHED[obj];
  for(var i=0;i<events.length;i++){var e=events[i];if(e.kind==='trig'&&e.obj===obj&&e.t<=t&&e.t<tr){tr=e.t;}}
  return tr;
}
function modVal(obj,t){
  var m=0;
  for(var i=0;i<events.length;i++){var e=events[i];if(e.kind==='mod'&&e.obj===obj&&e.t<=t){m+=e.d;}}
  return m>1?1:m;
}
function dmg(obj,t){
  var tr=trigTime(obj,t);
  if(t<tr){return 0;}
  return sstep((t-tr)/DUR);
}

// ---------- layout / hit boxes ----------
var boxes={};
function layout(){
  boxes={
    mirror:[0.04*W,0.09*H,0.22*W,0.47*H],
    window:[0.69*W,0.07*H,0.94*W,0.51*H],
    rug:[0.20*W,0.79*H,0.70*W,0.95*H],
    table:[0.28*W,0.54*H,0.62*W,0.86*H],
    lamp:[0.31*W,0.40*H,0.43*W,0.58*H],
    kettle:[0.50*W,0.47*H,0.59*W,0.58*H],
    chair:[0.62*W,0.32*H,0.82*W,0.86*H]
  };
}
function hit(x,y){
  var order=['lamp','kettle','chair','mirror','window','rug','table'];
  for(var i=0;i<order.length;i++){
    var b=boxes[order[i]];
    if(x>=b[0]&&x<=b[2]&&y>=b[1]&&y<=b[3]){return order[i];}
  }
  return null;
}

// ---------- pointer: drag triggers early, drag on broken object modulates ----------
var dragObj=null,lastX=0,lastY=0;
canvas.addEventListener('pointerdown',function(e){
  var x=e.clientX,y=e.clientY,o=hit(x,y);
  if(!o){return;}
  dragObj=o;lastX=x;lastY=y;
  if(dmg(o,nowT)<=0&&nowT<SCHED[o]){events.push({kind:'trig',obj:o,t:nowT});}
});
canvas.addEventListener('pointermove',function(e){
  if(!dragObj){return;}
  var x=e.clientX,y=e.clientY;
  var dist=Math.sqrt((x-lastX)*(x-lastX)+(y-lastY)*(y-lastY));
  lastX=x;lastY=y;
  if(dmg(dragObj,nowT)>0){events.push({kind:'mod',obj:dragObj,t:nowT,d:dist/400});}
});
canvas.addEventListener('pointerup',function(){dragObj=null;});
canvas.addEventListener('pointercancel',function(){dragObj=null;});

// ---------- draw ----------
function draw(t){
  nowT=t;
  if(!W||!H){return;}
  var wallH=0.70*H;
  // wall + floor
  rect(0,0,W,wallH,PAPER);
  rect(0,wallH,W,H-wallH,FLOOR);
  line(0,wallH,W,wallH,WALLD,2);
  // speckles
  ctx.fillStyle='#000000';
  for(var s=0;s<speckles.length;s++){
    ctx.globalAlpha=a4(0.05);
    ctx.fillRect(speckles[s][0]*W,speckles[s][1]*H,2,2);
  }
  ctx.globalAlpha=1;

  drawWindow(t);
  drawMirror(t);
  drawRug(t);
  drawTable(t);
  drawChair(t);
}

function drawWindow(t){
  var b=boxes.window;
  var x0=b[0],y0=b[1],x1=b[2],y1=b[3];
  var d=dmg('window',t),m=modVal('window',t);
  rect(x0,y0,x1-x0,y1-y0,WOOD);
  var pad=Math.max(6,0.012*W);
  rect(x0+pad,y0+pad,x1-x0-2*pad,y1-y0-2*pad,CRACKW);
  var mx=(x0+x1)/2,my=(y0+y1)/2;
  rect(mx-3,y0+pad,6,y1-y0-2*pad,WOOD);
  rect(x0+pad,my-3,x1-x0-2*pad,6,WOOD);
  // fog: flat alpha fill, never a gradient
  if(d>0){
    ctx.fillStyle='rgba(232,226,212,'+a4(0.55*d+0.25*m)+')';
    ctx.fillRect(x0+pad,y0+pad,x1-x0-2*pad,y1-y0-2*pad);
    // two drip streaks in the fog
    ctx.fillStyle='rgba(242,239,232,'+a4(0.5*d)+')';
    ctx.fillRect(x0+pad+0.25*(x1-x0-2*pad),y0+pad,3,0.4*(y1-y0-2*pad)*d);
    ctx.fillRect(x0+pad+0.6*(x1-x0-2*pad),y0+pad,3,0.3*(y1-y0-2*pad)*d);
    dot((x0+x1)/2,y1+10,4,RED); // one red accent: dot on the sill
  }
}

function drawMirror(t){
  var b=boxes.mirror;
  var x0=b[0],y0=b[1],x1=b[2],y1=b[3];
  var d=dmg('mirror',t),m=modVal('mirror',t);
  rect(x0,y0,x1-x0,y1-y0,WOOD);
  var pad=Math.max(5,0.010*W);
  rect(x0+pad,y0+pad,x1-x0-2*pad,y1-y0-2*pad,STEEL);
  if(d>0){
    // crack: one clean jagged line, revealed progressively
    var cx=(x0+x1)/2,top=y0+pad+4,bot=y1-pad-4;
    var pts=[];
    for(var i=0;i<=8;i++){
      var f=i/8,cp=crackPts[i<8?i:7];
      pts.push([cx+cp[0]*W,top+f*(bot-top)+cp[1]*H]);
    }
    var segs=Math.floor(d*8);
    ctx.strokeStyle=CRACKW;ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(pts[0][0],pts[0][1]);
    for(var j=1;j<=segs&&j<pts.length;j++){ctx.lineTo(pts[j][0],pts[j][1]);}
    ctx.stroke();
    // modulation lengthens the crack past its end
    if(m>0){
      var last=pts[pts.length-1],prev=pts[pts.length-2];
      var dx=last[0]-prev[0],dy=last[1]-prev[1];
      var len=Math.sqrt(dx*dx+dy*dy)||1;
      ctx.beginPath();ctx.moveTo(last[0],last[1]);
      ctx.lineTo(last[0]+dx/len*m*0.05*H,last[1]+dy/len*m*0.05*H);ctx.stroke();
    }
    dot(cx,top,4,RED); // one red accent: dot at the crack origin
  }
}

function drawRug(t){
  var b=boxes.rug;
  var d=dmg('rug',t),m=modVal('rug',t);
  var slide=d*(0.03*W+m*0.05*W);
  var x0=b[0]+slide,y0=b[1],x1=b[2]+slide,y1=b[3];
  rect(x0,y0,x1-x0,y1-y0,'#a89a80');
  rect(x0+6,y0+6,x1-x0-12,y1-y0-12,PAPER);
  // seeded stripes
  for(var i=0;i<rugStripes.length;i++){
    var sx=x0+12+rugStripes[i]*(x1-x0-24);
    line(sx,y0+10,sx,y1-10,i%2?WOOD:FLOOR,2);
  }
  // wrinkle fold when slid
  if(d>0.5){
    line(x0+14,y0+8,x0+14,y1-8,'#8a7a5c',3);
    dot(x1-8,(y0+y1)/2,4,RED); // one red accent: tassel at the corner
  }
}

function drawTable(t){
  var b=boxes.table;
  var d=dmg('table',t),m=modVal('table',t);
  var cx=(b[0]+b[2])/2,feetY=b[3];
  var tilt=Math.sin(2*Math.PI*t/3.2)*(0.012*d+0.008*m);
  ctx.save();
  ctx.translate(cx,feetY);
  ctx.rotate(tilt);
  ctx.translate(-cx,-feetY);
  var topY=0.56*H,topH=0.025*H;
  rect(b[0],topY,b[2]-b[0],topH,WOOD);
  var lw=Math.max(6,0.012*W);
  rect(b[0]+0.03*W,topY+topH,lw,feetY-(topY+topH),WOOD);
  rect(b[2]-0.03*W-lw,topY+topH,lw,feetY-(topY+topH),WOOD);
  // lamp + kettle sit on the table, drawn inside the same tilt
  drawLamp(t);
  drawKettle(t);
  ctx.restore();
  if(d>0){
    dot(b[2]-0.03*W-lw/2,feetY+4,4,RED); // one red accent: wedge under the short leg
  }
}

function drawLamp(t){
  var d=dmg('lamp',t),m=modVal('lamp',t);
  var baseX=0.355*W,baseY=0.56*H;
  var ang=d*(0.55+m*0.35); // tips left as damage grows
  // glow: flat alpha ellipse under the shade, never a gradient
  ctx.fillStyle='rgba(242,200,121,'+a4(0.14+0.03*Math.sin(2*Math.PI*t/6))+')';
  ctx.beginPath();ctx.ellipse(baseX,baseY-0.02*H,0.055*W,0.02*H,0,0,Math.PI*2);ctx.fill();
  ctx.save();
  ctx.translate(baseX,baseY);
  ctx.rotate(-ang);
  // stem
  line(0,0,0,-0.13*H,'#26241f',4);
  // shade: trapezoid
  poly([[-0.035*W,-0.16*H],[0.035*W,-0.16*H],[0.022*W,-0.10*H],[-0.022*W,-0.10*H]],LAMPW,0,true);
  // base
  ctx.beginPath();ctx.ellipse(0,0,0.028*W,0.008*H,0,0,Math.PI*2);ctx.fillStyle='#26241f';ctx.fill();
  ctx.restore();
  if(d>0){
    // spilled light: small red triangle on the table to the tipped side
    var tw=(10+m*20)*(W/1000);
    poly([[baseX-0.01*W,baseY],[baseX-0.01*W-tw,baseY],[baseX-0.01*W,baseY-6]],RED,0,true);
  }
}

function drawKettle(t){
  var d=dmg('kettle',t),m=modVal('kettle',t);
  var kx=0.545*W,ky=0.56*H; // kettle sits on table top
  var bw=0.05*W,bh=0.055*H;
  // boil-over puddle
  if(d>0){
    ctx.fillStyle='#a8a294';
    ctx.beginPath();ctx.ellipse(kx,ky+2,(bw*0.7)*(1+m*0.5)*d,bh*0.22*d,0,0,Math.PI*2);ctx.fill();
  }
  // body
  poly([[kx-bw/2,ky],[kx-bw/2,ky-bh*0.7],[kx-bw*0.35,ky-bh],[kx+bw*0.35,ky-bh],[kx+bw/2,ky-bh*0.7],[kx+bw/2,ky]],STEEL,0,true);
  // lid + handle + spout
  ctx.beginPath();ctx.ellipse(kx,ky-bh,0.02*W,0.006*H,0,0,Math.PI*2);ctx.fillStyle='#26241f';ctx.fill();
  line(kx+bw/2,ky-bh*0.6,kx+bw/2+0.018*W,ky-bh*0.85,STEEL,4);
  poly([[kx-bw/2,ky-bh*0.55],[kx-bw/2-0.02*W,ky-bh*0.75],[kx-bw/2,ky-bh*0.4]],STEEL,0,true);
  // steam puffs after the boil, periodic
  if(d>0){
    for(var i=0;i<3;i++){
      var ph=((t*0.5+i/3)%1+1)%1;
      var px=kx-bw/2-0.01*W+Math.sin(ph*9+i)*4;
      var py=ky-bh*0.9-ph*0.08*H;
      ctx.fillStyle='rgba(242,239,232,'+a4(0.35*(1-ph)*d)+')';
      ctx.beginPath();ctx.arc(px,py,4+ph*6,0,Math.PI*2);ctx.fill();
    }
    dot(kx,ky-bh*0.5,4,RED); // one red accent: boiling indicator on the body
  }
}

function drawChair(t){
  var b=boxes.chair;
  var d=dmg('chair',t),m=modVal('chair',t);
  var seatY=0.62*H,feetY=0.86*H;
  var cx=(b[0]+b[2])/2;
  ctx.save();
  ctx.translate(cx,seatY);
  ctx.rotate(d*(0.03+m*0.03));
  ctx.translate(-cx,-seatY);
  var lw=Math.max(6,0.012*W);
  // back
  rect(b[0],0.34*H,lw,seatY-0.34*H,WOOD);
  rect(b[2]-lw,0.34*H,lw,seatY-0.34*H,WOOD);
  rect(b[0],0.34*H,b[2]-b[0],0.02*H,WOOD);
  // mid-back slat so the back reads as a chair, not an empty frame
  rect(b[0],0.47*H,b[2]-b[0],0.015*H,WOOD);
  // seat
  rect(b[0],seatY,b[2]-b[0],0.02*H,WOOD);
  // fixed legs
  rect(b[0]+0.01*W,seatY+0.02*H,lw,feetY-(seatY+0.02*H),WOOD);
  rect(b[0]+0.10*W,seatY+0.02*H,lw,feetY-(seatY+0.02*H),WOOD);
  rect(b[2]-0.10*W-lw,seatY+0.02*H,lw,feetY-(seatY+0.02*H),WOOD);
  // detachable leg: slides out and lies on the floor as damage grows
  var legX=b[2]-0.01*W-lw,legTop=seatY+0.02*H,legLen=feetY-legTop;
  ctx.save();
  ctx.translate(legX+lw/2,legTop);
  ctx.rotate(d*Math.PI/2*0.9);
  ctx.translate(d*0.05*W,0);
  rect(-lw/2,0,lw,legLen,WOOD);
  ctx.restore();
  ctx.restore();
  if(d>0){
    dot(b[2]-0.01*W-lw/2,seatY+0.02*H+4,4,RED); // one red accent: dot at the leg socket
  }
}

// ---------- sizing ----------
function resize(){
  var vw=(typeof window!=='undefined'&&window.visualViewport)?window.visualViewport.width:window.innerWidth;
  var vh=(typeof window!=='undefined'&&window.visualViewport)?window.visualViewport.height:window.innerHeight;
  W=Math.floor(vw);H=Math.floor(vh);
  canvas.width=W;canvas.height=H;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  layout();
}
if(typeof window!=='undefined'){
  if(window.visualViewport&&window.visualViewport.addEventListener){window.visualViewport.addEventListener('resize',resize);}
  window.addEventListener('resize',resize);
}
resize();

// ---------- boot: frame one = draw(0), clock starts with the rAF loop ----------
draw(0);
var startTime=null;
function loop(ts){
  if(startTime===null){startTime=ts;}
  var t=(ts-startTime)/1000;
  draw(t);
  if(typeof requestAnimationFrame!=='undefined'){requestAnimationFrame(loop);}
}
if(typeof requestAnimationFrame!=='undefined'){requestAnimationFrame(loop);}
})();
</script>
</body>
</html>
