<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture Is the Sounding Body</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #17171a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  .hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 12px/1.4 system-ui, -apple-system, sans-serif; letter-spacing: 0.14em;
    color: #c9c9c9; pointer-events: none; user-select: none; white-space: nowrap;
    background: rgba(18, 18, 20, 0.45); padding: 4px 12px; border-radius: 999px;
  }
  .sound {
    position: fixed; right: 14px; top: 14px; z-index: 2;
    font: 11px/1.4 system-ui, -apple-system, sans-serif; letter-spacing: 0.14em;
    color: #d8d8d8; background: rgba(18, 18, 20, 0.55); border: 1px solid rgba(255,255,255,0.25);
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">WATCH ONLY &middot; ROOMS CHANGE EVERY 45 SECONDS</div>
<button class="sound" id="sound" type="button">SOUND OFF</button>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG, fixed seed: frame one is fully deterministic.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1826);

  var reduced = false;
  try {
    reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) { reduced = false; }

  function alpha(v) {
    var a = Math.round(v * 10000) / 10000;
    if (a < 0) a = 0;
    if (a > 1) a = 1;
    return a;
  }

  // Room cycle: 45 s per room, 5 s crossfade at each block start.
  var ROOM_LEN = 45;
  var FADE = 5;
  function roomIndex(t) { return Math.floor(t / ROOM_LEN) % 3; }
  function roomLocal(t) { return t % ROOM_LEN; }
  function ease(u) { if (u < 0) u = 0; if (u > 1) u = 1; return u * u * (3 - 2 * u); }

  // Shiver follows the convolver wet level: church longest and wettest,
  // rotunda round and soft, hall hard and quick.
  var ROOMS = [
    { name: 'I · ROTUNDA', label: '#e8e8ea', wet: 0.5, amp: 0.7, freq: 0.6,
      dur: 1.2, decay: 3.0, lp: 0.25, taps: false },
    { name: 'II · CHURCH', label: '#e8c878', wet: 0.8, amp: 1.8, freq: 1.1,
      dur: 3.6, decay: 1.1, lp: 0.6, taps: false },
    { name: 'III · HALL', label: '#f07d2a', wet: 0.35, amp: 1.1, freq: 2.6,
      dur: 1.8, decay: 2.2, lp: 0.4, taps: true }
  ];

  // Seeded string layouts, one set per room.
  var ROT_STRINGS = [];
  for (var i = 0; i < 14; i++) {
    ROT_STRINGS.push({
      y: 0.020 + i * 0.0115, sag: 0.004 + rnd() * 0.006,
      ph: rnd() * Math.PI * 2, jit: (rnd() - 0.5) * 0.008
    });
  }
  var CH_STRINGS = [];
  for (var j = 0; j < 12; j++) {
    CH_STRINGS.push({
      x: 0.075 + j * 0.070 + rnd() * 0.012, top: 0.045 + rnd() * 0.025,
      ph: rnd() * Math.PI * 2
    });
  }
  var HALL_STRINGS = [];
  for (var k = 0; k < 10; k++) {
    var toCase = (k % 3 === 2);
    HALL_STRINGS.push({
      x0: 0.10 + k * 0.080, y0: 0.095 + (k % 2) * 0.028,
      // Case-anchored strings land on real case tops: the two-high
      // stacks at the left (x 0.035-0.14) and right (x 0.86-0.965).
      x1: toCase
        ? ((k % 6 === 2) ? 0.07 + rnd() * 0.05 : 0.88 + rnd() * 0.05)
        : 0.08 + k * 0.086 + (rnd() - 0.5) * 0.03,
      toCase: toCase, ph: rnd() * Math.PI * 2
    });
  }

  // A string drawn as a segmented line whose middle shivers; ends pinned.
  function shiverLine(x0, y0, x1, y1, amp, freq, phase, t, sagPx) {
    var dx = x1 - x0, dy = y1 - y0;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < 1) return;
    var nx = -dy / len, ny = dx / len;
    var N = 14;
    ctx.beginPath();
    for (var s = 0; s <= N; s++) {
      var u = s / N;
      var off = amp * Math.sin(phase + u * 2.4 + t * freq * Math.PI * 2) * Math.sin(Math.PI * u);
      var px = x0 + dx * u + nx * off;
      var py = y0 + dy * u + ny * off + (sagPx || 0) * Math.sin(Math.PI * u);
      if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }

  function dot(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawRotunda(g, t) {
    var rx = g.rx, ry = g.ry, rw = g.rw, rh = g.rh, floorY = g.floorY, cx = g.cx;
    // Concrete wall, darker toward the floor.
    var wall = ctx.createLinearGradient(0, ry, 0, floorY);
    wall.addColorStop(0, '#8f9296');
    wall.addColorStop(1, '#6e7175');
    ctx.fillStyle = wall;
    ctx.fillRect(rx, ry, rw, floorY - ry);
    // Dome: a wide shallow ellipse over the wall, with two inner rings.
    // A true semicircle would be taller than this wide room, so the dome
    // is elliptical; the oculus sits at its apex.
    var domeCY = floorY - rh * 0.02;
    var domeRX = rw * 0.52, domeRY = rh * 0.45;
    var domeTop = domeCY - domeRY;
    ctx.save();
    ctx.translate(g.pan * 0.5, 0);
    ctx.strokeStyle = 'rgba(40,40,44,' + alpha(0.35) + ')';
    ctx.lineWidth = Math.max(1, rw * 0.002);
    ctx.beginPath();
    ctx.moveTo(cx - domeRX, domeCY);
    ctx.ellipse(cx, domeCY, domeRX, domeRY, 0, Math.PI, 0);
    ctx.stroke();
    for (var ring = 1; ring <= 2; ring++) {
      var rf = 1 - ring * 0.3;
      ctx.strokeStyle = 'rgba(40,40,44,' + alpha(0.16) + ')';
      ctx.beginPath();
      ctx.moveTo(cx - domeRX * rf, domeCY);
      ctx.ellipse(cx, domeCY, domeRX * rf, domeRY * rf, 0, Math.PI, 0);
      ctx.stroke();
    }
    // Oculus: bright opening at the dome apex, light shaft falling.
    ctx.beginPath();
    ctx.moveTo(cx + rw * 0.028, domeTop + rh * 0.01);
    ctx.ellipse(cx, domeTop + rh * 0.01, rw * 0.028, rh * 0.018, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#f2ead6';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - rw * 0.020, domeTop + rh * 0.03);
    ctx.lineTo(cx + rw * 0.020, domeTop + rh * 0.03);
    ctx.lineTo(cx + rw * 0.055, floorY);
    ctx.lineTo(cx - rw * 0.055, floorY);
    ctx.closePath();
    ctx.fillStyle = 'rgba(242,234,214,' + alpha(0.08) + ')';
    ctx.fill();
    // Pilasters: vertical seams down the curved wall.
    ctx.fillStyle = 'rgba(40,40,44,' + alpha(0.14) + ')';
    var pxs = [0.16, 0.32, 0.68, 0.84];
    for (var p = 0; p < pxs.length; p++) {
      ctx.fillRect(rx + rw * pxs[p], ry + rh * 0.10, Math.max(1, rw * 0.004), floorY - ry - rh * 0.10);
    }
    ctx.restore();
    // Floor: darker concrete with perspective seams fanning from the vanishing point.
    var fl = ctx.createLinearGradient(0, floorY, 0, ry + rh);
    fl.addColorStop(0, '#4c4e52');
    fl.addColorStop(1, '#333538');
    ctx.fillStyle = fl;
    ctx.fillRect(rx, floorY, rw, ry + rh - floorY);
    ctx.strokeStyle = 'rgba(0,0,0,' + alpha(0.16) + ')';
    ctx.lineWidth = 1;
    for (var f = 0; f <= 8; f++) {
      var bx = rx + (f / 8) * rw;
      ctx.beginPath();
      ctx.moveTo(cx, floorY);
      ctx.lineTo(bx, ry + rh);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,' + alpha(0.22) + ')';
    ctx.fillRect(rx, floorY - 1, rw, 1);
    // Strings low across the floor, anchored to two rails.
    ctx.save();
    ctx.translate(g.pan, 0);
    ctx.strokeStyle = '#2b2b2e';
    ctx.lineWidth = Math.max(2, rw * 0.003);
    ctx.beginPath();
    ctx.moveTo(rx + rw * 0.03, floorY - rh * 0.005);
    ctx.lineTo(rx + rw * 0.03, floorY - rh * 0.185);
    ctx.moveTo(rx + rw * 0.97, floorY - rh * 0.005);
    ctx.lineTo(rx + rw * 0.97, floorY - rh * 0.185);
    ctx.stroke();
    ctx.strokeStyle = '#d3d7db';
    ctx.lineWidth = Math.max(1, rw * 0.0012);
    var R = ROOMS[0];
    for (var s = 0; s < ROT_STRINGS.length; s++) {
      var st = ROT_STRINGS[s];
      var y0 = floorY - rh * st.y;
      shiverLine(rx + rw * 0.035, y0 + rh * st.jit,
        rx + rw * 0.965, y0 - rh * st.jit,
        R.amp, R.freq, st.ph, t, st.sag * rh);
    }
    ctx.restore();
    // Performer, dwarfed: a small dark figure beside the low strings.
    var fx = rx + rw * 0.42, fy = floorY, fh = rh * 0.062;
    ctx.strokeStyle = '#26262a';
    ctx.fillStyle = '#26262a';
    ctx.lineWidth = Math.max(1.5, rw * 0.002);
    dot(fx, fy - fh * 0.88, Math.max(1.5, rw * 0.003));
    ctx.beginPath();
    ctx.moveTo(fx, fy - fh * 0.78);
    ctx.lineTo(fx, fy - fh * 0.38);
    ctx.moveTo(fx, fy - fh * 0.38);
    ctx.lineTo(fx - fh * 0.14, fy);
    ctx.moveTo(fx, fy - fh * 0.38);
    ctx.lineTo(fx + fh * 0.14, fy);
    ctx.moveTo(fx, fy - fh * 0.68);
    ctx.lineTo(fx - fh * 0.20, fy - fh * 0.42);
    ctx.moveTo(fx, fy - fh * 0.68);
    ctx.lineTo(fx + fh * 0.20, fy - fh * 0.42);
    ctx.stroke();
  }

  function drawChurch(g, t) {
    var rx = g.rx, ry = g.ry, rw = g.rw, rh = g.rh, floorY = g.floorY, cx = g.cx;
    // Warm stone wall.
    var wall = ctx.createLinearGradient(0, ry, 0, floorY);
    wall.addColorStop(0, '#5d5347');
    wall.addColorStop(1, '#453d33');
    ctx.fillStyle = wall;
    ctx.fillRect(rx, ry, rw, floorY - ry);
    // Pointed-arch windows flanking the chandelier, pale gold.
    ctx.save();
    ctx.translate(g.pan * 0.5, 0);
    var winX = [0.10, 0.30, 0.70, 0.90];
    for (var w = 0; w < winX.length; w++) {
      var wx = rx + rw * winX[w], ww = rw * (g.phone ? 0.085 : 0.055), wh = rh * 0.30, wy = ry + rh * 0.10;
      var wg = ctx.createLinearGradient(0, wy, 0, wy + wh);
      wg.addColorStop(0, '#f0dca8');
      wg.addColorStop(1, '#c9a45e');
      ctx.fillStyle = wg;
      ctx.beginPath();
      ctx.moveTo(wx - ww / 2, wy + wh);
      ctx.lineTo(wx - ww / 2, wy + wh * 0.35);
      ctx.quadraticCurveTo(wx - ww / 2, wy, wx, wy - wh * 0.10);
      ctx.quadraticCurveTo(wx + ww / 2, wy, wx + ww / 2, wy + wh * 0.35);
      ctx.lineTo(wx + ww / 2, wy + wh);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(40,32,22,' + alpha(0.4) + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(wx, wy - wh * 0.10);
      ctx.lineTo(wx, wy + wh);
      ctx.strokeStyle = 'rgba(40,32,22,' + alpha(0.3) + ')';
      ctx.stroke();
    }
    ctx.restore();
    // Mirror floor: silver, bright toward the horizon.
    var fl = ctx.createLinearGradient(0, floorY, 0, ry + rh);
    fl.addColorStop(0, '#c9ccd0');
    fl.addColorStop(1, '#8f959b');
    ctx.fillStyle = fl;
    ctx.fillRect(rx, floorY, rw, ry + rh - floorY);
    // Chandelier: gold ring with candles, hung from the ceiling.
    var chY = ry + rh * 0.17;
    ctx.save();
    ctx.translate(g.pan * 0.5, 0);
    ctx.strokeStyle = '#8a6d2f';
    ctx.lineWidth = Math.max(1, rw * 0.0015);
    ctx.beginPath();
    ctx.moveTo(cx, ry);
    ctx.lineTo(cx, chY - rh * 0.02);
    ctx.stroke();
    var glow = ctx.createRadialGradient(cx, chY, 2, cx, chY, rw * 0.16);
    glow.addColorStop(0, 'rgba(232,200,120,' + alpha(0.30) + ')');
    glow.addColorStop(1, 'rgba(232,200,120,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(cx - rw * 0.16, chY - rw * 0.16, rw * 0.32, rw * 0.32);
    ctx.strokeStyle = '#d4a94e';
    ctx.lineWidth = Math.max(1.5, rw * 0.002);
    ctx.beginPath();
    ctx.moveTo(cx + rw * 0.10, chY);
    ctx.ellipse(cx, chY, rw * 0.10, rh * 0.022, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = '#f7e3b0';
    for (var c = 0; c < 8; c++) {
      var ca = (c / 8) * Math.PI * 2;
      var ccx = cx + Math.cos(ca) * rw * 0.10;
      var ccy = chY + Math.sin(ca) * rh * 0.022 - rh * 0.012;
      dot(ccx, ccy, Math.max(1.5, rw * 0.0025));
    }
    // Faint gold reflection of the chandelier in the mirror floor.
    ctx.strokeStyle = 'rgba(212,169,78,' + alpha(0.30) + ')';
    ctx.lineWidth = Math.max(1, rw * 0.0015);
    ctx.beginPath();
    ctx.moveTo(cx + rw * 0.07, floorY + rh * 0.05);
    ctx.ellipse(cx, floorY + rh * 0.05, rw * 0.07, rh * 0.012, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
    // Vertical strings from the ceiling, doubled in the mirrored floor.
    ctx.save();
    ctx.translate(g.pan, 0);
    var C = ROOMS[1];
    ctx.strokeStyle = '#e2e5e9';
    ctx.lineWidth = Math.max(1, rw * 0.0012);
    for (var s = 0; s < CH_STRINGS.length; s++) {
      var st = CH_STRINGS[s];
      var sx = rx + rw * st.x;
      var topY = ry + rh * st.top;
      shiverLine(sx, topY, sx, floorY - 2, C.amp, C.freq, st.ph, t, 0);
    }
    ctx.strokeStyle = 'rgba(226,229,233,' + alpha(0.30) + ')';
    for (var s2 = 0; s2 < CH_STRINGS.length; s2++) {
      var st2 = CH_STRINGS[s2];
      var sx2 = rx + rw * st2.x;
      var topY2 = ry + rh * st2.top;
      var reflH = (floorY - topY2) * 0.45;
      shiverLine(sx2, floorY + 2, sx2, floorY + 2 + reflH, C.amp * 0.6, C.freq, st2.ph, t, 0);
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,' + alpha(0.18) + ')';
    ctx.fillRect(rx, floorY - 1, rw, 1);
  }

  function drawHall(g, t) {
    var rx = g.rx, ry = g.ry, rw = g.rw, rh = g.rh, floorY = g.floorY, cx = g.cx;
    // Dark industrial hall.
    var wall = ctx.createLinearGradient(0, ry, 0, floorY);
    wall.addColorStop(0, '#2e2e32');
    wall.addColorStop(1, '#1e1e21');
    ctx.fillStyle = wall;
    ctx.fillRect(rx, ry, rw, floorY - ry);
    // Safety-orange ceiling trusses with cross bracing.
    ctx.save();
    ctx.translate(g.pan * 0.5, 0);
    var trY0 = ry + rh * 0.045, trY1 = ry + rh * 0.135;
    ctx.strokeStyle = '#e86a1c';
    ctx.lineWidth = Math.max(2, rw * 0.003);
    ctx.beginPath();
    ctx.moveTo(rx, trY0);
    ctx.lineTo(rx + rw, trY0);
    ctx.moveTo(rx, trY1);
    ctx.lineTo(rx + rw, trY1);
    ctx.stroke();
    ctx.lineWidth = Math.max(1, rw * 0.0018);
    var seg = 12;
    ctx.beginPath();
    for (var b = 0; b < seg; b++) {
      var bx0 = rx + (b / seg) * rw, bx1 = rx + ((b + 1) / seg) * rw;
      if (b % 2 === 0) { ctx.moveTo(bx0, trY1); ctx.lineTo(bx1, trY0); }
      else { ctx.moveTo(bx0, trY0); ctx.lineTo(bx1, trY1); }
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(232,106,28,' + alpha(0.5) + ')';
    ctx.lineWidth = Math.max(1, rw * 0.0015);
    ctx.beginPath();
    ctx.moveTo(rx + rw * 0.06, trY1);
    ctx.lineTo(rx + rw * 0.06, floorY);
    ctx.moveTo(rx + rw * 0.94, trY1);
    ctx.lineTo(rx + rw * 0.94, floorY);
    ctx.stroke();
    ctx.restore();
    // Floor: dark concrete with a hazard strip near the front edge.
    var fl = ctx.createLinearGradient(0, floorY, 0, ry + rh);
    fl.addColorStop(0, '#333336');
    fl.addColorStop(1, '#232326');
    ctx.fillStyle = fl;
    ctx.fillRect(rx, floorY, rw, ry + rh - floorY);
    var hzY = ry + rh * 0.93, hzH = Math.max(3, rh * 0.018);
    var hzX0 = rx + rw * 0.55, hzX1 = rx + rw * 0.78;
    ctx.save();
    ctx.beginPath();
    ctx.rect(hzX0, hzY, hzX1 - hzX0, hzH);
    ctx.clip();
    for (var h = 0; h < 14; h++) {
      ctx.fillStyle = (h % 2 === 0) ? '#e86a1c' : '#1c1c1e';
      var hx = hzX0 + h * (hzX1 - hzX0) / 14;
      ctx.beginPath();
      ctx.moveTo(hx, hzY + hzH);
      ctx.lineTo(hx + hzH, hzY);
      ctx.lineTo(hx + hzH + (hzX1 - hzX0) / 14, hzY);
      ctx.lineTo(hx + (hzX1 - hzX0) / 14, hzY + hzH);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    // Flight cases: black boxes with silver edges, stacked at both sides.
    function flightCase(x, y, w, h) {
      ctx.fillStyle = '#17171a';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#9aa0a6';
      ctx.lineWidth = Math.max(1, rw * 0.0012);
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = '#9aa0a6';
      var cs = Math.max(2, rw * 0.004);
      ctx.fillRect(x, y, cs, cs);
      ctx.fillRect(x + w - cs, y, cs, cs);
      ctx.fillRect(x, y + h - cs, cs, cs);
      ctx.fillRect(x + w - cs, y + h - cs, cs, cs);
      ctx.fillStyle = 'rgba(154,160,166,' + alpha(0.7) + ')';
      ctx.fillRect(x + w * 0.42, y + h * 0.42, w * 0.16, h * 0.16);
    }
    var cw = rw * 0.105, chh = rh * 0.075;
    var caseTopL = floorY - chh * 2 - 2;
    flightCase(rx + rw * 0.035, caseTopL, cw, chh);
    flightCase(rx + rw * 0.035, floorY - chh, cw, chh);
    flightCase(rx + rw * 0.145, floorY - chh, cw, chh);
    flightCase(rx + rw * 0.86, floorY - chh, cw, chh);
    flightCase(rx + rw * 0.86, floorY - chh * 2 - 2, cw, chh);
    // Strings from the trusses down to floor anchors and case tops.
    ctx.save();
    ctx.translate(g.pan, 0);
    var H = ROOMS[2];
    ctx.strokeStyle = '#d5d9dd';
    ctx.lineWidth = Math.max(1, rw * 0.0012);
    for (var s = 0; s < HALL_STRINGS.length; s++) {
      var st = HALL_STRINGS[s];
      var sx0 = rx + rw * st.x0, sy0 = ry + rh * st.y0;
      var sx1 = rx + rw * st.x1;
      var sy1;
      if (st.toCase) {
        sy1 = (st.x1 < 0.5) ? floorY - chh * 2 - 2 : floorY - chh * 2 - 2;
      } else {
        sy1 = floorY - 2;
      }
      shiverLine(sx0, sy0, sx1, sy1, H.amp, H.freq, st.ph, t, 0);
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,' + alpha(0.25) + ')';
    ctx.fillRect(rx, floorY - 1, rw, 1);
  }

  var DRAWERS = [drawRotunda, drawChurch, drawHall];

  function draw(t) {
    var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    var W = Math.max(1, Math.floor(vw));
    var H = Math.max(1, Math.floor(vh));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var isPhone = false;
    try {
      var sw = window.screen.width, sh = window.screen.height;
      var mn = Math.min(sw, sh);
      isPhone = mn < 700 || (H > W * 1.15);
    } catch (e) { isPhone = (H > W * 1.15); }

    // Page ground: dark neutral, the rooms sit on it on desktop.
    ctx.fillStyle = '#17171a';
    ctx.fillRect(0, 0, W, H);

    var rx, ry, rw, rh;
    if (isPhone) {
      rx = 0; ry = 0; rw = W; rh = H;
    } else {
      rw = Math.min(W * 0.94, H * 1.5);
      rh = rw / 1.6;
      rx = (W - rw) / 2;
      ry = (H - rh) / 2;
    }
    var floorY = ry + rh * 0.74;
    var cx = rx + rw * 0.5;
    var pan = Math.sin(t * 0.045) * rw * 0.006;
    var g = { rx: rx, ry: ry, rw: rw, rh: rh, floorY: floorY, cx: cx, pan: pan, phone: isPhone };

    var idx = roomIndex(t);
    var lt = roomLocal(t);
    var fade = Math.min(lt / FADE, 1);
    var zoom = 0.88 + 0.12 * ease(Math.min(lt / 32, 1));
    var prev = (idx + 2) % 3;

    function roomClip() {
      ctx.beginPath();
      ctx.rect(rx, ry, rw, rh);
      ctx.clip();
    }
    function drawRoomScaled(r, z) {
      ctx.save();
      roomClip();
      ctx.translate(cx, ry + rh * 0.5);
      // Divide by the widest zoom (0.88) so the room always covers its
      // rect: the camera starts at 1.0 and settles to 1.136, never
      // revealing the page ground inside the frame.
      ctx.scale(z / 0.88, z / 0.88);
      ctx.translate(-cx, -(ry + rh * 0.5));
      DRAWERS[r](g, t);
      ctx.restore();
    }

    if (fade < 1) {
      drawRoomScaled(prev, 1.0);
      ctx.save();
      ctx.globalAlpha = alpha(fade);
      drawRoomScaled(idx, zoom);
      ctx.restore();
    } else {
      drawRoomScaled(idx, zoom);
    }

    // Title and date plate, top-left (parent fix round: the piece shipped
    // without one). On desktop it sits in the page-ground band above the
    // room; on phones it sits over the room top-left, so the room label
    // shifts down there to stay clear.
    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(18,18,20,0.62)';
    ctx.fillRect(10, 10, 300, 48);
    ctx.fillStyle = '#e8e8ea';
    ctx.font = '600 12px system-ui, sans-serif';
    ctx.fillText('ARCHITECTURE IS THE SOUNDING BODY', 20, 30);
    ctx.fillStyle = '#9a9a9e';
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillText('2007 · 01 · 11', 20, 48);
    ctx.restore();

    // Room label with a dark backing plate so it reads over any room
    // (gold windows in the church, orange truss in the hall).
    ctx.save();
    ctx.globalAlpha = alpha(0.55 + 0.45 * fade);
    ctx.font = '600 11px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    var lx = rx + Math.max(10, rw * 0.02);
    var ly = ry + (isPhone ? 66 : Math.max(10, rh * 0.03));
    var lw = ctx.measureText(ROOMS[idx].name).width;
    ctx.fillStyle = 'rgba(18,18,20,' + alpha(0.45) + ')';
    ctx.fillRect(lx - 6, ly - 5, lw + 12, 21);
    ctx.fillStyle = ROOMS[idx].label;
    ctx.fillText(ROOMS[idx].name, lx, ly);
    ctx.restore();
    ctx.fillStyle = ROOMS[idx].label;
    ctx.globalAlpha = alpha(0.45);
    ctx.fillRect(rx, ry + rh - 2, rw * (lt / ROOM_LEN), 2);
    ctx.globalAlpha = 1;

    currentRoom = idx;
    if (audioOn) setRoomAudio(idx);
  }

  // Audio: lazy, only after the visitor taps SOUND. Visuals carry the piece.
  var audio = null;
  var audioOn = false;
  var currentRoom = 1;
  function makeImpulse(ac, dur, decay, lp, taps) {
    var sr = ac.sampleRate;
    var len = Math.floor(sr * dur);
    var buf = ac.createBuffer(2, len, sr);
    for (var ch = 0; ch < 2; ch++) {
      var d = buf.getChannelData(ch);
      var y = 0;
      for (var i = 0; i < len; i++) {
        var v = (Math.random() * 2 - 1) * Math.exp(-decay * (i / sr));
        y += lp * (v - y);
        d[i] = y;
      }
      if (taps) {
        for (var k = 1; k <= 4; k++) {
          var at = Math.floor(sr * 0.09 * k);
          var g = 0.35 / k;
          for (var j = 0; j < len - at; j++) d[j + at] += d[j] * g * 0.4;
        }
      }
    }
    return buf;
  }
  function ensureAudio() {
    if (audio) return audio;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (typeof AC === 'undefined') return null;
    var ac = new AC();
    var master = ac.createGain();
    master.gain.value = 0;
    master.connect(ac.destination);
    var bus = ac.createGain();
    bus.gain.value = 0.9;
    var dry = ac.createGain();
    dry.gain.value = 0.25;
    var conv = ac.createConvolver();
    var wet = ac.createGain();
    wet.gain.value = 0.6;
    bus.connect(dry);
    dry.connect(master);
    bus.connect(conv);
    conv.connect(wet);
    wet.connect(master);
    var freqs = [55, 82.41, 110];
    for (var i = 0; i < freqs.length; i++) {
      var o = ac.createOscillator();
      o.type = 'sine';
      o.frequency.value = freqs[i];
      var og = ac.createGain();
      og.gain.value = (i === 0) ? 0.5 : 0.28;
      o.connect(og);
      og.connect(bus);
      o.start();
    }
    var lfo = ac.createOscillator();
    lfo.frequency.value = 0.05;
    var lg = ac.createGain();
    lg.gain.value = 0.12;
    lfo.connect(lg);
    lg.connect(bus.gain);
    lfo.start();
    audio = { ac: ac, master: master, conv: conv, wet: wet, room: -1 };
    return audio;
  }
  function setRoomAudio(r) {
    if (!audio || !audioOn) return;
    if (audio.room === r) return;
    var R = ROOMS[r];
    audio.conv.buffer = makeImpulse(audio.ac, R.dur, R.decay, R.lp, R.taps);
    audio.wet.gain.setTargetAtTime(R.wet, audio.ac.currentTime, 0.4);
    audio.room = r;
  }
  var btn = null;
  try { btn = document.getElementById('sound'); } catch (e) { btn = null; }
  if (btn && btn.addEventListener) {
    btn.addEventListener('click', function () {
      var a = ensureAudio();
      if (!a) return;
      if (a.ac.state === 'suspended') a.ac.resume();
      if (!audioOn) {
        audioOn = true;
        a.master.gain.setTargetAtTime(0.9, a.ac.currentTime, 0.5);
        setRoomAudio(currentRoom);
        btn.textContent = 'SOUND ON';
      } else {
        audioOn = false;
        a.master.gain.setTargetAtTime(0, a.ac.currentTime, 0.3);
        btn.textContent = 'SOUND OFF';
      }
    });
  }

  // One synchronous frame at load: t = 60, mid-church, fully settled.
  draw(60);

  if (reduced) return;

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = 60 + (ts - start) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }

  function onResize() { draw(60); }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
})();
</script>
</body>
</html>
