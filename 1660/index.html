<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Study, Quantum Sheet</title>
<style>
html, body { margin: 0; padding: 0; background: #F2EFE8; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#F2EFE8';
// Palette: pale luminous ground; circles in pale blue, peach, cream;
// hatching in blue-grey; overlap segments in coral, teal, gold.
var BLUE = [168, 196, 214];
var PEACH = [244, 196, 168];
var CREAM = [238, 228, 196];
var HATCHC = [96, 116, 128];
var CORAL = [224, 120, 86];
var TEAL = [46, 139, 139];
var GOLD = [217, 164, 65];
var INK = [74, 88, 98];
var SEED = 1660;
var NCIRCLES = 6;          // large circles, asserted
var HATCH_SPACING = 7;     // px at the 720 reference size
var FILL_A = 0.34;         // translucent circle fill
var HATCH_A = 0.55;        // blue-grey hatch alpha
var SEG_A = 0.85;          // overlap segment alpha
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
// Seeded circle table. Fixed base positions, chosen so at least two
// overlaps are visible at frame one; drift is a bounded sinusoid around
// each base, so overlaps persist and shift but never run away. draw(t)
// is a pure function of t, so every re-render at the same t is identical.
var rng = mulberry32(SEED * 2654435761 >>> 0);
var BASE = [
  { u: 0.30, v: 0.32, r: 0.20, c: BLUE },
  { u: 0.52, v: 0.28, r: 0.17, c: PEACH },
  { u: 0.68, v: 0.50, r: 0.19, c: CREAM },
  { u: 0.36, v: 0.60, r: 0.18, c: BLUE },
  { u: 0.62, v: 0.70, r: 0.15, c: PEACH },
  { u: 0.22, v: 0.74, r: 0.13, c: CREAM }
];
var ACCENTS = [CORAL, TEAL, GOLD];
var circles = [];
for (var i = 0; i < NCIRCLES; i++) {
  var b = BASE[i];
  circles.push({
    u: b.u, v: b.v, r: b.r, c: b.c,
    ampU: 0.012 + rng() * 0.012,
    ampV: 0.012 + rng() * 0.012,
    wU: 0.05 + rng() * 0.05,
    wV: 0.05 + rng() * 0.05,
    pU: rng() * TAU,
    pV: rng() * TAU,
    hatchPhase: rng() * TAU,
    lensPhase: rng() * TAU
  });
}
// Pair table: every overlapping pair at frame one, with its accent color.
var pairs = [];
for (var a = 0; a < NCIRCLES; a++) {
  for (var b2 = a + 1; b2 < NCIRCLES; b2++) {
    var du = BASE[a].u - BASE[b2].u, dv = BASE[a].v - BASE[b2].v;
    var d = Math.sqrt(du * du + dv * dv);
    if (d < BASE[a].r + BASE[b2].r && d > Math.abs(BASE[a].r - BASE[b2].r)) {
      pairs.push({ a: a, b: b2, accent: ACCENTS[pairs.length % ACCENTS.length] });
    }
  }
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, startT = null;
function isPhone() {
  var sw = 0, sh = 0;
  if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width; sh = window.screen.height; }
  if (sw > 0 && sh > 0) return Math.min(sw, sh) < 700;
  return VH > VW * 1.15;
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
// Centered geometric composition: square, centered, on both sizes.
// The page ground is the piece's own background, so the square sits in
// generous pale margins on every screen.
function frame() {
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
// Closed-form circle center at time t: slow bounded drift.
function centerAt(ci, f, t) {
  var x = f.x + (ci.u + ci.ampU * Math.sin(ci.wU * t + ci.pU)) * f.w;
  var y = f.y + (ci.v + ci.ampV * Math.sin(ci.wV * t + ci.pV)) * f.h;
  return [x, y];
}
// Fine diagonal hatch (45 degrees) clipped to the given circle.
// offset shifts the line set along the normal; shimmer is a slow
// sinusoidal offset, so the field breathes without ever flickering.
function hatchCircle(cx, cy, r, spacing, offset, color, alpha, lw) {
  var step = spacing;
  var diag = 1 / Math.SQRT2;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.clip();
  ctx.strokeStyle = rgba(color, alpha);
  ctx.lineWidth = lw;
  ctx.beginPath();
  for (var k = -r - step; k <= r + step; k += step) {
    var kk = k + offset;
    var half = Math.sqrt(Math.max(0, r * r - kk * kk));
    var nx = cx + kk * diag, ny = cy + kk * diag;
    ctx.moveTo(nx - half * diag, ny + half * diag);
    ctx.lineTo(nx + half * diag, ny - half * diag);
  }
  ctx.stroke();
  ctx.restore();
}
function draw(t) {
  size();
  var f = frame();
  var S = Math.min(f.w, f.h);
  var sc = S / 720;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  var pos = [];
  for (var i = 0; i < NCIRCLES; i++) {
    var ci = circles[i];
    var xy = centerAt(ci, f, t);
    var r = ci.r * S;
    pos.push({ x: xy[0], y: xy[1], r: r });
    // Translucent glass fill.
    ctx.fillStyle = rgba(ci.c, FILL_A);
    ctx.beginPath();
    ctx.moveTo(xy[0] + r, xy[1]);
    ctx.arc(xy[0], xy[1], r, 0, TAU);
    ctx.fill();
  }
  // Each circle's own hatch field, clipped to the circle.
  for (var j = 0; j < NCIRCLES; j++) {
    var cj = circles[j];
    var off = 3 * sc * Math.sin(0.07 * t + cj.hatchPhase);
    hatchCircle(pos[j].x, pos[j].y, pos[j].r, HATCH_SPACING * sc, off,
      HATCHC, HATCH_A, Math.max(0.6, 0.8 * sc));
  }
  // Overlap lenses: the hatch breaks into short colored segments.
  // Lens fill alpha breathes slowly, so an overlap reads solid, then
  // ghost, then solid again as the circles keep drifting.
  for (var p = 0; p < pairs.length; p++) {
    var pr = pairs[p];
    var A = pos[pr.a], B = pos[pr.b];
    var dx = B.x - A.x, dy = B.y - A.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d >= A.r + B.r || d <= Math.abs(A.r - B.r) || d === 0) continue;
    var lensA = 0.10 + 0.07 * Math.sin(0.10 * t + circles[pr.a].lensPhase);
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(A.x + A.r, A.y);
    ctx.arc(A.x, A.y, A.r, 0, TAU);
    ctx.clip();
    ctx.beginPath();
    ctx.moveTo(B.x + B.r, B.y);
    ctx.arc(B.x, B.y, B.r, 0, TAU);
    ctx.clip();
    ctx.fillStyle = rgba(pr.accent, lensA);
    ctx.fillRect(A.x - A.r, A.y - A.r, A.r * 2, A.r * 2);
    // Accent hatch, offset by half a spacing so the lines read as
    // broken segments against the blue-grey field beneath.
    var diag = 1 / Math.SQRT2;
    var spacing = HATCH_SPACING * sc;
    var off2 = spacing * 0.5 + 2 * sc * Math.sin(0.06 * t + circles[pr.b].lensPhase);
    var cxm = (A.x + B.x) / 2, cym = (A.y + B.y) / 2;
    var rr = Math.min(A.r, B.r);
    ctx.strokeStyle = rgba(pr.accent, SEG_A);
    ctx.lineWidth = Math.max(0.7, 1.0 * sc);
    ctx.beginPath();
    for (var k = -rr - spacing; k <= rr + spacing; k += spacing) {
      var kk = k + off2;
      var half = Math.sqrt(Math.max(0, rr * rr - kk * kk));
      var nx = cxm + kk * diag, ny = cym + kk * diag;
      ctx.moveTo(nx - half * diag, ny + half * diag);
      ctx.lineTo(nx + half * diag, ny - half * diag);
    }
    ctx.stroke();
    ctx.restore();
  }
  // Thin glass rims.
  for (var m = 0; m < NCIRCLES; m++) {
    ctx.strokeStyle = rgba(HATCHC, 0.35);
    ctx.lineWidth = Math.max(0.6, 1.0 * sc);
    ctx.beginPath();
    ctx.moveTo(pos[m].x + pos[m].r, pos[m].y);
    ctx.arc(pos[m].x, pos[m].y, pos[m].r, 0, TAU);
    ctx.stroke();
  }
  // Caption plates, drawn on canvas: title, formula date, hint.
  var plateW = S * 0.62, plateH = S * 0.075;
  var px = f.x + (S - plateW) / 2, py = f.y + S * 0.905;
  ctx.fillStyle = rgba([242, 239, 232], 0.88);
  ctx.fillRect(px, py, plateW, plateH);
  ctx.fillStyle = rgba(INK, 0.92);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '600 ' + Math.round(15 * sc) + 'px Georgia, serif';
  ctx.fillText('GLASS STUDY, QUANTUM SHEET', f.x + S / 2, py + plateH * 0.30);
  ctx.font = Math.round(11.5 * sc) + 'px Georgia, serif';
  ctx.fillText('2006 · 07 · 29      Watch only.', f.x + S / 2, py + plateH * 0.72);
  if (typeof window !== 'undefined') {
    window.__p1660 = { t: t, circles: NCIRCLES, pairs: pairs.length };
  }
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
var reduced = false;
try {
  if (typeof window !== 'undefined' && window.matchMedia) {
    reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }
} catch (e) { reduced = false; }
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (!reduced && typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
