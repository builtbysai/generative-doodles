<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№614 Melting Ice, Microscope</title>
<style>
  html, body { margin: 0; padding: 0; background: #dceef5; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Melting Ice, Microscope, KD6 / PP1188, study #253 kit-downes.
  // A field of melting ice seen through a microscope: translucent
  // pools, dark speck clusters low like sediment, thin thread-lines
  // drifting diagonally like cell structures, and a faint cold glow
  // where the melt is most advanced. Drag stirs the melt, warming
  // the field under the hand; tap freezes one bloom, a crystalline
  // pattern that locks at the tap point and stays.
  var INK = '#1e2a5a';      // plate ink, deep indigo
  var INK_DIM = '#3d4a7a';  // muted indigo
  var BG_TOP = '#dceef5';   // pale cyan, top of the field
  var BG_MID = '#b3d4e6';   // ice blue, middle of the field
  var BG_BOT = '#8fbcd8';   // deeper ice blue, bottom of the field
  var POOL = '#cfe8f2';     // translucent pool fill
  var SPECK = '#232a4d';    // speck clusters, deep indigo
  var SPECK_PALE = '#7fa8c8'; // pale specks
  var THREAD = '#f4f8fb';   // thread-lines, white
  var GLOW = '#eef6fa';     // cold white glow
  var PILL = '#eef6fa';     // hint pill, cold white

  // Fixed-phase first frame: FIRST_T = 20 s. At t = 20 the melt
  // factor is 0.60, so the pools are open but the field is nowhere
  // near fully melted; specks sit partway clumped toward their
  // sediment clusters; the glow is visible at the hotspot low
  // left of center; threads are mid-drift across the diagonals.
  var FIRST_T = 20;

  // QA probe hooks: ?seed= varies the field, ?sx= and ?sy= together
  // freeze one bloom at that fractional position at load.
  var seedParam = 0, probeX = null, probeY = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var m;
    m = qs.match(/[?&]seed=(-?\d+)/); if (m) { seedParam = parseInt(m[1], 10) || 0; }
    var mx = qs.match(/[?&]sx=([0-9.]+)/), my = qs.match(/[?&]sy=([0-9.]+)/);
    if (mx && my) { probeX = parseFloat(mx[1]); probeY = parseFloat(my[1]); }
  } catch (e) {}
  var FIELD_SEED = seedParam ? (1941 + seedParam * 101) : 1941;

  // Seeded PRNG, mulberry32. Fresh instances per draw from the piece
  // number, so every frame is reproducible regardless of call order.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Seeded field, fixed at load: speck anchors and their sediment
  // clusters, pool centers, thread starts, and the melt hotspot.
  // Nothing here depends on t.
  var CLUSTERS = [];
  var SPECKS = [];
  var POOLS = [];
  var THREADS = [];
  var HOTSPOT = { x: 0.36, y: 0.70 };
  (function buildSeeded() {
    var rng = mulberry32(FIELD_SEED);
    var i, k;
    for (i = 0; i < 5; i++) {
      CLUSTERS.push({ x: 0.12 + i * 0.19 + (rng() - 0.5) * 0.06, y: 0.62 + rng() * 0.28 });
    }
    for (i = 0; i < 140; i++) {
      var cl = CLUSTERS[Math.floor(rng() * CLUSTERS.length)];
      SPECKS.push({
        ax: rng(), ay: rng(),
        cx: cl.x + (rng() - 0.5) * 0.10, cy: cl.y + (rng() - 0.5) * 0.08,
        r: 0.8 + rng() * 1.8, ph: rng() * Math.PI * 2,
        sp: 0.05 + rng() * 0.07, amp: 3 + rng() * 6,
        a: 0.35 + rng() * 0.5, pale: rng() < 0.22
      });
    }
    for (i = 0; i < 7; i++) {
      POOLS.push({ x: 0.10 + rng() * 0.80, y: 0.14 + rng() * 0.76, r: 0.06 + rng() * 0.09, ph: rng() * Math.PI * 2 });
    }
    for (i = 0; i < 8; i++) {
      var diag = (i % 2 === 0) ? -0.56 : 0.66; // near-diagonal drift
      THREADS.push({
        bx: 0.05 + rng() * 0.9, by: 0.05 + rng() * 0.9,
        ang: diag + (rng() - 0.5) * 0.30, len: 0.45 + rng() * 0.45,
        ph: rng() * Math.PI * 2, a: 0.30 + rng() * 0.30, w: 1 + rng() * 0.8
      });
    }
  })();

  // Interaction state: drag heat events and frozen blooms. Both are
  // empty at load, so frame one is a pure function of t and the seed.
  var dragEvents = []; // {x, y, t0} in css px
  var crystals = [];   // {x, y, seed, r} in css px, never cleared
  var dragging = false;
  var downX = 0, downY = 0, moved = false, lastHeatX = -1e9, lastHeatY = -1e9;

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  // Melt factor: 0.32 to 0.68, slow 0.03 rad/s breathing. The field
  // never fully melts and never fully freezes; the piece lives in
  // the middle.
  function melt(t) { return 0.5 + 0.18 * Math.sin(t * 0.03); }

  // Local heat at (x, y) from drag events: decays over 9 s, falls
  // off with distance. Capped so a hard stir warms but never boils.
  function heatAt(x, y, t) {
    var sum = 0, i;
    for (i = 0; i < dragEvents.length; i++) {
      var ev = dragEvents[i];
      var dt = t - ev.t0;
      if (dt < 0 || dt > 27) { continue; }
      var dx = x - ev.x, dy = y - ev.y;
      var d2 = dx * dx + dy * dy;
      sum += Math.exp(-dt / 9) * Math.exp(-d2 / (2 * 130 * 130));
    }
    return clamp(sum, 0, 1.2);
  }

  // Scatter displacement for a speck at (x, y): drag events push
  // specks away, strongest nearby, decaying over 3.5 s. Specks
  // re-clump as the push fades, since their base position is a pure
  // function of t.
  function scatter(x, y, t) {
    var ox = 0, oy = 0, i;
    for (i = 0; i < dragEvents.length; i++) {
      var ev = dragEvents[i];
      var dt = t - ev.t0;
      if (dt < 0 || dt > 14) { continue; }
      var dx = x - ev.x, dy = y - ev.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < 1 || d > 220) { continue; }
      var mag = 30 * Math.exp(-dt / 3.5) * Math.exp(-(d * d) / (2 * 95 * 95));
      ox += (dx / d) * mag;
      oy += (dy / d) * mag;
    }
    return { x: ox, y: oy };
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  function drawPool(p, t) {
    var cx = p.x * W, cy = p.y * H;
    var m = melt(t);
    var rr = p.r * Math.min(W, H) * (0.75 + 0.45 * m + 0.35 * heatAt(cx, cy, t));
    ctx.fillStyle = hexA(POOL, a4(0.30 + 0.12 * m));
    ctx.beginPath(); ctx.moveTo(cx + rr, cy); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = hexA(THREAD, a4(0.35));
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx + rr, cy); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.stroke();
    // A brighter inner lens, offset with the pool's slow breathing.
    var ir = rr * (0.45 + 0.08 * Math.sin(t * 0.11 + p.ph));
    var ix = cx + Math.sin(t * 0.07 + p.ph) * rr * 0.12;
    var iy = cy + Math.cos(t * 0.09 + p.ph) * rr * 0.10;
    ctx.fillStyle = hexA(GLOW, a4(0.22));
    ctx.beginPath(); ctx.moveTo(ix + ir, iy); ctx.arc(ix, iy, ir, 0, Math.PI * 2); ctx.fill();
  }

  function drawThread(th, t) {
    var scale = Math.min(W, H);
    var drift = Math.sin(t * 0.02 + th.ph) * 14;
    var bx = th.bx * W + Math.cos(th.ang) * drift;
    var by = th.by * H + Math.sin(th.ang) * drift;
    var len = th.len * scale;
    var segs = 6;
    ctx.strokeStyle = hexA(THREAD, a4(th.a));
    ctx.lineWidth = th.w;
    ctx.beginPath();
    var i;
    for (i = 0; i <= segs; i++) {
      var f = i / segs;
      var px = bx + Math.cos(th.ang) * len * f;
      var py = by + Math.sin(th.ang) * len * f;
      var off = Math.sin(t * 0.08 + th.ph + i * 0.9) * 10;
      px += -Math.sin(th.ang) * off;
      py += Math.cos(th.ang) * off;
      if (i === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
    }
    ctx.stroke();
  }

  function drawSpecks(t) {
    var i;
    for (i = 0; i < SPECKS.length; i++) {
      var s = SPECKS[i];
      var c = 0.5 + 0.3 * Math.sin(t * 0.045 + s.ph);
      var x = (s.ax + (s.cx - s.ax) * c) * W + Math.sin(t * s.sp + s.ph) * s.amp;
      var y = (s.ay + (s.cy - s.ay) * c) * H + Math.cos(t * s.sp * 0.8 + s.ph) * s.amp * 0.7;
      var sc = scatter(x, y, t);
      x += sc.x; y += sc.y;
      ctx.fillStyle = s.pale ? hexA(SPECK_PALE, a4(s.a)) : hexA(SPECK, a4(s.a));
      ctx.beginPath(); ctx.moveTo(x + s.r, y); ctx.arc(x, y, s.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // A frozen bloom: irregular dendrite branches from a seeded
  // crystal, fixed radius, drawn identically every frame once
  // seeded. Branch angles and lengths vary, so it reads as a
  // crystalline bloom under glass, not a snowflake pictogram.
  function drawCrystal(cr) {
    var rng = mulberry32(cr.seed);
    var R = cr.r;
    // Faint halo so the bloom reads against the field.
    ctx.fillStyle = hexA(INK, a4(0.05));
    ctx.beginPath(); ctx.moveTo(cr.x + R * 1.05, cr.y); ctx.arc(cr.x, cr.y, R * 1.05, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = hexA(THREAD, a4(0.25));
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cr.x + R * 1.05, cr.y); ctx.arc(cr.x, cr.y, R * 1.05, 0, Math.PI * 2); ctx.stroke();
    var k, f;
    ctx.strokeStyle = hexA(THREAD, a4(0.9));
    ctx.lineWidth = 1.4;
    var baseAng = rng() * Math.PI * 2;
    for (k = 0; k < 5; k++) {
      var ang = baseAng + k * (Math.PI * 2 / 5) + (rng() - 0.5) * 0.7;
      var blen = R * (0.68 + rng() * 0.45);
      var dx = Math.cos(ang), dy = Math.sin(ang);
      ctx.beginPath();
      ctx.moveTo(cr.x, cr.y);
      ctx.lineTo(cr.x + dx * blen, cr.y + dy * blen);
      ctx.stroke();
      // Side branches at two irregular stations along the main branch.
      var stations = [0.35 + rng() * 0.2, 0.62 + rng() * 0.2];
      var lens = [0.30, 0.20];
      for (f = 0; f < 2; f++) {
        var sx = cr.x + dx * blen * stations[f];
        var sy = cr.y + dy * blen * stations[f];
        var side;
        for (side = -1; side <= 1; side += 2) {
          var sa = ang + side * (0.7 + rng() * 0.5);
          var sl = blen * lens[f] * (0.7 + rng() * 0.6);
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(sx + Math.cos(sa) * sl, sy + Math.sin(sa) * sl);
          ctx.stroke();
        }
      }
    }
    // Center seed dot.
    ctx.fillStyle = hexA(THREAD, a4(0.95));
    ctx.beginPath(); ctx.moveTo(cr.x + 2.5, cr.y); ctx.arc(cr.x, cr.y, 2.5, 0, Math.PI * 2); ctx.fill();
  }

  function addCrystal(x, y, t) {
    var seed = 194100 + crystals.length * 7919 + Math.floor(x) + Math.floor(y) * 3;
    crystals.push({ x: x, y: y, seed: seed, r: 0.075 * Math.min(W, H) });
    if (crystals.length > 12) { crystals.shift(); }
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Field: icy vertical gradient, pale cyan to deeper ice blue.
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, BG_TOP);
    grad.addColorStop(0.55, BG_MID);
    grad.addColorStop(1, BG_BOT);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Pools, then the cold glow where the melt is most advanced.
    var i;
    for (i = 0; i < POOLS.length; i++) { drawPool(POOLS[i], t); }
    var m = melt(t);
    var gx = HOTSPOT.x * W, gy = HOTSPOT.y * H;
    var gr = Math.max(W, H) * 0.42;
    var gg = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    var glowA = 0.10 + 0.14 * m + 0.25 * heatAt(gx, gy, t);
    gg.addColorStop(0, hexA(GLOW, a4(clamp(glowA, 0, 0.45))));
    gg.addColorStop(1, hexA(GLOW, a4(0)));
    ctx.fillStyle = gg;
    ctx.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
    // Drag heat glows, one soft spot per recent stir.
    for (i = 0; i < dragEvents.length; i++) {
      var ev = dragEvents[i];
      var dt = t - ev.t0;
      if (dt < 0 || dt > 27) { continue; }
      var ea = 0.10 * Math.exp(-dt / 9);
      if (ea < 0.01) { continue; }
      var er = 110;
      var eg = ctx.createRadialGradient(ev.x, ev.y, 0, ev.x, ev.y, er);
      eg.addColorStop(0, hexA(GLOW, a4(ea)));
      eg.addColorStop(1, hexA(GLOW, a4(0)));
      ctx.fillStyle = eg;
      ctx.fillRect(ev.x - er, ev.y - er, er * 2, er * 2);
    }

    // Threads cross diagonally over the field.
    for (i = 0; i < THREADS.length; i++) { drawThread(THREADS[i], t); }

    // Speck clusters, low like sediment.
    drawSpecks(t);

    // Frozen blooms persist on top of the melt.
    for (i = 0; i < crystals.length; i++) { drawCrystal(crystals[i]); }

    // ---- Plates: title top-left, number and date below it, a short
    // descriptor top-right.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Melting Ice, Microscope', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, 0.75);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№614 · 2003 · 09 · 17', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(INK, 0.6);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('a melt field under glass', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom on a cold-white pill so it
    // stays legible over the sediment specks.
    var hint = 'Drag to stir the melt; tap to freeze a bloom.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(PILL, a4(0.62));
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  function perfT() { return lastT; }

  function canvasPos(e) {
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (err) {}
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function addHeat(x, y, t) {
    dragEvents.push({ x: x, y: y, t0: t });
    if (dragEvents.length > 60) { dragEvents.shift(); }
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true;
      moved = false;
      try { if (typeof canvas.setPointerCapture === 'function' && e.pointerId !== undefined) { canvas.setPointerCapture(e.pointerId); } } catch (err) {}
      try { if (typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      var p = canvasPos(e);
      downX = p.x; downY = p.y;
      lastHeatX = p.x; lastHeatY = p.y;
    });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('pointermove', function (e) {
      if (!dragging) { return; }
      var p = canvasPos(e);
      if (Math.abs(p.x - downX) > 8 || Math.abs(p.y - downY) > 8) { moved = true; }
      if (moved) {
        var dx = p.x - lastHeatX, dy = p.y - lastHeatY;
        if (dx * dx + dy * dy > 144) {
          addHeat(p.x, p.y, perfT());
          lastHeatX = p.x; lastHeatY = p.y;
        }
        draw(reduced ? FIRST_T : perfT());
      }
    });
    window.addEventListener('pointerup', function (e) {
      if (!dragging) { return; }
      dragging = false;
      var p = canvasPos(e);
      if (!moved) {
        // Tap: freeze one bloom at the tap point. It stays.
        addCrystal(p.x, p.y, perfT());
        draw(reduced ? FIRST_T : perfT());
      }
    });
    window.addEventListener('pointercancel', function () { dragging = false; });
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: ?seed=, ?sx=, ?sy= read at load; window.__draw lets a
  // harness drive draw() with a virtual clock.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1941 = {
      crystals: function () { return crystals.length; },
      heatEvents: function () { return dragEvents.length; },
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  if (probeX !== null && probeY !== null) {
    addCrystal(probeX * W, probeY * H, FIRST_T);
  }
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop: melt breathing at 0.03 rad/s, speck drift under
  // 0.12 rad/s, thread sway at 0.08 rad/s, all far under the 14 Hz
  // ceiling. Guarded so node-canvas QA (no requestAnimationFrame)
  // still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
