<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawn to Dusk</title>
<style>
  html, body { margin: 0; padding: 0; background: #0E0F12; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // Palette: strict, anchors only. Every tone in the piece is interpolated
  // between these six.
  var LIGHT    = [242, 232, 216]; // #F2E8D8 light half, warm
  var DARK     = [26, 28, 34];    // #1A1C22 dark half
  var SCRIM    = [232, 232, 228]; // #E8E8E4 scrim plane
  var AMBER    = [232, 163, 61];  // #E8A33D sun-boundary amber
  var NOON     = [251, 248, 240]; // #FBF8F0 noon white
  var MIDNIGHT = [14, 15, 18];    // #0E0F12 midnight

  var LAT_RAD = 40 * Math.PI / 180; // fixed mid-latitude for the solar model

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    try {
      var sw = window.screen ? window.screen.width : 0;
      var sh = window.screen ? window.screen.height : 0;
      var mn = Math.min(sw, sh);
      if (mn > 0 && mn < 700) return true;
    } catch (e) {}
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
  window.addEventListener("resize", resize);
  resize();

  // mulberry32: seeded stream for the per-strip plaster jitter.
  function makeRng(seed) {
    var s = seed | 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var jitter = [];
  (function buildJitter() {
    var rng = makeRng(755021);
    for (var i = 0; i < 256; i++) jitter.push(rng() * 2 - 1);
  })();

  // QA hook only: ?seed=tH:MM forces the program minute (inert otherwise).
  function minuteOverride() {
    try {
      var search = "";
      try { search = window.location.search || ""; } catch (e1) {}
      if (!search) { try { search = location.search || ""; } catch (e2) {} }
      var m = /[?&]seed=([^&]*)/.exec(search);
      if (!m) return -1;
      var t = /^t(\d{1,2}):(\d{2})$/.exec(decodeURIComponent(m[1]));
      if (!t) return -1;
      return (parseInt(t[1], 10) * 60 + parseInt(t[2], 10)) % 1440;
    } catch (e) { return -1; }
  }
  var OVERRIDE = minuteOverride();

  // The program clock: local date + local minute-of-day, nothing finer.
  // Date is read only at (year, month, day, hour, minute) resolution, so the
  // frame is constant inside any minute and back-to-back renders agree.
  function programClock() {
    var now = new Date();
    var minute = now.getHours() * 60 + now.getMinutes();
    if (OVERRIDE >= 0) minute = OVERRIDE;
    return {
      year: now.getFullYear(), month: now.getMonth(), day: now.getDate(),
      minute: minute
    };
  }

  // Simple solar model: declination from day-of-year, fixed 40 deg latitude,
  // solar noon at 12:00 local. Returns sunrise/sunset minutes, the sun's
  // elevation for the given minute, and day progress q in [0,1] (-1 at night).
  function sunState(year, month, day, minute) {
    var start = Date.UTC(year, 0, 0);
    var doy = Math.floor((Date.UTC(year, month, day) - start) / 86400000);
    var decl = -23.44 * Math.PI / 180 * Math.cos(2 * Math.PI * (doy + 10) / 365);
    var cosH = -Math.tan(LAT_RAD) * Math.tan(decl);
    if (cosH < -1) cosH = -1;
    if (cosH > 1) cosH = 1;
    var half = Math.acos(cosH) * 180 / Math.PI / 15 * 60; // minutes of half-day
    var rise = 720 - half, set = 720 + half;
    var ha = (minute - 720) * 0.25 * Math.PI / 180; // hour angle, 15 deg/hour
    var sinAlt = Math.sin(LAT_RAD) * Math.sin(decl) +
                 Math.cos(LAT_RAD) * Math.cos(decl) * Math.cos(ha);
    if (sinAlt < -1) sinAlt = -1;
    if (sinAlt > 1) sinAlt = 1;
    var altDeg = Math.asin(sinAlt) * 180 / Math.PI;
    var q = -1;
    if (minute >= rise && minute <= set) q = (minute - rise) / (set - rise);
    return { rise: rise, set: set, sinAlt: sinAlt, altDeg: altDeg, q: q };
  }

  function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
  function mix(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  function css(c, a) {
    return "rgba(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + "," + a + ")";
  }
  function smooth(a, b, x) {
    var t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  }

  function draw() {
    if (W <= 0 || H <= 0) return;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var clock = programClock();
    var sun = sunState(clock.year, clock.month, clock.day, clock.minute);
    var sinAlt = sun.sinAlt;

    // Boundary position and the dusk mirror. Solar azimuth advances
    // monotonically through the day, so the boundary is a function of day
    // progress q: it sweeps from 0.14 of the frame at sunrise to 0.86 at
    // sunset. The light field sits left of it in the morning; across solar
    // noon the arrangement crossfades (sideMix) until the light field sits
    // right of the boundary, the mirror the prompt specifies. At night the
    // room holds the dusk arrangement, deep and still.
    var bx, sideMix;
    if (sun.q >= 0) {
      bx = sun.q <= 0.5 ? 0.14 + 0.72 * sun.q : 0.50 + 0.72 * (sun.q - 0.5);
      sideMix = smooth(0.44, 0.56, sun.q);
    } else {
      bx = 0.86;
      sideMix = 1;
    }
    var bxPx = bx * W;

    // Luminance from elevation. Dayness ramps just before sunrise; the
    // amber glow g peaks with the sun near the horizon (dawn and dusk).
    var dayness = clamp((sinAlt + 0.06) / 0.22, 0, 1);
    var g = clamp(1 - Math.abs(sun.altDeg - 1) / 12, 0, 1);

    // Light field base: a faint warm remnant at night, the warm light-half
    // tone through the day, flaring toward noon white as the sun climbs.
    var lightBase = mix(mix(MIDNIGHT, LIGHT, 0.16), LIGHT, dayness);
    lightBase = mix(lightBase, NOON, clamp((sinAlt - 0.30) / 0.25, 0, 1) * 0.8);
    // Dark field base: midnight at night, the held dark tone by day, with a
    // slight lift near noon so the dark half is never absolute at midday.
    var darkBase = mix(MIDNIGHT, DARK, clamp((sinAlt + 0.10) / 0.18, 0, 1));
    darkBase = mix(darkBase, LIGHT, 0.07 * clamp(sinAlt / 0.5, 0, 1));

    // Field tones as a function of t = distance from the boundary,
    // normalized by the field's own width (0 at the scrim, 1 at the wall).
    function lightTone(t) {
      var inner = mix(lightBase, AMBER, 0.38 * g + 0.05);
      var outer = mix(lightBase, DARK, 0.12);
      return mix(inner, outer, t);
    }
    function darkTone(t) {
      var inner = mix(darkBase, AMBER, 0.30 * g);
      inner = mix(inner, SCRIM, 0.10);
      var outer = mix(darkBase, MIDNIGHT, 0.35);
      return mix(inner, outer, t);
    }

    // Page ground first (shows only if the canvas is ever smaller than the
    // frame), then the two fields as flat stepped vertical strips, about
    // 9 px each: no gradients anywhere in the piece.
    ctx.fillStyle = css(MIDNIGHT, 1);
    ctx.fillRect(0, 0, W, H);

    var STEP = 9;
    var i, x0, x1, cx, t, jl, jr, colL, colR;

    // Left field: boundary at its right edge.
    var nL = Math.max(1, Math.ceil(bxPx / STEP));
    for (i = 0; i < nL; i++) {
      x0 = i * STEP;
      x1 = Math.min(bxPx, x0 + STEP);
      cx = (x0 + x1) / 2;
      t = bxPx > 0 ? 1 - cx / bxPx : 0;
      jl = 1 + 0.012 * jitter[i % 256];
      colL = mix(lightTone(t), darkTone(t), sideMix);
      ctx.fillStyle = css([colL[0] * jl, colL[1] * jl, colL[2] * jl], 1);
      ctx.fillRect(x0 - 0.5, 0, (x1 - x0) + 1, H);
    }
    // Right field: boundary at its left edge.
    var rW = W - bxPx;
    var nR = Math.max(1, Math.ceil(rW / STEP));
    for (i = 0; i < nR; i++) {
      x0 = bxPx + i * STEP;
      x1 = Math.min(W, x0 + STEP);
      cx = (x0 + x1) / 2;
      t = rW > 0 ? (cx - bxPx) / rW : 0;
      jr = 1 + 0.012 * jitter[(i + 128) % 256];
      colR = mix(darkTone(t), lightTone(t), sideMix);
      ctx.fillStyle = css([colR[0] * jr, colR[1] * jr, colR[2] * jr], 1);
      ctx.fillRect(x0 - 0.5, 0, (x1 - x0) + 1, H);
    }

    // Amber boundary glow: stepped strips with a raised-cosine falloff,
    // alpha driven by g, so the boundary warms at dawn and dusk and cools
    // to nothing under a high sun or a deep night.
    if (g > 0.01) {
      var gHalf = Math.max(24, W * 0.085);
      var GN = 13;
      for (i = 0; i < GN; i++) {
        var gt = -1 + 2 * (i + 0.5) / GN;
        var prof = Math.pow(Math.cos(gt * Math.PI / 2), 1.5);
        if (prof <= 0) continue;
        var gx0 = bxPx + (gt - 1 / GN) * gHalf;
        var gx1 = bxPx + (gt + 1 / GN) * gHalf;
        ctx.fillStyle = css(AMBER, 0.30 * g * prof);
        ctx.fillRect(gx0, 0, gx1 - gx0 + 1, H);
      }
    }

    // The scrim plane: a translucent band centered on the boundary, eleven
    // stepped strips with a raised-cosine alpha profile. Its tint leans
    // warm when the lit field dominates or the boundary glows, cool when
    // the dark field dominates, per the prompt.
    var lightShare = bx + (1 - 2 * bx) * sideMix;
    var warmth = clamp(lightShare * 0.55 + g * 0.6, 0, 1);
    var scrimCol = mix(mix(SCRIM, DARK, 0.30), mix(SCRIM, AMBER, 0.32), warmth);
    var sHalf = Math.max(10, W * 0.032);
    var SN = 11;
    for (i = 0; i < SN; i++) {
      var st = -1 + 2 * (i + 0.5) / SN;
      var sprof = Math.pow(Math.cos(st * Math.PI / 2), 1.3);
      var sx0 = bxPx + (st - 1 / SN) * sHalf;
      var sx1 = bxPx + (st + 1 / SN) * sHalf;
      ctx.fillStyle = css(scrimCol, 0.34 * sprof);
      ctx.fillRect(sx0, 0, sx1 - sx0 + 1, H);
    }
    // The scrim's tension edge: one brighter hairline at the boundary.
    ctx.fillStyle = css(scrimCol, 0.45);
    ctx.fillRect(bxPx - 0.5, 0, 1, H);
  }

  draw();

  if (typeof requestAnimationFrame === "function") {
    var loop = function () { draw(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
