<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wind Chimes, Prepared Copper</title>
<style>
  html, body { margin:0; padding:0; background:#0D0F12; height:100%; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';

// ---------- Wind Chimes, Prepared Copper — Jeff Kolar study JK5 ----------
// Nine prepared copper chimes hang from two tree limbs on a night field.
// The wind is the only performer: a 60 s weather cycle (15 s calm, a 20 s
// front, 25 s calm) drives every tube's swing through a closed-form
// two-partial pendulum. Where adjacent tubes meet, a copper ring expands
// and both tubes flash. Collisions are precomputed at load by sampling the
// same swing functions over the base cycle, so the rings are a score the
// weather wrote, repeated exactly each cycle. Dragging makes a local gust
// (the viewer is weather, not a player); gusts bend the swing live but the
// collision score stays the weather's. Frequencies are whole cycles per
// minute-window (k/60 Hz, second partial at round(1.47k)/60) so the 60 s
// loop is seamless. Silent: collisions are drawn, never heard.

var FIELD   = '#0D0F12';
var LIMB    = '#1A1C1E';
var WIRE    = '#3F454C';
var COPPER  = '#B87333';
var VERDI   = '#43B3AE';
var STRIKER = '#8C5A2B';
var STRIKER_CORE = '#5E3B1C';
var RING    = '#FFD9A0';
var FLASH   = '#FFD9A0';
var STREAK  = '#2E3436';
var CAPTION = '#4B5158';

var SEED = 222920;          // tuned: a collision lands 0.16 s before T0
var CYCLE = 60;             // weather cycle, seconds
var T0 = 24;                // fixed first-frame phase: inside the front

// geometry constants, in u = min(W,H) units (scale-invariant: the collision
// score is identical at every viewport size)
var SPACING = 0.075, HANG = 0.05, DISKR = 0.015, TUBEW = 0.017;
var HALFSPAN = 2.7 * SPACING, SAG = 0.018;
var RING_T = 1.4, FLASH_T = 0.25;

// ---------- seeded rng ----------
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------- weather ----------
function front(tc){
  if (tc < 15) return 0.25;
  if (tc < 18){ var f = (tc - 15) / 3; return 0.25 + 0.75 * (f * f * (3 - 2 * f)); }
  if (tc < 32) return 1.0;
  if (tc < 35){ var g = (tc - 32) / 3; return 1.0 - 0.75 * (g * g * (3 - 2 * g)); }
  return 0.25;
}

// ---------- chime model ----------
function buildChimes(){
  var rng = mulberry32(SEED);
  var chimes = [];
  var patA = [0.92, 0.74, 0.55, 0.36, 0.18];
  var patB = [0.85, 0.62, 0.40, 0.20];
  for (var c = 0; c < 2; c++){
    var pat = c === 0 ? patA : patB;
    for (var j = 0; j < pat.length; j++){
      var lenNorm = pat[j] + (rng() - 0.5) * 0.05;
      var phi = rng() * Math.PI * 2;
      var phi2 = rng() * Math.PI * 2;
      var base = 0.10 + 0.07 * rng();
      var dxj = (rng() - 0.5) * 0.014;
      var nP = 2 + Math.floor(rng() * 2);
      var patches = [];
      for (var k = 0; k < nP; k++) patches.push({ f0: 0.08 + 0.68 * rng(), fl: 0.07 + 0.13 * rng() });
      var k1 = Math.round((0.60 - 0.25 * lenNorm) * 60);
      var k2 = Math.round(k1 * 1.47);
      chimes.push({
        cluster: c, j: j, lenNorm: lenNorm,
        len: 0.19 + 0.21 * lenNorm,
        f1: k1 / 60, f2: k2 / 60,
        phi: phi, phi2: phi2, base: base, dxj: dxj, patches: patches
      });
    }
  }
  return chimes;
}
var CHIMES = buildChimes();

// pivot in u units: x relative to W/2, y relative to the cluster limb base
function pivotOf(ch){
  var centerOff = ch.cluster === 0 ? -0.20 : 0.20;
  var within = ch.cluster === 0 ? (ch.j - 2) * SPACING : (ch.j - 1.5) * SPACING;
  var off = within + ch.dxj;
  var baseY = ch.cluster === 0 ? 0 : 0.035;
  var y = baseY + SAG * (1 - Math.pow(off / HALFSPAN, 2));
  return { x: centerOff + off, y: y };
}

function thetaBase(ch, tm){
  var A = ch.base * front(tm);
  return A * Math.sin(2 * Math.PI * ch.f1 * tm + ch.phi)
       + 0.4 * A * Math.sin(2 * Math.PI * ch.f2 * tm + ch.phi2);
}

function tubeSegU(ch, tm){
  var p = pivotOf(ch);
  var th = thetaBase(ch, tm);
  var s = Math.sin(th), co = Math.cos(th);
  var topOff = HANG + DISKR * 0.8;
  var tipOff = topOff + ch.len;
  return {
    x1: p.x + topOff * s, y1: p.y + topOff * co,
    x2: p.x + tipOff * s, y2: p.y + tipOff * co
  };
}

// ---------- collision precompute (base weather only, no gusts) ----------
function segSegDist(a, b){
  function ptSeg(px, py, x1, y1, x2, y2){
    var dx = x2 - x1, dy = y2 - y1;
    var L2 = dx * dx + dy * dy;
    var t = L2 > 0 ? ((px - x1) * dx + (py - y1) * dy) / L2 : 0;
    t = Math.max(0, Math.min(1, t));
    var cx = x1 + t * dx, cy = y1 + t * dy;
    return { d: Math.sqrt((px - cx) * (px - cx) + (py - cy) * (py - cy)), x: cx, y: cy };
  }
  var best = { d: 1e9, x: 0, y: 0 };
  var cands = [
    ptSeg(a.x1, a.y1, b.x1, b.y1, b.x2, b.y2),
    ptSeg(a.x2, a.y2, b.x1, b.y1, b.x2, b.y2),
    ptSeg(b.x1, b.y1, a.x1, a.y1, a.x2, a.y2),
    ptSeg(b.x2, b.y2, a.x1, a.y1, a.x2, a.y2),
    ptSeg((a.x1 + a.x2) / 2, (a.y1 + a.y2) / 2, b.x1, b.y1, b.x2, b.y2),
    ptSeg((b.x1 + b.x2) / 2, (b.y1 + b.y2) / 2, a.x1, a.y1, a.x2, a.y2)
  ];
  for (var i = 0; i < cands.length; i++) if (cands[i].d < best.d) best = cands[i];
  return best;
}

function precompute(){
  var pairs = [];
  for (var i = 0; i < CHIMES.length - 1; i++){
    if (CHIMES[i].cluster === CHIMES[i + 1].cluster) pairs.push([i, i + 1]);
  }
  var events = [];
  var inside = [];
  for (var p0 = 0; p0 < pairs.length; p0++) inside.push(false);
  var touch = TUBEW * 1.05, rearm = TUBEW * 1.8, dt = 0.02;
  for (var t = 0; t < CYCLE; t += dt){
    var segs = [];
    for (var i2 = 0; i2 < CHIMES.length; i2++) segs.push(tubeSegU(CHIMES[i2], t));
    for (var p = 0; p < pairs.length; p++){
      var r = segSegDist(segs[pairs[p][0]], segs[pairs[p][1]]);
      if (!inside[p] && r.d < touch){
        inside[p] = true;
        events.push({ time: t, a: pairs[p][0], b: pairs[p][1], x: r.x, y: r.y });
      } else if (inside[p] && r.d > rearm){
        inside[p] = false;
      }
    }
  }
  return events;
}
var EVENTS = precompute();

// per-chime latest event time <= tm (for flashes), and active ring list
function eventAge(ev, tm){
  var age = tm - ev.time;
  if (age < 0) age += CYCLE;
  return age;
}

// ---------- wind streaks ----------
var STREAKS = (function(){
  var rng = mulberry32(SEED ^ 0x9e37);
  var arr = [];
  for (var i = 0; i < 42; i++){
    arr.push({
      bx: rng(), yf: rng(),
      speed: 0.05 + 0.08 * rng(),
      len: 0.03 + 0.04 * rng(),
      bobP: rng() * Math.PI * 2,
      aF: 0.55 + 0.45 * rng()
    });
  }
  return arr;
})();

// ---------- gusts (recorded drag events) ----------
var gusts = [];   // {x (px), t (piece time), s}
var dragging = false, lastGustT = -10;

// ---------- view / canvas ----------
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, lastT = T0;

function viewW(){
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  if (vv && vv.width) return vv.width;
  return window.innerWidth || 800;
}
function viewH(){
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  if (vv && vv.height) return vv.height;
  return window.innerHeight || 800;
}
function isPhone(){
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var mn = Math.min(sw || 9999, sh || 9999);
  if (mn < 700) return true;
  return H > W * 1.15;
}
function fit(){
  W = viewW(); H = viewH();
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}
if (window.visualViewport && window.visualViewport.addEventListener){
  window.visualViewport.addEventListener('resize', function(){ fit(); draw(lastT); });
}
if (window.addEventListener){
  window.addEventListener('resize', function(){ fit(); draw(lastT); });
}

function limbBaseY(cluster){ return 0.07 * H + (cluster === 1 ? 0.035 * Math.min(W, H) : 0); }

// swing angle including live gust amplitude (gusts never touch the score)
function thetaLive(ch, t, tm, u){
  var A = ch.base * front(tm);
  var p = pivotOf(ch);
  var px = W / 2 + p.x * u;
  for (var i = 0; i < gusts.length; i++){
    var g = gusts[i];
    var age = t - g.t;
    if (age <= 0) continue;
    A += 0.14 * g.s * Math.exp(-Math.abs(px - g.x) / (0.19 * u)) * Math.exp(-age / 2.5);
  }
  return A * Math.sin(2 * Math.PI * ch.f1 * tm + ch.phi)
       + 0.4 * A * Math.sin(2 * Math.PI * ch.f2 * tm + ch.phi2);
}

// ---------- draw ----------
function draw(t){
  lastT = t;
  var u = Math.min(W, H);
  var tm = t % CYCLE;
  ctx.fillStyle = FIELD;
  ctx.fillRect(0, 0, W, H);

  // wind streaks (absolute t: weather never jumps at the cycle seam)
  var fr = front(tm);
  ctx.strokeStyle = STREAK;
  ctx.lineWidth = Math.max(1, 0.0018 * u);
  ctx.lineCap = 'round';
  var span = W + 0.24 * u;
  for (var si = 0; si < STREAKS.length; si++){
    var st = STREAKS[si];
    var sx = ((st.bx * span + t * st.speed * u) % span) - 0.12 * u;
    var sy = st.yf * H + Math.sin(t * 0.7 + st.bobP) * Math.max(2, 0.004 * u);
    ctx.save();
    ctx.globalAlpha = 0.35 * fr * st.aF;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + st.len * u, sy);
    ctx.stroke();
    ctx.restore();
  }

  // limbs: sagged lines across the top
  ctx.strokeStyle = LIMB;
  ctx.lineWidth = Math.max(3, 0.006 * u);
  ctx.lineCap = 'round';
  for (var c = 0; c < 2; c++){
    var centerOff = c === 0 ? -0.20 : 0.20;
    var baseY = limbBaseY(c);
    ctx.beginPath();
    var steps = 28;
    for (var k = 0; k <= steps; k++){
      var off = centerOff - HALFSPAN - 0.05 + (2 * HALFSPAN + 0.10) * (k / steps);
      var rel = (off - centerOff);
      var sagF = Math.abs(rel) <= HALFSPAN ? SAG * (1 - Math.pow(rel / HALFSPAN, 2)) : 0;
      var lx = W / 2 + off * u, ly = baseY + sagF * u;
      if (k === 0) ctx.moveTo(lx, ly); else ctx.lineTo(lx, ly);
    }
    ctx.stroke();
  }

  // prune dead gusts
  while (gusts.length && t - gusts[0].t > 9) gusts.shift();

  // flash state per chime
  var flash = [];
  for (var fi = 0; fi < CHIMES.length; fi++) flash.push(false);
  for (var ei = 0; ei < EVENTS.length; ei++){
    var ageF = eventAge(EVENTS[ei], tm);
    if (ageF < FLASH_T){ flash[EVENTS[ei].a] = true; flash[EVENTS[ei].b] = true; }
  }

  // chimes
  for (var i = 0; i < CHIMES.length; i++){
    var ch = CHIMES[i];
    var p = pivotOf(ch);
    var pivX = W / 2 + p.x * u;
    var pivY = 0.07 * H + p.y * u;   // p.y carries the cluster-B 0.035u offset and the sag
    var th = thetaLive(ch, t, tm, u);
    var s = Math.sin(th), co = Math.cos(th);
    function pt(off){ return { x: pivX + off * u * s, y: pivY + off * u * co }; }
    var diskC = pt(HANG);
    var tubeTop = pt(HANG + DISKR * 0.8);
    var tip = pt(HANG + DISKR * 0.8 + ch.len);

    // hanger wire
    ctx.strokeStyle = WIRE;
    ctx.lineWidth = Math.max(1, 0.0022 * u);
    ctx.beginPath();
    ctx.moveTo(pivX, pivY);
    ctx.lineTo(diskC.x, diskC.y);
    ctx.stroke();

    // tube (flash washes over patches)
    ctx.lineCap = 'round';
    if (flash[i]){
      ctx.strokeStyle = FLASH;
      ctx.lineWidth = TUBEW * u;
      ctx.beginPath();
      ctx.moveTo(tubeTop.x, tubeTop.y);
      ctx.lineTo(tip.x, tip.y);
      ctx.stroke();
    } else {
      ctx.strokeStyle = COPPER;
      ctx.lineWidth = TUBEW * u;
      ctx.beginPath();
      ctx.moveTo(tubeTop.x, tubeTop.y);
      ctx.lineTo(tip.x, tip.y);
      ctx.stroke();
      // verdigris patches
      ctx.strokeStyle = VERDI;
      ctx.lineWidth = TUBEW * u * 0.98;
      for (var pi = 0; pi < ch.patches.length; pi++){
        var pa = ch.patches[pi];
        var ax = tubeTop.x + (tip.x - tubeTop.x) * pa.f0;
        var ay = tubeTop.y + (tip.y - tubeTop.y) * pa.f0;
        var bx = tubeTop.x + (tip.x - tubeTop.x) * (pa.f0 + pa.fl);
        var by = tubeTop.y + (tip.y - tubeTop.y) * (pa.f0 + pa.fl);
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.stroke();
      }
    }

    // striker disk
    ctx.fillStyle = flash[i] ? FLASH : STRIKER;
    ctx.beginPath();
    ctx.moveTo(diskC.x + DISKR * u, diskC.y);
    ctx.arc(diskC.x, diskC.y, DISKR * u, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = STRIKER_CORE;
    ctx.beginPath();
    ctx.moveTo(diskC.x + DISKR * u * 0.4, diskC.y);
    ctx.arc(diskC.x, diskC.y, DISKR * u * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  // collision rings (the score, drawn over the tubes)
  for (var ri = 0; ri < EVENTS.length; ri++){
    var ev = EVENTS[ri];
    var age = eventAge(ev, tm);
    if (age >= RING_T) continue;
    var cl = CHIMES[ev.a].cluster;
    var ex = W / 2 + ev.x * u;
    var ey = 0.07 * H + ev.y * u;
    var f = age / RING_T;
    var step = Math.floor(f * 5);
    var alpha = 0.55 * (1 - step * 0.2);
    var r = Math.max(1.5, 8 * TUBEW * u * f);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = RING;
    ctx.lineWidth = Math.max(1.2, 0.0028 * u);
    ctx.beginPath();
    ctx.moveTo(ex + r, ey);
    ctx.arc(ex, ey, r, 0, Math.PI * 2);
    ctx.stroke();
    if (age < 0.5){
      ctx.globalAlpha = 0.55 * (1 - age / 0.5);
      ctx.fillStyle = RING;
      ctx.beginPath();
      var sr = Math.max(1.5, 0.006 * u);
      ctx.moveTo(ex + sr, ey);
      ctx.arc(ex, ey, sr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // caption
  ctx.fillStyle = CAPTION;
  ctx.font = '11px ui-monospace, Menlo, monospace';
  ctx.textAlign = 'left';
  ctx.fillText('S. Laflin St — wind performs', 14, H - 14);
}

// ---------- interaction: drag = local gust (weather, not playing) ----------
function addGust(x){
  gusts.push({ x: x, t: lastT, s: 0.7 });
  if (gusts.length > 80) gusts.shift();
  lastGustT = lastT;
}
function ptrDown(x){
  dragging = true;
  addGust(x);
  draw(lastT);
}
function ptrMove(x){
  if (!dragging) return;
  if (lastT - lastGustT > 0.06){ addGust(x); draw(lastT); }
}
function ptrUp(){ dragging = false; }
if (canvas.addEventListener){
  canvas.addEventListener('pointerdown', function(e){ ptrDown(e.clientX || 0); });
  canvas.addEventListener('pointermove', function(e){ ptrMove(e.clientX || 0); });
  canvas.addEventListener('pointerup', ptrUp);
  canvas.addEventListener('mousedown', function(e){ ptrDown(e.clientX || 0); });
  canvas.addEventListener('mousemove', function(e){ ptrMove(e.clientX || 0); });
  canvas.addEventListener('mouseup', ptrUp);
  canvas.addEventListener('touchstart', function(e){
    if (e.touches && e.touches[0]) ptrDown(e.touches[0].clientX || 0);
  });
  canvas.addEventListener('touchmove', function(e){
    if (e.touches && e.touches[0]) ptrMove(e.touches[0].clientX || 0);
  });
  canvas.addEventListener('touchend', ptrUp);
}

// ---------- run ----------
function clockNow(){
  if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
  return Date.now() / 1000;
}
fit();
draw(T0);
var boot = clockNow();
function frame(){
  draw(T0 + (clockNow() - boot));
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
