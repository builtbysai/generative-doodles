<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№61 · Momentary Composition</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#070707; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(245,233,201,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to scrub the fade</div>
<script>
'use strict';
const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '61', 10) || 0;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
const ctx = canvas.getContext('2d');
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}
function smooth(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }

const PALETTE=['#d92b2b','#1e5fc4','#2cae57','#f28c1e','#a8328a','#1fb3cc','#f5e9c9'];
function comp(s){
  const rng=mulberry(s*7919+1013);
  const n=26+Math.floor(rng()*15);
  const shapes=[];
  for(let i=0;i<n;i++){
    const sizeFrac = i<4 ? 0.35+rng()*0.25 : 0.08+rng()*0.22;
    let fx=0.5, fy=0.5;
    for(let a=0;a<24;a++){
      fx=rng(); fy=rng();
      let ok=true;
      for(const o of shapes){ const dx=(o.fx-fx), dy=(o.fy-fy); if(Math.sqrt(dx*dx+dy*dy)<0.04){ ok=false; break; } }
      if(ok) break;
    }
    shapes.push({fx,fy,sizeFrac,type:Math.floor(rng()*3),color:PALETTE[Math.floor(rng()*PALETTE.length)],alpha:0.35+rng()*0.55});
  }
  return shapes;
}
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}
function drawComp(s,w,h,scale){
  const shapes=comp(s);
  const S=Math.min(w,h);
  for(const sh of shapes){
    const sz=sh.sizeFrac*S, x=sh.fx*w, y=sh.fy*h;
    ctx.globalAlpha=sh.alpha*scale;
    ctx.fillStyle=sh.color;
    if(sh.type===0){ ctx.beginPath(); ctx.arc(x,y,sz/2,0,Math.PI*2); ctx.fill(); }
    else if(sh.type===1){ ctx.fillRect(x-sz/2,y-sz/2,sz,sz); }
    else { rrect(x-sz/2,y-sz*0.32,sz,sz*0.64,sz*0.16); ctx.fill(); }
  }
  ctx.globalAlpha=1;
}
let baseSeed=seed*1000+7;
let drag61=null;
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#070707'; ctx.fillRect(0,0,w,h);
  const t=nowMs/1000, cycle=Math.floor(t/9), within=t-cycle*9;
  let fade = within>7.8 ? smooth((within-7.8)/1.2) : 0;
  if(drag61){
    fade=Math.max(0,Math.min(1,fade + drag61.dx/w));
    if(drag61.dy>70 && !drag61.fired){ baseSeed += (cycle+2)*131; drag61.fired=true; }
  }
  const cur=baseSeed+cycle, nxt=baseSeed+cycle+1;
  if(fade<=0){ drawComp(cur,w,h,1); }
  else if(fade>=1){ drawComp(nxt,w,h,1); }
  else { drawComp(cur,w,h,1); ctx.save(); ctx.globalAlpha=1; drawComp(nxt,w,h,fade); ctx.restore(); }
  return {};
}
function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(4500);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
canvas.addEventListener('pointerdown',ev=>{ drag61={sx:ev.clientX,sy:ev.clientY,dx:0,dy:0,fired:false}; });
canvas.addEventListener('pointermove',ev=>{ if(!drag61) return; drag61.dx=ev.clientX-drag61.sx; drag61.dy=ev.clientY-drag61.sy; });
function end61(){ drag61=null; }
canvas.addEventListener('pointerup',end61); canvas.addEventListener('pointercancel',end61);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
