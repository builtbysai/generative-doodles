<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Lattice</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // №1144 "Block Lattice" — Rosa Menkman study block RM1 (DCT:Syphoning).
  // A procedural source — concentric rings and two diagonal bars — seen
  // through JPEG's macroblock grid. Each block is flat-filled with one of
  // five colors chosen by its dominant coefficient energy: DC luminance,
  // AC variance, chroma dominance. Quality breathes 90 -> 5 -> 90 over a
  // seamless 12 s loop, a diagonal wave modulates it locally, and every
  // descriptor snaps to hard quantization steps — no gradients, no blur,
  // no real encoding: the compression is computed, not performed.
  // Watch-only: no interaction at all.

  var TAU = Math.PI * 2;
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }

  var BG = '#0A0A0A';
  var GRID = '#333333';
  // the only five block fills
  var C_DARK = '#1A1A1A';   // near-zero energy
  var C_ORANGE = '#FF3B00'; // low DC fill
  var C_CYAN = '#00E5FF';   // high AC (edges)
  var C_YELLOW = '#FFD800'; // high DC (bright areas)
  var C_GREEN = '#7CFF00';  // chroma-dominant

  var T0 = 3.0;        // fixed first-frame phase: mid-loop, mid quality
  var LOOP = 12;       // seconds, seamless
  var N = 48;          // 48 x 48 macroblocks (>= 40 x 40)
  var SAMPLES = 5;     // 5 x 5 source samples per block

  // ---------- phone detection ----------
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var minScreen = Math.min(sw || 9999, sh || 9999);
  var isPhone = minScreen < 700 || (sh > sw * 1.15 && minScreen < 900);
  // (the lattice is identical on phones; the flag is kept for house parity)

  // ---------- view / canvas ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, GEO = null;

  function viewW() {
    if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight || 800;
  }
  function fit() {
    W = viewW(); H = viewH();
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var S = Math.min(W, H);
    GEO = { S: S, ox: (W - S) / 2, oy: (H - S) / 2, cell: S / N };
  }

  // ---------- the source: a function, never an image ----------
  // Returns [luminance 0..1, chroma 0..1]. Concentric rings around an
  // off-centre point, cut by two diagonal bars of different chroma weight.
  function src(u, v) {
    var lum = 0.04, chroma = 0.0;
    var dx = u - 0.40, dy = v - 0.42;
    var r = Math.sqrt(dx * dx + dy * dy);
    if (r < 0.68) {
      var fr = (r * 10) % 1;
      lum = fr < 0.58 ? 0.92 : 0.10;
      chroma = 0.25;
    }
    // bar 2 first (weaker chroma), then bar 1 over it (chroma-dominant)
    var t2 = u + 0.55 * v;
    if (Math.abs(t2 - 0.95) < 0.050) { if (0.78 > lum) lum = 0.78; chroma = 0.55; }
    var d1 = v - u;
    if (Math.abs(d1 - 0.28) < 0.055) { if (0.85 > lum) lum = 0.85; chroma = 0.95; }
    return [lum, chroma];
  }

  // ---------- quality field ----------
  // Base quality breathes 90 -> 5 -> 90 (triangle over the loop); a
  // diagonal wave travels across the field once per cycle. The result is
  // snapped to 8 hard steps, so quality changes arrive as terraces.
  function qualityNorm(bx, by, p) {
    var tri = p < 0.5 ? 2 * p : 2 - 2 * p;
    var base = 1 - tri; // 1 = Q90, 0 = Q5
    var diag = (bx + by) / (2 * (N - 1));
    var wave = 0.38 * Math.sin(TAU * (diag * 2 - p));
    var q = clamp(base + wave, 0, 1);
    return Math.floor(q * 7.999) / 7; // 8 hard steps: 0, 1/7, ..., 1
  }

  function snap(x, steps) {
    return Math.round(x * (steps - 1)) / (steps - 1);
  }

  // ---------- block color from its snapped descriptor ----------
  function blockColor(bx, by, qNorm) {
    var steps = 2 + Math.round(qNorm * 6);        // 2..8 descriptor steps
    var stepsC = steps + 3;                        // chroma snaps finer, stays classifiable
    var u0 = bx / N, v0 = by / N, du = 1 / N, dv = 1 / N;
    var sum = 0, sumC = 0, vals = [], i, j;
    for (j = 0; j < SAMPLES; j++) {
      for (i = 0; i < SAMPLES; i++) {
        var s = src(u0 + (i + 0.5) / SAMPLES * du, v0 + (j + 0.5) / SAMPLES * dv);
        vals.push(s[0]); sum += s[0]; sumC += s[1];
      }
    }
    var n = vals.length;
    var dc = sum / n;
    var variance = 0;
    for (i = 0; i < n; i++) { var d = vals[i] - dc; variance += d * d; }
    var ac = clamp(Math.sqrt(variance / n) * 2.2, 0, 1); // AC energy
    var chroma = sumC / n;

    var dcQ = snap(dc, steps);
    var acQ = snap(ac, steps);
    var chQ = snap(chroma, stepsC);

    if (dcQ < 0.10 && acQ < 0.15) return C_DARK;
    if (acQ >= 0.45) return C_CYAN;
    if (chQ >= 0.60) return C_GREEN;
    if (dcQ >= 0.62) return C_YELLOW;
    return C_ORANGE;
  }

  // ---------- draw ----------
  var lastT = T0;
  function draw(t) {
    fit();
    lastT = t;
    var p = ((t % LOOP) + LOOP) % LOOP / LOOP;
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    var cell = GEO.cell, ox = GEO.ox, oy = GEO.oy;
    var bx, by;
    // flat block fills (run-length merged per row where neighbours match)
    for (by = 0; by < N; by++) {
      var runColor = null, runStart = 0;
      for (bx = 0; bx <= N; bx++) {
        var c = bx < N ? blockColor(bx, by, qualityNorm(bx, by, p)) : null;
        if (c !== runColor) {
          if (runColor !== null) {
            ctx.fillStyle = runColor;
            ctx.fillRect(ox + runStart * cell, oy + by * cell,
                         (bx - runStart) * cell + 0.5, cell + 0.5);
          }
          runColor = c; runStart = bx;
        }
      }
    }
    // the 1px macroblock grid, always on top
    ctx.strokeStyle = GRID;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (bx = 0; bx <= N; bx++) {
      var x = Math.round(ox + bx * cell) + 0.5;
      ctx.moveTo(x, oy); ctx.lineTo(x, oy + GEO.S);
    }
    for (by = 0; by <= N; by++) {
      var y = Math.round(oy + by * cell) + 0.5;
      ctx.moveTo(ox, y); ctx.lineTo(ox + GEO.S, y);
    }
    ctx.stroke();
  }

  if (window.addEventListener) {
    window.addEventListener('resize', function () { draw(lastT); });
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { draw(lastT); });
  }

  // ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
  draw(T0);

  var startStamp = null;
  function frame(stamp) {
    if (startStamp === null) startStamp = stamp;
    draw(T0 + (stamp - startStamp) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
