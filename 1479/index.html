<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Last Three Tapes</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e0d0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var WALL = '#e8e0d0';
  var WOOD = '#8a6a48';
  var GOLD = '#e0b26a';
  var WHITE = '#f5f0e2';
  var AMBER = '#d99a4a';
  var NIGHT = '#5a6a7a';
  var GLOW = '#d9a441';
  var BOXES = ['#4a5a7a', '#6b4a3a', '#2f4636'];

  var DAY_LEN = 96; // seconds per full day loop
  var BOOT = true;

  // Day keyframes: fraction -> [light color, overlay alpha, sun angle deg]
  var KEYS = [
    [0.00, GOLD, 0.14, -65],
    [0.25, WHITE, 0.05, -5],
    [0.50, AMBER, 0.16, 65],
    [0.75, NIGHT, 0.32, 70],
    [1.00, GOLD, 0.14, -65]
  ];

  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function lerpColor(a, b, f) {
    var ca = hexRgb(a), cb = hexRgb(b);
    return 'rgb(' + Math.round(ca[0] + (cb[0] - ca[0]) * f) + ',' +
      Math.round(ca[1] + (cb[1] - ca[1]) * f) + ',' +
      Math.round(ca[2] + (cb[2] - ca[2]) * f) + ')';
  }
  function sampleDay(d) {
    var i = 0;
    while (i < KEYS.length - 2 && d >= KEYS[i + 1][0]) i++;
    var k0 = KEYS[i], k1 = KEYS[i + 1];
    var f = (d - k0[0]) / (k1[0] - k0[0]);
    if (f < 0) f = 0; if (f > 1) f = 1;
    return {
      light: lerpColor(k0[1], k1[1], f),
      alpha: k0[2] + (k1[2] - k0[2]) * f,
      angle: k0[3] + (k1[3] - k0[3]) * f
    };
  }

  // Closed-form day state over piece time + recorded drag events.
  var offset = 0;      // total fractional days elapsed at anchor time
  var anchorT = 0;     // piece time of the anchor
  var dragging = false;
  var dragDay = 0;     // fractional day value while dragging
  var dragStartX = 0, dragStartDay = 0;

  function dayState(t) {
    if (dragging) {
      var dd = dragDay % 1; if (dd < 0) dd += 1;
      return { frac: dd, cycles: Math.floor(dragDay) };
    }
    var total = offset + (t - anchorT) / DAY_LEN;
    var frac = total % 1; if (frac < 0) frac += 1;
    return { frac: frac, cycles: Math.floor(total) };
  }

  function viewport() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    return { w: w, h: h };
  }
  function isPhone() {
    var s = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (s && s.width && s.height) return Math.min(s.width, s.height) < 700;
    var v = viewport();
    return v.h > v.w * 1.15;
  }

  // Layout in fractions of W/H. Room centered; window left, table+chair right,
  // shelf above the table, three tape boxes in a row on the shelf.
  function layout(W, H) {
    var u = Math.min(W, H);
    var room = { x: 0, y: 0, w: W, h: H };
    if (!isPhone()) {
      var rw = Math.min(W, H * 1.35);
      room = { x: (W - rw) / 2, y: 0, w: rw, h: H };
    }
    var win = { x: room.x + room.w * 0.07, y: room.h * 0.14, w: room.w * 0.26, h: room.h * 0.42 };
    var shelfY = room.h * 0.46;
    var shelf = { x: room.x + room.w * 0.50, y: shelfY, w: room.w * 0.44, h: Math.max(8, u * 0.012) };
    var boxW = room.w * 0.10, boxH = room.h * 0.11;
    var boxes = [];
    for (var i = 0; i < 3; i++) {
      boxes.push({
        x: shelf.x + shelf.w * 0.08 + i * (boxW + room.w * 0.045),
        y: shelfY - boxH, w: boxW, h: boxH
      });
    }
    var table = {
      x: room.x + room.w * 0.52, y: room.h * 0.66, w: room.w * 0.26, h: Math.max(8, u * 0.014),
      legH: room.h * 0.16
    };
    var chair = {
      x: room.x + room.w * 0.83, y: room.h * 0.62, w: room.w * 0.09, h: room.h * 0.20
    };
    return { room: room, win: win, shelf: shelf, boxes: boxes, table: table, chair: chair };
  }

  function quad(x1, y1, x2, y2, x3, y3, x4, y4) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
  }

  function draw(t) {
    var v = viewport();
    var W = v.w, H = v.h;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    var L = layout(W, H);
    var st = dayState(t);
    var smp = sampleDay(st.frac);
    var glowIdx = ((st.cycles % 3) + 3) % 3;

    // Wall.
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);

    // Shadow geometry: skewed dark polygons whose length/direction follow
    // the light angle. Night shadows are faint.
    var ang = smp.angle * Math.PI / 180;
    var shAlpha = (st.frac > 0.62 && st.frac < 0.88) ? 0.10 : 0.22;
    var shLen = Math.tan(ang);
    function shadowFor(x, y, w, h) {
      var dx = shLen * h * 0.55;
      ctx.fillStyle = 'rgba(90,106,122,' + shAlpha.toFixed(4) + ')';
      quad(x, y + h, x + w, y + h, x + w + dx, y + h + h * 0.18, x + dx, y + h + h * 0.18);
    }

    // Floor light patch from the window, skewed by the light angle.
    var patchDx = shLen * L.win.h * 0.9;
    ctx.fillStyle = smp.light;
    ctx.globalAlpha = 0.28;
    quad(L.win.x, L.win.y + L.win.h, L.win.x + L.win.w, L.win.y + L.win.h,
      L.win.x + L.win.w + patchDx, L.win.y + L.win.h + H * 0.30,
      L.win.x + patchDx, L.win.y + L.win.h + H * 0.30);
    ctx.globalAlpha = 1;

    // Shadows (drawn before furniture so furniture sits on top).
    shadowFor(L.table.x, L.table.y, L.table.w, L.table.legH);
    shadowFor(L.chair.x, L.chair.y, L.chair.w, L.chair.h);
    shadowFor(L.shelf.x, L.shelf.y, L.shelf.w, 10);

    // Window: wood frame, panes filled with the current light color.
    ctx.fillStyle = WOOD;
    ctx.fillRect(L.win.x, L.win.y, L.win.w, L.win.h);
    var inset = Math.max(4, Math.min(L.win.w, L.win.h) * 0.05);
    ctx.fillStyle = smp.light;
    ctx.fillRect(L.win.x + inset, L.win.y + inset, L.win.w - inset * 2, L.win.h - inset * 2);
    ctx.fillStyle = WOOD;
    ctx.fillRect(L.win.x + L.win.w / 2 - inset / 2, L.win.y + inset, inset, L.win.h - inset * 2);
    ctx.fillRect(L.win.x + inset, L.win.y + L.win.h / 2 - inset / 2, L.win.w - inset * 2, inset);

    // Shelf board.
    ctx.fillStyle = WOOD;
    ctx.fillRect(L.shelf.x, L.shelf.y, L.shelf.w, L.shelf.h);

    // Three tape boxes in a row on the shelf; one glows faintly, in turn.
    for (var i = 0; i < 3; i++) {
      var b = L.boxes[i];
      if (i === glowIdx) {
        ctx.fillStyle = 'rgba(217,164,65,0.18)';
        ctx.fillRect(b.x - 6, b.y - 6, b.w + 12, b.h + 12);
        ctx.fillStyle = 'rgba(217,164,65,0.35)';
        ctx.fillRect(b.x - 3, b.y - 3, b.w + 6, b.h + 6);
      }
      ctx.fillStyle = BOXES[i];
      ctx.fillRect(b.x, b.y, b.w, b.h);
      if (i === glowIdx) {
        ctx.strokeStyle = GLOW;
        ctx.lineWidth = 2;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
      }
    }

    // Table: top + two legs.
    ctx.fillStyle = WOOD;
    ctx.fillRect(L.table.x, L.table.y, L.table.w, L.table.h);
    var legW = Math.max(6, L.table.w * 0.05);
    ctx.fillRect(L.table.x + 4, L.table.y + L.table.h, legW, L.table.legH);
    ctx.fillRect(L.table.x + L.table.w - 4 - legW, L.table.y + L.table.h, legW, L.table.legH);

    // Chair: back + seat + legs, right of the table.
    ctx.fillStyle = WOOD;
    ctx.fillRect(L.chair.x, L.chair.y, L.chair.w * 0.28, L.chair.h);
    ctx.fillRect(L.chair.x, L.chair.y + L.chair.h * 0.55, L.chair.w, L.chair.h * 0.10);
    ctx.fillRect(L.chair.x + 2, L.chair.y + L.chair.h * 0.65, Math.max(4, L.chair.w * 0.08), L.chair.h * 0.35);
    ctx.fillRect(L.chair.x + L.chair.w - 6, L.chair.y + L.chair.h * 0.65, Math.max(4, L.chair.w * 0.08), L.chair.h * 0.35);

    // Full-room light overlay: color and strength follow the day parameter.
    ctx.fillStyle = smp.light;
    ctx.globalAlpha = smp.alpha;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  function inWindow(x, y) {
    var v = viewport();
    var L = layout(v.w, v.h);
    return x >= L.win.x && x <= L.win.x + L.win.w && y >= L.win.y && y <= L.win.y + L.win.h;
  }

  function onDown(e) {
    var x = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0].clientX);
    var y = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0].clientY);
    if (x === undefined || !inWindow(x, y)) return;
    dragging = true;
    dragStartX = x;
    dragStartDay = currentDayFrac;
    dragDay = dragStartDay;
  }
  var currentDayFrac = 0;
  var currentCycles = 0;

  function onMove(e) {
    if (!dragging) return;
    var x = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0].clientX);
    if (x === undefined) return;
    var v = viewport();
    dragDay = dragStartDay + (x - dragStartX) / v.w;
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    offset = dragDay;
    anchorT = lastT;
  }
  var lastT = 0;

  function drawWrapped(t) {
    lastT = t;
    var st = dayState(t);
    currentDayFrac = st.frac;
    currentCycles = st.cycles;
    draw(t);
  }

  if (typeof window !== 'undefined' && canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown);
    canvas.addEventListener('touchmove', onMove);
    canvas.addEventListener('touchend', onUp);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { drawWrapped(lastT); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { drawWrapped(lastT); });
    }
  }

  // Frame one: constant phase, drawn synchronously at load.
  drawWrapped(0);
  BOOT = false;

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    drawWrapped((ts - start) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: drawWrapped,
      dayState: dayState,
      pointerDown: function (x, y) { onDown({ clientX: x, clientY: y }); },
      pointerMove: function (x, y) { onMove({ clientX: x, clientY: y }); },
      pointerUp: function () { onUp(); },
      layout: function () { var v = viewport(); return layout(v.w, v.h); }
    };
  }
})();
</script>
</body>
</html>
