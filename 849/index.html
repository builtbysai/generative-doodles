<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№849 Half Out of the Dark</title>
<style>
  html, body { margin: 0; padding: 0; background: #070605; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №849 Half Out of the Dark, IA3 / PP1249, study #261 iso-attrill.
  // Half a face emerges from near-total black, one wide eye catching
  // the light. The darkness is a curtain the face pushes through:
  // the face pushes slightly further out, then recedes, on a slow
  // ~90 s loop. The eye holds a second longer than comfort allows.
  // Palette: near-black, one warm skin highlight. Face fragment left
  // of center, the rest of the frame swallowed. Watch-only.
  // No jump scares, no full reveal at any phase, no second figure.
  var GROUND = '#070605'; // page ground, the near-black itself

  // Fixed-phase first frame: FIRST_T = 15 s. Cycle 90 s. The push
  // e(t) = 0.30 + 0.55 * (0.5 - 0.5*cos(2*pi*t/90)): at t = 15 the
  // face is partway out (e = 0.4375), eye open; at t = 45 the push
  // peaks (e = 0.85) and still only half a face shows; at t = 0/90
  // the face rests deepest (e = 0.30). The eye blinks on a fixed
  // 14 s schedule, 0.4 s closed, so it is open at the first frame.
  var FIRST_T = 15;
  var CYCLE = 90;
  var SEED = 849;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palette: near-black, one warm skin highlight.
  var BLACK = [7, 6, 5];        // ground / darkness
  var BLACK2 = [5, 4, 3];       // deeper dark
  var SKIN_HI = [217, 178, 143]; // the one warm skin highlight
  var SKIN = [169, 127, 95];     // skin mid
  var SKIN_SH = [107, 74, 52];   // skin shadow
  var SKIN_DEEP = [58, 36, 24];  // skin deep shadow
  var HAIR = [16, 12, 10];
  var EYE_WHITE = [232, 221, 203];
  var IRIS = [46, 28, 18];
  var PUPIL = [10, 7, 5];
  var CATCH = [245, 234, 214];
  var LIP = [94, 58, 44];
  var CAPTION = [196, 182, 164]; // warm grey, readable on near-black

  // Curtain folds: fixed authored table (seeded once, identical
  // every load). Each fold is a soft dark mass hanging along the
  // curtain edge; its sway is a closed-form function of piece time.
  var foldRng = mulberry32(SEED * 13 + 5);
  var FOLDS = [];
  var fi;
  for (fi = 0; fi < 6; fi++) {
    FOLDS.push({
      y: 0.10 + fi * 0.14 + (foldRng() - 0.5) * 0.03,
      r: 0.09 + foldRng() * 0.07,
      phase: foldRng() * Math.PI * 2,
      speed: 0.9 + foldRng() * 0.5
    });
  }
  // Breathing motes in the dark: fixed positions, closed-form pulse.
  var moteRng = mulberry32(SEED * 29 + 11);
  var MOTES = [];
  var mi;
  for (mi = 0; mi < 9; mi++) {
    MOTES.push({
      x: 0.55 + moteRng() * 0.42,
      y: 0.06 + moteRng() * 0.88,
      r: 0.003 + moteRng() * 0.005,
      phase: moteRng() * Math.PI * 2
    });
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // The face lives inside a centered square of side U, so the
  // composition is identical on desktop, phone and thumb. On phones
  // the square sits mid-frame and the near-black ground fills the
  // rest, which is the same darkness, so nothing looks letterboxed.
  var U = 0, OX = 0, OY = 0;
  function faceFrame() {
    U = Math.min(W, H);
    OX = (W - U) / 2;
    OY = (H - U) / 2;
  }
  function X(f) { return OX + f * U; }
  function Y(f) { return OY + f * U; }

  // ---- Cycle -----------------------------------------------------
  // Push: 0.30 at rest, 0.85 at the peak (t = 45), back to 0.30.
  // The face never fully emerges: even at peak only half a face
  // is drawn, and the curtain still covers its right edge.
  function pushOf(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE;
    return 0.30 + 0.55 * (0.5 - 0.5 * Math.cos(2 * Math.PI * p / CYCLE));
  }
  // Eye openness: 1 except one 0.4 s blink per 14 s, closing and
  // opening smoothly. The eye holds open far longer than comfort.
  function eyeOf(t) {
    var p = ((t % 14) + 14) % 14;
    if (p < 13.4 || p >= 13.8) { return 1; }
    var q = (p - 13.4) / 0.4;
    return 1 - 0.92 * Math.sin(Math.PI * q);
  }
  // Darkness breathing: a slow swell, period 90 s, out of phase
  // with the push so the dark seems to answer the face.
  function breathOf(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE;
    return 0.5 + 0.5 * Math.sin(2 * Math.PI * p / CYCLE + 2.1);
  }
  function cycleState(t) {
    return { push: pushOf(t), eye: eyeOf(t), breath: breathOf(t) };
  }

  // ---- Face ------------------------------------------------------
  // Half a face, left of center, drawn in the square frame. The
  // fragment is only ever half a face: one eye, one brow, a hint
  // of nose bridge and mouth, the rest already gone into the dark.
  // dx shifts the whole fragment right as it pushes out; the eye
  // group gets a touch more parallax than the cheek.
  function drawFace(e, eyeOpen) {
    var dx = (e - 0.30) * 0.10 * U;
    var ex = dx + (e - 0.30) * 0.02 * U; // eye parallax

    ctx.save();
    ctx.translate(dx, 0);

    // Skin mass: forehead, cheek, jaw, chin. The right edge runs
    // down past the nose bridge and is swallowed by the curtain.
    var sg = ctx.createLinearGradient(X(0.14), Y(0.14), X(0.52), Y(0.86));
    sg.addColorStop(0, rgb(SKIN_HI));
    sg.addColorStop(0.45, rgb(SKIN));
    sg.addColorStop(0.8, rgb(SKIN_SH));
    sg.addColorStop(1, rgb(SKIN_DEEP));
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.moveTo(X(0.295), Y(0.155));
    ctx.bezierCurveTo(X(0.205), Y(0.175), X(0.165), Y(0.300), X(0.170), Y(0.430));
    ctx.bezierCurveTo(X(0.175), Y(0.560), X(0.205), Y(0.700), X(0.255), Y(0.790));
    ctx.bezierCurveTo(X(0.295), Y(0.855), X(0.370), Y(0.875), X(0.430), Y(0.840));
    ctx.bezierCurveTo(X(0.490), Y(0.805), X(0.520), Y(0.720), X(0.520), Y(0.600));
    ctx.bezierCurveTo(X(0.520), Y(0.430), X(0.500), Y(0.260), X(0.430), Y(0.180));
    ctx.bezierCurveTo(X(0.385), Y(0.150), X(0.340), Y(0.145), X(0.295), Y(0.155));
    ctx.closePath();
    ctx.fill();

    // Warm light pooling on the cheekbone and forehead.
    var lg = ctx.createRadialGradient(X(0.27), Y(0.33), 0, X(0.27), Y(0.33), 0.16 * U);
    lg.addColorStop(0, rgba(SKIN_HI, a4(0.55)));
    lg.addColorStop(1, rgba(SKIN_HI, 0));
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(X(0.43), Y(0.33));
    ctx.arc(X(0.27), Y(0.33), 0.16 * U, 0, Math.PI * 2);
    ctx.fill();

    // Cheek shadow falling toward the curtain.
    var cg = ctx.createLinearGradient(X(0.38), Y(0.30), X(0.52), Y(0.60));
    cg.addColorStop(0, rgba(SKIN_DEEP, 0));
    cg.addColorStop(1, rgba(SKIN_DEEP, a4(0.65)));
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.moveTo(X(0.38), Y(0.28));
    ctx.lineTo(X(0.52), Y(0.28));
    ctx.lineTo(X(0.52), Y(0.72));
    ctx.lineTo(X(0.42), Y(0.78));
    ctx.closePath();
    ctx.fill();

    // Hair: a dark mass over the forehead, melting into the black.
    ctx.fillStyle = rgb(HAIR);
    ctx.beginPath();
    ctx.moveTo(X(0.175), Y(0.330));
    ctx.bezierCurveTo(X(0.150), Y(0.200), X(0.210), Y(0.130), X(0.300), Y(0.130));
    ctx.bezierCurveTo(X(0.400), Y(0.130), X(0.470), Y(0.180), X(0.480), Y(0.260));
    ctx.bezierCurveTo(X(0.420), Y(0.190), X(0.330), Y(0.165), X(0.270), Y(0.195));
    ctx.bezierCurveTo(X(0.220), Y(0.220), X(0.190), Y(0.270), X(0.175), Y(0.330));
    ctx.closePath();
    ctx.fill();

    // Faint rim light where the hair meets the dark.
    ctx.strokeStyle = rgba(SKIN_HI, a4(0.28));
    ctx.lineWidth = Math.max(1, U * 0.002);
    ctx.beginPath();
    ctx.moveTo(X(0.180), Y(0.320));
    ctx.bezierCurveTo(X(0.155), Y(0.205), X(0.215), Y(0.135), X(0.300), Y(0.132));
    ctx.stroke();

    ctx.restore();

    // Eye group, with its own parallax. One wide eye, catching
    // the light; it holds open, then blinks on the fixed schedule.
    ctx.save();
    ctx.translate(ex, 0);
    var ecx = X(0.315), ecy = Y(0.405);
    var ew = 0.115 * U, eh = 0.058 * U * eyeOpen;

    // Brow: a heavy dark arc above the eye.
    ctx.strokeStyle = rgb(HAIR);
    ctx.lineWidth = Math.max(2, U * 0.011);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(X(0.245), Y(0.325));
    ctx.quadraticCurveTo(X(0.315), Y(0.295), X(0.395), Y(0.330));
    ctx.stroke();

    // Sclera: a wide almond, dimmed warm white.
    ctx.fillStyle = rgb(EYE_WHITE);
    ctx.beginPath();
    ctx.moveTo(ecx - ew / 2, ecy);
    ctx.quadraticCurveTo(ecx - ew * 0.18, ecy - eh / 2 - U * 0.006, ecx + ew / 2, ecy - U * 0.004);
    ctx.quadraticCurveTo(ecx + ew * 0.18, ecy + eh / 2 + U * 0.004, ecx - ew / 2, ecy);
    ctx.closePath();
    ctx.fill();

    // Iris and pupil, wide open, looking straight out.
    var ir = Math.min(ew * 0.21, Math.max(eh * 0.42, U * 0.004));
    ctx.fillStyle = rgb(IRIS);
    ctx.beginPath();
    ctx.moveTo(ecx + ir, ecy);
    ctx.arc(ecx, ecy, ir, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb(PUPIL);
    ctx.beginPath();
    ctx.moveTo(ecx + ir * 0.55, ecy);
    ctx.arc(ecx, ecy, ir * 0.55, 0, Math.PI * 2);
    ctx.fill();

    // Catchlight: one small hard glint, the eye catching the light.
    ctx.fillStyle = rgb(CATCH);
    ctx.beginPath();
    ctx.moveTo(ecx - ir * 0.18 + U * 0.006, ecy - ir * 0.30);
    ctx.arc(ecx - ir * 0.18, ecy - ir * 0.30, Math.max(1.2, U * 0.006), 0, Math.PI * 2);
    ctx.fill();

    // Upper lid line, pressing down as the eye closes.
    ctx.strokeStyle = rgba(SKIN_DEEP, a4(0.85));
    ctx.lineWidth = Math.max(1, U * 0.0035);
    ctx.beginPath();
    ctx.moveTo(ecx - ew / 2, ecy - eh * 0.28);
    ctx.quadraticCurveTo(ecx, ecy - eh * 0.62, ecx + ew / 2, ecy - U * 0.004);
    ctx.stroke();
    ctx.restore();

    // Nose bridge: a soft shadow line and a warm highlight along
    // it, right where the face meets the curtain.
    ctx.save();
    ctx.translate(dx, 0);
    ctx.strokeStyle = rgba(SKIN_DEEP, a4(0.55));
    ctx.lineWidth = Math.max(1, U * 0.004);
    ctx.beginPath();
    ctx.moveTo(X(0.455), Y(0.430));
    ctx.bezierCurveTo(X(0.470), Y(0.500), X(0.475), Y(0.560), X(0.460), Y(0.610));
    ctx.stroke();
    ctx.strokeStyle = rgba(SKIN_HI, a4(0.45));
    ctx.lineWidth = Math.max(1, U * 0.003);
    ctx.beginPath();
    ctx.moveTo(X(0.440), Y(0.440));
    ctx.bezierCurveTo(X(0.452), Y(0.505), X(0.455), Y(0.555), X(0.445), Y(0.600));
    ctx.stroke();

    // Mouth: a faint hint, mostly in shadow, never a full mouth.
    ctx.fillStyle = rgba(LIP, a4(0.55));
    ctx.beginPath();
    ctx.moveTo(X(0.300), Y(0.690));
    ctx.quadraticCurveTo(X(0.345), Y(0.678), X(0.385), Y(0.692));
    ctx.quadraticCurveTo(X(0.345), Y(0.706), X(0.300), Y(0.690));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // ---- Darkness --------------------------------------------------
  // The curtain: near-black that swallows the right of the frame.
  // Its edge sits at curtainX(e) and slides right as the face
  // pushes out, never past the fragment's own edge, so no full
  // reveal is possible at any phase. Folds hang along the edge,
  // swaying on closed-form phases; the whole dark breathes.
  function drawDarkness(e, breath, t) {
    var curtainX = X(0.30 + 0.28 * e);

    // Solid dark from the curtain edge to the right of the frame.
    ctx.fillStyle = rgb(BLACK);
    ctx.fillRect(curtainX, 0, W - curtainX, H);

    // Soft gradient lip just left of the edge: the curtain's fold.
    var lip = ctx.createLinearGradient(curtainX - 0.07 * U, 0, curtainX, 0);
    lip.addColorStop(0, rgba(BLACK, 0));
    lip.addColorStop(1, rgba(BLACK, a4(0.92)));
    ctx.fillStyle = lip;
    ctx.fillRect(curtainX - 0.07 * U, OY, 0.07 * U, U);

    // Hanging folds along the edge, swaying slowly.
    var i, f;
    for (i = 0; i < FOLDS.length; i++) {
      f = FOLDS[i];
      var sway = Math.sin(2 * Math.PI * t * f.speed / CYCLE + f.phase) * 0.012 * U;
      var fade = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(2 * Math.PI * t / CYCLE + f.phase));
      ctx.fillStyle = rgba(BLACK2, a4(0.55 * fade));
      ctx.beginPath();
      ctx.moveTo(curtainX + sway + f.r * 0.7, Y(f.y));
      ctx.ellipse(curtainX + sway, Y(f.y), f.r * 0.7, f.r, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // The dark above and below the face: a slow breathing vignette
    // that deepens and lightens almost imperceptibly.
    var vg = ctx.createRadialGradient(
      X(0.33), Y(0.45), U * 0.10, X(0.33), Y(0.45), U * 0.75);
    vg.addColorStop(0, rgba(BLACK, 0));
    vg.addColorStop(0.55, rgba(BLACK, a4(0.10 + 0.10 * breath)));
    vg.addColorStop(1, rgba(BLACK, a4(0.55 + 0.25 * breath)));
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    // Faint motes drifting in the dark on the right, barely there.
    for (i = 0; i < MOTES.length; i++) {
      var m = MOTES[i];
      var pulse = 0.5 + 0.5 * Math.sin(2 * Math.PI * t / 47 + m.phase);
      ctx.fillStyle = rgba(SKIN_HI, a4(0.03 + 0.05 * pulse));
      ctx.beginPath();
      ctx.moveTo(X(m.x) + m.r * U, Y(m.y));
      ctx.arc(X(m.x), Y(m.y), m.r * U, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Frame -----------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
    faceFrame();

    var cs = cycleState(t);

    // Ground is the near-black itself.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawFace(cs.push, cs.eye);
    drawDarkness(cs.push, cs.breath, t);

    // Title plate, top left, and the hint, bottom center. Warm
    // grey stays readable over the near-black.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CAPTION, a4(0.72));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№849 · Half Out of the Dark', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(CAPTION, a4(0.55));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 09', W * 0.04, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(CAPTION, a4(0.75));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch only.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // Watch-only: no pointer listeners. The piece is watched,
  // never driven.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece849 exposes the cycle state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece849 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      state: function (t) { return cycleState(t); },
      push: function (t) { return pushOf(t); },
      eye: function (t) { return eyeOf(t); },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: a 90 s push and a slow blink, glacial.
  // Guarded so node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
