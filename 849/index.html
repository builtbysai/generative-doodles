<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greek Chorus</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B0B0B; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // ---------- Palette (strict) ----------
  var INK_A = '#0B0B0B';   // chord one
  var INK_B = '#111114';   // chord two
  var CHALK = '#E8E4DA';   // the Ha, the litany
  var GHOST = '#3A3A40';   // echo ghosts

  // ---------- Seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- Metronome ----------
  // 84 BPM, rock-steady. The loop never varies. Beat index = floor(t / PERIOD).
  var PERIOD = 60 / 84;
  var GHOST_LIFE = 24; // beats a ghost lives; pool is therefore ~24

  // ---------- Litany (original phrases, her register) ----------
  var LITANY = [
    'This is the sound of one syllable, keeping time.',
    'You are listening to a machine that learned to laugh politely.',
    'Nobody is on the line. The line is on.',
    'Hold still. The chorus is counting you.',
    'A laugh, repeated, becomes a kind of weather.',
    'The message repeats because the message is the repetition.',
    'Somewhere behind you, a door is deciding whether to close.',
    'Say it once and it is a joke. Say it forever and it is a law.'
  ];
  // Order for a given reseed epoch: identity for epoch 0, seeded shuffle after.
  function litanyOrder(epoch) {
    var order = [];
    for (var i = 0; i < LITANY.length; i++) order.push(i);
    if (epoch > 0) {
      var rnd = mulberry32(84900 + epoch * 131);
      for (var j = order.length - 1; j > 0; j--) {
        var k = Math.floor(rnd() * (j + 1));
        var tmp = order[j]; order[j] = order[k]; order[k] = tmp;
      }
    }
    return order;
  }

  // ---------- Recorded interaction (state is a pure function of these + t) ----------
  var tapTimes = [];    // raw tap times (seconds, piece clock)
  var dragSamples = []; // { t, target } orbit-tightness targets from horizontal drags

  // Derive events from raw taps: a pair of taps within 0.30 s is a double-tap
  // (reseed); a lone tap is an advance, effective 0.28 s after the tap.
  function derivedEvents() {
    var advances = 0, reseeds = 0;
    return function (t) {
      advances = 0; reseeds = 0;
      var i = 0;
      var times = tapTimes;
      while (i < times.length) {
        if (i + 1 < times.length && times[i + 1] - times[i] <= 0.30) {
          if (times[i + 1] <= t) reseeds++;
          i += 2;
        } else {
          if (times[i] + 0.28 <= t) advances++;
          i += 1;
        }
      }
      return { advances: advances, reseeds: reseeds };
    };
  }
  var eventsAt = derivedEvents();

  // Orbit tightness: 1.0 at rest; drag left tightens, drag right loosens.
  // Piecewise closed form: between samples it relaxes exponentially toward
  // the latest target (tau = 0.25 s); with no drag it sits at 1.0.
  function tightnessAt(t) {
    var val = 1.0, tPrev = 0, target = 1.0;
    for (var i = 0; i < dragSamples.length; i++) {
      var s = dragSamples[i];
      if (s.t > t) break;
      val = target + (val - target) * Math.exp(-(s.t - tPrev) / 0.25);
      tPrev = s.t; target = s.target;
    }
    return target + (val - target) * Math.exp(-(t - tPrev) / 0.25);
  }

  function litanyIndexAt(t, beat) {
    var ev = eventsAt(t);
    var order = litanyOrder(ev.reseeds);
    var idx = (Math.floor(beat / 16) + ev.advances) % LITANY.length;
    if (idx < 0) idx += LITANY.length;
    return LITANY[order[idx]];
  }

  // ---------- Ghost model (closed form in spawn beat and t) ----------
  function ghostFor(spawnBeat) {
    var rnd = mulberry32(849000 + (spawnBeat + 4096) * 7919);
    return {
      angle: rnd() * Math.PI * 2,
      spin: (rnd() - 0.5) * 0.10,       // slow tangential drift, rad per beat
      speed: 0.55 + rnd() * 0.5,        // radial speed factor
      size: 0.26 + rnd() * 0.16,        // fraction of the main glyph size
      wobble: rnd() * Math.PI * 2
    };
  }

  // ---------- Canvas / viewport ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;

  function viewportSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    return { w: w, h: h };
  }

  function resize() {
    var s = viewportSize();
    W = Math.max(1, Math.round(s.w)); H = Math.max(1, Math.round(s.h));
    canvas.width = W; canvas.height = H;
    var scrMin = 100000;
    if (typeof window !== 'undefined' && window.screen) {
      scrMin = Math.min(window.screen.width || 100000, window.screen.height || 100000);
    }
    isPhone = (scrMin < 700) || (H > W * 1.15);
    draw(currentT);
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  // ---------- Drawing ----------
  function draw(t) {
    if (!W || !H) return;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var beat = Math.floor(t / PERIOD);
    var beatPhase = (t - beat * PERIOD) / PERIOD; // 0 at the beat

    // Background: the two chords alternate on alternate beats.
    ctx.fillStyle = (beat % 2 === 0) ? INK_A : INK_B;
    ctx.fillRect(0, 0, W, H);

    var cx = W / 2, cy = H * 0.44;
    var minDim = Math.min(W, H);
    var tight = tightnessAt(t);

    // Echo ghosts: one spawned per beat, drifting outward, fading.
    // Drawn oldest first so the freshest ghost sits on top.
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var gb = beat - GHOST_LIFE; gb < beat; gb++) {
      var ageBeats = (t - gb * PERIOD) / PERIOD; // in beats
      if (ageBeats <= 0 || ageBeats >= GHOST_LIFE) continue;
      var g = ghostFor(gb);
      var frac = ageBeats / GHOST_LIFE;
      var radius = minDim * 0.46 * (1 - Math.pow(1 - frac, 1.6)) * g.speed * tight;
      var ang = g.angle + g.spin * ageBeats;
      var gx = cx + Math.cos(ang) * radius;
      var gy = cy + Math.sin(ang) * radius * 0.92;
      var alpha = Math.pow(1 - frac, 1.7) * 0.85;
      if (alpha <= 0.01) continue;
      var gSize = minDim * 0.30 * g.size * (0.8 + 0.45 * frac);
      ctx.font = '300 ' + gSize.toFixed(1) + 'px "Helvetica Neue", Helvetica, Arial, sans-serif';
      ctx.globalAlpha = alpha;
      ctx.fillStyle = GHOST;
      ctx.fillText('Ha', gx, gy);
    }
    ctx.globalAlpha = 1;

    // The Ha: one glyph, swelling briefly on each pulse, never varying its period.
    var swell = 1 + 0.16 * Math.exp(-beatPhase * 5.5);
    var haSize = minDim * (isPhone ? 0.34 : 0.30) * swell;
    ctx.font = '300 ' + haSize.toFixed(1) + 'px "Helvetica Neue", Helvetica, Arial, sans-serif';
    ctx.fillStyle = CHALK;
    ctx.globalAlpha = 0.96;
    ctx.fillText('Ha', cx, cy);
    ctx.globalAlpha = 1;

    // The litany: one deadpan line across the lower third.
    var phrase = litanyIndexAt(t, beat);
    var litSize = Math.max(13, minDim * (isPhone ? 0.036 : 0.030));
    ctx.font = '300 ' + litSize.toFixed(1) + 'px "Helvetica Neue", Helvetica, Arial, sans-serif';
    ctx.fillStyle = CHALK;
    ctx.globalAlpha = 0.78;
    ctx.fillText(phrase, cx, H * 0.80);
    ctx.globalAlpha = 1;
  }

  // ---------- Clock: elapsed since load, never a wall-clock date ----------
  var currentT = 0;
  var startStamp = null;
  function tick(now) {
    if (startStamp === null) startStamp = now;
    currentT = (now - startStamp) / 1000;
    draw(currentT);
    maybePlayBeat();
    if (typeof window !== 'undefined' && window.requestAnimationFrame) {
      window.requestAnimationFrame(tick);
    }
  }

  // ---------- Audio (lazy, first gesture only, all guarded) ----------
  var audioCtx = null, master = null, lastAudioBeat = -1;
  function ensureAudio() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
      return;
    }
    var AC = (typeof window !== 'undefined') ? (window.AudioContext || window.webkitAudioContext) : null;
    if (typeof AC !== 'function') return;
    try {
      audioCtx = new AC();
      var comp = audioCtx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.knee.value = 24; comp.ratio.value = 12;
      comp.connect(audioCtx.destination);
      master = audioCtx.createGain();
      master.gain.value = 0.8;
      master.connect(comp);
      lastAudioBeat = Math.floor(currentT / PERIOD);
    } catch (e) {
      audioCtx = null; master = null;
    }
  }
  function playHa(when) {
    // Short, abstract, quiet: a saw burst through a falling bandpass.
    var osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(320, when);
    osc.frequency.exponentialRampToValueAtTime(210, when + 0.14);
    var bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 2.5;
    bp.frequency.setValueAtTime(950, when);
    bp.frequency.exponentialRampToValueAtTime(480, when + 0.16);
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.10, when + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.20);
    osc.connect(bp); bp.connect(g); g.connect(master);
    osc.start(when); osc.stop(when + 0.24);
  }
  function playBass(when, beat) {
    var osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(beat % 2 === 0 ? 55 : 49, when); // A1 / G1
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.14, when + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 0.55);
    osc.connect(g); g.connect(master);
    osc.start(when); osc.stop(when + 0.6);
  }
  function maybePlayBeat() {
    if (!audioCtx || !master) return;
    var beat = Math.floor(currentT / PERIOD);
    if (beat > lastAudioBeat) {
      var when = audioCtx.currentTime + 0.01;
      playHa(when);
      playBass(when, beat);
      lastAudioBeat = beat;
    }
  }

  // ---------- Pointer: tap = advance, double-tap = reseed, drag = chorus orbits ----------
  var pDown = null;
  function pieceTime() { return currentT; }
  function onDown(e) {
    ensureAudio();
    var p = pointerPos(e);
    pDown = { x: p.x, y: p.y, t: pieceTime(), moved: false };
  }
  function onMove(e) {
    if (!pDown) return;
    var p = pointerPos(e);
    var dx = p.x - pDown.x;
    if (Math.abs(dx) > 8 || Math.abs(p.y - pDown.y) > 8) pDown.moved = true;
    if (pDown.moved) {
      var target = 1 + (dx / Math.max(1, W)) * 1.8;
      if (target < 0.5) target = 0.5;
      if (target > 1.7) target = 1.7;
      dragSamples.push({ t: pieceTime(), target: target });
      if (dragSamples.length > 400) dragSamples.shift();
    }
  }
  function onUp(e) {
    if (!pDown) return;
    if (!pDown.moved) tapTimes.push(pieceTime());
    pDown = null;
  }
  function pointerPos(e) {
    if (e && e.clientX !== undefined) return { x: e.clientX, y: e.clientY };
    if (e && e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e && e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: 0, y: 0 };
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    if (typeof window !== 'undefined' && window.PointerEvent) {
      canvas.addEventListener('pointerdown', onDown);
      canvas.addEventListener('pointermove', onMove);
      canvas.addEventListener('pointerup', onUp);
      canvas.addEventListener('pointercancel', onUp);
    } else {
      canvas.addEventListener('mousedown', onDown);
      canvas.addEventListener('mousemove', onMove);
      canvas.addEventListener('mouseup', onUp);
      canvas.addEventListener('touchstart', onDown, { passive: true });
      canvas.addEventListener('touchmove', onMove, { passive: true });
      canvas.addEventListener('touchend', onUp);
    }
  }

  // ---------- Go ----------
  resize();
  draw(0); // Frame one: a beat lands at t = 0, the Ha mid-swell, ghosts already drifting.
  if (typeof window !== 'undefined' && window.requestAnimationFrame) {
    window.requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
