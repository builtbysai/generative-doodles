<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.233 Radio Free Santa Fe</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FFFFFF; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.233 Radio Free Santa Fe (Matthew Kluber). After the 2019 title
// work: rhythmic horizontal stripes of lime green and cyan running
// full bleed, warm yellow green tones softening the top and bottom
// edges, and six rectangular blocks of colour interrupting the flow,
// three at the left, three at the right. Each block breathes on its
// own prime period clock, twenty three to fifty nine seconds, a slow
// inhale and exhale of opacity and scale, never a blink, never a
// flash. The blocks are painted colour, flat, no additive light.
// No radio imagery anywhere; the title is the only nod. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var LIME = '#BFF747', CYAN = '#35D6E8', ORANGE = '#FF8A00', VIOLET = '#7A2BE0', WARM = '#E8F08A';
var W = 0, H = 0, phone = false;
var T = 11, lastNow = -1; // frame one: blocks caught at differing breath phases

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// stripe layout: seeded heights, alternating lime / cyan
var STRIPES = [];
(function () {
  var rnd = mulberry32(233);
  var y = 0, i = 0;
  while (y < 1) {
    var h = 0.012 + rnd() * 0.020;
    if (y + h > 1) h = 1 - y;
    STRIPES.push({ y: y, h: h, color: (i % 2 === 0) ? LIME : CYAN });
    y += h; i++;
  }
})();

// six blocks: seeded positions and prime period clocks; phases then
// nudged so that at frame one (T = 11) one block breathes near full
// and one rests near empty, the rest scattered between.
var BLOCKS = [];
(function () {
  var rnd = mulberry32(7331);
  var periods = [23, 31, 47, 59, 37, 43];
  var cols = [ORANGE, VIOLET, ORANGE, VIOLET, ORANGE, VIOLET];
  var xs = [0.045, 0.135, 0.085, 0.855, 0.775, 0.905];
  var ys = [0.08, 0.38, 0.66, 0.20, 0.50, 0.74]; // staggered slots: blocks never overlap
  for (var i = 0; i < 6; i++) {
    BLOCKS.push({
      xf: xs[i],
      yf: ys[i] + (rnd() - 0.5) * 0.04,
      hf: 0.10 + rnd() * 0.06,
      color: cols[i],
      period: periods[i],
      phase: rnd() * Math.PI * 2
    });
  }
  function breathAt(b, t) { return 0.5 + 0.5 * Math.sin(2 * Math.PI * t / b.period + b.phase); }
  var hi = 0, lo = 0, k;
  for (k = 1; k < 6; k++) {
    if (breathAt(BLOCKS[k], T) > breathAt(BLOCKS[hi], T)) hi = k;
    if (breathAt(BLOCKS[k], T) < breathAt(BLOCKS[lo], T)) lo = k;
  }
  BLOCKS[hi].phase += (Math.PI / 2) - (2 * Math.PI * T / BLOCKS[hi].period + BLOCKS[hi].phase);
  BLOCKS[lo].phase += (Math.PI * 1.5) - (2 * Math.PI * T / BLOCKS[lo].period + BLOCKS[lo].phase);
})();

function panel() {
  var pw = W * (phone ? 1 : 0.94);
  var ph = pw / 2;
  if (ph > H * 0.94) { ph = H * 0.94; pw = ph * 2; }
  return { x: (W - pw) / 2, y: (H - ph) / 2, w: pw, h: ph };
}

function warmEdge(p, top) {
  // organic wavy band along one edge, warm yellow green
  var bh = p.h * 0.075, amp = p.h * 0.012, wl = p.w * 0.18;
  ctx.fillStyle = WARM;
  ctx.beginPath();
  var x, yBase = top ? p.y : p.y + p.h;
  ctx.moveTo(p.x, yBase);
  for (x = 0; x <= p.w; x += 8) {
    var wob = Math.sin(x / wl * Math.PI * 2 + (top ? 1.3 : 4.1)) * amp + Math.sin(x / (wl * 0.37) + 0.7) * amp * 0.4;
    var yy = top ? p.y + bh + wob : p.y + p.h - bh + wob;
    ctx.lineTo(p.x + x, yy);
  }
  ctx.lineTo(p.x + p.w, yBase);
  ctx.closePath();
  ctx.fill();
}

function draw() {
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, W, H);
  var p = panel();
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x, p.y, p.w, p.h); ctx.clip();
  for (var s = 0; s < STRIPES.length; s++) {
    ctx.fillStyle = STRIPES[s].color;
    ctx.fillRect(p.x, p.y + STRIPES[s].y * p.h, p.w, STRIPES[s].h * p.h + 1);
  }
  warmEdge(p, true);
  warmEdge(p, false);
  // the six blocks: flat painted colour breathing in opacity and scale
  var bw = p.w / 16;
  for (var i = 0; i < BLOCKS.length; i++) {
    var b = BLOCKS[i];
    var br = 0.5 + 0.5 * Math.sin(2 * Math.PI * T / b.period + b.phase);
    var shaped = Math.pow(br, 1.3);
    var alpha = 0.30 + 0.70 * shaped;
    var scale = 0.94 + 0.06 * br;
    var bh = b.hf * p.h * scale;
    var cx = p.x + b.xf * p.w + bw / 2;
    var cy = p.y + b.yf * p.h + (b.hf * p.h) / 2;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = b.color;
    ctx.fillRect(cx - (bw * scale) / 2, cy - bh / 2, bw * scale, bh);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
