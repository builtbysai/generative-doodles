<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.239 Ladder Ladder</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F5F1E8; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.239 Ladder Ladder (James Woodfill). "I tried to hack a
// table to turn it into a sculpture and it ended up back as a
// table... like LADDER LADDER, where a ladder was turned into a
// ladder." A ladder built out of small ladders: every rail a stack
// of tiny ladders, every rung a tiny ladder laid across, clamped
// and bolted at every joint, provisional and revisable. Drag any
// mini ladder and it pulls out of the assembly; let go and it
// springs home and the whole rig wobbles before it settles back
// into itself. No click to reload, ever.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#F5F1E8';
var BIRCH = '#D9B98A', POPLAR = '#C8A06A', STEEL = '#8A8A8A';
// Panel space 800 x 1000 units (4:5 portrait). The meta ladder
// stands in ladder space: rails at x -127 and +127, top y -360,
// foot y +360; the panel centre is the ladder centre.
var W = 0, H = 0, phone = false;
var T = 0, lastNow = -1;
var TILT = -2.5 * Math.PI / 180;
var wob = 0, wobV = 0; // whole-rig wobble angle and velocity

// Pieces: 6 mini ladders stacked per rail, 6 rung ladders across.
// Each carries a spring offset home.
var pieces = [];
(function build() {
  var i, segH = 720 / 6;
  for (var side = -1; side <= 1; side += 2) {
    for (i = 0; i < 6; i++) {
      pieces.push({
        hx: side * 127, hy: -360 + segH * (i + 0.5),
        w: 46, h: segH, horiz: false,
        col: (i + (side > 0 ? 1 : 0)) % 2 ? POPLAR : BIRCH,
        rot: ((i * 37 + (side > 0 ? 13 : 0)) % 5 - 2) * 0.6,
        ox: 0, oy: 0, vx: 0, vy: 0
      });
    }
  }
  for (i = 0; i < 6; i++) {
    pieces.push({
      hx: 0, hy: -360 + segH * (i + 0.5),
      w: 254, h: 44, horiz: true,
      col: i % 2 ? BIRCH : POPLAR,
      rot: ((i * 53) % 5 - 2) * 0.5,
      ox: 0, oy: 0, vx: 0, vy: 0
    });
  }
})();
// Neighbours: rail segments touch the segments above and below
// them and the rung ladder at their level; rungs touch both rails.
pieces.forEach(function (p, i) {
  p.nbrs = [];
  pieces.forEach(function (q, j) {
    if (i === j) return;
    var dx = Math.abs(p.hx - q.hx), dy = Math.abs(p.hy - q.hy);
    if ((dx < 10 && dy < 150) || (dy < 10 && dx < 290)) p.nbrs.push(j);
  });
});
// Loose offcuts scattered at the base.
var OFFCUTS = [
  { x: 170, y: 918, w: 62, h: 150, rot: 24 },
  { x: 585, y: 935, w: 56, h: 132, rot: -68 },
  { x: 668, y: 905, w: 48, h: 110, rot: 41 }
];
// Clamp joints: on each rail, at the five seams between segments
// and at the two ends.
var JOINTS = [];
for (var js = -1; js <= 1; js += 2)
  for (var ji = 0; ji <= 6; ji++) JOINTS.push({ x: js * 127, y: -360 + 120 * ji });

function panelRect() {
  var pw = Math.min(W * 0.96, H * 0.94 * 0.8);
  var ph = pw * 1.25;
  if (ph > H * 0.94) { ph = H * 0.94; pw = ph * 0.8; }
  return { x: (W - pw) / 2, y: (H - ph) / 2, s: pw / 800 };
}

// One mini ladder, centred at the origin, in its own space.
// horiz=false: stiles vertical, rungs across. horiz=true: the
// same ladder laid on its side.
function drawMini(w, h, horiz, col) {
  ctx.save();
  if (horiz) { ctx.rotate(Math.PI / 2); var tw = w; w = h; h = tw; }
  ctx.fillStyle = col;
  ctx.fillRect(-w / 2, -h / 2, 7, h);
  ctx.fillRect(w / 2 - 7, -h / 2, 7, h);
  var nr = Math.max(2, Math.round(h / 40));
  for (var i = 1; i <= nr; i++) {
    var y = -h / 2 + h * i / (nr + 1);
    ctx.fillRect(-w / 2 + 3, y - 3, w - 6, 6);
  }
  // bolts at the four stile ends
  ctx.fillStyle = STEEL;
  var bx = [-w / 2 + 3.5, w / 2 - 3.5], by = [-h / 2 + 8, h / 2 - 8];
  for (var a = 0; a < 2; a++) for (var b = 0; b < 2; b++) {
    ctx.beginPath(); ctx.arc(bx[a], by[b], 2.6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function draw() {
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  var r = panelRect();
  // offcuts lie on the paper, outside the assembly transform
  ctx.save();
  ctx.translate(r.x, r.y);
  ctx.scale(r.s, r.s);
  OFFCUTS.forEach(function (o) {
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.rotate(o.rot * Math.PI / 180);
    drawMini(o.w, o.h, false, POPLAR);
    ctx.restore();
  });
  ctx.restore();
  // the assembly: tilted a touch off vertical, plus the wobble
  ctx.save();
  ctx.translate(r.x + r.s * 400, r.y + r.s * 500);
  ctx.rotate(TILT + wob);
  ctx.scale(r.s, r.s);
  // clamps first, at the rail joints
  JOINTS.forEach(function (jn) {
    ctx.fillStyle = STEEL;
    ctx.fillRect(jn.x - 29, jn.y - 8, 58, 16);
    ctx.beginPath(); ctx.arc(jn.x - 18, jn.y, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(jn.x + 18, jn.y, 3, 0, Math.PI * 2); ctx.fill();
  });
  pieces.forEach(function (p) {
    ctx.save();
    ctx.translate(p.hx + p.ox, p.hy + p.oy);
    ctx.rotate(p.rot * Math.PI / 180);
    drawMini(p.w, p.h, p.horiz, p.col);
    ctx.restore();
  });
  ctx.restore();
}

// Physics: piece springs home; the rig wobbles on a soft spring.
function stepPhysics(dt) {
  var i, p;
  for (i = 0; i < pieces.length; i++) {
    p = pieces[i];
    if (drag && drag.p === p) continue;
    p.vx += (-90 * p.ox - 9 * p.vx) * dt;
    p.vy += (-90 * p.oy - 9 * p.vy) * dt;
    p.ox += p.vx * dt;
    p.oy += p.vy * dt;
  }
  wobV += (-26 * wob - 2.4 * wobV) * dt;
  wob += wobV * dt;
}

// ---- interaction: drag a mini ladder out, release springs it home ------------------------
var drag = null;
function toPanel(e) {
  var r = panelRect();
  return { x: (e.clientX - r.x) / r.s, y: (e.clientY - r.y) / r.s };
}
function homeScreen(p) {
  // ladder space to panel units, through tilt and wobble
  var a = TILT + wob;
  var ca = Math.cos(a), sa = Math.sin(a);
  return {
    x: 400 + p.hx * ca - p.hy * sa + p.ox,
    y: 500 + p.hx * sa + p.hy * ca + p.oy
  };
}
canvas.addEventListener('pointerdown', function (e) {
  var pt = toPanel(e), best = null, bd = 1e9;
  pieces.forEach(function (p) {
    var c = homeScreen(p);
    var d = Math.hypot(pt.x - c.x, pt.y - c.y);
    var rad = Math.max(p.w, p.h) / 2 + 26;
    if (d < rad && d < bd) { bd = d; best = p; }
  });
  if (best) {
    var c = homeScreen(best);
    drag = { p: best, gx: pt.x - c.x, gy: pt.y - c.y };
    best.vx = 0; best.vy = 0;
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var pt = toPanel(e), p = drag.p;
  var c = homeScreen(p);
  var baseX = c.x - p.ox, baseY = c.y - p.oy; // centre without offset
  var nx = (pt.x - drag.gx) - baseX;
  var ny = (pt.y - drag.gy) - baseY;
  p.vx = (nx - p.ox) * 22; p.vy = (ny - p.oy) * 22; // fling estimate
  p.ox = nx; p.oy = ny;
});
canvas.addEventListener('pointerup', function () {
  if (!drag) return;
  var p = drag.p;
  p.nbrs.forEach(function (j) {
    var q = pieces[j];
    q.vx += p.ox * 1.6;
    q.vy += p.oy * 1.6;
  });
  wobV += p.ox * 0.005;
  drag = null;
});
canvas.addEventListener('pointercancel', function () { drag = null; });

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.033, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  if (dt > 0) stepPhysics(dt);
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
