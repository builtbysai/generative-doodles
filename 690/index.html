<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Blood Knots</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #140B08; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // No.690 "Blood Knots" (EXPANSION #84 ceciliavicuna, block 2).
  // The Quipu Menstrual grammar: a dense, low-hanging mass of
  // unspun red wool tufts suspended from above, clotted and
  // fibrous, with deep shadowed gaps, over a near-black empty
  // lower third. Textile, not violence: no gore, no horror, no
  // explosion. The mass breathes on a twenty-second cycle.
  // Press and hold to part the tufts; drag to draw a slow furrow;
  // the fibers recoil and close over several seconds, because
  // wool is slow and heavy and does not snap.

  var BLOOD  = '#8E1B1B';  // blood red
  var WOOL   = '#A83232';  // wool red
  var RUST   = '#7A2E1E';  // rust
  var EARTH  = '#3A1E14';  // dark earth
  var SHADOW = '#140B08';  // shadow / page ground
  var HI     = '#C05A4A';  // faint highlight, outer fibers only

  var PAL = [BLOOD, WOOL, RUST, EARTH, HI];
  // color indices: 0 blood, 1 wool, 2 rust, 3 earth, 4 highlight

  var BASE_SEED = 690002;
  var BREATH = 20;        // breath cycle, seconds
  var NTUFTS = 660;       // 400-700 specced
  var TAU = Math.PI * 2;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ------------------------------------------------------------------
  // FIELD. Field space is isotropic: one unit is the smaller
  // viewport dimension; the field rectangle covers the whole
  // viewport. The tuft layout is seeded data in field fractions,
  // rebuilt identically whenever the field aspect changes.
  // ------------------------------------------------------------------
  var FW = 0, FH = 0;
  var tufts = [];

  function buildField() {
    tufts = [];
    var rnd = mulberry32(BASE_SEED);
    // Cluster centers: clumps of fiber packed against each other.
    var clusters = [];
    var nc = 46;
    for (var i = 0; i < nc; i++) {
      clusters.push({
        cx: (0.02 + 0.96 * rnd()) * FW,
        cy: (0.00 + 0.52 * Math.pow(rnd(), 1.25)) * FH,
        r: 0.035 + 0.075 * rnd()
      });
    }
    for (i = 0; i < NTUFTS; i++) {
      var ax, ay, depth;
      if (rnd() < 0.48) {
        // under-layer: dark tufts spread across the whole mass,
        // so the gaps between bright clots are shadowed fiber,
        // never bare void
        ax = rnd() * FW;
        ay = Math.pow(rnd(), 1.2) * 0.64 * FH;
        depth = rnd() * 0.30;
      } else {
        var cl = clusters[Math.floor(rnd() * nc)];
        // gaussian-ish scatter around the cluster center
        var gx = (rnd() + rnd() + rnd() - 1.5) / 1.5;
        var gy = (rnd() + rnd() + rnd() - 1.5) / 1.5;
        ax = cl.cx + gx * cl.r * 1.05;
        ay = cl.cy + gy * cl.r * 0.8;
        depth = clamp(0.25 + 0.75 * rnd() + (ay / FH) * 0.2, 0, 1); // lower hangs read nearer
      }
      if (ax < -0.03 || ax > FW + 0.03 || ay < -0.06 || ay > 0.70 * FH) { i--; continue; }
      var dangle = rnd() < 0.09;   // a few tufts trail long strands down
      var nstrokes = 5 + Math.floor(rnd() * 5); // 5-9
      var strokes = [];
      for (var s = 0; s < nstrokes; s++) {
        // each fiber starts at its own point along the tuft's
        // gathered top, hangs downward nearly parallel to its
        // neighbours, and curves gently: bowing out at the
        // middle, settling back inward at the tip, like hair
        var jx = (rnd() + rnd() - 1) * 0.017;
        var jy = (rnd() - 0.5) * 0.006;
        var ang = (rnd() - 0.5) * 0.62;
        var len = 0.030 + 0.050 * rnd();
        if (dangle) len *= 2.4 + 2.0 * rnd();             // strands to halfway down
        var drift = (rnd() - 0.5) * 0.014;
        var ex = jx + Math.sin(ang) * len * 0.60 + drift;
        var ey = jy + len;
        var mx = jx + Math.sin(ang) * len * 0.52 + drift * 0.4;
        var my = jy + len * 0.48;
        // color by depth: back tufts dark earth and rust, front
        // tufts blood and wool red; slight per-stroke variation
        var ci;
        var cr = rnd();
        if (depth < 0.35) ci = cr < 0.55 ? 3 : 2;
        else if (depth < 0.68) ci = cr < 0.45 ? 2 : 0;
        else ci = cr < 0.5 ? 0 : 1;
        strokes.push({
          mx: mx, my: my, ex: ex, ey: ey,
          ci: ci,
          a: 0.42 + 0.45 * rnd(),
          w: 0.8 + 0.9 * rnd()
        });
      }
      // a few outer (low-hanging, front) tufts catch one faint
      // highlight fiber
      if (depth > 0.62 && ay > 0.34 * FH && rnd() < 0.30) {
        var ha = (rnd() - 0.5) * 0.5, hl = 0.035 + 0.035 * rnd();
        strokes.push({
          mx: Math.sin(ha) * hl * 0.5, my: hl * 0.48,
          ex: Math.sin(ha) * hl * 0.6, ey: hl,
          ci: 4, a: 0.38, w: 0.8
        });
      }
      tufts.push({ ax: ax, ay: ay, depth: depth, strokes: strokes, ph: rnd() * TAU });
    }
    // draw back to front so the clots layer
    tufts.sort(function (a, b) { return a.depth - b.depth; });
  }

  // ------------------------------------------------------------------
  // BREATH. A slow shared sway field of layered sines on the
  // twenty-second cycle moves every anchor almost imperceptibly,
  // plus a faint vertical settling of the whole mass.
  // ------------------------------------------------------------------
  function sway(x, y, t) {
    var p = TAU * t / BREATH;
    var sx = 0.0060 * Math.sin(p + 1.3 * x + 0.8 * Math.sin(p * 0.5 + 2.1 * y))
           + 0.0028 * Math.sin(2 * p + 3.7 * y);
    var sy = 0.0038 * Math.sin(p * 0.5 + 1.9 * x + 1.1)
           + 0.0042 * Math.sin(p + 0.6);
    return { x: sx, y: sy };
  }

  // ------------------------------------------------------------------
  // PARTING. Touch is recorded as impulse data on the anchored
  // clock, never as integrated state. A live press pushes tufts
  // radially away with a smooth bump falloff, ramping in over
  // about half a second. On release (or as a drag moves on) the
  // press becomes a memory point whose push decays with a long
  // time constant, so a furrow takes several seconds to close:
  // wool memory. Displacement is a pure function of the recorded
  // points and the current time, so frame one is untouched.
  // ------------------------------------------------------------------
  var PART_R = 0.30;       // parting radius, field units
  var PART_MAX = 0.20;     // max displacement, field units
  var press = null;        // {x, y, t0} live press
  var memories = [];       // {x, y, t0, t1} released presses and drag trail
  function bump(r) {
    var q = clamp(r / PART_R, 0, 1);
    return 0.5 + 0.5 * Math.cos(Math.PI * q);
  }
  function partOffset(x, y, t) {
    var ox = 0, oy = 0, i, p, age, amp, dx, dy, d;
    if (press) {
      amp = 1 - Math.exp(-(t - press.t0) / 0.45);
      dx = x - press.x; dy = y - press.y; d = Math.sqrt(dx * dx + dy * dy);
      if (d < PART_R) {
        var f = amp * bump(d) * PART_MAX;
        if (d < 1e-5) { ox += 0; oy += f; }
        else { ox += dx / d * f; oy += dy / d * f; }
      }
    }
    for (i = 0; i < memories.length; i++) {
      p = memories[i];
      if (t <= p.t1) continue;
      amp = (1 - Math.exp(-(p.t1 - p.t0) / 0.45)) * Math.exp(-(t - p.t1) / 3.6);
      if (amp < 0.004) continue;
      dx = x - p.x; dy = y - p.y; d = Math.sqrt(dx * dx + dy * dy);
      if (d < PART_R) {
        var g = amp * bump(d) * PART_MAX;
        if (d < 1e-5) { oy += g; }
        else { ox += dx / d * g; oy += dy / d * g; }
      }
    }
    return { x: ox, y: oy };
  }
  function leaveMemory(x, y, t0, t1) {
    memories.push({ x: x, y: y, t0: t0, t1: t1 });
    if (memories.length > 60) memories.splice(0, memories.length - 60);
  }

  // ------------------------------------------------------------------
  // Canvas, sizing, house rules.
  // ------------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;
  var unit = 1;
  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr) isPhone = Math.min(scr.width, scr.height) < 700;
    else isPhone = h > w * 1.15;
    unit = Math.min(W, H);
    var nfw = W / unit, nfh = H / unit;
    if (Math.abs(nfw - FW) > 1e-6 || Math.abs(nfh - FH) > 1e-6) {
      FW = nfw; FH = nfh;
      buildField();
    }
  }

  // ------------------------------------------------------------------
  // Drawing. Tufts are drawn stroke by stroke from precomputed
  // data, translated by breath sway plus parting offset. Strokes
  // are grouped by color to limit state changes. Low alphas layer
  // the strokes into clotted fiber density. No blur, no shadow,
  // no gradient anywhere.
  // ------------------------------------------------------------------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = SHADOW;
    ctx.fillRect(0, 0, W, H);
    var lw = Math.max(1, 0.0017 * unit) * (isPhone ? 1.2 : 1);
    ctx.lineCap = 'round';
    var touched = press || memories.length > 0;
    for (var ci = 0; ci < PAL.length; ci++) {
      ctx.strokeStyle = PAL[ci];
      for (var i = 0; i < tufts.length; i++) {
        var tf = tufts[i];
        var sw = sway(tf.ax, tf.ay, t);
        var ox = sw.x, oy = sw.y;
        if (touched) {
          var po = partOffset(tf.ax, tf.ay, t);
          ox += po.x; oy += po.y;
        }
        var bx = (tf.ax + ox) * unit, by = (tf.ay + oy) * unit;
        var st = tf.strokes;
        for (var s = 0; s < st.length; s++) {
          var k = st[s];
          if (k.ci !== ci) continue;
          ctx.globalAlpha = k.a;
          ctx.lineWidth = lw * k.w;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.quadraticCurveTo(bx + k.mx * unit, by + k.my * unit,
                               bx + k.ex * unit, by + k.ey * unit);
          ctx.stroke();
          // fiber fuzz: one fainter hair lying almost on top of
          // the main fiber, nudged by a hair's breadth
          ctx.globalAlpha = k.a * 0.4;
          ctx.lineWidth = lw * k.w * 0.6;
          ctx.beginPath();
          ctx.moveTo(bx + 0.0016 * unit, by);
          ctx.quadraticCurveTo(bx + (k.mx + 0.0016) * unit, by + k.my * unit,
                               bx + (k.ex + 0.0012) * unit, by + k.ey * unit);
          ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------
  // Interaction: press-and-hold parts the tufts; dragging leaves
  // a furrow of memory points that close slowly behind the hand.
  // Gestures are recorded with anchored elapsed times. Nothing
  // reloads, nothing resets.
  // ------------------------------------------------------------------
  function evtPos(e) {
    if (e && typeof e.clientX === 'number') return { x: e.clientX, y: e.clientY };
    if (e && e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e && e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return null;
  }
  var lastTrailT = -1;
  function onDown(e) {
    var pos = evtPos(e);
    if (!pos) return;
    press = { x: pos.x / unit, y: pos.y / unit, t0: elapsed() };
    lastTrailT = press.t0;
    if (e && e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!press) return;
    var pos = evtPos(e);
    if (!pos) return;
    var t = elapsed();
    var nx = pos.x / unit, ny = pos.y / unit;
    // leave the spot we are leaving as a memory point, so the
    // furrow closes slowly behind the drag
    if (t - lastTrailT > 0.06) {
      leaveMemory(press.x, press.y, press.t0, t);
      press = { x: nx, y: ny, t0: t };
      lastTrailT = t;
    } else {
      press.x = nx; press.y = ny;
    }
  }
  function onUp() {
    if (!press) return;
    leaveMemory(press.x, press.y, press.t0, elapsed());
    press = null;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('touchstart', onDown);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('touchmove', onMove);
    window.addEventListener('touchend', onUp);
    window.addEventListener('resize', function () { resize(); draw(elapsed()); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(elapsed()); });
    }
  }

  // ------------------------------------------------------------------
  // Clock and main draw. Frame one is an explicit synchronous
  // draw at t = 0: the mass at breath phase zero, hanging full
  // and still over the empty lower third. Everything is a pure
  // function of seeded data, the anchored elapsed time, and
  // recorded pointer events; nothing reads Date.now().
  // ------------------------------------------------------------------
  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) {
      return (performance.now() - t0) / 1000;
    }
    return 0;
  }

  // QA hook: ?seed=t<seconds> forces a fixed elapsed time so later
  // phases of the breath can be rendered headlessly.
  var forcedT = -1;
  try {
    var m = /[?&]seed=t([0-9]+(?:\.[0-9]+)?)/.exec(
      (typeof location !== 'undefined' && location.search) || '');
    if (m) forcedT = parseFloat(m[1]);
  } catch (err) { forcedT = -1; }

  resize();
  draw(forcedT >= 0 ? forcedT : 0);
  if (typeof requestAnimationFrame === 'function' && forcedT < 0) {
    var loop = function () {
      // prune memories whose push has fully decayed
      var t = elapsed();
      for (var i = memories.length - 1; i >= 0; i--) {
        var p = memories[i];
        if ((1 - Math.exp(-(p.t1 - p.t0) / 0.45)) * Math.exp(-(t - p.t1) / 3.6) < 0.003) {
          memories.splice(i, 1);
        }
      }
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
