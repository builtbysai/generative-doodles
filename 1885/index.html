<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3M Words</title>
<style>
html, body { margin: 0; padding: 0; background: #F7F3EA; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* 3M Words: a residency journal kept over one compressed year. Twelve
   chapters, one per tap. Each chapter is a collage page that builds
   itself, layering torn paper, ink-stamped letter M textures in magenta
   and peach, small photographs of trees and hands, and one short line of
   text. Between chapters the page rests in a quiet day-night tint. The
   twelfth chapter ends with a single tree drawn in one line and the
   words "tree human". Tapping again starts a new year: the same twelve
   chapters, but the collages re-cut themselves differently. Tap earned:
   tapping turns the page, never skips, never resets, never reloads. */
var TAU = Math.PI * 2;
var PAPER = '#F7F3EA';
var PAGE = '#FDFBF4';
var MAGENTA = '#C2185B';
var MAGENTA_SOFT = '#D14D7E';
var PEACH = '#E8A87C';
var PEACH_DEEP = '#D98E5F';
var KRAFT = '#C9A876';
var KRAFT_DEEP = '#A9855A';
var NEWSPRINT = '#EFE9D8';
var LEAF = '#5B7A4A';
var LEAF_DEEP = '#42592F';
var INK = '#1A1A1A';
var INK_SOFT = '#3A3630';
var PLATE = '#1E1710';
var PLATE_LINE = 'rgba(194,24,91,0.55)';
var TITLE_INK = '#F7F3EA';
var HINT_INK = '#F2C9A0';
var SEED0 = 1885;
var BUILD = 2.4;          /* seconds for one chapter collage to build itself */
var FRAME_T = 2.3;        /* fixed phase: chapter one 96 percent built */
var DAY_CYCLE = 240.0;    /* slow day-night tint, independent of taps */
var LINES = [
  'For you I must become a tree',
  'every tree is the opposite of wandering',
  'a year, kept in twelve pages',
  'the ink is still wet',
  'motherhood, in magenta',
  'peach light on paper',
  'hands that hold, hands that let go',
  'the garden answers slowly',
  'cut, paste, begin again',
  'a root is a decision',
  'the page remembers the hand',
  'tree human'
];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smooth(f) { f = clamp(f, 0, 1); return f * f * (3 - 2 * f); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);

    return ((t ^ t >>> 14) >>> 0) / 4294967296;

}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);

}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var year = 0;
var chapter = 0;
var chapterStart = 0;
/* ---- seeded collage for one (year, chapter) ---- */
function buildChapter(yr, ch) {

  var papers = [];
  var paperCols = [KRAFT, NEWSPRINT, LEAF, PEACH, KRAFT, NEWSPRINT];
  var nP = 3 + Math.floor(rng() * 3);
  for (i = 0; i < nP; i++) {
    var cx = 0.26 + rng() * 0.48;
    var cy = 0.18 + rng() * 0.52;
    var w = 0.24 + rng() * 0.20;
    var h = 0.15 + rng() * 0.16;
    /* torn sheet: a rectangle whose corners and edge midpoints are
       jittered, so the edges read deckled, not cut with scissors */
    var jx = function () { return (rng() * 2 - 1) * 0.045; };
    var jy = function () { return (rng() * 2 - 1) * 0.05; };
    var verts = [
      { x: -w / 2 + jx(), y: -h / 2 + jy() },
      { x: jx(), y: -h / 2 + jy() },
      { x: w / 2 + jx(), y: -h / 2 + jy() },
      { x: w / 2 + jx(), y: jy() },
      { x: w / 2 + jx(), y: h / 2 + jy() },
      { x: jx(), y: h / 2 + jy() },
      { x: -w / 2 + jx(), y: h / 2 + jy() },
      { x: -w / 2 + jx(), y: jy() }

    papers.push({
      cx: cx, cy: cy, w: w, h: h, rot: (rng() * 2 - 1) * 0.22,
      color: paperCols[Math.floor(rng() * paperCols.length)],
      verts: verts, at: i * 0.12

  var photos = [];
  var nPh = 1 + Math.floor(rng() * 2);
  var kinds = nPh === 2 ? (rng() < 0.5 ? ['tree', 'hand'] : ['hand', 'tree']) : [rng() < 0.5 ? 'tree' : 'hand'];
  for (i = 0; i < nPh; i++) {
    photos.push({
      cx: 0.28 + rng() * 0.44, cy: 0.24 + rng() * 0.44,
      w: 0.26 + rng() * 0.06, h: 0.20 + rng() * 0.05,
      rot: (rng() * 2 - 1) * 0.10,
      kind: kinds[i],
      at: 0.34 + i * 0.16

  }
  var stamps = [];
  var nS = 4 + Math.floor(rng() * 3);
  for (i = 0; i < nS; i++) {
    stamps.push({
      cx: 0.14 + rng() * 0.72, cy: 0.12 + rng() * 0.56,
      s: 0.09 + rng() * 0.08, rot: (rng() * 2 - 1) * 0.5,
      color: rng() < 0.55 ? MAGENTA : PEACH_DEEP,
      a: 0.55 + rng() * 0.35, at: 0.44 + i * 0.07,
      speck: rng()

    var pts = [{ x: 0.5, y: 0.94 }];
    (function branch(x, y, ang, len, depth) {
      var nx = x + Math.cos(ang) * len;
      var ny = y + Math.sin(ang) * len;
      pts.push({ x: nx, y: ny });
      if (depth <= 0) return;
      var spread = 0.45 + rng() * 0.25;
      var shrink = 0.62 + rng() * 0.12;

      pts.push({ x: nx, y: ny });

      pts.push({ x: nx, y: ny });

var collage = buildChapter(year, chapter);
function chapterProgress(t) {
  return clamp((t - chapterStart) / BUILD, 0, 1);
}
function layerAlpha(progress, at) {
  return smooth((progress - at) / 0.15);
}
/* ---- WebAudio: lazy, only inside a user gesture, default silent ---- */
var audioCtx = null;
var audioReady = false;
var soundOn = false;
var lastProgress = chapterProgress(FRAME_T);
var treeTonePlayed = false;
function ensureAudio() {
  if (audioCtx) return;

    var AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);

    audioCtx = new AC();

}

  if (!audioCtx || !audioReady || !soundOn) return;

    var dur = 0.35;
    var buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);

    for (i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length) * 0.6;

    src.buffer = buf;
    var f = audioCtx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 1200;
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.16, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    src.connect(f); f.connect(g); g.connect(audioCtx.destination);
    src.start();
  } catch (e) { /* audio is a garnish; never break the picture */ }
}
function stampThump() {
  if (!audioCtx || !audioReady || !soundOn) return;
  try {
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    var now = audioCtx.currentTime;
    o.type = 'sine';
    o.frequency.setValueAtTime(170, now);
    o.frequency.exponentialRampToValueAtTime(70, now + 0.09);
    g.gain.setValueAtTime(0.12, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now); o.stop(now + 0.13);
  } catch (e) { /* ignore */ }
}
function treeTone() {
  if (!audioCtx || !audioReady || !soundOn) return;
  try {
    var freqs = [523.25, 1046.5];
    var now = audioCtx.currentTime;
    var i, o, g;
    for (i = 0; i < freqs.length; i++) {
      o = audioCtx.createOscillator();
      g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freqs[i];
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(i === 0 ? 0.14 : 0.05, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(now); o.stop(now + 2.9);
    }
  } catch (e) { /* ignore */ }
}
/* Sound events follow the build clock: a thump as each stamp lands, a
   single struck tone when the tree page completes. */
function soundFor(prevP, newP) {
  if (!audioReady || !soundOn) { lastProgress = newP; return; }
  var i;
  for (i = 0; i < collage.stamps.length; i++) {
    var at = collage.stamps[i].at;
    if (prevP < at && newP >= at) stampThump();
  }
  if (chapter === 11 && !treeTonePlayed && newP >= 1) {
    treeTone();
    treeTonePlayed = true;
  }
  lastProgress = newP;
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);

}
/* The journal page: portrait, centered, generous margins. */
function pageRect() {
  var ph, pw;
  if (isPhone) {
    pw = VW * 0.92;
    ph = pw / 0.78;
    if (ph > VH * 0.86) { ph = VH * 0.86; pw = ph * 0.78; }
  } else {
    ph = VH * 0.86;
    pw = ph * 0.78;
    if (pw > VW * 0.62) { pw = VW * 0.62; ph = pw / 0.78; }

  ctx.rotate(s.rot);

    var ox = i === 0 ? 0 : w * 0.02;
    var oy = i === 0 ? 0 : h * 0.015;

    ctx.moveTo(-w / 2 + ox, h / 2 + oy);
    ctx.lineTo(-w / 2 + ox, -h / 2 + oy);
    ctx.lineTo(ox, h * 0.12 + oy);
    ctx.lineTo(w / 2 + ox, -h / 2 + oy);
    ctx.lineTo(w / 2 + ox, h / 2 + oy);

  ctx.fillStyle = s.color;

  var y = pg.y + p.cy * pg.h;
  var w = p.w * pg.w;
  var h = p.h * pg.h;

  ctx.translate(x, y);
  ctx.rotate(p.rot);
  ctx.globalAlpha = alpha;
  /* white print border, soft shadow */

  ctx.fillRect(-w / 2 + 3, -h / 2 + 4, w, h);
  ctx.fillStyle = '#FFFFFF';

  ctx.lineJoin = 'round';

    /* procedural tree sketch: trunk and a few branches */
    ctx.beginPath();
    ctx.moveTo(0, ih * 0.45);
    ctx.lineTo(0, -ih * 0.1);
    ctx.moveTo(0, ih * 0.1);
    ctx.lineTo(-iw * 0.28, -ih * 0.25);
    ctx.moveTo(0, -ih * 0.05);
    ctx.lineTo(iw * 0.26, -ih * 0.3);
    ctx.moveTo(0, -ih * 0.1);
    ctx.lineTo(0, -ih * 0.42);

      drawStamp({ cx: 0.78, cy: 0.16, s: s0.s * 0.8, rot: 0.3, color: PEACH_DEEP, a: 0.35, speck: s0.speck }, pg, layerAlpha(progress, 0.05));
    }
    drawTree(pg, progress);
    drawTextLine(pg, layerAlpha(progress, 0.78));
  } else {
    var i;
    for (i = 0; i < collage.papers.length; i++) {
      var p = collage.papers[i];
      var a = layerAlpha(progress, p.at);
      if (a <= 0) continue;
      ctx.save();
      ctx.translate(pg.x + p.cx * pg.w, pg.y + p.cy * pg.h);
      ctx.rotate(p.rot);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.moveTo(p.verts[0].x * pg.w, p.verts[0].y * pg.h);
      for (var v = 1; v < p.verts.length; v++) ctx.lineTo(p.verts[v].x * pg.w, p.verts[v].y * pg.h);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = rgba(KRAFT_DEEP, 0.45);
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }
    for (i = 0; i < collage.photos.length; i++) {
      var ph = collage.photos[i];
      var pa = layerAlpha(progress, ph.at);
      if (pa > 0) drawPhoto(ph, pg, pa);
    }
    for (i = 0; i < collage.stamps.length; i++) {
      var st = collage.stamps[i];
      var sa = layerAlpha(progress, st.at);
      if (sa > 0) drawStamp(st, pg, sa);
    }
    drawTextLine(pg, layerAlpha(progress, 0.78));
  }
  /* quiet day-night tint: slow global clock, independent of taps */
  var dayness = 0.5 + 0.5 * Math.sin(TAU * (phaseT / DAY_CYCLE));
  if (dayness >= 0.5) {
    ctx.fillStyle = rgba(PEACH, (dayness - 0.5) * 0.14);
  } else {
    ctx.fillStyle = 'rgba(70,90,140,' + ((0.5 - dayness) * 0.14).toFixed(4) + ')';
  }
  ctx.fillRect(pg.x, pg.y, pg.w, pg.h);
  drawPlates();
}
/* ---- frame one: fixed phase t = 2.3 s, chapter one 96 percent built,
   seed 1885, year zero ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (canvas && typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', function (ev) {
    if (!ev) return;
    var r = null;
    try { r = canvas.getBoundingClientRect(); } catch (e) { r = null; }
    var px = ev.clientX, py = ev.clientY;
    if (r && typeof ev.clientX === 'number') { px = ev.clientX - r.left; py = ev.clientY - r.top; }
    else if (typeof ev.offsetX === 'number') { px = ev.offsetX; py = ev.offsetY; }
    else return;
    ensureAudio();
    if (audioCtx && audioReady) {
      try { if (audioCtx.resume) audioCtx.resume(); } catch (e) { /* ignore */ }
    }
    if (px >= soundRect.x && px <= soundRect.x + soundRect.w &&
        py >= soundRect.y && py <= soundRect.y + soundRect.h) {
      soundOn = !soundOn;
      draw();
      return;
    }
    /* turn the page: advance one chapter, never skip, never reset.
       After the twelfth chapter a tap starts a new year, re-cut. */
    if (chapter === 11) {
      year += 1;
      chapter = 0;
    } else {
      chapter += 1;
    }
    chapterStart = phaseT;
    collage = buildChapter(year, chapter);
    lastProgress = 0;
    treeTonePlayed = false;
    paperShuffle();
    draw();
  });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      var prevP = chapterProgress(phaseT);
      phaseT = FRAME_T + clockT;
      var newP = chapterProgress(phaseT);
      soundFor(prevP, newP);
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
