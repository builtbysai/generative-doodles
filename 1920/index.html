<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1920 Somewhere In Between</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0b0e; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt. The study
  // file studies/lauren-kinsella.md does not exist in the repo, so these
  // hex values are chosen from the prompt's own color names.
  var BG = '#0b0b0e';        // deep ink black, page ground too
  var BONE = '#ece6d8';      // lyric fragments, bone white
  var GOLD = '#d9a441';      // sung curve, warm gold
  var GOLD_LT = '#e8c37a';   // sung glow, lighter gold
  var GREY = '#b9b9b2';      // spoken text, pale grey
  var MOSS = '#7d8f5a';      // phoneme beads, moss green
  var RUST = '#b4552d';      // phoneme beads, rust
  var INK_SOFT = '#8a8a82';  // date line and hint, muted grey

  // Fixed-phase first frame: t = 45 s. The voice is crossing the
  // liminal middle, slightly sung of center: the left third of the
  // ribbon runs as a smooth gold curve carrying a bone-white lyric
  // fragment, the middle third is flattening into slow typewriter
  // text, and the right third is already breaking into moss and rust
  // phoneme beads. Frame one is byte-reproducible: every bead, letter
  // and curve point is a pure function of t and the seeded PRNG.
  var FIRST_T = 45;

  // Seeded PRNG, mulberry32. A fresh instance is built per draw from the
  // piece number, so every frame is reproducible regardless of call order.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // The voice agent's state s lives on [-1, 1]: -1 sung, 0 spoken,
  // +1 sounded. It drifts on two incommensurate slow sines, so it never
  // settles and never syncs to a beat. Hysteresis: the displayed state
  // chases its target slowly, so transitions smear instead of snapping.
  function driftTarget(t) {
    return 0.55 * Math.sin(t * 0.05 + 1.3) + 0.35 * Math.sin(t * 0.11 + 4.0);
  }
  function integrateState(tEnd) {
    var s = 0, t = 0, step = 0.1;
    while (t < tEnd) {
      var target = driftTarget(t);
      s += (target - s) * Math.min(1, step * 0.45);
      t += step;
    }
    return s;
  }
  var sState = integrateState(FIRST_T);

  // Lyric fragments carried by the sung curve, in bone white.
  var LYRICS = [
    'somewhere in between',
    'a note half sung',
    'held between registers'
  ];
  // Spoken fragments, typed out slowly in pale grey.
  var SPOKEN = [
    'the voice flattens',
    'slow, like typing',
    'one by one'
  ];
  // Phoneme beads that scatter and re-gather.
  var PHONEMES = ['oh', 'el', 'hem', 'ph', 'ah', 'tsk'];
  // Vowels that stretch wide before the line proceeds.
  var VOWELS = ['o', 'a', 'e'];

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  // QA hook: ?sx=<px>&sy=<px> simulates a drag held at that point, so a
  // probe render can be compared against the default frame. The render
  // harness passes its extra argument as ?seed=sx=..&sy=.., so match the
  // parameters anywhere in the query string.
  var probe = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mx = qs.match(/sx=(-?\d+)/), my = qs.match(/sy=(-?\d+)/);
    if (mx) { probe = { x: parseInt(mx[1], 10), y: my ? parseInt(my[1], 10) : 0 }; }
  } catch (e) { probe = null; }

  // Drag state: pointer down records the start; moving left biases the
  // voice toward sung, moving right toward sounded. Release lets it drift
  // back to the liminal middle.
  var dragging = false, dragStartX = 0, dragX = 0, dragY = 0, dragBias = 0;

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // The ribbon's centerline: a slow double sine across the middle third.
  function ribbonY(x, t) {
    var u = x / W;
    return H * 0.5
      + Math.sin(u * Math.PI * 2 * 0.8 + t * 0.12) * H * 0.030
      + Math.sin(u * Math.PI * 2 * 2.1 - t * 0.07 + 1.7) * H * 0.015;
  }
  function ribbonSlope(x, t) {
    var e = Math.max(2, W * 0.004);
    return (ribbonY(x + e, t) - ribbonY(x - e, t)) / (2 * e);
  }

  // Local register at position x: the global state plus a slow spatial
  // wave, so the states bleed left to right and different parts of the
  // ribbon sit in different registers at once.
  function localS(x, t, s) {
    return clamp(s + 0.7 * Math.sin(x / W * Math.PI * 2 * 1.3 + t * 0.07), -1, 1);
  }
  function weights(ls) {
    return {
      sung: clamp(-ls, 0, 1),
      spoken: 1 - Math.abs(ls),
      sounded: clamp(ls, 0, 1)
    };
  }

  // The sung curve: a smooth gold line, drawn segment by segment so its
  // strength follows the local register. Round caps overlap at the joints
  // and read as one continuous curve.
  function drawSung(t, s) {
    var n = 140, step = W / n;
    ctx.lineCap = 'round';
    for (var pass = 0; pass < 2; pass++) {
      for (var i = 0; i < n; i++) {
        var x0 = i * step, x1 = (i + 1) * step;
        var xm = (x0 + x1) / 2;
        var w = weights(localS(xm, t, s)).sung;
        if (w < 0.03) { continue; }
        var y0 = ribbonY(x0, t), y1 = ribbonY(x1, t);
        if (pass === 0) {
          ctx.strokeStyle = hexA(GOLD, a4(0.16 * w));
          ctx.lineWidth = Math.max(4, H * 0.012);
        } else {
          ctx.strokeStyle = hexA(GOLD_LT, a4(0.85 * w));
          ctx.lineWidth = Math.max(1.6, H * 0.0038);
        }
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.stroke();
      }
    }
  }

  // Bone-white lyric fragments riding the sung curve, each following the
  // local slope, fading in where the ribbon is sung.
  function drawLyrics(t, s, rng) {
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    var fs = Math.round(clamp(W / 40, 12, 20));
    ctx.font = 'italic ' + fs + 'px Georgia, "Times New Roman", serif';
    for (var i = 0; i < LYRICS.length; i++) {
      var u = 0.07 + i * 0.33 + (rng() - 0.5) * 0.05;
      var x = u * W, y = ribbonY(x, t) - H * 0.045 - Math.sin(t * 0.09 + i * 2.4) * H * 0.008;
      var w = weights(localS(x, t, s)).sung;
      if (w < 0.05) { continue; }
      var tw = ctx.measureText(LYRICS[i]).width;
      if (x + tw > W - 8) { x = W - 8 - tw; }
      if (x < 8) { x = 8; }
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.atan(ribbonSlope(x, t)) * 0.7);
      ctx.fillStyle = hexA(BONE, a4(0.9 * w));
      ctx.fillText(LYRICS[i], 0, 0);
      ctx.restore();
    }
  }

  // Spoken text: pale grey typewriter fragments typed out slowly along
  // the ribbon, one letter at a time, with a steady block cursor.
  function drawSpoken(t, s, rng) {
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    var fs = Math.round(clamp(W / 44, 11, 19));
    ctx.font = fs + 'px "Courier New", Courier, monospace';
    for (var i = 0; i < SPOKEN.length; i++) {
      var u = 0.10 + i * 0.34 + (rng() - 0.5) * 0.04;
      var x = u * W;
      // Alternate rows below the ribbon so neighbouring fragments can
      // never collide when the right one is clamped left at the edge.
      var y = ribbonY(x, t) + (i % 2 === 0 ? H * 0.062 : H * 0.105);
      var w = weights(localS(x, t, s)).spoken;
      if (w < 0.05) { continue; }
      var full = SPOKEN[i];
      var cycle = full.length + 26; // 26 frames of rest after each typing
      var shown = Math.floor((t * 5 + i * 13) % cycle);
      if (shown > full.length) { shown = full.length; }
      if (shown <= 0) { continue; }
      var text = full.slice(0, shown);
      var tw = ctx.measureText(text).width;
      if (x + tw > W - 8) { x = W - 8 - tw; }
      if (x < 8) { x = 8; }
      ctx.fillStyle = hexA(GREY, a4(0.85 * w));
      ctx.fillText(text, x, y);
      // Steady block cursor after the last typed letter.
      ctx.fillStyle = hexA(GREY, a4(0.6 * w));
      ctx.fillRect(x + tw + 3, y - fs + 2, Math.max(2, fs * 0.12), fs - 2);
    }
  }

  // Phoneme beads: small moss and rust dots that scatter away from the
  // ribbon and re-gather onto it on a slow cycle, some carrying their
  // phoneme label. Bead placement is seeded; only the scatter amplitude
  // moves with time.
  function drawBeads(t, s, rng) {
    var n = 64;
    var fs = Math.round(clamp(W / 52, 10, 16));
    ctx.font = fs + 'px "Courier New", Courier, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    for (var i = 0; i < n; i++) {
      var u = rng();
      var x = u * W;
      var w = weights(localS(x, t, s)).sounded;
      if (w < 0.04) { continue; }
      var ph = rng() * Math.PI * 2;
      var spread = (rng() - 0.5) * H * 0.16;
      var gather = 0.5 + 0.5 * Math.sin(t * 0.23 + ph);
      var y = ribbonY(x, t) + spread * (0.35 + 0.65 * gather)
        + Math.sin(t * 0.31 + ph * 2.0) * H * 0.006;
      var r = Math.max(1.6, H * 0.0045 * (0.7 + rng() * 0.7));
      var color = (rng() < 0.55) ? MOSS : RUST;
      ctx.fillStyle = hexA(color, a4(0.9 * w));
      ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      // About a third of the beads carry their phoneme.
      if (rng() < 0.35) {
        var label = PHONEMES[Math.floor(rng() * PHONEMES.length)];
        ctx.fillStyle = hexA(color, a4(0.75 * w));
        ctx.fillText(label, x, y - r - 4);
      }
    }
  }

  // Occasional close passages: a single vowel stretches wide before the
  // line proceeds. Drawn where the ribbon is sung or spoken, never where
  // it has broken into beads.
  function drawVowels(t, s, rng) {
    var fs = Math.round(clamp(W / 16, 26, 52));
    ctx.font = 'italic 600 ' + fs + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < VOWELS.length; i++) {
      var u = 0.25 + i * 0.33 + (rng() - 0.5) * 0.05;
      var x = u * W, y = ribbonY(x, t);
      var ls = localS(x, t, s);
      var w = Math.max(weights(ls).sung, weights(ls).spoken);
      if (w < 0.25) { continue; }
      // The stretch breathes slowly; at its widest the vowel is about
      // three times its natural width.
      var stretch = 1 + 2.0 * (0.5 + 0.5 * Math.sin(t * 0.18 + i * 2.1));
      ctx.save();
      ctx.translate(x, y - H * 0.01);
      ctx.scale(stretch, 1);
      ctx.fillStyle = hexA(BONE, a4(0.55 * w));
      ctx.fillText(VOWELS[i], 0, 0);
      ctx.restore();
    }
  }

  // The hand's position while dragging, a thin gold ring on the ribbon.
  function drawHand(x, y) {
    var r = Math.max(10, H * 0.02);
    ctx.strokeStyle = hexA(GOLD_LT, 0.8);
    ctx.lineWidth = Math.max(1.2, H * 0.002);
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = hexA(GOLD_LT, 0.9);
    ctx.beginPath(); ctx.moveTo(x + 3, y); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Deep ink black ground.
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    // The displayed register: the smoothed state, or the held drag bias
    // while a drag (or the QA probe) is active.
    var s = sState;
    var hand = null;
    if (probe) {
      var pb = clamp((probe.x - W / 2) / (W * 0.30), -1, 1);
      s = lerp(sState, pb, 0.85);
      hand = { x: probe.x, y: probe.y };
    } else if (dragging) {
      s = lerp(sState, dragBias, 0.85);
      hand = { x: dragX, y: dragY };
    }

    // The faint hairline of the line itself, so the ribbon reads as one
    // continuous voice even where it has dissolved into text or beads.
    ctx.strokeStyle = hexA(BONE, 0.12);
    ctx.lineWidth = Math.max(1, H * 0.0016);
    ctx.lineCap = 'round';
    ctx.beginPath();
    var step = Math.max(2, W / 200);
    for (var x = 0; x <= W; x += step) {
      if (x === 0) { ctx.moveTo(x, ribbonY(x, t)); }
      else { ctx.lineTo(x, ribbonY(x, t)); }
    }
    ctx.stroke();

    // One fresh seeded PRNG per draw keeps every frame reproducible.
    var rng = mulberry32(1920);
    drawSung(t, s);
    drawLyrics(t, s, rng);
    drawSpoken(t, s, rng);
    drawBeads(t, s, rng);
    drawVowels(t, s, rng);
    if (hand) { drawHand(hand.x, hand.y); }

    // Title plate, top-left.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = BONE;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Somewhere In Between', 18, 34);
    ctx.fillStyle = INK_SOFT;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1920 · 2007 · 04 · 15', 18, 34 + fs2 + 8);

    // Hint, centered at the bottom.
    ctx.fillStyle = hexA(INK_SOFT, 0.9);
    ctx.textAlign = 'center';
    var hint = 'Drag to hold the voice in one register.';
    ctx.font = Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    if (W < 560) {
      ctx.fillText('Drag to hold the voice', W / 2, H - 34);
      ctx.fillText('in one register.', W / 2, H - 16);
    } else {
      ctx.fillText(hint, W / 2, H - 20);
    }
    ctx.textAlign = 'left';
  }

  function pointerPos(e) {
    var rect = { left: stageX, top: stageY };
    try {
      if (canvas.getBoundingClientRect) { rect = canvas.getBoundingClientRect(); }
    } catch (err) {}
    var cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return { x: cx - rect.left, y: cy - rect.top };
  }

  function onDown(e) {
    var p = pointerPos(e);
    dragging = true;
    dragStartX = p.x; dragX = p.x; dragY = p.y;
    dragBias = 0;
    if (e.preventDefault) { e.preventDefault(); }
    draw(FIRST_T + elapsed());
  }
  function onMove(e) {
    if (!dragging) { return; }
    var p = pointerPos(e);
    dragX = p.x; dragY = p.y;
    dragBias = clamp((dragX - dragStartX) / (W * 0.30), -1, 1);
    if (e.preventDefault) { e.preventDefault(); }
    draw(FIRST_T + elapsed());
  }
  function onUp() {
    if (!dragging) { return; }
    dragging = false;
    dragBias = 0;
    draw(FIRST_T + elapsed());
  }

  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) {
      return (performance.now() - t0) / 1000;
    }
    return 0;
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown);
    canvas.addEventListener('touchmove', onMove);
    canvas.addEventListener('touchend', onUp);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T + elapsed()); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T + elapsed()); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Drag only: no click-to-reload, no audio. All motion runs under 1 Hz,
  // well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var last = FIRST_T;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      var dt = Math.min(0.1, Math.max(0, t - last));
      last = t;
      // Hysteresis: the state chases its target slowly.
      var target = dragging ? dragBias : driftTarget(t);
      sState += (target - sState) * Math.min(1, dt * 0.45);
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
