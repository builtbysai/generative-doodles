<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№4 · Orbits</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b0b0e; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(240,238,230,0.42); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another orbits</div>
<script>
'use strict';
// No4 Orbits.
// String art, stated as a rule: three concentric rings of points, and
// on each ring every point is joined by a hairline to the point k steps
// away, k different per ring. The rings themselves are never drawn;
// only the chords exist, and their envelopes fake the circles. Warm
// white on black, nothing else. The build checks k for each ring: too
// small and the chords hug the rim into a plain circle, too close to
// half the ring and they collapse into diameters, so k/N is gated to
// the middle band where the envelope is rich.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '4', 10) || 4;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#0b0b0e';

function compose(s) {
  const rnd = mulberry32(s);
  const rings = [];
  const radii = [0.97, 0.68, 0.40];
  let ok = true;
  for (let ri = 0; ri < 3; ri++) {
    const N = 64 + ((rnd() * 48) | 0);           // 64..111 points
    const k = 6 + ((rnd() * (N / 2 - 12)) | 0);
    const ratio = k / N;
    if (ratio < 0.10 || ratio > 0.42) ok = false;
    rings.push({ N, k, r: radii[ri] * (0.96 + rnd() * 0.08), rot: rnd() * Math.PI * 2 });
  }
  return { rings, ok };
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 24; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best) best = p;
    if (p.ok) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  const S = Math.min(w, h);
  const cx = w / 2, cy = h / 2;
  const R = S * 0.44;

  ctx.strokeStyle = 'rgba(240,238,230,0.40)';
  ctx.lineWidth = Math.max(0.6, S / 1400);
  for (const ring of p.rings) {
    ctx.beginPath();
    for (let i = 0; i < ring.N; i++) {
      const a0 = ring.rot + (i / ring.N) * Math.PI * 2;
      const a1 = ring.rot + (((i + ring.k) % ring.N) / ring.N) * Math.PI * 2;
      ctx.moveTo(cx + Math.cos(a0) * R * ring.r, cy + Math.sin(a0) * R * ring.r);
      ctx.lineTo(cx + Math.cos(a1) * R * ring.r, cy + Math.sin(a1) * R * ring.r);
    }
    ctx.stroke();
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
