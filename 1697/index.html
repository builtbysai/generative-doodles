<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Continuous Line</title>
<style>
html, body { margin: 0; padding: 0; background: #FDFCF7; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#FDFCF7';
var INK = '#111111';
var PLATE = '#FFFFFF';
var PLATE_LINE = 'rgba(17,17,17,0.55)';
var TITLE_INK = '#111111';
var HINT_INK = '#111111';
var FIRST_T = 30;
var FIRST_PHASE = 0.57;
var DRAW_SECONDS = 200;
var FADE_SECONDS = 10;
var SEED_BASE = 944;
var COLS = 120;
var ROWS = 80;
/* DRIVER: one unbroken line draws a lichen figure at plotter pace.
   Tone comes from the line winding tighter over dark ground; the
   pen never lifts, and a hairline at the bottom shows its advance. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* ---- brightness field: lichen cluster plus dendritic tendrils ----
   Seeded blobs and branch chains in figure-normalized coords. */
function buildField(seed) {
  var r = mulberry32(seed);
  var blobs = [];
  blobs.push({ x: 0.5, y: 0.46, r: 0.35, w: 0.18 });
  var i, k;
  for (i = 0; i < 6; i++) {
    var ang = r() * TAU, dist = Math.sqrt(r()) * 0.16;
    blobs.push({
      x: 0.5 + Math.cos(ang) * dist * 1.25,
      y: 0.46 + Math.sin(ang) * dist * 0.85,
      r: 0.04 + r() * 0.06,
      w: 0.40 + r() * 0.30
    });
  }
  for (i = 0; i < 8; i++) {
    var a0 = r() * TAU;
    var len = 0.30 + r() * 0.22;
    var bend = (r() - 0.5) * 0.50;
    var steps = 14;
    for (k = 1; k <= steps; k++) {
      var f = k / steps;
      var along = len * f;
      var perp = bend * Math.sin(f * Math.PI);
      blobs.push({
        x: 0.5 + Math.cos(a0) * along - Math.sin(a0) * perp,
        y: 0.46 + Math.sin(a0) * along + Math.cos(a0) * perp,
        r: 0.012 + r() * 0.014,
        w: 0.55
      });
    }
  }
  return blobs;
}
function fieldDark(blobs, u, v) {
  var d = 0, i, b, dx, dy;
  for (i = 0; i < blobs.length; i++) {
    b = blobs[i];
    dx = (u - b.x) * 1.5;
    dy = (v - b.y) * 1.5;
    d += b.w * Math.exp(-(dx * dx + dy * dy) / (2 * b.r * b.r));
  }
  return clamp(d, 0, 1);
}
/* ---- one continuous polyline: spiral-ordered grid walk, in-cell meander ----
   Cells are visited in a rectangular spiral from the figure's center
   outward, so the line covers the whole figure evenly as it draws and
   the figure reads long before the line finishes. Each cell is crossed by a small
   serpentine whose density follows the field: light cells get one point,
   mid cells a 3x3 meander, dark cells a 5x5 meander. Lattice points are
   jittered by a seeded amount so the line reads as a hand-drawn meander,
   not a maze. The whole figure is a single point list, so the pen never
   lifts; every step is at most about one cell diagonal. */
function buildPath(seed, fig) {
  var blobs = buildField(seed);
  var cw = fig.w / COLS, ch = fig.h / ROWS;
  var jr = mulberry32(seed + 77);
  var pts = [];
  var counts = { m1: 0, m3: 0, m5: 0, m7: 0 };
  var maxStep = 0, prevX = null, prevY = null;
  function push(x, y) {
    if (prevX !== null) {
      var dx = x - prevX, dy = y - prevY;
      var s = Math.sqrt(dx * dx + dy * dy);
      if (s > maxStep) maxStep = s;
    }
    pts.push(x, y);
    prevX = x; prevY = y;
  }
  /* Rectangular spiral: nested perimeters from the center strip outward.
     Each ring is the rectangle inset by k cells; rings are visited from
     the innermost out, clockwise from the top-left corner, so every step
     between cells is at most a short diagonal stitch. */
  var cells = [];
  var maxK = Math.floor(Math.min(COLS, ROWS) / 2);
  var k, i, j;
  for (k = maxK - 1; k >= 0; k--) {
    var x0 = k, x1 = COLS - 1 - k, y0 = k, y1 = ROWS - 1 - k;
    if (k % 2 === 0) {
      for (i = x0; i <= x1; i++) cells.push([i, y0]);
      for (j = y0 + 1; j <= y1; j++) cells.push([x1, j]);
      if (y1 > y0) for (i = x1 - 1; i >= x0; i--) cells.push([i, y1]);
      if (x1 > x0) for (j = y1 - 1; j >= y0 + 1; j--) cells.push([x0, j]);
    } else {
      for (j = y0; j <= y1; j++) cells.push([x0, j]);
      for (i = x0 + 1; i <= x1; i++) cells.push([i, y1]);
      if (x1 > x0) for (j = y1 - 1; j >= y0; j--) cells.push([x1, j]);
      if (y1 > y0) for (i = x1 - 1; i >= x0 + 1; i--) cells.push([i, y0]);
    }
  }
  var b, a;
  for (var c = 0; c < cells.length; c++) {
    i = cells[c][0]; j = cells[c][1];
    var u = (i + 0.5) / COLS, v = (j + 0.5) / ROWS;
    var dark = fieldDark(blobs, u, v);
    var m = dark < 0.20 ? 1 : (dark < 0.45 ? 3 : (dark < 0.85 ? 5 : 7));
    counts['m' + m]++;
    var x0 = fig.x + i * cw, y0 = fig.y + j * ch;
    var jx = 0.35 * cw / m, jy = 0.35 * ch / m;
    var order = [];
    for (b = 0; b < m; b++) {
      for (a = 0; a < m; a++) {
        var aa = (b % 2 === 0) ? a : (m - 1 - a);
        order.push([
          x0 + (aa + 0.5) * cw / m + (jr() - 0.5) * 2 * jx,
          y0 + (b + 0.5) * ch / m + (jr() - 0.5) * 2 * jy
        ]);
      }
    }
    for (k = 0; k < order.length; k++) push(order[k][0], order[k][1]);
  }
  return {
    pts: pts,
    segments: pts.length / 2 - 1,
    counts: counts,
    maxStep: maxStep,
    cellDiag: Math.sqrt(cw * cw + ch * ch)
  };
}
function figureRect() {
  if (isPhone) {
    return { x: 10, y: 64, w: VW - 20, h: VH - 64 - 56 };
  }
  var mTop = 72, mBot = 72;
  var w = Math.min(VW * 0.88, (VH - mTop - mBot) * 1.5);
  var h = w / 1.5;
  return { x: (VW - w) / 2, y: mTop + (VH - mTop - mBot - h) / 2, w: w, h: h };
}
var pathCache = { key: '', cycle: -1, path: null };
function getPath(cycle, fig) {
  var key = cycle + ':' + fig.x.toFixed(1) + ',' + fig.y.toFixed(1) + ',' + fig.w.toFixed(1) + ',' + fig.h.toFixed(1);
  if (pathCache.key !== key) {
    pathCache.key = key;
    pathCache.cycle = cycle;
    pathCache.path = buildPath(SEED_BASE + cycle * 7919, fig);
  }
  return pathCache.path;
}
function lineWidthFor(fig) {
  return Math.max(1, Math.min(2, fig.w / 620));
}
var CYCLE0_END = FIRST_T + (1 - FIRST_PHASE) * DRAW_SECONDS;
function cycleAt(t) {
  if (t < CYCLE0_END) return { c: 0, start: FIRST_T, fade: 1 };
  var el = t - CYCLE0_END;
  var c = 1 + Math.floor(el / DRAW_SECONDS);
  var start = CYCLE0_END + (c - 1) * DRAW_SECONDS;
  return { c: c, start: start, fade: clamp((t - start) / FADE_SECONDS, 0, 1) };
}
function progressAt(t, cy) {
  if (cy.c === 0) return clamp(FIRST_PHASE + (t - FIRST_T) / DRAW_SECONDS, 0, 1);
  return clamp((t - cy.start) / DRAW_SECONDS, 0, 1);
}
function drawPathPrefix(path, count, alpha) {
  if (count < 2) return;
  var pts = path.pts;
  var n = Math.min(count, pts.length / 2);
  ctx.globalAlpha = Number(alpha.toFixed(4));
  ctx.strokeStyle = INK;
  ctx.lineWidth = lineWidthFor(figureRect());
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  var k;
  for (k = 1; k < n; k++) ctx.lineTo(pts[2 * k], pts[2 * k + 1]);
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawHairline(prog) {
  var y = VH - 10;
  var x0 = 20, x1 = VW - 20;
  ctx.strokeStyle = 'rgba(17,17,17,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x0, y);
  ctx.lineTo(x1, y);
  ctx.stroke();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x0, y);
  ctx.lineTo(x0 + (x1 - x0) * prog, y);
  ctx.stroke();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('One Continuous Line').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('One Continuous Line').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 04').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('One Continuous Line', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 04', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 26;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var fig = figureRect();
  var cy = cycleAt(t);
  var prog = progressAt(t, cy);
  var path = getPath(cy.c, fig);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  if (cy.c > 0 && cy.fade < 1) {
    var prev = getPath(cy.c - 1, fig);
    drawPathPrefix(prev, prev.pts.length / 2, 1 - cy.fade);
  }
  var n = Math.floor(path.pts.length / 2 * prog);
  drawPathPrefix(path, n, 1);
  drawHairline(prog);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    pathStats: function () {
      size();
      var fig = figureRect();
      var p = buildPath(SEED_BASE, fig);
      return {
        segments: p.segments,
        points: p.pts.length / 2,
        maxStep: p.maxStep,
        cellDiag: p.cellDiag,
        counts: p.counts,
        isPhone: isPhone,
        fig: fig
      };
    },
    cycleAt: function (t) { return cycleAt(t); },
    progressAt: function (t) { return progressAt(t, cycleAt(t)); },
    firstPhase: function () { return FIRST_PHASE; },
    drawSeconds: function () { return DRAW_SECONDS; }
  };
}
/* ---- frame one: t = 30, the line pre-advanced to 57 percent ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null, lastDrawn = -1;
draw(FIRST_T);
lastDrawn = FIRST_T;
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    if (clockT - lastDrawn >= 0.08) {
      draw(clockT);
      lastDrawn = clockT;
    }
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
