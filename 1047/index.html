<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fastest Leaves the Longest</title>
<style>
  html, body { margin: 0; padding: 0; background: #050506; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
 * No.1047 "The Fastest Leaves the Longest" (study #128 kyohei-mouri, PP208 "Dispatch").
 *
 * Fourteen identical white nodes, each on its own closed-form path, each with
 * its own speed. The only drawing rule: a node's trail is a strict function
 * of its current speed. History window and peak alpha are linear maps of
 * measured speed; hue is the speed band. Lunges are scheduled accelerations
 * whose phase contribution is a closed-form, zero-net-area bump integral,
 * so every position and every trail is an analytic function of piece time
 * (plus recorded gesture events). Frame one is drawn synchronously at the
 * fixed phase T0 = 15 s, mid-lunge of the big circle node.
 */

// ---------- palette (strict) ----------
var FIELD = '#050506';
var NODEC = '#FFFFFF';
var BAND_SLOW = '#4A5A6A';
var BAND_MED  = '#7FD4FF';
var BAND_FAST = '#FFE9B8';
var BAND_VFAST= '#FF6B6B';

// ---------- seeded rng ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- paths (world is 1000 x 1000, u in [0,1) per lap) ----------
function pLine(A, B) { return function (u) { var s = u < 0.5 ? 2 * u : 2 - 2 * u; return [A[0] + (B[0] - A[0]) * s, A[1] + (B[1] - A[1]) * s]; }; }
function pCirc(c, r) { return function (u) { var a = 2 * Math.PI * u; return [c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)]; }; }
function pLemn(c, a) { return function (u) { var t = 2 * Math.PI * u, s = Math.sin(t), d = 1 + s * s; return [c[0] + a * Math.cos(t) / d, c[1] + a * s * Math.cos(t) / d]; }; }
function pEll(c, rx, ry) { return function (u) { var a = 2 * Math.PI * u; return [c[0] + rx * Math.cos(a), c[1] + ry * Math.sin(a)]; }; }
function pDrift(c, rx, ry, wob) { return function (u) { var a = 2 * Math.PI * u; return [c[0] + rx * Math.sin(a) + wob * Math.sin(3 * a), c[1] + ry * Math.cos(a) + wob * 0.6 * Math.cos(2 * a)]; }; }
function pLiss(c, ax, ay) { return function (u) { var a = 2 * Math.PI * u; return [c[0] + ax * Math.sin(a), c[1] + ay * Math.sin(2 * a)]; }; }

// path definitions: [pathFn, lapsPerLoop]  (loop = 50 s)
var PATH_DEFS = [
  [pLine([80, 150], [920, 830]), 4],    // 0  diagonal line      avg 173 FAST
  [pLine([60, 500], [940, 500]), 3],    // 1  horizontal line    avg 106 MED
  [pCirc([500, 480], 360), 4],          // 2  big circle         avg 181 FAST  (frame-one lunge)
  [pCirc([250, 250], 55), 4],           // 3  tiny circle        avg  28 SLOW
  [pLemn([500, 500], 430), 6],          // 4  big figure-eight   avg 271 VFAST
  [pLemn([500, 520], 210), 4],          // 5  small figure-eight avg  88 MED
  [pEll([500, 500], 430, 150), 2],      // 6  wide ellipse       avg  77 MED
  [pEll([520, 500], 140, 400), 4],      // 7  tall ellipse       avg 144 FAST
  [pDrift([200, 780], 45, 30, 10), 6],  // 8  tiny drift         avg  31 SLOW
  [pDrift([800, 200], 70, 45, 12), 8],  // 9  mid drift          avg  60 MED
  [pLine([500, 60], [500, 940]), 3],    // 10 vertical line      avg 106 MED
  [pLine([150, 850], [560, 640]), 2],   // 11 short line         avg  37 SLOW
  [pCirc([760, 740], 95), 20],          // 12 small fast circle  avg 239 VFAST
  [pLiss([500, 470], 400, 260), 3]      // 13 lissajous curve    avg 169 FAST
];
var LOOP = 50;

// ---------- the grammar: speed -> trail ----------
// v measured in world units / second (world = 1000 units across).
//   history seconds H(v) = clamp(0.4 + (v - 25) * (4.6 / 235), 0.4, 5.0)
//   peak alpha      A(v) = clamp(0.28 + (v - 25) * (0.62 / 235), 0.28, 0.90)
//   band: v < 55 slow #4A5A6A | v < 120 medium #7FD4FF | v < 210 fast #FFE9B8 | else #FF6B6B
function grammarH(v) { var h = 0.4 + (v - 25) * (4.6 / 235); return h < 0.4 ? 0.4 : (h > 5.0 ? 5.0 : h); }
function grammarA(v) { var a = 0.28 + (v - 25) * (0.62 / 235); return a < 0.28 ? 0.28 : (a > 0.90 ? 0.90 : a); }
function bandColor(v) { return v < 55 ? BAND_SLOW : (v < 120 ? BAND_MED : (v < 210 ? BAND_FAST : BAND_VFAST)); }

// ---------- acceleration bumps (lunges and wind) ----------
// A bump is a speed-multiplier deviation with zero net area:
//   tau in [0, 1.2]   : +amp * raisedCos(tau / 1.2)          (the surge, peak x(1+amp))
//   tau in (1.2, 7.2] : -(amp*0.2) * raisedCos((tau-1.2)/6)  (the settle, dips to x(1-amp*0.2))
// Its time integral returns to exactly 0 after 7.2 s, so loop closure holds.
function raisedCos(x) { return 0.5 * (1 - Math.cos(2 * Math.PI * x)); }
function bumpDev(tau, amp) {
  if (tau < 0 || tau > 7.2) return 0;
  if (tau <= 1.2) return amp * raisedCos(tau / 1.2);
  return -amp * 0.2 * raisedCos((tau - 1.2) / 6);
}
function bumpInt(tau, amp) { // integral of bumpDev from 0 to tau, in multiplier-seconds
  if (tau <= 0) return 0;
  if (tau <= 1.2) return amp * (tau / 2 - 1.2 * Math.sin(2 * Math.PI * tau / 1.2) / (4 * Math.PI));
  if (tau >= 7.2) return 0;
  var s = tau - 1.2;
  return amp * 0.6 - amp * 0.2 * (s / 2 - 6 * Math.sin(2 * Math.PI * s / 6) / (4 * Math.PI));
}

// scheduled lunges: [loopOffsetSeconds, nodeIndex]; amp 1.5 (x2.5 at peak)
var LUNGES = [[3.5, 4], [14.3, 2], [25.1, 7], [35.9, 12], [46.7, 0]];
var LUNGE_AMP = 1.5;

// ---------- node state ----------
var seed = 1047208;
var nodes = [];
var windEvents = []; // {node, t0, amp}
var holds = {};      // nodeIndex -> {until, H}

function buildNodes(s) {
  var rnd = mulberry32(s);
  nodes = PATH_DEFS.map(function (d, i) {
    return { path: d[0], laps: d[1], omega: d[1] / LOOP, phase: rnd(), idx: i };
  });
  windEvents = [];
  holds = {};
}
buildNodes(seed);

function phaseAdd(node, t) {
  // closed-form phase contribution (multiplier-seconds) of all bumps on this node
  var sum = 0, k, m, off, ev;
  for (k = 0; k < LUNGES.length; k++) {
    if (LUNGES[k][1] !== node.idx) continue;
    off = LUNGES[k][0];
    var m0 = Math.floor(t / LOOP);
    for (m = m0 - 1; m <= m0 + 1; m++) sum += bumpInt(t - (m * LOOP + off), LUNGE_AMP);
  }
  for (k = 0; k < windEvents.length; k++) {
    ev = windEvents[k];
    if (ev.node === node.idx) sum += bumpInt(t - ev.t0, ev.amp);
  }
  return sum;
}
function nodeU(node, t) {
  var u = node.omega * (t + phaseAdd(node, t)) + node.phase;
  return u - Math.floor(u);
}
function nodePos(node, t) { return node.path(nodeU(node, t)); }
function nodeSpeed(node, t) {
  var e = 0.015;
  var a = nodePos(node, t + e), b = nodePos(node, t - e);
  var dx = a[0] - b[0], dy = a[1] - b[1];
  return Math.sqrt(dx * dx + dy * dy) / (2 * e);
}

// ---------- canvas / viewport ----------
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 720, H = 720, DPR = 1;

function isPhone() {
  var sw = 0, sh = 0;
  if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width || 0; sh = window.screen.height || 0; }
  var mn = Math.min(sw, sh);
  if (mn > 0 && mn < 700) return true;
  return H > W * 1.15;
}
function fit() {
  var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
  if (vv && vv.width) { W = vv.width; H = vv.height; }
  else if (typeof window !== 'undefined' && window.innerWidth) { W = window.innerWidth; H = window.innerHeight; }
  DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? Math.min(window.devicePixelRatio, 2) : 1;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', function () { fit(); draw(currentT); });
  if (window.addEventListener) window.addEventListener('resize', function () { fit(); draw(currentT); });
}
// world (1000x1000) fitted to the smaller dimension, centered
function viewScale() { return Math.min(W, H) / 1000; }
function toScreen(p) { var s = viewScale(); return [(W - 1000 * s) / 2 + p[0] * s, (H - 1000 * s) / 2 + p[1] * s]; }
function toWorld(x, y) { var s = viewScale(); return [(x - (W - 1000 * s) / 2) / s, (y - (H - 1000 * s) / 2) / s]; }

// ---------- drawing ----------
function draw(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = FIELD;
  ctx.fillRect(0, 0, W, H);
  var s = viewScale();
  var lwUnit = Math.max(0.6, s / 0.72); // normalize line widths to the 720 thumb
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  var i, j;
  for (i = 0; i < nodes.length; i++) {
    var node = nodes[i];
    var v = nodeSpeed(node, t);
    var hist = grammarH(v);
    var peak = grammarA(v);
    var hold = holds[node.idx];
    if (hold && t < hold.until) { if (hold.H > hist) hist = hold.H; peak = 0.9; }
    var col = bandColor(v);
    // trail: sample the closed-form path backwards over the history window
    var steps = Math.max(4, Math.min(130, Math.ceil(hist / 0.04)));
    var prev = null;
    ctx.strokeStyle = col;
    for (j = steps; j >= 0; j--) {
      var age = (j / steps) * hist;
      var p = toScreen(nodePos(node, t - age));
      if (prev) {
        var frac = 1 - age / hist;
        ctx.globalAlpha = peak * Math.pow(frac, 1.25);
        ctx.lineWidth = (0.8 + 2.4 * frac) * lwUnit;
        ctx.beginPath();
        ctx.moveTo(prev[0], prev[1]);
        ctx.lineTo(p[0], p[1]);
        ctx.stroke();
      }
      prev = p;
    }
    // the node itself: identical for every mover
    var c = toScreen(nodePos(node, t));
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = NODEC;
    ctx.beginPath(); ctx.arc(c[0], c[1], 7.5 * lwUnit, 0, 2 * Math.PI); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(c[0], c[1], 3.4 * lwUnit, 0, 2 * Math.PI); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------- audio (lazy, gesture-gated, guarded) ----------
var AC = null, audioNodes = null;
function ensureAudio() {
  if (AC) { if (AC.resume) { try { AC.resume(); } catch (e) {} } return; }
  var Ctor = null;
  if (typeof AudioContext !== 'undefined') Ctor = AudioContext;
  else if (typeof window !== 'undefined' && window.webkitAudioContext) Ctor = window.webkitAudioContext;
  if (!Ctor) return;
  try {
    AC = new Ctor();
    var master = AC.createGain(); master.gain.value = 0.12; master.connect(AC.destination);
    var fieldOsc = AC.createOscillator(); fieldOsc.type = 'sine'; fieldOsc.frequency.value = 46;
    var fieldGain = AC.createGain(); fieldGain.gain.value = 0.05;
    fieldOsc.connect(fieldGain); fieldGain.connect(master); fieldOsc.start();
    var speedOsc = AC.createOscillator(); speedOsc.type = 'triangle'; speedOsc.frequency.value = 160;
    var speedGain = AC.createGain(); speedGain.gain.value = 0.012;
    speedOsc.connect(speedGain); speedGain.connect(master); speedOsc.start();
    audioNodes = { master: master, speedOsc: speedOsc };
  } catch (e) { AC = null; audioNodes = null; }
}
function lungeWhine() {
  if (!AC || !audioNodes) return;
  try {
    var t0 = AC.currentTime;
    var o = AC.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(240, t0);
    o.frequency.exponentialRampToValueAtTime(880, t0 + 0.9);
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.05, t0 + 0.15);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.1);
    o.connect(g); g.connect(audioNodes.master);
    o.start(t0); o.stop(t0 + 1.15);
  } catch (e) {}
}

// ---------- interaction (recorded events only; frame one is pre-input) ----------
var T0 = 15;
var currentT = T0;
var startStamp = null;
var downInfo = null;
var lastTapT = -10, lastWindStamp = -10;

function pieceT(nowMs) { return T0 + (nowMs - startStamp) / 1000; }
function ptrWorld(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return toWorld(e.clientX - r.left, e.clientY - r.top);
}
function nearestNode(wp, maxD) {
  var best = -1, bd = maxD, i;
  for (i = 0; i < nodes.length; i++) {
    var p = nodePos(nodes[i], currentT);
    var d = Math.hypot(p[0] - wp[0], p[1] - wp[1]);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
function addWind(wp) {
  var i;
  for (i = 0; i < nodes.length; i++) {
    var p = nodePos(nodes[i], currentT);
    if (Math.hypot(p[0] - wp[0], p[1] - wp[1]) < 260) {
      windEvents.push({ node: i, t0: currentT, amp: 1.1 });
    }
  }
  // prune spent events
  windEvents = windEvents.filter(function (ev) { return currentT - ev.t0 < 9; });
  if (windEvents.length > 240) windEvents = windEvents.slice(windEvents.length - 240);
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    downInfo = { t: currentT, moved: false };
    lastWindStamp = currentT;
    addWind(ptrWorld(e));
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!downInfo) return;
    downInfo.moved = true;
    if (currentT - lastWindStamp > 0.25) { lastWindStamp = currentT; addWind(ptrWorld(e)); }
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!downInfo) return;
    var wasDrag = downInfo.moved || (currentT - downInfo.t > 0.3);
    downInfo = null;
    if (wasDrag) return;
    // tap
    if (currentT - lastTapT < 0.35) {
      // double-tap: new movers
      seed = (seed * 1664525 + 1013904223) >>> 0;
      buildNodes(seed);
      lastTapT = -10;
      draw(currentT);
      return;
    }
    lastTapT = currentT;
    var idx = nearestNode(ptrWorld(e), 70);
    if (idx >= 0) {
      var v = nodeSpeed(nodes[idx], currentT);
      holds[idx] = { until: currentT + 5, H: grammarH(v) };
    }
  });
  canvas.addEventListener('pointercancel', function () { downInfo = null; });
}

// ---------- boot: frame one at fixed phase, then the live loop ----------
fit();
draw(T0);

if (typeof requestAnimationFrame !== 'undefined') {
  var prevT = T0;
  var loop = function (ms) {
    if (startStamp === null) startStamp = ms;
    currentT = pieceT(ms);
    // lunge whines: fire when a scheduled lunge start is crossed
    var k, m;
    for (k = 0; k < LUNGES.length; k++) {
      var off = LUNGES[k][0];
      var m0 = Math.floor(prevT / LOOP);
      for (m = m0; m <= m0 + 1; m++) {
        var st = m * LOOP + off;
        if (prevT < st && currentT >= st) lungeWhine();
      }
    }
    // speed voice follows the fastest mover
    if (AC && audioNodes) {
      var vmax = 0, i;
      for (i = 0; i < nodes.length; i++) { var v = nodeSpeed(nodes[i], currentT); if (v > vmax) vmax = v; }
      try { audioNodes.speedOsc.frequency.setTargetAtTime(110 + vmax * 0.9, AC.currentTime, 0.1); } catch (e) {}
    }
    prevT = currentT;
    draw(currentT);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
