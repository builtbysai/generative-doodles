<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ninety Over Six</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0C0C0E; }
  canvas { display:block; touch-action:none; }
  .hint { position:fixed; left:0; right:0; bottom:14px; text-align:center;
    font:12px/1.4 monospace; color:#6b6353; letter-spacing:0.08em; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">drag to change the division</div>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
var GRID = '#C9BFA8', INKC = '#22335C', ACCENT = '#B3552E', PAPER = '#F4EFE3';
var DIVS = [4, 6, 8, 12];
var divIdx = 1;                 // opens at six: ninety over six
var accentIdx = 5;              // which tile in twelve burns orange
var anim = 1;                   // rebuild draw-on; 1 = complete (frame one developed)
var lastAnim = 0;

function rosette(cx, cy, r, n, small) {
  var i, a, pts = [];
  for (i = 0; i < n; i++) {
    a = -Math.PI / 2 + i * 2 * Math.PI / n;
    pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  // petals: an arc out to each vertex from its neighbours' midpoint
  for (i = 0; i < n; i++) {
    var p = pts[i], q = pts[(i + 1) % n];
    var mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
    var dx = mx - cx, dy = my - cy, d = Math.hypot(dx, dy) || 1;
    ctx.beginPath();
    ctx.moveTo(p[0], p[1]);
    ctx.quadraticCurveTo(mx + dx / d * r * 0.30, my + dy / d * r * 0.30, q[0], q[1]);
    ctx.stroke();
  }
  // the {n/2} star the corner division implies (two interleaved components)
  var st, v;
  for (st = 0; st < 2; st++) {
    ctx.beginPath();
    for (i = 0; i <= n / 2; i++) {
      v = pts[(st + i * 2) % n];
      if (i === 0) ctx.moveTo(v[0], v[1]); else ctx.lineTo(v[0], v[1]);
    }
    ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx, cy, r * (small ? 0.20 : 0.16), 0, Math.PI * 2); ctx.stroke();
}

function draw(now) {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  if (anim < 1) anim = clamp01((now - lastAnim) / 800);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  var n = DIVS[divIdx];
  var s = Math.min(W, H) / 6.4;
  var rh = s * 0.866;                       // the root-3 half of the grid
  var i, j, x, y;

  // the square + root-3 construction grid, drawn first in the rebuild
  ctx.strokeStyle = GRID; ctx.lineWidth = 1;
  ctx.globalAlpha = 0.55 * Math.min(1, anim * 2);
  ctx.beginPath();
  for (x = 0; x <= W + s; x += s) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (y = 0; y <= H + s; y += s) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  for (y = -H; y <= H * 2; y += rh) { ctx.moveTo(0, y); ctx.lineTo(W, y + W * 0.577); }
  for (y = 0; y <= H * 2; y += rh) { ctx.moveTo(0, y); ctx.lineTo(W, y - W * 0.577); }
  ctx.stroke();
  ctx.globalAlpha = 1;

  // rosette field on the lattice, half-scale pattern in the cells;
  // one tile in twelve burns orange, scattered by a hash of its position
  var rr = s * 0.46 * (0.85 + 0.15 * anim);
  ctx.lineWidth = 1.5;
  for (j = -1; j * rh < H + s; j++) {
    for (i = -1; i * s < W + s; i++) {
      x = i * s + (j % 2 ? s / 2 : 0);
      y = j * rh;
      ctx.globalAlpha = anim;
      ctx.strokeStyle = (((i * 31 + j * 17) % 12 + 12) % 12 === accentIdx) ? ACCENT : INKC;
      rosette(x, y, rr, n, false);
      ctx.strokeStyle = INKC;
      ctx.globalAlpha = anim * 0.5;
      rosette(x + s / 2, y + rh / 2, rr * 0.5, n, true);
    }
  }
  ctx.globalAlpha = 1;

  // the construction corner, marked on its own cleared inset:
  // a 90 degree corner with its n rays, as on her sheets
  var px0 = s * 0.15, py0 = H - s * 1.5, pw2 = s * 1.8, ph2 = s * 1.35;
  ctx.fillStyle = PAPER; ctx.fillRect(px0, py0, pw2, ph2);
  ctx.strokeStyle = GRID; ctx.lineWidth = 1.5; ctx.strokeRect(px0, py0, pw2, ph2);
  var kx = px0 + s * 0.28, ky = py0 + ph2 - s * 0.28, L = s * 1.05;
  ctx.save();
  ctx.beginPath(); ctx.rect(px0, py0, pw2, ph2); ctx.clip();
  ctx.strokeStyle = INKC; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(kx, ky - L * 0.55); ctx.lineTo(kx, ky); ctx.lineTo(kx + L * 0.55, ky);
  ctx.stroke();
  ctx.lineWidth = 1.4;
  for (i = 0; i <= n; i++) {
    var a = -i * (Math.PI / 2) / n;
    ctx.beginPath();
    ctx.moveTo(kx, ky);
    ctx.lineTo(kx + Math.cos(a) * L, ky + Math.sin(a) * L);
    ctx.stroke();
  }
  ctx.strokeStyle = GRID; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(kx, ky, L * 1.02, -Math.PI / 2, 0); ctx.stroke();
  ctx.fillStyle = ACCENT;
  ctx.beginPath(); ctx.arc(kx, ky, 4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

var dragX = null, lastTap = { t: 0, x: 0, y: 0 };
canvas.addEventListener('pointerdown', function (e) {
  var now = Date.now();
  if (now - lastTap.t < 320 && Math.abs(e.clientX - lastTap.x) < 44 && Math.abs(e.clientY - lastTap.y) < 44) {
    accentIdx = (accentIdx + 5) % 12;
    lastTap.t = 0; dragX = null;
    return;
  }
  lastTap = { t: now, x: e.clientX, y: e.clientY };
  dragX = e.clientX;
});
canvas.addEventListener('pointermove', function (e) {
  if (dragX === null) return;
  var dx = e.clientX - dragX;
  if (Math.abs(dx) > 110) {
    var step = dx > 0 ? 1 : -1;
    var ni = Math.max(0, Math.min(DIVS.length - 1, divIdx + step));
    if (ni !== divIdx) { divIdx = ni; anim = 0; lastAnim = performance.now(); }
    dragX = e.clientX;
  }
});
function endDrag() { dragX = null; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

resize();
draw(0);
function frame(ts) {
  draw(ts || 0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
