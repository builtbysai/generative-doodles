<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.404 Morning Book</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#A8005F; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.404 Morning Book (nina-clausonet, NINA4).
// After Nina Clausonet's faith-cozy self-care muse:
// white hair ballooning into a giant halo-heart field
// filling the left half, the muse right of centre with
// closed eyes, holding a small dark-red book with a
// pink cross at her chest, and six cosmos flowers
// growing out of the book's top edge, arcing into the
// halo. The prompt's magenta-to-fuchsia gradient takes
// the house stepped treatment: seven flat bands. Six
// translucent ray wedges fan behind the figure and
// oscillate on whole cycles of the 36s master loop;
// the halo breathes 0.99-1.01 on a 12s cycle (three
// whole cycles per loop); the flowers sway on staggered
// whole-cycle periods. The one caption line, "hope is
// a quiet morning", is designed text per the prompt:
// its envelope on the piece clock fades in over
// 0-2s, holds 2-6s, fades out 6-8s and never returns.
// The clock is ANCHORED at the constant T = 4.0s, so
// the synchronous first frame is the designed opening
// with the caption at full presence and the flowers
// at bloom stage 1; from load the caption holds, fades
// out by 8s of piece time, and is gone for good.
// TAP the book: the flowers advance one bloom stage
// (0 bud, 1 half, 2 full, cycling) with a 0.9s ease,
// and a stepped flat glow ring pulses from the book,
// light only, no audio. Grain is fixed speckle DATA
// baked from a fixed seed: 520 gray dots inside the
// heart, 800 paper dots over the whole field. One
// canvas, flat colour only; no gradients, no filters,
// no shadowBlur, no offscreen canvas.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var BANDS = ['#A8005F', '#B00965', '#B7116B', '#BF1A72', '#C72278', '#CE2B7E', '#D63384'];
var HAIR = '#F5F2EC', GRAY = '#B5AEA2';
var BOOK = '#7B1E2B', CROSS = '#F2A0C0';
var PURPLE = '#9B3D9B', PINK = '#E56B9B', LEAF = '#7A8B4F';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 36;
if (LOOP !== 36) throw new Error('Morning Book loop must be 36s');
var TICK = 1 / 60;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every placement
// below is baked from this at load and never changes
// between frames or renders.
var seed = 404;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// ---- small drawing helpers (local design coords) -------
function ell(x, y, rx, ry, rot, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fill();
}
function ellA(x, y, rx, ry, rot, color, alpha) {
  ctx.globalAlpha = alpha;
  ell(x, y, rx, ry, rot, color);
  ctx.globalAlpha = 1;
}
function circ(x, y, r, color) { ell(x, y, r, r, 0, color); }
function seg(x1, y1, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function curve(x1, y1, cx, cy, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke();
}
function blob(color, pts) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i + 5 < pts.length; i += 6) {
    ctx.bezierCurveTo(pts[i], pts[i + 1], pts[i + 2], pts[i + 3], pts[i + 4], pts[i + 5]);
  }
  ctx.closePath();
  ctx.fill();
}
function poly(color, pts) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i + 1 < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  ctx.fill();
}

// ---- background bands ----------------------------------
// Seven authored flat steps from deep magenta to
// fuchsia, top to bottom.
if (BANDS.length !== 7) throw new Error('Morning Book needs 7 bands');

// ---- light rays ----------------------------------------
// Six translucent wedges fanning up from behind the
// figure; alpha and angle oscillate on whole cycles
// of the 36s loop.
var RAY_ORIGIN = { x: 700, y: 410 };
var RAYS = [];
for (var ri = 0; ri < 6; ri++) {
  RAYS.push({ ang: -2.75 + ri * 0.4, half: 0.115, len: 980, ph: ri * Math.PI / 3 });
}
if (RAYS.length !== 6) throw new Error('Morning Book needs exactly 6 rays');

// ---- the halo-heart ------------------------------------
// Parametric heart, sampled as a polygon so the grain
// points placed inside the same param field are
// guaranteed to sit inside the drawn shape.
var HEART = { cx: 420, cy: 400, k: 20 };
function heartPoint(t, s) {
  var sn = Math.sin(t);
  var hx = 16 * sn * sn * sn;
  var hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return { x: HEART.cx + hx * HEART.k * s, y: HEART.cy - hy * HEART.k * s };
}
var HEART_PATH = [];
for (var hi = 0; hi < 72; hi++) HEART_PATH.push(heartPoint(hi / 72 * Math.PI * 2, 1));

// Gray grain inside the hair: 520 fixed dots in the
// heart's param field (scale up to 0.95, so always
// inside the outline), drawn in heart-local space so
// they breathe with the halo.
var HAIR_GRAIN = [];
for (var gi = 0; gi < 520; gi++) {
  var gt = rnd() * Math.PI * 2;
  var gs = Math.sqrt(rnd()) * 0.95;
  var gp = heartPoint(gt, gs);
  HAIR_GRAIN.push({ x: gp.x - HEART.cx + (rnd() - 0.5) * 12, y: gp.y - HEART.cy + (rnd() - 0.5) * 12, r: 0.8 + rnd() * 1.1 });
}
if (HAIR_GRAIN.length !== 520) throw new Error('hair grain count broken');

// Paper grain over the whole field: 800 fixed dots,
// alternating light and dark at low alpha.
var GRAIN = [];
for (var pi = 0; pi < 800; pi++) {
  GRAIN.push({ x: rnd() * DW, y: rnd() * DH, r: 0.8 + rnd() * 1.5, dark: pi % 2 === 0 });
}
if (GRAIN.length !== 800) throw new Error('paper grain count broken');

// ---- the book ------------------------------------------
// Chest centre, axis-aligned so the tap hit-test is
// the drawn rectangle.
var BOOK_RECT = { x: 705, y: 503, w: 190, h: 130 };
var BOOK_C = { x: BOOK_RECT.x + BOOK_RECT.w / 2, y: BOOK_RECT.y + BOOK_RECT.h / 2 };

// ---- the flowers ---------------------------------------
// Exactly six stem recipes growing out of the book's
// top edge and arcing left into the halo. Anchors sit
// on the book's top edge; heads, controls and leaves
// are stored relative to the anchor so each flower
// sways as one piece around its anchor. Sway periods
// divide the 36s loop; phases are staggered.
var FLOWERS = [
  { ax: 738, head: [-50, -185], ctrl: [-64, -120], size: 1.00, col: PURPLE, per: 18, ph: 0.0 },
  { ax: 762, head: [-150, -251], ctrl: [-120, -160], size: 0.80, col: PINK, per: 12, ph: 1.3 },
  { ax: 786, head: [-258, -281], ctrl: [-190, -180], size: 1.15, col: PURPLE, per: 18, ph: 2.6 },
  { ax: 810, head: [-358, -241], ctrl: [-260, -160], size: 0.90, col: PINK, per: 36, ph: 3.9 },
  { ax: 834, head: [-186, -111], ctrl: [-140, -80], size: 1.05, col: PINK, per: 12, ph: 5.2 },
  { ax: 856, head: [-290, -155], ctrl: [-220, -110], size: 0.75, col: PURPLE, per: 18, ph: 4.4 }
];
if (FLOWERS.length !== 6) throw new Error('Morning Book needs exactly 6 flowers');
var STEM_TOP = 502;

// ---- state ----------------------------------------------
// Constant first-frame phase: T = 4.0s, the caption
// in its hold window at full presence, the flowers
// at bloom stage 1, the ambient loop developed.
var T = 4.0;
var lastNow = -1, acc = 0;
var stageCur = 1, stageNext = 1; // 0 bud, 1 half, 2 full, then wraps
var glowStart = -10;

function step() {
  // Bloom ease: 0.9s of ticks toward the target stage.
  if (stageCur < stageNext) stageCur = Math.min(stageNext, stageCur + TICK / 0.9);
  else if (stageCur > stageNext) stageCur = Math.max(stageNext, stageCur - TICK / 0.9);
}
// Bloom amount 0..1 from the stage clock: stages
// 0, 1, 2 map to 0, 0.5, 1; past 2 it closes back
// through half to bud as the stage wraps to 3 = 0.
function bloomAmount() {
  var p = stageCur % 3;
  return p <= 2 ? p / 2 : 3 - p;
}
// Caption envelope on the piece clock: in over
// 0-2s, hold 2-6s, out 6-8s, then gone for good.
function captionAlpha(t) {
  if (t < 0 || t >= 8) return 0;
  if (t < 2) return t / 2;
  if (t < 6) return 1;
  return 1 - (t - 6) / 2;
}

// ---- pieces of the scene --------------------------------
function drawBands() {
  // Letterbox ground first: the page above the frame
  // takes the top band, below it the bottom band, so
  // the centred fit sits on the piece's own colours.
  ctx.fillStyle = BANDS[0];
  ctx.fillRect(-2400, -2400, DW + 4800, 2400);
  ctx.fillStyle = BANDS[BANDS.length - 1];
  ctx.fillRect(-2400, DH, DW + 4800, 2400);
  var bh = DH / BANDS.length;
  for (var i = 0; i < BANDS.length; i++) {
    ctx.fillStyle = BANDS[i];
    ctx.fillRect(-2400, i * bh - 2, DW + 4800, bh + 4);
  }
}

function drawRays(t) {
  var drift = 0.02 * Math.sin(Math.PI * 2 * t / LOOP);
  for (var i = 0; i < RAYS.length; i++) {
    var r = RAYS[i];
    var a = 0.045 + 0.028 * (0.5 + 0.5 * Math.sin(Math.PI * 2 * t / LOOP + r.ph));
    var ang = r.ang + drift;
    ctx.globalAlpha = a;
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.moveTo(RAY_ORIGIN.x, RAY_ORIGIN.y);
    ctx.lineTo(RAY_ORIGIN.x + Math.cos(ang - r.half) * r.len, RAY_ORIGIN.y + Math.sin(ang - r.half) * r.len);
    ctx.lineTo(RAY_ORIGIN.x + Math.cos(ang + r.half) * r.len, RAY_ORIGIN.y + Math.sin(ang + r.half) * r.len);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawHalo(t) {
  // Breathes 0.99-1.01 on a 12s cycle about its centre.
  var b = 1 + 0.01 * Math.sin(Math.PI * 2 * t / 12);
  ctx.save();
  ctx.translate(HEART.cx, HEART.cy);
  ctx.scale(b, b);
  ctx.translate(-HEART.cx, -HEART.cy);
  ctx.fillStyle = HAIR;
  ctx.beginPath();
  ctx.moveTo(HEART_PATH[0].x, HEART_PATH[0].y);
  for (var i = 1; i < HEART_PATH.length; i++) ctx.lineTo(HEART_PATH[i].x, HEART_PATH[i].y);
  ctx.closePath();
  ctx.fill();
  // Gray grain riding inside the hair.
  ctx.fillStyle = GRAY;
  ctx.globalAlpha = 0.28;
  for (var g = 0; g < HAIR_GRAIN.length; g++) {
    var d = HAIR_GRAIN[g];
    ctx.beginPath();
    ctx.ellipse(HEART.cx + d.x, HEART.cy + d.y, d.r, d.r, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawMuse() {
  // Hair band flowing from the halo to the head.
  ell(782, 322, 96, 118, 0.25, HAIR);
  // Dress: purple, shoulders to a flat hem.
  blob(PURPLE, [768, 428,
    800, 414, 892, 414, 922, 428,
    946, 560, 962, 690, 972, 812,
    880, 824, 800, 824, 718, 812,
    728, 690, 744, 560, 768, 428]);
  // Head hair mass, then the pale face set into it.
  circ(845, 316, 92, HAIR);
  ell(845, 344, 58, 67, 0, HAIR);
  // Fringe scallops along the hairline.
  circ(806, 292, 17, HAIR);
  circ(832, 282, 18, HAIR);
  circ(859, 282, 18, HAIR);
  circ(885, 292, 17, HAIR);
  // Closed eyes, a small nose, lips, blush: the muse's
  // serene face in book red and flower pink.
  curve(810, 344, 820, 352, 831, 344, 3.5, BOOK);
  curve(859, 344, 870, 352, 880, 344, 3.5, BOOK);
  curve(843, 362, 848, 366, 843, 371, 2.5, BOOK);
  ell(845, 388, 10, 5.5, 0, PINK);
  ellA(808, 372, 11, 6, 0, PINK, 0.35);
  ellA(882, 372, 11, 6, 0, PINK, 0.35);
  // Sleeves reaching in to hold the book.
  seg(776, 468, 726, 578, 30, PURPLE);
  seg(912, 468, 884, 582, 30, PURPLE);
}

function drawBook() {
  // Page block peeking at the right edge, then the
  // dark-red cover and its simple pink cross.
  ctx.fillStyle = HAIR;
  ctx.fillRect(BOOK_RECT.x + 8, BOOK_RECT.y + 7, BOOK_RECT.w, BOOK_RECT.h - 10);
  ctx.fillStyle = BOOK;
  ctx.fillRect(BOOK_RECT.x, BOOK_RECT.y, BOOK_RECT.w, BOOK_RECT.h);
  seg(BOOK_C.x, BOOK_RECT.y + 28, BOOK_C.x, BOOK_RECT.y + BOOK_RECT.h - 28, 11, CROSS);
  seg(BOOK_C.x - 27, BOOK_RECT.y + 50, BOOK_C.x + 27, BOOK_RECT.y + 50, 11, CROSS);
  // Hands over the cover edges.
  ell(712, 588, 17, 13, 0.2, HAIR);
  ell(890, 590, 17, 13, -0.2, HAIR);
}

function drawGlow(t) {
  var p = (t - glowStart) / 1.0;
  if (p < 0 || p >= 1) return;
  // Stepped flat rings: radius advances in sixths,
  // three rings at fixed alpha steps, light only.
  var stepR = Math.floor(p * 6) / 6 * 165;
  var cols = [CROSS, HAIR, CROSS];
  var alphas = [0.28, 0.16, 0.09];
  for (var i = 0; i < 3; i++) {
    var r = stepR + i * 27;
    if (r <= 0) continue;
    ctx.globalAlpha = alphas[i] * (1 - p * 0.5);
    ctx.strokeStyle = cols[i];
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.ellipse(BOOK_C.x, BOOK_C.y, r, r * 0.78, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function quadAt(x1, y1, cx, cy, x2, y2, t) {
  var u = 1 - t;
  return { x: u * u * x1 + 2 * u * t * cx + t * t * x2, y: u * u * y1 + 2 * u * t * cy + t * t * y2 };
}

function drawFlower(f, t, b) {
  var sway = 0.045 * Math.sin(Math.PI * 2 * t / f.per + f.ph);
  ctx.save();
  ctx.translate(f.ax, STEM_TOP);
  ctx.rotate(sway);
  var hx = f.head[0], hy = f.head[1];
  var cx = f.ctrl[0], cy = f.ctrl[1];
  // Stem.
  curve(0, 0, cx, cy, hx, hy, 5, LEAF);
  // Two leaves along the stem.
  var l1 = quadAt(0, 0, cx, cy, hx, hy, 0.45);
  var l2 = quadAt(0, 0, cx, cy, hx, hy, 0.7);
  ell(l1.x - 11, l1.y, 15, 6.5, -0.6, LEAF);
  ell(l2.x + 11, l2.y, 13, 6, 0.6, LEAF);
  // Sepal under the head while the bloom is young.
  if (b < 0.55) ell(hx, hy + 8, 8, 12, 0, LEAF);
  // Cosmos head: eight petals that unfold and grow
  // with the bloom amount; at bud they cluster shut
  // pointing up.
  var plen = (6 + 25 * b) * f.size;
  var pwid = (3 + 8.5 * b) * f.size;
  for (var i = 0; i < 8; i++) {
    var full = i / 8 * Math.PI * 2 - Math.PI / 2;
    var ang = -Math.PI / 2 + (full + Math.PI / 2) * b;
    var px = hx + Math.cos(ang) * plen * 0.55;
    var py = hy + Math.sin(ang) * plen * 0.55;
    ell(px, py, plen * 0.52, pwid, ang, f.col);
  }
  circ(hx, hy, (3 + 4.5 * b) * f.size, CROSS);
  ctx.restore();
}

function draw() {
  var t = T;
  var lt = t % LOOP;
  drawBands();
  // Everything else lives inside the design frame.
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, DW, DH);
  ctx.clip();
  drawRays(lt);
  drawHalo(lt);
  drawMuse();
  drawBook();
  var b = bloomAmount();
  for (var i = 0; i < FLOWERS.length; i++) drawFlower(FLOWERS[i], lt, b);
  drawGlow(t);
  // Paper grain over everything, fixed order.
  for (var g = 0; g < GRAIN.length; g++) {
    var d = GRAIN[g];
    ctx.globalAlpha = d.dark ? 0.06 : 0.05;
    ctx.fillStyle = d.dark ? BOOK : HAIR;
    ctx.beginPath();
    ctx.ellipse(d.x, d.y, d.r, d.r, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // The caption, once at load: designed text in a
  // serif hand register, alpha from its envelope.
  var ca = captionAlpha(t);
  if (ca > 0) {
    ctx.globalAlpha = ca;
    ctx.fillStyle = HAIR;
    ctx.font = 'italic 42px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('hope is a quiet morning', DW / 2, 852);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// ---- pointer: tap the book ------------------------------
// A press inside the book rectangle advances the
// bloom stage and starts the glow pulse. Coordinates
// convert through the stored fit transform.
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  if (p.x >= BOOK_RECT.x - 14 && p.x <= BOOK_RECT.x + BOOK_RECT.w + 14 &&
      p.y >= BOOK_RECT.y - 14 && p.y <= BOOK_RECT.y + BOOK_RECT.h + 14) {
    stageNext += 1;
    glowStart = T;
  }
});

// ---- sizing: centred fit, page ground = deep magenta ---
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
