<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The False Medium's Real Vision</title>
<style>

</style>
</head>

  var F = { x: fx, y: fy };

  }
  else if (u < 42) { p = isTrue ? A : F; }

    if (isTrue && u < 48) { p = { x: lerp(A.x, F.x, ss(42, 48, u)), y: lerp(A.y, F.y, ss(42, 48, u)) }; }

  else if (u < 58) { p = { x: lerp(F.x, B.x, ss(50, 58, u)), y: lerp(F.y, B.y, ss(50, 58, u)) }; }

    x: p.x + wob * Math.sin(2 * Math.PI * lt / 60 + FRAG[i].phase),

/* Drag state: closed-form over recorded events and t. */
var activeDrag = null;
var lastRelease = {};
var intervals = [];
function glowExtra(t) {
  var c = cycleAt(t);
  if (c.u < 30) { return 0; }
  var gs = c.start + 30, ge = c.start + 42;
  var extra = 0;
  for (var d = 0; d < intervals.length; d++) {
    var iv = intervals[d];
    if (iv.frag !== c.data.trueIdx) { continue; }

}
function fragColor(i, t) {
  var c = cycleAt(t);
  var u = c.u;
  var base = FRAG[i].base;
  if (i === c.data.trueIdx) {
    var ge = 42 + glowExtra(t);
    if (u < 12) { return base; }
    if (u < 20) { return mix(base, GOLD, ss(12, 20, u)); }
    if (u < 30) { return GOLD; }
    if (u < 32) { return mix(GOLD, GREEN, ss(30, 32, u)); }
    if (u < ge) { return GREEN; }
    if (u < ge + 2) { return mix(GREEN, GOLD, ss(ge, ge + 2, u)); }
    if (u < 58) { return GOLD; }
    return mix(GOLD, base, ss(58, 60, u));
  }
  if (u < 12) { return base; }
  if (u < 20) { return mix(base, GOLD, ss(12, 20, u)); }

  var c = cycleAt(t);

  var u = c.u;
  var ge = 42 + glowExtra(t);

  if (u < 32) { return ss(30, 32, u); }

      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== "undefined" && window.innerWidth) {
      w = window.innerWidth; h = window.innerHeight;

}

  var x = (typeof e.offsetX === "number") ? e.offsetX : e.clientX;
  var y = (typeof e.offsetY === "number") ? e.offsetY : e.clientY;

    ctx.strokeRect(x - w * 0.28, y - h * 0.32, w * 0.56, h * 0.64);
    ctx.fillRect(x + w * 0.14, y + h * 0.02, 3 * s, 3 * s);

    ctx.lineTo(x + w * 0.3, y + h * 0.12);

    ctx.moveTo(x, y - h * 0.3);
