<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghosts of the Piece</title>
<style>
html, body { margin: 0; padding: 0; background: #D8DAD6; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#D8DAD6'; /* fog grey ground, the paper the memory is read on */
var FRAME_T = 60.0; /* fixed phase: t = 60 s, buffer already holding faded gestures */
var SALT = '#F2F0EA'; /* salt white */
var FOG = '#8E9599'; /* fog grey */
var WATER = '#0E1A22'; /* deep water blue-black */
var PLATE_FILL = '#0E1A22';
var PLATE_LINE = 'rgba(242,240,234,0.30)';
var PLATE_INK = '#F2F0EA';
var HINT_INK = '#F2F0EA';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* Lighten a hex color toward salt white by f (0 to 1). Ghost events
   render 30 percent lighter than their original. */
function lighten(hex, f) {
  var c = rgb(hex), s = rgb(SALT);
  var r = Math.round(c[0] + (s[0] - c[0]) * f);
  var g = Math.round(c[1] + (s[1] - c[1]) * f);
  var b = Math.round(c[2] + (s[2] - c[2]) * f);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
/* ---- the memory buffer: timestamped gesture records, seed 1797 ----
   Each record: type, t0 (seconds the gesture was made), tau (fade
   time constant), base alpha, color, geometry in field fractions.
   The renderer draws ONLY records, each with exponential fade by age.
   Nothing is ever drawn live. */
var RECORDS = [];
(function buildRecords() {
  var rng = mulberry32(1797);
  var i;
  /* the water itself is a record: a deep band below the horizon,
     made early, fading slowly so it still reads at frame one */
  RECORDS.push({ type: 'water', t0: 2, tau: 200, base: 0.92, color: WATER });
  /* the headland: one long low line on the left, made early, slow fade */
  RECORDS.push({
    type: 'headland', t0: 6, tau: 120, base: 0.85, color: WATER,
    pts: [[0.00, 0.620], [0.06, 0.606], [0.12, 0.578], [0.18, 0.556],
          [0.24, 0.568], [0.30, 0.592], [0.36, 0.612], [0.42, 0.620]]
  });
  /* two fog bands in the sky, wide and faint, slow fade */
  RECORDS.push({ type: 'fog', t0: 10, tau: 150, base: 0.16, color: FOG, y: 0.15, h: 0.07 });
  RECORDS.push({ type: 'fog', t0: 14, tau: 150, base: 0.12, color: FOG, y: 0.33, h: 0.06 });
  /* wave arcs breaking in the water band, spread through the first minute */
  var waveT = [18, 23, 29, 34, 41, 47, 54];
  for (i = 0; i < waveT.length; i++) {
    RECORDS.push({
      type: 'wave', t0: waveT[i], tau: 26, base: 0.50 + rng() * 0.25, color: WATER,
      x: 0.06 + rng() * 0.88, y: 0.70 + rng() * 0.22,
      rx: 0.03 + rng() * 0.05, ry: 0.012 + rng() * 0.016
    });
  }
  /* bird paths crossing the sky, always peripheral, never the center */
  var birdX = [0.08, 0.20, 0.76, 0.86, 0.68];
  var birdY = [0.14, 0.26, 0.12, 0.24, 0.36];
  var birdT = [12, 21, 30, 44, 52];
  for (i = 0; i < birdX.length; i++) {
    RECORDS.push({
      type: 'bird', t0: birdT[i], tau: 18, base: 0.60 + rng() * 0.20, color: WATER,
      x: birdX[i], y: birdY[i], s: 0.018 + rng() * 0.012
    });
  }
})();
/* ---- the ghost scheduler, seed 1797 ----
   Ghost events re-insert a mutated copy of an old record: drifted in
   position, slightly rescaled, 30 percent lighter. Fixed schedule so
   frame one (t = 60 s) holds one ghost mid-replay: the wave ghost
   born at 56.5 s, 3.5 s into its replay. */
var GHOSTS = [];
(function buildGhosts() {
  var rng = mulberry32(1797 + 41);
  var plan = [
    { gt0: 24.0, src: 12 }, { gt0: 41.0, src: 15 }, { gt0: 56.5, src: 8 },
    { gt0: 78.0, src: 11 }, { gt0: 102.0, src: 13 }, { gt0: 141.0, src: 9 },
    { gt0: 173.0, src: 14 }, { gt0: 205.0, src: 10 }
  ];
  var i, p;
  for (i = 0; i < plan.length; i++) {
    p = plan[i];
    GHOSTS.push({
      gt0: p.gt0, src: p.src,
      dx: (rng() - 0.5) * 0.05, dy: (rng() - 0.5) * 0.03,
      sc: 0.88 + rng() * 0.24
    });
  }
})();
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
var HORIZON = 0.62; /* low horizon, large empty sky above */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
/* Fade by age: exponential decay, never below zero, never above base. */
function fade(rec, t) {
  var age = t - rec.t0;
  if (age < 0) return 0;
  return rec.base * Math.exp(-age / rec.tau);
}
/* Ghost envelope: rises over 2 s, then decays with a 14 s time constant. */
function ghostFade(g, t) {
  var age = t - g.gt0;
  if (age < 0) return 0;
  if (age < 2) return 0.8 * (age / 2);
  return 0.8 * Math.exp(-(age - 2) / 14);
}
function drawHeadland(rec, alpha, dx, dy, sc) {
  var i, px, py;
  var cx = F.x + 0.18 * F.w; /* scale about the headland midpoint */
  var cy = F.y + HORIZON * F.h;
  ctx.strokeStyle = rgba(rec.color, alpha);
  ctx.lineWidth = Math.max(1.5, F.w * 0.004);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (i = 0; i < rec.pts.length; i++) {
    px = cx + (F.x + rec.pts[i][0] * F.w - cx) * sc + dx * F.w;
    py = cy + (F.y + rec.pts[i][1] * F.h - cy) * sc + dy * F.h;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
}
function drawWave(rec, alpha, dx, dy, sc) {
  var cx = F.x + rec.x * F.w + dx * F.w;
  var cy = F.y + rec.y * F.h + dy * F.h;
  ctx.strokeStyle = rgba(rec.color, alpha);
  ctx.lineWidth = Math.max(1.2, F.w * 0.0025);
  ctx.beginPath();
  ctx.moveTo(cx - rec.rx * sc * F.w, cy);
  ctx.ellipse(cx, cy, rec.rx * sc * F.w, rec.ry * sc * F.h, 0, Math.PI, TAU);
  ctx.stroke();
}
function drawBird(rec, alpha, dx, dy, sc) {
  var bx = F.x + rec.x * F.w + dx * F.w;
  var by = F.y + rec.y * F.h + dy * F.h;
  var s = rec.s * sc * F.w;
  ctx.strokeStyle = rgba(rec.color, alpha);
  ctx.lineWidth = Math.max(1.2, F.w * 0.0022);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(bx - s, by - s * 0.25);
  ctx.lineTo(bx, by + s * 0.35);
  ctx.lineTo(bx + s, by - s * 0.25);
  ctx.stroke();
}
function drawRecord(rec, t, override) {
  var alpha, color = rec.color, dx = 0, dy = 0, sc = 1;
  if (override) {
    alpha = ghostFade(override, t) * rec.base;
    color = lighten(rec.color, 0.30);
    dx = override.dx; dy = override.dy; sc = override.sc;
  } else {
    alpha = fade(rec, t);
  }
  if (alpha < 0.01) return;
  if (rec.type === 'water') {
    ctx.fillStyle = rgba(color, alpha);
    ctx.fillRect(F.x, F.y + HORIZON * F.h, F.w, F.h * (1 - HORIZON));
  } else if (rec.type === 'fog') {
    var fy0 = F.y + rec.y * F.h, fh = rec.h * F.h;
    var fg = ctx.createLinearGradient(0, fy0, 0, fy0 + fh);
    fg.addColorStop(0, rgba(color, 0));
    fg.addColorStop(0.5, rgba(color, alpha));
    fg.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = fg;
    ctx.fillRect(F.x, fy0, F.w, fh);
  } else if (rec.type === 'headland') {
    drawHeadland(rec, alpha, dx, dy, sc);
  } else if (rec.type === 'wave') {
    drawWave(rec, alpha, dx, dy, sc);
  } else if (rec.type === 'bird') {
    drawBird(rec, alpha, dx, dy, sc);
  }
}
function drawBuffer(t) {
  var i;
  /* oldest records first, so newer gestures read over older ones */
  for (i = 0; i < RECORDS.length; i++) drawRecord(RECORDS[i], t, null);
  /* ghost replays read over the buffer, lighter and slightly wrong */
  for (i = 0; i < GHOSTS.length; i++) {
    var g = GHOSTS[i];
    drawRecord(RECORDS[g.src], t, g);
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Ghosts of the Piece').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Ghosts of the Piece').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 12 · 13').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Ghosts of the Piece', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 12 · 13', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawBuffer(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    recordCount: function () { return RECORDS.length; },
    ghostCount: function () { return GHOSTS.length; },
    recordAlpha: function (i, t) { return fade(RECORDS[i], t); },
    ghostAlpha: function (i, t) { return ghostFade(GHOSTS[i], t); }
  };
}
/* ---- frame one: fixed phase t = 60 s ----
   Live input is refused by design: no pointer handlers are registered.
   The piece only ever reads the memory buffer. */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
