<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Madre</title>
<style>
  html, body { margin: 0; padding: 0; background: #F0E6D2; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

// ---------- seeded RNG (mulberry32) ----------
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- palette (strict) ----------
var WALL = "#F0E6D2";
var SOFA = "#E8B93C";
var SPOT = "#6B4A2A";
var CROC = "#4A7A52";
var MUG  = "#C23B2E";
var PINK = "#E89AA8";
var TURQ = "#5AB8A8";
var ST_A = "#8A6A4A";
var ST_B = "#D9C29A";

// ---------- canvas / viewport ----------
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;

function isPhone() {
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var mn = Math.min(sw, sh);
  if (mn > 0 && mn < 700) return true;
  return H > W * 1.15;
}

function resize() {
  var vv = window.visualViewport;
  W = vv ? vv.width : window.innerWidth;
  H = vv ? vv.height : window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  draw(currentPhase());
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", resize);
}
window.addEventListener("resize", resize);

// ---------- precomputed seeded detail ----------
// leopard spots on the sofa (positions in stage space, clipped at draw time)
var spots = [];
(function () {
  var r = mulberry32(572001);
  for (var i = 0; i < 90; i++) {
    spots.push({
      x: 215 + r() * 570,
      y: 520 + r() * 330,
      rx: 7 + r() * 13,
      ry: 5 + r() * 9,
      rot: r() * Math.PI,
      open: r() > 0.45
    });
  }
})();
// dress flowers
var flowers = [];
(function () {
  var r = mulberry32(572002);
  for (var i = 0; i < 26; i++) {
    flowers.push({
      x: 415 + r() * 170,
      y: 520 + r() * 190,
      rad: 7 + r() * 8,
      col: r() > 0.5 ? PINK : TURQ
    });
  }
})();
// wall picture-frame dots / rug diamonds texture seeds
var rugPts = [];
(function () {
  var r = mulberry32(572003);
  for (var i = 0; i < 40; i++) {
    rugPts.push({ x: 180 + r() * 640, y: 872 + r() * 96, s: 5 + r() * 7 });
  }
})();

// ---------- animation state ----------
// One full loop: crocodile descends 6 steps, mug lifts once, eye blinks.
var LOOP = 24;            // seconds per full loop
var PHASE0 = 8.4;         // fixed first-frame phase: croc mid-staircase (step 2), mug at rest, eye open
var startStamp = null;

function currentPhase() {
  if (startStamp === null) return PHASE0;
  var now = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  return PHASE0 + (now - startStamp) / 1000;
}

// parallax (drag only, slight)
var parX = 0, parY = 0, parTX = 0, parTY = 0;
var dragging = false, dragSX = 0, dragSY = 0, dragBX = 0, dragBY = 0;

canvas.addEventListener("pointerdown", function (e) {
  dragging = true; dragSX = e.clientX; dragSY = e.clientY; dragBX = parTX; dragBY = parTY;
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
});
canvas.addEventListener("pointermove", function (e) {
  if (!dragging) return;
  parTX = Math.max(-16, Math.min(16, dragBX + (e.clientX - dragSX) * 0.06));
  parTY = Math.max(-10, Math.min(10, dragBY + (e.clientY - dragSY) * 0.06));
});
function endDrag() { dragging = false; }
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

// ---------- helpers ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function rrSub(x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function poly(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}
function ease(t) { return t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t); }

// ---------- scene pieces (stage space 1000x1000) ----------

function drawWall() {
  ctx.fillStyle = WALL;
  ctx.fillRect(-60, -60, 1120, 1120);
  // skirting board
  ctx.fillStyle = ST_B;
  ctx.fillRect(-60, 838, 1120, 14);
  ctx.fillStyle = ST_A;
  ctx.fillRect(-60, 852, 1120, 5);
  // floor
  ctx.fillStyle = ST_B;
  ctx.fillRect(-60, 857, 1120, 203);
  // rug
  ctx.fillStyle = MUG;
  rr(165, 862, 670, 116, 10); ctx.fill();
  ctx.fillStyle = SOFA;
  rr(185, 874, 630, 92, 8); ctx.fill();
  ctx.fillStyle = SPOT;
  for (var i = 0; i < rugPts.length; i++) {
    var p = rugPts[i];
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(Math.PI / 4);
    ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s);
    ctx.restore();
  }
}

function drawStairsAndCroc(phase) {
  // staircase: diagonal flight upper-right, descending from top-right toward center
  var steps = 6, sx = 985, sy = 96, sw = 88, sh = 62, run = 74;
  var i, x, y;
  // staircase silhouette: stepped profile filled down to a baseline
  ctx.fillStyle = ST_B;
  ctx.beginPath();
  ctx.moveTo(sx + 26, sy);
  for (i = 0; i < steps; i++) {
    x = sx - i * run - sw;
    y = sy + i * sh;
    ctx.lineTo(x + sw + 26, y);
    ctx.lineTo(x, y);
    ctx.lineTo(x, y + sh);
  }
  ctx.lineTo(sx + 26, sy + steps * sh);
  ctx.closePath();
  ctx.fill();
  // striped treads + risers
  for (i = 0; i < steps; i++) {
    x = sx - i * run - sw;
    y = sy + i * sh;
    ctx.fillStyle = (i % 2 === 0) ? ST_A : ST_B;
    ctx.fillRect(x, y, sw + 26, 13);
    ctx.fillStyle = (i % 2 === 0) ? ST_B : ST_A;
    ctx.fillRect(x, y + 13, 13, sh - 13);
  }
  // handrail (stops at the fourth step, clear of the sofa)
  ctx.strokeStyle = SPOT;
  ctx.lineWidth = 10;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(sx + 6, sy - 26);
  ctx.lineTo(sx - 4 * run, sy + 4 * sh - 26);
  ctx.stroke();

  // crocodile: discrete steps with a small settle bob; wraps to the top
  var cyc = ((phase % LOOP) + LOOP) % LOOP;
  var stepFloat = (cyc / LOOP) * steps;
  var stepIdx = Math.floor(stepFloat);
  var frac = stepFloat - stepIdx;
  var bob = Math.sin(Math.min(frac * 3, 1) * Math.PI) * 5;
  var cx = sx - stepIdx * run - 30;
  var cy = sy + stepIdx * sh - 44 - bob;
  drawCroc(cx, cy);
}

function drawCroc(cx, cy) {
  ctx.save();
  ctx.translate(cx, cy);
  // tail, curling up the steps behind (to the upper right)
  ctx.strokeStyle = CROC;
  ctx.lineWidth = 30;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(96, 6);
  ctx.quadraticCurveTo(170, -6, 208, -58);
  ctx.quadraticCurveTo(228, -86, 262, -92);
  ctx.stroke();
  ctx.lineWidth = 15;
  ctx.beginPath();
  ctx.moveTo(238, -84);
  ctx.quadraticCurveTo(272, -94, 292, -128);
  ctx.stroke();
  // back legs
  ctx.strokeStyle = CROC;
  ctx.lineWidth = 17;
  ctx.beginPath(); ctx.moveTo(66, 26); ctx.lineTo(88, 58); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6, 28); ctx.lineTo(-6, 60); ctx.stroke();
  // body
  ctx.fillStyle = CROC;
  ctx.beginPath();
  ctx.ellipse(30, 4, 108, 34, -0.06, 0, Math.PI * 2);
  ctx.fill();
  // back scutes
  ctx.fillStyle = SPOT;
  var sx2 = [-52, -22, 8, 38, 66];
  for (var i = 0; i < sx2.length; i++) {
    ctx.beginPath();
    ctx.moveTo(sx2[i] - 9, -26);
    ctx.lineTo(sx2[i], -40);
    ctx.lineTo(sx2[i] + 9, -26);
    ctx.closePath();
    ctx.fill();
  }
  // front leg reaching down to the next step
  ctx.strokeStyle = CROC;
  ctx.lineWidth = 17;
  ctx.beginPath(); ctx.moveTo(-52, 22); ctx.lineTo(-86, 52); ctx.stroke();
  // head, facing down-left, mouth open
  ctx.save();
  ctx.translate(-62, 2);
  ctx.rotate(0.10);
  // lower jaw
  ctx.fillStyle = CROC;
  poly([[-6, 10], [-86, 30], [-88, 42], [-2, 30]]);
  ctx.fill();
  // upper snout
  poly([[-4, 12], [-92, 2], [-96, -12], [-10, -16]]);
  ctx.fill();
  // mouth interior
  ctx.fillStyle = MUG;
  poly([[-10, 12], [-84, 12], [-86, 26], [-8, 24]]);
  ctx.fill();
  // teeth (cream, flat triangles)
  ctx.fillStyle = WALL;
  var tx = [-78, -62, -46, -30];
  var i2;
  for (i2 = 0; i2 < tx.length; i2++) {
    ctx.beginPath();
    ctx.moveTo(tx[i2], 10); ctx.lineTo(tx[i2] + 6, 10); ctx.lineTo(tx[i2] + 3, 20);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(tx[i2] + 2, 26); ctx.lineTo(tx[i2] + 8, 26); ctx.lineTo(tx[i2] + 5, 17);
    ctx.closePath(); ctx.fill();
  }
  // eye: calm, half lidded, looking ahead (not at anyone)
  ctx.fillStyle = WALL;
  ctx.beginPath(); ctx.ellipse(-26, -18, 11, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = SPOT;
  ctx.beginPath(); ctx.ellipse(-28, -17, 5, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = SPOT;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-38, -24); ctx.lineTo(-14, -25); ctx.stroke();
  // nostril
  ctx.beginPath(); ctx.ellipse(-82, -8, 3.4, 2.4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.restore();
}

function drawMirror(phase) {
  var mx = 196, my = 218;
  // decorative frame
  ctx.fillStyle = SPOT;
  ctx.beginPath(); ctx.ellipse(mx, my, 96, 118, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = SOFA;
  ctx.beginPath(); ctx.ellipse(mx, my, 84, 106, 0, 0, Math.PI * 2); ctx.fill();
  // glass: a quiet painted patch of wall, lighter by using cream
  ctx.fillStyle = WALL;
  ctx.beginPath(); ctx.ellipse(mx, my, 72, 94, 0, 0, Math.PI * 2); ctx.fill();
  // frame studs
  ctx.fillStyle = SPOT;
  for (var i = 0; i < 12; i++) {
    var a = (i / 12) * Math.PI * 2;
    ctx.beginPath();
    ctx.ellipse(mx + Math.cos(a) * 90, my + Math.sin(a) * 112, 5, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // the painted eye in the reflection
  var cyc = ((phase % 5.3) + 5.3) % 5.3;
  var blink = 0;
  if (cyc > 4.85) { var bt = (cyc - 4.85) / 0.45; blink = Math.sin(Math.min(bt, 1) * Math.PI); }
  ctx.save();
  ctx.beginPath(); ctx.ellipse(mx, my, 72, 94, 0, 0, Math.PI * 2); ctx.clip();
  // almond outline
  ctx.strokeStyle = SPOT;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(mx - 46, my);
  ctx.quadraticCurveTo(mx, my - 40, mx + 46, my);
  ctx.quadraticCurveTo(mx, my + 34, mx - 46, my);
  ctx.stroke();
  // iris + pupil
  ctx.fillStyle = TURQ;
  ctx.beginPath(); ctx.ellipse(mx, my - 2, 17, 17, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = SPOT;
  ctx.beginPath(); ctx.ellipse(mx, my - 2, 8, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = WALL;
  ctx.beginPath(); ctx.ellipse(mx + 5, my - 8, 3.4, 3.4, 0, 0, Math.PI * 2); ctx.fill();
  // lashes
  ctx.lineWidth = 4;
  var lx = [-30, -12, 6, 24];
  for (var j = 0; j < lx.length; j++) {
    ctx.beginPath();
    ctx.moveTo(mx + lx[j], my - 26 - Math.abs(lx[j]) * 0.18);
    ctx.lineTo(mx + lx[j] - 2, my - 38 - Math.abs(lx[j]) * 0.18);
    ctx.stroke();
  }
  // sweeping lid (blink)
  if (blink > 0) {
    ctx.fillStyle = PINK;
    ctx.beginPath();
    ctx.ellipse(mx, my - 44 + blink * 46, 52, 26, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = SPOT;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(mx - 46, my - 18 + blink * 46);
    ctx.quadraticCurveTo(mx, my - 8 + blink * 46, mx + 46, my - 18 + blink * 46);
    ctx.stroke();
  }
  ctx.restore();
}

function drawSofaAndMother(phase) {
  // sofa back
  ctx.fillStyle = SOFA;
  rr(190, 470, 620, 300, 46); ctx.fill();
  // sofa seat + base
  rr(168, 690, 664, 130, 34); ctx.fill();
  rr(196, 800, 608, 62, 20); ctx.fill();
  // feet
  ctx.fillStyle = SPOT;
  ctx.fillRect(226, 858, 26, 26);
  ctx.fillRect(748, 858, 26, 26);
  // leopard spots, clipped to the sofa silhouette
  ctx.save();
  ctx.beginPath();
  rrSub(190, 470, 620, 300, 46);
  rrSub(168, 690, 664, 130, 34);
  rrSub(196, 800, 608, 62, 20);
  ctx.clip();
  ctx.fillStyle = SPOT;
  for (var i = 0; i < spots.length; i++) {
    var s = spots[i];
    if (s.x > 400 && s.x < 600 && s.y > 470 && s.y < 780) continue; // keep her seat clear-ish
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    ctx.beginPath(); ctx.ellipse(0, 0, s.rx, s.ry, 0, 0, Math.PI * 2); ctx.fill();
    if (s.open) {
      ctx.fillStyle = SOFA;
      ctx.beginPath(); ctx.ellipse(1, 0, s.rx * 0.5, s.ry * 0.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = SPOT;
    }
    ctx.restore();
  }
  ctx.restore();
  // cushion seams
  ctx.strokeStyle = SPOT;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(393, 486); ctx.lineTo(393, 690); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(607, 486); ctx.lineTo(607, 690); ctx.stroke();

  // patchwork pillows
  drawPillow(238, 596, -0.10, [PINK, TURQ, MUG, ST_B]);
  drawPillow(668, 596, 0.10, [TURQ, MUG, PINK, SOFA]);

  drawMother(phase);

  // sofa arms over her sides
  ctx.fillStyle = SOFA;
  rr(150, 620, 96, 190, 40); ctx.fill();
  rr(754, 620, 96, 190, 40); ctx.fill();
  ctx.fillStyle = SPOT;
  var armSpots = [[180, 660], [205, 716], [176, 762], [782, 668], [806, 724], [778, 770]];
  for (var k = 0; k < armSpots.length; k++) {
    ctx.beginPath();
    ctx.ellipse(armSpots[k][0], armSpots[k][1], 11, 8, 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPillow(x, y, rot, cols) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  var w = 118, h = 104;
  ctx.fillStyle = cols[0]; ctx.fillRect(-w / 2, -h / 2, w / 2, h / 2);
  ctx.fillStyle = cols[1]; ctx.fillRect(0, -h / 2, w / 2, h / 2);
  ctx.fillStyle = cols[2]; ctx.fillRect(-w / 2, 0, w / 2, h / 2);
  ctx.fillStyle = cols[3]; ctx.fillRect(0, 0, w / 2, h / 2);
  ctx.strokeStyle = SPOT;
  ctx.lineWidth = 4;
  ctx.strokeRect(-w / 2, -h / 2, w, h);
  ctx.beginPath(); ctx.moveTo(0, -h / 2); ctx.lineTo(0, h / 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(w / 2, 0); ctx.stroke();
  ctx.restore();
}

function drawMother(phase) {
  var cx = 500;
  // ---- mug lift timing: once per loop, seconds 13.5 -> 17.5 of the cycle ----
  var cyc = ((phase % LOOP) + LOOP) % LOOP;
  var lift = 0;
  if (cyc > 13.5 && cyc < 17.5) {
    var lt = (cyc - 13.5) / 4;
    lift = lt < 0.35 ? ease(lt / 0.35) : (lt > 0.7 ? ease((1 - lt) / 0.3) : 1);
  }

  // dress (cream base, floral print), seated spread
  ctx.fillStyle = WALL;
  poly([[cx - 52, 486], [cx + 52, 486], [cx + 96, 640], [cx + 128, 788], [cx - 128, 788], [cx - 96, 640]]);
  ctx.fill();
  ctx.strokeStyle = TURQ;
  ctx.lineWidth = 4;
  poly([[cx - 52, 486], [cx + 52, 486], [cx + 96, 640], [cx + 128, 788], [cx - 128, 788], [cx - 96, 640]]);
  ctx.stroke();
  // flowers, clipped to dress
  ctx.save();
  poly([[cx - 52, 486], [cx + 52, 486], [cx + 96, 640], [cx + 128, 788], [cx - 128, 788], [cx - 96, 640]]);
  ctx.clip();
  for (var i = 0; i < flowers.length; i++) {
    var f = flowers[i];
    ctx.fillStyle = f.col;
    for (var p = 0; p < 5; p++) {
      var a = (p / 5) * Math.PI * 2;
      ctx.beginPath();
      ctx.ellipse(f.x + Math.cos(a) * f.rad * 0.62, f.y + Math.sin(a) * f.rad * 0.62, f.rad * 0.5, f.rad * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = SOFA;
    ctx.beginPath(); ctx.ellipse(f.x, f.y, f.rad * 0.34, f.rad * 0.34, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  // collar
  ctx.fillStyle = PINK;
  poly([[cx - 30, 484], [cx + 30, 484], [cx, 522]]);
  ctx.fill();

  // left arm resting on her lap
  ctx.strokeStyle = WALL;
  ctx.lineWidth = 27;
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(cx - 56, 512); ctx.quadraticCurveTo(cx - 96, 588, cx - 62, 664); ctx.stroke();
  ctx.strokeStyle = SPOT;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx - 70, 516); ctx.quadraticCurveTo(cx - 108, 588, cx - 76, 660); ctx.stroke();

  // right arm + red mug (the lifting group)
  var shX = cx + 56, shY = 512;
  var handX = cx + 118 + lift * -34;
  var handY = 636 + lift * -118;
  ctx.strokeStyle = WALL;
  ctx.lineWidth = 27;
  ctx.beginPath(); ctx.moveTo(shX, shY); ctx.quadraticCurveTo(cx + 112, 580, handX, handY); ctx.stroke();
  ctx.strokeStyle = SPOT;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(shX + 12, shY + 4); ctx.quadraticCurveTo(cx + 122, 584, handX + 8, handY - 6); ctx.stroke();
  // hand
  ctx.fillStyle = WALL;
  ctx.beginPath(); ctx.ellipse(handX, handY, 15, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = SPOT; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(handX, handY, 15, 12, 0, 0, Math.PI * 2); ctx.stroke();
  // mug
  ctx.save();
  ctx.translate(handX + 6, handY - 16);
  ctx.rotate(lift * -0.16);
  ctx.fillStyle = MUG;
  rr(-21, -26, 42, 50, 7); ctx.fill();
  ctx.strokeStyle = MUG;
  ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(27, 0, 12, -Math.PI / 2, Math.PI / 2); ctx.stroke();
  ctx.fillStyle = WALL;
  rr(-21, -26, 42, 9, 4); ctx.fill();
  ctx.restore();

  // neck + head
  ctx.fillStyle = WALL;
  ctx.fillRect(cx - 15, 442, 30, 52);
  ctx.beginPath(); ctx.ellipse(cx, 402, 57, 62, 0, 0, Math.PI * 2); ctx.fill();
  // blonde bob: cap + side panels
  ctx.fillStyle = SOFA;
  ctx.beginPath(); ctx.ellipse(cx, 372, 63, 48, 0, Math.PI, Math.PI * 2); ctx.fill();
  ctx.fillRect(cx - 63, 366, 17, 88);
  ctx.fillRect(cx + 46, 366, 17, 88);
  rr(cx - 63, 356, 126, 26, 12); ctx.fill();
  // face: calm, forward, entirely unbothered
  ctx.fillStyle = SPOT;
  ctx.beginPath(); ctx.ellipse(cx - 20, 404, 4.6, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 20, 404, 4.6, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = SPOT;
  ctx.lineWidth = 3.4;
  ctx.beginPath(); ctx.moveTo(cx - 29, 390); ctx.lineTo(cx - 11, 388); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 11, 388); ctx.lineTo(cx + 29, 390); ctx.stroke();
  // nose + mouth (one flat line) + cheek patches
  ctx.beginPath(); ctx.moveTo(cx + 2, 408); ctx.lineTo(cx - 3, 422); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 12, 440); ctx.lineTo(cx + 12, 440); ctx.stroke();
  ctx.fillStyle = PINK;
  ctx.beginPath(); ctx.ellipse(cx - 36, 426, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 36, 426, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
  // earring
  ctx.fillStyle = TURQ;
  ctx.beginPath(); ctx.ellipse(cx + 52, 452, 5, 8, 0, 0, Math.PI * 2); ctx.fill();
}

// ---------- main draw ----------
function draw(phase) {
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // page ground = wall cream
  ctx.fillStyle = WALL;
  ctx.fillRect(0, 0, W, H);

  var phone = isPhone();
  var S = phone ? Math.min(W, H) / 1000 : Math.min(W, H) / 1000;
  var ox = (W - 1000 * S) / 2;
  var oy = (H - 1000 * S) / 2;

  // smooth parallax
  parX += (parTX - parX) * 0.08;
  parY += (parTY - parY) * 0.08;

  // back layer (wall, stairs, crocodile)
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(S, S);
  ctx.translate(parX * 1.2, parY * 1.2);
  drawWall();
  drawStairsAndCroc(phase);
  ctx.restore();

  // mid layer (mirror)
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(S, S);
  ctx.translate(parX * 2.2, parY * 2.2);
  drawMirror(phase);
  ctx.restore();

  // front layer (sofa + mother)
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(S, S);
  ctx.translate(parX * 3.6, parY * 3.6);
  drawSofaAndMother(phase);
  ctx.restore();

  // tiny hint (parallax is the only interaction)
  ctx.fillStyle = SPOT;
  ctx.globalAlpha = 0.55;
  ctx.font = "13px sans-serif";
  ctx.textAlign = "right";
  ctx.fillText("drag", W - 14, H - 12);
  ctx.globalAlpha = 1;
}

// ---------- run ----------
// synchronous, deterministic first frame (fixed phase, croc mid-staircase, mug at rest)
resize();

if (typeof requestAnimationFrame === "function") {
  startStamp = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  var loop = function () {
    draw(currentPhase());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
