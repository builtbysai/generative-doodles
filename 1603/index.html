<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phyllotaxy, Set in Motion</title>
<style>
html, body { margin: 0; padding: 0; background: #E2D5B4; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var ROUND = [239, 230, 208];
var PAGE = [226, 213, 180];
var SAGE = [90, 125, 90];
var DEEP = [62, 92, 72];
var MAUVE = [122, 108, 125];
var OCHRE = [185, 138, 47];
var WHITE = [247, 242, 230];
var PHASE = 20.0;
var REGROW_S = 6.0;
var CYCLE_S = 60.0;
var SEEDS = [1603001, 1603007, 1603013, 1603021, 1603031, 1603043];
var seedIdx = 0;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
function easeOut(k) { k = clamp(k, 0, 1); return 1 - (1 - k) * (1 - k); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH) * 0.96;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}

/* ---- parametric plants: every leaf angle is a number ---- */
var LIGHT_A = -Math.PI / 2;
var N_PLANTS = 16;
var plants = [];
var grain = [];
var regrowT0 = PHASE - REGROW_S;
function genPlants(seed) {
  var rng = mulberry32(seed);
  var out = [], i, j;
  for (i = 0; i < N_PLANTS; i++) {
    var mode = Math.floor(rng() * 3); /* 0 opposite, 1 alternate, 2 whorled */
    var nodes = 5 + Math.floor(rng() * 4);
    var internode = 0.032 + rng() * 0.018;
    var branchA = 0.35 + rng() * 0.55;
    var leafLen = 0.070 + rng() * 0.040;
    var leafWid = 0.020 + rng() * 0.012;
    var sage = rng() < 0.55;
    var serrated = rng() < 0.5;
    var pods = rng() < 0.45 ? 1 + Math.floor(rng() * 2) : 0;
    var a0 = (i / N_PLANTS) * TAU + (rng() - 0.5) * 0.16;
    var curve = (rng() - 0.5) * 0.9;
    var phase = rng() * TAU;
    var birth = (i / N_PLANTS) * 0.55;
    var pts = [];
    var x = Math.cos(a0) * 0.58, y = Math.sin(a0) * 0.58;
    var dir = 0;
    var lx = Math.cos(LIGHT_A), ly = Math.sin(LIGHT_A);
    for (j = 0; j <= nodes; j++) {
      pts.push({ x: x, y: y, dir: a0 + dir });
      var bend = curve * 0.22;
      var toLight = Math.atan2(ly, lx) - (a0 + dir);
      while (toLight > Math.PI) toLight -= TAU;
      while (toLight < -Math.PI) toLight += TAU;
      bend += clamp(toLight, -0.5, 0.5) * 0.18;
      dir += bend;
      x += Math.cos(a0 + dir) * internode;
      y += Math.sin(a0 + dir) * internode;
      var r = Math.sqrt(x * x + y * y);
      if (r > 0.88) break;
    }
    out.push({
      a0: a0, mode: mode, nodes: nodes, internode: internode,
      branchA: branchA, leafLen: leafLen, leafWid: leafWid,
      sage: sage, serrated: serrated, pods: pods, curve: curve,
      phase: phase, birth: birth, pts: pts, tip: { x: x, y: y, dir: a0 + dir }
    });
  }
  return out;
}
function genGrain(seed) {
  var rng = mulberry32(seed + 99);
  var out = [], i;
  for (i = 0; i < 420; i++) {
    var a = rng() * TAU, r = Math.sqrt(rng()) * 0.49;
    out.push({ x: Math.cos(a) * r, y: Math.sin(a) * r, r: 0.0012 + rng() * 0.0022 });
  }
  return out;
}
plants = genPlants(SEEDS[0]);
grain = genGrain(SEEDS[0]);
var BUTTERFLY_PLANT = 5;

function dot(x, y, r) {
  ctx.moveTo(x + r, y);
  ctx.arc(x, y, r, 0, TAU);
}
function drawLeaf(x, y, ang, len, wid, color, serrated, alpha) {
  if (len <= 0.5 || alpha <= 0.01) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.fillStyle = rgba(color, alpha);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  if (!serrated) {
    ctx.quadraticCurveTo(len * 0.45, -wid, len, 0);
    ctx.quadraticCurveTo(len * 0.45, wid, 0, 0);
  } else {
    var n = 5, s;
    for (s = 1; s <= n; s++) {
      var f = s / n;
      var w = -wid * Math.sin(f * Math.PI) * (s % 2 === 0 ? 1 : 0.62);
      ctx.lineTo(len * f, w);
    }
    for (s = n; s >= 1; s--) {
      var f2 = s / n;
      var w2 = wid * Math.sin(f2 * Math.PI) * (s % 2 === 0 ? 1 : 0.62);
      ctx.lineTo(len * f2, w2);
    }
  }
  ctx.closePath();
  ctx.fill();
  /* midrib: a number made visible */
  ctx.strokeStyle = rgba(OCHRE, alpha * 0.55);
  ctx.lineWidth = Math.max(0.6, len * 0.02);
  ctx.beginPath();
  ctx.moveTo(len * 0.08, 0);
  ctx.lineTo(len * 0.94, 0);
  ctx.stroke();
  ctx.restore();
}
function drawPlant(p, R, cx, cy, t, rg) {
  var g = clamp((rg - p.birth) / 0.45, 0, 1);
  if (g <= 0) return;
  var ge = easeOut(g);
  var sway = 0.05 * Math.sin(t * 0.3 + p.phase);
  var i, j;
  var n = p.pts.length;
  var upto = Math.max(2, Math.floor(n * ge));
  if (upto < 2) return;
  /* stem, revealed node by node */
  ctx.strokeStyle = rgba(OCHRE, 0.9);
  ctx.lineWidth = Math.max(1, 0.008 * R);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (i = 0; i < upto; i++) {
    var pt = p.pts[i];
    var px = cx + pt.x * R, py = cy + pt.y * R;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  /* leaves at nodes: opposite, alternate, whorled */
  var col = p.sage ? SAGE : DEEP;
  for (i = 1; i < upto; i++) {
    var node = p.pts[i];
    var nf = clamp((ge * n - i) / 1.5, 0, 1);
    if (nf <= 0) continue;
    var unfurl = smooth(nf);
    var isTip = (i === upto - 1);
    /* the newest frond unfurls on a slow 20s cycle */
    var cyc20 = ((t % 20) + 20) % 20;
    var frond = isTip ? 0.55 + 0.45 * smooth(cyc20 / 20) : 1;
    var L = p.leafLen * R * unfurl * frond;
    var W = p.leafWid * R * unfurl;
    var baseA = node.dir + sway;
    var nx = cx + node.x * R, ny = cy + node.y * R;
    if (p.mode === 0) {
      drawLeaf(nx, ny, baseA + p.branchA, L, W, col, p.serrated, 0.92);
      drawLeaf(nx, ny, baseA - p.branchA, L, W, col, p.serrated, 0.92);
    } else if (p.mode === 1) {
      var side = (i % 2 === 0) ? 1 : -1;
      drawLeaf(nx, ny, baseA + side * p.branchA, L, W, col, p.serrated, 0.92);
    } else {
      for (j = 0; j < 3; j++) {
        drawLeaf(nx, ny, baseA + (j - 1) * p.branchA * 0.9, L * 0.8, W, col, p.serrated, 0.92);
      }
    }
    /* seed pods swell slowly */
    if (p.pods > 0 && i % 2 === 0 && (i / 2) < p.pods) {
      var swell = 1 + 0.18 * Math.sin(t * 0.15 + p.phase + i);
      var pr = 0.016 * R * swell * unfurl;
      ctx.fillStyle = rgba(MAUVE, 0.95);
      ctx.beginPath();
      dot(nx + Math.cos(baseA) * L * 0.4, ny + Math.sin(baseA) * L * 0.4, pr);
      ctx.fill();
    }
  }
  /* tip bud */
  var tip = p.pts[upto - 1];
  ctx.fillStyle = rgba(MAUVE, 0.9 * ge);
  ctx.beginPath();
  dot(cx + tip.x * R, cy + tip.y * R, Math.max(1, 0.008 * R));
  ctx.fill();
}
function drawButterfly(cx, cy, R, t, rg) {
  var p = plants[BUTTERFLY_PLANT];
  if (!p) return;
  var g = clamp((rg - p.birth) / 0.45, 0, 1);
  if (g < 0.9) return;
  var tip = p.tip;
  var bx = cx + tip.x * R, by = cy + tip.y * R;
  /* opens once per 60s cycle, then closes */
  var cyc = ((t % CYCLE_S) + CYCLE_S) % CYCLE_S;
  var open = 0;
  if (cyc > 12 && cyc < 36) open = smooth((cyc - 12) / 6) * (1 - smooth((cyc - 30) / 6));
  var wing = 0.12 + open * 0.75;
  var wa = tip.dir;
  var wl = 0.055 * R, ww = 0.030 * R;
  ctx.fillStyle = rgba(WHITE, 0.95);
  var s;
  for (s = 0; s < 2; s++) {
    var side = s === 0 ? 1 : -1;
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(wa + side * wing * 0.9);
    ctx.beginPath();
    ctx.ellipse(0, -side * ww * 0.4, wl, ww, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  ctx.strokeStyle = rgba(DEEP, 0.8);
  ctx.lineWidth = Math.max(0.8, 0.004 * R);
  ctx.beginPath();
  ctx.moveTo(bx, by);
  ctx.lineTo(bx + Math.cos(wa) * wl * 0.9, by + Math.sin(wa) * wl * 0.9);
  ctx.stroke();
  /* one accent bloom beside it, warm white, offset clear of the wings */
  var ox = bx + Math.cos(wa + Math.PI / 2) * 0.055 * R;
  var oy = by + Math.sin(wa + Math.PI / 2) * 0.055 * R;
  ctx.fillStyle = rgba(WHITE, 0.95);
  ctx.beginPath();
  for (s = 0; s < 5; s++) {
    var pa = (s / 5) * TAU + 0.3;
    dot(ox + Math.cos(pa) * 0.018 * R, oy + Math.sin(pa) * 0.018 * R, 0.011 * R);
  }
  ctx.fill();
  ctx.fillStyle = rgba(OCHRE, 0.95);
  ctx.beginPath();
  dot(ox, oy, 0.006 * R);
  ctx.fill();
}

function draw(t) {
  lastT = t;
  size();
  ctx.fillStyle = 'rgb(' + PAGE[0] + ',' + PAGE[1] + ',' + PAGE[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  var rect = compRect();
  var cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
  var R = Math.min(rect.w, rect.h) * 0.46;
  /* roundel ground with a soft vignette margin outside it */
  ctx.fillStyle = rgba(ROUND, 1);
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(PAGE, 0.55);
  ctx.lineWidth = Math.max(2, 0.02 * R);
  ctx.beginPath();
  ctx.arc(cx, cy, R * 1.005, 0, TAU);
  ctx.stroke();
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, TAU);
  ctx.clip();
  /* paper grain, seeded */
  ctx.fillStyle = rgba(DEEP, 0.05);
  ctx.beginPath();
  var gi;
  for (gi = 0; gi < grain.length; gi++) {
    dot(cx + grain[gi].x * R * 2, cy + grain[gi].y * R * 2, grain[gi].r * R);
  }
  ctx.fill();
  /* inner ring the wreath grows from */
  ctx.strokeStyle = rgba(OCHRE, 0.35);
  ctx.lineWidth = Math.max(1, 0.006 * R);
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.58, 0, TAU);
  ctx.stroke();
  var rg = clamp((t - regrowT0) / REGROW_S, 0, 1);
  var i;
  for (i = 0; i < plants.length; i++) drawPlant(plants[i], R, cx, cy, t, rg);
  drawButterfly(cx, cy, R, t, rg);
  ctx.restore();
  var titlePx = isPhone ? 15 : 17;
  var smallPx = isPhone ? 11 : 12;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = rgba(DEEP, 0.85);
  ctx.fillText('Phyllotaxy, Set in Motion', rect.x + rect.w / 2, rect.y + Math.max(6, 0.012 * rect.h));
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(DEEP, 0.6);
  ctx.fillText('2006 · 06 · 02', rect.x + rect.w / 2, rect.y + Math.max(6, 0.012 * rect.h) + titlePx + 5);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(DEEP, 0.7);
  ctx.fillText('Tap to regrow.', rect.x + rect.w / 2, rect.y + rect.h - smallPx - 10);
}
function onTap() {
  seedIdx = (seedIdx + 1) % SEEDS.length;
  plants = genPlants(SEEDS[seedIdx]);
  grain = genGrain(SEEDS[seedIdx]);
  regrowT0 = lastT;
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) {
    window.addEventListener('resize', size);
    window.addEventListener('pointerdown', onTap);
  }
}
if (typeof window !== 'undefined') {
  window.__phyllotaxy1603 = { draw: draw, onTap: onTap, plants: plants };
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
