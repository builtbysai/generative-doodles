<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>She Arose</title>
<style>
html, body { margin: 0; padding: 0; background: #241A26; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, PHONE = false;
  var T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;

  function hash(n) {
    var h = (n * 2654435761) >>> 0;
    h ^= h >>> 13;
    h = (h * 1274126177) >>> 0;
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function size() {
    var vw = (window.visualViewport && window.visualViewport.width) ? window.visualViewport.width : window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = Math.round(W); canvas.height = Math.round(H);
    var sw = (window.screen && window.screen.width) ? window.screen.width : W;
    var sh = (window.screen && window.screen.height) ? window.screen.height : H;
    PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  }
  size();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { size(); draw(now()); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { size(); draw(now()); });
  }

  function now() {
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - T0) / 1000;
    return 0;
  }

  // Interaction state: closed-form over recorded events and t.
  // Vertical drag only: dy negative = drag up = figure rises.
  var drag = null;              // {startY, dy}
  var released = null;          // {dy, t}
  function shiftY(t) {
    if (drag) return clamp(drag.dy, -0.24 * H, 0.24 * H);
    if (released) {
      var dt = t - released.t;
      if (dt < 0) dt = 0;
      return clamp(released.dy, -0.24 * H, 0.24 * H) * Math.exp(-dt / 1.4);
    }
    return 0;
  }
  function pos(e) {
    var r = { x: 0, y: 0 };
    if (e.clientX !== undefined) { r.x = e.clientX; r.y = e.clientY; }
    else if (e.touches && e.touches[0]) { r.x = e.touches[0].clientX; r.y = e.touches[0].clientY; }
    return r;
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = pos(e);
    drag = { startY: p.y, dy: 0 };
    released = null;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var p = pos(e);
    drag.dy = p.y - drag.startY;
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!drag) return;
    released = { dy: drag.dy, t: now() };
    drag = null;
  });

  var PAL = ['#1F4E79', '#C2185B', '#E8A020', '#F0E7D3'];
  var BG = '#241A26';

  function strokePoly(pts, color, width) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  function draw(t) {
    var s = Math.min(W, H) / 720;
    var cx = W / 2;
    var cy = H * 0.58;
    var sy = shiftY(t);                       // negative = risen, positive = sunk
    var breath = Math.sin(t * 2 * Math.PI / 7);   // 7 s breathe
    var breatheAmp = 1 + 0.028 * breath;
    var stream = clamp(-sy / H, -0.28, 0.28); // >0 while rising: braids stream down

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var maxR = Math.sqrt(W * W + H * H) * 0.72;
    var spacing = 26 * s;
    var nRings = Math.floor(maxR / spacing);

    // Pool: concentric braided ropes, three crossing ribbons per ring.
    for (var r = 0; r <= nRings; r++) {
      var R = (r + 0.5) * spacing * breatheAmp;
      var steps = 96;
      for (var k = 0; k < 3; k++) {
        var pts = [];
        var col = PAL[(r + k) % 4];
        var ph = hash(r * 7 + k * 13) * Math.PI * 2;
        var wob = (4 + hash(r * 3 + k) * 4.5) * s;
        var lobes = 3 + k;
        for (var i = 0; i <= steps; i++) {
          var a = i / steps * Math.PI * 2;
          var rr = R + Math.sin(a * lobes + ph + t * 0.25) * wob;
          var x = cx + Math.cos(a) * rr;
          var y = cy + Math.sin(a) * rr;
          // Vertical stretch below the pool center while rising, gather while sinking.
          var below = (y > cy) ? 1 : 0.35;
          y = cy + (y - cy) * (1 + stream * below);
          pts.push([x, y]);
        }
        ctx.globalAlpha = 0.55 + 0.25 * hash(r * 11 + k * 5);
        strokePoly(pts, col, (1.6 + hash(r + k * 3) * 1.8) * s);
      }
      ctx.globalAlpha = 1;
    }

    // Dancer as braid density only: no body, no face.
    // A dense upright braid concentration: feet at the pool center, head above middle,
    // two raised-arm braid streams. All strokes are braids; the figure is the density.
    var footY = cy + sy;
    var headY = cy - 0.44 * H + sy * 1.15;
    var shoulderY = cy - 0.30 * H + sy * 1.15;
    var sway = Math.sin(t * 2 * Math.PI / 7) * 3 * s;

    // Torso column: nine interweaving braids spread wide, so the figure reads
    // as a dense braid bundle, never as a single body line.
    for (var b = 0; b < 9; b++) {
      var off = (b - 4) * 9 * s;
      var pts2 = [];
      var steps2 = 40;
      for (var j = 0; j <= steps2; j++) {
        var f = j / steps2;
        var y2 = footY + (headY - footY) * f;
        var x2 = cx + off * (1 - f * 0.25) + Math.sin(f * 9 + b * 1.7 + t * 0.4) * 8 * s + sway * f;
        pts2.push([x2, y2]);
      }
      ctx.globalAlpha = 0.9;
      strokePoly(pts2, PAL[b % 4], (2.8 + (b % 3) * 0.9) * s);
    }
    ctx.globalAlpha = 1;

    // Raised arms: bundles of diagonal braid streams fanning from a wide
    // shoulder band up and outward, bowed, never straight limbs.
    for (var side = -1; side <= 1; side += 2) {
      for (var ab = 0; ab < 4; ab++) {
        var pts3 = [];
        var steps3 = 32;
        var ax0 = cx + side * (10 + ab * 6) * s;
        var ay0 = shoulderY + ab * 4 * s;
        var ax1 = cx + side * (0.17 * W + ab * 6 * s);
        var ay1 = headY - 0.05 * H + ab * 3 * s;
        for (var j2 = 0; j2 <= steps3; j2++) {
          var f2 = j2 / steps3;
          var x3 = ax0 + (ax1 - ax0) * f2 + Math.sin(f2 * 11 + ab * 2.1 + t * 0.5) * 6 * s + side * Math.sin(f2 * Math.PI) * 8 * s;
          var y3 = ay0 + (ay1 - ay0) * f2 + Math.sin(f2 * 7 + ab) * 2 * s;
          pts3.push([x3, y3]);
        }
        ctx.globalAlpha = 0.85;
        strokePoly(pts3, PAL[(ab + (side > 0 ? 1 : 2)) % 4], (2.2 + (ab % 2) * 0.8) * s);
      }
    }
    ctx.globalAlpha = 1;

    // Head knot: a small off-center tangle of partial braid loops, not a head.
    // No face, no circle head: loops are short arcs at jittered offsets.
    for (var hk = 0; hk < 4; hk++) {
      var kx = cx + (hash(hk * 17 + 3) - 0.5) * 22 * s + sway;
      var ky = headY + (hash(hk * 23 + 7) - 0.5) * 14 * s;
      var kr = (7 + hk * 3) * s;
      var a0 = hash(hk * 31 + 11) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(kx, ky, kr, a0, a0 + Math.PI * (1.1 + hash(hk * 7) * 0.6));
      ctx.strokeStyle = PAL[(hk + 1) % 4];
      ctx.lineWidth = 2 * s;
      ctx.globalAlpha = 0.9;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') {
    (function loop() {
      draw(now());
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
