<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.249 Mineral Spirits</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#141310; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.249 Mineral Spirits (Avantika Bawa). After her 2016
// Disjecta biennial installation in the vacant Astor Hotel,
// Astoria: a golden scaffold standing in a dark abandoned
// hotel lobby, four bays wide and rising past the top of the
// frame into blackness, dust hanging in diagonal light shafts
// from the upper right. The shafts drift on a thirty five
// second loop, the gold breathes, forty dust motes wander.
// Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GOLD = '#D4AF37', DIM = '#7A5F22', DARK = '#141310', DUST = '#6B6252', SHAFT = '#FFF8E8';
var W = 0, H = 0, phone = false;
var T = 11, lastNow = -1; // frame one: shafts already angled through the bays, motes in the air

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function rng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// forty dust motes, seeded homes in unit space
var motes = [];
(function () {
  var r = rng(24903);
  for (var i = 0; i < 40; i++) {
    motes.push({
      hx: 0.04 + r() * 0.92, hy: 0.03 + r() * 0.92,
      ph1: r() * Math.PI * 2, ph2: r() * Math.PI * 2,
      sp: 0.6 + r() * 0.9, sz: 1.2 + r() * 1.5, tw: r() * Math.PI * 2
    });
  }
})();

function goldAt(xFrac, yFrac, breath) {
  // brightness by height: linear falloff from the lit top,
  // a little more from the upper right where the shafts enter;
  // channel math done directly (mix() takes hex only)
  var f = 0.22 + 0.78 * (1 - yFrac) + 0.10 * (xFrac - 0.5);
  f = Math.max(0, Math.min(1, f));
  var a = hexRGB(DIM), b = hexRGB(GOLD);
  var bf = breath * 0.16;
  var ch = [];
  for (var i = 0; i < 3; i++) {
    var c = a[i] + (b[i] - a[i]) * f;
    ch.push(Math.round(c + (a[i] - c) * bf));
  }
  return 'rgb(' + ch[0] + ',' + ch[1] + ',' + ch[2] + ')';
}

function draw() {
  ctx.fillStyle = DARK;
  ctx.fillRect(0, 0, W, H);
  var u = Math.max(0.5, Math.min(W, H) / 780);
  var floorY = H * 0.93;
  var breath = 0.5 + 0.5 * Math.sin(T * Math.PI * 2 / 9.5);

  // lobby columns hinted at the frame edges
  ctx.fillStyle = mix(DARK, DUST, 0.30);
  ctx.fillRect(0, 0, W * 0.052, floorY);
  ctx.fillRect(W * 0.948, 0, W * 0.052, floorY);
  ctx.fillStyle = mix(DARK, DUST, 0.42);
  ctx.fillRect(-W * 0.006, H * 0.055, W * 0.066, 5 * u);
  ctx.fillRect(W * 0.942, H * 0.055, W * 0.066, 5 * u);
  ctx.fillRect(-W * 0.006, floorY - 7 * u, W * 0.066, 5 * u);
  ctx.fillRect(W * 0.942, floorY - 7 * u, W * 0.066, 5 * u);
  // floor line
  ctx.strokeStyle = rgba(DUST, 0.28);
  ctx.lineWidth = 1.4 * u;
  ctx.beginPath();
  ctx.moveTo(0, floorY); ctx.lineTo(W, floorY);
  ctx.stroke();

  // light shafts: flat translucent quads slanting from the
  // upper right, drifting on the thirty five second loop
  var slant = -0.40 + 0.035 * Math.sin(T * Math.PI * 2 / 35 + 0.8);
  var shaftDefs = [
    { x: 0.60, w: 0.115, ph: 0.0 },
    { x: 0.815, w: 0.082, ph: 2.1 },
    { x: 0.415, w: 0.058, ph: 4.0 }
  ];
  ctx.fillStyle = rgba(SHAFT, 0.085);
  shaftDefs.forEach(function (sd) {
    var drift = Math.sin(T * Math.PI * 2 / 35 + sd.ph) * W * 0.028;
    var tx = W * sd.x + drift, tw = W * sd.w;
    var drop = floorY + H * 0.065; // shafts land on the floor, not past it
    ctx.beginPath();
    ctx.moveTo(tx, -H * 0.05);
    ctx.lineTo(tx + tw, -H * 0.05);
    ctx.lineTo(tx + tw + slant * drop, drop - H * 0.05);
    ctx.lineTo(tx + slant * drop, drop - H * 0.05);
    ctx.closePath();
    ctx.fill();
  });

  // the scaffold: four bays, rising past the top edge
  var x0 = W * 0.17, x1 = W * 0.83, bayW = (x1 - x0) / 4;
  var topY = -H * 0.06, lvlH = H * 0.155;
  var levels = [];
  for (var y = floorY; y > topY; y -= lvlH) levels.push(y);
  if (levels[levels.length - 1] > topY + 2) levels.push(topY);
  ctx.lineCap = 'round';
  var b, l, xa, ya, yb;
  // diagonals first, thinnest
  ctx.lineWidth = 1.4 * u;
  for (b = 0; b < 4; b++) {
    for (l = 0; l < levels.length - 1; l++) {
      ya = levels[l]; yb = levels[l + 1];
      ctx.strokeStyle = goldAt((x0 + bayW * (b + 0.5)) / W, ((ya + yb) / 2) / H, breath);
      ctx.beginPath();
      if ((b + l) % 2 === 0) { ctx.moveTo(x0 + bayW * b, ya); ctx.lineTo(x0 + bayW * (b + 1), yb); }
      else { ctx.moveTo(x0 + bayW * (b + 1), ya); ctx.lineTo(x0 + bayW * b, yb); }
      ctx.stroke();
    }
  }
  // rails at every level
  ctx.lineWidth = 2.4 * u;
  for (l = 0; l < levels.length; l++) {
    ya = levels[l];
    for (b = 0; b < 4; b++) {
      ctx.strokeStyle = goldAt((x0 + bayW * (b + 0.5)) / W, ya / H, breath);
      ctx.beginPath();
      ctx.moveTo(x0 + bayW * b, ya); ctx.lineTo(x0 + bayW * (b + 1), ya);
      ctx.stroke();
    }
  }
  // poles, brightest at the top
  ctx.lineWidth = 3.1 * u;
  for (b = 0; b <= 4; b++) {
    xa = x0 + bayW * b;
    for (l = 0; l < levels.length - 1; l++) {
      ya = levels[l]; yb = levels[l + 1];
      ctx.strokeStyle = goldAt(xa / W, ((ya + yb) / 2) / H, breath);
      ctx.beginPath();
      ctx.moveTo(xa, ya); ctx.lineTo(xa, yb);
      ctx.stroke();
    }
  }
  // couplers
  for (b = 0; b <= 4; b++) {
    for (l = 0; l < levels.length; l++) {
      ctx.fillStyle = goldAt((x0 + bayW * b) / W, levels[l] / H, breath);
      ctx.beginPath();
      ctx.arc(x0 + bayW * b, levels[l], 2.6 * u, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // dust motes wandering in the light
  motes.forEach(function (m) {
    var mx = (m.hx + 0.014 * Math.sin(T * 0.11 * m.sp + m.ph1)) * W;
    var my = (m.hy + 0.011 * Math.cos(T * 0.09 * m.sp + m.ph2)) * H;
    var a = 0.30 + 0.38 * (0.5 + 0.5 * Math.sin(T * 0.5 * m.sp + m.tw));
    ctx.fillStyle = rgba(DUST, a);
    ctx.beginPath();
    ctx.arc(mx, my, m.sz * u, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
