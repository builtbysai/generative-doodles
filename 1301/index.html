<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code of Points</title>
<style>
  html, body { margin: 0; padding: 0; background: #EFE7D6; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). No Math.random anywhere in this piece.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var PAPER = '#EFE7D6', GRAIN = '#C9BFAE';
  // Bands, top to bottom: Comaneci 1976, Miller 1996, Biles 2016.
  var BANDS = [
    { color: '#222222', dur: 38, kind: 'dense',  misreg: 0 },
    { color: '#3E7C7B', dur: 47, kind: 'loops',  misreg: 2 },
    { color: '#D96C4F', dur: 55, kind: 'bursts', misreg: 3 }
  ];

  var W = 0, H = 0, isPhone = false;
  var grain = null;      // static grain flecks, generated once per sizing
  var drags = [];        // recorded drag events: {t, band, dx}
  var dragBand = -1, dragX = 0, dragY = 0, dragMoved = 0;
  var t0 = 0, started = false, firstFrame = true;

  function size() {
    var vw = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport.width : window.innerWidth;
    var vh = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport.height : window.innerHeight;
    W = Math.round(vw); H = Math.round(vh);
    canvas.width = W; canvas.height = H;
    var minScreen = Math.min(window.screen.width, window.screen.height);
    isPhone = (minScreen < 700) || (H > W * 1.15);
    var g = mulberry32(1301001);
    grain = [];
    var n = Math.floor(W * H / 900);
    for (var i = 0; i < n; i++) {
      grain.push([g() * W, g() * H, 1 + g() * 1.6, 0.05 + g() * 0.10]);
    }
    if (firstFrame) { draw(0); firstFrame = false; }
  }

  // Generate one routine fragment for a band in a given cycle, seeded.
  function fragment(band, cycle, bw) {
    var rng = mulberry32(1301000 + band * 7919 + cycle * 104729);
    var marks = [];
    var x = 0;
    var step;
    if (BANDS[band].kind === 'dense') step = bw / 46;
    else if (BANDS[band].kind === 'loops') step = bw / 22;
    else step = bw / 30;
    while (x < bw) {
      var r = rng();
      var kind = BANDS[band].kind;
      var m;
      if (kind === 'dense') {
        m = (r < 0.55) ? { t: 'dot', x: x } : { t: 'dash', x: x, w: step * (0.5 + rng() * 0.5) };
      } else if (kind === 'loops') {
        m = (r < 0.6) ? { t: 'loop', x: x, r: 5 + rng() * 7 } : { t: 'dot', x: x };
      } else {
        m = (r < 0.65) ? { t: 'burst', x: x, r: 6 + rng() * 8 } : { t: 'dash', x: x, w: step * 0.4 };
      }
      marks.push(m);
      x += step * (0.7 + rng() * 0.6);
    }
    return marks;
  }

  // Closed-form effective time for a band: base time plus decayed drag boosts.
  // A drag of dx pixels adds k*dx*tau seconds of progress, decaying with tau.
  function effTime(band, t) {
    var e = t;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i];
      if (d.band !== band) continue;
      var dt = t - d.t;
      if (dt < 0) continue;
      e += 0.012 * d.dx * 2.5 * (1 - Math.exp(-dt / 2.5));
    }
    return e < 0 ? 0 : e;
  }

  function dot(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawMark(band, m, y, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    if (m.t === 'dot') {
      dot(m.x, y, 2.6);
    } else if (m.t === 'dash') {
      ctx.beginPath();
      ctx.moveTo(m.x, y);
      ctx.lineTo(m.x + m.w, y);
      ctx.stroke();
    } else if (m.t === 'loop') {
      ctx.beginPath();
      ctx.moveTo(m.x + m.r, y);
      ctx.arc(m.x, y, m.r, 0, Math.PI * 2);
      ctx.stroke();
    } else if (m.t === 'burst') {
      // Sharp angular burst: a small zigzag star.
      ctx.beginPath();
      var n = 8, rr = m.r;
      for (var i = 0; i <= n; i++) {
        var a = (i / n) * Math.PI * 2 - Math.PI / 2;
        var rad = (i % 2 === 0) ? rr : rr * 0.35;
        var px = m.x + Math.cos(a) * rad, py = y + Math.sin(a) * rad * 0.8;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    // Static riso grain, flat alpha flecks.
    ctx.fillStyle = GRAIN;
    for (var gi = 0; gi < grain.length; gi++) {
      var g = grain[gi];
      ctx.globalAlpha = g[3];
      ctx.fillRect(g[0], g[1], g[2], g[2]);
    }
    ctx.globalAlpha = 1;

    var marginX = isPhone ? W * 0.05 : W * 0.09;
    var bw = W - marginX * 2;
    var top = isPhone ? H * 0.16 : H * 0.20;
    var gap = (H - top - (isPhone ? H * 0.10 : H * 0.16)) / 3;

    for (var b = 0; b < 3; b++) {
      var band = BANDS[b];
      var y = top + gap * b + gap * 0.5;
      var et = effTime(b, t);
      var cycle = Math.floor(et / band.dur);
      var local = et - cycle * band.dur;
      var headX = marginX + (local / band.dur) * bw;
      var marks = fragment(b, cycle, bw);

      // Beam line.
      ctx.strokeStyle = band.color;
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(marginX, y);
      ctx.lineTo(marginX + bw, y);
      ctx.stroke();
      ctx.globalAlpha = 1;

      // Marks: played portion full strength, unplayed faint.
      for (var mi = 0; mi < marks.length; mi++) {
        var m = marks[mi];
        var mx = marginX + m.x;
        var played = mx <= headX;
        var a = played ? 0.95 : 0.30;
        var mm = { t: m.t, x: mx, w: m.w, r: m.r };
        // Misregistration second pass, 2-3 px offset, faint.
        if (band.misreg) {
          ctx.save();
          ctx.translate(band.misreg, band.misreg);
          drawMark(b, mm, y, band.color, a * 0.35);
          ctx.restore();
        }
        drawMark(b, mm, y, band.color, a);
      }

      // Trace dot at the head.
      ctx.fillStyle = band.color;
      dot(headX, y, 5);
      ctx.globalAlpha = 0.25;
      dot(headX, y, 9);
      ctx.globalAlpha = 1;
    }
  }

  function loop(ts) {
    if (!started) { t0 = ts; started = true; }
    draw((ts - t0) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }

  function bandAt(y) {
    var top = isPhone ? H * 0.16 : H * 0.20;
    var gap = (H - top - (isPhone ? H * 0.10 : H * 0.16)) / 3;
    var idx = Math.floor((y - top) / gap);
    if (idx < 0) idx = 0;
    if (idx > 2) idx = 2;
    return idx;
  }

  function onDown(e) {
    var p = e.touches ? e.touches[0] : e;
    dragBand = bandAt(p.clientY);
    dragX = p.clientX; dragY = p.clientY; dragMoved = 0;
  }
  function onMove(e) {
    if (dragBand < 0) return;
    var p = e.touches ? e.touches[0] : e;
    var dx = p.clientX - dragX;
    dragX = p.clientX; dragY = p.clientY;
    dragMoved += Math.abs(dx);
    if (started && Math.abs(dx) > 0) {
      var now = (typeof performance !== 'undefined' && performance.now) ? (performance.now() - t0) / 1000 : 0;
      drags.push({ t: now, band: dragBand, dx: dx });
      if (drags.length > 200) drags.shift();
    }
    if (e.cancelable) e.preventDefault();
  }
  function onUp() { dragBand = -1; }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: true });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp);

  if (typeof window !== 'undefined') {
    window.addEventListener('resize', size);
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      visualViewport.addEventListener('resize', size);
    }
  }
  size();
  // Frame one is drawn synchronously at t=0 inside size(); the clock
  // starts only when the rAF loop first fires.
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
