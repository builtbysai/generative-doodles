<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.434 Three Things in a Pocket</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#E8D9B8; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.434 Three Things in a Pocket (angelina_bambina_dsgn,
// EXPANSION #47, prompt ANG2). Her prompt-trio combinator
// as a living generator: a stylised woman walks across a
// star-sprinkled beige ground, an animal ahead of her on
// a thin leash, an accessory cluster standing lower-right.
// The trio is three authored slot indexes, no runtime
// randomness: GARMENT (dark-green winter coat, knitted
// jumper, cardigan), ANIMAL (reindeer, capybara, fox),
// ACCESSORY (shopping bags, book stack, gift boxes).
// Horizontal drag released past 90 design px swaps the
// garment (direction = sign), vertical drag swaps the
// animal; TAP advances all three slots at once. Every
// swap settles with a bounce, a short hop that ends
// exactly on the resting pose. The candy-cane hem stripe
// rides every garment. The leash is redrawn each frame
// from her hand to the current animal's collar point, so
// it holds in every combo.
//
// Ambient loop is 36s: star sprinkles (a fixed table of
// 64) drift down a whole number of field heights per
// loop and twinkle on whole cycles; the animal's ear
// twitches at fixed 9s slots (4 per loop); the pair walk
// in place on whole stride cycles (woman 20 per loop,
// animals 20-28 per loop by species). Frame one is drawn
// synchronously at the constant phase T = 13.7s (default
// trio: coat, reindeer, bags; both mid-stride, sprinkles
// falling); the clock advances in fixed 1/60 ticks from
// there, never from a wall clock. Flat colour only, one
// canvas, no offscreen canvas, no gradients, no
// shadowBlur, no text anywhere.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Closed set from the prompt, nothing else: beige ground,
// coat green, turtleneck yellow, boot red, animal orange,
// bag red/green (the two greens/reds above), star cream.
// Resolutions inside the set, documented in process.md:
// her skin and the fox chest/tail tip take the star cream
// #F6E7B4; her hair takes the animal orange #E07B39; the
// jumper is the turtleneck yellow with knit ribs in animal
// orange; the cardigan is boot red over the yellow
// turtleneck; antlers and hooves take boot red; eyes and
// noses take coat green; the candy-cane stripe is boot
// red on star cream.
var GROUND = '#E8D9B8', GREEN = '#2E5B3E', YELLOW = '#F2C230';
var RED = '#B3392F', ORANGE = '#E07B39', CREAM = '#F6E7B4';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 36;
if (LOOP !== 36) throw new Error('Three Things loop must be 36s');
var TICK = 1 / 60;
var BASE_Y = 748;        // the shared ground line
var WX = 430;            // woman's hip centre x
var AX = 872;            // animal's body centre x
var CX = 1068;           // accessory cluster centre x

// ---- small draw helpers ---------------------------------
function circ(x, y, r, fill) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function ell(x, y, rx, ry, fill, rot) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function rect(x, y, w, h, fill) {
  if (fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
}
function line(x0, y0, x1, y1, col, lw) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
}
function poly(pts, fill) {
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}

// ---- slot tables -----------------------------------------
// The three authored trios' building blocks. Resolutions:
// garment 1 (jumper) is turtleneck yellow with orange knit
// ribs; garment 2 (cardigan) is boot red, open over the
// yellow turtleneck, with cream buttons. Animal strides
// are whole cycles per 36s loop; each animal carries its
// own collar anchor for the leash.
var GARMENTS = ['coat', 'jumper', 'cardigan'];
var ANIMALS = [
  { kind: 'reindeer', stride: 24 },
  { kind: 'capybara', stride: 20 },
  { kind: 'fox',      stride: 28 }
];
var ACCS = ['bags', 'books', 'gifts'];
if (GARMENTS.length !== 3 || ANIMALS.length !== 3 || ACCS.length !== 3) {
  throw new Error('Three Things needs exactly 3 garments, 3 animals, 3 accessory clusters');
}

// ---- star sprinkles ---------------------------------------
// A fixed table of 64 sprinkles built once from a fixed-
// seed LCG (identical on every load, no runtime random).
// k = whole field heights fallen per loop (1 or 2), so
// every sprinkle returns exactly at the seam; twinkle is
// a whole number of radius pulses per loop.
var STARS = [];
(function () {
  var seed = 434434;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  for (var i = 0; i < 64; i++) {
    STARS.push({
      x: 20 + rnd() * (DW - 40),
      y0: rnd() * DH,
      k: rnd() < 0.6 ? 1 : 2,
      r: 4.5 + rnd() * 4.5,
      tw: 3 + Math.floor(rnd() * 4),
      ph: rnd() * Math.PI * 2
    });
  }
})();
if (STARS.length !== 64) throw new Error('Three Things needs exactly 64 sprinkles');

function drawStar(x, y, r) {
  var q = r * 0.30;
  poly([x, y - r, x + q, y - q, x + r, y, x + q, y + q,
        x, y + r, x - q, y + q, x - r, y, x - q, y - q], CREAM);
}
function drawSprinkles(lt) {
  for (var i = 0; i < STARS.length; i++) {
    var st = STARS[i];
    var y = (st.y0 + st.k * DH * lt / LOOP) % DH;
    var r = st.r * (0.78 + 0.30 * (0.5 + 0.5 * Math.sin(2 * Math.PI * st.tw * lt / LOOP + st.ph)));
    drawStar(st.x, y, r);
  }
}

// ---- shared beats ------------------------------------------
// Ear twitch: a pulse inside the first 0.7s of each fixed
// 9s slot, 4 slots per loop, zero elsewhere.
function twitchAmt(lt) {
  var local = lt % 9;
  return local < 0.7 ? Math.sin(Math.PI * local / 0.7) : 0;
}

// ---- the woman ----------------------------------------------
var HAND = { x: 0, y: 0 };   // her leash hand, set each frame

function torsoPath(wx, topY, hemY) {
  ctx.beginPath();
  ctx.moveTo(wx - 50, topY);
  ctx.quadraticCurveTo(wx - 62, (topY + hemY) / 2, wx - 76, hemY);
  ctx.lineTo(wx + 76, hemY);
  ctx.quadraticCurveTo(wx + 62, (topY + hemY) / 2, wx + 50, topY);
  ctx.closePath();
}
// The candy-cane hem band rides every garment: a cream
// band clipped to the torso at the hem, boot-red diagonal
// stripes across it.
function candyHem(wx, hemY) {
  ctx.save();
  torsoPath(wx, hemY - 190, hemY);
  ctx.clip();
  rect(wx - 80, hemY - 23, 160, 23, CREAM);
  ctx.fillStyle = RED;
  for (var x = wx - 92; x < wx + 84; x += 24) {
    poly([x, hemY, x + 11, hemY, x + 22, hemY - 23, x + 11, hemY - 23], RED);
  }
  ctx.restore();
}
function drawGarmentBody(g, wx, topY, hemY) {
  if (g === 0) {            // dark-green winter coat
    torsoPath(wx, topY, hemY); ctx.fillStyle = GREEN; ctx.fill();
    // turtleneck triangle at the chest
    poly([wx - 13, topY + 2, wx + 13, topY + 2, wx, topY + 36], YELLOW);
    // belt and two cream pocket flaps
    rect(wx - 71, hemY - 66, 142, 7, CREAM);
    rect(wx - 58, hemY - 48, 24, 10, CREAM);
    rect(wx + 34, hemY - 48, 24, 10, CREAM);
  } else if (g === 1) {     // knitted jumper: yellow, orange ribs
    torsoPath(wx, topY, hemY); ctx.fillStyle = YELLOW; ctx.fill();
    ctx.save();
    torsoPath(wx, topY, hemY);
    ctx.clip();
    ctx.fillStyle = ORANGE;
    for (var y = topY + 18; y < hemY - 30; y += 15) rect(wx - 80, y, 160, 3.5, ORANGE);
    ctx.restore();
    // green crew band at the neck
    rect(wx - 15, topY - 2, 30, 9, GREEN);
  } else {                 // cardigan: red, open over the turtleneck
    torsoPath(wx, topY, hemY); ctx.fillStyle = RED; ctx.fill();
    // the yellow turtleneck beneath, an open front panel
    poly([wx - 15, topY, wx + 15, topY, wx + 21, hemY - 23, wx - 21, hemY - 23], YELLOW);
    // cream buttons down both front edges
    for (var by = topY + 30; by < hemY - 44; by += 33) {
      circ(wx - 21, by, 3.6, CREAM);
      circ(wx + 21, by, 3.6, CREAM);
    }
    // yellow stitch dashes along the panel edges
    ctx.fillStyle = YELLOW;
    for (var sy = topY + 14; sy < hemY - 34; sy += 16) {
      rect(wx - 26, sy, 3, 8, YELLOW);
      rect(wx + 23, sy, 3, 8, YELLOW);
    }
  }
  candyHem(wx, hemY);
}
function drawWoman(lt) {
  var ph = 2 * Math.PI * (lt * 20 / LOOP);
  var s = Math.sin(ph);
  var bob = Math.abs(Math.sin(ph)) * 5;
  var hipY = 606 - bob, hemY = 654 - bob, topY = 470 - bob;
  var neckY = 448 - bob;
  // legs: garment-colour thighs under the hem, red knee
  // boots below, feet swinging opposite each other
  var legs = [1, -1];
  for (var i = 0; i < 2; i++) {
    var d = legs[i];
    var fx = WX + d * s * 38;
    var kx = WX + d * 15 + d * s * 10, ky = (hipY + BASE_Y) / 2 + 8;
    line(WX + d * 11, hipY + 6, kx, ky, GREEN, 17);
    line(kx, ky, fx, BASE_Y - 10, RED, 12);
    line(fx, BASE_Y - 3, fx + d * 15, BASE_Y - 3, RED, 9);
  }
  // turtleneck collar
  rect(WX - 15, neckY, 30, 26, YELLOW);
  // garment torso
  drawGarmentBody(gIdx, WX, topY, hemY);
  // rear arm over the torso edge (swings gently against
  // the stride), its hand clear of the silhouette
  line(WX - 40, topY + 12, WX - 74 - s * 7, 594 - bob, GARMENT_ARM, 15);
  circ(WX - 74 - s * 7, 598 - bob, 8, CREAM);
  // head: cream face, orange hair as a crescent cap and
  // a back sweep, a bun; calm closed eye and small smile
  ell(WX - 29, 442 - bob, 12, 30, ORANGE, 0.15);
  circ(WX + 2, 404 - bob, 35, ORANGE);
  circ(WX - 25, 371 - bob, 14, ORANGE);
  circ(WX + 5, 411 - bob, 31, CREAM);
  ctx.beginPath();
  ctx.arc(WX + 13, 410 - bob, 7, Math.PI * 1.15, Math.PI * 1.85);
  ctx.strokeStyle = GREEN; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
  ctx.beginPath();
  ctx.arc(WX + 14, 424 - bob, 5, Math.PI * 0.15, Math.PI * 0.8);
  ctx.stroke();
  circ(WX + 21, 421 - bob, 4.5, ORANGE);
  // front arm reaching forward-down to the leash, elbow
  // and hand clear of the torso silhouette
  line(WX + 42, topY + 10, WX + 80, 546 - bob, GARMENT_ARM, 15);
  line(WX + 80, 546 - bob, WX + 110, 594 - bob, GARMENT_ARM, 15);
  circ(WX + 110, 596 - bob, 8.5, CREAM);
  HAND.x = WX + 110; HAND.y = 596 - bob;
}
// Sleeve colour follows the current garment.
var GARMENT_ARM = GREEN;

// ---- the animals ----------------------------------------------
var COLLAR = { x: 0, y: 0 };  // current collar anchor, set each frame

function animalLegs(lt, stride, topY, col, w, hoof) {
  var ph = 2 * Math.PI * (lt * stride / LOOP);
  var offs = [-54, -32, 36, 58];
  for (var i = 0; i < 4; i++) {
    var d = (i % 2 === 0) ? 1 : -1;
    var fx = AX + offs[i] + Math.sin(ph) * d * 13;
    line(AX + offs[i], topY, fx, BASE_Y - 6, col, w);
    if (hoof) line(fx, BASE_Y - 3, fx + 9, BASE_Y - 3, hoof, 6);
  }
}
function drawReindeer(lt, tw) {
  var a = ANIMALS[0];
  var ph = 2 * Math.PI * (lt * a.stride / LOOP);
  var bob = Math.abs(Math.sin(ph)) * 4;
  animalLegs(lt, a.stride, 700, ORANGE, 11, RED);
  ell(AX, 670 - bob, 86, 48, ORANGE);
  // tail flicking up at the rear
  poly([AX - 82, 646 - bob, AX - 97, 624 - bob, AX - 70, 630 - bob], ORANGE);
  // neck and head
  line(AX + 56, 650 - bob, AX + 99, 602 - bob, ORANGE, 27);
  ell(AX + 104, 598 - bob, 30, 19, ORANGE, -0.22);
  ell(AX + 124, 606 - bob, 13, 10, CREAM, -0.22);
  circ(AX + 133, 602 - bob, 6, RED);                 // nose
  circ(AX + 105, 594 - bob, 3.6, GREEN);             // eye
  // ears: the far one steady, the near one twitches
  ell(AX + 82, 582 - bob, 11, 5.5, ORANGE, -0.5);
  ell(AX + 95, 579 - bob, 11, 5.5, ORANGE, -0.5 - tw * 0.55);
  // antlers in boot red: two beams with tines
  line(AX + 88, 584 - bob, AX + 82, 548 - bob, RED, 5);
  line(AX + 82, 548 - bob, AX + 90, 520 - bob, RED, 5);
  line(AX + 83, 556 - bob, AX + 68, 542 - bob, RED, 5);
  line(AX + 103, 582 - bob, AX + 106, 544 - bob, RED, 5);
  line(AX + 106, 544 - bob, AX + 114, 524 - bob, RED, 5);
  line(AX + 105, 552 - bob, AX + 92, 540 - bob, RED, 5);
  // collar with a cream bell: the leash anchor
  line(AX + 63, 636 - bob, AX + 85, 616 - bob, RED, 9);
  circ(AX + 74, 632 - bob, 5, CREAM);
  COLLAR.x = AX + 70; COLLAR.y = 626 - bob;
}
function drawCapybara(lt, tw) {
  var a = ANIMALS[1];
  var ph = 2 * Math.PI * (lt * a.stride / LOOP);
  var bob = Math.abs(Math.sin(ph)) * 3;
  animalLegs(lt, a.stride, 722, ORANGE, 12, null);
  ell(AX, 688 - bob, 96, 54, ORANGE);
  // blunt head merged into the body line, a paler muzzle
  ell(AX + 84, 672 - bob, 40, 31, ORANGE);
  ell(AX + 112, 682 - bob, 21, 16, CREAM);
  circ(AX + 122, 676 - bob, 3, GREEN);
  circ(AX + 114, 686 - bob, 2.4, GREEN);
  circ(AX + 90, 660 - bob, 3.6, GREEN);              // eye
  // one small round ear, twitching
  circ(AX + 62, 642 - bob - tw * 3, 9, ORANGE);
  circ(AX + 44, 646 - bob, 7.5, ORANGE);
  // green collar band down the neck: the leash anchor
  line(AX + 47, 646 - bob, AX + 55, 694 - bob, GREEN, 10);
  COLLAR.x = AX + 48; COLLAR.y = 664 - bob;
}
function drawFox(lt, tw) {
  var a = ANIMALS[2];
  var ph = 2 * Math.PI * (lt * a.stride / LOOP);
  var bob = Math.abs(Math.sin(ph)) * 4;
  // bushy tail: a thick curved stroke sweeping back from
  // the body, its last stretch dipped in cream
  ctx.beginPath();
  ctx.moveTo(AX - 60, 664 - bob);
  ctx.quadraticCurveTo(AX - 116, 630 - bob, AX - 146, 652 - bob);
  ctx.strokeStyle = ORANGE; ctx.lineWidth = 27; ctx.lineCap = 'round'; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(AX - 128, 640 - bob);
  ctx.quadraticCurveTo(AX - 138, 644 - bob, AX - 146, 652 - bob);
  ctx.strokeStyle = CREAM; ctx.lineWidth = 27; ctx.stroke();
  animalLegs(lt, a.stride, 706, ORANGE, 9, CREAM);
  ell(AX, 676 - bob, 82, 45, ORANGE);
  ell(AX + 56, 690 - bob, 15, 22, CREAM, 0.2);       // chest
  // neck into a head that overlaps the body's front
  line(AX + 58, 662 - bob, AX + 79, 636 - bob, ORANGE, 24);
  circ(AX + 82, 630 - bob, 27, ORANGE);
  // pointed ears; the near ear twitches
  poly([AX + 62, 610 - bob, AX + 58, 578 - bob, AX + 78, 600 - bob], ORANGE);
  poly([AX + 90 + tw * 7, 572 - bob - tw * 3, AX + 102, 602 - bob, AX + 84, 604 - bob], ORANGE);
  poly([AX + 82, 644 - bob, AX + 118, 638 - bob, AX + 84, 626 - bob], CREAM); // snout
  circ(AX + 116, 636 - bob, 4, GREEN);               // nose
  circ(AX + 90, 626 - bob, 3.4, GREEN);              // eye
  // yellow collar: the leash anchor
  line(AX + 50, 650 - bob, AX + 64, 672 - bob, YELLOW, 8);
  COLLAR.x = AX + 54; COLLAR.y = 656 - bob;
}
function drawAnimal(lt) {
  var tw = twitchAmt(lt);
  if (aIdx === 0) drawReindeer(lt, tw);
  else if (aIdx === 1) drawCapybara(lt, tw);
  else drawFox(lt, tw);
}

// ---- the leash ---------------------------------------------------
// A thin red quadratic curve from her hand to the current
// animal's collar, sagging a little, recomputed per frame.
function drawLeash() {
  var mx = (HAND.x + COLLAR.x) / 2, my = (HAND.y + COLLAR.y) / 2 + 26;
  ctx.beginPath();
  ctx.moveTo(HAND.x, HAND.y);
  ctx.quadraticCurveTo(mx, my, COLLAR.x, COLLAR.y);
  ctx.strokeStyle = RED; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.stroke();
}

// ---- accessory clusters (lower-right, on the ground) --------------
function drawAccBags() {
  // tall red bag, shorter green bag, cream handles
  ctx.beginPath(); ctx.arc(CX - 24, 664, 20, Math.PI, 0);
  ctx.strokeStyle = CREAM; ctx.lineWidth = 5; ctx.stroke();
  rect(CX - 56, 664, 64, 84, RED);
  drawStar(CX - 24, 706, 9);
  ctx.beginPath(); ctx.arc(CX + 42, 686, 16, Math.PI, 0);
  ctx.strokeStyle = CREAM; ctx.lineWidth = 5; ctx.stroke();
  rect(CX + 14, 686, 56, 62, GREEN);
  circ(CX + 42, 716, 6, CREAM);
}
function drawAccBooks() {
  // three stacked books, cream page edges, a star on top
  rect(CX - 58, 716, 118, 32, GREEN);
  rect(CX + 44, 716, 16, 32, CREAM);
  rect(CX - 50, 688, 102, 28, RED);
  rect(CX + 36, 688, 16, 28, CREAM);
  rect(CX - 42, 662, 86, 26, YELLOW);
  rect(CX + 28, 662, 16, 26, CREAM);
  drawStar(CX + 1, 640, 9);
}
function drawAccGifts() {
  // big red box with a cream ribbon cross, green box with
  // a yellow ribbon, a candy cane leaning at the side
  rect(CX - 58, 690, 76, 58, RED);
  rect(CX - 24, 690, 8, 58, CREAM);
  rect(CX - 58, 714, 76, 8, CREAM);
  ell(CX - 20, 684, 12, 6, CREAM);
  rect(CX + 26, 704, 58, 44, GREEN);
  rect(CX + 50, 704, 7, 44, YELLOW);
  rect(CX + 26, 722, 58, 7, YELLOW);
  // candy cane: cream hook with red stripes
  ctx.beginPath();
  ctx.arc(CX - 84, 690, 13, Math.PI, 0, false);
  ctx.strokeStyle = CREAM; ctx.lineWidth = 10; ctx.stroke();
  line(CX - 97, 690, CX - 97, 748, CREAM, 10);
  line(CX - 97, 706, CX - 88, 712, RED, 10);
  line(CX - 97, 726, CX - 88, 732, RED, 10);
  line(CX - 88, 682, CX - 80, 688, RED, 9);
}
function drawAccessory() {
  if (cIdx === 0) drawAccBags();
  else if (cIdx === 1) drawAccBooks();
  else drawAccGifts();
}

// ---- shadows -------------------------------------------------------
function drawShadows() {
  ctx.globalAlpha = 0.13;
  ell(WX, 754, 118, 11, GREEN);
  ell(AX, 754, 128, 11, GREEN);
  ell(CX, 754, 92, 10, GREEN);
  ctx.globalAlpha = 1;
}

function draw(lt) {
  rect(0, 0, DW, DH, GROUND);
  drawSprinkles(lt);
  drawShadows();
  // settled bounce: a hop applied to the figures only,
  // exactly zero again once the settle finishes
  var by = 0;
  if (settleT < 1) by = -18 * Math.sin(Math.PI * settleT);
  ctx.save();
  ctx.translate(0, by);
  drawAnimal(lt);
  drawWoman(lt);
  drawLeash();
  drawAccessory();
  ctx.restore();
}

// ---- piece state ----------------------------------------------------
// Constant first-frame phase: T = 13.7s into the 36s loop
// (default trio, both mid-stride, sprinkles falling, no
// twitch active). The clock advances in fixed 1/60 ticks.
var T = 13.7;
var lastNow = -1, acc = 0;
var gIdx = 0, aIdx = 0, cIdx = 0;      // the trio
var settleT = 1;                        // 1 = at rest
var tickCount = 0;

function step() {
  if (settleT < 1) settleT = Math.min(1, settleT + TICK / 0.6);
  tickCount++;
  T += TICK;
}
function bounce() { settleT = 0; }

// ---- pointer: drag swaps one slot, tap advances all three -----------
function toDesign(ev) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cx = (ev.clientX !== undefined ? ev.clientX : (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 0)) - r.left;
  var cy = (ev.clientY !== undefined ? ev.clientY : (ev.touches && ev.touches[0] ? ev.touches[0].clientY : 0)) - r.top;
  return { x: (cx - OX) / S, y: (cy - OY) / S };
}
var pDown = false, downX = 0, downY = 0, downTick = 0;
function onDown(ev) {
  var p = toDesign(ev);
  pDown = true; downX = p.x; downY = p.y; downTick = tickCount;
  if (ev.preventDefault) ev.preventDefault();
}
function onUp(ev) {
  if (!pDown) return;
  pDown = false;
  var p = toDesign(ev);
  var dx = p.x - downX, dy = p.y - downY;
  var adx = Math.abs(dx), ady = Math.abs(dy);
  var dist = Math.max(adx, ady);
  if (dist < 14 && tickCount - downTick < 30) {
    // TAP: advance all three slots through their tables
    gIdx = (gIdx + 1) % 3;
    aIdx = (aIdx + 1) % 3;
    cIdx = (cIdx + 1) % 3;
    GARMENT_ARM = [GREEN, YELLOW, RED][gIdx];
    bounce();
  } else if (adx >= ady && adx > 90) {
    gIdx = (gIdx + (dx > 0 ? 1 : 2)) % 3;
    GARMENT_ARM = [GREEN, YELLOW, RED][gIdx];
    bounce();
  } else if (ady > adx && ady > 90) {
    aIdx = (aIdx + (dy > 0 ? 1 : 2)) % 3;
    bounce();
  }
  if (ev.preventDefault) ev.preventDefault();
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', function () { pDown = false; });
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('touchcancel', function () { pDown = false; });
}

// ---- sizing ----------------------------------------------------------
// Full-bleed field: cover fit on every screen.
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw(T % LOOP);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
