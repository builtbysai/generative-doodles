<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where Horizons Meet</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0d12; overflow: hidden; height: 100%; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .caption {
    position: fixed; bottom: 18px; left: 22px; color: rgba(220,215,200,0.42);
    font: 11px/1.5 -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.14em;
    text-transform: uppercase; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="caption">Where Horizons Meet &middot; after Gadamer</div>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let seed = 9135;
  function rnd() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  function horizonPos(t, phase, rx, ry) {
    return {
      x: W * 0.5 + Math.cos(t * 0.11 + phase) * rx + Math.cos(t * 0.043 + phase * 2) * rx * 0.3,
      y: H * 0.5 + Math.sin(t * 0.09 + phase) * ry + Math.sin(t * 0.061 + phase * 1.7) * ry * 0.3
    };
  }
  const STROKES = [];
  function buildStrokes() {
    STROKES.length = 0; seed = 9135;
    for (let i = 0; i < 900; i++) {
      STROKES.push({
        a: rnd() * Math.PI * 2,
        r: 0.12 + Math.pow(rnd(), 0.7) * 0.88,
        w: 0.5 + rnd() * 1.4,
        arc: 0.15 + rnd() * 0.9,
        sp: 0.02 + rnd() * 0.06,
        ph: rnd() * Math.PI * 2
      });
    }
  }
  let grain = null;
  function makeGrain() {
    grain = document.createElement('canvas');
    grain.width = 128; grain.height = 128;
    const g = grain.getContext('2d');
    const d = g.createImageData(128, 128);
    for (let i = 0; i < d.data.length; i += 4) {
      const v = (Math.random() * 255) | 0;
      d.data[i] = d.data[i+1] = d.data[i+2] = v;
      d.data[i+3] = 12;
    }
    g.putImageData(d, 0, 0);
  }
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildStrokes();
    const grd = ctx.createRadialGradient(W/2, H/2, 10, W/2, H/2, Math.max(W,H)*0.7);
    grd.addColorStop(0, '#12141b');
    grd.addColorStop(1, '#08090c');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
  }
  function glow(x, y, r, cr, cg, cb, alpha) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba('+cr+','+cg+','+cb+','+alpha+')');
    g.addColorStop(0.7, 'rgba('+cr+','+cg+','+cb+','+(alpha*0.35)+')');
    g.addColorStop(1, 'rgba('+cr+','+cg+','+cb+',0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  let T = 0;
  function frame() {
    T += 0.016;
    ctx.fillStyle = 'rgba(11,13,18,0.14)';
    ctx.fillRect(0, 0, W, H);
    const R = Math.min(W, H) * 0.42;
    const p1 = horizonPos(T, 0, W * 0.22, H * 0.18);
    const p2 = horizonPos(T, Math.PI * 0.9, W * 0.22, H * 0.18);
    glow(p1.x, p1.y, R * 1.15, 90, 160, 200, 0.13);
    glow(p2.x, p2.y, R * 1.15, 210, 140, 80, 0.13);
    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    const overlap = Math.max(0, 1 - dist / (R * 1.6));
    ctx.lineCap = 'round';
    for (const s of STROKES) {
      const ang = s.a + T * s.sp;
      const lr = s.r * R * 0.85;
      const px = mx + Math.cos(ang) * lr * 0.9 + Math.sin(T * 0.5 + s.ph) * 6;
      const py = my + Math.sin(ang) * lr * 0.62 + Math.cos(T * 0.4 + s.ph) * 6;
      const dLens = Math.hypot(px - mx, py - my) / (R * 0.9);
      const b = overlap * Math.max(0, 1 - dLens);
      if (b < 0.015) continue;
      const cr = 150 + 90 * b, cg = 190 + 40 * b, cb = 170 + 30 * b;
      ctx.strokeStyle = 'rgba('+(cr|0)+','+(cg|0)+','+(cb|0)+','+Math.min(0.95,b*1.6).toFixed(2)+')';
      ctx.lineWidth = s.w;
      ctx.beginPath();
      ctx.arc(px, py, 3 + s.r * 10, ang, ang + s.arc);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(90,160,200,0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(p1.x, p1.y, R, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(210,140,80,0.10)';
    ctx.beginPath(); ctx.arc(p2.x, p2.y, R, 0, Math.PI * 2); ctx.stroke();
    if (grain) {
      ctx.save(); ctx.globalAlpha = 0.5;
      ctx.fillStyle = ctx.createPattern(grain, 'repeat');
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  let running = true;
  function setRunning(v) {
    if (v === running) return;
    running = v;
    if (v) requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => setRunning(!document.hidden));
  window.addEventListener('blur', () => setRunning(false));
  window.addEventListener('focus', () => setRunning(true));
  window.addEventListener('resize', resize);
  makeGrain();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
