<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bad Reputation</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #141414; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palettes (flat fills only, no gradients anywhere, ever).
  // Lie:   near-black, blood red, bone.
  // Truth: hill green, wolf grey, sky, cream.
  var INK = '#141414', RED = '#8E1B1B', BONE = '#E8DCC8';
  var GREEN = '#4E9A3D', GREY = '#8A8D91', SKY = '#7EC8E3', CREAM = '#F7F1E3';

  var PHASE0 = 1.2; // constant first-frame phase (seconds): wipe at rest, pack mid-stride

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(534064);

  // ---- layout (1080 x 1080 design space) ----
  var STAGE_BOT = 700;              // shared lie/truth stage: y 0..700
  var BAN_Y = 700, BAN_H = 92;      // banner strip between stage and facts
  var FACT_Y = 792;                 // fact strip: y 792..1080

  // ---- seeded decoration ----
  var stars = [];
  for (var i = 0; i < 90; i++) stars.push({ x: rng() * 1080, y: rng() * 430, r: 1 + rng() * 2.2, a: 0.25 + rng() * 0.55 });
  var tufts = [];
  for (i = 0; i < 60; i++) tufts.push({ x: rng() * 1080, y: 560 + rng() * 130, s: 5 + rng() * 7 });

  // ---- the wolf: one parametric silhouette, reused at every scale and palette ----
  // Local space: facing right, ground at y=0, body about 150 long, ear top at y=-68.
  function drawWolf(o) {
    // o: {x, groundY, s, color, snarl, trot (phase or null), howl, dir (1 faces right, -1 left)}
    ctx.save();
    ctx.translate(o.x, o.groundY);
    if (o.howl) ctx.rotate(-0.16 * (o.dir || 1));
    ctx.scale(o.s * (o.dir || 1), o.s);
    var bob = o.trot === null ? 0 : Math.sin(o.trot) * 2.2;
    ctx.translate(0, bob);
    ctx.fillStyle = o.color;
    ctx.strokeStyle = o.color;
    ctx.lineCap = 'round';
    // legs (tapered strokes); trot swings them, otherwise planted
    var sw = o.trot === null ? 0 : Math.sin(o.trot) * 9;
    var legs = [
      { hx: 36, fx: 40 + sw }, { hx: 27, fx: 22 - sw },
      { hx: -30, fx: -26 - sw }, { hx: -39, fx: -44 + sw }
    ];
    ctx.lineWidth = 7.5;
    for (var li = 0; li < legs.length; li++) {
      ctx.beginPath();
      ctx.moveTo(legs[li].hx, -26);
      ctx.lineTo(legs[li].fx, 0);
      ctx.stroke();
    }
    // body, head, tail: one filled silhouette
    ctx.beginPath();
    ctx.moveTo(-46, -34);            // rear underside
    ctx.lineTo(-58, -52);            // tail, angled up and back
    ctx.lineTo(-44, -56);            // tail top
    ctx.lineTo(-28, -53);            // rear back
    ctx.lineTo(8, -55);              // mid back
    ctx.lineTo(30, -53);             // shoulder
    ctx.lineTo(44, -57);             // neck
    ctx.lineTo(50, -69);             // ear tip
    ctx.lineTo(58, -57);             // ear front
    ctx.lineTo(68, -55);             // forehead
    ctx.lineTo(86, -47);             // snout top
    ctx.lineTo(90, -41);             // nose
    if (o.snarl) {
      ctx.lineTo(80, -35);           // open upper jaw
      ctx.lineTo(68, -29);           // dropped lower jaw
    } else {
      ctx.lineTo(80, -36);           // mouth
    }
    ctx.lineTo(58, -34);             // throat
    ctx.lineTo(50, -27);             // chest
    ctx.lineTo(26, -25);             // belly front
    ctx.lineTo(-16, -24);            // belly rear
    ctx.lineTo(-38, -27);            // rear bottom
    ctx.closePath();
    ctx.fill();
    if (o.snarl) {
      // hackles: jagged spikes along the neck and back
      ctx.beginPath();
      var hx = [36, 27, 18, 9, 0, -9, -18];
      for (var hi = 0; hi < hx.length; hi++) {
        ctx.moveTo(hx[hi], -53.5);
        ctx.lineTo(hx[hi] - 3.5, -60.5);
        ctx.lineTo(hx[hi] - 7, -52.5);
      }
      ctx.fill();
      // bone teeth in the open jaw
      ctx.fillStyle = BONE;
      ctx.beginPath();
      var tx = [76, 70, 64];
      for (var ti = 0; ti < tx.length; ti++) {
        ctx.moveTo(tx[ti], -35);
        ctx.lineTo(tx[ti] + 3, -35);
        ctx.lineTo(tx[ti] + 1.5, -29);
      }
      ctx.fill();
      // the one red eye
      ctx.fillStyle = RED;
      ctx.beginPath(); ctx.arc(63, -48, 2.8, 0, Math.PI * 2); ctx.fill();
    } else {
      // calm eye
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.arc(63, -48, 2.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // ---- TRUTH scene (drawn first, underneath): the real wolf and her pack ----
  function drawTruth(t) {
    ctx.fillStyle = SKY;
    ctx.fillRect(0, 0, 1080, STAGE_BOT);
    // sun
    ctx.fillStyle = CREAM;
    ctx.beginPath(); ctx.arc(892, 148, 68, 0, Math.PI * 2); ctx.fill();
    // flat clouds
    ctx.beginPath(); ctx.ellipse(250, 130, 95, 26, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(560, 84, 70, 20, 0, 0, Math.PI * 2); ctx.fill();
    // far hill
    ctx.fillStyle = GREEN;
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.moveTo(0, 470);
    ctx.quadraticCurveTo(300, 400, 620, 452);
    ctx.quadraticCurveTo(880, 496, 1080, 440);
    ctx.lineTo(1080, STAGE_BOT); ctx.lineTo(0, STAGE_BOT);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    // near hill
    ctx.beginPath();
    ctx.moveTo(0, 580);
    ctx.quadraticCurveTo(360, 516, 720, 566);
    ctx.quadraticCurveTo(920, 596, 1080, 560);
    ctx.lineTo(1080, STAGE_BOT); ctx.lineTo(0, STAGE_BOT);
    ctx.closePath(); ctx.fill();
    // grass tufts on the near hill
    ctx.strokeStyle = GREEN;
    ctx.lineWidth = 3;
    for (var i = 0; i < tufts.length; i++) {
      var g = tufts[i];
      ctx.beginPath();
      ctx.moveTo(g.x, g.y); ctx.lineTo(g.x - g.s * 0.5, g.y - g.s);
      ctx.moveTo(g.x + 4, g.y); ctx.lineTo(g.x + 4 + g.s * 0.5, g.y - g.s);
      ctx.stroke();
    }
    // the pack, trotting: same wolf, grey, three sizes
    drawWolf({ x: 300, groundY: 668, s: 1.85, color: GREY, snarl: false, trot: t * 5.2 });
    drawWolf({ x: 610, groundY: 640, s: 1.5, color: GREY, snarl: false, trot: t * 5.2 + 2.1 });
    drawWolf({ x: 830, groundY: 682, s: 1.25, color: GREY, snarl: false, trot: t * 5.2 + 4.0 });
  }

  // ---- LIE scene (drawn on top, clipped by the wipe): the fairy-tale wolf ----
  function drawLie(t) {
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, 1080, STAGE_BOT);
    // bone stars
    ctx.fillStyle = BONE;
    for (var i = 0; i < stars.length; i++) {
      ctx.globalAlpha = stars[i].a;
      ctx.beginPath(); ctx.arc(stars[i].x, stars[i].y, stars[i].r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // the huge blood-red moon
    ctx.fillStyle = RED;
    ctx.beginPath(); ctx.arc(600, 310, 272, 0, Math.PI * 2); ctx.fill();
    // jagged pine silhouettes in blood red against the black sky
    ctx.fillStyle = RED;
    var pines = [ { x: 26, h: 300 }, { x: 96, h: 215 }, { x: 968, h: 320 }, { x: 1024, h: 235 } ];
    for (i = 0; i < pines.length; i++) {
      var p = pines[i], top = STAGE_BOT - p.h;
      ctx.beginPath();
      ctx.moveTo(p.x, STAGE_BOT);
      ctx.lineTo(p.x + 16, top + p.h * 0.45);
      ctx.lineTo(p.x + 6, top + p.h * 0.45);
      ctx.lineTo(p.x + 20, top + p.h * 0.2);
      ctx.lineTo(p.x + 10, top + p.h * 0.2);
      ctx.lineTo(p.x + 24, top);
      ctx.lineTo(p.x + 38, top + p.h * 0.2);
      ctx.lineTo(p.x + 28, top + p.h * 0.2);
      ctx.lineTo(p.x + 42, top + p.h * 0.45);
      ctx.lineTo(p.x + 32, top + p.h * 0.45);
      ctx.lineTo(p.x + 48, STAGE_BOT);
      ctx.closePath(); ctx.fill();
    }
    // dark red ground band
    ctx.fillStyle = RED;
    ctx.globalAlpha = 0.5;
    ctx.fillRect(0, 668, 1080, STAGE_BOT - 668);
    ctx.globalAlpha = 1;
    // the giant fairy-tale wolf, ink silhouette against the moon,
    // flipped to face left so its head looms over the figure
    drawWolf({ x: 770, groundY: 690, s: 4.6, color: INK, snarl: true, trot: null, dir: -1 });
    // the tiny red-hooded figure, under the wolf's nose
    ctx.save();
    ctx.translate(322, 690);
    ctx.fillStyle = RED;   // the hood and cloak
    ctx.beginPath();
    ctx.moveTo(0, -64);
    ctx.quadraticCurveTo(20, -44, 24, 0);
    ctx.lineTo(-24, 0);
    ctx.quadraticCurveTo(-20, -44, 0, -64);
    ctx.fill();
    ctx.fillStyle = BONE;  // face
    ctx.beginPath(); ctx.arc(2, -44, 8.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ---- banner strip ----
  function drawBanner() {
    ctx.fillStyle = BONE;
    ctx.fillRect(0, BAN_Y, 1080, BAN_H);
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '600 30px Georgia, serif';
    ctx.fillText('Els contes els han donat mala fama, pero els coneixem de veritat?', 540, BAN_Y + BAN_H / 2 + 2);
  }

  // ---- fact strip: three diagram cells, fades in as the wipe completes ----
  var FACTS = [
    { label: 'Viu en grup, mai sola' },
    { label: 'Cria els cadells amb cura' },
    { label: 'Udola per cridar la colla' }
  ];
  function drawFacts(alpha) {
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, FACT_Y, 1080, 1080 - FACT_Y);
    ctx.save();
    ctx.globalAlpha = alpha;
    // cell dividers
    ctx.strokeStyle = INK;
    ctx.globalAlpha = alpha * 0.3;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(360, FACT_Y + 18); ctx.lineTo(360, 1062);
    ctx.moveTo(720, FACT_Y + 18); ctx.lineTo(720, 1062);
    ctx.stroke();
    ctx.globalAlpha = alpha;
    // cell 1: the pack, three wolves in a row
    drawWolf({ x: 66, groundY: 952, s: 0.62, color: GREY, snarl: false, trot: null });
    drawWolf({ x: 168, groundY: 952, s: 0.62, color: GREY, snarl: false, trot: null });
    drawWolf({ x: 270, groundY: 952, s: 0.62, color: GREY, snarl: false, trot: null });
    // cell 2: an adult with two pups
    drawWolf({ x: 448, groundY: 952, s: 0.78, color: GREY, snarl: false, trot: null });
    drawWolf({ x: 596, groundY: 952, s: 0.36, color: GREY, snarl: false, trot: null });
    drawWolf({ x: 652, groundY: 952, s: 0.3, color: GREY, snarl: false, trot: null });
    // cell 3: the howl, snout raised, sound arcs
    drawWolf({ x: 806, groundY: 952, s: 0.78, color: GREY, snarl: false, trot: null, howl: true });
    ctx.strokeStyle = INK;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    var arcs = [24, 43, 62];
    for (var i = 0; i < arcs.length; i++) {
      ctx.beginPath();
      ctx.arc(950, 890, arcs[i], -0.7, 0.55);
      ctx.stroke();
    }
    // labels
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '26px Georgia, serif';
    for (i = 0; i < 3; i++) ctx.fillText(FACTS[i].label, 180 + i * 360, 1018);
    ctx.restore();
  }

  // ---- sizing (Visual Viewport API; square stage centred; page ground is the near-black) ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;
  var wipe = 0, targetWipe = 0; // 0 = lie covers the stage, 1 = truth fully revealed

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W, H);
    OX = (W - S) / 2; OY = (H - S) / 2;
    draw(simT);
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);

    // the shared stage: truth underneath, lie clipped away by the wipe
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, 1080, STAGE_BOT); ctx.clip();
    drawTruth(t);
    var wipeX = wipe * 1080;
    if (wipeX > 0.5) {
      ctx.save();
      ctx.beginPath(); ctx.rect(wipeX, 0, 1080 - wipeX, STAGE_BOT); ctx.clip();
      drawLie(t);
      ctx.restore();
      // the wipe edge
      ctx.strokeStyle = BONE;
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(wipeX, 0); ctx.lineTo(wipeX, STAGE_BOT); ctx.stroke();
      ctx.fillStyle = BONE;
      ctx.beginPath();
      ctx.moveTo(wipeX, STAGE_BOT / 2 - 16);
      ctx.lineTo(wipeX + 20, STAGE_BOT / 2);
      ctx.lineTo(wipeX, STAGE_BOT / 2 + 16);
      ctx.closePath(); ctx.fill();
    } else {
      drawLie(t);
    }
    ctx.restore();

    drawBanner();
    // facts rest dimmed, fading in over the last quarter of the wipe
    var fp = (wipe - 0.75) / 0.25;
    if (fp < 0) fp = 0; if (fp > 1) fp = 1;
    fp = fp * fp * (3 - 2 * fp);
    drawFacts(0.5 + 0.5 * fp);

    // hint, subtle, bottom-right of the stage
    ctx.fillStyle = BONE;
    ctx.globalAlpha = 0.55;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.font = (isPhone() ? '24px' : '22px') + ' Georgia, serif';
    ctx.fillText('drag', 1058, STAGE_BOT - 16);
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  // ---- drag: horizontal drag scrubs the wipe; drag-only, no tap, no reload ----
  var dragging = false;
  function pointerDesignX(e) {
    var rect = canvas.getBoundingClientRect();
    return (e.clientX - rect.left - OX) / (S / 1080);
  }
  function onDown(e) {
    dragging = true;
    targetWipe = Math.max(0, Math.min(1, pointerDesignX(e) / 1080));
  }
  function onMove(e) {
    if (!dragging) return;
    targetWipe = Math.max(0, Math.min(1, pointerDesignX(e) / 1080));
  }
  function onUp() { dragging = false; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  canvas.addEventListener('touchstart', function (e) { if (e.touches && e.touches[0]) onDown(e.touches[0]); }, { passive: true });
  canvas.addEventListener('touchmove', function (e) { if (e.touches && e.touches[0]) onMove(e.touches[0]); }, { passive: true });
  canvas.addEventListener('touchend', onUp);

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    wipe += (targetWipe - wipe) * 0.22;
    if (Math.abs(targetWipe - wipe) < 0.001) wipe = targetWipe;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
