<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maso and Miso Go Boating</title>
<style>
  html, body { margin: 0; padding: 0; background: #2a2a30; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');

  // Palette (prompt only, no other color):
  var GREY = '#b8bcc0', CHAR = '#2a2a30', TEAL = '#2e6f6a',
      IVORY = '#f2ead8', INK = '#1c1c22', GOLD = '#d9a441';

  var LOOP = 30, SEGD = 10;
  var PHRASES = ['ALL AT SEA ONCE AGAIN', 'HIDING BEHIND THE HOST', 'APPLAUSE, ON CUE'];
  var BLOCKCOL = [TEAL, GREY, GOLD];

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1469000);
  // Seeded per-segment scatter for backdrop dots (fixed, never re-rolled).
  var DOTS = [];
  for (var d = 0; d < 24; d++) { DOTS.push([rnd(), rnd()]); }

  function a4(v) { return Math.round(v * 10000) / 10000; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  var vw = 0, vh = 0, phone = false, curT = 0, L = null;

  function sizing() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    vw = (vv && vv.width) ? vv.width : window.innerWidth;
    vh = (vv && vv.height) ? vv.height : window.innerHeight;
    cv.width = vw; cv.height = vh;
    cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
    var smin = Math.min(window.screen.width, window.screen.height);
    phone = (smin < 700) || (vh > vw * 1.15);
  }

  function layout() {
    var m = phone ? 0 : Math.round(Math.min(vw, vh) * 0.03);
    var gap = Math.round(vh * 0.02);
    var tv = { x: m, y: m, w: vw - 2 * m, h: Math.round(vh * 0.64) };
    var strip = { x: m, y: tv.y + tv.h + gap, w: vw - 2 * m, h: vh - (tv.y + tv.h + gap) - m };
    var bez = Math.max(6, Math.round(Math.min(vw, vh) * 0.012));
    var scr = { x: tv.x + bez, y: tv.y + bez, w: tv.w - 2 * bez, h: tv.h - 2 * bez };
    return { tv: tv, strip: strip, scr: scr };
  }

  // --- interaction state: closed-form over recorded events, never frame state ---
  var recuts = [];    // {t, dir} dir +1 rotate left, -1 rotate right
  var applause = [];  // {t, x, y}
  var down = null;    // {x, y, inStrip, cardRect}

  function orderAt(t) {
    var o = [0, 1, 2];
    for (var i = 0; i < recuts.length; i++) {
      if (recuts[i].t > t) break;
      if (recuts[i].dir > 0) { o = [o[1], o[2], o[0]]; }
      else { o = [o[2], o[0], o[1]]; }
    }
    return o;
  }
  function loopT(t) { return (t + 2) % LOOP; } // +2s phase so frame one holds a card
  function segAt(t) {
    var lt = loopT(t);
    return { seg: orderAt(t)[Math.floor(lt / SEGD)], local: lt % SEGD, lt: lt };
  }
  function cardRect(t) {
    var s = L.scr, cw = s.w * 0.7, ch = s.h * 0.22;
    var sa = segAt(t), off = 0;
    if (sa.local < 1) { off = (1 - sa.local) * s.w * 0.6; }
    else if (sa.local >= 9) { off = -(sa.local - 9) * s.w * 0.6; }
    var cx = s.x + s.w / 2 + off, cy = s.y + s.h * 0.5;
    return { x: cx - cw / 2, y: cy - ch / 2, w: cw, h: ch, cx: cx, cy: cy };
  }

  function px(e) {
    if (typeof e.offsetX === 'number') return e.offsetX;
    return e.clientX;
  }
  function py(e) {
    if (typeof e.offsetY === 'number') return e.offsetY;
    return e.clientY;
  }

  function onDown(e) {
    var x = px(e), y = py(e), st = L.strip;
    var inStrip = (x >= st.x && x <= st.x + st.w && y >= st.y && y <= st.y + st.h);
    down = { x: x, y: y, inStrip: inStrip, card: cardRect(curT) };
  }
  function onUp(e) {
    if (!down) return;
    var x = px(e), y = py(e), dx = x - down.x, dy = y - down.y;
    if (down.inStrip && Math.abs(dx) > 60) {
      recuts.push({ t: curT, dir: dx > 0 ? 1 : -1 });
    } else if (!down.inStrip && Math.abs(dx) < 12 && Math.abs(dy) < 12) {
      var c = down.card;
      if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
        applause.push({ t: curT, x: c.cx, y: c.cy });
      }
    }
    down = null;
  }
  cv.addEventListener('pointerdown', onDown);
  cv.addEventListener('pointerup', onUp);

  function drawFigure(x, y, fw, fh, mouthH, armsUp) {
    // Abstract suited figure: charcoal body + head, grey mouth block.
    ctx.fillStyle = CHAR;
    ctx.fillRect(x, y, fw, fh);
    var r = fw * 0.32, hx = x + fw / 2, hy = y - r * 0.7;
    ctx.beginPath(); ctx.moveTo(hx + r, hy);
    ctx.arc(hx, hy, r, 0, Math.PI * 2); ctx.fill();
    if (armsUp) {
      ctx.save();
      ctx.translate(x + fw * 0.08, y + fh * 0.18); ctx.rotate(-0.6);
      ctx.fillRect(-2, -fh * 0.42, 4, fh * 0.42); ctx.restore();
      ctx.save();
      ctx.translate(x + fw * 0.92, y + fh * 0.18); ctx.rotate(0.6);
      ctx.fillRect(-2, -fh * 0.42, 4, fh * 0.42); ctx.restore();
    }
    ctx.fillStyle = GREY;
    ctx.fillRect(hx - fw * 0.15, hy - mouthH / 2, fw * 0.3, Math.max(1, mouthH));
  }

  function drawSegment(seg, t, s) {
    // Backdrop: teal studio with a grey motif per segment.
    ctx.fillStyle = TEAL;
    ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.fillStyle = GREY;
    if (seg === 0) {
      ctx.fillRect(s.x, s.y, s.w, s.h * 0.08);
      for (var i = 0; i < 8; i++) {
        ctx.fillRect(s.x + DOTS[i][0] * s.w, s.y + s.h * 0.12 + DOTS[i][1] * s.h * 0.1, 3, 3);
      }
    } else if (seg === 1) {
      ctx.fillRect(s.x, s.y, s.w * 0.08, s.h);
      ctx.fillRect(s.x + s.w * 0.92, s.y, s.w * 0.08, s.h);
    } else {
      ctx.fillRect(s.x, s.y + s.h * 0.86, s.w, s.h * 0.14);
    }
    var sa = segAt(t), close = sa.lt >= 26;
    var mouthPeriod = seg === 0 ? 1.5 : (seg === 1 ? 2 : 1);
    var mouthAmp = seg === 1 ? 5 : 3;
    var mouthH = close ? 1 : (2 + mouthAmp * (0.5 + 0.5 * Math.sin(Math.PI * 2 * t / mouthPeriod)));
    if (seg === 0) {
      var fw = s.w * 0.11, fh = s.h * 0.28, cols = 5;
      for (var r2 = 0; r2 < 2; r2++) {
        for (var c2 = 0; c2 < cols; c2++) {
          var fx = s.x + s.w * (0.08 + c2 * 0.18), fy = s.y + s.h * (0.28 + r2 * 0.38);
          drawFigure(fx, fy, fw, fh, mouthH, false);
        }
      }
    } else if (seg === 1) {
      var fw1 = s.w * 0.14, fh1 = s.h * 0.48;
      for (var c3 = 0; c3 < 4; c3++) {
        var fx1 = s.x + s.w * (0.12 + c3 * 0.22), fy1 = s.y + s.h * 0.3;
        drawFigure(fx1, fy1, fw1, fh1, mouthH, false);
      }
    } else {
      var fw2 = s.w * 0.12, fh2 = s.h * 0.28;
      for (var r4 = 0; r4 < 2; r4++) {
        for (var c4 = 0; c4 < 4; c4++) {
          var fx2 = s.x + s.w * (0.1 + c4 * 0.22), fy2 = s.y + s.h * (0.28 + r4 * 0.38);
          drawFigure(fx2, fy2, fw2, fh2, mouthH, true);
        }
      }
    }
  }

  function drawHand(x, y, sc, rot) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.beginPath(); ctx.moveTo(4 * sc, 0);
    ctx.arc(0, 0, 4 * sc, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-3 * sc, -9 * sc, 2 * sc, 5 * sc);
    ctx.fillRect(-1 * sc, -10 * sc, 2 * sc, 6 * sc);
    ctx.fillRect(1 * sc, -9 * sc, 2 * sc, 5 * sc);
    ctx.restore();
  }

  function draw(t) {
    curT = t;
    sizing();
    L = layout();
    var s = L.scr, tv = L.tv, st = L.strip;
    ctx.fillStyle = CHAR;
    ctx.fillRect(0, 0, vw, vh);
    // TV bezel + screen
    ctx.fillStyle = CHAR;
    ctx.fillRect(tv.x, tv.y, tv.w, tv.h);
    var sa = segAt(t);
    drawSegment(sa.seg, t, s);
    // Gold voice-line at the close: mouths shut, line rises left to right.
    if (sa.lt >= 26) {
      var p = (sa.lt - 26) / 4, sc = Math.min(vw, vh) / 720;
      ctx.strokeStyle = GOLD; ctx.lineWidth = Math.max(2, 3 * sc);
      ctx.beginPath();
      var steps = 24;
      for (var i = 0; i <= steps; i++) {
        var f = i / steps, lx = s.x + f * p * s.w,
            ly = s.y + s.h * 0.78 - f * p * s.h * 0.45 + Math.sin(f * 9) * s.h * 0.02;
        if (i === 0) ctx.moveTo(lx, ly); else ctx.lineTo(lx, ly);
      }
      ctx.stroke();
    }
    // Chapter card (prompt's own short phrases only).
    var cr = cardRect(t);
    ctx.fillStyle = IVORY;
    ctx.fillRect(cr.x, cr.y, cr.w, cr.h);
    ctx.fillStyle = INK;
    ctx.font = 'bold ' + Math.max(12, Math.round(Math.min(s.w, s.h) * 0.045)) + 'px Arial, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(PHRASES[sa.seg], cr.cx, cr.cy);
    // Editing strip: three segment blocks in current order.
    ctx.fillStyle = CHAR;
    ctx.fillRect(st.x, st.y, st.w, st.h);
    var ord = orderAt(t), g2 = Math.max(4, st.h * 0.16),
        bw = (st.w - 4 * g2) / 3, bh = st.h - 2 * g2;
    for (var b = 0; b < 3; b++) {
      ctx.fillStyle = BLOCKCOL[ord[b]];
      ctx.fillRect(st.x + g2 + b * (bw + g2), st.y + g2, bw, bh);
      if (ord[b] === sa.seg) {
        ctx.fillStyle = GOLD;
        ctx.fillRect(st.x + g2 + b * (bw + g2), st.y + st.h - Math.max(2, st.h * 0.07), bw, Math.max(2, st.h * 0.07));
      }
    }
    // Applause bursts: small hand shapes rippling around the tapped card.
    var sc2 = Math.min(vw, vh) / 720;
    for (var a = 0; a < applause.length; a++) {
      var age = t - applause[a].t;
      if (age < 0 || age > 1.5) continue;
      ctx.globalAlpha = a4(1 - age / 1.5);
      ctx.fillStyle = IVORY;
      var rad = (10 + age * 60) * sc2;
      for (var h = 0; h < 8; h++) {
        var ang = h * Math.PI / 4 + 0.3;
        drawHand(applause[a].x + Math.cos(ang) * rad,
                 applause[a].y + Math.sin(ang) * rad, sc2, ang + Math.PI / 2);
      }
      ctx.globalAlpha = 1;
    }
  }

  function onResize() { draw(curT); }
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', onResize);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
  }

  // Probe hooks (also used by the QA harness): draw at any time, inspect state.
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: draw,
      orderAt: orderAt,
      segAt: segAt,
      cardRect: cardRect,
      down: function (x, y) { onDown({ offsetX: x, offsetY: y }); },
      up: function (x, y) { onUp({ offsetX: x, offsetY: y }); },
      applauseCount: function () { return applause.length; },
      recutCount: function () { return recuts.length; }
    };
  }

  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') {
    var t0 = null;
    function loop(ts) {
      if (t0 === null) t0 = ts;
      draw((ts - t0) / 1000);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
