<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Standing Cutout</title>
<style>
html, body { margin: 0; padding: 0; background: #101014; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var LOOP = 120;
var SEED = 1542000;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rand = mulberry32(SEED);

// Fourth-silhouette appearances: seeded constants, same every loop.
// Slot A starts at 22 s, slot B at 76 s; edges are opposite; fade/stand
// durations come from the seeded stream. Exactly one fourth at a time.
var APPEAR = (function () {
  var firstLeft = rand() < 0.5;
  function one(t0, left) {
    var fi = 3 + rand() * 2;
    var st = 10 + rand() * 4;
    var fo = 3 + rand() * 2;
    return { t0: t0, fadeIn: fi, stand: st, fadeOut: fo, x: left ? 0.12 : 0.88 };
  }
  return [one(22, firstLeft), one(76, !firstLeft)];
})();

var HOME = [0.22, 0.50, 0.78];
var POOL_R = 0.17;
var NUDGE_MAX = 0.08;

// Pool keyframes: {t0, t1, x0, x1}. Holds sit exactly on silhouettes.
var POOL_SEG = [
  { t0: 0, t1: 10, x0: 0.04, x1: 0.22 },
  { t0: 10, t1: 16, x0: 0.22, x1: 0.22 },
  { t0: 16, t1: 26, x0: 0.22, x1: 0.50 },
  { t0: 26, t1: 32, x0: 0.50, x1: 0.50 },
  { t0: 32, t1: 42, x0: 0.50, x1: 0.78 },
  { t0: 42, t1: 48, x0: 0.78, x1: 0.78 },
  { t0: 48, t1: 56, x0: 0.78, x1: 0.96 },
  { t0: 56, t1: 60, x0: 0.96, x1: 0.96 },
  { t0: 60, t1: 68, x0: 0.96, x1: 0.78 },
  { t0: 68, t1: 74, x0: 0.78, x1: 0.78 },
  { t0: 74, t1: 84, x0: 0.78, x1: 0.50 },
  { t0: 84, t1: 90, x0: 0.50, x1: 0.50 },
  { t0: 90, t1: 100, x0: 0.50, x1: 0.22 },
  { t0: 100, t1: 106, x0: 0.22, x1: 0.22 },
  { t0: 106, t1: 114, x0: 0.22, x1: 0.04 },
  { t0: 114, t1: 120, x0: 0.04, x1: 0.04 }
];

var W = 0, H = 0;
var lastT = 0;
var offsets = [0, 0, 0];
var lightDrag = null;
var silDrag = null;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function smoothstep(a, b, x) {
  var t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}
function r4(v) { return Math.round(v * 10000) / 10000; }
function loopLocal(t) {
  var u = t % LOOP;
  if (u < 0) u += LOOP;
  return u;
}

function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  } else { vw = 720; vh = 720; }
  W = vw; H = vh;
  // Phone detection runs per the house rule; the gallery-like field is
  // full-frame on all sizes and the page ground already matches it, so
  // no separate phone layout branch is needed.
  var phone = false;
  if (typeof window !== 'undefined' && window.screen) {
    var m = Math.min(window.screen.width, window.screen.height);
    if (m < 700) phone = true;
  }
  if (!phone && H > W * 1.15) phone = true;
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}

function floorY() { return 0.75 * H; }
function silH() { return 0.46 * H; }
function headR() { return 0.045 * H; }

function poolSched(u) {
  for (var i = 0; i < POOL_SEG.length; i++) {
    var s = POOL_SEG[i];
    if (u >= s.t0 && u < s.t1) {
      if (s.x0 === s.x1) return s.x0;
      return s.x0 + (s.x1 - s.x0) * smoothstep(s.t0, s.t1, u);
    }
  }
  return 0.04;
}

function silXAt(i) {
  var x = HOME[i] + offsets[i];
  if (silDrag && silDrag.index === i) x = silDrag.x;
  return x;
}

function poolXNow() {
  if (lightDrag) return lightDrag.x;
  return poolSched(loopLocal(lastT));
}

function brightAt(poolX, silX) {
  var d = Math.abs(poolX - silX);
  return 1 - smoothstep(POOL_R * 0.55, POOL_R, d);
}

function fourthAt(u) {
  for (var i = 0; i < APPEAR.length; i++) {
    var a = APPEAR[i];
    var tEnd = a.t0 + a.fadeIn + a.stand + a.fadeOut;
    if (u >= a.t0 && u < tEnd) {
      var alpha;
      if (u < a.t0 + a.fadeIn) alpha = smoothstep(a.t0, a.t0 + a.fadeIn, u);
      else if (u < a.t0 + a.fadeIn + a.stand) alpha = 1;
      else alpha = 1 - smoothstep(a.t0 + a.fadeIn + a.stand, tEnd, u);
      return { x: a.x, alpha: alpha, index: i };
    }
  }
  return null;
}

function lerpChannel(a, b, t) { return Math.round(a + (b - a) * t); }
function silColor(bright, alpha) {
  var r = lerpChannel(74, 216, bright);
  var g = lerpChannel(69, 216, bright);
  var bl = lerpChannel(60, 216, bright);
  return 'rgba(' + r + ',' + g + ',' + bl + ',' + r4(alpha) + ')';
}

function drawSil(xPx, bright, alpha) {
  var fy = floorY();
  var hs = silH();
  var hr = headR();
  var headCy = fy - hs + hr;
  var hipY = fy - 0.20 * H;
  var torsoTop = fy - hs + 2 * hr;
  var spread = 0.035 * H;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (bright > 0) {
    // Warm edge underlay: same glyph, slightly thicker, ochre.
    ctx.strokeStyle = 'rgba(201,143,61,' + r4(bright * 0.7 * alpha) + ')';
    ctx.fillStyle = 'rgba(201,143,61,' + r4(bright * 0.7 * alpha) + ')';
    ctx.lineWidth = 0.022 * H + 3;
    ctx.beginPath();
    ctx.moveTo(xPx + hr, headCy);
    ctx.arc(xPx, headCy, hr + 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(xPx, torsoTop);
    ctx.lineTo(xPx, hipY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(xPx, hipY);
    ctx.lineTo(xPx - spread, fy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(xPx, hipY);
    ctx.lineTo(xPx + spread, fy);
    ctx.stroke();
  }
  var col = silColor(bright, alpha);
  ctx.strokeStyle = col;
  ctx.fillStyle = col;
  ctx.lineWidth = 0.022 * H;
  ctx.beginPath();
  ctx.moveTo(xPx + hr, headCy);
  ctx.arc(xPx, headCy, hr, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(xPx, torsoTop);
  ctx.lineTo(xPx, hipY);
  ctx.stroke();
  ctx.lineWidth = 0.018 * H;
  ctx.beginPath();
  ctx.moveTo(xPx, hipY);
  ctx.lineTo(xPx - spread, fy);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(xPx, hipY);
  ctx.lineTo(xPx + spread, fy);
  ctx.stroke();
}

function draw(t) {
  lastT = t;
  var u = loopLocal(t);
  var poolX = poolXNow();
  var fy = floorY();
  ctx.fillStyle = '#101014';
  ctx.fillRect(0, 0, W, H);
  // Floor line.
  ctx.strokeStyle = '#2a2622';
  ctx.lineWidth = 2;
  ctx.lineCap = 'butt';
  ctx.beginPath();
  ctx.moveTo(0, fy);
  ctx.lineTo(W, fy);
  ctx.stroke();
  // Light pool: layered flat-alpha ellipses, never a gradient.
  var poolCx = poolX * W;
  var poolCy = fy - 0.02 * H;
  var radii = [0.17, 0.13, 0.09, 0.055, 0.03];
  var alphas = [0.05, 0.08, 0.12, 0.16, 0.20];
  ctx.fillStyle = '#5a4526';
  for (var k = 0; k < radii.length; k++) {
    ctx.globalAlpha = alphas[k];
    ctx.beginPath();
    ctx.ellipse(poolCx, poolCy, radii[k] * W, radii[k] * W * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Permanent silhouettes.
  var brights = [];
  for (var i = 0; i < 3; i++) {
    var sx = silXAt(i);
    var b = brightAt(poolX, sx);
    brights.push(b);
    drawSil(sx * W, b, 1);
  }
  // Fourth silhouette, when its window is open.
  var fourth = fourthAt(u);
  if (fourth) {
    var fb = brightAt(poolX, fourth.x);
    drawSil(fourth.x * W, fb, fourth.alpha);
  }
  if (typeof window !== 'undefined') {
    window.__p142 = {
      t: t, u: u, poolX: poolX,
      silX: [silXAt(0), silXAt(1), silXAt(2)],
      bright: brights,
      fourth: fourth,
      lightDragging: !!lightDrag,
      silDragging: silDrag ? silDrag.index : -1
    };
  }
}

function toFracX(clientX) { return clientX / W; }

function onDown(e) {
  if (e && e.preventDefault) e.preventDefault();
  var px = toFracX(e.clientX);
  var py = e.clientY;
  var fy = floorY();
  var top = fy - silH() - headR() - 10;
  for (var i = 0; i < 3; i++) {
    var sx = silXAt(i);
    if (Math.abs(px - sx) < 0.07 && py >= top && py <= fy + 10) {
      silDrag = { index: i, grabX: px, base: offsets[i], x: sx };
      return;
    }
  }
  lightDrag = { x: clamp(px, 0, 1) };
}

function onMove(e) {
  if (e && e.preventDefault) e.preventDefault();
  var px = clamp(toFracX(e.clientX), 0, 1);
  if (lightDrag) {
    lightDrag.x = px;
  } else if (silDrag) {
    var home = HOME[silDrag.index];
    // base is the stored offset, so clamp the offset, then add home.
    var nx = home + clamp(silDrag.base + (px - silDrag.grabX), -NUDGE_MAX, NUDGE_MAX);
    silDrag.x = nx;
  }
}

function onUp(e) {
  if (e && e.preventDefault) e.preventDefault();
  if (silDrag) {
    offsets[silDrag.index] = silDrag.x - HOME[silDrag.index];
    silDrag = null;
  }
  if (lightDrag) lightDrag = null;
}

canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', size);
  }
  if (window.addEventListener) window.addEventListener('resize', size);
}

size();
draw(0);

var startTime = null;
function frame(ts) {
  if (startTime === null) startTime = ts;
  draw((ts - startTime) / 1000);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
