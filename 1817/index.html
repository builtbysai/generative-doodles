<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bowing Clock</title>
<style>
html, body { margin: 0; padding: 0; background: #3B3B37; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#3B3B37';
var SHADOW = '#1A1A18';
var PLATE = '#2B2B28';
var PLATE_LINE = 'rgba(232,163,61,0.55)';
var TITLE_INK = '#F2E8D8';
var HINT_INK = '#E8A33D';
var AMBER = '#E8A33D';
var AMBER_DEEP = '#C07F22';
var AMBER_PALE = '#F2C878';
var GREY_LINE = '#8A8A82';
var GREY_DARK = '#55554F';
var PERIOD = 2.0;          /* one full arm cycle: 2 s, one downstroke per cycle */
var FRAME_T = 10.7;        /* fixed phase: arm mid-downstroke, pulse ring partway out */
var RING_SPEED = 0.48 / 1.8; /* ring radius in units of S per second */
var RING_MAX = 0.48;
var RING_LIFE = 1.8;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1817);
var phaseT = FRAME_T;
/* ---- the radial ensemble: 8 instruments, fixed angles and distances ----
   Inner ring (0.24 S): bass, cimbalom, bass, hurdy wheel.
   Outer ring (0.36 S): hurdy wheel, cimbalom, bass, hurdy wheel.
   Pulse delay = distance / ring speed: inner 0.900 s, outer 1.350 s. ---- */
var INSTRUMENTS = [
  { kind: 'bass',     ang: 0,            dist: 0.24 },
  { kind: 'wheel',    ang: Math.PI / 4,   dist: 0.36 },
  { kind: 'cimbalom', ang: Math.PI / 2,   dist: 0.24 },
  { kind: 'cimbalom', ang: 3 * Math.PI / 4, dist: 0.36 },
  { kind: 'bass',     ang: Math.PI,       dist: 0.24 },
  { kind: 'bass',     ang: 5 * Math.PI / 4, dist: 0.36 },
  { kind: 'wheel',    ang: 3 * Math.PI / 2, dist: 0.24 },
  { kind: 'wheel',    ang: 7 * Math.PI / 4, dist: 0.36 }
];
/* small accent marks on the instruments; their offset shifts once per
   stroke, a deterministic function of the stroke index, never of the clock */
var ACCENTS = [];
(function () {
  var i;
  for (i = 0; i < INSTRUMENTS.length; i++) {
    ACCENTS.push({ u: 0.3 + rng() * 0.4, v: 0.3 + rng() * 0.4, r: 0.05 + rng() * 0.05 });
  }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function S() { return Math.min(VW, VH); }
function strokeIndex(t) { return Math.floor((t - 1.5) / PERIOD); }
function armAngle(t) { return 0.55 * Math.sin(TAU * t / PERIOD); }
function ringRadii(t) {
  /* rings launched at the bottom of each downstroke, t = 1.5 mod 2 s */
  var out = [], k, launch, age;
  var last = strokeIndex(t);
  for (k = last - 1; k <= last; k++) {
    launch = 1.5 + k * PERIOD;
    age = t - launch;
    if (age >= 0 && age <= RING_LIFE) out.push({ r: age * RING_SPEED, age: age });
  }
  return out;
}
function glowAt(dist, rings) {
  /* brightness peaks as a ring crosses the instrument, then fades */
  var g = 0, i, d, tail;
  for (i = 0; i < rings.length; i++) {
    d = (rings[i].r - dist) / 0.07;
    g = Math.max(g, Math.exp(-d * d) * (1 - rings[i].age / RING_LIFE * 0.35));
    /* trailing afterglow: the instrument stays lit briefly after the ring passes */
    if (rings[i].r >= dist) {
      tail = Math.max(0, 1 - (rings[i].r - dist) / 0.10) * 0.5;
      g = Math.max(g, tail);
    }
  }
  return clamp(g, 0, 1);
}
function drawBass(cx, cy, rot, s, glow) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.fillStyle = rgba(AMBER, 0.08 + 0.35 * glow);
  ctx.strokeStyle = glow > 0.4 ? rgba(AMBER_PALE, 0.55 + 0.45 * glow) : rgba(GREY_LINE, 0.85);
  ctx.lineWidth = Math.max(s * 0.03, 1);
  /* body: two lobes, a stylized bass silhouette */
  ctx.beginPath();
  ctx.ellipse(0, s * 0.10, s * 0.30, s * 0.34, 0, 0, TAU);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(0, -s * 0.28, s * 0.20, s * 0.24, 0, 0, TAU);
  ctx.fill();
  ctx.stroke();
  /* neck and scroll */
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.48);
  ctx.lineTo(0, -s * 0.60);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, -s * 0.62, s * 0.06, 0, TAU);
  ctx.stroke();
  /* sound hole accent */
  ctx.fillStyle = rgba(SHADOW, 0.75);
  ctx.beginPath();
  ctx.arc(-s * 0.10, s * 0.10, s * 0.05, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(s * 0.10, s * 0.10, s * 0.05, 0, TAU);
  ctx.fill();
  ctx.restore();
}
function drawCimbalom(cx, cy, rot, s, glow) {
  var i, x0, x1;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.fillStyle = rgba(AMBER, 0.08 + 0.35 * glow);
  ctx.strokeStyle = glow > 0.4 ? rgba(AMBER_PALE, 0.55 + 0.45 * glow) : rgba(GREY_LINE, 0.85);
  ctx.lineWidth = Math.max(s * 0.03, 1);
  /* trapezoid frame */
  ctx.beginPath();
  ctx.moveTo(-s * 0.42, -s * 0.30);
  ctx.lineTo(s * 0.42, -s * 0.30);
  ctx.lineTo(s * 0.26, s * 0.30);
  ctx.lineTo(-s * 0.26, s * 0.30);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  /* strings across the frame */
  ctx.strokeStyle = glow > 0.4 ? rgba(AMBER_PALE, 0.7) : rgba(GREY_LINE, 0.6);
  ctx.lineWidth = Math.max(s * 0.012, 0.6);
  for (i = 0; i < 5; i++) {
    x0 = -s * 0.36 + i * s * 0.18;
    x1 = -s * 0.22 + i * s * 0.11;
    ctx.beginPath();
    ctx.moveTo(x0, -s * 0.24);
    ctx.lineTo(x1, s * 0.24);
    ctx.stroke();
  }
  ctx.restore();
}
function drawWheel(cx, cy, rot, s, glow) {
  var i, a;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.fillStyle = rgba(AMBER, 0.08 + 0.35 * glow);
  ctx.strokeStyle = glow > 0.4 ? rgba(AMBER_PALE, 0.55 + 0.45 * glow) : rgba(GREY_LINE, 0.85);
  ctx.lineWidth = Math.max(s * 0.03, 1);
  /* hurdy gurdy wheel: rim, spokes, hub */
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.32, 0, TAU);
  ctx.fill();
  ctx.stroke();
  ctx.lineWidth = Math.max(s * 0.015, 0.6);
  for (i = 0; i < 6; i++) {
    a = i * TAU / 6;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * s * 0.32, Math.sin(a) * s * 0.32);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.07, 0, TAU);
  ctx.fill();
  ctx.stroke();
  /* crank arm */
  ctx.beginPath();
  ctx.moveTo(s * 0.32, 0);
  ctx.lineTo(s * 0.55, s * 0.18);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(s * 0.55, s * 0.18, s * 0.05, 0, TAU);
  ctx.stroke();
  ctx.restore();
}
function drawInstrument(inst, cx, cy, s, glow, accent) {
  var r = inst.dist * s;
  var x = cx + Math.cos(inst.ang) * r;
  var y = cy + Math.sin(inst.ang) * r;
  var rot = inst.ang + Math.PI / 2;
  /* shadow pool under each instrument */
  ctx.fillStyle = rgba(SHADOW, 0.25);
  ctx.beginPath();
  ctx.ellipse(x, y + s * 0.01, s * 0.10, s * 0.09, 0, 0, TAU);
  ctx.fill();
  /* lit halo when the pulse is on it */
  if (glow > 0.05) {
    var halo = ctx.createRadialGradient(x, y, 0, x, y, s * 0.16);
    halo.addColorStop(0, rgba(AMBER, (0.35 * glow)));
    halo.addColorStop(1, rgba(AMBER, 0));
    ctx.fillStyle = halo;
    ctx.fillRect(x - s * 0.16, y - s * 0.16, s * 0.32, s * 0.32);
  }
  if (inst.kind === 'bass') drawBass(x, y, rot, s * 0.32, glow);
  else if (inst.kind === 'cimbalom') drawCimbalom(x, y, rot, s * 0.32, glow);
  else drawWheel(x, y, rot, s * 0.32, glow);
  /* small accent dot, shifts between strokes */
  ctx.fillStyle = rgba(AMBER_PALE, 0.25 + 0.55 * glow);
  ctx.beginPath();
  ctx.arc(x + (accent.u - 0.5) * s * 0.10, y + (accent.v - 0.5) * s * 0.10, Math.max(accent.r * s * 0.20, 0.8), 0, TAU);
  ctx.fill();
}
function drawArm(cx, cy, s, t) {
  var ang = armAngle(t);
  var len = s * 0.30;
  /* pivot shadow and hub */
  ctx.fillStyle = rgba(SHADOW, 0.5);
  ctx.beginPath();
  ctx.ellipse(cx, cy + s * 0.015, s * 0.05, s * 0.035, 0, 0, TAU);
  ctx.fill();
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(ang);
  /* the bow arm: tapered rod from pivot upward, amber-lit tip */
  ctx.strokeStyle = '#EDE6D6';
  ctx.lineWidth = Math.max(s * 0.018, 1.5);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, s * 0.02);
  ctx.lineTo(0, -len);
  ctx.stroke();
  /* bow hair line beside the rod */
  ctx.strokeStyle = rgba(AMBER_PALE, 0.9);
  ctx.lineWidth = Math.max(s * 0.006, 0.7);
  ctx.beginPath();
  ctx.moveTo(s * 0.012, s * 0.02);
  ctx.lineTo(s * 0.012, -len * 0.96);
  ctx.stroke();
  /* tip */
  ctx.fillStyle = AMBER;
  ctx.beginPath();
  ctx.arc(0, -len, Math.max(s * 0.014, 1.5), 0, TAU);
  ctx.fill();
  /* frog grip near the pivot */
  ctx.fillStyle = AMBER_DEEP;
  ctx.fillRect(-s * 0.014, -s * 0.02, s * 0.028, s * 0.06);
  ctx.restore();
  /* hub */
  ctx.fillStyle = SHADOW;
  ctx.beginPath();
  ctx.arc(cx, cy, Math.max(s * 0.022, 2), 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(AMBER, 0.8);
  ctx.lineWidth = Math.max(s * 0.006, 1);
  ctx.beginPath();
  ctx.arc(cx, cy, Math.max(s * 0.022, 2), 0, TAU);
  ctx.stroke();
}
function draw() {
  size();
  var s = S();
  var cx = VW / 2, cy = VH / 2;
  var t = phaseT;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  /* stage-light wash from above, black shadow at the floor */
  var wash = ctx.createRadialGradient(cx, cy - s * 0.30, 0, cx, cy - s * 0.30, s * 0.85);
  wash.addColorStop(0, rgba(AMBER_PALE, 0.10));
  wash.addColorStop(0.6, rgba(AMBER_PALE, 0.02));
  wash.addColorStop(1, rgba(AMBER_PALE, 0));
  ctx.fillStyle = wash;
  ctx.fillRect(0, 0, VW, VH);
  var floor = ctx.createLinearGradient(0, VH - s * 0.18, 0, VH);
  floor.addColorStop(0, rgba(SHADOW, 0));
  floor.addColorStop(1, rgba(SHADOW, 0.55));
  ctx.fillStyle = floor;
  ctx.fillRect(0, VH - s * 0.18, VW, s * 0.18);
  var rings = ringRadii(t);
  var i, inst;
  /* faint guide circles for the two instrument rings */
  ctx.strokeStyle = rgba(GREY_LINE, 0.25);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, 0.24 * s, 0, TAU);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, 0.36 * s, 0, TAU);
  ctx.stroke();
  /* instruments, lit in turn as the pulse crosses them */
  var stroke = strokeIndex(t);
  for (i = 0; i < INSTRUMENTS.length; i++) {
    inst = INSTRUMENTS[i];
    var accent = {
      u: ACCENTS[i].u + 0.06 * Math.sin(stroke * 1.7 + i),
      v: ACCENTS[i].v + 0.06 * Math.cos(stroke * 1.3 + i),
      r: ACCENTS[i].r
    };
    drawInstrument(inst, cx, cy, s, glowAt(inst.dist, rings), accent);
  }
  /* pulse rings, born at the arm on each downstroke */
  for (i = 0; i < rings.length; i++) {
    var rr = rings[i].r * s;
    var fade = 1 - rings[i].age / RING_LIFE;
    ctx.strokeStyle = rgba(AMBER, (0.85 * fade));
    ctx.lineWidth = Math.max(s * 0.010, 1.2);
    ctx.beginPath();
    ctx.arc(cx, cy, rr, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = rgba(AMBER_PALE, (0.35 * fade));
    ctx.lineWidth = Math.max(s * 0.004, 0.6);
    ctx.beginPath();
    ctx.arc(cx, cy, rr * 0.985, 0, TAU);
    ctx.stroke();
  }
  drawArm(cx, cy, s, t);
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Bowing Clock').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Bowing Clock').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 02').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Bowing Clock', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 01 · 02', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    armAngle: function () { return armAngle(phaseT); },
    rings: function () { return ringRadii(phaseT); }
  };
}
/* ---- frame one: fixed phase t = 10.7 s, arm mid-downstroke ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
