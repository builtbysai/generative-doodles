<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№64 · Transparency Drift</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#050505; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(255,255,255,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to raise a color</div>
<script>
'use strict';
const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '64', 10) || 0;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
const ctx = canvas.getContext('2d');
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}
function smooth(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }

const COLORS=['#2b5fd9','#d92b3b','#f2a01e','#2cae57','#7a2fd9','#1fb3cc','#e0559a'];
function genShape(rng,idx,central){
  return {
    fx: central ? 0.32+rng()*0.36 : 0.08+rng()*0.84,
    fy: central ? 0.32+rng()*0.36 : 0.08+rng()*0.84,
    sizeFrac: 0.25+rng()*0.45,
    type: Math.floor(rng()*3),
    color: COLORS[Math.floor(rng()*COLORS.length)],
    base: 0.25+rng()*0.35,
    period: 8+rng()*6,
    phase: rng()*Math.PI*2
  };
}
function baseShapes(){
  const rng=mulberry(seed*613+99);
  const n=9+Math.floor(rng()*4);
  const out=[];
  for(let i=0;i<n;i++) out.push(genShape(rng,i,i<4));
  out.sort((a,b)=>b.sizeFrac-a.sizeFrac);
  return out;
}
const SHAPES=baseShapes();
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}
let boostIdx=-1, boostVal=0;
function drawShape(sh,w,h,t,alphaMul){
  const S=Math.min(w,h);
  const sz=sh.sizeFrac*S, x=sh.fx*w, y=sh.fy*h;
  let a=sh.base+0.12*Math.sin(t*Math.PI*2/sh.period+sh.phase);
  a=Math.max(0.15,Math.min(0.72,a));
  ctx.globalAlpha=a*alphaMul;
  ctx.fillStyle=sh.color;
  if(sh.type===0){ ctx.beginPath(); ctx.arc(x,y,sz/2,0,Math.PI*2); ctx.fill(); }
  else if(sh.type===1){ ctx.fillRect(x-sz/2,y-sz/2,sz,sz); }
  else { rrect(x-sz/2,y-sz*0.30,sz,sz*0.60,sz*0.15); ctx.fill(); }
  ctx.globalAlpha=1;
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#050505'; ctx.fillRect(0,0,w,h);
  const t=nowMs/1000;
  const cycle=Math.floor(t/25), within=t-cycle*25;
  const repIdx = SHAPES.length ? (cycle % SHAPES.length) : -1;
  for(let i=0;i<SHAPES.length;i++){
    let sh=SHAPES[i], mul=1;
    if(boostIdx===i) mul=1+boostVal*1.1;
    if(cycle>0 && i===repIdx && within<2){
      const k=smooth(within/2);
      drawShape(sh,w,h,t,(1-k)*mul);
      const rng=mulberry(seed*613+cycle*7717+i*31);
      const ns=genShape(rng,i,i<4);
      drawShape(ns,w,h,t,k*mul);
    } else {
      if(cycle>0 && i===repIdx){
        const rng=mulberry(seed*613+cycle*7717+i*31);
        sh=genShape(rng,i,i<4);
      }
      drawShape(sh,w,h,t,mul);
    }
  }
  if(boostIdx<0 && boostVal>0) boostVal=Math.max(0,boostVal-0.02);
  return {};
}
function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(5000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
function hitShape(ev){
  const [w,h]=viewportWH(); const S=Math.min(w,h);
  for(let i=SHAPES.length-1;i>=0;i--){ const sh=SHAPES[i]; const dx=ev.clientX-sh.fx*w, dy=ev.clientY-sh.fy*h; if(Math.sqrt(dx*dx+dy*dy)<sh.sizeFrac*S*0.55) return i; }
  return -1;
}
canvas.addEventListener('pointerdown',ev=>{ boostIdx=hitShape(ev); if(boostIdx>=0) boostVal=1; });
canvas.addEventListener('pointermove',ev=>{ if(boostIdx>=0){ const n=hitShape(ev); if(n>=0) boostIdx=n; } });
function end64(){ boostIdx=-1; }
canvas.addEventListener('pointerup',end64); canvas.addEventListener('pointercancel',end64);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
