<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№844 Running Out of Time</title>
<style>
  html, body { margin: 0; padding: 0; background: #2b2723; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №844 Running Out of Time, SN6 / PP1244, study #260 syd-nuku.
  // A plain interior, one elderly figure in soft window light,
  // seated, laughing or mid-gesture. Nothing staged, no props that
  // matter. Medium shot, the figure off-center, window light doing
  // all the modeling, dark ground. Almost nothing moves: breath,
  // a hand turning, a laugh arriving and leaving once per long
  // cycle. Watch-only. Presence is the mechanism.
  var GROUND = '#2b2723'; // page ground, dark warm grey

  // Fixed-phase first frame: FIRST_T = 12 s. Cycle is 120 s: breath
  // runs throughout, the hand turns slowly, and one laugh arrives
  // between t = 70 and t = 88 (ramp up 70-74, hold with a gentle
  // shake 74-84, ease away 84-88). At FIRST_T = 12 the figure is
  // mid-breath, the hand is mid-turn, and the face is at rest.
  var FIRST_T = 12;
  var CYCLE = 120;
  var SEED = 844;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32 (layout jitter only, fixed seed).
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palette: warm grey room, soft daylight, muted clothing, one
  // warm skin tone. Nothing else.
  var WALL = [94, 88, 79];        // warm grey wall
  var WALL_DARK = [66, 61, 55];   // wall in shadow, right side
  var FLOOR = [52, 47, 42];       // dark floor boards
  var FLOOR_LIT = [96, 86, 70];   // floor inside the light pool
  var LIGHT = [238, 226, 200];    // soft daylight
  var LIGHT_SOFT = [222, 208, 182];
  var FRAME = [58, 52, 46];       // window frame, dark
  var SKIN = [198, 158, 124];     // warm skin tone
  var SKIN_SHADE = [168, 126, 96];
  var SKIN_LIT = [222, 186, 152]; // skin in the window light
  var HAIR = [214, 208, 198];     // white grey hair
  var HAIR_SHADE = [178, 170, 158];
  var SWEATER = [96, 104, 110];   // muted blue grey sweater
  var SWEATER_DARK = [72, 78, 84];
  var SWEATER_LIT = [128, 134, 138];
  var TROUSERS = [58, 54, 50];    // dark trousers
  var CHAIR = [74, 60, 46];       // chair wood
  var CHAIR_DARK = [52, 42, 33];
  var INK = [232, 222, 204];      // caption, warm pale

  // A few fixed dust motes in the light, placed by the seeded PRNG.
  var MOTES = [];
  (function () {
    var rng = mulberry32(SEED * 13 + 5);
    var i;
    for (i = 0; i < 14; i++) {
      MOTES.push({
        x: 0.10 + rng() * 0.42, y: 0.14 + rng() * 0.42,
        r: 0.0016 + rng() * 0.0022, ph: rng() * 6.28
      });
    }
  })();

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Cycle -----------------------------------------------------
  // Breath: 4.5 s period, chest rises and falls. Hand: one slow
  // turn every 40 s. Laugh: envelope L, 0 at rest, 1 at full laugh,
  // ramping 70-74, holding with a gentle shake 74-84, easing away
  // 84-88. A slow weight shift, one sway per 60 s, moves the whole
  // figure a couple of pixels.
  function cycleState(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE;
    var laugh = smooth((p - 70) / 4) * (1 - smooth((p - 84) / 4));
    var shake = laugh * Math.sin(2 * Math.PI * 5 * (p - 70));
    var breath = Math.sin(2 * Math.PI * t / 4.5);
    var hand = Math.sin(2 * Math.PI * t / 40 + 1.2);
    var sway = Math.sin(2 * Math.PI * t / 60);
    return {
      p: p, laugh: laugh, shake: shake, breath: breath,
      hand: hand, sway: sway
    };
  }

  // ---- Room ------------------------------------------------------
  function drawRoom(t, cs) {
    // Wall: warm grey, lighter toward the window on the left.
    var wg = ctx.createLinearGradient(0, 0, W, 0);
    wg.addColorStop(0, rgb([112, 105, 94]));
    wg.addColorStop(0.45, rgb(WALL));
    wg.addColorStop(1, rgb(WALL_DARK));
    ctx.fillStyle = wg;
    ctx.fillRect(0, 0, W, H * 0.72);

    // Floor: dark boards below y = 0.72H.
    ctx.fillStyle = rgb(FLOOR);
    ctx.fillRect(0, H * 0.72, W, H * 0.28);
    // Board seams, faint.
    var i, by;
    ctx.strokeStyle = rgba([30, 27, 24], a4(0.5));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    for (i = 0; i < 4; i++) {
      by = H * (0.76 + i * 0.06);
      ctx.beginPath();
      ctx.moveTo(0, by);
      ctx.lineTo(W, by);
      ctx.stroke();
    }

    // Light pool on the floor, spilling from the window.
    var pg = ctx.createLinearGradient(W * 0.08, 0, W * 0.62, 0);
    pg.addColorStop(0, rgba(FLOOR_LIT, a4(0.55)));
    pg.addColorStop(1, rgba(FLOOR_LIT, 0));
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.moveTo(W * 0.06, H * 0.72);
    ctx.lineTo(W * 0.42, H * 0.72);
    ctx.lineTo(W * 0.66, H);
    ctx.lineTo(W * 0.10, H);
    ctx.closePath();
    ctx.fill();

    // Window: frame and four pale panes, left wall.
    var wx = W * 0.07, wy = H * 0.10, ww = W * 0.27, wh = H * 0.44;
    ctx.fillStyle = rgb(FRAME);
    ctx.fillRect(wx, wy, ww, wh);
    var px = wx + W * 0.012, py = wy + H * 0.014;
    var pw = (ww - W * 0.024 - W * 0.008) / 2;
    var ph = (wh - H * 0.028 - H * 0.008) / 2;
    var j;
    for (j = 0; j < 4; j++) {
      var cxp = px + (j % 2) * (pw + W * 0.008);
      var cyp = py + Math.floor(j / 2) * (ph + H * 0.008);
      var pg2 = ctx.createLinearGradient(cxp, cyp, cxp + pw, cyp + ph);
      pg2.addColorStop(0, rgb(LIGHT));
      pg2.addColorStop(1, rgb(LIGHT_SOFT));
      ctx.fillStyle = pg2;
      ctx.fillRect(cxp, cyp, pw, ph);
    }
    // Soft glow washing right from the window across the wall,
    // a radial wash so no hard edge reads as a panel.
    var gg = ctx.createRadialGradient(wx + ww * 0.5, wy + wh * 0.5, 0,
      wx + ww * 0.5, wy + wh * 0.5, W * 0.48);
    gg.addColorStop(0, rgba(LIGHT, a4(0.20)));
    gg.addColorStop(1, rgba(LIGHT, 0));
    ctx.fillStyle = gg;
    ctx.fillRect(0, 0, W, H * 0.72);

    // Dust motes drifting slowly in the light. Positions are fixed
    // by seed; only their alpha breathes faintly with the breath.
    var m, ma;
    for (m = 0; m < MOTES.length; m++) {
      ma = 0.10 + 0.06 * Math.sin(2 * Math.PI * t / 7 + MOTES[m].ph);
      ctx.fillStyle = rgba(LIGHT, a4(ma));
      ctx.beginPath();
      ctx.moveTo(MOTES[m].x * W + MOTES[m].r * W, MOTES[m].y * H);
      ctx.arc(MOTES[m].x * W, MOTES[m].y * H, MOTES[m].r * W, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Chair -----------------------------------------------------
  // A plain wooden chair, back and seat, mostly hidden behind the
  // figure. Drawn before the figure.
  function drawChair(cs) {
    var bx = W * 0.565, by = H * 0.415; // back top left
    var bw = W * 0.165, bh = H * 0.23;   // back size, mostly hidden
    var sx = W * 0.555, sy = H * 0.615; // seat top left
    var swd = W * 0.20, sh = H * 0.035;
    ctx.fillStyle = rgb(CHAIR_DARK);
    ctx.fillRect(bx, by, bw, bh);
    // Chair back slats: two pale gaps, faint.
    ctx.fillStyle = rgba(WALL, a4(0.35));
    ctx.fillRect(bx + bw * 0.10, by + bh * 0.30, bw * 0.80, H * 0.012);
    ctx.fillRect(bx + bw * 0.10, by + bh * 0.58, bw * 0.80, H * 0.012);
    // Seat.
    ctx.fillStyle = rgb(CHAIR);
    ctx.fillRect(sx, sy, swd, sh);
    // Front leg and the armrest the hand rests on.
    ctx.fillStyle = rgb(CHAIR_DARK);
    ctx.fillRect(W * 0.745, sy + sh, W * 0.014, H * 0.10);
    ctx.fillStyle = rgb(CHAIR);
    ctx.fillRect(W * 0.685, H * 0.585, W * 0.085, H * 0.016);
  }

  // ---- Figure ----------------------------------------------------
  // Seated, off-center right, in three-quarter view facing left
  // toward the window. All figure coordinates are fractions of W
  // and H so the drawing scales with the stage.
  function drawFigure(t, cs) {
    var u = W / 100; // scale unit
    var swayX = cs.sway * 1.6 * (W / 900);
    var breathY = -cs.breath * 1.8 * (W / 900); // chest rises on the in-breath
    var lx = W * 0.60 + swayX; // figure anchor, left edge of torso
    var neckX = W * 0.635 + swayX;
    var neckY = H * 0.445;

    // Soft shadow on the floor under the chair and feet.
    ctx.fillStyle = rgba([18, 15, 13], a4(0.28));
    ctx.beginPath();
    ctx.moveTo(W * 0.60 + 11 * u, H * 0.815);
    ctx.ellipse(W * 0.665, H * 0.815, 11 * u, 1.9 * u, 0, 0, Math.PI * 2);
    ctx.fill();

    // Legs: dark trousers, thigh to knee, shin down to the shoe.
    ctx.fillStyle = rgb(TROUSERS);
    // Thigh, seated, from lap to the knee at the right.
    ctx.beginPath();
    ctx.moveTo(W * 0.585, H * 0.615);
    ctx.lineTo(W * 0.735, H * 0.615);
    ctx.lineTo(W * 0.745, H * 0.665);
    ctx.lineTo(W * 0.595, H * 0.665);
    ctx.closePath();
    ctx.fill();
    // Shin, down to the floor.
    ctx.beginPath();
    ctx.moveTo(W * 0.715, H * 0.655);
    ctx.lineTo(W * 0.748, H * 0.655);
    ctx.lineTo(W * 0.742, H * 0.79);
    ctx.lineTo(W * 0.712, H * 0.79);
    ctx.closePath();
    ctx.fill();
    // Second shin, slightly behind and to the left.
    ctx.fillStyle = rgba([46, 43, 40], a4(0.95));
    ctx.beginPath();
    ctx.moveTo(W * 0.675, H * 0.655);
    ctx.lineTo(W * 0.702, H * 0.655);
    ctx.lineTo(W * 0.700, H * 0.775);
    ctx.lineTo(W * 0.672, H * 0.775);
    ctx.closePath();
    ctx.fill();
    // Shoes, dark, at the floor.
    ctx.fillStyle = rgb([38, 34, 30]);
    ctx.beginPath();
    ctx.moveTo(W * 0.712 + 5.4 * u, H * 0.79);
    ctx.ellipse(W * 0.735, H * 0.795, 3.4 * u, 1.3 * u, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(W * 0.672 + 4.6 * u, H * 0.775);
    ctx.ellipse(W * 0.690, H * 0.78, 2.8 * u, 1.1 * u, 0, 0, Math.PI * 2);
    ctx.fill();

    // Torso: muted sweater, shoulders to lap. The top edge lifts
    // with the breath; the whole torso lifts a little with the laugh.
    var lift = breathY - cs.laugh * 2.5 * (W / 900);
    ctx.save();
    ctx.translate(0, lift);
    ctx.fillStyle = rgb(SWEATER);
    ctx.beginPath();
    ctx.moveTo(lx + 0.5 * u, H * 0.475);
    ctx.bezierCurveTo(lx + 1.5 * u, H * 0.455, lx + 9.5 * u, H * 0.455, lx + 11.5 * u, H * 0.478);
    ctx.bezierCurveTo(lx + 13.5 * u, H * 0.52, lx + 14.5 * u, H * 0.575, lx + 14.8 * u, H * 0.62);
    ctx.lineTo(lx + 0.2 * u, H * 0.62);
    ctx.bezierCurveTo(lx - 0.5 * u, H * 0.575, lx - 0.8 * u, H * 0.52, lx + 0.5 * u, H * 0.475);
    ctx.closePath();
    ctx.fill();
    // Light from the window catches the left shoulder and chest.
    ctx.fillStyle = rgba(SWEATER_LIT, a4(0.5));
    ctx.beginPath();
    ctx.moveTo(lx + 0.5 * u, H * 0.475);
    ctx.bezierCurveTo(lx + 1.5 * u, H * 0.455, lx + 4.5 * u, H * 0.458, lx + 5.2 * u, H * 0.475);
    ctx.lineTo(lx + 4.6 * u, H * 0.60);
    ctx.lineTo(lx + 0.2 * u, H * 0.60);
    ctx.bezierCurveTo(lx - 0.5 * u, H * 0.55, lx - 0.6 * u, H * 0.51, lx + 0.5 * u, H * 0.475);
    ctx.closePath();
    ctx.fill();
    // Right side of the sweater falls into shadow.
    ctx.fillStyle = rgba(SWEATER_DARK, a4(0.55));
    ctx.beginPath();
    ctx.moveTo(lx + 10.5 * u, H * 0.465);
    ctx.bezierCurveTo(lx + 12.5 * u, H * 0.50, lx + 14.2 * u, H * 0.56, lx + 14.8 * u, H * 0.62);
    ctx.lineTo(lx + 11.8 * u, H * 0.62);
    ctx.bezierCurveTo(lx + 11.2 * u, H * 0.56, lx + 10.8 * u, H * 0.51, lx + 10.5 * u, H * 0.465);
    ctx.closePath();
    ctx.fill();
    // A soft fold line across the lap.
    ctx.strokeStyle = rgba(SWEATER_DARK, a4(0.6));
    ctx.lineWidth = Math.max(1, 0.35 * u);
    ctx.beginPath();
    ctx.moveTo(lx + 1.5 * u, H * 0.585);
    ctx.bezierCurveTo(lx + 5 * u, H * 0.60, lx + 9 * u, H * 0.60, lx + 13 * u, H * 0.585);
    ctx.stroke();
    ctx.restore();

    // Left arm, resting in the lap, hugging the torso.
    ctx.fillStyle = rgb(SWEATER_DARK);
    ctx.beginPath();
    ctx.moveTo(lx + 1.2 * u, H * 0.49);
    ctx.bezierCurveTo(lx + 0.2 * u, H * 0.53, lx + 0.1 * u, H * 0.575, lx + 1.4 * u, H * 0.605);
    ctx.lineTo(lx + 4.2 * u, H * 0.60);
    ctx.bezierCurveTo(lx + 2.6 * u, H * 0.565, lx + 3.4 * u, H * 0.52, lx + 4.6 * u, H * 0.50);
    ctx.closePath();
    ctx.fill();
    // Left hand, a small skin shape resting on the lap.
    ctx.fillStyle = rgb(SKIN_SHADE);
    ctx.beginPath();
    ctx.moveTo(lx + 2.2 * u, H * 0.60);
    ctx.ellipse(lx + 2.6 * u, H * 0.605, 1.7 * u, 1.1 * u, 0.35, 0, Math.PI * 2);
    ctx.fill();

    // Right arm, down to the armrest. The hand turns slowly, one
    // turn every 40 s, and opens a little with the laugh.
    var armX = lx + 12.2 * u, armY = H * 0.50;
    ctx.strokeStyle = rgb(SWEATER);
    ctx.lineWidth = 2.6 * u;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(armX, armY);
    ctx.lineTo(armX + 1.6 * u, H * 0.575);
    ctx.stroke();
    // Hand on the armrest, rotating with the slow turn.
    var hx = armX + 1.8 * u, hy = H * 0.585;
    var handAng = cs.hand * 0.45 + cs.laugh * 0.25;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(handAng);
    ctx.fillStyle = rgb(SKIN);
    ctx.beginPath();
    ctx.moveTo(1.9 * u, 0);
    ctx.ellipse(0, 0, 1.9 * u, 1.25 * u, 0, 0, Math.PI * 2);
    ctx.fill();
    // Fingers, three short strokes over the armrest edge.
    ctx.strokeStyle = rgb(SKIN_SHADE);
    ctx.lineWidth = Math.max(1, 0.45 * u);
    var f;
    for (f = 0; f < 3; f++) {
      ctx.beginPath();
      ctx.moveTo(0.4 * u + f * 0.7 * u, 0.9 * u);
      ctx.lineTo(0.4 * u + f * 0.7 * u, 1.9 * u);
      ctx.stroke();
    }
    ctx.restore();

    // Neck, wide enough to meet the head.
    ctx.fillStyle = rgb(SKIN_SHADE);
    ctx.fillRect(neckX - 1.7 * u, neckY - 1.2 * u, 3.4 * u, 2.9 * u);

    // Head, in its own group so it can tilt back and shake with
    // the laugh. Facing left, toward the window.
    var headX = neckX - 0.6 * u;
    var headY = H * 0.392;
    var headR = 5.2 * u;
    var tilt = -0.10 * cs.laugh + 0.018 * cs.shake;
    ctx.save();
    ctx.translate(headX, headY + lift * 0.4);
    ctx.rotate(tilt);
    // Face, lit from the left.
    ctx.fillStyle = rgb(SKIN);
    ctx.beginPath();
    ctx.moveTo(headR, 0);
    ctx.ellipse(0, 0, headR * 0.92, headR, 0, 0, Math.PI * 2);
    ctx.fill();
    // Lit side of the face.
    ctx.fillStyle = rgba(SKIN_LIT, a4(0.55));
    ctx.beginPath();
    ctx.moveTo(-headR * 0.92, 0);
    ctx.ellipse(-headR * 0.35, 0, headR * 0.55, headR * 0.92, 0, 0, Math.PI * 2);
    ctx.fill();
    // Hair: white grey, a cap over the crown, sweeping back.
    // It covers the top of the head down to just above the brow
    // on the lit side and further down at the back.
    ctx.fillStyle = rgb(HAIR);
    ctx.beginPath();
    ctx.moveTo(-headR * 0.98, headR * 0.12);
    ctx.bezierCurveTo(-headR * 1.02, -headR * 0.75, -headR * 0.45, -headR * 1.05, headR * 0.15, -headR * 1.02);
    ctx.bezierCurveTo(headR * 0.75, -headR * 0.98, headR * 0.98, -headR * 0.55, headR * 0.95, -headR * 0.05);
    ctx.bezierCurveTo(headR * 0.70, -headR * 0.42, headR * 0.20, -headR * 0.55, -headR * 0.30, -headR * 0.48);
    ctx.bezierCurveTo(-headR * 0.70, -headR * 0.42, -headR * 0.92, -headR * 0.18, -headR * 0.98, headR * 0.12);
    ctx.closePath();
    ctx.fill();
    // Hair shade at the back.
    ctx.fillStyle = rgba(HAIR_SHADE, a4(0.7));
    ctx.beginPath();
    ctx.moveTo(headR * 0.45, -headR * 0.92);
    ctx.bezierCurveTo(headR * 0.85, -headR * 0.70, headR * 0.98, -headR * 0.35, headR * 0.92, -headR * 0.02);
    ctx.bezierCurveTo(headR * 0.80, -headR * 0.35, headR * 0.65, -headR * 0.68, headR * 0.45, -headR * 0.92);
    ctx.closePath();
    ctx.fill();
    // Ear, small, on the right side of the head.
    ctx.fillStyle = rgb(SKIN_SHADE);
    ctx.beginPath();
    ctx.moveTo(headR * 0.88 + 0.7 * u, 0);
    ctx.ellipse(headR * 0.88, 0, 0.7 * u, 1.1 * u, 0, 0, Math.PI * 2);
    ctx.fill();
    // Closed eye, a soft downward curve that deepens with the laugh.
    ctx.strokeStyle = rgba([90, 62, 44], a4(0.75));
    ctx.lineWidth = Math.max(1, 0.32 * u);
    ctx.beginPath();
    ctx.moveTo(-headR * 0.62, -headR * 0.08);
    ctx.quadraticCurveTo(-headR * 0.38, -headR * 0.08 + (0.10 + 0.22 * cs.laugh) * headR,
      -headR * 0.14, -headR * 0.08);
    ctx.stroke();
    // Brow, faint, above the eye.
    ctx.strokeStyle = rgba(HAIR_SHADE, a4(0.8));
    ctx.lineWidth = Math.max(1, 0.28 * u);
    ctx.beginPath();
    ctx.moveTo(-headR * 0.66, -headR * 0.34);
    ctx.quadraticCurveTo(-headR * 0.38, -headR * 0.44, -headR * 0.12, -headR * 0.32);
    ctx.stroke();
    // Nose, a short soft line on the lit side.
    ctx.strokeStyle = rgba(SKIN_SHADE, a4(0.7));
    ctx.lineWidth = Math.max(1, 0.30 * u);
    ctx.beginPath();
    ctx.moveTo(-headR * 0.78, headR * 0.02);
    ctx.quadraticCurveTo(-headR * 0.95, headR * 0.18, -headR * 0.78, headR * 0.28);
    ctx.stroke();
    // Mouth: a quiet line at rest, opening into a small laugh
    // shape as the laugh arrives.
    if (cs.laugh < 0.08) {
      ctx.strokeStyle = rgba([110, 72, 52], a4(0.7));
      ctx.lineWidth = Math.max(1, 0.30 * u);
      ctx.beginPath();
      ctx.moveTo(-headR * 0.58, headR * 0.52);
      ctx.quadraticCurveTo(-headR * 0.36, headR * 0.56, -headR * 0.14, headR * 0.50);
      ctx.stroke();
    } else {
      ctx.fillStyle = rgb([96, 52, 42]);
      ctx.beginPath();
      ctx.moveTo(-headR * 0.58, headR * 0.48);
      ctx.ellipse(-headR * 0.36, headR * 0.52, 1.5 * u, (0.4 + 1.1 * cs.laugh) * u, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // Laugh lines at the eye corner, only while laughing.
    if (cs.laugh > 0.15) {
      ctx.strokeStyle = rgba([90, 62, 44], a4(0.55 * cs.laugh));
      ctx.lineWidth = Math.max(1, 0.25 * u);
      ctx.beginPath();
      ctx.moveTo(-headR * 0.68, -headR * 0.18);
      ctx.lineTo(-headR * 0.88, -headR * 0.28);
      ctx.moveTo(-headR * 0.66, -headR * 0.02);
      ctx.lineTo(-headR * 0.90, -headR * 0.06);
      ctx.stroke();
    }
    ctx.restore();

    // Collar of the sweater, a small V under the chin.
    ctx.strokeStyle = rgba(SWEATER_DARK, a4(0.8));
    ctx.lineWidth = Math.max(1, 0.4 * u);
    ctx.beginPath();
    ctx.moveTo(neckX - 2.2 * u, neckY + 1.2 * u + lift);
    ctx.lineTo(neckX, neckY + 3.0 * u + lift);
    ctx.lineTo(neckX + 2.2 * u, neckY + 1.2 * u + lift);
    ctx.stroke();
  }

  // ---- Draw ------------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var cs = cycleState(t);

    // Ground is the dark warm grey of the room.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawRoom(t, cs);
    drawChair(cs);
    drawFigure(t, cs);

    // Title plate, top left, and the hint, bottom center. Warm pale
    // stays readable over the dark room without breaking the calm.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(INK, a4(0.72));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№844 · Running Out of Time', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(INK, a4(0.52));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 04', W * 0.04, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(INK, a4(0.75));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch only.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // Watch-only: no pointer listeners. The piece is watched,
  // never driven.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece844 exposes the cycle state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece844 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      state: function (t) { return cycleState(t); },
      laugh: function (t) { return cycleState(t).laugh; },
      breath: function (t) { return cycleState(t).breath; },
      hand: function (t) { return cycleState(t).hand; },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: breath, the slow hand turn, the sway, and one
  // laugh per 120 s. Guarded so node-canvas QA (no
  // requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
