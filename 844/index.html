<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Locked Groove</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B0B0D; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict, nothing else).
  var COL = {
    black: '#0B0B0D',
    form: '#1A1A1E',
    highlight: '#2E2E34'
  };

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG (mulberry32): fixed seed, fixed data ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(844005);
  // Small fixed irregularities so the effigy is drawn, not stamped:
  // crown-arc radius wobble per segment, jaw-slit offsets.
  var CROWN_WOBBLE = [];
  for (var wi = 0; wi <= 24; wi++) CROWN_WOBBLE.push(0.97 + rng() * 0.06);
  var SLIT_OFF = [];
  for (var si = 0; si < 5; si++) SLIT_OFF.push((rng() - 0.5) * 0.012);

  // ---------- colour mixing (tones are palette-internal mixes only) ----------
  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mixHex(a, b, f) {
    var A = hexRgb(a), B = hexRgb(b), i, v, out = '#';
    for (i = 0; i < 3; i++) {
      v = Math.round(A[i] + (B[i] - A[i]) * f);
      out += ('0' + v.toString(16)).slice(-2);
    }
    return out;
  }

  // ---------- sizing: Visual Viewport API ----------
  var W = 0, H = 0, DPR = 1;
  function resize() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }
  function isPhone() {
    var s = (typeof window !== 'undefined') ? window.screen : null;
    if (s && typeof s.width === 'number' && typeof s.height === 'number') {
      return Math.min(s.width, s.height) < 700;
    }
    return H > W * 1.15;
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    window.addEventListener('resize', resize);
  }
  resize();

  // ---------- timeline ----------
  // ARC: 0..12 s, the form gathers out of the black.
  // LOCK: from 12 s on, the final 1.8 s gesture repeats forever.
  var ARC_END = 12;
  var LOCK_PERIOD = 1.8;
  // Frame one is anchored inside the arc at t = 8 s: the piece clock starts
  // there for the synchronous first draw and runs forward from it, so the
  // thumb shows the form mostly gathered with the highlight partly arrived.
  // Live visitors still get the full arc (8 s in) and then the lock.
  var T0 = 8;

  function smootherstep(x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    return x * x * x * (x * (x * 6 - 15) + 10);
  }
  // gather amount for a part whose window is [a, b] within the arc
  function gather(t, a, b) {
    if (t >= ARC_END) return 1;
    return smootherstep((t - a) / (b - a));
  }
  // locked-gesture breath: 0 -> 1 -> 0 across one 1.8 s period, pure function
  function breath(t) {
    var p = ((t - ARC_END) % LOCK_PERIOD) / LOCK_PERIOD;
    return 0.5 - 0.5 * Math.cos(p * Math.PI * 2);
  }

  // Piece state at time t: resolved colours for every part.
  function stateAt(t) {
    var locked = t >= ARC_END;
    var b = locked ? breath(t) : 0;
    // Gather windows: dome first, jaw follows, highlight arrives last.
    var gDome = gather(t, 0, 7);
    var gJaw = gather(t, 3, 10);
    var gHi = gather(t, 6, 12);
    var dome = mixHex(COL.black, COL.form, gDome);
    var jaw = mixHex(COL.black, COL.form, gJaw);
    // the highlight gathers out of the form tone (not the black), so at
    // partial gather it reads as a brightening edge, never a dark seam
    var hi = mixHex(COL.form, COL.highlight, gHi);
    var hiAlpha = 1, hiExtra = 0;
    if (locked) {
      // the breath moves through the form's tones; nothing else ever changes
      dome = mixHex(dome, COL.highlight, 0.10 * b);
      jaw = mixHex(jaw, COL.highlight, 0.06 * b);
      hiAlpha = 0.55 + 0.45 * b;
      hiExtra = 0.35 * b; // highlight stroke swells slightly at the peak
    }
    return { dome: dome, jaw: jaw, hi: hi, hiAlpha: hiAlpha, hiExtra: hiExtra };
  }

  // ---------- the effigy ----------
  // Drawn in a unit box: origin at the form's centre, u = min(W, H).
  // Parts: skull dome, crown arc, two hollow eye sockets, nose notch,
  // jaw bar with teeth slits, and the highlight edge on the crown.
  function drawEffigy(st, u) {
    var R = 0.21 * u;              // dome radius
    var domeCY = -0.06 * u;        // dome centre above the form centre
    var jawY = 0.155 * u;          // jaw bar top
    var jawW = 0.30 * u, jawH = 0.075 * u;

    // skull dome: filled circle, squared off below the jaw line
    ctx.fillStyle = st.dome;
    ctx.beginPath();
    ctx.arc(0, domeCY, R, Math.PI * 0.98, Math.PI * 2.02);
    ctx.lineTo(R * 0.92, jawY + jawH * 0.4);
    ctx.lineTo(-R * 0.92, jawY + jawH * 0.4);
    ctx.closePath();
    ctx.fill();

    // crown arc: a thick pale band following the dome's top, slightly wobbled
    ctx.strokeStyle = st.dome;
    ctx.lineWidth = 0.028 * u;
    ctx.lineCap = 'round';
    ctx.beginPath();
    var steps = 24;
    for (var i = 0; i <= steps; i++) {
      var a = Math.PI * (1.08 + 0.84 * (i / steps));
      var rr = R * 1.0 * CROWN_WOBBLE[i];
      var px = Math.cos(a) * rr, py = domeCY + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // eye sockets: hollow, carved back to the field black
    ctx.fillStyle = COL.black;
    var eyeY = domeCY + 0.045 * u, eyeDX = 0.082 * u;
    var eyeRX = 0.038 * u, eyeRY = 0.052 * u;
    ctx.beginPath();
    ctx.ellipse(-eyeDX, eyeY, eyeRX, eyeRY, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(eyeDX, eyeY, eyeRX, eyeRY, 0, 0, Math.PI * 2);
    ctx.fill();

    // nose notch: a small downward triangle of black between the sockets
    ctx.beginPath();
    ctx.moveTo(0, eyeY + 0.055 * u);
    ctx.lineTo(-0.020 * u, eyeY + 0.115 * u);
    ctx.lineTo(0.020 * u, eyeY + 0.115 * u);
    ctx.closePath();
    ctx.fill();

    // jaw bar
    ctx.fillStyle = st.jaw;
    var jx = -jawW / 2, jy = jawY;
    var jr = 0.018 * u;
    ctx.beginPath();
    ctx.moveTo(jx + jr, jy);
    ctx.lineTo(jx + jawW - jr, jy);
    ctx.arcTo(jx + jawW, jy, jx + jawW, jy + jr, jr);
    ctx.lineTo(jx + jawW, jy + jawH - jr);
    ctx.arcTo(jx + jawW, jy + jawH, jx + jawW - jr, jy + jawH, jr);
    ctx.lineTo(jx + jr, jy + jawH);
    ctx.arcTo(jx, jy + jawH, jx, jy + jawH - jr, jr);
    ctx.lineTo(jx, jy + jr);
    ctx.arcTo(jx, jy, jx + jr, jy, jr);
    ctx.closePath();
    ctx.fill();

    // teeth slits: thin bars of black across the jaw
    ctx.fillStyle = COL.black;
    for (var k = 0; k < 5; k++) {
      var tx = -jawW * 0.32 + k * jawW * 0.16 + SLIT_OFF[k] * u;
      ctx.fillRect(tx, jy + jawH * 0.18, 0.008 * u, jawH * 0.64);
    }

    // highlight edge: a short arc riding the crown's upper right,
    // the brightest thing in the piece; arrives last, pulses in the lock
    ctx.save();
    ctx.globalAlpha = st.hiAlpha;
    ctx.strokeStyle = st.hi;
    ctx.lineWidth = (0.010 + 0.006 * st.hiExtra) * u;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, domeCY, R * 1.02, Math.PI * 1.62, Math.PI * 1.94);
    ctx.stroke();
    ctx.restore();
  }

  // ---------- draw ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    ctx.fillStyle = COL.black;
    ctx.fillRect(0, 0, W, H);

    var u = Math.min(W, H);
    var st = stateAt(t);

    // the form sits low-center
    ctx.save();
    ctx.translate(W / 2, H * 0.60);
    drawEffigy(st, u);
    ctx.restore();

    // the side-4 label: a small infinity glyph, bottom-right.
    // It is a printed label, not part of the gathering form: present in full
    // from frame one, in the highlight tone, and it never changes.
    ctx.fillStyle = COL.highlight;
    ctx.font = (0.045 * u) + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('\u221E', W - 0.035 * u, H - 0.03 * u);
  }

  // ---------- piece clock (never Date.now) ----------
  var startMs = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function nowT() {
    return (typeof performance !== 'undefined' && performance.now)
      ? T0 + (performance.now() - startMs) / 1000 : T0;
  }

  draw(T0);
  function frame() {
    draw(nowT());
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
