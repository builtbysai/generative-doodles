<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Hundred Iterations, No Traits</title>
<style>
html, body { margin: 0; padding: 0; background: #EFE6D4; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#EFE6D4';
var PLATE = '#2e2418';
var PLATE_LINE = 'rgba(201,143,45,0.55)';
var TITLE_INK = '#f3ead6';
var HINT_INK = '#e8c87a';
/* Driver: soft geometric masses drift, split and rejoin so slowly
   that no shape ever settles into a type; the viewer notices only
   minutes later that everything has changed. */
var PHASE = 211.0;
var CREAM = [239, 230, 212];
var CHARCOAL = [51, 48, 43];
var RUST = [166, 73, 43];
var INDIGO = [43, 74, 140];
var SAND = [201, 143, 45];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function mix3(a, b, w) {
  return [Math.round(a[0] + (b[0] - a[0]) * w),
    Math.round(a[1] + (b[1] - a[1]) * w),
    Math.round(a[2] + (b[2] - a[2]) * w)];
}
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
/* QA hook: render-piece passes a seed as ?seed=N; in the browser the
   query is empty, so the offset is zero and frame one is fixed. */
var QA_OFFSET = 0;
try {
  if (typeof location !== 'undefined' && location.search) {
    var seedM = /seed=([0-9.]+)/.exec(location.search);
    if (seedM) QA_OFFSET = parseFloat(seedM[1]);
  }
} catch (e) { QA_OFFSET = 0; }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Periods in seconds, all 3 to 9 minutes, incommensurate by
   construction: base periods are primes and phi multiples, so no
   two cycles share a short common multiple and the composition
   never returns to a previous state inside a viewing session. */
var PERIODS = [197, 239, 311, 389, 463, 541];
var MASTER = { rust: 417, indigo: 523, sand: 359 };
function slow(t, period, phase) { return Math.sin(TAU * t / period + phase); }
/* Master palette weather: each transient colour passes through on
   its own slow sine, mostly near zero, peaking briefly. */
function masterWeights(t) {
  return {
    rust: Math.pow(Math.max(0, slow(t, MASTER.rust, 0.7)), 6),
    indigo: Math.pow(Math.max(0, slow(t, MASTER.indigo, 2.1)), 6),
    sand: Math.pow(Math.max(0, slow(t, MASTER.sand, 4.0)), 6)
  };
}
/* Fourteen masses. Each carries fixed seeded base geometry and
   phases; every live parameter is a sum of two slow sines. */
var rng = mulberry32(1676);
var BLOBS = [];
(function buildBlobs() {
  var i, r = rng;
  for (i = 0; i < 14; i++) {
    var kind = i % 4;
    var dark = (i % 3 === 0);
    BLOBS.push({
      kind: kind,
      dark: dark,
      bx: 0.12 + r() * 0.76,
      by: 0.34 + r() * 0.32,
      br: 0.045 + r() * 0.075,
      ax: (0.02 + r() * 0.035),
      ay: (0.015 + r() * 0.035),
      px1: PERIODS[i % 6], px2: PERIODS[(i + 2) % 6],
      py1: PERIODS[(i + 3) % 6], py2: PERIODS[(i + 1) % 6],
      ps1: PERIODS[(i + 4) % 6], ps2: PERIODS[(i + 5) % 6],
      pr1: PERIODS[(i + 1) % 6], pr2: PERIODS[(i + 4) % 6],
      phx1: r() * TAU, phx2: r() * TAU,
      phy1: r() * TAU, phy2: r() * TAU,
      phs1: r() * TAU, phs2: r() * TAU,
      phr1: r() * TAU, phr2: r() * TAU,
      rot0: r() * TAU,
      arc0: 0.9 + r() * 1.6,
      arcSpan: 1.1 + r() * 1.9,
      wob: 0.06 + r() * 0.10,
      seed: 1000 + i * 131,
      affRust: r(), affIndigo: r(), affSand: r(),
      depth: r()
    });
  }
})();
function blobState(b, t, S) {
  var x = b.bx + b.ax * 0.6 * slow(t, b.px1, b.phx1) + b.ax * 0.4 * slow(t, b.px2, b.phx2);
  var y = b.by + b.ay * 0.6 * slow(t, b.py1, b.phy1) + b.ay * 0.4 * slow(t, b.py2, b.phy2);
  var sc = 1 + 0.28 * slow(t, b.ps1, b.phs1) + 0.16 * slow(t, b.ps2, b.phs2);
  var rot = b.rot0 + 0.55 * slow(t, b.pr1, b.phr1) + 0.30 * slow(t, b.pr2, b.phr2);
  var w = masterWeights(t);
  var base = b.dark ? CHARCOAL : CREAM;
  var col = base;
  /* Affinities are cubed, so only the few masses strongly tuned to
     the passing colour shift with it; the rest stay cream/charcoal. */
  var eRust = w.rust * Math.pow(b.affRust, 3);
  var eIndigo = w.indigo * Math.pow(b.affIndigo, 3);
  var eSand = w.sand * Math.pow(b.affSand, 3);
  var tw = Math.max(eRust, eIndigo, eSand);
  var tc = RUST;
  if (eIndigo >= eRust && eIndigo >= eSand) tc = INDIGO;
  else if (eSand >= eRust) tc = SAND;
  if (tw > 0.02) col = mix3(base, tc, clamp(tw, 0, 0.65));
  /* Cream masses need a faint plotted outline to read against the
     cream ground; charcoal masses read on their own. */
  var edge = b.dark ? null : 'rgba(51,48,43,0.28)';
  return { x: x * VW, y: y * VH, r: Math.max(8, b.br * S * sc), rot: rot, col: col, edge: edge, depth: b.depth + 0.08 * slow(t, b.py2, b.phy2), b: b };
}
function wobbleRadius(b, k, n) {
  var rr = mulberry32(b.seed + k * 17);
  var a = rr();
  return 1 + b.wob * Math.sin(k * 2.7 + a * TAU) * 0.5 + b.wob * 0.4 * Math.sin(k * 5.1 + 1.3);
}
function polyPath(cx, cy, rad, rot, n, b, squash) {
  var i, a, rr;
  for (i = 0; i <= n; i++) {
    a = rot + (i % n) / n * TAU;
    rr = rad * wobbleRadius(b, i % n, n);
    var px = cx + Math.cos(a) * rr;
    var py = cy + Math.sin(a) * rr * squash;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}
var CUR_T = PHASE;
function drawBlob(st) {
  var b = st.b;
  ctx.fillStyle = rgb(st.col);
  ctx.strokeStyle = st.edge || rgb(st.col);
  ctx.lineWidth = 1;
  ctx.beginPath();
  if (b.kind === 0) {
    polyPath(st.x, st.y, st.r, st.rot, 12, b, 0.72);
  } else if (b.kind === 1) {
    /* Wedge: arc approximated as a jittered polygon fan. */
    var span = b.arcSpan + 0.35 * slow(CUR_T, b.pr1, b.phr1);
    var n = 10, i, a, rr;
    ctx.moveTo(st.x, st.y);
    for (i = 0; i <= n; i++) {
      a = st.rot + (i / n) * span;
      rr = st.r * wobbleRadius(b, i, n);
      ctx.lineTo(st.x + Math.cos(a) * rr, st.y + Math.sin(a) * rr * 0.85);
    }
    ctx.closePath();
  } else if (b.kind === 2) {
    /* Smudged bar: long jittered rectangle, rotated. */
    var len = st.r * 3.4, wid = st.r * 0.62;
    var ca = Math.cos(st.rot), sa = Math.sin(st.rot);
    var corners = [
      [-len / 2, -wid / 2], [len / 2, -wid / 2],
      [len / 2, wid / 2], [-len / 2, wid / 2]
    ];
    for (i = 0; i < 4; i++) {
      var jx = (wobbleRadius(b, i, 4) - 1) * st.r * 0.35;
      var jy = (wobbleRadius(b, i + 9, 4) - 1) * st.r * 0.35;
      var lx = corners[i][0] + jx, ly = corners[i][1] + jy;
      var px = st.x + lx * ca - ly * sa;
      var py = st.y + lx * sa + ly * ca;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  } else {
    /* Arc band: thick ring sector as a jittered polygon. */
    var span2 = b.arcSpan + 0.3 * slow(CUR_T, b.pr2, b.phr2);
    var n2 = 12, outer = [], inner = [];
    for (i = 0; i <= n2; i++) {
      a = st.rot + (i / n2) * span2;
      rr = st.r * wobbleRadius(b, i, n2);
      outer.push([st.x + Math.cos(a) * rr, st.y + Math.sin(a) * rr * 0.8]);
      inner.push([st.x + Math.cos(a) * rr * 0.55, st.y + Math.sin(a) * rr * 0.55 * 0.8]);
    }
    ctx.moveTo(outer[0][0], outer[0][1]);
    for (i = 1; i < outer.length; i++) ctx.lineTo(outer[i][0], outer[i][1]);
    for (i = inner.length - 1; i >= 0; i--) ctx.lineTo(inner[i][0], inner[i][1]);
    ctx.closePath();
  }
  ctx.fill();
  if (st.edge) { ctx.strokeStyle = st.edge; ctx.stroke(); }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('One Hundred Iterations, No Traits').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('One Hundred Iterations, No Traits').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 14').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('One Hundred Iterations, No Traits', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 14', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var et = t + PHASE + QA_OFFSET;
  CUR_T = et;
  var S = Math.min(VW, VH);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var states = [], i;
  for (i = 0; i < BLOBS.length; i++) states.push(blobState(BLOBS[i], et, S));
  states.sort(function (a, b) { return a.depth - b.depth; });
  for (i = 0; i < states.length; i++) drawBlob(states[i]);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); }
  };
}
/* ---- frame one: t = 0, evaluated at PHASE so the morph is
   already underway, never empty ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = 0, prevTs = null, t0 = null;
draw(0);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
