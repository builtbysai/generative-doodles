<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Silver Mine</title>
<style>
  html, body { margin: 0; padding: 0; background: #14100c; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). Never Math.random anywhere in this piece.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var SILVER = '#b9bcc0', SILVER_DK = '#8f9296', SILVER_LT = '#d3d5d8';
  var MINE = '#14100c', AMBER = '#8a5a24', CYAN = '#2b4a5e';
  var INK = '#1c1712', PAPER = '#cfd1d4';

  var W = 0, H = 0, isPhone = false, lastT = 0, started = false, startMs = 0;
  var drags = []; // {t, v} velocity impulses from vertical drags
  var dragging = false, lastY = 0;

  function sizeFromViewport() {
    var vw, vh;
    if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.width) {
      vw = visualViewport.width; vh = visualViewport.height;
    } else {
      vw = window.innerWidth; vh = window.innerHeight;
    }
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr && scr.width && scr.height) {
      isPhone = Math.min(scr.width, scr.height) < 700;
    } else {
      isPhone = H > W * 1.15;
    }
  }

  function pinCanvas() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function draw(t) {
    lastT = t;
    sizeFromViewport();
    pinCanvas();
    var stripW = isPhone ? W * 0.74 : Math.min(W * 0.46, 560);
    var stripX = (W - stripW) / 2;
    var surfaceY = H * 0.52;
    var FH = stripW * 0.60;            // frame height
    var GAP = stripW * 0.06;           // gap between frames
    var STEP = FH + GAP;
    var NFR = 6;                       // frames in one seamless cycle
    var CYCLE = NFR * STEP;

    // Feed offset: base speed plus decaying velocity impulses from drags.
    var TAU = 1.2;
    var off = 46 * t;
    for (var di = 0; di < drags.length; di++) {
      var d = drags[di];
      if (t >= d.t) off += d.v * TAU * (1 - Math.exp(-(t - d.t) / TAU));
    }

    // ---- backdrop: silver-gelatin sky above the surface line, mine below
    ctx.fillStyle = MINE; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = SILVER_DK; ctx.fillRect(0, 0, W, surfaceY);

    // ---- shaft below the surface line: timbers receding into darkness
    ctx.fillStyle = MINE; ctx.fillRect(0, surfaceY, W, H - surfaceY);
    // amber glow hugging the surface line, flat-alpha bands (no gradients)
    ctx.fillStyle = 'rgba(138,90,36,0.28)'; ctx.fillRect(0, surfaceY, W, 10);
    ctx.fillStyle = 'rgba(138,90,36,0.16)'; ctx.fillRect(0, surfaceY + 10, W, 18);
    ctx.fillStyle = 'rgba(138,90,36,0.08)'; ctx.fillRect(0, surfaceY + 28, W, 30);
    // side timbers converging slightly
    var shaftL = W * 0.16, shaftR = W * 0.84;
    ctx.fillStyle = '#241a10';
    ctx.fillRect(shaftL, surfaceY, 14, H - surfaceY);
    ctx.fillRect(shaftR - 14, surfaceY, 14, H - surfaceY);
    // cross beams, spacing growing and tone darkening with depth
    var by = surfaceY + 26, bh = 16;
    var bi = 0;
    while (by < H - 8 && bi < 14) {
      var tone = 36 - bi * 2; if (tone < 14) tone = 14;
      ctx.fillStyle = 'rgb(' + tone + ',' + Math.floor(tone * 0.78) + ',' + Math.floor(tone * 0.5) + ')';
      ctx.fillRect(shaftL, by, shaftR - shaftL, bh);
      by += bh + 22 + bi * 9; bh = Math.max(8, bh - 1); bi++;
    }
    // cyanotype shadow patches in the shaft
    ctx.fillStyle = 'rgba(43,74,94,0.35)';
    ctx.fillRect(shaftL + 20, surfaceY + 90, (shaftR - shaftL) * 0.3, 60);
    ctx.fillRect(shaftL + (shaftR - shaftL) * 0.55, surfaceY + 190, (shaftR - shaftL) * 0.28, 44);

    // ---- film strip body (above the surface line)
    ctx.fillStyle = '#191512';
    ctx.fillRect(stripX, 0, stripW, surfaceY);
    // sprocket holes along both edges
    ctx.fillStyle = '#0d0a08';
    var holeH = 10, holeW = Math.max(8, stripW * 0.045);
    for (var hy = 6; hy < surfaceY - holeH; hy += 26) {
      ctx.fillRect(stripX + 5, hy, holeW, holeH);
      ctx.fillRect(stripX + stripW - 5 - holeW, hy, holeW, holeH);
    }

    // ---- frames, feeding downward, melting at the surface line
    var meltZone = FH * 0.55;
    for (var k = 0; k < NFR; k++) {
      var yk = ((k * STEP - off) % CYCLE + CYCLE) % CYCLE - STEP;
      if (yk + FH <= 0 || yk >= surfaceY + meltZone) continue;
      var frameIdx = Math.floor((off + yk + STEP) / STEP);
      var rng = mulberry32(1382000 + frameIdx * 7919);
      var melt = 0;
      if (yk + FH > surfaceY - meltZone) {
        melt = (yk + FH - (surfaceY - meltZone)) / meltZone;
        if (melt > 1) melt = 1;
      }
      var fx = stripX + stripW * 0.09;
      var fw = stripW * 0.82;
      var squash = 1 - melt * 0.30;
      var fh = FH * squash;
      // The frame body never crosses the surface line: it dissolves AT the
      // line, and only melt drips fall below it.
      if (yk + fh > surfaceY) fh = surfaceY - yk;
      if (fh <= 0) continue;
      var alpha = 1 - melt * 0.92;
      ctx.save();
      ctx.globalAlpha = alpha < 0 ? 0 : alpha;
      // frame stock, tone varies per frame
      var tonePick = rng();
      ctx.fillStyle = tonePick < 0.33 ? SILVER : (tonePick < 0.66 ? SILVER_LT : PAPER);
      ctx.fillRect(fx, yk, fw, fh);
      ctx.fillStyle = INK;
      ctx.fillRect(fx, yk, fw, 2);
      drawScene(ctx, rng, fx, yk, fw, fh);
      // melt drips: downward displacement field at the surface line
      if (melt > 0) {
        var dripN = 9;
        for (var q = 0; q < dripN; q++) {
          var drng = mulberry32(1382000 + frameIdx * 7919 + q * 131);
          var dx = fx + drng() * fw;
          var dw = 2 + drng() * 5;
          var dl = melt * (10 + drng() * 46);
          ctx.fillStyle = 'rgba(185,188,192,0.75)';
          ctx.fillRect(dx, yk + fh, dw, dl);
        }
      }
      ctx.restore();
    }

    // ---- surface line itself
    ctx.fillStyle = AMBER; ctx.fillRect(0, surfaceY - 1, W, 2);

    // ---- one particle system crossing the boundary:
    // ore dust (amber, below) becomes film grain (silver, above) at the line
    var P = 130;
    for (var p = 0; p < P; p++) {
      var prng = mulberry32(1382000 + p * 7919 + 5000);
      var px = prng() * W;
      var spd = 22 + prng() * 44;
      var py = ((prng() * H - spd * t) % H + H) % H;
      var inStrip = px >= stripX && px <= stripX + stripW;
      if (py < surfaceY) {
        ctx.fillStyle = inStrip ? 'rgba(211,213,216,0.9)' : 'rgba(185,188,192,0.55)';
        var gs = 1 + prng() * 1.5;
        ctx.fillRect(px, py, gs, gs);
      } else {
        ctx.fillStyle = 'rgba(200,140,60,0.85)';
        var ds = 2 + prng() * 2;
        ctx.fillRect(px, py, ds, ds);
      }
    }
    // extra grain confined to the strip, rising through it
    for (var g = 0; g < 46; g++) {
      var grng = mulberry32(1382000 + g * 7919 + 9000);
      var gx = stripX + grng() * stripW;
      var gsp = 26 + grng() * 40;
      var gy = ((grng() * surfaceY - gsp * t) % surfaceY + surfaceY) % surfaceY;
      ctx.fillStyle = 'rgba(211,213,216,0.5)';
      ctx.fillRect(gx, gy, 1.5, 1.5);
    }
  }

  // Procedural mini-scene inside one frame; glyphs are drawn shapes only.
  function drawScene(c, rng, fx, fy, fw, fh) {
    var type = Math.floor(rng() * 6);
    var pad = fw * 0.08;
    var ix = fx + pad, iy = fy + fh * 0.18, iw = fw - pad * 2, ih = fh * 0.64;
    if (type === 0) {
      // ridge lines
      c.strokeStyle = INK; c.lineWidth = 2; c.beginPath();
      var rx = ix;
      c.moveTo(rx, iy + ih * 0.7);
      for (var s = 0; s <= 6; s++) {
        c.lineTo(ix + (iw * s) / 6, iy + ih * (0.25 + rng() * 0.55));
      }
      c.stroke();
      c.beginPath(); c.moveTo(ix, iy + ih * 0.85);
      for (var s2 = 0; s2 <= 6; s2++) {
        c.lineTo(ix + (iw * s2) / 6, iy + ih * (0.5 + rng() * 0.4));
      }
      c.stroke();
    } else if (type === 1) {
      // pseudo-script glyph row (never letters)
      var gx = ix;
      var glyphs = 7;
      var gw = iw / glyphs;
      for (var gi = 0; gi < glyphs; gi++) {
        drawGlyph(c, rng, gx + gi * gw + gw * 0.2, iy + ih * 0.3, gw * 0.6, ih * 0.5);
      }
    } else if (type === 2) {
      // dot grid with circle outlines (paired arcs, moveTo before each)
      var cols = 8, rows = 4;
      for (var cx = 0; cx < cols; cx++) {
        for (var cy = 0; cy < rows; cy++) {
          var ddx = ix + (iw * (cx + 0.5)) / cols;
          var ddy = iy + (ih * (cy + 0.5)) / rows;
          if (rng() < 0.5) {
            c.fillStyle = INK;
            c.fillRect(ddx - 2, ddy - 2, 4, 4);
          } else {
            c.strokeStyle = INK; c.lineWidth = 1.5; c.beginPath();
            c.moveTo(ddx + 5, ddy);
            c.arc(ddx, ddy, 5, 0, Math.PI * 2);
            c.stroke();
          }
        }
      }
    } else if (type === 3) {
      // vertical bars / ticker fragment
      var bars = 9;
      for (var b = 0; b < bars; b++) {
        var bh2 = ih * (0.2 + rng() * 0.7);
        c.fillStyle = (b % 3 === 0) ? AMBER : INK;
        c.fillRect(ix + (iw * b) / bars, iy + ih - bh2, iw / bars * 0.55, bh2);
      }
    } else if (type === 4) {
      // spiral (arc segments, each its own subpath)
      var ccx = ix + iw / 2, ccy = iy + ih / 2;
      c.strokeStyle = INK; c.lineWidth = 2;
      for (var a = 0; a < 5; a++) {
        var r = 4 + a * 5;
        c.beginPath();
        c.moveTo(ccx + r, ccy);
        c.arc(ccx, ccy, r, 0, Math.PI * 1.5);
        c.stroke();
      }
      c.fillStyle = AMBER;
      c.fillRect(ccx - 3, ccy - 3, 6, 6);
    } else {
      // flame tongues / streaks
      for (var f = 0; f < 8; f++) {
        var fx2 = ix + (iw * f) / 8;
        var fh2 = ih * (0.3 + rng() * 0.6);
        c.fillStyle = (f % 2 === 0) ? INK : CYAN;
        c.beginPath();
        c.moveTo(fx2, iy + ih);
        c.lineTo(fx2 + 4, iy + ih - fh2);
        c.lineTo(fx2 + 8, iy + ih);
        c.closePath();
        c.fill();
      }
    }
  }

  function drawGlyph(c, rng, x, y, w, h) {
    var kind = Math.floor(rng() * 5);
    c.strokeStyle = INK; c.lineWidth = 2;
    if (kind === 0) { // chevron
      c.beginPath(); c.moveTo(x, y + h * 0.7); c.lineTo(x + w / 2, y); c.lineTo(x + w, y + h * 0.7); c.stroke();
    } else if (kind === 1) { // open arc with dot
      c.beginPath(); c.moveTo(x + w, y + h * 0.5); c.arc(x + w / 2, y + h * 0.5, w / 2, 0, Math.PI); c.stroke();
      c.fillStyle = INK; c.fillRect(x + w / 2 - 1.5, y + h * 0.8, 3, 3);
    } else if (kind === 2) { // zigzag
      c.beginPath(); c.moveTo(x, y + h);
      c.lineTo(x + w * 0.25, y); c.lineTo(x + w * 0.5, y + h);
      c.lineTo(x + w * 0.75, y); c.lineTo(x + w, y + h);
      c.stroke();
    } else if (kind === 3) { // open spiral curl (never a closed ring)
      c.beginPath(); c.moveTo(x + w * 0.85, y + h * 0.4); c.arc(x + w * 0.4, y + h * 0.4, w * 0.4, 0, Math.PI * 1.5); c.stroke();
    } else { // tick pair + dots
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + w * 0.7, y + h * 0.6); c.stroke();
      c.fillStyle = INK;
      c.fillRect(x + w * 0.2, y + h * 0.8, 3, 3);
      c.fillRect(x + w * 0.6, y + h * 0.9, 3, 3);
    }
  }

  function onDown(e) {
    dragging = true; lastY = e.clientY;
  }
  function onMove(e) {
    if (!dragging) return;
    var dy = e.clientY - lastY; lastY = e.clientY;
    if (dy === 0) return;
    var v = dy * 8; if (v > 600) v = 600; if (v < -600) v = -600;
    drags.push({ t: lastT, v: v });
    if (drags.length > 60) drags.shift();
  }
  function onUp() { dragging = false; }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.addEventListener) {
    visualViewport.addEventListener('resize', function () { draw(lastT); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { draw(lastT); });
  }

  // Frame one is draw(0), synchronously, before any clock starts.
  draw(0);

  // The rAF loop is a plain function declaration behind a typeof guard.
  function loop(now) {
    if (!started) { started = true; startMs = now; }
    var t = (now - startMs) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
