<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observation 12</title>
<style>
html, body { margin: 0; padding: 0; background: #050505; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var BG = '#050505';
var LIGHT = '#E8E8E8';
var DARK = '#0A0A0A';
var RING = [60, 60, 60];
var PHASE = 30.0;
var SEED = 1619000;
var STORE_KEY = 'obs1619';
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function compRect() {
  var s = Math.min(VW, VH) * 0.96;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}

/* ---- observation state: persisted number, seeded geometry ---- */
var obs = 12;
try {
  if (typeof localStorage !== 'undefined') {
    var saved = localStorage.getItem(STORE_KEY);
    if (saved !== null) {
      var n = parseInt(saved, 10);
      if (!isNaN(n) && n >= 12) obs = n;
    }
  }
} catch (e) { obs = 12; }
function persistObs() {
  try {
    if (typeof localStorage !== 'undefined') localStorage.setItem(STORE_KEY, String(obs));
  } catch (e) {}
}
function geomFor(n) {
  var rng = mulberry32((SEED + n * 104729) >>> 0);
  return {
    large: {
      fx: 0.26 + rng() * 0.08,
      fy: 0.64 + rng() * 0.08,
      d: 0.30 + rng() * 0.05,
      baseAng: rng() * TAU,
      spacing: 0.022 + rng() * 0.008,
      phase: rng(),
      driftAmp: 0.006 + rng() * 0.008,
      driftPh: rng() * TAU
    },
    small: {
      fx: 0.66 + rng() * 0.08,
      fy: 0.26 + rng() * 0.08,
      d: 0.14 + rng() * 0.03,
      baseAng: rng() * TAU,
      spacing: 0.020 + rng() * 0.008,
      phase: rng(),
      driftAmp: 0.006 + rng() * 0.008,
      driftPh: rng() * TAU
    }
  };
}
var geom = geomFor(obs);

/* ---- discs: split half light / half dark, rotating a fraction of a degree per minute ---- */
function discCenter(d, rect, t) {
  var dx = d.driftAmp * rect.w * Math.sin(TAU * t / 900 + d.driftPh);
  var dy = d.driftAmp * rect.h * Math.cos(TAU * t / 750 + d.driftPh);
  return { x: rect.x + d.fx * rect.w + dx, y: rect.y + d.fy * rect.h + dy };
}
function drawDisc(d, rect, t) {
  var c = discCenter(d, rect, t);
  var r = (d.d * rect.w) / 2;
  var ang = d.baseAng + t * (0.4 * Math.PI / 180 / 60);
  ctx.beginPath();
  ctx.moveTo(c.x, c.y);
  ctx.arc(c.x, c.y, r, ang, ang + Math.PI);
  ctx.closePath();
  ctx.fillStyle = LIGHT;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(c.x, c.y);
  ctx.arc(c.x, c.y, r, ang + Math.PI, ang + TAU);
  ctx.closePath();
  ctx.fillStyle = DARK;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(c.x + r, c.y);
  ctx.arc(c.x, c.y, r, 0, TAU);
  ctx.strokeStyle = rgba(RING, 0.55);
  ctx.lineWidth = Math.max(1, 0.0015 * rect.w);
  ctx.stroke();
}

/* ---- rings: expanding stroked circles, alpha falloff with radius ---- */
function drawRings(d, rect, t) {
  var c = discCenter(d, rect, t);
  var spacing = d.spacing * rect.w;
  var rMax = rect.w * 1.55;
  var speed = spacing / 45;
  var count = Math.floor(rMax / spacing);
  var lw = Math.max(1, 0.0012 * rect.w);
  ctx.lineWidth = lw;
  var i, r, a;
  for (i = 0; i < count; i++) {
    r = ((d.phase * spacing + speed * t + i * spacing) % rMax);
    if (r < 1) continue;
    a = 0.5 * Math.pow(1 - r / rMax, 2);
    if (a < 0.01) continue;
    ctx.beginPath();
    ctx.moveTo(c.x + r, c.y);
    ctx.arc(c.x, c.y, r, 0, TAU);
    ctx.strokeStyle = rgba(RING, a);
    ctx.stroke();
  }
}

var downX = 0, downY = 0;
function onDown(e) {
  downX = (typeof e.clientX === 'number') ? e.clientX : 0;
  downY = (typeof e.clientY === 'number') ? e.clientY : 0;
}
function onUp(e) {
  var x = (typeof e.clientX === 'number') ? e.clientX : 0;
  var y = (typeof e.clientY === 'number') ? e.clientY : 0;
  var dx = x - downX, dy = y - downY;
  if (dx * dx + dy * dy > 144) return;
  obs += 1;
  geom = geomFor(obs);
  persistObs();
  draw(lastT);
}
function draw(t) {
  lastT = t;
  size();
  var rect = compRect();
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, VW, VH);
  drawRings(geom.large, rect, t);
  drawRings(geom.small, rect, t);
  drawDisc(geom.large, rect, t);
  drawDisc(geom.small, rect, t);
  var titlePx = isPhone ? 14 : 15;
  var smallPx = isPhone ? 11 : 12;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = rgba([232, 232, 232], 0.75);
  ctx.fillText('Observation ' + obs, rect.x + rect.w / 2, rect.y + Math.max(8, 0.02 * rect.h));
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba([232, 232, 232], 0.45);
  ctx.fillText('2006 · 06 · 18', rect.x + rect.w / 2, rect.y + Math.max(8, 0.02 * rect.h) + titlePx + 5);
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.font = 'bold ' + Math.max(15, 0.022 * rect.w) + 'px monospace';
  ctx.fillStyle = rgba([232, 232, 232], 0.85);
  ctx.fillText(String(obs), rect.x + rect.w - Math.max(10, 0.02 * rect.w), rect.y + rect.h - Math.max(10, 0.02 * rect.h));
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba([232, 232, 232], 0.55);
  ctx.fillText('Tap for the next observation.', rect.x + rect.w / 2, rect.y + rect.h - Math.max(10, 0.02 * rect.h));
}
if (typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointerup', onUp);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
