<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headcount</title>
<style>
  html, body { margin: 0; padding: 0; background: #F5E9C8; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var GROUND = '#F5E9C8';
var SUIT = '#14141C';
var SHIRT = '#F7F2E4';
var SKIN_SETS = [
  ['#F2B28C', '#E88E6E', '#E91E63'],
  ['#E91E63', '#F2B28C', '#E88E6E'],
  ['#E88E6E', '#E91E63', '#F2B28C']
];

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

var SEED = 45913;
var MAX_HEADS = 12;
var START_HEADS = 6;
var T0 = 14.0;              // fixed pre-roll offset: frame one is always drawn at this phase
var STEP = 1 / 60;

var variant = 0;
var heads = [];
var simTime = 0;

function makeHead(i, rng) {
  return {
    phase: rng() * Math.PI * 2,
    amp: 0.10 + rng() * 0.11,
    lenJit: 0.90 + rng() * 0.20,
    sway: 0,
    swayV: 0
  };
}

function buildHeads(n, seed) {
  var rng = mulberry32(seed);
  heads = [];
  for (var i = 0; i < n; i++) heads.push(makeHead(i, rng));
}

function fanAngle(i, n) {
  if (n <= 1) return 0;
  var half = Math.min(1.45, 0.30 * n);
  return -half + (2 * half * i) / (n - 1);
}

function sharedNoise(t) {
  return Math.sin(t * 0.60) * 0.55 + Math.sin(t * 0.171 + 1.3) * 0.45;
}

function stepSprings(dt) {
  simTime += dt;
  for (var i = 0; i < heads.length; i++) {
    var hd = heads[i];
    var target = sharedNoise(simTime + hd.phase) * hd.amp;
    var acc = (target - hd.sway) * 10.0 - hd.swayV * 3.4;
    hd.swayV += acc * dt;
    hd.sway += hd.swayV * dt;
  }
}

// Pre-roll the springs at a fixed step so the first frame is fully developed
// and identical on every load and every render.
buildHeads(START_HEADS, SEED);
while (simTime < T0) stepSprings(STEP);

function viewSize() {
  var w = 0, h = 0;
  if (window.visualViewport && window.visualViewport.width) {
    w = window.visualViewport.width; h = window.visualViewport.height;
  } else {
    w = window.innerWidth; h = window.innerHeight;
  }
  return [Math.round(w) || canvas.width, Math.round(h) || canvas.height];
}

function isPhone(w, h) {
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var mn = Math.min(sw, sh);
  if (mn > 0) return mn < 700;
  return h > w * 1.15;
}

function resize() {
  var s = viewSize();
  if (canvas.width !== s[0]) canvas.width = s[0];
  if (canvas.height !== s[1]) canvas.height = s[1];
  draw();
}

function drawHead(cx, cy, ang, rx, ry, color, u) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(ang);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  // two dot eyes, neutral
  ctx.fillStyle = SUIT;
  ctx.beginPath();
  ctx.arc(-rx * 0.38, -ry * 0.14, Math.max(1.4, u * 0.013), 0, Math.PI * 2);
  ctx.arc(rx * 0.38, -ry * 0.14, Math.max(1.4, u * 0.013), 0, Math.PI * 2);
  ctx.fill();
  // neutral straight mouth
  ctx.strokeStyle = SUIT;
  ctx.lineWidth = Math.max(1.2, u * 0.011);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-rx * 0.30, ry * 0.34);
  ctx.lineTo(rx * 0.30, ry * 0.34);
  ctx.stroke();
  ctx.restore();
}

function draw() {
  var w = canvas.width, h = canvas.height;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  var phone = isPhone(w, h);

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  // Figure metrics. Centered composition: shape is kept at every size.
  // Height comes from the frame height but is capped by the frame width so
  // the near-horizontal outer heads of the fan can never clip on phones.
  var u = Math.min(w, h);
  var H = Math.min(h * 0.78, w * 1.30);
  var cx = w / 2;
  var feetY = h / 2 + H * 0.47;
  var hipY = feetY - H * 0.34;
  var neckY = feetY - H * 0.64;
  var neckX = cx;

  var skins = SKIN_SETS[variant];
  var n = heads.length;
  var stalkLen = H * 0.20;
  var headRx = H * 0.062;
  var headRy = H * 0.100;

  var i, hd, ang, dirx, diry, hx, hy;

  // soft ground shadow in the suit colour, very light
  ctx.fillStyle = 'rgba(20,20,28,0.08)';
  ctx.beginPath();
  ctx.ellipse(cx, feetY + H * 0.012, H * 0.17, H * 0.020, 0, 0, Math.PI * 2);
  ctx.fill();

  // stalks first, so the torso covers their bases at the neck
  ctx.lineCap = 'round';
  for (i = 0; i < n; i++) {
    hd = heads[i];
    ang = fanAngle(i, n) + hd.sway;
    dirx = Math.sin(ang); diry = -Math.cos(ang);
    hx = neckX + dirx * stalkLen * hd.lenJit;
    hy = neckY + diry * stalkLen * hd.lenJit;
    ctx.strokeStyle = skins[i % 3];
    ctx.lineWidth = H * 0.034;
    ctx.beginPath();
    ctx.moveTo(neckX, neckY);
    ctx.quadraticCurveTo(
      neckX + dirx * stalkLen * 0.5 - diry * hd.sway * H * 0.10,
      neckY + diry * stalkLen * 0.5 + dirx * hd.sway * H * 0.10,
      hx, hy
    );
    ctx.stroke();
  }

  // legs (suit)
  ctx.fillStyle = SUIT;
  var legW = H * 0.072;
  var legGap = H * 0.016;
  ctx.beginPath();
  ctx.moveTo(cx - legGap / 2 - legW, hipY);
  ctx.lineTo(cx - legGap / 2, hipY);
  ctx.lineTo(cx - legGap / 2 - legW * 0.16, feetY);
  ctx.lineTo(cx - legGap / 2 - legW * 0.84, feetY);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + legGap / 2, hipY);
  ctx.lineTo(cx + legGap / 2 + legW, hipY);
  ctx.lineTo(cx + legGap / 2 + legW * 0.84, feetY);
  ctx.lineTo(cx + legGap / 2 + legW * 0.16, feetY);
  ctx.closePath();
  ctx.fill();
  // shoes
  ctx.beginPath();
  ctx.ellipse(cx - legGap / 2 - legW * 0.5, feetY, legW * 0.62, H * 0.016, 0, 0, Math.PI * 2);
  ctx.ellipse(cx + legGap / 2 + legW * 0.5, feetY, legW * 0.62, H * 0.016, 0, 0, Math.PI * 2);
  ctx.fill();

  // arms (suit), hanging at the sides with a sliver of ground between arm
  // and torso so the silhouette reads as arms, not one block
  var armW = H * 0.046;
  var shoulderY = neckY + H * 0.035;
  var handY = hipY + H * 0.085;
  ctx.beginPath();
  ctx.moveTo(cx - H * 0.142, shoulderY);
  ctx.lineTo(cx - H * 0.142 + armW, shoulderY);
  ctx.lineTo(cx - H * 0.158 + armW, handY);
  ctx.lineTo(cx - H * 0.160, handY);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + H * 0.142 - armW, shoulderY);
  ctx.lineTo(cx + H * 0.142, shoulderY);
  ctx.lineTo(cx + H * 0.160, handY);
  ctx.lineTo(cx + H * 0.158 - armW, handY);
  ctx.closePath();
  ctx.fill();
  // hands in the middle skin tone
  ctx.fillStyle = skins[1];
  ctx.beginPath();
  ctx.ellipse(cx - H * 0.158 + armW / 2, handY + H * 0.014, armW * 0.42, H * 0.020, 0, 0, Math.PI * 2);
  ctx.ellipse(cx + H * 0.158 - armW / 2, handY + H * 0.014, armW * 0.42, H * 0.020, 0, 0, Math.PI * 2);
  ctx.fill();

  // torso jacket (suit), tapered trapezoid
  ctx.fillStyle = SUIT;
  ctx.beginPath();
  ctx.moveTo(cx - H * 0.132, neckY + H * 0.020);
  ctx.lineTo(cx + H * 0.132, neckY + H * 0.020);
  ctx.lineTo(cx + H * 0.108, hipY + H * 0.012);
  ctx.lineTo(cx - H * 0.108, hipY + H * 0.012);
  ctx.closePath();
  ctx.fill();

  // shirt triangle
  ctx.fillStyle = SHIRT;
  ctx.beginPath();
  ctx.moveTo(cx - H * 0.040, neckY + H * 0.020);
  ctx.lineTo(cx + H * 0.040, neckY + H * 0.020);
  ctx.lineTo(cx, neckY + H * 0.150);
  ctx.closePath();
  ctx.fill();

  // tie (magenta from the palette): knot and blade
  ctx.fillStyle = '#E91E63';
  ctx.beginPath();
  ctx.moveTo(cx - H * 0.013, neckY + H * 0.018);
  ctx.lineTo(cx + H * 0.013, neckY + H * 0.018);
  ctx.lineTo(cx + H * 0.008, neckY + H * 0.052);
  ctx.lineTo(cx - H * 0.008, neckY + H * 0.052);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx - H * 0.009, neckY + H * 0.052);
  ctx.lineTo(cx + H * 0.009, neckY + H * 0.052);
  ctx.lineTo(cx + H * 0.014, neckY + H * 0.150);
  ctx.lineTo(cx, neckY + H * 0.168);
  ctx.lineTo(cx - H * 0.014, neckY + H * 0.150);
  ctx.closePath();
  ctx.fill();

  // neck stub in the first skin tone, base of the fan
  ctx.fillStyle = skins[0];
  ctx.fillRect(cx - H * 0.020, neckY - H * 0.006, H * 0.040, H * 0.034);

  // heads on top
  for (i = 0; i < n; i++) {
    hd = heads[i];
    ang = fanAngle(i, n) + hd.sway;
    dirx = Math.sin(ang); diry = -Math.cos(ang);
    hx = neckX + dirx * (stalkLen * hd.lenJit + headRy * 0.72);
    hy = neckY + diry * (stalkLen * hd.lenJit + headRy * 0.72);
    drawHead(hx, hy, ang, headRx, headRy, skins[i % 3], u);
  }

  // hint
  ctx.fillStyle = 'rgba(232,142,110,0.65)';
  ctx.font = '600 ' + Math.max(13, Math.round(u * 0.020)) + 'px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('drag', Math.round(u * 0.022), h - Math.round(u * 0.020));
}

// Interaction: each completed drag stroke sprouts one more head (max 12).
// A quick double tap reseeds the head count and rotates the palette variant.
var pDown = null;
var pMoved = false;
var lastTapAt = 0;

function sprout() {
  if (heads.length >= MAX_HEADS) return;
  var rng = mulberry32(SEED + heads.length * 977 + variant * 131);
  var hd = makeHead(heads.length, rng);
  hd.sway = sharedNoise(simTime + hd.phase) * hd.amp;
  hd.swayV = 0;
  heads.push(hd);
  draw();
}

function reseed() {
  variant = (variant + 1) % SKIN_SETS.length;
  var count = 4 + Math.floor(Math.random() * 6); // 4..9
  buildHeads(count, SEED + variant * 7919 + Math.floor(Math.random() * 100000));
  // settle the new springs to the current noise so the reseed lands developed
  for (var i = 0; i < heads.length; i++) {
    heads[i].sway = sharedNoise(simTime + heads[i].phase) * heads[i].amp;
    heads[i].swayV = 0;
  }
  draw();
}

function evtPos(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var x = (e.clientX || 0) - r.left;
  var y = (e.clientY || 0) - r.top;
  return [x, y];
}

canvas.addEventListener('pointerdown', function (e) {
  pDown = evtPos(e);
  pMoved = false;
});
canvas.addEventListener('pointermove', function (e) {
  if (!pDown) return;
  var p = evtPos(e);
  if (Math.abs(p[0] - pDown[0]) + Math.abs(p[1] - pDown[1]) > 10) pMoved = true;
});
canvas.addEventListener('pointerup', function (e) {
  if (pDown && pMoved) {
    sprout();
  } else {
    var now = Date.now();
    if (now - lastTapAt < 350) { reseed(); lastTapAt = 0; }
    else lastTapAt = now;
  }
  pDown = null;
  pMoved = false;
});
canvas.addEventListener('dblclick', function () { reseed(); });

if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
window.addEventListener('resize', resize);

resize();
draw();

// Motion loop: anchored as the fixed pre-roll offset plus elapsed since load.
if (typeof requestAnimationFrame === 'function') {
  var startStamp = Date.now();
  var tick = function () {
    var target = T0 + (Date.now() - startStamp) / 1000;
    while (simTime < target) stepSprings(STEP);
    draw();
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
