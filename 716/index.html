<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licked, Lathered</title>
<style>
  html, body { margin: 0; padding: 0; background: #0C0C0E; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// Licked, Lathered (EXPANSION #87 janine-antoni, block 5)
// Fourteen abstract busts in two facing rows of seven: chocolate on the
// left, soap on the right. The chocolate heads erode locally, smoothed
// where a wandering tongue-point travels; the soap heads erode uniformly,
// washed down as a whole. No two heads ever reach the same state.

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var COL = {
  choc: '#4A2C1A',
  soap: '#DDE3E0',
  ped: '#141416',
  bg: '#0C0C0E',
  sheen: '#9FB8C0'
};

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, isPhone = false;
var curT = 0;

var CYCLE = 120;        // full erosion / re-form loop, seconds
var ERODE_END = 86;     // erosion phase length inside the cycle
var HOLD_END = 98;      // nubs hold until here, then re-form

// Bust silhouette profile: control points [v, halfWidth] with v = 0 at the
// base, 1 at the crown. Wide base flare, shoulders, a neck pinch, the head
// swell, then the crown closing to a point.
var PROFILE = [
  [0.00, 0.88], [0.10, 1.00], [0.22, 0.95], [0.36, 0.64],
  [0.46, 0.53], [0.58, 0.66], [0.72, 0.75], [0.86, 0.63], [1.00, 0.02]
];

// Interpolated profile width and per-head wobble at height v, both eased
// with the same cosine blend so the outline stays smooth.
function profileAt(v, wob) {
  if (v <= 0) return PROFILE[0][1] * (wob ? wob[0] : 1);
  for (var i = 1; i < PROFILE.length; i++) {
    if (v <= PROFILE[i][0]) {
      var v0 = PROFILE[i - 1][0], v1 = PROFILE[i][0];
      var w0 = PROFILE[i - 1][1], w1 = PROFILE[i][1];
      var u = (v - v0) / (v1 - v0);
      var s = 0.5 - 0.5 * Math.cos(u * Math.PI);
      var w = w0 + (w1 - w0) * s;
      if (wob) w *= wob[i - 1] + (wob[i] - wob[i - 1]) * s;
      return w;
    }
  }
  return 0.02;
}

// ---------------------------------------------------------------------------
// Heads: 14, seeded once. side 0 = chocolate (left), side 1 = soap (right).
// ---------------------------------------------------------------------------
var HEADS = [];
(function buildHeads() {
  var rng = mulberry32(716087);
  for (var side = 0; side < 2; side++) {
    for (var i = 0; i < 7; i++) {
      var wob = [];
      for (var k = 0; k < PROFILE.length; k++) wob.push(0.92 + rng() * 0.16);
      HEADS.push({
        side: side,
        idx: i,
        rate: 0.80 + rng() * 0.50,          // erosion pace, unique per head
        wob: wob,
        wScale: 0.93 + rng() * 0.14,
        hScale: 0.94 + rng() * 0.12,
        tongueV: rng() * Math.PI * 2,        // tongue-point wander phases
        tongueSide: rng() * Math.PI * 2,
        tongueSpeed: 0.10 + rng() * 0.07,
        sheenPhase: rng() * Math.PI * 2,
        contacts: []                          // recorded drag-contact intervals
      });
    }
  }
})();

function headAt(side, idx) { return HEADS[side * 7 + idx]; }

// ---------------------------------------------------------------------------
// Recorded interaction. Everything below is a pure function of these logs
// plus the anchored clock, so any frame can be redrawn exactly.
// ---------------------------------------------------------------------------
var washes = [];        // {row, t} tap wash passes
var openContact = null; // {head, since}
var pointer = { down: false, x: 0, y: 0, downT: 0, downX: 0, downY: 0, moved: 0 };

function contactBonus(head, t) {
  var b = 0, i, iv;
  for (i = 0; i < head.contacts.length; i++) {
    iv = head.contacts[i];
    if (t > iv[0]) b += Math.max(0, Math.min(iv[1], t) - iv[0]);
  }
  if (openContact && openContact.head === head && t > openContact.since) {
    b += t - openContact.since;
  }
  return b;
}

function washBonus(head, t) {
  var b = 0;
  for (var i = 0; i < washes.length; i++) {
    if (washes[i].row === head.side && t >= washes[i].t) b += 10;
  }
  return b;
}

function rowSheenAlpha(row, t) {
  var a = 0;
  for (var i = 0; i < washes.length; i++) {
    if (washes[i].row !== row) continue;
    var dt = t - washes[i].t;
    if (dt >= 0 && dt < 1.4) a = Math.max(a, 0.30 * (1 - dt / 1.4));
  }
  return a;
}

// Effective erosion clock for a head: cycle time, pushed forward by drag
// contact (x2 while touched) and by wash bursts on its row.
function effTime(head, t) {
  return t + 2 * contactBonus(head, t) + washBonus(head, t);
}

function erosion(head, t) {
  var te = effTime(head, t);
  var ph = te % CYCLE;
  if (ph < 0) ph += CYCLE;
  var eFull = Math.min(1, head.rate * 1.3);
  var e;
  if (ph < ERODE_END) {
    var u = ph / ERODE_END;
    e = eFull * (u * u * (3 - 2 * u));
  } else if (ph < HOLD_END) {
    e = eFull;
  } else {
    var r = (ph - HOLD_END) / (CYCLE - HOLD_END);
    e = eFull * (1 - (r * r * (3 - 2 * r)));
  }
  return { e: e, te: te };
}

// ---------------------------------------------------------------------------
// Layout
// ---------------------------------------------------------------------------
function layout() {
  var top = H * 0.045, bottom = H * 0.955;
  var slotH = (bottom - top) / 7;
  var headH = slotH * 0.70;
  var headW = Math.min(slotH * 0.80, W * (isPhone ? 0.26 : 0.21));
  var cxL = W * (isPhone ? 0.285 : 0.315);
  var cxR = W * (isPhone ? 0.715 : 0.685);
  return { top: top, slotH: slotH, headH: headH, headW: headW, cxL: cxL, cxR: cxR };
}

function headGeom(head, L) {
  var cx = head.side === 0 ? L.cxL : L.cxR;
  var slotTop = L.top + L.slotH * head.idx;
  var baseY = slotTop + L.slotH * 0.80;
  return {
    cx: cx,
    baseY: baseY,
    slotTop: slotTop,
    slotBot: slotTop + L.slotH,
    headH: L.headH * head.hScale,
    maxHalf: (L.headW * head.wScale) / 2,
    lean: (head.side === 0 ? 1 : -1) * L.headW * 0.055
  };
}

function headHit(head, L, x, y) {
  var g = headGeom(head, L);
  return Math.abs(x - g.cx) < g.maxHalf * 1.5 &&
         y > g.baseY - g.headH * 1.15 && y < g.baseY + 4;
}

// Silhouette path for one head at erosion state e (te = effective time).
function headPath(head, g, e, te) {
  var N = 30, i, v, hw, x, y;
  var isChoc = head.side === 0;
  var wS, hS, tv = 0, sideSign = 1, dentDepth = 0;
  if (isChoc) {
    wS = 1 - 0.35 * e;
    hS = 1 - 0.30 * e;
    tv = 0.52 + 0.36 * Math.sin(te * head.tongueSpeed + head.tongueV);
    sideSign = Math.sin(te * 0.045 + head.tongueSide) >= 0 ? 1 : -1;
    dentDepth = e * 0.55;
  } else {
    var s = 1 - 0.78 * e;
    wS = s; hS = s;
  }
  ctx.beginPath();
  // left side, base to crown
  for (i = 0; i <= N; i++) {
    v = i / N;
    hw = profileAt(v, head.wob);
    if (isChoc && dentDepth > 0) {
      var d = dentDepth * Math.exp(-((v - tv) * (v - tv)) / (2 * 0.09 * 0.09));
      hw *= 1 - (sideSign < 0 ? d : 0.30 * d);
    }
    x = g.cx + g.lean * Math.pow(v, 1.5) - hw * g.maxHalf * wS;
    y = g.baseY - v * g.headH * hS;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  // right side, crown to base
  for (i = N; i >= 0; i--) {
    v = i / N;
    hw = profileAt(v, head.wob);
    if (isChoc && dentDepth > 0) {
      var d2 = dentDepth * Math.exp(-((v - tv) * (v - tv)) / (2 * 0.09 * 0.09));
      hw *= 1 - (sideSign > 0 ? d2 : 0.30 * d2);
    }
    x = g.cx + g.lean * Math.pow(v, 1.5) + hw * g.maxHalf * wS;
    y = g.baseY - v * g.headH * hS;
    ctx.lineTo(x, y);
  }
  ctx.closePath();
}

function drawPedestal(g) {
  ctx.fillStyle = COL.ped;
  // cap under the bust
  ctx.fillRect(g.cx - g.maxHalf * 0.78, g.baseY + 2, g.maxHalf * 1.56, 3);
  // post
  ctx.fillRect(g.cx - 2, g.baseY + 5, 4, Math.max(0, g.slotBot - 8 - (g.baseY + 5)));
  // plinth
  ctx.fillRect(g.cx - g.maxHalf * 0.55, g.slotBot - 6, g.maxHalf * 1.10, 3);
}

function draw(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, W, H);
  var L = layout();
  var i, head, g, st;
  for (i = 0; i < HEADS.length; i++) {
    head = HEADS[i];
    drawPedestal(headGeom(head, L));
  }
  for (i = 0; i < HEADS.length; i++) {
    head = HEADS[i];
    g = headGeom(head, L);
    st = erosion(head, t);
    headPath(head, g, st.e, st.te);
    ctx.fillStyle = head.side === 0 ? COL.choc : COL.soap;
    ctx.fill();
    // sheen: soap heads get occasional faint wash passes; a tap wash
    // sweeps the whole row. Chocolate never sheens.
    var a = 0;
    if (head.side === 1) {
      var p = Math.max(0, Math.sin(st.te * 0.5 + head.sheenPhase));
      a = Math.pow(p, 6) * 0.30;
    }
    a = Math.max(a, rowSheenAlpha(head.side, t));
    if (a > 0.004) {
      headPath(head, g, st.e, st.te);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = COL.sheen;
      ctx.fill();
      ctx.restore();
    }
  }
}

// ---------------------------------------------------------------------------
// Pointer: drag contact accelerates the touched head; a quick tap sends a
// wash pass down the nearer row. Hover does nothing.
// ---------------------------------------------------------------------------
function nowSec() {
  return (typeof performance !== 'undefined' && performance.now)
    ? (performance.now() - startStamp) / 1000 : curT;
}

function setContact(x, y, t) {
  var L = layout(), hit = null, i;
  for (i = 0; i < HEADS.length; i++) {
    if (headHit(HEADS[i], L, x, y)) { hit = HEADS[i]; break; }
  }
  if (openContact && openContact.head !== hit) {
    openContact.head.contacts.push([openContact.since, t]);
    openContact = null;
  }
  if (hit && !openContact) openContact = { head: hit, since: t };
}

if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (ev) {
    var t = nowSec();
    pointer.down = true;
    pointer.x = ev.clientX; pointer.y = ev.clientY;
    pointer.downX = ev.clientX; pointer.downY = ev.clientY;
    pointer.downT = t; pointer.moved = 0;
    setContact(ev.clientX, ev.clientY, t);
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (!pointer.down) return;
    pointer.moved = Math.max(pointer.moved,
      Math.abs(ev.clientX - pointer.downX) + Math.abs(ev.clientY - pointer.downY));
    pointer.x = ev.clientX; pointer.y = ev.clientY;
    setContact(ev.clientX, ev.clientY, nowSec());
  });
  function endPointer(ev) {
    if (!pointer.down) return;
    var t = nowSec();
    if (openContact) {
      openContact.head.contacts.push([openContact.since, t]);
      openContact = null;
    }
    if (t - pointer.downT < 0.35 && pointer.moved < 8) {
      washes.push({ row: ev.clientX < W / 2 ? 0 : 1, t: t });
    }
    pointer.down = false;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointerleave', endPointer);
}

// ---------------------------------------------------------------------------
// Sizing: Visual Viewport API, listeners on visualViewport AND window.
// ---------------------------------------------------------------------------
function resize() {
  var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
  var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  W = Math.round(vw);
  H = Math.round(vh);
  canvas.width = W;
  canvas.height = H;
  var sw = window.screen && window.screen.width;
  var sh = window.screen && window.screen.height;
  if (sw && sh) isPhone = Math.min(sw, sh) < 700;
  else isPhone = H > W * 1.15;
  draw(curT);
}
if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
if (window.addEventListener) window.addEventListener('resize', resize);

// ---------------------------------------------------------------------------
// Boot: frame one is the synchronous draw at cycle t = 0. The loop, when a
// browser provides rAF, is anchored as elapsed-since-load added to 0.
// An inert ?seed=tNN hook (QA only) pins the first frame to a fixed phase.
// ---------------------------------------------------------------------------
var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
(function () {
  var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec((typeof location !== 'undefined' && location.search) || '');
  if (m) curT = parseFloat(m[1]);
})();
resize();
if (typeof requestAnimationFrame === 'function') {
  var loop = function () {
    curT = (performance.now() - startStamp) / 1000;
    draw(curT);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
