<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>№9032 · Chain Reaction</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #eef1f4; }
  #stage { position: fixed; inset: 0; display: block; cursor: pointer; }
  .caption {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 14px 22px;
    font-family: Georgia, serif; color: #2a2a26;
    pointer-events: none; user-select: none;
  }
  .caption .title { font-size: 15px; letter-spacing: 0.04em; }
  .caption .hint { font-size: 12px; font-style: italic; opacity: 0.55; }
  @media (max-width: 560px) {
    .caption { padding: 10px 14px; }
    .caption .title { font-size: 13px; }
    .caption .hint { font-size: 11px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="caption">
  <span class="title">№9032 · Chain Reaction</span>
  <span class="hint">one ball, no end. click for a new machine</span>
</div>
<script>
"use strict";
/* №9032 · Chain Reaction
   A Rube Goldberg machine that never ends. One ball runs a chain of
   contraptions while the camera follows; at the end of each world a portal
   carries it somewhere new, with a new palette. Seeded: ?seed= sets the
   layout, the palettes and the piece order. Click for a fresh machine.
   Studied from wustep's "contraptions" Machine: same spirit, all new code. */

// ---------- seeded rng ----------
function mulberry32(a) {
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seed) {
  const r = mulberry32(seed >>> 0);
  return {
    next: r,
    range: (a, b) => a + r() * (b - a),
    int: (a, b) => a + Math.floor(r() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(r() * arr.length)],
    chance: (p) => r() < p,
  };
}
const querySeed = (() => {
  const m = /[?&]seed=(-?\d+)/.exec(location.search);
  return m ? (parseInt(m[1], 10) >>> 0) : null;
})();

// ---------- worlds ----------
const INK = "#20211f";
const WORLDS = [
  { name: "workshop", bg: "#edf0f3",
    accents: ["#2e7fe8", "#e8442e", "#f2b90d"], decor: "bolts" },
  { name: "garden", bg: "#f7f2e3",
    accents: ["#37a94e", "#f58518", "#8a4fe8"], decor: "grass" },
  { name: "harbor", bg: "#e7f2f0",
    accents: ["#1f9db8", "#e8442e", "#f2b90d"], decor: "waves" },
  { name: "arcade", bg: "#f0eaf6",
    accents: ["#8a4fe8", "#e8442e", "#2e7fe8"], decor: "stars" },
];

// ---------- easing ----------
const easeInQuad = (t) => t * t;
const easeOutQuad = (t) => 1 - (1 - t) * (1 - t);
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const clamp01 = (t) => (t < 0 ? 0 : t > 1 ? 1 : t);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = (t) => {
  const c = 1.70158;
  return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
};

// ---------- canvas ----------
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
let VW = 0, VH = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = Math.round(VW * DPR); canvas.height = Math.round(VH * DPR);
  canvas.style.width = VW + "px"; canvas.style.height = VH + "px";
}
window.addEventListener("resize", resize);
resize();

// drawing helpers: thick confident linework, flat fills
function stroke(w) {
  ctx.lineWidth = w; ctx.strokeStyle = INK;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
}
function fillStroke(fill, w) {
  ctx.fillStyle = fill; ctx.fill();
  stroke(w || 7); ctx.stroke();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- particles ----------
const particles = [];
function spawnPuff(x, y, n, spread) {
  for (let i = 0; i < n; i++) {
    if (particles.length > 160) return;
    const a = Math.random() * Math.PI * 2, s = (0.4 + Math.random() * 0.6) * (spread || 60);
    particles.push({ kind: "puff", x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30,
      life: 0, max: 0.7 + Math.random() * 0.4, r: 8 + Math.random() * 10 });
  }
}
function spawnSpark(x, y, n) {
  for (let i = 0; i < n; i++) {
    if (particles.length > 160) return;
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.6, s = 120 + Math.random() * 160;
    particles.push({ kind: "spark", x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0, max: 0.4 + Math.random() * 0.3 });
  }
}
function spawnRing(x, y, color) {
  if (particles.length > 160) return;
  particles.push({ kind: "ring", x, y, life: 0, max: 0.8, color: color || INK });
}
function spawnSplash(x, y, color) {
  for (let i = 0; i < 8; i++) {
    if (particles.length > 160) return;
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2, s = 90 + Math.random() * 130;
    particles.push({ kind: "drop", x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0, max: 0.6 + Math.random() * 0.3, color });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life >= p.max) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.kind === "puff") { p.vx *= 0.98; p.vy *= 0.98; p.r += 30 * dt; }
    if (p.kind === "drop") p.vy += 500 * dt;
    if (p.kind === "spark") p.vy += 300 * dt;
  }
}
function drawParticles() {
  for (const p of particles) {
    const k = 1 - p.life / p.max;
    if (p.kind === "puff") {
      ctx.globalAlpha = 0.55 * k;
      ctx.fillStyle = "#ffffff";
      circle(p.x, p.y, p.r); ctx.fill();
    } else if (p.kind === "spark") {
      ctx.globalAlpha = k;
      stroke(4); ctx.strokeStyle = "#f2b90d";
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke();
      ctx.strokeStyle = INK;
    } else if (p.kind === "drop") {
      ctx.globalAlpha = k;
      ctx.fillStyle = p.color;
      circle(p.x, p.y, 5); ctx.fill();
    } else if (p.kind === "ring") {
      ctx.globalAlpha = 0.7 * k;
      stroke(5); ctx.strokeStyle = p.color;
      circle(p.x, p.y, 14 + (1 - k) * 60); ctx.stroke();
      ctx.strokeStyle = INK;
    }
    ctx.globalAlpha = 1;
  }
}

// ---------- shared track drawing ----------
const BALL_R = 16;
function drawRail(x0, x1, surfY, look) {
  stroke(7);
  ctx.beginPath(); ctx.moveTo(x0, surfY); ctx.lineTo(x1, surfY); ctx.stroke();
  for (let x = x0 + 50; x < x1 - 10; x += 120) {
    ctx.beginPath(); ctx.moveTo(x, surfY); ctx.lineTo(x, surfY + 300); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 20, surfY + 300); ctx.lineTo(x + 20, surfY + 300); ctx.stroke();
  }
}
function drawPost(x, yTop, yBot) {
  stroke(7);
  ctx.beginPath(); ctx.moveTo(x, yTop); ctx.lineTo(x, yBot); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 20, yBot); ctx.lineTo(x + 20, yBot); ctx.stroke();
}

// A node: { kind, x0, x1, y, dur, pos(t)->{x,y}, draw(time), onTrigger(), look }
// look: { accents:[3 colors], a0, a1, a2 }
function baseNode(kind, x0, x1, y, dur, look) {
  return { kind, x0, x1, y, dur, look,
    triggered: false, animT: 0, prox: 0,
    pos: null, draw: null, onTrigger: null, onWindup: null };
}

function nRoll(x, y, len, look) {
  const n = baseNode("roll", x, x + len, y, len / 230, look);
  n.pos = (t) => ({ x: lerp(x, x + len, t), y });
  n.draw = () => drawRail(x, x + len, y + BALL_R, look);
  return { node: n, endX: x + len, endY: y };
}
function nRampDown(x, y, len, drop, look) {
  const n = baseNode("rampDown", x, x + len, y, len / 260, look);
  n.pos = (t) => ({ x: lerp(x, x + len, t), y: y + drop * easeInQuad(t) });
  n.fast = true;
  n.draw = () => {
    const y1 = y + BALL_R, y2 = y + drop + BALL_R;
    stroke(7);
    ctx.beginPath(); ctx.moveTo(x, y1);
    ctx.quadraticCurveTo(x + len * 0.5, y1, x + len, y2); ctx.stroke();
    for (let px = x + 50; px < x + len - 10; px += 120) {
      const f = (px - x) / len;
      const sy = lerp(y1, y2, f * f);
      drawPost(px, sy, sy + 300);
    }
  };
  return { node: n, endX: x + len, endY: y + drop };
}
function nRampUp(x, y, len, rise, look) {
  const n = baseNode("rampUp", x, x + len, y, len / 200, look);
  n.pos = (t) => ({ x: lerp(x, x + len, t), y: y - rise * easeOutQuad(t) });
  n.draw = () => {
    const y1 = y + BALL_R, y2 = y - rise + BALL_R;
    stroke(7);
    ctx.beginPath(); ctx.moveTo(x, y1);
    ctx.quadraticCurveTo(x + len * 0.5, y1, x + len, y2); ctx.stroke();
    for (let px = x + 50; px < x + len - 10; px += 120) {
      const f = (px - x) / len;
      const sy = lerp(y1, y2, 1 - (1 - f) * (1 - f));
      drawPost(px, sy, sy + 300);
    }
  };
  return { node: n, endX: x + len, endY: y - rise };
}
function nFunnel(x, y, look) {
  const W = 210, drop = 160;
  const n = baseNode("funnel", x, x + W, y, 2.1, look);
  const cxp = x + 105, rimY = y - 120;
  n.pos = (t) => {
    if (t < 0.22) { const k = t / 0.22; return { x: lerp(x, cxp - 40, easeOutQuad(k)), y }; }
    if (t < 0.78) {
      const k = (t - 0.22) / 0.56;
      const a = k * Math.PI * 3, r = lerp(36, 8, k);
      return { x: cxp + Math.cos(a) * r, y: rimY + 40 + k * 60 };
    }
    const k = (t - 0.78) / 0.22;
    return { x: lerp(cxp, x + W, easeInQuad(k)), y: y + drop };
  };
  n.draw = () => {
    const a = look.accents;
    drawPost(x + 35, rimY, y + BALL_R + 260);
    drawPost(x + 175, rimY, y + BALL_R + 260);
    // funnel body
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(cxp - 70, rimY); ctx.lineTo(cxp + 70, rimY);
    ctx.lineTo(cxp + 16, rimY + 66); ctx.lineTo(cxp - 16, rimY + 66);
    ctx.closePath(); ctx.fill(); stroke(7); ctx.stroke();
    // rim bands
    stroke(5);
    ctx.beginPath(); ctx.moveTo(cxp - 58, rimY + 22); ctx.lineTo(cxp + 58, rimY + 22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cxp - 40, rimY + 44); ctx.lineTo(cxp + 40, rimY + 44); ctx.stroke();
    // rim ellipse lip
    ctx.fillStyle = a[0];
    ctx.beginPath(); ctx.ellipse(cxp, rimY, 70, 14, 0, 0, Math.PI * 2); ctx.fill();
    stroke(7); ctx.stroke();
    // entry rail so the ball never floats
    drawRail(x, x + 70, y + BALL_R, look);
    // exit pipe curving out
    stroke(7);
    ctx.beginPath(); ctx.moveTo(cxp, rimY + 66);
    ctx.quadraticCurveTo(cxp, y + drop - 30, cxp + 40, y + drop - 10);
    ctx.lineTo(x + W - 20, y + drop + BALL_R - 16); ctx.stroke();
    drawRail(x + W - 20, x + W + 60, y + drop + BALL_R, look);
  };
  return { node: n, endX: x + W + 60, endY: y + drop };
}
function nSeesaw(x, y, look) {
  const W = 240, cxp = x + 120, py = y; // pivot at track level
  const n = baseNode("seesaw", x, x + W, y, 1.7, look);
  const ang = (t) => lerp(-0.13, 0.17, easeInOut(t));
  n.pos = (t) => {
    const bx = lerp(x + 14, x + W - 14, t);
    const plankY = y + Math.tan(ang(t)) * (bx - cxp);
    // blend to the flat track at both ends so the ball never pops
    const sIn = clamp01(t / 0.15), sOut = clamp01((1 - t) / 0.15);
    const w = Math.min(sIn * sIn * (3 - 2 * sIn), sOut * sOut * (3 - 2 * sOut));
    return { x: bx, y: lerp(y, plankY, w) };
  };
  n.draw = (time) => {
    const t = n._t || 0;
    const a = ang(clamp01(t));
    // fulcrum
    ctx.beginPath();
    ctx.moveTo(cxp - 26, y + 92); ctx.lineTo(cxp + 26, y + 92);
    ctx.lineTo(cxp, y + 34); ctx.closePath();
    fillStroke(look.accents[0], 7);
    // plank: top surface meets the ball's underside at the pivot
    ctx.save();
    ctx.translate(cxp, y + 27); ctx.rotate(a);
    ctx.fillStyle = "#ffffff";
    rrect(-W / 2, -11, W, 22, 8); ctx.fill(); stroke(7); ctx.stroke();
    ctx.fillStyle = look.accents[1];
    circle(-W / 2 + 26, 0, 9); ctx.fill(); stroke(5); ctx.stroke();
    circle(W / 2 - 26, 0, 9); ctx.fill(); stroke(5); ctx.stroke();
    ctx.restore();
    // pivot bolt
    ctx.fillStyle = look.accents[2];
    circle(cxp, y + 27, 10); fillStroke(look.accents[2], 6);
  };
  return { node: n, endX: x + W, endY: y };
}
function nBell(x, y, look) {
  const W = 210, cxp = x + 105, topY = y - 170;
  const n = baseNode("bell", x, x + W, y, 1.1, look);
  n.pos = (t) => ({ x: lerp(x, x + W, t), y });
  n.onTrigger = () => { spawnRing(cxp, topY + 60, look.accents[0]); spawnRing(cxp, topY + 60, look.accents[1]); };
  n.draw = () => {
    // A-frame
    stroke(7);
    ctx.beginPath(); ctx.moveTo(x + 30, y + BALL_R); ctx.lineTo(cxp, topY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + W - 30, y + BALL_R); ctx.lineTo(cxp, topY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 52, y + BALL_R - 60); ctx.lineTo(x + W - 52, y + BALL_R - 60); ctx.stroke();
    // swinging bell
    const sw = n.triggered ? 0.45 * Math.sin(n.animT * 11) * Math.exp(-1.8 * n.animT) : 0;
    ctx.save();
    ctx.translate(cxp, topY); ctx.rotate(sw);
    ctx.fillStyle = look.accents[1];
    ctx.beginPath();
    ctx.moveTo(-34, 44);
    ctx.quadraticCurveTo(-30, 0, -16, -6);
    ctx.lineTo(16, -6);
    ctx.quadraticCurveTo(30, 0, 34, 44);
    ctx.quadraticCurveTo(0, 56, -34, 44);
    ctx.closePath(); ctx.fill(); stroke(7); ctx.stroke();
    ctx.fillStyle = look.accents[2];
    circle(0, 52, 10); ctx.fill(); stroke(6); ctx.stroke();
    ctx.restore();
    drawRail(x, x + W, y + BALL_R, look);
  };
  return { node: n, endX: x + W, endY: y };
}
function nMillWheel(x, y, look) {
  const W = 250, cxp = x + 125, wy = y + 120;
  const n = baseNode("millwheel", x, x + W, y, 1.2, look);
  n.pos = (t) => ({ x: lerp(x, x + W, t), y });
  n.draw = (time) => {
    // water trough
    ctx.fillStyle = look.accents[0];
    rrect(cxp - 105, wy - 30, 210, 66, 20); ctx.fill();
    stroke(7); ctx.stroke();
    // wheel, spins faster while the ball passes
    const boost = n.prox > 0 ? n.prox * 3 : 0;
    const rot = time * (0.7 + boost);
    ctx.save();
    ctx.translate(cxp, wy + 3); ctx.rotate(rot);
    for (let i = 0; i < 8; i++) {
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = i % 2 ? look.accents[1] : "#ffffff";
      rrect(18, -13, 62, 26, 8); ctx.fill(); stroke(6); ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = look.accents[2];
    circle(cxp, wy + 3, 16); fillStroke(look.accents[2], 7);
    if (n.prox > 0.4 && Math.random() < 0.3) spawnSplash(cxp + 60, wy - 40, look.accents[0]);
    drawRail(x, x + W, y + BALL_R, look);
  };
  return { node: n, endX: x + W, endY: y };
}
function nSpinner(x, y, look) {
  const W = 180, cxp = x + 90, topY = y - 130;
  const n = baseNode("spinner", x, x + W, y, 1.0, look);
  n.pos = (t) => ({ x: lerp(x, x + W, t), y });
  n.draw = () => {
    // pipe arch
    stroke(9);
    ctx.beginPath(); ctx.moveTo(x + 34, y + BALL_R); ctx.lineTo(x + 34, topY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + W - 34, y + BALL_R); ctx.lineTo(x + W - 34, topY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 34, topY); ctx.lineTo(x + W - 34, topY); ctx.stroke();
    // valve wheel spins when triggered
    const spin = n.triggered ? easeOutQuad(clamp01(n.animT / 1.2)) * Math.PI * 4 : 0;
    ctx.save();
    ctx.translate(cxp, topY - 26); ctx.rotate(spin);
    ctx.fillStyle = look.accents[2];
    circle(0, 0, 30); ctx.fill(); stroke(7); ctx.stroke();
    stroke(6);
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * 30, Math.sin(a) * 30); ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = look.accents[2];
    circle(cxp, topY - 26, 8); fillStroke(look.accents[2], 5);
    drawRail(x, x + W, y + BALL_R, look);
  };
  return { node: n, endX: x + W, endY: y };
}

function nElevator(x, y, look) {
  const W = 190, lift = 180;
  const n = baseNode("elevator", x, x + W, y, 2.6, look);
  const topY = y - lift;
  n.pos = (t) => {
    if (t < 0.18) { const k = t / 0.18; return { x: lerp(x, x + 95, easeOutQuad(k)), y }; }
    if (t < 0.72) { const k = (t - 0.18) / 0.54; return { x: x + 95, y: lerp(y, topY, easeInOut(k)) }; }
    const k = (t - 0.72) / 0.28; return { x: lerp(x + 95, x + W, easeInOut(k)), y: topY };
  };
  n.draw = () => {
    const t = n._t || 0;
    const liftK = t < 0.18 ? 0 : t < 0.72 ? easeInOut((t - 0.18) / 0.54) : 1;
    const py = lerp(y + BALL_R, topY + BALL_R, liftK);
    // tower rails
    stroke(7);
    ctx.beginPath(); ctx.moveTo(x + 45, y + BALL_R); ctx.lineTo(x + 45, topY - 20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 145, y + BALL_R); ctx.lineTo(x + 145, topY - 20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 30, topY - 20); ctx.lineTo(x + 160, topY - 20); ctx.stroke();
    // pulley
    ctx.save();
    ctx.translate(x + 95, topY - 44); ctx.rotate(liftK * 5);
    ctx.fillStyle = look.accents[2];
    circle(0, 0, 22); ctx.fill(); stroke(7); ctx.stroke();
    stroke(5);
    ctx.beginPath(); ctx.moveTo(-22, 0); ctx.lineTo(22, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(0, 22); ctx.stroke();
    ctx.restore();
    // cables
    stroke(4);
    ctx.beginPath(); ctx.moveTo(x + 95, topY - 22); ctx.lineTo(x + 95, py - 14); ctx.stroke();
    const cwY = lerp(topY + 40, y - 20, liftK);
    ctx.beginPath(); ctx.moveTo(x + 160, topY - 22); ctx.lineTo(x + 160, cwY - 18); ctx.stroke();
    // counterweight
    ctx.fillStyle = look.accents[0];
    rrect(x + 142, cwY - 18, 36, 52, 8); ctx.fill(); stroke(6); ctx.stroke();
    // platform
    ctx.fillStyle = look.accents[1];
    rrect(x + 55, py - 14, 80, 22, 8); ctx.fill(); stroke(7); ctx.stroke();
    drawRail(x, x + 40, y + BALL_R, look);
    drawRail(x + W - 10, x + W + 70, topY + BALL_R, look);
  };
  return { node: n, endX: x + W + 70, endY: topY };
}
function nCannon(x, y, look) {
  const W = 330, landX = x + 300;
  const n = baseNode("cannon", x, x + W, y, 2.0, look);
  const mzl = { x: x + 118, y: y - 62 };
  n.fast = true;
  n.events = [{
    at: 0.38, fired: false, fn: () => {
      spawnPuff(mzl.x, mzl.y, 10, 90); spawnSpark(x + 60, y - 78, 8);
    }
  }];
  n.pos = (t) => {
    if (t < 0.22) { const k = t / 0.22; return { x: lerp(x, x + 78, easeOutQuad(k)), y }; }
    if (t < 0.38) return { x: x + 78, y };
    const k = (t - 0.38) / 0.62;

// ---------- generator ----------
const BUILDERS = { nRoll, nRampDown, nRampUp, nFunnel, nSeesaw, nBell, nMillWheel, nSpinner, nElevator, nCannon, nLoop, nCatapult };
function pickKind(rng, prev, y) {
  const bag = [];
  const add = (k, w) => { for (let i = 0; i < w; i++) bag.push(k); };
  add("nRoll", 1); add("nRampDown", 2); add("nRampUp", 2); add("nFunnel", 3);
  add("nSeesaw", 2); add("nBell", 2); add("nMillWheel", 2); add("nSpinner", 2);
  add("nElevator", 3); add("nCannon", 2); add("nLoop", 2); add("nCatapult", 2);
  if (y < -100) { add("nFunnel", 10); add("nRampDown", 10); }
  else if (y > 100) { add("nElevator", 10); add("nRampUp", 10); add("nCatapult", 5); }
  let k = prev;
  for (let tries = 0; tries < 12 && k === prev; tries++) k = rng.pick(bag);
  return k;
}
function buildArgs(kind, x, y, rng) {
  switch (kind) {
    case "nRoll": return [x, y, rng.range(120, 200)];
    case "nRampDown": return [x, y, rng.range(170, 250), rng.range(50, 90)];
    case "nRampUp": return [x, y, rng.range(170, 250), rng.range(50, 90)];
    default: return [x, y];
  }
}

// ---------- state ----------
const S = {
  seed: 1, nodes: [], nodeIdx: 0, t: 0,
  ball: { x: 0, y: 0, px: 0, py: 0, speed: 0 },
  cam: { x: 0, y: 0 }, worldIdx: 0,
  flash: null, trail: [], lastX: -200, lastY: 0, prevKind: "",
  fade: 1, time: 0,
};
function worldLook(wi, seed) {
  const w = WORLDS[((wi % 4) + 4) % 4];
  return { bg: w.bg, accents: w.accents, decor: w.decor,
    seed: (seed ^ Math.imul(wi + 1, 2654435761)) >>> 0, worldIdx: ((wi % 4) + 4) % 4 };
}
function addChunk() {
  const rng = S.chunkRng;
  const look = worldLook(S.worldIdx, S.seed);
  if (S.nodes.length === 0) {
    const b = nRoll(S.lastX, S.lastY, 220, look);
    S.nodes.push(b.node); S.lastX = b.endX + 80; S.prevKind = "nRoll";
  }
  for (let i = 0; i < 7; i++) {
    const kind = pickKind(rng, S.prevKind, S.lastY);
    const args = buildArgs(kind, S.lastX, S.lastY, rng);
    const b = BUILDERS[kind](...args, look);
    S.nodes.push(b.node);
    S.lastX = b.endX + rng.range(20, 55);
    S.lastY = b.endY;
    S.prevKind = kind;
  }
  const nextLook = worldLook(S.worldIdx + 1, S.seed);
  const p = nPortal(S.lastX, S.lastY, look, nextLook);
  S.nodes.push(p.node);
  S.lastX = p.endX + 80;
  S.worldIdx++;
}
function resetMachine(seed) {
  S.seed = seed >>> 0;
  S.chunkRng = makeRng((S.seed ^ 0x9e3779b9) >>> 0);
  S.nodes = []; S.nodeIdx = 0; S.t = 0;
  S.lastX = -200; S.lastY = 0; S.prevKind = "";
  S.worldIdx = 0; S.flash = null; S.trail = [];
  particles.length = 0;
  addChunk(); addChunk(); addChunk();
  S.ball.x = -160; S.ball.y = 0; S.ball.px = -160; S.ball.py = 0;
  S.cam.x = -40; S.cam.y = -40;
}

// ---------- background decor (subtle, per world) ----------
function drawBolt(x, y, r, color) {
  ctx.fillStyle = color;
  circle(x, y, r); ctx.fill(); stroke(5); ctx.stroke();
  stroke(4);
  ctx.beginPath(); ctx.moveTo(x - r * 0.55, y); ctx.lineTo(x + r * 0.55, y); ctx.stroke();
}
function drawTuft(x, y, s, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineCap = "round";
  for (const [dx, h, bend] of [[-12, 26, -6], [0, 34, 0], [12, 24, 7]]) {
    ctx.beginPath(); ctx.moveTo(x + dx * s, y);
    ctx.quadraticCurveTo(x + dx * s + bend * s, y - h * s * 0.7, x + (dx + bend) * s, y - h * s);
    ctx.stroke();
  }
  ctx.strokeStyle = INK;
}
function drawWave(x, y, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x - w / 2, y);
  ctx.quadraticCurveTo(x - w / 4, y - 12, x, y);
  ctx.quadraticCurveTo(x + w / 4, y + 12, x + w / 2, y);
  ctx.stroke();
  ctx.strokeStyle = INK;
}
function drawStar(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 4);
  ctx.fillRect(-r, -2, r * 2, 4); ctx.fillRect(-2, -r, 4, r * 2);
  ctx.restore();
}
function drawDecor(x0, x1, look, time) {
  const cell = 200;
  const c0 = Math.floor(x0 / cell), c1 = Math.floor(x1 / cell);
  for (let c = c0; c <= c1; c++) {
    const r = makeRng((look.seed ^ Math.imul(c + 0x9e37, 2246822519)) >>> 0);
    const n = r.int(1, 2);
    for (let i = 0; i < n; i++) {
      const dx = c * cell + r.range(30, 170);
      const dy = r.range(-340, 240);
      const s = r.range(0.7, 1.25);
      ctx.globalAlpha = 0.38;
      const col = look.accents[r.int(0, 2)];
      if (look.decor === "bolts") drawBolt(dx, dy, 9 * s, col);
      else if (look.decor === "grass") drawTuft(dx, dy + 60, s, col);
      else if (look.decor === "waves") drawWave(dx, dy, 40 * s, col);
      else drawStar(dx, dy, 8 * s, col);
    }
  }
  ctx.globalAlpha = 1;
}

// ---------- ball ----------
function drawBall(x, y, vx, vy) {
  const sp = Math.hypot(vx, vy);
  // motion ghosts
  if (sp > 380) {
    const n = Math.min(S.trail.length, 4);
    for (let i = 1; i <= n; i++) {
      const tp = S.trail[S.trail.length - i * 2];
      if (!tp) break;
      ctx.globalAlpha = 0.16 * (1 - i / (n + 1));
      ctx.fillStyle = "#ffffff";
      circle(tp.x, tp.y, BALL_R * 0.92); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // speed lines
    const a = Math.atan2(vy, vx);
    stroke(4);
    for (let i = 0; i < 3; i++) {
      const off = (i - 1) * 16;
      const bx = x - Math.cos(a) * (BALL_R + 14) - Math.sin(a) * off;
      const by = y - Math.sin(a) * (BALL_R + 14) + Math.cos(a) * off;
      ctx.beginPath(); ctx.moveTo(bx, by);
      ctx.lineTo(bx - Math.cos(a) * 26, by - Math.sin(a) * 26); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  // body
  ctx.fillStyle = "#ffffff";
  circle(x, y, BALL_R); ctx.fill();
  stroke(6.5); ctx.stroke();
  // face looks where it is going
  const ex = clamp01(Math.abs(vx) / 500) * 6 * (vx < -40 ? -1 : 1);
  const ey = clamp01(Math.abs(vy) / 500) * 4 * (vy < -40 ? -1 : 1);
  ctx.fillStyle = INK;
  circle(x + 3 + ex, y - 3 + ey, 4.6); ctx.fill();
  ctx.fillStyle = "#ffffff";
  circle(x + 4.6 + ex, y - 4.6 + ey, 1.6); ctx.fill();
}

// ---------- simulation step ----------
function step(dt) {
  const node = S.nodes[S.nodeIdx];
  S.t += dt / node.dur;
  node._t = S.t;
  if (node.events) {
    for (const ev of node.events) {
      if (!ev.fired && S.t >= ev.at) { ev.fired = true; ev.fn(); }
    }
  }
  const p = node.pos(clamp01(S.t));
  const dx = p.x - S.ball.x, dy = p.y - S.ball.y;
  S.ball.px = S.ball.x; S.ball.py = S.ball.y;
  S.ball.x = p.x; S.ball.y = p.y;
  S.ball.speed = dt > 0 ? Math.hypot(dx, dy) / dt : 0;
  S.ball.vx = dt > 0 ? dx / dt : 0;
  S.ball.vy = dt > 0 ? dy / dt : 0;
  S.trail.push({ x: p.x, y: p.y });
  if (S.trail.length > 30) S.trail.shift();
  // proximity windup + trigger animations, bounded window
  for (let i = S.nodeIdx; i < Math.min(S.nodes.length, S.nodeIdx + 40); i++) {
    const nd = S.nodes[i];
    nd.prox = nd.x0 > S.ball.x ? clamp01(1 - (nd.x0 - S.ball.x) / 320) : (S.ball.x < nd.x1 ? 1 : 0);
    if (nd.triggered && nd.animT < 6) nd.animT += dt;
  }
  if (S.t >= 1) {
    S.nodeIdx++;
    S.t = 0;
    const nn = S.nodes[S.nodeIdx];
    nn.triggered = true; nn.animT = 0; nn._t = 0;
    if (nn.events) for (const ev of nn.events) ev.fired = false;
    if (nn.onTrigger) nn.onTrigger();
  }
  while (S.lastX < S.ball.x + 2800) addChunk();
  // camera follows with lookahead
  const tx = S.ball.x + 150, ty = S.ball.y - 50;
  const k = Math.min(1, dt * 2.6);
  S.cam.x += (tx - S.cam.x) * k;
  S.cam.y += (ty - S.cam.y) * k;
  // portal flash
  if (S.flash) {
    S.flash.t += dt;
    if (!S.flash.switched && S.flash.t >= 0.22) {
      S.flash.switched = true;
      S.ballWorld = S.flash.next;
    }
    if (S.flash.t >= 0.5) S.flash = null;
  }
  updateParticles(dt);
  // fade for reseed
  if (S.fading === -1) {
    S.fade -= dt * 4;
    if (S.fade <= 0) {
      S.fade = 0;
      const ns = (Math.random() * 1e9) >>> 0;
      resetMachine(ns);
      try { history.replaceState(null, "", "?seed=" + ns); } catch (e) {}
      S.fading = 1;
    }
  } else if (S.fading === 1) {
    S.fade += dt * 4;
    if (S.fade >= 1) { S.fade = 1; S.fading = 0; }
  }
}

// ---------- render ----------
function render() {
  const viewW = VW < 700 ? 700 : 920;
  const scale = Math.max(VW / viewW, VH / 900);
  const viewH = VH / scale;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const look = worldLook(S.ballWorld, S.seed);
  ctx.fillStyle = look.bg;
  ctx.fillRect(0, 0, VW, VH);
  const ox = VW / 2 - S.cam.x * scale, oy = VH * 0.62 - S.cam.y * scale;
  ctx.setTransform(DPR * scale, 0, 0, DPR * scale, DPR * ox, DPR * oy);
  const x0 = S.cam.x - viewW / 2 - 150, x1 = S.cam.x + viewW / 2 + 150;
  drawDecor(x0, x1, look, S.time);
  // connector rails between chunks of track
  for (let i = Math.max(1, S.nodeIdx - 3); i < Math.min(S.nodes.length, S.nodeIdx + 30); i++) {
    const a = S.nodes[i - 1], b = S.nodes[i];
    if (b.x0 < x0 || a.x1 > x1) continue;
    drawRail(a.endX !== undefined ? b.x0 - 130 : b.x0, b.x0 + 8, b.y + BALL_R, b.look);
  }
  for (let i = Math.max(0, S.nodeIdx - 3); i < Math.min(S.nodes.length, S.nodeIdx + 30); i++) {
    const nd = S.nodes[i];
    if (nd.x1 < x0 || nd.x0 > x1) continue;
    ctx.save();
    nd.draw(S.time);
    ctx.restore();
  }
  drawBall(S.ball.x, S.ball.y, S.ball.vx || 0, S.ball.vy || 0);
  drawParticles();
  // portal flash wipe
  if (S.flash) {
    const ft = S.flash.t;
    const R = Math.hypot(VW, VH) * 0.7;
    const rr = ft < 0.22 ? easeOutQuad(ft / 0.22) * R : (1 - (ft - 0.22) / 0.28) * R;
    const sx = VW / 2 + (S.flash.bx - S.cam.x) * scale;
    const sy = VH * 0.62 + (S.flash.by - S.cam.y) * scale;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(sx, sy, Math.max(0.1, rr), 0, Math.PI * 2); ctx.fill();
  }
  // reseed fade
  if (S.fade < 1) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1 - S.fade;
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = 1;
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

// ---------- main loop ----------
let lastT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, ((now - lastT) / 1000) || 0.016);
  lastT = now;
  S.time += dt;
  step(dt);
  render();
}
canvas.addEventListener("click", () => { if (!S.fading) S.fading = -1; });
canvas.style.touchAction = "none";

// ---------- go ----------
S.ballWorld = 0;
resetMachine(querySeed !== null ? querySeed : 7);
requestAnimationFrame(frame);
</script>
</body>
