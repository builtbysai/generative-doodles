<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9032 · Kaleido</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#060609; }
#stage { position:fixed; inset:0; display:block; }
#begin {
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:#060609; color:#8a8f9e; font:14px/1.4 system-ui, sans-serif;
  letter-spacing:0.2em; text-transform:uppercase; cursor:pointer; z-index:10;
  transition:opacity 0.8s ease; user-select:none; -webkit-user-select:none;
}
#begin.gone { opacity:0; pointer-events:none; }
#begin span { border:1px solid #2a2e3a; padding:14px 28px; border-radius:2px; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="begin"><span>tap to begin</span></div>
<script>
'use strict';
/* №9032 · Kaleido — audio-reactive kaleidoscope.
   Twelve-fold mirrored geometry driven by a live-synthesized groove.
   Bass spins the wheel, mids carve the pattern, highs scatter sparks.
   Drag to bend the symmetry. */

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const beginEl = document.getElementById('begin');

function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
let W=0,H=0,CX=0,CY=0,RMAX=0;
function prep(){
  const [w,h]=viewportWH();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  W=w;H=h;CX=w/2;CY=h/2;RMAX=Math.hypot(w,h)/2;
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width=w+'px';canvas.style.height=h+'px';
}
prep();window.addEventListener('resize',prep);

/* ---------------- Audio: generative groove ---------------- */
let AC=null,analyser=null,freqData=null,audioStarted=false;
const SCALE=[0,2,3,5,7,8,10]; // dorian-ish
const ROOT=55; // A1
let step=0;

function startAudio(){
  if(audioStarted)return;audioStarted=true;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  analyser=AC.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=0.8;
  freqData=new Uint8Array(analyser.frequencyBinCount);
  const master=AC.createGain();master.gain.value=0.5;
  master.connect(analyser);analyser.connect(AC.destination);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;lp.connect(master);
  const delay=AC.createDelay(1);delay.delayTime.value=0.31;
  const fb=AC.createGain();fb.gain.value=0.32;const wet=AC.createGain();wet.gain.value=0.25;
  delay.connect(fb);fb.connect(delay);delay.connect(wet);wet.connect(lp);

  const BPM=112, SPB=60/BPM/2; // 8th notes
  function schedule(){
    const t=AC.currentTime+0.06;
    const s=step%16;step++;
    // kick on 0,4,8,12
    if(s%4===0){
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+0.11);
      g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.24);
      o.connect(g);g.connect(lp);o.start(t);o.stop(t+0.3);
    }
    // hat on offbeats
    if(s%2===1){
      const len=0.05,buf=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
      const src=AC.createBufferSource();src.buffer=buf;
      const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=7000;
      const g=AC.createGain();g.gain.value=0.10;
      src.connect(hp);hp.connect(g);g.connect(lp);src.start(t);
    }
    // bassline
    if(s%2===0){
      const deg=SCALE[[0,0,3,4][Math.floor(s/4)%4]%SCALE.length];
      const f=ROOT*Math.pow(2,deg/12)*2;
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sawtooth';o.frequency.value=f;
      const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=380;
      g.gain.setValueAtTime(0.16,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.42);
      o.connect(fl);fl.connect(g);g.connect(lp);o.start(t);o.stop(t+0.5);
    }
    // sparkle arp
    if(Math.random()<0.4){
      const deg=SCALE[Math.floor(Math.random()*SCALE.length)];
      const f=ROOT*Math.pow(2,(deg+24)/12);
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0.07,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
      o.connect(g);g.connect(lp);g.connect(delay);o.start(t);o.stop(t+0.6);
    }
    setTimeout(schedule,SPB*1000);
  }
  schedule();
  beginEl.classList.add('gone');
}
beginEl.addEventListener('click',()=>{startAudio();if(AC&&AC.state==='suspended')AC.resume();});

/* ---------------- Kaleidoscope ---------------- */
let bassE=0,midE=0,highE=0,rot=0,bloom=0,lastBass=0;
let SYM=12,targetSym=12;

function readAudio(){
  if(!analyser||!freqData)return;
  analyser.getByteFrequencyData(freqData);
  const n=freqData.length,bN=Math.floor(n*0.06),mN=Math.floor(n*0.3);
  let b=0,m=0,h=0;
  for(let i=0;i<bN;i++)b+=freqData[i];
  for(let i=bN;i<mN;i++)m+=freqData[i];
  for(let i=mN;i<n;i++)h+=freqData[i];
  bassE=(b/bN)/255;midE=(m/(mN-bN))/255;highE=(h/(n-mN))/255;
  if(bassE>lastBass*1.4&&bassE>0.22)bloom=1;
  lastBass+=(bassE-lastBass)*0.3;
  bloom*=0.93;
}

// drag horizontally to change symmetry
let dragging=false,lastX=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;});
canvas.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX;lastX=e.clientX;
  targetSym=Math.max(3,Math.min(24,Math.round(targetSym+dx*0.03)));
});
window.addEventListener('pointerup',()=>dragging=false);

let t=0;
const BINS=48;
function frame(){
  t+=0.008;
  readAudio();
  SYM+=(targetSym-SYM)*0.06;
  const sym=Math.round(SYM);
  rot+=0.0016+bassE*0.02;

  ctx.fillStyle='rgba(6,6,9,0.16)';
  ctx.fillRect(0,0,W,H);

  const wedge=Math.PI*2/sym;
  const scale=1+bloom*0.22;

  ctx.save();
  ctx.translate(CX,CY);
  ctx.rotate(rot);
  ctx.scale(scale,scale);

  for(let s=0;s<sym;s++){
    ctx.save();
    ctx.rotate(s*wedge);
    // mirror every other wedge for kaleidoscope effect
    if(s%2===1){ctx.scale(1,-1);}
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,RMAX,-wedge/2,wedge/2);
    ctx.closePath();
    ctx.clip();

    // frequency rings: each bin draws an arc segment
    for(let i=0;i<BINS;i++){
      const v=freqData?freqData[Math.floor(i/BINS*freqData.length*0.7)]/255:0.12+0.1*Math.sin(t*2+i);
      const r0=RMAX*0.08+i/BINS*RMAX*0.85;
      const rr=r0+v*RMAX*0.10*(1+bloom*0.8);
      const a0=-wedge/2+0.02, a1=wedge/2-0.02;
      // gold intensity by energy
      const g=Math.round(120+v*135), r=Math.round(200+v*55), b=Math.round(60+v*40);
      ctx.strokeStyle=`rgba(${r},${g},${b},${(0.25+v*0.65).toFixed(3)})`;
      ctx.lineWidth=1+v*5+midE*2;
      ctx.beginPath();
      ctx.arc(0,0,rr,a0,a1);
      ctx.stroke();
    }

    // radial spokes from mids
    const spokes=6+Math.floor(midE*10);
    for(let k=0;k<spokes;k++){
      const a=(k/spokes)*wedge*0.9-wedge*0.45;
      const len=RMAX*(0.15+midE*0.7);
      ctx.strokeStyle=`rgba(255,190,90,${(0.15+midE*0.4).toFixed(3)})`;
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*RMAX*0.06,Math.sin(a)*RMAX*0.06);
      ctx.lineTo(Math.cos(a)*len,Math.sin(a)*len);
      ctx.stroke();
    }

    // high-frequency sparkle dots
    const sparks=Math.floor(highE*26);
    for(let k=0;k<sparks;k++){
      const a=(k*2.39996)%wedge-wedge/2; // golden angle spread
      const rr=RMAX*(0.1+((k*0.61803)%0.85));
      const sz=1+highE*3;
      ctx.fillStyle=`rgba(255,240,200,${(0.4+highE*0.5).toFixed(3)})`;
      ctx.fillRect(Math.cos(a)*rr-sz/2,Math.sin(a)*rr-sz/2,sz,sz);
    }
    ctx.restore();
  }
  ctx.restore();

  // center glow
  const cg=ctx.createRadialGradient(CX,CY,0,CX,CY,60+bloom*60);
  cg.addColorStop(0,`rgba(255,200,110,${(0.25+bloom*0.4).toFixed(3)})`);
  cg.addColorStop(1,'rgba(255,200,110,0)');
  ctx.fillStyle=cg;
  ctx.fillRect(CX-130,CY-130,260,260);

  requestAnimationFrame(frame);
}
ctx.fillStyle='#060609';ctx.fillRect(0,0,W,H);
frame();
</script>
</body>
</html>
