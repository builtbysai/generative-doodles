<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№9032 · Tiny Machines</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #f5f2ea;
    overflow: hidden;
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    cursor: pointer;
  }
  canvas { display: block; }
  .cap {
    position: fixed; z-index: 2;
    color: #8a857a;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    pointer-events: none;
  }
  #capL { left: 18px; bottom: 14px; }
  #capL b { color: #2b2a26; font-weight: 600; }
  #capR { right: 18px; bottom: 14px; text-align: right; }
  @media (max-width: 520px) {
    #capR { bottom: 32px; }
    .cap { font-size: 10px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap" id="capL"><b>№9032 · Tiny Machines</b></div>
<div class="cap" id="capR">click for a new set</div>
<script>
"use strict";
/* №9032 · Tiny Machines
   A grid of small looping machines, drawn with code and no libraries.
   Every machine is periodic in u (0..1): each one loops seamlessly,
   each on its own period and phase, so the field never quite repeats.
   Studied after wustep's "contraptions" (MIT): same spirit, all new code. */

const INK = "#2b2a26";
const PAPER = "#f5f2ea";
const ACCENTS = ["#c8452c", "#2b6cb0", "#3d8a5a", "#d99a2b", "#2a9d8f"];
const TAU = Math.PI * 2;

/* ---------- seeded rng ---------- */
function hashSeed(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- canvas ---------- */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}
window.addEventListener("resize", resize);

/* ---------- draw helpers (ink linework, sparse accents) ---------- */
let LW = 1.5;
function ink(w) { ctx.strokeStyle = INK; ctx.lineWidth = w || LW; }
function acc(color, w) { ctx.strokeStyle = color; ctx.lineWidth = w || LW; }
function fillAcc(color) { ctx.fillStyle = color; }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

/* ---------- the machines ----------
   draw(s, u, P): s = cell size, u = loop phase 0..1, P = seeded params.
   Everything must stay inside ±0.46·s. */
const M = {
  gear(s, u, P) {
    const r = s * 0.20, tooth = s * 0.035, gap = r + tooth * 0.55 + r * 0.12;
    const rot = u * TAU * 2 * P.dir;
    ink(); line(-gap, 0, gap, 0);
    const wheels = [[-gap, rot], [gap, -rot + Math.PI / P.n]];
    for (const [cx, spin] of wheels) {
      ctx.save(); ctx.translate(cx, 0); ctx.rotate(spin); ink();
      circle(0, 0, r); ctx.stroke();
      for (let i = 0; i < P.n; i++) {
        const a = (i / P.n) * TAU;
        line(Math.cos(a) * r, Math.sin(a) * r, Math.cos(a) * (r + tooth), Math.sin(a) * (r + tooth));
      }
      ctx.restore();
      fillAcc(P.accent); circle(cx, 0, s * 0.055); ctx.fill();
      ink(); circle(cx, 0, s * 0.055); ctx.stroke();
    }
  },

  pendulum(s, u, P) {
    const top = -s * 0.40, L = s * 0.56;
    const th = P.amp * Math.sin(TAU * u + P.ph);
    const bx = L * Math.sin(th), by = top + L * Math.cos(th);
    ink();
    line(-s * 0.30, top, s * 0.30, top);
    line(-s * 0.24, top, -s * 0.24, top - s * 0.05);
    line(s * 0.24, top, s * 0.24, top - s * 0.05);
    line(0, top, bx, by);
    fillAcc(P.accent); circle(bx, by, s * 0.085); ctx.fill();
    ink(); circle(bx, by, s * 0.085); ctx.stroke();
  },

  cradle(s, u, P) {
    const top = -s * 0.38, L = s * 0.42, r = s * 0.068, n = 4;
    const xs = []; for (let i = 0; i < n; i++) xs.push((i - (n - 1) / 2) * r * 2.15);
    const sw = Math.sin(TAU * u);
    ink();
    line(-s * 0.32, top, s * 0.32, top);
    for (let i = 0; i < n; i++) {
      let a = 0;
      if (i === 0) a = P.amp * Math.max(0, sw);
      if (i === n - 1) a = P.amp * Math.max(0, -sw);
      const bx = xs[i] + L * Math.sin(a), by = top + L * Math.cos(a);
      line(xs[i], top, bx, by);
      if (i === 0 || i === n - 1) { fillAcc(P.accent); circle(bx, by, r); ctx.fill(); }
      ink(); circle(bx, by, r); ctx.stroke();
    }
  },

  seesaw(s, u, P) {
    const a = 0.30 * Math.sin(TAU * u + P.ph);
    ink();
    line(-s * 0.10, s * 0.30, s * 0.10, s * 0.30);
    line(0, s * 0.30, 0, s * 0.02);
    circle(0, s * 0.02, s * 0.025); ctx.stroke();
    ctx.save(); ctx.rotate(a);
    line(-s * 0.36, 0, s * 0.36, 0);
    fillAcc(P.accent);
    ctx.fillRect(s * 0.22, -s * 0.10, s * 0.10, s * 0.10);
    ink(); ctx.strokeRect(s * 0.22, -s * 0.10, s * 0.10, s * 0.10);
    ctx.restore();
  },

  pulley(s, u, P) {
    const r = s * 0.10, wy = -s * 0.28;
    const d = s * 0.20 * (2 / Math.PI) * Math.asin(Math.sin(TAU * u + P.ph));
    ink(); circle(0, wy, r); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * TAU + u * TAU * P.dir;
      line(0, wy, Math.cos(a) * r, wy + Math.sin(a) * r);
    }
    line(-r, wy, -r, wy + s * 0.18 + d);
    line(r, wy, r, wy + s * 0.18 - d);
    fillAcc(P.accent);
    ctx.fillRect(-r - s * 0.06, wy + s * 0.18 + d, s * 0.12, s * 0.12);
    ink();
    ctx.strokeRect(-r - s * 0.06, wy + s * 0.18 + d, s * 0.12, s * 0.12);
    circle(r, wy + s * 0.18 - d, s * 0.055); ctx.stroke();
  },

  pinwheel(s, u, P) {
    const rot = TAU * u * P.dir;
    ctx.save(); ctx.rotate(rot);
    for (let i = 0; i < 4; i++) {
      ctx.save(); ctx.rotate((i / 4) * TAU);
      if (i === 0) fillAcc(P.accent); else { ink(); }
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(s * 0.30, -s * 0.055); ctx.lineTo(s * 0.30, s * 0.055);
      ctx.closePath();
      if (i === 0) ctx.fill(); else ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
    ink(); line(0, s * 0.10, 0, s * 0.40);
    line(-s * 0.08, s * 0.40, s * 0.08, s * 0.40);
    fillAcc(P.accent); circle(0, 0, s * 0.045); ctx.fill();
    ink(); circle(0, 0, s * 0.045); ctx.stroke();
  },

  belt(s, u, P) {
    const r = s * 0.085, dx = s * 0.22;
    ink();
    line(-dx, -r, dx, -r); line(-dx, r, dx, r);
    ctx.beginPath(); ctx.arc(-dx, 0, r, Math.PI / 2, Math.PI * 1.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(dx, 0, r, -Math.PI / 2, Math.PI / 2); ctx.stroke();
    ctx.save(); ctx.setLineDash([s * 0.03, s * 0.045]);
    ctx.lineDashOffset = -u * s * 0.15 * P.dir;
    acc(P.accent); line(-dx, -r, dx, -r);
    ctx.restore();
    for (const cx of [-dx, dx]) {
      ink(); circle(cx, 0, r); ctx.stroke();
      const a = TAU * u * P.dir;
      line(cx, 0, cx + Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7);
    }
  },

  orbit(s, u, P) {
    ctx.save(); ctx.rotate(P.tilt);
    ink(); ctx.setLineDash([s * 0.02, s * 0.035]);
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.32, s * 0.19, 0, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    const a = TAU * u * P.dir + P.ph;
    const mx = Math.cos(a) * s * 0.32, my = Math.sin(a) * s * 0.19;
    ctx.restore();
    const rx = Math.cos(P.tilt), ry = Math.sin(P.tilt);
    const px = mx * rx - my * ry, py = mx * ry + my * rx;
    fillAcc(P.accent); circle(0, 0, s * 0.06); ctx.fill();
    ink(); circle(0, 0, s * 0.06); ctx.stroke();
    ink(); circle(px, py, s * 0.032); ctx.stroke();
  },

  metronome(s, u, P) {
    const a = P.amp * Math.sin(TAU * u + P.ph);
    ink();
    ctx.beginPath();
    ctx.moveTo(-s * 0.16, s * 0.34); ctx.lineTo(-s * 0.10, -s * 0.30);
    ctx.lineTo(s * 0.10, -s * 0.30); ctx.lineTo(s * 0.16, s * 0.34);
    ctx.closePath(); ctx.stroke();
    for (let i = -2; i <= 2; i++) {
      const t = i / 3, aa = t * 0.5;
      line(Math.sin(aa) * s * 0.22, -s * 0.24 + (1 - Math.cos(aa)) * s * 0.1,
           Math.sin(aa) * s * 0.26, -s * 0.24 + (1 - Math.cos(aa)) * s * 0.1 + s * 0.02);
    }
    ctx.save(); ctx.translate(0, s * 0.26); ctx.rotate(a);
    line(0, 0, 0, -s * 0.56);
    fillAcc(P.accent);
    ctx.fillRect(-s * 0.045, -s * 0.56 + P.wh * s, s * 0.09, s * 0.11);
    ink(); ctx.strokeRect(-s * 0.045, -s * 0.56 + P.wh * s, s * 0.09, s * 0.11);
    ctx.restore();
    ink(); circle(0, s * 0.26, s * 0.03); ctx.stroke();
  },

  spring(s, u, P) {
    const comp = 0.5 + 0.5 * Math.sin(TAU * u + P.ph);
    const top = -s * 0.34, bot = s * 0.10 + comp * s * 0.20;
    const coils = 6, wdt = s * 0.13;
    ink();
    line(-s * 0.20, top, s * 0.20, top);
    line(-s * 0.20, top, -s * 0.20, top - s * 0.06);
    line(s * 0.20, top, s * 0.20, top - s * 0.06);
    ctx.beginPath();
    for (let i = 0; i <= coils * 2; i++) {
      const y = top + (bot - top) * (i / (coils * 2));
      const x = (i % 2 === 0) ? -wdt : wdt;
      if (i === 0) ctx.moveTo(0, top); else ctx.lineTo(i === coils * 2 ? 0 : x, i === coils * 2 ? bot : y);
    }
    ctx.stroke();
    line(-s * 0.16, bot, s * 0.16, bot);
    fillAcc(P.accent);
    ctx.fillRect(-s * 0.09, bot, s * 0.18, s * 0.10);
    ink(); ctx.strokeRect(-s * 0.09, bot, s * 0.18, s * 0.10);
  },

  conveyor(s, u, P) {
    const y = s * 0.05, n = 5;
    ink();
    line(-s * 0.38, y - s * 0.07, s * 0.38, y - s * 0.07);
    line(-s * 0.38, y + s * 0.07, s * 0.38, y + s * 0.07);
    for (const cx of [-s * 0.38, s * 0.38]) {
      circle(cx, y, s * 0.07); ctx.stroke();
      const a = TAU * u * P.dir;
      line(cx, y, cx + Math.cos(a) * s * 0.045, y + Math.sin(a) * s * 0.045);
    }
    for (let i = 0; i < n; i++) {
      const x = (((i / n) + u * P.dir) % 1 + 1) % 1 * s * 0.72 - s * 0.36;
      if (i === P.hot) { fillAcc(P.accent); circle(x, y, s * 0.045); ctx.fill(); }
      ink(); circle(x, y, s * 0.045); ctx.stroke();
    }
  },

  abacus(s, u, P) {
    ink(); ctx.strokeRect(-s * 0.34, -s * 0.26, s * 0.68, s * 0.52);
    for (let rI = 0; rI < 2; rI++) {
      const y = -s * 0.13 + rI * s * 0.26;
      line(-s * 0.30, y, s * 0.30, y);
      const off = s * 0.10 * Math.sin(TAU * u + rI * Math.PI + P.ph);
      for (let b = 0; b < 4; b++) {
        const x = -s * 0.21 + b * s * 0.10 + off * (rI === 0 ? 1 : -1) * 0.6 + (rI ? s * 0.04 : -s * 0.04);
        if (b === P.hot && rI === 0) { fillAcc(P.accent); circle(x, y, s * 0.05); ctx.fill(); }
        ink(); circle(x, y, s * 0.05); ctx.stroke();
      }
    }
  },

  drip(s, u, P) {
    ink();
    line(0, -s * 0.40, 0, -s * 0.24);
    line(-s * 0.05, -s * 0.40, s * 0.05, -s * 0.40);
    line(-s * 0.05, -s * 0.40, -s * 0.05, -s * 0.34);
    line(s * 0.05, -s * 0.40, s * 0.05, -s * 0.34);
    const dy = -s * 0.22 + u * u * s * 0.44;
    const dr = s * (0.020 + 0.028 * u);
    fillAcc(P.accent);
    ctx.beginPath(); ctx.arc(0, dy, dr, 0, TAU); ctx.fill();
    ink();
    const cupT = s * 0.30;
    ctx.beginPath();
    ctx.moveTo(-s * 0.13, s * 0.10); ctx.lineTo(-s * 0.09, cupT);
    ctx.lineTo(s * 0.09, cupT); ctx.lineTo(s * 0.13, s * 0.10);
    ctx.stroke();
    ctx.globalAlpha = 0.55 * (1 - u);
    circle(0, s * 0.16, s * (0.03 + 0.09 * u)); ctx.stroke();
    ctx.globalAlpha = 1;
  },

  hammer(s, u, P) {
    const strike = Math.pow(Math.max(0, Math.sin(TAU * u + P.ph)), 3);
    const a = -0.9 + strike * 0.9;
    ink();
    ctx.fillRect(-s * 0.30, s * 0.22, s * 0.34, s * 0.12);
    ctx.strokeRect(-s * 0.30, s * 0.22, s * 0.34, s * 0.12);
    ctx.save(); ctx.translate(-s * 0.22, s * 0.22); ctx.rotate(a);
    line(0, 0, 0, -s * 0.42);
    ctx.save(); ctx.translate(0, -s * 0.42); ctx.rotate(-a);
    fillAcc(P.accent);
    ctx.fillRect(-s * 0.07, -s * 0.035, s * 0.14, s * 0.07);
    ink(); ctx.strokeRect(-s * 0.07, -s * 0.035, s * 0.14, s * 0.07);
    ctx.restore(); ctx.restore();
    ink(); circle(-s * 0.22, s * 0.22, s * 0.03); ctx.stroke();
  },

  elevator(s, u, P) {
    const y = s * 0.22 * Math.sin(TAU * u + P.ph);
    ink();
    line(-s * 0.20, -s * 0.38, -s * 0.20, s * 0.38);
    line(s * 0.20, -s * 0.38, s * 0.20, s * 0.38);
    line(-s * 0.20, -s * 0.38, s * 0.20, -s * 0.38);
    line(0, -s * 0.38, 0, y - s * 0.07);
    acc(P.accent); line(-s * 0.20, y, s * 0.20, y);
    ink(); ctx.strokeRect(-s * 0.20, y - s * 0.07, s * 0.40, s * 0.07);
  },

  fan(s, u, P) {
    ink(); circle(0, 0, s * 0.30); ctx.stroke();
    const rot = TAU * u * 2 * P.dir + P.ph;
    ctx.save(); ctx.rotate(rot);
    for (let i = 0; i < 3; i++) {
      ctx.save(); ctx.rotate((i / 3) * TAU);
      ink();
      ctx.beginPath(); ctx.ellipse(s * 0.15, 0, s * 0.13, s * 0.055, 0.5, 0, TAU); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
    fillAcc(P.accent); circle(0, 0, s * 0.05); ctx.fill();
    ink(); circle(0, 0, s * 0.05); ctx.stroke();
  },

  sweep(s, u, P) {
    const a = TAU * u * P.dir + P.ph;
    ink(); circle(0, 0, s * 0.30); ctx.stroke();
    circle(0, 0, s * 0.18); ctx.stroke();
    line(-s * 0.30, 0, s * 0.30, 0); line(0, -s * 0.30, 0, s * 0.30);
    acc(P.accent); line(0, 0, Math.cos(a) * s * 0.30, Math.sin(a) * s * 0.30);
    const ba = P.bph, br = s * 0.22;
    const d = ((a - ba) % TAU + TAU) % TAU;
    ctx.globalAlpha = Math.max(0, 1 - d / TAU);
    fillAcc(P.accent); circle(Math.cos(ba) * br, Math.sin(ba) * br, s * 0.035); ctx.fill();
    ctx.globalAlpha = 1;
  },

  bell(s, u, P) {
    const a = 0.45 * Math.sin(TAU * u + P.ph);
    ink();
    line(-s * 0.22, -s * 0.36, s * 0.22, -s * 0.36);
    line(-s * 0.18, -s * 0.36, -s * 0.18, -s * 0.30);
    line(s * 0.18, -s * 0.36, s * 0.18, -s * 0.30);
    ctx.save(); ctx.translate(0, -s * 0.30); ctx.rotate(a);
    line(0, 0, 0, -s * 0.06);
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.06);
    ctx.bezierCurveTo(-s * 0.16, -s * 0.02, -s * 0.14, s * 0.14, -s * 0.11, s * 0.14);
    ctx.lineTo(s * 0.11, s * 0.14);
    ctx.bezierCurveTo(s * 0.14, s * 0.14, s * 0.16, -s * 0.02, 0, -s * 0.06);
    ctx.stroke();
    line(-s * 0.11, s * 0.14, s * 0.11, s * 0.14);
    fillAcc(P.accent); circle(0, s * 0.17, s * 0.035); ctx.fill();
    ink(); circle(0, s * 0.17, s * 0.035); ctx.stroke();
    ctx.restore();
  }
};
const TYPES = Object.keys(M);

/* ---------- field ---------- */
let cells = [], cols = 0, rows = 0, cell = 110, ox = 0, oy = 0;
let seedStr = "7";
let fade = 1, fadeTarget = 1;
let hover = -1;

function buildField(seed) {
  seedStr = seed;
  const rng = mulberry32(hashSeed("tiny-machines-" + seed));
  cells = [];
  const n = cols * rows;
  for (let i = 0; i < n; i++) {
    let type, guard = 0;
    do {
      type = TYPES[(rng() * TYPES.length) | 0];
      guard++;
    } while (guard < 8 && (
      (i % cols > 0 && cells[i - 1].type === type) ||
      (i >= cols && cells[i - cols].type === type)));
    const noAccent = rng() < 0.22;
    cells.push({
      type,
      period: 2.0 + rng() * 1.6,
      phase: rng(),
      accent: noAccent ? null : ACCENTS[(rng() * ACCENTS.length) | 0],
      P: {
        dir: rng() < 0.5 ? -1 : 1,
        n: 6 + ((rng() * 3) | 0),
        amp: 0.30 + rng() * 0.25,
        ph: rng() * TAU,
        tilt: (rng() - 0.5) * 0.9,
        wh: rng() * 0.22,
        hot: (rng() * 5) | 0,
        bph: rng() * TAU
      }
    });
  }
  document.getElementById("capR").textContent = "click for a new set · seed " + seed;
}

function layout() {
  const target = W < 500 ? 96 : 118;
  cols = Math.max(2, Math.floor(W / target));
  rows = Math.max(2, Math.floor((H - 60) / target));
  cell = Math.min(W / cols, (H - 60) / rows);
  ox = (W - cell * cols) / 2;
  oy = (H - 60 - cell * rows) / 2 + 8;
  LW = Math.max(1, Math.min(2, cell * 0.016));
  if (cells.length !== cols * rows) buildField(seedStr);
}

/* ---------- interaction ---------- */
function reseed() {
  fadeTarget = 0;
  setTimeout(() => {
    buildField(String((Math.random() * 1e9) | 0));
    fadeTarget = 1;
  }, 260);
}
window.addEventListener("pointerdown", (e) => {
  if (e.target && e.target.closest && e.target.closest(".cap")) return;
  reseed();
});
window.addEventListener("pointermove", (e) => {
  const cx = Math.floor((e.clientX - ox) / cell), cy = Math.floor((e.clientY - oy) / cell);
  hover = (cx >= 0 && cy >= 0 && cx < cols && cy < rows) ? cy * cols + cx : -1;
});

/* ---------- main loop ---------- */
const qp = new URLSearchParams(location.search);
if (qp.get("seed")) seedStr = qp.get("seed"); else seedStr = "21";

let t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000;
  fade += (fadeTarget - fade) * 0.12;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.globalAlpha = Math.max(0, Math.min(1, fade));

  const s = cell * 0.86;
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    const cx = ox + (i % cols) * cell + cell / 2;
    const cy = oy + Math.floor(i / cols) * cell + cell / 2;
    if (i === hover) {
      ctx.fillStyle = "rgba(43,42,38,0.045)";
      ctx.beginPath(); ctx.arc(cx, cy, cell * 0.46, 0, TAU); ctx.fill();
    }
    const u = (((t / c.period) + c.phase) % 1 + 1) % 1;
    ctx.save();
    ctx.translate(cx, cy);
    const P = Object.assign({}, c.P, { accent: c.accent || INK });
    try { M[c.type](s, u, P); } catch (err) { /* never blank the field */ }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

resize();
buildField(seedStr);
requestAnimationFrame(frame);
</script>
