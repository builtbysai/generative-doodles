<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Panoptic Perceptron</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0B0E; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.971 "Panoptic Perceptron" (study #119 kyle-mcdonald, PP132 Terrapattern).
   Query-by-example over 64 abstract satellite tiles. Each tile owns an
   8-dimensional feature vector; its picture is DERIVED from the vector, and
   similarity is Euclidean distance on the same vector, so the ranking is
   honest to what you see. Every 20 s the perceptron re-ranks, the top 12
   winners slide into the slots around the query and brighten, losers recede
   dimmed, and the next query is drawn from the winners. */

// ---------- palette ----------
var GROUND = '#0A0B0E';
var TONES = ['#2A3328', '#3D4A3A', '#565A52', '#6B6F66', '#8A8D84'];
var INK = '#C9CFDB';
var MINT = '#7DF9C6';
var CYAN = '#4FD6FF';

// ---------- rng ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(a, b) {
  var h = (a | 0) ^ Math.imul(b | 0, 0x9E3779B1);
  h = Math.imul(h ^ (h >>> 13), 0x85EBCA6B);
  return (h ^ (h >>> 16)) >>> 0;
}

// ---------- the city ----------
// Feature vector -> picture mapping (recorded in process.md):
//   fv[0] blob count 0..4 and blob radii
//   fv[1] line family angle (fv[1] * PI)
//   fv[2] line family density 0..5 parallel strokes
//   fv[3] dot-grid density 0..3 (a fv[3]x fv[3] lattice of pips)
//   fv[4] curve count 0..2 arcs
//   fv[5] ink lightness: feature ink lerps from tile ground toward #C9CFDB
//   fv[6] ground tone index across TONES
//   fv[7] scatter: how far features stray from the tile centre
var N = 8, NT = 64, WINNERS = 12;
function makeCity(seed) {
  var rng = mulberry32(seed);
  var tiles = [];
  for (var i = 0; i < NT; i++) {
    var fv = [];
    for (var d = 0; d < 8; d++) fv.push(rng());
    var srng = mulberry32(hash2(seed, 1000 + i));
    var blobs = [], j;
    var nb = Math.round(fv[0] * 4);
    for (j = 0; j < nb; j++) blobs.push({ x: srng(), y: srng(), r: 0.10 + srng() * 0.20 });
    var curves = [];
    var nc = Math.round(fv[4] * 2);
    for (j = 0; j < nc; j++) curves.push({ x: srng(), y: srng(), r: 0.16 + srng() * 0.24, a0: srng() * 6.283, a1: 1.2 + srng() * 2.6 });
    tiles.push({
      id: i, fv: fv, blobs: blobs, curves: curves,
      tone: Math.min(4, Math.floor(fv[6] * 5)),
      jx: srng(), jy: srng()
    });
  }
  return tiles;
}
function hexLerp(h1, h2, t) {
  var a = [parseInt(h1.slice(1, 3), 16), parseInt(h1.slice(3, 5), 16), parseInt(h1.slice(5, 7), 16)];
  var b = [parseInt(h2.slice(1, 3), 16), parseInt(h2.slice(3, 5), 16), parseInt(h2.slice(5, 7), 16)];
  var r = Math.round(a[0] + (b[0] - a[0]) * t), g = Math.round(a[1] + (b[1] - a[1]) * t), bl = Math.round(a[2] + (b[2] - a[2]) * t);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
function dist(a, b) {
  var s = 0;
  for (var d = 0; d < 8; d++) { var v = a[d] - b[d]; s += v * v; }
  return Math.sqrt(s);
}

// ---------- ranking / layout ----------
// Ring slots around the query slot, nearest first (Chebyshev ring, then
// Euclidean, then angle) so the mosaic grows outward from the query.
function ringSlots(qs) {
  var qx = qs % N, qy = (qs / N) | 0, out = [];
  for (var s = 0; s < NT; s++) {
    if (s === qs) continue;
    var x = s % N, y = (s / N) | 0;
    var dx = x - qx, dy = y - qy;
    out.push({ s: s, ring: Math.max(Math.abs(dx), Math.abs(dy)), d: Math.sqrt(dx * dx + dy * dy), a: Math.atan2(dy, dx) });
  }
  out.sort(function (p, q) { return (p.ring - q.ring) || (p.d - q.d) || (p.a - q.a); });
  return out.map(function (o) { return o.s; });
}
// A cycle: { start, queryTile, querySlot, assign: tileId -> slot,
//            win: tileId -> bool, rankOf: tileId -> rank }
function computeCycle(citySeed, epoch, idx, prevWinners, forcedQuery, bias) {
  var tiles = makeCity(citySeed);
  var rng = mulberry32(hash2(citySeed ^ Math.imul(epoch + 1, 7919), 5000 + idx));
  var query;
  if (forcedQuery != null) query = forcedQuery;
  else if (prevWinners && prevWinners.length) query = prevWinners[Math.floor(rng() * prevWinners.length)];
  else query = Math.floor(rng() * NT);
  // The query keeps the slot it held at the end of the previous cycle if the
  // caller passes one in; default: its natural slot is chosen by caller.
  return { tiles: tiles, rng: rng, query: query, bias: bias || {} };
}
function layoutFor(cyc, querySlot) {
  var q = cyc.query, tiles = cyc.tiles;
  var scored = [];
  for (var i = 0; i < NT; i++) {
    if (i === q) continue;
    var dd = dist(tiles[i].fv, tiles[q].fv) - (cyc.bias[i] || 0);
    scored.push({ id: i, d: dd });
  }
  scored.sort(function (a, b) { return a.d - b.d; });
  var slots = ringSlots(querySlot);
  var assign = {}, win = {}, rankOf = {};
  assign[q] = querySlot; win[q] = true; rankOf[q] = -1;
  for (var k = 0; k < scored.length; k++) {
    assign[scored[k].id] = slots[k];
    win[scored[k].id] = k < WINNERS;
    rankOf[scored[k].id] = k;
  }
  var winners = scored.slice(0, WINNERS).map(function (s) { return s.id; });
  return { assign: assign, win: win, rankOf: rankOf, winners: winners };
}

// ---------- schedule ----------
// Cycles are 20 s: [0,2.5) slide, [2.5,20) hold. Cycle 0 starts from the
// natural grid (tile i in slot i) with a seeded first query; each later
// cycle's query is drawn from the previous cycle's winners, and the query
// tile carries its slot over (the mosaic re-forms around where it sits).
var CYCLE = 20, SLIDE = 2.5;
function buildSchedule(citySeed, epoch, startTime, startAssign, firstQuery, bias) {
  var cycles = [];
  var prevAssign = startAssign, prevWinners = null;
  return {
    at: function (t) {
      var idx = Math.floor((t - startTime) / CYCLE);
      while (cycles.length <= idx) {
        var k = cycles.length;
        var cyc = computeCycle(citySeed, epoch, k, prevWinners, k === 0 ? firstQuery : null, k === 0 ? bias : {});
        var qSlot = prevAssign[cyc.query];
        var lay = layoutFor(cyc, qSlot);
        cycles.push({
          start: startTime + k * CYCLE, query: cyc.query, querySlot: qSlot,
          from: prevAssign, to: lay.assign, win: lay.win, rankOf: lay.rankOf, tiles: cyc.tiles
        });
        prevAssign = lay.assign; prevWinners = lay.winners;
      }
      return cycles[idx];
    },
    tiles: makeCity(citySeed)
  };
}

var BASE_SEED = 971132;
var epoch = 0;
var citySeed = BASE_SEED;
var natural = {};
for (var ni = 0; ni < NT; ni++) natural[ni] = ni;
var sched = buildSchedule(citySeed, epoch, 0, natural, null, {});
var T0 = 50; // frame one: cycle 2, mid-hold (t = 2*20 + 10)
var queryFlash = -10; // last new-query sound/visual time (piece t)

// ---------- audio (lazy, guarded) ----------
var AC = null, humOsc = null;
function audio() {
  if (AC) return AC;
  try {
    var Ctx = (typeof AudioContext !== 'undefined') ? AudioContext :
      ((typeof webkitAudioContext !== 'undefined') ? webkitAudioContext : null);
    if (!Ctx) return null;
    AC = new Ctx();
    var g = AC.createGain(); g.gain.value = 0.015;
    humOsc = AC.createOscillator(); humOsc.type = 'sine'; humOsc.frequency.value = 55;
    var g2 = AC.createGain(); g2.gain.value = 0.5;
    humOsc.connect(g2); g2.connect(g); g.connect(AC.destination); humOsc.start();
  } catch (e) { AC = null; }
  return AC;
}
function blip(freq, t0, dur, vol, type) {
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
function sndArpeggio() { if (!AC) return; var t = AC.currentTime; for (var i = 0; i < 6; i++) blip(220 * Math.pow(1.335, i), t + i * 0.07, 0.18, 0.05); }
function sndChord() { if (!AC) return; var t = AC.currentTime; [262, 330, 392].forEach(function (f) { blip(f, t, 0.7, 0.035, 'triangle'); }); }
function sndSnap() { if (!AC) return; var t = AC.currentTime; blip(1800, t, 0.05, 0.06, 'square'); blip(900, t + 0.03, 0.07, 0.04, 'square'); }

// ---------- canvas ----------
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 300, VH = 300, DPR = 1;
function isPhone() {
  try {
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    if (sw < 700) return true;
  } catch (e) {}
  return VH > VW * 1.15;
}
function resize() {
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  VW = vv ? vv.width : window.innerWidth;
  VH = vv ? vv.height : window.innerHeight;
  DPR = Math.min((typeof window !== 'undefined' && window.devicePixelRatio) || 1, 2);
  canvas.width = Math.round(VW * DPR);
  canvas.height = Math.round(VH * DPR);
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);
resize();

// ---------- drawing ----------
function slotXY(slot, side, ox, oy) {
  var cell = side / N;
  return { x: ox + (slot % N) * cell, y: oy + ((slot / N) | 0) * cell, cell: cell };
}
function ease(u) { return u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u); }
function drawTile(tile, x, y, s, alpha) {
  var pad = s * 0.06, w = s - pad * 2;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = TONES[tile.tone];
  ctx.fillRect(x + pad, y + pad, w, w);
  ctx.save();
  ctx.beginPath(); ctx.rect(x + pad, y + pad, w, w); ctx.clip();
  var ink = hexLerp(TONES[tile.tone], INK, 0.25 + tile.fv[5] * 0.75);
  var inkDim = hexLerp(TONES[tile.tone], INK, 0.10 + tile.fv[5] * 0.30);
  var sc = (0.5 - tile.fv[7] * 0.28); // scatter radius factor
  var cx = x + s / 2, cy = y + s / 2;
  function px(u) { return cx + (u - 0.5) * 2 * sc * s; }
  function py(u) { return cy + (u - 0.5) * 2 * sc * s; }
  // blobs
  ctx.fillStyle = inkDim;
  for (var i = 0; i < tile.blobs.length; i++) {
    var b = tile.blobs[i];
    ctx.beginPath(); ctx.arc(px(b.x), py(b.y), b.r * s * 0.5, 0, 6.2832); ctx.fill();
  }
  // dot grid
  var g = Math.round(tile.fv[3] * 3);
  if (g > 0) {
    ctx.fillStyle = ink;
    for (var a = 0; a < g; a++) for (var b2 = 0; b2 < g; b2++) {
      ctx.beginPath();
      ctx.arc(x + s * (0.22 + 0.56 * (g === 1 ? 0.5 : a / (g - 1))), y + s * (0.22 + 0.56 * (g === 1 ? 0.5 : b2 / (g - 1))), Math.max(1, s * 0.022), 0, 6.2832);
      ctx.fill();
    }
  }
  // line family
  var nl = Math.round(tile.fv[2] * 5);
  if (nl > 0) {
    ctx.strokeStyle = ink; ctx.lineWidth = Math.max(1, s * 0.028);
    var ang = tile.fv[1] * Math.PI, dx = Math.cos(ang), dy = Math.sin(ang), nx = -dy, ny = dx;
    for (var li = 0; li < nl; li++) {
      var off = (nl === 1 ? 0 : (li / (nl - 1) - 0.5)) * s * 0.52;
      ctx.beginPath();
      ctx.moveTo(cx + nx * off - dx * s * 0.30, cy + ny * off - dy * s * 0.30);
      ctx.lineTo(cx + nx * off + dx * s * 0.30, cy + ny * off + dy * s * 0.30);
      ctx.stroke();
    }
  }
  // curves
  ctx.strokeStyle = ink; ctx.lineWidth = Math.max(1, s * 0.03);
  for (var ci = 0; ci < tile.curves.length; ci++) {
    var cu = tile.curves[ci];
    ctx.beginPath(); ctx.arc(px(cu.x), py(cu.y), cu.r * s * 0.5, cu.a0, cu.a0 + cu.a1); ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

var lastCycleIdx = -1, lastLockCycle = -1;
function draw(t) {
  canvas.style.width = VW + 'px';
  canvas.style.height = VH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var side = Math.min(VW, VH);
  var ox = (VW - side) / 2, oy = (VH - side) / 2;
  var cell = side / N;

  var cyc = sched.at(t);
  var ct = t - cyc.start;
  var idx = cyc.start;
  if (idx !== lastCycleIdx) {
    if (lastCycleIdx >= 0) { sndSnap(); sndArpeggio(); }
    lastCycleIdx = idx;
  }
  if (ct >= SLIDE && lastLockCycle !== idx) { lastLockCycle = idx; sndChord(); }

  var u = ease(ct / SLIDE);
  // positions + brightness per tile
  var pos = {}, bright = {};
  for (var i = 0; i < NT; i++) {
    var fs = cyc.from[i], ts = cyc.to[i];
    var fx = ox + (fs % N) * cell, fy = oy + ((fs / N) | 0) * cell;
    var tx = ox + (ts % N) * cell, ty = oy + ((ts / N) | 0) * cell;
    pos[i] = { x: fx + (tx - fx) * u, y: fy + (ty - fy) * u };
    var target = cyc.win[i] ? 1 : 0.25;
    var prevWin = (i === cyc.query) ? true : null;
    bright[i] = target; // brightness snaps with the win flag via slide blend below
    if (ct < SLIDE) {
      // blend from previous cycle brightness is not tracked per-tile here;
      // approximate with a global ease toward targets from mid value.
      bright[i] = 0.55 + (target - 0.55) * u;
    }
  }
  // distance lines (winners to query), strong during assembly, long faint tail
  var lineAlpha = 0;
  if (ct < SLIDE) lineAlpha = 0.2;
  else if (ct < SLIDE + 14) lineAlpha = 0.2 * (1 - (ct - SLIDE) / 14) * 0.6;
  if (lineAlpha > 0.004) {
    var qp = pos[cyc.query];
    ctx.strokeStyle = CYAN; ctx.globalAlpha = lineAlpha; ctx.lineWidth = 1;
    for (var w = 0; w < NT; w++) {
      if (w === cyc.query || !cyc.win[w]) continue;
      ctx.beginPath();
      ctx.moveTo(qp.x + cell / 2, qp.y + cell / 2);
      ctx.lineTo(pos[w].x + cell / 2, pos[w].y + cell / 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // tiles, losers first then winners then query
  var order = [];
  for (var o = 0; o < NT; o++) order.push(o);
  order.sort(function (a, b) {
    var wa = a === cyc.query ? 2 : (cyc.win[a] ? 1 : 0);
    var wb = b === cyc.query ? 2 : (cyc.win[b] ? 1 : 0);
    return wa - wb;
  });
  var tiles = sched.tiles;
  for (var oi = 0; oi < NT; oi++) {
    var id = order[oi];
    drawTile(tiles[id], pos[id].x, pos[id].y, cell, bright[id]);
  }
  // query outline (gentle pulse) + feature readout bars
  var q = cyc.query, qpos = pos[q];
  var pulse = 0.65 + 0.35 * Math.sin(t * 2.2);
  ctx.globalAlpha = pulse;
  ctx.strokeStyle = MINT; ctx.lineWidth = Math.max(2, cell * 0.045);
  ctx.strokeRect(qpos.x + 2, qpos.y + 2, cell - 4, cell - 4);
  ctx.globalAlpha = 1;
  // readout strip at the query tile's bottom edge
  var qt = tiles[q];
  var bw = cell * 0.11, bh = cell * 0.30, base = qpos.y + cell - cell * 0.10;
  ctx.fillStyle = 'rgba(10,11,14,0.72)';
  ctx.fillRect(qpos.x + cell * 0.14, base - bh - cell * 0.05, bw * 5 + cell * 0.16, bh + cell * 0.09);
  ctx.fillStyle = MINT;
  for (var bi = 0; bi < 5; bi++) {
    var h = Math.max(1.5, qt.fv[bi] * bh);
    ctx.fillRect(qpos.x + cell * 0.14 + cell * 0.04 + bi * (bw + cell * 0.02), base - h, bw, h);
  }
}

// ---------- interaction ----------
var pDown = null, pMoves = [], lastTap = -10, lastTapPos = null;
function piecePos(e) {
  var r = canvas.getBoundingClientRect();
  var cx = (e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0)) - r.left;
  var cy = (e.clientY != null ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0)) - r.top;
  return { x: cx, y: cy };
}
function tileAt(p, t) {
  var side = Math.min(VW, VH), ox = (VW - side) / 2, oy = (VH - side) / 2, cell = side / N;
  var cyc = sched.at(t);
  var u = ease(Math.min(1, Math.max(0, (t - cyc.start) / SLIDE)));
  for (var i = 0; i < NT; i++) {
    var fs = cyc.from[i], ts = cyc.to[i];
    var x = ox + ((fs % N) + ((ts % N) - (fs % N)) * u) * cell;
    var y = oy + (((fs / N) | 0) + (((ts / N) | 0) - ((fs / N) | 0)) * u) * cell;
    if (p.x >= x && p.x < x + cell && p.y >= y && p.y < y + cell) return i;
  }
  return null;
}
function now() { return T0 + elapsed(); }
var startStamp = null;
function elapsed() {
  if (startStamp == null) return 0;
  var n = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  return (n - startStamp) / 1000;
}
function restart(t, firstQuery, bias, assign) {
  epoch++;
  sched = buildSchedule(citySeed, epoch, t, assign, firstQuery, bias || {});
  lastCycleIdx = -1; lastLockCycle = -1;
}
function currentAssign(t) {
  var cyc = sched.at(t);
  return (t - cyc.start) < SLIDE ? cyc.from : cyc.to;
}
function onDown(e) {
  audio();
  if (AC && AC.resume) { try { AC.resume(); } catch (err) {} }
  pDown = piecePos(e); pMoves = [pDown];
}
function onMove(e) {
  if (!pDown) return;
  pMoves.push(piecePos(e));
}
function onUp(e) {
  if (!pDown) return;
  var t = now();
  var up = piecePos(e);
  var dx = up.x - pDown.x, dy = up.y - pDown.y;
  var dragLen = Math.sqrt(dx * dx + dy * dy);
  var side = Math.min(VW, VH);
  if (dragLen > side * 0.06) {
    // drag: paint similarity bias on crossed tiles
    var bias = {}, crossed = {};
    for (var i = 0; i < pMoves.length; i++) {
      var tid = tileAt(pMoves[i], t);
      if (tid != null) crossed[tid] = true;
    }
    var cnt = 0;
    for (var k in crossed) { bias[k] = 0.55; cnt++; }
    if (cnt >= 4) {
      var cyc = sched.at(t);
      restart(t, cyc.query, bias, currentAssign(t));
    }
  } else {
    // tap / double-tap
    if (lastTapPos && (t - lastTap) < 0.35 && Math.abs(up.x - lastTapPos.x) < 30 && Math.abs(up.y - lastTapPos.y) < 30) {
      citySeed = hash2(citySeed, epoch + 977) >>> 0;
      epoch++;
      sched = buildSchedule(citySeed, epoch, t, natural, null, {});
      lastCycleIdx = -1; lastLockCycle = -1;
      lastTap = -10; lastTapPos = null;
    } else {
      var tid2 = tileAt(up, t);
      if (tid2 != null) restart(t, tid2, {}, currentAssign(t));
      lastTap = t; lastTapPos = up;
    }
  }
  pDown = null; pMoves = [];
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', function () { pDown = null; pMoves = []; });

// ---------- run ----------
draw(T0); // frame one: synchronous, fixed offset, no wall clock
if (typeof requestAnimationFrame === 'function') {
  var rafLoop = function (ts) {
    if (startStamp == null) startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : ts;
    draw(T0 + elapsed());
    requestAnimationFrame(rafLoop);
  };
  requestAnimationFrame(rafLoop);
}
</script>
</body>
</html>
