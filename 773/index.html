<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Diamond</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #EFEFED; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict)
  var BLUE1 = [27, 79, 224];     // #1B4FE0 field light
  var BLUE2 = [34, 68, 204];     // #2244CC field base
  var DEEP  = [18, 48, 143];     // #12308F deeper blue shadow
  var BANDW = [245, 244, 240];   // #F5F4F0 white band
  var FLAREW = [255, 255, 255];  // #FFFFFF band flare
  var WALL  = [239, 239, 237];   // #EFEFED gallery wall

  function rgb(c, a) {
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function mix(c1, c2, t) {
    return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
  }
  function clamp(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }

  // mulberry32 seeded RNG
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Precomputed microsphere grain, normalized to the diamond bounding box
  // (u, v in -1..1 around the diamond center). Only points inside the
  // diamond (|u| + |v| <= 1) are kept.
  var GRAIN = [];
  (function buildGrain() {
    var rnd = mulberry32(773101);
    var n = 5200;
    for (var i = 0; i < n; i++) {
      var u = rnd() * 2 - 1;
      var v = rnd() * 2 - 1;
      if (Math.abs(u) + Math.abs(v) > 0.995) continue;
      GRAIN.push({
        u: u, v: v,
        r: 0.7 + rnd() * 1.6,       // px radius at reference scale
        thr: rnd(),                 // field-activation threshold (density class)
        a: 0.25 + rnd() * 0.75,
        white: rnd() < 0.62         // bead catches: warm white vs light blue
      });
    }
  })();

  // Precomputed diagonal brushwork, also normalized to the diamond box.
  var STROKES = [];
  (function buildStrokes() {
    var rnd = mulberry32(773202);
    var n = 640;
    for (var i = 0; i < n; i++) {
      var u = rnd() * 2 - 1;
      var v = rnd() * 2 - 1;
      if (Math.abs(u) + Math.abs(v) > 0.99) continue;
      STROKES.push({
        u: u, v: v,
        ang: -0.62 + (rnd() - 0.5) * 0.35,   // diagonal, hand-dragged jitter
        len: 0.05 + rnd() * 0.15,            // fraction of half-diagonal
        w: 1.6 + rnd() * 4.2,                // px weight at reference scale
        dark: rnd() < 0.45,                  // deep stroke vs light stroke
        a: 0.3 + rnd() * 0.7
      });
    }
  })();

  // Two viewer-position lobes, deliberately offset so the light travels.
  // Field activation: gaussian peak 1.0 at v = 0.30.
  function fieldAct(v) {
    var d = v - 0.30;
    return Math.exp(-(d * d) / (2 * 0.16 * 0.16));
  }
  // White band presence: gaussian peak at v = 0.68 over a 0.10 floor,
  // so the band is a faint rumor at the field's peak and ignites later.
  function bandAct(v) {
    var d = v - 0.68;
    return 0.10 + 0.90 * Math.exp(-(d * d) / (2 * 0.13 * 0.13));
  }

  // Idle sway: 22 s cycle, v = 0.30 at t = 0 (the field's peak),
  // ranging 0..0.68 so the sway reaches the band's peak exactly.
  function swayV(t) {
    return clamp(0.30 + 0.38 * Math.sin((Math.PI * 2 * t) / 22), 0, 1);
  }

  // Interaction state. v(t) is a closed-form function of recorded samples.
  var drag = null;      // {x0, v0, w} while dragging
  var dragV = 0.30;     // current v while dragging
  var release = null;   // {t, v} at last release

  function viewerV(t) {
    if (drag) return dragV;
    var base = swayV(t);
    if (release) {
      var dt = t - release.t;
      var k = Math.exp(-dt / 1.6);
      if (k < 0.001) { release = null; return base; }
      return base + (release.v - swayV(release.t)) * k;
    }
    return base;
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function viewSize() {
    var vv = window.visualViewport;
    if (vv && vv.width && vv.height) return { w: vv.width, h: vv.height };
    return { w: window.innerWidth || 800, h: window.innerHeight || 600 };
  }

  function isPhone(w, h) {
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    if (Math.min(sw, sh) < 700) return true;
    return h > w * 1.15;
  }

  function diamondPath(cx, cy, hd) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - hd);
    ctx.lineTo(cx + hd, cy);
    ctx.lineTo(cx, cy + hd);
    ctx.lineTo(cx - hd, cy);
    ctx.closePath();
  }

  function draw(t) {
    var s = viewSize();
    var w = Math.max(50, Math.round(s.w));
    var h = Math.max(50, Math.round(s.h));
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    var phone = isPhone(w, h);

    // Gallery wall
    ctx.fillStyle = rgb(WALL, 1);
    ctx.fillRect(0, 0, w, h);

    var v = clamp(viewerV(t), 0, 1);
    var f = fieldAct(v);       // 0..1 field activation
    var b = bandAct(v);        // 0.10..1 band presence

    // Diamond geometry: full height ~65% of frame height, width-capped
    // on narrow screens so the points keep a margin. Centered, a touch high.
    var diag = Math.min(h * 0.65, w * (phone ? 0.88 : 0.92));
    var hd = diag / 2;
    var cx = w / 2;
    var cy = h * 0.49;

    // Hover bevel shadow: layered offset diamonds of the deep blue at
    // low alpha, shifted down-left so the shadow peeks under the
    // lower-left edges only. (Palette holds no gray; the deep blue at
    // these alphas reads as the painting's own shadow on the wall.)
    var shScale = hd / 330;
    var shLayers = [
      { dx: -7, dy: 10, grow: 7, a: 0.045 },
      { dx: -5, dy: 7,  grow: 4, a: 0.055 },
      { dx: -3, dy: 4,  grow: 2, a: 0.065 }
    ];
    for (var si = 0; si < shLayers.length; si++) {
      var SL = shLayers[si];
      ctx.fillStyle = rgb(DEEP, SL.a);
      diamondPath(cx + SL.dx * shScale, cy + SL.dy * shScale, hd + SL.grow * shScale);
      ctx.fill();
    }

    // Everything painted lives inside the diamond.
    ctx.save();
    diamondPath(cx, cy, hd);
    ctx.clip();

    // Base field
    ctx.fillStyle = rgb(BLUE2, 1);
    ctx.fillRect(cx - hd, cy - hd, diag, diag);

    // Emitted-light body: concentric diamonds, layered flat alpha,
    // centered a little above middle so the light sits high in the
    // painting. Center layers accumulate toward the lighter blue;
    // strength follows the field activation f.
    var LC = 14;
    var lightCx = cx;
    var lightCy = cy - hd * 0.10;
    for (var li = LC; li >= 1; li--) {
      var sc = li / LC;
      var lcol = mix(DEEP, BLUE1, 1 - sc * 0.85);
      ctx.fillStyle = rgb(lcol, 0.085 + 0.10 * f);
      diamondPath(lightCx, lightCy, hd * sc);
      ctx.fill();
    }
    // Lower shade: five flat slices deepening toward the bottom vertex,
    // grounding the field so it reads as a painting, not a screen.
    var SH = 5;
    for (var hi2 = 0; hi2 < SH; hi2++) {
      var sy = cy + hd * (0.35 + (hi2 / SH) * 0.65);
      ctx.fillStyle = rgb(DEEP, 0.05 + 0.035 * hi2 + 0.03 * f * hi2);
      ctx.fillRect(cx - hd, sy, diag, hd * 0.65 / SH + 1);
    }
    // Quiet-state flatten: when the field is asleep, a base-blue wash
    // levels the light layers back toward a single calm cobalt.
    if (f < 0.98) {
      ctx.fillStyle = rgb(BLUE2, (1 - f) * 0.45);
      ctx.fillRect(cx - hd, cy - hd, diag, diag);
    }

    // Brushwork: diagonal strokes, revealed as luminance climbs.
    // Reveal factor is global (field activation) times a spatial factor
    // that favors the lit upper-center of the diamond.
    var reveal = clamp((f - 0.30) / 0.70, 0, 1);
    if (reveal > 0.01) {
      var strokeScale = hd / 330;
      for (var j = 0; j < STROKES.length; j++) {
        var st = STROKES[j];
        var distN = Math.min(1, Math.sqrt(st.u * st.u + (st.v + 0.10) * (st.v + 0.10)));
        var a = st.a * reveal * (1 - 0.45 * distN) * 0.16;
        if (a < 0.004) continue;
        ctx.strokeStyle = rgb(st.dark ? DEEP : BLUE1, a);
        ctx.lineWidth = Math.max(0.6, st.w * strokeScale);
        ctx.lineCap = 'round';
        var sxp = cx + st.u * hd;
        var syp = cy + st.v * hd;
        var sl = st.len * hd;
        ctx.beginPath();
        ctx.moveTo(sxp, syp);
        ctx.lineTo(sxp + Math.cos(st.ang) * sl, syp + Math.sin(st.ang) * sl);
        ctx.stroke();
      }
    }

    // Microsphere grain: each bead has a seeded activation threshold,
    // so the grain wakes density-class by density-class as f climbs,
    // and is fully awake at the field's peak (frame one).
    var grainScale = hd / 330;
    for (var g = 0; g < GRAIN.length; g++) {
      var pt = GRAIN[g];
      var vis = clamp((f - pt.thr * 0.85) / 0.15, 0, 1);
      var ga = pt.a * (0.10 + 0.90 * vis) * (0.25 + 0.75 * f) * 0.55;
      if (ga < 0.006) continue;
      ctx.fillStyle = rgb(pt.white ? BANDW : BLUE1, ga);
      var gr = Math.max(0.5, pt.r * grainScale);
      ctx.fillRect(cx + pt.u * hd - gr / 2, cy + pt.v * hd - gr / 2, gr, gr);
    }

    // White inner band: a straight vertical stripe down the middle of
    // the frame, NOT rotated with the canvas. Drawn in vertical slices
    // under a sine profile so its edges feather into the blue.
    var bandW = Math.max(6, diag * 0.046);
    var bandX = cx - bandW / 2;
    // Soft halo behind the band at high presence.
    if (b > 0.35) {
      var haloW = bandW * 3.2;
      var HSL = 20;
      for (var qi = 0; qi < HSL; qi++) {
        var qu = (qi + 0.5) / HSL;
        var qprof = Math.pow(Math.sin(Math.PI * clamp(qu, 0, 1)), 1.4);
        ctx.fillStyle = rgb(BANDW, (b - 0.35) * 0.20 * qprof);
        ctx.fillRect(cx - haloW / 2 + (qi / HSL) * haloW, cy - hd, haloW / HSL + 1, diag);
      }
    }
    var bandCol = mix(BANDW, FLAREW, b);
    var BSL = 36;
    for (var bi = 0; bi < BSL; bi++) {
      var bu = (bi + 0.5) / BSL;
      var bedge = Math.pow(Math.sin(Math.PI * clamp(bu, 0, 1)), 0.6);
      ctx.fillStyle = rgb(bandCol, b * (0.22 + 0.78 * bedge));
      ctx.fillRect(bandX + (bi / BSL) * bandW, cy - hd, bandW / BSL + 1, diag);
    }

    ctx.restore();

    // Hairline painting edge so the diamond holds against the wall.
    ctx.strokeStyle = rgb(DEEP, 0.22);
    ctx.lineWidth = 1;
    diamondPath(cx, cy, hd);
    ctx.stroke();
  }

  // Frame one: synchronous draw at t = 0 (v = 0.30, field at its peak,
  // grain awake, band present but quiet).
  draw(0);

  var startStamp = null;
  var lastT = 0;
  function frame(now) {
    if (startStamp === null) startStamp = now;
    lastT = (now - startStamp) / 1000;
    draw(lastT);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(frame);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(frame);
  }

  function onResize() { draw(lastT); }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);

  // Drag horizontally = the viewer's body moving across the painting.
  var dragging = false;
  function evtX(e) {
    if (e.touches && e.touches.length) return e.touches[0].clientX;
    return e.clientX;
  }
  function down(e) {
    dragging = true;
    var s = viewSize();
    drag = { x0: evtX(e), v0: viewerV(lastT), w: s.w };
    dragV = drag.v0;
    release = null;
  }
  function move(e) {
    if (!dragging || !drag) return;
    var dx = evtX(e) - drag.x0;
    dragV = clamp(drag.v0 + dx / Math.max(1, drag.w), 0, 1);
    draw(lastT);
  }
  function up() {
    if (!dragging) return;
    dragging = false;
    release = { t: lastT, v: dragV };
    drag = null;
  }
  canvas.addEventListener('pointerdown', down);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('mousedown', down);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', up);
  canvas.addEventListener('touchstart', down, { passive: true });
  canvas.addEventListener('touchmove', move, { passive: true });
  canvas.addEventListener('touchend', up);
})();
</script>
</body>
</html>
