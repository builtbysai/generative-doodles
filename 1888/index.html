<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Text Seeds the Piece</title>
<style>
html, body { margin: 0; padding: 0; background: #0E0E0C; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* The Text Seeds the Piece: one line of poetry advances left to right
   across a dark field, one word at a time. Each word releases particles
   whose count equals its syllable count: single-syllable words drop
   heavy single orbs, polysyllabic words scatter light shards. Halfway
   along the line the delivery crosses the parola-canto threshold and
   the particles change state, from drifting amber dots (speech) to
   ringing teal orbits (song). The text is the compositional seed:
   denser text, denser motion. Watch only. */
var TAU = Math.PI * 2;
var BG = '#0E0E0C';
var BONE = '#EDE6D6';
var AMBER = '#D9A441';
var TEAL = '#2E7F7A';
var TEAL_SOFT = '#4FA39D';
var PLATE = '#121210';
var PLATE_LINE = 'rgba(217,164,65,0.45)';
var TITLE_INK = '#EDE6D6';
var HINT_INK = '#D9A441';
var SEED0 = 1888;
var FRAME_T = 6.5;       /* fixed phase: mid-line, 7 of 9 words released,
                            threshold crossed, both states visible */
var RELEASE_GAP = 1.0;   /* seconds between word releases */
var SONG_AFTER = 8;      /* cumulative syllables at which song begins */
/* The poem line: an original invented line, 9 words. Syllable counts
   are asserted by the parser below, not hand-counted at draw time. */
var LINE = ['Silent', 'evening', 'gathers', 'over', 'the',
            'listening', 'garden', 'walls', 'soft'];
/* Words whose vowel-group count needs a nudge, so the parser stays
   honest about its own limits instead of silently miscounting. */
var SYLLABLE_FIX = { 'evening': 2, 'listening': 3, 'gathers': 2 };
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* ---- syllable parser: vowel groups, silent-e trim, small fixes ---- */
function syllables(word) {
  var w = word.toLowerCase().replace(/[^a-z]/g, '');
  if (SYLLABLE_FIX[w]) return SYLLABLE_FIX[w];
  var groups = w.replace(/[^aeiouy]+/g, ' ').trim().split(/\s+/);
  var n = groups.filter(function (g) { return g.length > 0; }).length;
  if (w.length > 2 && w.charAt(w.length - 1) === 'e') n -= 1;
  if (n < 1) n = 1;
  return n;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- deterministic geometry: words, release times, particles ---- */
var words = [];      /* {text, syl, x, cx, released, song, cumSyl} */
var particles = [];  /* {word, song, x, y, ax, ay, r, orb, ang, spd, sway, ph, born, heavy} */
var totalSyl = 0;
(function buildGeometry() {
  var rng = mulberry32(SEED0);
  var i, j, cum = 0;
  for (i = 0; i < LINE.length; i++) {
    var syl = syllables(LINE[i]);
    var song = cum >= SONG_AFTER;
    words.push({
      text: LINE[i], syl: syl, x: 0, cx: 0,
      released: i * RELEASE_GAP, song: song, cumSyl: cum
    });
    cum += syl;
    /* each word releases exactly its syllable count of particles */
    for (j = 0; j < syl; j++) {
      var heavy = syl === 1;
      particles.push({
        word: i, song: song,
        x: 0, y: 0, ax: 0, ay: 0,
        r: heavy ? 3.4 + rng() * 1.2 : 1.1 + rng() * 1.1,
        orb: 0.020 + rng() * 0.030,
        ang: rng() * TAU,
        spd: 0.35 + rng() * 0.45,
        sway: 0.008 + rng() * 0.016,
        ph: rng() * TAU,
        born: i * RELEASE_GAP,
        heavy: heavy,
        vx: 0, vy: 0
      });
    }
  }
  totalSyl = cum;
})();
/* Word x positions depend on measured text width, so they are laid out
   per frame size: the line is centered, words spaced by a fixed gap. */
function layoutWords(R) {
  var fs = R.s * 0.034;
  var gap, total, i;
  function measure(f) {
    ctx.font = f + 'px monospace';
    var t = 0;
    for (var k = 0; k < words.length; k++) t += ctx.measureText(words[k].text).width;
    return t + f * 0.9 * (words.length - 1);
  }
  /* shrink the line until it fits the field with margins kept */
  total = measure(fs);
  while (total > R.w * 0.90 && fs > 8) { fs *= 0.94; total = measure(fs); }
  gap = fs * 0.9;
  var x = R.ox + (R.w - total) / 2;
  for (i = 0; i < words.length; i++) {
    words[i].x = x;
    words[i].cx = x + ctx.measureText(words[i].text).width / 2;
    x += ctx.measureText(words[i].text).width + gap;
  }
  return fs;
}
/* Place a particle at its birth: just under its word, then let the
   simulation move it. Orbit anchors sit below the text line. */
function seedParticle(p, R, fs) {
  var w = words[p.word];
  var spread = fs * 0.9;
  p.x = w.cx + (mulberry32(SEED0 + p.word * 31 + Math.round(p.r * 100))() * 2 - 1) * spread * 0.25;
  p.y = R.oy + R.h * 0.40;
  p.ax = w.cx;
  p.ay = R.oy + R.h * 0.40 + fs * 1.1 + p.orb * R.s * 1.6;
  p.ang = p.ph;
  p.vx = 0; p.vy = 0;
}
/* One fixed simulation step. Speech particles drift down with a slow
   sway; song particles ring their orbit anchor. All motion is slow by
   construction, well under the 14 Hz flicker bound. */
function stepSim(dt, t, R, fs) {
  var i, p, w;
  for (i = 0; i < particles.length; i++) {
    p = particles[i];
    if (t < p.born) continue;
    w = words[p.word];
    if (p.song) {
      p.ang += p.spd * dt * TAU * 0.14;
      var rr = p.orb * R.s;
      p.x = p.ax + Math.cos(p.ang) * rr;
      p.y = p.ay + Math.sin(p.ang) * rr * 0.62;
    } else {
      var age = t - p.born;
      var fall = (p.heavy ? 16 : 11) * (R.s / 900);   /* px per second */
      p.y += fall * dt;
      p.x += Math.sin(age * 0.6 + p.ph) * p.sway * R.s * dt;
      if (p.y > R.oy + R.h * 0.92) p.y = R.oy + R.h * 0.40;
    }
  }
}
/* Warm the field before frame one: fixed steps from t = 0 to FRAME_T,
   so the line is mid-advance with both states already in motion. */
function warmup(R, fs) {
  var i, p;
  for (i = 0; i < particles.length; i++) seedParticle(particles[i], R, fs);
  var t = 0;
  for (var s = 0; s < 130; s++) { stepSim(0.05, t, R, fs); t += 0.05; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: full-bleed on phones, a centered square on
   desktop. The page ground is the piece's own ink black either way. */
function fieldRect() {
  if (isPhone) return { ox: 0, oy: 0, s: Math.min(VW, VH), w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { ox: (VW - s) / 2, oy: (VH - s) / 2, s: s, w: s, h: s };
}
function drawPlates(R) {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Text Seeds the Piece').width > R.w - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Text Seeds the Piece').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 03 · 14').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = R.ox + 12, plateY = R.oy + 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Text Seeds the Piece', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 03 · 14', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the text seed the field.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = R.ox + 12;
  var hintPlateY = R.oy + R.h - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
var warmed = false;
function draw() {
  size();
  var R = fieldRect();
  var fs = layoutWords(R);
  if (!warmed) { warmup(R, fs); warmed = true; }
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, VW, VH);
  var textY = R.oy + R.h * 0.36;
  /* faint rule lines marking the text band, wide margins kept clear */
  ctx.strokeStyle = rgba(BONE, 0.07);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(R.ox + R.w * 0.08, textY - fs * 1.1);
  ctx.lineTo(R.ox + R.w * 0.92, textY - fs * 1.1);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(R.ox + R.w * 0.08, textY + fs * 1.1);
  ctx.lineTo(R.ox + R.w * 0.92, textY + fs * 1.1);
  ctx.stroke();
  /* the poem line: released words in bone, unreleased words dimmed;
     no word is singled out, there is no karaoke highlight */
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.font = fs + 'px monospace';
  var i, w;
  for (i = 0; i < words.length; i++) {
    w = words[i];
    var on = phaseT >= w.released;
    ctx.fillStyle = on ? BONE : rgba(BONE, 0.22);
    ctx.fillText(w.text, w.x, textY);
  }
  /* song orbit rings, drawn faintly under the orbiting particles */
  var p;
  for (i = 0; i < particles.length; i++) {
    p = particles[i];
    if (!p.song || phaseT < p.born) continue;
    ctx.strokeStyle = rgba(TEAL, 0.16);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(p.ax + p.orb * R.s, p.ay);
    ctx.ellipse(p.ax, p.ay, p.orb * R.s, p.orb * R.s * 0.62, 0, 0, TAU);
    ctx.stroke();
  }
  /* particles: amber drifters (speech), teal orbiters (song) */
  for (i = 0; i < particles.length; i++) {
    p = particles[i];
    if (phaseT < p.born) continue;
    var rr = p.r * (R.s / 720);
    var px = p.x, py = p.y;
    if (p.song) {
      var glow = 0.55 + 0.30 * Math.sin(phaseT * 0.9 + p.ph);
      ctx.fillStyle = rgba(TEAL_SOFT, glow);
      ctx.beginPath();
      ctx.moveTo(px + rr * 1.6, py);
      ctx.arc(px, py, Math.max(1.0, rr * 1.6), 0, TAU);
      ctx.fill();
      ctx.fillStyle = TEAL;
      ctx.beginPath();
      ctx.moveTo(px + rr, py);
      ctx.arc(px, py, Math.max(1.0, rr), 0, TAU);
      ctx.fill();
    } else {
      var age = phaseT - p.born;
      var fade = age < 0.4 ? age / 0.4 : 1;
      ctx.fillStyle = rgba(AMBER, 0.35 + 0.55 * fade);
      ctx.beginPath();
      ctx.moveTo(px + rr, py);
      ctx.arc(px, py, Math.max(1.0, rr), 0, TAU);
      ctx.fill();
    }
  }
  drawPlates(R);
}
/* ---- frame one: fixed phase t = 6.5 s, warmed 130 steps, seed 1888 ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var R = fieldRect();
      var fs = layoutWords(R);
      stepSim(dt, phaseT, R, fs);
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
