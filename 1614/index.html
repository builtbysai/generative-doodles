<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink on Paper, One Pen</title>
<style>
html, body { margin: 0; padding: 0; background: #141210; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = [245, 241, 232];
var INK = [26, 42, 107];
var TABLE = [20, 18, 16];
var DRAW_S = 45;          /* one sheet plots over 45 seconds */
var PHASE = 22.5;         /* seconds of plotting already done at frame one: fixed phase, about half the field, so the thumbnail shows a substantial partial plot */
var SEEDS = [1614001, 1614007, 1614013, 1614029, 1614049, 1614077];
var FIELD = 1000;         /* drawing space is 1000 x 1000 units */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false, lastT = 0, startT = null;
var sheetIndex = 0, sheetStartT = 0;
var STROKES = [], TOTAL_LEN = 0;

function arcPts(cx, cy, r, a0, a1, n) {
  var pts = [];
  for (var i = 0; i <= n; i++) {
    var a = a0 + (a1 - a0) * (i / n);
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pts;
}
function toneAt(x, y, p1, p2) {
  var d = 0.5 + 0.45 * Math.sin(x * 0.004 + p1) * Math.cos(y * 0.005 + p2)
        + 0.25 * ((x + y) / 2000 - 0.5);
  return clamp(d, 0, 1);
}
/* Build the stroke list for one sheet: scallop outlines + hatch arcs,
   ordered row by row, left to right, for continuous plotting. */
function buildStrokes(seed) {
  var rng = mulberry32(seed);
  var strokes = [];
  var R = 82 * (0.94 + rng() * 0.12);
  var colGap = 1.12 * R, rowGap = 0.60 * R;
  var p1 = rng() * TAU, p2 = rng() * TAU;
  var m = 46; /* field margin inside the 1000-wide drawing space */
  var row = 0, wobRow = -1, wobCol = -1, lastCx = 0, lastCy = 0;
  var rows = [];
  for (var y = m + R * 0.5; y <= FIELD - m; y += rowGap, row++) {
    var off = (row % 2 === 1) ? colGap / 2 : 0;
    var cols = [];
    for (var x = m + R * 0.5 + off; x <= FIELD - m; x += colGap) cols.push(x);
    rows.push({ y: y, xs: cols });
  }
  wobRow = rows.length - 1;
  wobCol = rows[wobRow].xs.length - 1;
  var idx = 0;
  for (var ri = 0; ri < rows.length; ri++) {
    var ry = rows[ri].y, xs = rows[ri].xs;
    for (var ci = 0; ci < xs.length; ci++) {
      var cx = xs[ci], cy = ry;
      lastCx = cx; lastCy = cy;
      var wob = (ri === wobRow && ci === wobCol);
      /* outline: dome arc, bulging upward from its baseline */
      strokes.push({ pts: arcPts(cx, cy, R, Math.PI, TAU, 26), ph: rng() * TAU, wob: false, idx: idx++ });
      /* hatch: concentric inner arcs, count set by the tone field */
      var density = toneAt(cx, cy, p1, p2);
      var nHatch = 1 + Math.floor(density * 4);
      for (var k = 0; k < nHatch; k++) {
        var hr = R * (0.78 - k * 0.16);
        if (hr < 8) break;
        strokes.push({ pts: arcPts(cx, cy, hr, Math.PI + 0.15, TAU - 0.15, 16), ph: rng() * TAU, wob: wob, idx: idx++ });
      }
    }
  }
  /* measure lengths and cumulative plot order */
  var total = 0;
  for (var si = 0; si < strokes.length; si++) {
    var st = strokes[si], len = 0, pts = st.pts;
    for (var pi = 1; pi < pts.length; pi++) {
      len += Math.hypot(pts[pi][0] - pts[pi - 1][0], pts[pi][1] - pts[pi - 1][1]);
    }
    st.len = len; st.cum = total; total += len;
  }
  return { strokes: strokes, total: total, wobAt: [lastCx, lastCy] };
}
function loadSheet(i) {
  var built = buildStrokes(SEEDS[i % SEEDS.length]);
  STROKES = built.strokes;
  TOTAL_LEN = built.total;
}
loadSheet(0);

function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function flushGroup(g, st, distAlong, ox, oy, sc, baseW) {
  if (g.length < 2) return;
  ctx.beginPath();
  for (var i = 0; i < g.length; i++) {
    var sx = ox + g[i][0] * sc + (st.wob ? 1.5 : 0);
    var sy = oy + g[i][1] * sc;
    if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
  }
  /* slight pressure wobble: closed-form width from distance along the stroke */
  ctx.lineWidth = baseW * (1 + 0.10 * Math.sin(distAlong * 0.30 + st.ph));
  ctx.stroke();
}
/* Draw the first `upto` units of one stroke, in small groups so the pen
   width can wobble along its length. */
function strokeUpTo(st, upto, ox, oy, sc, baseW) {
  var pts = st.pts, n = pts.length;
  if (upto <= 0 || n < 2) return;
  var acc = 0, px = pts[0][0], py = pts[0][1];
  var group = [[px, py]], groupDist = 0;
  for (var i = 1; i < n; i++) {
    var x = pts[i][0], y = pts[i][1];
    var segLen = Math.hypot(x - px, y - py);
    if (acc + segLen > upto) {
      var k = (upto - acc) / segLen;
      group.push([px + (x - px) * k, py + (y - py) * k]);
      flushGroup(group, st, groupDist, ox, oy, sc, baseW);
      return;
    }
    group.push([x, y]);
    if (group.length >= 6) {
      flushGroup(group, st, groupDist, ox, oy, sc, baseW);
      group = [[x, y]];
      groupDist = acc + segLen;
    }
    acc += segLen; px = x; py = y;
  }
  flushGroup(group, st, groupDist, ox, oy, sc, baseW);
}
function draw(t) {
  lastT = t;
  size();
  ctx.fillStyle = rgba(TABLE, 1);
  ctx.fillRect(0, 0, VW, VH);
  var side = 0.85 * Math.min(VW, VH);
  var px = (VW - side) / 2, py = (VH - side) / 2;
  var margin = 0.045 * side;
  var ox = px + margin, oy = py + margin;
  var sc = (side - 2 * margin) / FIELD;
  var baseW = Math.max(1, 0.0021 * side);
  /* sheet clock: fixed PHASE means frame one is 22.5 s into the plot */
  var tSheet = t - sheetStartT;
  var effT = tSheet + PHASE;
  var progress = clamp(effT / DRAW_S, 0, 1);
  var dist = TOTAL_LEN * progress;
  /* paper breathing after completion: 0.5% scale oscillation, closed-form */
  var restT = effT - DRAW_S, breathe = 1;
  if (restT > 0) breathe = 1 + 0.005 * Math.sin(TAU * restT / 9) * Math.min(1, restT / 2);
  var drawn = 0, complete = progress >= 1;
  ctx.save();
  ctx.translate(px + side / 2, py + side / 2);
  ctx.scale(breathe, breathe);
  ctx.translate(-(px + side / 2), -(py + side / 2));
  ctx.fillStyle = rgba(PAPER, 1);
  ctx.fillRect(px, py, side, side);
  ctx.strokeStyle = rgba(INK, 1);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (var si = 0; si < STROKES.length; si++) {
    var st = STROKES[si];
    if (dist <= st.cum) break;
    var upto = Math.min(st.len, dist - st.cum);
    strokeUpTo(st, upto, ox, oy, sc, baseW);
    drawn++;
  }
  ctx.restore();
  /* labels on the dark table, in paper color */
  var titlePx = isPhone ? 15 : 17;
  var smallPx = isPhone ? 11 : 12;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = rgba(PAPER, 0.85);
  ctx.fillText('Ink on Paper, One Pen', VW / 2, Math.max(8, VH * 0.02));
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(PAPER, 0.55);
  ctx.fillText('2006 · 06 · 13', VW / 2, Math.max(8, VH * 0.02) + titlePx + 5);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(PAPER, 0.6);
  ctx.fillText('Tap for a new sheet.', VW / 2, VH - smallPx - 12);
  if (typeof window !== 'undefined') {
    window.__p1614 = {
      sheet: sheetIndex, seed: SEEDS[sheetIndex % SEEDS.length],
      tSheet: tSheet, effT: effT, progress: progress,
      drawn: drawn, total: STROKES.length, complete: complete,
      breathe: breathe, VW: VW, VH: VH, phone: isPhone
    };
  }
}
function onTap(e) {
  sheetIndex = (sheetIndex + 1) % SEEDS.length;
  sheetStartT = lastT;
  loadSheet(sheetIndex);
  draw(lastT);
}
canvas.addEventListener('pointerdown', onTap);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
  window.__draw1614 = draw;
  window.__tap1614 = function () { onTap({}); };
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
