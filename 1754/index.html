<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom</title>
<style>
html, body { margin: 0; padding: 0; background: #F7F5EF; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#F7F5EF';
var TAPE = '#3E2C22';
var TAPE_SOFT = '#5A463A';
var ANCHOR = '#A85A4E';
var ANCHOR_DARK = '#8A463D';
var GRAPHITE = '#5E5952';
var ROOM_LINE = 'rgba(120,110,95,0.40)';
var PLATE = '#EFE9DC';
var PLATE_LINE = 'rgba(74,50,38,0.55)';
var TITLE_INK = '#2E2417';
var HINT_INK = '#6B5636';
var FRAME_T = 30.0;
var PULSE_PERIOD = 60.0;
var LINE_N = 6;
var ANCHOR_N = 8;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1754);
var phaseT = FRAME_T;
/* ---- layout: a tall narrow loom frame centered on the page, its posts
   running from a faint ceiling line to a faint floor line. The six long
   lines run diagonally corner to corner between the posts. ---- */
var Y_TOP = 0.09;
var Y_BOT = 0.90;
function frameW() {
  if (isPhone) return 0.74 * VW;
  return clamp(0.34 * VW, 260, 420);
}
function cx() { return VW / 2; }
function xL() { return cx() - frameW() / 2; }
function xR() { return cx() + frameW() / 2; }
function yTop() { return Y_TOP * VH; }
function yBot() { return Y_BOT * VH; }
/* ---- the six long lines: alternating diagonals, corner to corner,
   with small seeded offsets so no two share the same endpoints. ---- */
var LINES = [];
(function () {
  var i, dir;
  for (i = 0; i < LINE_N; i++) {
    dir = (i % 2 === 0) ? 1 : -1;
    LINES.push({
      dir: dir, x0: 0, y0: 0, x1: 0, y1: 0, off: rng(),
      aFrac: 0.02 + rng() * 0.26,
      bFrac: 0.02 + rng() * 0.26
    });
  }
})();
/* ---- floating anchors: small muted-red points tied to a line at a
   fixed station, drifting almost imperceptibly on closed-form sines. ---- */
var ANCHORS = [];
(function () {
  var i;
  for (i = 0; i < ANCHOR_N; i++) {
    ANCHORS.push({
      line: i % LINE_N,
      u: 0.15 + rng() * 0.70,
      jx: rng() * TAU,
      jy: rng() * TAU,
      r: 3.5 + rng() * 1.5
    });
  }
})();
/* Rebuild line geometry from seeded fractions for the current viewport. */
function rebuildLines() {
  var i, ln, span = yBot() - yTop();
  for (i = 0; i < LINE_N; i++) {
    ln = LINES[i];
    var aFrac = ln.aFrac;
    var bFrac = ln.bFrac;
    if (ln.dir > 0) {
      ln.x0 = xL(); ln.y0 = yTop() + aFrac * span;
      ln.x1 = xR(); ln.y1 = yBot() - bFrac * span;
    } else {
      ln.x0 = xL(); ln.y0 = yBot() - aFrac * span;
      ln.x1 = xR(); ln.y1 = yTop() + bFrac * span;
    }
  }
}
function linePoint(ln, u) {
  return { x: ln.x0 + (ln.x1 - ln.x0) * u, y: ln.y0 + (ln.y1 - ln.y0) * u };
}
function pulseU(ln, t) {
  var u = (t / PULSE_PERIOD + ln.off) % 1;
  return u < 0 ? u + 1 : u;
}
function anchorAt(an, t) {
  var ln = LINES[an.line];
  var p = linePoint(ln, an.u);
  p.x += 1.4 * Math.sin(TAU * (t / 47) + an.jx);
  p.y += 1.4 * Math.cos(TAU * (t / 53) + an.jy);
  return p;
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  rebuildLines();
}
function drawRoom(t) {
  ctx.strokeStyle = ROOM_LINE;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, yTop() + 0.5);
  ctx.lineTo(VW, yTop() + 0.5);
  ctx.moveTo(0, yBot() + 0.5);
  ctx.lineTo(VW, yBot() + 0.5);
  ctx.stroke();
}
function drawPosts() {
  var s = Math.min(VW, VH);
  var w = Math.max(s * 0.005, 3);
  var cap = Math.max(s * 0.008, 5);
  ctx.strokeStyle = TAPE;
  ctx.lineWidth = w;
  ctx.beginPath();
  ctx.moveTo(xL(), yTop() - 4);
  ctx.lineTo(xL(), yBot() + 4);
  ctx.moveTo(xR(), yTop() - 4);
  ctx.lineTo(xR(), yBot() + 4);
  ctx.stroke();
  ctx.fillStyle = TAPE;
  ctx.fillRect(xL() - cap / 2, yTop() - 4 - cap / 2, cap, cap);
  ctx.fillRect(xL() - cap / 2, yBot() + 4 - cap / 2, cap, cap);
  ctx.fillRect(xR() - cap / 2, yTop() - 4 - cap / 2, cap, cap);
  ctx.fillRect(xR() - cap / 2, yBot() + 4 - cap / 2, cap, cap);
}
function drawLines(t) {
  var s = Math.min(VW, VH);
  var i, ln;
  ctx.strokeStyle = TAPE;
  ctx.lineWidth = Math.max(s * 0.0022, 1.2);
  for (i = 0; i < LINES.length; i++) {
    ln = LINES[i];
    ctx.beginPath();
    ctx.moveTo(ln.x0, ln.y0);
    ctx.lineTo(ln.x1, ln.y1);
    ctx.stroke();
  }
}
function drawPulses(t) {
  var s = Math.min(VW, VH);
  var i, ln, u, p, p0, p1;
  for (i = 0; i < LINES.length; i++) {
    ln = LINES[i];
    u = pulseU(ln, t);
    p = linePoint(ln, u);
    /* short graphite wake trailing just behind the pulse */
    p0 = linePoint(ln, Math.max(0, u - 0.045));
    p1 = p;
    ctx.strokeStyle = rgba(GRAPHITE, 0.55);
    ctx.lineWidth = Math.max(s * 0.003, 1.8);
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.lineTo(p1.x, p1.y);
    ctx.stroke();
    /* soft halo, then the pulse mark itself */
    ctx.fillStyle = rgba(GRAPHITE, 0.14);
    ctx.beginPath();
    ctx.moveTo(p.x + Math.max(s * 0.011, 9), p.y);
    ctx.arc(p.x, p.y, Math.max(s * 0.011, 9), 0, TAU);
    ctx.fill();
    ctx.fillStyle = GRAPHITE;
    ctx.beginPath();
    ctx.moveTo(p.x + Math.max(s * 0.005, 4.5), p.y);
    ctx.arc(p.x, p.y, Math.max(s * 0.005, 4.5), 0, TAU);
    ctx.fill();
  }
}
function drawAnchors(t) {
  var s = Math.min(VW, VH);
  var i, an, p, r;
  for (i = 0; i < ANCHORS.length; i++) {
    an = ANCHORS[i];
    p = anchorAt(an, t);
    r = Math.max(an.r * (s / 900), 3);
    ctx.fillStyle = ANCHOR;
    ctx.beginPath();
    ctx.moveTo(p.x + r, p.y);
    ctx.arc(p.x, p.y, r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = rgba(ANCHOR_DARK, 0.8);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(p.x + r + 2.5, p.y);
    ctx.arc(p.x, p.y, r + 2.5, 0, TAU);
    ctx.stroke();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Loom').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Loom').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 31').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Loom', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 31', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawRoom(phaseT);
  drawLines(phaseT);
  drawPulses(phaseT);
  drawPosts();
  drawAnchors(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    lineCount: function () { return LINES.length; },
    anchorCount: function () { return ANCHORS.length; },
    pulseU: function (i, t) { return pulseU(LINES[i], t); },
    pulsePeriod: function () { return PULSE_PERIOD; },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 30.0 s, pulses mid-circuit ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
