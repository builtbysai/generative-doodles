<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№17 · Weave</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f0e9d8; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(74,62,42,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(240,233,216,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another weave</div>
<script>
'use strict';
// No17 Weave.
// Plain weave as a drawing rule: a grid of cells, each holding one
// capsule, horizontal or vertical, alternating in checkerboard parity
// the way warp and weft alternate over and under. A few seeded rows
// flip the parity, faults in the cloth where the pattern restarts.
// Ink is chosen per cell by a slow seeded field between charcoal and
// ochre on cream, so the cloth has weather as well as structure.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '17', 10) || 17;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f0e9d8';
const INKS = ['#33302a', '#8a5a33', '#c98f2e'];

function compose(s) {
  const rnd = mulberry32(s);
  const flips = new Set();
  const flipCount = 2 + ((rnd() * 3) | 0);
  while (flips.size < flipCount) flips.add(2 + ((rnd() * 22) | 0));
  return {
    flips,
    a1: 1.6 + rnd() * 1.6, a2: 2.2 + rnd() * 1.8,
    p1: rnd() * Math.PI * 2, p2: rnd() * Math.PI * 2,
    ok: flipCount >= 2
  };
}

function buildPiece(baseSeed) { return compose(baseSeed >>> 0); }

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: physical screen size, aspect only as fallback.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  const N = 26;
  const cell = RX / N;
  const cellY = RY / N;
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.min(cell, cellY) * 0.34;
  let flipParity = 0;
  for (let j = 0; j < N; j++) {
    if (p.flips.has(j)) flipParity ^= 1;
    for (let i = 0; i < N; i++) {
      const horiz = ((i + j) & 1) === flipParity;
      const f = 0.5 + 0.5 * Math.sin((i / N) * p.a1 * Math.PI * 2 + p.p1) * Math.sin((j / N) * p.a2 * Math.PI + p.p2);
      ctx.strokeStyle = INKS[f < 0.38 ? 0 : (f > 0.72 ? 2 : 1)];
      const cx = ox + (i + 0.5) * cell, cy = oy + (j + 0.5) * cellY;
      const hl = cell * 0.30, vl = cellY * 0.30;
      ctx.beginPath();
      if (horiz) { ctx.moveTo(cx - hl, cy); ctx.lineTo(cx + hl, cy); }
      else { ctx.moveTo(cx, cy - vl); ctx.lineTo(cx, cy + vl); }
      ctx.stroke();
    }
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
