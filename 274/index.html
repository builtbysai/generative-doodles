<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.274 Negative Space</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#14100C; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.274 Negative Space (Shupiwe Chongwe).
// After her line that it is often not the vessel itself
// which is valued, but the negative space it holds.
// A ring of tall vessels stands near-silhouette in a dark
// room while a single slow light orbits over about 45s,
// so each gap and hollow mouth flares and dims in turn.
// The vessels never move, only the light travels.
// Watch only: no interaction handlers at all.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VESSEL = '#2A2119', AMBER = '#D9A85C', INTERIOR = '#E8D9B8', ROOM = '#14100C', STRAW = '#D4A95C';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var T = 10, lastNow = -1; // frame one: light about 10s into its orbit, one gap already flaring
var CX = 640, CY = 450;

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function angDiff(a, b) {
  var d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}
function lightFalloff(diff) {
  // smooth falloff: 1 when aligned with the light, 0 opposite
  var c = (Math.cos(diff) + 1) / 2;
  return c * c * (0.35 + 0.65 * c);
}

// ---- the nine vessels in a loose ring ------------------------------------------
// Positions on an elliptical ring, jittered from fixed seeds.
// Back vessels (smaller cy) are drawn first so front vessels
// overlap them. Each vessel keeps its angle for the light
// falloff, its size, and seeded straw flecks on its body.
var vessels = [];
(function () {
  var r = rng(27411);
  var n = 9;
  for (var i = 0; i < n; i++) {
    var ang = (i / n) * Math.PI * 2 - Math.PI / 2 + (r() - 0.5) * 0.14;
    var radX = 335 + (r() - 0.5) * 36;
    var radY = 148 + (r() - 0.5) * 22;
    var cx = CX + Math.cos(ang) * radX;
    var cy = CY + Math.sin(ang) * radY;
    // back vessels a touch smaller, front vessels a touch larger
    var depth = (Math.sin(ang) + 1) / 2; // 0 back, 1 front
    var h = 236 + depth * 52 + (r() - 0.5) * 22;
    var w = 76 + depth * 16 + (r() - 0.5) * 10;
    var flecks = [];
    var nf = 9 + Math.floor(r() * 6);
    for (var f = 0; f < nf; f++) {
      flecks.push({
        fx: (r() - 0.5) * 0.62,
        fy: 0.22 + r() * 0.62,
        len: 3 + r() * 6,
        a: 0.10 + r() * 0.22,
        tilt: (r() - 0.5) * 0.9
      });
    }
    vessels.push({ cx: cx, cy: cy, ang: ang, h: h, w: w, depth: depth, flecks: flecks, idx: i });
  }
  vessels.sort(function (a, b) { return a.cy - b.cy; });
})();
// gaps: midpoints between neighbours in ring order (by original index around the ring)
var gaps = [];
(function () {
  var byIdx = vessels.slice().sort(function (a, b) { return a.idx - b.idx; });
  // ring order is by angle; idx order follows angle order from construction
  for (var i = 0; i < byIdx.length; i++) {
    var a = byIdx[i], b = byIdx[(i + 1) % byIdx.length];
    // for the wrap pair, the gap sits across the top; midpoint still works
    var gx = (a.cx + b.cx) / 2, gy = (a.cy + b.cy) / 2;
    var ang = Math.atan2(gy - CY, gx - CX);
    var motes = [];
    var r = rng(27450 + i * 17);
    for (var m = 0; m < 4; m++) {
      motes.push({ ox: (r() - 0.5) * 44, oy: (r() - 0.5) * 90, ph: r() * Math.PI * 2, sp: 0.5 + r() * 0.8, s: 1.0 + r() * 1.6 });
    }
    gaps.push({ x: gx, y: gy, ang: ang, motes: motes });
  }
})();

function vesselPath(v) {
  var topY = v.cy - v.h / 2;
  var botY = v.cy + v.h / 2;
  var w = v.w;
  var mx = w * 0.32; // half mouth width
  ctx.beginPath();
  ctx.moveTo(v.cx - mx, topY + 4);
  // left side: out to shoulder, down the belly, in to the base
  ctx.bezierCurveTo(v.cx - w * 0.52, topY + v.h * 0.14, v.cx - w * 0.50, topY + v.h * 0.34, v.cx - w * 0.46, topY + v.h * 0.58);
  ctx.bezierCurveTo(v.cx - w * 0.42, topY + v.h * 0.80, v.cx - w * 0.30, topY + v.h * 0.92, v.cx - w * 0.27, botY);
  // base
  ctx.bezierCurveTo(v.cx - w * 0.12, botY + 5, v.cx + w * 0.12, botY + 5, v.cx + w * 0.27, botY);
  // right side mirrored
  ctx.bezierCurveTo(v.cx + w * 0.30, topY + v.h * 0.92, v.cx + w * 0.42, topY + v.h * 0.80, v.cx + w * 0.46, topY + v.h * 0.58);
  ctx.bezierCurveTo(v.cx + w * 0.50, topY + v.h * 0.34, v.cx + w * 0.52, topY + v.h * 0.14, v.cx + mx, topY + 4);
  // close across the mouth underside
  ctx.bezierCurveTo(v.cx + mx * 0.4, topY + 9, v.cx - mx * 0.4, topY + 9, v.cx - mx, topY + 4);
  ctx.closePath();
}

function draw() {
  var lightAng = T * Math.PI * 2 / 45;
  // ---- the dark room -------------------------------------------------------------
  ctx.fillStyle = ROOM;
  ctx.fillRect(-10, -10, DW + 20, DH + 20);
  // faint floor pool under the ring, in vessel tone at low alpha
  ctx.fillStyle = rgba(VESSEL, 0.35);
  ctx.beginPath();
  ctx.ellipse(CX, CY + 118, 430, 118, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = rgba(VESSEL, 0.22);
  ctx.beginPath();
  ctx.ellipse(CX, CY + 108, 340, 88, 0, 0, Math.PI * 2);
  ctx.fill();
  // dark room edges: layered translucent room-dark bands at the corners
  ctx.fillStyle = rgba(ROOM, 0.55);
  ctx.fillRect(-10, -10, DW + 20, 54);
  ctx.fillRect(-10, DH - 44, DW + 20, 54);
  ctx.fillRect(-10, -10, 54, DH + 20);
  ctx.fillRect(DW - 44, -10, 54, DH + 20);

  // ---- central negative space glow (the hollow inside the ring) ------------------
  var centreFall = 0.30 + 0.22 * Math.sin(T * Math.PI * 2 / 45);
  ctx.fillStyle = rgba(AMBER, 0.05 + 0.04 * centreFall);
  ctx.beginPath();
  ctx.ellipse(CX, CY + 6, 215, 118, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = rgba(INTERIOR, 0.04 + 0.03 * centreFall);
  ctx.beginPath();
  ctx.ellipse(CX, CY, 130, 68, 0, 0, Math.PI * 2);
  ctx.fill();

  // ---- gap glows, behind the vessels ---------------------------------------------
  // Each gap is a vertical lozenge of layered amber in the space
  // between two neighbours; alpha follows the orbiting light.
  var gi, g, inten;
  for (gi = 0; gi < gaps.length; gi++) {
    g = gaps[gi];
    inten = lightFalloff(angDiff(g.ang, lightAng));
    if (inten < 0.02) continue;
    // outer halo, mid glow, bright core: layered translucent shapes, no filter
    ctx.fillStyle = rgba(AMBER, 0.07 * inten);
    ctx.beginPath();
    ctx.ellipse(g.x, g.y, 58, 104, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba(AMBER, 0.14 * inten);
    ctx.beginPath();
    ctx.ellipse(g.x, g.y, 36, 78, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba(AMBER, 0.20 * inten);
    ctx.beginPath();
    ctx.ellipse(g.x, g.y, 19, 52, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgba(INTERIOR, 0.14 * inten);
    ctx.beginPath();
    ctx.ellipse(g.x, g.y - 6, 9, 28, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- the vessels -----------------------------------------------------------------
  for (var vi = 0; vi < vessels.length; vi++) {
    var v = vessels[vi];
    var topY = v.cy - v.h / 2;
    var botY = v.cy + v.h / 2;
    // contact shadow on the floor
    ctx.fillStyle = rgba(ROOM, 0.50);
    ctx.beginPath();
    ctx.ellipse(v.cx, botY + 5, v.w * 0.30, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    // silhouette body
    ctx.fillStyle = VESSEL;
    vesselPath(v);
    ctx.fill();
    // faint lit edge on the side facing the light
    var vInten = lightFalloff(angDiff(v.ang, lightAng));
    if (vInten > 0.03) {
      var side = Math.cos(angDiff(v.ang, lightAng)) >= 0 ? 1 : -1;
      // a soft amber wash hugging the lit flank, clipped by drawing
      // a narrow shape just inside the silhouette edge
      ctx.save();
      vesselPath(v);
      ctx.clip();
      ctx.fillStyle = rgba(AMBER, 0.14 * vInten);
      ctx.beginPath();
      ctx.ellipse(v.cx + side * v.w * 0.44, v.cy + v.h * 0.02, v.w * 0.14, v.h * 0.34, side * 0.08, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    // straw flecks seeded on the body
    for (var fi = 0; fi < v.flecks.length; fi++) {
      var fl = v.flecks[fi];
      var fx = v.cx + fl.fx * v.w;
      var fy = topY + fl.fy * v.h;
      ctx.strokeStyle = rgba(STRAW, fl.a);
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(fx - Math.cos(fl.tilt) * fl.len / 2, fy - Math.sin(fl.tilt) * fl.len / 2);
      ctx.lineTo(fx + Math.cos(fl.tilt) * fl.len / 2, fy + Math.sin(fl.tilt) * fl.len / 2);
      ctx.stroke();
    }
    // ---- the mouth: rim and hollow interior --------------------------------------
    var mrx = v.w * 0.32, mry = mrx * 0.38;
    // rim
    ctx.fillStyle = VESSEL;
    ctx.beginPath();
    ctx.ellipse(v.cx, topY + 4, mrx + 3.5, mry + 2.2, 0, 0, Math.PI * 2);
    ctx.fill();
    // hollow: dark base, then interior light on the light falloff
    ctx.fillStyle = ROOM;
    ctx.beginPath();
    ctx.ellipse(v.cx, topY + 4, mrx, mry, 0, 0, Math.PI * 2);
    ctx.fill();
    var mInten = lightFalloff(angDiff(v.ang, lightAng));
    ctx.fillStyle = rgba(INTERIOR, 0.10 + 0.78 * mInten);
    ctx.beginPath();
    ctx.ellipse(v.cx, topY + 4, mrx, mry, 0, 0, Math.PI * 2);
    ctx.fill();
    if (mInten > 0.05) {
      ctx.fillStyle = rgba(AMBER, 0.28 * mInten);
      ctx.beginPath();
      ctx.ellipse(v.cx, topY + 4, mrx * 0.62, mry * 0.62, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = rgba(INTERIOR, 0.30 * mInten);
      ctx.beginPath();
      ctx.ellipse(v.cx - mrx * 0.12, topY + 3, mrx * 0.30, mry * 0.34, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- dust motes, only inside the currently lit gaps ------------------------------
  for (gi = 0; gi < gaps.length; gi++) {
    g = gaps[gi];
    inten = lightFalloff(angDiff(g.ang, lightAng));
    if (inten < 0.28) continue;
    for (var mi = 0; mi < g.motes.length; mi++) {
      var mo = g.motes[mi];
      var mx2 = g.x + mo.ox + 7 * Math.sin(T * 0.35 * mo.sp + mo.ph);
      var my2 = g.y + mo.oy + 10 * Math.sin(T * 0.22 * mo.sp + mo.ph * 1.7) - ((T * 2.2 * mo.sp + mo.ph * 9) % 26);
      ctx.fillStyle = rgba(INTERIOR, 0.45 * inten);
      ctx.beginPath();
      ctx.ellipse(mx2, my2, mo.s, mo.s, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = ROOM;
  ctx.fillRect(0, 0, W, H);
  // centred fit: the ring keeps its shape, page ground is the room dark
  var S = Math.min(W / DW, H / DH);
  ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2, (H - DH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
