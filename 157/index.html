<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Seven and Fourteen</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#EDE8DC; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  build();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function phase(t, a, b) { return clamp01((t - a) / (b - a)); }
function smooth(u) { return u * u * (3 - 2 * u); }

// ---- the 7/14 substitution field -------------------------------------
// Stars are placed by a substitution rule, never by a rectangular
// repeat. Every star wears a corona of seven satellites of the other
// kind, sitting in its point gaps just outside its outline at 1.22 of
// its radius, each smaller by the inflation factor LAM; coronas nest
// two levels deep. The parents are placed by hand: one great 14-star
// at the centre and two rings of seven around it. Star outlines use
// the true {n/k} inner radius, cos(k pi / n) / cos((k-1) pi / n):
// {7/2} and {14/5} both land near 0.69, so the two families read as
// one system.
var LAM = 2.6;
var nodes = [], ringA = [], ringB = [];
function starQ(n) {
  var k = (n === 14) ? 5 : 2;
  return Math.cos(k * Math.PI / n) / Math.cos((k - 1) * Math.PI / n);
}
function addNode(x, y, r, n, rot, depth) {
  var node = { x: x, y: y, r: r, n: n, rot: rot, depth: depth, q: starQ(n) };
  nodes.push(node);
  if (depth >= 2) return;
  var cr = r / LAM, k, ang;
  for (k = 0; k < 7; k++) {
    ang = rot + Math.PI / 7 + k * 2 * Math.PI / 7;
    addNode(x + Math.cos(ang) * r * 1.22, y + Math.sin(ang) * r * 1.22,
            cr, n === 14 ? 7 : 14, rot + Math.PI / 7, depth + 1);
  }
}
function build() {
  nodes = []; ringA = []; ringB = [];
  var k, ang;
  addNode(0, 0, 1.0, 14, -Math.PI / 2, 0);
  for (k = 0; k < 7; k++) {
    ang = -Math.PI / 2 + k * 2 * Math.PI / 7;
    ringA.push([Math.cos(ang) * 2.35, Math.sin(ang) * 2.35]);
    addNode(Math.cos(ang) * 2.35, Math.sin(ang) * 2.35, 0.72, 7, -Math.PI / 2, 0);
  }
  for (k = 0; k < 7; k++) {
    ang = -Math.PI / 2 + Math.PI / 7 + k * 2 * Math.PI / 7;
    ringB.push([Math.cos(ang) * 3.6, Math.sin(ang) * 3.6]);
    addNode(Math.cos(ang) * 3.6, Math.sin(ang) * 3.6, 0.58, 14, -Math.PI / 2, 0);
  }
  nodes.sort(function (a, b) { return a.depth - b.depth; });
}

function starPath(cx, cy, R, n, q, rot) {
  ctx.beginPath();
  for (var k = 0; k < 2 * n; k++) {
    var ang = rot + k * Math.PI / n, rad = (k % 2 === 0) ? R : R * q;
    var x = cx + Math.cos(ang) * rad, y = cy + Math.sin(ang) * rad;
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

// One render of the whole field under camera zoom z. A star's alpha is
// windowed by its screen radius: it fades in as substitution detail
// becomes legible and fades out before it can swallow the frame, so
// the level-of-detail swap at the loop seam has nothing to pop.
function drawLayer(z, alphaMul) {
  if (!nodes.length) return;
  var minWH = Math.min(W, H);
  var S = minWH * 0.30 * z;
  var cx = W / 2, cy = H / 2, i, nd, sr, px, py, a;
  // faint construction: the two parent rings of the sub-grid
  ctx.strokeStyle = '#1A1A1A';
  ctx.lineWidth = 1;
  [ringA, ringB].forEach(function (ring) {
    ctx.globalAlpha = 0.10 * alphaMul;
    ctx.beginPath();
    ring.forEach(function (p, k) {
      var x = cx + p[0] * S, y = cy + p[1] * S;
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath(); ctx.stroke();
  });
  for (i = 0; i < nodes.length; i++) {
    nd = nodes[i];
    sr = nd.r * S;
    if (sr < 1.2) continue;
    px = cx + nd.x * S; py = cy + nd.y * S;
    if (px < -sr || px > W + sr || py < -sr || py > H + sr) continue;
    a = alphaMul * clamp01((sr - minWH * 0.004) / (minWH * 0.012))
                  * (1 - clamp01((sr - minWH * 0.50) / (minWH * 0.30)));
    if (a <= 0.003) continue;
    // construction circle through the vertices, just visible
    if (nd.depth < 2) {
      ctx.strokeStyle = '#1A1A1A';
      ctx.lineWidth = 1;
      ctx.globalAlpha = a * 0.16;
      ctx.beginPath(); ctx.arc(px, py, sr, 0, Math.PI * 2); ctx.stroke();
    }
    // the inlay
    starPath(px, py, sr, nd.n, nd.q, nd.rot);
    ctx.fillStyle = '#3AB7A6';
    ctx.globalAlpha = a * 0.95;
    ctx.fill();
    ctx.strokeStyle = '#1A1A1A';
    ctx.lineWidth = Math.max(0.8, Math.min(3, sr * 0.05));
    ctx.globalAlpha = a;
    ctx.stroke();
    // inner construction star
    if (sr > 26) {
      starPath(px, py, sr * 0.66, nd.n, nd.q, nd.rot);
      ctx.strokeStyle = '#1A1A1A';
      ctx.lineWidth = 1;
      ctx.globalAlpha = a * 0.30;
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

var LOOP = 30;
function draw(now) {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#EDE8DC'; ctx.fillRect(0, 0, W, H);
  var t = ((now / 1000) % LOOP + LOOP) % LOOP;
  var z = Math.pow(LAM, t / LOOP);
  // The loop zooms in by exactly one inflation factor. In the last
  // seconds the same field at z / LAM (identical to the first frame
  // when z reaches LAM) crossfades over the swollen field: the
  // subdivision grows one level and the frame matches the start.
  var w = smooth(phase(t, 26.5, 30));
  if (w > 0) drawLayer(z / LAM, w);
  drawLayer(z, 1 - w);
}

resize();
draw(0);
function frame(ts) {
  draw(ts || 0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
