<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№613 Sidekick</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e3a3f; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt. The study
  // file studies/chris-hyson.md does not exist in the repo, so these hex
  // values are chosen from the prompt's own color names.
  var DEEP = '#0e3a3f';      // water, deep green-blue
  var WATER = '#1d6a6e';     // water, mid green-blue
  var SHALLOW = '#7fc4bd';   // water surface band, bright green-blue
  var SURFACE = '#cdeee6';   // surface light, pale aqua
  var BLOSSOM = '#fbfaf4';   // blossom white
  var BLOSSOM_SH = '#e8e2d2';// blossom shade, warm white
  var CENTRE = '#f2d38a';    // blossom centre, pale gold
  var STONE = '#8d9490';     // glass stone grey
  var STONE_DK = '#5d6663';  // glass stone shadow grey
  var THREAD_RED = '#a85a4a';// thread, muted red
  var THREAD_GOLD = '#c9a24b';// thread, muted gold
  var SKIN = '#c99a72';      // hand, warm tan
  var SKIN_SH = '#a87a55';   // hand shade
  var RAINBOW = ['#f2b8c6', '#f6d9a0', '#bfe3c0', '#a9d3e8', '#d3b8e6'];
  var INK_DK = '#0d2f33';    // plate ink on the bright surface band
  var INK_LT = '#eef7f2';    // plate ink on deep water

  // Fixed-phase first frame: FIRST_T = 8 s. The swell runs on a 9 s
  // cycle, so t = 8 s is late in a swell, the water at a gentle crest.
  // One settled ripple ring from an earlier tap (spawned at t = 5 s at
  // the surface, upper right) is still faintly visible at frame one.
  // Frame one is byte-reproducible: every blossom, stone and thread is
  // placed by the seeded PRNG, and all motion is a pure function of t.
  var FIRST_T = 8;
  var SWELL_PERIOD = 9;

  // Seeded PRNG, mulberry32. A fresh instance is built per draw from the
  // piece number, so every frame is reproducible regardless of call order.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // The scene below the waterline, fixed at load from the seed: five
  // blossom clusters, seven glass stones, six drifting threads. Nothing
  // here changes with time except the refraction offset applied when it
  // is drawn, so a tap never clears or changes the blossoms.
  var BLOSSOMS = [];
  var STONES = [];
  var THREADS = [];
  (function buildScene() {
    var rng = mulberry32(1934);
    var spots = [[0.24, 0.52], [0.42, 0.62], [0.60, 0.50], [0.76, 0.64], [0.52, 0.74]];
    for (var i = 0; i < spots.length; i++) {
      var petals = [];
      for (var p = 0; p < 5; p++) {
        petals.push({ a: p * Math.PI * 2 / 5 + rng() * 0.5, r: 0.55 + rng() * 0.45, len: 0.030 + rng() * 0.014 });
      }
      BLOSSOMS.push({ x: spots[i][0], y: spots[i][1], s: 0.8 + rng() * 0.5, petals: petals, phase: rng() * Math.PI * 2 });
    }
    for (var s = 0; s < 7; s++) {
      STONES.push({ x: 0.08 + rng() * 0.84, y: 0.86 + rng() * 0.10, rx: 0.045 + rng() * 0.045, ry: 0.020 + rng() * 0.018, phase: rng() * Math.PI * 2 });
    }
    for (var th = 0; th < 6; th++) {
      var pts = [];
      for (var k = 0; k < 5; k++) { pts.push({ x: 0.05 + rng() * 0.9, y: 0.40 + rng() * 0.5 }); }
      THREADS.push({ color: (th % 2 === 0) ? THREAD_RED : THREAD_GOLD, pts: pts, phase: rng() * Math.PI * 2, speed: 0.05 + rng() * 0.05 });
    }
  })();

  // Ripples. Each holds normalized coords and the time it was spawned.
  // The first entry is the settled ring visible at frame one. Live taps
  // append here; the field relaxes as each ring's amplitude decays.
  var ripples = [{ nx: 0.62, ny: 0.16, t0: 5.0 }];
  var currentT = FIRST_T;

  // QA probe hook: ?tapx=0.5&tapy=0.2 renders the frame as if the water
  // had been tapped at that point 1.5 s before frame one, so the ripple
  // is strong and the probe render differs from the default in pixels.
  // The default render (no params) is the deterministic first frame.
  var probeTap = null;
  try {
    var q = (typeof location !== 'undefined' && location.search) ? location.search : '';
    if (q) {
      var m1 = q.match(/tapx=([0-9.]+)/);
      var m2 = q.match(/tapy=([0-9.]+)/);
      if (m1 && m2) { probeTap = { nx: parseFloat(m1[1]), ny: parseFloat(m2[1]) }; }
    }
  } catch (e) { probeTap = null; }
  if (probeTap) { ripples.push({ nx: probeTap.nx, ny: probeTap.ny, t0: FIRST_T - 1.5 }); }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function smooth(a, b, x) {
    var u = clamp((x - a) / (b - a), 0, 1);
    return u * u * (3 - 2 * u);
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Waterline: the rippling surface is a bright band across the upper
  // third, so the line sits at one third of the height, breathing a
  // little with the swell.
  function waterlineY(t) {
    return H * 0.33 + Math.sin(t * Math.PI * 2 / SWELL_PERIOD) * H * 0.008;
  }

  // The refraction field: how far a point below the surface is smeared
  // by the water lens. Ambient swell bends it gently; each ripple ring
  // adds a travelling bump that decays over about six seconds. Depth
  // below the waterline scales the smear, so the surface itself stays
  // steady and the blossoms bend most. Returns [dx, dy] in pixels.
  function refract(x, y, t) {
    var wl = waterlineY(t);
    var depth = clamp((y - wl) / (H - wl), 0, 1);
    var swell = 0.5 + 0.5 * Math.sin(t * Math.PI * 2 / SWELL_PERIOD);
    var amp = (0.35 + 0.65 * swell) * (2 + depth * 10);
    var dx = Math.sin(y * 0.045 + t * 0.7) * amp
           + Math.sin((x + y) * 0.02 - t * 0.45) * amp * 0.6;
    var dy = Math.cos(x * 0.03 + t * 0.55) * amp * 0.7;
    for (var i = 0; i < ripples.length; i++) {
      var rp = ripples[i];
      var age = t - rp.t0;
      if (age < 0 || age > 7) { continue; }
      var cx = rp.nx * W, cy = rp.ny * H;
      var ddx = x - cx, ddy = y - cy;
      var r = Math.sqrt(ddx * ddx + ddy * ddy);
      var ringR = age * Math.min(W, H) * 0.14;
      var band = Math.exp(-Math.pow((r - ringR) / (Math.min(W, H) * 0.05), 2));
      var decay = Math.exp(-age / 2.5);
      var push = band * decay * Math.min(W, H) * 0.03;
      if (r > 1) {
        dx += (ddx / r) * push * Math.sin(r * 0.09 - age * 3);
        dy += (ddy / r) * push * Math.sin(r * 0.09 - age * 3);
      }
    }
    return [dx, dy];
  }

  function petal(x, y, rx, ry, rot, fill) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(0, -ry);
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBlossom(b, t, ghost) {
    var cx = b.x * W, cy = b.y * H;
    var off = refract(cx, cy, t);
    var gx = cx + off[0] * (ghost ? 2.2 : 1);
    var gy = cy + off[1] * (ghost ? 2.2 : 1);
    var breathe = 1 + 0.03 * Math.sin(t * Math.PI * 2 / SWELL_PERIOD + b.phase);
    var bs = isPhone ? 1.3 : 1;
    // Solid white heart first, so the petals read as a flower, not a ring.
    ctx.fillStyle = ghost ? hexA(BLOSSOM, 0.22) : BLOSSOM;
    ctx.beginPath();
    ctx.moveTo(gx + Math.min(W, H) * 0.045 * bs, gy);
    ctx.arc(gx, gy, Math.min(W, H) * 0.045 * bs, 0, Math.PI * 2);
    ctx.fill();
    for (var p = 0; p < b.petals.length; p++) {
      var pt = b.petals[p];
      var px = gx + Math.cos(pt.a) * pt.r * Math.min(W, H) * 0.055 * bs * breathe;
      var py = gy + Math.sin(pt.a) * pt.r * Math.min(W, H) * 0.055 * bs * breathe;
      petal(px, py, pt.len * Math.min(W, H) * 2.0 * bs, pt.len * Math.min(W, H) * 1.05 * bs, pt.a,
        ghost ? hexA(BLOSSOM, 0.22) : BLOSSOM);
    }
    ctx.fillStyle = ghost ? hexA(CENTRE, 0.22) : CENTRE;
    ctx.beginPath();
    ctx.moveTo(gx + 4, gy); ctx.arc(gx, gy, Math.max(2, Math.min(W, H) * 0.008), 0, Math.PI * 2); ctx.fill();
    if (!ghost) {
      ctx.fillStyle = hexA(BLOSSOM_SH, 0.5);
      ctx.beginPath();
      ctx.moveTo(gx + 3, gy + 3); ctx.arc(gx, gy + Math.min(W, H) * 0.012, Math.max(2, Math.min(W, H) * 0.006), 0, Math.PI * 2); ctx.fill();
    }
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var wl = waterlineY(t);
    var u = Math.min(W, H);

    // Water ground: deep green-blue below, lighter toward the surface.
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, SURFACE);
    g.addColorStop(0.30, SHALLOW);
    g.addColorStop(0.55, WATER);
    g.addColorStop(1, DEEP);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Glass stones along the bottom, smeared by the lens.
    for (var s = 0; s < STONES.length; s++) {
      var st = STONES[s];
      var sx = st.x * W, sy = st.y * H;
      var so = refract(sx, sy, t);
      ctx.fillStyle = hexA(STONE_DK, 0.55);
      ctx.beginPath();
      ctx.moveTo(sx + so[0] + st.rx * u, sy + so[1] + u * 0.012);
      ctx.ellipse(sx + so[0], sy + so[1] + u * 0.012, st.rx * u, st.ry * u, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = hexA(STONE, 0.85);
      ctx.beginPath();
      ctx.moveTo(sx + so[0] + st.rx * u, sy + so[1]);
      ctx.ellipse(sx + so[0], sy + so[1], st.rx * u, st.ry * u, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = hexA(SURFACE, 0.35);
      ctx.beginPath();
      ctx.moveTo(sx + so[0] - st.rx * u * 0.4 + st.rx * u * 0.25, sy + so[1] - st.ry * u * 0.3);
      ctx.ellipse(sx + so[0] - st.rx * u * 0.4, sy + so[1] - st.ry * u * 0.3, st.rx * u * 0.25, st.ry * u * 0.3, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Colored threads drifting through the water, bent by the lens.
    // Drawn as smooth curves through midpoints, thin and quiet.
    for (var th = 0; th < THREADS.length; th++) {
      var td = THREADS[th];
      ctx.strokeStyle = hexA(td.color, 0.45);
      ctx.lineWidth = Math.max(1, u * 0.0018);
      ctx.lineCap = 'round';
      var tpts = [];
      for (var k = 0; k < td.pts.length; k++) {
        var drift = Math.sin(t * td.speed + td.phase + k) * u * 0.02;
        var tx = td.pts[k].x * W + drift;
        var ty = td.pts[k].y * H + Math.cos(t * td.speed * 0.7 + td.phase + k) * u * 0.012;
        var to = refract(tx, ty, t);
        tpts.push([tx + to[0], ty + to[1]]);
      }
      ctx.beginPath();
      ctx.moveTo(tpts[0][0], tpts[0][1]);
      for (var m = 1; m < tpts.length - 1; m++) {
        var mx = (tpts[m][0] + tpts[m + 1][0]) / 2;
        var my = (tpts[m][1] + tpts[m + 1][1]) / 2;
        ctx.quadraticCurveTo(tpts[m][0], tpts[m][1], mx, my);
      }
      ctx.lineTo(tpts[tpts.length - 1][0], tpts[tpts.length - 1][1]);
      ctx.stroke();
    }

    // The hand: a cupped palm rising from the bottom edge, fingers
    // curling up around the blossoms. Drawn in warm tan, shaded on the
    // water side, so the blossoms rest in it.
    var hx = W * 0.5, hy = H * 1.02;
    var hs = isPhone ? 1.3 : 1;
    var handW = u * 0.34 * hs, handH = u * 0.30 * hs;
    ctx.fillStyle = SKIN_SH;
    ctx.beginPath();
    ctx.moveTo(hx - handW, hy + 10);
    ctx.ellipse(hx, hy - handH * 0.25, handW, handH, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.moveTo(hx - handW * 0.92, hy + 10);
    ctx.ellipse(hx, hy - handH * 0.32, handW * 0.92, handH * 0.9, 0, Math.PI, 0);
    ctx.fill();
    // Four fingers curling up over the palm, left to right, rising
    // above the palm's top edge so they read as fingers, not a dome.
    var fingerX = [-0.62, -0.21, 0.21, 0.62];
    for (var f = 0; f < 4; f++) {
      var fx = hx + fingerX[f] * handW;
      var fy = hy - handH * (0.98 + (f === 1 || f === 2 ? 0.14 : 0));
      var fw = u * 0.052 * hs, fh = u * 0.10 * hs;
      ctx.fillStyle = SKIN_SH;
      ctx.beginPath();
      ctx.moveTo(fx + fw, fy + u * 0.012);
      ctx.ellipse(fx, fy + u * 0.012, fw, fh, fingerX[f] * 0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = SKIN;
      ctx.beginPath();
      ctx.moveTo(fx + fw, fy);
      ctx.ellipse(fx, fy, fw, fh, fingerX[f] * 0.25, 0, Math.PI * 2);
      ctx.fill();
    }
    // Separation strokes between the fingers.
    ctx.strokeStyle = hexA(SKIN_SH, 0.7);
    ctx.lineWidth = Math.max(1, u * 0.002);
    for (var f2 = 0; f2 < 3; f2++) {
      var sepX = hx + (fingerX[f2] + fingerX[f2 + 1]) / 2 * handW;
      ctx.beginPath();
      ctx.moveTo(sepX, hy - handH * 0.78);
      ctx.lineTo(sepX, hy - handH * 0.42);
      ctx.stroke();
    }
    // Thumb crossing from the left, holding the stems.
    ctx.fillStyle = SKIN_SH;
    ctx.beginPath();
    ctx.moveTo(hx - handW * 0.75 + u * 0.09, hy - handH * 0.42 + u * 0.012);
    ctx.ellipse(hx - handW * 0.55, hy - handH * 0.42, u * 0.10, u * 0.042, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.moveTo(hx - handW * 0.75 + u * 0.09, hy - handH * 0.42);
    ctx.ellipse(hx - handW * 0.55, hy - handH * 0.42, u * 0.10, u * 0.042, -0.5, 0, Math.PI * 2);
    ctx.fill();
    // Stems from the blossoms down into the palm.
    ctx.strokeStyle = hexA('#4d7a52', 0.8);
    ctx.lineWidth = Math.max(1.2, u * 0.0025);
    for (var b = 0; b < BLOSSOMS.length; b++) {
      var bl = BLOSSOMS[b];
      var bx = bl.x * W, by = bl.y * H;
      var bo = refract(bx, by, t);
      ctx.beginPath();
      ctx.moveTo(bx + bo[0], by + bo[1] + u * 0.02);
      ctx.quadraticCurveTo(bx + bo[0] + (hx - bx) * 0.3, by + u * 0.16, hx + (bl.x - 0.5) * handW * 0.9, hy - handH * 0.55);
      ctx.stroke();
    }

    // Blossoms: a faint doubled ghost pass first (the lens doubling),
    // then the main pass. The tap only changes the refraction offsets,
    // never the blossoms themselves.
    for (var gi = 0; gi < BLOSSOMS.length; gi++) { drawBlossom(BLOSSOMS[gi], t, true); }
    for (var bi = 0; bi < BLOSSOMS.length; bi++) { drawBlossom(BLOSSOMS[bi], t, false); }

    // Rainbow refractions: soft pastel bands sliding slowly across the
    // whole frame, stronger below the surface.
    for (var rb = 0; rb < RAINBOW.length; rb++) {
      var slide = ((t * 0.008 + rb * 0.21) % 1.3) - 0.15;
      var rx0 = slide * W - u * 0.12;
      ctx.strokeStyle = hexA(RAINBOW[rb], 0.13);
      ctx.lineWidth = u * 0.018;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(rx0, wl + u * 0.05);
      ctx.quadraticCurveTo(rx0 + u * 0.18, H * 0.6, rx0 + u * 0.06, H * 0.98);
      ctx.stroke();
    }

    // The rippling surface: a bright band across the upper third with a
    // wavy surface line, travelling highlight dashes and caustic dots.
    ctx.fillStyle = hexA(SURFACE, 0.55);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(W, 0);
    ctx.lineTo(W, wl - u * 0.02);
    var step = Math.max(2, W / 120);
    for (var sx2 = W; sx2 >= 0; sx2 -= step) {
      var wy = wl + Math.sin(sx2 * 0.02 + t * 1.1) * u * 0.006 + Math.sin(sx2 * 0.045 - t * 0.7) * u * 0.004;
      ctx.lineTo(sx2, wy);
    }
    ctx.closePath();
    ctx.fill();
    // Surface line.
    ctx.strokeStyle = hexA(INK_LT, 0.65);
    ctx.lineWidth = Math.max(1.2, u * 0.002);
    ctx.beginPath();
    for (var sx3 = 0; sx3 <= W; sx3 += step) {
      var wy2 = wl + Math.sin(sx3 * 0.02 + t * 1.1) * u * 0.006 + Math.sin(sx3 * 0.045 - t * 0.7) * u * 0.004;
      if (sx3 === 0) { ctx.moveTo(sx3, wy2); } else { ctx.lineTo(sx3, wy2); }
    }
    ctx.stroke();
    // Ripple rings on the surface, expanding and fading.
    for (var ri = 0; ri < ripples.length; ri++) {
      var rp2 = ripples[ri];
      var age2 = t - rp2.t0;
      if (age2 < 0 || age2 > 7) { continue; }
      var rr = age2 * u * 0.14;
      var ra = 0.55 * Math.exp(-age2 / 2.5);
      ctx.strokeStyle = hexA(INK_LT, a4(ra));
      ctx.lineWidth = Math.max(1, u * 0.003);
      ctx.beginPath();
      ctx.moveTo(rp2.nx * W + rr, rp2.ny * H);
      ctx.arc(rp2.nx * W, rp2.ny * H, rr, 0, Math.PI * 2);
      ctx.stroke();
      if (age2 > 0.6) {
        ctx.strokeStyle = hexA(INK_LT, a4(ra * 0.5));
        ctx.beginPath();
        ctx.moveTo(rp2.nx * W + rr * 0.7, rp2.ny * H);
        ctx.arc(rp2.nx * W, rp2.ny * H, rr * 0.7, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    // Caustic light dapples just under the surface.
    var rng2 = mulberry32(1934);
    for (var cd = 0; cd < 14; cd++) {
      var cx2 = rng2() * W;
      var cy2 = wl + rng2() * u * 0.10;
      var cr = (1.5 + rng2() * 3) * (u / 500);
      var tw = 0.10 + 0.10 * Math.sin(t * 0.9 + cd * 1.7);
      ctx.fillStyle = hexA(SURFACE, a4(Math.max(0, tw)));
      ctx.beginPath();
      ctx.moveTo(cx2 + cr, cy2); ctx.arc(cx2, cy2, cr, 0, Math.PI * 2); ctx.fill();
    }

    // Plates: title and date on the bright surface band, top left, in
    // dark ink; hint at the bottom over deep water, in light ink.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK_DK;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Sidekick', 18, 34);
    ctx.fillStyle = hexA(INK_DK, 0.75);
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№613 · 2003 · 09 · 16', 18, 34 + fs2 + 8);

    ctx.fillStyle = hexA(INK_LT, 0.9);
    ctx.textAlign = 'center';
    ctx.font = Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    var hint = 'Tap the water to send a ripple.';
    if (W < 560) {
      ctx.fillText('Tap the water', W / 2, H - 34);
      ctx.fillText('to send a ripple.', W / 2, H - 16);
    } else {
      ctx.fillText(hint, W / 2, H - 20);
    }
    ctx.textAlign = 'left';
  }

  function tapAt(nx, ny) {
    ripples.push({ nx: nx, ny: ny, t0: currentT });
    if (ripples.length > 6) { ripples.shift(); }
    draw(currentT);
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      try {
        var r = canvas.getBoundingClientRect();
        var nx = (e.clientX - r.left) / (r.width || 1);
        var ny = (e.clientY - r.top) / (r.height || 1);
        tapAt(clamp(nx, 0, 1), clamp(ny, 0, 1));
      } catch (err) {}
    });
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(currentT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(currentT); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Tap only: no audio, no reload. All motion runs under 1 Hz, well under
  // the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      currentT = FIRST_T + (now - start) / 1000;
      draw(currentT);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
