<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garden of Myths</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #C98F5F; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict) ----------
  var CLAY = '#C98F5F';
  var CLAY_DARK = '#B57E4E';   // border band, a shade of the clay
  var CHARCOAL = '#26221E';
  var BLUE = '#3E6B8C';
  var BONE = '#EDE4D2';

  // ---------- seeded RNG ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- viewport (Visual Viewport API) ----------
  var W = 0, H = 0;
  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }
  function resize() {
    var vv = window.visualViewport;
    W = Math.round(vv ? vv.width : window.innerWidth);
    H = Math.round(vv ? vv.height : window.innerHeight);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildGrain();
    layoutScale();
    draw(0);
  }
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  // ---------- ground grain (seeded, precomputed) ----------
  var grain = [];
  function buildGrain() {
    var rnd = mulberry32(613001);
    grain = [];
    var n = Math.floor((W * H) / 9000);
    for (var i = 0; i < n; i++) {
      grain.push({
        x: rnd(), y: rnd(),
        r: 0.6 + rnd() * 1.6,
        dark: rnd() < 0.55,
        a: 0.04 + rnd() * 0.07
      });
    }
    // a few faint long scratch strokes, like a worked sketchbook page
    for (var j = 0; j < 26; j++) {
      grain.push({
        x: rnd(), y: rnd(), r: 0,
        sx: (rnd() - 0.5) * 0.05, sy: (rnd() - 0.5) * 0.012,
        dark: rnd() < 0.5, a: 0.03 + rnd() * 0.04, stroke: true
      });
    }
  }

  // ---------- creatures ----------
  // body plans: 0 quadruped, 1 serpent, 2 winged horse, 3 horned head on a neck
  var PLANS = [0, 1, 2, 3];
  var creatures = [];
  var summonCount = 0;
  var moltCount = 0;
  var unit = 100; // creature scale unit, set by layoutScale

  function makeVariant(seed) {
    var rnd = mulberry32(seed);
    return {
      wing: Math.floor(rnd() * 3),   // 0 none-ish sweep, 1 tall, 2 layered
      horn: Math.floor(rnd() * 3),   // 0 straight, 1 curled, 2 branched
      tail: Math.floor(rnd() * 3),   // 0 plain, 1 tufted, 2 forked
      crest: Math.floor(rnd() * 3),  // 0 none, 1 spikes, 2 fan
      accent: 0.55 + rnd() * 0.45,   // how much blue the variant carries
      bulk: 0.88 + rnd() * 0.28
    };
  }

  function makeCreature(plan, nx, ny, seed) {
    var rnd = mulberry32(seed * 7 + 13);
    return {
      plan: plan,
      x: nx, y: ny,                 // normalized position (center of body)
      tx: nx, ty: ny,               // wander target (normalized)
      dir: rnd() < 0.5 ? -1 : 1,
      phase: rnd() * Math.PI * 2,   // wander wobble phase
      seed: seed,
      variant: makeVariant(seed),
      moltUntil: -1,
      path: null,                   // array of {x,y} normalized, when following a drag
      entering: false,
      leaving: false,
      born: 0
    };
  }

  // frame-one cast: four plans, seeded spots, spaced apart
  var startSpots = [
    { x: 0.24, y: 0.34 }, { x: 0.72, y: 0.28 },
    { x: 0.30, y: 0.72 }, { x: 0.74, y: 0.70 }
  ];
  for (var si = 0; si < 4; si++) {
    creatures.push(makeCreature(PLANS[si], startSpots[si].x, startSpots[si].y, 613100 + si * 17));
  }

  function layoutScale() {
    unit = Math.max(46, Math.min(W, H) * (isPhone() ? 0.16 : 0.15));
  }

  // ---------- drawing helpers ----------
  function wash(alpha) { return 'rgba(38,34,30,' + alpha + ')'; }
  function blueA(alpha) { return 'rgba(62,107,140,' + alpha + ')'; }

  function bodyPath(cx, cy, s, plan) {
    ctx.beginPath();
    if (plan === 1) { // serpent: long low undulating body
      ctx.moveTo(cx - 1.15 * s, cy + 0.18 * s);
      ctx.bezierCurveTo(cx - 0.7 * s, cy - 0.34 * s, cx - 0.25 * s, cy + 0.30 * s, cx + 0.15 * s, cy - 0.05 * s);
      ctx.bezierCurveTo(cx + 0.5 * s, cy - 0.34 * s, cx + 0.8 * s, cy - 0.10 * s, cx + 1.05 * s, cy - 0.42 * s);
      ctx.bezierCurveTo(cx + 1.18 * s, cy - 0.10 * s, cx + 0.95 * s, cy + 0.22 * s, cx + 0.55 * s, cy + 0.30 * s);
      ctx.bezierCurveTo(cx + 0.1 * s, cy + 0.42 * s, cx - 0.4 * s, cy + 0.05 * s, cx - 0.75 * s, cy + 0.38 * s);
      ctx.bezierCurveTo(cx - 1.0 * s, cy + 0.45 * s, cx - 1.18 * s, cy + 0.32 * s, cx - 1.15 * s, cy + 0.18 * s);
    } else if (plan === 3) { // horned head carried on a long neck
      ctx.moveTo(cx - 0.34 * s, cy + 0.95 * s);
      ctx.bezierCurveTo(cx - 0.30 * s, cy + 0.35 * s, cx - 0.38 * s, cy - 0.05 * s, cx - 0.30 * s, cy - 0.42 * s);
      ctx.bezierCurveTo(cx - 0.28 * s, cy - 0.78 * s, cx + 0.05 * s, cy - 0.98 * s, cx + 0.38 * s, cy - 0.92 * s);
      ctx.bezierCurveTo(cx + 0.72 * s, cy - 0.86 * s, cx + 0.86 * s, cy - 0.55 * s, cx + 0.78 * s, cy - 0.30 * s);
      ctx.bezierCurveTo(cx + 0.72 * s, cy - 0.10 * s, cx + 0.45 * s, cy - 0.02 * s, cx + 0.28 * s, cy + 0.10 * s);
      ctx.bezierCurveTo(cx + 0.18 * s, cy + 0.42 * s, cx + 0.26 * s, cy + 0.95 * s, cx + 0.26 * s, cy + 0.95 * s);
      ctx.closePath();
    } else { // quadruped / winged horse body
      ctx.moveTo(cx - 0.95 * s, cy - 0.18 * s);
      ctx.bezierCurveTo(cx - 0.95 * s, cy - 0.52 * s, cx - 0.45 * s, cy - 0.62 * s, cx + 0.05 * s, cy - 0.58 * s);
      ctx.bezierCurveTo(cx + 0.55 * s, cy - 0.55 * s, cx + 0.92 * s, cy - 0.48 * s, cx + 0.98 * s, cy - 0.30 * s);
      ctx.bezierCurveTo(cx + 1.10 * s, cy - 0.62 * s, cx + 1.30 * s, cy - 0.55 * s, cx + 1.34 * s, cy - 0.34 * s); // head rise
      ctx.bezierCurveTo(cx + 1.38 * s, cy - 0.12 * s, cx + 1.24 * s, cy + 0.02 * s, cx + 1.05 * s, cy + 0.02 * s);
      ctx.bezierCurveTo(cx + 0.98 * s, cy + 0.16 * s, cx + 0.62 * s, cy + 0.26 * s, cx + 0.10 * s, cy + 0.28 * s);
      ctx.bezierCurveTo(cx - 0.45 * s, cy + 0.30 * s, cx - 0.95 * s, cy + 0.12 * s, cx - 0.95 * s, cy - 0.18 * s);
    }
    ctx.closePath();
  }

  function drawHorns(hx, hy, s, v, dir) {
    // bone horns with bone tips only; shape from variant.horn
    ctx.lineCap = 'round';
    for (var k = 0; k < 2; k++) {
      var bx = hx + (k === 0 ? -0.10 : 0.16) * s * dir;
      var by = hy - 0.28 * s;
      ctx.strokeStyle = BONE;
      ctx.lineWidth = Math.max(2, 0.075 * s);
      ctx.beginPath();
      ctx.moveTo(bx, by);
      if (v.horn === 0) {          // straight, slight lean
        ctx.quadraticCurveTo(bx + 0.10 * s * dir, by - 0.30 * s, bx + 0.22 * s * dir, by - 0.46 * s);
      } else if (v.horn === 1) {   // curled
        ctx.quadraticCurveTo(bx + 0.30 * s * dir, by - 0.34 * s, bx + 0.16 * s * dir, by - 0.52 * s);
        ctx.quadraticCurveTo(bx + 0.02 * s * dir, by - 0.62 * s, bx - 0.06 * s * dir, by - 0.46 * s);
      } else {                    // swept and forked
        ctx.quadraticCurveTo(bx + 0.34 * s * dir, by - 0.26 * s, bx + 0.44 * s * dir, by - 0.50 * s);
        ctx.moveTo(bx + 0.30 * s * dir, by - 0.33 * s);
        ctx.quadraticCurveTo(bx + 0.36 * s * dir, by - 0.46 * s, bx + 0.30 * s * dir, by - 0.60 * s);
      }
      ctx.stroke();
    }
  }

  function drawEye(ex, ey, s) {
    ctx.fillStyle = BONE;
    ctx.beginPath();
    ctx.ellipse(ex, ey, 0.075 * s, 0.05 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = CHARCOAL;
    ctx.beginPath();
    ctx.arc(ex + 0.02 * s, ey, 0.022 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawCreature(cr, t) {
    var s = unit * cr.variant.bulk;
    var cx = cr.x * W, cy = cr.y * H;
    var dir = cr.dir;
    // stepped gait: quantize phase to 6 steps per cycle (his hand)
    var step = Math.floor(((t * 0.9) + cr.phase) * 3) % 6;
    var bob = (step === 1 || step === 4) ? -0.03 * s : 0;
    var shake = 0;
    if (t < cr.moltUntil) {
      var mq = Math.floor(t * 14) % 2;
      shake = (mq === 0 ? -1 : 1) * 0.035 * s;
    }
    ctx.save();
    ctx.translate(cx + shake, cy + bob);
    ctx.scale(dir, 1);
    var v = cr.variant;

    // soft ground shadow (charcoal wash, stays inside the palette);
    // the horned head stands taller, so its shadow sits at the neck base
    ctx.fillStyle = wash(0.10);
    ctx.beginPath();
    if (cr.plan === 3) ctx.ellipse(0, 1.0 * s, 0.62 * s, 0.10 * s, 0, 0, Math.PI * 2);
    else ctx.ellipse(0, 0.52 * s, 1.05 * s, 0.13 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    // legs (quadruped plans), stepped offsets
    if (cr.plan === 0 || cr.plan === 2) {
      ctx.strokeStyle = CHARCOAL;
      ctx.lineWidth = Math.max(2.5, 0.11 * s);
      ctx.lineCap = 'round';
      var legSwing = [0.10, -0.10, -0.08, 0.08][step % 4] * s;
      var legs = [[-0.68, 1], [-0.42, 0], [0.52, 0], [0.78, 1]];
      for (var li = 0; li < 4; li++) {
        var lx = legs[li][0] * s;
        var sw = (li % 2 === 0 ? legSwing : -legSwing);
        ctx.beginPath();
        ctx.moveTo(lx, 0.18 * s);
        ctx.lineTo(lx + sw * 0.5, 0.52 * s);
        ctx.stroke();
      }
    }
    if (cr.plan === 3) { // neck base flare
      ctx.fillStyle = wash(0.30);
      ctx.beginPath();
      ctx.ellipse(0, 0.97 * s, 0.42 * s, 0.07 * s, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // tail
    ctx.strokeStyle = CHARCOAL;
    ctx.lineWidth = Math.max(2, 0.07 * s);
    ctx.beginPath();
    if (cr.plan !== 3) {
      ctx.moveTo(-0.95 * s, -0.22 * s);
      if (v.tail === 0) ctx.quadraticCurveTo(-1.25 * s, -0.05 * s, -1.22 * s, 0.28 * s);
      else if (v.tail === 1) ctx.quadraticCurveTo(-1.28 * s, 0.02 * s, -1.18 * s, 0.30 * s);
      else { ctx.quadraticCurveTo(-1.26 * s, -0.02 * s, -1.30 * s, 0.16 * s); ctx.moveTo(-1.05 * s, 0.02 * s); ctx.quadraticCurveTo(-1.22 * s, 0.14 * s, -1.16 * s, 0.34 * s); }
      ctx.stroke();
      if (v.tail === 1) { // tuft in blue
        ctx.fillStyle = blueA(0.75 * v.accent + 0.2);
        ctx.beginPath(); ctx.arc(-1.18 * s, 0.33 * s, 0.09 * s, 0, Math.PI * 2); ctx.fill();
      }
    }

    // body wash + line
    bodyPath(0, 0, s, cr.plan);
    ctx.fillStyle = wash(cr.plan === 1 ? 0.72 : 0.84);
    ctx.fill();
    ctx.strokeStyle = CHARCOAL;
    ctx.lineWidth = Math.max(2, 0.045 * s);
    ctx.stroke();

    // belly / scale shading strokes, sketchbook-like
    ctx.strokeStyle = wash(0.35);
    ctx.lineWidth = Math.max(1.2, 0.03 * s);
    for (var bi = 0; bi < 3; bi++) {
      ctx.beginPath();
      if (cr.plan === 1) {
        ctx.arc((-0.55 + bi * 0.5) * s, 0.10 * s, 0.16 * s, 0.4, 2.4);
      } else if (cr.plan === 3) {
        ctx.moveTo(-0.18 * s, (0.55 - bi * 0.3) * s);
        ctx.quadraticCurveTo(0, (0.42 - bi * 0.3) * s, 0.16 * s, (0.55 - bi * 0.3) * s);
      } else {
        ctx.moveTo((-0.55 + bi * 0.3) * s, 0.14 * s);
        ctx.quadraticCurveTo((-0.38 + bi * 0.3) * s, 0.24 * s, (-0.2 + bi * 0.3) * s, 0.12 * s);
      }
      ctx.stroke();
    }

    // crest (blue accents); the serpent carries dorsal fins instead,
    // since a crest row would float off its undulating back
    if (v.crest > 0 && cr.plan !== 3 && cr.plan !== 1) {
      ctx.fillStyle = blueA(0.65 * v.accent + 0.25);
      var cn = v.crest === 1 ? 4 : 6;
      for (var ci = 0; ci < cn; ci++) {
        var cxx = (-0.55 + ci * (1.0 / cn)) * s;
        var chh = (v.crest === 1 ? 0.22 : 0.16 + 0.08 * Math.sin(ci / (cn - 1) * Math.PI)) * s;
        ctx.beginPath();
        ctx.moveTo(cxx - 0.07 * s, -0.52 * s);
        ctx.lineTo(cxx, -0.52 * s - chh);
        ctx.lineTo(cxx + 0.07 * s, -0.52 * s);
        ctx.closePath(); ctx.fill();
      }
    }

    // wings (winged horse), blue wash with charcoal edge
    if (cr.plan === 2) {
      ctx.fillStyle = blueA(0.55 * v.accent + 0.35);
      ctx.strokeStyle = CHARCOAL;
      ctx.lineWidth = Math.max(1.6, 0.035 * s);
      ctx.beginPath();
      if (v.wing === 0) {
        ctx.moveTo(-0.10 * s, -0.45 * s);
        ctx.quadraticCurveTo(-0.55 * s, -1.25 * s, -1.05 * s, -1.15 * s);
        ctx.quadraticCurveTo(-0.62 * s, -0.72 * s, -0.30 * s, -0.34 * s);
      } else if (v.wing === 1) {
        ctx.moveTo(-0.05 * s, -0.45 * s);
        ctx.quadraticCurveTo(-0.15 * s, -1.45 * s, -0.62 * s, -1.5 * s);
        ctx.quadraticCurveTo(-0.42 * s, -0.85 * s, -0.22 * s, -0.34 * s);
      } else {
        ctx.moveTo(-0.12 * s, -0.42 * s);
        ctx.quadraticCurveTo(-0.75 * s, -1.3 * s, -1.28 * s, -1.05 * s);
        ctx.quadraticCurveTo(-0.8 * s, -0.62 * s, -0.34 * s, -0.30 * s);
        ctx.moveTo(-0.12 * s, -0.42 * s);
        ctx.quadraticCurveTo(-0.5 * s, -1.02 * s, -0.95 * s, -0.86 * s);
      }
      ctx.fill(); ctx.stroke();
    }

    // serpent fins (blue)
    if (cr.plan === 1) {
      ctx.fillStyle = blueA(0.6 * v.accent + 0.25);
      for (var fi = 0; fi < 3; fi++) {
        var fx = (-0.6 + fi * 0.55) * s;
        ctx.beginPath();
        ctx.moveTo(fx - 0.10 * s, -0.06 * s);
        ctx.lineTo(fx + 0.02 * s, -0.32 * s);
        ctx.lineTo(fx + 0.13 * s, -0.02 * s);
        ctx.closePath(); ctx.fill();
      }
    }

    // head details
    if (cr.plan === 3) {
      drawHorns(0.22 * s, -0.60 * s, s * 0.9, v, 1);
      drawEye(0.48 * s, -0.52 * s, s);
      // nostril mark, minimal face
      ctx.fillStyle = CHARCOAL;
      ctx.beginPath(); ctx.arc(0.72 * s, -0.30 * s, 0.028 * s, 0, Math.PI * 2); ctx.fill();
    } else if (cr.plan === 1) {
      drawHorns(1.02 * s, -0.36 * s, s * 0.5, v, 1);
      drawEye(0.98 * s, -0.30 * s, s);
      // forked tongue, charcoal
      ctx.strokeStyle = CHARCOAL;
      ctx.lineWidth = Math.max(1.2, 0.028 * s);
      ctx.beginPath();
      ctx.moveTo(1.22 * s, -0.18 * s);
      ctx.lineTo(1.38 * s, -0.14 * s);
      ctx.moveTo(1.38 * s, -0.14 * s); ctx.lineTo(1.46 * s, -0.20 * s);
      ctx.moveTo(1.38 * s, -0.14 * s); ctx.lineTo(1.47 * s, -0.09 * s);
      ctx.stroke();
    } else {
      drawHorns(1.10 * s, -0.34 * s, s * 0.55, v, 1);
      drawEye(1.16 * s, -0.30 * s, s);
      // mane strokes for the winged horse
      if (cr.plan === 2) {
        ctx.strokeStyle = blueA(0.7 * v.accent + 0.2);
        ctx.lineWidth = Math.max(1.6, 0.04 * s);
        for (var mi = 0; mi < 4; mi++) {
          ctx.beginPath();
          ctx.moveTo((0.98 - mi * 0.05) * s, (-0.52 + mi * 0.10) * s);
          ctx.quadraticCurveTo((0.82 - mi * 0.05) * s, (-0.38 + mi * 0.10) * s, (0.88 - mi * 0.05) * s, (-0.18 + mi * 0.10) * s);
          ctx.stroke();
        }
      }
    }

    ctx.restore();
  }

  // ---------- main draw ----------
  function draw(t) {
    if (!W || !H) return;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    // clay ground
    ctx.fillStyle = CLAY;
    ctx.fillRect(0, 0, W, H);

    // grain
    for (var gi = 0; gi < grain.length; gi++) {
      var g = grain[gi];
      ctx.globalAlpha = g.a;
      ctx.fillStyle = g.dark ? CHARCOAL : BONE;
      ctx.strokeStyle = g.dark ? CHARCOAL : BONE;
      if (g.stroke) {
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(g.x * W, g.y * H);
        ctx.lineTo((g.x + g.sx) * W, (g.y + g.sy) * H);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(g.x * W, g.y * H, g.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // sketchbook border band: a faint darker frame inside the edge
    var band = Math.max(10, Math.min(W, H) * 0.035);
    ctx.strokeStyle = CLAY_DARK;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = band * 0.45;
    ctx.strokeRect(band * 0.7, band * 0.7, W - band * 1.4, H - band * 1.4);
    ctx.globalAlpha = 1;

    // creatures, back to front by y
    var sorted = creatures.slice().sort(function (a, b) { return a.y - b.y; });
    for (var ci = 0; ci < sorted.length; ci++) drawCreature(sorted[ci], t);
  }

  // ---------- simulation ----------
  var SPEED = 0.016; // normalized units per second: slow
  function stepSim(dt, t) {
    var margin = 0.14;
    for (var i = 0; i < creatures.length; i++) {
      var cr = creatures[i];
      var goal = null;
      if (cr.path && cr.path.length) {
        goal = cr.path[0];
        var pdx = goal.x - cr.x, pdy = goal.y - cr.y;
        if (Math.sqrt(pdx * pdx + pdy * pdy) < 0.02) cr.path.shift();
        if (!cr.path.length) cr.path = null;
      }
      if (!goal) {
        var dx = cr.tx - cr.x, dy = cr.ty - cr.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 0.03) {
          var rnd = mulberry32(cr.seed * 31 + Math.floor(t) + cr.born);
          cr.tx = margin + rnd() * (1 - margin * 2);
          cr.ty = 0.18 + rnd() * 0.64;
        }
        goal = { x: cr.tx, y: cr.ty };
      }
      var gx = goal.x - cr.x, gy = goal.y - cr.y;
      var gl = Math.sqrt(gx * gx + gy * gy) || 1;
      var vx = (gx / gl) * SPEED, vy = (gy / gl) * SPEED * 0.7;

      // separation steering: never fully overlap a neighbour
      for (var j = 0; j < creatures.length; j++) {
        if (j === i) continue;
        var o = creatures[j];
        var sx = cr.x - o.x, sy = cr.y - o.y;
        var sd = Math.sqrt(sx * sx + sy * sy);
        var minD = 0.20;
        if (sd > 0.0001 && sd < minD) {
          var push = (minD - sd) / minD * SPEED * 1.6;
          vx += (sx / sd) * push; vy += (sy / sd) * push;
        }
      }
      cr.x += vx * dt;
      cr.y += vy * dt;
      if (vx > 0.0004) cr.dir = 1; else if (vx < -0.0004) cr.dir = -1;
      // keep inside the ground
      cr.x = Math.max(0.10, Math.min(0.90, cr.x));
      cr.y = Math.max(0.14, Math.min(0.88, cr.y));

      if (cr.leaving) {
        var edgeX = cr.x < 0.5 ? -0.08 : 1.08;
        if ((edgeX < 0 && cr.x <= 0.11) || (edgeX > 1 && cr.x >= 0.89)) {
          creatures.splice(i, 1); i--;
        }
      }
    }
  }

  // ---------- interaction ----------
  var downPos = null, downTime = 0, dragPath = null, lastTap = { t: -10, cr: null };

  function toNorm(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
  }
  function creatureAt(p) {
    var best = null, bestD = 1e9;
    for (var i = 0; i < creatures.length; i++) {
      var cr = creatures[i];
      var d = Math.sqrt((cr.x - p.x) * (cr.x - p.x) + (cr.y - p.y) * (cr.y - p.y));
      if (d < bestD) { bestD = d; best = cr; }
    }
    return bestD < 0.13 ? best : null;
  }
  function nearestCreature(p) {
    var best = null, bestD = 1e9;
    for (var i = 0; i < creatures.length; i++) {
      var cr = creatures[i];
      var d = Math.sqrt((cr.x - p.x) * (cr.x - p.x) + (cr.y - p.y) * (cr.y - p.y));
      if (d < bestD) { bestD = d; best = cr; }
    }
    return best;
  }

  canvas.addEventListener('pointerdown', function (e) {
    downPos = toNorm(e);
    downTime = perfNow();
    dragPath = [downPos];
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!downPos || !dragPath) return;
    var p = toNorm(e);
    var last = dragPath[dragPath.length - 1];
    if (Math.sqrt((p.x - last.x) * (p.x - last.x) + (p.y - last.y) * (p.y - last.y)) > 0.03) dragPath.push(p);
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!downPos) return;
    var p = toNorm(e);
    var moved = dragPath && dragPath.length > 2;
    var now = perfNow();
    if (moved) {
      // drag: nearest creature follows the drawn path, then resumes wandering
      var nc = nearestCreature(p);
      if (nc) {
        nc.path = dragPath.slice();
        nc.leaving = false;
      }
    } else {
      var hit = creatureAt(p);
      if (hit && lastTap.cr === hit && (now - lastTap.t) < 0.45) {
        // double-tap on a creature: molt into a new variant, same body plan
        moltCount++;
        hit.seed = 613500 + moltCount * 41;
        hit.variant = makeVariant(hit.seed);
        hit.moltUntil = (now - startStamp) / 1000 + 0.5;
        lastTap = { t: -10, cr: null };
      } else if (hit) {
        lastTap = { t: now, cr: hit };
      } else {
        lastTap = { t: now, cr: null };
        // tap empty ground: summon a creature that walks in from the nearest edge
        summonCount++;
        var seed = 613900 + summonCount * 53;
        var rnd = mulberry32(seed);
        var plan = PLANS[Math.floor(rnd() * 4)];
        var fromLeft = p.x < 0.5;
        var nc2 = makeCreature(plan, fromLeft ? 0.06 : 0.94, p.y, seed);
        nc2.dir = fromLeft ? 1 : -1;
        nc2.path = [{ x: p.x, y: p.y }];
        nc2.entering = true;
        nc2.born = summonCount;
        creatures.push(nc2);
        if (creatures.length > 5) {
          // cap 5: the oldest resident walks off
          for (var oi = 0; oi < creatures.length; oi++) {
            if (!creatures[oi].entering && !creatures[oi].leaving) {
              creatures[oi].leaving = true;
              creatures[oi].path = [{ x: creatures[oi].x < 0.5 ? 0.02 : 0.98, y: creatures[oi].y }];
              break;
            }
          }
        }
      }
    }
    downPos = null; dragPath = null;
  });
  canvas.addEventListener('pointercancel', function () { downPos = null; dragPath = null; });

  // ---------- clock: anchored elapsed, never wall-clock phase ----------
  var startStamp = null;
  function perfNow() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  }
  function frame(now) {
    if (startStamp === null) startStamp = now;
    var t = (now - startStamp) / 1000;
    stepSim(Math.min(0.05, t - (frame._last || 0)), t);
    frame._last = t;
    draw(t);
  }

  resize();
  draw(0); // synchronous first frame at gait phase 0
  if (typeof requestAnimationFrame === 'function') {
    var loop = function (now) { frame(now); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
