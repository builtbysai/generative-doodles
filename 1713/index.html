<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bright Intruder</title>
<style>
html, body { margin: 0; padding: 0; background: #1B1B1D; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#1B1B1D';
var CHARCOAL = '#1B1B1D';
var PLATE = '#101012';
var PLATE_LINE = 'rgba(255,107,53,0.55)';
var TITLE_INK = '#F2F2F0';
var HINT_INK = '#FF8A5C';
var CORAL = '#FF6B35';
var SLATE_A = '#6E757F';
var SLATE_B = '#555B63';
var SLATE_C = '#454A52';
var SLATE_D = '#828A94';
var PERIOD = 16;
var FRAME_T = 4.2;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1713);
/* ---- contour terrain: one off-center scalar field, drawn as nested wobbled rings ---- */
var TCX = 0.40, TCY = 0.56; /* terrain center, stage fractions */
var RINGS = 15;
var rings = [];
var i;
for (i = 0; i < RINGS; i++) {
  rings.push({
    base: 0.055 + i * 0.055,          /* base radius, fraction of stage height */
    a3: 0.04 + rng() * 0.05,          /* 3-fold wobble amplitude */
    p3: rng() * TAU,
    a5: 0.02 + rng() * 0.03,          /* 5-fold wobble amplitude */
    p5: rng() * TAU,
    col: i % 4 === 0 ? SLATE_D : (i % 4 === 1 ? SLATE_A : (i % 4 === 2 ? SLATE_B : SLATE_C)),
    a: 0.45 + rng() * 0.35,
    w: 0.8 + rng() * 0.9
  });
}
/* ---- intruder: one closed spiky polygon, star-like, sharp vertices ---- */
var SPIKES = 26;
var intruder = {
  cx: 0.66, cy: 0.36,                 /* center, stage fractions (off-center) */
  rOut: 0.52, rIn: 0.40,              /* radii, fraction of stage min dimension */
  rot0: 0.35,                         /* fixed rotation at frame one, radians */
  rotRate: TAU / PERIOD * 0.25,       /* slow rotation, radians per second */
  driftAmp: 0.030, driftPer: PERIOD, /* slow center drift, stage fractions */
  spikeJit: []                        /* per-vertex radius jitter, seeded */
};
for (i = 0; i < SPIKES * 2; i++) {
  intruder.spikeJit.push(0.86 + rng() * 0.28);
}
var phaseT = FRAME_T;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- terrain fills the frame on both desktop and phone ---- */
function stageRect() {
  return { x: 0, y: 0, w: VW, h: VH };
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var sw = st.w, sh = st.h;
  var t = phaseT;
  var breathe = TAU * t / PERIOD;
  ctx.save();
  ctx.beginPath();
  ctx.rect(st.x, st.y, sw, sh);
  ctx.clip();
  var k, th, rr, x, y;
  /* ---- contour rings: closed-form radius, breathing with time ---- */
  var cx = st.x + TCX * sw, cy = st.y + TCY * sh;
  for (k = 0; k < rings.length; k++) {
    var rg = rings[k];
    var scale = 1 + 0.035 * Math.sin(breathe + k * 0.35);
    var ph3 = rg.p3 + 0.18 * Math.sin(breathe * 0.5 + k * 0.7);
    var ph5 = rg.p5 + 0.12 * Math.sin(breathe * 0.5 + k * 0.9 + 1.3);
    ctx.beginPath();
    for (th = 0; th <= 128; th++) {
      var ang = th / 128 * TAU;
      rr = rg.base * sh * scale * (1 + rg.a3 * Math.sin(3 * ang + ph3) + rg.a5 * Math.sin(5 * ang + ph5));
      x = cx + Math.cos(ang) * rr;
      y = cy + Math.sin(ang) * rr;
      if (th === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.lineWidth = Math.max(0.75, sh * 0.0011 * rg.w);
    ctx.strokeStyle = rgba(rg.col, rg.a);
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
  /* ---- intruder: spiky closed polygon, rotated and drifted as a closed form of t ---- */
  var icx = st.x + (intruder.cx + intruder.driftAmp * Math.sin(breathe + 1.1)) * sw;
  var icy = st.y + (intruder.cy + intruder.driftAmp * 0.7 * Math.cos(breathe * 0.8 + 0.6)) * sh;
  var rot = intruder.rot0 + intruder.rotRate * t;
  var sMin = Math.min(sw, sh);
  ctx.beginPath();
  for (k = 0; k <= SPIKES * 2; k++) {
    var kk = k % (SPIKES * 2);
    var vang = rot + kk / (SPIKES * 2) * TAU;
    var vrad = (kk % 2 === 0 ? intruder.rOut : intruder.rIn) * intruder.spikeJit[kk] * sMin;
    x = icx + Math.cos(vang) * vrad;
    y = icy + Math.sin(vang) * vrad;
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = rgba(CORAL, 0.05);
  ctx.fill();
  ctx.lineWidth = Math.max(1.5, sh * 0.0028);
  ctx.strokeStyle = rgba(CORAL, 0.95);
  ctx.lineJoin = 'miter';
  ctx.miterLimit = 10;
  ctx.stroke();
  ctx.restore();
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Bright Intruder').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Bright Intruder').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 20').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Bright Intruder', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 20', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    ringCount: function () { return RINGS; },
    spikeCount: function () { return SPIKES; },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 4.2s, intruder rotated 0.35 + rotRate*4.2 rad, terrain breathing at sin(2*pi*4.2/16) ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
