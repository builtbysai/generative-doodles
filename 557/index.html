<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Es Aquí</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F2E35A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: strict, nothing else. Flat fills only, no gradients.
  var DEVIL = '#D93A2B', FLAME = '#F07B2E', SMOKE = '#6A4A6A',
      GROUND = '#F2E35A', SNAKE = '#4EA85A', INK = '#1A1A1A',
      BLOOD = '#C02A2A', CAPTION = '#F7E9A0', BONE = '#F2EDE0';

  var PHASE0 = 3.0;     // constant first-frame phase
  var LOOP = 12;        // shared loop clock, seconds
  var DW = 810, DH = 1080; // portrait design space
  var FLOOR = 1010;     // floor line in design space

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(557067);
  function mod(a, n) { return ((a % n) + n) % n; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, k) { return a + (b - a) * k; }

  // ---- small canvas helpers ----
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
  function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
  function fillStroke(fill, lw) {
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (lw) { ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function fatLine(x1, y1, x2, y2, wOuter, wInner, innerColor) {
    ctx.lineCap = 'round';
    ctx.strokeStyle = INK; ctx.lineWidth = wOuter;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = innerColor; ctx.lineWidth = wInner;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  // jittered rectangle path (deterministic per seed), for hand-drawn boxes
  function wobblyRect(x, y, w, h, seed, jit) {
    var r = mulberry32(seed);
    var pts = [], i, n = 5;
    for (i = 0; i <= n; i++) pts.push([x + (w * i) / n, y + (r() - 0.5) * jit]);
    for (i = 1; i <= n; i++) pts.push([x + w + (r() - 0.5) * jit, y + (h * i) / n]);
    for (i = 1; i <= n; i++) pts.push([x + w - (w * i) / n, y + h + (r() - 0.5) * jit]);
    for (i = 1; i < n; i++) pts.push([x + (r() - 0.5) * jit, y + h - (h * i) / n]);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }

  // ---- wobbly hand-lettered text: layout precomputed once, deterministic ----
  var FONT_STACK = '"Comic Sans MS", "Chalkboard SE", "Arial Rounded MT Bold", "DejaVu Sans", sans-serif';
  function layoutText(text, size, maxW, seed) {
    var font = '700 ' + size + 'px ' + FONT_STACK;
    ctx.font = font;
    var words = text.split(' '), lines = [], cur = '', i, j;
    for (i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width <= maxW || !cur) cur = test;
      else { lines.push(cur); cur = words[i]; }
    }
    if (cur) lines.push(cur);
    var r = mulberry32(seed);
    var out = [];
    for (i = 0; i < lines.length; i++) {
      var letters = [], x = 0;
      for (j = 0; j < lines[i].length; j++) {
        var ch = lines[i][j], w = ctx.measureText(ch).width;
        letters.push({ ch: ch, cx: x + w / 2, w: w, rot: (r() - 0.5) * 0.10, dy: (r() - 0.5) * 3.2 });
        x += w + 0.4;
      }
      out.push({ letters: letters, width: x });
    }
    return { font: font, size: size, lines: out, lineHeight: size * 1.42 };
  }
  function drawLayout(lay, cx, topY) {
    ctx.font = lay.font;
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    for (var i = 0; i < lay.lines.length; i++) {
      var line = lay.lines[i], baseY = topY + i * lay.lineHeight, x0 = cx - line.width / 2;
      for (var j = 0; j < line.letters.length; j++) {
        var L = line.letters[j];
        ctx.save();
        ctx.translate(x0 + L.cx, baseY + L.dy);
        ctx.rotate(L.rot);
        ctx.fillText(L.ch, 0, 0);
        ctx.restore();
      }
    }
  }

  var CAPTION_TEXT = "¿Sabías que… Satanás tiene un lugar reservado para la gente que te dice 'qué loca estás' sin ningún motivo?";
  var capLay = null;
  (function () {
    var sizes = [33, 31, 29, 27, 25];
    for (var i = 0; i < sizes.length; i++) {
      var lay = layoutText(CAPTION_TEXT, sizes[i], 688, 557001);
      if (lay.lines.length <= 3 && lay.lines.length * lay.lineHeight <= 148) { capLay = lay; break; }
      capLay = lay;
    }
  })();
  var bubLay = layoutText('¡ES AQUÍ!', 46, 420, 557002);

  // ---- seeded set dressing: edge flames and smoke puffs ----
  var FLAMES = [];
  (function () {
    var x, y;
    for (x = 34; x < 768; x += 56 + rng() * 24)
      FLAMES.push({ x: x, y: DH, h: 58 + rng() * 56, rot: 0, ph: rng() * 3 });
    for (y = 268; y < 985; y += 100 + rng() * 28)
      FLAMES.push({ x: 4, y: y, h: 52 + rng() * 34, rot: Math.PI / 2, ph: rng() * 3 });
    for (y = 300; y < 985; y += 100 + rng() * 28)
      FLAMES.push({ x: DW - 4, y: y, h: 52 + rng() * 34, rot: -Math.PI / 2, ph: rng() * 3 });
  })();
  var PUFFS_A = [], PUFFS_B = [], i;
  for (i = 0; i < 8; i++) PUFFS_A.push({ off: i / 8, wob: rng() * 6.28, drift: 34 + rng() * 22 });
  for (i = 0; i < 5; i++) PUFFS_B.push({ off: i / 5, wob: rng() * 6.28, drift: 18 + rng() * 14 });

  // ---- interaction state (all -1e9 in frame one: no bubble, no hiss, no clack) ----
  var pointT0 = -1e9, hissT0 = -1e9, clackT0 = -1e9;
  var simT = PHASE0;

  // ---- flames: flat shapes, 3-frame swap cycle on the shared clock ----
  var FLAME_HF = [0.93, 1.07, 1.0], FLAME_LEAN = [-0.16, 0.0, 0.15];
  function flameShape(h, fr) {
    var hf = FLAME_HF[fr], lean = FLAME_LEAN[fr] * h * 0.38, w = h * 0.54, hh = h * hf;
    ctx.beginPath();
    ctx.moveTo(-w / 2, 0);
    ctx.quadraticCurveTo(-w * 0.62, -hh * 0.45, lean, -hh);
    ctx.quadraticCurveTo(w * 0.62, -hh * 0.45, w / 2, 0);
    ctx.quadraticCurveTo(0, h * 0.10, -w / 2, 0);
    ctx.closePath();
  }
  function drawFlame(f, t) {
    var fr = Math.floor(t / 0.4 + f.ph) % 3;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.rot);
    flameShape(f.h, fr); ctx.fillStyle = FLAME; ctx.fill();
    flameShape(f.h * 0.58, fr); ctx.fillStyle = DEVIL; ctx.fill();
    ctx.restore();
  }

  // ---- purple smoke curling above ----
  function drawSmoke(t) {
    var k, ph, x, y, r;
    ctx.fillStyle = SMOKE;
    for (k = 0; k < PUFFS_A.length; k++) {
      ph = mod(t / 6 + PUFFS_A[k].off, 1);
      x = 655 + Math.sin(ph * 9.4 + PUFFS_A[k].wob) * 26 + ph * PUFFS_A[k].drift;
      y = 548 - ph * 212;
      r = 13 + ph * 24;
      ctx.globalAlpha = 0.14 + 0.5 * (1 - ph);
      circ(x, y, r); ctx.fill();
    }
    for (k = 0; k < PUFFS_B.length; k++) {
      ph = mod(t / 6 + PUFFS_B[k].off + 0.37, 1);
      x = 168 + Math.sin(ph * 8.2 + PUFFS_B[k].wob) * 20 - ph * PUFFS_B[k].drift;
      y = 522 - ph * 178;
      r = 10 + ph * 19;
      ctx.globalAlpha = 0.12 + 0.42 * (1 - ph);
      circ(x, y, r); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---- the jolly devil (origin: floor centre under him) ----
  function drawDevil(t, pointK) {
    var bob = 3 * Math.sin(2 * Math.PI * t / 3);
    ctx.save();
    ctx.translate(248, FLOOR + bob);

    // tail, curling up behind him, spade tip clear of the skull
    fatLine(-70, -148, -120, -122, 15, 8, DEVIL);
    fatLine(-120, -122, -106, -94, 15, 8, DEVIL);
    ctx.beginPath();
    ctx.moveTo(-106, -84); ctx.lineTo(-124, -116); ctx.lineTo(-88, -114);
    ctx.closePath(); fillStroke(DEVIL, 5);

    // bat wings, spread behind the torso
    ctx.beginPath();
    ctx.moveTo(-28, -302);
    ctx.lineTo(-188, -388);
    ctx.quadraticCurveTo(-158, -306, -128, -330);
    ctx.quadraticCurveTo(-106, -272, -76, -298);
    ctx.quadraticCurveTo(-58, -244, -32, -228);
    ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(28, -302);
    ctx.lineTo(188, -388);
    ctx.quadraticCurveTo(158, -306, 128, -330);
    ctx.quadraticCurveTo(106, -272, 76, -298);
    ctx.quadraticCurveTo(58, -244, 32, -228);
    ctx.closePath(); ctx.fillStyle = INK; ctx.fill();

    // legs and hooves
    fatLine(-38, -98, -40, -16, 24, 15, DEVIL);
    fatLine(38, -98, 40, -16, 24, 15, DEVIL);
    ell(-42, -7, 18, 10); ctx.fillStyle = INK; ctx.fill();
    ell(42, -7, 18, 10); ctx.fillStyle = INK; ctx.fill();

    // torso with a blood-red belly
    ell(0, -192, 79, 106); fillStroke(DEVIL, 6);
    ell(0, -168, 47, 66); ctx.fillStyle = BLOOD; ctx.fill();

    // raised waving arm (viewer's left), swaying gently
    var swayX = 9 * Math.sin(2 * Math.PI * t / 3);
    var swayY = 5 * Math.sin(2 * Math.PI * t / 1.5 + 1);
    fatLine(-66, -258, -106, -316, 26, 17, DEVIL);
    fatLine(-106, -316, -138 + swayX, -368 + swayY, 26, 17, DEVIL);
    circ(-140 + swayX, -372 + swayY, 15); fillStroke(DEVIL, 5);
    circ(-152 + swayX, -386 + swayY, 7); fillStroke(DEVIL, 4);
    circ(-138 + swayX, -390 + swayY, 7); fillStroke(DEVIL, 4);
    circ(-125 + swayX, -385 + swayY, 7); fillStroke(DEVIL, 4);

    // presenting arm (viewer's right): open palm, or pointing when tapped
    var hx = lerp(160, 202, pointK), hy = lerp(-202, -264, pointK);
    fatLine(66, -252, 126, -238 + (hy + 206) * 0.3, 26, 17, DEVIL);
    fatLine(126, -238 + (hy + 206) * 0.3, hx, hy, 26, 17, DEVIL);
    circ(hx, hy, 15); fillStroke(DEVIL, 5);
    if (pointK > 0.5) {
      fatLine(hx + 8, hy - 4, hx + 42, hy - 10, 11, 6, DEVIL); // index finger at the chair
    } else {
      circ(hx + 2, hy - 16, 7); fillStroke(DEVIL, 4);
      circ(hx + 14, hy - 12, 7); fillStroke(DEVIL, 4);
      circ(hx + 16, hy + 2, 7); fillStroke(DEVIL, 4);
    }

    // head, tilting a touch toward the chair while pointing
    ctx.save();
    ctx.translate(0, -345);
    ctx.rotate(pointK * 0.07);
    // horns, bone white crescents
    ctx.beginPath();
    ctx.moveTo(-14, -50);
    ctx.quadraticCurveTo(-82, -58, -92, -122);
    ctx.quadraticCurveTo(-60, -88, -52, -40);
    ctx.closePath(); fillStroke(BONE, 5);
    ctx.beginPath();
    ctx.moveTo(14, -50);
    ctx.quadraticCurveTo(82, -58, 92, -122);
    ctx.quadraticCurveTo(60, -88, 52, -40);
    ctx.closePath(); fillStroke(BONE, 5);
    // pointed ears
    ctx.beginPath();
    ctx.moveTo(-50, -6); ctx.lineTo(-80, 2); ctx.lineTo(-52, 26);
    ctx.closePath(); fillStroke(DEVIL, 5);
    ctx.beginPath();
    ctx.moveTo(50, -6); ctx.lineTo(80, 2); ctx.lineTo(52, 26);
    ctx.closePath(); fillStroke(DEVIL, 5);
    // face
    circ(0, 0, 62); fillStroke(DEVIL, 6);
    // happy eyes, pupils on the chair
    ell(-24, -12, 11, 13); ctx.fillStyle = BONE; ctx.fill();
    ell(26, -12, 11, 13); ctx.fillStyle = BONE; ctx.fill();
    circ(-21 + pointK * 2, -11, 5); ctx.fillStyle = INK; ctx.fill();
    circ(29 + pointK * 2, -11, 5); ctx.fillStyle = INK; ctx.fill();
    // raised brows
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-38, -34); ctx.quadraticCurveTo(-24, -42, -11, -35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, -35); ctx.quadraticCurveTo(26, -42, 39, -34); ctx.stroke();
    // nose
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(2, 4, 6, 0.15 * Math.PI, 0.95 * Math.PI); ctx.stroke();
    // the big showman's grin, bone teeth and all
    ctx.beginPath();
    ctx.moveTo(-35, 16);
    ctx.quadraticCurveTo(0, 52, 35, 16);
    ctx.quadraticCurveTo(0, 30, -35, 16);
    ctx.closePath(); fillStroke(BONE, 5);
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-13, 25); ctx.lineTo(-13, 36);
    ctx.moveTo(1, 29); ctx.lineTo(1, 41);
    ctx.moveTo(14, 25); ctx.lineTo(14, 35);
    ctx.stroke();
    // goatee
    ctx.beginPath();
    ctx.moveTo(-9, 56); ctx.lineTo(9, 56); ctx.lineTo(0, 84);
    ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
    ctx.restore(); // head

    ctx.restore(); // devil
  }

  // ---- the spiked chair, oozing (origin: floor centre under it) ----
  function drawChair() {
    ctx.save();
    ctx.translate(618, FLOOR);
    // blood pool first, under everything
    ell(0, 4, 122, 13); ctx.fillStyle = BLOOD; ctx.fill();
    ell(-58, 8, 44, 8); ctx.fillStyle = BLOOD; ctx.fill();
    // legs
    ctx.fillStyle = INK;
    ctx.fillRect(-88, -90, 20, 90);
    ctx.fillRect(68, -90, 20, 90);
    ctx.fillRect(-88, -34, 176, 13);
    // back
    ctx.fillRect(-85, -318, 170, 208);
    // spikes: five on top, three out of each side
    var sx = [-85, -42, 0, 42, 85], i;
    ctx.beginPath();
    for (i = 0; i < 5; i++) {
      ctx.moveTo(sx[i] - 15, -316); ctx.lineTo(sx[i], -352); ctx.lineTo(sx[i] + 15, -316);
    }
    for (i = 0; i < 3; i++) {
      var sy = -268 + i * 58;
      ctx.moveTo(-83, sy - 14); ctx.lineTo(-112, sy); ctx.lineTo(-83, sy + 14);
      ctx.moveTo(83, sy - 14); ctx.lineTo(112, sy); ctx.lineTo(83, sy + 14);
    }
    ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
    // blood-red cushion panel in the back
    ctx.fillStyle = BLOOD;
    ctx.fillRect(-60, -292, 120, 148);
    // seat and its cushion
    ctx.fillStyle = INK;
    ctx.fillRect(-98, -118, 196, 30);
    ctx.fillStyle = BLOOD;
    ctx.fillRect(-98, -134, 196, 18);
    // the ooze: drips off the seat front and down the cushion
    ctx.fillStyle = BLOOD;
    var drips = [[-64, 66], [-18, 38], [30, 78], [74, 48]];
    for (i = 0; i < drips.length; i++) {
      var dx = drips[i][0], dl = drips[i][1];
      ctx.fillRect(dx - 5, -90, 10, dl);
      circ(dx, -90 + dl, 6); ctx.fill();
    }
    ctx.fillRect(-34, -292, 9, 54); circ(-29, -236, 5); ctx.fill();
    ctx.fillRect(22, -292, 9, 34); circ(27, -256, 5); ctx.fill();
    ctx.restore();
  }

  // ---- the cobra (origin: floor centre under its coils) ----
  function drawCobra(t, tongueFrame) {
    ctx.save();
    ctx.translate(462, FLOOR);
    var sway = 6 * Math.sin(2 * Math.PI * t / 3 + 1);
    // coils
    ell(0, -10, 56, 16); fillStroke(SNAKE, 5);
    ell(0, -26, 42, 13); fillStroke(SNAKE, 5);
    // rising body with a pale belly stripe
    fatLine(0, -30, sway * 0.4, -96, 34, 25, SNAKE);
    fatLine(sway * 0.4, -96, sway, -148, 34, 25, SNAKE);
    fatLine(0, -34, sway * 0.4, -94, 12, 7, BONE);
    fatLine(sway * 0.4, -94, sway, -144, 12, 7, BONE);
    // hood, flared wide behind the head
    ctx.save();
    ctx.translate(sway, -140);
    ell(0, 8, 58, 52); fillStroke(SNAKE, 5);
    // hood speckles, two ink dots low on each side
    circ(-30, 22, 4); ctx.fillStyle = INK; ctx.fill();
    circ(30, 22, 4); ctx.fillStyle = INK; ctx.fill();
    circ(-20, 36, 3.2); ctx.fillStyle = INK; ctx.fill();
    circ(20, 36, 3.2); ctx.fillStyle = INK; ctx.fill();
    // head, riding clear above the hood's top edge
    ell(0, -50, 25, 19); fillStroke(SNAKE, 5);
    circ(-9, -53, 3.6); ctx.fillStyle = INK; ctx.fill();
    circ(9, -53, 3.6); ctx.fillStyle = INK; ctx.fill();
    // tongue, only while hissing: 3-frame flick
    if (tongueFrame >= 0) {
      var tl = [10, 24, 15][tongueFrame];
      ctx.strokeStyle = DEVIL; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(8, -38); ctx.lineTo(8 + tl, -32);
      ctx.moveTo(8 + tl, -32); ctx.lineTo(8 + tl + 7, -38);
      ctx.moveTo(8 + tl, -32); ctx.lineTo(8 + tl + 7, -26);
      ctx.stroke();
    }
    ctx.restore();
    ctx.restore();
  }

  // ---- the skull (origin: floor centre under it) ----
  function drawSkull(jawOff) {
    ctx.save();
    ctx.translate(102, 992);
    // cranium
    ctx.beginPath();
    ctx.moveTo(-31, -8);
    ctx.quadraticCurveTo(-38, -58, 0, -63);
    ctx.quadraticCurveTo(38, -58, 31, -8);
    ctx.quadraticCurveTo(29, 3, 18, 3);
    ctx.lineTo(-18, 3);
    ctx.quadraticCurveTo(-29, 3, -31, -8);
    ctx.closePath(); fillStroke(BONE, 5);
    // crack
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(9, -58); ctx.lineTo(4, -46); ctx.lineTo(10, -37);
    ctx.stroke();
    // sockets and nose
    ell(-13, -26, 8, 10); ctx.fillStyle = INK; ctx.fill();
    ell(13, -26, 8, 10); ctx.fillStyle = INK; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-5, -5); ctx.lineTo(5, -5); ctx.lineTo(0, -16);
    ctx.closePath(); ctx.fillStyle = INK; ctx.fill();
    // jaw, clacks once when tapped
    ctx.save();
    ctx.translate(0, jawOff);
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-17, 0, 34, 17, 6); else ctx.rect(-17, 0, 34, 17);
    fillStroke(BONE, 4.5);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-8, 3); ctx.lineTo(-8, 13);
    ctx.moveTo(0, 3); ctx.lineTo(0, 14);
    ctx.moveTo(8, 3); ctx.lineTo(8, 13);
    ctx.stroke();
    ctx.restore();
    ctx.restore();
  }

  // ---- the "¡ES AQUÍ!" bubble, popped toward the chair ----
  function drawBubble(t, age) {
    var u = clamp(age / 0.16, 0, 1);
    var s = u >= 1 ? 1 : 0.55 + 0.45 * u + 0.12 * Math.sin(u * Math.PI);
    ctx.save();
    ctx.translate(452, 472);
    ctx.scale(s, s);
    // flame burst around it, first half second only
    if (age < 0.55) {
      var burst = [[-128, -30], [-70, -58], [8, -64], [86, -52], [128, -22], [118, 26], [-122, 28]];
      var fr = Math.floor(age / 0.09) % 3;
      ctx.save();
      ctx.globalAlpha = 1 - age / 0.55;
      for (var i = 0; i < burst.length; i++) {
        ctx.save();
        ctx.translate(burst[i][0], burst[i][1]);
        flameShape(30, fr); ctx.fillStyle = FLAME; ctx.fill();
        flameShape(17, fr); ctx.fillStyle = DEVIL; ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }
    // tail down toward the devil's head
    ctx.beginPath();
    ctx.moveTo(-58, 36); ctx.lineTo(-148, 108); ctx.lineTo(-6, 40);
    ctx.closePath(); fillStroke(BONE, 5);
    var bw = bubLay.lines[0].width + 56, bh = 84;
    wobblyRect(-bw / 2, -bh / 2, bw, bh, 557003, 5);
    fillStroke(BONE, 5);
    drawLayout(bubLay, 0, 16);
    ctx.restore();
  }

  // ---- caption box ----
  function drawCaption() {
    wobblyRect(24, 22, DW - 48, 190, 557004, 5);
    fillStroke(CAPTION, 5.5);
    var blockH = capLay.lines.length * capLay.lineHeight;
    var topY = 22 + (190 - blockH) / 2 + capLay.size * 0.92;
    drawLayout(capLay, DW / 2, topY);
  }

  // ---- tap hit zones, design space ----
  var ZONES = [
    { id: 'chair', x0: 520, x1: 738, y0: 640, y1: 1016 },
    { id: 'snake', x0: 392, x1: 516, y0: 786, y1: 1016 },
    { id: 'skull', x0: 50, x1: 156, y0: 916, y1: 1032 }
  ];

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(SC, SC);
    ctx.lineJoin = 'round';

    var age = t - pointT0;
    var pointing = age < 1.8;
    var pointK = pointing ? clamp(age / 0.12, 0, 1) : 0;
    var hAge = t - hissT0;
    var tongueFrame = hAge < 1.2 ? Math.floor(hAge / 0.12) % 3 : -1;
    var cAge = t - clackT0;
    var jawOff = cAge < 0.45 ? 11 * Math.sin(Math.PI * cAge / 0.45) : 0;

    drawCaption();

    var i;
    for (i = 0; i < FLAMES.length; i++) drawFlame(FLAMES[i], t);
    drawSmoke(t);

    // scorch shadows under the cast
    ctx.fillStyle = SMOKE;
    ctx.globalAlpha = 0.35;
    ell(248, FLOOR + 3, 122, 13); ctx.fill();
    ell(618, FLOOR + 5, 132, 14); ctx.fill();
    ell(462, FLOOR + 3, 72, 10); ctx.fill();
    ell(102, 995, 50, 8); ctx.fill();
    ctx.globalAlpha = 1;

    drawChair();
    drawCobra(t, tongueFrame);
    drawSkull(jawOff);
    drawDevil(t, pointK);
    if (pointing) drawBubble(t, Math.max(age, 0));

    // hint
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = INK;
    ctx.font = '25px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('tap', 788, 1066);
    ctx.restore();

    ctx.restore();
  }

  // ---- sizing (Visual Viewport API; portrait stage centred; page ground is the ground yellow) ----
  var W = 0, H = 0, SC = 1, OX = 0, OY = 0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) {
      SC = W / DW;
      OX = 0; OY = (H - DH * SC) / 2;
    } else {
      SC = Math.min(W / DW, H / DH);
      OX = (W - DW * SC) / 2; OY = (H - DH * SC) / 2;
    }
    draw(simT);
  }

  // ---- tap: chair / snake / skull each get their gag ----
  var lastTapStamp = -1e9;
  function onTap(e) {
    if (e.timeStamp !== undefined && e.timeStamp - lastTapStamp < 350) return;
    lastTapStamp = e.timeStamp || 0;
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var px = (e.clientX - rect.left - OX) / SC;
    var py = (e.clientY - rect.top - OY) / SC;
    for (var i = 0; i < ZONES.length; i++) {
      var z = ZONES[i];
      if (px >= z.x0 && px <= z.x1 && py >= z.y0 && py <= z.y1) {
        if (z.id === 'chair') pointT0 = simT;
        else if (z.id === 'snake') hissT0 = simT;
        else if (z.id === 'skull') clackT0 = simT;
        draw(simT);
        return;
      }
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onTap);
    canvas.addEventListener('touchstart', onTap);
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
