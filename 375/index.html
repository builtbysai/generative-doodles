<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.375 Dark Eggs</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#121216; }
  canvas { display:block; touch-action:none; cursor:grab; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.375 Dark Eggs (al_kovalyova_design).
// After Olena Kovalova's Dark Academia Easter pivot:
// twelve decorated eggs as medallions on near-black,
// arranged 3 across by 4 down, each egg a field of tiny
// gold motifs from one shared library (thistle,
// crescent, eye-spiral, cross-stitch diamond) laid out
// in its own authored arrangement, a thin gold ring
// around each egg, sage sprigs standing in the gutters
// between them. The eggs sway a few degrees and the
// gold shimmers, both on whole cycles of the 48s loop.
// Tap an egg and it opens like a locket: two half-egg
// shells hinged at their outer edges swing inward to
// reveal a tiny scene inside (bird, fiddlehead or moon,
// from a fixed table); tap again to close. Drag through
// the grid and the eggs scatter on soft springs, then
// settle back to exactly their grid slots. No pastels,
// no chicks, no bunnies: the mood stays nocturnal.
// Nothing is runtime random: the grid, the twelve
// layouts, the scene table, the sprigs and every phase
// are fixed data below.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#121216', EGGC = '#1E1A1E', GOLD = '#C9A24B';
var BRONZE = '#6B4C2A', SLATE = '#3A3A44', SAGE = '#5C7A58';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 48;
if (LOOP !== 48) throw new Error('Dark Eggs loop must be 48s');
var TICK = 1 / 60;
// Shimmer and sway complete whole cycles per loop.
var SHIM_CYCLES = 3, ROT_CYCLES = 2;
var ROT_MAX = 3 * Math.PI / 180; // plus/minus 3 degrees

// ---- the grid ----------------------------------------------
// Eggs are 150 design px tall, one sixth of the design
// height, 116 wide. 3 columns by 4 rows, the block
// centred in the design space.
var EGG_W = 116, EGG_H = 150;
var COLS = [320, 640, 960], ROWS = [168, 356, 544, 732];
var SCENES = ['bird', 'fiddlehead', 'moon'];
if (SCENES.length !== 3) throw new Error('Dark Eggs needs exactly 3 locket scenes');
var EGGS = [];
(function buildEggs() {
  for (var r = 0; r < ROWS.length; r++) {
    for (var c = 0; c < COLS.length; c++) {
      var i = r * COLS.length + c;
      EGGS.push({
        idx: i, hx: COLS[c], hy: ROWS[r],
        layout: i, // twelve eggs, twelve layouts, asserted unique below
        scene: SCENES[i % SCENES.length],
        phase: i * 0.83, rotPhase: i * 1.37,
        x: 0, y: 0, vx: 0, vy: 0, // scramble offsets, start exactly home
        open: 0, openTarget: 0
      });
    }
  }
})();
if (EGGS.length !== 12) throw new Error('Dark Eggs needs exactly 12 eggs');
(function assertUniqueLayouts() {
  var seen = {};
  for (var i = 0; i < EGGS.length; i++) {
    if (seen[EGGS[i].layout]) throw new Error('Dark Eggs layouts must be unique');
    seen[EGGS[i].layout] = true;
  }
})();

// ---- gutter sprigs ------------------------------------------
// Sage sprigs standing in the gutters and margins
// between the eggs: [x, y, rotation]. Fixed data.
var SPRIGS = [
  [480, 262, 0.10], [800, 262, -0.14], [480, 450, -0.08], [800, 450, 0.12],
  [480, 638, 0.14], [800, 638, -0.10], [160, 356, -0.12], [1120, 356, 0.10],
  [160, 544, 0.08], [1120, 544, -0.08], [160, 168, 0.16], [1120, 732, -0.16]
];

// ---- clock ---------------------------------------------------
// Constant first-frame phase: T = 13.0s into the 48s
// loop, shimmer mid-wave, sway mid-swing, every egg
// closed and exactly on its grid slot. The animation
// clock is anchored to this constant plus elapsed time
// since load, advanced in fixed 1/60 ticks. Frame one
// is never drawn from a wall clock.
var T = 13.0;
var lastNow = -1, acc = 0;

// ---- motif library (shared by all twelve eggs) ---------------
function dot(x, y, r, col) {
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
function diamond(x, y, s, col) {
  // cross-stitch diamond: outline, X stitch, centre dot
  ctx.strokeStyle = col; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.72, y); ctx.lineTo(x, y + s); ctx.lineTo(x - s * 0.72, y);
  ctx.closePath(); ctx.stroke();
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.moveTo(x - s * 0.4, y - s * 0.42); ctx.lineTo(x + s * 0.4, y + s * 0.42);
  ctx.moveTo(x + s * 0.4, y - s * 0.42); ctx.lineTo(x - s * 0.4, y + s * 0.42);
  ctx.stroke();
  dot(x, y, 1.4, col);
}
function crescent(x, y, r, col, rot) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot || 0);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2, false);
  ctx.arc(r * 0.44, -r * 0.14, r * 0.82, 0, Math.PI * 2, true);
  ctx.fill('evenodd');
  ctx.restore();
}
function eyeSpiral(x, y, r, col) {
  // Archimedean spiral iris inside a thin ring, pupil dot
  ctx.strokeStyle = col; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  var steps = 56, turns = 2.25;
  for (var i = 0; i <= steps; i++) {
    var u = i / steps, a = u * turns * Math.PI * 2, rr = r * 0.8 * u;
    var px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  dot(x, y, 1.5, col);
}
function thistle(x, y, s, col, rot) {
  // sprig thistle: stem, crosshatched bulb, crown spikes,
  // two leaves. s is the full height of the motif.
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot || 0);
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, s * 0.5); ctx.lineTo(0, -s * 0.02); ctx.stroke();
  // leaves
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(0, s * 0.3); ctx.quadraticCurveTo(-s * 0.22, s * 0.26, -s * 0.26, s * 0.08);
  ctx.moveTo(0, s * 0.36); ctx.quadraticCurveTo(s * 0.22, s * 0.32, s * 0.26, s * 0.14);
  ctx.stroke();
  // bulb
  ctx.beginPath();
  ctx.ellipse(0, -s * 0.12, s * 0.16, s * 0.19, 0, 0, Math.PI * 2);
  ctx.fill();
  // crosshatch cuts in the ground tone of the egg face
  ctx.strokeStyle = EGGC; ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.moveTo(-s * 0.1, -s * 0.22); ctx.lineTo(s * 0.06, -s * 0.03);
  ctx.moveTo(s * 0.1, -s * 0.22); ctx.lineTo(-s * 0.06, -s * 0.03);
  ctx.moveTo(-s * 0.12, -s * 0.13); ctx.lineTo(s * 0.12, -s * 0.13);
  ctx.stroke();
  // crown spikes
  ctx.strokeStyle = col; ctx.lineWidth = 1.5;
  var angs = [-0.62, -0.31, 0, 0.31, 0.62];
  ctx.beginPath();
  for (var i = 0; i < angs.length; i++) {
    var bx = Math.sin(angs[i]) * s * 0.1, by = -s * 0.28;
    ctx.moveTo(bx, by);
    ctx.lineTo(bx + Math.sin(angs[i]) * s * 0.2, by - Math.cos(angs[i]) * s * 0.22);
  }
  ctx.stroke();
  ctx.restore();
}

// ---- the twelve authored layouts ------------------------------
// Motif placement in egg-local coords (egg centre 0,0;
// half extents 58 by 75). Every layout is clipped to the
// egg path when drawn, so edge motifs crop cleanly.
var LAYOUTS = [
  function rings() { // 0: concentric diamond rings
    diamond(0, 0, 12, GOLD);
    var i, a;
    for (i = 0; i < 6; i++) { a = i / 6 * Math.PI * 2; diamond(Math.cos(a) * 31, Math.sin(a) * 36, 6, GOLD); }
    for (i = 0; i < 10; i++) { a = i / 10 * Math.PI * 2 + 0.31; dot(Math.cos(a) * 45, Math.sin(a) * 54, 2, BRONZE); }
  },
  function thistleHeart() { // 1: one great thistle, crescent guard
    thistle(0, 4, 62, GOLD, 0);
    crescent(-31, -38, 7, GOLD, 0.7); crescent(31, -38, 7, GOLD, -0.7 + Math.PI);
    crescent(-31, 42, 7, BRONZE, 0.7); crescent(31, 42, 7, BRONZE, -0.7 + Math.PI);
    dot(0, -54, 2.2, GOLD); dot(0, 58, 2.2, GOLD);
  },
  function crescentRows() { // 2: alternating crescent and dot rows
    var xs = [-24, 0, 24], i;
    for (i = 0; i < 3; i++) crescent(xs[i], -40, 8, GOLD, 0.5);
    for (i = 0; i < 5; i++) dot(-24 + i * 12, -13, 2, BRONZE);
    for (i = 0; i < 3; i++) crescent(xs[i], 14, 8, GOLD, 0.5 + Math.PI);
    for (i = 0; i < 5; i++) dot(-24 + i * 12, 41, 2, BRONZE);
  },
  function eyeCentre() { // 3: eye-spiral heart, diamond corners
    eyeSpiral(0, 0, 17, GOLD);
    diamond(-29, -39, 6, GOLD); diamond(29, -39, 6, GOLD);
    diamond(-29, 39, 6, BRONZE); diamond(29, 39, 6, BRONZE);
    dot(0, -52, 2, GOLD); dot(0, 52, 2, GOLD); dot(-38, 0, 2, GOLD); dot(38, 0, 2, GOLD);
  },
  function lattice() { // 4: cross-stitch diamond lattice
    var xs = [-26, 0, 26], ys = [-45, -15, 15, 45];
    for (var j = 0; j < ys.length; j++)
      for (var i = 0; i < xs.length; i++)
        diamond(xs[i], ys[j], 7, (i + j) % 2 ? BRONZE : GOLD);
  },
  function thistleColumn() { // 5: three thistles down the spine
    thistle(0, -36, 38, GOLD, 0);
    thistle(0, 2, 48, GOLD, 0);
    thistle(0, 40, 38, BRONZE, 0);
    dot(-30, -16, 2, GOLD); dot(30, -16, 2, GOLD); dot(-30, 22, 2, GOLD); dot(30, 22, 2, GOLD);
  },
  function bands() { // 6: four horizontal bands of motifs
    var i;
    for (i = 0; i < 3; i++) diamond(-27 + i * 27, -44, 6, GOLD);
    for (i = 0; i < 5; i++) dot(-24 + i * 12, -17, 2, BRONZE);
    for (i = 0; i < 3; i++) crescent(-24 + i * 24, 11, 7.5, GOLD, 0.5);
    thistle(-22, 36, 27, GOLD, 0); thistle(22, 36, 27, GOLD, 0); dot(0, 44, 2.2, BRONZE);
  },
  function fan() { // 7: thistle fan over a low eye
    eyeSpiral(0, 40, 11, GOLD);
    thistle(-27, -4, 34, GOLD, -0.5); thistle(0, -24, 38, GOLD, 0); thistle(27, -4, 34, GOLD, 0.5);
    dot(-36, 26, 2, BRONZE); dot(36, 26, 2, BRONZE); dot(0, -52, 2, GOLD);
  },
  function constellation() { // 8: authored scatter
    thistle(-15, -28, 32, GOLD, -0.15);
    crescent(21, -38, 8, GOLD, 0.9);
    eyeSpiral(15, 4, 10, GOLD);
    diamond(-23, 18, 7, BRONZE);
    crescent(-3, 44, 7, GOLD, 2.6);
    diamond(27, 34, 6, GOLD);
    dot(-33, -6, 2, GOLD); dot(33, -14, 2, BRONZE); dot(-8, -50, 2, GOLD); dot(6, 24, 1.8, BRONZE);
  },
  function chequer() { // 9: 3x3 chequer, eye at the heart
    var xs = [-26, 0, 26], ys = [-38, 0, 38];
    for (var j = 0; j < 3; j++) for (var i = 0; i < 3; i++) {
      if (i === 1 && j === 1) { eyeSpiral(0, 0, 9.5, GOLD); continue; }
      if ((i + j) % 2) crescent(xs[i], ys[j], 8, GOLD, 0.5);
      else diamond(xs[i], ys[j], 7.5, BRONZE);
    }
  },
  function ringThistle() { // 10: diamond ring around a thistle
    thistle(0, 2, 54, GOLD, 0);
    for (var i = 0; i < 8; i++) {
      var a = i / 8 * Math.PI * 2 + Math.PI / 8;
      diamond(Math.cos(a) * 41, Math.sin(a) * 50, 5.5, i % 2 ? BRONZE : GOLD);
    }
  },
  function eyeRows() { // 11: two eyes, crescent waist, diamond corners
    eyeSpiral(0, -36, 10.5, GOLD);
    eyeSpiral(0, 36, 10.5, GOLD);
    crescent(-28, 0, 7, GOLD, 0.5); crescent(28, 0, 7, GOLD, 0.5 + Math.PI);
    diamond(-27, -36, 5.5, BRONZE); diamond(27, -36, 5.5, BRONZE);
    diamond(-27, 36, 5.5, BRONZE); diamond(27, 36, 5.5, BRONZE);
    dot(-13, 0, 1.8, GOLD); dot(13, 0, 1.8, GOLD);
  }
];
if (LAYOUTS.length !== 12) throw new Error('Dark Eggs needs exactly 12 layouts');

// ---- locket interior scenes -------------------------------------
function sceneBird() {
  // small gold bird perched on a sage sprig
  ctx.strokeStyle = SAGE; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-34, 26); ctx.quadraticCurveTo(0, 18, 36, 24); ctx.stroke();
  dot(-26, 22, 2.4, SAGE); dot(28, 21, 2.4, SAGE);
  ctx.fillStyle = GOLD;
  ctx.beginPath(); ctx.ellipse(-2, 2, 22, 10.5, -0.16, 0, Math.PI * 2); ctx.fill(); // body
  ctx.beginPath(); ctx.arc(17, -7, 7.2, 0, Math.PI * 2); ctx.fill(); // head
  ctx.beginPath(); ctx.moveTo(23, -8); ctx.lineTo(34, -5); ctx.lineTo(23, -3); ctx.closePath(); ctx.fill(); // beak
  ctx.beginPath(); ctx.moveTo(-21, 3); ctx.lineTo(-39, 13); ctx.lineTo(-20, 13); ctx.closePath(); ctx.fill(); // tail
  ctx.strokeStyle = GOLD; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-4, 13); ctx.lineTo(-4, 21); ctx.moveTo(4, 13); ctx.lineTo(5, 20); ctx.stroke(); // legs
  dot(18, -8, 1.7, SLATE); // eye
}
function sceneFiddlehead() {
  // sage fiddlehead: stem rising into an Archimedean coil
  ctx.strokeStyle = SAGE; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(0, 44); ctx.quadraticCurveTo(-3, 18, 0, 2); ctx.stroke();
  ctx.beginPath();
  var steps = 64, turns = 2.3;
  for (var i = 0; i <= steps; i++) {
    var u = i / steps, a = -Math.PI / 2 + u * turns * Math.PI * 2, rr = 24 * (1 - u * 0.82);
    var px = Math.cos(a) * rr, py = -14 + Math.sin(a) * rr * 0.9 - u * 2;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(0, 26); ctx.quadraticCurveTo(-14, 22, -19, 12);
  ctx.moveTo(0, 32); ctx.quadraticCurveTo(13, 29, 18, 20);
  ctx.stroke();
  dot(-19, 10, 2.2, SAGE); dot(18, 18, 2.2, SAGE);
  dot(-26, -30, 2, GOLD); dot(25, -36, 2, GOLD); dot(0, 52, 2, GOLD);
}
function sceneMoon() {
  crescent(0, -4, 27, GOLD, 0.5);
  dot(-24, -34, 2.4, GOLD); dot(26, -28, 2, GOLD); dot(18, 26, 2.2, GOLD); dot(-28, 22, 1.8, BRONZE);
  diamond(0, 38, 6, GOLD);
}
function drawScene(name) {
  if (name === 'bird') sceneBird();
  else if (name === 'fiddlehead') sceneFiddlehead();
  else sceneMoon();
}

// ---- egg drawing --------------------------------------------------
function eggPathLocal() {
  var hw = EGG_W / 2, hh = EGG_H / 2;
  ctx.beginPath();
  ctx.moveTo(0, -hh);
  ctx.bezierCurveTo(hw * 0.72, -hh, hw, -hh * 0.1, hw, hh * 0.32);
  ctx.bezierCurveTo(hw, hh * 0.78, hw * 0.62, hh, 0, hh);
  ctx.bezierCurveTo(-hw * 0.62, hh, -hw, hh * 0.78, -hw, hh * 0.32);
  ctx.bezierCurveTo(-hw, -hh * 0.1, -hw * 0.72, -hh, 0, -hh);
  ctx.closePath();
}
function paintFace() {
  // egg field plus its motif layout, clipped to the egg
  ctx.save();
  eggPathLocal(); ctx.clip();
  ctx.fillStyle = EGGC;
  ctx.fillRect(-EGG_W / 2 - 4, -EGG_H / 2 - 4, EGG_W + 8, EGG_H + 8);
  ctx.restore();
  ctx.save();
  eggPathLocal(); ctx.clip();
  LAYOUTS[curLayout]();
  ctx.restore();
}
var curLayout = 0; // set per egg before paintFace / halves
function drawHalf(side, open) {
  // One locket shell: the egg's half face, hinged at its
  // outer edge and foreshortened as it swings open.
  var hw = EGG_W / 2, hh = EGG_H / 2;
  var hinge = side * hw;
  var sc = Math.cos(open * 1.18); // 1 at closed, about 0.44 fully open
  ctx.save();
  ctx.translate(hinge, 0); ctx.scale(sc, 1); ctx.translate(-hinge, 0);
  ctx.save();
  eggPathLocal(); ctx.clip();
  ctx.beginPath();
  if (side < 0) ctx.rect(-hw - 3, -hh - 4, hw + 3, EGG_H + 8);
  else ctx.rect(0, -hh - 4, hw + 3, EGG_H + 8);
  ctx.clip();
  ctx.fillStyle = EGGC;
  ctx.fillRect(-hw - 3, -hh - 4, EGG_W + 6, EGG_H + 8);
  LAYOUTS[curLayout]();
  ctx.restore();
  // the shell's cut edge, a gold sliver at the seam
  ctx.strokeStyle = GOLD; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(0, -hh * 0.9); ctx.lineTo(0, hh * 0.9); ctx.stroke();
  ctx.restore();
}
function drawInterior(egg) {
  ctx.save();
  eggPathLocal(); ctx.clip();
  ctx.fillStyle = EGGC;
  ctx.fillRect(-EGG_W / 2 - 4, -EGG_H / 2 - 4, EGG_W + 8, EGG_H + 8);
  ctx.save();
  ctx.scale(0.9, 0.9);
  eggPathLocal();
  ctx.fillStyle = SLATE; ctx.fill();
  ctx.restore();
  drawScene(egg.scene);
  ctx.restore();
}
function drawEgg(egg, t) {
  var ph = t / LOOP;
  var wave = 0.5 + 0.5 * Math.sin(Math.PI * 2 * SHIM_CYCLES * ph + egg.phase);
  var shim = 0.66 + 0.34 * wave;
  var rot = ROT_MAX * Math.sin(Math.PI * 2 * ROT_CYCLES * ph + egg.rotPhase);
  ctx.save();
  ctx.translate(egg.hx + egg.x, egg.hy + egg.y);
  ctx.rotate(rot);
  curLayout = egg.layout;
  if (egg.open > 0.002) {
    drawInterior(egg);
    ctx.globalAlpha = shim;
    drawHalf(-1, egg.open);
    drawHalf(1, egg.open);
    ctx.globalAlpha = 1;
  } else {
    ctx.globalAlpha = shim;
    paintFace();
    ctx.globalAlpha = 1;
    // slate hairline just inside the shell
    ctx.save();
    ctx.scale(0.93, 0.93);
    eggPathLocal();
    ctx.strokeStyle = SLATE; ctx.lineWidth = 1.1; ctx.globalAlpha = 0.8;
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  // the thin gold ring, the locket frame: always whole
  ctx.save();
  ctx.scale(1.13, 1.13);
  eggPathLocal();
  ctx.strokeStyle = GOLD; ctx.lineWidth = 2 / 1.13;
  ctx.globalAlpha = 0.5 + 0.35 * wave;
  ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.restore();
}
function drawSprig(sp) {
  ctx.save();
  ctx.translate(sp[0], sp[1]); ctx.rotate(sp[2]);
  ctx.globalAlpha = 0.8;
  ctx.strokeStyle = SAGE; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(0, 27); ctx.quadraticCurveTo(3, 0, 0, -27); ctx.stroke();
  ctx.fillStyle = SAGE;
  var ys = [-14, -2, 10];
  for (var i = 0; i < ys.length; i++) {
    ctx.beginPath(); ctx.ellipse(-8, ys[i], 8, 3.4, -0.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8, ys[i] + 5, 8, 3.4, 0.6, 0, Math.PI * 2); ctx.fill();
  }
  dot(0, -31, 2.6, BRONZE); dot(-6, -25, 2, BRONZE); dot(6, -25, 2, BRONZE);
  ctx.restore();
  ctx.globalAlpha = 1;
}
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-2000, -2000, DW + 4000, DH + 4000);
  var i;
  for (i = 0; i < SPRIGS.length; i++) drawSprig(SPRIGS[i]);
  for (i = 0; i < EGGS.length; i++) drawEgg(EGGS[i], T);
}

// ---- sizing: centred fit, page ground is the near-black ---------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- pointer: tap opens a locket, drag scrambles the eggs -------
// Tap and drag are kept separate by a movement threshold:
// a press that travels less than 10 design px and lifts
// within 0.4s is a tap (a state change only, never a
// reload); anything further is a drag, whose motion
// shoves nearby eggs off their slots.
function toDesign(e) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
var press = null;
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  press = { x: p[0], y: p[1], lx: p[0], ly: p[1], moved: false, at: T };
});
canvas.addEventListener('pointermove', function (e) {
  if (!press) return;
  var p = toDesign(e);
  var dx = p[0] - press.lx, dy = p[1] - press.ly;
  press.lx = p[0]; press.ly = p[1];
  if (Math.abs(p[0] - press.x) + Math.abs(p[1] - press.y) > 10) press.moved = true;
  if (!press.moved) return;
  for (var i = 0; i < EGGS.length; i++) {
    var egg = EGGS[i];
    var ex = egg.hx + egg.x - p[0], ey = egg.hy + egg.y - p[1];
    var d = Math.sqrt(ex * ex + ey * ey);
    if (d < 175) {
      var f = (1 - d / 175) * 2.3;
      egg.vx += dx * f; egg.vy += dy * f;
    }
  }
});
function endPointer(e) {
  if (!press) return;
  var wasTap = !press.moved && (T - press.at) < 0.4;
  press = null;
  if (!wasTap || !e) return;
  var p = toDesign(e);
  for (var i = EGGS.length - 1; i >= 0; i--) {
    var egg = EGGS[i];
    var nx = (p[0] - (egg.hx + egg.x)) / (EGG_W * 0.62);
    var ny = (p[1] - (egg.hy + egg.y)) / (EGG_H * 0.62);
    if (nx * nx + ny * ny < 1) {
      egg.openTarget = egg.openTarget > 0.5 ? 0 : 1;
      return;
    }
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { press = null; });

function step() {
  for (var i = 0; i < EGGS.length; i++) {
    var egg = EGGS[i];
    // locket swing eases toward its target and snaps shut/open exactly
    egg.open += (egg.openTarget - egg.open) * Math.min(1, TICK * 7);
    if (Math.abs(egg.openTarget - egg.open) < 0.003) egg.open = egg.openTarget;
    // soft spring home with damping; snaps to the exact slot
    egg.vx += (-30 * egg.x - 6.5 * egg.vx) * TICK;
    egg.vy += (-30 * egg.y - 6.5 * egg.vy) * TICK;
    egg.x += egg.vx * TICK;
    egg.y += egg.vy * TICK;
    if (Math.abs(egg.x) < 0.05 && Math.abs(egg.vx) < 0.6) { egg.x = 0; egg.vx = 0; }
    if (Math.abs(egg.y) < 0.05 && Math.abs(egg.vy) < 0.6) { egg.y = 0; egg.vy = 0; }
  }
}

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
