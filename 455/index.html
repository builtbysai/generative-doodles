<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rogue Cover</title>
<style>
html, body { margin: 0; padding: 0; background: #A8B82A; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var issue = 0;
var lastT = 0;
var loopStart = null;

var MASTHEADS = ['ROGUE', 'WILDISH', 'OFF-GRID', 'MYCELIUM'];
var ANIMALS = ['hen', 'rabbit', 'cat', 'goat'];
var LINES = [
  'Mycelium: les createurs qui tissent avec le vivant',
  'Chic Off-Grid',
  'Mode Circulaire',
  'Jardins sur les toits',
  'Le potager en ville',
  'Tisser sa garde-robe'
];
var SUBJECTS = [
  { coat: '#3A5FA0', skin: '#E8C4A0', hair: '#2B2118', style: 'short', scarf: '#C8B890' },
  { coat: '#A0522D', skin: '#D9A87E', hair: '#4A2E1A', style: 'bun', scarf: '#3E5A4A' },
  { coat: '#5A6B3A', skin: '#F0D0B0', hair: '#1A1A1A', style: 'long', scarf: '#A0522D' },
  { coat: '#6B4A5E', skin: '#C89A72', hair: '#6E6E6E', style: 'short', scarf: '#E8D0A0' }
];

function hash(n) {
  var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}
function mod(a, n) { return ((a % n) + n) % n; }

function isPhone(w, h) {
  var sw = w, sh = h;
  if (window.screen) { sw = window.screen.width; sh = window.screen.height; }
  if (Math.min(sw, sh) < 700) { return true; }
  return h > w * 1.15;
}

function ellipse(cx, cy, rx, ry) {
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
}

function wrapText(text, maxW) {
  var words = text.split(' ');
  var lines = [];
  var cur = '';
  for (var i = 0; i < words.length; i++) {
    var trial = cur ? cur + ' ' + words[i] : words[i];
    if (ctx.measureText(trial).width > maxW && cur) {
      lines.push(cur);
      cur = words[i];
    } else {
      cur = trial;
    }
  }
  if (cur) { lines.push(cur); }
  return lines;
}

function drawAnimal(kind, cx, cy, s, t, blink) {
  var twitch = 0;
  var ph = t % 10;
  if (ph >= 5 && ph < 5.5) { twitch = 0.28; }
  ctx.save();
  ctx.translate(cx, cy);
  if (kind === 'hen') {
    ctx.fillStyle = '#F5F2E8';
    ellipse(0, 0, s * 0.62, s * 0.52);
    ctx.fillStyle = '#D8C8A8';
    ellipse(-s * 0.45, -s * 0.15, s * 0.30, s * 0.22);
    ctx.fillStyle = '#C0392B';
    ellipse(s * 0.30, -s * 0.62, s * 0.14, s * 0.18);
    ctx.fillStyle = '#E08030';
    ctx.beginPath();
    ctx.moveTo(s * 0.58, -s * 0.35);
    ctx.lineTo(s * 0.80, -s * 0.28);
    ctx.lineTo(s * 0.58, -s * 0.20);
    ctx.closePath();
    ctx.fill();
    if (blink) {
      ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = Math.max(1, s * 0.03);
      ctx.beginPath(); ctx.moveTo(s * 0.28, -s * 0.35); ctx.lineTo(s * 0.44, -s * 0.35); ctx.stroke();
    } else {
      ctx.fillStyle = '#1A1A1A';
      ellipse(s * 0.36, -s * 0.35, s * 0.05, s * 0.05);
    }
    ctx.strokeStyle = '#8A6A3A'; ctx.lineWidth = Math.max(1, s * 0.03);
    ctx.beginPath(); ctx.moveTo(-s * 0.1, s * 0.50); ctx.lineTo(-s * 0.1, s * 0.68); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s * 0.15, s * 0.50); ctx.lineTo(s * 0.15, s * 0.68); ctx.stroke();
  } else if (kind === 'rabbit') {
    ctx.fillStyle = '#D8C8B8';
    ellipse(0, s * 0.05, s * 0.55, s * 0.48);
    ctx.save();
    ctx.translate(-s * 0.28, -s * 0.55);
    ctx.rotate(-0.15 - twitch);
    ellipse(0, -s * 0.30, s * 0.14, s * 0.42);
    ctx.restore();
    ctx.save();
    ctx.translate(s * 0.28, -s * 0.55);
    ctx.rotate(0.15 + twitch);
    ellipse(0, -s * 0.30, s * 0.14, s * 0.42);
    ctx.restore();
    ctx.fillStyle = '#E8B8C0';
    ellipse(-s * 0.28, -s * 0.75, s * 0.06, s * 0.22);
    ellipse(s * 0.28, -s * 0.75, s * 0.06, s * 0.22);
    if (blink) {
      ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = Math.max(1, s * 0.03);
      ctx.beginPath(); ctx.moveTo(s * 0.28, -s * 0.30); ctx.lineTo(s * 0.44, -s * 0.30); ctx.stroke();
    } else {
      ctx.fillStyle = '#1A1A1A';
      ellipse(s * 0.36, -s * 0.30, s * 0.05, s * 0.05);
    }
    ctx.fillStyle = '#C08080';
    ellipse(s * 0.52, -s * 0.18, s * 0.06, s * 0.05);
  } else if (kind === 'cat') {
    ctx.fillStyle = '#C8A880';
    ellipse(0, s * 0.05, s * 0.58, s * 0.48);
    ctx.save();
    ctx.translate(-s * 0.32, -s * 0.42);
    ctx.rotate(-0.1 - twitch);
    ctx.beginPath(); ctx.moveTo(-s * 0.14, 0); ctx.lineTo(0, -s * 0.38); ctx.lineTo(s * 0.14, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(s * 0.32, -s * 0.42);
    ctx.rotate(0.1 + twitch);
    ctx.beginPath(); ctx.moveTo(-s * 0.14, 0); ctx.lineTo(0, -s * 0.38); ctx.lineTo(s * 0.14, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
    if (blink) {
      ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = Math.max(1, s * 0.03);
      ctx.beginPath(); ctx.moveTo(s * 0.28, -s * 0.30); ctx.lineTo(s * 0.44, -s * 0.30); ctx.stroke();
    } else {
      ctx.fillStyle = '#1A1A1A';
      ellipse(s * 0.36, -s * 0.30, s * 0.05, s * 0.05);
    }
    ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = Math.max(1, s * 0.02);
    ctx.beginPath(); ctx.moveTo(s * 0.55, -s * 0.15); ctx.lineTo(s * 0.85, -s * 0.10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s * 0.55, -s * 0.05); ctx.lineTo(s * 0.85, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s * 0.55, -s * 0.15); ctx.lineTo(-s * 0.85, -s * 0.10); ctx.stroke();
    ctx.fillStyle = '#C08080';
    ellipse(s * 0.52, -s * 0.18, s * 0.05, s * 0.04);
    ctx.strokeStyle = '#C8A880'; ctx.lineWidth = Math.max(2, s * 0.08);
    ctx.beginPath(); ctx.arc(-s * 0.70, s * 0.25, s * 0.30, -0.5, 1.2); ctx.stroke();
  } else {
    ctx.fillStyle = '#E8E0D0';
    ellipse(0, s * 0.05, s * 0.58, s * 0.48);
    ctx.strokeStyle = '#D8C8A8'; ctx.lineWidth = Math.max(2, s * 0.06);
    ctx.beginPath(); ctx.arc(s * 0.30, -s * 0.55, s * 0.18, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(s * 0.55, -s * 0.55, s * 0.18, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.fillStyle = '#E8E0D0';
    ellipse(s * 0.28, -s * 0.35, s * 0.12, s * 0.22);
    ellipse(s * 0.58, -s * 0.35, s * 0.12, s * 0.22);
    if (blink) {
      ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = Math.max(1, s * 0.03);
      ctx.beginPath(); ctx.moveTo(s * 0.38, -s * 0.30); ctx.lineTo(s * 0.54, -s * 0.30); ctx.stroke();
    } else {
      ctx.fillStyle = '#1A1A1A';
      ellipse(s * 0.46, -s * 0.30, s * 0.05, s * 0.05);
    }
    ctx.fillStyle = '#C8C0B0';
    ellipse(s * 0.52, -s * 0.05, s * 0.10, s * 0.14);
  }
  ctx.restore();
}

function draw(t) {
  lastT = t;
  var W = canvas.width;
  var H = canvas.height;
  if (!W || !H) { return; }
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var phone = isPhone(W, H);
  var inset = phone ? 0.98 : 0.96;
  var coverW = Math.min(W * inset, H * inset * 0.75);
  var coverH = coverW * 4 / 3;
  var coverX = (W - coverW) / 2;
  var coverY = (H - coverH) / 2;

  ctx.fillStyle = '#A8B82A';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.beginPath();
  ctx.rect(coverX, coverY, coverW, coverH);
  ctx.clip();
  ctx.fillStyle = '#A8B82A';
  ctx.fillRect(coverX, coverY, coverW, coverH);
  var i;
  for (i = 0; i < 26; i++) {
    var bx = coverX + hash(i * 3 + 1) * coverW;
    var by = coverY + hash(i * 7 + 2) * coverH;
    var br = coverW * (0.04 + hash(i * 11 + 5) * 0.08);
    ctx.fillStyle = (i % 2 === 0) ? 'rgba(122,138,42,0.16)' : 'rgba(200,216,74,0.14)';
    ellipse(bx, by, br, br * 0.75);
  }

  var masthead = MASTHEADS[issue % MASTHEADS.length];
  var subj = SUBJECTS[issue % SUBJECTS.length];
  var animal = ANIMALS[issue % ANIMALS.length];

  ctx.fillStyle = '#1A1A1A';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  var mSize = coverW * 0.22;
  ctx.font = '900 ' + mSize + 'px Georgia, "Times New Roman", serif';
  while (mSize > coverW * 0.08 && ctx.measureText(masthead).width > coverW * 0.94) {
    mSize -= 2;
    ctx.font = '900 ' + mSize + 'px Georgia, "Times New Roman", serif';
  }
  ctx.fillText(masthead, coverX + coverW / 2, coverY + coverH * 0.11);
  ctx.fillRect(coverX + coverW * 0.04, coverY + coverH * 0.205, coverW * 0.92, Math.max(1, coverW * 0.004));

  var pw = coverW * 0.52;
  var ph = coverH * 0.55;
  var pcx = coverX + coverW / 2;
  var pcy = coverY + coverH * 0.52;
  var breath = Math.sin(t * 1.4) * ph * 0.008;

  ctx.fillStyle = 'rgba(242,234,216,0.38)';
  ellipse(pcx, pcy, pw * 0.62, ph * 0.56);

  var headY = pcy - ph * 0.30 + breath;
  var headRx = pw * 0.19;
  var headRy = pw * 0.22;
  ctx.fillStyle = subj.coat;
  ctx.beginPath();
  ctx.moveTo(pcx - pw * 0.26, pcy - ph * 0.10 + breath);
  ctx.lineTo(pcx + pw * 0.26, pcy - ph * 0.10 + breath);
  ctx.lineTo(pcx + pw * 0.48, pcy + ph * 0.48);
  ctx.lineTo(pcx - pw * 0.48, pcy + ph * 0.48);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = subj.scarf;
  ctx.beginPath();
  ctx.moveTo(pcx - pw * 0.20, pcy - ph * 0.08 + breath);
  ctx.lineTo(pcx + pw * 0.20, pcy - ph * 0.08 + breath);
  ctx.lineTo(pcx + pw * 0.12, pcy + ph * 0.04);
  ctx.lineTo(pcx - pw * 0.12, pcy + ph * 0.04);
  ctx.closePath();
  ctx.fill();
  for (i = 0; i < 6; i++) {
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ellipse(pcx - pw * 0.30 + hash(i * 5 + 9) * pw * 0.60, pcy + ph * 0.05 + hash(i * 13 + 3) * ph * 0.35, pw * 0.08, pw * 0.06);
  }

  ctx.fillStyle = subj.skin;
  ellipse(pcx, headY, headRx, headRy);
  ctx.fillStyle = subj.hair;
  if (subj.style === 'bun') {
    ellipse(pcx, headY - headRy * 0.72, headRx * 1.02, headRy * 0.52);
    ellipse(pcx + headRx * 0.95, headY - headRy * 0.55, headRx * 0.32, headRy * 0.32);
  } else if (subj.style === 'long') {
    ellipse(pcx, headY - headRy * 0.55, headRx * 1.08, headRy * 0.62);
    ellipse(pcx - headRx * 0.95, headY + headRy * 0.15, headRx * 0.22, headRy * 0.55);
    ellipse(pcx + headRx * 0.95, headY + headRy * 0.15, headRx * 0.22, headRy * 0.55);
  } else {
    ellipse(pcx, headY - headRy * 0.62, headRx * 1.02, headRy * 0.55);
  }

  var blink = (t % 10) >= 9.7;
  ctx.fillStyle = '#1A1A1A';
  if (blink) {
    ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = Math.max(1, pw * 0.008);
    ctx.beginPath(); ctx.moveTo(pcx - headRx * 0.55, headY); ctx.lineTo(pcx - headRx * 0.25, headY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pcx + headRx * 0.25, headY); ctx.lineTo(pcx + headRx * 0.55, headY); ctx.stroke();
  } else {
    ellipse(pcx - headRx * 0.40, headY, pw * 0.018, pw * 0.022);
    ellipse(pcx + headRx * 0.40, headY, pw * 0.018, pw * 0.022);
  }
  ctx.strokeStyle = '#8A6A5A'; ctx.lineWidth = Math.max(1, pw * 0.008);
  ctx.beginPath(); ctx.moveTo(pcx, headY + headRy * 0.15); ctx.lineTo(pcx, headY + headRy * 0.35); ctx.stroke();
  ctx.beginPath(); ctx.arc(pcx, headY + headRy * 0.55, headRx * 0.28, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();

  ctx.fillStyle = subj.coat;
  ellipse(pcx - pw * 0.36, pcy + ph * 0.22 + breath, pw * 0.16, ph * 0.10);
  ellipse(pcx + pw * 0.36, pcy + ph * 0.22 + breath, pw * 0.16, ph * 0.10);

  var aScale = pw * 0.42;
  drawAnimal(animal, pcx, pcy + ph * 0.30, aScale, t, blink);

  ctx.fillStyle = '#F2EAD8';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  var lineFont = Math.max(10, coverW * 0.030);
  ctx.font = 'italic ' + lineFont + 'px Georgia, "Times New Roman", serif';
  var colW = coverW * 0.20;
  var leftX = coverX + coverW * 0.03;
  var rightX = coverX + coverW * 0.77;
  var topY = coverY + coverH * 0.26;
  var rowH = coverH * 0.20;
  for (i = 0; i < 3; i++) {
    var li = (issue + i) % LINES.length;
    var wrapped = wrapText(LINES[li], colW);
    var ly = topY + i * rowH;
    for (var j = 0; j < wrapped.length; j++) {
      ctx.fillText(wrapped[j], leftX, ly + j * lineFont * 1.25);
    }
    var ri = (issue + 3 + i) % LINES.length;
    var rwrapped = wrapText(LINES[ri], colW);
    for (var k = 0; k < rwrapped.length; k++) {
      ctx.fillText(rwrapped[k], rightX, ly + k * lineFont * 1.25);
    }
  }

  ctx.fillStyle = 'rgba(242,234,216,0.55)';
  for (i = 0; i < 14; i++) {
    var mx = coverX + mod(hash(i * 3 + 1) * coverW + t * (5 + hash(i * 7 + 4) * 9), coverW);
    var my = coverY + mod(hash(i * 11 + 2) * coverH - t * 3, coverH);
    ellipse(mx, my, Math.max(1, coverW * 0.004), Math.max(1, coverW * 0.004));
  }
  ctx.restore();

  ctx.strokeStyle = '#1A1A1A';
  ctx.lineWidth = Math.max(1, coverW * 0.004);
  ctx.strokeRect(coverX, coverY, coverW, coverH);
}

function size() {
  var vw = window.innerWidth;
  var vh = window.innerHeight;
  if (window.visualViewport) {
    vw = window.visualViewport.width;
    vh = window.visualViewport.height;
  }
  canvas.width = vw;
  canvas.height = vh;
  draw(lastT);
}

if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', size);
}
if (window.addEventListener) {
  window.addEventListener('resize', size);
}
canvas.addEventListener('pointerdown', function() {
  issue = (issue + 1) % 4;
  draw(lastT);
});

size();
draw(0);
function frame(ts) {
  if (loopStart === null) { loopStart = ts; }
  draw((ts - loopStart) / 1000);
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(frame);
  }
}
if (typeof requestAnimationFrame === 'function') {
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
