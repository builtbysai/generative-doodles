<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>It Is in the Room</title>
<style>
html, body { margin: 0; padding: 0; background: #EFE9DC; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var WALL = '#EFE9DC';
var FRAME_BLACK = '#171512';
var DEEP = '#1E4A7A';
var FOAM = '#EDEFF2';
var PLATE = '#171512';
var PLATE_LINE = 'rgba(239,233,220,0.45)';
var TITLE_INK = '#EFE9DC';
var HINT_INK = '#EFE9DC';
var FIRST_T = 367.5;
/* DRIVER: a realtime 3D "video sculpture" inside a framed display on a
   wall. A tall glass-fronted box holds a slowly morphing hexagonal
   column of blue waves, sitting on a white pedestal inside the frame.
   The sculpture's key light matches the room's time of day on a
   24-minute day cycle (6500K cool morning to 3200K warm evening).
   Every three minutes the wave field inverts, then settles back.
   The frame IS the piece; the room beyond the frame edge is not shown.
   Canvas 2D only: the column is a 2D displaced-cylinder projection
   with layered sine wave bands. Glass reflections are a static subtle
   gradient, never animated noise. Watch only. */
var DAY = 1440; /* 24-minute day cycle, seconds */
var INV_PERIOD = 180; /* wave field inverts every 3 minutes */
var OMEGA = TAU / 26; /* main wave travel, one cycle per 26 s */
var OMEGA2 = TAU / 17; /* second wave component */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mixHex(a, b, f) {
  var ca = hexRgb(a), cb = hexRgb(b);
  var r = Math.round(ca[0] + (cb[0] - ca[0]) * f);
  var g = Math.round(ca[1] + (cb[1] - ca[1]) * f);
  var bl = Math.round(ca[2] + (cb[2] - ca[2]) * f);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
function mixRgbArr(c, f) {
  return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
}
function tintHex(hex, light, f) {
  var c = hexRgb(hex);
  var r = Math.round(c[0] + (light[0] - c[0]) * f);
  var g = Math.round(c[1] + (light[1] - c[1]) * f);
  var b = Math.round(c[2] + (light[2] - c[2]) * f);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
/* Mix two hex colors, then tint toward the room light. Returns an rgb
   string. (mixHex returns an rgb() string, which tintHex cannot parse,
   so band colors go through this array path instead.) */
function mixTint(hexA, hexB, f, light, lf) {
  var ca = hexRgb(hexA), cb = hexRgb(hexB);
  var r = Math.round(ca[0] + (cb[0] - ca[0]) * f);
  var g = Math.round(ca[1] + (cb[1] - ca[1]) * f);
  var b = Math.round(ca[2] + (cb[2] - ca[2]) * f);
  r = Math.round(r + (light[0] - r) * lf);
  g = Math.round(g + (light[1] - g) * lf);
  b = Math.round(b + (light[2] - b) * lf);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
/* Kelvin to RGB, Tanner Helland approximation. */
function kelvinToRgb(k) {
  var t = k / 100;
  var r, g, b;
  if (t <= 66) {
    r = 255;
    g = 99.4708025861 * Math.log(t) - 161.1195681661;
  } else {
    r = 329.698727446 * Math.pow(t - 60, -0.1332047592);
    g = 288.1221695283 * Math.pow(t - 60, -0.0755148492);
  }
  if (t >= 66) b = 255;
  else if (t <= 19) b = 0;
  else b = 138.5177312231 * Math.log(t - 10) - 305.0447927307;
  return [clamp(Math.round(r), 0, 255), clamp(Math.round(g), 0, 255), clamp(Math.round(b), 0, 255)];
}
/* Day cycle: 6500K at t = 0 (morning), 3200K at t = 720 (evening),
   back to 6500K at t = 1440. */
function kelvinAt(t) {
  var c = Math.cos(TAU * (((t % DAY) + DAY) % DAY) / DAY);
  return 4850 + 1650 * c;
}
/* Inversion envelope: rises 0-15 s, holds to 45 s, settles back by 60 s. */
function invertEnv(t) {
  var l = ((t % INV_PERIOD) + INV_PERIOD) % INV_PERIOD;
  if (l < 15) return smooth(l / 15);
  if (l < 45) return 1;
  if (l < 60) return 1 - smooth((l - 45) / 15);
  return 0;
}
/* Wave field value at normalized height yn (0 top, 1 bottom).
   Inversion is a phase shift of pi: peaks become troughs while the
   field stays fully visible mid-inversion. */
function waveVal(yn, t, env) {
  var ph = TAU * yn * 6.2 - OMEGA * t + Math.PI * env;
  var ph2 = TAU * yn * 11.0 + OMEGA2 * t + 1.7 + Math.PI * env;
  return (Math.sin(ph) + 0.45 * Math.sin(ph2)) / 1.45;
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Centered geometric piece: a square field on desktop and phone alike;
   the wall ground fills the page either way. */
function fieldRect() {
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, s: s, w: s, h: s };
}
/* ---- layout, all fractions of the square field ---- */
function layout(fr) {
  var s = fr.s;
  var fw = 0.68 * s, fh = 0.84 * s;
  var fx = fr.x + (s - fw) / 2, fy = fr.y + (s - fh) / 2;
  var bt = 0.045 * fw;
  var ix = fx + bt, iy = fy + bt, iw = fw - 2 * bt, ih = fh - 2 * bt;
  var pw = 0.60 * iw, ph = 0.075 * ih;
  var px = ix + (iw - pw) / 2, py = iy + ih - 0.055 * ih - ph;
  var bw = 0.54 * iw;
  var bx = ix + (iw - bw) / 2;
  var boxTop = iy + 0.085 * ih;
  var boxBottom = py;
  var cw = 0.58 * bw;
  var cx = ix + iw / 2;
  var colTop = boxTop + 0.03 * (boxBottom - boxTop);
  var colBottom = py;
  var capH = 0.045 * (colBottom - colTop);
  return {
    fx: fx, fy: fy, fw: fw, fh: fh, bt: bt,
    ix: ix, iy: iy, iw: iw, ih: ih,
    px: px, py: py, pw: pw, ph: ph,
    bx: bx, boxTop: boxTop, boxBottom: boxBottom, bw: bw,
    cx: cx, cw: cw, colTop: colTop, colBottom: colBottom, capH: capH
  };
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('It Is in the Room').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('It Is in the Room').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 27').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('It Is in the Room', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 27', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
/* ---- the hexagonal wave column ---- */
function drawColumn(L, t, env, light) {
  var cx = L.cx, cw = L.cw;
  var top = L.colTop + L.capH; /* front face starts below the top cap */
  var bottom = L.colBottom;
  var ch = bottom - top;
  var rows = 44;
  var rh = ch / rows;
  var amp = cw * 0.018;
  var i;
  for (i = 0; i < rows; i++) {
    var yn = (i + 0.5) / rows;
    var y0 = top + i * rh, y1 = y0 + rh + 0.5;
    var v = waveVal(yn, t, env);
    var f = clamp(0.5 + 0.5 * v, 0, 1);
    f = clamp(f * 0.92 + 0.08 * (1 - yn), 0, 1);
    var dx = amp * Math.sin(TAU * yn * 6.2 - OMEGA * t + Math.PI * env + 0.9);
    var lx = cx - 0.50 * cw + dx;
    var rx = cx + 0.50 * cw + dx;
    ctx.fillStyle = mixTint(DEEP, FOAM, f, light, 0.10);
    ctx.fillRect(lx, y0, rx - lx, rh + 0.5);
    /* Traveling foam crest line across the band. */
    var crest = y0 + rh * 0.5 + amp * 0.7 * Math.sin(TAU * yn * 6.2 - OMEGA * t + Math.PI * env + 2.1);
    ctx.strokeStyle = 'rgba(237,239,242,0.55)';
    ctx.lineWidth = Math.max(1, rh * 0.16);
    ctx.beginPath();
    ctx.moveTo(lx + 2, crest);
    var seg;
    for (seg = 1; seg <= 8; seg++) {
      var sx = lx + (rx - lx) * seg / 8;
      var sy = crest + amp * 0.35 * Math.sin(seg * 1.9 + t * 0.6 + yn * 9.0);
      ctx.lineTo(sx, sy);
    }
    ctx.stroke();
  }
  /* Facets: left face in shade, right face catching the key light. */
  var facetW = 0.22 * cw;
  ctx.fillStyle = '#0F2A4A';
  ctx.globalAlpha = 0.20;
  ctx.beginPath();
  ctx.moveTo(cx - 0.50 * cw, top - L.capH * 0.5);
  ctx.lineTo(cx - 0.28 * cw, top);
  ctx.lineTo(cx - 0.28 * cw, bottom);
  ctx.lineTo(cx - 0.50 * cw, bottom);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  ctx.globalAlpha = 0.14;
  ctx.beginPath();
  ctx.moveTo(cx + 0.50 * cw, top - L.capH * 0.5);
  ctx.lineTo(cx + 0.28 * cw, top);
  ctx.lineTo(cx + 0.28 * cw, bottom);
  ctx.lineTo(cx + 0.50 * cw, bottom);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
  /* Top cap: the hexagon cross-section, lit from above. */
  var g = ctx.createLinearGradient(0, L.colTop, 0, top);
  g.addColorStop(0, tintHex('#F4F6F8', light, 0.08));
  g.addColorStop(1, tintHex('#A9C0D6', light, 0.08));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(cx - 0.50 * cw, L.colTop + L.capH * 0.5);
  ctx.lineTo(cx - 0.28 * cw, L.colTop);
  ctx.lineTo(cx + 0.28 * cw, L.colTop);
  ctx.lineTo(cx + 0.50 * cw, L.colTop + L.capH * 0.5);
  ctx.lineTo(cx + 0.28 * cw, top);
  ctx.lineTo(cx - 0.28 * cw, top);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(23,21,18,0.18)';
  ctx.lineWidth = 1;
  ctx.stroke();
  /* Soft contact shadow where the column meets the pedestal. */
  ctx.fillStyle = '#171512';
  ctx.globalAlpha = 0.12;
  ctx.fillRect(cx - 0.44 * cw, bottom - 2, 0.88 * cw, 3);
  ctx.globalAlpha = 1;
}
function draw(t) {
  size();
  var fr = fieldRect();
  var L = layout(fr);
  var kelvin = kelvinAt(t);
  var light = kelvinToRgb(kelvin);
  var env = invertEnv(t);
  var wall = tintHex(WALL, light, 0.16);
  var i;
  /* Page ground is the wall itself. */
  ctx.fillStyle = wall;
  ctx.fillRect(0, 0, VW, VH);
  /* Matte black frame, gallery-like margins. */
  ctx.fillStyle = FRAME_BLACK;
  ctx.fillRect(L.fx, L.fy, L.fw, L.fh);
  /* The wall fills the frame. */
  ctx.fillStyle = wall;
  ctx.fillRect(L.ix, L.iy, L.iw, L.ih);
  /* Directional key-light wash from the top left, tinted by the hour. */
  var wash = ctx.createLinearGradient(L.ix, L.iy, L.ix + L.iw, L.iy + L.ih);
  wash.addColorStop(0, 'rgba(' + light[0] + ',' + light[1] + ',' + light[2] + ',0.12)');
  wash.addColorStop(0.6, 'rgba(' + light[0] + ',' + light[1] + ',' + light[2] + ',0.03)');
  wash.addColorStop(1, 'rgba(' + light[0] + ',' + light[1] + ',' + light[2] + ',0)');
  ctx.fillStyle = wash;
  ctx.fillRect(L.ix, L.iy, L.iw, L.ih);
  /* Soft shadow the glass box casts on the wall. */
  ctx.fillStyle = '#171512';
  ctx.globalAlpha = 0.07;
  ctx.fillRect(L.bx + 10, L.boxTop + 8, L.bw, L.boxBottom - L.boxTop);
  ctx.globalAlpha = 1;
  /* Glass box back panel, a shade deeper than the wall. */
  ctx.fillStyle = tintHex('#E7E0D0', light, 0.16);
  ctx.fillRect(L.bx, L.boxTop, L.bw, L.boxBottom - L.boxTop);
  /* Pedestal shadow, then the white pedestal. */
  ctx.fillStyle = '#171512';
  ctx.globalAlpha = 0.08;
  ctx.fillRect(L.px + 6, L.py + L.ph, L.pw, 6);
  ctx.globalAlpha = 1;
  ctx.fillStyle = tintHex('#FFFFFF', light, 0.14);
  ctx.fillRect(L.px, L.py, L.pw, L.ph);
  ctx.fillStyle = 'rgba(255,255,255,0.65)';
  ctx.fillRect(L.px, L.py, L.pw, 2);
  /* The wave column inside the box, standing on the pedestal. */
  drawColumn(L, t, env, light);
  /* Box edges: thin dark metal lines framing the glass front. */
  ctx.strokeStyle = 'rgba(23,21,18,0.55)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(L.bx, L.boxTop);
  ctx.lineTo(L.bx, L.boxBottom);
  ctx.moveTo(L.bx + L.bw, L.boxTop);
  ctx.lineTo(L.bx + L.bw, L.boxBottom);
  ctx.moveTo(L.bx, L.boxTop);
  ctx.lineTo(L.bx + L.bw, L.boxTop);
  ctx.stroke();
  /* Glass reflections: one static subtle diagonal gradient, never
     animated noise, plus a fixed edge highlight. */
  var glass = ctx.createLinearGradient(L.bx, L.boxTop, L.bx + L.bw, L.boxBottom);
  glass.addColorStop(0, 'rgba(255,255,255,0)');
  glass.addColorStop(0.32, 'rgba(255,255,255,0.10)');
  glass.addColorStop(0.48, 'rgba(255,255,255,0.04)');
  glass.addColorStop(0.62, 'rgba(255,255,255,0.01)');
  glass.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = glass;
  ctx.fillRect(L.bx, L.boxTop, L.bw, L.boxBottom - L.boxTop);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(L.bx + L.bw * 0.08, L.boxTop, 2, L.boxBottom - L.boxTop);
  /* Caption card, bottom right inside the frame. On phones the card is
     kept narrow so it clears the column's right edge. */
  var cardW = isPhone ? 72 : Math.max(96, 0.24 * L.iw);
  var cardH = Math.max(22, 0.038 * L.ih);
  var cardX = L.ix + L.iw - cardW - 0.03 * L.iw;
  var cardY = L.py - cardH - 0.02 * L.ih;
  ctx.fillStyle = '#FDFCF8';
  ctx.fillRect(cardX, cardY, cardW, cardH);
  ctx.strokeStyle = 'rgba(23,21,18,0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(cardX + 0.5, cardY + 0.5, cardW - 1, cardH - 1);
  ctx.fillStyle = '#4A4438';
  ctx.font = (isPhone ? 9 : 11) + 'px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('after mpkoz', cardX + cardW / 2, cardY + cardH / 2 + 0.5);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    kelvinAt: function (t) { return kelvinAt(t); },
    invertEnvAt: function (t) { return invertEnv(t); },
    waveValAt: function (yn, t, env) { return waveVal(yn, t, env); }
  };
}
/* ---- frame one: t = 367.5, mid-inversion (env 0.5), light ~4800K,
   mid-morning, wave column mid-morph so it reads at first paint ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);

}
</script>
</body>
</html>
