<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NPC Intermission</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#08080A; }
  canvas { display:block; touch-action:none; }
  .hint { position:fixed; left:0; right:0; bottom:14px; text-align:center;
    font:12px/1.4 monospace; color:#7d7d88; letter-spacing:0.08em; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">drag across the decks to scratch</div>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

var LINES = [
  '> you approach the decks',
  '> the npc is livecoding',
  '> it casts STRUDEL',
  '> the floor is a grid now',
  '> it never saves its work',
  '> the kick drum is load-bearing',
  '> you nod. the npc nods first',
  '> somewhere a shader compiles'
];
var PHASE0 = 5.2;
var lineSkip = 0;
var scratch = { active: false, x: 0, glitch: 0, bobKick: 0 };
function hash(n) { var s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }

function drawBackground(t, pattern, glitch) {
  ctx.save();
  ctx.globalAlpha = 0.35;
  var j;
  if (pattern === 0) {
    var rows = Math.ceil(H / 7);
    for (var r = 0; r < rows; r++) {
      var y = r * 7;
      var off = glitch > 0.02 ? (hash(r * 3 + Math.floor(t * 24)) - 0.5) * 60 * glitch : 0;
      var band = Math.floor((r + Math.floor(t * 1.5)) / 6) % 2;
      ctx.fillStyle = band ? '#5AF2FF' : '#FF3EB5';
      ctx.globalAlpha = 0.35 * (0.35 + 0.65 * Math.abs(Math.sin(t * 0.9 + r * 0.35)));
      ctx.fillRect(off, y, W, 2);
    }
  } else if (pattern === 1) {
    var cell = Math.max(34, Math.min(W, H) * 0.075);
    var cols = Math.ceil(W / cell), rws = Math.ceil(H / cell);
    var beat = Math.floor(t * 2);
    for (var i = 0; i < cols; i++) for (j = 0; j < rws; j++) {
      var on = (i + j + beat) % 2 === 0;
      var off2 = glitch > 0.02 ? (hash(i * 7 + j * 13 + Math.floor(t * 24)) - 0.5) * 40 * glitch : 0;
      ctx.fillStyle = on ? '#5AF2FF' : '#FF3EB5';
      ctx.globalAlpha = on ? 0.30 : 0.13;
      ctx.fillRect(i * cell + off2 + 1, j * cell + 1, cell - 2, cell - 2);
    }
  } else {
    var bw = Math.max(26, Math.min(W, H) * 0.055);
    var nb = Math.ceil((W + H) / bw) + 2;
    var cols3 = ['#FF3EB5', '#EDE6D6', '#5AF2FF'];
    for (var o = 0; o < 3; o++) {
      ctx.fillStyle = cols3[o];
      ctx.globalAlpha = 0.16 + (o === 1 ? 0.10 : 0);
      var sh = (o - 1) * (3 + glitch * 26);
      for (var b = -2; b < nb; b++) {
        if ((b + Math.floor(t * 0.7)) % 3 !== 0) continue;
        var x0 = b * bw + ((t * 14) % bw) + sh;
        ctx.beginPath();
        ctx.moveTo(x0, 0); ctx.lineTo(x0 + bw * 0.5, 0); ctx.lineTo(x0 + bw * 0.5 - H * 0.35, H); ctx.lineTo(x0 - H * 0.35, H);
        ctx.closePath(); ctx.fill();
      }
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawNPC(t, typing) {
  var u = Math.min(W, H) / 100;
  var cx = W * 0.5;
  var deckTop = H * 0.80;
  var bob = Math.sin(t * Math.PI * 2 * 1.6 + scratch.bobKick) * u * 0.9;
  var base = deckTop + bob;
  ctx.fillStyle = '#9AA0AA';
  // torso
  ctx.fillRect(cx - u * 7.5, base - u * 17, u * 15, u * 17);
  // head
  ctx.fillRect(cx - u * 5, base - u * 27.5, u * 10, u * 9.5);
  ctx.fillStyle = '#08080A';
  ctx.fillRect(cx - u * 3.2, base - u * 23.5, u * 1.8, u * 1.8);
  ctx.fillRect(cx + u * 1.4, base - u * 23.5, u * 1.8, u * 1.8);
  ctx.fillStyle = '#9AA0AA';
  // left arm resting on decks
  ctx.save();
  ctx.translate(cx - u * 7.5, base - u * 15);
  ctx.rotate(0.5 + Math.sin(t * Math.PI * 2 * 1.6 + scratch.bobKick) * 0.05);
  ctx.fillRect(-u * 1.6, 0, u * 3.2, u * 14);
  ctx.restore();
  // right arm: types just after each beat, scratches during drag
  ctx.save();
  ctx.translate(cx + u * 7.5, base - u * 15);
  var ra = 0.5;
  if (scratch.active) ra = 0.5 + Math.sin(scratch.x * 0.08) * 0.45;
  else if (typing) ra = 0.5 + Math.sin(t * 34) * 0.16;
  ctx.rotate(-ra);
  ctx.fillRect(-u * 1.6, 0, u * 3.2, u * 14);
  ctx.restore();
  // decks
  ctx.fillStyle = '#1E1E2E';
  var dw = Math.min(W * 0.62, u * 62);
  ctx.fillRect(cx - dw / 2, deckTop, dw, u * 11);
  ctx.fillStyle = '#08080A';
  ctx.beginPath(); ctx.arc(cx - dw * 0.27, deckTop + u * 5.5, u * 4.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + dw * 0.27, deckTop + u * 5.5, u * 4.1, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#9AA0AA'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx - dw * 0.27, deckTop + u * 5.5, u * 4.1, t * 1.8, t * 1.8 + 4.2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + dw * 0.27, deckTop + u * 5.5, u * 4.1, -t * 1.8, -t * 1.8 + 4.2); ctx.stroke();
  var btn = ['#5AF2FF', '#FF3EB5'];
  for (var b = 0; b < 6; b++) {
    ctx.fillStyle = btn[b % 2];
    ctx.globalAlpha = (Math.floor(t * 2) + b) % 3 === 0 ? 1 : 0.35;
    ctx.fillRect(cx - u * 6 + b * u * 2.2, deckTop + u * 1.4, u * 1.5, u * 1.5);
  }
  ctx.globalAlpha = 1;
}

function drawDialogue(t) {
  var bw = Math.min(W * (PHONE ? 0.86 : 0.44), 470);
  var bh = 58, bx = 16, by = 16;
  ctx.fillStyle = '#0D0D12';
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = '#5AF2FF'; ctx.globalAlpha = 0.55; ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
  ctx.globalAlpha = 1;
  var idx = (Math.floor(t / 4) + lineSkip) % LINES.length;
  var lt = (t % 4);
  var line = LINES[idx];
  var n = Math.min(line.length, Math.floor(lt / 0.045));
  ctx.fillStyle = '#EDE6D6';
  ctx.font = '13px monospace';
  ctx.textBaseline = 'middle';
  ctx.fillText(line.substring(0, n), bx + 12, by + bh / 2);
  if (Math.floor(t * 1.6) % 2 === 0) {
    ctx.fillStyle = '#5AF2FF';
    ctx.beginPath();
    var ax = bx + bw - 18, ay = by + bh - 15;
    ctx.moveTo(ax, ay); ctx.lineTo(ax + 9, ay); ctx.lineTo(ax + 4.5, ay + 7);
    ctx.closePath(); ctx.fill();
  }
  return { x: bx, y: by, w: bw, h: bh };
}
var dlgBox = { x: 16, y: 16, w: 300, h: 58 };

function draw(t) {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#08080A'; ctx.fillRect(0, 0, W, H);
  var beat = Math.floor(t / 4);
  var pattern = beat % 3;
  var typing = (t % 4) < 0.7;
  drawBackground(t, pattern, scratch.glitch);
  drawNPC(t, typing);
  dlgBox = drawDialogue(t);
}
canvas.addEventListener('pointerdown', function (e) {
  if (e.clientX >= dlgBox.x && e.clientX <= dlgBox.x + dlgBox.w && e.clientY >= dlgBox.y && e.clientY <= dlgBox.y + dlgBox.h) {
    lineSkip++;
    return;
  }
  scratch.active = true; scratch.x = e.clientX;
});
canvas.addEventListener('pointermove', function (e) {
  if (!scratch.active) return;
  var dx = e.clientX - scratch.x;
  scratch.x = e.clientX;
  scratch.glitch = Math.min(1, scratch.glitch + Math.abs(dx) / 60);
  scratch.bobKick += dx * 0.012;
});
function endScratch() { scratch.active = false; }
canvas.addEventListener('pointerup', endScratch);
canvas.addEventListener('pointercancel', endScratch);

resize();
var T0 = Date.now();
function frame() {
  var t = (Date.now() - T0) / 1000 + PHASE0;
  scratch.glitch *= 0.94;
  draw(t);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
draw(PHASE0);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
