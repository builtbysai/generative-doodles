<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex Study</title>
<style>
html, body { margin: 0; padding: 0; background: #0E0E0C; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0E0E0C';
var CREAM = '#E8E0C8';
var SQ3 = Math.sqrt(3);
var SEED = 1625007;
var CELL_MS = 120;   /* one cell every 120 ms, row by row */
var HATCH_S = 0.5;   /* each cell hatches in over half a second */
var FADE_S = 1.5;    /* edition cross-fade, seconds */
var COLS_ACROSS = 14;
var STORE_KEY = 'doodle-1625';
/* Twelve fixed editions, all muted, modeled on the cream / teal / rust
   family. Edition 1 is the spec palette. */
var PALETTES = [
  ['#E8E0C8', '#5FB8A8', '#C1552E'],
  ['#EFE3C8', '#4E9E8E', '#B0522A'],
  ['#E3D9B8', '#6FAFA0', '#C96A3A'],
  ['#EDE0C0', '#58A898', '#A84A28'],
  ['#DDD2B4', '#7AB5A6', '#CE6B40'],
  ['#F0E8D8', '#4A8F86', '#B85A30'],
  ['#E6DCC2', '#63B0A0', '#C46236'],
  ['#DCCFB0', '#55A08F', '#A8522C'],
  ['#E9DFC6', '#6BB3A2', '#CC5F32'],
  ['#E0D4B2', '#4C968A', '#B04E26'],
  ['#EFE7CE', '#72B3A4', '#D06A3E'],
  ['#D8CDB2', '#5A9E90', '#9E4A2A']
];
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
var PAL_RGB = [];
var pi;
for (pi = 0; pi < PALETTES.length; pi++) {
  PAL_RGB.push([hexRgb(PALETTES[pi][0]), hexRgb(PALETTES[pi][1]), hexRgb(PALETTES[pi][2])]);
}
var CREAM_RGB = hexRgb(CREAM);
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Square field-like lattice, edge to edge: full-bleed on phones, a centred
   square on desktop with the page ground the same near-black. */
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH) * 0.96;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- lattice: pointy-top hex grid, seeded once, never re-seeded ---- */
var lattice = { R: 0, cells: [] };
var latticeKey = '';
var N = 0, PHASE = 0, COMPLETE_T = 0;
function buildLattice(rect) {
  var R = rect.w / (COLS_ACROSS * SQ3);
  var wStep = SQ3 * R, hStep = 1.5 * R;
  var rng = mulberry32(SEED);
  var cells = [], r, c;
  var rMax = Math.floor(rect.h / hStep) + 2;
  var cMax = Math.floor(rect.w / wStep) + 2;
  for (r = 0; r < rMax; r++) {
    var cy = rect.y + R + r * hStep;
    for (c = 0; c < cMax; c++) {
      var cx = rect.x + (wStep / 2) + c * wStep + (r % 2 ? wStep / 2 : 0);
      if (cx + R < rect.x || cx - R > rect.x + rect.w) continue;
      if (cy + R < rect.y || cy - R > rect.y + rect.h) continue;
      var empty = rng() < 0.10;
      var slotR = rng();
      var slot = slotR < 0.38 ? 0 : (slotR < 0.72 ? 1 : 2);
      var angle = (-30 + (rng() - 0.5) * 40) * Math.PI / 180;
      var spacing = R * (0.16 + rng() * 0.22);
      var offs = [], s;
      for (s = -R; s <= R; s += spacing) offs.push(s);
      cells.push({
        cx: cx, cy: cy, empty: empty, slot: slot, angle: angle,
        offs: offs, alpha: 0.85 + rng() * 0.15
      });
    }
  }
  lattice = { R: R, cells: cells };
  N = cells.length;
  /* Frame one: the queue is three quarters complete, a few cells mid-hatch. */
  PHASE = Math.floor(N * 0.75) * CELL_MS / 1000 + HATCH_S;
  COMPLETE_T = N * CELL_MS / 1000 + HATCH_S + 0.1;
}
/* ---- edition state, persisted across visits ---- */
var edition = 0, prevEdition = -1, fadeStart = -1e9;
function loadEdition() {
  if (typeof localStorage === 'undefined') return;
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    var st = JSON.parse(raw);
    if (typeof st.edition === 'number') {
      edition = clamp(Math.floor(st.edition), 0, PALETTES.length - 1);
    }
  } catch (e) { /* corrupted state: start at edition 1 */ }
}
function saveEdition() {
  if (typeof localStorage === 'undefined') return;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ edition: edition }));
  } catch (e) { /* storage unavailable: the edition still advances */ }
}
/* QA hook: ?edition=K previews that edition without touching storage. */
function queryEdition() {
  if (typeof location === 'undefined' || !location.search) return -1;
  var m = location.search.match(/edition=(\d+)/);
  if (!m) return -1;
  return clamp(parseInt(m[1], 10), 0, PALETTES.length - 1);
}
function hexPath(cx, cy, R) {
  ctx.beginPath();
  var k;
  for (k = 0; k < 6; k++) {
    var a = (Math.PI / 180) * (30 + 60 * k);
    var x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function drawLattice(pal, t, alphaMul) {
  var i, j, cell;
  var R = lattice.R;
  ctx.lineCap = 'butt';
  for (i = 0; i < lattice.cells.length; i++) {
    cell = lattice.cells[i];
    if (cell.empty) continue;
    var p = clamp((t - i * CELL_MS / 1000) / HATCH_S, 0, 1);
    var rgb = pal[cell.slot];
    var a = cell.alpha * alphaMul;
    hexPath(cell.cx, cell.cy, R);
    if (p <= 0) {
      /* queued cell: a faint ghost of the hex, so the whole lattice
         reads from frame one while the hatching is still the
         plotter's work; empty cells never get one */
      ctx.strokeStyle = rgba(rgb, 0.20 * a);
      ctx.lineWidth = Math.max(0.8, R * 0.02);
      ctx.stroke();
      continue;
    }
    /* faint cell outline in the same ink, so the lattice reads */
    ctx.strokeStyle = rgba(rgb, 0.28 * a * p);
    ctx.lineWidth = Math.max(0.8, R * 0.02);
    ctx.stroke();
    ctx.save();
    ctx.clip();
    /* hatch lines: parallel diagonals clipped to the hex, so each cell
       reads as a hatched parallelogram; the first p fraction of lines
       is drawn, so the cell hatches in like the plotter working */
    var dx = Math.cos(cell.angle), dy = Math.sin(cell.angle);
    var px = -dy, py = dx;
    var n = cell.offs.length;
    var nShow = p >= 1 ? n : Math.max(1, Math.floor(p * n));
    ctx.strokeStyle = rgba(rgb, a);
    ctx.lineWidth = Math.max(1, R * 0.035);
    ctx.beginPath();
    for (j = 0; j < nShow; j++) {
      var s = cell.offs[j];
      var ox = px * s, oy = py * s;
      var L = 2 * R;
      ctx.moveTo(cell.cx + ox - dx * L, cell.cy + oy - dy * L);
      ctx.lineTo(cell.cx + ox + dx * L, cell.cy + oy + dy * L);
    }
    ctx.stroke();
    ctx.restore();
  }
}
function draw(t) {
  lastT = t;
  size();
  var rect = compRect();
  var key = Math.round(rect.w) + 'x' + Math.round(rect.h);
  if (key !== latticeKey) {
    buildLattice(rect);
    latticeKey = key;
  }
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  ctx.save();
  ctx.beginPath();
  ctx.rect(rect.x, rect.y, rect.w, rect.h);
  ctx.clip();
  var k = clamp((t - fadeStart) / FADE_S, 0, 1);
  var sk = smooth(k);
  if (prevEdition >= 0 && k < 1) {
    drawLattice(PAL_RGB[prevEdition], t, 1 - sk);
  }
  drawLattice(PAL_RGB[edition], t, (prevEdition >= 0 && k < 1) ? sk : 1);
  if (prevEdition >= 0 && k >= 1) prevEdition = -1;
  ctx.restore();
  /* Title block and hint sit on dark plates over the lattice, so the
     cream copy reads at every size. */
  var titlePx = isPhone ? 18 : 20;
  var smallPx = isPhone ? 11 : 12;
  var cxm = rect.x + rect.w / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  var titleW = ctx.measureText('Hex Study').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 06 · 24').width;
  var edLabel = 'EDITION ' + pad2(edition + 1) + ' / 12';
  var edW = ctx.measureText(edLabel).width;
  var plateW = Math.max(titleW, dateW, edW) + 28;
  var plateH = titlePx + smallPx * 2 + 24;
  var plateX = cxm - plateW / 2, plateY = rect.y + 10;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.fillStyle = CREAM;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Hex Study', cxm, plateY + 8);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(CREAM_RGB, 0.75);
  ctx.fillText('2006 · 06 · 24', cxm, plateY + 8 + titlePx + 4);
  ctx.fillStyle = rgba(CREAM_RGB, 0.6);
  ctx.fillText(edLabel, cxm, plateY + 8 + titlePx + smallPx + 7);
  var hint = 'Tap for the next edition.';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = cxm - hintPlateW / 2;
  var hintPlateY = rect.y + rect.h - hintPlateH - 10;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.fillStyle = rgba(CREAM_RGB, 0.85);
  ctx.fillText(hint, cxm, hintPlateY + 7);
}
function onTap() {
  prevEdition = edition;
  edition = (edition + 1) % PALETTES.length;
  if (reduced) {
    prevEdition = -1;
    fadeStart = -1e9;
  } else {
    fadeStart = lastT;
  }
  saveEdition();
  draw(lastT);
}
if (typeof canvas.addEventListener === 'function') canvas.addEventListener('pointerdown', onTap);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
/* ---- frame one: fixed phase, three quarters of the queue drawn ---- */
size();
var rect0 = compRect();
buildLattice(rect0);
latticeKey = Math.round(rect0.w) + 'x' + Math.round(rect0.h);
loadEdition();
var qe = queryEdition();
if (qe >= 0) edition = qe;
draw(reduced ? COMPLETE_T : PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
