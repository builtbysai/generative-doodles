<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mundo Diminuto</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #4EC8B8; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: strict, nothing else. Flat fills only, no gradients.
  var TURQ = '#4EC8B8', PINK = '#F06AA8', PURPLE = '#8A5AA8',
      BLUE = '#5A9AE0', INK = '#1A1A1A', WHITE = '#FFFFFF',
      GREEN = '#5AB85A', RED = '#D93A2B', YELLOW = '#F2D230';

  var PHASE0 = 4.0;   // constant first-frame phase: tram mid-circuit, stars mid-twinkle
  var CX = 540, CY = 540; // city centre in world coords

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(560067);
  function mod(a, n) { return ((a % n) + n) % n; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // ---- small canvas helpers ----
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
  function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
  function poly(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }
  function starPts(cx, cy, spikes, outer, inner, rot) {
    var pts = [], a = rot || 0, step = Math.PI / spikes;
    for (var i = 0; i < spikes * 2; i++) {
      var r = (i % 2 === 0) ? outer : inner;
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
      a += step;
    }
    return pts;
  }
  function fillStroke(fill, lw) {
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke();
  }
  // riso misregistration: colour printed 2px off under the ink keyline
  function misreg(drawFn, fill) {
    ctx.save(); ctx.translate(2.5, 1.5); drawFn(); ctx.fillStyle = fill; ctx.fill(); ctx.restore();
    drawFn(); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r); ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h); ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r); ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }

  // ---- precomputed seeded fields ----
  // riso grain / glitter specks, spread over the whole world (foreground plane)
  var SPECK_COLORS = [WHITE, PINK, PURPLE, YELLOW];
  var SPECKS = [];
  for (var si = 0; si < 700; si++) {
    SPECKS.push({
      x: -220 + rng() * 1520, y: -220 + rng() * 1520,
      r: 1 + rng() * 2.2, c: SPECK_COLORS[Math.floor(rng() * 4)],
      plus: rng() < 0.14, ph: rng() * Math.PI * 2
    });
  }
  // sky stars (background plane)
  var STARS = [];
  for (var ti = 0; ti < 26; ti++) {
    STARS.push({ x: -260 + rng() * 1600, y: -260 + rng() * 700, r: 9 + rng() * 13, ph: rng() * Math.PI * 2 });
  }
  // window flicker phases for every building, generated in draw order below
  function winLit(phase, t) { return mod(Math.floor(t * 0.7 + phase), 3) !== 0; }
  function windowGrid(x, y, cols, rows, dx, dy, seedBase, t) {
    for (var i = 0; i < cols; i++) for (var j = 0; j < rows; j++) {
      var ph = seedBase + i * 1.7 + j * 2.9;
      ctx.fillStyle = winLit(ph, t) ? YELLOW : WHITE;
      ctx.fillRect(x + i * dx - 9, y + j * dy - 11, 18, 22);
      ctx.strokeStyle = INK; ctx.lineWidth = 3;
      ctx.strokeRect(x + i * dx - 9, y + j * dy - 11, 18, 22);
    }
  }

  // ---- butterflies (background plane) ----
  var FLIES = [
    { bx: 240, by: 190, ax: 90, ay: 46, fx: 0.11, fy: 0.17, ph: 0.0 },
    { bx: 860, by: 150, ax: 110, ay: 40, fx: 0.09, fy: 0.13, ph: 2.1 },
    { bx: 120, by: 620, ax: 70, ay: 60, fx: 0.13, fy: 0.1, ph: 4.0 },
    { bx: 950, by: 560, ax: 80, ay: 55, fx: 0.1, fy: 0.15, ph: 1.2 },
    { bx: 560, by: 90, ax: 130, ay: 34, fx: 0.07, fy: 0.12, ph: 5.3 }
  ];
  function drawButterfly(x, y, flap) {
    ctx.save(); ctx.translate(x, y);
    var w = 16 * (0.35 + 0.65 * Math.abs(flap));
    ell(-w, -4, w, 11); fillStroke(BLUE, 3.5);
    ell(w, -4, w, 11); fillStroke(BLUE, 3.5);
    ell(-w * 0.8, 9, w * 0.75, 8); fillStroke(BLUE, 3.5);
    ell(w * 0.8, 9, w * 0.75, 8); fillStroke(BLUE, 3.5);
    ell(0, 0, 4.5, 13); ctx.fillStyle = INK; ctx.fill();
    ctx.restore();
  }

  // ================= BACKGROUND PLANE (parallax 0.3) =================
  function drawBackground(t) {
    // sun-star, big and four-pointed
    var tw = 1 + 0.1 * Math.sin(t * 1.4);
    poly(starPts(905, 120, 4, 58 * tw, 20 * tw, Math.PI / 4)); fillStroke(YELLOW, 5);
    poly(starPts(150, 110, 4, 34, 12, Math.PI / 4)); fillStroke(YELLOW, 4);
    for (var i = 0; i < STARS.length; i++) {
      var s = STARS[i], sc = 0.75 + 0.35 * (0.5 + 0.5 * Math.sin(t * 1.8 + s.ph));
      poly(starPts(s.x, s.y, 4, s.r * sc, s.r * 0.38 * sc, Math.PI / 4));
      ctx.fillStyle = YELLOW; ctx.fill();
    }
    // toy clouds: white puffs
    var clouds = [[330, 130], [700, 210], [60, 330], [1010, 330]];
    for (var ci = 0; ci < clouds.length; ci++) {
      var cxp = clouds[ci][0] + 14 * Math.sin(t * 0.21 + ci * 1.7), cyp = clouds[ci][1];
      ctx.fillStyle = WHITE; ctx.strokeStyle = INK; ctx.lineWidth = 4;
      circ(cxp - 34, cyp + 6, 22); ctx.fill(); ctx.stroke();
      circ(cxp, cyp - 6, 30); ctx.fill(); ctx.stroke();
      circ(cxp + 36, cyp + 6, 22); ctx.fill(); ctx.stroke();
      ctx.fillStyle = WHITE; ctx.fillRect(cxp - 34, cyp + 4, 70, 24);
    }
    for (var fi = 0; fi < FLIES.length; fi++) {
      var f = FLIES[fi];
      drawButterfly(
        f.bx + f.ax * Math.sin(t * f.fx * Math.PI * 2 + f.ph),
        f.by + f.ay * Math.sin(t * f.fy * Math.PI * 2 + f.ph * 2),
        Math.sin(t * 9 + fi * 1.3));
    }
  }

  // ================= MID PLANE (parallax 0.65) =================
  function drawStreets() {
    // flat ground patches in the other ground colours
    ell(180, 900, 330, 210); ctx.fillStyle = PINK; ctx.fill();
    ell(930, 190, 320, 200); ctx.fillStyle = PURPLE; ctx.fill();
    ell(950, 950, 260, 170); ctx.fillStyle = PINK; ctx.fill();
    ell(120, 140, 240, 150); ctx.fillStyle = PURPLE; ctx.fill();
    // radiating streets
    ctx.lineCap = 'round';
    for (var i = 0; i < 6; i++) {
      var a = i * Math.PI / 3 + Math.PI / 6;
      var ex = CX + Math.cos(a) * 640, ey = CY + Math.sin(a) * 640;
      ctx.strokeStyle = INK; ctx.lineWidth = 56;
      ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = WHITE; ctx.lineWidth = 46;
      ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.strokeStyle = INK; ctx.lineWidth = 4;
      ctx.setLineDash([26, 22]);
      ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.setLineDash([]);
    }
    // ring road / tram track
    circ(CX, CY, 252); ctx.strokeStyle = INK; ctx.lineWidth = 40; ctx.stroke();
    circ(CX, CY, 252); ctx.strokeStyle = WHITE; ctx.lineWidth = 31; ctx.stroke();
    circ(CX, CY, 266); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
    circ(CX, CY, 238); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
    // central plaza
    circ(CX, CY, 120); fillStroke(PINK, 5);
    poly(starPts(CX, CY, 5, 52, 22, -Math.PI / 2)); fillStroke(YELLOW, 4);
  }
  function drawTram(t) {
    var a = mod(t / 26, 1) * Math.PI * 2 + 0.7; // fixed circuit, fixed phase offset
    var x = CX + Math.cos(a) * 252, y = CY + Math.sin(a) * 252;
    ctx.save(); ctx.translate(x, y); ctx.rotate(a + Math.PI / 2);
    rr(-30, -58, 60, 116, 16); fillStroke(PINK, 5);
    rr(-19, -44, 38, 30, 7); fillStroke(WHITE, 3.5);
    rr(-19, -4, 38, 30, 7); fillStroke(WHITE, 3.5);
    rr(-19, 36, 38, 14, 6); fillStroke(YELLOW, 3.5);
    ctx.restore();
  }
  function drawMidHouses(t) {
    // little background toy houses around the ring
    var houses = [
      { x: 420, y: 130, c: PINK }, { x: 700, y: 120, c: PURPLE },
      { x: 130, y: 470, c: PURPLE }, { x: 960, y: 470, c: PINK },
      { x: 350, y: 950, c: PURPLE }, { x: 730, y: 950, c: PINK }
    ];
    for (var i = 0; i < houses.length; i++) {
      var h = houses[i];
      ctx.fillStyle = WHITE; ctx.fillRect(h.x - 42, h.y - 30, 84, 74);
      ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.strokeRect(h.x - 42, h.y - 30, 84, 74);
      poly([[h.x - 54, h.y - 28], [h.x + 54, h.y - 28], [h.x, h.y - 76]]); fillStroke(h.c, 4.5);
      ctx.fillStyle = winLit(i * 2.3 + 0.6, t) ? YELLOW : TURQ;
      ctx.fillRect(h.x - 11, h.y - 8, 22, 28);
      ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.strokeRect(h.x - 11, h.y - 8, 22, 28);
    }
    // lollipop trees
    var trees = [[300, 330, PINK], [790, 340, PURPLE], [270, 700, PURPLE], [820, 700, PINK], [540, 210, PINK], [90, 830, PURPLE], [990, 830, PINK]];
    for (var j = 0; j < trees.length; j++) {
      var tr = trees[j];
      ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(tr[0], tr[1] + 34); ctx.lineTo(tr[0], tr[1] - 6); ctx.stroke();
      circ(tr[0], tr[1] - 26, 27); fillStroke(tr[2], 4.5);
    }
  }

  // ================= FOREGROUND PLANE (parallax 1.0) =================
  var ROOFS = [
    { x: 858, y: 612 },  // vampire tower (home)
    { x: 238, y: 564 },  // octagon house roof cap
    { x: 838, y: 166 },  // star building top point
    { x: 168, y: 168 }   // salon roof
  ];
  var vampHome = 0, flight = null; // flight: {fx,fy,tx,ty,start}
  var hairStyle = 0, snipStart = -10;
  var HAIR_COUNT = 5;

  function drawOctagonHouse(t) {
    var x = 238, y = 760;
    misreg(function () { poly(starPts(x, y - 40, 8, 118, 104, Math.PI / 8)); }, PINK);
    // roof cap the vampire can stand on
    poly([[x - 62, y - 148], [x + 62, y - 148], [x + 30, y - 196], [x - 30, y - 196]]); fillStroke(PURPLE, 5);
    windowGrid(x - 34, y - 60, 2, 2, 68, 62, 3.1, t);
    rr(x - 24, y + 18, 48, 74, 8); fillStroke(WHITE, 4.5);
    circ(x + 12, y + 56, 4); ctx.fillStyle = INK; ctx.fill();
  }
  function drawStarBuilding(t) {
    var x = 838, y = 300;
    misreg(function () { poly(starPts(x, y, 5, 138, 92, -Math.PI / 2)); }, PURPLE);
    circ(x, y - 6, 34); fillStroke(WHITE, 4.5);
    ctx.fillStyle = winLit(7.7, t) ? YELLOW : TURQ;
    ctx.fillRect(x - 12, y - 20, 24, 28);
    ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.strokeRect(x - 12, y - 20, 24, 28);
    rr(x - 20, y + 52, 40, 52, 7); fillStroke(PINK, 4.5);
  }
  function drawSalon(t) {
    var x = 168, y = 300;
    rr(x - 98, y - 60, 196, 150, 10); fillStroke(WHITE, 5);
    poly([[x - 112, y - 58], [x + 112, y - 58], [x + 78, y - 132], [x - 78, y - 132]]); fillStroke(PINK, 5);
    // striped awning
    for (var i = 0; i < 6; i++) {
      ctx.fillStyle = (i % 2 === 0) ? PINK : WHITE;
      ctx.fillRect(x - 96 + i * 32, y + 2, 32, 24);
    }
    ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.strokeRect(x - 96, y + 2, 192, 24);
    // scissors emblem instead of a word
    ctx.save(); ctx.translate(x, y - 28);
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-16, -12); ctx.lineTo(18, 12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-16, 12); ctx.lineTo(18, -12); ctx.stroke();
    circ(-22, -16, 7); ctx.stroke();
    circ(-22, 16, 7); ctx.stroke();
    ctx.restore();
    windowGrid(x - 62, y + 52, 3, 1, 62, 10, 11.3, t);
  }
  function drawTower(t) {
    var x = 858, y = 800;
    rr(x - 66, y - 190, 132, 196, 8); fillStroke(WHITE, 5);
    poly([[x - 84, y - 188], [x + 84, y - 188], [x, y - 268]]); fillStroke(PURPLE, 5);
    poly(starPts(x, y - 282, 4, 22, 9, Math.PI / 4)); fillStroke(YELLOW, 4);
    windowGrid(x - 30, y - 140, 2, 3, 60, 52, 5.9, t);
    rr(x - 22, y - 48, 44, 54, 7); fillStroke(RED, 4.5);
  }
  function drawSign() {
    var x = 540, y = 996;
    ctx.strokeStyle = INK; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 148, y + 62); ctx.lineTo(x - 148, y - 34); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 148, y + 62); ctx.lineTo(x + 148, y - 34); ctx.stroke();
    misreg(function () { rr(x - 168, y - 78, 336, 76, 14); }, WHITE);
    ctx.fillStyle = INK;
    ctx.font = '700 41px "Arial Rounded MT Bold", "Trebuchet MS", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('PINEÁPOLIS', x, y - 38);
    poly(starPts(x - 140, y - 40, 4, 13, 5.5, Math.PI / 4)); ctx.fillStyle = YELLOW; ctx.fill();
    poly(starPts(x + 140, y - 40, 4, 13, 5.5, Math.PI / 4)); ctx.fillStyle = YELLOW; ctx.fill();
  }

  // ---- the hairdresser frog and its customer ----
  var FROG = { x: 255, y: 478 };
  var CUSTOMER = { x: 345, y: 478 };
  function drawHair(x, y, style) {
    ctx.fillStyle = INK;
    if (style === 0) { // flat cap
      ctx.beginPath(); ctx.arc(x, y - 2, 21, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fill();
      ctx.fillRect(x - 21, y - 5, 42, 6);
    } else if (style === 1) { // spikes
      poly([[x - 20, y - 6], [x - 14, y - 30], [x - 6, y - 10], [x, y - 32], [x + 7, y - 10], [x + 14, y - 30], [x + 20, y - 6]]); ctx.fill();
    } else if (style === 2) { // pink puff
      circ(x - 11, y - 16, 12); ctx.fillStyle = PINK; ctx.fill();
      circ(x + 11, y - 16, 12); ctx.fill();
      circ(x, y - 24, 13); ctx.fill();
    } else if (style === 3) { // star tuft
      poly(starPts(x, y - 18, 5, 17, 8, -Math.PI / 2)); ctx.fillStyle = YELLOW; ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
    } else { // single curl
      ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(x + 4, y - 18, 9, Math.PI * 0.4, Math.PI * 2.1); ctx.stroke();
    }
  }
  function drawFrogScene(t) {
    // salon chair + customer (black-and-white figure)
    var cxp = CUSTOMER.x, cyp = CUSTOMER.y;
    rr(cxp - 30, cyp - 6, 60, 52, 9); fillStroke(PURPLE, 4.5); // chair back
    circ(cxp, cyp - 34, 21); fillStroke(WHITE, 4.5);          // head
    drawHair(cxp, cyp - 38, hairStyle);
    circ(cxp - 7, cyp - 32, 2.6); ctx.fillStyle = INK; ctx.fill();
    circ(cxp + 7, cyp - 32, 2.6); ctx.fillStyle = INK; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cxp, cyp - 27, 6, 0.25, Math.PI - 0.25); ctx.stroke();
    ell(cxp, cyp + 22, 24, 20); fillStroke(WHITE, 4.5);        // body

    // the frog, scissors in hand
    var fx = FROG.x, fy = FROG.y;
    ell(fx, fy + 26, 34, 26); fillStroke(GREEN, 4.5);
    circ(fx - 15, fy - 14, 11); fillStroke(GREEN, 4);
    circ(fx + 15, fy - 14, 11); fillStroke(GREEN, 4);
    circ(fx - 15, fy - 15, 5); ctx.fillStyle = WHITE; ctx.fill();
    circ(fx + 15, fy - 15, 5); ctx.fillStyle = WHITE; ctx.fill();
    circ(fx - 15, fy - 15, 2.6); ctx.fillStyle = INK; ctx.fill();
    circ(fx + 15, fy - 15, 2.6); ctx.fillStyle = INK; ctx.fill();
    circ(fx, fy + 2, 26); fillStroke(GREEN, 4.5);
    ctx.strokeStyle = INK; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(fx, fy + 2, 13, 0.3, Math.PI - 0.3); ctx.stroke();
    // arm toward the customer, holding scissors
    ctx.strokeStyle = INK; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(fx + 26, fy + 18); ctx.lineTo(fx + 54, fy - 26); ctx.stroke();
    var snipping = (t - snipStart) < 1.4 && snipStart > 0;
    var open = snipping ? (Math.floor((t - snipStart) * 7) % 2 === 0 ? 0.5 : 0.08) : 0.3;
    ctx.save(); ctx.translate(fx + 60, fy - 30);
    ctx.strokeStyle = INK; ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(22 * Math.cos(-open), 22 * Math.sin(-open)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(22 * Math.cos(open), 22 * Math.sin(open)); ctx.stroke();
    circ(-6, -7, 5); ctx.stroke();
    circ(-6, 7, 5); ctx.stroke();
    ctx.restore();
    // snip sparkles while cutting
    if (snipping) {
      for (var i = 0; i < 3; i++) {
        var sp = starPts(cxp - 16 + i * 17, cyp - 66 - (i % 2) * 8, 4, 8, 3.4, Math.PI / 4 + t * 2);
        poly(sp); ctx.fillStyle = YELLOW; ctx.fill();
      }
    }
  }

  // ---- the vampire ----
  function vampPos(t) {
    if (!flight) return { x: ROOFS[vampHome].x, y: ROOFS[vampHome].y, fly: 0 };
    var u = (t - flight.start) / 1.8;
    if (u >= 1) return { x: flight.tx, y: flight.ty, fly: 0 };
    var e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    return {
      x: flight.fx + (flight.tx - flight.fx) * e,
      y: flight.fy + (flight.ty - flight.fy) * e - Math.sin(u * Math.PI) * 120,
      fly: Math.sin(u * Math.PI)
    };
  }
  function drawVampire(t) {
    var p = vampPos(t);
    if (flight && (t - flight.start) >= 1.8) flight = null;
    var x = p.x, y = p.y; // y is the rooftop line; figure stands above it
    var swish = Math.sin(t * (p.fly > 0 ? 13 : 2.2)) * (p.fly > 0 ? 14 : 5);
    // cape behind, swishing
    ctx.beginPath();
    ctx.moveTo(x - 6, y - 66);
    ctx.quadraticCurveTo(x - 44 - p.fly * 22, y - 40 + swish, x - 34 - p.fly * 30, y + 2 + swish * 0.6);
    ctx.quadraticCurveTo(x - 8, y - 8, x + 4, y - 60);
    ctx.closePath(); fillStroke(RED, 4.5);
    // body (ink suit, white shirt)
    rr(x - 13, y - 64, 26, 56, 9); fillStroke(INK, 4);
    poly([[x - 8, y - 62], [x + 8, y - 62], [x, y - 34]]); ctx.fillStyle = WHITE; ctx.fill();
    circ(x, y - 24, 3.4); ctx.fillStyle = RED; ctx.fill();
    // head: white face, ink swoop hair, tiny fangs
    circ(x, y - 84, 19); fillStroke(WHITE, 4.5);
    ctx.beginPath(); ctx.arc(x, y - 90, 19, Math.PI * 1.02, Math.PI * 1.98); ctx.closePath();
    ctx.fillStyle = INK; ctx.fill();
    poly([[x - 4, y - 104], [x + 5, y - 104], [x, y - 92]]); ctx.fillStyle = INK; ctx.fill();
    circ(x - 7, y - 82, 2.4); ctx.fillStyle = INK; ctx.fill();
    circ(x + 7, y - 82, 2.4); ctx.fillStyle = INK; ctx.fill();
    poly([[x - 6, y - 71], [x - 2, y - 71], [x - 4, y - 64]]); ctx.fillStyle = WHITE; ctx.fill();
    poly([[x + 2, y - 71], [x + 6, y - 71], [x + 4, y - 64]]); ctx.fillStyle = WHITE; ctx.fill();
  }

  function drawForeground(t) {
    drawTower(t);
    drawOctagonHouse(t);
    drawStarBuilding(t);
    drawSalon(t);
    drawFrogScene(t);
    drawVampire(t);
    drawSign();
    // riso grain + glitter over everything in this plane
    for (var i = 0; i < SPECKS.length; i++) {
      var s = SPECKS[i];
      ctx.fillStyle = s.c;
      if (s.plus) {
        var tw = 0.6 + 0.4 * Math.sin(t * 2.4 + s.ph);
        ctx.globalAlpha = tw;
        ctx.fillRect(s.x - s.r * 2.4, s.y - s.r * 0.7, s.r * 4.8, s.r * 1.4);
        ctx.fillRect(s.x - s.r * 0.7, s.y - s.r * 2.4, s.r * 1.4, s.r * 4.8);
        ctx.globalAlpha = 1;
      } else {
        circ(s.x, s.y, s.r); ctx.fill();
      }
    }
  }

  // ================= stage / draw =================
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;
  var panX = 0, panY = 0; // foreground pan, design units, clamped

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15;
  }
  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) { S = W; OX = 0; OY = (H - S) / 2; }
    else { S = Math.min(W, H); OX = (W - S) / 2; OY = (H - S) / 2; }
    draw(simT);
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = TURQ;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);
    ctx.lineJoin = 'round';

    ctx.save(); ctx.translate(panX * 0.3, panY * 0.3); drawBackground(t); ctx.restore();
    ctx.save(); ctx.translate(panX * 0.65, panY * 0.65); drawStreets(); drawMidHouses(t); drawTram(t); ctx.restore();
    ctx.save(); ctx.translate(panX, panY); drawForeground(t); ctx.restore();

    // hint, fixed to the stage
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = INK;
    ctx.font = '26px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('drag · tap', 1062, 1064);
    ctx.restore();

    ctx.restore();
  }

  // ================= input: drag pans, tap triggers =================
  var dragging = false, moved = 0, downT = 0, lastPX = 0, lastPY = 0, downX = 0, downY = 0;
  function toDesign(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return {
      x: (e.clientX - r.left - OX) * 1080 / S,
      y: (e.clientY - r.top - OY) * 1080 / S
    };
  }
  function onDown(e) {
    dragging = true; moved = 0;
    downT = e.timeStamp || 0;
    lastPX = downX = e.clientX; lastPY = downY = e.clientY;
  }
  function onMove(e) {
    if (!dragging) return;
    var dx = (e.clientX - lastPX) * 1080 / S, dy = (e.clientY - lastPY) * 1080 / S;
    lastPX = e.clientX; lastPY = e.clientY;
    moved += Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY);
    panX = clamp(panX + dx, -170, 170); // pan stays where released (clamped)
    panY = clamp(panY + dy, -170, 170);
    draw(simT);
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var quick = (e.timeStamp || 0) - downT < 500;
    var still = Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) < 8;
    if (quick && still) handleTap(e);
  }
  function handleTap(e) {
    var p = toDesign(e);
    var wx = p.x - panX, wy = p.y - panY; // foreground world coords
    // frog station?
    if (Math.hypot(wx - FROG.x, wy - (FROG.y - 10)) < 95 || Math.hypot(wx - CUSTOMER.x, wy - (CUSTOMER.y - 20)) < 85) {
      hairStyle = (hairStyle + 1) % HAIR_COUNT;
      snipStart = simT;
      draw(simT);
      return;
    }
    // vampire?
    var vp = vampPos(simT);
    if (Math.hypot(wx - vp.x, wy - (vp.y - 55)) < 95) {
      var next = (vampHome + 1) % ROOFS.length;
      flight = { fx: vp.x, fy: vp.y, tx: ROOFS[next].x, ty: ROOFS[next].y, start: simT };
      vampHome = next;
      draw(simT);
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { dragging = false; });
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }
  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
