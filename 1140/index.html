<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Another Moon</title>
<style>
  html, body { margin: 0; padding: 0; background: #030408; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var seed = 1140;
  try {
    var m = /[?&]seed=(\d+)/.exec(location.search || '');
    if (m) seed = parseInt(m[1], 10);
  } catch (e) {}

  // ---------- palette ----------
  var SKY = [3, 4, 8];            // #030408
  var DAWN = [38, 46, 62];        // day-wash grey the sky lifts toward
  var HILLS = [10, 13, 18];       // #0A0D12
  var HILLSFAR = [16, 21, 29];    // far ridge, a breath lighter
  var HILLSDAY = [43, 52, 66];    // hills under the day wash
  var STAR = 'rgb(220,232,245)';  // #DCE8F5
  var REALMOON = [245, 238, 220]; // #F5EEDC
  var MOONC = [205, 233, 255];    // #CDE9FF
  var BEAM = 'rgb(159,203,238)';  // #9FCBEE
  var BARFILL = 'rgb(223,243,255)'; // #DFF3FF
  var BARTRACK = 'rgb(26,34,48)';   // #1A2230
  var PHASESH = 'rgb(5,8,15)';

  function mixc(a, b, f) {
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' +
                    Math.round(a[1] + (b[1] - a[1]) * f) + ',' +
                    Math.round(a[2] + (b[2] - a[2]) * f) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }

  var TAU = Math.PI * 2;
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function smooth(x) { return x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x); }

  // ---------- phone detection ----------
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var minScreen = Math.min(sw || 9999, sh || 9999);
  var isPhone = minScreen < 700 || (sh > sw * 1.15 && minScreen < 900);

  // ---------- stars (seeded) ----------
  var NSTARS = isPhone ? 110 : 150;
  var starX = new Float32Array(NSTARS), starY = new Float32Array(NSTARS);
  var starR = new Float32Array(NSTARS), starP = new Float32Array(NSTARS);
  var starS = new Float32Array(NSTARS);
  (function () {
    var rnd = mulberry32((seed * 31 + 7) | 0);
    for (var i = 0; i < NSTARS; i++) {
      starX[i] = rnd();
      starY[i] = Math.pow(rnd(), 1.35) * 0.74;
      starR[i] = 0.5 + rnd() * 1.1;
      starP[i] = rnd() * TAU;
      starS[i] = 0.4 + rnd() * 1.1;
    }
  })();

  // ---------- the landscape (analytic ridges, seeded structures) ----------
  function farY(x) {
    return 0.775 + 0.016 * Math.sin(x * 9.3 + 1.7) + 0.011 * Math.sin(x * 23.7 + 0.4)
                 + 0.007 * Math.sin(x * 41.0 + 3.1);
  }
  function nearY(x) {
    return 0.868 + 0.018 * Math.sin(x * 7.1 + 4.2) + 0.012 * Math.sin(x * 17.3 + 2.1)
                 + 0.006 * Math.sin(x * 33.0 + 0.9);
  }
  // blocky structures standing on the near ridge: {x, w, h, windows[[dx,dy],...]}
  var STRUCTS = [
    { x: 0.145, w: 0.046, h: 0.078, win: [[0.30, 0.30], [0.62, 0.55]] },
    { x: 0.545, w: 0.034, h: 0.052, win: [[0.45, 0.35]] },
    { x: 0.855, w: 0.052, h: 0.095, win: [[0.28, 0.25], [0.60, 0.48], [0.40, 0.72]] }
  ];

  // ---------- the moons ----------
  var REAL = { x: 0.125, y: 0.165 };
  var MOON = { x: 0.755, y: 0.205 };
  // three off-frame projector points, and the fan of rays they throw:
  // each ray ends at a target inside the second moon's disc
  var PROJ = [[-0.10, 1.07], [1.13, 1.05], [1.07, -0.11]];
  var RAYS = [];
  (function () {
    var spread = [-0.72, -0.38, 0.0, 0.42, 0.78, -0.55, 0.18, 0.62, -0.15, 0.30, -0.85];
    for (var i = 0; i < spread.length; i++) {
      var a = spread[i] * Math.PI;
      RAYS.push({
        p: i % 3,
        tx: MOON.x + Math.cos(a) * 0.80,
        ty: MOON.y + Math.sin(a) * 0.80   // in units of the disc radius, applied at draw
      });
    }
  })();

  // ---------- charge: a closed-form resource over recorded events ----------
  // One cycle is 120 s: a 60 s day (charge fills) and a 60 s night (the
  // moon shines and drains). The no-event cycle is exactly periodic:
  // night always opens at 100 and the parameters are tuned so it ends
  // at ~15.4, which the next day refills to the cap before dusk.
  var CYCLE = 120, DAYLEN = 60;
  var FILL = 100 / 60;        // per second during the day
  var R1 = 1.5;               // drain per second at full brightness
  var UPBONUS = 2.2;          // extra harvest rate while an up-drag lasts
  var DIMF = 0.35;            // brightness/drain factor while a down-drag lasts
  var DISK = 1.2;             // discharge burn rate (exponential), 5 s window
  var T0 = 90.0;              // fixed first-frame phase: mid-night
  var C_AT_T0 = 55.0;         // the periodic solution's charge at t = 90

  var dragEvents = [];        // {t0, t1, kind: 'up' | 'down'}
  var disEvents = [];         // {t0} — burn window [t0, t0 + 5]
  var activeDrag = null;      // {t0, kind} while a classified drag is held

  function phaseAt(t) { var p = t % CYCLE; return p < 0 ? p + CYCLE : p; }
  function disAt(t) {
    for (var i = 0; i < disEvents.length; i++) {
      if (t >= disEvents[i].t0 && t <= disEvents[i].t0 + 5) return true;
    }
    return false;
  }
  function upAt(t) {
    var v = 0;
    for (var i = 0; i < dragEvents.length; i++) {
      var e = dragEvents[i];
      if (e.kind === 'up' && t >= e.t0 && t <= e.t1) v = UPBONUS;
    }
    if (activeDrag && activeDrag.kind === 'up' && t >= activeDrag.t0) v = UPBONUS;
    return v;
  }
  function dimAt(t) {
    for (var i = 0; i < dragEvents.length; i++) {
      var e = dragEvents[i];
      if (e.kind === 'down' && t >= e.t0 && t <= e.t1) return DIMF;
    }
    if (activeDrag && activeDrag.kind === 'down' && t >= activeDrag.t0) return DIMF;
    return 1;
  }

  function advanceSeg(C, a, b) {
    var dt = b - a;
    if (dt <= 0) return C;
    var mid = (a + b) / 2;
    if (disAt(mid)) return clamp(C * Math.exp(-DISK * dt), 0, 100);
    if (phaseAt(mid) < DAYLEN) {
      return clamp(C + (FILL + upAt(mid)) * dt, 0, 100);
    }
    // night: drain = R1 * dim * clamp(C/30) , plus any harvest bonus
    var dim = dimAt(mid), up = upAt(mid);
    var k = R1 * dim / 30;
    var rLin = up - R1 * dim;
    if (C >= 30) {
      if (rLin >= 0) return clamp(C + rLin * dt, 0, 100);
      var th = (C - 30) / (-rLin);
      if (th >= dt) return clamp(C + rLin * dt, 0, 100);
      var ceq = up / k;
      return clamp(ceq + (30 - ceq) * Math.exp(-k * (dt - th)), 0, 100);
    }
    var ceq2 = up / k;
    if (ceq2 > 30) {
      var ratio = (ceq2 - C) / (ceq2 - 30);
      if (ratio > 1) {
        var th2 = Math.log(ratio) / k;
        if (th2 < dt) return clamp(30 + rLin * (dt - th2), 0, 100);
      }
    }
    return clamp(ceq2 + (C - ceq2) * Math.exp(-k * dt), 0, 100);
  }

  function chargeAt(t) {
    if (t <= T0) return C_AT_T0;
    var pts = [T0, t];
    var bnd = Math.ceil(T0 / DAYLEN) * DAYLEN;
    for (; bnd < t; bnd += DAYLEN) if (bnd > T0) pts.push(bnd);
    var i, e;
    for (i = 0; i < dragEvents.length; i++) {
      e = dragEvents[i];
      if (e.t0 > T0 && e.t0 < t) pts.push(e.t0);
      if (e.t1 > T0 && e.t1 < t) pts.push(e.t1);
    }
    for (i = 0; i < disEvents.length; i++) {
      e = disEvents[i];
      if (e.t0 > T0 && e.t0 < t) pts.push(e.t0);
      if (e.t0 + 5 > T0 && e.t0 + 5 < t) pts.push(e.t0 + 5);
    }
    if (activeDrag && activeDrag.t0 > T0 && activeDrag.t0 < t) pts.push(activeDrag.t0);
    pts.sort(function (x, y) { return x - y; });
    var C = C_AT_T0;
    for (i = 1; i < pts.length; i++) {
      if (pts[i] > pts[i - 1]) C = advanceSeg(C, pts[i - 1], pts[i]);
    }
    return C;
  }

  function brightnessAt(t, C) {
    if (disAt(t)) return 1.35;
    if (phaseAt(t) < DAYLEN) return 0;
    var B = C / 30; if (B > 1) B = 1;
    return B * dimAt(t);
  }
  function washAt(t) {
    var p = phaseAt(t);
    if (p >= DAYLEN) return 0;
    return Math.sin(Math.PI * p / DAYLEN);
  }

  // ---------- motes (seeded; rise while charge is being pulled up) ----------
  var NMOTES = 22;
  var moteSeed = [];
  (function () {
    var rnd = mulberry32((seed * 131 + 17) | 0);
    for (var i = 0; i < NMOTES; i++) {
      moteSeed.push({ x: 0.08 + 0.84 * rnd(), o: rnd(), d: 1.4 + 0.9 * rnd(),
                      ox: (rnd() - 0.5) * 1.2, oy: (rnd() - 0.5) * 1.2 });
    }
  })();

  // ---------- view / canvas ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DH = 0, OY = 0;

  function viewW() {
    if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight || 800;
  }
  function fit() {
    W = viewW(); H = viewH();
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    DH = (H > W) ? H * 0.94 : Math.min(H, W * 0.62);   // landscape scene, letterboxed
    OY = (H - DH) / 2;
  }
  function SX(nx) { return nx * W; }
  function SY(ny) { return OY + ny * DH; }

  function ridgePath(yFn, base) {
    ctx.beginPath();
    var steps = 48;
    for (var i = 0; i <= steps; i++) {
      var x = i / steps;
      var px = SX(x), py = SY(yFn(x));
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.lineTo(SX(1), SY(base));
    ctx.lineTo(SX(0), SY(base));
    ctx.closePath();
  }

  function draw(t) {
    fit();
    var C = chargeAt(t);
    var B = brightnessAt(t, C);
    var wash = washAt(t);
    var night = phaseAt(t) >= DAYLEN;

    // sky (flat wash layers, no gradients)
    ctx.fillStyle = mixc(SKY, DAWN, wash * 0.9);
    ctx.fillRect(0, 0, W, H);

    // stars, twinkling, washed out by day
    var starA = 0.5 * (1 - wash * 0.88);
    if (starA > 0.01) {
      ctx.fillStyle = STAR;
      for (var i = 0; i < NSTARS; i++) {
        var tw = 0.72 + 0.28 * Math.sin(t * starS[i] + starP[i]);
        ctx.globalAlpha = starA * tw;
        var sr = starR[i] * clamp(W / 900, 0.6, 1.4);
        ctx.fillRect(SX(starX[i]) - sr / 2, SY(starY[i]) - sr / 2, sr, sr);
      }
      ctx.globalAlpha = 1;
    }

    // the real moon: small, warm, static
    var rReal = clamp(W * 0.030, 10, 40);
    var rx = SX(REAL.x), ry = SY(REAL.y);
    var realA = 0.95 - 0.55 * wash;
    ctx.fillStyle = rgba(REALMOON, 0.030 * realA);
    ctx.beginPath(); ctx.arc(rx, ry, rReal * 2.25, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba(REALMOON, 0.055 * realA);
    ctx.beginPath(); ctx.arc(rx, ry, rReal * 1.65, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba(REALMOON, 0.09 * realA);
    ctx.beginPath(); ctx.arc(rx, ry, rReal * 1.28, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba(REALMOON, realA);
    ctx.beginPath(); ctx.arc(rx, ry, rReal, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(190,175,140,0.14)';
    ctx.beginPath(); ctx.arc(rx - rReal * 0.30, ry - rReal * 0.18, rReal * 0.20, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(rx + rReal * 0.26, ry + rReal * 0.34, rReal * 0.14, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(rx + rReal * 0.10, ry - rReal * 0.44, rReal * 0.11, 0, TAU); ctx.fill();

    // ---------- the second moon: drawn by its beams ----------
    var r2 = clamp(W * 0.058, 18, 78);
    var mx = SX(MOON.x), my = SY(MOON.y);
    if (B > 0.003) {
      var glowA = Math.min(B, 1);
      // halo: layered flat-alpha discs
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = rgba([159, 203, 238], 0.045 * glowA);
      ctx.beginPath(); ctx.arc(mx, my, r2 * 2.15, 0, TAU); ctx.fill();
      ctx.fillStyle = rgba([159, 203, 238], 0.065 * glowA);
      ctx.beginPath(); ctx.arc(mx, my, r2 * 1.55, 0, TAU); ctx.fill();
      ctx.fillStyle = rgba([205, 233, 255], 0.09 * glowA);
      ctx.beginPath(); ctx.arc(mx, my, r2 * 1.24, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';

      // the beam fan, faint along its whole throw
      ctx.strokeStyle = BEAM;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.05 * B;
      ctx.beginPath();
      for (var ri = 0; ri < RAYS.length; ri++) {
        var ray = RAYS[ri];
        var p = PROJ[ray.p];
        ctx.moveTo(SX(p[0]), SY(p[1]));
        ctx.lineTo(mx + ray.tx * r2, my + ray.ty * r2);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;

      // haze ticks: the beams brighten where they cross the air above the hills
      ctx.globalAlpha = 0.10 * B;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (var hi = 0; hi < RAYS.length; hi++) {
        var hray = RAYS[hi];
        var hp = PROJ[hray.p];
        var txp = MOON.x + hray.tx * (r2 / W), typ = MOON.y + hray.ty * (r2 / DH);
        var dyv = typ - hp[1];
        if (Math.abs(dyv) < 1e-6) continue;
        var s = (0.845 - hp[1]) / dyv;
        if (s <= 0.05 || s >= 0.98) continue;
        var s0 = s - 0.028, s1 = s + 0.028;
        ctx.moveTo(SX(hp[0] + (txp - hp[0]) * s0), SY(hp[1] + dyv * s0));
        ctx.lineTo(SX(hp[0] + (txp - hp[0]) * s1), SY(hp[1] + dyv * s1));
      }
      ctx.stroke();
      ctx.globalAlpha = 1;

      // the disc itself: layered flat discs
      ctx.fillStyle = rgba(MOONC, 0.50 * B);
      ctx.beginPath(); ctx.arc(mx, my, r2, 0, TAU); ctx.fill();
      ctx.fillStyle = rgba(MOONC, 0.32 * B);
      ctx.beginPath(); ctx.arc(mx, my, r2 * 0.78, 0, TAU); ctx.fill();
      ctx.fillStyle = rgba([240, 249, 255], 0.30 * B);
      ctx.beginPath(); ctx.arc(mx, my, r2 * 0.50, 0, TAU); ctx.fill();

      // the beams again, bright where they cross the disc: the moon is
      // visibly the place where the fan meets
      ctx.save();
      ctx.beginPath(); ctx.arc(mx, my, r2, 0, TAU); ctx.clip();
      ctx.strokeStyle = BEAM;
      ctx.lineWidth = 1.2;
      ctx.globalAlpha = 0.30 * Math.min(B, 1.15);
      ctx.beginPath();
      for (var ci = 0; ci < RAYS.length; ci++) {
        var cray = RAYS[ci];
        var cp = PROJ[cray.p];
        ctx.moveTo(SX(cp[0]), SY(cp[1]));
        ctx.lineTo(mx + cray.tx * r2, my + cray.ty * r2);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
      // phase: a shadow disc offset by the charge fraction — the moon
      // wanes as the battery drains
      var f = C / 100;
      var off = (1 - f) * 1.25 * r2;
      ctx.fillStyle = PHASESH;
      ctx.globalAlpha = 0.86 * Math.min(1, B * 1.6);
      ctx.beginPath(); ctx.arc(mx + off, my, r2 * 1.02, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();

      // rim
      ctx.strokeStyle = rgba(MOONC, 0.35 * Math.min(B, 1));
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(mx, my, r2, 0, TAU); ctx.stroke();
    }

    // ---------- landscape ----------
    ridgePath(farY, 1.03);
    ctx.fillStyle = mixc(HILLSFAR, HILLSDAY, wash * 0.75);
    ctx.fill();
    ridgePath(nearY, 1.03);
    ctx.fillStyle = mixc(HILLS, HILLSDAY, wash * 0.75);
    ctx.fill();

    // structures on the near ridge, with a few lit windows
    for (var si = 0; si < STRUCTS.length; si++) {
      var st = STRUCTS[si];
      var bx = SX(st.x), bw = st.w * W;
      var bTop = SY(nearY(st.x + st.w / 2) - st.h);
      var bBot = SY(nearY(st.x + st.w / 2)) + 2;
      ctx.fillStyle = mixc(HILLS, HILLSDAY, wash * 0.75);
      ctx.fillRect(bx, bTop, bw, bBot - bTop);
      if (night || wash < 0.4) {
        ctx.fillStyle = BEAM;
        ctx.globalAlpha = 0.32 * (1 - wash);
        for (var wi = 0; wi < st.win.length; wi++) {
          var wn = st.win[wi];
          ctx.fillRect(bx + wn[0] * bw, bTop + wn[1] * (bBot - bTop), 2.2, 2.8);
        }
        ctx.globalAlpha = 1;
      }
    }

    // ---------- motes: charge pulled up from the hills ----------
    var upEvts = [];
    for (var ei = 0; ei < dragEvents.length; ei++) {
      if (dragEvents[ei].kind === 'up') upEvts.push(dragEvents[ei]);
    }
    if (activeDrag && activeDrag.kind === 'up') {
      upEvts.push({ t0: activeDrag.t0, t1: t });
    }
    for (var ui = 0; ui < upEvts.length; ui++) {
      var ue = upEvts[ui];
      if (t < ue.t0 || t > ue.t1 + 0.9) continue;
      var fade = t <= ue.t1 ? 1 : 1 - (t - ue.t1) / 0.9;
      ctx.fillStyle = BARFILL;
      for (var mi = 0; mi < NMOTES; mi++) {
        var ms = moteSeed[mi];
        var pj = ((t - ue.t0) / ms.d + ms.o) % 1;
        if (pj < 0) pj += 1;
        var ez = pj * pj * (3 - 2 * pj);
        var sxp = ms.x + (MOON.x + ms.ox * (r2 / W) - ms.x) * ez;
        var syp = (nearY(ms.x) - 0.006) + (MOON.y + ms.oy * (r2 / DH) - (nearY(ms.x) - 0.006)) * ez
                  - Math.sin(pj * Math.PI) * 0.05;
        ctx.globalAlpha = Math.sin(pj * Math.PI) * 0.75 * fade;
        var mr = 1.1 + pj * 0.9;
        ctx.fillRect(SX(sxp) - mr / 2, SY(syp) - mr / 2, mr, mr);
      }
      ctx.globalAlpha = 1;
    }

    // ---------- the one hairline of UI: the charge bar ----------
    ctx.fillStyle = BARTRACK;
    ctx.fillRect(0, H - 4, W, 4);
    ctx.fillStyle = BARFILL;
    ctx.globalAlpha = disAt(t) ? 0.72 + 0.28 * Math.sin(t * 26) : 1;
    ctx.fillRect(0, H - 4, W * (C / 100), 4);
    ctx.globalAlpha = 1;
  }

  // ---------- sound: lazy, gesture-gated, very quiet (Franke rule) ----------
  var AC = null, choir = [];
  function initAudio() {
    if (AC) { try { if (AC.resume) AC.resume(); } catch (e) {} return; }
    try {
      var Ctor = (typeof AudioContext !== 'undefined') ? AudioContext
               : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
      if (!Ctor) return;
      AC = new Ctor();
      var len = 2 * AC.sampleRate;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var d = buf.getChannelData(0);
      var rr = mulberry32(777);
      for (var i = 0; i < len; i++) d[i] = rr() * 2 - 1;
      // night air: noise through a lowpass, barely there
      var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 300;
      var ng = AC.createGain(); ng.gain.value = 0.011;
      src.connect(lp); lp.connect(ng); ng.connect(AC.destination); src.start();
      // cricket shimmer: bandpassed noise with a slow tremolo
      var src2 = AC.createBufferSource(); src2.buffer = buf; src2.loop = true;
      src2.playbackRate.value = 0.7;
      var bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 5400; bp.Q.value = 9;
      var bg = AC.createGain(); bg.gain.value = 0.0035;
      var lfo = AC.createOscillator(); lfo.frequency.value = 11;
      var lg = AC.createGain(); lg.gain.value = 0.002;
      lfo.connect(lg); lg.connect(bg.gain);
      src2.connect(bp); bp.connect(bg); bg.connect(AC.destination);
      src2.start(); lfo.start();
      // the laser choir: two cold sines, gain follows the moon
      var freqs = [196, 294.5];
      for (var fi = 0; fi < freqs.length; fi++) {
        var o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = freqs[fi];
        var g = AC.createGain(); g.gain.value = 0;
        o.connect(g); g.connect(AC.destination); o.start();
        choir.push(g);
      }
    } catch (e) { AC = null; choir = []; }
  }
  function audioFrame(B) {
    if (!AC || !choir.length) return;
    try {
      var target = 0.010 * Math.min(B, 1.2);
      for (var i = 0; i < choir.length; i++) {
        choir[i].gain.setTargetAtTime(target * (i === 0 ? 1 : 0.7), AC.currentTime, 0.4);
      }
    } catch (e) {}
  }

  // ---------- interaction ----------
  var lastT = T0;
  var dragging = false, dragX0 = 0, dragY0 = 0, dragX = 0, dragY = 0, dragT0 = 0;
  var lastTapMs = 0;

  function classify(x0, y0, x1, y1) {
    var dy = y1 - y0;
    var mxp = SX(MOON.x), myp = SY(MOON.y);
    var r2p = clamp(W * 0.058, 18, 78);
    var dMoon = Math.sqrt((x0 - mxp) * (x0 - mxp) + (y0 - myp) * (y0 - myp));
    if (y0 > OY + 0.55 * DH && dy < -24) return 'up';
    if (dMoon < r2p * 1.7 && dy > 24) return 'down';
    return null;
  }
  function discharge(t) {
    disEvents.push({ t0: t });
    if (disEvents.length > 20) disEvents.splice(0, disEvents.length - 20);
  }
  function onDown(e) {
    if (!e) return;
    initAudio();
    dragging = true;
    dragX0 = dragX = e.clientX || 0;
    dragY0 = dragY = e.clientY || 0;
    dragT0 = lastT;
    activeDrag = null;
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    if (now && now - lastTapMs < 350) discharge(lastT);
    lastTapMs = now;
  }
  function onMove(e) {
    if (!dragging || !e) return;
    dragX = e.clientX || 0; dragY = e.clientY || 0;
    var kind = classify(dragX0, dragY0, dragX, dragY);
    activeDrag = kind ? { t0: dragT0, kind: kind } : null;
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    var kind = classify(dragX0, dragY0, dragX, dragY);
    if (kind) {
      dragEvents.push({ t0: dragT0, t1: lastT, kind: kind });
      if (dragEvents.length > 60) dragEvents.splice(0, dragEvents.length - 60);
    }
    activeDrag = null;
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('dblclick', function () { initAudio(); discharge(lastT); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { draw(lastT); });
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { draw(lastT); });
  }

  // ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
  draw(T0);

  var startStamp = null;
  function frame(stamp) {
    if (startStamp === null) startStamp = stamp;
    var t = T0 + (stamp - startStamp) / 1000;
    lastT = t;
    draw(t);
    audioFrame(brightnessAt(t, chargeAt(t)));
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
