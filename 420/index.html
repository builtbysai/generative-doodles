<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.420 Mahjong Babies</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FFF6E8; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.420 Mahjong Babies (kittyo.illustration, EXPANSION #45).
// After Kitty O'Rourke's "American Mahjong for Babies"
// board book: twelve chunky rounded tiles in a 4x3 grid
// on a flat cream ground, each tile an anthropomorphic
// character sharing ONE minimal face system (two-dot
// eyes + a smile arc). The families cycle beneath the
// tiles in hand-lettered caps: DOTS (smiling suns),
// CRAKS (abstract character stroke marks with a dragon
// buddy), BAMS (bamboo stalks, plus a Bird Bam),
// FLOWERS (smiling blooms), WINDS (N/E/W/S clouds),
// JOKERS (toucan characters) - each family twice, one
// label under each tile. A chunky hand-lettered banner
// across the top reads IT'S TIME TO PLAY! All lettering
// is STROKE PATH data drawn on the canvas - no system
// fonts, no signature (Kitty O does not sign these).
// TAP a tile: it does a happy authored bounce (squash
// and stretch on a spring curve, 0.55s), blinks once,
// and emits exactly 3 sparkles at authored offsets.
// Ambient 36s loop: one tile at a time flips to its
// patterned back and back again, on a FIXED AUTHORED
// ROTATION (FLIP_SEQ below, one named tile per 3s slot,
// flip via scaleX through 0, the back drawn as diamond
// lattice path data in the family colour); the wind
// clouds drift 4px on a whole cycle of the loop.
// Tile shadows are flat offset shapes. Black outlines
// on every shape are her grammar in this set. Frame
// one is drawn at the constant phase T = 2.8s (inside
// slot 0's rest window, so all twelve faces are up and
// the banner is complete); the clock is anchored there
// and advances in fixed 1/60 ticks, never from a wall
// clock. Flat colour only, one canvas, no offscreen
// canvas, no gradients, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Ground cream; tile faces white; suns yellow; bamboo
// and dragons green; dragon red; flowers pink, orange,
// purple; clouds sky; toucans black with orange beaks;
// faces and outlines black. Nothing else.
var GROUND = '#FFF6E8', TILE = '#FFFFFF', INK = '#1A1A1A';
var SUN = '#FFD832', GREEN = '#2E7D4F', RED = '#E63329';
var PINK = '#FF9ECF', ORANGE = '#F26A1B', PURPLE = '#B388EB';
var SKY = '#7BCEEB', BEAK = '#F5A623';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 36;
if (LOOP !== 36) throw new Error('Mahjong Babies ambient loop must be 36s');
var TICK = 1 / 60;

// ---- hand-lettered stroke glyphs ------------------------
// Each glyph is a list of strokes; each stroke is a list
// of [x, y] points on a 4-wide, 6-tall grid (y down).
// Drawn with round caps and joins so the lettering
// reads hand-done. No font text anywhere in the piece.
var GLYPHS = {
  'A': [[[0,6],[2,0],[4,6]], [[1.1,4],[2.9,4]]],
  'B': [[[0,0],[0,6]], [[0,0],[2.5,0],[3.5,0.9],[3.5,2.1],[2.5,3],[0,3]], [[0,3],[2.7,3],[3.7,3.9],[3.7,5.1],[2.7,6],[0,6]]],
  'C': [[[3.6,1.1],[2.5,0.2],[1.1,0.2],[0.2,1.3],[0.2,4.7],[1.1,5.8],[2.5,5.8],[3.6,4.9]]],
  'D': [[[0,0],[0,6]], [[0,0],[2.3,0],[3.8,1.7],[3.8,4.3],[2.3,6],[0,6]]],
  'E': [[[3.6,0],[0,0],[0,6],[3.6,6]], [[0,3],[2.7,3]]],
  'F': [[[3.6,0],[0,0],[0,6]], [[0,3],[2.7,3]]],
  'I': [[[2,0],[2,6]], [[0.7,0],[3.3,0]], [[0.7,6],[3.3,6]]],
  'J': [[[3.4,0],[3.4,4.5],[2.6,5.8],[1.1,5.8],[0.3,4.7]], [[1.6,0],[3.4,0]]],
  'K': [[[0,0],[0,6]], [[3.6,0],[0.5,2.9]], [[1.3,3.7],[3.8,6]]],
  'L': [[[0,0],[0,6],[3.6,6]]],
  'M': [[[0,6],[0,0],[2,3.4],[4,0],[4,6]]],
  'N': [[[0,6],[0,0],[4,6],[4,0]]],
  'O': [[[1.1,0.2],[2.9,0.2],[3.9,1.3],[3.9,4.7],[2.9,5.8],[1.1,5.8],[0.1,4.7],[0.1,1.3],[1.1,0.2]]],
  'P': [[[0,6],[0,0],[2.7,0],[3.7,0.9],[3.7,2.3],[2.7,3.2],[0,3.2]]],
  'R': [[[0,6],[0,0],[2.7,0],[3.7,0.9],[3.7,2.3],[2.7,3.2],[0,3.2]], [[1.7,3.2],[3.8,6]]],
  'S': [[[3.6,0.9],[2.6,0.1],[1.2,0.1],[0.3,0.9],[0.3,2.1],[1.1,2.9],[2.9,3.1],[3.7,3.9],[3.7,5.1],[2.8,5.9],[1.2,5.9],[0.3,5.1]]],
  'T': [[[0,0],[4,0]], [[2,0],[2,6]]],
  'W': [[[0,0],[0.8,6],[2,2.6],[3.2,6],[4,0]]],
  'Y': [[[0,0],[2,2.6],[4,0]], [[2,2.6],[2,6]]],
  "'": [[[2.1,0],[1.7,1.5]]],
  '!': [[[2,0],[2,3.7]]]
};
function textUnits(str) {
  var u = 0;
  for (var i = 0; i < str.length; i++) u += (str[i] === ' ' ? 3.2 : 5.2);
  return u > 0 ? u - 1.2 : 0;
}
function drawText(str, cx, cy, h, color, lw) {
  var sc = h / 6;
  var x = cx - textUnits(str) * sc / 2;
  ctx.strokeStyle = color;
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (var i = 0; i < str.length; i++) {
    var ch = str[i];
    if (ch === '!') {
      // stem stroke plus a filled dot
      var g0 = GLYPHS['!'][0];
      ctx.beginPath();
      ctx.moveTo(x + g0[0][0] * sc, cy - h / 2 + g0[0][1] * sc);
      ctx.lineTo(x + g0[1][0] * sc, cy - h / 2 + g0[1][1] * sc);
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x + 2 * sc, cy - h / 2 + 5.55 * sc, lw * 0.62, 0, Math.PI * 2);
      ctx.fill();
    } else if (GLYPHS[ch]) {
      var g = GLYPHS[ch];
      for (var s2 = 0; s2 < g.length; s2++) {
        var st = g[s2];
        ctx.beginPath();
        for (var p = 0; p < st.length; p++) {
          var px = x + st[p][0] * sc, py = cy - h / 2 + st[p][1] * sc;
          if (p === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
    }
    x += (ch === ' ' ? 3.2 : 5.2) * sc;
  }
}

// ---- drawing helpers ------------------------------------
function rrPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function ell(x, y, rx, ry, rot, color) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}
function ellO(x, y, rx, ry, rot, color, lw) {
  ell(x, y, rx, ry, rot, color);
  ctx.lineWidth = lw || 3;
  ctx.strokeStyle = INK;
  ctx.stroke();
}
function seg(x1, y1, x2, y2, w, color) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineWidth = w;
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.stroke();
}
function star(x, y, R, color) {
  // 4-point sparkle star as filled path data.
  var r = R * 0.34;
  ctx.beginPath();
  for (var i = 0; i < 8; i++) {
    var a = -Math.PI / 2 + i * Math.PI / 4;
    var rad = (i % 2 === 0) ? R : r;
    var px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = INK;
  ctx.stroke();
}

// ---- the shared minimal face -----------------------------
// Two-dot eyes + a smile arc. blink is 1 (open) down to
// ~0.12 (closed). fx, fy = face centre; u = unit scale.
function face(fx, fy, u, blink) {
  var eo = 15 * u, er = Math.max(1.2, 5.2 * u);
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.ellipse(fx - eo, fy, er, Math.max(0.7, er * blink), 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(fx + eo, fy, er, Math.max(0.7, er * blink), 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(fx, fy + 6 * u, 12.5 * u, Math.PI * 0.18, Math.PI * 0.82);
  ctx.lineWidth = 3.4 * u;
  ctx.strokeStyle = INK;
  ctx.lineCap = 'round';
  ctx.stroke();
}

// ---- tile characters --------------------------------------
// All drawn in tile-local coords: tile is TW x TH, centre
// (0, 0). Every character carries the shared face.

function drawSun() {
  var i, a;
  ctx.strokeStyle = SUN;
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  for (i = 0; i < 8; i++) {
    a = i * Math.PI / 4 + 0.2;
    seg(Math.cos(a) * 50, -14 + Math.sin(a) * 50, Math.cos(a) * 66, -14 + Math.sin(a) * 66, 8, SUN);
  }
  ellO(0, -14, 46, 46, 0, SUN, 3.5);
  face(0, -18, 1.05, drawSun.blink);
}
function drawDragon(dx, dy, color, mirror) {
  ctx.save();
  ctx.translate(dx, dy);
  ctx.scale(mirror * 1.18, 1.18);
  // tail curling out behind at the lower back
  ctx.beginPath();
  ctx.moveTo(-13, 13);
  ctx.quadraticCurveTo(-30, 18, -31, 0);
  ctx.lineWidth = 6.5;
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.lineWidth = 2;
  ctx.strokeStyle = INK;
  // back spikes: fins pointing off the left rim
  ctx.fillStyle = color;
  var sp = [[-17, -11], [-20, 1], [-17, 13]];
  for (var i = 0; i < sp.length; i++) {
    ctx.beginPath();
    ctx.moveTo(sp[i][0] + 5, sp[i][1] - 6);
    ctx.lineTo(sp[i][0] - 7, sp[i][1]);
    ctx.lineTo(sp[i][0] + 5, sp[i][1] + 6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  // horns
  ctx.beginPath();
  ctx.moveTo(-2, -18); ctx.lineTo(1, -30); ctx.lineTo(8, -19); ctx.closePath();
  ctx.fillStyle = TILE; ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(12, -19); ctx.lineTo(17, -29); ctx.lineTo(21, -17); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // body + snout
  ellO(0, 0, 22, 21, 0, color, 3);
  ellO(17, 5, 9, 7.5, 0, color, 2.6);
  face(3, -3, 0.52, drawDragon.blink);
  ctx.restore();
}
function drawCrak(variant) {
  // Abstract character marks only: short calligraphic
  // ticks, never a real character.
  ctx.strokeStyle = INK;
  ctx.lineCap = 'round';
  if (variant === 0) {
    seg(-64, -68, -60, -24, 6, INK);
    seg(-72, -50, -50, -54, 6, INK);
    seg(-36, -72, -18, -38, 6, INK);
    seg(-66, -6, -42, -12, 6, INK);
    ell(-24, -64, 4.5, 4.5, 0, INK);
    drawDragon(28, 32, RED, 1);
  } else {
    seg(-68, -60, -46, -40, 6, INK);
    seg(-54, -70, -50, -34, 6, INK);
    seg(-72, -14, -48, -20, 6, INK);
    seg(-28, -58, -18, -34, 6, INK);
    ell(-34, -66, 4.5, 4.5, 0, INK);
    ell(-70, -34, 3.6, 3.6, 0, INK);
    drawDragon(30, 34, GREEN, 1);
  }
}
function drawBamboo() {
  var xs = [-36, 0, 36], tops = [-52, -74, -44], i;
  for (i = 0; i < 3; i++) {
    rrPath(xs[i] - 11, tops[i], 22, 80 - tops[i], 9);
    ctx.fillStyle = GREEN;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = INK;
    ctx.stroke();
  }
  // segment joints
  for (i = 0; i < 3; i++) {
    seg(xs[i] - 11, tops[i] + 42, xs[i] + 11, tops[i] + 42, 3, INK);
    seg(xs[i] - 11, tops[i] + 88, xs[i] + 11, tops[i] + 88, 3, INK);
    // leaf at the top
    ellO(xs[i] + 14, tops[i] - 4, 13, 5.5, -0.6, GREEN, 2.4);
  }
  face(0, -34, 0.5, drawBamboo.blink);
}
function drawBirdBam() {
  // two bamboo stalks behind
  var xs = [-44, 46], i;
  for (i = 0; i < 2; i++) {
    rrPath(xs[i] - 10, -64, 20, 150, 9);
    ctx.fillStyle = GREEN;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = INK;
    ctx.stroke();
    seg(xs[i] - 10, -22, xs[i] + 10, -22, 3, INK);
    seg(xs[i] - 10, 26, xs[i] + 10, 26, 3, INK);
    ellO(xs[i] - 13, -66, 12, 5, 0.6, GREEN, 2.4);
  }
  // tail feathers
  seg(-16, 26, -28, 44, 5, INK);
  seg(-6, 30, -12, 50, 5, INK);
  // body
  ellO(0, 2, 29, 27, 0, TILE, 3.2);
  // wing
  ctx.beginPath();
  ctx.arc(-4, 8, 13, Math.PI * 0.15, Math.PI * 0.95);
  ctx.lineWidth = 3;
  ctx.strokeStyle = INK;
  ctx.stroke();
  // beak
  ctx.beginPath();
  ctx.moveTo(20, -10);
  ctx.lineTo(40, -2);
  ctx.lineTo(20, 5);
  ctx.closePath();
  ctx.fillStyle = BEAK;
  ctx.fill();
  ctx.lineWidth = 2.6;
  ctx.strokeStyle = INK;
  ctx.stroke();
  face(1, -8, 0.78, drawBirdBam.blink);
}
function drawFlower(petal, centre) {
  var i, a;
  // stem + leaves
  ctx.beginPath();
  ctx.moveTo(0, 6);
  ctx.quadraticCurveTo(-6, 44, 2, 80);
  ctx.lineWidth = 6;
  ctx.strokeStyle = GREEN;
  ctx.lineCap = 'round';
  ctx.stroke();
  ellO(-14, 52, 13, 5.5, 0.5, GREEN, 2.4);
  ellO(15, 64, 13, 5.5, -0.5, GREEN, 2.4);
  // petals
  for (i = 0; i < 6; i++) {
    a = i * Math.PI / 3 + 0.3;
    ellO(Math.cos(a) * 27, -26 + Math.sin(a) * 27, 15, 24, a + Math.PI / 2, petal, 3);
  }
  ellO(0, -26, 21, 21, 0, centre, 3.2);
  face(0, -29, 0.62, drawFlower.blink);
}
function cloudPath(cx, cy, a) {
  // three soft round bumps on a flat base
  ctx.beginPath();
  ctx.moveTo(cx - a, cy + 16);
  ctx.bezierCurveTo(cx - a - 2, cy - 2, cx - a + 8, cy - 16, cx - a + 22, cy - 17);
  ctx.bezierCurveTo(cx - a + 30, cy - 33, cx - 10, cy - 34, cx, cy - 27);
  ctx.bezierCurveTo(cx + 10, cy - 33, cx + a - 20, cy - 28, cx + a - 14, cy - 16);
  ctx.bezierCurveTo(cx + a - 2, cy - 12, cx + a + 2, cy + 2, cx + a, cy + 16);
  ctx.closePath();
}
function drawWinds(letters, drift) {
  ctx.save();
  ctx.translate(drift, 0);
  // big cloud: letter riding the top bumps, face low
  // and fully inside the body
  cloudPath(-14, -34, 58);
  ctx.fillStyle = SKY;
  ctx.fill();
  ctx.lineWidth = 3.2;
  ctx.strokeStyle = INK;
  ctx.stroke();
  drawText(letters[0], -14, -46, 20, TILE, 3.4);
  face(-14, -24, 0.45, drawWinds.blink);
  // small cloud: second letter
  cloudPath(38, 46, 38);
  ctx.fillStyle = SKY;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.stroke();
  drawText(letters[1], 38, 42, 17, TILE, 3);
  ctx.restore();
}
function drawToucan(mirror) {
  ctx.save();
  ctx.scale(mirror, 1);
  // tail feathers
  var ta = [-0.22, 0, 0.22], i;
  for (i = 0; i < 3; i++) {
    ctx.save();
    ctx.translate(-4 + i * 0, 34);
    ctx.rotate(ta[i]);
    rrPath(-5, 0, 10, 36, 5);
    ctx.fillStyle = INK;
    ctx.fill();
    ctx.restore();
  }
  // body
  ellO(0, 2, 31, 40, 0, INK, 3);
  // big beak
  ctx.beginPath();
  ctx.moveTo(12, -28);
  ctx.quadraticCurveTo(54, -26, 54, -4);
  ctx.quadraticCurveTo(34, 4, 13, -3);
  ctx.closePath();
  ctx.fillStyle = BEAK;
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = INK;
  ctx.stroke();
  seg(16, -6, 44, -8, 2.4, INK);
  // white throat carrying the face
  ellO(1, -13, 19, 22, 0, TILE, 3);
  face(1, -16, 0.6, drawToucan.blink);
  ctx.restore();
}

// ---- the twelve tiles --------------------------------------
// 4 columns x 3 rows. Families cycle DOTS, CRAKS, BAMS,
// FLOWERS, WINDS, JOKERS - each family exactly twice, and
// each tile's own family label sits beneath it.
var TW = 184, TH = 200;
var COLX = [286, 522, 758, 994];
var ROWY = [240, 498, 756];
var FAMILIES = ['DOTS', 'CRAKS', 'BAMS', 'FLOWERS', 'WINDS', 'JOKERS'];
var BACKCOL = { DOTS: SUN, CRAKS: RED, BAMS: GREEN, FLOWERS: PINK, WINDS: SKY, JOKERS: INK };
var TILES = [];
(function buildTiles() {
  var kinds = ['sun', 'crak0', 'bam', 'flowerPink', 'windNE', 'toucanR',
               'sun', 'crak1', 'birdBam', 'flowerPurple', 'windWS', 'toucanL'];
  for (var r = 0; r < 3; r++) {
    for (var c = 0; c < 4; c++) {
      var i = r * 4 + c;
      TILES.push({
        i: i, cx: COLX[c], cy: ROWY[r], kind: kinds[i],
        family: FAMILIES[i % 6], tapStart: -10
      });
    }
  }
})();
if (TILES.length !== 12) throw new Error('Mahjong Babies must have exactly 12 tiles');

// FIXED AUTHORED FLIP ROTATION. The 36s loop is twelve 3s
// slots; slot k flips tile FLIP_SEQ[k] and no other. In a
// slot: 0-0.45s scaleX eases 1 -> 0 -> back face (diamond
// lattice), hold the back until 2.15s, ease back to the
// face by 2.6s, rest. Frame one (T = 2.8s) sits in slot
// 0's rest window, so every face is up.
var FLIP_SEQ = [4, 9, 1, 7, 11, 0, 6, 3, 10, 2, 8, 5];
if (FLIP_SEQ.length !== 12) throw new Error('flip rotation must name 12 tiles');
function flipTheta(lt) {
  var slot = Math.floor(lt / 3) % 12;
  var local = lt - Math.floor(lt / 3) * 3;
  var th = 0;
  if (local < 0.45) { var p = local / 0.45; th = Math.PI * (p * p * (3 - 2 * p)); }
  else if (local < 2.15) th = Math.PI;
  else if (local < 2.6) { var q = (local - 2.15) / 0.45; th = Math.PI * (1 - (q * q * (3 - 2 * q))); }
  return { tile: FLIP_SEQ[slot], theta: th };
}

// ---- tap state ---------------------------------------------
// A tap starts the tile's authored 0.55s bounce: squash
// and stretch on a decaying spring curve, one blink in
// the first half, and exactly 3 sparkles at authored
// offsets that grow and fade over 0.5s.
var SPARK_OFF = [[-72, -84], [68, -90], [2, -116]];
if (SPARK_OFF.length !== 3) throw new Error('a tap emits exactly 3 sparkles');
function bounceScale(age) {
  if (age < 0 || age > 0.55) return null;
  var p = age / 0.55;
  var sy = 1 + 0.24 * Math.sin(p * Math.PI * 2.2) * (1 - p);
  var sx = 1 - 0.55 * (sy - 1);
  var hop = -9 * Math.sin(p * Math.PI);
  var blink = 1;
  if (age > 0.08 && age < 0.34) blink = 1 - 0.88 * Math.sin((age - 0.08) / 0.26 * Math.PI);
  return { sx: sx, sy: sy, hop: hop, blink: blink };
}

// ---- scene --------------------------------------------------
function drawTileBack(color) {
  rrPath(-TW / 2, -TH / 2, TW, TH, 18);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = INK;
  ctx.stroke();
  // diamond lattice, drawn as path data and clipped
  ctx.save();
  rrPath(-TW / 2, -TH / 2, TW, TH, 18);
  ctx.clip();
  ctx.strokeStyle = TILE;
  ctx.lineWidth = 2.6;
  var d;
  for (d = -TH; d < TW + TH; d += 34) {
    seg(-TW / 2 + d, -TH / 2, -TW / 2 + d + TH, TH / 2, 2.6, TILE);
    seg(-TW / 2 + d, TH / 2, -TW / 2 + d + TH, -TH / 2, 2.6, TILE);
  }
  ctx.restore();
  // centre diamond
  ctx.beginPath();
  ctx.moveTo(0, -26); ctx.lineTo(20, 0); ctx.lineTo(0, 26); ctx.lineTo(-20, 0);
  ctx.closePath();
  ctx.fillStyle = TILE;
  ctx.fill();
  ctx.lineWidth = 2.6;
  ctx.strokeStyle = INK;
  ctx.stroke();
}
function drawCharacter(tile, blink, drift) {
  drawSun.blink = blink; drawDragon.blink = blink; drawBamboo.blink = blink;
  drawBirdBam.blink = blink; drawFlower.blink = blink; drawWinds.blink = blink;
  drawToucan.blink = blink;
  switch (tile.kind) {
    case 'sun': drawSun(); break;
    case 'crak0': drawCrak(0); break;
    case 'crak1': drawCrak(1); break;
    case 'bam': drawBamboo(); break;
    case 'birdBam': drawBirdBam(); break;
    case 'flowerPink': drawFlower(PINK, SUN); break;
    case 'flowerPurple': drawFlower(PURPLE, ORANGE); break;
    case 'windNE': drawWinds(['N', 'E'], drift); break;
    case 'windWS': drawWinds(['W', 'S'], drift); break;
    case 'toucanR': drawToucan(1); break;
    case 'toucanL': drawToucan(-1); break;
  }
}
function drawScene(lt, now) {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-OX / S - 2, -OY / S - 2, W / S + 4, H / S + 4);

  // Banner: chunky hand-lettered caps, complete from
  // frame one, with a red flourish underline.
  drawText("IT'S TIME TO PLAY!", 640, 60, 44, INK, 6);
  var bw = textUnits("IT'S TIME TO PLAY!") * (44 / 6);
  seg(640 - bw / 2 + 6, 92, 640 + bw / 2 - 6, 92, 4.5, RED);

  var flip = flipTheta(lt);
  // Wind clouds drift 4px on one whole cycle of the loop.
  var drift = 4 * Math.sin(Math.PI * 2 * lt / LOOP);

  for (var i = 0; i < TILES.length; i++) {
    var t = TILES[i];
    // flat offset shadow shape (never shadowBlur)
    ctx.save();
    ctx.translate(t.cx + 9, t.cy + 11);
    rrPath(-TW / 2, -TH / 2, TW, TH, 18);
    ctx.fillStyle = 'rgba(26,26,26,0.10)';
    ctx.fill();
    ctx.restore();

    var age = now - t.tapStart;
    var b = bounceScale(age);
    var bsx = b ? b.sx : 1, bsy = b ? b.sy : 1, hop = b ? b.hop : 0;
    var blink = b ? b.blink : 1;

    ctx.save();
    ctx.translate(t.cx, t.cy + hop);
    var theta = (flip.tile === t.i) ? flip.theta : 0;
    if (theta > 0) {
      var cs = Math.cos(theta);
      if (theta <= Math.PI / 2) {
        ctx.scale(Math.max(0.001, cs) * bsx, bsy);
        rrPath(-TW / 2, -TH / 2, TW, TH, 18);
        ctx.fillStyle = TILE; ctx.fill();
        ctx.lineWidth = 3.5; ctx.strokeStyle = INK; ctx.stroke();
        ctx.save();
        rrPath(-TW / 2, -TH / 2, TW, TH, 18);
        ctx.clip();
        drawCharacter(t, blink, drift);
        ctx.restore();
      } else {
        ctx.scale(Math.max(0.001, -cs) * bsx, bsy);
        drawTileBack(BACKCOL[t.family]);
      }
    } else {
      ctx.scale(bsx, bsy);
      rrPath(-TW / 2, -TH / 2, TW, TH, 18);
      ctx.fillStyle = TILE; ctx.fill();
      ctx.lineWidth = 3.5; ctx.strokeStyle = INK; ctx.stroke();
      ctx.save();
      rrPath(-TW / 2, -TH / 2, TW, TH, 18);
      ctx.clip();
      drawCharacter(t, blink, drift);
      ctx.restore();
    }
    ctx.restore();

    // the tile's family label beneath it
    drawText(t.family, t.cx, t.cy + TH / 2 + 24, 17, INK, 2.6);

    // tap sparkles: exactly 3, authored offsets, 0.5s life
    if (age >= 0 && age < 0.5) {
      var sp = Math.sin(Math.PI * age / 0.5);
      ctx.save();
      ctx.globalAlpha = sp;
      for (var k = 0; k < SPARK_OFF.length; k++) {
        star(t.cx + SPARK_OFF[k][0], t.cy + hop + SPARK_OFF[k][1], 7 + 9 * sp, SUN);
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }
}

// ---- clock: constant phase, fixed ticks ---------------------
var T = 2.8;
var lastNow = -1, acc = 0;
function step() {}
function draw() { drawScene(T % LOOP, T); }

// ---- pointer: tap a tile -------------------------------------
var downX = -1, downY = -1, downT = 0;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y; downT = T;
});
function endPointer(e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  var moved = Math.sqrt(dx * dx + dy * dy);
  var held = T - downT;
  downX = -1;
  if (moved >= 28 || held >= 0.6) return;
  for (var i = 0; i < TILES.length; i++) {
    var t = TILES[i];
    if (Math.abs(p.x - t.cx) <= TW / 2 && Math.abs(p.y - t.cy) <= TH / 2) {
      t.tapStart = T;
      return;
    }
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { downX = -1; });

// ---- sizing: full-bleed field, cover fit ----------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
