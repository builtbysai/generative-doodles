<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>They Have No Sense of Time</title>
<style>
  html, body { margin: 0; padding: 0; background: #07080C; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------
  // No.986 "They Have No Sense of Time"
  // Three industrial robot arms take a dance class. Each arm replays
  // its dancer-dot's phrase with a fixed lag, moving its joints at
  // constant capped angular velocity (no easing, ever). A beat grid
  // ticks along the bottom; when a claw is on target at the beat, a
  // mint tick locks into that robot's ledger. Every miss leaves an
  // empty slot. When two neighbours lock on the same beat, a cube is
  // handed through the air between them.
  // ---------------------------------------------------------------

  var TAU = Math.PI * 2;
  var DT = 1 / 120;                 // fixed sim step
  var PREROLL = 3600;               // 30 s of class before frame one
  var VW = 720, VH = 720;           // virtual stage

  var COL = {
    floor:  '#07080C',
    arm:    '#E8632A',
    joint:  '#3A3D46',
    dancer: '#F5F2EA',
    grid:   '#3A3D46',
    mint:   '#7DF9C6',
    cube:   '#FFC44F'
  };

  // Arm geometry (virtual units)
  var SH_Y = 445;                   // shoulder height
  var L1 = 135, L2 = 125, L3 = 44;  // upper, forearm, claw
  var CLAW_ANG = 1.15;              // claw points mostly downward
  var CAP1 = 2.0, CAP2 = 2.6, CAP3 = 3.2;  // joint speed caps, rad/s
  var TOL = 30;                     // lock tolerance at the beat
  var LAGS = [0.30, 0.45, 0.60];    // per-robot replay lag, seconds
  var BPM = 100;
  var PENTA = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];

  // ---------------- seeded RNG ----------------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function wrapAngle(a) {
    a = a % TAU;
    if (a > Math.PI) a -= TAU;
    if (a < -Math.PI) a += TAU;
    return a;
  }
  // Constant velocity toward target: the whole point of the piece.
  function moveAngle(cur, target, maxStep) {
    var d = wrapAngle(target - cur);
    if (d > maxStep) d = maxStep;
    else if (d < -maxStep) d = -maxStep;
    return cur + d;
  }

  // ---------------- dancer phrase (closed form) ----------------
  function dancerPose(d, t) {
    var dx = 0.72 * Math.sin(TAU * t / d.slideT + d.slideP)
           + 0.28 * Math.sin(TAU * t / (d.slideT * 0.47) + d.slideP2);
    dx = clamp(dx, -1, 1);
    var s = Math.sin(TAU * t / d.hopT + d.hopP);
    var hop = s > 0 ? s * s : 0;
    return { dx: dx, hop: hop };
  }

  function layoutX(i, n) { return VW * (i + 0.5) / n; }

  // Claw target: the dancer's phrase, lagged, mapped into the workspace.
  function clawTarget(r, i, n, t) {
    var p = dancerPose(r.dancer, t - r.lag);
    return { x: layoutX(i, n) + p.dx * 115, y: 320 - p.hop * 85 };
  }

  // ---------------- inverse kinematics (2-bone, elbow up) ----------------
  function solveIK(sx, sy, tx, ty) {
    var dx = tx - sx, dy = ty - sy;
    var d = Math.sqrt(dx * dx + dy * dy);
    var maxD = L1 + L2 - 0.5, minD = Math.abs(L1 - L2) + 0.5;
    if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
    else if (d < minD && d > 0.0001) { dx *= minD / d; dy *= minD / d; d = minD; }
    var base = Math.atan2(dy, dx);
    var cosOff = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
    var off = Math.acos(clamp(cosOff, -1, 1));
    var best = null;
    for (var s = -1; s <= 1; s += 2) {
      var a1 = base + s * off;
      var ex = sx + L1 * Math.cos(a1), ey = sy + L1 * Math.sin(a1);
      var a12 = Math.atan2(sy + dy - ey, sx + dx - ex);
      if (!best || ey < best.ey) best = { a1: a1, a2: a12 - a1, ey: ey };
    }
    return best;
  }

  function fk(r, cx) {
    var sx = cx, sy = SH_Y;
    var ex = sx + L1 * Math.cos(r.a1), ey = sy + L1 * Math.sin(r.a1);
    var a12 = r.a1 + r.a2;
    var wx = ex + L2 * Math.cos(a12), wy = ey + L2 * Math.sin(a12);
    var a123 = a12 + r.a3;
    return {
      sx: sx, sy: sy, ex: ex, ey: ey, wx: wx, wy: wy,
      tx: wx + L3 * Math.cos(a123), ty: wy + L3 * Math.sin(a123), a123: a123
    };
  }

  // ---------------- state ----------------
  function makeRobot(rng, i) {
    var d = {
      slideAmp: 52 + rng() * 30,
      slideT: 1.7 + rng() * 1.7,
      slideP: rng() * TAU,
      slideP2: rng() * TAU,
      hopT: 0.85 + rng() * 0.7,
      hopP: rng() * TAU,
      spinP: rng() * TAU,
      note: i % PENTA.length
    };
    var slots = [];
    for (var k = 0; k < 32; k++) slots.push(0);
    return {
      dancer: d,
      lag: LAGS[i % 3] + 0.05 * Math.floor(i / 3),
      a1: -1.9 + rng() * 0.3, a2: 1.3, a3: 0.4,
      hasCube: true, pile: 0, reloadStep: -1,
      slots: slots,
      hopPhase: d.hopP, hopCyc: Math.floor((d.hopP - Math.PI / 2) / TAU)
    };
  }

  function buildState(seed, nRob) {
    var rng = mulberry32(seed >>> 0);
    var robots = [];
    for (var i = 0; i < nRob; i++) robots.push(makeRobot(rng, i));
    return {
      seed: seed, rng: rng, robots: robots, flights: [],
      t: 0, step: 0, beatPhase: 0, beatEvents: 0,
      conductUntil: -1, conductFactor: 1,
      soundEvents: [], pendingTapStep: -1, lastTapStep: -100000
    };
  }

  var state = buildState(986147, 3);

  function flightFrom(i) {
    for (var k = 0; k < state.flights.length; k++) {
      if (state.flights[k].from === i) return true;
    }
    return false;
  }

  function tempoFactor(t) {
    return (t < state.conductUntil) ? state.conductFactor : 1;
  }

  // ---------------- beat: lock or gap ----------------
  function onBeat() {
    var n = state.robots.length;
    var idx = state.beatEvents % 32;
    var locks = [];
    var i, r, f, tgt, err, lock;
    if (idx === 0) {
      for (i = 0; i < n; i++) {
        for (var k = 0; k < 32; k++) state.robots[i].slots[k] = 0;
      }
    }
    state.soundEvents.push({ type: 'tick' });
    for (i = 0; i < n; i++) {
      r = state.robots[i];
      f = fk(r, layoutX(i, n));
      tgt = clawTarget(r, i, n, state.t);
      err = Math.sqrt((f.tx - tgt.x) * (f.tx - tgt.x) + (f.ty - tgt.y) * (f.ty - tgt.y));
      lock = err <= TOL;
      r.slots[idx] = lock ? 1 : 2;   // 1 = locked tick, 2 = miss (stays empty)
      locks.push(lock);
      if (lock) state.soundEvents.push({ type: 'robotnote', note: r.dancer.note, lag: r.lag });
    }
    // Handoffs: two neighbours locked together, left passes its cube.
    for (i = 0; i < n - 1; i++) {
      if (locks[i] && locks[i + 1] && state.robots[i].hasCube && !flightFrom(i)) {
        state.robots[i].hasCube = false;
        state.flights.push({ from: i, to: i + 1, start: state.step });
        state.soundEvents.push({ type: 'clunk' });
      }
    }
    state.beatEvents++;
  }

  // ---------------- sim step ----------------
  function stepSim() {
    state.t += DT;
    state.step++;
    var n = state.robots.length;
    var i, r;

    // Pending single tap becomes a new robot once a double tap is ruled out.
    if (state.pendingTapStep >= 0 && state.step - state.pendingTapStep >= 42) {
      state.pendingTapStep = -1;
      if (state.robots.length < 6) {
        state.robots.push(makeRobot(state.rng, state.robots.length));
        n = state.robots.length;
      }
    }

    // Beat clock.
    var prevBeat = Math.floor(state.beatPhase);
    state.beatPhase += DT * (BPM / 60) * tempoFactor(state.t);

    // Robots chase their lagged targets at constant joint velocity.
    for (i = 0; i < n; i++) {
      r = state.robots[i];
      var cx = layoutX(i, n);
      var tgt = clawTarget(r, i, n, state.t);
      var wtx = tgt.x - L3 * Math.cos(CLAW_ANG);
      var wty = tgt.y - L3 * Math.sin(CLAW_ANG);
      var sol = solveIK(cx, SH_Y, wtx, wty);
      r.a1 = moveAngle(r.a1, sol.a1, CAP1 * DT);
      r.a2 = moveAngle(r.a2, sol.a2, CAP2 * DT);
      var a3t = CLAW_ANG - (r.a1 + r.a2);
      r.a3 = moveAngle(r.a3, a3t, CAP3 * DT);

      // Dancer hop apex: the dancer's own melodic note.
      r.hopPhase += TAU * DT / r.dancer.hopT;
      var cyc = Math.floor((r.hopPhase - Math.PI / 2) / TAU);
      if (cyc > r.hopCyc) {
        r.hopCyc = cyc;
        state.soundEvents.push({ type: 'note', note: r.dancer.note });
      }
    }

    // Cube flights land.
    for (var fi = state.flights.length - 1; fi >= 0; fi--) {
      var fl = state.flights[fi];
      if (state.step - fl.start >= 96) {
        state.robots[fl.to].pile++;
        state.robots[fl.from].reloadStep = state.step + 240;
        state.flights.splice(fi, 1);
        state.soundEvents.push({ type: 'clunk' });
      }
    }
    // Fresh cubes arrive at empty claws.
    for (i = 0; i < n; i++) {
      r = state.robots[i];
      if (!r.hasCube && r.reloadStep > 0 && state.step >= r.reloadStep && !flightFrom(i)) {
        r.hasCube = true;
        r.reloadStep = -1;
      }
    }

    if (Math.floor(state.beatPhase) > prevBeat) onBeat();
  }

  // ---------------- canvas / view ----------------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var view = { w: 720, h: 720, dpr: 1, scale: 1, ox: 0, oy: 0, phone: false };

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = (vv && vv.width) ? vv.width : window.innerWidth;
    var h = (vv && vv.height) ? vv.height : window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    if (dpr > 2) dpr = 2;
    view.w = w; view.h = h; view.dpr = dpr;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    view.scale = Math.min(w / VW, h / VH);
    view.ox = (w - VW * view.scale) / 2;
    view.oy = (h - VH * view.scale) / 2;
    var scr = window.screen || null;
    if (scr && scr.width && scr.height) {
      view.phone = Math.min(scr.width, scr.height) < 700;
    } else {
      view.phone = h > w * 1.15;
    }
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  // ---------------- drawing helpers ----------------
  function seg(x1, y1, x2, y2, wdt, color) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineWidth = wdt;
    ctx.strokeStyle = color;
    ctx.stroke();
  }
  function disc(x, y, r, color) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fillStyle = color;
    ctx.fill();
  }
  function ring(x, y, r, color, wdt) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.lineWidth = wdt;
    ctx.strokeStyle = color;
    ctx.stroke();
  }
  function box(x, y, s, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x - s / 2, y - s / 2, s, s);
  }

  function drawLedger(r, cx) {
    var n = state.robots.length;
    var zone = VW / n;
    var pitch = Math.min(12.4, (zone - 10) / 16);
    var sw = pitch * 0.62, sh = 11;
    var x0 = cx - pitch * 8;
    var rowsY = [40, 58];
    for (var k = 0; k < 32; k++) {
      var row = (k >> 4), col = k & 15;
      var x = x0 + col * pitch, y = rowsY[row];
      var v = r.slots[k];
      ctx.globalAlpha = (v === 0) ? 0.35 : 0.9;
      ctx.strokeStyle = COL.grid;
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, sw, sh);
      if (v === 1) {
        // A locked tick. A miss (v === 2) leaves the slot empty.
        seg(x + sw / 2, y + 2.5, x + sw / 2, y + sh - 2.5, 2.4, COL.mint);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawBeatGrid() {
    var cells = 16, gx0 = 16, gw = (VW - 32) / cells, gy = 648, gh = 36;
    var current = state.beatEvents % cells;
    var pulse = 1 - (state.beatPhase - Math.floor(state.beatPhase));
    for (var k = 0; k < cells; k++) {
      var x = gx0 + k * gw;
      ctx.globalAlpha = 0.8;
      ctx.strokeStyle = COL.grid;
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 1.5, gy, gw - 3, gh);
      ctx.globalAlpha = 1;
      if (k === current) {
        ctx.globalAlpha = 0.16 + 0.5 * pulse;
        ctx.fillStyle = COL.mint;
        ctx.fillRect(x + 3, gy + 3, gw - 6, gh - 6);
        ctx.globalAlpha = 0.9;
        seg(x + gw / 2, gy + 8, x + gw / 2, gy + gh - 8, 2.4, COL.mint);
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawRobot(r, i) {
    var n = state.robots.length;
    var cx = layoutX(i, n);
    var f = fk(r, cx);

    drawLedger(r, cx);

    // Pedestal and post (the robot stands on stage, not in a factory).
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = COL.joint;
    ctx.fillRect(cx - 30, 468, 60, 124);
    ctx.globalAlpha = 1;
    ctx.fillStyle = COL.joint;
    ctx.fillRect(cx - 40, 592, 80, 8);
    seg(cx, 470, cx, SH_Y + 4, 12, COL.joint);
    seg(cx - 30, 468, cx + 30, 468, 3, COL.arm);

    // Arm: three flat orange segments.
    seg(f.sx, f.sy, f.ex, f.ey, 17, COL.arm);
    seg(f.ex, f.ey, f.wx, f.wy, 14, COL.arm);
    seg(f.wx, f.wy, f.tx, f.ty, 9, COL.arm);
    // Claw prongs.
    var pa = f.a123;
    seg(f.tx, f.ty, f.tx + 13 * Math.cos(pa - 0.55), f.ty + 13 * Math.sin(pa - 0.55), 4, COL.arm);
    seg(f.tx, f.ty, f.tx + 13 * Math.cos(pa + 0.55), f.ty + 13 * Math.sin(pa + 0.55), 4, COL.arm);
    // Joints.
    disc(f.sx, f.sy, 11, COL.joint); ring(f.sx, f.sy, 11, COL.arm, 2);
    disc(f.ex, f.ey, 9, COL.joint);  ring(f.ex, f.ey, 9, COL.arm, 2);
    disc(f.wx, f.wy, 7, COL.joint);

    // Carried cube rides just past the claw.
    if (r.hasCube) {
      box(f.tx + 9 * Math.cos(pa), f.ty + 9 * Math.sin(pa), 12, COL.cube);
    }
    // Received cubes pile beside the base.
    var pileN = Math.min(r.pile, 14);
    for (var k = 0; k < pileN; k++) {
      var px = cx + 36 + (k % 2) * 8;
      var py = 592 - Math.floor(k / 2) * 8 - 4;
      ctx.fillStyle = COL.cube;
      ctx.fillRect(px, py - 3.5, 7, 7);
    }
  }

  function drawDancer(r, i) {
    var n = state.robots.length;
    var cx = layoutX(i, n);
    var p = dancerPose(r.dancer, state.t);
    var x = cx + p.dx * r.dancer.slideAmp;
    var y = 586 - p.hop * 40;
    // Floor mark under the dancer.
    ctx.globalAlpha = 0.5;
    seg(x - 8, 600, x + 8, 600, 2, COL.grid);
    ctx.globalAlpha = 1;
    disc(x, y, view.phone ? 5.5 : 4.5, COL.dancer);
    // Spin speck orbiting the dot.
    var ang = TAU * state.t / (r.dancer.hopT * 0.5) + r.dancer.spinP;
    ctx.globalAlpha = 0.55;
    disc(x + Math.cos(ang) * 9, y - 4 + Math.sin(ang) * 4, 1.8, COL.dancer);
    ctx.globalAlpha = 1;
  }

  function drawFlights() {
    var n = state.robots.length;
    for (var k = 0; k < state.flights.length; k++) {
      var fl = state.flights[k];
      var p = clamp((state.step - fl.start) / 96, 0, 1);
      var fa = fk(state.robots[fl.from], layoutX(fl.from, n));
      var fb = fk(state.robots[fl.to], layoutX(fl.to, n));
      var x = fa.tx + (fb.tx - fa.tx) * p;
      var y = fa.ty + (fb.ty - fa.ty) * p - Math.sin(p * Math.PI) * 64;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(p * Math.PI * 0.5);
      box(0, 0, 12, COL.cube);
      ctx.restore();
    }
  }

  function draw() {
    // Pin the canvas CSS size every frame (house rule).
    canvas.style.width = view.w + 'px';
    canvas.style.height = view.h + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = COL.floor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(view.dpr * view.scale, 0, 0, view.dpr * view.scale,
                     view.dpr * view.ox, view.dpr * view.oy);
    ctx.lineCap = 'butt';

    var i;
    for (i = 0; i < state.robots.length; i++) drawRobot(state.robots[i], i);
    drawFlights();
    for (i = 0; i < state.robots.length; i++) drawDancer(state.robots[i], i);

    // Floor line.
    ctx.globalAlpha = 0.7;
    seg(0, 600, VW, 600, 2, COL.grid);
    ctx.globalAlpha = 1;

    drawBeatGrid();
  }

  // ---------------- audio (lazy, guarded, gesture only) ----------------
  var AC = null;
  function ensureAudio() {
    if (AC) { if (AC.resume) AC.resume(); return; }
    var Ctor = (typeof window !== 'undefined')
      ? (window.AudioContext || window.webkitAudioContext) : undefined;
    if (typeof Ctor !== 'function') return;
    try { AC = new Ctor(); } catch (e) { AC = null; }
  }
  function beep(freq, dur, type, gain, delay) {
    if (!AC) return;
    var t0 = AC.currentTime + (delay || 0);
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(AC.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.05);
  }
  function flushSounds() {
    var evs = state.soundEvents;
    state.soundEvents = [];
    if (!AC) return;
    for (var k = 0; k < evs.length; k++) {
      var e = evs[k];
      if (e.type === 'tick') beep(1900, 0.05, 'square', 0.045, 0);
      else if (e.type === 'note') beep(PENTA[e.note], 0.35, 'sine', 0.11, 0);
      else if (e.type === 'robotnote') beep(PENTA[e.note] / 2, 0.3, 'triangle', 0.10, e.lag);
      else if (e.type === 'clunk') { beep(110, 0.12, 'sine', 0.20, 0); beep(74, 0.18, 'sine', 0.18, 0.07); }
    }
  }

  // ---------------- interaction ----------------
  var ptr = { down: false, x: 0, y: 0, step: 0, conducting: false, startX: 0 };

  function toVirtual(e) {
    var rect = (typeof canvas.getBoundingClientRect === 'function')
      ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return {
      x: (e.clientX - rect.left - view.ox) / view.scale,
      y: (e.clientY - rect.top - view.oy) / view.scale
    };
  }

  function onTap() {
    if (state.step - state.lastTapStep < 42) {
      // Double tap: a new class. Reseed, back to three robots, re-run the class so far.
      state.pendingTapStep = -1;
      state.lastTapStep = -100000;
      state = buildState((state.seed + 104729) % 2147483647, 3);
      for (var k = 0; k < PREROLL; k++) stepSim();
      state.soundEvents.length = 0;
    } else {
      state.lastTapStep = state.step;
      state.pendingTapStep = state.step;
    }
  }

  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    var v = toVirtual(e);
    ptr.down = true;
    ptr.x = v.x; ptr.y = v.y; ptr.step = state.step;
    ptr.conducting = v.y > 636;
    ptr.startX = v.x;
    if (ptr.conducting) {
      state.conductFactor = 1;
      state.conductUntil = state.t + 10;
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!ptr.down || !ptr.conducting) return;
    var v = toVirtual(e);
    state.conductFactor = clamp(1 + (v.x - ptr.startX) / 240, 0.55, 1.6);
    state.conductUntil = state.t + 10;
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!ptr.down) return;
    ptr.down = false;
    var v = toVirtual(e);
    if (ptr.conducting) { ptr.conducting = false; return; }
    var moved = Math.sqrt((v.x - ptr.x) * (v.x - ptr.x) + (v.y - ptr.y) * (v.y - ptr.y));
    if (moved < 12 && state.step - ptr.step < 40) onTap();
  });

  // ---------------- run ----------------
  resize();
  for (var k = 0; k < PREROLL; k++) stepSim();
  state.soundEvents.length = 0;
  draw();

  if (typeof requestAnimationFrame === 'function') {
    var lastNow = 0, acc = 0;
    var frame = function (now) {
      if (!lastNow) lastNow = now;
      var elapsed = (now - lastNow) / 1000;
      lastNow = now;
      if (elapsed > 0.25) elapsed = 0.25;
      acc += elapsed;
      var steps = 0;
      while (acc >= DT && steps < 24) { stepSim(); acc -= DT; steps++; }
      if (steps === 24) acc = 0;
      flushSounds();
      draw();
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
