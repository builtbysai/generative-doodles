<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.276 Crackle</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#2E4EA3; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.276 Crackle (Njalikwa Chongwe).
// After her crackle veil: a deep cobalt field grows a black
// craquelure network, cells like dry earth. Each fresh crack
// carries a faint hot edge, as if just out of the kiln, then
// cools to matte black. Idle the cracks grow slowly from a
// few seeds. Dragging is thermal shock: new crack seeds
// spawn along the drag path and branch and propagate. A
// double-tap re-glazes: the network clears and a new seed
// pattern starts. Never a single-click reload.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var COBALT = '#2E4EA3', CRACK = '#101012', HOT = '#FFB347';
var TINTA = '#33549F', TINTB = '#2A4590';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0; // stored cover-fit transform, used by the pointer handlers
var T = 0, lastNow = -1, acc = 0;

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- the cell tint patchwork ------------------------------------------------------------
// A seeded low-frequency patchwork of the two tint blues over
// the cobalt ground: a jittered vertex grid, each cell filled
// flat in tint A, tint B or the cobalt itself, so the ground
// reads as large quiet cells under the crack network. Drawn
// past the design edges so the cover crop is always covered.
var cells = [];
(function () {
  var r = rng(27631);
  // irregular column and row boundaries, so the patchwork
  // never reads as a regular plaid
  var xs = [-70], ys = [-70], i, j;
  while (xs[xs.length - 1] < DW + 40) xs.push(xs[xs.length - 1] + 170 + r() * 150);
  while (ys[ys.length - 1] < DH + 40) ys.push(ys[ys.length - 1] + 150 + r() * 130);
  var COLS = xs.length - 1, ROWS = ys.length - 1;
  var vx = [], vy = [];
  for (j = 0; j <= ROWS; j++) {
    for (i = 0; i <= COLS; i++) {
      var px = xs[i], py = ys[j];
      if (i > 0 && i < COLS) px += (r() - 0.5) * 110;
      if (j > 0 && j < ROWS) py += (r() - 0.5) * 100;
      vx.push(px); vy.push(py);
    }
  }
  var cols = [TINTA, TINTB, COBALT, TINTA, TINTB, TINTB, TINTA];
  for (j = 0; j < ROWS; j++) {
    for (i = 0; i < COLS; i++) {
      var a = j * (COLS + 1) + i, b = a + 1, c = a + COLS + 1, d = c + 1;
      cells.push({
        pts: [[vx[a], vy[a]], [vx[b], vy[b]], [vx[d], vy[d]], [vx[c], vy[c]]],
        col: cols[Math.floor(r() * cols.length)]
      });
    }
  }
})();

// ---- the crack network --------------------------------------------------------------------
// All state is segment data, drawn directly each frame; no
// offscreen canvas. Crack agents advance in small steps,
// jitter as they go, split at about 120 degrees with a fixed
// probability, and stop at the frame edge or when they meet
// an existing crack (point distance against stored segments,
// bucketed on a coarse grid). Live agents are capped at 400.
// A segment is drawn in the hot edge colour for its first
// about 2 seconds, then in crack black.
var STEP = 5, TICK = 0.04, HOTAGE = 2, MAXSEG = 26000;
var segs = [];        // {x1,y1,x2,y2,born,aid,seq}
var agents = [];      // live agents {id,x,y,ang,steps,seq}
var grid = {};        // coarse buckets of segment indices
var GCELL = 24;
var simR = rng(276001);
var nextAid = 1, spawnTimer = 0, pattern = 0;

function gkey(gx, gy) { return (gx + 64) * 4096 + (gy + 64); }
function bucketAdd(idx, x, y) {
  var k = gkey(Math.floor(x / GCELL), Math.floor(y / GCELL));
  if (!grid[k]) grid[k] = [];
  grid[k].push(idx);
}
function distSeg(px, py, sg) {
  var dx = sg.x2 - sg.x1, dy = sg.y2 - sg.y1;
  var len2 = dx * dx + dy * dy;
  var t = len2 > 0 ? ((px - sg.x1) * dx + (py - sg.y1) * dy) / len2 : 0;
  if (t < 0) t = 0; else if (t > 1) t = 1;
  var ex = sg.x1 + dx * t - px, ey = sg.y1 + dy * t - py;
  return Math.sqrt(ex * ex + ey * ey);
}
function hitsExisting(x, y, ag) {
  var gx = Math.floor(x / GCELL), gy = Math.floor(y / GCELL);
  for (var j = gy - 1; j <= gy + 1; j++) {
    for (var i = gx - 1; i <= gx + 1; i++) {
      var arr = grid[gkey(i, j)];
      if (!arr) continue;
      for (var n = 0; n < arr.length; n++) {
        var sg = segs[arr[n]];
        // never killed by its own fresh trail
        if (sg.aid === ag.id && sg.seq > ag.seq - 10) continue;
        // never killed by a segment that already touches the
        // point it stands on: at a branch junction the parent
        // trail and the child's first segment both pass through
        // that point, and they are connections, not obstacles
        if (distSeg(ag.x, ag.y, sg) < 5.5) continue;
        if (distSeg(x, y, sg) < 5.2) return true;
      }
    }
  }
  return false;
}
function spawnAgent(x, y, ang) {
  if (agents.length >= 400) return null;
  var ag = { id: nextAid++, x: x, y: y, ang: ang, steps: 0, seq: 0 };
  agents.push(ag);
  return ag;
}
function freeSpot() {
  // a point well clear of the existing network, for idle seeds
  for (var n = 0; n < 14; n++) {
    var x = 40 + simR() * (DW - 80), y = 40 + simR() * (DH - 80);
    var clear = true;
    var gx = Math.floor(x / GCELL), gy = Math.floor(y / GCELL);
    for (var j = gy - 2; j <= gy + 2 && clear; j++) {
      for (var i = gx - 2; i <= gx + 2 && clear; i++) {
        var arr = grid[gkey(i, j)];
        if (!arr) continue;
        for (var m = 0; m < arr.length; m++) {
          if (distSeg(x, y, segs[arr[m]]) < 26) { clear = false; break; }
        }
      }
    }
    if (clear) return [x, y];
  }
  return null;
}
function stepSim() {
  T += TICK;
  // idle seeding: cracks keep growing slowly from a few seeds
  spawnTimer -= TICK;
  if (spawnTimer <= 0) {
    spawnTimer = 1.0;
    if (agents.length < 12 && segs.length < MAXSEG) {
      var spot = freeSpot();
      if (spot) spawnAgent(spot[0], spot[1], simR() * Math.PI * 2);
    }
  }
  var count = agents.length;
  for (var n = agents.length - 1; n >= 0; n--) {
    var ag = agents[n];
    if (n >= count) continue; // born this tick, moves next tick
    ag.ang += (simR() - 0.5) * 0.13;
    if (simR() < 0.045) ag.ang += (simR() < 0.5 ? -1 : 1) * (0.45 + simR() * 0.5); // an angular kink
    var nx = ag.x + Math.cos(ag.ang) * STEP;
    var ny = ag.y + Math.sin(ag.ang) * STEP;
    var dead = false;
    if (nx < -30 || nx > DW + 30 || ny < -30 || ny > DH + 30) dead = true;
    // a short grace while a fresh agent escapes its birth point
    if (!dead && ag.steps > 3 && hitsExisting(nx, ny, ag)) dead = true;
    if (!dead && segs.length < MAXSEG) {
      var idx = segs.length;
      segs.push({ x1: ag.x, y1: ag.y, x2: nx, y2: ny, born: T, aid: ag.id, seq: ag.seq });
      bucketAdd(idx, ag.x, ag.y);
      bucketAdd(idx, nx, ny);
      ag.seq++;
    }
    ag.x = nx; ag.y = ny; ag.steps++;
    // split at about 120 degrees with a fixed probability
    if (!dead && ag.steps > 8 && simR() < 0.03 && agents.length < 400) {
      var bang = ag.ang + (simR() < 0.5 ? -1 : 1) * (Math.PI * 2 / 3 + (simR() - 0.5) * 0.35);
      spawnAgent(ag.x, ag.y, bang); // the child gets the same birth grace as any seed
    }
    if (!dead && (ag.steps > 420 || simR() < 0.001)) dead = true;
    if (dead) agents.splice(n, 1);
  }
}
function resetPattern(preAdvance) {
  segs = []; agents = []; grid = {}; nextAid = 1; spawnTimer = 0;
  simR = rng(276001 + pattern * 7919);
  pattern++;
  T = 0; acc = 0;
  // one seed per cell of a jittered 3 by 3 grid, so the young
  // network is spread across the whole field from the start,
  // plus a few free seeds
  for (var gy = 0; gy < 3; gy++) {
    for (var gx = 0; gx < 3; gx++) {
      spawnAgent((gx + 0.5) * DW / 3 + (simR() - 0.5) * 150,
                 (gy + 0.5) * DH / 3 + (simR() - 0.5) * 110,
                 simR() * Math.PI * 2);
    }
  }
  for (var i = 0; i < 3; i++) {
    spawnAgent(70 + simR() * (DW - 140), 70 + simR() * (DH - 140), simR() * Math.PI * 2);
  }
  // pre-advance the growth so frame one is already developed
  var target = preAdvance;
  while (T < target) stepSim();
}

// ---- drawing ---------------------------------------------------------------------------------
function draw() {
  // the cobalt ground and its flat tint patchwork
  ctx.fillStyle = COBALT;
  ctx.fillRect(-80, -80, DW + 160, DH + 160);
  for (var c = 0; c < cells.length; c++) {
    var cell = cells[c];
    if (cell.col === COBALT) continue;
    ctx.fillStyle = cell.col;
    ctx.beginPath();
    ctx.moveTo(cell.pts[0][0], cell.pts[0][1]);
    for (var p = 1; p < 4; p++) ctx.lineTo(cell.pts[p][0], cell.pts[p][1]);
    ctx.closePath();
    ctx.fill();
  }
  // the cooled network, one batched path in crack black
  ctx.strokeStyle = CRACK;
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  var hot = [];
  for (var i = 0; i < segs.length; i++) {
    var sg = segs[i];
    if (T - sg.born < HOTAGE) { hot.push(sg); continue; }
    ctx.moveTo(sg.x1, sg.y1);
    ctx.lineTo(sg.x2, sg.y2);
  }
  ctx.stroke();
  // fresh cracks still carrying their hot edge
  if (hot.length) {
    ctx.strokeStyle = HOT;
    ctx.lineWidth = 2.9;
    ctx.beginPath();
    for (var h = 0; h < hot.length; h++) {
      ctx.moveTo(hot[h].x1, hot[h].y1);
      ctx.lineTo(hot[h].x2, hot[h].y2);
    }
    ctx.stroke();
  }
  // the glowing tips of the cracks still growing
  ctx.fillStyle = rgba(HOT, 0.85);
  for (var a = 0; a < agents.length; a++) {
    ctx.beginPath();
    ctx.arc(agents[a].x, agents[a].y, 2.3, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---- resize ------------------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- interaction: drag-disturb + double-tap reseed ----------------------------------------------
// Dragging is thermal shock: crack seeds spawn along the drag
// path. A double-tap re-glazes. A single tap does nothing.
var dragging = false, lastDragX = 0, lastDragY = 0;
var lastTapT = -10000, lastTapX = 0, lastTapY = 0;
function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  var dx = p[0] - lastTapX, dy = p[1] - lastTapY;
  if (now - lastTapT < 380 && dx * dx + dy * dy < 3600) {
    // double-tap: re-glaze with a new seed pattern
    resetPattern(0);
    lastTapT = -10000;
    dragging = false;
    return;
  }
  lastTapT = now; lastTapX = p[0]; lastTapY = p[1];
  dragging = true;
  lastDragX = p[0]; lastDragY = p[1];
  spawnAgent(p[0], p[1], simR() * Math.PI * 2);
  if (canvas.setPointerCapture && e.pointerId !== undefined) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  var dx = p[0] - lastDragX, dy = p[1] - lastDragY;
  var d = Math.sqrt(dx * dx + dy * dy);
  if (d >= 18) {
    var base = Math.atan2(dy, dx);
    spawnAgent(p[0], p[1], base + (simR() - 0.5) * 2.2);
    spawnAgent(p[0], p[1], base + Math.PI + (simR() - 0.5) * 2.2);
    lastDragX = p[0]; lastDragY = p[1];
  }
});
function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---- frame ----------------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = COBALT;
  ctx.fillRect(0, 0, W, H);
  // cover-fit: the cobalt field fills the frame edge to edge
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { stepSim(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resetPattern(12); // frame one: growth pre-advanced about 12s
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
