<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Stock-Photo Choir</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e8e2; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  // The Stock-Photo Choir (clement-cogitore CC4).
  // A field of generic advertising glyphs in neat rows. One thin gold
  // voice-line sweeps left to right; glyphs within its radius of influence
  // re-stage into a single abstract standing figure (blank head, no facial
  // features) and relax back to generic behind it. The line is drawn
  // vertical and sweeps horizontally: the prompt's Technical section defines
  // it as a sweeping x position with a radius of influence, and that is the
  // reading under which one face-shape appears in many rows at once.
  // Fully silent. No visible text except <title>.
  var FIELD = '#e8e8e2';
  var CORAL = '#e0785a';
  var SKY = '#7aa8c4';
  var LEAF = '#8aa86a';
  var GOLD = '#d9a441';
  var INK = '#1a1a1a';
  var SWEEP = 48;      // seconds per left-to-right sweep
  var BLEND = 2;       // seconds for spring-back to the sweep after release
  var SEED = 1515000;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function a4(x) {
    var r = Math.round(x * 10000) / 10000;
    if (r < 0) return 0;
    if (r > 1) return 1;
    return r;
  }
  function clamp(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }
  function smoothstep(x) {
    x = clamp(x, 0, 1);
    return x * x * (3 - 2 * x);
  }
  function rgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  var canvas = null;
  try { canvas = document.getElementById('c'); } catch (e) { canvas = null; }
  var ctx = null;
  try { if (canvas) ctx = canvas.getContext('2d'); } catch (e) { ctx = null; }

  var W = 720, H = 720;
  var R = 94;            // influence radius, recomputed per layout
  var glyphs = [];       // {x, y, row, type, color}
  var cell = 108;

  function viewport() {
    var w = 720, h = 720;
    try {
      if (typeof window !== 'undefined' && window) {
        if (window.visualViewport && window.visualViewport.width) {
          w = window.visualViewport.width; h = window.visualViewport.height;
        } else if (window.innerWidth) {
          w = window.innerWidth; h = window.innerHeight;
        }
      }
    } catch (e) { /* keep fallback */ }
    return { w: w, h: h };
  }

  function layout() {
    var v = viewport();
    W = v.w; H = v.h;
    var U = Math.min(W, H);
    R = Math.round(U * 0.13);
    cell = Math.max(84, Math.round(U * 0.15));
    var cols = Math.max(4, Math.floor(W / cell));
    var rows = Math.max(4, Math.floor(H / cell));
    var cw = W / cols, ch = H / rows;
    var rnd = mulberry32(SEED);
    glyphs = [];
    var COLORS = [CORAL, SKY, LEAF];
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var jx = (rnd() - 0.5) * cw * 0.24;
        var jy = (rnd() - 0.5) * ch * 0.24;
        glyphs.push({
          x: (c + 0.5) * cw + jx,
          y: (r + 0.5) * ch + jy,
          row: r,
          type: Math.floor(rnd() * 4),
          color: COLORS[Math.floor(rnd() * 3)]
        });
      }
    }
    if (canvas) {
      canvas.width = W; canvas.height = H;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    }
  }

  // ---- drag state (closed-form over recorded events, never integrated) ----
  // drags: {down, grabDX, moves:[{t,x}], up, relPhiU}
  var drags = [];
  var active = null;

  function schedPhi(t) {
    var p = (t / SWEEP) % 1;
    return p < 0 ? p + 1 : p;
  }
  function posFromPhi(phi) { return -R + phi * (W + 2 * R); }

  function phiAt(t) {
    // Active drag: line follows pointer minus grab offset.
    for (var i = drags.length - 1; i >= 0; i--) {
      var d = drags[i];
      if (t >= d.down && (d.up === null || t < d.up)) {
        var mv = d.moves[d.moves.length - 1];
        var px = mv ? mv.x : d.downX;
        var posX = clamp(px - d.grabDX, -R, W + R);
        return clamp((posX + R) / (W + 2 * R), 0, 1);
      }
    }
    // Completed drag: spring back to the sweep over BLEND seconds.
    for (var j = drags.length - 1; j >= 0; j--) {
      var e = drags[j];
      if (e.up !== null && t >= e.up) {
        var s = smoothstep((t - e.up) / BLEND);
        if (s >= 1) return schedPhi(t);
        var phiU = (1 - s) * e.relPhiU + s * (t / SWEEP);
        var phi = phiU % 1;
        return phi < 0 ? phi + 1 : phi;
      }
    }
    return schedPhi(t);
  }
  function posAt(t) { return posFromPhi(phiAt(t)); }

  function morphAt(gx, t) {
    var d = Math.abs(posAt(t) - gx);
    if (d >= R) return 0;
    return 0.5 * (1 + Math.cos(Math.PI * d / R));
  }

  function handleDown(x, y, t) {
    var posX = posAt(t);
    active = {
      down: t, downX: x, grabDX: x - posX,
      moves: [{ t: t, x: x }], up: null, relPhiU: 0
    };
    drags.push(active);
  }
  function handleMove(x, y, t) {
    if (!active) return;
    active.moves.push({ t: t, x: x });
  }
  function handleUp(x, y, t) {
    if (!active) return;
    active.moves.push({ t: t, x: x });
    var d = active;
    d.up = t;
    // Release phi in unwrapped schedule space, shortest-path offset.
    var relPhi = clamp((clamp(x - d.grabDX, -R, W + R) + R) / (W + 2 * R), 0, 1);
    var sp = schedPhi(t);
    var delta = (((relPhi - sp + 1.5) % 1) + 1) % 1 - 0.5;
    d.relPhiU = (t / SWEEP) + delta;
    active = null;
  }

  // ---- drawing (flat fills only; every dot its own path with moveTo) ----
  function dot(x, y, r, style) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = style;
    ctx.fill();
  }
  function rect(x, y, w, h, style) {
    ctx.fillStyle = style;
    ctx.fillRect(x, y, w, h);
  }

  function drawGeneric(g, s, style) {
    var x = g.x, y = g.y;
    if (g.type === 0) {
      // Smiling arc with two dot eyes.
      ctx.beginPath();
      ctx.arc(x, y - s * 0.08, s * 0.30, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.strokeStyle = style; ctx.lineWidth = Math.max(2, s * 0.11);
      ctx.lineCap = 'round'; ctx.stroke();
      dot(x - s * 0.18, y - s * 0.28, Math.max(1.5, s * 0.06), style);
      dot(x + s * 0.18, y - s * 0.28, Math.max(1.5, s * 0.06), style);
    } else if (g.type === 1) {
      // Pointing arm: angled bar plus hand disc.
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.5);
      rect(-s * 0.42, -s * 0.07, s * 0.84, s * 0.14, style);
      ctx.restore();
      dot(x + s * 0.38, y - s * 0.22, Math.max(2, s * 0.11), style);
    } else if (g.type === 2) {
      // Skyline blocks.
      rect(x - s * 0.36, y - s * 0.10, s * 0.20, s * 0.34, style);
      rect(x - s * 0.10, y - s * 0.34, s * 0.20, s * 0.58, style);
      rect(x + s * 0.16, y - s * 0.20, s * 0.20, s * 0.44, style);
    } else {
      // Handshake blob: two overlapping discs plus a joining bar.
      dot(x - s * 0.16, y, Math.max(2, s * 0.20), style);
      dot(x + s * 0.16, y + s * 0.04, Math.max(2, s * 0.20), style);
      rect(x - s * 0.22, y - s * 0.05, s * 0.44, s * 0.10, style);
    }
  }

  function drawFigure(g, s, style) {
    // Abstract standing figure, facing the viewer, blank head, no features.
    var x = g.x, y = g.y;
    dot(x, y - s * 0.36, Math.max(2, s * 0.15), style);
    rect(x - s * 0.14, y - s * 0.20, s * 0.28, s * 0.42, style);
    rect(x - s * 0.30, y - s * 0.12, s * 0.18, s * 0.09, style);
    rect(x + s * 0.12, y - s * 0.12, s * 0.18, s * 0.09, style);
    rect(x - s * 0.13, y + s * 0.22, s * 0.10, s * 0.26, style);
    rect(x + s * 0.03, y + s * 0.22, s * 0.10, s * 0.26, style);
  }

  function draw(t) {
    if (!ctx) return;
    if (!glyphs.length) layout();
    var lineX = posAt(t);
    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);
    var s = cell * 0.42;
    for (var i = 0; i < glyphs.length; i++) {
      var g = glyphs[i];
      var m = morphAt(g.x, t);
      if (m < 1) {
        ctx.save();
        ctx.globalAlpha = a4(1 - m);
        drawGeneric(g, s, g.color);
        ctx.restore();
      }
      if (m > 0) {
        ctx.save();
        ctx.globalAlpha = a4(m);
        drawFigure(g, s, INK);
        ctx.restore();
      }
    }
    // Voice-line: thin gold line with layered flat-alpha glow (no gradient).
    ctx.save();
    ctx.fillStyle = rgba(GOLD, 0.06);
    ctx.fillRect(lineX - 18, 0, 36, H);
    ctx.fillStyle = rgba(GOLD, 0.10);
    ctx.fillRect(lineX - 9, 0, 18, H);
    ctx.fillStyle = GOLD;
    ctx.fillRect(lineX - 1.5, 0, 3, H);
    ctx.restore();
  }

  // ---- live loop: first rAF call anchors the clock; frame one is draw(0) ----
  var startT = null;
  var elapsed = 0;
  function loop(ts) {
    if (startT === null) startT = ts;
    elapsed = (ts - startT) / 1000;
    draw(elapsed);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  function nowElapsed() { return elapsed; }

  function attach() {
    try {
      if (canvas && canvas.addEventListener) {
        canvas.addEventListener('pointerdown', function (ev) {
          handleDown(ev.clientX || 0, ev.clientY || 0, nowElapsed());
        });
        canvas.addEventListener('pointermove', function (ev) {
          handleMove(ev.clientX || 0, ev.clientY || 0, nowElapsed());
        });
        canvas.addEventListener('pointerup', function (ev) {
          handleUp(ev.clientX || 0, ev.clientY || 0, nowElapsed());
        });
        canvas.addEventListener('pointercancel', function (ev) {
          handleUp(ev.clientX || 0, ev.clientY || 0, nowElapsed());
        });
      }
      if (typeof window !== 'undefined' && window) {
        var onResize = function () { layout(); draw(nowElapsed()); };
        if (window.addEventListener) {
          window.addEventListener('resize', onResize);
        }
        if (window.visualViewport && window.visualViewport.addEventListener) {
          window.visualViewport.addEventListener('resize', onResize);
        }
      }
    } catch (e) { /* harness without listeners */ }
  }

  layout();
  attach();
  draw(0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  // Harness interface (forced-time probing; not part of the visible piece).
  try {
    if (typeof window !== 'undefined' && window) {
      window.__piece = {
        W: function () { return W; },
        H: function () { return H; },
        R: function () { return R; },
        SWEEP: SWEEP,
        glyphs: function () { return glyphs; },
        posAt: posAt,
        phiAt: phiAt,
        morphAt: morphAt,
        drawAt: draw,
        down: handleDown,
        move: handleMove,
        up: handleUp
      };
    }
  } catch (e) { /* no window */ }
})();
</script>
</body>
</html>
