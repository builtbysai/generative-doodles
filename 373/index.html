<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.373 Sunflower Suite</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F5EFE2; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.373 Sunflower Suite (al_kovalyova_design).
// After Olena Kovalova's collection architecture: a fabric
// collection ships as a suite derived from one motif library, so
// the piece IS the suite. Six panels in a 3x2 grid, all drawn from
// ONE shared library (sunflower, owl, bird, petal-dash, check,
// sketch stroke) in one palette family: (1) hero sunflower toss,
// petals #E8A93D / centres #5C4326 on cream #F5EFE2; (2) tossed
// owl and bird print on sage #8FB5AE, sepia #7A5C44; (3) geometric
// petal-dash blender on chocolate #3D2B1F, dashes #C98F2F;
// (4) gingham check, #D9A441 on cream; (5) line-art sunflower
// sketch, grey #6B6B6B on #F1EBDC; (6) sepia bird flight field on
// cream. Every panel runs its own gentle loop inside one shared
// seamless 24s master loop (LOOP): sunflowers sway on 2 whole
// cycles, owls bob on 1, blender dashes pulse on 2, the check
// drifts exactly one band pitch, sketch stems sway on 1, flight
// birds cross exactly one field width with wings on 6 flap cycles,
// so frame 24s is pixel-identical to frame 0 at rest.
// TAP a panel (press that moves less than 12 design px) expands
// it full-frame; the other five collapse to a filmstrip along the
// bottom edge, each cell a live miniature of its pattern. In the
// expanded view: TAP a filmstrip cell to switch to that pattern,
// TAP the expanded pattern itself to return to the suite grid,
// DRAG horizontally to scrub: past 22 percent of the frame width
// the neighbouring pattern takes over on release. Taps are state
// changes only, never a reload, and tap is kept separate from
// drag by the movement threshold. No labels, no dots, no text,
// no chrome: the filmstrip is made of the patterns themselves.
// Flat colour only, one canvas, all marks drawn directly each
// frame from the authored tables below.
// Determinism: the first frame is drawn synchronously at the
// constant phase T = 7.3 (the suite grid, every panel mid-loop),
// never Date.now() minus an offset, and the animation advances
// from that anchor in fixed 1/60 ticks.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DW = 1280, DH = 900;
var LOOP = 24;
var TAU = Math.PI * 2;
var PAGE = '#F5EFE2';
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 7.3, lastNow = -1, acc = 0;
var TICK = 1 / 60;

// ---- palette family -------------------------------------------------
var PETAL = '#E8A93D', CENTRE = '#5C4326', CREAM = '#F5EFE2';
var SAGE = '#8FB5AE', SEPIA = '#7A5C44';
var CHOC = '#3D2B1F', DASH = '#C98F2F';
var CHECK = '#D9A441', CHECKMID = '#EBCB85';
var PAPER = '#F1EBDC', GREY = '#6B6B6B';

// ---- the shared motif library ---------------------------------------
// Every painter takes absolute coords and draws directly on the one
// canvas. The sunflower petal path is used filled by the hero toss
// and stroked by the sketch panel; the petal-dash is the hero's
// toss accent and the blender's whole grammar; the bird flies in
// the flight field and perches small in the owl toss. One library,
// six layouts: the collection derives from shared DNA.

function petalPath(L, Wd) {
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(Wd, -L * 0.45, 0, -L);
  ctx.quadraticCurveTo(-Wd, -L * 0.45, 0, 0);
  ctx.closePath();
}

function drawSunflower(cx, cy, R, petals, rot) {
  var i, a;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.fillStyle = PETAL;
  for (i = 0; i < petals; i++) {
    ctx.save();
    ctx.rotate((i / petals) * TAU);
    petalPath(R, R * 0.30);
    ctx.fill();
    ctx.restore();
  }
  for (i = 0; i < petals; i++) {
    ctx.save();
    ctx.rotate(((i + 0.5) / petals) * TAU);
    petalPath(R * 0.60, R * 0.24);
    ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = CENTRE;
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.34, 0, TAU);
  ctx.fill();
  ctx.fillStyle = PETAL;
  for (i = 0; i < 6; i++) {
    a = (i / 6) * TAU + 0.3;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * R * 0.19, Math.sin(a) * R * 0.19, R * 0.042, 0, TAU);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.05, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawSketchSunflower(cx, cy, R, petals) {
  // The same petal path, stroked: the line-art variant.
  var i, a;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = GREY;
  ctx.lineWidth = Math.max(1.6, R * 0.045);
  ctx.lineJoin = 'round';
  for (i = 0; i < petals; i++) {
    ctx.save();
    ctx.rotate((i / petals) * TAU);
    petalPath(R, R * 0.30);
    ctx.stroke();
    ctx.restore();
  }
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.36, 0, TAU);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.22, 0, TAU);
  ctx.stroke();
  ctx.fillStyle = GREY;
  for (i = 0; i < 6; i++) {
    a = (i / 6) * TAU + 0.3;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * R * 0.13, Math.sin(a) * R * 0.13, R * 0.035, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

function drawPetalDash(cx, cy, L, rot, scale, color) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.scale(scale, scale);
  ctx.fillStyle = color;
  petalPath(L, L * 0.34);
  ctx.fill();
  ctx.restore();
}

function drawOwl(cx, cy, s, rot) {
  // Sepia owl knocked out of the sage ground: body and head in
  // SEPIA, eyes, beak and belly scallops in the ground colour.
  var side;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.fillStyle = SEPIA;
  for (side = -1; side <= 1; side += 2) {
    ctx.beginPath();
    ctx.moveTo(side * 0.30 * s, -0.86 * s);
    ctx.lineTo(side * 0.52 * s, -1.02 * s);
    ctx.lineTo(side * 0.46 * s, -0.66 * s);
    ctx.closePath();
    ctx.fill();
  }
  ctx.beginPath();
  ctx.ellipse(0, 0.08 * s, 0.60 * s, 0.80 * s, 0, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, -0.52 * s, 0.50 * s, 0, TAU);
  ctx.fill();
  ctx.fillStyle = SAGE;
  for (side = -1; side <= 1; side += 2) {
    ctx.beginPath();
    ctx.arc(side * 0.21 * s, -0.55 * s, 0.155 * s, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = SEPIA;
  for (side = -1; side <= 1; side += 2) {
    ctx.beginPath();
    ctx.arc(side * 0.21 * s, -0.55 * s, 0.068 * s, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = SAGE;
  ctx.beginPath();
  ctx.moveTo(-0.07 * s, -0.38 * s);
  ctx.lineTo(0.07 * s, -0.38 * s);
  ctx.lineTo(0, -0.26 * s);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = SAGE;
  ctx.lineWidth = 0.05 * s;
  ctx.lineCap = 'round';
  var rows = [-0.02, 0.22, 0.46], r, k;
  for (r = 0; r < rows.length; r++) {
    for (k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.arc(k * 0.26 * s, rows[r] * s, 0.11 * s, Math.PI * 1.12, Math.PI * 1.88);
      ctx.stroke();
    }
  }
  for (side = -1; side <= 1; side += 2) {
    ctx.beginPath();
    ctx.arc(side * 0.52 * s, 0.05 * s, 0.20 * s, Math.PI * 0.6, Math.PI * 1.5);
    ctx.stroke();
  }
  ctx.restore();
}

function drawBird(cx, cy, u, rot, flap01, color) {
  // Profile flight silhouette: body, head, tail and one swept near
  // wing whose reach follows the flap phase, far wing tucked low.
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0.0, -0.03 * u);
  ctx.quadraticCurveTo(-0.16 * u, -0.30 * u * (0.45 + 0.55 * flap01), -0.34 * u, -0.34 * u * (0.30 + 0.70 * flap01));
  ctx.quadraticCurveTo(-0.18 * u, -0.10 * u, 0.10 * u, 0.03 * u);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0, 0, 0.27 * u, 0.105 * u, -0.08, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0.25 * u, -0.055 * u, 0.088 * u, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0.315 * u, -0.075 * u);
  ctx.lineTo(0.44 * u, -0.03 * u);
  ctx.lineTo(0.315 * u, -0.005 * u);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-0.24 * u, -0.01 * u);
  ctx.lineTo(-0.42 * u, -0.10 * u);
  ctx.lineTo(-0.40 * u, 0.06 * u);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0.02 * u, -0.02 * u);
  ctx.quadraticCurveTo(-0.08 * u, -0.42 * u * (0.40 + 0.60 * flap01), -0.28 * u, -0.50 * u * (0.32 + 0.68 * flap01));
  ctx.quadraticCurveTo(-0.10 * u, -0.18 * u, 0.12 * u, 0.02 * u);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ---- authored layout tables ------------------------------------------
// Unit coords inside each panel box; sizes are fractions of the
// box's smaller side. Fixed tables, no runtime randomness.

var HERO_FLOWERS = [
  { x: 0.24, y: 0.30, r: 0.30, petals: 13, ph: 0.0 },
  { x: 0.66, y: 0.20, r: 0.23, petals: 12, ph: 1.3 },
  { x: 0.87, y: 0.58, r: 0.27, petals: 14, ph: 2.6 },
  { x: 0.40, y: 0.70, r: 0.25, petals: 11, ph: 4.0 },
  { x: 0.70, y: 0.90, r: 0.20, petals: 12, ph: 5.1 },
  { x: 0.09, y: 0.84, r: 0.19, petals: 13, ph: 0.7 },
  { x: -0.03, y: 0.60, r: 0.17, petals: 11, ph: 3.3 },
  { x: 1.01, y: 0.06, r: 0.15, petals: 12, ph: 2.0 }
];
var HERO_DASHES = [
  { x: 0.48, y: 0.44, rot: 0.7 }, { x: 0.80, y: 0.36, rot: -0.5 },
  { x: 0.18, y: 0.55, rot: 1.9 }, { x: 0.58, y: 0.82, rot: 2.6 },
  { x: 0.30, y: 0.08, rot: -1.2 }, { x: 0.93, y: 0.85, rot: 0.3 },
  { x: 0.55, y: 0.12, rot: 1.1 }, { x: 0.06, y: 0.22, rot: 2.2 },
  { x: 0.84, y: 0.10, rot: -2.4 }
];
var OWLS = [
  { x: 0.27, y: 0.36, s: 0.155, rot: -0.08, ph: 0.0 },
  { x: 0.72, y: 0.27, s: 0.125, rot: 0.10, ph: 2.1 },
  { x: 0.55, y: 0.70, s: 0.165, rot: 0.05, ph: 4.2 },
  { x: 0.15, y: 0.80, s: 0.115, rot: -0.14, ph: 1.0 },
  { x: 0.89, y: 0.83, s: 0.105, rot: 0.18, ph: 3.2 }
];
var OWL_BIRDS = [
  { x: 0.48, y: 0.16, u: 0.075, ph: 0.6 }, { x: 0.90, y: 0.48, u: 0.065, ph: 2.4 },
  { x: 0.36, y: 0.56, u: 0.070, ph: 4.4 }, { x: 0.66, y: 0.92, u: 0.060, ph: 1.6 },
  { x: 0.06, y: 0.12, u: 0.055, ph: 5.3 }, { x: 0.80, y: 0.62, u: 0.058, ph: 3.7 }
];
var SKETCH_FLOWERS = [
  { bx: 0.22, hy: 0.35, r: 0.130, petals: 12, bend: 0.05, ph: 0.0 },
  { bx: 0.53, hy: 0.26, r: 0.150, petals: 13, bend: -0.06, ph: 2.2 },
  { bx: 0.84, hy: 0.41, r: 0.115, petals: 11, bend: 0.04, ph: 4.4 }
];
var FLIGHT_BIRDS = [
  { bx: 0.05, y: 0.16, u: 0.21, ph: 0.0 }, { bx: 0.38, y: 0.26, u: 0.16, ph: 1.7 },
  { bx: 0.68, y: 0.12, u: 0.24, ph: 3.1 }, { bx: 0.20, y: 0.46, u: 0.18, ph: 4.6 },
  { bx: 0.55, y: 0.55, u: 0.22, ph: 2.2 }, { bx: 0.86, y: 0.42, u: 0.15, ph: 5.4 },
  { bx: 0.10, y: 0.74, u: 0.20, ph: 1.1 }, { bx: 0.44, y: 0.84, u: 0.17, ph: 3.8 },
  { bx: 0.76, y: 0.72, u: 0.23, ph: 0.5 }
];
var FLIGHT_FAR = [
  { bx: 0.28, y: 0.34, ph: 0.9 }, { bx: 0.60, y: 0.68, ph: 2.8 },
  { bx: 0.90, y: 0.88, ph: 4.9 }, { bx: 0.02, y: 0.58, ph: 1.9 },
  { bx: 0.48, y: 0.06, ph: 3.5 }
];

// ---- the six layouts ---------------------------------------------------
// Each layout fills its ground inside its box clip, then draws its
// pattern from the shared library. Boxes are absolute design
// coords, so the same functions serve the grid, the expanded view
// (including mid-scrub neighbours) and the filmstrip miniatures.

function clipBox(x, y, w, h) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
}
function unclip() { ctx.restore(); }

function drawHero(x, y, w, h, t) {
  var U = Math.min(w, h), i, f, d;
  clipBox(x, y, w, h);
  ctx.fillStyle = CREAM;
  ctx.fillRect(x, y, w, h);
  for (i = 0; i < HERO_DASHES.length; i++) {
    d = HERO_DASHES[i];
    drawPetalDash(x + d.x * w, y + d.y * h, U * 0.085, d.rot + 0.06 * Math.sin(TAU * (t / LOOP) + i), 1, PETAL);
  }
  for (i = 0; i < HERO_FLOWERS.length; i++) {
    f = HERO_FLOWERS[i];
    drawSunflower(x + f.x * w, y + f.y * h, f.r * U, f.petals,
      0.05 * Math.sin(TAU * 2 * (t / LOOP) + f.ph));
  }
  unclip();
}

function drawOwlToss(x, y, w, h, t) {
  var U = Math.min(w, h), i, o, b, bob, flap;
  clipBox(x, y, w, h);
  ctx.fillStyle = SAGE;
  ctx.fillRect(x, y, w, h);
  for (i = 0; i < OWLS.length; i++) {
    o = OWLS[i];
    bob = 0.010 * Math.sin(TAU * (t / LOOP) + o.ph);
    drawOwl(x + o.x * w, y + (o.y + bob) * h, o.s * U,
      o.rot + 0.03 * Math.sin(TAU * (t / LOOP) + o.ph + 1.0));
  }
  for (i = 0; i < OWL_BIRDS.length; i++) {
    b = OWL_BIRDS[i];
    bob = 0.012 * Math.sin(TAU * (t / LOOP) + b.ph);
    flap = 0.5 + 0.5 * Math.sin(TAU * 3 * (t / LOOP) + b.ph);
    drawBird(x + b.x * w, y + (b.y + bob) * h, b.u * U, -0.06, flap, SEPIA);
  }
  unclip();
}

function drawBlender(x, y, w, h, t) {
  var cols = 6, rows = 5, cw = w / cols, ch = h / rows, c, r, sc;
  clipBox(x, y, w, h);
  ctx.fillStyle = CHOC;
  ctx.fillRect(x, y, w, h);
  for (r = 0; r < rows; r++) {
    for (c = 0; c < cols; c++) {
      sc = 1 + 0.07 * Math.sin(TAU * 2 * (t / LOOP) + (c + r) * 0.6);
      drawPetalDash(x + (c + 0.5) * cw, y + (r + 0.72) * ch,
        Math.min(cw, ch) * 0.44, ((c + r) % 2 === 0) ? 0.65 : -0.65 + Math.PI, sc, DASH);
    }
  }
  unclip();
}

var CHECK_PITCH = 56;
function drawCheck(x, y, w, h, t) {
  var off = (t / LOOP) * CHECK_PITCH % CHECK_PITCH;
  var i, j, bx, by;
  clipBox(x, y, w, h);
  ctx.fillStyle = CREAM;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = CHECKMID;
  for (i = -1; i * CHECK_PITCH < w + CHECK_PITCH; i++) {
    bx = x + i * CHECK_PITCH + off;
    ctx.fillRect(bx, y, CHECK_PITCH / 2, h);
  }
  for (j = -1; j * CHECK_PITCH < h + CHECK_PITCH; j++) {
    by = y + j * CHECK_PITCH + off;
    ctx.fillRect(x, by, w, CHECK_PITCH / 2);
  }
  ctx.fillStyle = CHECK;
  for (i = -1; i * CHECK_PITCH < w + CHECK_PITCH; i++) {
    bx = x + i * CHECK_PITCH + off;
    for (j = -1; j * CHECK_PITCH < h + CHECK_PITCH; j++) {
      by = y + j * CHECK_PITCH + off;
      ctx.fillRect(bx, by, CHECK_PITCH / 2, CHECK_PITCH / 2);
    }
  }
  unclip();
}

function drawSketch(x, y, w, h, t) {
  var U = Math.min(w, h), i, f, baseX, baseY, headX, headY, sway, bendX, k, lt, lx, ly;
  clipBox(x, y, w, h);
  ctx.fillStyle = PAPER;
  ctx.fillRect(x, y, w, h);
  for (i = 0; i < SKETCH_FLOWERS.length; i++) {
    f = SKETCH_FLOWERS[i];
    sway = 0.022 * Math.sin(TAU * (t / LOOP) + f.ph);
    baseX = x + f.bx * w;
    baseY = y + h * 1.01;
    headX = x + (f.bx + f.bend) * w;
    headY = y + f.hy * h;
    ctx.save();
    ctx.translate(baseX, baseY);
    ctx.rotate(sway);
    ctx.translate(-baseX, -baseY);
    ctx.strokeStyle = GREY;
    ctx.lineWidth = Math.max(1.6, U * 0.008);
    ctx.lineCap = 'round';
    bendX = (baseX + headX) / 2 + f.bend * w * 0.8;
    ctx.beginPath();
    ctx.moveTo(baseX, baseY);
    ctx.quadraticCurveTo(bendX, (baseY + headY) / 2, headX, headY);
    ctx.stroke();
    for (k = 0; k < 2; k++) {
      lt = 0.38 + 0.26 * k;
      lx = (1 - lt) * (1 - lt) * baseX + 2 * (1 - lt) * lt * bendX + lt * lt * headX;
      ly = (1 - lt) * (1 - lt) * baseY + 2 * (1 - lt) * lt * ((baseY + headY) / 2) + lt * lt * headY;
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate((k === 0 ? -0.85 : 0.85) + f.bend * 2);
      petalPath(U * 0.11, U * 0.045);
      ctx.stroke();
      ctx.restore();
    }
    drawSketchSunflower(headX, headY, f.r * U, f.petals);
    ctx.restore();
  }
  unclip();
}

function drawFlight(x, y, w, h, t) {
  var U = Math.min(w, h), i, b, fx, flap;
  clipBox(x, y, w, h);
  ctx.fillStyle = CREAM;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = SEPIA;
  ctx.lineCap = 'round';
  for (i = 0; i < FLIGHT_FAR.length; i++) {
    b = FLIGHT_FAR[i];
    fx = x + ((b.bx + t / LOOP) % 1) * w;
    flap = 0.5 + 0.5 * Math.sin(TAU * 6 * (t / LOOP) + b.ph);
    ctx.lineWidth = Math.max(1.4, U * 0.006);
    ctx.beginPath();
    ctx.moveTo(fx - U * 0.030, y + b.y * h - U * 0.012 * flap);
    ctx.quadraticCurveTo(fx - U * 0.012, y + b.y * h + U * 0.010, fx, y + b.y * h);
    ctx.quadraticCurveTo(fx + U * 0.012, y + b.y * h + U * 0.010, fx + U * 0.030, y + b.y * h - U * 0.012 * flap);
    ctx.stroke();
  }
  for (i = 0; i < FLIGHT_BIRDS.length; i++) {
    b = FLIGHT_BIRDS[i];
    fx = x + ((b.bx + t / LOOP) % 1) * w;
    flap = 0.5 + 0.5 * Math.sin(TAU * 6 * (t / LOOP) + b.ph);
    drawBird(fx, y + b.y * h, b.u * U, 0, flap, SEPIA);
  }
  unclip();
}

var PANELS = [drawHero, drawOwlToss, drawBlender, drawCheck, drawSketch, drawFlight];
if (PANELS.length !== 6) throw new Error('Sunflower Suite needs exactly 6 panels');

// ---- geometry ---------------------------------------------------------
var MARGIN = 40, GUT = 16;
var PW = (DW - MARGIN * 2 - GUT * 2) / 3, PH = (DH - MARGIN * 2 - GUT) / 2;
function cellRect(i) {
  var col = i % 3, row = Math.floor(i / 3);
  return { x: MARGIN + col * (PW + GUT), y: MARGIN + row * (PH + GUT), w: PW, h: PH };
}
var EXP = { x: 40, y: 32, w: 1200, h: 740 };
var STRIP_Y = 788, STRIP_H = 92, STRIP_GAP = 10;
var STRIP_W = (EXP.w - STRIP_GAP * 4) / 5;
function stripPanels() {
  // The five non-current panels, in suite order.
  var out = [], i;
  for (i = 0; i < 6; i++) if (i !== cur) out.push(i);
  return out;
}
function stripRect(k) {
  return { x: EXP.x + k * (STRIP_W + STRIP_GAP), y: STRIP_Y, w: STRIP_W, h: STRIP_H };
}

// ---- state --------------------------------------------------------------
var view = 'grid';            // 'grid' or 'full'
var cur = 0;                  // expanded panel index
var scrub = 0;                // live horizontal drag offset, design px
var downInfo = null;          // { x, y, area, panel } at pointerdown

// ---- views ----------------------------------------------------------------

function drawGrid(t) {
  var i, r;
  for (i = 0; i < 6; i++) {
    r = cellRect(i);
    PANELS[i](r.x, r.y, r.w, r.h, t);
  }
}

function drawFull(t) {
  var i, sp, r;
  clipBox(EXP.x, EXP.y, EXP.w, EXP.h);
  PANELS[cur](EXP.x + scrub, EXP.y, EXP.w, EXP.h, t);
  if (scrub !== 0) {
    var nb = (cur + (scrub < 0 ? 1 : -1) + 6) % 6;
    PANELS[nb](EXP.x + scrub + (scrub < 0 ? EXP.w : -EXP.w), EXP.y, EXP.w, EXP.h, t);
  }
  unclip();
  sp = stripPanels();
  for (i = 0; i < sp.length; i++) {
    r = stripRect(i);
    PANELS[sp[i]](r.x, r.y, r.w, r.h, t);
  }
}

function draw(t) {
  if (view === 'full') drawFull(t); else drawGrid(t);
}

// ---- sizing ---------------------------------------------------------------

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- pointer: tap expands / switches / returns, drag scrubs --------------
// A press that moves less than TAP_SLOP design px is a tap; anything
// further is a drag. Tap and drag never share a gesture.

var TAP_SLOP = 12;
function toDesign(e) {
  return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S };
}
function hitCell(p) {
  var i, r;
  for (i = 0; i < 6; i++) {
    r = cellRect(i);
    if (p.x >= r.x && p.x < r.x + r.w && p.y >= r.y && p.y < r.y + r.h) return i;
  }
  return -1;
}
function hitStrip(p) {
  if (p.y < STRIP_Y || p.y >= STRIP_Y + STRIP_H) return -1;
  var sp = stripPanels(), k, r;
  for (k = 0; k < sp.length; k++) {
    r = stripRect(k);
    if (p.x >= r.x && p.x < r.x + r.w) return sp[k];
  }
  return -1;
}
function inExp(p) {
  return p.x >= EXP.x && p.x < EXP.x + EXP.w && p.y >= EXP.y && p.y < EXP.y + EXP.h;
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downInfo = { x: p.x, y: p.y, area: 'none', panel: -1 };
  if (view === 'grid') {
    downInfo.panel = hitCell(p);
    downInfo.area = downInfo.panel >= 0 ? 'cell' : 'none';
  } else {
    var sp = hitStrip(p);
    if (sp >= 0) { downInfo.area = 'strip'; downInfo.panel = sp; }
    else if (inExp(p)) downInfo.area = 'main';
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!downInfo || view !== 'full' || downInfo.area !== 'main') return;
  var p = toDesign(e);
  var dx = p.x - downInfo.x;
  if (dx > EXP.w) dx = EXP.w;
  if (dx < -EXP.w) dx = -EXP.w;
  scrub = dx;
});
canvas.addEventListener('pointerup', function (e) {
  if (!downInfo) return;
  var p = toDesign(e);
  var moved = Math.sqrt((p.x - downInfo.x) * (p.x - downInfo.x) + (p.y - downInfo.y) * (p.y - downInfo.y));
  var info = downInfo;
  downInfo = null;
  if (moved < TAP_SLOP) {
    scrub = 0;
    if (view === 'grid') {
      var cell = hitCell(p);
      if (cell >= 0) { view = 'full'; cur = cell; }
    } else {
      var sp = hitStrip(p);
      if (sp >= 0) cur = sp;
      else if (inExp(p)) view = 'grid';
    }
    return;
  }
  if (view === 'full' && info.area === 'main' && scrub !== 0) {
    if (Math.abs(scrub) > EXP.w * 0.22) {
      cur = (cur + (scrub < 0 ? 1 : -1) + 6) % 6;
    }
    scrub = 0;
  }
});
canvas.addEventListener('pointercancel', function () { downInfo = null; scrub = 0; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Centred fit: the suite keeps its shape at any aspect and the
  // page ground stays the suite cream in both views.
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PAGE;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loopFn = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loopFn); };
  requestAnimationFrame(loopFn);
}
})();
</script>
</body>
