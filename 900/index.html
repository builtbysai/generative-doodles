<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Suspension of d_is/b[e]l/ie.'f</title>
<style>
  html, body { margin: 0; padding: 0; background: #B8B8B2; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(90061);

  // ---------- palette (strict) ----------
  var SLOPE = '#2A2A2C';    // dark slope
  var SKY = '#B8B8B2';      // pale sky
  var FIGURE = '#0C0C0C';   // figure black
  var MAGENTA = '#FF2E9E';  // the ONLY color
  var ORBCORE = '#FFD6F2';  // pink-white hot
  var GLITCH = '#141414';   // blotch dark
  var BLACK = '#000000';    // scanline, low alpha only

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720, DPR = 1;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    return H > W * 1.15;
  }

  // ---------- seeded 1D value-noise fbm ----------
  var noiseSeed = [];
  for (var ni = 0; ni < 64; ni++) noiseSeed.push(rng());
  function vnoise(x) {
    var xi = Math.floor(x), xf = x - xi;
    var u = xf * xf * (3 - 2 * xf);
    var a = noiseSeed[((xi % 64) + 64) % 64];
    var b = noiseSeed[(((xi + 1) % 64) + 64) % 64];
    return a + (b - a) * u;
  }
  function fbm1(x) {
    return vnoise(x) * 0.55 + vnoise(x * 2.13 + 7.3) * 0.28 + vnoise(x * 4.31 + 19.1) * 0.17;
  }

  // Ridge line, normalized: y of the hill crest at horizontal position xn.
  // Falls from lower-left (0.80) to upper-right (0.36), fbm-warped.
  function ridgeYNorm(xn) {
    return 0.80 - 0.44 * xn + (fbm1(xn * 3.1) - 0.5) * 0.075;
  }
  var RIDGE_STEPS = 240;
  var ridgeTable = []; // ridgeTable[i] = ridgeYNorm(i / RIDGE_STEPS)
  function buildRidge() {
    ridgeTable = [];
    for (var i = 0; i <= RIDGE_STEPS; i++) ridgeTable.push(ridgeYNorm(i / RIDGE_STEPS));
  }
  buildRidge();
  // x (normalized) where the ridge crosses horizontal line yn; -1 above the
  // crest everywhere (pure sky), 0 at/below the crest's lowest reach.
  function ridgeXNorm(yn) {
    if (yn <= ridgeTable[RIDGE_STEPS]) return -1;
    if (yn >= ridgeTable[0]) return 0;
    for (var i = 1; i <= RIDGE_STEPS; i++) {
      if (ridgeTable[i] <= yn) {
        var y0 = ridgeTable[i - 1], y1 = ridgeTable[i];
        var f = (y0 === y1) ? 0 : (y0 - yn) / (y0 - y1);
        return (i - 1 + f) / RIDGE_STEPS;
      }
    }
    return 0;
  }

  // ---------- natural mottling (precomputed, seeded) ----------
  var blotches = [];
  for (var bi = 0; bi < 46; bi++) {
    blotches.push({
      x: rng(), y: rng(),
      r: 0.014 + rng() * 0.05,
      a: 0.018 + rng() * 0.038,
      squash: 0.45 + rng() * 0.5
    });
  }

  // ---------- damage map ----------
  var DG = 28; // grid is DG x DG
  var damage = new Float32Array(DG * DG);
  var meanDamage = 0;
  function damageAt(xn, yn) {
    var i = Math.max(0, Math.min(DG - 1, Math.floor(xn * DG)));
    var j = Math.max(0, Math.min(DG - 1, Math.floor(yn * DG)));
    return damage[j * DG + i];
  }
  function addDamage(xn, yn, amount, radiusCells) {
    var ci = xn * DG, cj = yn * DG;
    var r = radiusCells;
    for (var j = Math.floor(cj - r); j <= Math.ceil(cj + r); j++) {
      if (j < 0 || j >= DG) continue;
      for (var i = Math.floor(ci - r); i <= Math.ceil(ci + r); i++) {
        if (i < 0 || i >= DG) continue;
        var d = Math.sqrt((i + 0.5 - ci) * (i + 0.5 - ci) + (j + 0.5 - cj) * (j + 0.5 - cj));
        if (d <= r) {
          var idx = j * DG + i;
          var add = amount * (1 - d / (r + 0.001));
          damage[idx] = Math.min(1, damage[idx] + add);
        }
      }
    }
  }
  function computeDamageStats() {
    var sum = 0, cx = 0, cy = 0;
    for (var j = 0; j < DG; j++) {
      for (var i = 0; i < DG; i++) {
        var v = damage[j * DG + i];
        sum += v;
        cx += v * (i + 0.5) / DG;
        cy += v * (j + 0.5) / DG;
      }
    }
    meanDamage = sum / (DG * DG);
    if (sum > 0.001) return { x: cx / sum, y: cy / sum, sum: sum };
    return null;
  }

  // ---------- interaction / event state ----------
  var simTime = 0;
  var pointerDown = false;
  var downTime = 0, downX = 0, downY = 0, lastX = 0, lastY = 0, dragDist = 0;
  var pendingTap = null;      // { t } awaiting double-tap disambiguation
  var churnEvents = [];       // times of tap churns
  var detonateEvents = [];    // times of double-tap detonations
  var biasX = 0, biasY = 0;   // smoothed orb bias toward damage (px)

  function churnAngle(t) {
    // closed-form swirl angle: base rotation + decaying churn boosts
    var a = t * 0.45;
    for (var i = 0; i < churnEvents.length; i++) {
      var dt = t - churnEvents[i];
      if (dt > 0) a += 9.0 * 1.1 * (1 - Math.exp(-dt / 1.1));
    }
    for (var k = 0; k < detonateEvents.length; k++) {
      var dd = t - detonateEvents[k];
      if (dd > 0) a += 14.0 * 0.8 * (1 - Math.exp(-dd / 0.8));
    }
    return a;
  }
  function flashAt(t) {
    var f = 0;
    for (var i = 0; i < detonateEvents.length; i++) {
      var dt = t - detonateEvents[i];
      if (dt >= 0) f = Math.max(f, Math.exp(-dt / 0.35));
    }
    return f;
  }

  // ---------- audio (lazy, guarded; gesture only) ----------
  var AC = null, gritGain = null, masterGain = null;
  function initAudio() {
    if (AC) return;
    var Ctor = null;
    if (typeof AudioContext !== 'undefined') Ctor = AudioContext;
    else if (typeof webkitAudioContext !== 'undefined') Ctor = webkitAudioContext;
    if (!Ctor) return;
    try {
      AC = new Ctor();
      masterGain = AC.createGain(); masterGain.gain.value = 0.9;
      masterGain.connect(AC.destination);
      var len = AC.sampleRate * 2;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var data = buf.getChannelData(0);
      var r = mulberry32(4242);
      var last = 0;
      for (var i = 0; i < len; i++) { // pinkish noise
        var white = r() * 2 - 1;
        last = last * 0.94 + white * 0.06;
        data[i] = last * 3.2;
      }
      // wind: looped noise through a lowpass
      var wind = AC.createBufferSource(); wind.buffer = buf; wind.loop = true;
      var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380; lp.Q.value = 0.4;
      var windGain = AC.createGain(); windGain.gain.value = 0.16;
      wind.connect(lp); lp.connect(windGain); windGain.connect(masterGain);
      wind.start();
      // slow wind swell
      var lfo = AC.createOscillator(); lfo.frequency.value = 0.07;
      var lfoGain = AC.createGain(); lfoGain.gain.value = 0.06;
      lfo.connect(lfoGain); lfoGain.connect(windGain.gain); lfo.start();
      // grit: same noise waveshaped, gain follows mean damage
      var grit = AC.createBufferSource(); grit.buffer = buf; grit.loop = true; grit.playbackRate.value = 1.7;
      var shaper = AC.createWaveShaper();
      var curve = new Float32Array(256);
      for (var c = 0; c < 256; c++) { var x = c / 128 - 1; curve[c] = Math.tanh(x * 4); }
      shaper.curve = curve;
      var hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
      gritGain = AC.createGain(); gritGain.gain.value = 0;
      grit.connect(shaper); shaper.connect(hp); hp.connect(gritGain); gritGain.connect(masterGain);
      grit.start();
    } catch (e) { AC = null; }
  }
  function boom() {
    if (!AC) return;
    try {
      var t0 = AC.currentTime;
      var osc = AC.createOscillator(); osc.type = 'sine';
      osc.frequency.setValueAtTime(95, t0);
      osc.frequency.exponentialRampToValueAtTime(28, t0 + 0.75);
      var g = AC.createGain();
      g.gain.setValueAtTime(0.55, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.85);
      osc.connect(g); g.connect(masterGain);
      osc.start(t0); osc.stop(t0 + 0.9);
    } catch (e) { /* silence is fine */ }
  }
  var lastAudioPush = -1;
  function pushAudio() {
    if (!AC || !gritGain) return;
    if (simTime - lastAudioPush < 0.12) return;
    lastAudioPush = simTime;
    try { gritGain.gain.setTargetAtTime(meanDamage * 0.5, AC.currentTime, 0.1); } catch (e) { /* ignore */ }
  }

  // ---------- resize ----------
  function resize() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width || 0; h = window.visualViewport.height || 0;
    }
    if (!w || !h) {
      w = (typeof window !== 'undefined' && window.innerWidth) || 720;
      h = (typeof window !== 'undefined' && window.innerHeight) || 720;
    }
    W = Math.round(w); H = Math.round(h);
    DPR = 1;
    if (typeof window !== 'undefined' && window.devicePixelRatio) {
      DPR = Math.min(window.devicePixelRatio, 2);
    }
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    buildRidge();
  }

  // ---------- drawing ----------
  function ridgePath() {
    ctx.beginPath();
    ctx.moveTo(0, ridgeTable[0] * H);
    for (var i = 1; i <= RIDGE_STEPS; i++) {
      ctx.lineTo(i / RIDGE_STEPS * W, ridgeTable[i] * H);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  }

  function drawTerrain(t) {
    // sky
    ctx.fillStyle = SKY;
    ctx.fillRect(0, 0, W, H);
    // faint sky banding
    var bandH = Math.max(3, Math.round(H / 160));
    var bi2, yn2;
    for (bi2 = 0; bi2 * bandH < H; bi2++) {
      yn2 = (bi2 * bandH) / H;
      if (ridgeXNorm(yn2) === 0) break; // fully slope below here
      var sh = fbm1(bi2 * 0.37 + 3.1);
      ctx.fillStyle = BLACK;
      ctx.globalAlpha = 0.007 + sh * 0.014;
      if (bi2 % 2 === 0) ctx.fillRect(0, bi2 * bandH, W, bandH);
    }
    ctx.globalAlpha = 1;

    // slope, in horizontal slices so damage can tear them sideways
    var sliceH = Math.max(4, Math.round(H / 130));
    for (var sy = 0; sy < H; sy += sliceH) {
      var yn = (sy + sliceH * 0.5) / H;
      var xe = ridgeXNorm(yn);
      if (xe < 0) continue;
      var xStart = xe * W;
      // row damage -> tear offset (seeded direction per slice)
      var rj = Math.max(0, Math.min(DG - 1, Math.floor(yn * DG)));
      var rsum = 0;
      for (var ri = 0; ri < DG; ri++) rsum += damage[rj * DG + ri];
      var rowDmg = rsum / DG;
      var dir = vnoise(sy * 0.913 + 40.7) - 0.5;
      var tear = dir * 2 * rowDmg * 0.13 * W;
      var xeTop = ridgeXNorm(sy / H), xeBot = ridgeXNorm((sy + sliceH) / H);
      var xT = (xeTop < 0 ? W : xeTop * W), xB = (xeBot < 0 ? W : xeBot * W);
      ctx.beginPath();
      ctx.moveTo(xT + tear, sy);
      ctx.lineTo(W + tear, sy);
      ctx.lineTo(W + tear, sy + sliceH + 1);
      ctx.lineTo(xB + tear, sy + sliceH + 1);
      ctx.closePath();
      ctx.fillStyle = SLOPE;
      ctx.fill();
      // band shading within the slope
      var shade = fbm1(sy * 0.021 + 11.3);
      ctx.fillStyle = BLACK;
      ctx.globalAlpha = 0.05 + shade * 0.10;
      ctx.fill();
      ctx.globalAlpha = 1;
      // scanline seam where the row is torn
      if (rowDmg > 0.10) {
        ctx.strokeStyle = BLACK;
        ctx.globalAlpha = Math.min(0.55, (rowDmg - 0.10) * 1.1);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(xStart + tear, sy + 0.5);
        ctx.lineTo(W + tear, sy + 0.5);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    // natural mottling, clipped to the slope
    ctx.save();
    ridgePath();
    ctx.clip();
    var bi3;
    for (bi3 = 0; bi3 < blotches.length; bi3++) {
      var b = blotches[bi3];
      ctx.fillStyle = GLITCH;
      ctx.globalAlpha = b.a;
      ctx.beginPath();
      ctx.ellipse(b.x * W, b.y * H, b.r * W, b.r * W * b.squash, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    // damage blotches chewing the slope
    for (var j = 0; j < DG; j++) {
      for (var i = 0; i < DG; i++) {
        var v = damage[j * DG + i];
        if (v < 0.06) continue;
        var cxp = (i + 0.5) / DG * W, cyp = (j + 0.5) / DG * H;
        var rr = (0.5 + v * 0.9) / DG * W;
        ctx.fillStyle = GLITCH;
        ctx.globalAlpha = v * 0.55;
        ctx.beginPath();
        ctx.ellipse(cxp, cyp, rr, rr * 0.62, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawFigure() {
    var s = Math.min(W, H);
    var fx = 0.13 * W;
    var baseY = (ridgeYNorm(0.13) + 0.055) * H;
    var u = s * 0.155; // figure height scale
    ctx.fillStyle = FIGURE;
    // crossed-leg base wedge
    ctx.beginPath();
    ctx.moveTo(fx - 0.52 * u, baseY);
    ctx.lineTo(fx + 0.52 * u, baseY);
    ctx.lineTo(fx + 0.30 * u, baseY - 0.20 * u);
    ctx.lineTo(fx - 0.30 * u, baseY - 0.20 * u);
    ctx.closePath();
    ctx.fill();
    // torso: rounded seated mass
    ctx.beginPath();
    ctx.ellipse(fx, baseY - 0.52 * u, 0.335 * u, 0.44 * u, 0, 0, Math.PI * 2);
    ctx.fill();
    // hood mass behind the head
    ctx.beginPath();
    ctx.ellipse(fx, baseY - 1.02 * u, 0.265 * u, 0.29 * u, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    // head
    ctx.beginPath();
    ctx.arc(fx, baseY - 1.00 * u, 0.195 * u, 0, Math.PI * 2);
    ctx.fill();
    // the device: a small rectangle held out at the front
    ctx.save();
    ctx.translate(fx + 0.30 * u, baseY - 0.58 * u);
    ctx.rotate(-0.18);
    ctx.fillRect(-0.085 * u, -0.125 * u, 0.17 * u, 0.25 * u);
    ctx.restore();
  }

  function spiralPoints(cx, cy, r0, r1, a0, twist, steps) {
    var pts = [];
    for (var i = 0; i <= steps; i++) {
      var f = i / steps;
      var r = r0 + (r1 - r0) * f;
      var a = a0 + twist * f;
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    return pts;
  }
  function strokePts(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  }

  function drawOrb(t) {
    var s = Math.min(W, H);
    var R = s * 0.115;
    // state LFO: 0 = diffuse vortex, 1 = contained sphere; diffuse at t=0
    var m = 0.5 + 0.5 * Math.sin(t * (Math.PI * 2 / 47) - Math.PI / 2);
    m = m * m * (3 - 2 * m);
    // wander (closed-form LFOs)
    var bx = 0.55 * W + Math.sin(t * 0.11 + 1.7) * 0.035 * W + Math.sin(t * 0.043) * 0.02 * W;
    var by = 0.30 * H + Math.cos(t * 0.09 + 0.4) * 0.028 * H;
    var cx = bx + biasX, cy = by + biasY;
    var flash = flashAt(t);
    var ang = churnAngle(t);

    // ---- diffuse vortex (weight 1-m) ----
    if (m < 0.98) {
      var wa = (1 - m) * (0.55 + flash * 0.45);
      var arms = 5;
      for (var a = 0; a < arms; a++) {
        var a0 = ang * 0.35 + a * (Math.PI * 2 / arms);
        var pts = spiralPoints(cx, cy, R * 0.08, R * (1.55 + flash * 0.3), a0, 2.6, 26);
        for (var seg = 0; seg < pts.length - 1; seg++) {
          var f = seg / (pts.length - 1);
          ctx.strokeStyle = MAGENTA;
          ctx.globalAlpha = wa * 0.34 * (1 - f * 0.75);
          ctx.lineWidth = Math.max(1, R * 0.16 * (1 - f * 0.7));
          ctx.beginPath();
          ctx.moveTo(pts[seg][0], pts[seg][1]);
          ctx.lineTo(pts[seg + 1][0], pts[seg + 1][1]);
          ctx.stroke();
        }
      }
      // soft heart of the vortex
      ctx.fillStyle = MAGENTA;
      ctx.globalAlpha = wa * 0.20;
      ctx.beginPath(); ctx.arc(cx, cy, R * 0.75, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = wa * 0.30;
      ctx.beginPath(); ctx.arc(cx, cy, R * 0.42, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = ORBCORE;
      ctx.globalAlpha = wa * (0.35 + flash * 0.6);
      ctx.beginPath(); ctx.arc(cx, cy, R * 0.16, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // ---- contained sphere (weight m) ----
    if (m > 0.02) {
      var sa = m;
      // glow: layered flat-alpha discs (no gradients)
      var glow = [1.5, 1.26, 1.08];
      var gal = [0.05, 0.08, 0.12];
      for (var g = 0; g < glow.length; g++) {
        ctx.fillStyle = MAGENTA;
        ctx.globalAlpha = sa * gal[g] * (1 + flash);
        ctx.beginPath(); ctx.arc(cx, cy, R * glow[g], 0, Math.PI * 2); ctx.fill();
      }
      // body
      ctx.fillStyle = MAGENTA;
      ctx.globalAlpha = sa * (0.82 + flash * 0.18);
      ctx.beginPath(); ctx.arc(cx, cy, R * 0.82, 0, Math.PI * 2); ctx.fill();
      // interior swirl streaks, clipped to the sphere
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, R * 0.82, 0, Math.PI * 2); ctx.clip();
      var streaks = 7;
      for (var k = 0; k < streaks; k++) {
        var sa0 = ang + k * (Math.PI * 2 / streaks) + Math.sin(k * 7.7) * 0.4;
        var spts = spiralPoints(cx, cy, R * 0.05, R * 0.85, sa0, 3.4, 22);
        if (k % 3 === 0) {
          ctx.strokeStyle = ORBCORE;
          ctx.globalAlpha = sa * 0.85;
          ctx.lineWidth = Math.max(1, R * 0.10);
        } else {
          ctx.strokeStyle = BLACK;
          ctx.globalAlpha = sa * 0.22;
          ctx.lineWidth = Math.max(1, R * 0.16);
        }
        strokePts(spts);
      }
      ctx.restore();
      // hot core
      ctx.fillStyle = ORBCORE;
      ctx.globalAlpha = sa * (0.55 + flash * 0.45);
      ctx.beginPath(); ctx.arc(cx, cy, R * 0.20, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // ---- detonation flash ----
    if (flash > 0.02) {
      ctx.fillStyle = ORBCORE;
      ctx.globalAlpha = flash * 0.85;
      ctx.beginPath(); ctx.arc(cx, cy, R * (1.3 + (1 - flash) * 0.7), 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = MAGENTA;
      ctx.globalAlpha = flash * 0.35;
      ctx.beginPath(); ctx.arc(cx, cy, R * 2.3, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawTerrain(t);
    drawFigure();
    drawOrb(t);
  }

  // ---------- simulation step ----------
  function step(dt) {
    simTime += dt;
    // heal the terrain: exponential decay, near-clean in ~20 s
    var decay = Math.exp(-dt / 6.5);
    for (var i = 0; i < damage.length; i++) damage[i] *= decay;
    // deferred tap fires as a churn once the double-tap window passes
    if (pendingTap && simTime - pendingTap.t > 0.35) {
      churnEvents.push(pendingTap.t);
      if (churnEvents.length > 12) churnEvents.shift();
      pendingTap = null;
    }
    // orb bias toward the damage centroid (smoothed state)
    var stats = computeDamageStats();
    var tx = 0, ty = 0;
    if (stats) {
      var pull = Math.min(1, meanDamage * 26);
      tx = (stats.x - 0.55) * W * 0.55 * pull;
      ty = (stats.y - 0.30) * H * 0.55 * pull;
    }
    var k = 1 - Math.exp(-dt / 2.2);
    biasX += (tx - biasX) * k;
    biasY += (ty - biasY) * k;
    pushAudio();
  }

  // ---------- pointer ----------
  function posOf(e) {
    var r = null;
    try { r = canvas.getBoundingClientRect(); } catch (err) { r = null; }
    if (r && r.width) return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
    return { x: e.clientX || 0, y: e.clientY || 0 };
  }
  function onDown(e) {
    initAudio();
    if (AC && AC.resume) { try { AC.resume(); } catch (err) { /* ignore */ } }
    var p = posOf(e);
    pointerDown = true;
    downTime = simTime; downX = lastX = p.x; downY = lastY = p.y; dragDist = 0;
    if (e && e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!pointerDown) return;
    var p = posOf(e);
    var dx = p.x - lastX, dy = p.y - lastY;
    var segLen = Math.sqrt(dx * dx + dy * dy);
    dragDist += segLen;
    // write damage along the segment
    var steps = Math.max(1, Math.ceil(segLen / (W / DG)));
    for (var i = 0; i <= steps; i++) {
      var f = i / steps;
      addDamage((lastX + dx * f) / W, (lastY + dy * f) / H, 0.34, 1.9);
    }
    lastX = p.x; lastY = p.y;
    if (e && e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    if (!pointerDown) return;
    pointerDown = false;
    var held = simTime - downTime;
    if (held < 0.3 && dragDist < Math.min(W, H) * 0.02) {
      // a tap (or the second half of a double-tap)
      if (pendingTap && simTime - pendingTap.t <= 0.35) {
        pendingTap = null;
        detonateEvents.push(simTime);
        if (detonateEvents.length > 6) detonateEvents.shift();
        for (var i = 0; i < damage.length; i++) damage[i] = Math.min(1, damage[i] + 0.8);
        boom();
      } else {
        pendingTap = { t: simTime };
      }
    }
    if (e && e.preventDefault) e.preventDefault();
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(simTime); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { resize(); draw(simTime); });
    }
  }

  // ---------- go ----------
  resize();
  draw(0); // frame one: the quiet hillside, damage zero, orb diffuse
  var lastNow = -1;
  function frame(now) {
    if (lastNow < 0) lastNow = now;
    var dt = (now - lastNow) / 1000;
    lastNow = now;
    if (dt > 0.05) dt = 0.05;
    if (dt > 0) { step(dt); draw(simTime); }
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
})();
</script>
