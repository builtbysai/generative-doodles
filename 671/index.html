<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Held and Shaped — No.671</title>
<!-- phantom-fill-8953 -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#101013; }
  canvas { display:block; width:100vw; height:100dvh; }
  .ui {
    position:fixed; left:0; right:0; bottom:0; padding:14px 18px 16px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color:#ece7db; pointer-events:none; user-select:none;
  }
  .roles { display:flex; justify-content:space-between; margin-bottom:10px; }
  .roles div { width:50%; font-size:11px; letter-spacing:.22em; text-transform:uppercase; }
  .roles div:first-child { text-align:left; }
  .roles div:last-child { text-align:right; }
  .roles .job { opacity:.9; }
  .roles .held { opacity:.45; }
  .bar { height:2px; background:rgba(236,231,219,.18); position:relative; }
  .bar i { display:block; height:100%; background:#ece7db; width:0%; }
  .foot { display:flex; justify-content:space-between; margin-top:8px;
    font-size:11px; letter-spacing:.18em; }
  .foot .t { text-transform:uppercase; letter-spacing:.28em; opacity:.9; }
  .foot .n { opacity:.45; }
  .divider {
    position:fixed; top:0; bottom:0; left:50%; width:1px;
    background:rgba(236,231,219,.22); pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="divider"></div>
<div class="ui">
  <div class="roles">
    <div id="roleL"><span class="job">pulse holds</span> &middot; <span class="held">colour shapes</span></div>
    <div id="roleR"><span class="job">colour holds</span> &middot; <span class="held">pulse shapes</span></div>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="foot"><span class="t">Held and Shaped</span><span class="n" id="count">No. 671 &middot; trade in 24s</span></div>
</div>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const roleL = document.getElementById('roleL');
  const roleR = document.getElementById('roleR');
  const prog = document.getElementById('prog');
  const count = document.getElementById('count');
  let W, H, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // Trade interval: 24s. ?swap=N overrides it (for testing the swap).
  const params = new URLSearchParams(location.search);
  const SWAP = Math.max(1, parseFloat(params.get('swap')) || 24) * 1000;
  const T0 = performance.now();

  const HOLD_HUE = 38; // the held colour: deep amber
  const DOTS = 72;

  function phaseAt(t) {
    const elapsed = t - T0;
    return {
      cycle: Math.floor(elapsed / SWAP) % 2,   // 0 or 1: who holds what
      frac: (elapsed % SWAP) / SWAP,           // progress through the 24s
      left: Math.ceil(SWAP - (elapsed % SWAP)) / 1000
    };
  }

  // One material: a ring of 72 dots. How it behaves depends on the job.
  // "Pulse holds": steady metronome, fixed radius; colour sweeps the wheel.
  // "Pulse shapes": the beat stretches the ring — it breathes, elongates,
  // scatters and regathers; the beat itself speeds and slows.
  function drawPanel(cx, cy, R, t, pulseHolds) {
    const beat = (t / 1000) % 1; // one beat per second
    if (pulseHolds) {
      // Steady ring, steady beat; colour does all the shaping.
      const hue = (t * 0.02) % 360;
      for (let i = 0; i < DOTS; i++) {
        const a = (i / DOTS) * Math.PI * 2;
        const r = R * (1 + Math.sin(beat * Math.PI * 2) * 0.02);
        const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
        const h = (hue + i * 2.2) % 360;
        ctx.fillStyle = 'hsla(' + h.toFixed(0) + ',72%,62%,0.95)';
        ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2); ctx.fill();
      }
      // The held pulse: a thin ring expanding once per second, always on time.
      ctx.strokeStyle = 'rgba(236,231,219,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, R * (0.35 + beat * 0.85), 0, Math.PI * 2); ctx.stroke();
    } else {
      // Colour held at amber; the pulse stretches and kneads the ring.
      const slow = t * 0.00035;
      const stretch = 1 + Math.sin(slow * Math.PI * 2) * 0.35; // ellipse breath
      const scatter = Math.max(0, Math.sin(slow * Math.PI * 4)) * 14;
      const wob = Math.sin(t * 0.0016) * 0.5 + 0.5;           // beat drift
      for (let i = 0; i < DOTS; i++) {
        const a = (i / DOTS) * Math.PI * 2;
        const wobble = Math.sin(a * 3 + t * 0.0012) * scatter;
        const r = R * (1 + Math.sin(beat * Math.PI * 2 + wob) * 0.06) + wobble;
        const x = cx + Math.cos(a) * r * stretch;
        const y = cy + Math.sin(a) * r / Math.sqrt(stretch);
        const l = 52 + Math.sin(a * 2 + t * 0.0008) * 14; // lightness, not hue
        ctx.fillStyle = 'hsla(' + HOLD_HUE + ',78%,' + l.toFixed(0) + '%,0.95)';
        ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2); ctx.fill();
      }
      // The shaping pulse: a breathing halo, never the same twice.
      ctx.strokeStyle = 'hsla(' + HOLD_HUE + ',78%,60%,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(cx, cy, R * 1.25 * stretch, R * 1.25 / Math.sqrt(stretch), 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  let lastCycle = -1;
  function frame(ts) {
    const ph = phaseAt(ts);
    ctx.fillStyle = '#101013';
    ctx.fillRect(0, 0, W, H);

    const R = Math.min(W / 2, H) * 0.32;
    const cy = H * 0.46;
    const leftPulseHolds = ph.cycle === 0;
    drawPanel(W * 0.25, cy, R, ts, leftPulseHolds);
    drawPanel(W * 0.75, cy, R, ts, !leftPulseHolds);

    // Labels follow the trade.
    if (ph.cycle !== lastCycle) {
      lastCycle = ph.cycle;
      if (ph.cycle === 0) {
        roleL.innerHTML = '<span class="job">pulse holds</span> &middot; <span class="held">colour shapes</span>';
        roleR.innerHTML = '<span class="job">colour holds</span> &middot; <span class="held">pulse shapes</span>';
      } else {
        roleL.innerHTML = '<span class="job">colour holds</span> &middot; <span class="held">pulse shapes</span>';
        roleR.innerHTML = '<span class="job">pulse holds</span> &middot; <span class="held">colour shapes</span>';
      }
    }
    prog.style.width = (ph.frac * 100).toFixed(1) + '%';
    count.textContent = 'No. 671 · trade in ' + Math.ceil(ph.left) + 's';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
