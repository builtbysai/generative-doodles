<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Santamaska</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #EFE7D2; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // No.671 "Santamaska" (EXPANSION #81 jose-perez-de-arce, block 7).
  // His 1997 engraving SANTAMANASKA as a living mask: one strictly
  // symmetric frontal face that never changes its geometry or its
  // expression. Only the line grammar changes. At the Nasca pole the
  // face is a dozen bold strokes, "simplicidad extraordinaria", with
  // one cinnabar line. At the Santamaria pole the same face fills
  // with fine interlaced linework, "locura de las figuras". A grammar
  // parameter g drifts between the poles on a 40 s loop, dwelling at
  // each end. Watch-only: a mask is beheld.

  var PAPER = '#EFE7D2';
  var INK = '#191713';
  var CINNABAR = '#B33A2B';
  var CHARCOAL = '#2E2A26';

  // Composition space: a square field, face centered on the axis
  // x = 0.5, spanning y 0.205 to 0.788 (about 60 percent of height).
  var FW = 1.0, FH = 1.0;
  var AXIS = 0.5;
  var BASE_SEED = 671001;
  var LOOP = 40; // seconds, Nasca to Santamaria and back

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(a, b, v) { var t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
  function lerp(a, b, t) { return a + (b - a) * t; }

  // ------------------------------------------------------------------
  // THE FACE. Each feature is authored ONCE, for the right half, as
  // cubic bezier segments in composition units. The left half is the
  // exact mirror (x -> 1 - x), so bilateral symmetry holds by
  // construction, not by eye. Features that lie on the axis itself
  // (nose bridge) are marked mirror:false and drawn once. A small
  // seeded jitter touches the authored points before mirroring, so
  // the jitter is symmetric too.
  // ------------------------------------------------------------------
  var FEATURES = [
    { name: 'outline', mirror: true, boldW: 0.0074, fils: 7, step: 0.0050, hooks: 5,
      segs: [
        [[0.500, 0.205], [0.635, 0.208], [0.712, 0.295], [0.718, 0.425]],
        [[0.718, 0.425], [0.721, 0.475], [0.688, 0.555], [0.657, 0.638]],
        [[0.657, 0.638], [0.638, 0.705], [0.568, 0.772], [0.500, 0.788]]
      ] },
    { name: 'hairline', mirror: true, boldW: 0.0062, fils: 4, step: 0.0045, hooks: 3,
      segs: [
        [[0.500, 0.248], [0.575, 0.238], [0.648, 0.268], [0.678, 0.318]]
      ] },
    { name: 'brow', mirror: true, boldW: 0.0068, fils: 3, step: 0.0040, hooks: 2,
      segs: [
        [[0.528, 0.388], [0.568, 0.362], [0.622, 0.360], [0.652, 0.380]]
      ] },
    { name: 'eyeUpper', mirror: true, boldW: 0.0058, fils: 3, step: 0.0035, hooks: 1,
      segs: [
        [[0.543, 0.436], [0.578, 0.417], [0.618, 0.416], [0.643, 0.434]]
      ] },
    { name: 'eyeLower', mirror: true, boldW: 0.0052, fils: 3, step: 0.0035, hooks: 1,
      segs: [
        [[0.546, 0.447], [0.580, 0.460], [0.616, 0.460], [0.640, 0.446]]
      ] },
    { name: 'noseBridge', mirror: false, boldW: 0.0058, fils: 3, step: 0.0055, hooks: 2,
      segs: [
        [[0.500, 0.452], [0.503, 0.492], [0.503, 0.518], [0.500, 0.550]]
      ] },
    { name: 'noseWing', mirror: true, boldW: 0.0058, fils: 3, step: 0.0035, hooks: 2,
      segs: [
        [[0.500, 0.556], [0.524, 0.574], [0.540, 0.576], [0.554, 0.562]]
      ] },
    { name: 'lipUpper', mirror: true, accent: true, boldW: 0.0072, fils: 4, step: 0.0038, hooks: 2,
      segs: [
        [[0.500, 0.636], [0.524, 0.622], [0.552, 0.624], [0.576, 0.640]]
      ] },
    { name: 'lipLower', mirror: true, boldW: 0.0062, fils: 4, step: 0.0038, hooks: 2,
      segs: [
        [[0.500, 0.664], [0.530, 0.674], [0.556, 0.664], [0.575, 0.643]]
      ] },
    { name: 'ear', mirror: true, boldW: 0.0052, fils: 2, step: 0.0040, hooks: 1,
      segs: [
        [[0.712, 0.468], [0.729, 0.486], [0.728, 0.512], [0.709, 0.524]]
      ] },
    { name: 'chinMark', mirror: true, boldW: 0.0052, fils: 2, step: 0.0035, hooks: 1,
      segs: [
        [[0.500, 0.706], [0.522, 0.714], [0.540, 0.712], [0.552, 0.700]]
      ] },
    { name: 'cheekMark', mirror: true, boldW: 0.0052, fils: 3, step: 0.0040, hooks: 2,
      segs: [
        [[0.606, 0.516], [0.632, 0.540], [0.646, 0.566], [0.650, 0.592]]
      ] }
  ];
  // The iris is a ring feature, handled beside the bezier features.
  var IRIS = { c: [0.593, 0.438], r: 0.0165 };

  // ------------------------------------------------------------------
  // Geometry building. Runs once, from the seed. Everything drawn
  // later is a pure function of these point lists and the clock.
  // ------------------------------------------------------------------
  function sampleSegs(segs, stepsPerSeg) {
    var pts = [];
    for (var s = 0; s < segs.length; s++) {
      var g = segs[s], p0 = g[0], c1 = g[1], c2 = g[2], p1 = g[3];
      var n = stepsPerSeg;
      for (var i = (s === 0 ? 0 : 1); i <= n; i++) {
        var t = i / n, u = 1 - t;
        pts.push([
          u * u * u * p0[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * p1[0],
          u * u * u * p0[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * p1[1]
        ]);
      }
    }
    return pts;
  }
  function normalsOf(pts) {
    var ns = [];
    for (var i = 0; i < pts.length; i++) {
      var a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      var dx = b[0] - a[0], dy = b[1] - a[1];
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      ns.push([-dy / len, dx / len]);
    }
    return ns;
  }

  var rng = mulberry32(BASE_SEED);
  var built = []; // per feature: {def, base, filaments:[{pts,birth}], hooks:[{pts,birth}]}
  for (var fi = 0; fi < FEATURES.length; fi++) {
    var def = FEATURES[fi];
    // Symmetric seeded jitter on the authored control points.
    var segs = def.segs.map(function (sg) {
      return sg.map(function (p) {
        var jx = (rng() - 0.5) * 0.005, jy = (rng() - 0.5) * 0.005;
        return [p[0] === AXIS ? AXIS : p[0] + jx, p[1] + jy];
      });
    });
    var base = sampleSegs(segs, 18);
    var nrm = normalsOf(base);
    var F = def.fils, filaments = [];
    for (var j = 0; j < F; j++) {
      var off = (j - (F - 1) / 2) * def.step;
      var wobAmp = 0.0011 + rng() * 0.0007;
      var wobTurns = 3 + Math.floor(rng() * 4);
      var wobPhase = rng() * Math.PI * 2;
      var pts = base.map(function (p, i) {
        var u = i / (base.length - 1);
        var w = off + wobAmp * Math.sin(u * wobTurns * Math.PI * 2 + wobPhase);
        return [p[0] + nrm[i][0] * w, p[1] + nrm[i][1] * w];
      });
      var birth = F === 1 ? 0.3 : clamp(0.12 + 0.55 * (j / (F - 1)) + rng() * 0.08, 0, 0.78);
      filaments.push({ pts: pts, birth: birth });
    }
    // Interlace hooks: short bowed connectors stapling neighbour
    // filaments together, the knot-work of the Santamaria grammar.
    var hooks = [];
    if (F > 1) {
      var stepIdx = Math.max(2, Math.round(base.length * 0.07));
      for (var h = 0; h < def.hooks; h++) {
        var fa = Math.floor(rng() * (F - 1));
        var idx = 2 + Math.floor(rng() * (base.length - 4 - stepIdx));
        var pA = filaments[fa].pts[idx];
        var pB = filaments[fa + 1].pts[idx + stepIdx];
        var mid = [(pA[0] + pB[0]) / 2 + nrm[idx][0] * 0.0038,
                   (pA[1] + pB[1]) / 2 + nrm[idx][1] * 0.0038];
        var hp = [];
        for (var k = 0; k <= 5; k++) {
          var tt = k / 5, uu = 1 - tt;
          hp.push([uu * uu * pA[0] + 2 * uu * tt * mid[0] + tt * tt * pB[0],
                   uu * uu * pA[1] + 2 * uu * tt * mid[1] + tt * tt * pB[1]]);
        }
        hooks.push({ pts: hp, birth: 0.45 + rng() * 0.45 });
      }
    }
    built.push({ def: def, base: base, filaments: filaments, hooks: hooks });
  }
  // Iris filament rings: two extra rings inside and outside the bold one.
  var irisRings = [
    { r: IRIS.r * 1.42, birth: 0.34 },
    { r: IRIS.r * 0.60, birth: 0.52 }
  ];

  // ------------------------------------------------------------------
  // Layout (Visual Viewport API, resize listeners on both)
  // ------------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;
  var scale = 1, orgX = 0, orgY = 0;

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr) isPhone = Math.min(scr.width, scr.height) < 700;
    else isPhone = h > w * 1.15;
    scale = Math.min(W / FW, H / FH) * 0.97;
    orgX = (W - FW * scale) / 2;
    orgY = (H - FH * scale) / 2;
  }
  function px(x) { return orgX + x * scale; }
  function py(y) { return orgY + y * scale; }

  function strokePts(pts, wComp, color, alpha, mirror) {
    if (alpha <= 0.004) return;
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(0.7, wComp * scale);
    ctx.beginPath();
    ctx.moveTo(px(pts[0][0]), py(pts[0][1]));
    for (var i = 1; i < pts.length; i++) ctx.lineTo(px(pts[i][0]), py(pts[i][1]));
    ctx.stroke();
    if (mirror) {
      ctx.beginPath();
      ctx.moveTo(px(1 - pts[0][0]), py(pts[0][1]));
      for (var j = 1; j < pts.length; j++) ctx.lineTo(px(1 - pts[j][0]), py(pts[j][1]));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  function strokeRing(c, r, wComp, color, alpha, mirror) {
    if (alpha <= 0.004) return;
    ctx.strokeStyle = color;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = Math.max(0.7, wComp * scale);
    ctx.beginPath();
    ctx.arc(px(c[0]), py(c[1]), r * scale, 0, Math.PI * 2);
    ctx.stroke();
    if (mirror) {
      ctx.beginPath();
      ctx.arc(px(1 - c[0]), py(c[1]), r * scale, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  function fillDot(c, r, color, alpha, mirror) {
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(px(c[0]), py(c[1]), Math.max(0.7, r * scale), 0, Math.PI * 2);
    ctx.fill();
    if (mirror) {
      ctx.beginPath();
      ctx.arc(px(1 - c[0]), py(c[1]), Math.max(0.7, r * scale), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------
  // The grammar parameter. g ping-pongs 0 -> 1 -> 0 over the loop;
  // the sine term flattens the ends of the sweep so the mask dwells
  // a few seconds near each pole (slope 0.1 at the poles, 1.9 mid).
  // ------------------------------------------------------------------
  function grammar(t) {
    var p = (t % LOOP) / LOOP;
    var raw = p < 0.5 ? p * 2 : 2 - 2 * p;
    return raw - (0.9 / (2 * Math.PI)) * Math.sin(2 * Math.PI * raw);
  }

  function drawMask(g) {
    var boldA = 1 - 0.88 * smooth(0.30, 0.85, g);   // bold skeleton fades to a ghost
    var cinnA = 1 - smooth(0.15, 0.55, g);          // cinnabar belongs to Nasca only
    var b, f, e;
    // Bold grammar (Nasca): the essential strokes.
    for (b = 0; b < built.length; b++) {
      var bf = built[b];
      if (bf.def.accent) strokePts(bf.base, bf.def.boldW, CINNABAR, cinnA, bf.def.mirror);
      else strokePts(bf.base, bf.def.boldW, INK, boldA, bf.def.mirror);
    }
    strokeRing(IRIS.c, IRIS.r, 0.0052, INK, boldA, true);
    fillDot(IRIS.c, IRIS.r * 0.36, INK, 0.88, true); // the gaze never changes
    // Fine grammar (Santamaria): filaments and interlace hooks fade
    // in element by element as g rises, so strokes multiply rather
    // than jump.
    for (b = 0; b < built.length; b++) {
      var ff = built[b];
      for (f = 0; f < ff.filaments.length; f++) {
        var fil = ff.filaments[f];
        var fa = smooth(fil.birth, fil.birth + 0.22, g) * 0.92;
        strokePts(fil.pts, 0.0016, CHARCOAL, fa, ff.def.mirror);
      }
      for (e = 0; e < ff.hooks.length; e++) {
        var hk = ff.hooks[e];
        var ha = smooth(hk.birth, hk.birth + 0.2, g) * 0.9;
        strokePts(hk.pts, 0.0014, CHARCOAL, ha, ff.def.mirror);
      }
    }
    for (var r = 0; r < irisRings.length; r++) {
      var ra = smooth(irisRings[r].birth, irisRings[r].birth + 0.22, g) * 0.92;
      strokeRing(IRIS.c, irisRings[r].r, 0.0016, CHARCOAL, ra, true);
    }
  }

  // QA hooks: "seed=tNN" freezes the clock at NN seconds; "seed=g1"
  // forces the Santamaria pole, "seed=g0" the Nasca pole.
  var forcedT = -1, forcedG = -1;
  try {
    var qs = String((typeof location !== 'undefined' && location.search) || '');
    var mt = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(qs);
    if (mt) forcedT = parseFloat(mt[1]);
    var mg = /[?&]seed=g([01])/.exec(qs);
    if (mg) forcedG = parseInt(mg[1], 10);
  } catch (e) { forcedT = -1; forcedG = -1; }

  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (forcedT >= 0) return forcedT;
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - t0) / 1000;
    return 0;
  }

  function draw(nowOverride) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    var t = (typeof nowOverride === 'number') ? nowOverride : elapsed();
    var g = forcedG >= 0 ? forcedG : grammar(t);
    drawMask(g);
  }

  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
    }
  }

  resize();
  draw(0); // frame one: synchronous draw at the constant phase (g = 0)

  if (typeof requestAnimationFrame === 'function' && forcedT < 0 && forcedG < 0) {
    var loop = function () { draw(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
