<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chants d'Est: The Road East to West</title>
<style>
  html, body { margin: 0; padding: 0; background: #2a2a30; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var CHARCOAL = '#2a2a30';
  var CREAM = '#e8e0d0';
  var GREEN = '#2f4636';
  var GREY = '#b8bcc0';
  var GOLD = '#d9a441';
  var BRICK = '#a8674a';
  var WALNUT = '#6b4a3a';

  var LOOP = 48;
  var SEED = 1506000;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function r4(x) {
    return Math.round(x * 10000) / 10000;
  }

  function clamp(x, lo, hi) {
    if (x < lo) { return lo; }
    if (x > hi) { return hi; }
    return x;
  }

  function smoothstep(a, b, x) {
    var t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  }

  var W = 0, H = 0, lastT = 0;
  var drags = [];
  var active = null;

  function viewport() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined') {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = 1280; h = 720; }
    return { w: w, h: h };
  }

  function isPhone() {
    if (typeof window !== 'undefined' && window.screen) {
      var m = Math.min(window.screen.width, window.screen.height);
      if (m < 700) { return true; }
    }
    return H > W * 1.15;
  }

  function roadY(x) {
    return H * 0.5 + H * 0.02 * Math.sin((x / W) * Math.PI * 3);
  }

  function roadHalf() {
    return H * 0.035;
  }

  function interpX(moves, t) {
    var x = moves[0].x;
    var i;
    for (i = 0; i < moves.length; i++) {
      if (moves[i].t <= t) { x = moves[i].x; } else { break; }
    }
    return x;
  }

  function dotMargin() {
    return Math.max(12, W * 0.02);
  }

  function dotXFromP(p) {
    var m = dotMargin();
    return m + p * (W - 2 * m);
  }

  function pFromDotX(x) {
    var m = dotMargin();
    return clamp((x - m) / (W - 2 * m), 0, 1);
  }

  function phaseAt(t) {
    var anchorT = 0, anchorPhase = 0;
    var i;
    for (i = 0; i < drags.length; i++) {
      var d = drags[i];
      if (t < d.ts) { break; }
      if (t <= d.te) {
        return d.k + pFromDotX(interpX(d.moves, t) + d.grab);
      }
      anchorT = d.te;
      anchorPhase = d.k + pFromDotX(d.x1 + d.grab);
    }
    if (active && t >= active.ts) {
      return active.k + pFromDotX(active.xCur + active.grab);
    }
    return anchorPhase + (t - anchorT) / LOOP;
  }

  function weightsAt(p) {
    var wf = 1 - smoothstep(0.22, 0.48, p);
    var wt = smoothstep(0.52, 0.78, p);
    var wfi = 1 - wf - wt;
    return { forest: r4(wf), field: r4(wfi), town: r4(wt) };
  }

  function dotXAt(t) {
    var ph = phaseAt(t);
    var p = ph - Math.floor(ph);
    return dotXFromP(p);
  }

  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }

  function disc(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function tri(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w / 2, y - h);
    ctx.lineTo(x + w, y);
    ctx.closePath();
    ctx.fill();
  }

  function drawForest(loopIndex) {
    var rng = mulberry32(SEED + 11);
    var rngL = mulberry32(SEED + loopIndex * 7919 + 11);
    var u = Math.min(W, H);
    rect(0, 0, W, H, CHARCOAL);
    var i, x, y, s;
    for (i = 0; i < 12; i++) {
      x = rng() * W + (rngL() - 0.5) * 0.01 * u;
      y = rng() * H + (rngL() - 0.5) * 0.01 * u;
      s = (0.03 + rng() * 0.05) * u;
      disc(x, y, s, GREY);
    }
    var n = 16;
    for (i = 0; i < n; i++) {
      x = rng() * W;
      var above = rng() < 0.5;
      var base = above ? roadY(x) - roadHalf() - 2 : H * (0.90 + rng() * 0.08);
      var th = (0.07 + rng() * 0.09) * H;
      var tw = (0.03 + rng() * 0.02) * W;
      tri(x - tw / 2, base, tw, th * 0.45, GREEN);
      tri(x - tw * 0.42, base - th * 0.30, tw * 0.84, th * 0.45, GREEN);
      tri(x - tw * 0.34, base - th * 0.60, tw * 0.68, th * 0.45, GREEN);
    }
  }

  function drawField(loopIndex) {
    var rng = mulberry32(SEED + 23);
    var rngL = mulberry32(SEED + loopIndex * 7919 + 23);
    var u = Math.min(W, H);
    rect(0, 0, W, H, GOLD);
    var i, y, h;
    for (i = 0; i < 10; i++) {
      y = rng() * H; h = (0.015 + rng() * 0.03) * H;
      rect(0, y, W, h, GREEN);
    }
    for (i = 0; i < 9; i++) {
      var x = rng() * W + (rngL() - 0.5) * 0.01 * u;
      y = rng() * H + (rngL() - 0.5) * 0.01 * u;
      disc(x, y, (0.012 + rng() * 0.012) * u, GREEN);
    }
  }

  function drawTown(loopIndex) {
    var rng = mulberry32(SEED + 37);
    var rngL = mulberry32(SEED + loopIndex * 7919 + 37);
    var u = Math.min(W, H);
    rect(0, 0, W, H, WALNUT);
    var i, x, w, h;
    for (i = 0; i < 12; i++) {
      x = rng() * W; w = (0.05 + rng() * 0.05) * W; h = (0.05 + rng() * 0.06) * H;
      if (rng() < 0.5) {
        tri(x, H * 0.30, w, h, BRICK);
      } else {
        tri(x, H, w, h, BRICK);
      }
    }
    for (i = 0; i < 22; i++) {
      x = rng() * W + (rngL() - 0.5) * 0.01 * u;
      var yy = rng() < 0.5 ? rng() * H * 0.30 : H * 0.70 + rng() * H * 0.30;
      yy += (rngL() - 0.5) * 0.01 * u;
      rect(x, yy, Math.max(3, W * 0.008), Math.max(3, H * 0.012), GOLD);
    }
  }

  function draw(t) {
    lastT = t;
    var ph = phaseAt(t);
    var loopIndex = Math.floor(ph);
    var p = ph - loopIndex;
    var w = weightsAt(p);
    var u = Math.min(W, H);

    drawForest(loopIndex);
    ctx.globalAlpha = w.field;
    drawField(loopIndex);
    ctx.globalAlpha = w.town;
    drawTown(loopIndex);
    ctx.globalAlpha = 1;

    var rh = roadHalf();
    ctx.fillStyle = CREAM;
    ctx.beginPath();
    var sx;
    ctx.moveTo(0, roadY(0) - rh);
    for (sx = 0; sx <= W; sx += 8) {
      ctx.lineTo(sx, roadY(sx) - rh);
    }
    for (sx = W; sx >= 0; sx -= 8) {
      ctx.lineTo(sx, roadY(sx) + rh);
    }
    ctx.closePath();
    ctx.fill();

    var dx = dotXFromP(p);
    var dy = roadY(dx);
    disc(dx, dy, Math.max(5, u * 0.014), GOLD);
    disc(dx, dy, Math.max(3.5, u * 0.009), CHARCOAL);
  }

  function pointerPos(e) {
    var x = 0, y = 0;
    if (typeof e.clientX === 'number') { x = e.clientX; }
    if (typeof e.clientY === 'number') { y = e.clientY; }
    return { x: x, y: y };
  }

  function onDown(e) {
    var pos = pointerPos(e);
    var dx = dotXAt(lastT);
    var dy = roadY(dx);
    var grabR = Math.max(60, Math.min(W, H) * 0.08);
    var ddx = pos.x - dx, ddy = pos.y - dy;
    if (ddx * ddx + ddy * ddy <= grabR * grabR) {
      active = {
        ts: lastT, k: Math.floor(phaseAt(lastT)),
        grab: dx - pos.x, xCur: pos.x,
        moves: [{ t: lastT, x: pos.x }]
      };
    }
  }

  function onMove(e) {
    if (!active) { return; }
    var pos = pointerPos(e);
    active.xCur = pos.x;
    active.moves.push({ t: lastT, x: pos.x });
  }

  function onUp(e) {
    if (!active) { return; }
    var pos = pointerPos(e);
    active.xCur = pos.x;
    active.moves.push({ t: lastT, x: pos.x });
    drags.push({
      ts: active.ts, te: lastT, k: active.k, grab: active.grab,
      moves: active.moves, x1: pos.x
    });
    active = null;
  }

  function resize() {
    var v = viewport();
    W = v.w; H = v.h;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (typeof document !== 'undefined' && document.body) {
      document.body.style.background = CHARCOAL;
    }
    draw(lastT);
  }

  if (typeof window !== 'undefined' && window.__piece === undefined) {
    window.__piece = {
      drawAt: draw, phaseAt: phaseAt, weightsAt: weightsAt, dotXAt: dotXAt,
      down: onDown, move: onMove, up: onUp,
      getLastT: function () { return lastT; },
      setLastT: function (v) { lastT = v; }
    };
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    if (window.addEventListener) {
      window.addEventListener('resize', resize);
    }
  }

  resize();
  draw(0);

  if (typeof requestAnimationFrame === 'function') {
    var startTime = null;
    var loopFn = function (ts) {
      if (startTime === null) { startTime = ts; }
      draw((ts - startTime) / 1000);
      requestAnimationFrame(loopFn);
    };
    requestAnimationFrame(loopFn);
  }
})();
</script>
</body>
</html>
