<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1967 Green Room, 4-Track</title>
<style>
  html, body { margin: 0; padding: 0; background: #8f9296; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Green Room, 4-Track, CW8 / PP1214, study #256 caius-williams.
  // A quiet rehearsal room: a double bass leaning against a
  // padded soundproof wall, a covered piano, a small table with
  // a 4-track cassette recorder, cables, a backpack, a red rug.
  // The recorder's reels turn; short solo bass fragments play
  // back, loop, and are punched over. The room is empty; the
  // work continues without a player. Watch-only.
  var WALL = '#8f9296';   // padded-wall gray
  var WALLD = '#7e8185';  // quilt lines, darker gray
  var WALLL = '#9aa0a3';  // quilt highlight gray
  var FLOOR = '#6f6a63';  // floor, warm gray brown
  var RUG = '#a33327';    // rug red
  var RUGB = '#7e2418';   // rug border, deep red
  var CREAM = '#efe6d0';  // cassette cream
  var CREAMD = '#d9cdb2'; // cream shadow
  var INK = '#1f1d1a';    // ink, near black
  var BASS = '#4a3423';   // double bass, dark brown
  var BASSL = '#6b4a2f';  // bass highlight brown
  var WOOD = '#5a4632';   // table wood
  var CLOTH = '#7c8272';  // piano cover, sage gray
  var PACK = '#4c4a38';   // backpack, dark olive
  var LED = '#ff8c2e';    // VU LEDs, warm orange
  var LEDHOT = '#ffb347'; // VU hot segment
  var RECL = '#c22e1f';   // record lamp red

  // Fixed-phase first frame: FIRST_T = 14 s. At t = 14 the room
  // is mid-session: track 3 was punched over at t = 12, so its
  // new take is 2 s in, its PUNCH lamp still lit, its take
  // counter already reading 2. Tracks 1 and 2 are mid-loop on
  // older takes. The reels have turned 14 s from the start.
  var FIRST_T = 14;
  var SEED = 1967;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and fixed salts, so every frame is a pure
  // function of t.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  var L = {};
  function layout() {
    var u = Math.min(W, H);
    L.u = u;
    L.floorY = H * 0.66;
    L.sideX = Math.max(14, W * 0.045);
    // Bass leans left, body centre left of centre. On phones the
    // bass is sized from the width so it keeps its presence on
    // the tall sheet instead of shrinking to two small balls.
    L.bassX = W * 0.20;
    L.bassY = H * 0.42;
    L.bassH = isPhone ? W * 0.95 : H * 0.40;
    L.bassW = isPhone ? W * 0.30 : W * 0.15;
    // Covered piano, back right, behind the table.
    L.pianoX0 = W * 0.80; L.pianoX1 = W * 1.01;
    L.pianoY0 = H * 0.30; L.pianoY1 = H * 0.63;
    // Table centre-right, recorder on top. On phones both run
    // wider so the recorder's meters and lamps have room.
    L.tableX0 = isPhone ? W * 0.48 : W * 0.52;
    L.tableX1 = isPhone ? W * 0.99 : W * 0.88;
    L.tableTop = H * 0.60;
    L.recX0 = isPhone ? W * 0.50 : W * 0.55;
    L.recX1 = isPhone ? W * 0.97 : W * 0.85;
    L.recY0 = H * 0.42; L.recY1 = H * 0.60;
    // Rug, foreground.
    L.rugTop = H * 0.80; L.rugBot = H * 0.97;
    // Backpack near the wall, left of the table.
    L.packX = W * 0.40; L.packY = H * 0.60;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- 4-track schedule ---------------------------------------
  // Three bass fragments loop on tracks 1-3; track 4 is spare
  // and stays dark. Loop lengths 7, 9, 11 s. Each fragment is a
  // fixed set of seeded note positions inside its loop; the VU
  // level is the sum of gaussian note envelopes at the loop
  // phase, so the meters breathe with the bass line.
  var LOOP_LEN = [7, 9, 11, 0];
  var NOTES = [];
  (function () {
    var i, j;
    for (i = 0; i < 3; i++) {
      var rng = mulberry32(SEED * 13 + i * 7919 + 3);
      var notes = [];
      var n = 5 + i; // 5, 6, 7 notes per fragment
      for (j = 0; j < n; j++) {
        notes.push({ f: 0.06 + 0.88 * (j / n) + (rng() - 0.5) * 0.06, amp: 0.55 + rng() * 0.45 });
      }
      NOTES.push(notes);
    }
  })();

  // Punch-in schedule: punches at fixed times, alternating step
  // 8 / 9 s, cycling tracks 1, 3, 2. A punch lasts 3 s: the
  // PUNCH lamp lights, the take counter climbs, and the fragment
  // restarts from its beginning, so the new take is audible in
  // the VU pattern. Generated to t = 600 s.
  var PUNCHES = [];
  (function () {
    var t = 4, k = 0;
    var cyc = [0, 2, 1];
    while (t < 600) {
      PUNCHES.push({ t: t, track: cyc[k % 3] });
      t += (k % 2 === 0) ? 8 : 9;
      k++;
    }
  })();
  var PUNCH_LEN = 3;

  function lastPunchBefore(track, t) {
    var last = null, i;
    for (i = 0; i < PUNCHES.length; i++) {
      if (PUNCHES[i].track === track && PUNCHES[i].t <= t) { last = PUNCHES[i]; }
      if (PUNCHES[i].t > t) { break; }
    }
    return last;
  }
  function takeOf(track, t) {
    var n = 1, i;
    for (i = 0; i < PUNCHES.length; i++) {
      if (PUNCHES[i].t > t) { break; }
      if (PUNCHES[i].track === track) { n++; }
    }
    return n;
  }
  function activePunch(t) {
    var i;
    for (i = 0; i < PUNCHES.length; i++) {
      if (PUNCHES[i].t > t) { break; }
      if (t - PUNCHES[i].t < PUNCH_LEN) { return PUNCHES[i]; }
    }
    return null;
  }
  // VU level for a track at time t: note envelopes at the loop
  // phase measured from the last punch on that track, so a punch
  // restarts the fragment. During a punch the level is boosted
  // a little, the new take coming in hot.
  function vuLevel(track, t) {
    if (track === 3) { return 0; }
    var lp = lastPunchBefore(track, t);
    var start = lp ? lp.t : 0;
    var ph = ((t - start) % LOOP_LEN[track]) / LOOP_LEN[track];
    var notes = NOTES[track];
    var lv = 0, j;
    for (j = 0; j < notes.length; j++) {
      var d = ph - notes[j].f;
      lv += notes[j].amp * Math.exp(-(d * d) / (2 * 0.05 * 0.05));
    }
    var punch = activePunch(t);
    if (punch && punch.track === track) { lv *= 1.15; }
    return clamp(0.08 + lv, 0, 1);
  }
  // Take-up reel angle: steady spin plus an extra turn during
  // each punch window, a pure function of t.
  function reelAngle(t, fast) {
    var base = t * (fast ? 0.85 : 1.1);
    if (!fast) { return base; }
    var extra = 0, i;
    for (i = 0; i < PUNCHES.length; i++) {
      if (PUNCHES[i].t > t) { break; }
      extra += 0.85 * clamp(t - PUNCHES[i].t, 0, PUNCH_LEN);
    }
    return base + extra;
  }

  // ---- Room ----------------------------------------------------
  function drawWall(t) {
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, L.floorY);
    // Quilted padding: diagonal stitch lines both ways, with a
    // soft highlight offset, clipped to the wall.
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, L.floorY);
    ctx.clip();
    var s = W * 0.085;
    var i;
    ctx.strokeStyle = hexA(WALLD, a4(0.55));
    ctx.lineWidth = 1;
    for (i = -Math.ceil(L.floorY / s); i < Math.ceil(W / s) + Math.ceil(L.floorY / s); i++) {
      ctx.beginPath();
      ctx.moveTo(i * s, 0);
      ctx.lineTo(i * s + L.floorY, L.floorY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(i * s + L.floorY, 0);
      ctx.lineTo(i * s, L.floorY);
      ctx.stroke();
    }
    // Quilt buttons at every other intersection.
    ctx.fillStyle = hexA(WALLD, a4(0.7));
    var r, c;
    for (r = 0; r < Math.ceil(L.floorY / s); r++) {
      for (c = 0; c < Math.ceil(W / s) + 1; c++) {
        if ((r + c) % 2 !== 0) { continue; }
        var bx = c * s + (r % 2 ? s / 2 : 0);
        var by = r * s;
        ctx.beginPath();
        ctx.moveTo(bx + 2.5, by);
        ctx.arc(bx, by, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
    // Wall baseboard.
    ctx.fillStyle = hexA(INK, a4(0.25));
    ctx.fillRect(0, L.floorY - 6, W, 6);
  }

  function drawFloor(t) {
    ctx.fillStyle = FLOOR;
    ctx.fillRect(0, L.floorY, W, H - L.floorY);
    // Floorboard seams.
    ctx.strokeStyle = hexA(INK, a4(0.18));
    ctx.lineWidth = 1;
    var y;
    for (y = L.floorY + 26; y < H; y += 30) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
  }

  function drawRug(t) {
    var x0 = W * 0.30, x1 = W * 0.98, x0b = W * 0.26, x1b = W * 1.0;
    ctx.fillStyle = RUG;
    ctx.beginPath();
    ctx.moveTo(x0, L.rugTop);
    ctx.lineTo(x1, L.rugTop);
    ctx.lineTo(x1b, L.rugBot);
    ctx.lineTo(x0b, L.rugBot);
    ctx.closePath();
    ctx.fill();
    // Border: cream inner line and a deep red outer band.
    ctx.strokeStyle = RUGB;
    ctx.lineWidth = Math.max(2, H * 0.008);
    ctx.stroke();
    ctx.strokeStyle = hexA(CREAM, a4(0.75));
    ctx.lineWidth = Math.max(1, H * 0.003);
    ctx.beginPath();
    ctx.moveTo(x0 + 14, L.rugTop + 10);
    ctx.lineTo(x1 - 14, L.rugTop + 10);
    ctx.lineTo(x1b - 12, L.rugBot - 10);
    ctx.lineTo(x0b + 12, L.rugBot - 10);
    ctx.closePath();
    ctx.stroke();
    // Centre diamond motif, cream, low alpha.
    var cx = (x0 + x1) / 2 + W * 0.02, cy = (L.rugTop + L.rugBot) / 2;
    var dw = W * 0.075, dh = H * 0.035;
    ctx.strokeStyle = hexA(CREAM, a4(0.55));
    ctx.lineWidth = Math.max(1, H * 0.0025);
    ctx.beginPath();
    ctx.moveTo(cx, cy - dh);
    ctx.lineTo(cx + dw, cy);
    ctx.lineTo(cx, cy + dh);
    ctx.lineTo(cx - dw, cy);
    ctx.closePath();
    ctx.stroke();
  }

  function drawPiano(t) {
    // Covered piano at the back right: a draped grand shape in
    // sage cloth, folds running down, lid line across the top.
    ctx.fillStyle = CLOTH;
    ctx.beginPath();
    ctx.moveTo(L.pianoX0, L.pianoY1);
    ctx.lineTo(L.pianoX0 + W * 0.02, L.pianoY0 + H * 0.10);
    ctx.lineTo(L.pianoX0 + W * 0.10, L.pianoY0);
    ctx.lineTo(L.pianoX1, L.pianoY0 + H * 0.02);
    ctx.lineTo(L.pianoX1, L.pianoY1);
    ctx.closePath();
    ctx.fill();
    // Cloth folds: soft vertical curves.
    ctx.strokeStyle = hexA(INK, a4(0.22));
    ctx.lineWidth = Math.max(1, H * 0.002);
    var i;
    for (i = 0; i < 4; i++) {
      var fx = L.pianoX0 + W * (0.05 + i * 0.05);
      ctx.beginPath();
      ctx.moveTo(fx, L.pianoY0 + H * 0.06 + i * H * 0.008);
      ctx.bezierCurveTo(fx - W * 0.008, L.pianoY0 + H * 0.16, fx + W * 0.008, L.pianoY0 + H * 0.24, fx - W * 0.004, L.pianoY1 - H * 0.01);
      ctx.stroke();
    }
    // Lid seam across the top.
    ctx.strokeStyle = hexA(INK, a4(0.3));
    ctx.lineWidth = Math.max(1, H * 0.0025);
    ctx.beginPath();
    ctx.moveTo(L.pianoX0 + W * 0.02, L.pianoY0 + H * 0.10);
    ctx.lineTo(L.pianoX1, L.pianoY0 + H * 0.02);
    ctx.stroke();
  }

  function drawBass(t) {
    // Double bass leaning left against the wall. Two stacked
    // ellipses make the body, a tapered neck rises to the
    // scroll, four strings run down to the tailpiece. The whole
    // instrument is rotated a little, leaning on the wall.
    ctx.save();
    ctx.translate(L.bassX, L.bassY);
    ctx.rotate(-0.16);
    var h = L.bassH, w = L.bassW;
    // Endpin down to the floor.
    ctx.strokeStyle = BASS;
    ctx.lineWidth = Math.max(2, H * 0.004);
    ctx.beginPath();
    ctx.moveTo(0, h * 0.48);
    ctx.lineTo(W * 0.012, h * 0.52 + (L.floorY - L.bassY - h * 0.48));
    ctx.stroke();
    // Body: lower bout and upper bout, same fill so the seam
    // never shows.
    ctx.fillStyle = BASS;
    ctx.beginPath();
    ctx.moveTo(w * 0.50, h * 0.16);
    ctx.arc(0, h * 0.16, w * 0.50, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(w * 0.38, -h * 0.16);
    ctx.arc(0, -h * 0.16, w * 0.38, 0, Math.PI * 2);
    ctx.fill();
    // Body edge highlight.
    ctx.strokeStyle = hexA(BASSL, a4(0.8));
    ctx.lineWidth = Math.max(1, H * 0.002);
    ctx.beginPath();
    ctx.moveTo(-w * 0.46, h * 0.02);
    ctx.arc(0, h * 0.16, w * 0.50, Math.PI * 0.75, Math.PI * 1.25);
    ctx.stroke();
    // Neck and fingerboard, rising from the body top.
    ctx.fillStyle = BASS;
    ctx.beginPath();
    ctx.moveTo(-w * 0.07, -h * 0.30);
    ctx.lineTo(w * 0.07, -h * 0.30);
    ctx.lineTo(w * 0.045, -h * 0.52);
    ctx.lineTo(-w * 0.045, -h * 0.52);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(-w * 0.055, -h * 0.28);
    ctx.lineTo(w * 0.055, -h * 0.28);
    ctx.lineTo(w * 0.035, -h * 0.50);
    ctx.lineTo(-w * 0.035, -h * 0.50);
    ctx.closePath();
    ctx.fill();
    // Scroll at the top of the neck.
    ctx.fillStyle = BASS;
    ctx.beginPath();
    ctx.moveTo(w * 0.055, -h * 0.52);
    ctx.arc(0, -h * 0.545, w * 0.055, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = hexA(BASSL, a4(0.9));
    ctx.lineWidth = Math.max(1, H * 0.002);
    ctx.beginPath();
    ctx.moveTo(w * 0.03, -h * 0.545);
    ctx.arc(0, -h * 0.545, w * 0.03, 0, Math.PI * 1.5);
    ctx.stroke();
    // Bridge on the lower bout.
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(-w * 0.16, h * 0.10);
    ctx.lineTo(w * 0.16, h * 0.10);
    ctx.lineTo(w * 0.10, h * 0.16);
    ctx.lineTo(-w * 0.10, h * 0.16);
    ctx.closePath();
    ctx.fill();
    // f-holes: two small curved strokes.
    ctx.strokeStyle = hexA(INK, a4(0.85));
    ctx.lineWidth = Math.max(1, H * 0.0025);
    var s;
    for (s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.moveTo(s * w * 0.24, h * 0.02);
      ctx.arc(s * w * 0.24, h * 0.12, h * 0.10, -Math.PI * 0.42, Math.PI * 0.42);
      ctx.stroke();
    }
    // Tailpiece below the bridge.
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(-w * 0.09, h * 0.30);
    ctx.lineTo(w * 0.09, h * 0.30);
    ctx.lineTo(w * 0.05, h * 0.42);
    ctx.lineTo(-w * 0.05, h * 0.42);
    ctx.closePath();
    ctx.fill();
    // Four strings, scroll to tailpiece.
    ctx.strokeStyle = hexA(CREAM, a4(0.65));
    ctx.lineWidth = Math.max(0.8, H * 0.0012);
    var st;
    for (st = 0; st < 4; st++) {
      var off = (st - 1.5) * w * 0.035;
      ctx.beginPath();
      ctx.moveTo(off * 0.5, -h * 0.53);
      ctx.lineTo(off, h * 0.42);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawTable(t) {
    // Small table, centre-right, wood top and four legs.
    ctx.fillStyle = WOOD;
    ctx.fillRect(L.tableX0, L.tableTop - H * 0.018, L.tableX1 - L.tableX0, H * 0.018);
    var legW = Math.max(3, W * 0.006);
    ctx.fillRect(L.tableX0 + W * 0.01, L.tableTop, legW, L.floorY - L.tableTop);
    ctx.fillRect(L.tableX1 - W * 0.01 - legW, L.tableTop, legW, L.floorY - L.tableTop);
  }

  function drawBackpack(t) {
    // Backpack on the floor by the wall, left of the table.
    var x = L.packX, y = L.packY, w = W * 0.075, h = H * 0.055;
    ctx.fillStyle = PACK;
    ctx.beginPath();
    ctx.moveTo(x - w / 2 + 6, y - h);
    ctx.lineTo(x + w / 2 - 6, y - h);
    ctx.quadraticCurveTo(x + w / 2, y - h, x + w / 2, y - h + 6);
    ctx.lineTo(x + w / 2, y);
    ctx.lineTo(x - w / 2, y);
    ctx.lineTo(x - w / 2, y - h + 6);
    ctx.quadraticCurveTo(x - w / 2, y - h, x - w / 2 + 6, y - h);
    ctx.closePath();
    ctx.fill();
    // Flap seam and a strap.
    ctx.strokeStyle = hexA(INK, a4(0.35));
    ctx.lineWidth = Math.max(1, H * 0.002);
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y - h * 0.55);
    ctx.lineTo(x + w / 2, y - h * 0.55);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - w * 0.18, y - h);
    ctx.quadraticCurveTo(x - w * 0.18, y - h * 1.35, x + w * 0.05, y - h * 1.3);
    ctx.stroke();
  }

  function drawCables(t) {
    // Cables snaking on the floor from the table to the wall.
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(2, H * 0.0035);
    ctx.beginPath();
    ctx.moveTo(L.tableX0 + W * 0.03, L.tableTop);
    ctx.bezierCurveTo(L.tableX0 + W * 0.02, L.floorY + H * 0.02, L.tableX0 - W * 0.03, L.floorY + H * 0.045, L.tableX0 - W * 0.08, L.floorY + H * 0.03);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(L.tableX0 - W * 0.08, L.floorY + H * 0.03);
    ctx.bezierCurveTo(L.tableX0 - W * 0.12, L.floorY + H * 0.015, L.bassX + W * 0.10, L.floorY + H * 0.05, L.bassX + W * 0.13, L.floorY + H * 0.02);
    ctx.stroke();
  }

  function drawReel(cx, cy, r, angle, t) {
    // Cassette reel: cream hub, dark tape window, three spokes
    // turning with the playback angle.
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(cx + r, cy);
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = CREAM;
    ctx.beginPath();
    ctx.moveTo(cx + r * 0.82, cy);
    ctx.arc(cx, cy, r * 0.82, 0, Math.PI * 2);
    ctx.fill();
    var i;
    for (i = 0; i < 3; i++) {
      var a = angle + i * (Math.PI * 2 / 3);
      ctx.strokeStyle = INK;
      ctx.lineWidth = Math.max(1.5, r * 0.14);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r * 0.18, cy + Math.sin(a) * r * 0.18);
      ctx.lineTo(cx + Math.cos(a) * r * 0.78, cy + Math.sin(a) * r * 0.78);
      ctx.stroke();
    }
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(cx + r * 0.18, cy);
    ctx.arc(cx, cy, r * 0.18, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawRecorder(t) {
    var x0 = L.recX0, x1 = L.recX1, y0 = L.recY0, y1 = L.recY1;
    var w = x1 - x0, h = y1 - y0;
    var punch = activePunch(t);
    // Punch glow: a warm halo around the recorder while a
    // punch is in progress, breathing slowly.
    if (punch) {
      var glow = 0.10 + 0.06 * Math.sin(t * Math.PI);
      ctx.fillStyle = hexA(LED, a4(glow));
      ctx.fillRect(x0 - 8, y0 - 8, w + 16, h + 16);
    }
    // Body: cream box with a darker base.
    ctx.fillStyle = CREAM;
    ctx.fillRect(x0, y0, w, h);
    ctx.fillStyle = CREAMD;
    ctx.fillRect(x0, y1 - h * 0.07, w, h * 0.07);
    ctx.strokeStyle = hexA(INK, a4(0.45));
    ctx.lineWidth = 1;
    ctx.strokeRect(x0 + 0.5, y0 + 0.5, w - 1, h - 1);
    // Tape window: dark strip with the two reels.
    var winY0 = y0 + h * 0.08, winY1 = y0 + h * 0.44;
    ctx.fillStyle = INK;
    ctx.fillRect(x0 + w * 0.06, winY0, w * 0.88, winY1 - winY0);
    var rcx1 = x0 + w * 0.28, rcx2 = x0 + w * 0.72;
    var rcy = (winY0 + winY1) / 2;
    var rr = (winY1 - winY0) * 0.42;
    drawReel(rcx1, rcy, rr, reelAngle(t, false), t);
    drawReel(rcx2, rcy, rr, reelAngle(t, true), t);
    // VU meters: four vertical slots, warm orange segments.
    var meterY0 = y0 + h * 0.52, meterY1 = y0 + h * 0.82;
    var seg = 5;
    var tr;
    for (tr = 0; tr < 4; tr++) {
      var mx0 = x0 + w * (0.08 + tr * 0.23);
      var mx1 = mx0 + w * 0.15;
      ctx.fillStyle = hexA(INK, a4(0.85));
      ctx.fillRect(mx0, meterY0, mx1 - mx0, meterY1 - meterY0);
      var lv = vuLevel(tr, t);
      var lit = Math.round(lv * seg);
      var s;
      for (s = 0; s < seg; s++) {
        var sy1 = meterY1 - (s + 1) * (meterY1 - meterY0) / seg + 1;
        var sy0 = meterY1 - s * (meterY1 - meterY0) / seg - 1;
        if (s < lit) {
          ctx.fillStyle = (s >= 4) ? LEDHOT : LED;
        } else {
          ctx.fillStyle = hexA(LED, a4(0.12));
        }
        ctx.fillRect(mx0 + 1.5, sy1, mx1 - mx0 - 3, Math.max(1, sy0 - sy1));
      }
      // Track label and take counter under each meter. Compact
      // form "T1·2" (track 1, take 2) so labels never run into
      // their neighbours, even on the narrow phone recorder.
      var fsT = Math.max(7, Math.round(clamp(w * 0.042, 7, 12)));
      ctx.font = '600 ' + fsT + 'px Georgia, "Times New Roman", serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = hexA(INK, a4(0.85));
      var label = 'T' + (tr + 1) + (tr < 3 ? '·' + takeOf(tr, t) : '');
      ctx.fillText(label, (mx0 + mx1) / 2, y0 + h * 0.50 - 2);
      // Loop progress: thin bar under the meter.
      if (tr < 3) {
        var lp = lastPunchBefore(tr, t);
        var start = lp ? lp.t : 0;
        var ph = ((t - start) % LOOP_LEN[tr]) / LOOP_LEN[tr];
        ctx.fillStyle = hexA(INK, a4(0.2));
        ctx.fillRect(mx0, meterY1 + 3, mx1 - mx0, 2);
        ctx.fillStyle = LED;
        ctx.fillRect(mx0, meterY1 + 3, (mx1 - mx0) * ph, 2);
      }
      ctx.textAlign = 'left';
    }
    // Bottom strip: tape counter left, REC and PUNCH lamps right.
    var fsC = Math.max(9, Math.round(H * 0.013));
    ctx.font = '600 ' + fsC + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = hexA(INK, a4(0.9));
    var counter = Math.floor(t * 1.7) % 1000;
    var cs = ('00' + counter).slice(-3);
    ctx.fillText(cs, x0 + w * 0.08, y1 - h * 0.10);
    // REC lamp: steady while a punch is in, dim otherwise.
    // Each lamp sits at the right with its label to its left,
    // right-aligned, so nothing ever overflows the recorder edge.
    var lampY = y1 - h * 0.115;
    var fsL = Math.max(7, Math.round(clamp(w * 0.038, 7, 11)));
    ctx.font = '600 ' + fsL + 'px Georgia, "Times New Roman", serif';
    ctx.fillStyle = hexA(INK, a4(0.85));
    var recLampX = x1 - w * 0.05;
    ctx.fillStyle = punch ? RECL : hexA(RECL, a4(0.25));
    ctx.beginPath();
    ctx.moveTo(recLampX + 4, lampY);
    ctx.arc(recLampX, lampY, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = hexA(INK, a4(0.85));
    ctx.textAlign = 'right';
    ctx.fillText('REC', recLampX - 7, lampY + 3);
    // PUNCH lamp: lit only during a punch window.
    var pLampX = x1 - w * 0.26;
    ctx.fillStyle = punch ? LED : hexA(LED, a4(0.2));
    ctx.beginPath();
    ctx.moveTo(pLampX + 4, lampY);
    ctx.arc(pLampX, lampY, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = hexA(INK, a4(0.85));
    ctx.fillText('PUNCH', pLampX - 7, lampY + 3);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    // Page ground is the wall gray; the stage is the room.
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);

    drawWall(t);
    drawFloor(t);
    drawPiano(t);
    drawRug(t);
    drawBackpack(t);
    drawBass(t);
    drawCables(t);
    drawTable(t);
    drawRecorder(t);

    // ---- Vertical side text along the left edge.
    var fsSide = Math.round(12 * clamp(W / 560, 0.85, 1.1));
    ctx.save();
    ctx.translate(L.sideX + 2, H * 0.78);
    ctx.rotate(-Math.PI / 2);
    ctx.font = '600 ' + fsSide + 'px Georgia, "Times New Roman", serif';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = hexA(INK, a4(0.78));
    ctx.fillText('G R E E N   R O O M ,   4 - T R A C K', 0, 0);
    ctx.font = fsSide + 'px Georgia, "Times New Roman", serif';
    ctx.fillStyle = hexA(INK, a4(0.65));
    ctx.fillText('C W 8   ·   P P 1 2 1 4', 0, fsSide + 7);
    ctx.restore();

    // ---- Plates: title top-left, number and date below it.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Green Room, 4-Track', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, a4(0.85));
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1967 · 2007 · 06 · 01', 18, 18 + fsTitle * 0.8 + fsSub + 8);

    // ---- Hint, centered at the bottom, cream pill on the rug.
    var hint = 'Watch the reels turn.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(CREAM, a4(0.92));
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = hexA(INK, a4(0.35));
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  // Watch-only: no pointer interaction. The room works without
  // a player; the fragments loop and punch over on their own
  // schedule. There is nothing to tap.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1967 exposes the schedule state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1967 = {
      firstT: FIRST_T,
      vu: function (tr, t) { return vuLevel(tr, t); },
      take: function (tr, t) { return takeOf(tr, t); },
      punch: function (t) { var p = activePunch(t); return p ? (p.track + 1) : 0; },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: reels turn, VU meters breathe with the bass
  // fragments, punches land every 8 to 9 s. All motion is on
  // multi second timescales, well under the 14 Hz ceiling.
  // Guarded so node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
