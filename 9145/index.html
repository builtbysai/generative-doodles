<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№9145 — Coins With the Wrong King</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#17141c;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  .cap{position:fixed;left:0;right:0;bottom:10px;text-align:center;color:#6a6258;
    font:13px/1.4 Georgia,serif;letter-spacing:.14em;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">№9145 — COINS WITH THE WRONG KING</div>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1, tableY=0, R=0;
var coins=[], stack=[], spawnT=0;
var GOLD='#c9a86a', SILVER='#d8d8d8', INK='#26221e', TABLE='#6a6258', DARK='#2a2530';
var FACE_DOWN_CHANCE=0.14;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  tableY=H*0.74;
  R=Math.max(13,Math.min(26,Math.min(W,H)*0.035));
  layoutStack();
}
function layoutStack(){
  for(var i=0;i<stack.length;i++){
    var s=stack[i];
    s.x=slotX(s.slot); s.y=tableY-R-(s.row*R*2);
  }
}
function slotX(slot){ return W*0.08 + slot*(R*2+3); }
function maxSlots(){ return Math.max(4,Math.floor((W*0.84)/(R*2+3))); }
function newCoin(fromTop){
  var c={x:Math.random()*W*0.9+W*0.05,
    y:fromTop? -R*2 : Math.random()*H*0.3,
    vy:0, baseVy:55+Math.random()*55,
    r:R*(0.85+Math.random()*0.3),
    state:'fall', // fall | stacked | dark
    faceDown:false, wob:Math.random()*Math.PI*2, wobSp:0.4+Math.random()*0.8,
    drag:null};
  return c;
}
function spawn(){
  coins.push(newCoin(true));
}
function flipCoin(c){
  c.state='stacked';
  c.faceDown=false;
  // find first free slot (bottom row first, then second row)
  var slots=maxSlots();
  for(var row=0;row<2;row++){
    for(var s=0;s<slots;s++){
      var taken=false;
      for(var i=0;i<stack.length;i++){
        if(stack[i].slot===s&&stack[i].row===row){taken=true;break;}
      }
      if(!taken){
        c.slot=s; c.row=row;
        c.x=slotX(s); c.y=tableY-R-(row*R*2);
        stack.push(c);
        // row full -> recycle oldest flipped disc
        if(stack.length>=slots*2){
          var old=stack.shift();
          old.state='fall'; old.faceDown=false;
          old.y=-R*2; old.x=Math.random()*W*0.9+W*0.05;
          old.vy=0; old.baseVy=55+Math.random()*55;
          layoutStack();
        }
        return;
      }
    }
  }
  // no free slot (should not happen after recycle) -> rejoin fall
  c.state='fall'; c.y=-R*2; c.vy=0;
}
function land(c){
  if(Math.random()<FACE_DOWN_CHANCE){
    // lands face-down: dark, stays on the table unstacked until flipped
    c.state='dark';
    c.faceDown=true;
    c.y=tableY-c.r*0.55;
    c.x=Math.min(Math.max(c.x,c.r),W-c.r);
    return;
  }
  flipCoin(c);
}
function flipDark(d){
  // a falling coin lands on a dark one: both flip
  d.state='stacked'; d.faceDown=false;
  flipCoin(d);
}
function step(dt){
  spawnT-=dt;
  if(spawnT<=0){ spawn(); spawnT=0.9+Math.random()*1.4; }
  for(var i=coins.length-1;i>=0;i--){
    var c=coins[i];
    if(c.state==='fall'){
      var sp=c.baseVy*(c.drag?c.drag:1);
      c.vy=sp;
      c.y+=c.vy*dt;
      c.wob+=c.wobSp*dt;
      c.x+=Math.sin(c.wob)*8*dt;
      if(c.y+c.r>=tableY){
        // check landing on a dark disc first
        var hitDark=null;
        for(var j=0;j<coins.length;j++){
          var d=coins[j];
          if(d!==c&&d.state==='dark'&&Math.abs(d.x-c.x)<c.r*1.4&&Math.abs(d.y-tableY)<c.r*2){
            hitDark=d; break;
          }
        }
        if(hitDark){ flipDark(hitDark); }
        land(c);
        if(c.state==='fall'){ // flipCoin found no slot
          c.y=-R*2;
        }
      }
    }
  }
  // prune: keep array bounded (stacked/dark coins live in coins too)
  if(coins.length>220){
    coins=coins.filter(function(c){return c.state!=='fall'||c.y<H*0.5;});
  }
}
function drawFace(c){
  ctx.save();
  ctx.translate(c.x,c.y);
  if(c.state==='dark'||c.faceDown){
    ctx.fillStyle=DARK;
    ctx.beginPath(); ctx.arc(0,0,c.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(106,98,88,0.5)';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(0,0,c.r-1,0,Math.PI*2); ctx.stroke();
    ctx.restore(); return;
  }
  var isFlipped=(c.state==='stacked');
  ctx.fillStyle=isFlipped?SILVER:GOLD;
  ctx.beginPath(); ctx.arc(0,0,c.r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(38,34,30,0.35)';
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(0,0,c.r-1,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle=INK;
  if(isFlipped){
    // star-burst
    var n=8;
    ctx.beginPath();
    for(var k=0;k<n*2;k++){
      var a=k*Math.PI/n, rr=(k%2===0)?c.r*0.55:c.r*0.2;
      var px=Math.cos(a)*rr, py=Math.sin(a)*rr;
      if(k===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  }else{
    // face-glyph: circle with two dots
    ctx.beginPath(); ctx.arc(0,0,c.r*0.42,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(-c.r*0.16,-c.r*0.1,c.r*0.07,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(c.r*0.16,-c.r*0.1,c.r*0.07,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function draw(){
  ctx.fillStyle='#17141c';
  ctx.fillRect(0,0,W,H);
  // table line
  ctx.strokeStyle=TABLE; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,tableY); ctx.lineTo(W,tableY); ctx.stroke();
  ctx.fillStyle='rgba(106,98,88,0.25)';
  ctx.fillRect(0,tableY+2,W,3);
  for(var i=0;i<coins.length;i++){
    var c=coins[i];
    if(c.y<-c.r*2||c.y>H+c.r) continue;
    drawFace(c);
  }
}
var last=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  step(dt); draw();
  requestAnimationFrame(frame);
}
// interaction: drag a falling disc to speed/slow it; drag a stacked disc to lift it back into the fall
var dragCoin=null, dragMode=null, lastY=0;
function pick(x,y){
  var best=null,bd=1e9;
  for(var i=0;i<coins.length;i++){
    var c=coins[i];
    var dx=c.x-x, dy=c.y-y, d=Math.sqrt(dx*dx+dy*dy);
    if(d<c.r*1.6&&d<bd){bd=d;best=c;}
  }
  return best;
}
function onDown(x,y){
  var c=pick(x,y);
  if(!c) return;
  dragCoin=c; lastY=y;
  if(c.state==='stacked'){
    dragMode='lift';
    // remove from stack, rejoin fall unflipped
    var idx=stack.indexOf(c);
    if(idx>=0) stack.splice(idx,1);
    c.state='fall'; c.faceDown=false; c.y=tableY-c.r*3; c.vy=0;
    c.baseVy=55+Math.random()*55;
    layoutStack();
  }else if(c.state==='fall'){
    dragMode='speed';
    c.drag=1;
  }
}
function onMove(x,y){
  if(!dragCoin) return;
  if(dragMode==='speed'&&dragCoin.state==='fall'){
    var dy=y-lastY;
    dragCoin.drag=Math.max(0.3,Math.min(3,(dragCoin.drag||1)+dy*0.01));
    dragCoin.x=x;
  }
  lastY=y;
}
function onUp(){
  if(dragCoin&&dragCoin.state==='fall') dragCoin.drag=null;
  dragCoin=null; dragMode=null;
}
cv.addEventListener('pointerdown',function(e){onDown(e.clientX,e.clientY);});
window.addEventListener('pointermove',function(e){onMove(e.clientX,e.clientY);});
window.addEventListener('pointerup',onUp);
window.addEventListener('pointercancel',onUp);
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',function(){last=performance.now();});
resize();
for(var s=0;s<6;s++) coins.push(newCoin(false));
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
