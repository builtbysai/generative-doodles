<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="Marble machine with pendulum chimes, a copper rotor, colorful dominoes and brass ramps">
 <rect width="1280" height="800" fill="#eee9de"/>
 <defs>
  <radialGradient id="ball" cx=".3" cy=".25" r=".83">
   <stop stop-color="#f8c58b"/><stop offset=".32" stop-color="#e9865b"/>
   <stop offset=".78" stop-color="#bc4d3f"/><stop offset="1" stop-color="#753b32"/>
  </radialGradient>
 </defs>
 <!-- Supports physically attach to the rails, never float over the scene. -->
 <g stroke="#b5ab99" stroke-width="7" stroke-linecap="round">
  <path d="M235 250v44 M597 344v46 M946 448v48 M486 551v50 M817 660v40"/>
 </g>
 <g fill="#dfc48b" stroke="#353c39" stroke-width="3">
  <circle cx="235" cy="294" r="6"/><circle cx="597" cy="390" r="6"/>
  <circle cx="946" cy="496" r="6"/><circle cx="486" cy="601" r="6"/><circle cx="817" cy="700" r="6"/>
 </g>
 <!-- First downhill track -->
 <path d="M130 170 760 345" stroke="#353c39" stroke-width="16" stroke-linecap="round"/>
 <path d="M130 170 760 345" stroke="#c49b5e" stroke-width="11" stroke-linecap="round"/>
 <path d="M130 166 760 341" stroke="#f8deaa" stroke-width="2" stroke-linecap="round"/>
 <!-- Chime frames and weighted bells -->
 <g stroke="#353c39" stroke-width="5" fill="none" stroke-linecap="round">
  <path d="M320 68v127 M420 75v147 M520 93v153"/>
 </g>
 <g fill="#6da79c" stroke="#353c39" stroke-width="3">
  <path d="M306 187 Q294 199 291 219 Q320 230 349 219 Q345 200 333 187 Z"/>
  <path d="M406 214 Q395 225 390 245 Q420 256 450 245 Q445 224 434 214 Z" fill="#e1b055"/>
  <path d="M505 237 Q491 254 491 271 Q520 281 549 271 Q547 250 534 237 Z" fill="#c97c5d"/>
 </g>
 <g fill="#353c39"><circle cx="320" cy="221" r="5"/><circle cx="420" cy="247" r="5"/><circle cx="520" cy="273" r="5"/></g>
 <!-- Rotor body and its actual radial paddles -->
 <g transform="translate(817 414)">
  <circle r="122" fill="none" stroke="#9eada4" stroke-width="16" stroke-dasharray="38 17" opacity=".55"/>
  <circle r="39" fill="#527d8f" stroke="#353c39" stroke-width="6"/>
  <g fill="#527d8f" stroke="#353c39" stroke-width="5">
   <path d="M-14-12H132V12H-14Z" transform="rotate(15)"/>
   <path d="M-14-12H132V12H-14Z" transform="rotate(135)"/>
   <path d="M-14-12H132V12H-14Z" transform="rotate(255)"/>
  </g>
  <g fill="#e0b779" stroke="#353c39" stroke-width="3">
   <circle cx="111" cy="30" r="9"/><circle cx="-81" cy="80" r="9"/><circle cx="-30" cy="-111" r="9"/>
  </g>
  <circle r="18" fill="#dabb80" stroke="#353c39" stroke-width="4"/>
  <path d="M-7 4 8-5" stroke="#353c39" stroke-width="3"/>
 </g>
 <!-- Second run, with a drop across the rotor's housing -->
 <g fill="none" stroke-linecap="round">
  <path d="M1040 479 406 604" stroke="#353c39" stroke-width="17"/>
  <path d="M1040 479 406 604" stroke="#c49b5e" stroke-width="10"/>
  <path d="M1040 475 406 600" stroke="#f5dba8" stroke-width="2"/>
  <path d="M300 637 1010 750" stroke="#353c39" stroke-width="17"/>
  <path d="M300 637 1010 750" stroke="#c49b5e" stroke-width="10"/>
  <path d="M300 633 1010 746" stroke="#f5dba8" stroke-width="2"/>
 </g>
 <!-- A row of moving dominoes on the shelf -->
 <g stroke="#353c39" stroke-width="3">
  <rect x="440" y="540" width="25" height="62" rx="3" transform="rotate(-15 452 570)" fill="#d76045"/>
  <rect x="474" y="530" width="25" height="62" rx="3" transform="rotate(-12 486 560)" fill="#dfb351"/>
  <rect x="508" y="523" width="25" height="62" rx="3" transform="rotate(-10 520 552)" fill="#7eae9b"/>
  <rect x="542" y="516" width="25" height="62" rx="3" transform="rotate(-7 555 547)" fill="#4f8996"/>
  <rect x="576" y="511" width="25" height="62" rx="3" transform="rotate(-5 589 542)" fill="#957a9b"/>
 </g>
 <!-- Red marble is the visual focal point; no particles or magic glow. -->
 <ellipse cx="576" cy="291" rx="27" ry="10" fill="#746d60" opacity=".16"/>
 <circle cx="564" cy="267" r="34" fill="url(#ball)" stroke="#63382f" stroke-width="3"/>
 <ellipse cx="549" cy="249" rx="9" ry="5" transform="rotate(-35 549 249)" fill="#fff0d5" opacity=".9"/>
 <circle cx="582" cy="278" r="8" fill="#813b33"/>
 <g fill="#d8b982" stroke="#353c39" stroke-width="3">
  <circle cx="132" cy="170" r="5"/><circle cx="759" cy="345" r="5"/>
  <circle cx="1040" cy="479" r="5"/><circle cx="407" cy="604" r="5"/>
 </g>
</svg>