<script>
// Camera director for 9107-WONDERWORKS-V1: CAMERA-V5 behavior, endless edition.
// Same research basis as before (Cinemachine Target Group framing,
// Composer lookahead + dead zone + damping, one continuous move, no cuts),
// adapted to the endless sim: the group is the ball plus whatever is moving
// near it plus nearby mechanism anchors. NO world clamp: the world is
// endless downward, so camY is unclamped; only the center x is kept inside
// the 1400-wide play field.
window.CAM9107=(function(){
  'use strict';
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function createState(x,y){return {x:x,y:y,scale:0};}
  // Film the interaction, not every moving piece in the generated world.
  // A stable lens prevents mechanical collisions from pumping the zoom.
  function targetFor(w,vw,vh,baseScale,st,dt){
    var b=w.ball, portrait=vw<vh*.82;
    var leadX=clamp(b.vx*.13,-105,105);
    var leadY=clamp(112+b.vy*.09,80,205);
    return {cx:clamp(b.x+leadX,120,1280),cy:b.y+leadY,
            scale:baseScale*(portrait?.94:.88)};
  }
  function stepCam(st,tgt,dt){
    var hx=1-Math.exp(-7.5*dt),hy=1-Math.exp(-5.3*dt);
    st.x+=(tgt.cx-st.x)*hx;st.y+=(tgt.cy-st.y)*hy;
    var hZoom=1-Math.exp(-4*dt);
    st.scale+=(tgt.scale-st.scale)*hZoom;
    st.x=clamp(st.x,0,1400);
  }
  return {createState:createState,targetFor:targetFor,stepCam:stepCam};
})();

<script>
(function () {

  // mechanism below belongs to the actual simulation: rails, pivots,
  // fixtures, dominoes and their physical attachments. No floating HUD,
  // decorative gears, particles, grid, or glow.
  var COLORS={
    ground:'#eee9de', edge:'#353c39', metal:'#c49b5e', glint:'#f7dfaa',
    copper:'#bd6a4a', cobalt:'#547992', teal:'#69a49b',
    shadow:'rgba(41,39,34,.14)', ivory:'#f6eddd'
  };
  var ENAMEL=['#db684b','#dfb351','#7eae9b','#4f8996','#957a9b','#d08056','#5e84a4','#b6a45a'];
  function path(corners) {
    ctx.beginPath();ctx.moveTo(corners[0][0],corners[0][1]);
    for(var i=1;i<corners.length;i++)ctx.lineTo(corners[i][0],corners[i][1]);
    ctx.closePath();
  }
  function bolt(x,y,r) {
    ctx.fillStyle=COLORS.edge;ctx.beginPath();ctx.arc(x,y,r+1.1,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#e7c98c';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(57,56,48,.72)';ctx.lineWidth=1.25;
    ctx.beginPath();ctx.moveTo(x-r*.53,y+r*.25);ctx.lineTo(x+r*.53,y-r*.25);ctx.stroke();
  }
  function drawLine(x1,y1,x2,y2,col,width){
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
    ctx.strokeStyle=col;ctx.lineWidth=width;ctx.stroke();
  }
  function metalRail(seg,top,bottom) {
    var dx=seg.x2-seg.x1,dy=seg.y2-seg.y1,ln=Math.hypot(dx,dy);
    if(ln<.1)return;
    var nx=-dy/ln,ny=dx/ln;
    var wall=/wall/.test(seg.id||''), guide=/guide|GateL|GateR|gemL|gemR|ribbonL|ribbonR|chimeGate|InL|InR|OutL|OutR/.test(seg.id||'');
    if(wall){
      drawLine(seg.x1,seg.y1,seg.x2,seg.y2,'rgba(63,70,68,.17)',3);return;
    }
    // The rail fasteners are tied to the actual collision segment.
    if(ln>165 && !guide && seg!==w.handBlock){
      [0.23,0.76].forEach(function(t){
        var x=seg.x1+dx*t,y=seg.y1+dy*t;
        drawLine(x+2,y+6,x+2,y+29,'rgba(87,80,65,.28)',5);
        bolt(x+2,y+31,2.6);
      });
    }
    drawLine(seg.x1+3,seg.y1+4,seg.x2+3,seg.y2+4,COLORS.shadow,14);
    drawLine(seg.x1,seg.y1,seg.x2,seg.y2,COLORS.edge,10);
    drawLine(seg.x1,seg.y1,seg.x2,seg.y2,guide?'#989f94':COLORS.metal,6.5);
    drawLine(seg.x1+nx*1.4,seg.y1+ny*1.4,seg.x2+nx*1.4,seg.y2+ny*1.4,
      guide?'rgba(249,241,223,.48)':COLORS.glint,1.2);
    if(ln>90){bolt(seg.x1,seg.y1,2.6);bolt(seg.x2,seg.y2,2.6);}
  }
  function boxFixture(b,f,fill){
    var corners=SIM.fixtureCorners(b,f);
    ctx.save();
    ctx.translate(3.4,5);
    path(corners);ctx.fillStyle=COLORS.shadow;ctx.fill();
    ctx.restore();
    path(corners);ctx.fillStyle=fill;ctx.fill();
    ctx.strokeStyle=COLORS.edge;ctx.lineWidth=2;ctx.stroke();
    // One crisp folded edge gives a machined rather than flat shape.
    drawLine(corners[3][0],corners[3][1],corners[0][0],corners[0][1],
      'rgba(255,246,222,.60)',2.2);
    if(/gem/.test(b.id||'')){
      // Facets belong to the actual diamond-shaped collision fixture.
      var centerX=(corners[0][0]+corners[2][0])/2,
          centerY=(corners[0][1]+corners[2][1])/2;
      ctx.beginPath();ctx.moveTo(corners[0][0],corners[0][1]);
      ctx.lineTo(corners[1][0],corners[1][1]);
      ctx.lineTo(centerX,centerY);ctx.closePath();
      ctx.fillStyle='rgba(246,241,217,.42)';ctx.fill();
      ctx.beginPath();ctx.moveTo(corners[2][0],corners[2][1]);
      ctx.lineTo(centerX,centerY);ctx.lineTo(corners[3][0],corners[3][1]);
      ctx.fillStyle='rgba(43,79,79,.2)';ctx.fill();
    }
  }
  function steelColor(b,f){
    var id=b.id||'',name=f.name||'';
    if(/peg|gem/.test(id))return '#74a6a6';
    if(/tone/.test(id+name)){
      var number=Number((id.match(/tone(\d+)/)||[])[1]||0);
      return ['#bd865e','#c3ad77','#83a5a2'][number%3];
    }
    if(/switch/.test(id+name))return '#729b90';
    if(/bump/.test(id))return '#d76549';
    if(/wedge/.test(id))return '#d7ae5e';
    if(/hous/.test(id))return '#697b78';
    if(/shelf/.test(id))return '#b98b55';
    if(/rotor/i.test(id))return '#447b91';
    if(/seesaw|rocker|plank/.test(id+name))return '#d5a15f';
    if(/bell|bob/.test(name))return '#dfaf56';
    if(/plate|ham/.test(name))return '#c58157';
    if(/chime/.test(name))return '#79aaa1';
    return '#9d7d62';
  }
  function hinge(b){
    var x=b.anchorX,y=b.anchorY;
    if(/seesaw|rocker|switch|tone/.test(b.id)){
      ctx.beginPath();ctx.moveTo(x-33,y+51);ctx.lineTo(x,y+8);ctx.lineTo(x+33,y+51);ctx.closePath();
      ctx.fillStyle='#7c8e87';ctx.fill();ctx.strokeStyle=COLORS.edge;ctx.lineWidth=2;ctx.stroke();
      drawLine(x-46,y+52,x+46,y+52,COLORS.edge,5);
    } else if(/rotor/i.test(b.id)){
      ctx.beginPath();ctx.arc(x,y,43,0,Math.PI*2);
      ctx.strokeStyle='rgba(53,60,57,.58)';ctx.lineWidth=4;ctx.stroke();
      var a=b.angle;
      for(var j=0;j<8;j++){
        var ang=a+j*Math.PI/4;
        drawLine(x+Math.cos(ang)*24,y+Math.sin(ang)*24,
                 x+Math.cos(ang)*37,y+Math.sin(ang)*37,'#e8c281',3);
      }
    } else {
      drawLine(x,y,x,y-13,COLORS.edge,5);
    }
    bolt(x,y,7);
  }
  function bellShape(b,f){
    var c=SIM.bodyPoint(b,f.cx,f.cy),r=/chime/.test(f.name)?16:18;
    ctx.save();ctx.translate(c[0],c[1]);ctx.rotate(b.angle);
    ctx.beginPath();ctx.moveTo(-r*.38,-r*.95);
    ctx.bezierCurveTo(-r*.8,-r*.65,-r*.78,r*.45,-r, r*.75);
    ctx.quadraticCurveTo(0,r*1.15,r,r*.75);
    ctx.bezierCurveTo(r*.78,r*.45,r*.8,-r*.65,r*.38,-r*.95);
    ctx.closePath();ctx.fillStyle=/chime/.test(f.name)?'#72aa9d':'#d8a452';ctx.fill();
    ctx.strokeStyle=COLORS.edge;ctx.lineWidth=2;ctx.stroke();
    drawLine(-r*.85,r*.69,r*.85,r*.69,'#f8dfab',2);
    bolt(0,-r*.75,2);
    ctx.beginPath();ctx.arc(0,r*.95,3.2,0,Math.PI*2);
    ctx.fillStyle='#8b5842';ctx.fill();
    ctx.restore();
  }
  function pivotedBody(b) {
    if(b.type!=='pinned')return;
    for(var k=0;k<b.fixtures.length;k++){
      var f=b.fixtures[k];
      if(/bell|chime/.test(f.name||'')){bellShape(b,f);continue;}
      if(/bob/.test(f.name||'')){
        var mass=SIM.bodyPoint(b,f.cx,f.cy);
        ctx.beginPath();ctx.arc(mass[0]+2.5,mass[1]+3,12,0,Math.PI*2);
        ctx.fillStyle=COLORS.shadow;ctx.fill();
        ctx.beginPath();ctx.arc(mass[0],mass[1],12,0,Math.PI*2);
        ctx.fillStyle='#d2a45b';ctx.fill();
        ctx.lineWidth=2;ctx.strokeStyle=COLORS.edge;ctx.stroke();
        bolt(mass[0]-3,mass[1]-3,2.2);
        continue;
      }
      if((f.name||'').indexOf('stem')>=0 || (f.name||'').indexOf('rod')>=0){
        var cc=SIM.fixtureCorners(b,f);
        drawLine((cc[0][0]+cc[3][0])/2,(cc[0][1]+cc[3][1])/2,
                 (cc[1][0]+cc[2][0])/2,(cc[1][1]+cc[2][1])/2,
                 COLORS.edge,4);
        continue;
      }
      boxFixture(b,f,steelColor(b,f));
      if(/toneKey/.test(f.name||'')){
        var ends=SIM.fixtureCorners(b,f);
        var x1=(ends[0][0]+ends[3][0])/2,y1=(ends[0][1]+ends[3][1])/2;
        var x2=(ends[1][0]+ends[2][0])/2,y2=(ends[1][1]+ends[2][1])/2;
        drawLine(x1+(x2-x1)*.16,y1+(y2-y1)*.16,
                 x1+(x2-x1)*.84,y1+(y2-y1)*.84,'rgba(254,240,204,.55)',1.5);
      }
    }
    if(b.paddleDegs){
      b.paddleDegs.forEach(function(deg){
        var a=b.angle+deg*Math.PI/180;
        var x=b.anchorX+Math.cos(a)*(b.spinR-16);
        var y=b.anchorY+Math.sin(a)*(b.spinR-16);
        bolt(x,y,5);
      });
    }
    hinge(b);
  }
  function paintDomino(d,i){
    var cs=SIM.fixtureCorners(d,d.fixtures[0]),color=d.color||ENAMEL[i%ENAMEL.length];
    ctx.save();ctx.translate(2.5,4);path(cs);ctx.fillStyle=COLORS.shadow;ctx.fill();ctx.restore();
    path(cs);ctx.fillStyle=color;ctx.fill();
    ctx.strokeStyle=COLORS.edge;ctx.lineWidth=2;ctx.stroke();
    drawLine(cs[3][0],cs[3][1],cs[0][0],cs[0][1],'rgba(255,250,230,.7)',2);
    var cp=SIM.bodyPoint(d,0,0);
    ctx.beginPath();ctx.arc(cp[0],cp[1],2.7,0,Math.PI*2);
    ctx.fillStyle=COLORS.ivory;ctx.fill();
  }
  function paintBall() {
    var b=w.ball, r=b.r;
    ctx.beginPath();ctx.arc(b.x+3.6,b.y+4.8,r,0,Math.PI*2);
    ctx.fillStyle='rgba(48,40,35,.20)';ctx.fill();
    var grad=ctx.createRadialGradient(b.x-r*.4,b.y-r*.5,r*.07,b.x,b.y,r*1.06);
    grad.addColorStop(0,'#f7bc80');
    grad.addColorStop(.27,'#e97d51');
    grad.addColorStop(.76,'#ba4d3e');
    grad.addColorStop(1,'#74392f');
    ctx.beginPath();ctx.arc(b.x,b.y,r,0,Math.PI*2);
    ctx.fillStyle=grad;ctx.fill();
    ctx.strokeStyle='#60352d';ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.arc(b.x+Math.cos(b.angle)*r*.54,
                            b.y+Math.sin(b.angle)*r*.54,r*.22,0,Math.PI*2);
    ctx.fillStyle='#8e302d';ctx.fill();
    ctx.beginPath();ctx.ellipse(b.x-r*.35,b.y-r*.43,r*.26,r*.13,-.65,0,Math.PI*2);
    ctx.fillStyle='rgba(255,250,233,.85)';ctx.fill();
  }
  function draw() {
    var viewW=vw/scale,viewH=vh/scale;
    var left=camX-viewW/2,top=camY-viewH/2;
    ctx.setTransform(DPR*scale,0,0,DPR*scale,0,0);
    ctx.fillStyle=COLORS.ground;ctx.fillRect(0,0,viewW,viewH);
    ctx.save();ctx.translate(-left,-top);
    // No stage dressing: only tangible pieces whose positions are derived
    // from the same bodies and static colliders used by the solver.
    w.statics.forEach(function(b){
      if(b.y < top-250 || b.y > top+viewH+250)return;
      b.fixtures.forEach(function(f){boxFixture(b,f,steelColor(b,f));});
    });
    ctx.lineCap='round';ctx.lineJoin='round';
    w.segs.forEach(function(sg){
      if(Math.max(sg.y1,sg.y2)<top-40||Math.min(sg.y1,sg.y2)>top+viewH+40)return;
      metalRail(sg,top,viewH);
    });
    w.bodies.forEach(function(b){
      if(b.type==='pinned' && b.y>top-300 && b.y<top+viewH+300)pivotedBody(b);
    });
    w.dominoes.forEach(function(d,i){
      if(d.y>top-120&&d.y<top+viewH+120)paintDomino(d,i);
    });
    paintBall();
    ctx.restore();
  }

  // Fixed physics substeps driven by actual elapsed time, so a lower
  // refresh-rate screen does not turn the marble into slow motion.
  var lastFrameAt=null, accumulated=0;
  function frame(now) {
    if (freezeT === null) {
      if(lastFrameAt===null)lastFrameAt=now;
      var elapsed=Math.min(.05,Math.max(0,(now-lastFrameAt)/1000));
      lastFrameAt=now;
      if(!paused) {
        accumulated+=elapsed;
        var n=0;
        while(accumulated>=SIM.DT && n<32) {
          SIM.stepWorld(w); accumulated-=SIM.DT; n++;
        }
        // Prevent runaway catch-up after a suspended/background tab.
        if(n===32)accumulated=Math.min(accumulated,SIM.DT*4);
        audioStep();
      } else accumulated=0;
      // Pausing freezes the entire shot, including the camera. No
      // post-pause drift while waiting for a new user interaction.
      var cameraDt=paused?0:(Math.min(.05,elapsed)||1/60);
      var tgt = CAM9107.targetFor(w, vw, vh, baseScale, camSt, cameraDt);
      if (tgt) CAM9107.stepCam(camSt, tgt, cameraDt);
      camX = camSt.x; camY = camSt.y; scale = camSt.scale;
      var viewW = vw / scale;
      camX = viewW >= 1400 ? 700 : Math.max(viewW / 2, Math.min(1400 - viewW / 2, camX));
      camSt.x = camX; camSt.y = camY;
      draw();
      requestAnimationFrame(frame);
    }
  }
  if (freezeT !== null) {
    while (w.t < freezeT) SIM.stepWorld(w);
    var fst = CAM9107.createState(w.ball.x, w.ball.y); fst.scale = baseScale;
    for (var fi = 0; fi < 400; fi++) {
      var ft = CAM9107.targetFor(w, vw, vh, baseScale, fst, 1 / 60);
      if (ft) CAM9107.stepCam(fst, ft, 1 / 60);
    }
    camX = fst.x; camY = fst.y; scale = fst.scale;
    var viewW2 = vw / scale;
    camX = viewW2 >= 1400 ? 700 : Math.max(viewW2 / 2, Math.min(1400 - viewW2 / 2, camX));
    draw();
  } else {
    requestAnimationFrame(frame);
  }
})();

</script>
</body>
</html>
