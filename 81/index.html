<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№81 · Wormhole Study</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#05070D; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(255,246,232,0.6); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to bend the tunnel</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function smooth(x){ x=clamp(x,0,1); return x*x*(3-2*x); }
function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mixc(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function css(c){ return 'rgb('+Math.round(clamp(c[0],0,255))+','+Math.round(clamp(c[1],0,255))+','+Math.round(clamp(c[2],0,255))+')'; }
function cosPal(v, cols){ const x=((v%1)+1)%1; const seg=x* (cols.length-1); const i=Math.min(cols.length-2, Math.floor(seg)); return mixc(cols[i], cols[i+1], seg-i); }

// No.81 Wormhole Study: seeded constants rings=16, folds=3, loop 12s
const RINGS=16, FOLDS=3;
const GROUND=hexRGB('#05070D'), MAG=hexRGB('#E040FB'), TEAL=hexRGB('#18E0C8'), AMB=hexRGB('#FFB13D'), CORE=hexRGB('#FFF6E8');
let dragX=0, dragY=0, dragging=false, sx=0, sy=0, holdUntil=-1;
function field(u,v,t){
  const breathe=Math.sin(2*Math.PI*t/12);
  let x=u+dragX*0.35, y=v+0.08+dragY*0.35;
  const wx=0.18*Math.sin(y*2.1+2*Math.PI*t/12), wy=0.18*Math.cos(x*1.9-2*Math.PI*t/12);
  x+=wx*0.25; y+=wy*0.25;
  const r=Math.max(0.06, Math.hypot(x,y)), a=Math.atan2(y,x);
  let depth=1.0/r + t/12*2.0 + 0.35*Math.sin(a*3+2*Math.PI*t/12);
  let fv=depth;
  for(let i=0;i<FOLDS;i++){ fv=Math.abs(fv-Math.floor(fv)-0.5)*2; fv=fv*1.15+0.08*Math.sin(a*(i+2)); }
  const band=depth* (RINGS/7.0);
  let col=cosPal(band*0.22 + fv*0.25, [MAG,TEAL,AMB,MAG]);
  const rim=smooth((r-0.05)/0.55), dark=0.25+0.75*rim;
  col=mixc(GROUND,col, dark);
  if(r<0.16) col=mixc(col, CORE, (0.16-r)/0.16*0.7);
  return col;
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h); const t=nowMs/1000;
  ctx.fillStyle='#05070D'; ctx.fillRect(0,0,w,h);
  const cell=isPhone()?9:11, cols=Math.ceil(w/cell), rows=Math.ceil(h/cell);
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
    const u=((i+0.5)*cell-w/2)/(Math.min(w,h)/2), v=((j+0.5)*cell-h/2)/(Math.min(w,h)/2);
    ctx.fillStyle=css(field(u,v,t)); ctx.fillRect(i*cell,j*cell,cell+1,cell+1);
  }
  if(RINGS<14||RINGS>20) console.assert(false,'rings',RINGS);
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; sx=e.clientX; sy=e.clientY; });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; dragX=clamp((e.clientX-sx)/220,-1,1); dragY=clamp((e.clientY-sy)/220,-1,1); });
function endP(){ if(dragging){ dragging=false; holdUntil=performance.now()/1000+3; setTimeout(()=>{ dragX=0; dragY=0; },3100); } }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(4000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
