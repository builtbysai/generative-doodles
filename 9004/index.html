<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&#8470;9004 &middot; Tidepool</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #100d08;
    color: #cdbfa5;
    font-family: Georgia, "Times New Roman", serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100dvh; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  #wrap { position: relative; }
  #stage {
    display: block;
    box-shadow: 0 18px 60px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.5);
    cursor: pointer;
    touch-action: manipulation;
  }
  #cap { text-align: center; margin-top: 14px; line-height: 1.5; padding: 0 16px; }
  #cap .t { font-size: 17px; letter-spacing: .14em; color: #efe6cf; }
  #cap .s { font-size: 12.5px; color: #8d7f63; font-style: italic; }
  #cap .h { font-size: 12.5px; color: #6f6350; margin-top: 2px; }
  body.bare { justify-content: center; }
  body.bare #cap { display: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="stage"></canvas></div>
<div id="cap">
  <div class="t">&#8470;9004 &middot; Tidepool</div>
  <div class="s" id="readout"></div>
  <div class="h">A living chemical field, drawn as ink on paper. Click anywhere to reseed the tide.</div>
</div>
<script>
"use strict";
/* №9004 · Tidepool — Gray-Scott reaction-diffusion, ink on warm paper.
   Own implementation. Vanilla canvas, typed arrays, deterministic seeds. */

const qs = new URLSearchParams(location.search);

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* Curated classic regimes, verified by parameter sweep 2026-09-23:
   coral labyrinths, mitosis spots, wavelets, stripes, turing fields. */
const REGIMES = [
  { label: "coral labyrinth", F: 0.035, k: 0.060,  mature: 12000 },
  { label: "mitosis",         F: 0.014, k: 0.054,  mature: 26000 },
  { label: "wavelets",        F: 0.030, k: 0.062,  mature: 12000 },
  { label: "tide stripes",    F: 0.025, k: 0.055,  mature: 14000 },
  { label: "turing field",    F: 0.010, k: 0.047,  mature: 20000 },
  { label: "spots and rings", F: 0.014, k: 0.049,  mature: 20000 },
];

const isMobile = Math.min(innerWidth, innerHeight) < 520 || qs.get("mobile") === "1";
const N = isMobile ? 128 : 176;

class GrayScott {
  constructor(n, F, k) {
    this.n = n;
    this.F0 = F; this.k0 = k;
    this.F = F; this.k = k;
    const s = n * n;
    this.u = new Float32Array(s).fill(1);
    this.v = new Float32Array(s);
    this.un = new Float32Array(s);
    this.vn = new Float32Array(s);
    this.iters = 0;
    // per-cell wrap indices, precomputed once
    this.xm = new Int32Array(n); this.xp = new Int32Array(n);
    for (let x = 0; x < n; x++) { this.xm[x] = (x - 1 + n) % n; this.xp[x] = (x + 1) % n; }
    this.avgCost = 2; // ms per iteration, refined at runtime
  }
  seed(rng) {
    const n = this.n;
    this.u.fill(1); this.v.fill(0);
    this.iters = 0;
    // Sow a handful of V colonies; they bloom into coral/spots. A whisper of
    // background noise keeps the field organic without turning to mush.
    const colonies = 9 + Math.floor(rng() * 5);
    const r = Math.max(4, n >> 5);
    for (let c = 0; c < colonies; c++) {
      const cx = r + Math.floor(rng() * (n - 2 * r));
      const cy = r + Math.floor(rng() * (n - 2 * r));
      const w = r + Math.floor(rng() * r * 2);
      for (let y = -w; y <= w; y++) for (let x = -w; x <= w; x++) {
        if (x * x + y * y > w * w) continue;
        const xx = (cx + x + n) % n, yy = (cy + y + n) % n;
        const i = yy * n + xx;
        this.v[i] = 0.9 + rng() * 0.1;
        this.u[i] = 0.25;
      }
    }
    for (let i = 0; i < n * n; i++) this.v[i] += rng() * 0.008;
  }
  step() {
    const n = this.n, u = this.u, v = this.v, un = this.un, vn = this.vn;
    const xm = this.xm, xp = this.xp;
    const Du = 0.16, Dv = 0.08, F = this.F, k = this.k, Fk = F + k;
    for (let y = 0; y < n; y++) {
      const ym = ((y - 1 + n) % n) * n, yp = ((y + 1) % n) * n, yc = y * n;
      for (let x = 0; x < n; x++) {
        const i = yc + x, l = xm[x], r = xp[x];
        const uu = u[i], vv = v[i];
        const lapU = 0.2 * (u[yc + l] + u[yc + r] + u[ym + x] + u[yp + x])
                   + 0.05 * (u[ym + l] + u[ym + r] + u[yp + l] + u[yp + r]) - uu;
        const lapV = 0.2 * (v[yc + l] + v[yc + r] + v[ym + x] + v[yp + x])
                   + 0.05 * (v[ym + l] + v[ym + r] + v[yp + l] + v[yp + r]) - vv;
        const uvv = uu * vv * vv;
        un[i] = uu + Du * lapU - uvv + F * (1 - uu);
        vn[i] = vv + Dv * lapV + uvv - Fk * vv;
      }
    }
    this.u = un; this.v = vn; this.un = u; this.vn = v;
    this.iters++;
  }
  // Slow drift inside a narrow, known-good band keeps the field alive
  // without wandering into mush.
  drift(now) {
    const m = Math.min(1, this.iters / this.regime.mature);
    this.F = this.F0 * (1 + 0.05 * m * Math.sin(now * 0.00021 + this.ph1));
    this.k = this.k0 * (1 + 0.05 * m * Math.sin(now * 0.00017 + this.ph2));
  }
}

/* ---------- rendering: V as ink on warm paper ---------- */
const PAPER = [243, 235, 214];
const UMBER = [122, 95, 62];
const INK   = [32, 25, 16];

const stage = document.getElementById("stage");
const sctx = stage.getContext("2d");
const simCanvas = document.createElement("canvas");
simCanvas.width = simCanvas.height = N;
const simCtx = simCanvas.getContext("2d");
const img = simCtx.createImageData(N, N);
const grain = document.createElement("canvas");
grain.width = grain.height = 160;
{
  const g = grain.getContext("2d");
  const gi = g.createImageData(160, 160);
  const gr = mulberry32(1234);
  for (let i = 0; i < gi.data.length; i += 4) {
    const t = 235 + Math.floor(gr() * 20);
    gi.data[i] = gi.data[i + 1] = gi.data[i + 2] = t; gi.data[i + 3] = 255;
  }
  g.putImageData(gi, 0, 0);
}

function smooth(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function render(sim) {
  const n = sim.n, u = sim.u, v = sim.v, d = img.data;
  for (let i = 0, p = 0; i < n * n; i++, p += 4) {
    const vv = v[i] < 0 ? 0 : v[i];
    const t = smooth(0.02, 0.5, vv);          // ink density from V
    const shade = 0.94 + 0.06 * (u[i] > 1 ? 1 : u[i]); // U tints the paper
    let r, g, b;
    if (t < 0.5) {
      const m = t * 2;
      r = PAPER[0] + (UMBER[0] - PAPER[0]) * m;
      g = PAPER[1] + (UMBER[1] - PAPER[1]) * m;
      b = PAPER[2] + (UMBER[2] - PAPER[2]) * m;
    } else {
      const m = (t - 0.5) * 2;
      r = UMBER[0] + (INK[0] - UMBER[0]) * m;
      g = UMBER[1] + (INK[1] - UMBER[1]) * m;
      b = UMBER[2] + (INK[2] - UMBER[2]) * m;
    }
    d[p] = r * shade; d[p + 1] = g * shade; d[p + 2] = b * shade; d[p + 3] = 255;
  }
  simCtx.putImageData(img, 0, 0);

  const S = stage.width;
  sctx.imageSmoothingEnabled = true;
  sctx.imageSmoothingQuality = "high";
  sctx.fillStyle = "#f3ebd6";
  sctx.fillRect(0, 0, S, S);
  // soft ink-bleed halo, then the crisp layer
  sctx.save();
  sctx.globalAlpha = 0.4;
  sctx.filter = "blur(3px)";
  sctx.drawImage(simCanvas, 0, 0, S, S);
  sctx.restore();
  sctx.drawImage(simCanvas, 0, 0, S, S);
  // paper grain
  sctx.save();
  sctx.globalAlpha = 0.06;
  sctx.globalCompositeOperation = "multiply";
  const pat = sctx.createPattern(grain, "repeat");
  sctx.fillStyle = pat;
  sctx.fillRect(0, 0, S, S);
  sctx.restore();
  // gentle vignette
  const vg = sctx.createRadialGradient(S/2, S/2, S*0.35, S/2, S/2, S*0.75);
  vg.addColorStop(0, "rgba(30,20,10,0)");
  vg.addColorStop(1, "rgba(30,20,10,0.16)");
  sctx.fillStyle = vg;
  sctx.fillRect(0, 0, S, S);
}

/* ---------- layout ---------- */
function layout() {
  const bare = qs.get("bare") === "1";
  if (bare) document.body.classList.add("bare");
  const capH = bare ? 0 : 96;
  const pad = bare ? 0 : 24;
  const side = Math.max(200, Math.min(innerWidth - pad, innerHeight - capH - pad));
  stage.width = stage.height = Math.floor(side);
  stage.style.width = stage.style.height = side + "px";
}
addEventListener("resize", () => { layout(); render(sim); });

/* ---------- state, seeding, animation ---------- */
const seed = (parseInt(qs.get("seed"), 10) >>> 0) || 9004;
let regIdx = Math.min(REGIMES.length - 1, Math.max(0, parseInt(qs.get("reg"), 10) || 0));

const sim = new GrayScott(N, REGIMES[regIdx].F, REGIMES[regIdx].k);
sim.regime = REGIMES[regIdx];
const rng0 = mulberry32(seed);
sim.ph1 = rng0() * 6.283; sim.ph2 = rng0() * 6.283;
sim.seed(rng0);

const readout = document.getElementById("readout");
function updateReadout() {
  readout.textContent = "feed " + sim.F0.toFixed(3) + " · kill " + sim.k0.toFixed(3) +
    " · " + sim.regime.label + " · seed " + seed;
}

function frameBudget() { return isMobile ? 5 : 9; }

function runBudgeted() {
  // adapt iterations/frame to measured cost
  const target = Math.max(1, Math.min(48, Math.round(frameBudget() / sim.avgCost)));
  const t0 = performance.now();
  for (let s = 0; s < target; s++) sim.step();
  const cost = (performance.now() - t0) / target;
  sim.avgCost = sim.avgCost * 0.9 + cost * 0.1;
  return target;
}

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const stillN = parseInt(qs.get("still"), 10) || 0;
window.__iters = 0;

layout();
updateReadout();

if (stillN > 0) {
  // Synchronous test harness: run N iterations, render once.
  // ?drift=1 also applies the live parameter drift during the run.
  const useDrift = qs.get("drift") === "1";
  const t0 = performance.now();
  for (let s = 0; s < stillN; s++) { if (useDrift) sim.drift(s * 16); sim.step(); }
  render(sim);
  let mx = 0, sum = 0;
  for (let i = 0; i < sim.v.length; i++) { const x = sim.v[i]; if (x > mx) mx = x; sum += x; }
  window.__stats = { iters: sim.iters, maxV: +mx.toFixed(4), meanV: +(sum / sim.v.length).toFixed(5),
                     ms: Math.round(performance.now() - t0) };
  window.__iters = sim.iters;
  window.__done = true;
} else if (reduced) {
  for (let s = 0; s < sim.regime.mature; s++) sim.step();
  render(sim);
} else {
  (function loop(now) {
    sim.drift(now || 0);
    runBudgeted();
    render(sim);
    window.__iters = sim.iters;
    requestAnimationFrame(loop);
  })(0);
}

stage.addEventListener("click", () => {
  let next = Math.floor(Math.random() * REGIMES.length);
  if (next === regIdx) next = (next + 1) % REGIMES.length;
  const ns = (Math.random() * 1e9) | 0;
  const u = new URL(location.href);
  u.searchParams.set("seed", ns);
  u.searchParams.set("reg", next);
  location.href = u.toString();
});
</script>
</body>
</html>
