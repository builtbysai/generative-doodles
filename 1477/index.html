<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Archive of Eight Hundred Tapes</title>
<style>
html, body { margin: 0; padding: 0; background: #2a2a30; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1477000);

  var WOOD = '#8a6a48';
  var SHADOW = '#2a2a30';
  var GOLD = '#d9a441';
  var CREAM = '#d8d2c4';
  var SPINE_COLORS = ['#4a5a7a', '#6b4a3a', '#2f4636', '#7a6a8a', '#d8d2c4'];
  var ROWS = 5, COLS = 10;
  var LIT_SECONDS = 6;

  // Seeded spine grid: colour + gold-stripe flag, fixed at load.
  var grid = [];
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      grid.push({ color: SPINE_COLORS[Math.floor(rnd() * SPINE_COLORS.length)], gold: rnd() < 0.3 });
    }
  }

  var W = 0, H = 0;
  function size() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W; canvas.height = H;
  }
  size();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', size);
  }
  window.addEventListener('resize', size);

  function isPhone() {
    try {
      var m = Math.min(window.screen.width, window.screen.height);
      if (m < 700) return true;
    } catch (e) {}
    return H > W * 1.15;
  }

  function layout() {
    var phone = isPhone();
    var pad = phone ? 12 : 28;
    var gapX = phone ? 6 : 12;
    var bandH = (H - pad * 2) / ROWS;
    var spineW = (W - pad * 2 - (COLS - 1) * gapX) / COLS;
    var boardH = 8;
    var spineH = bandH - boardH - 22;
    var mw = Math.round(Math.min(W, H) * 0.62);
    var mh = Math.round(mw * 0.62);
    return {
      pad: pad, gapX: gapX, bandH: bandH, spineW: spineW, boardH: boardH,
      spineH: spineH,
      monitor: { x: (W - mw) / 2, y: (H - mh) / 2, w: mw, h: mh }
    };
  }

  function spineRect(L, idx) {
    var r = Math.floor(idx / COLS), c = idx % COLS;
    var bandTop = L.pad + r * L.bandH;
    var boardY = bandTop + L.bandH - L.boardH - 4;
    return {
      x: L.pad + c * (L.spineW + L.gapX),
      y: boardY - L.spineH,
      w: L.spineW, h: L.spineH,
      boardY: boardY, bandTop: bandTop
    };
  }

  // Tap events, replayed closed-form: tapping a spine pulls it out,
  // tapping the pulled spine pushes it back, tapping another swaps.
  var taps = [];
  function pulledAt() {
    var pulled = null;
    for (var i = 0; i < taps.length; i++) {
      pulled = (taps[i] === pulled) ? null : taps[i];
    }
    return pulled;
  }

  function handleTap(x, y) {
    var L = layout();
    var mon = L.monitor;
    if (x >= mon.x && x <= mon.x + mon.w && y >= mon.y && y <= mon.y + mon.h) return;
    for (var i = 0; i < grid.length; i++) {
      var s = spineRect(L, i);
      if (x >= s.x - 4 && x <= s.x + s.w + 4 && y >= s.y - 4 && y <= s.y + s.h + 4) {
        taps.push(i);
        return;
      }
    }
  }

  var downPos = null;
  canvas.addEventListener('pointerdown', function (e) { downPos = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener('pointerup', function (e) {
    if (!downPos) return;
    var dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
    if (dx * dx + dy * dy < 144) handleTap(e.clientX, e.clientY);
    downPos = null;
  });

  function round4(v) { return Math.round(v * 10000) / 10000; }

  function drawRoom(t, x, y, w, h) {
    ctx.fillStyle = CREAM; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = WOOD; ctx.fillRect(x, y + h * 0.75, w, h * 0.25);
    var cols = ['#4a5a7a', '#2f4636', '#6b4a3a'];
    var speaker = Math.floor(t / 4) % 3;
    for (var i = 0; i < 3; i++) {
      var fx = x + w * (0.18 + i * 0.32);
      var bw = w * 0.14, bh = h * 0.34;
      var by = y + h * 0.75 - bh;
      ctx.fillStyle = cols[i]; ctx.fillRect(fx, by, bw, bh);
      ctx.beginPath(); ctx.moveTo(fx + bw / 2, by - h * 0.09);
      ctx.arc(fx + bw / 2, by - h * 0.09, w * 0.055, 0, Math.PI * 2); ctx.fillStyle = SHADOW; ctx.fill();
      if (i === speaker) {
        ctx.strokeStyle = GOLD; ctx.lineWidth = Math.max(1, w * 0.008);
        ctx.beginPath();
        var vx = fx + bw / 2, vy = by - h * 0.16;
        ctx.moveTo(vx, vy);
        ctx.lineTo(vx + w * 0.02, vy - h * 0.06);
        ctx.lineTo(vx - w * 0.02, vy - h * 0.12);
        ctx.lineTo(vx + w * 0.02, vy - h * 0.18);
        ctx.stroke();
      }
    }
  }

  function drawCrowd(t, x, y, w, h) {
    ctx.fillStyle = CREAM; ctx.fillRect(x, y, w, h);
    var cols = ['#4a5a7a', '#6b4a3a', '#2f4636', '#7a6a8a', '#d8d2c4', '#4a5a7a', '#6b4a3a'];
    for (var i = 0; i < 7; i++) {
      var fx = x + w * (0.08 + i * 0.13);
      var nod = Math.sin(t * 1.5 + i * 0.9) * h * 0.03;
      var bw = w * 0.09, bh = h * 0.30;
      var by = y + h * 0.78 - bh + nod;
      ctx.fillStyle = cols[i]; ctx.fillRect(fx, by, bw, bh);
      ctx.beginPath(); ctx.moveTo(fx + bw / 2, by - h * 0.07 + nod);
      ctx.arc(fx + bw / 2, by - h * 0.07 + nod, w * 0.04, 0, Math.PI * 2);
      ctx.fillStyle = SHADOW; ctx.fill();
    }
  }

  function drawMonitors(t, x, y, w, h) {
    ctx.fillStyle = SHADOW; ctx.fillRect(x, y, w, h);
    var screens = [CREAM, '#d8d2c4', '#7a6a8a'];
    for (var j = 0; j < 3; j++) {
      var mx = x + w * (0.08 + j * 0.32);
      var mw2 = w * 0.26, mh2 = h * 0.6, my = y + h * 0.2;
      ctx.fillStyle = screens[(Math.floor(t / 2) + j) % 3];
      ctx.fillRect(mx, my, mw2, mh2);
      var flick = (Math.floor(t * 2) + j) % 2 === 0;
      if (flick) {
        ctx.fillStyle = SHADOW;
        ctx.fillRect(mx + mw2 * 0.2, my + mh2 * 0.25, mw2 * 0.6, mh2 * 0.14);
        ctx.fillRect(mx + mw2 * 0.15, my + mh2 * 0.55, mw2 * 0.4, mh2 * 0.14);
      }
    }
  }

  var lastT = 0;
  function draw(t) {
    lastT = t;
    var L = layout();
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = SHADOW; ctx.fillRect(0, 0, W, H);
    var litRow = Math.floor(t / LIT_SECONDS) % ROWS;

    // Shelf boards + spines.
    for (var i = 0; i < grid.length; i++) {
      var s = spineRect(L, i);
      ctx.fillStyle = WOOD;
      ctx.fillRect(L.pad, s.boardY, W - L.pad * 2, L.boardH);
      ctx.fillStyle = grid[i].color;
      ctx.fillRect(s.x, s.y, s.w, s.h);
      if (grid[i].gold) {
        ctx.fillStyle = GOLD;
        ctx.fillRect(s.x + s.w * 0.18, s.y + 3, Math.max(2, s.w * 0.12), s.h - 6);
      }
    }
    // Soft shadow over every unlit row.
    ctx.fillStyle = 'rgba(42,42,48,0.35)';
    for (var r = 0; r < ROWS; r++) {
      if (r === litRow) continue;
      ctx.fillRect(0, L.pad + r * L.bandH, W, L.bandH);
    }
    // Gold underline marks the lit shelf.
    var litBandTop = L.pad + litRow * L.bandH;
    ctx.fillStyle = GOLD;
    ctx.fillRect(L.pad, litBandTop + L.bandH - 2, W - L.pad * 2, 3);

    // Pulled spine, drawn shifted out of its slot, above the shadow.
    var pulled = pulledAt();
    if (pulled !== null) {
      var ps = spineRect(L, pulled);
      ctx.fillStyle = grid[pulled].color;
      ctx.fillRect(ps.x, ps.y - 14, ps.w, ps.h);
      if (grid[pulled].gold) {
        ctx.fillStyle = GOLD;
        ctx.fillRect(ps.x + ps.w * 0.18, ps.y - 14 + 3, Math.max(2, ps.w * 0.12), ps.h - 6);
      }
    }

    // Monitor frame, centred, overlapping the shelves, about a third of the frame.
    var mon = L.monitor;
    ctx.fillStyle = GOLD; ctx.fillRect(mon.x, mon.y, mon.w, mon.h);
    ctx.fillStyle = SHADOW; ctx.fillRect(mon.x + 2, mon.y + 2, mon.w - 4, mon.h - 4);
    var sx = mon.x + 12, sy = mon.y + 12, sw = mon.w - 24, sh = mon.h - 24;
    if (pulled === null) {
      ctx.fillStyle = SHADOW; ctx.fillRect(sx, sy, sw, sh);
      var a = round4(0.5 + 0.5 * Math.sin(t * 2));
      ctx.fillStyle = 'rgba(217,164,65,' + a + ')';
      ctx.fillRect(sx + sw / 2 - 4, sy + sh / 2 - 4, 8, 8);
    } else if (pulled % 3 === 0) {
      drawRoom(t, sx, sy, sw, sh);
    } else if (pulled % 3 === 1) {
      drawCrowd(t, sx, sy, sw, sh);
    } else {
      drawMonitors(t, sx, sy, sw, sh);
    }
  }

  // Frame one is a constant phase: draw(0) synchronously at load.
  draw(0);
  var startTime = null;
  function loop(ts) {
    if (startTime === null) startTime = ts;
    draw((ts - startTime) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  window.__piece = {
    draw: draw,
    tap: handleTap,
    state: function () {
      var L = layout();
      return {
        litRow: Math.floor(lastT / LIT_SECONDS) % ROWS,
        pulled: pulledAt(),
        monitor: L.monitor
      };
    }
  };
})();
</script>
</body>
</html>
