<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.436 Dive Repeat</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1E8A8A; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.436 Dive Repeat (angelina_bambina_dsgn, EXPANSION #47).
// After Angelina Bambina's DIVE pattern: a seamless
// body-positive repeat of diverse women swimming on teal,
// shown across the upper two thirds of the frame and
// folded over a product mockup in the lower third.
//
// The tile is DATA, never an offscreen canvas. One tile
// is 320 x 150 and carries exactly four swimmer figures:
// two fully inside, two centred on the bottom edge so
// they wrap exactly within their column. The plane is
// tiled on a lattice: column pitch 320, row pitch 150,
// alternate columns dropped by half a tile (75). Every
// motif is drawn at its lattice translates and clipped
// only by the region, never per tile, so the repeat is
// seamless at every border. No motif crosses a vertical
// tile edge, the one place a half-drop would break it.
//
// WATCH-ONLY 24s loop: the swimmers stroke in place
// (arms on 3 whole cycles per loop, legs on 6), the
// seaweed sways on 2, each figure trails one bubble
// stream that rises its full length once per loop.
// DRAG scrolls the pattern endlessly in both axes (the
// scroll is a world offset, wrapping by the lattice).
// DOUBLE-TAP switches the product mockup through three
// authored products: beach towel, pillowcase, bath mat.
// The figures are flat stylised silhouettes, joyful and
// dignified, never sexualised (the artist's own rule).
//
// Frame one is drawn synchronously at the constant
// phase T = 7.0s (mid-stroke, bubbles spread through
// their rise); the clock is anchored there and advances
// in fixed 1/60 ticks, never from a wall clock. One
// canvas, flat colour only, no gradients, no
// shadowBlur, no text anywhere.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Closed set from the prompt, nothing else. Hair colours
// resolve inside the palette: blonde takes the suit
// yellow #F2C230, white hair takes the product cream
// #F5F0E6, dark brown takes the deep skin tone #8A4B2E,
// auburn takes the coral #F27059. The cream also serves
// as the white of the red-white striped suit.
var TEAL = '#1E8A8A', TEAL2 = '#2E8B8B';
var SKIN1 = '#E8A87C', SKIN2 = '#C97B4A', SKIN3 = '#8A4B2E';
var YELLOW = '#F2C230', RED = '#D94F4F', PINK = '#F06A8A';
var CORAL = '#F27059', SEAWEED = '#4E7A3A', CREAM = '#F5F0E6';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 24;
if (LOOP !== 24) throw new Error('Dive Repeat loop must be 24s');
var TICK = 1 / 60;

// ---- small draw helpers ---------------------------------
function circ(x, y, r, fill) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function ell(x, y, rx, ry, fill) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function line(x0, y0, x1, y1, col, lw) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
}
function rect(x, y, w, h, fill) {
  ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
}
function poly(points, fill) {
  ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);
  for (var i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function limb(pts, col, lw, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.strokeStyle = col; ctx.lineWidth = lw;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.restore();
}

// ---- the tile -------------------------------------------
// Tile geometry (see process.md for the full account):
// TW x TH = 320 x 150. Column pitch TW, row pitch TH,
// odd world columns dropped TH/2. Figures' horizontal
// extents stay inside [12, 308] so nothing crosses a
// vertical edge; the two partner figures sit on the
// bottom edge (y = TH) and wrap within their column.
var TW = 320, TH = 150;

var VARIANTS = [
  { skin: SKIN1, hair: YELLOW, suit: 'floral', base: YELLOW, w: 1.00, ry: 14.0, pony: 0 },
  { skin: SKIN3, hair: CREAM,  suit: 'stripes', base: RED,    w: 1.06, ry: 16.5, pony: 1 },
  { skin: SKIN2, hair: SKIN3,  suit: 'polka',   base: TEAL2,  w: 0.94, ry: 12.5, pony: 0 },
  { skin: SKIN1, hair: CORAL,  suit: 'pink',    base: PINK,   w: 1.05, ry: 16.0, pony: 1 }
];
// Two skins repeat across the four variants because the
// closed palette holds exactly three skin tones; hair,
// suit and body type keep every figure distinct.
var FIGURES = [
  { v: 0, x: 85,  y: 42,  ph: 0.0 },
  { v: 1, x: 240, y: 108, ph: 1.7 },
  { v: 2, x: 120, y: 150, ph: 3.1 },
  { v: 3, x: 255, y: 150, ph: 4.4 }
];
if (FIGURES.length !== 4) throw new Error('tile must carry exactly 4 swimmers');
var BUBBLES_PER_STREAM = 5;
var CORALS = [
  { x: 26, y: 84, s: 0.9 },
  { x: 215, y: 28, s: 0.85 }
];
// Seaweed: one tuft anchored in the free pocket at the
// tile's bottom-left, plus two floating sprigs in the
// open water between the figures. Nothing overlaps a
// figure: the bottom edge is busy with the two partner
// figures, so the tufts live where the tile is empty.
var WEEDS = [16];
var SPRIGS = [[200, 64], [300, 64]];

// ---- one swimmer -----------------------------------------
// Local coords, facing +x, origin at the torso centre.
// Torso ellipse, suit clipped onto it, limbs as two-
// segment polylines. Arms sweep a full circle (front
// crawl) on 3 whole cycles per loop; legs flutter on 6.
function drawArm(V, th, alpha) {
  var sx = 25, sy = -3;
  var ex = sx + 18 * Math.cos(th), ey = sy + 18 * Math.sin(th);
  var hx = ex + 17 * Math.cos(th + 0.8), hy = ey + 17 * Math.sin(th + 0.8);
  limb([[sx, sy], [ex, ey], [hx, hy]], V.skin, 7, alpha);
}
function drawLeg(V, hipY, ph, alpha) {
  // a gentle near-parallel flutter: the knees and feet
  // stay close, so the legs read as legs, not a tail fin
  var kx = -45, ky = hipY + 6 * Math.sin(ph);
  var fx = kx - 15, fy = ky + 4 * Math.sin(ph - 0.8);
  limb([[-28, hipY], [kx, ky], [fx, fy]], V.skin, 7.5, alpha);
}
var FLORAL_SPOTS = [[-18, -5], [-4, 5], [8, -6], [18, 3], [-12, 6]];
var POLKA_SPOTS = [[-18, -5], [-6, 5], [4, -6], [14, 4], [10, -1]];
function drawSuit(V) {
  var rx = 30 * V.w, ry = V.ry;
  ell(-3, 0, rx, ry, V.base);
  ctx.save();
  ctx.beginPath(); ctx.ellipse(-3, 0, rx, ry, 0, 0, Math.PI * 2); ctx.clip();
  var i, k;
  if (V.suit === 'floral') {
    for (i = 0; i < FLORAL_SPOTS.length; i++) {
      var fx = -3 + FLORAL_SPOTS[i][0], fy = FLORAL_SPOTS[i][1];
      for (k = 0; k < 5; k++) {
        var pa = k * Math.PI * 2 / 5;
        circ(fx + 3.0 * Math.cos(pa), fy + 3.0 * Math.sin(pa), 2.2, CORAL);
      }
      circ(fx, fy, 1.5, CREAM);
    }
  } else if (V.suit === 'stripes') {
    ctx.translate(-3, 0); ctx.rotate(0.42);
    for (k = -4; k <= 4; k++) {
      if (k % 2 === 0) rect(k * 11 - 2.75, -ry - 6, 5.5, 2 * ry + 12, CREAM);
    }
    ctx.rotate(-0.42); ctx.translate(3, 0);
  } else if (V.suit === 'polka') {
    for (i = 0; i < POLKA_SPOTS.length; i++) {
      circ(-3 + POLKA_SPOTS[i][0], POLKA_SPOTS[i][1], 3, CREAM);
    }
    rect(-1, -ry, 5, 2 * ry, CREAM);
  } else { // pink: solid with a cream waistband
    rect(-2, -ry, 6, 2 * ry, CREAM);
  }
  ctx.restore();
}
function drawSwimmer(f, lt) {
  var V = VARIANTS[f.v];
  var armPh = Math.PI * 2 * 3 * lt / LOOP + f.ph;
  var legPh = Math.PI * 2 * 6 * lt / LOOP + f.ph * 1.3;
  // bubble stream: rises its full 105px once per loop,
  // five bubbles at fixed fractions of the stream phase
  var bi, frac, bx, by;
  for (bi = 0; bi < BUBBLES_PER_STREAM; bi++) {
    frac = (lt / LOOP + bi / BUBBLES_PER_STREAM + f.ph * 0.13) % 1;
    bx = 48 + 8 * Math.sin(frac * 7 + f.ph * 3);
    by = -5 - frac * 88;
    ctx.globalAlpha = 0.55 - 0.35 * frac;
    circ(bx, by, 1.8 + 2.6 * frac, CREAM);
  }
  ctx.globalAlpha = 1;
  drawArm(V, armPh + Math.PI, 0.72);
  drawLeg(V, -4, legPh + Math.PI, 0.72);
  ell(0, 0, 34 * V.w, V.ry, V.skin);
  drawSuit(V);
  ell(19, -1, 13, V.ry * 0.78, V.skin); // shoulder and chest
  drawLeg(V, 6, legPh, 1);
  drawArm(V, armPh, 1);
  // head with a hair crescent, a trailing hair mass
  // behind it and, on two variants, a bun on top
  circ(48, -5, 11.5, V.skin);
  circ(45, -6.5, 11, V.hair);
  circ(49.5, -3.5, 9.8, V.skin);
  circ(37, -9, 5.5, V.hair);
  if (V.pony) circ(36, -13, 5.5, V.hair);
}
function drawCoral(c) {
  var tips = [[-9, -20], [0, -27], [9, -19], [16, -25]];
  ctx.save();
  ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
  for (var i = 0; i < tips.length; i++) {
    line(0, 0, tips[i][0], tips[i][1], CORAL, 6);
    circ(tips[i][0], tips[i][1], 3.2, CORAL);
  }
  ell(3, 2, 12, 5, CORAL);
  ctx.restore();
}
function drawWeed(x, baseY, lt, ph) {
  for (var i = 0; i < 3; i++) {
    var bx = x + i * 7 - 7;
    var sway = 4 * Math.sin(Math.PI * 2 * 2 * lt / LOOP + ph + i * 0.9);
    ctx.beginPath();
    ctx.moveTo(bx, baseY);
    ctx.quadraticCurveTo(bx + sway * 0.4, baseY - 14, bx + sway, baseY - 25 - (i % 2) * 5);
    ctx.strokeStyle = SEAWEED; ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.stroke();
  }
}
function drawSprig(x, y, lt, ph) {
  // a small floating frond: five short blades radiating
  // from a knot, swaying on the same 2-cycle rhythm
  var sway = 3 * Math.sin(Math.PI * 2 * 2 * lt / LOOP + ph);
  var dirs = [[-12, -9], [-4, -14], [5, -13], [12, -7], [0, 12]];
  for (var i = 0; i < dirs.length; i++) {
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + dirs[i][0] * 0.5 + sway * 0.4, y + dirs[i][1] * 0.6,
                         x + dirs[i][0] + sway, y + dirs[i][1]);
    ctx.strokeStyle = SEAWEED; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.stroke();
  }
  circ(x, y, 2.6, SEAWEED);
}
function drawTile(tx, ty, lt) {
  var i;
  for (i = 0; i < CORALS.length; i++) {
    ctx.save(); ctx.translate(tx, ty); drawCoral(CORALS[i]); ctx.restore();
  }
  for (i = 0; i < WEEDS.length; i++) drawWeed(tx + WEEDS[i], ty + TH, lt, i * 1.31);
  for (i = 0; i < SPRIGS.length; i++) drawSprig(tx + SPRIGS[i][0], ty + SPRIGS[i][1], lt, i * 2.13);
  for (i = 0; i < FIGURES.length; i++) {
    var f = FIGURES[i];
    var bob = 3 * Math.sin(Math.PI * 2 * 2 * lt / LOOP + f.ph);
    ctx.save();
    ctx.translate(tx + f.x, ty + f.y + bob);
    drawSwimmer(f, lt);
    ctx.restore();
  }
}

// ---- the pattern field ------------------------------------
// Draws the lattice pattern clipped to a rect. The clip
// is the only clip: motifs spill across tile borders
// freely and are completed by neighbouring instances.
function drawPattern(x0, y0, x1, y1, lt) {
  ctx.save();
  ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
  rect(x0, y0, x1 - x0, y1 - y0, TEAL);
  var cMin = Math.floor((x0 + scrollX) / TW) - 1;
  var cMax = Math.floor((x1 + scrollX) / TW) + 1;
  for (var c = cMin; c <= cMax; c++) {
    var drop = (((c % 2) + 2) % 2) * (TH / 2);
    var tx = c * TW - scrollX;
    var rMin = Math.floor((y0 + scrollY - drop) / TH) - 1;
    var rMax = Math.floor((y1 + scrollY - drop) / TH) + 1;
    for (var r = rMin; r <= rMax; r++) {
      drawTile(tx, r * TH + drop - scrollY, lt);
    }
  }
  ctx.restore();
}

// ---- the product mockups -----------------------------------
// Exactly three authored products. Each is a cream-edged
// shape; the same pattern, at the same scroll, shows
// through its inner window, so the product reads as the
// same cloth folded. A folded corner sits top-right.
var PRODUCTS = [
  { kind: 'towel',  x: 80,  y: 648, w: 1120, h: 236, inset: 14, r: 0 },
  { kind: 'pillow', x: 330, y: 636, w: 620,  h: 248, inset: 22, r: 6 },
  { kind: 'mat',    x: 230, y: 660, w: 820,  h: 216, inset: 18, r: 36 }
];
if (PRODUCTS.length !== 3) throw new Error('exactly 3 products');
var FOLD = 58;
function shapePath(P, inset, dy) {
  var x = P.x + inset, y = P.y + inset + (dy || 0);
  var w = P.w - 2 * inset, h = P.h - 2 * inset;
  var r = Math.max(0, P.r - inset);
  ctx.beginPath();
  if (r <= 0) { ctx.rect(x, y, w, h); return; }
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function drawProduct(lt) {
  var P = PRODUCTS[prodIdx];
  // cream plate peeking below: the product's thickness
  shapePath(P, 0, 9); ctx.fillStyle = CREAM; ctx.fill();
  // cream edge (full shape), then the pattern window
  shapePath(P, 0, 0); ctx.fillStyle = CREAM; ctx.fill();
  var ix = P.x + P.inset, iy = P.y + P.inset;
  drawPattern(ix, iy, ix + P.w - 2 * P.inset, iy + P.h - 2 * P.inset, lt);
  // redraw the inner window edge cleanly
  shapePath(P, P.inset, 0); ctx.strokeStyle = CREAM; ctx.lineWidth = 2; ctx.stroke();
  if (P.kind === 'pillow') {
    // the pillowcase flap: a cream band near the open end
    ctx.save();
    shapePath(P, 0, 0); ctx.clip();
    rect(P.x + P.w - 84, P.y, 12, P.h, CREAM);
    ctx.restore();
  }
  // folded corner, top-right, clipped to the shape
  ctx.save();
  shapePath(P, 0, 0); ctx.clip();
  var fx = P.x + P.w, fy = P.y;
  poly([[fx - FOLD, fy], [fx, fy + FOLD], [fx - FOLD, fy + FOLD]], TEAL2);
  poly([[fx - FOLD, fy], [fx, fy], [fx, fy + FOLD]], CREAM);
  ctx.restore();
  if (P.kind === 'towel') {
    // fringe along the bottom edge
    for (var x = P.x + 10; x < P.x + P.w - 6; x += 15) {
      line(x, P.y + P.h + 8, x, P.y + P.h + 19, CREAM, 3);
    }
  }
}

// ---- scene ---------------------------------------------------
function draw() {
  var lt = T % LOOP;
  // upper field ground and the lower-third surround
  rect(-400, -400, DW + 800, 1000, TEAL);
  rect(-400, 600, DW + 800, DH - 600 + 400, TEAL2);
  rect(-400, 599, DW + 800, 3, CREAM);
  // the pattern across the upper two thirds
  drawPattern(0, 0, DW, 600, lt);
  drawProduct(lt);
}

// ---- piece state ----------------------------------------------
// Constant first-frame phase: T = 7.0s into the 24s loop
// (mid-stroke, bubbles spread). The clock advances in
// fixed 1/60 ticks from there. Scroll starts at (0, 0)
// and the first product is the beach towel; QA probes
// via ?seed= can start scrolled or on another product
// (seed=scroll, seed=p1, seed=p2) exactly as shipped.
var T = 7.0;
var lastNow = -1, acc = 0;
var scrollX = 0, scrollY = 0, prodIdx = 0;
var SEARCH = (typeof location !== 'undefined' && location.search) || '';
if (SEARCH.indexOf('scroll') >= 0) { scrollX = 137; scrollY = 61; }
if (SEARCH.indexOf('p1') >= 0) prodIdx = 1;
if (SEARCH.indexOf('p2') >= 0) prodIdx = 2;

function step() { T += TICK; }

// ---- pointer: drag scrolls, double-tap switches product -------
function toDesign(ev) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cx = (ev.clientX !== undefined ? ev.clientX : (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 0)) - r.left;
  var cy = (ev.clientY !== undefined ? ev.clientY : (ev.touches && ev.touches[0] ? ev.touches[0].clientY : 0)) - r.top;
  return { x: (cx - OX) / S, y: (cy - OY) / S };
}
var dragging = false, lastPX = 0, lastPY = 0;
var downT = -1, downX = 0, downY = 0, lastTapT = -1;
function onDown(ev) {
  dragging = true;
  var p = toDesign(ev);
  lastPX = p.x; lastPY = p.y;
  downX = p.x; downY = p.y;
  downT = (typeof ev.timeStamp === 'number') ? ev.timeStamp : -1;
  if (ev.preventDefault) ev.preventDefault();
}
function onMove(ev) {
  if (!dragging) return;
  var p = toDesign(ev);
  scrollX -= (p.x - lastPX);
  scrollY -= (p.y - lastPY);
  lastPX = p.x; lastPY = p.y;
  if (ev.preventDefault) ev.preventDefault();
}
function onUp(ev) {
  dragging = false;
  var now = (typeof ev.timeStamp === 'number') ? ev.timeStamp : -1;
  if (downT >= 0 && now >= 0 && now - downT < 280) {
    var p = toDesign(ev);
    var moved = Math.abs(p.x - downX) + Math.abs(p.y - downY);
    if (moved < 14) {
      if (lastTapT >= 0 && now - lastTapT < 400) {
        prodIdx = (prodIdx + 1) % PRODUCTS.length;
        lastTapT = -1;
      } else {
        lastTapT = now;
      }
    }
  }
  downT = -1;
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('touchcancel', onUp);
}

// ---- sizing ------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = TEAL2;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
