<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.194 Push a Hundred Times</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#050505; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.194 Push a Hundred Times (Eugene Sargent, the Tinkerfest rule:
// "they're going to push a button a hundred times before they even
// know what it does"). One big steel and rubber button in the dark,
// a single NeoPixel ring around it, nothing else. No label, no
// counter, no instructions: every twenty idle seconds it presses
// itself once, and that demonstration is the only teacher. Each
// press escalates the response: a ripple, then ripples in threes,
// then light arcs bouncing off the edges of the world, then the
// full cascade. It never punishes a masher; it blooms under one.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#050505', STEEL = '#7A7F88', RUBBER = '#23242A';
var W = 0, H = 0, phone = false;
var seed = 194194;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

// ---- state -------------------------------------------------------------------
var T = 0, lastNow = -1;
var presses = 0;                 // float while fading down
var hue = 168;                   // NeoPixel hue, hard switches
var hueT = 0;
var pressAnim = 0;               // 1 at the instant of a press, decays
var fieldPulse = 0;
var lastUserT = -100, lastAnyT = 0;
var ripples = [];                // {x,y,r,maxR,w}
var arcs = [];                   // {x,y,vx,vy,life,trail:[]}
var AC = null, acTried = false;

function level() {
  var p = Math.floor(presses);
  return p <= 5 ? 1 : p <= 15 ? 2 : p <= 40 ? 3 : 4;
}
function center() { return { x: W / 2, y: H / 2 }; }
function btnR() { return Math.min(W * 0.20, H * 0.30); }

function tone() {
  // strictly optional, typeof guarded, silent everywhere else
  try {
    if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return;
    if (!acTried) {
      acTried = true;
      var ACtor = typeof AudioContext !== 'undefined' ? AudioContext : webkitAudioContext;
      AC = new ACtor();
    }
    if (!AC || AC.state === 'suspended') { if (AC) AC.resume(); if (!AC) return; }
    var lv = level();
    if (lv < 2) return;
    var f = 240 * Math.pow(2, Math.min(presses, 30) / 18);
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.045, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0008, AC.currentTime + 0.14);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + 0.15);
  } catch (err) { /* silence is a complete piece */ }
}

function spawnRipple(x, y, maxR, w) {
  ripples.push({ x: x, y: y, r: btnR() * 0.4, maxR: maxR, w: w || 2 });
}
function spawnArc() {
  var c = center(), Rb = btnR();
  var a = rand() * 6.283, sp = 210 + rand() * 230;
  arcs.push({
    x: c.x + Math.cos(a) * Rb * 0.95, y: c.y + Math.sin(a) * Rb * 0.95,
    vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
    life: 2.6, trail: []
  });
}

function press(byUser) {
  if (byUser) { presses = Math.floor(presses) + 1; lastUserT = T; }
  lastAnyT = T;
  pressAnim = 1;
  hue = (hue + 60) % 360;
  var lv = level(), c = center();
  var maxR = Math.min(W, H) * 0.55;
  if (lv === 1) {
    spawnRipple(c.x, c.y, maxR, 2);
  } else if (lv === 2) {
    spawnRipple(c.x, c.y, maxR, 2.5);
    spawnRipple(c.x, c.y, maxR * 0.7, 2);
    spawnRipple(c.x, c.y, maxR * 0.45, 1.5);
  } else if (lv === 3) {
    spawnRipple(c.x, c.y, maxR, 3);
    spawnRipple(c.x, c.y, maxR * 0.65, 2);
    for (var i = 0; i < 3; i++) spawnArc();
  } else {
    spawnRipple(c.x, c.y, maxR * 1.1, 3.5);
    spawnRipple(c.x, c.y, maxR * 0.8, 2.5);
    for (var j = 0; j < 6; j++) spawnArc();
    fieldPulse = 1;
  }
  if (byUser) tone();
}

// ---- input -----------------------------------------------------------------------
canvas.addEventListener('pointerdown', function (e) {
  var c = center(), Rb = btnR();
  var dx = e.clientX - c.x, dy = e.clientY - c.y;
  if (dx * dx + dy * dy < Math.pow(Rb * 1.3, 2)) press(true);
});

// ---- resize ------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700;
  if (!phone && !(sw > 0)) phone = H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- step --------------------------------------------------------------------------------
function step(dt) {
  hueT += dt;
  if (hueT > 0.9) { hueT = 0; hue = (hue + 24) % 360; }
  pressAnim = Math.max(0, pressAnim - dt / 0.22);
  fieldPulse = Math.max(0, fieldPulse - dt * 0.5);
  // counter fades back down only after 30s without a user's press
  if (T - lastUserT > 30 && presses > 0) presses = Math.max(0, presses - dt * 8);
  // attract: every 20s idle, the button presses itself once
  if (T - lastAnyT > 20) press(false);
  // ripples
  for (var i = ripples.length - 1; i >= 0; i--) {
    var r = ripples[i];
    r.r += dt * 270;
    if (r.r > r.maxR) ripples.splice(i, 1);
  }
  // arcs: ballistic, bouncing off the edges of the world
  var lv = level();
  for (var j = arcs.length - 1; j >= 0; j--) {
    var a = arcs[j];
    a.vy += 300 * dt;
    a.x += a.vx * dt; a.y += a.vy * dt;
    a.life -= dt;
    var bounced = false;
    if (a.x < 6) { a.x = 6; a.vx = Math.abs(a.vx) * 0.92; bounced = true; }
    if (a.x > W - 6) { a.x = W - 6; a.vx = -Math.abs(a.vx) * 0.92; bounced = true; }
    if (a.y < 6) { a.y = 6; a.vy = Math.abs(a.vy) * 0.92; bounced = true; }
    if (a.y > H - 6) { a.y = H - 6; a.vy = -Math.abs(a.vy) * 0.92; bounced = true; }
    if (bounced && lv >= 4) spawnRipple(a.x, a.y, 90, 1.2);
    a.trail.push({ x: a.x, y: a.y });
    if (a.trail.length > 7) a.trail.shift();
    if (a.life <= 0) arcs.splice(j, 1);
  }
}

// ---- draw ------------------------------------------------------------------------------------
function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (lastNow >= 0 && now > 0) {
    var dt = Math.min(0.05, (now - lastNow) / 1000);
    T += dt;
    step(dt);
  }
  lastNow = now;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var c = center(), Rb = btnR();
  var squash = Math.sin(Math.min(1, pressAnim) * 3.1416) * 0.09;

  // cascade field glow
  if (fieldPulse > 0.01) {
    var fg = ctx.createRadialGradient(c.x, c.y, Rb * 0.5, c.x, c.y, Math.min(W, H) * 0.7);
    fg.addColorStop(0, 'rgba(255,255,255,' + (0.05 * fieldPulse) + ')');
    fg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = fg;
    ctx.fillRect(0, 0, W, H);
  }
  // ripples
  for (var i = 0; i < ripples.length; i++) {
    var r = ripples[i], k = r.r / r.maxR;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 * (1 - k)) + ')';
    ctx.lineWidth = r.w;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 6.284); ctx.stroke();
  }
  // arcs with trails
  ctx.lineCap = 'round';
  for (var j = 0; j < arcs.length; j++) {
    var a = arcs[j];
    ctx.strokeStyle = 'hsla(' + hue + ',100%,68%,' + clamp(a.life / 2.6, 0, 1) * 0.55 + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var q = 0; q < a.trail.length; q++) {
      if (q === 0) ctx.moveTo(a.trail[q].x, a.trail[q].y); else ctx.lineTo(a.trail[q].x, a.trail[q].y);
    }
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,' + clamp(a.life / 2.6, 0, 1) + ')';
    ctx.beginPath(); ctx.arc(a.x, a.y, 2.6, 0, 6.284); ctx.fill();
  }

  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(1, 1 - squash);
  // rubber housing
  ctx.beginPath(); ctx.arc(0, 0, Rb * 1.14, 0, 6.284);
  ctx.fillStyle = RUBBER; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1; ctx.stroke();
  // steel bezel
  ctx.beginPath(); ctx.arc(0, 0, Rb * 1.03, 0, 6.284);
  ctx.fillStyle = STEEL; ctx.fill();
  // NeoPixel ring: hard-switched hue segments on the bezel
  var segs = 28;
  ctx.lineWidth = Rb * 0.075;
  for (var s = 0; s < segs; s++) {
    var a0 = (s / segs) * 6.283 + 0.02, a1 = ((s + 1) / segs) * 6.283 - 0.02;
    ctx.strokeStyle = 'hsla(' + hue + ',100%,62%,0.28)';
    ctx.beginPath(); ctx.arc(0, 0, Rb * 1.03, a0, a1); ctx.stroke();
    ctx.strokeStyle = 'hsl(' + hue + ',100%,62%)';
    ctx.beginPath(); ctx.arc(0, 0, Rb * 1.03, a0, a1); ctx.stroke();
  }
  // button face
  var fg2 = ctx.createRadialGradient(-Rb * 0.2, -Rb * 0.25, Rb * 0.1, 0, 0, Rb * 0.88);
  fg2.addColorStop(0, '#9298A0');
  fg2.addColorStop(1, '#64686F');
  ctx.beginPath(); ctx.arc(0, squash * 40, Rb * 0.88, 0, 6.284);
  ctx.fillStyle = fg2; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, squash * 40, Rb * 0.66, 0, 6.284);
  ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}

// frame one: the button at rest, with the faint tail of a self-press
// ripple still leaving (the attract clock offset makes it just visible)
resize();
lastAnyT = -19.05;
spawnRipple(W / 2, H / 2, Math.min(W, H) * 0.55, 2);
ripples[0].r = Math.min(W, H) * 0.44;
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
