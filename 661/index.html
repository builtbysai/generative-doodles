<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>La Transición</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #EDE4D0; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict)
  var PAPER = '#EDE4D0';
  var OCHRE = '#C98F3D';
  var SIENNA = '#8A4A2B';
  var IRON = '#2B2622';
  var GOLD = '#E3B95B';

  var LOOP_S = 24;          // seconds per sweep loop
  var GHOST_STEP = 0.055;   // interpolation distance between stacked frames
  var FORCE_PHASE = -1;     // QA hook: -1 = live clock, else fixed loop phase 0..1

  // Seeded RNG (mulberry32) — used only for the gold dust placement.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ------------------------------------------------------------------
  // Horse kit. Local units: body chest-to-tail is about 1.0, the horse
  // faces LEFT (head toward -x), y grows downward. Every part is built
  // from the same joint kit; poses A and B differ only in the table.
  // Angles are degrees in canvas convention: 0 = +x (toward tail),
  // 90 = straight down, 180 = forward (toward the head).
  // ------------------------------------------------------------------

  function dir(deg) {
    var r = deg * Math.PI / 180;
    return [Math.cos(r), Math.sin(r)];
  }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // Pose tables. Legs: [upperAngle, lowerAngle] per leg.
  var POSE_A = { // gathered: neck arched down, legs collected under
    n1: 222, n2: 196, head: 128,
    legs: {
      frontNear: [96, 86], frontFar: [104, 94],
      hindNear: [78, 98], hindFar: [70, 90]
    },
    tailCtrl: [0.60, 0.16], tailEnd: [0.545, 0.50],
    pitch: 1.5, bob: 0.0
  };
  var POSE_B = { // extended: neck reaching forward, legs split fore/aft
    n1: 183, n2: 172, head: 158,
    legs: {
      frontNear: [128, 118], frontFar: [58, 74],
      hindNear: [52, 84], hindFar: [98, 116]
    },
    tailCtrl: [0.68, 0.02], tailEnd: [0.66, 0.34],
    pitch: -2.5, bob: -0.02
  };

  var NECK_BASE = [-0.375, -0.03];
  var N1_LEN = 0.20, N2_LEN = 0.175;
  var HW_BASE = 0.080, HW_MID = 0.058, HW_POLL = 0.042;
  var SHOULDER = [-0.335, 0.10], HIP = [0.35, 0.10];
  var LEG_U = 0.31, LEG_L = 0.32;

  // Body barrel outline (closed loop, smoothed when drawn).
  var BODY = [
    [0.47, -0.06], [0.40, -0.13], [0.18, -0.155], [-0.08, -0.16],
    [-0.30, -0.155], [-0.40, -0.10], [-0.465, -0.01], [-0.44, 0.07],
    [-0.30, 0.125], [-0.05, 0.15], [0.22, 0.145], [0.40, 0.10],
    [0.47, 0.03]
  ];

  // Head outline in head-local frame: u along the head direction,
  // v toward the jaw side.
  var HEAD = [
    [0.00, -0.052], [0.07, -0.055], [0.14, -0.042], [0.205, -0.022],
    [0.225, 0.002], [0.215, 0.028], [0.16, 0.038], [0.09, 0.058],
    [0.02, 0.05], [-0.015, 0.01]
  ];
  var EAR = [[0.005, -0.05], [0.045, -0.052], [-0.02, -0.115]];

  function poseAt(u) {
    var p = { legs: {} };
    p.n1 = lerp(POSE_A.n1, POSE_B.n1, u);
    p.n2 = lerp(POSE_A.n2, POSE_B.n2, u);
    p.head = lerp(POSE_A.head, POSE_B.head, u);
    var keys = ['frontNear', 'frontFar', 'hindNear', 'hindFar'];
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      p.legs[k] = [
        lerp(POSE_A.legs[k][0], POSE_B.legs[k][0], u),
        lerp(POSE_A.legs[k][1], POSE_B.legs[k][1], u)
      ];
    }
    p.tailCtrl = [lerp(POSE_A.tailCtrl[0], POSE_B.tailCtrl[0], u),
                  lerp(POSE_A.tailCtrl[1], POSE_B.tailCtrl[1], u)];
    p.tailEnd = [lerp(POSE_A.tailEnd[0], POSE_B.tailEnd[0], u),
                 lerp(POSE_A.tailEnd[1], POSE_B.tailEnd[1], u)];
    p.pitch = lerp(POSE_A.pitch, POSE_B.pitch, u) * Math.PI / 180;
    p.bob = lerp(POSE_A.bob, POSE_B.bob, u);
    return p;
  }

  // Neck joints and crest (top-edge) samples for a pose.
  function neckJoints(p) {
    var d1 = dir(p.n1), d2 = dir(p.n2);
    var M = [NECK_BASE[0] + d1[0] * N1_LEN, NECK_BASE[1] + d1[1] * N1_LEN];
    var P = [M[0] + d2[0] * N2_LEN, M[1] + d2[1] * N2_LEN];
    // Crest-side normals: rotate segment dir by -90 deg in y-down space.
    function nTop(d) { return [-d[1], d[0]]; }
    // For a leftward neck, (-dy, dx) points to the throat for up-necks;
    // pick the normal that points up/back (negative y, positive x bias).
    function crestN(d) {
      var n = [-d[1], d[0]];
      if (n[1] > 0) { n = [d[1], -d[0]]; }
      return n;
    }
    var nB = crestN(d1);
    var nM = crestN([(d1[0] + d2[0]) / 2, (d1[1] + d2[1]) / 2]);
    var nP = crestN(d2);
    return { M: M, P: P, nB: nB, nM: nM, nP: nP, d1: d1, d2: d2 };
  }

  function neckOutline(p) {
    var j = neckJoints(p);
    var B = NECK_BASE;
    return [
      [B[0] + j.nB[0] * HW_BASE, B[1] + j.nB[1] * HW_BASE],
      [j.M[0] + j.nM[0] * HW_MID, j.M[1] + j.nM[1] * HW_MID],
      [j.P[0] + j.nP[0] * HW_POLL, j.P[1] + j.nP[1] * HW_POLL],
      [j.P[0] - j.nP[0] * HW_POLL, j.P[1] - j.nP[1] * HW_POLL],
      [j.M[0] - j.nM[0] * HW_MID, j.M[1] - j.nM[1] * HW_MID],
      [B[0] - j.nB[0] * HW_BASE, B[1] - j.nB[1] * HW_BASE]
    ];
  }

  // Crest samples (9 points along the neck top edge) for mane + dust.
  function crestSamples(p) {
    var j = neckJoints(p);
    var B = NECK_BASE, pts = [];
    var segs = [
      { a: B, b: j.M, na: j.nB, nb: j.nM, ha: HW_BASE, hb: HW_MID },
      { a: j.M, b: j.P, na: j.nM, nb: j.nP, ha: HW_MID, hb: HW_POLL }
    ];
    for (var s = 0; s < segs.length; s++) {
      var g = segs[s];
      for (var i = (s === 0 ? 0 : 1); i <= 4; i++) {
        var t = i / 4;
        var cx = lerp(g.a[0], g.b[0], t), cy = lerp(g.a[1], g.b[1], t);
        var nx = lerp(g.na[0], g.nb[0], t), ny = lerp(g.na[1], g.nb[1], t);
        var hw = lerp(g.ha, g.hb, t);
        pts.push({ p: [cx + nx * hw, cy + ny * hw], n: [nx, ny] });
      }
    }
    return { pts: pts, joints: j };
  }

  var HEAD_SCALE = 0.92;
  function headOutline(p) {
    var j = neckJoints(p);
    var f = dir(p.head);
    var jw = [f[1], -f[0]]; // jaw-side unit vector
    var out = [];
    for (var i = 0; i < HEAD.length; i++) {
      out.push([
        j.P[0] + f[0] * HEAD[i][0] * HEAD_SCALE + jw[0] * HEAD[i][1] * HEAD_SCALE,
        j.P[1] + f[1] * HEAD[i][0] * HEAD_SCALE + jw[1] * HEAD[i][1] * HEAD_SCALE
      ]);
    }
    var ear = [];
    for (var e = 0; e < EAR.length; e++) {
      ear.push([
        j.P[0] + f[0] * EAR[e][0] * HEAD_SCALE + jw[0] * EAR[e][1] * HEAD_SCALE,
        j.P[1] + f[1] * EAR[e][0] * HEAD_SCALE + jw[1] * EAR[e][1] * HEAD_SCALE
      ]);
    }
    return { head: out, ear: ear };
  }

  // Tapered strip through points with per-point half-widths.
  function strip(pts, hws) {
    var left = [], right = [], i, t, n, m;
    for (i = 0; i < pts.length; i++) {
      var a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      t = [b[0] - a[0], b[1] - a[1]];
      m = Math.sqrt(t[0] * t[0] + t[1] * t[1]) || 1;
      n = [-t[1] / m, t[0] / m];
      left.push([pts[i][0] + n[0] * hws[i], pts[i][1] + n[1] * hws[i]]);
      right.push([pts[i][0] - n[0] * hws[i], pts[i][1] - n[1] * hws[i]]);
    }
    return left.concat(right.reverse());
  }

  function legOutline(attach, angles) {
    var du = dir(angles[0]), dl = dir(angles[1]);
    var K = [attach[0] + du[0] * LEG_U, attach[1] + du[1] * LEG_U];
    var F = [K[0] + dl[0] * LEG_L, K[1] + dl[1] * LEG_L];
    var G = [F[0] + dl[0] * 0.05, F[1] + dl[1] * 0.05];
    return strip([attach, K, F, G], [0.034, 0.024, 0.017, 0.018]);
  }

  function tailOutline(p) {
    var T0 = [0.465, -0.05], pts = [], hws = [];
    for (var i = 0; i <= 7; i++) {
      var t = i / 7;
      var x = (1 - t) * (1 - t) * T0[0] + 2 * (1 - t) * t * p.tailCtrl[0] + t * t * p.tailEnd[0];
      var y = (1 - t) * (1 - t) * T0[1] + 2 * (1 - t) * t * p.tailCtrl[1] + t * t * p.tailEnd[1];
      pts.push([x, y]);
      hws.push(lerp(0.052, 0.012, t));
    }
    return strip(pts, hws);
  }

  function maneOutline(p) {
    var cs = crestSamples(p), pts = cs.pts, out = [], i, s;
    for (i = 0; i < pts.length; i++) { out.push(pts[i].p); }
    for (i = pts.length - 1; i >= 0; i--) {
      s = pts[i];
      var zig = (i % 2 === 0) ? 0.040 : 0.022;
      out.push([s.p[0] + s.n[0] * zig + 0.012, s.p[1] + s.n[1] * zig + 0.010]);
    }
    return out;
  }

  // Gold dust: fixed parameter set (seeded once), placed on the mane
  // of the solid frame only.
  var DUST = (function () {
    var rng = mulberry32(661002), arr = [];
    for (var i = 0; i < 26; i++) {
      arr.push({ s: rng(), n: rng() * 0.038, r: 0.8 + rng() * 1.1 });
    }
    return arr;
  })();

  // ------------------------------------------------------------------
  // Canvas + layout
  // ------------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;
  var upx = 100, rootYA = 0, groundY = 0;
  var lastElapsed = 0;

  function layout() {
    upx = Math.min(W * 0.30, H * 0.34);
    groundY = H * 0.86;
    rootYA = groundY - 0.73 * upx;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (window.screen) {
      isPhone = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      isPhone = H > W * 1.15;
    }
    layout();
    draw(lastElapsed);
  }

  // Map a local point through the pose pitch + root placement.
  function xf(pt, cosP, sinP, rx, ry) {
    return [rx + (pt[0] * cosP - pt[1] * sinP) * upx,
            ry + (pt[0] * sinP + pt[1] * cosP) * upx];
  }

  function pathSmooth(pts, cosP, sinP, rx, ry) {
    var n = pts.length, i, a, b, mx, my;
    var sp = [];
    for (i = 0; i < n; i++) { sp.push(xf(pts[i], cosP, sinP, rx, ry)); }
    ctx.beginPath();
    for (i = 0; i < n; i++) {
      a = sp[i]; b = sp[(i + 1) % n];
      mx = (a[0] + b[0]) / 2; my = (a[1] + b[1]) / 2;
      if (i === 0) { ctx.moveTo(mx, my); }
      var nx = sp[(i + 2) % n];
      var qx = (b[0] + nx[0]) / 2, qy = (b[1] + nx[1]) / 2;
      ctx.quadraticCurveTo(b[0], b[1], qx, qy);
    }
    ctx.closePath();
    ctx.fill();
  }

  function pathPoly(pts, cosP, sinP, rx, ry) {
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var s = xf(pts[i], cosP, sinP, rx, ry);
      if (i === 0) { ctx.moveTo(s[0], s[1]); } else { ctx.lineTo(s[0], s[1]); }
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawHorse(u, fill, alpha, withDust) {
    var p = poseAt(u);
    var cosP = Math.cos(p.pitch), sinP = Math.sin(p.pitch);
    var rx = lerp(isPhone ? 0.60 : 0.615, isPhone ? 0.40 : 0.385, u) * W;
    var ry = rootYA + p.bob * upx;
    ctx.fillStyle = fill;
    ctx.globalAlpha = alpha;

    pathPoly(legOutline(SHOULDER, p.legs.frontFar), cosP, sinP, rx, ry);
    pathPoly(legOutline(HIP, p.legs.hindFar), cosP, sinP, rx, ry);
    pathPoly(tailOutline(p), cosP, sinP, rx, ry);
    pathSmooth(BODY, cosP, sinP, rx, ry);
    pathSmooth(neckOutline(p), cosP, sinP, rx, ry);
    var ho = headOutline(p);
    pathSmooth(ho.head, cosP, sinP, rx, ry);
    pathPoly(ho.ear, cosP, sinP, rx, ry);
    pathPoly(legOutline(HIP, p.legs.hindNear), cosP, sinP, rx, ry);
    pathPoly(legOutline(SHOULDER, p.legs.frontNear), cosP, sinP, rx, ry);
    pathSmooth(maneOutline(p), cosP, sinP, rx, ry);

    if (withDust) {
      var cs = crestSamples(p).pts;
      ctx.fillStyle = GOLD;
      ctx.globalAlpha = 0.85;
      for (var i = 0; i < DUST.length; i++) {
        var d = DUST[i];
        var fi = d.s * (cs.length - 1);
        var i0 = Math.floor(fi), fr = fi - i0;
        var s0 = cs[i0], s1 = cs[Math.min(cs.length - 1, i0 + 1)];
        var lx = lerp(s0.p[0], s1.p[0], fr) + lerp(s0.n[0], s1.n[0], fr) * d.n;
        var ly = lerp(s0.p[1], s1.p[1], fr) + lerp(s0.n[1], s1.n[1], fr) * d.n;
        var sp = xf([lx, ly], cosP, sinP, rx, ry);
        ctx.beginPath();
        ctx.arc(sp[0], sp[1], d.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function draw(elapsed) {
    lastElapsed = elapsed;
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    var phase = FORCE_PHASE >= 0 ? FORCE_PHASE : (elapsed % LOOP_S) / LOOP_S;
    var tRaw = 0.5 - 0.5 * Math.cos(2 * Math.PI * phase);
    var t = 0.08 + 0.84 * tRaw; // never fully resolves to a keyframe

    // Ghosts outermost-first, then the solid middle frame.
    var order = [-3, 3, -2, 2, -1, 1];
    var alphas = { 1: 0.32, 2: 0.21, 3: 0.13 };
    for (var i = 0; i < order.length; i++) {
      var k = order[i];
      var u = clamp(t + k * GHOST_STEP, 0.02, 0.98);
      drawHorse(u, k < 0 ? OCHRE : SIENNA, alphas[Math.abs(k)], false);
    }
    drawHorse(clamp(t, 0.02, 0.98), IRON, 1, true);
  }

  // ------------------------------------------------------------------
  resize();
  draw(0);

  if (typeof window.requestAnimationFrame === 'function') {
    var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var raf = function () {
      var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : t0;
      draw((now - t0) / 1000);
      window.requestAnimationFrame(raf);
    };
    window.requestAnimationFrame(raf);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
})();
</script>
</body>
</html>
