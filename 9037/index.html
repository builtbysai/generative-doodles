<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9037 · Square One</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#060608; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}

// Square One v2: the unwrapping square.
// One square, rotating slowly, expanding.
// Its four sides slowly unwrap into a single straight line,
// the line keeps turning, then folds back into a square. Repeats.

const CYCLE = 18;        // seconds per loop
const ROT_SPEED = 0.16;  // radians per second, slow
const MAX_FRAC = 0.8;
const PTS = 180;         // points sampled along the perimeter

// position on square outline, p in [0,4), h = half side
function squarePos(p, h){
  const side = Math.floor(p) % 4, t = p - Math.floor(p);
  if (side === 0) return [-h + 2*h*t, -h];
  if (side === 1) return [h, -h + 2*h*t];
  if (side === 2) return [h - 2*h*t, h];
  return [-h, h - 2*h*t];
}
// position on the unwrapped line: full perimeter laid straight
function linePos(p, h){
  return [(p - 2) * 2 * h, 0];
}
function smooth(u){ return u*u*(3 - 2*u); }

function draw(){
  const [w, h] = viewportWH(); prep(w, h);
  ctx.fillStyle = '#060608'; ctx.fillRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const maxHalf = Math.min(w, h) / 2 * MAX_FRAC;

  const phase = (clock / CYCLE) % 1;
  const half = 3 + phase * (maxHalf - 3);
  const rot = clock * ROT_SPEED;

  // unwrap amount: 0 = square, 1 = single line, eased
  const u = smooth((1 - Math.cos(phase * Math.PI * 2)) / 2);

  let a;
  if (phase < 0.04) a = phase / 0.04;
  else if (phase > 0.94) a = (1 - phase) / 0.06;
  else a = 1;

  // slightly brighter when fully a line
  const bright = Math.round(225 + 30 * u);
  ctx.strokeStyle = 'rgba(' + bright + ',' + (bright - 2) + ',' + (bright - 8) + ',' + a.toFixed(3) + ')';
  ctx.lineWidth = 1.5;

  const c = Math.cos(rot), s = Math.sin(rot);
  ctx.beginPath();
  for (let i = 0; i <= PTS; i++){
    const p = (i / PTS) * 4;
    const sp = squarePos(p, half), lp = linePos(p, half);
    const x0 = sp[0] + (lp[0] - sp[0]) * u;
    const y0 = sp[1] + (lp[1] - sp[1]) * u;
    const x = cx + x0 * c - y0 * s;
    const y = cy + x0 * s + y0 * c;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

let clock = 0, lastT = -1;
function loop(nowMs){
  const t = nowMs / 1000;
  if (lastT < 0) lastT = t;
  clock += Math.min(t - lastT, 0.1); lastT = t;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.addEventListener('resize', () => draw());
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => draw());
</script>
</body>
</html>
