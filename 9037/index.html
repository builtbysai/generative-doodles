<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>№9037 · Synchrony</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #060a14; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
  .cap {
    position: fixed; left: 16px; bottom: 14px; pointer-events: none;
    color: #93a3c4; font: italic 12.5px/1.6 Georgia, serif; opacity: 0.8;
    text-shadow: 0 1px 8px #000;
  }
  .cap b { color: #e3c98f; font-weight: normal; font-style: normal; }
  .meter {
    position: fixed; right: 16px; bottom: 14px; pointer-events: none;
    color: #93a3c4; font: 11px/1.6 Georgia, serif; letter-spacing: 0.12em; opacity: 0.8;
    text-shadow: 0 1px 8px #000;
  }
  .meter b { color: #e3c98f; font-weight: normal; }
  @media (max-width: 600px) {
    .cap { font-size: 11px; max-width: 62%; }
    .meter { font-size: 10px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap"><b>№9037 · Synchrony</b>, drift through the field to break the rhythm, hold still and watch it gather again</div>
<div class="meter">SYNCHRONY <b id="syncv">0%</b></div>
<script>
'use strict';
/*
  Synchrony: a field of fireflies, each flashing to its own rhythm,
  coupled to its neighbors the way real Photinus fireflies are.
  Left alone they fall into step; your pointer is weather.
*/

// ---------- seeded rng ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const seed = parseInt(new URLSearchParams(location.search).get('seed') || '7', 10) || 7;
const rand = mulberry32(seed);

// ---------- canvas ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const syncEl = document.getElementById('syncv');
let W = 0, H = 0, DPR = 1;

const bg = document.createElement('canvas');      // static night
const light = document.createElement('canvas');   // persistent glow layer
const bctx = bg.getContext('2d');
const lctx = light.getContext('2d');

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.floor(window.innerWidth); H = Math.floor(window.innerHeight);
  for (const c of [cv, bg, light]) { c.width = W * DPR; c.height = H * DPR; }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  lctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  paintBackground();
  lctx.clearRect(0, 0, W, H);
}
window.addEventListener('resize', resize);

// ---------- glow sprites ----------
function makeGlow(inner, mid) {
  const s = document.createElement('canvas'); s.width = s.height = 128;
  const g = s.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, inner);
  grd.addColorStop(0.25, mid);
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  return s;
}
const glowAmber = makeGlow('rgba(255,236,190,1)', 'rgba(255,180,90,0.45)');
const glowGold  = makeGlow('rgba(255,244,200,1)', 'rgba(220,200,110,0.4)');
const glowGreen = makeGlow('rgba(240,255,210,1)', 'rgba(170,220,120,0.38)');

// ---------- background ----------
let stars = [];
function paintBackground() {
  const g = bctx;
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#04070f');
  sky.addColorStop(0.55, '#080d1a');
  sky.addColorStop(1, '#0c1424');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);

  // moon + halo
  const mx = W * 0.82, my = H * 0.16, mr = Math.min(W, H) * 0.045;
  const halo = g.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 6);
  halo.addColorStop(0, 'rgba(220,225,240,0.20)');
  halo.addColorStop(1, 'rgba(220,225,240,0)');
  g.fillStyle = halo; g.fillRect(mx - mr * 6, my - mr * 6, mr * 12, mr * 12);
  g.fillStyle = '#e6e2d2';
  g.beginPath(); g.arc(mx, my, mr, 0, 7); g.fill();
  g.fillStyle = 'rgba(190,195,210,0.5)';
  g.beginPath(); g.arc(mx - mr * 0.3, my - mr * 0.2, mr * 0.18, 0, 7); g.fill();
  g.beginPath(); g.arc(mx + mr * 0.25, my + mr * 0.3, mr * 0.12, 0, 7); g.fill();

  // stars
  stars = [];
  const r2 = mulberry32(seed + 99);
  for (let i = 0; i < 170; i++) {
    stars.push({ x: r2() * W, y: r2() * H * 0.72, r: 0.4 + r2() * 1.1, a: 0.12 + r2() * 0.55 });
  }
  for (const s of stars) {
    g.fillStyle = 'rgba(200,212,235,' + s.a.toFixed(2) + ')';
    g.beginPath(); g.arc(s.x, s.y, s.r, 0, 7); g.fill();
  }

  // distant hill silhouette
  g.fillStyle = '#070c16';
  g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) {
    g.lineTo(x, H * 0.88 - Math.sin(x * 0.004 + 1.2) * H * 0.03 - Math.sin(x * 0.011) * H * 0.012);
  }
  g.lineTo(W, H); g.closePath(); g.fill();

  // vignette
  const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.5)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

// ---------- grass ----------
let blades = [];
function seedGrass() {
  blades = [];
  const r3 = mulberry32(seed + 7);
  const n = Math.floor(W / 22);
  for (let i = 0; i < n; i++) {
    blades.push({
      x: r3() * W, h: 30 + r3() * 110, lean: (r3() - 0.5) * 46,
      ph: r3() * 6.28, w: 1.5 + r3() * 2.2, tone: r3()
    });
  }
}
function drawGrass(t) {
  ctx.lineCap = 'round';
  for (const b of blades) {
    const sway = Math.sin(t * 0.7 + b.ph) * 7;
    const tipX = b.x + b.lean + sway, tipY = H - b.h;
    const shade = 10 + b.tone * 14;
    ctx.strokeStyle = 'rgb(' + shade + ',' + (shade + 12) + ',' + shade + ')';
    ctx.lineWidth = b.w;
    ctx.beginPath();
    ctx.moveTo(b.x, H + 4);
    ctx.quadraticCurveTo(b.x + b.lean * 0.4, H - b.h * 0.6, tipX, tipY);
    ctx.stroke();
  }
}

// ---------- fireflies ----------
const N = 130;
const flies = [];
function seedFlies() {
  flies.length = 0;
  for (let i = 0; i < N; i++) {
    const warm = rand();
    flies.push({
      x: rand() * W, y: H * 0.15 + rand() * H * 0.7,
      vx: 0, vy: 0,
      phase: rand() * 6.283,
      omega: (6.283 / 2.6) * (0.90 + rand() * 0.20), // natural period ~2.6s, ±10%
      f1: 0.3 + rand() * 0.7, f2: 0.3 + rand() * 0.7,
      p1: rand() * 6.283, p2: rand() * 6.283,
      sprite: warm < 0.55 ? glowAmber : (warm < 0.85 ? glowGold : glowGreen),
      size: 26 + rand() * 30,
      rebel: rand() < 0.08 // a few never fall in step; the sync is sweeter for them
    });
  }
}

const pointer = { x: -9999, y: -9999, active: false, lastMove: 0 };
function toLocal(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
window.addEventListener('pointermove', (e) => {
  const p = toLocal(e);
  pointer.x = p.x; pointer.y = p.y; pointer.active = true;
  pointer.lastMove = performance.now();
});
window.addEventListener('pointerdown', (e) => {
  const p = toLocal(e);
  pointer.x = p.x; pointer.y = p.y; pointer.active = true;
  pointer.lastMove = performance.now();
  // a soft clap: nearby flies get a phase shove
  for (const f of flies) {
    const dx = f.x - p.x, dy = f.y - p.y, d = Math.hypot(dx, dy);
    if (d < 220) f.phase += (rand() - 0.5) * 4 * (1 - d / 220);
  }
});
window.addEventListener('pointerleave', () => { pointer.active = false; });

const COUPLE_R = 150, K = 2.6, DISTURB_R = 220, SHATTER_R = 110;
let syncSmooth = 0;

function step(dt, t) {
  const R2 = COUPLE_R * COUPLE_R;
  const pActive = pointer.active && (performance.now() - pointer.lastMove < 4000);

  for (let i = 0; i < flies.length; i++) {
    const f = flies[i];

    // wander: slow noise-driven drift
    const nx = Math.sin(t * f.f1 + f.p1) + Math.sin(t * 0.23 + f.p2) * 0.6;
    const ny = Math.cos(t * f.f2 + f.p2) + Math.cos(t * 0.31 + f.p1) * 0.6;
    f.vx += (nx * 7 - f.vx) * Math.min(1, dt * 1.5);
    f.vy += (ny * 6 - f.vy) * Math.min(1, dt * 1.5);

    // keep inside the field, gently; faint pull toward the middle third
    const m = 40;
    if (f.x < m) f.vx += dt * 60; if (f.x > W - m) f.vx -= dt * 60;
    if (f.y < H * 0.08) f.vy += dt * 60; if (f.y > H - 30) f.vy -= dt * 60;
    const cx = W / 2;
    if (Math.abs(f.x - cx) > W * 0.38) f.vx += Math.sign(cx - f.x) * dt * 22;

    // pointer disturbance: scatter + desync; startled flies stop listening.
    // Close in, the rhythm shatters completely; further out it only frays.
    let startled = false;
    if (pActive) {
      const dx = f.x - pointer.x, dy = f.y - pointer.y;
      const d = Math.hypot(dx, dy);
      if (d < DISTURB_R && d > 1) {
        const push = (1 - d / DISTURB_R);
        const flee = d < SHATTER_R ? 560 : 420;
        f.vx += (dx / d) * push * dt * flee;
        f.vy += (dy / d) * push * dt * flee;
        if (d < SHATTER_R) f.phase = rand() * 6.283;
        else f.phase += (rand() - 0.5) * push * dt * 60;
        startled = push > 0.2;
      }
    }

    // Kuramoto coupling to neighbors (startled flies and rebels don't listen)
    if (!startled && !f.rebel) {
      let s = 0, cnt = 0;
      for (let j = 0; j < flies.length; j++) {
        if (j === i) continue;
        const o = flies[j];
        const dx = o.x - f.x, dy = o.y - f.y;
        if (dx * dx + dy * dy < R2) { s += Math.sin(o.phase - f.phase); cnt++; }
      }
      if (cnt > 0) f.phase += (K * s / cnt) * dt;
    }

    f.phase += f.omega * dt;
    f.x += f.vx * dt; f.y += f.vy * dt;
  }

  // order parameter
  let ms = 0, mc = 0;
  for (const f of flies) { ms += Math.sin(f.phase); mc += Math.cos(f.phase); }
  const R = Math.hypot(ms, mc) / flies.length;
  syncSmooth += (R - syncSmooth) * Math.min(1, dt * 0.8);
  window.__syncR = syncSmooth;
}

function draw(t) {
  // fade the persistent glow layer (light trails)
  lctx.globalCompositeOperation = 'destination-out';
  lctx.fillStyle = 'rgba(0,0,0,0.10)';
  lctx.fillRect(0, 0, W, H);

  // paint flashes into the glow layer
  lctx.globalCompositeOperation = 'lighter';
  for (const f of flies) {
    const b = Math.pow(Math.max(0, Math.sin(f.phase)), 6);
    if (b < 0.015) continue;
    const s = f.size * (0.7 + b * 0.9);
    lctx.globalAlpha = Math.min(1, b * 1.15);
    lctx.drawImage(f.sprite, f.x - s / 2, f.y - s / 2, s, s);
  }
  lctx.globalAlpha = 1;

  // compose
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(bg, 0, 0, W, H);
  ctx.drawImage(light, 0, 0, W, H);

  // faint ember of every fly, so the field never feels empty on the dark beat
  ctx.globalCompositeOperation = 'lighter';
  for (const f of flies) {
    const s = f.size * 0.45;
    ctx.globalAlpha = 0.055;
    ctx.drawImage(f.sprite, f.x - s / 2, f.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  drawGrass(t);

  // bodies: visible only while flashing; dark fireflies are just night
  for (const f of flies) {
    const b = Math.pow(Math.max(0, Math.sin(f.phase)), 6);
    if (b < 0.35) continue;
    ctx.fillStyle = 'rgba(255,220,150,0.95)';
    ctx.beginPath(); ctx.arc(f.x, f.y, 2.2, 0, 7); ctx.fill();
  }

  syncEl.textContent = Math.round(syncSmooth * 100) + '%';
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  step(dt, now / 1000);
  draw(now / 1000);
  requestAnimationFrame(frame);
}

resize();
seedGrass();
seedFlies();
requestAnimationFrame(frame);
</script>
</body>
</html>
