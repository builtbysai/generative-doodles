<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9037 · Square One</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#060608; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}

// Square One v3: the folding ruler.
// One square made of four rigid sides joined by hinges.
// The hinges open cleanly, the square unfolds into a single straight line,
// the line keeps turning, then folds back into a square. Repeats.

const CYCLE = 20;        // seconds per loop
const ROT_SPEED = 0.15;  // radians per second, slow

// chain vertices for side length s, unfold u (0 = square, 1 = line)
function chainVerts(s, u){
  const turn = (Math.PI / 2) * (1 - u);
  const pts = [[0, 0]];
  let ang = 0, x = 0, y = 0;
  for (let k = 0; k < 4; k++){
    x += Math.cos(ang) * s;
    y += Math.sin(ang) * s;
    pts.push([x, y]);
    ang += turn;
  }
  return pts; // P0..P4
}
// centroid of densely sampled chain, so the shape stays centered while unfolding
function chainCenter(verts){
  let sx = 0, sy = 0, n = 0;
  const PER = 24;
  for (let k = 0; k < 4; k++){
    const a = verts[k], b = verts[k + 1];
    for (let i = 0; i < PER; i++){
      const t = i / PER;
      sx += a[0] + (b[0] - a[0]) * t;
      sy += a[1] + (b[1] - a[1]) * t;
      n++;
    }
  }
  return [sx / n, sy / n];
}

function draw(){
  const [w, h] = viewportWH(); prep(w, h);
  ctx.fillStyle = '#060608'; ctx.fillRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const m = Math.min(w, h);

  const phase = (clock / CYCLE) % 1;
  // side length grows; full line (4 sides) spans ~92% of the short side
  const s = m * (0.05 + phase * 0.18);
  const rot = clock * ROT_SPEED;

  const u = (1 - Math.cos(phase * Math.PI * 2)) / 2; // 0 -> 1 -> 0

  const verts = chainVerts(s, u);
  const cen = chainCenter(verts);

  let a;
  if (phase < 0.04) a = phase / 0.04;
  else if (phase > 0.94) a = (1 - phase) / 0.06;
  else a = 1;

  const bright = Math.round(225 + 30 * u);
  ctx.strokeStyle = 'rgba(' + bright + ',' + (bright - 2) + ',' + (bright - 8) + ',' + a.toFixed(3) + ')';
  ctx.lineWidth = 1.5;
  ctx.lineJoin = 'miter';

  const c = Math.cos(rot), sn = Math.sin(rot);
  ctx.beginPath();
  for (let k = 0; k < verts.length; k++){
    const x0 = verts[k][0] - cen[0], y0 = verts[k][1] - cen[1];
    const x = cx + x0 * c - y0 * sn;
    const y = cy + x0 * sn + y0 * c;
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}

let clock = 0, lastT = -1;
function loop(nowMs){
  const t = nowMs / 1000;
  if (lastT < 0) lastT = t;
  clock += Math.min(t - lastT, 0.1); lastT = t;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.addEventListener('resize', () => draw());
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => draw());
</script>
</body>
</html>
