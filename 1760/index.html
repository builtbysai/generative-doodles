<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydrophone</title>
<style>
html, body { margin: 0; padding: 0; background: #04100B; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#04100B';
var WATER_TOP = '#0A1F16';
var WATER_DEEP = '#020805';
var SKY = '#030907';
var CABLE = '#B4551F';
var CABLE_DARK = '#7A3410';
var PHOSPHOR = '#9FE8B0';
var AMBER = '#D9A45B';
var RIPPLE = '#8FA6A0';
var PLATE = '#E9DCC4';
var PLATE_LINE = 'rgba(122,82,51,0.7)';
var TITLE_INK = '#2E2417';
var HINT_INK = '#6B5636';
var FRAME_T = 60.0;
var P_SURFACE = 47.0;
var P_DEPTH = 47.0 * Math.SQRT2;
var SQRT2 = Math.SQRT2;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var RX = 0, RY = 0, RW = 0, RH = 0;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- driver: listening, not looking. A hydrophone cable hangs from
   the surface into black-green water; the world below stays half-heard,
   and the only thing that reads clearly is the glow at the cable tip,
   where plankton gather like sound around a microphone. The surface
   ripple runs on a 47 s period, the underwater drift on 47*sqrt(2) s,
   an irrational pair, so the two never synchronize. ---- */
function horizonY() { return RY + 0.16 * RH; }
function tipX() { return RX + 0.5 * RW; }
function tipY() { return RY + 0.44 * RH; }
var MOTES = [];
var BLOBS = [];
(function () {
  var rng = mulberry32(1760);
  var i;
  for (i = 0; i < 130; i++) {
    MOTES.push({
      ang: rng() * TAU,
      rad: 0.05 + 0.36 * Math.pow(rng(), 1.4),
      drift: (rng() - 0.5) * 0.9,
      wob: 0.3 + rng() * 0.9,
      ph: rng() * TAU,
      size: 0.0016 + rng() * 0.0038,
      amber: rng() < 0.28,
      tw: 0.5 + rng() * 1.1
    });
  }
  for (i = 0; i < 7; i++) {
    BLOBS.push({
      ang: rng() * TAU,
      rad: 0.18 + rng() * 0.30,
      drift: (rng() - 0.5) * 0.5,
      ph: rng() * TAU,
      r: 0.03 + rng() * 0.05,
      amber: rng() < 0.3,
      a: 0.05 + rng() * 0.06
    });
  }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) { RX = 0; RY = 0; RW = VW; RH = VH; }
  else {
    var s = Math.min(VW, VH);
    RX = (VW - s) / 2; RY = (VH - s) / 2; RW = s; RH = s;
  }
}
function drawWater(t) {
  var hy = horizonY();
  ctx.fillStyle = SKY;
  ctx.fillRect(RX, RY, RW, hy - RY);
  var grad = ctx.createLinearGradient(0, hy, 0, RY + RH);
  grad.addColorStop(0, WATER_TOP);
  grad.addColorStop(0.55, '#06150D');
  grad.addColorStop(1, WATER_DEEP);
  ctx.fillStyle = grad;
  ctx.fillRect(RX, hy, RW, RY + RH - hy);
  /* faint depth bands, barely there */
  var i;
  for (i = 1; i <= 3; i++) {
    var by = hy + (RY + RH - hy) * (i / 4);
    ctx.strokeStyle = rgba('#0E2A1D', 0.18);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(RX, by);
    ctx.lineTo(RX + RW, by);
    ctx.stroke();
  }
}
function drawSurface(t) {
  var hy = horizonY();
  var cx = tipX();
  var i, x, y;
  /* surface skin: a cold grey band with a slow sine warp */
  ctx.fillStyle = rgba(RIPPLE, 0.10);
  ctx.fillRect(RX, hy - RH * 0.008, RW, RH * 0.016);
  for (i = 0; i < 3; i++) {
    var amp = RH * (0.004 + 0.003 * i);
    var off = i * RH * 0.006;
    var a = (0.5 - 0.12 * i).toFixed(4);
    ctx.strokeStyle = 'rgba(143,166,160,' + a + ')';
    ctx.lineWidth = Math.max(1, RH * 0.0012);
    ctx.beginPath();
    for (x = RX; x <= RX + RW; x += 6) {
      var u = (x - RX) / RW;
      y = hy + off + amp * Math.sin(TAU * (u * 2.2 + t / P_SURFACE) + i * 1.9);
      if (x === RX) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  /* ripple rings where the cable pierces the surface */
  for (i = 0; i < 3; i++) {
    var pr = ((t / P_SURFACE + i / 3) % 1);
    var rr = (0.02 + pr * 0.10) * RW;
    var fa = (0.35 * (1 - pr)).toFixed(4);
    ctx.strokeStyle = 'rgba(143,166,160,' + fa + ')';
    ctx.lineWidth = Math.max(1, RH * 0.001);
    ctx.beginPath();
    ctx.moveTo(cx + rr, hy);
    ctx.ellipse(cx, hy, rr, rr * 0.28, 0, 0, TAU);
    ctx.stroke();
  }
}
function drawCable(t) {
  var hy = horizonY();
  var cx = tipX();
  var tipy = tipY();
  var sway = Math.sin(TAU * (t / P_DEPTH) + 1.2) * RW * 0.004;
  var swayTip = Math.sin(TAU * (t / P_DEPTH) + 2.1) * RW * 0.012;
  /* above the surface */
  ctx.strokeStyle = CABLE_DARK;
  ctx.lineWidth = Math.max(2, RW * 0.006);
  ctx.beginPath();
  ctx.moveTo(cx + sway * 0.4, RY);
  ctx.quadraticCurveTo(cx + sway, RY + (hy - RY) * 0.5, cx, hy);
  ctx.stroke();
  /* below the surface, rust orange, fading into the murk */
  var grad = ctx.createLinearGradient(0, hy, 0, tipy);
  grad.addColorStop(0, CABLE);
  grad.addColorStop(1, CABLE_DARK);
  ctx.strokeStyle = grad;
  ctx.lineWidth = Math.max(2, RW * 0.005);
  ctx.beginPath();
  ctx.moveTo(cx, hy);
  ctx.quadraticCurveTo(cx + sway, hy + (tipy - hy) * 0.55, cx + swayTip, tipy);
  ctx.stroke();
  /* cable tip: the brightest point in the piece */
  var gr = RW * 0.055;
  var glow = ctx.createRadialGradient(cx + swayTip, tipy, 0, cx + swayTip, tipy, gr);
  glow.addColorStop(0, 'rgba(255,196,110,0.85)');
  glow.addColorStop(0.35, 'rgba(217,164,91,0.28)');
  glow.addColorStop(1, 'rgba(217,164,91,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.moveTo(cx + swayTip + gr, tipy);
  ctx.arc(cx + swayTip, tipy, gr, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#F5C46E';
  ctx.beginPath();
  ctx.moveTo(cx + swayTip + RW * 0.005, tipy);
  ctx.arc(cx + swayTip, tipy, Math.max(2, RW * 0.005), 0, TAU);
  ctx.fill();
}
function drawMotes(t) {
  var tx = tipX(), ty = tipY();
  var i, m, a, r, x, y, d, bright, col;
  /* slow half-heard shapes first, under the motes */
  for (i = 0; i < BLOBS.length; i++) {
    var b = BLOBS[i];
    a = b.ang + b.drift * Math.sin(TAU * (t / P_DEPTH) + b.ph);
    r = b.rad * RW * (1 + 0.08 * Math.sin(TAU * (t / (P_DEPTH * 1.7)) + b.ph * 2));
    x = tx + Math.cos(a) * r;
    y = ty + Math.sin(a) * r * 0.8 + RH * 0.02;
    var br = b.r * RW;
    var bg = ctx.createRadialGradient(x, y, 0, x, y, br);
    var bc = b.amber ? AMBER : PHOSPHOR;
    bg.addColorStop(0, rgba(bc, b.a));
    bg.addColorStop(1, rgba(bc, 0));
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(x + br, y);
    ctx.arc(x, y, br, 0, TAU);
    ctx.fill();
  }
  for (i = 0; i < MOTES.length; i++) {
    m = MOTES[i];
    a = m.ang + m.drift * Math.sin(TAU * (t / P_DEPTH) + m.ph);
    r = m.rad * RW * (1 + 0.10 * Math.sin(TAU * (t / (P_DEPTH * m.wob)) + m.ph * 3));
    x = tx + Math.cos(a) * r;
    y = ty + Math.sin(a) * r * 0.78 + RH * 0.015;
    if (x < RX || x > RX + RW || y < horizonY() + 4 || y > RY + RH) continue;
    d = Math.sqrt((x - tx) * (x - tx) + (y - ty) * (y - ty)) / (RW * 0.5);
    bright = clamp(1 - d, 0.12, 1);
    bright *= 0.55 + 0.45 * Math.sin(TAU * (t / (P_DEPTH * m.tw)) + m.ph);
    col = m.amber ? AMBER : PHOSPHOR;
    ctx.fillStyle = rgba(col, clamp(bright, 0, 0.9));
    var sz = Math.max(1, m.size * RW);
    ctx.beginPath();
    ctx.moveTo(x + sz, y);
    ctx.arc(x, y, sz, 0, TAU);
    ctx.fill();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Hydrophone').width > RW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Hydrophone').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 11 · 06').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = RX + 12, plateY = RY + 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Hydrophone', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 11 · 06', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = RX + 12;
  var hintPlateY = RY + RH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawWater(phaseT);
  drawMotes(phaseT);
  drawCable(phaseT);
  drawSurface(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    moteCount: function () { return MOTES.length; },
    blobCount: function () { return BLOBS.length; },
    surfacePeriod: function () { return P_SURFACE; },
    depthPeriod: function () { return P_DEPTH; },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, surface mid-ripple, motes gathered ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
