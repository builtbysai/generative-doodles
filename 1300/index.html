<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>37 Fouettes</title>
<style>
  html, body { margin: 0; padding: 0; background: #F2EDE3; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var PAPER = '#F2EDE3', INK = '#1E1E22', TRAIL = '#B9B4A8',
      WEAVE = '#D8D2C2', FAIL = '#B13A2A';

  // Seeded PRNG (mulberry32). No Math.random anywhere.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var layoutRand = mulberry32(1300);
  var rollRand = mulberry32(130007);

  // Glyph score: 14 glyphs, irregular seeded spacing, no metronome regularity.
  var NGLYPH = 14;
  var glyphFrac = [], glyphKind = [], anchorFrac = [], anchorR = [];
  (function () {
    var acc = 0, steps = [];
    for (var i = 0; i < NGLYPH; i++) { var s = 0.55 + layoutRand() * 0.9; steps.push(s); acc += s; }
    var run = 0;
    for (var j = 0; j < NGLYPH; j++) { run += steps[j]; glyphFrac.push(run / acc); }
    for (var k = 0; k < NGLYPH; k++) {
      glyphKind.push(Math.floor(layoutRand() * 7));
      anchorFrac.push(0.12 + layoutRand() * 0.76);
      anchorR.push(0.55 + layoutRand() * 0.45);
    }
  })();

  var W = 0, H = 0, lastT = 0, dragging = false, dragX = 0;
  var baseT = 0, baseX = 0, headStarted = false; // head resume anchor: advances from baseX at baseT
  var prevHead = -1, triggered = {}, fouettes = [];
  var LOOP_S = 40;               // seconds for the reading head to cross the staff

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    W = w; H = h;
    if (!headStarted) { baseX = Math.max(24, W * 0.05); headStarted = true; }
  }
  function isPhone() {
    try {
      var sw = window.screen.width, sh = window.screen.height;
      return Math.min(sw, sh) < 700 || (H > W * 1.15);
    } catch (e) { return false; }
  }
  function layout() {
    var m = Math.max(24, W * 0.05);
    return {
      margin: m, staffW: W - 2 * m,
      staffY0: H * 0.07, staffY1: H * 0.30,
      fieldY0: H * 0.34, fieldY1: H * 0.96
    };
  }
  function headXAt(t, L) {
    if (dragging) return Math.max(L.margin, Math.min(L.margin + L.staffW, dragX));
    var x = baseX + (t - baseT) * (L.staffW / LOOP_S);
    var span = L.staffW;
    var rel = x - L.margin;
    rel = ((rel % span) + span) % span;
    return L.margin + rel;
  }

  function dot(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  function poly(pts, color, lw) {
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  }

  function drawGlyph(kind, x, y, s) {
    ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineWidth = Math.max(1.5, s * 0.12);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (kind === 0) { // diamond
      poly([[x, y - s], [x + s * 0.7, y], [x, y + s], [x - s * 0.7, y], [x, y - s]], INK, Math.max(1.5, s * 0.12));
    } else if (kind === 1) { // triangle
      poly([[x - s * 0.7, y + s * 0.6], [x + s * 0.7, y + s * 0.6], [x, y - s * 0.8], [x - s * 0.7, y + s * 0.6]], INK, Math.max(1.5, s * 0.12));
    } else if (kind === 2) { // double bar
      poly([[x - s * 0.35, y - s], [x - s * 0.35, y + s]], INK, Math.max(1.5, s * 0.14));
      poly([[x + s * 0.35, y - s], [x + s * 0.35, y + s]], INK, Math.max(1.5, s * 0.14));
    } else if (kind === 3) { // hook
      ctx.beginPath();
      ctx.moveTo(x - s * 0.7, y - s * 0.6);
      ctx.quadraticCurveTo(x + s * 0.9, y - s * 0.4, x + s * 0.2, y + s * 0.7);
      ctx.stroke();
    } else if (kind === 4) { // ring
      ctx.beginPath();
      ctx.moveTo(x + s * 0.7, y);
      ctx.arc(x, y, s * 0.7, 0, Math.PI * 2);
      ctx.stroke();
    } else if (kind === 5) { // cross
      poly([[x - s * 0.6, y - s * 0.6], [x + s * 0.6, y + s * 0.6]], INK, Math.max(1.5, s * 0.14));
      poly([[x + s * 0.6, y - s * 0.6], [x - s * 0.6, y + s * 0.6]], INK, Math.max(1.5, s * 0.14));
    } else { // chevron
      poly([[x - s * 0.7, y - s * 0.5], [x, y + s * 0.5], [x + s * 0.7, y - s * 0.5]], INK, Math.max(1.5, s * 0.12));
    }
  }

  // Fouette spiral: closed-form function of (t - t0). 32 turns, radius growing
  // sublinearly so the turns tighten as the particle spins outward.
  function spiralPoint(f, age, L) {
    var DUR = 6, p = Math.max(0, Math.min(1, age / DUR));
    var turns = 32, thMax = turns * Math.PI * 2;
    var th = thMax * p;
    var rMax = Math.min(W, H) * 0.075 * f.rScale;
    var r = rMax * Math.pow(p, 0.6);
    var cx = f.ax, cy = f.ay;
    return [cx + Math.cos(th - Math.PI / 2) * r, cy + Math.sin(th - Math.PI / 2) * r, p];
  }

  function draw(t) {
    lastT = t;
    var L = layout();
    var phone = isPhone();
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    // Cellulose weave: very faint ground grid.
    ctx.strokeStyle = WEAVE; ctx.lineWidth = 1; ctx.globalAlpha = 0.5;
    var gs = Math.max(22, Math.min(W, H) * 0.04);
    ctx.beginPath();
    for (var gx = 0; gx <= W; gx += gs) { ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
    for (var gy = 0; gy <= H; gy += gs) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Staff lines.
    var staffMid = (L.staffY0 + L.staffY1) / 2;
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, H * 0.0015); ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.moveTo(L.margin, staffMid - H * 0.045); ctx.lineTo(L.margin + L.staffW, staffMid - H * 0.045);
    ctx.moveTo(L.margin, staffMid + H * 0.045); ctx.lineTo(L.margin + L.staffW, staffMid + H * 0.045);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Glyphs on the staff.
    var gs2 = Math.max(9, Math.min(W, H) * 0.016);
    for (var i = 0; i < NGLYPH; i++) {
      var gx2 = L.margin + glyphFrac[i] * L.staffW;
      drawGlyph(glyphKind[i], gx2, staffMid, gs2);
    }

    // Reading head.
    var hx = headXAt(t, L);
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.5, W * 0.002);
    ctx.beginPath();
    ctx.moveTo(hx, L.staffY0 - 6); ctx.lineTo(hx, L.staffY1 + 6);
    ctx.stroke();
    dot(hx, L.staffY0 - 8, Math.max(3, W * 0.004), INK);

    // Fouette trails and particles. Trails fade aggressively: older segments
    // fade toward the start of the path, completed fouettes fade out over 2 s.
    var kept = [];
    for (var f = 0; f < fouettes.length; f++) {
      var ft = fouettes[f];
      var age = t - ft.t0;
      if (age < 0 || age > 8) continue;
      kept.push(ft);
      var col = ft.failed ? FAIL : INK;
      var fade = age > 6 ? Math.max(0, 1 - (age - 6) / 2) : 1;
      if (fade <= 0) continue;
      var steps = Math.floor(32 * Math.min(1, age / 6) * 8);
      if (steps < 2) steps = 2;
      var prev = null;
      for (var s2 = 0; s2 <= steps; s2++) {
        var pt = spiralPoint(ft, (s2 / steps) * Math.min(age, 6), L);
        if (prev) {
          var along = s2 / steps; // 0 = oldest, 1 = newest
          ctx.globalAlpha = fade * (0.08 + 0.5 * along);
          ctx.strokeStyle = ft.failed ? FAIL : TRAIL;
          if (ft.failed) ctx.strokeStyle = FAIL;
          ctx.lineWidth = Math.max(1, Math.min(W, H) * 0.002);
          ctx.beginPath();
          ctx.moveTo(prev[0], prev[1]);
          ctx.lineTo(pt[0], pt[1]);
          ctx.stroke();
        }
        prev = pt;
      }
      ctx.globalAlpha = 1;
      if (age <= 6) {
        var cur = spiralPoint(ft, age, L);
        dot(cur[0], cur[1], Math.max(2.5, Math.min(W, H) * 0.005), col);
      }
    }
    fouettes = kept;
    ctx.globalAlpha = 1;

    // Advance the head and trigger fouettes on forward crossings.
    if (!dragging && typeof requestAnimationFrame !== 'undefined') {
      if (prevHead >= 0 && hx < prevHead) { // loop wrap: fresh score
        triggered = {};
      } else if (prevHead >= 0) {
        for (var g = 0; g < NGLYPH; g++) {
          var gx3 = L.margin + glyphFrac[g] * L.staffW;
          if (!triggered[g] && prevHead < gx3 && gx3 <= hx) {
            triggered[g] = true;
            var failed = rollRand() < (1 / 32);
            fouettes.push({
              t0: t, failed: failed,
              ax: gx3, ay: L.fieldY0 + anchorFrac[g] * (L.fieldY1 - L.fieldY0),
              rScale: anchorR[g]
            });
          }
        }
      }
      prevHead = hx;
    }
  }

  function pos(e) {
    var r = { x: 0, y: 0 };
    if (e.touches && e.touches.length) { r.x = e.touches[0].clientX; r.y = e.touches[0].clientY; }
    else { r.x = e.clientX; r.y = e.clientY; }
    return r;
  }
  function scrubTo(x, t) {
    var L = layout();
    dragX = Math.max(L.margin, Math.min(L.margin + L.staffW, x));
    // Rewind: fouettes ahead of the head vanish; glyphs behind stay triggered.
    var hx = dragX, kept2 = [];
    for (var f = 0; f < fouettes.length; f++) if (fouettes[f].ax <= hx) kept2.push(fouettes[f]);
    fouettes = kept2;
    var nt = {};
    for (var g = 0; g < NGLYPH; g++) {
      var gx4 = L.margin + glyphFrac[g] * L.staffW;
      if (gx4 <= hx) nt[g] = true;
    }
    triggered = nt;
    prevHead = hx;
  }
  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    var p = pos(e);
    scrubTo(p.x, lastT);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = pos(e);
    scrubTo(p.x, lastT);
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    var L = layout();
    baseX = dragX; baseT = lastT;
    prevHead = dragX;
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  function onResize() { size(); draw(lastT); }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    window.addEventListener('resize', onResize);
  }

  size();
  if (typeof document !== 'undefined' && document.body) {
    try { document.body.style.background = PAPER; } catch (e) {}
  }
  draw(0); // boot flag: frame one is exactly t = 0

  // rAF loop: plain function declaration, armed from the real scheduler only.
  var T0 = null;
  function loop(ts) {
    if (T0 === null) T0 = ts;
    var t = (ts - T0) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
