<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9003 · Lichtenberg — Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #04050c;
    color: #b9c2e8;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 640px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #5d6694; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; color: #e8ecff; }
  header h1 .num { color: #8fa2ff; }
  header p { color: #7c86b8; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #c6cdee; font-weight: normal; }
  #stage {
    position: relative;
    width: min(92vw, 760px);
    aspect-ratio: 1 / 1;
    background: #070a1c;
    box-shadow: 0 18px 70px rgba(20, 28, 90, 0.55), 0 0 120px rgba(80, 100, 255, 0.08);
    cursor: pointer;
    overflow: hidden;
  }
  #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #cap { margin-top: 3vmin; color: #4d5583; font-size: 13px; font-style: italic; }
  footer { margin-top: 2vmin; color: #4d5583; font-size: 13px; font-style: italic; }
  footer a { color: #8fa2ff; text-decoration: none; }
  body.bare { padding: 0; justify-content: center; }
  body.bare header, body.bare #cap, body.bare footer { display: none; }
  body.bare #stage { width: 720px; height: 720px; box-shadow: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№9003</span> · Lichtenberg</h1>
  <p>A crystal grown from static. Thousands of sparks drift in out of the
  dark, and each one freezes the instant it touches the growing tree.
  Nothing here was drawn, only accreted. <b>Click the piece for a
  new crystal.</b></p>
</header>
<div id="stage"><canvas id="base"></canvas></div>
<div id="cap"></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 20260904;
const tParam = parseFloat(params.get("t"));
const bare = params.get("bare") === "1";
const DRIFT = 0.12; // weak inward field: keeps walkers from wandering, keeps the lightning character
if (bare) document.body.classList.add("bare");

const TAU = Math.PI * 2;
const VU = 1000;                 // internal coordinate space
const CX = 500, CY = 500;        // seed point (center)
const TOTAL = 24000;             // sparks per crystal
const BOUND_R = 428;             // growth boundary radius
const STICK_R = 3.0;             // sticking distance
const CELL = 5, GW = 200;        // collision grid: 200x200 over 1000 units
const WALKERS = 48;              // concurrent drifting sparks

const base = document.getElementById("base");
const bctx = base.getContext("2d");
const cap = document.getElementById("cap");

function fitCanvas(cv){
  const r = cv.parentElement.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(2, Math.round(r.width * dpr));
  cv.height = Math.max(2, Math.round(r.height * dpr));
  const ctx = cv.getContext("2d");
  ctx.setTransform(cv.width / VU, 0, 0, cv.width / VU, 0, 0);
}

// ---------- background: deep indigo night ----------
function paintBackground(ctx, rnd){
  const g = ctx.createLinearGradient(0, 0, 0, VU);
  g.addColorStop(0, "#151b4a");
  g.addColorStop(0.55, "#0d1233");
  g.addColorStop(1, "#060818");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VU, VU);
  for (let i = 0; i < 130; i++){
    const x = rnd() * VU, y = rnd() * VU;
    const r = 0.4 + rnd() * 1.1;
    const a = 0.04 + rnd() * 0.26;
    ctx.fillStyle = "rgba(205,214,255," + a.toFixed(3) + ")";
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  const v = ctx.createRadialGradient(CX, CY, VU * 0.28, CX, CY, VU * 0.72);
  v.addColorStop(0, "rgba(2,3,10,0)");
  v.addColorStop(1, "rgba(2,3,10,0.6)");
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, VU, VU);
}

// ---------- DLA simulation ----------
function makeSim(s){
  const rnd = mulberry32(s);
  const capN = TOTAL + 8;
  const px = new Float32Array(capN), py = new Float32Array(capN);
  const pdepth = new Uint16Array(capN);
  const ppar = new Int32Array(capN);
  const nxt = new Int32Array(capN);
  const head = new Int32Array(GW * GW).fill(-1);
  let count = 0, clusterR = 0;

  function cellOf(x, y){
    let gx = (x / CELL) | 0, gy = (y / CELL) | 0;
    if (gx < 0) gx = 0; else if (gx >= GW) gx = GW - 1;
    if (gy < 0) gy = 0; else if (gy >= GW) gy = GW - 1;
    return gy * GW + gx;
  }
  function addP(x, y, depth, parent){
    const i = count++;
    px[i] = x; py[i] = y; pdepth[i] = depth; ppar[i] = parent;
    const c = cellOf(x, y);
    nxt[i] = head[c]; head[c] = i;
    const d = Math.hypot(x - CX, y - CY);
    if (d > clusterR) clusterR = d;
    return i;
  }
  const stickR2 = STICK_R * STICK_R;
  // first cluster particle within sticking distance (early exit keeps
  // dense regions cheap); -1 when none is close
  function nearest(x, y){
    const gx = (x / CELL) | 0, gy = (y / CELL) | 0;
    for (let oy = -1; oy <= 1; oy++){
      const yy = gy + oy;
      if (yy < 0 || yy >= GW) continue;
      for (let ox = -1; ox <= 1; ox++){
        const xx = gx + ox;
        if (xx < 0 || xx >= GW) continue;
        let i = head[yy * GW + xx];
        while (i !== -1){
          const dx = px[i] - x, dy = py[i] - y;
          if (dx * dx + dy * dy < stickR2) return i;
          i = nxt[i];
        }
      }
    }
    return -1;
  }
  function spawnWalker(){
    const a = rnd() * TAU;
    const r = clusterR + 14;
    return { x: CX + Math.cos(a) * r, y: CY + Math.sin(a) * r, steps: 0 };
  }
  // advance one walker; returns "stick" | "dead" | "ok"
  function stepWalker(w){
    const r = Math.hypot(w.x - CX, w.y - CY);
    const clearance = r - clusterR;
    let s, a;
    if (clearance > 4){
      // safe jump: cannot enter the bounding disc from out here
      s = Math.max(4, Math.min(clearance * 0.5, 60));
      a = rnd() * TAU;
      w.x += Math.cos(a) * s;
      w.y += Math.sin(a) * s;
    } else {
      // in the moat: small steps, usually drifting inward (weak field,
      // keeps the lightning character and kills aimless wandering)
      s = 2.8;
      if (rnd() < DRIFT){ a = Math.atan2(CY - w.y, CX - w.x) + (rnd() - 0.5) * 1.2; }
      else a = rnd() * TAU;
      w.x += Math.cos(a) * s;
      w.y += Math.sin(a) * s;
    }
    w.steps++;
    if (clearance < 20){
      const pi = nearest(w.x, w.y);
      if (pi !== -1){
        const child = addP(w.x, w.y, pdepth[pi] + 1, pi);
        w.stickChild = child; w.stickParent = pi;
        return "stick";
      }
    }
    const r2 = Math.hypot(w.x - CX, w.y - CY);
    if (r2 > clusterR + 130 || r2 > 700 || w.steps > 8000) return "dead";
    return "ok";
  }
  addP(CX, CY, 0, -1); // the seed
  return {
    px, py, pdepth, ppar,
    get count(){ return count; },
    get clusterR(){ return clusterR; },
    spawnWalker, stepWalker
  };
}

// branch tint: trunk cool silver, tips near-white
function coreColor(depth){
  const t = Math.min(1, depth / 70);
  const r = Math.round(214 + t * 41);
  const g = Math.round(222 + t * 33);
  return "rgb(" + r + "," + g + ",255)";
}

function drawStick(ctx, sim, childIdx){
  const pi = sim.ppar[childIdx];
  if (pi < 0) return;
  const x0 = sim.px[pi], y0 = sim.py[pi];
  const x1 = sim.px[childIdx], y1 = sim.py[childIdx];
  const d = sim.pdepth[childIdx];
  // main channels read bolder than the fine outer twigs
  const hw = d < 10 ? 7.5 : 5.5;
  const mw = d < 10 ? 3.2 : 2.4;
  const cw = d < 10 ? 2.0 : 1.4;
  ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(110,140,255,0.10)";
  ctx.lineWidth = hw;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.strokeStyle = "rgba(165,185,255,0.32)";
  ctx.lineWidth = mw;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.strokeStyle = coreColor(d);
  ctx.globalAlpha = 0.9;
  ctx.lineWidth = cw;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.globalAlpha = 1;
}

function paintAll(){
  for (let i = 1; i < sim.count; i++) drawStick(bctx, sim, i);
}

// advance physics until target sticks or boundary; shared by both paths
function growTo(target){
  let wi = 0, guard = 0;
  const wl = walkers.length;
  const GUARD = 20000000;
  while (sim.count < target && sim.clusterR < BOUND_R && guard < GUARD){
    guard++;
    const w = walkers[wi];
    const res = sim.stepWalker(w);
    if (res === "stick"){
      onStick(w.stickChild);
      walkers[wi] = sim.spawnWalker();
    } else if (res === "dead"){
      walkers[wi] = sim.spawnWalker();
    }
    wi = (wi + 1) % wl;
  }
}

// ---------- run ----------
let sim, walkers;

function onStick(childIdx){
  drawStick(bctx, sim, childIdx);
}

function setupCanvases(){
  bctx.setTransform(1, 0, 0, 1, 0, 0);
  fitCanvas(base);
  paintBackground(bctx, mulberry32(seed ^ 0x9e37));
}

function start(newSeed){
  seed = newSeed;
  setupCanvases();
  sim = makeSim(seed);
  walkers = [];
  for (let i = 0; i < WALKERS; i++) walkers.push(sim.spawnWalker());

  // The piece shows the finished crystal on load and on click: grow the
  // whole simulation synchronously (it takes well under a second), then
  // paint it once. The ?t= URL param keeps a debug view of partial growth.
  const target = Number.isFinite(tParam)
    ? Math.max(1, Math.min(TOTAL, Math.floor(tParam * TOTAL)))
    : TOTAL;
  const keep = onStick;
  onStick = function(){};            // defer painting during bulk growth
  growTo(target);
  onStick = keep;
  paintAll();
  cap.textContent = "seed " + seed + " · click the piece for a new crystal";
}

document.getElementById("stage").addEventListener("click", () => {
  const ns = (Math.random() * 1e9) | 0;
  try { history.replaceState(null, "", "?seed=" + ns); } catch (e) {}
  start(ns);
});

let resizeT;
window.addEventListener("resize", () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => {
    // re-fit and repaint the finished crystal
    setupCanvases();
    paintAll();
  }, 200);
});

start(seed);
</script>
</body>
</html>
