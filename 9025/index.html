<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  footer a { color: #e8a04c; text-decoration: none; }
  @media (max-width: 480px) {

    #caption { font-size: 11px; left: 10px; bottom: 8px; }

</style>

<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№9025</span> · Shardscape</h1>
  <p>One fixed set of triangles, four landscapes. Every morph shatters the
  scene and rebuilds it, each triangle flying its own staggered path.
  <b>Click anywhere to deal a new hand.</b></p>
</header>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="caption">Peaks</div>
  <div id="dots"><span></span><span></span><span></span><span></span></div>
</div>
<footer><a href="../">← all doodles</a> · <span id="seedlabel"></span> · click to reshuffle</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let SEED = parseInt(params.get("seed") || "902501", 10);
const DEMO = params.get("demo") === "1";
if (Number.isNaN(SEED)) SEED = 902501;
let rand = mulberry32(SEED);

// Design space (fixed); canvas scales to fit
const DW = 1200, DH = 800;
const SQ3 = Math.sqrt(3);

const stage = document.getElementById("stage");
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const captionEl = document.getElementById("caption");
const dotsEl = document.getElementById("dots").children;
const seedLabel = document.getElementById("seedlabel");

// Fixed triangle lattice: identical equilateral triangles tiling the plane.
// Each primitive keeps its lattice slot; only pose (x, y, rot, scale, color)
// changes per scene. Poses never touch opacity: the morph is pure motion.
let tris = [];
const TRI_S = 78;
function buildLattice(){
  tris = [];
  const s = TRI_S, h = s * SQ3 / 2;
  const rows = Math.ceil(DH / h) + 2;
  for (let r = 0; r < rows; r++){
    const y = r * h - h;
    const off = (r % 2) ? s / 2 : 0;
    const cols = Math.ceil(DW / s) + 3;
    for (let k = -2; k < cols; k++){
      const ax = k * s + off;
      tris.push({ cx: ax, cy: y + 2 * h / 3, up: true });
      tris.push({ cx: ax + s / 2, cy: y + h / 3, up: false });
    }
  }
  tris = tris.filter(p => p.cx > -s && p.cx < DW + s &&
                          p.cy > -s && p.cy < DH + s);
}
function gauss(x, c, w){ const d = (x - c) / w; return Math.exp(-d * d); }
function bandi(v, n){ return Math.max(0, Math.min(n - 1, Math.floor(v))); }
function shade(col, f){
  return [Math.min(255, Math.round(col[0] * f)),
          Math.min(255, Math.round(col[1] * f)),
          Math.min(255, Math.round(col[2] * f))];
}
function jitter(col, amt){
  const f = 1 + (rand() - 0.5) * amt;
  return shade(col, f);
}

// Scene builders. Two passes: first every triangle gets its region color
// (a complete mosaic), then small accents are stamped on top. An accent
// keeps its region color as `sub`, drawn full-size underneath, so the
// smaller accent triangle never opens a gap onto the page background.
let scenes = [];
function buildScenes(){
  buildLattice();
  const N = tris.length;
  scenes = [buildPeaks(), buildSwell(), buildTimber(), buildNightfall()];
  for (const sc of scenes){
    if (sc.poses.length !== N) throw new Error("pose count mismatch");
  }
}
function basePose(t){
  return { x: t.cx, y: t.cy, rot: t.up ? 0 : Math.PI, sc: 1,
           col: [0,0,0], sub: null };
}
const UP_F = 1.055, DN_F = 0.945; // faceted light: up triangles catch light
function stamp(poses, x, y, rad, col, sc){
  for (let i = 0; i < tris.length; i++){
    const t = tris[i];
    if (Math.hypot(t.cx - x, t.cy - y) < rad){
      const p = poses[i];
      if (!p.sub) p.sub = p.col.slice();
      p.col = col.slice();
      p.sc = sc;
    }
  }
}

function buildPeaks(){
  const poses = [];
  // three guaranteed-spread peaks per ridge so every seed gets real mountains
  const c1 = DW * (0.14 + rand() * 0.18), c2 = DW * (0.44 + rand() * 0.18),
        c3 = DW * (0.72 + rand() * 0.16);
  const sx = DW * (0.70 + rand() * 0.12), sy = DH * (0.16 + rand() * 0.08);
  const sr = DW * 0.062;
  const meadowPh = rand() * 6.28;
  const snowJit = rand() * 6.28;
  const ridgeFar = x => DH * 0.54 - DH * 0.13 * gauss(x, c1, DW * 0.10)
                                   - DH * 0.10 * gauss(x, c2, DW * 0.085)
                                   - DH * 0.07 * gauss(x, c3, DW * 0.07);
  const ridgeNear = x => DH * 0.68 - DH * 0.17 * gauss(x, c1 + DW * 0.03, DW * 0.11)
                                    - DH * 0.13 * gauss(x, c2 - DW * 0.02, DW * 0.09)
                                    - DH * 0.09 * gauss(x, c3, DW * 0.075);
  const meadow = x => DH * 0.83 + DH * 0.022 * Math.sin(x / DW * 6.28 + meadowPh);
  const skyCols = [[47,109,179],[110,166,214],[172,209,232],[214,236,244],[232,244,248]];
  for (const t of tris){
    const p = basePose(t);
    const f = t.up ? UP_F : DN_F;
    const rf = ridgeFar(t.cx), rn = ridgeNear(t.cx), md = meadow(t.cx);
    const ds = Math.hypot(t.cx - sx, t.cy - sy);
    if (ds < sr) p.col = jitter([255, 214, 92], 0.03);
    else if (ds < sr * 1.6) p.col = jitter([255, 232, 158], 0.03);
    else if (t.cy <= rf) p.col = jitter(skyCols[bandi(t.cy / DH * 5, 5)], 0.04);
    else if (t.cy <= rn) p.col = jitter(shade([125,148,184], f), 0.05);
    else if (t.cy <= md){
      const snowLine = DH * (0.030 + 0.022 * Math.sin(t.cx / DW * 13.0 + snowJit));
      if ((t.cy - rn) < snowLine) p.col = jitter([244, 247, 250], 0.02);
      else p.col = jitter(shade([74, 95, 138], f), 0.05);
    }
    else p.col = jitter(shade([[106,158,92],[88,140,80]][bandi((t.cy - md) / DH * 4, 2)], f), 0.05);
    poses.push(p);
  }
  const birdPts = [];
  let bguard = 0;
  while (birdPts.length < 3 && bguard++ < 60){
    const bx = DW * (0.15 + rand() * 0.5), by = DH * (0.12 + rand() * 0.2);
    if (birdPts.every(q => Math.hypot(q[0] - bx, q[1] - by) > 170)) birdPts.push([bx, by]);
  }
  for (const bpt of birdPts)
    stamp(poses, bpt[0], bpt[1], 12, jitter([44, 62, 85], 0.03), 0.85);
  return { name: "Peaks", poses };
}

function buildSwell(){
  const poses = [];
  const horizon = DH * 0.46;
  const sx = DW * (0.44 + rand() * 0.12), sy = horizon - DH * 0.055;
  const sr = DW * 0.052;
  const x0 = DW * 0.28, x1 = DW * 0.80;
  const crest = x => {
    const k = Math.min(1, Math.max(0, (x - x0) / (x1 - x0)));
    return horizon - DH * 0.15 * Math.pow(Math.sin(Math.PI * k), 1.25);
  };
  const bx = DW * (0.13 + rand() * 0.08);
  const skyCols = [[64,74,140],[150,110,150],[226,150,130],[244,196,150],[250,224,180]];
  const seaCols = [[38,140,150],[28,118,140],[20,96,124],[14,74,104],[10,54,84]];
  for (const t of tris){
    const p = basePose(t);
    const f = t.up ? UP_F : DN_F;
    const ds = Math.hypot(t.cx - sx, t.cy - sy);
    if (ds < sr) p.col = jitter([255, 206, 110], 0.03);
    else if (ds < sr * 1.8) p.col = jitter([255, 226, 168], 0.03);
    else if (t.cx > x0 - 20 && t.cx < x1 + 20 && t.cy > horizon - DH * 0.24){
      const cy = crest(Math.min(x1, Math.max(x0, t.cx)));
      if (t.cy <= cy && (cy - t.cy) < 54) p.col = jitter([248, 252, 253], 0.02);
      else if (t.cy > cy && (t.cy - cy) < 88) p.col = jitter([13, 68, 96], 0.04);
      else if (t.cy <= horizon) p.col = jitter(skyCols[bandi(t.cy / horizon * 5, 5)], 0.04);
      else p.col = jitter(shade(seaCols[bandi((t.cy - horizon) / (DH - horizon) * 5, 5)], f), 0.05);
    }
    else if (t.cy <= horizon) p.col = jitter(skyCols[bandi(t.cy / horizon * 5, 5)], 0.04);
    else p.col = jitter(shade(seaCols[bandi((t.cy - horizon) / (DH - horizon) * 5, 5)], f), 0.05);
    // sailboat (full-size triangles, part of the mosaic)
    if (t.cy > horizon && Math.abs(t.cx - bx) < 26 && t.cy < horizon + 30)
      p.col = jitter([74, 54, 48], 0.05);
    else if (t.cy <= horizon && t.cy > horizon - 70){
      const hw = 20 * (1 - (horizon - 6 - t.cy) / 58);
      if (Math.abs(t.cx - (bx + 5)) < Math.max(4, hw)) p.col = jitter([245, 242, 234], 0.03);
      else if (Math.abs(t.cx - bx) < 4) p.col = [58, 46, 40];
    }
    poses.push(p);
  }
  for (let i = 0; i < 3; i++)
    stamp(poses, DW * (0.12 + rand() * 0.3), DH * (0.10 + rand() * 0.18),
          12, [52, 58, 74], 0.85);
  for (let i = 0; i < 22; i++){
    const x = x0 + rand() * (x1 - x0);
    stamp(poses, x, crest(x) - 14 - rand() * 70, 24,
          jitter([248, 252, 253], 0.02), 0.55 + rand() * 0.3);
  }
  return { name: "Swell", poses };
}

function buildTimber(){
  const poses = [];
  const groundY = DH * 0.80;
  const mx = DW * (0.22 + rand() * 0.10), my = DH * (0.20 + rand() * 0.08);
  const mr = DW * 0.055;
  const trees = [];
  const nT = 6;
  for (let i = 0; i < nT; i++){
    trees.push({
      x: DW * (0.08 + 0.84 * i / (nT - 1)) + (rand() - 0.5) * DW * 0.05,
      h: DH * (0.28 + rand() * 0.20)
    });
  }
  const skyCols = [[43,45,92],[120,84,120],[214,130,120],[247,178,103],[250,205,140]];
  const leafCols = [[34,84,54],[28,72,46],[22,60,38]];
  for (const t of tris){
    const p = basePose(t);
    const f = t.up ? UP_F : DN_F;
    const dm = Math.hypot(t.cx - mx, t.cy - my);
    if (dm < mr) p.col = jitter([253, 243, 216], 0.02);
    else if (dm < mr * 1.9) p.col = jitter([247, 222, 170], 0.03);
    else if (t.cy < groundY){
      let inTree = false;
      for (const tr of trees){
        const top = groundY - tr.h, spread = DW * 0.085;
        if (t.cy > top && Math.abs(t.cx - tr.x) < spread * (1 - (t.cy - top) / tr.h)){
          p.col = jitter(shade(leafCols[bandi((t.cy - top) / tr.h * 3, 3)], f), 0.06);
          inTree = true; break;
        }
        if (Math.abs(t.cx - tr.x) < DW * 0.013 &&
            t.cy >= groundY - DH * 0.07 && t.cy < groundY){
          p.col = jitter([90, 61, 43], 0.05);
          inTree = true; break;
        }
      }
      if (!inTree) p.col = jitter(skyCols[bandi(t.cy / groundY * 5, 5)], 0.04);
    }
    else p.col = jitter(shade([[45,74,47],[36,60,40]][bandi((t.cy - groundY) / (DH - groundY) * 3, 2)], f), 0.05);
    poses.push(p);
  }
  for (let i = 0; i < 14; i++)
    stamp(poses, rand() * DW, DH * (0.55 + rand() * 0.35), 15,
          [255, 202, 122], 0.55);
  return { name: "Timber", poses };
}

function buildNightfall(){
  const poses = [];
  const mx = DW * (0.66 + rand() * 0.10), my = DH * (0.22 + rand() * 0.08);
  const mr = DW * 0.042;
  const hillPh = rand() * 6.28;
  const hillFar = x => DH * 0.64 + DH * 0.050 * Math.sin(x / DW * 6.28 + hillPh);
  const hillNear = x => DH * 0.80 + DH * 0.040 * Math.sin(x / DW * 4.4 + hillPh * 2);
  const nx = DW * (0.28 + rand() * 0.10);
  const skyCols = [[13,19,48],[19,28,66],[27,40,88],[38,54,110]];
  for (const t of tris){
    const p = basePose(t);
    const f = t.up ? UP_F : DN_F;
    const dm = Math.hypot(t.cx - mx, t.cy - my);
    const hf = hillFar(t.cx), hn = hillNear(t.cx);
    if (dm < mr) p.col = jitter([244, 238, 220], 0.02);
    else if (dm < mr * 1.7) p.col = jitter([140, 150, 195], 0.04);
    else if (t.cy <= hf) p.col = jitter(skyCols[bandi(t.cy / hf * 4, 4)], 0.04);
    else if (t.cy <= hn) p.col = jitter(shade([27, 38, 96], f), 0.05);
    else p.col = jitter(shade([15, 21, 52], f), 0.05);
    poses.push(p);
  }
  // a distant lit window just above the far hill crest
  const wy = hillFar(nx);
  stamp(poses, nx - DW * 0.012, wy - DH * 0.045, 22, [255, 201, 120], 0.8);
  stamp(poses, nx + DW * 0.014, wy - DH * 0.043, 18, [190, 140, 88], 0.7);
  let guard = 0, placed = 0;
  while (placed < 56 && guard++ < 900){
    const x = rand() * DW, y = rand() * DH * 0.55;
    if (Math.hypot(x - mx, y - my) > mr * 2.4){
      stamp(poses, x, y, 20, rand() < 0.6 ? [255, 246, 216] : [223, 233, 255],
            0.30 + rand() * 0.22);
      placed++;
    }
  }
  return { name: "Nightfall", poses };
}

// Timeline: hold, then a staggered shatter-and-reform into the next scene.
// Cascade axis alternates every transition: left-right, right-left,
// top-bottom, bottom-top.
const HOLD_MS = 3400, TRANSIT_MS = 1150, STAGGER_MS = 1300;
const AXES = ["lr", "rl", "tb", "bt"];
const CYCLE = HOLD_MS + TRANSIT_MS + STAGGER_MS;
let delays = new Float32Array(0);
let spins = new Float32Array(0);
let lifts = new Float32Array(0);
let transIdx = -1;

function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }
function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

function prepTransition(idx){
  const axis = AXES[idx % AXES.length];
  const cur = scenes[idx % scenes.length].poses;
  const N = tris.length;
  delays = new Float32Array(N);
  spins = new Float32Array(N);
  lifts = new Float32Array(N);
  const r2 = mulberry32((SEED * 31 + idx * 101 + 7) | 0);
  for (let i = 0; i < N; i++){
    const p = cur[i];
    let proj;
    if (axis === "lr") proj = p.x / DW;
    else if (axis === "rl") proj = 1 - p.x / DW;
    else if (axis === "tb") proj = p.y / DH;
    else proj = 1 - p.y / DH;
    delays[i] = proj * STAGGER_MS + r2() * 150;
    spins[i] = r2() < 0.38 ? 1 : 0;
    lifts[i] = 50 + r2() * 80;
  }
}

let clock0 = performance.now();
if (DEMO) clock0 -= (HOLD_MS + 700); // open mid-shatter for captures

function triPath(x, y, rot, rr){
  const r0 = rot - Math.PI / 2, r1 = rot + Math.PI / 6, r2 = rot + 5 * Math.PI / 6;
  ctx.beginPath();
  ctx.moveTo(x + rr * Math.cos(r0), y + rr * Math.sin(r0));
  ctx.lineTo(x + rr * Math.cos(r1), y + rr * Math.sin(r1));
  ctx.lineTo(x + rr * Math.cos(r2), y + rr * Math.sin(r2));
  ctx.closePath();
}
function fillRGB(c){
  ctx.fillStyle = "rgb(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + ")";
  ctx.fill();
}
function lerp3(a, b, k){
  return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
}

function frame(now){
  const t = now - clock0;
  const slot = Math.floor(t / CYCLE);
  const local = t - slot * CYCLE;
  const si = ((slot % 4) + 4) % 4;
  const morphing = local >= HOLD_MS;

  if (morphing && transIdx !== slot){
    transIdx = slot;
    prepTransition(slot);
  }
  captionEl.textContent = scenes[morphing ? (si + 1) % 4 : si].name;
  const dotOn = morphing ? (si + 1) % 4 : si;
  for (let d = 0; d < 4; d++) dotsEl[d].className = d === dotOn ? "on" : "";

  const k = (stageW * DPR) / DW;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.clearRect(0, 0, DW, DH);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, DW, DH);
  ctx.clip();

  const A = scenes[si].poses;
  const B = scenes[(si + 1) % 4].poses;
  const mt = morphing ? local - HOLD_MS : 0;
  const R = TRI_S / SQ3;

  for (let i = 0; i < tris.length; i++){
    const a = A[i], b = B[i];
    let x, y, rot, sc, col, sub;
    if (!morphing){
      x = a.x; y = a.y; rot = a.rot; sc = a.sc; col = a.col; sub = a.sub;
    } else {
      const e = (mt - delays[i]) / TRANSIT_MS;
      if (e <= 0){
        x = a.x; y = a.y; rot = a.rot; sc = a.sc; col = a.col; sub = a.sub;
      } else if (e >= 1){
        x = b.x; y = b.y; rot = b.rot; sc = b.sc; col = b.col; sub = b.sub;
      } else {
        const kk = easeInOutCubic(e);
        const dx = b.x - a.x, dy = b.y - a.y;
        const len = Math.hypot(dx, dy) || 1;
        const arc = Math.sin(Math.PI * kk) * lifts[i];
        x = a.x + dx * kk + (-dy / len) * arc;
        y = a.y + dy * kk + (dx / len) * arc;
        rot = a.rot + (b.rot - a.rot + spins[i] * Math.PI * 2) * kk;
        sc = (a.sc + (b.sc - a.sc) * kk) * (1 - 0.30 * Math.sin(Math.PI * kk));
        const ce = easeOutCubic(Math.min(1, kk * 1.6));
        col = lerp3(a.col, b.col, ce);
        const sa = a.sub || a.col, sb = b.sub || b.col;
        sub = (a.sub || b.sub) ? lerp3(sa, sb, ce) : null;
      }
    }
    // sublayer: full-size region color under small accents, so no gaps open
    if (sub){ triPath(x, y, rot, R); fillRGB(sub); }
    triPath(x, y, rot, R * sc); fillRGB(col);
  }
  ctx.restore();
  requestAnimationFrame(frame);
}

// Sizing: fixed 3:2 stage, fits viewport with no scroll
let DPR = 1, stageW = 0;
function resize(){
  const headerH = document.querySelector("header").offsetHeight;
  const footerH = document.querySelector("footer").offsetHeight;
  const availW = window.innerWidth - 32;
  const availH = window.innerHeight - headerH - footerH - 70;
  let w = Math.min(availW, 1100, availH * 1.5);
  w = Math.max(280, w);
  stageW = w;
  const h = w / 1.5;
  stage.style.width = w + "px";
  stage.style.height = h + "px";
  DPR = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(w * DPR);
  canvas.height = Math.round(h * DPR);
}
let resizeTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 150);
});

// Click anywhere: new seeded variation
function reseed(){
  SEED = Math.floor(Math.random() * 1000000000);
  rand = mulberry32(SEED);
  buildScenes();
  transIdx = -1;
  clock0 = performance.now();
  seedLabel.textContent = "seed " + SEED;
}
window.addEventListener("pointerdown", reseed);

buildScenes();
seedLabel.textContent = "seed " + SEED;
resize();
requestAnimationFrame(frame);
</script>
