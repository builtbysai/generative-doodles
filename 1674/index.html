<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hash Becomes Painting</title>
<style>
html, body { margin: 0; padding: 0; background: #EFE6D4; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#EFE6D4';
var INK = '#191512';
var PLATE = '#2e2418';
var PLATE_LINE = 'rgba(201,143,45,0.55)';
var TITLE_INK = '#f3ead6';
var HINT_INK = '#e8c87a';
var ASSEMBLY = 10, GROWTH = 60, HOLD = 60, DISSOLVE = 8;
var CYCLE = ASSEMBLY + GROWTH + HOLD + DISSOLVE;
var FIRST_T = 34.0;
var GAP = 5;
var CELL = 96;
var WALKERS = 14;
/* The mint ritual, performed live. A transaction hash scrolls in at
   the top of the sheet, character by character, until it stands
   resolved; the string is then consumed as a seed and the flow
   field below grows its blocks from it: palette, turbulence, block
   scale and density are all read off slices of that string, so the
   same string always grows the same painting. The finished piece
   holds for a slow minute, dissolves, and a new hash begins
   assembling. Frame one is a fixed phase: mint 1 fully resolved,
   field 40 percent grown. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* Synchronous hash to seed: FNV-1a over the string. crypto.subtle is
   async and would break node-canvas QA, so the prompt's SHA-256 is
   realized here as a small synchronous hash feeding mulberry32; the
   string still genuinely drives the seed. */
function fnv1a(str) {
  var h = 0x811c9dc5, i;
  for (i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }

}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* Fixed table of authored mint hashes. No re-rolls, no peeking: the
   cycle walks this table in order, one mint per cycle. */
var HASHES = [
  'a3f9c21e7b4d08a619e5f7c2d08a3b5e6c1f94a2b7e03d584a92c6f10d5b7e39',
  '51c8e0a4f7a2b6938d04e1c53b9f6a72e04d18c9a6b35f0792e7c41d5f08a3b6',
  '9e27b4f1c058a3d67f1a9e40b3d682a51c8f5e97d4a036b86e59c2f0a1b743d9',
  '2d6a19c884b3f0e50a7e42d9f91c5b375a03e8f6c2b9741d8f46a0c3e7d195b2',
  'f0c4a7193e8b2d569a1f7c034d6b89e27c2a5f18b908d3a61e5c74f963a0b8d4',
  '68b5e3a1d1f09c475e3a8b20a94f6d1c0b7e2a59f3c186d48a4d0e7629f1c5b8'
];
/* Weighted palettes from the study's PP920 tables, as realized in
   TH1. Palette index, turbulence, block scale and density are read
   off slices of the hash string itself. */
var PALETTES = [
  { name: 'sand', colors: [[201, 143, 45], [166, 73, 43], [232, 217, 184]],
    weights: [0.45, 0.35, 0.20] },
  { name: 'cobalt', colors: [[43, 74, 140], [127, 163, 201], [221, 227, 228]],
    weights: [0.45, 0.35, 0.20] },
  { name: 'bone', colors: [[216, 205, 180], [31, 27, 22], [179, 58, 43]],
    weights: [0.40, 0.40, 0.20] }
];
function mintFeatures(h) {
  return {
    hash: h,
    seed: fnv1a(h),
    palette: parseInt(h.slice(0, 2), 16) % PALETTES.length,
    turbulence: 0.15 + 0.85 * (parseInt(h.slice(2, 6), 16) / 65535),
    scale: 0.75 + 0.5 * (parseInt(h.slice(6, 10), 16) / 65535),
    density: 900 + Math.floor(900 * (parseInt(h.slice(10, 14), 16) / 65535))

}
function pickColor(rng, pal) {
  var x = rng(), acc = 0, i;
  for (i = 0; i < pal.colors.length; i++) {
    acc += pal.weights[i];
    if (x <= acc) return pal.colors[i];
  }
  return pal.colors[0];
}
/* Layered value noise on a seeded grid. */
function makeNoise(seed, gw, gh) {
  var r = mulberry32(seed);
  var g = [], i, j;
  for (j = 0; j <= gh; j++) {
    g.push([]);
    for (i = 0; i <= gw; i++) g[j].push(r());
  }
  function smooth(t) { return t * t * (3 - 2 * t); }
  return function (x, y) {
    var fx = clamp(x, 0, 0.9999) * gw, fy = clamp(y, 0, 0.9999) * gh;
    var ix = Math.floor(fx), iy = Math.floor(fy);
    var tx = smooth(fx - ix), ty = smooth(fy - iy);
    var a = g[iy][ix], b = g[iy][ix + 1], c = g[iy + 1][ix], d = g[iy + 1][ix + 1];

  };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false, S = 0, sheetX = 0, sheetY = 0;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);

  sheetY = (VH - S) / 2;
}
function pad() { return Math.max(12, S * 0.045); }
function stripH() { return S / 3; }
function fieldRect() {
  var m = Math.max(14, S * 0.03);
  return {
    x0: sheetX + m,
    y0: sheetY + stripH() + Math.max(26, S * 0.045),
    x1: sheetX + S - m,
    y1: sheetY + S - m

}
/* ---- mint state ---- */
var curMint = -1, layoutS = -1;
var mint = null, palette = PALETTES[0];
var noiseA = null, noiseB = null, noiseC = null;
var simRng = null;
var blocks = [];
var hash = {};
var walkers = [];
function hashKey(cx, cy) { return cx + ':' + cy; }
function cellOf(x) { return Math.floor(x / CELL); }
function hashInsert(b) {
  var k = hashKey(cellOf(b.x), cellOf(b.y));
  if (!hash[k]) hash[k] = [];
  hash[k].push(b);
}
function fieldAngle(x, y) {
  var fr = fieldRect();
  var u = (x - fr.x0) / Math.max(fr.x1 - fr.x0, 1);
  var v = (y - fr.y0) / Math.max(fr.y1 - fr.y0, 1);
  var n = 0.6 * noiseA(u, v) + 0.3 * noiseB(u, v) + 0.1 * noiseC(u, v);
  var base = (n - 0.5) * 1.2;
  var tau = mint.turbulence;
  var swirl = tau * 0.9 * Math.sin(x * 0.006 + y * 0.005)
    + tau * 0.4 * Math.sin((x - y) * 0.004);

}
/* Capsule collision: distance between centerline segments must clear
   the sum of half-widths plus the minimum gap. */
function segDist(ax, ay, bx, by, cx, cy, dx, dy) {
  function ptSeg(px, py, x1, y1, x2, y2) {
    var vx = x2 - x1, vy = y2 - y1;
    var len2 = vx * vx + vy * vy;
    var tt = len2 === 0 ? 0 : clamp(((px - x1) * vx + (py - y1) * vy) / len2, 0, 1);
    var qx = x1 + tt * vx, qy = y1 + tt * vy;
    var ex = px - qx, ey = py - qy;
    return Math.sqrt(ex * ex + ey * ey);
  }
  var ux = bx - ax, uy = by - ay, vx = dx - cx, vy = dy - cy;
  var den = ux * vy - uy * vx;

    return Math.min(ptSeg(ax, ay, cx, cy, dx, dy), ptSeg(bx, by, cx, cy, dx, dy),
      ptSeg(cx, cy, ax, ay, bx, by), ptSeg(dx, dy, ax, ay, bx, by));
  }
  var wx = ax - cx, wy = ay - cy;
  var s = (vx * wy - vy * wx) / den;
  var t = (ux * wy - uy * wx) / den;
  if (s >= 0 && s <= 1 && t >= 0 && t <= 1) return 0;
  return Math.min(ptSeg(ax, ay, cx, cy, dx, dy), ptSeg(bx, by, cx, cy, dx, dy),

function collides(x, y, ang, len, wid) {
  var hl = len / 2, ca = Math.cos(ang), sa = Math.sin(ang);
  var ax = x - hl * ca, ay = y - hl * sa, bx = x + hl * ca, by = y + hl * sa;
  var reach = len + wid + GAP;
  var cx = cellOf(x), cy = cellOf(y), i, j, k, list, m, b;
  for (i = cx - 1; i <= cx + 1; i++) {
    for (j = cy - 1; j <= cy + 1; j++) {
      list = hash[hashKey(i, j)];
      if (!list) continue;
      for (m = 0; m < list.length; m++) {
        b = list[m];
        var dx = b.x - x, dy = b.y - y;
        if (dx * dx + dy * dy > reach * reach) continue;
        var bhl = b.len / 2, bca = Math.cos(b.ang), bsa = Math.sin(b.ang);
        var d = segDist(ax, ay, bx, by,
          b.x - bhl * bca, b.y - bhl * bsa, b.x + bhl * bca, b.y + bhl * bsa);

}
function inside(x, y) {
  var fr = fieldRect();
  return x > fr.x0 && x < fr.x1 && y > fr.y0 && y < fr.y1;
}
function spawnWalker() {
  var fr = fieldRect();
  return {
    x: fr.x0 + simRng() * (fr.x1 - fr.x0),
    y: fr.y0 + simRng() * (fr.y1 - fr.y0),
    life: 40 + Math.floor(simRng() * 40)

}
function stepWalker(w) {
  if (w.life <= 0 || blocks.length >= mint.density) return false;
  var ang0 = fieldAngle(w.x, w.y);
  var sc = clamp(S / 900, 0.55, 1.15) * mint.scale;
  var k, ang, len, wid, bx, by;
  for (k = 0; k < 5; k++) {
    ang = ang0 + (simRng() - 0.5) * 0.6;
    len = (30 + simRng() * 26) * sc;
    wid = (12 + simRng() * 8) * sc;
    bx = w.x; by = w.y;
    if (inside(bx, by) && !collides(bx, by, ang, len, wid)) {
      var b = { x: bx, y: by, len: len, wid: wid, ang: ang,
        col: pickColor(simRng, palette) };
      blocks.push(b);
      hashInsert(b);
      w.x = bx + Math.cos(ang) * (len * 0.92 + 40 * sc);
      w.y = by + Math.sin(ang) * (len * 0.92 + 40 * sc);
      w.life--;
      return true;
    }

  w.x += Math.cos(ang0) * 30 * sc;
  w.y += Math.sin(ang0) * 30 * sc;
  w.life--;
  return false;

/* Build the mint's full layout once, deterministically, from its
   seeded RNG at a fixed field phase. Growth then replays this
   layout at drawing speed: the shown count is a function of time,
   never of chance. */
function buildLayout(m) {
  curMint = m;
  layoutS = S;
  mint = mintFeatures(HASHES[m]);
  palette = PALETTES[mint.palette];
  noiseA = makeNoise(mint.seed + 11, 7, 7);
  noiseB = makeNoise(mint.seed + 23, 13, 13);
  noiseC = makeNoise(mint.seed + 37, 23, 23);
  simRng = mulberry32(mint.seed);
  blocks = [];
  hash = {};
  walkers = [];
  var i, stall = 0, guard = 0;
  for (i = 0; i < WALKERS; i++) walkers.push(spawnWalker());
  while (blocks.length < mint.density && guard < mint.density * 60) {
    guard++;
    var before = blocks.length;
    for (i = 0; i < walkers.length; i++) stepWalker(walkers[i]);
    for (i = 0; i < walkers.length; i++) {
      if (walkers[i].life <= 0 || !inside(walkers[i].x, walkers[i].y)) {
        walkers[i] = spawnWalker();
      }
    }
    if (blocks.length === before) { stall++; if (stall >= 3) break; }
    else stall = 0;
  }
}
/* Capsule blocks are drawn as a filled rect plus two end circles:
   exact, no stray chords from arc() subpath connections. */
function drawBlock(b, alpha) {
  var hl = b.len / 2, hw = b.wid / 2;
  var ca = Math.cos(b.ang), sa = Math.sin(b.ang);
  ctx.fillStyle = rgba(b.col, alpha);
  ctx.beginPath();
  ctx.moveTo(b.x - hl * ca + hw * sa, b.y - hl * sa - hw * ca);
  ctx.lineTo(b.x + hl * ca + hw * sa, b.y + hl * sa - hw * ca);
  ctx.lineTo(b.x + hl * ca - hw * sa, b.y + hl * sa + hw * ca);
  ctx.lineTo(b.x - hl * ca - hw * sa, b.y - hl * sa + hw * ca);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(b.x + hl * ca + hw, b.y + hl * sa);
  ctx.arc(b.x + hl * ca, b.y + hl * sa, hw, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(b.x - hl * ca + hw, b.y - hl * sa);
  ctx.arc(b.x - hl * ca, b.y - hl * sa, hw, 0, TAU);
  ctx.fill();

/* Unresolved hash characters scramble at 8 Hz by construction:
   a deterministic mix of mint seed, position and tick. */
function scrambleChar(i, tick) {
  var m = (mint.seed ^ Math.imul(i + 1, 2654435761) ^ Math.imul(tick + 1, 40503)) >>> 0;

  return '0123456789abcdef'[(m >>> 0) % 16];

    out = h;

    var keep = Math.floor((1 - d) * 64);

  var titlePx = isPhone ? 15 : 19;

  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Hash Becomes Painting').width > S - 160) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';

  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 12').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 18;
  var plateX = sheetX + 12, plateY = sheetY + S - plateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Hash Becomes Painting', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 12', plateX + 14, plateY + 7 + titlePx + 3);

  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = sheetX + S - hintPlateW - 12;
  var hintPlateY = sheetY + S - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);

    + ' · DENSITY ' + mint.density;

    mintIndex: function () { return curMint; },
    revealedCount: function (t) {
