<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№133 · Forty-Two Lines</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#14141B; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:36px; text-align:center; color:rgba(214,222,235,0.45); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to scroll the code</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function sstep(x){ x=clamp(x,0,1); return x*x*(3-2*x); }
function hash2(a,b){ const s=Math.sin(a*127.1+b*311.7)*43758.5453; return s-Math.floor(s); }

// No.133 Forty-Two Lines: a fantasy IDE with a hard budget of 42 lines. The
// code types itself to line 42 while an isometric circles-only preview builds
// below; a ghost hand keeps reaching for line 43 and is gracefully corrected.
const ED='#14141B', CODE='#D6DEEB', KW='#C792EA', STR='#C3E88D', FN='#82AAFF',
      COM='#546E7A', ERR='#FF3B3B', LNUM='#3A3A4A', PV='#0B0B0D',
      CYAN='#5AF2FF', MAG='#FF3EB5';
const LINES=[
  '// forty-two lines exactly',
  '// genuary: "circles only", isometric',
  'uniform float uTime;',
  'uniform vec2 uRes;',
  'const float TAU = 6.28318;',
  'float hash(vec2 p) {',
  '  return fract(sin(dot(p,',
  '    vec2(127.1, 311.7))) * 43758.5);',
  '}',
  'vec2 iso(vec2 g, float z) {',
  '  return vec2(g.x - g.y,',
  '    (g.x + g.y) * 0.5 - z);',
  '}',
  'float wave(vec2 g, float t) {',
  '  float a = sin(g.x * 0.7 + t);',
  '  float b = cos(g.y * 0.6 - t);',
  '  return a + b;',
  '}',
  'void main() {',
  '  vec2 uv = gl_FragCoord.xy / uRes;',
  '  vec2 g = floor(uv * 14.0);',
  '  float z = wave(g, uTime);',
  '  vec2 c = iso(g, z * 2.0);',
  '  float pick = hash(g);',
  '  vec3 col = vec3(0.0);',
  '  if (pick > 0.5) {',
  '    col = vec3(0.35, 0.95, 1.0);',
  '  } else {',
  '    col = vec3(1.0, 0.24, 0.71);',
  '  }',
  '  float d = length(fract(c) - 0.5);',
  '  float ring = smoothstep(0.4, 0.38, d);',
  '  col *= ring * (0.6 + 0.4 * z);',
  '  gl_FragColor = vec4(col, 1.0);',
  '  // "circles only" - day 24',
  '  // no line forty-three',
  '  // the budget is the piece',
  '  // char stiles, live set',
  '  // typed by a ghost hand',
  '  // which keeps reaching',
  '  // for one more line',
  '} // end of budget'
];
const TOTAL=LINES.reduce((a,l)=>a+l.length,0);
const CUM=[]; { let a=0; for(const l of LINES){ CUM.push(a); a+=l.length; } }
const LOOP=30, STATUS_H=28;
const ATTEMPT_SRC='float pwn = glory(43);';
const ATTEMPT_FIX='// nice try.';
const SCRIPTED=[15.5, 18.5, 21.5];
let timeVal=16.9, lastMs=null, dragging=false, dragLastY=0, userOff=0, releaseS=-99;
let manualA=-1; // seconds since manual attempt start, -1 = none
let lastNowS=0;

function typedCount(pt){
  if(pt<15) return TOTAL*(pt/15);
  if(pt<24.4) return TOTAL;
  if(pt<27) return TOTAL*(1-(pt-24.4)/2.6);
  return 0;
}
function attemptClock(pt, nowS){
  // returns seconds since the current line-43 attempt began, or -1
  for(const t0 of SCRIPTED){ const a=pt-t0; if(a>=0 && a<2.9) return a; }
  if(manualA>=0){ const a=nowS-manualA; if(a<2.9) return a; manualA=-1; }
  return -1;
}
function attemptText(a){
  // returns {text, alpha, flash} for attempt clock a
  const flash=(a>=0.7 && a<1.5) ? Math.sin((a-0.7)/0.8*Math.PI) : 0;
  let text, alpha=1;
  if(a<0.7){ text=ATTEMPT_SRC.slice(0, Math.floor(a/0.7*ATTEMPT_SRC.length)); }
  else if(a<1.6){
    const N=Math.max(ATTEMPT_SRC.length, ATTEMPT_FIX.length);
    const k=Math.floor((a-0.7)/0.9*N);
    let s='';
    for(let i=0;i<N;i++){
      if(i<k) s+= (i<ATTEMPT_FIX.length ? ATTEMPT_FIX[i] : '');
      else s+= (i<ATTEMPT_SRC.length ? ATTEMPT_SRC[i] : '');
    }
    text=s.replace(/\s+$/,'');
  }
  else { text=ATTEMPT_FIX; if(a>=2.2) alpha=(2.9-a)/0.7; }
  return {text, alpha, flash};
}
const KEYWORDS=['uniform','const','float','vec2','vec3','void','if','else','return'];
function tokenize(line){
  const runs=[];
  const re=/(\/\/.*)|("(?:[^"\\]|\\.)*")|([A-Za-z_][A-Za-z0-9_]*)|(\d+\.?\d*)|(\s+)|(.)/g;
  let m;
  while((m=re.exec(line))!==null){
    if(m[1]!==undefined){
      // quoted spans inside comments still take the string color
      const parts=m[1].split(/("(?:[^"\\]|\\.)*")/);
      for(const p of parts){ if(p) runs.push({t:p, c:p.charAt(0)==='"'?STR:COM}); }
    }
    else if(m[2]!==undefined) runs.push({t:m[2], c:STR});
    else if(m[3]!==undefined){
      const isFn = line[re.lastIndex]==='(';
      runs.push({t:m[3], c:KEYWORDS.indexOf(m[3])>=0?KW:(isFn?FN:CODE)});
    }
    else if(m[4]!==undefined) runs.push({t:m[4], c:CODE});
    else runs.push({t:m[0], c:CODE});
  }
  return runs;
}
function drawLineRuns(line, reveal, x, y){
  let used=0;
  for(const run of tokenize(line)){
    if(used>=reveal) break;
    const t=run.t.slice(0, reveal-used);
    ctx.fillStyle=run.c; ctx.fillText(t, x, y);
    x+=ctx.measureText(t).width; used+=t.length;
  }
  return x;
}

function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  const nowS=nowMs/1000; lastNowS=nowS;
  let dt=0; if(lastMs!==null) dt=Math.min(0.05,(nowMs-lastMs)/1000); lastMs=nowMs;
  if(!dragging) timeVal+=dt;
  const pt=((timeVal%LOOP)+LOOP)%LOOP;
  if(!dragging && nowS-releaseS>4) userOff += (0-userOff)*Math.min(1, dt*2.2);
  const pvH=Math.round(h*0.22), edH=h-STATUS_H-pvH;
  ctx.fillStyle=ED; ctx.fillRect(0,0,w,edH+pvH);
  const MONO='Menlo, Consolas, "DejaVu Sans Mono", monospace';
  // font fit for the longest line
  let fs=13; ctx.font=fs+'px '+MONO;
  const maxLen=Math.max.apply(null, LINES.map(l=>l.length));
  const charW0=ctx.measureText('M').width||fs*0.6;
  const availW=w-58;
  if(charW0*maxLen>availW){ fs=Math.max(8.5, fs*availW/(charW0*maxLen)); ctx.font=fs+'px '+MONO; }
  const charW=ctx.measureText('M').width||fs*0.6;
  const lineH=Math.round(fs*1.45);
  const gutter=44, padX=gutter+10;
  const tc=typedCount(pt);
  const att=attemptClock(pt, nowS);
  const attState=att>=0 ? attemptText(att) : null;
  const totalLines=LINES.length+(attState?1:0);
  let curLine=LINES.length-1;
  for(let i=0;i<LINES.length;i++){ if(tc<CUM[i]+LINES[i].length){ curLine=i; break; } }
  if(attState) curLine=LINES.length;
  const visLines=Math.max(4, Math.floor(edH/lineH));
  const follow=clamp(curLine-visLines+3, 0, Math.max(0, totalLines-visLines));
  const scroll=clamp(follow+userOff, 0, Math.max(0, totalLines-visLines));
  const topPad=Math.round((edH-visLines*lineH)/2)+fs;
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  // line numbers (always the full budget)
  ctx.textAlign='right';
  for(let vi=0; vi<visLines; vi++){
    const li=Math.floor(scroll)+vi; if(li>=totalLines) break;
    const frac=scroll-Math.floor(scroll);
    const y=topPad+vi*lineH-Math.round(frac*lineH);
    if(y<fs-2 || y>edH+lineH) continue;
    ctx.fillStyle = li===LINES.length ? ERR : LNUM;
    ctx.font=fs+'px '+MONO;
    ctx.fillText(String(li+1), gutter, y);
  }
  ctx.textAlign='left';
  for(let vi=0; vi<visLines; vi++){
    const li=Math.floor(scroll)+vi; if(li>=totalLines) break;
    const frac=scroll-Math.floor(scroll);
    const y=topPad+vi*lineH-Math.round(frac*lineH);
    if(y<fs-2 || y>edH+lineH) continue;
    if(li<LINES.length){
      const reveal=clamp(Math.round(tc-CUM[li]), 0, LINES[li].length);
      if(reveal>0) drawLineRuns(LINES[li], reveal, padX, y);
      if(li===curLine && !attState && tc<TOTAL){
        const cx=padX+reveal*charW;
        if(((nowS*1.6)%1)<0.65){ ctx.fillStyle=CODE; ctx.fillRect(cx, y-fs, 2, fs+3); }
      }
    } else if(attState){
      ctx.save(); ctx.globalAlpha=attState.alpha;
      if(att<0.7) drawLineRuns(attState.text, attState.text.length, padX, y);
      else { ctx.fillStyle=COM; ctx.fillText(attState.text, padX, y); }
      ctx.restore();
      if(((nowS*1.6)%1)<0.65){ ctx.fillStyle=ERR; ctx.fillRect(padX+attState.text.length*charW, y-fs, 2, fs+3); }
    }
  }
  // preview strip: isometric circles only
  const pvY=edH;
  ctx.fillStyle=PV; ctx.fillRect(0, pvY, w, pvH);
  ctx.fillStyle='rgba(214,222,235,0.12)'; ctx.fillRect(0, pvY, w, 1);
  const build=clamp(tc/TOTAL, 0, 1);
  const N=13, a=Math.min(pvH/13.5, w/30);
  const cxp=w/2, cyp=pvY+pvH*0.52;
  const theta=pt*0.12 + scroll*0.05;
  const ct2=Math.cos(theta), st2=Math.sin(theta);
  const cells=[];
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    const gx=i-(N-1)/2, gy=j-(N-1)/2;
    const rx=gx*ct2-gy*st2, ry=gx*st2+gy*ct2;
    const z=Math.sin(rx*0.7+pt*0.9)+Math.cos(ry*0.6-pt*0.7);
    cells.push({i, j, rx, ry, z, s:i+j});
  }
  cells.sort((p,q)=>p.s-q.s);
  for(const c of cells){
    const thr=hash2(c.i*3+1, c.j*7+2);
    const pop=sstep((build*1.12-thr)/0.10);
    if(pop<=0) continue;
    const sx=cxp+(c.rx-c.ry)*a, sy=cyp+(c.rx+c.ry)*a*0.5 - c.z*a*0.85;
    const r=(2.2+(c.z+2)*1.55)*pop;
    ctx.globalAlpha=0.85;
    ctx.fillStyle = hash2(c.i, c.j)>0.5 ? CYAN : MAG;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  // status bar
  const sbY=h-STATUS_H;
  ctx.fillStyle = attState && attState.flash>0.03 ? ERR : ED;
  ctx.fillRect(0, sbY, w, STATUS_H);
  ctx.fillStyle='rgba(214,222,235,0.14)'; ctx.fillRect(0, sbY, w, 1);
  ctx.font='bold 11px '+MONO; ctx.textAlign='left';
  ctx.fillStyle = attState && attState.flash>0.03 ? '#14141B' : 'rgba(214,222,235,0.8)';
  ctx.fillText('42/42 LINES · BUDGET ENFORCED', 12, sbY+18);
  return {lineH};
}
let lastLayout={lineH:18};
function frame(nowMs){ lastLayout=drawFrame(nowMs); }
function ptr(e){ return [e.clientX, e.clientY]; }
canvas.addEventListener('pointerdown',e=>{
  const [x,y]=ptr(e); const [w,h]=viewportWH();
  if(y>h-STATUS_H){ // tap the status bar: one manual line-43 attempt
    if(attemptClock(((timeVal%LOOP)+LOOP)%LOOP, lastNowS)<0) manualA=lastNowS;
    frame(performance.now()); return;
  }
  dragging=true; dragLastY=y;
});
canvas.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const [,y]=ptr(e);
  userOff -= (y-dragLastY)/lastLayout.lineH;
  dragLastY=y; frame(performance.now());
});
function endP(){ if(dragging){ dragging=false; releaseS=lastNowS; } }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);
function loop(nowMs){ frame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
frame(0);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>frame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>frame(performance.now()));
</script>
</body>
</html>
