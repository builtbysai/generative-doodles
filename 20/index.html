<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№20 · Harmonograph</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f4efe3; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(74,62,42,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(244,239,227,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another harmonograph</div>
<script>
'use strict';
// No20 Harmonograph.
// The Victorian drawing machine, simulated honestly: two pendulums
// per axis, each a sine with its own frequency, phase and exponential
// decay, summed into one continuous pen line. Early in the trace the
// swings are wide and the figure is open; friction shrinks it beat
// by beat until the pen settles near the center. One ink (warm black)
// at low alpha on cream, so crossings darken where the pen returned.
// Frequencies are drawn near simple ratios but never exactly on
// them, and a seed is gated on its final radius: the trace must
// settle, not wander off or die instantly.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '20', 10) || 20;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f4efe3';

function pointAt(p, t) {
  const x = Math.sin(p.f1 * t + p.p1) * Math.exp(-p.d1 * t) * 0.62
          + Math.sin(p.f2 * t + p.p2) * Math.exp(-p.d2 * t) * 0.38;
  const y = Math.sin(p.f3 * t + p.p3) * Math.exp(-p.d1 * t) * 0.62
          + Math.sin(p.f4 * t + p.p4) * Math.exp(-p.d2 * t) * 0.38;
  return [x, y];
}

function compose(s) {
  const rnd = mulberry32(s);
  const base = 1.0;
  const detune = () => (rnd() - 0.5) * 0.012;
  const p = {
    f1: base * (2 + detune()), f2: base * (3 + detune()),
    f3: base * (2 + detune()), f4: base * (3.005 + detune()),
    p1: rnd() * Math.PI * 2, p2: rnd() * Math.PI * 2,
    p3: Math.PI / 2 + (rnd() - 0.5) * 0.6, p4: rnd() * Math.PI * 2,
    d1: 0.0035 + rnd() * 0.002, d2: 0.005 + rnd() * 0.003
  };
  const endR = Math.hypot(...pointAt(p, 240));
  const midR = Math.hypot(...pointAt(p, 60));
  p.ok = endR < 0.22 && midR > 0.25;
  return p;
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best) best = p;
    if (p.ok) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  // Centered composition; page ground is the piece's ground.
  const S = Math.min(w, h);
  const cx = w / 2, cy = h / 2;
  const R = S * 0.46;

  const STEPS = 2600, T = 240;
  ctx.strokeStyle = 'rgba(43,40,34,0.5)';
  ctx.lineWidth = Math.max(0.7, S / 1100);
  ctx.beginPath();
  for (let i = 0; i <= STEPS; i++) {
    const [x, y] = pointAt(p, (i / STEPS) * T);
    if (i === 0) ctx.moveTo(cx + x * R, cy + y * R);
    else ctx.lineTo(cx + x * R, cy + y * R);
  }
  ctx.stroke();
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
