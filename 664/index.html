<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Profecía</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #070912; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict)
  var GROUND = '#070912';
  var SILVER = '#B9BEC8';
  var WHITE = '#F0F2F5';
  var INDIGO = '#2B3A7A';
  var PALE = '#E8E2D0';
  var CINNABAR = '#C0392B';
  var GOLD = '#D9A441';

  var LOOP_S = 40;          // seconds per loop: 14 approach, merge, hold, split, 14 separation, empty
  var FORCE_T = -1;         // QA hook: -1 = live clock, else fixed loop time in seconds

  // QA seed hook: ?seed=tNN pins the loop time (used by the headless renderer).
  try {
    if (typeof location !== 'undefined' && location.search) {
      var qm = /[?&]seed=t([0-9]+(?:\.[0-9]+)?)/.exec(location.search);
      if (qm) FORCE_T = parseFloat(qm[1]);
    }
  } catch (e) { /* live mode */ }

  // Seeded RNG (mulberry32), used for condor blotches and gold dust data.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function lerp(a, b, u) { return a + (b - a) * u; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function mod40(x) { return ((x % 40) + 40) % 40; }

  // ------------------------------------------------------------------
  // Bird geometry. Local units, bird faces +x, y is the right wing side.
  // Both outlines start at the beak and run down the right side first,
  // so arc-length resamples correspond vertex for vertex.
  // ------------------------------------------------------------------

  // The eagle: a sharp angular polygon, 14 vertices, geometric dihedral.
  var EAGLE = [
    [0.58, 0.00], [0.40, 0.06], [0.20, 0.09], [0.02, 0.34], [-0.30, 0.85],
    [-0.18, 0.38], [-0.40, 0.20], [-0.50, 0.00], [-0.40, -0.20], [-0.18, -0.38],
    [-0.30, -0.85], [0.02, -0.34], [0.20, -0.09], [0.40, -0.06]
  ];

  // The condor: a broad stain-born outline, right half defined, then
  // mirrored. The zigzag on the trailing edge is the fingered primaries.
  var CONDOR = (function () {
    var half = [
      [0.62, 0.00], [0.47, 0.09], [0.28, 0.15], [0.08, 0.30], [-0.06, 0.62],
      [-0.16, 0.97], [-0.27, 1.05], [-0.35, 0.95], [-0.28, 0.66], [-0.36, 0.52],
      [-0.26, 0.40], [-0.33, 0.28], [-0.40, 0.16], [-0.52, 0.13], [-0.58, 0.05],
      [-0.58, 0.00]
    ];
    var pts = half.slice();
    for (var i = half.length - 2; i >= 1; i--) pts.push([half[i][0], -half[i][1]]);
    return pts;
  })();

  // Condor blotches: seeded ellipses inside the outline (point-in-polygon
  // tested), the stain mass the bird is born from.
  function pointInPoly(pts, x, y) {
    var inside = false;
    for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      var xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  var BLOTCHES = (function () {
    var rng = mulberry32(664011);
    var out = [];
    var guard = 0;
    while (out.length < 30 && guard < 600) {
      guard++;
      var x = -0.58 + rng() * 1.22;
      var y = (rng() * 2 - 1) * 1.04;
      if (!pointInPoly(CONDOR, x, y)) continue;
      out.push({ x: x, y: y, rx: 0.10 + rng() * 0.20, ry: 0.07 + rng() * 0.13,
                 rot: rng() * Math.PI, a: 0.30 + rng() * 0.45 });
    }
    return out;
  })();

  // Condor feather barbs: lines fanning back from each wing spine.
  var BARBS = (function () {
    var rng = mulberry32(664023);
    var out = [];
    for (var side = 0; side < 2; side++) {
      var sgn = side === 0 ? 1 : -1;
      for (var i = 0; i < 10; i++) {
        var f = 0.16 + 0.80 * (i / 9);
        var bx = lerp(0.14, -0.27, f);
        var by = sgn * lerp(0.13, 0.98, f);
        var len = 0.26 + 0.18 * Math.sin(f * Math.PI) + rng() * 0.05;
        out.push({ x: bx, y: by, dx: -len * 0.92, dy: sgn * len * 0.38, a: 0.40 + rng() * 0.30 });
      }
    }
    return out;
  })();

  // ------------------------------------------------------------------
  // The merged form. Both outlines are resampled to 48 points by arc
  // length (beak-aligned, same winding), normalized to unit RMS radius,
  // and averaged vertex by vertex: the middle state is literally half
  // eagle, half condor at every vertex. It is then turned frontal (beak
  // up), its wings lifted into a V by a shear, and given a round body
  // mass and a small crest, so the result is its own creature: neither
  // the angular silver bird nor the indigo mass.
  // ------------------------------------------------------------------
  function resample(pts, n) {
    var m = pts.length, i, j;
    var cum = [0];
    for (i = 0; i < m; i++) {
      var a = pts[i], b = pts[(i + 1) % m];
      cum.push(cum[i] + Math.hypot(b[0] - a[0], b[1] - a[1]));
    }
    var total = cum[m], step = total / n, out = [];
    var edge = 0, edgeStart = 0;
    for (j = 0; j < n; j++) {
      var d = j * step;
      while (edge < m - 1 && cum[edge + 1] < d) edge++;
      var segLen = cum[edge + 1] - cum[edge];
      var u = segLen > 0 ? (d - cum[edge]) / segLen : 0;
      var p0 = pts[edge], p1 = pts[(edge + 1) % m];
      out.push([lerp(p0[0], p1[0], u), lerp(p0[1], p1[1], u)]);
      edgeStart = edge;
    }
    return out;
  }
  function normalize(pts) {
    var i, cx = 0, cy = 0, rms = 0;
    for (i = 0; i < pts.length; i++) { cx += pts[i][0]; cy += pts[i][1]; }
    cx /= pts.length; cy /= pts.length;
    var out = pts.map(function (p) { return [p[0] - cx, p[1] - cy]; });
    for (i = 0; i < out.length; i++) rms += out[i][0] * out[i][0] + out[i][1] * out[i][1];
    rms = Math.sqrt(rms / out.length) || 1;
    return out.map(function (p) { return [p[0] / rms, p[1] / rms]; });
  }
  var MERGED = (function () {
    var e = normalize(resample(EAGLE, 48));
    var c = normalize(resample(CONDOR, 48));
    var pts = [];
    var i, minX = 1e9, maxX = -1e9, minY = 1e9;
    for (i = 0; i < 48; i++) {
      var mx = (e[i][0] + c[i][0]) / 2;
      var my = (e[i][1] + c[i][1]) / 2;
      var rx = my;              // turn frontal: beak (local +x) points up
      var ry = -mx - 0.60 * Math.abs(my); // wings lift into a V
      if (ry > 0.25) ry = 0.25 + (ry - 0.25) * 0.62; // shorten the tail point
      pts.push([rx, ry]);
      if (rx < minX) minX = rx;
      if (rx > maxX) maxX = rx;
      if (ry < minY) minY = ry;
    }
    return { pts: pts, span: maxX - minX, topY: minY };
  })();

  // Gold dust: seeded specks laid along both spiral paths.
  var DUST = (function () {
    var rng = mulberry32(664037);
    var out = [];
    for (var bird = 0; bird < 2; bird++) {
      for (var k = 0; k < 110; k++) {
        out.push({
          bird: bird,
          sigma: 0.02 + 0.98 * (k + 0.5) / 110,
          jn: (rng() * 2 - 1) * 0.014,
          r: 0.9 + rng() * 1.5,
          a: 0.45 + rng() * 0.55
        });
      }
    }
    return out;
  })();

  // ------------------------------------------------------------------
  // Canvas + layout
  // ------------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;
  var CX = 0, CY = 0, minWH = 0, Rmax = 0, AXf = 1, AYf = 1;
  var sOut = 0, sIn = 0, scaleMerge = 1;
  var lastElapsed = 0;

  function layout() {
    CX = W / 2; CY = H / 2;
    minWH = Math.min(W, H);
    var halfDiag = 0.5 * Math.hypot(W, H);
    Rmax = 0.66 * halfDiag;
    var margin = 0.09 * minWH + 10;
    AXf = Math.min(1, ((W / 2 - margin) / 0.7072) / Rmax);
    AYf = Math.min(1, ((H / 2 - margin) / 0.7072) / Rmax);
    sOut = 0.052 * minWH;
    sIn = 0.135 * minWH;
    var targetSpan = isPhone ? W * 0.88 : Math.min(W * 0.38, H * 0.62);
    scaleMerge = targetSpan / MERGED.span;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (window.screen) {
      isPhone = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      isPhone = H > W * 1.15;
    }
    layout();
    draw(lastElapsed);
  }

  // ------------------------------------------------------------------
  // Spiral paths. Bird 0 (eagle) enters top-left, bird 1 (condor)
  // bottom-right; the condor path is the eagle path reflected through
  // the center. Radius shrinks logarithmically to 14 percent.
  // ------------------------------------------------------------------
  function spiralPos(sigma, bird) {
    var ang = (-135 + 180 * bird + 285 * sigma) * Math.PI / 180;
    var r = Rmax * Math.pow(0.14, sigma);
    return [CX + r * Math.cos(ang) * AXf, CY + r * Math.sin(ang) * AYf];
  }
  function flightScale(sigma) { return lerp(sOut, sIn, Math.pow(sigma, 0.85)); }

  // Position of a bird at loop time t (heading derived from this).
  function posOnly(t, bird) {
    t = mod40(t);
    if (t < 14) return spiralPos(t / 14, bird);
    if (t < 16) {
      var m = smooth((t - 14) / 2), p = spiralPos(1, bird);
      return [lerp(p[0], CX, m), lerp(p[1], CY, m)];
    }
    if (t < 22) return [CX, CY];
    if (t < 24) {
      var m2 = smooth((t - 22) / 2), p2 = spiralPos(1, bird);
      return [lerp(CX, p2[0], m2), lerp(CY, p2[1], m2)];
    }
    if (t < 38) return spiralPos(1 - (t - 24) / 14, bird);
    return spiralPos(0, bird);
  }

  function birdScaleAlpha(t, bird) {
    if (t < 14) return [flightScale(t / 14), 1];
    if (t < 16) {
      var m = smooth((t - 14) / 2);
      return [flightScale(1) * (1 + 0.3 * m), 1 - m];
    }
    if (t < 22) return [flightScale(1), 0];
    if (t < 24) {
      var m2 = smooth((t - 22) / 2);
      return [flightScale(1) * (1.3 - 0.3 * m2), m2];
    }
    if (t < 38) return [flightScale(1 - (t - 24) / 14), 1];
    if (t < 38.7) return [flightScale(0), 1 - smooth((t - 38) / 0.7)];
    if (t < 39.3) return [flightScale(0), 0];
    return [flightScale(0), smooth((t - 39.3) / 0.7)];
  }

  function mergedState(t) {
    var pulse = 1 + 0.07 * Math.exp(-Math.pow((t - 19) / 1.7, 2));
    if (t < 14) return null;
    if (t < 16) { var m = smooth((t - 14) / 2); return { a: m, s: scaleMerge * (0.55 + 0.45 * m) * pulse }; }
    if (t < 22) return { a: 1, s: scaleMerge * pulse };
    if (t < 24) { var m2 = 1 - smooth((t - 22) / 2); return { a: m2, s: scaleMerge * (0.55 + 0.45 * m2) * pulse }; }
    return null;
  }

  // ------------------------------------------------------------------
  // Drawing helpers
  // ------------------------------------------------------------------
  function pathPoly(pts) {
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]); else ctx.lineTo(pts[i][0], pts[i][1]);
    }
    ctx.closePath();
  }
  function pathSmooth(pts) {
    var n = pts.length, i, a, b;
    ctx.beginPath();
    for (i = 0; i < n; i++) {
      a = pts[i]; b = pts[(i + 1) % n];
      var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      if (i === 0) ctx.moveTo(mx, my);
      var nx = pts[(i + 2) % n];
      ctx.quadraticCurveTo(b[0], b[1], (b[0] + nx[0]) / 2, (b[1] + nx[1]) / 2);
    }
    ctx.closePath();
  }

  function drawEagle(state) {
    ctx.save();
    ctx.translate(state.x, state.y);
    ctx.rotate(state.heading);
    ctx.scale(state.s, state.s);
    ctx.globalAlpha = state.alpha;
    pathPoly(EAGLE);
    ctx.fillStyle = SILVER;
    ctx.fill();
    ctx.strokeStyle = WHITE;
    ctx.lineWidth = 1.8 / state.s;
    ctx.lineJoin = 'miter';
    ctx.stroke();
    ctx.restore();
  }

  function drawCondor(state) {
    ctx.save();
    ctx.translate(state.x, state.y);
    ctx.rotate(state.heading);
    ctx.scale(state.s, state.s);
    ctx.globalAlpha = state.alpha;
    // Stain mass: base wash, then blotches and feather barbs, all
    // clipped to the outline so nothing fringes past the silhouette.
    pathSmooth(CONDOR);
    ctx.fillStyle = INDIGO;
    ctx.globalAlpha = state.alpha * 0.82;
    ctx.fill();
    ctx.save();
    pathSmooth(CONDOR);
    ctx.clip();
    ctx.fillStyle = INDIGO;
    for (var i = 0; i < BLOTCHES.length; i++) {
      var b = BLOTCHES[i];
      ctx.globalAlpha = state.alpha * b.a;
      ctx.beginPath();
      ctx.ellipse(b.x, b.y, b.rx, b.ry, b.rot, 0, Math.PI * 2);
      ctx.fill();
    }
    // Feather barbs fanning from the wing spines.
    ctx.strokeStyle = PALE;
    ctx.lineCap = 'round';
    ctx.lineWidth = 0.022;
    for (var j = 0; j < BARBS.length; j++) {
      var f = BARBS[j];
      ctx.globalAlpha = state.alpha * f.a;
      ctx.beginPath();
      ctx.moveTo(f.x, f.y);
      ctx.lineTo(f.x + f.dx, f.y + f.dy);
      ctx.stroke();
    }
    ctx.restore();
    ctx.restore();
  }

  function drawMerged(ms) {
    ctx.save();
    ctx.translate(CX, CY);
    ctx.scale(ms.s, ms.s);
    ctx.globalAlpha = ms.a;
    ctx.fillStyle = CINNABAR;
    pathSmooth(MERGED.pts);
    ctx.fill();
    // Round body mass under the wing line.
    ctx.beginPath();
    ctx.ellipse(0, 0.16, 0.40, 0.46, 0, 0, Math.PI * 2);
    ctx.fill();
    // Round head at the top, with a small crest above it.
    var ty = MERGED.topY;
    ctx.beginPath();
    ctx.arc(0, ty + 0.16, 0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, ty - 0.15);
    ctx.lineTo(-0.14, ty + 0.12);
    ctx.lineTo(0.14, ty + 0.12);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawDust(t) {
    ctx.fillStyle = GOLD;
    for (var i = 0; i < DUST.length; i++) {
      var d = DUST[i];
      var s = d.sigma;
      var peak = 0.8 * d.a;
      var a = 0;
      // Comet trails: a speck shows only briefly after ITS bird has
      // passed it on the current flight, fading over ~2-3 s. Nothing
      // is ever pre-drawn along the path ahead of a bird.
      var ageA = t - 14 * s;              // approach pass deposits at 14*s
      if (ageA >= 0 && ageA < 6) {
        a = Math.max(a, peak * smooth(ageA / 0.35) * Math.exp(-ageA / 1.15));
      }
      var ageS = t - (38 - 14 * s);       // separation pass deposits at 38-14*s
      if (ageS >= 0 && ageS < 6) {
        a = Math.max(a, peak * smooth(ageS / 0.35) * Math.exp(-ageS / 1.15));
      }
      // Empty sky (38-40): both full trails linger faintly as the
      // piece's memory, fading in gently and out again at the wrap.
      if (t >= 38) {
        var env = smooth((t - 38) / 0.7) * (1 - smooth((t - 39.2) / 0.8));
        var ageL = t - (38 - 14 * s);
        a = Math.max(a, peak * 0.30 * env * Math.exp(-ageL / 7));
      }
      // Corner stub: the first few specks at the spiral mouth, present
      // as the bird condenses at its corner (end of loop, w rising to
      // 1 at t = 40) and as it sets out (start of loop, w = 1 at
      // t = 0), so frame one carries a stub and the wrap is seamless.
      if (s < 0.05) {
        var w = 0;
        if (t < 1.2) w = 1 - smooth(t / 1.2);
        if (t > 38.8) w = Math.max(w, smooth((t - 38.8) / 1.2));
        a = Math.max(a, peak * 0.55 * w * (1 - s / 0.05));
      }
      if (a < 0.012) continue;
      var base = spiralPos(d.sigma, d.bird);
      var ahead = spiralPos(Math.min(1, d.sigma + 0.01), d.bird);
      var tx = ahead[0] - base[0], ty = ahead[1] - base[1];
      var tl = Math.hypot(tx, ty) || 1;
      var px = base[0] + (-ty / tl) * d.jn * minWH;
      var py = base[1] + (tx / tl) * d.jn * minWH;
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(px, py, Math.max(0.7, d.r * minWH / 900), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawBird(t, bird) {
    var sa = birdScaleAlpha(t, bird);
    if (sa[1] <= 0.003) return;
    var p = posOnly(t, bird);
    var pa = posOnly(t - 0.05, bird), pb = posOnly(t + 0.05, bird);
    var heading = Math.atan2(pb[1] - pa[1], pb[0] - pa[0]);
    var state = { x: p[0], y: p[1], heading: heading, s: sa[0], alpha: sa[1] };
    if (bird === 0) drawEagle(state); else drawCondor(state);
  }

  function draw(elapsed) {
    lastElapsed = elapsed;
    var t = mod40(FORCE_T >= 0 ? FORCE_T : elapsed);
    ctx.fillStyle = GROUND;
    ctx.globalAlpha = 1;
    ctx.fillRect(0, 0, W, H);
    drawDust(t);
    drawBird(t, 1);
    drawBird(t, 0);
    var ms = mergedState(t);
    if (ms && ms.a > 0.003) drawMerged(ms);
  }

  // ------------------------------------------------------------------
  resize();
  draw(0);

  if (typeof window.requestAnimationFrame === 'function') {
    var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var raf = function () {
      var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : t0;
      draw((now - t0) / 1000);
      window.requestAnimationFrame(raf);
    };
    window.requestAnimationFrame(raf);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
})();
</script>
</body>
</html>
