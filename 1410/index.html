<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Degrees of Deaf Rage</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e2d4; overflow: hidden; height: 100%; }
  canvas { display: block; background: #e8e2d4; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1410000);

  var PAPER = '#e8e2d4';
  var CHARCOAL = '#1a1a18';
  var CHARGRAY = '#4a4a44';
  var RED = '#b01e24';
  var STEEL = '#8a8f94';
  var INK = '#26241f';

  // Labels: the prompt's own two dry incident phrasings verbatim, plus four
  // more short labels in the same dry register. Fixed and readable.
  var LABELS = [
    'museums with zero deaf programming',
    'a meeting held without an interpreter',
    'a caption that says only \u201C[music]\u201D',
    'curators who think it\u2019s fair to split my salary fee with interpreters',
    'a phone call treated as the only way to reach me',
    'a lecture with no visual access'
  ];
  // Panel 3 (curators/salary, row 2 col 1 on desktop) is the angriest:
  // off-center, larger, dirtiest.
  var ANCHOR = 3;

  // Per-panel seeded parameters.
  var panels = [];
  var i, j;
  for (i = 0; i < 6; i++) {
    var base = 28 + rng() * 110;            // 28..138 degrees
    if (i === ANCHOR) base = 138;           // angriest panel, widest angle
    var stipple = [];
    var srng = mulberry32(1410000 + i * 7919);
    for (j = 0; j < 420; j++) {
      stipple.push([srng(), srng(), srng()]);
    }
    panels.push({
      label: LABELS[i],
      base: base,
      amp: 6 + rng() * 12,                  // jaw-breathing amplitude
      period: 9 + rng() * 11,               // own breathing rate
      phi: rng() * Math.PI * 2,
      t0: 0,
      stipple: stipple,
      dragAngle: null,                      // live drag angle, or null
      dragMoved: false
    });
  }

  function round4(x) {
    return Math.round(x * 10000) / 10000;
  }
  function alphaStr(a) {
    return round4(Math.max(0, Math.min(1, a))).toFixed(4);
  }

  var W = 0, H = 0, phone = false;
  function isPhone() {
    var minDim = 100000;
    try {
      if (typeof window.screen !== 'undefined') {
        minDim = Math.min(window.screen.width, window.screen.height);
      }
    } catch (e) {}
    if (minDim < 700) return true;
    if (W > 0 && H > 0 && H > W * 1.15) return true;
    return false;
  }
  function sizeCanvas() {
    var vw = 0, vh = 0;
    try {
      if (typeof visualViewport !== 'undefined' && visualViewport) {
        vw = visualViewport.width; vh = visualViewport.height;
      }
    } catch (e) {}
    if (!vw) { vw = window.innerWidth; vh = window.innerHeight; }
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    phone = isPhone();
  }
  sizeCanvas();
  if (typeof visualViewport !== 'undefined' && visualViewport) {
    visualViewport.addEventListener('resize', function () { sizeCanvas(); });
  }
  window.addEventListener('resize', function () { sizeCanvas(); });

  // Panel rectangles: loose 3x2 grid on desktop, 2x3 on phones.
  // Anchor panel (row 2, col 1 on desktop) is wider than its neighbours.
  function layout() {
    var rects = [];
    if (!phone) {
      var cols = [[0.06, 0.36], [0.38, 0.66], [0.68, 0.94]];
      var rows = [[0.06, 0.46], [0.50, 0.93]];
      var k;
      for (k = 0; k < 6; k++) {
        var r = Math.floor(k / 3), c = k % 3;
        var x0 = cols[c][0], x1 = cols[c][1];
        if (k === ANCHOR) { x0 = 0.06; x1 = 0.40; }
        if (k === 4) { x0 = 0.42; x1 = 0.66; }
        rects.push({
          x: x0 * W, y: rows[r][0] * H,
          w: (x1 - x0) * W, h: (rows[r][1] - rows[r][0]) * H,
          row: r
        });
      }
    } else {
      var pcols = [[0.06, 0.48], [0.52, 0.94]];
      var prows = [[0.05, 0.33], [0.36, 0.64], [0.67, 0.95]];
      for (var k2 = 0; k2 < 6; k2++) {
        var r2 = Math.floor(k2 / 2), c2 = k2 % 2;
        rects.push({
          x: pcols[c2][0] * W, y: prows[r2][0] * H,
          w: (pcols[c2][1] - pcols[c2][0]) * W,
          h: (prows[r2][1] - prows[r2][0]) * H,
          row: r2
        });
      }
    }
    return rects;
  }

  function wrapText(text, maxW, fs) {
    ctx.font = fs + 'px sans-serif';
    var words = text.split(' ');
    var lines = [], line = '';
    var wi;
    for (wi = 0; wi < words.length; wi++) {
      var test = line ? line + ' ' + words[wi] : words[wi];
      if (ctx.measureText(test).width > maxW && line) {
        lines.push(line); line = words[wi];
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  function panelAngle(p, t) {
    if (p.dragAngle !== null) return p.dragAngle;
    var v = p.base + p.amp * Math.sin((2 * Math.PI * (t - p.t0)) / p.period + p.phi);
    if (v < 12) v = 12;
    if (v > 165) v = 165;
    return v;
  }

  function draw(t) {
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    var rects = layout();
    var pi;
    for (pi = 0; pi < 6; pi++) {
      var p = panels[pi];
      var R = rects[pi];
      var pad = Math.min(R.w, R.h) * 0.06;
      var fs = Math.max(10, Math.min(16, R.w * 0.048));
      var lh = fs * 1.35;

      // Faint panel frame.
      ctx.strokeStyle = 'rgba(138,143,148,' + alphaStr(0.35) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.rect(R.x, R.y, R.w, R.h);
      ctx.stroke();

      // Label: fixed, readable, at the panel top.
      var lines = wrapText(p.label, R.w - pad * 2, fs);
      ctx.fillStyle = INK;
      ctx.font = fs + 'px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      var li;
      for (li = 0; li < lines.length; li++) {
        ctx.fillText(lines[li], R.x + pad, R.y + pad + li * lh);
      }

      // Diagram geometry.
      var vx = R.x + R.w * 0.5;
      var vy = R.y + R.h * 0.72;
      var armLen = Math.min(R.w * 0.36, R.h * 0.34);
      var ang = panelAngle(p, t);
      var rad = ang * Math.PI / 180;
      var mx = vx + armLen * Math.cos(rad);
      var my = vy - armLen * Math.sin(rad);
      var fx = vx + armLen;

      // Charcoal stipple: density tied to angle, wider angle = heavier.
      var frac = (ang - 12) / (165 - 12);
      if (pi === ANCHOR) frac = Math.min(1, frac + 0.15);
      var count = Math.round(30 + 380 * frac);
      var si;
      for (si = 0; si < count; si++) {
        var s = p.stipple[si];
        var sx = R.x + pad + s[0] * (R.w - pad * 2);
        var sy = R.y + pad + lines.length * lh + 6 + s[1] * (R.h - pad - lines.length * lh - 12);
        var a = 0.10 + s[2] * 0.25;
        ctx.fillStyle = (si % 3 === 0 ? CHARGRAY : CHARCOAL);
        ctx.globalAlpha = round4(a);
        ctx.fillRect(sx, sy, 2, 2);
      }
      ctx.globalAlpha = 1;

      // Baseline shared by the row's panels.
      ctx.strokeStyle = STEEL;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(R.x + pad, vy + armLen * 0.28);
      ctx.lineTo(R.x + R.w - pad, vy + armLen * 0.28);
      ctx.stroke();

      // Protractor ticks every 15 degrees (steel).
      var ti, tickAng;
      ctx.strokeStyle = STEEL;
      ctx.lineWidth = 1;
      for (ti = 0; ti <= 11; ti++) {
        tickAng = ti * 15 * Math.PI / 180;
        var r1 = armLen + 4, r2 = armLen + 10;
        ctx.beginPath();
        ctx.moveTo(vx + r1 * Math.cos(tickAng), vy - r1 * Math.sin(tickAng));
        ctx.lineTo(vx + r2 * Math.cos(tickAng), vy - r2 * Math.sin(tickAng));
        ctx.stroke();
      }

      // Fixed arm (charcoal) and moving arm (charcoal).
      ctx.strokeStyle = CHARCOAL;
      ctx.lineWidth = Math.max(2, R.w * 0.004);
      ctx.beginPath();
      ctx.moveTo(vx, vy);
      ctx.lineTo(fx, vy);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(vx, vy);
      ctx.lineTo(mx, my);
      ctx.stroke();

      // Angle arc in red.
      ctx.strokeStyle = RED;
      ctx.lineWidth = Math.max(2, R.w * 0.005);
      ctx.beginPath();
      ctx.moveTo(vx, vy);
      ctx.arc(vx, vy, armLen * 0.55, -rad, 0, false);
      ctx.closePath();
      ctx.stroke();

      // Vertex dot.
      ctx.fillStyle = CHARCOAL;
      ctx.beginPath();
      ctx.arc(vx, vy, Math.max(3, R.w * 0.006), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Drag: pointerdown near a moving-arm tip picks that panel; dragging the
  // arm opens or closes the angle, and the charcoal follows. On release the
  // breathing resumes around the dragged angle (phase reset, no jump).
  var dragPanel = null;
  var dragStartX = 0, dragStartY = 0;
  var dragTime = 0;

  function panelHit(x, y, t) {
    var rects = layout();
    var best = null, bestD = 1e9, pi;
    for (pi = 0; pi < 6; pi++) {
      var R = rects[pi];
      var vx = R.x + R.w * 0.5;
      var vy = R.y + R.h * 0.72;
      var armLen = Math.min(R.w * 0.36, R.h * 0.34);
      var ang = panelAngle(panels[pi], t) * Math.PI / 180;
      var mx = vx + armLen * Math.cos(ang);
      var my = vy - armLen * Math.sin(ang);
      var d = Math.hypot(x - mx, y - my);
      if (d < bestD) { bestD = d; best = pi; }
    }
    if (bestD < 48) return best;
    return null;
  }

  function pointerPos(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function onDown(e) {
    var pos = pointerPos(e);
    var hit = panelHit(pos.x, pos.y, lastT);
    if (hit !== null) {
      dragPanel = hit;
      dragStartX = pos.x; dragStartY = pos.y;
      panels[hit].dragMoved = false;
      panels[hit].dragAngle = panelAngle(panels[hit], lastT);
    }
  }
  function onMove(e) {
    if (dragPanel === null) return;
    var pos = pointerPos(e);
    if (Math.hypot(pos.x - dragStartX, pos.y - dragStartY) > 4) {
      panels[dragPanel].dragMoved = true;
    }
    var rects = layout();
    var R = rects[dragPanel];
    var vx = R.x + R.w * 0.5;
    var vy = R.y + R.h * 0.72;
    var a = Math.atan2(vy - pos.y, pos.x - vx) * 180 / Math.PI;
    if (a < 12) a = 12;
    if (a > 165) a = 165;
    panels[dragPanel].dragAngle = a;
  }
  function onUp(e) {
    if (dragPanel === null) return;
    var p = panels[dragPanel];
    if (p.dragAngle !== null) {
      // Resume breathing around the dragged angle with no jump.
      p.base = p.dragAngle;
      p.t0 = lastT;
      p.phi = 0;
    }
    p.dragAngle = null;
    dragPanel = null;
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  // Deterministic first frame: draw(0) synchronously at load; the clock
  // starts only with the rAF loop.
  var lastT = 0;
  var clockStart = null;
  draw(0);
  function loop(ts) {
    if (clockStart === null) clockStart = ts;
    lastT = (ts - clockStart) / 1000;
    draw(lastT);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
