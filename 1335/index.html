<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Red Stage</title>
<style>
  html, body { margin: 0; padding: 0; background: #2E2A3A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), the only source of variation. No unseeded randomness.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Sizing: Visual Viewport API first, window size as fallback.
  var W = 0, H = 0, S = 1, phone = false;
  function size() {
    var vw = window.innerWidth, vh = window.innerHeight;
    try {
      if (window.visualViewport) { vw = window.visualViewport.width; vh = window.visualViewport.height; }
    } catch (e) {}
    W = vw; H = vh;
    canvas.width = Math.round(vw); canvas.height = Math.round(vh);
    canvas.style.width = vw + 'px'; canvas.style.height = vh + 'px';
    var sw = 9999, sh = 9999;
    try {
      if (window.screen) { sw = window.screen.width; sh = window.screen.height; }
    } catch (e) {}
    var minDim = Math.min(sw, sh);
    phone = (minDim < 700) || (vh > vw * 1.15);
    S = Math.min(W, H);
  }
  size();
  try {
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', size);
      window.visualViewport.addEventListener('scroll', size);
    }
  } catch (e) {}
  try { window.addEventListener('resize', size); } catch (e) {}

  var pieceNow = 0;

  // ---- Seeded layout -------------------------------------------------------
  // Crowd: faint ghost figures at the plaza periphery, never the subject.
  var crowd = [];
  (function () {
    var r = mulberry32(1335001);
    for (var i = 0; i < 30; i++) {
      var side = r();
      var fx;
      if (side < 0.42) fx = 0.02 + r() * 0.16;        // left band
      else if (side < 0.84) fx = 0.82 + r() * 0.16;   // right band
      else fx = r() < 0.5 ? 0.03 + r() * 0.12 : 0.85 + r() * 0.12; // bottom corners
      crowd.push({
        fx: fx,
        fy: 0.62 + r() * 0.32,
        sc: 0.55 + r() * 0.65,
        ph: r() * Math.PI * 2,
        sp: 0.25 + r() * 0.4,
        al: 0.28 + r() * 0.28
      });
    }
  })();

  // Plaza joint lines, seeded.
  var joints = [];
  (function () {
    var r = mulberry32(1335002);
    for (var i = 0; i < 14; i++) joints.push({ x: r(), w: 0.5 + r() * 1.5 });
  })();

  // ---- Interaction state: closed-form functions of recorded events and t ----
  // Activators: {t0, gesture, slot, seed, dissolving, dissolveStart}.
  // Gesture: 0 raises a book, 1 plays a silent instrument, 2 dances two steps, 3 reads.
  var activators = [];
  var nextGesture = 0;   // seeded gesture order advances per touch, never random
  var dragSegs = [];     // {t, dx, dy} committed drag deltas
  var dragging = false, lastX = 0, lastY = 0;
  var liveDX = 0, liveDY = 0;
  var downX = 0, downY = 0, downT = 0;
  var stageHit = { x: 0, y: 0, w: 0, h: 0 };

  function panOffset(t) {
    var v = liveDX;
    for (var i = 0; i < dragSegs.length; i++) {
      var age = t - dragSegs[i].t;
      if (age >= 0) v += dragSegs[i].dx * Math.exp(-age / 2.5);
    }
    return Math.max(-40, Math.min(40, v));
  }
  function panOffsetY(t) {
    var v = liveDY;
    for (var i = 0; i < dragSegs.length; i++) {
      var age = t - dragSegs[i].t;
      if (age >= 0) v += dragSegs[i].dy * Math.exp(-age / 2.5);
    }
    return Math.max(-24, Math.min(24, v));
  }
  function isActive(a, t) {
    if (a.dissolving) return (t - a.dissolveStart) < 2;
    return (t - a.t0) < 20;
  }
  function addActivator(t) {
    // Cap at 6: the oldest still-standing activator dissolves when exceeded.
    // (Already-dissolving ones are skipped, or re-marking the same oldest
    // activator would never free a slot.)
    var active = [];
    for (var i = 0; i < activators.length; i++) {
      if (isActive(activators[i], t)) active.push(activators[i]);
    }
    if (active.length >= 6) {
      var standing = [];
      for (var s = 0; s < active.length; s++) {
        if (!active[s].dissolving) standing.push(active[s]);
      }
      var pool = standing.length ? standing : active;
      var oldest = pool[0];
      for (var j = 1; j < pool.length; j++) {
        if (pool[j].t0 < oldest.t0) oldest = pool[j];
      }
      oldest.dissolving = true;
      oldest.dissolveStart = t;
    }
    // Slot: seeded order across the six stage slots. A dissolving activator
    // is vacating its slot, so it does not block the slot for the newcomer.
    var used = {};
    for (var k = 0; k < activators.length; k++) {
      if (isActive(activators[k], t) && !activators[k].dissolving) used[activators[k].slot] = true;
    }
    var slot = 0;
    while (used[slot] && slot < 5) slot++;
    var g = nextGesture % 4;
    nextGesture++;
    activators.push({ t0: t, gesture: g, slot: slot, seed: 1335100 + Math.floor(t * 7) + slot * 13, dissolving: false, dissolveStart: 0 });
  }
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = pos(e);
    dragging = true; lastX = p.x; lastY = p.y;
    downX = p.x; downY = p.y; downT = pieceNow;
    liveDX = 0; liveDY = 0;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = pos(e);
    var dx = p.x - lastX, dy = p.y - lastY;
    lastX = p.x; lastY = p.y;
    dragSegs.push({ t: pieceNow, dx: dx, dy: dy });
    liveDX = p.x - downX; liveDY = p.y - downY;
  });
  function endPointer(e) {
    if (!dragging) return;
    dragging = false;
    var p = pos(e);
    var moved = Math.abs(p.x - downX) + Math.abs(p.y - downY);
    // A tap on the stage adds an activator; a drag pans. Never a reload.
    if (moved < 12 &&
        p.x >= stageHit.x && p.x <= stageHit.x + stageHit.w &&
        p.y >= stageHit.y && p.y <= stageHit.y + stageHit.h) {
      addActivator(pieceNow);
    }
    liveDX = 0; liveDY = 0;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---- Drawing helpers ------------------------------------------------------
  function rect(x, y, w, h, fill) {
    ctx.fillStyle = fill;
    ctx.fillRect(x, y, w, h);
  }
  function dot(x, y, r, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  function ellipse(x, y, rx, ry, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  function poly(pts, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fill();
  }
  function line(x1, y1, x2, y2, w, stroke) {
    ctx.strokeStyle = stroke; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  function lerpHex(a, b, u) {
    var ar = parseInt(a.substr(1, 2), 16), ag = parseInt(a.substr(3, 2), 16), ab = parseInt(a.substr(5, 2), 16);
    var br = parseInt(b.substr(1, 2), 16), bg = parseInt(b.substr(3, 2), 16), bb = parseInt(b.substr(5, 2), 16);
    var r = Math.round(ar + (br - ar) * u), g = Math.round(ag + (bg - ag) * u), bl = Math.round(ab + (bb - ab) * u);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }

  // ---- Silhouette figure ----------------------------------------------------
  // Dark silhouette sprite, 3-4 frame gesture loop. No faces, no detail.
  function drawFigure(x, feetY, h, gesture, frame, alpha) {
    var col = 'rgba(30,28,26,' + alpha.toFixed(3) + ')';
    var headR = h * 0.13;
    var hipY = feetY - h * 0.42;
    var shoulderY = feetY - h * 0.78;
    var headY = feetY - h * 0.90;
    var sway = 0;
    if (gesture === 2) sway = (frame % 2 === 0 ? -1 : 1) * h * 0.05;
    var cx = x + sway;
    // ground shadow
    ellipse(x, feetY + h * 0.02, h * 0.16, h * 0.03, 'rgba(0,0,0,' + (0.30 * alpha).toFixed(3) + ')');
    // legs
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, h * 0.05); ctx.lineCap = 'round';
    if (gesture === 2) {
      // dances two steps: legs alternate apart and together
      if (frame % 2 === 0) {
        line(cx - h * 0.03, hipY, cx - h * 0.12, feetY, h * 0.05, col);
        line(cx + h * 0.03, hipY, cx + h * 0.10, feetY, h * 0.05, col);
      } else {
        line(cx - h * 0.03, hipY, cx - h * 0.02, feetY, h * 0.05, col);
        line(cx + h * 0.03, hipY, cx + h * 0.12, feetY, h * 0.05, col);
      }
    } else {
      line(cx - h * 0.03, hipY, cx - h * 0.06, feetY, h * 0.05, col);
      line(cx + h * 0.03, hipY, cx + h * 0.06, feetY, h * 0.05, col);
    }
    // torso
    poly([[cx - h * 0.09, shoulderY], [cx + h * 0.09, shoulderY],
          [cx + h * 0.07, hipY], [cx - h * 0.07, hipY]], col);
    // head
    dot(cx, headY, headR, col);
    // arms + gesture props (gesture -1: plain crowd silhouette, no prop)
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, h * 0.04); ctx.lineCap = 'round';
    if (gesture < 0) {
      line(cx - h * 0.08, shoulderY + h * 0.04, cx - h * 0.11, hipY - h * 0.02, h * 0.04, col);
      line(cx + h * 0.08, shoulderY + h * 0.04, cx + h * 0.11, hipY - h * 0.02, h * 0.04, col);
    } else if (gesture === 0) {
      // raises a book: arm up, book overhead, alternating height per frame
      var lift = (frame % 2 === 0) ? 0 : h * 0.05;
      line(cx + h * 0.08, shoulderY + h * 0.04, cx + h * 0.14, headY - h * 0.10 - lift, h * 0.04, col);
      rect(cx + h * 0.08, headY - h * 0.22 - lift, h * 0.13, h * 0.10, col);
      line(cx - h * 0.08, shoulderY + h * 0.04, cx - h * 0.12, hipY - h * 0.05, h * 0.04, col);
    } else if (gesture === 1) {
      // plays a silent instrument: small shape at the face, bobbing
      var bob = (frame % 2 === 0) ? 0 : h * 0.03;
      line(cx + h * 0.08, shoulderY + h * 0.04, cx + h * 0.14, headY + h * 0.02 + bob, h * 0.04, col);
      line(cx + h * 0.14, headY + h * 0.02 + bob, cx + h * 0.26, headY - h * 0.06 + bob, h * 0.035, col);
      line(cx - h * 0.08, shoulderY + h * 0.04, cx - h * 0.12, hipY - h * 0.05, h * 0.04, col);
    } else if (gesture === 2) {
      // dances: arms out, alternating
      var up = (frame % 2 === 0) ? -h * 0.06 : h * 0.02;
      line(cx - h * 0.08, shoulderY + h * 0.04, cx - h * 0.20, shoulderY + h * 0.10 + up, h * 0.04, col);
      line(cx + h * 0.08, shoulderY + h * 0.04, cx + h * 0.20, shoulderY + h * 0.10 - up, h * 0.04, col);
    } else {
      // reads: head bowed, book at the chest, subtle bob
      dot(cx, headY + h * 0.02, headR, col);
      var rb = (frame % 2 === 0) ? 0 : h * 0.015;
      rect(cx - h * 0.07, shoulderY + h * 0.16 + rb, h * 0.14, h * 0.11, col);
      line(cx - h * 0.08, shoulderY + h * 0.04, cx - h * 0.02, shoulderY + h * 0.20, h * 0.04, col);
      line(cx + h * 0.08, shoulderY + h * 0.04, cx + h * 0.02, shoulderY + h * 0.20, h * 0.04, col);
    }
  }

  // ---- Main draw: frame one is draw(0), the clock starts with the rAF loop --
  function draw(t) {
    pieceNow = t;
    ctx.clearRect(0, 0, W, H);

    var panX = panOffset(t);
    var panY = panOffsetY(t);
    var cx = W / 2 + panX;
    var horizonY = H * 0.52 + panY * 0.4;

    // Dusk sky: layered flat-alpha bands, top #2E2A3A to horizon #6E5A4A.
    var bands = 48;
    for (var bi = 0; bi < bands; bi++) {
      var u = bi / bands;
      rect(0, (horizonY * bi) / bands, W, horizonY / bands + 1, lerpHex('#2E2A3A', '#6E5A4A', u));
    }
    // One strong dusk light source: warm glow near the horizon, slowly shifting.
    var lightA = 0.10 + 0.05 * Math.sin((t / 60) * Math.PI * 2);
    var sunX = W * 0.70 + Math.sin((t / 90) * Math.PI * 2) * W * 0.03 + panX * 0.3;
    var sunY = horizonY - H * 0.05;
    ellipse(sunX, sunY, S * 0.16, S * 0.07, 'rgba(110,90,74,' + lightA.toFixed(3) + ')');
    ellipse(sunX, sunY, S * 0.10, S * 0.045, 'rgba(138,106,82,' + (lightA + 0.06).toFixed(3) + ')');
    ellipse(sunX, sunY, S * 0.05, S * 0.022, 'rgba(180,140,100,' + (lightA + 0.10).toFixed(3) + ')');

    // Plaza stone, shot from slightly above.
    rect(0, horizonY, W, H - horizonY, '#4A4A48');
    // faint plaza joints
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    for (var ji = 0; ji < joints.length; ji++) {
      var jx = joints[ji].x * W + panX * 0.5;
      ctx.lineWidth = joints[ji].w;
      ctx.beginPath();
      ctx.moveTo(jx, horizonY);
      ctx.lineTo(jx + (W * 0.01), H);
      ctx.stroke();
    }
    for (var hy = 0; hy < 5; hy++) {
      var yy = horizonY + ((H - horizonY) * (hy + 1)) / 6;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, yy);
      ctx.lineTo(W, yy);
      ctx.stroke();
    }
    // long dusk shadow wash across the plaza
    rect(0, horizonY + (H - horizonY) * 0.55, W, (H - horizonY) * 0.45, 'rgba(0,0,0,0.12)');

    // Stage: red-painted platform at center, top surface + front face (pseudo-3D).
    var stageW = phone ? Math.min(W * 0.80, S * 0.80) : Math.min(W * 0.54, S * 0.66);
    var wBack = stageW * 0.43, wFront = stageW * 0.50;
    var topY = horizonY + (H - horizonY) * 0.18;
    var depth = stageW * 0.07;
    var faceH = stageW * 0.10;
    var stageTop = topY;
    var stageBottom = topY + depth + faceH;
    // cast shadow, down-right
    poly([[cx - wFront, stageBottom], [cx + wFront, stageBottom],
          [cx + wFront + stageW * 0.10, stageBottom + stageW * 0.05],
          [cx - wFront + stageW * 0.10, stageBottom + stageW * 0.05]], 'rgba(0,0,0,0.30)');
    // front face
    rect(cx - wFront, topY + depth, stageW, faceH, '#A31621');
    rect(cx - wFront, topY + depth + faceH - Math.max(1, faceH * 0.12), stageW, Math.max(1, faceH * 0.12), '#7E1018');
    // top surface
    poly([[cx - wBack, topY], [cx + wBack, topY],
          [cx + wFront, topY + depth], [cx - wFront, topY + depth]], '#B01E28');
    // top edge highlight
    line(cx - wBack, topY, cx + wBack, topY, Math.max(1, stageW * 0.004), '#C93A44');

    stageHit = { x: cx - wFront, y: topY, w: stageW, h: depth + faceH };

    // Props on the stage, left to right: mic stand, book stack, stool, potted plant.
    var propY = topY + depth * 0.55;
    // microphone stand (chrome)
    var micX = cx - wFront * 0.62;
    line(micX, propY, micX, propY - stageW * 0.16, Math.max(1.5, stageW * 0.006), '#B8B4AA');
    line(micX - stageW * 0.03, propY, micX + stageW * 0.03, propY, Math.max(1.5, stageW * 0.006), '#B8B4AA');
    ellipse(micX, propY - stageW * 0.17, stageW * 0.016, stageW * 0.022, '#B8B4AA');
    // stack of books
    var bookX = cx - wFront * 0.22, bookY = propY;
    rect(bookX, bookY - stageW * 0.018, stageW * 0.11, stageW * 0.018, '#2A2620');
    rect(bookX + stageW * 0.008, bookY - stageW * 0.036, stageW * 0.095, stageW * 0.018, '#3E2F23');
    rect(bookX + stageW * 0.004, bookY - stageW * 0.054, stageW * 0.10, stageW * 0.018, '#1F3A2E');
    // stool (wood)
    var stoolX = cx + wFront * 0.22;
    rect(stoolX - stageW * 0.045, propY - stageW * 0.075, stageW * 0.09, stageW * 0.016, '#5A4030');
    line(stoolX - stageW * 0.035, propY - stageW * 0.06, stoolX - stageW * 0.035, propY, Math.max(1.5, stageW * 0.006), '#5A4030');
    line(stoolX + stageW * 0.035, propY - stageW * 0.06, stoolX + stageW * 0.035, propY, Math.max(1.5, stageW * 0.006), '#5A4030');
    // potted plant
    var potX = cx + wFront * 0.62;
    poly([[potX - stageW * 0.035, propY - stageW * 0.05], [potX + stageW * 0.035, propY - stageW * 0.05],
          [potX + stageW * 0.025, propY], [potX - stageW * 0.025, propY]], '#7A4A30');
    ctx.strokeStyle = '#3E5C2E'; ctx.lineWidth = Math.max(1.5, stageW * 0.006); ctx.lineCap = 'round';
    line(potX, propY - stageW * 0.05, potX - stageW * 0.02, propY - stageW * 0.12, stageW * 0.006, '#3E5C2E');
    line(potX, propY - stageW * 0.05, potX + stageW * 0.01, propY - stageW * 0.13, stageW * 0.006, '#3E5C2E');
    line(potX, propY - stageW * 0.05, potX + stageW * 0.025, propY - stageW * 0.10, stageW * 0.006, '#3E5C2E');
    dot(potX - stageW * 0.02, propY - stageW * 0.12, Math.max(2, stageW * 0.010), '#3E5C2E');
    dot(potX + stageW * 0.01, propY - stageW * 0.13, Math.max(2, stageW * 0.010), '#3E5C2E');
    dot(potX + stageW * 0.025, propY - stageW * 0.10, Math.max(2, stageW * 0.010), '#3E5C2E');

    // Crowd: faint ghost outlines at the periphery, drifting, never the subject.
    for (var ci = 0; ci < crowd.length; ci++) {
      var C = crowd[ci];
      var ccx = C.fx * W + panX * 0.5 + Math.sin(t * C.sp + C.ph) * W * 0.012;
      var ccy = C.fy * H + panY * 0.3 + Math.sin(t * C.sp * 0.7 + C.ph) * H * 0.006;
      var ch = S * 0.10 * C.sc;
      // skip any figure that would land on the stage itself
      if (ccx > cx - wFront * 1.15 && ccx < cx + wFront * 1.15 && ccy > topY - ch && ccy < stageBottom + ch * 0.5) continue;
      drawFigure(ccx, ccy, ch, -1, 0, C.al * 0.9);
    }

    // Activators: silhouettes added by touch, each on its own gesture loop.
    for (var ai = 0; ai < activators.length; ai++) {
      var A = activators[ai];
      var age = t - A.t0;
      if (age < 0) continue;
      var aAlpha;
      if (A.dissolving) {
        var dAge = t - A.dissolveStart;
        if (dAge >= 2) continue;
        aAlpha = 1 - dAge / 2;
      } else {
        if (age >= 20) continue;
        var fadeIn = Math.min(1, age / 1);
        var fadeOut = age > 17 ? Math.max(0, (20 - age) / 3) : 1;
        aAlpha = Math.min(fadeIn, fadeOut);
      }
      if (aAlpha <= 0) continue;
      var slotX = cx - wFront * 0.70 + A.slot * (wFront * 1.40 / 5);
      var ah = stageW * 0.24;
      var aFeet = propY + (1 - aAlpha) * ah * 0.10;
      var frame = Math.floor(age / 0.8) % 4;
      drawFigure(slotX, aFeet, ah, A.gesture, frame, aAlpha);
    }
  }

  // Frame one, synchronously, at exactly t = 0. The stage is empty: every
  // presence must arrive through interaction.
  draw(0);

  // The clock starts with the rAF loop (plain function declaration).
  if (typeof requestAnimationFrame === 'function') {
    var start = null;
    function loop(ts) {
      if (start === null) start = ts;
      var el = (ts - start) / 1000;
      if (document.hidden !== true) draw(el);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
