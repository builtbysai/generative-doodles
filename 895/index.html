<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cyan Eddy</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0C; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(89556);

  // ---------- palette (strict) ----------
  var GROUND = '#0A0A0C';
  var SMOKE = '#4A4A4E';
  var FILAMENT = '#B8F0E8';
  var CORE = '#54E8D8';
  var SHADOW = '#141416';

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720, DPR = 1;

  function isPhone() {
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 0; sh = window.screen.height || 0;
    }
    var mn = Math.min(sw, sh);
    if (mn > 0) return mn < 700;
    return H > W * 1.15;
  }

  function resize() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width || 0; h = window.visualViewport.height || 0;
    }
    if (!w || !h) {
      w = (typeof window !== 'undefined' && window.innerWidth) || 720;
      h = (typeof window !== 'undefined' && window.innerHeight) || 720;
    }
    var ow = W, oh = H;
    W = Math.round(w); H = Math.round(h);
    DPR = 1;
    if (typeof window !== 'undefined' && window.devicePixelRatio) {
      DPR = Math.min(window.devicePixelRatio, 2);
    }
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    if (ow && oh && (ow !== W || oh !== H)) {
      var sx = W / ow, sy = H / oh;
      for (var i = 0; i < particles.length; i++) {
        particles[i].x *= sx; particles[i].y *= sy;
        particles[i].px *= sx; particles[i].py *= sy;
      }
    }
  }

  // ---------- field ----------
  // Analytic curl-ish drift from summed sines (seeded phases), plus ONE
  // central vortex. Speeds in px/s, deliberately slow.
  var PH = [];
  for (var pi = 0; pi < 8; pi++) PH.push(rng() * Math.PI * 2);

  function curlVel(x, y, t, out) {
    var s = Math.min(W, H);
    var nx = x / s, ny = y / s;
    var vx = Math.sin(ny * 5.1 + PH[0] + t * 0.021) + 0.6 * Math.sin((nx + ny) * 3.7 + PH[1] - t * 0.013);
    var vy = Math.cos(nx * 4.3 + PH[2] + t * 0.017) + 0.6 * Math.cos((nx - ny) * 4.9 + PH[3] + t * 0.011);
    out.x = vx * 15;
    out.y = vy * 15;
  }

  // vortex state
  var spinBoost = 0;          // added by circular drags, decays slowly
  var eyeUntil = -1;          // sim-time until which the eye holds
  var simTime = 0;

  function vortexStrength(t) {
    var breath = 0.82 + 0.18 * Math.sin(t * 0.11 + PH[4]); // very slow LFO
    var s = 30 * breath + spinBoost;
    if (t < eyeUntil) s += 55;
    return s; // tangential speed scale, px/s at the core ring
  }
  function eyeWeight(t) {
    if (t >= eyeUntil) return 0;
    var remain = eyeUntil - t;
    var w = Math.min(1, (5 - remain) / 1.2, remain / 1.0);
    return Math.max(0, w);
  }

  // ---------- particles ----------
  var particles = [];
  var N = 600;
  function buildParticles() {
    var phone = isPhone();
    N = phone ? 350 : 600;
    particles = [];
    for (var i = 0; i < N; i++) {
      var x, y;
      if (i % 7 === 0) {
        // seed some particles along a loose spiral so a current reads at frame one
        var u = rng();
        var ang = u * Math.PI * 3.4 + PH[5];
        var rad = (0.06 + u * 0.5) * Math.min(W, H);
        x = W / 2 + Math.cos(ang) * rad;
        y = H / 2 + Math.sin(ang) * rad;
      } else {
        x = rng() * W;
        y = rng() * H;
      }
      particles.push({
        x: x, y: y, px: x, py: y,
        kx: 0, ky: 0,                       // impulse velocity (drags, gusts), decays
        size: 5 + rng() * 15,               // smoke puff radius
        shade: rng(),                       // gray variation
        speed: 0
      });
    }
  }

  var tmpV = { x: 0, y: 0 };

  function sampleVel(p, t, out) {
    curlVel(p.x, p.y, t, tmpV);
    var ew = eyeWeight(t);
    var cw = 1 - 0.92 * ew;               // curl fades out during the eye
    var dx = p.x - W / 2, dy = p.y - H / 2;
    var r = Math.sqrt(dx * dx + dy * dy) + 0.001;
    var R0 = Math.min(W, H) * 0.16;       // core ring radius
    var S = vortexStrength(t);
    var vt = S * (R0 * R0) / (r * r * 0.35 + R0 * R0) * 2.2; // tangential speed
    var tx = -dy / r, ty = dx / r;
    var inward = 0.10 + 0.35 * ew;        // gentle spiral pull, stronger in the eye
    var vr = -vt * inward;
    out.x = tmpV.x * cw + tx * vt + (dx / r) * vr;
    out.y = tmpV.y * cw + ty * vt + (dy / r) * vr;
  }

  var vel = { x: 0, y: 0 };

  function step(dt) {
    simTime += dt;
    spinBoost *= Math.exp(-dt / 6.0);
    if (Math.abs(spinBoost) < 0.01) spinBoost = 0;
    var decay = Math.exp(-dt / 0.9);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.px = p.x; p.py = p.y;
      sampleVel(p, simTime, vel);
      var vx = vel.x + p.kx, vy = vel.y + p.ky;
      p.x += vx * dt;
      p.y += vy * dt;
      p.kx *= decay; p.ky *= decay;
      p.speed = Math.sqrt(vx * vx + vy * vy);
      // wrap at edges (field is ambient weather, not a tank)
      if (p.x < -20) { p.x += W + 40; p.px = p.x; }
      if (p.x > W + 20) { p.x -= W + 40; p.px = p.x; }
      if (p.y < -20) { p.y += H + 40; p.py = p.y; }
      if (p.y > H + 20) { p.y -= H + 40; p.py = p.y; }
    }
  }

  // ---------- drawing ----------
  function drawSmokeDisc(x, y, r, shade, bright) {
    // layered flat alpha, no gradients: outer halo, mid, inner body
    var base = 0.05 + 0.10 * shade + 0.10 * bright;
    ctx.globalAlpha = base * 0.45;
    ctx.fillStyle = SHADOW;
    ctx.beginPath(); ctx.arc(x, y, r * 1.5, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = base * 0.8;
    ctx.fillStyle = SMOKE;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = base;
    ctx.fillStyle = SMOKE;
    ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, 6.2832); ctx.fill();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // speeds at this instant (frame one uses the t=0 field, before any step)
    var speeds = new Array(particles.length);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      sampleVel(p, t, vel);
      var kvx = vel.x + p.kx, kvy = vel.y + p.ky;
      speeds[i] = Math.sqrt(kvx * kvx + kvy * kvy);
      p._vx = kvx; p._vy = kvy; p._sp = speeds[i];
    }
    var sorted = speeds.slice().sort(function (a, b) { return a - b; });
    var thresh = sorted[Math.floor(sorted.length * 0.90)] || 1e9;

    // eddy core: faint layered cyan discs at the exact center
    var S = vortexStrength(t);
    var coreR = Math.min(W, H) * (0.038 + 0.016 * Math.min(1, S / 90));
    var ew = eyeWeight(t);
    var layers = [2.1, 1.6, 1.2, 0.85, 0.55];
    for (var li = 0; li < layers.length; li++) {
      ctx.globalAlpha = 0.016 + 0.02 * li + 0.04 * ew;
      ctx.fillStyle = CORE;
      ctx.beginPath(); ctx.arc(W / 2, H / 2, coreR * layers[li], 0, 6.2832); ctx.fill();
    }

    // smoke first (dim ones), then filaments on top
    for (var a = 0; a < particles.length; a++) {
      var q = particles[a];
      if (q._sp > thresh) continue;
      var bright = Math.min(1, q._sp / (thresh * 1.6));
      drawSmokeDisc(q.x, q.y, q.size, q.shade, bright);
    }
    // brightest ~10%: cyan-white filament streaks along velocity
    ctx.lineCap = 'round';
    for (var b = 0; b < particles.length; b++) {
      var f = particles[b];
      if (f._sp <= thresh) continue;
      var over = Math.min(1, (f._sp - thresh) / (thresh * 0.9 + 1));
      var len = 6 + f._sp * 0.55;
      var ux = f._vx / (f._sp || 1), uy = f._vy / (f._sp || 1);
      ctx.globalAlpha = 0.16 + 0.30 * over;
      ctx.strokeStyle = CORE;
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(f.x - ux * len * 1.5, f.y - uy * len * 1.5);
      ctx.lineTo(f.x + ux * len * 0.4, f.y + uy * len * 0.4);
      ctx.stroke();
      ctx.globalAlpha = 0.35 + 0.55 * over;
      ctx.strokeStyle = FILAMENT;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(f.x - ux * len, f.y - uy * len);
      ctx.lineTo(f.x, f.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- audio (lazy, first gesture only) ----------
  var AC = null, noiseGain = null, bpFilter = null;
  function ensureAudio() {
    if (AC) { if (AC.resume) AC.resume(); return; }
    try {
      var Ctor = null;
      if (typeof AudioContext !== 'undefined') Ctor = AudioContext;
      else if (typeof webkitAudioContext !== 'undefined') Ctor = webkitAudioContext;
      if (!Ctor) return;
      AC = new Ctor();
      var len = AC.sampleRate * 2;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var d = buf.getChannelData(0);
      var arng = mulberry32(4242);
      var last = 0;
      for (var i = 0; i < len; i++) {
        var white = arng() * 2 - 1;
        last = (last + 0.04 * white) / 1.04;  // brownish
        d[i] = last * 3.2;
      }
      var src = AC.createBufferSource();
      src.buffer = buf; src.loop = true;
      var lp = AC.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 0.4;
      bpFilter = AC.createBiquadFilter();
      bpFilter.type = 'bandpass'; bpFilter.frequency.value = 300; bpFilter.Q.value = 1.2;
      noiseGain = AC.createGain(); noiseGain.gain.value = 0.0;
      src.connect(lp); lp.connect(bpFilter); bpFilter.connect(noiseGain);
      noiseGain.connect(AC.destination);
      src.start();
      noiseGain.gain.setTargetAtTime(0.05, AC.currentTime, 1.5);
    } catch (e) { AC = null; }
  }
  function audioUpdate() {
    if (!AC || !bpFilter) return;
    try {
      var S = vortexStrength(simTime);
      var k = Math.min(1, S / 110);
      bpFilter.frequency.setTargetAtTime(220 + 700 * k, AC.currentTime, 0.4);
      bpFilter.Q.setTargetAtTime(1.2 + 7 * k, AC.currentTime, 0.4);
    } catch (e) {}
  }

  // ---------- interaction ----------
  var dragging = false, lastX = 0, lastY = 0, downT = 0, downX = 0, downY = 0, moved = 0;
  var lastTapT = -10, lastTapX = 0, lastTapY = 0;

  function pos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: (e.clientX || 0) - r.left, y: (e.clientY || 0) - r.top };
  }

  function gust(x, y, power) {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var dx = p.x - x, dy = p.y - y;
      var r = Math.sqrt(dx * dx + dy * dy) + 0.001;
      var R = Math.min(W, H) * 0.55;
      if (r > R) continue;
      var f = power * (1 - r / R) * (1 - r / R);
      p.kx += (dx / r) * f; p.ky += (dy / r) * f;
    }
  }

  function onDown(e) {
    ensureAudio();
    var q = pos(e);
    dragging = true; moved = 0;
    lastX = downX = q.x; lastY = downY = q.y;
    downT = simTime;
    if (e.preventDefault) e.preventDefault();
  }

  function onMove(e) {
    if (!dragging) return;
    var q = pos(e);
    var dx = q.x - lastX, dy = q.y - lastY;
    var dist = Math.sqrt(dx * dx + dy * dy);
    moved += dist;
    if (dist > 0.5) {
      // circular component around center spins the vortex up
      var cx = W / 2, cy = H / 2;
      var rx = lastX - cx, ry = lastY - cy;
      var rr = Math.sqrt(rx * rx + ry * ry) + 0.001;
      var tangential = (rx * dy - ry * dx) / rr;      // signed px of tangential travel
      spinBoost += tangential * 0.55;
      if (spinBoost > 130) spinBoost = 130;
      if (spinBoost < -60) spinBoost = -60;
      // tear / stir: kick particles near the drag segment along the drag
      var speed = dist; // per event; faster drags kick harder below
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        var mx = p.x - q.x, my = p.y - q.y;
        var d2 = mx * mx + my * my;
        var R = 90;
        if (d2 > R * R) continue;
        var fall = 1 - Math.sqrt(d2) / R;
        var kick = fall * fall * Math.min(3.2, 0.55 + speed * 0.10);
        p.kx += dx * kick; p.ky += dy * kick;
      }
    }
    lastX = q.x; lastY = q.y;
  }

  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var dur = simTime - downT;
    if (dur < 0.3 && moved < 8) {
      // tap (or second tap = double-tap -> the eye)
      if (simTime - lastTapT < 0.38 && Math.abs(downX - lastTapX) < 40 && Math.abs(downY - lastTapY) < 40) {
        eyeUntil = simTime + 5;
        lastTapT = -10;
      } else {
        gust(downX, downY, 130);
        lastTapT = simTime; lastTapX = downX; lastTapY = downY;
      }
    }
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // ---------- boot ----------
  resize();
  buildParticles();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(simTime); });
    }
    if (window.addEventListener) {
      window.addEventListener('resize', function () { resize(); draw(simTime); });
    }
  }

  draw(0); // frame one: seeded initial state, before any sim step

  var lastStamp = -1, acc = 0;
  var DT = 1 / 60;
  function frame(stamp) {
    if (lastStamp < 0) lastStamp = stamp;
    var elapsed = (stamp - lastStamp) / 1000;
    lastStamp = stamp;
    if (elapsed > 0.25) elapsed = 0.25;
    acc += elapsed;
    var n = 0;
    while (acc >= DT && n < 8) { step(DT); acc -= DT; n++; }
    draw(simTime);
    audioUpdate();
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
