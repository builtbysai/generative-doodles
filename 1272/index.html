<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Sea Wall</title>
<style>
  html, body { margin: 0; padding: 0; background: #141210; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var INK = '#141210';
  var JEWELS = ['#C2185B', '#E69B00', '#0F7B8A', '#EFE6D0', '#C2185B', '#0F7B8A', '#E69B00'];
  var GOLD = '#D4A017';
  var SEA_DEEP = '#174E63';
  var HORIZON = '#CFE3E2';
  var IVORY = '#EFE6D0';

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var W = 0, H = 0, phone = false;
  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = Math.round(w); H = Math.round(h);
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : W;
    var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : H;
    var minDim = Math.min(sw, sh);
    phone = minDim < 700 || H > W * 1.15;
  }
  size();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { size(); draw(clock()); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { size(); draw(clock()); });
  }
  if (typeof document !== 'undefined' && document.body) {
    document.body.style.background = INK;
  }

  var loadT = (typeof Date !== 'undefined') ? Date.now() : 0;
  function clock() {
    if (typeof Date === 'undefined') return 0;
    return (Date.now() - loadT) / 1000;
  }

  // Recorded drag segments: {end, len}. Widening is a closed-form sum over them.
  var dragSegs = [];
  var dragging = false, lastX = 0, lastY = 0;

  function gapHalf(t) {
    var base = H * 0.055;
    var extra = 0;
    for (var i = 0; i < dragSegs.length; i++) {
      var dt = t - dragSegs[i].end;
      if (dt >= 0) extra += dragSegs[i].len * Math.exp(-dt / 6);
    }
    var maxExtra = H * 0.10;
    if (extra > maxExtra) extra = maxExtra;
    return base + extra;
  }
  function gapTop(t) { return H * 0.44 - gapHalf(t); }
  function gapBot(t) { return H * 0.44 + gapHalf(t); }

  function onDown(e) {
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
  }
  function onMove(e) {
    if (!dragging) return;
    var t = clock();
    var dx = e.clientX - lastX;
    var midY = (lastY + e.clientY) / 2;
    if (midY >= gapTop(t) - 10 && midY <= gapBot(t) + 10 && Math.abs(dx) > 0) {
      dragSegs.push({ end: t, len: Math.abs(dx) * 0.55 });
      if (dragSegs.length > 200) dragSegs.splice(0, dragSegs.length - 200);
    }
    lastX = e.clientX; lastY = e.clientY;
  }
  function onUp() { dragging = false; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  function dot(x, y, r, color) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  function draw(t) {
    if (!W || !H) size();
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, W, H);

    var gt = gapTop(t), gb = gapBot(t);
    var gh = gb - gt;
    var sway = 5 * Math.sin(2 * Math.PI * t / 16);

    // Sea and sky behind the opening: layered flat shapes, slow shimmer.
    ctx.fillStyle = HORIZON;
    ctx.fillRect(0, gt, W, gh * 0.42);
    ctx.fillStyle = SEA_DEEP;
    ctx.fillRect(0, gt + gh * 0.42, W, gh * 0.58);
    ctx.strokeStyle = HORIZON;
    ctx.lineWidth = 1;
    for (var wi = 0; wi < 3; wi++) {
      var wy = gt + gh * (0.55 + wi * 0.14);
      ctx.globalAlpha = 0.28 - wi * 0.06;
      ctx.beginPath();
      for (var wx = 0; wx <= W; wx += 12) {
        var wv = wy + Math.sin(wx * 0.02 + wi * 1.7 + t * 0.7) * 2.5;
        if (wx === 0) ctx.moveTo(wx, wv); else ctx.lineTo(wx, wv);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Textile wall, drawn in two clipped parts so the opening stays unbroken.
    var cols = phone ? 6 : 9;
    var rows = phone ? 12 : 11;
    var colW = W / cols, rowH = H / rows;
    var rng = mulberry32(1272);

    function drawTiles(yA, yB) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, yA, W, yB - yA);
      ctx.clip();
      ctx.translate(sway, 0);
      // Shared grid points: adjacent tiles share edges, so the wall reads as
      // one pieced textile with wobbly seams instead of separated blocks.
      var pts = [];
      for (var gr = 0; gr <= rows; gr++) {
        pts[gr] = [];
        for (var gc = 0; gc <= cols; gc++) {
          var border = (gr === 0 || gr === rows || gc === 0 || gc === cols);
          var jx = border ? 0 : (rng() - 0.5) * colW * 0.16;
          var jy = border ? 0 : (rng() - 0.5) * rowH * 0.16;
          pts[gr][gc] = [gc * colW + jx, gr * rowH + jy];
        }
      }
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          var p00 = pts[r][c], p10 = pts[r][c + 1];
          var p11 = pts[r + 1][c + 1], p01 = pts[r + 1][c];
          var x0 = p00[0], y0 = p00[1], x1 = p11[0], y1 = p11[1];
          var col = JEWELS[Math.floor(rng() * JEWELS.length)];
          ctx.fillStyle = col;
          ctx.beginPath();
          ctx.moveTo(p00[0], p00[1]);
          ctx.lineTo(p10[0], p10[1]);
          ctx.lineTo(p11[0], p11[1]);
          ctx.lineTo(p01[0], p01[1]);
          ctx.closePath();
          ctx.fill();
          // Seam stitching along the bottom edge.
          ctx.strokeStyle = 'rgba(20,18,16,0.55)';
          ctx.lineWidth = 1;
          ctx.setLineDash([5, 4]);
          ctx.beginPath();
          ctx.moveTo(p01[0], p01[1]);
          ctx.lineTo(p11[0], p11[1]);
          ctx.stroke();
          ctx.setLineDash([]);
          // Bindi dot field on some tiles, along a contour curve.
          if (rng() < 0.42) {
            var dc = rng() < 0.5 ? GOLD : IVORY;
            var n = 4 + Math.floor(rng() * 5);
            var cy = y0 + rowH * (0.3 + rng() * 0.4);
            for (var di = 0; di < n; di++) {
              var dxp = x0 + (di + 0.5) * (colW / n) + Math.sin(di * 1.3) * 2;
              var dyp = cy + Math.sin(di * 0.9 + r) * 3;
              dot(dxp, dyp, 2, dc);
            }
          }
          // Tassel hanging from a seam, occasionally.
          if (rng() < 0.10) {
            var tx = x0 + colW * (0.3 + rng() * 0.4);
            ctx.strokeStyle = GOLD;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(tx, y1);
            ctx.lineTo(tx, y1 + 10);
            ctx.stroke();
            dot(tx, y1 + 13, 2.5, GOLD);
          }
        }
      }
      ctx.restore();
    }

    drawTiles(0, gt);
    drawTiles(gb, H);

    // Gold trim along the opening edges.
    ctx.fillStyle = GOLD;
    ctx.fillRect(0, gt - 2, W, 2);
    ctx.fillRect(0, gb, W, 2);
  }

  draw(0);
  if (typeof requestAnimationFrame === 'function') {
    (function loop() {
      draw(clock());
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
