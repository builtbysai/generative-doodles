<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grandfather's Garden</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F5E9C8; overflow: hidden; }
  canvas { display: block; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (naida-mazzenga NM7): warm flat color only. No gradients anywhere, ever.
  var LEAF  = '#4E9A3D',   // leaf green
      DEEP  = '#2E6B34',   // deep leaf
      SOIL  = '#7A5230',   // soil brown
      CREAM = '#F5E9C8',   // shell cream / warm sky wash
      RED   = '#C0392B',   // shell accent
      BLUE  = '#2B4FE0',   // shell accent
      DEW   = '#FFFFFF',   // dew white
      SILVER = '#C0C0C0';  // trail silver (drawn at 40% alpha)

  var PHASE0 = 6.0;   // constant first-frame loop phase (seconds): snails mid-path, trails laid
  var DROP_CYCLE = 18; // one dewdrop detaches per 18-second cycle

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---- geometry helpers (1080 x 1080 design space) ----
  function qpt(p0, p1, p2, s) {
    var a = (1 - s) * (1 - s), b = 2 * (1 - s) * s, c = s * s;
    return { x: a * p0.x + b * p1.x + c * p2.x, y: a * p0.y + b * p1.y + c * p2.y };
  }
  function qtg(p0, p1, p2, s) {
    return {
      x: 2 * (1 - s) * (p1.x - p0.x) + 2 * s * (p2.x - p1.x),
      y: 2 * (1 - s) * (p1.y - p0.y) + 2 * s * (p2.y - p1.y)
    };
  }
  function rot(p, c, a) {
    var dx = p.x - c.x, dy = p.y - c.y, co = Math.cos(a), si = Math.sin(a);
    return { x: c.x + dx * co - dy * si, y: c.y + dx * si + dy * co };
  }

  // ---- giant leaves: spine is a quadratic bezier, blade built from offset samples ----
  var LEAVES = [
    { b: {x:-30, y:260},  c: {x:300, y:140},  t: {x:760, y:250},  w: 165, col: LEAF, sway: 0.010, ph: 0.0 },
    { b: {x:1110, y:330}, c: {x:820, y:190},  t: {x:400, y:320},  w: 150, col: DEEP, sway: 0.008, ph: 1.7 },
    { b: {x:-40, y:540},  c: {x:240, y:430},  t: {x:560, y:530},  w: 120, col: LEAF, sway: 0.012, ph: 3.1 },
    { b: {x:1110, y:700}, c: {x:900, y:560},  t: {x:580, y:690},  w: 150, col: LEAF, sway: 0.009, ph: 4.4 },
    { b: {x:-60, y:1050}, c: {x:260, y:920},  t: {x:700, y:1030}, w: 200, col: DEEP, sway: 0.006, ph: 5.6 }
  ];
  function leafPoint(leaf, s, side, t) {
    // point on the blade: side -1..1 across the width profile
    var p = qpt(leaf.b, leaf.c, leaf.t, s);
    var tg = qtg(leaf.b, leaf.c, leaf.t, s);
    var len = Math.sqrt(tg.x * tg.x + tg.y * tg.y) || 1;
    var px = -tg.y / len, py = tg.x / len;
    var w = leaf.w * Math.pow(Math.sin(Math.PI * Math.min(Math.max(s, 0.001), 0.999)), 0.75);
    var q = { x: p.x + px * w * side, y: p.y + py * w * side };
    var ang = leaf.sway * Math.sin(2 * Math.PI * t / 47 + leaf.ph);
    return rot(q, leaf.b, ang);
  }
  function leafSpine(leaf, s, t) { return leafPoint(leaf, s, 0, t); }

  function drawLeaf(leaf, t) {
    var N = 26, i, s, pts = [];
    for (i = 0; i <= N; i++) { s = i / N; pts.push(leafPoint(leaf, s, 1, t)); }
    for (i = N; i >= 0; i--) { s = i / N; pts.push(leafPoint(leaf, s, -1, t)); }
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.fillStyle = leaf.col;
    ctx.fill();
    // central vein
    ctx.beginPath();
    for (i = 0; i <= N; i++) {
      s = i / N; var p = leafSpine(leaf, s, t);
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = CREAM; ctx.globalAlpha = 0.30; ctx.lineWidth = 3.5;
    ctx.lineCap = 'round'; ctx.stroke(); ctx.globalAlpha = 1;
    // side veins
    ctx.globalAlpha = 0.20; ctx.lineWidth = 2.2;
    var vs = [0.22, 0.38, 0.54, 0.70, 0.84];
    for (i = 0; i < vs.length; i++) {
      s = vs[i];
      var a = leafPoint(leaf, s, 0.82, t), b2 = leafSpine(leaf, s, t), c2 = leafPoint(leaf, s, -0.82, t);
      ctx.beginPath(); ctx.moveTo(b2.x, b2.y); ctx.lineTo(a.x, a.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(b2.x, b2.y); ctx.lineTo(c2.x, c2.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ---- snails: position is a pure function of time, so trails are too ----
  var SNAILS = [
    { path: [{x:120, y:235}, {x:330, y:150}, {x:600, y:215}], R: 40, kind: 'striped', period: 96,  amp: 0.34, ph: 0.4 },
    { path: [{x:950, y:300}, {x:760, y:215}, {x:520, y:300}], R: 36, kind: 'spotted', period: 110, amp: 0.30, ph: 2.1 },
    { path: [{x:140, y:735}, {x:400, y:665}, {x:700, y:720}], R: 44, kind: 'spiral',  period: 120, amp: 0.36, ph: 4.0 },
    { path: [{x:240, y:935}, {x:470, y:875}, {x:760, y:915}], R: 38, kind: 'banded',  period: 88,  amp: 0.33, ph: 1.2 },
    { path: [{x:90,  y:505}, {x:260, y:440}, {x:470, y:495}], R: 33, kind: 'plain',   period: 100, amp: 0.30, ph: 5.3 }
  ];
  // seeded spots for the spotted shell (unit-circle offsets)
  var spotRng = mulberry32(53502);
  var SPOTS = [];
  for (var si = 0; si < 9; si++) {
    var sa = spotRng() * Math.PI * 2, sr = Math.sqrt(spotRng()) * 0.68;
    SPOTS.push({ x: Math.cos(sa) * sr, y: Math.sin(sa) * sr, r: 0.10 + spotRng() * 0.09 });
  }
  function snailU(sn, t) { return 0.5 + sn.amp * Math.sin(2 * Math.PI * t / sn.period + sn.ph); }
  function snailPos(sn, t) { return qpt(sn.path[0], sn.path[1], sn.path[2], snailU(sn, t)); }

  function drawTrail(sn, t) {
    var K = 20, k, prev = null;
    ctx.lineCap = 'round';
    for (k = K; k >= 1; k--) {
      var p = snailPos(sn, t - k * 0.75);
      if (prev) {
        ctx.beginPath();
        ctx.moveTo(prev.x, prev.y + sn.R * 0.12);
        ctx.lineTo(p.x, p.y + sn.R * 0.12);
        ctx.strokeStyle = SILVER;
        ctx.globalAlpha = 0.4 * (1 - k / (K + 1));
        ctx.lineWidth = sn.R * 0.30 * (1 - k / (K + 1) * 0.5);
        ctx.stroke();
      }
      prev = p;
    }
    ctx.globalAlpha = 1;
  }

  function drawShell(kind, R) {
    // shell local: centre at origin
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.fillStyle = CREAM; ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.clip();
    if (kind === 'striped') {
      ctx.fillStyle = RED;
      for (var i = -2; i <= 2; i++) ctx.fillRect(i * R * 0.42 - R * 0.13, -R, R * 0.26, 2 * R);
    } else if (kind === 'spotted') {
      ctx.fillStyle = BLUE;
      for (var j = 0; j < SPOTS.length; j++) {
        ctx.beginPath(); ctx.arc(SPOTS[j].x * R, SPOTS[j].y * R, SPOTS[j].r * R, 0, Math.PI * 2); ctx.fill();
      }
    } else if (kind === 'spiral') {
      ctx.beginPath();
      var steps = 90;
      for (var k = 0; k <= steps; k++) {
        var a = (k / steps) * Math.PI * 4.6, r = R * 0.06 + (k / steps) * R * 0.80;
        var x = Math.cos(a) * r, y = Math.sin(a) * r;
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = RED; ctx.lineWidth = R * 0.10; ctx.lineCap = 'round'; ctx.stroke();
    } else if (kind === 'banded') {
      var bands = [ {r: 0.78, col: RED}, {r: 0.55, col: BLUE}, {r: 0.32, col: RED} ];
      for (var b = 0; b < bands.length; b++) {
        ctx.beginPath(); ctx.arc(0, 0, R * bands[b].r, 0, Math.PI * 2);
        ctx.strokeStyle = bands[b].col; ctx.lineWidth = R * 0.17; ctx.stroke();
      }
    } else { // plain: one quiet band along the top rim
      ctx.beginPath(); ctx.arc(0, 0, R * 0.80, Math.PI * 1.12, Math.PI * 1.88);
      ctx.strokeStyle = SOIL; ctx.globalAlpha = 0.45; ctx.lineWidth = R * 0.09; ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.strokeStyle = SOIL; ctx.lineWidth = 2.5; ctx.stroke();
  }

  function drawSnail(sn, t) {
    var p = snailPos(sn, t);
    var pa = snailPos(sn, t - 0.4), pb = snailPos(sn, t + 0.4);
    var vx = pb.x - pa.x, vy = pb.y - pa.y;
    var ang = Math.atan2(vy, vx);
    var flip = Math.cos(ang) < 0;
    var tilt = ang; // fold the velocity angle to a path slope in [-pi/2, pi/2]
    if (tilt > Math.PI / 2) tilt -= Math.PI;
    if (tilt < -Math.PI / 2) tilt += Math.PI;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(tilt * 0.6);
    if (flip) ctx.scale(-1, 1);
    var R = sn.R;
    // body: folk blob, cream with a thin soil outline, no face
    ctx.beginPath();
    ctx.moveTo(-R * 1.25, 0);
    ctx.quadraticCurveTo(-R * 1.30, -R * 0.34, -R * 0.55, -R * 0.36);
    ctx.quadraticCurveTo(0, -R * 0.44, R * 0.52, -R * 0.40);
    ctx.quadraticCurveTo(R * 0.86, -R * 0.52, R * 0.98, -R * 0.46); // head bump
    ctx.quadraticCurveTo(R * 1.18, -R * 0.30, R * 1.05, -R * 0.06);
    ctx.quadraticCurveTo(R * 0.90, R * 0.05, R * 0.40, 0);
    ctx.closePath();
    ctx.fillStyle = CREAM; ctx.fill();
    ctx.strokeStyle = SOIL; ctx.lineWidth = 2.2; ctx.stroke();
    // antennae: two waving strokes with small knobs, no eyes
    var w1 = 4.5 * Math.sin(2 * Math.PI * t / 3.1 + sn.ph * 2.0);
    var w2 = 4.5 * Math.sin(2 * Math.PI * t / 2.7 + sn.ph * 2.0 + 1.3);
    ctx.strokeStyle = SOIL; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(R * 0.88, -R * 0.44); ctx.lineTo(R * 1.06 + w1, -R * 1.02); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(R * 0.72, -R * 0.46); ctx.lineTo(R * 0.76 + w2, -R * 1.06); ctx.stroke();
    ctx.fillStyle = SOIL;
    ctx.beginPath(); ctx.arc(R * 1.06 + w1, -R * 1.02, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(R * 0.76 + w2, -R * 1.06, 3.2, 0, Math.PI * 2); ctx.fill();
    // shell rides on the back
    ctx.save();
    ctx.translate(-R * 0.28, -R * 0.92);
    drawShell(sn.kind, R);
    ctx.restore();
    ctx.restore();
  }

  // ---- dewdrops: hang under leaf edges; one detaches and falls each cycle ----
  var DEWS = [
    { leaf: 0, s: 0.66, r: 12 },
    { leaf: 1, s: 0.30, r: 10 },
    { leaf: 3, s: 0.52, r: 13 },
    { leaf: 4, s: 0.24, r: 11 }
  ];
  var FALL_DEW = { leaf: 1, s: 0.46, r: 11, groundY: 700 };
  function dewAnchor(d, t) {
    var leaf = LEAVES[d.leaf];
    var p = leafPoint(leaf, d.s, 0.9, t); // underside edge (either side reads as the rim from the front)
    var q = leafPoint(leaf, d.s, -0.9, t);
    return p.y > q.y ? p : q; // whichever edge point hangs lower
  }
  function drawDrop(x, y, r, stretch) {
    ctx.beginPath();
    ctx.ellipse(x, y, r * 0.82, r * (stretch || 1), 0, 0, Math.PI * 2);
    ctx.fillStyle = DEW; ctx.globalAlpha = 0.92; ctx.fill(); ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(x - r * 0.28, y - r * 0.30, r * 0.20, 0, Math.PI * 2);
    ctx.fillStyle = CREAM; ctx.fill();
  }
  function drawDews(t) {
    for (var i = 0; i < DEWS.length; i++) {
      var a = dewAnchor(DEWS[i], t);
      var sway = 2.2 * Math.sin(2 * Math.PI * t / 5.3 + i * 1.9);
      drawDrop(a.x + sway, a.y + DEWS[i].r * 0.8, DEWS[i].r, 1.12);
    }
    // the falling drop
    var a2 = dewAnchor(FALL_DEW, t);
    var local = ((t % DROP_CYCLE) + DROP_CYCLE) % DROP_CYCLE;
    if (local < 11) {
      var grow = Math.min(1, 0.35 + local / 11 * 0.65);
      drawDrop(a2.x, a2.y + FALL_DEW.r * 0.8 * grow, FALL_DEW.r * grow, 1.12);
    } else if (local < 12.6) {
      var fp = (local - 11) / 1.6;
      var fy = (a2.y + FALL_DEW.r) + (FALL_DEW.groundY - a2.y - FALL_DEW.r) * fp * fp;
      drawDrop(a2.x, fy, FALL_DEW.r, 1.35);
    } else if (local < 13.2) {
      // small splash: two flat arcs on the ground
      ctx.strokeStyle = DEW; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(a2.x - 9, FALL_DEW.groundY, 7, Math.PI * 1.15, Math.PI * 1.75); ctx.stroke();
      ctx.beginPath(); ctx.arc(a2.x + 9, FALL_DEW.groundY, 7, Math.PI * 1.25, Math.PI * 1.85); ctx.stroke();
    }
  }

  // ---- watering can: tiny silhouette at the horizon, for scale ----
  function drawCan(x, baseY) {
    var h = 54; // about 5% of the frame height
    ctx.fillStyle = DEEP;
    ctx.strokeStyle = DEEP;
    // body
    ctx.beginPath();
    ctx.moveTo(x - 17, baseY);
    ctx.lineTo(x - 17, baseY - h * 0.62);
    ctx.quadraticCurveTo(x, baseY - h * 0.78, x + 17, baseY - h * 0.62);
    ctx.lineTo(x + 17, baseY);
    ctx.closePath(); ctx.fill();
    // spout with rose
    ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 14, baseY - h * 0.45); ctx.lineTo(x - 30, baseY - h * 0.80); ctx.stroke();
    ctx.beginPath(); ctx.arc(x - 33, baseY - h * 0.84, 6.5, 0, Math.PI * 2); ctx.fill();
    // handle
    ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.arc(x + 4, baseY - h * 0.72, 13, Math.PI * 0.95, Math.PI * 1.95); ctx.stroke();
  }

  // ---- static seeded scatter: soil stones and leaf flecks ----
  var rng = mulberry32(535001);
  var STONES = [];
  for (var qi = 0; qi < 46; qi++) STONES.push({ x: rng() * 1080, y: 560 + rng() * 500, r: 2 + rng() * 4.5 });
  // ---- riso grain: precomputed seeded specks, drawn directly (no offscreen canvas) ----
  var GRAIN_COLS = [SOIL, DEEP, LEAF, CREAM];
  var SPECKS = [];
  for (var gi = 0; gi < 430; gi++) {
    SPECKS.push({ x: rng() * 1080, y: rng() * 1080, r: 0.8 + rng() * 1.5, a: 0.04 + rng() * 0.08, c: GRAIN_COLS[Math.floor(rng() * 4)] });
  }

  // ---- sizing (Visual Viewport API; field composition: full-bleed cover on phones, centred square elsewhere; page ground is the warm sky cream) ----
  var W = 0, H = 0;
  var simT = PHASE0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    draw(simT);
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // warm sky wash over the whole canvas first (letterbox ground included)
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, W, H);
    // centred square on every screen: a cover crop would slice the edge snails in half,
    // and the cream letterbox reads as more of the warm sky (isPhone() still runs per house rule)
    var phone = isPhone();
    var scale = Math.min(W, H) / 1080;
    ctx.translate((W - 1080 * scale) / 2, (H - 1080 * scale) / 2);
    ctx.scale(scale, scale);
    ctx.fillRect(-200, -200, 1480, 1480);

    // far soil hill
    ctx.beginPath();
    ctx.moveTo(-200, 560);
    ctx.bezierCurveTo(180, 452, 420, 520, 660, 478);
    ctx.bezierCurveTo(880, 442, 1080, 500, 1280, 462);
    ctx.lineTo(1280, 760); ctx.lineTo(-200, 760);
    ctx.closePath();
    ctx.fillStyle = SOIL; ctx.fill();

    // watering can on the far crest
    drawCan(806, 484);

    // near soil hill
    ctx.beginPath();
    ctx.moveTo(-200, 716);
    ctx.bezierCurveTo(160, 618, 430, 694, 680, 648);
    ctx.bezierCurveTo(900, 610, 1100, 676, 1280, 640);
    ctx.lineTo(1280, 1280); ctx.lineTo(-200, 1280);
    ctx.closePath();
    ctx.fillStyle = SOIL; ctx.fill();

    // soil stones
    ctx.fillStyle = CREAM;
    for (var i = 0; i < STONES.length; i++) {
      ctx.globalAlpha = 0.16;
      ctx.beginPath(); ctx.arc(STONES[i].x, STONES[i].y, STONES[i].r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // giant leaves arching overhead
    for (var li = 0; li < LEAVES.length; li++) drawLeaf(LEAVES[li], t);

    // dewdrops hanging from the leaves
    drawDews(t);

    // snail trails, then the snails themselves
    for (var ti = 0; ti < SNAILS.length; ti++) drawTrail(SNAILS[ti], t);
    for (var ni = 0; ni < SNAILS.length; ni++) drawSnail(SNAILS[ni], t);

    // riso grain over everything
    for (var si2 = 0; si2 < SPECKS.length; si2++) {
      var sp = SPECKS[si2];
      ctx.globalAlpha = sp.a;
      ctx.fillStyle = sp.c;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
