<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>noise on top of noise</title>
<style>
  html, body { margin: 0; padding: 0; background: #050505; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/*
  No.904 "noise on top of noise" (study #111 simondavidryden, PP65).
  A pale pink hairline wireframe torus, displaced by seeded 3D fbm noise,
  tumbling slowly in a black void. Wireframe only. No fill, no text.
  Frame one is the synchronous draw at t = 0. All state is a closed-form
  function of (t, recorded pointer events). No wall clock feeds the image.
*/

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- seeded 3D value noise, trilinear, fbm 3 octaves ---------- */
function hash3(x, y, z, seed) {
  var n = (seed | 0) ^ Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1274126177);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function smooth(t) { return t * t * (3 - 2 * t); }
function vnoise(x, y, z, seed) {
  var xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  var xf = x - xi, yf = y - yi, zf = z - zi;
  var u = smooth(xf), v = smooth(yf), w = smooth(zf);
  var c000 = hash3(xi, yi, zi, seed),     c100 = hash3(xi + 1, yi, zi, seed);
  var c010 = hash3(xi, yi + 1, zi, seed), c110 = hash3(xi + 1, yi + 1, zi, seed);
  var c001 = hash3(xi, yi, zi + 1, seed),     c101 = hash3(xi + 1, yi, zi + 1, seed);
  var c011 = hash3(xi, yi + 1, zi + 1, seed), c111 = hash3(xi + 1, yi + 1, zi + 1, seed);
  var x00 = c000 + u * (c100 - c000), x10 = c010 + u * (c110 - c010);
  var x01 = c001 + u * (c101 - c001), x11 = c011 + u * (c111 - c011);
  var y0 = x00 + v * (x10 - x00), y1 = x01 + v * (x11 - x01);
  return y0 + w * (y1 - y0);
}
function fbm3(x, y, z, seed) {
  var s = 0, amp = 0.5, f = 1, norm = 0;
  for (var o = 0; o < 3; o++) {
    s += amp * vnoise(x * f, y * f, z * f, seed + o * 101);
    norm += amp; amp *= 0.5; f *= 2.03;
  }
  return s / norm; // ~[0,1]
}

/* ---------- palette ---------- */
var GROUND = '#050505';
var MESH = [242, 215, 227];    // #F2D7E3
var HIGH = [255, 255, 255];    // #FFFFFF
var SHADOW = [201, 169, 184];  // #C9A9B8
function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function mixc(a, b, k) {
  return [Math.round(a[0] + (b[0] - a[0]) * k),
          Math.round(a[1] + (b[1] - a[1]) * k),
          Math.round(a[2] + (b[2] - a[2]) * k)];
}

/* ---------- torus geometry ---------- */
var NU = 110, NV = 36;         // around x tube
var R = 1.0, TUBE = 0.42;
var DISP_AMP = 0.35 * TUBE;    // displacement amplitude, in torus units
var NOISE_FREQ = 1.55;
var basePts = [];              // per-vertex: [px,py,pz, nx,ny,nz]
(function buildBase() {
  for (var j = 0; j < NV; j++) {
    var v = (j / NV) * Math.PI * 2;
    var cv = Math.cos(v), sv = Math.sin(v);
    for (var i = 0; i < NU; i++) {
      var u = (i / NU) * Math.PI * 2;
      var cu = Math.cos(u), su = Math.sin(u);
      var ring = R + TUBE * cv;
      basePts.push([ring * cu, ring * su, TUBE * sv, cv * cu, cv * su, sv]);
    }
  }
})();

/* ---------- noise fields (seeds) ---------- */
var SEED0 = 90465;
var fieldList = [{ seed: SEED0, t0: -10 }]; // reseed events append {seed, t0}
var rngEvents = mulberry32(1234567);
function fieldDisp(seed, p, zDrift) {
  return (fbm3(p[0] * NOISE_FREQ + seed * 0.913,
               p[1] * NOISE_FREQ + seed * 0.371,
               p[2] * NOISE_FREQ + zDrift, seed) - 0.5) * 2 * DISP_AMP;
}
function displacementAt(idx, t) {
  var p = basePts[idx];
  var zDrift = t * 0.045; // slow drift along the third noise axis: the form breathes
  var cur = fieldList[fieldList.length - 1];
  var d = fieldDisp(cur.seed, p, zDrift);
  // morph from the previous field over 2 s after a reseed
  if (fieldList.length > 1) {
    var k = (t - cur.t0) / 2;
    if (k < 1) {
      var prev = fieldList[fieldList.length - 2];
      var dp = fieldDisp(prev.seed, p, zDrift);
      k = k * k * (3 - 2 * k);
      d = dp + (d - dp) * k;
    }
  }
  return d * freezeEnv(t);
}

/* ---------- double-tap freeze envelope ---------- */
var freezeEvents = []; // t0 list
function freezeEnv(t) {
  var e = 1;
  for (var i = 0; i < freezeEvents.length; i++) {
    var dt = t - freezeEvents[i];
    if (dt < 0) continue;
    var v;
    if (dt < 0.8) v = 1 - smooth(dt / 0.8);            // noise drains
    else if (dt < 5.2) v = 0;                          // the clean read: perfect torus
    else if (dt < 6.0) v = smooth((dt - 5.2) / 0.8);   // noise floods back
    else v = 1;
    if (v < e) e = v;
  }
  return e;
}

/* ---------- tumble: base loop + drag lean (closed form over drag events) ---------- */
var BASE_AX = 0.92, BASE_AY = 0.35;      // initial tilt, frame one pose
var dragEvents = [];                     // {t, dx, dy} pixel deltas
function leanAt(t) {
  var lx = 0, ly = 0;
  for (var i = 0; i < dragEvents.length; i++) {
    var e = dragEvents[i], dt = t - e.t;
    if (dt < 0) continue;
    var grow = 1 - Math.exp(-dt / 0.25);       // lean arrives
    var settle = Math.exp(-dt / 18);           // then settles back like a spun top
    var k = grow * settle * 0.005;
    ly += e.dx * k;
    lx += -e.dy * k;
  }
  return [lx, ly];
}
function anglesAt(t) {
  var lean = leanAt(t);
  var ay = BASE_AY + (Math.PI * 2) * (t / 40) + lean[1];  // one revolution per 40 s
  var ax = BASE_AX + (Math.PI * 2) * (t / 97) + lean[0];  // slower secondary tilt
  return [ax, ay];
}

/* ---------- viewport ---------- */
var W = 0, H = 0, isPhone = false;
function measure() {
  var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
  W = vv ? vv.width : window.innerWidth;
  H = vv ? vv.height : window.innerHeight;
  var sw = (typeof window !== 'undefined' && window.screen) ? Math.min(window.screen.width, window.screen.height) : Infinity;
  isPhone = (sw < 700) || (H > W * 1.15);
  canvas.width = W; canvas.height = H;
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { measure(); draw(nowT()); });
  }
  window.addEventListener('resize', function () { measure(); draw(nowT()); });
}

/* ---------- audio (lazy, gesture-born, guarded) ---------- */
var AC = (typeof AudioContext !== 'undefined') ? AudioContext
       : (typeof webkitAudioContext !== 'undefined') ? webkitAudioContext : null;
var audio = null;
function startAudio() {
  if (!AC || audio) return;
  try {
    var ac = new AC();
    var g = ac.createGain(); g.gain.value = 0.0; g.connect(ac.destination);
    var o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = 54;
    var o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = 54.3;
    var g2 = ac.createGain(); g2.gain.value = 0.5;
    o1.connect(g); o2.connect(g2); g2.connect(g);
    o1.start(); o2.start();
    g.gain.setTargetAtTime(0.055, ac.currentTime, 1.5);
    audio = { ac: ac, o1: o1, o2: o2, g: g };
  } catch (e) { audio = null; }
}
function updateAudio(t) {
  if (!audio) return;
  var ampN = freezeEnv(t); // 1 = full displacement, 0 = frozen clean torus
  var lean = leanAt(t);
  var bend = 1 + Math.min(0.06, Math.abs(lean[0]) + Math.abs(lean[1]) * 0.15);
  var base = 54 * bend;
  audio.o1.frequency.setTargetAtTime(base, audio.ac.currentTime, 0.1);
  audio.o2.frequency.setTargetAtTime(base * (1 + 0.0075 * ampN), audio.ac.currentTime, 0.1);
}

/* ---------- draw ---------- */
var BUCKETS = 14;
function draw(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);

  var ang = anglesAt(t);
  var ax = ang[0], ay = ang[1];
  var cax = Math.cos(ax), sax = Math.sin(ax), cay = Math.cos(ay), say = Math.sin(ay);

  var minDim = Math.min(W, H);
  var scale = (minDim * 0.37) / (2 * (R + TUBE + DISP_AMP)); // small on void: middle third
  var cx = W / 2, cy = H / 2;

  // project all vertices: rotate Y then X, orthographic
  var px = new Float32Array(NU * NV), py = new Float32Array(NU * NV), pz = new Float32Array(NU * NV);
  var idx, p, d, vx, vy, vz, x1, y1, z1;
  for (idx = 0; idx < basePts.length; idx++) {
    p = basePts[idx];
    d = displacementAt(idx, t);
    vx = p[0] + p[3] * d; vy = p[1] + p[4] * d; vz = p[2] + p[5] * d;
    x1 = vx * cay + vz * say;
    z1 = -vx * say + vz * cay;
    y1 = vy;
    px[idx] = cx + x1 * scale;
    py[idx] = cy + (y1 * cax - z1 * sax) * scale;
    pz[idx] = y1 * sax + z1 * cax; // depth: larger = nearer viewer
  }

  // ring rows as hairline polylines, segments bucketed by depth for alpha/color
  var paths = [];
  for (var b = 0; b < BUCKETS; b++) paths.push([]);
  var DEPTH_MIN = -(R + TUBE + DISP_AMP), DEPTH_SPAN = 2 * (R + TUBE + DISP_AMP);
  for (var j = 0; j < NV; j++) {
    var rowBase = j * NU;
    for (var i = 0; i < NU; i++) {
      var a = rowBase + i, bIdx = rowBase + ((i + 1) % NU);
      var zm = (pz[a] + pz[bIdx]) / 2;
      var bk = Math.floor(((zm - DEPTH_MIN) / DEPTH_SPAN) * BUCKETS);
      if (bk < 0) bk = 0; if (bk >= BUCKETS) bk = BUCKETS - 1;
      paths[bk].push(px[a], py[a], px[bIdx], py[bIdx]);
    }
  }
  ctx.lineWidth = Math.max(1, minDim / 900);
  for (var bb = 0; bb < BUCKETS; bb++) {
    var arr = paths[bb];
    if (!arr.length) continue;
    var f = bb / (BUCKETS - 1); // 0 far, 1 near
    var col = f < 0.5 ? mixc(SHADOW, MESH, f * 2) : mixc(MESH, HIGH, (f - 0.5) * 2);
    ctx.strokeStyle = rgba(col, 0.16 + 0.72 * f);
    ctx.beginPath();
    for (var s = 0; s < arr.length; s += 4) {
      ctx.moveTo(arr[s], arr[s + 1]);
      ctx.lineTo(arr[s + 2], arr[s + 3]);
    }
    ctx.stroke();
  }

  updateAudio(t);
}

/* ---------- time ---------- */
var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
function nowT() {
  return (typeof performance !== 'undefined' && performance.now) ? (performance.now() - startStamp) / 1000 : 0;
}

/* ---------- pointer: drag orbits, tap reseeds, double-tap freezes ---------- */
var pDown = null, lastTap = null;
function evPos(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var x = (e.clientX !== undefined) ? e.clientX : 0;
  var y = (e.clientY !== undefined) ? e.clientY : 0;
  return [x - r.left, y - r.top];
}
canvas.addEventListener('pointerdown', function (e) {
  startAudio();
  var pos = evPos(e);
  pDown = { t: nowT(), x: pos[0], y: pos[1], lx: pos[0], ly: pos[1], moved: 0 };
});
canvas.addEventListener('pointermove', function (e) {
  if (!pDown) return;
  var pos = evPos(e);
  var dx = pos[0] - pDown.lx, dy = pos[1] - pDown.ly;
  var dist = Math.abs(pos[0] - pDown.x) + Math.abs(pos[1] - pDown.y);
  pDown.moved = Math.max(pDown.moved, dist);
  if (pDown.moved > 6 && (dx !== 0 || dy !== 0)) {
    dragEvents.push({ t: nowT(), dx: dx, dy: dy });
    if (dragEvents.length > 400) dragEvents.splice(0, dragEvents.length - 400);
  }
  pDown.lx = pos[0]; pDown.ly = pos[1];
});
canvas.addEventListener('pointerup', function (e) {
  if (!pDown) return;
  var t = nowT();
  var wasDrag = pDown.moved > 6;
  pDown = null;
  if (wasDrag) { lastTap = null; return; }
  if (lastTap !== null && (t - lastTap) < 0.35) {
    freezeEvents.push(t); // double-tap: the clean read
    lastTap = null;
  } else {
    lastTap = t;
    fieldList.push({ seed: SEED0 + Math.floor(rngEvents() * 1e9), t0: t }); // tap: reseed, morphs over 2 s
  }
});
canvas.addEventListener('pointercancel', function () { pDown = null; });

/* ---------- run ---------- */
measure();
draw(0); // frame one: synchronous, fixed phase
if (typeof requestAnimationFrame !== 'undefined') {
  var loop = function () { draw(nowT()); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
