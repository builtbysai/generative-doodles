<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№628 Prose Before Lyric</title>
<style>
  html, body { margin: 0; padding: 0; background: #f2ead8; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Prose Before Lyric, TL2 / PP1216, study #257 theodora-laird.
  // A paragraph of prose types itself across a quiet page, word
  // by word, in the cadence of someone looking at a cliff face
  // and writing about it. Each finished sentence releases a
  // single visual melodic line: it leaves the text and arcs
  // across the screen, bending toward the words that made it.
  // When the paragraph ends, the lines hold in formation, then
  // fade; a new paragraph begins. The lyric is always downstream
  // of the prose. Watch-only. The prose fragments are written
  // for this piece in the observed register (place, weather, a
  // face); no real sentences from her actual writing are used.
  // No audio: the bell-like voices are a closed-form visual
  // model only, per the Franke audio rule.
  var CREAM = '#f2ead8'; // chapbook cream ground
  var INK = '#1f1a16';   // printer-ink black
  var SLATE = '#5a6b7a'; // melodic line tone 1
  var OCHRE = '#b98a2e'; // melodic line tone 2
  var RUST = '#a34a2a';  // melodic line tone 3
  var TONES = [SLATE, OCHRE, RUST];

  // Fixed-phase first frame: FIRST_T = 12 s. At t = 12 the first
  // paragraph is mid-typing (word 24 of 35 on the page) and three
  // sentences have finished: their lines are out in the lower
  // half, the third still travelling from the text to its place.
  var FIRST_T = 12;
  var SEED = 1969;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and fixed salts, so every frame is a pure
  // function of t.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function lerp(a, b, k) { return a + (b - a) * k; }
  function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  // ---- Prose ---------------------------------------------------
  // Three short paragraphs, written for this piece. Each is a
  // list of sentences; each sentence is a list of words.
  var PARAS = [
    { sentences: [
      ['The', 'cliff', 'stands', 'in', 'the', 'morning', 'light,', 'pale', 'and', 'patient.'],
      ['Rain', 'has', 'washed', 'the', 'ledges', 'clean,', 'and', 'the', 'gulls', 'turn', 'above', 'the', 'water.'],
      ['A', 'woman', 'watches', 'from', 'the', 'path,', 'her', 'coat', 'buttoned', 'against', 'the', 'wind.']
    ]},
    { sentences: [
      ['The', 'sea', 'comes', 'in', 'grey', 'and', 'slow,', 'folding', 'over', 'the', 'stones.'],
      ['She', 'counts', 'the', 'waves', 'and', 'loses', 'count,', 'and', 'counts', 'again.'],
      ['The', 'light', 'thins', 'toward', 'evening,', 'and', 'the', 'cliff', 'goes', 'dark', 'first.']
    ]},
    { sentences: [
      ['He', 'waits', 'at', 'the', 'gate', 'with', 'his', 'hands', 'in', 'his', 'pockets.'],
      ['The', 'wind', 'moves', 'through', 'the', 'grass', 'and', 'finds', 'the', 'low', 'wall.'],
      ['Nothing', 'hurries', 'here,', 'and', 'nothing', 'is', 'lost.']
    ]}
  ];
  // Flatten each paragraph: words with their sentence index,
  // plus the word index at which each sentence ends.
  var FLAT = [];
  (function () {
    var p, s, w;
    for (p = 0; p < PARAS.length; p++) {
      var words = [], ends = [];
      for (s = 0; s < PARAS[p].sentences.length; s++) {
        for (w = 0; w < PARAS[p].sentences[s].length; w++) {
          words.push({ word: PARAS[p].sentences[s][w], sent: s });
        }
        ends.push(words.length - 1);
      }
      FLAT.push({ words: words, ends: ends, nSent: PARAS[p].sentences.length });
    }
  })();

  var WORD_DT = 0.5;  // one word every half second: readable pace
  var HOLD = 6;       // lines hold in formation after typing ends
  var FADE = 4;       // then text and lines fade together
  var CYCLE = 30;     // fixed paragraph cycle; longest type time is 17.5 s
  var LINE_TRAVEL = 4; // seconds for a freed line to reach its place
  var LINE_DRAW = 2.5; // seconds for a freed line to draw itself out

  var L = {};
  function layout() {
    var u = Math.min(W, H);
    L.u = u;
    // Prose column: narrow, upper half.
    L.colX = isPhone ? W * 0.07 : W * 0.22;
    L.colW = isPhone ? W * 0.86 : W * 0.56;
    L.colTop = isPhone ? H * 0.16 : H * 0.18;
    L.fs = isPhone ? Math.round(clamp(W * 0.048, 16, 19)) : Math.round(clamp(W * 0.036, 19, 23));
    L.lh = L.fs * 1.6;
    // Lower half: the freed lines travel the full width.
    L.divY = isPhone ? H * 0.46 : H * 0.46;
    L.linesTop = L.divY + H * 0.05;
    L.linesBot = H * 0.87;
    L.lineGap = (L.linesBot - L.linesTop) / 3;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Word-wrap the paragraph's words into the column. Returns
  // placements [{x, y, w}] per word index, and the end position
  // of each sentence (the point its line leaves from).
  function wrapWords(pi) {
    var flat = FLAT[pi];
    ctx.font = L.fs + 'px Georgia, "Times New Roman", serif';
    var spaceW = ctx.measureText(' ').width;
    var x = L.colX, y = L.colTop;
    var place = [], i, w;
    var sentEnd = [];
    for (i = 0; i < flat.words.length; i++) {
      w = ctx.measureText(flat.words[i].word).width;
      if (x + w > L.colX + L.colW && x > L.colX) {
        x = L.colX;
        y += L.lh;
      }
      place.push({ x: x, y: y, w: w });
      x += w + spaceW;
      if (flat.ends.indexOf(i) >= 0) {
        sentEnd[flat.words[i].sent] = { x: x - spaceW, y: y };
      }
    }
    return { place: place, sentEnd: sentEnd, bottom: y + L.lh };
  }

  // Seeded line shape for sentence s of paragraph pi: bend and
  // drift come from the sentence's word count and punctuation,
  // so the line's curvature is seeded from its words.
  function lineShape(pi, s) {
    var flat = FLAT[pi];
    var rng = mulberry32(SEED * 31 + pi * 101 + s * 7919 + 7);
    var words = PARAS[pi].sentences[s];
    var commas = 0, j;
    for (j = 0; j < words.length; j++) {
      if (words[j].indexOf(',') >= 0) { commas++; }
    }
    var bend = (0.07 + 0.05 * rng()) * H * (rng() < 0.5 ? -1 : 1);
    if (commas > 0 && rng() < 0.6) { bend = -Math.abs(bend); }
    var drift = (rng() - 0.5) * W * 0.10;
    var nDots = 4 + (words.length % 4);
    var phases = [];
    for (j = 0; j < nDots; j++) { phases.push(rng() * Math.PI * 2); }
    return { bend: bend, drift: drift, nDots: nDots, phases: phases, tone: TONES[s % 3] };
  }

  function qbez(p0, p1, p2, u) {
    var v = 1 - u;
    return {
      x: v * v * p0.x + 2 * v * u * p1.x + u * u * p2.x,
      y: v * v * p0.y + 2 * v * u * p1.y + u * u * p2.y
    };
  }

  function drawLine(pi, s, origin, t, lt, fadeA) {
    var flat = FLAT[pi];
    var birth = (flat.ends[s] + 1) * WORD_DT;
    var age = lt - birth;
    if (age < 0) { return; }
    var shape = lineShape(pi, s);
    var yBase = L.linesTop + s * L.lineGap + L.lineGap * 0.5;
    var x0 = W * 0.10, x1 = W * 0.92;
    var cx = W * 0.5 + shape.drift;
    var cy = yBase + shape.bend;
    // Gentle sway once settled, slow and small.
    if (age > LINE_TRAVEL) {
      cy += Math.sin(t * 0.4 + s * 1.7 + pi) * H * 0.006;
    }
    // The line migrates from its sentence's end point to its
    // settled place over LINE_TRAVEL seconds.
    var e = smooth(age / LINE_TRAVEL);
    var p0 = { x: lerp(origin.x, x0, e), y: lerp(origin.y, yBase, e) };
    var p1 = { x: lerp(origin.x, cx, e), y: lerp(origin.y + shape.bend * 0.3, cy, e) };
    var p2 = { x: lerp(origin.x, x1, e), y: lerp(origin.y, yBase, e) };
    // The line draws itself out over LINE_DRAW seconds.
    var q = clamp(age / LINE_DRAW, 0, 1);
    var alpha = fadeA * clamp(age / 0.5, 0, 1);
    if (alpha <= 0.01 || q <= 0) { return; }
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = shape.tone;
    ctx.lineWidth = Math.max(1.5, H * 0.0028);
    ctx.lineCap = 'round';
    var segs = 48, i, pt, prev;
    ctx.beginPath();
    prev = qbez(p0, p1, p2, 0);
    ctx.moveTo(prev.x, prev.y);
    for (i = 1; i <= segs; i++) {
      var u = (i / segs) * q;
      pt = qbez(p0, p1, p2, u);
      ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
    // Bell-like voices: note dots along the line, pulsing slowly.
    var head = qbez(p0, p1, p2, q);
    var r0 = Math.max(2.5, H * 0.004);
    for (i = 0; i < shape.nDots; i++) {
      var du = 0.12 + 0.76 * (shape.nDots === 1 ? 0.5 : i / (shape.nDots - 1));
      if (du > q) { continue; }
      var dp = qbez(p0, p1, p2, du);
      var pulse = 0.55 + 0.45 * Math.sin(t * 1.1 + shape.phases[i]);
      ctx.fillStyle = hexA(shape.tone, a4(0.35 + 0.55 * pulse));
      ctx.beginPath();
      ctx.moveTo(dp.x + r0 * (0.8 + 0.35 * pulse), dp.y);
      ctx.arc(dp.x, dp.y, r0 * (0.8 + 0.35 * pulse), 0, Math.PI * 2);
      ctx.fill();
    }
    // Travelling head dot while the line is still drawing out.
    if (q < 1) {
      ctx.fillStyle = hexA(shape.tone, a4(0.95));
      ctx.beginPath();
      ctx.moveTo(head.x + r0 * 1.3, head.y);
      ctx.arc(head.x, head.y, r0 * 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    // Page ground is the chapbook cream; the stage is the page.
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, W, H);

    // Which paragraph, and how far into its cycle.
    var cyc = Math.floor(t / CYCLE);
    var pi = ((cyc % PARAS.length) + PARAS.length) % PARAS.length;
    var lt = t - cyc * CYCLE;
    var flat = FLAT[pi];
    var typeDur = flat.words.length * WORD_DT;

    // Fade after the hold: text and lines go together.
    var fadeA = 1;
    if (lt > typeDur + HOLD) {
      fadeA = 1 - clamp((lt - typeDur - HOLD) / FADE, 0, 1);
    }

    var wrapped = wrapWords(pi);
    var typed = Math.floor(lt / WORD_DT) + 1;
    if (typed > flat.words.length) { typed = flat.words.length; }
    if (typed < 0) { typed = 0; }

    // ---- Prose, upper half, narrow column.
    ctx.save();
    ctx.globalAlpha = fadeA;
    ctx.font = L.fs + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = INK;
    var i;
    for (i = 0; i < typed; i++) {
      ctx.fillText(flat.words[i].word, wrapped.place[i].x, wrapped.place[i].y);
    }
    // Typing caret after the last typed word, blinking slowly
    // at 0.5 Hz, well under the 14 Hz ceiling.
    if (typed > 0 && typed < flat.words.length) {
      var last = wrapped.place[typed - 1];
      var caretA = 0.35 + 0.35 * Math.sin(t * Math.PI);
      ctx.fillStyle = hexA(INK, a4(caretA));
      ctx.fillRect(last.x + last.w + 4, last.y - L.fs * 0.85, Math.max(1.5, L.fs * 0.07), L.fs * 0.95);
    }
    ctx.restore();

    // ---- Divider rule between prose and the freed lines.
    ctx.save();
    ctx.globalAlpha = fadeA * 0.35;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(L.colX, L.divY);
    ctx.lineTo(L.colX + L.colW, L.divY);
    ctx.stroke();
    ctx.restore();

    // ---- Freed melodic lines, full width below.
    for (i = 0; i < flat.nSent; i++) {
      drawLine(pi, i, wrapped.sentEnd[i], t, lt, fadeA);
    }

    // ---- Vertical side text along the left edge.
    var fsSide = Math.round(12 * clamp(W / 560, 0.85, 1.1));
    ctx.save();
    ctx.translate(Math.max(14, W * 0.045) + 2, H * 0.78);
    ctx.rotate(-Math.PI / 2);
    ctx.font = '600 ' + fsSide + 'px Georgia, "Times New Roman", serif';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = hexA(INK, a4(0.78));
    ctx.fillText('P R O S E   B E F O R E   L Y R I C', 0, 0);
    ctx.font = fsSide + 'px Georgia, "Times New Roman", serif';
    ctx.fillStyle = hexA(INK, a4(0.65));
    ctx.fillText('T L 2   ·   P P 1 2 1 6', 0, fsSide + 7);
    ctx.restore();

    // ---- Plates: title top-left, number and date below it.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Prose Before Lyric', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, a4(0.85));
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№628 · 2003 · 10 · 01', 18, 18 + fsTitle * 0.8 + fsSub + 8);

    // ---- Hint, centered at the bottom, cream pill on ink edge.
    var hint = 'Watch the prose become lyric.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(CREAM, a4(0.92));
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = hexA(INK, a4(0.35));
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  // Watch-only: no pointer interaction. The typing cadence is
  // the timing of the piece; the viewer reads at its pace.

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1969 exposes the schedule state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1969 = {
      firstT: FIRST_T,
      typedWords: function (t) {
        var cyc = Math.floor(t / CYCLE);
        var pi = ((cyc % PARAS.length) + PARAS.length) % PARAS.length;
        var lt = t - cyc * CYCLE;
        var n = Math.floor(lt / WORD_DT) + 1;
        return { para: pi, lt: lt, typed: Math.min(Math.max(n, 0), FLAT[pi].words.length) };
      },
      linesOut: function (t) {
        var cyc = Math.floor(t / CYCLE);
        var pi = ((cyc % PARAS.length) + PARAS.length) % PARAS.length;
        var lt = t - cyc * CYCLE;
        var out = 0, i;
        for (i = 0; i < FLAT[pi].nSent; i++) {
          if (lt >= (FLAT[pi].ends[i] + 1) * WORD_DT) { out++; }
        }
        return out;
      },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: typing, travelling lines, pulsing note dots.
  // All motion is on half second and slower timescales, well
  // under the 14 Hz ceiling. Guarded so node-canvas QA (no
  // requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
