<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Eighty Teachings</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0D1220; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ================= palette (strict) =================
  var BACK  = '#1A2440';   // card back indigo
  var GOLD  = '#C98A2E';   // ring gold
  var GROUND = '#0D1220';  // back indigo scaled by 0.5: (26,36,64) -> (13,18,32)
  var FACE  = '#F5F1E8';   // aged cream face ground (cream from the creature palette)
  var MOSS  = '#5C8A4D';
  var BARK  = '#6B4A2E';
  var AMBER = '#C9862E';   // fox amber
  var FGREEN = '#6A9A5B';  // frog green
  var CORAL = '#E2725B';   // mushroom coral
  var NIGHT = '#2B3A67';   // night blue
  var CREAM = '#F5F1E8';
  var BASE_SEED = 62876;
  var SPECIES = ['fox', 'frog', 'seed', 'mushroom', 'owl', 'squirrel'];
  var CARD_RATIO = 1.4;    // height / width
  var RISE_DUR = 0.9, PAINT_DUR = 4.0, RETURN_DUR = 0.8;

  // ================= seeded rng =================
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeIO(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  // ================= canvas / viewport =================
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 300, H = 300, tNow = 0;

  function viewSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.width === 'number') {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && typeof window.innerWidth === 'number') {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = W; h = H; }
    return { w: Math.max(50, Math.floor(w)), h: Math.max(50, Math.floor(h)) };
  }

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999; sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  // ================= layout =================
  var cardW = 60, cardH = 84;
  var homes = [];   // 12 row slots {x,y}
  var slots = [];   // 12 constellation slots {x,y}

  function layout() {
    var phone = isPhone();
    var cols = W >= 640 ? 12 : 6;
    var rows = Math.ceil(12 / cols);
    var gap = 8;
    cardW = Math.min((W * 0.97 - gap * (cols - 1)) / cols, 96);
    cardH = cardW * CARD_RATIO;
    var blockW = cols * cardW + (cols - 1) * gap;
    var x0 = (W - blockW) / 2 + cardW / 2;
    homes = [];
    for (var i = 0; i < 12; i++) {
      var r = Math.floor(i / cols), c = i % cols;
      homes.push({
        x: x0 + c * (cardW + gap),
        y: H - 14 - cardH / 2 - (rows - 1 - r) * (cardH + gap)
      });
    }
    var sc = W >= 900 ? 4 : 3;
    var srows = Math.ceil(12 / sc);
    var top = H * 0.05, bot = H * (phone ? 0.52 : 0.58);
    var rng = mulberry32(BASE_SEED + 7);
    slots = [];
    for (var j = 0; j < 12; j++) {
      var sr = Math.floor(j / sc), scol = j % sc;
      slots.push({
        x: W * 0.07 + (scol + 0.5) * (W * 0.86 / sc) + (rng() * 2 - 1) * (W * 0.86 / sc) * 0.15,
        y: top + (sr + 0.5) * ((bot - top) / srows) + (rng() * 2 - 1) * ((bot - top) / srows) * 0.15
      });
    }
    for (var k = 0; k < cards.length; k++) {
      var cd = cards[k];
      if (cd.state === 'down') { cd.x = homes[k].x; cd.y = homes[k].y; }
    }
  }

  // ================= ground texture (static, seeded once) =================
  var specks = [];
  (function () {
    var rng = mulberry32(BASE_SEED + 99);
    for (var i = 0; i < 90; i++) {
      specks.push({ x: rng(), y: rng(), r: 0.6 + rng() * 1.5,
                    a: 0.03 + rng() * 0.06, g: rng() < 0.5 });
    }
  })();

  // ================= stroke system =================
  // Strokes are authored in face space: x 0..100, y 0..140.
  // kind: 'ribbon' tapered polyline | 'dot' | 'blob' ellipse | 'glow' | 'crescent'
  function ribbon(pts, w0, w1, color, o) {
    o = o || {};
    return { kind: 'ribbon', pts: pts, w0: w0, w1: w1, color: color,
             alpha: o.alpha != null ? o.alpha : 1, role: o.role || '', group: o.group || 'form' };
  }
  function dot(x, y, r, color, o) {
    o = o || {};
    return { kind: 'dot', x: x, y: y, r: r, color: color,
             alpha: o.alpha != null ? o.alpha : 1, role: o.role || '', group: o.group || 'detail' };
  }
  function blob(cx, cy, rx, ry, color, o) {
    o = o || {};
    return { kind: 'blob', x: cx, y: cy, rx: rx, ry: ry, color: color, half: o.half || '',
             alpha: o.alpha != null ? o.alpha : 1, role: o.role || '', group: o.group || 'form' };
  }
  function glowS(cx, cy, r, o) {
    o = o || {};
    return { kind: 'glow', x: cx, y: cy, r: r, color: CREAM,
             alpha: 1, role: 'glow', group: o.group || 'detail' };
  }
  function crescent(cx, cy, r, color, o) {
    o = o || {};
    return { kind: 'crescent', x: cx, y: cy, r: r, color: color,
             alpha: 1, role: '', group: o.group || 'detail' };
  }
  function strokeLen(s) {
    if (s.kind === 'ribbon') {
      var L = 0;
      for (var i = 1; i < s.pts.length; i++) {
        var dx = s.pts[i][0] - s.pts[i - 1][0], dy = s.pts[i][1] - s.pts[i - 1][1];
        L += Math.sqrt(dx * dx + dy * dy);
      }
      return L;
    }
    if (s.kind === 'blob') return s.rx + s.ry;
    if (s.kind === 'glow') return 20;
    if (s.kind === 'crescent') return 16;
    return 12;
  }
  // point at arc-length fraction f of a ribbon
  function ribbonPoint(s, f) {
    var total = strokeLen(s), target = f * total, acc = 0;
    for (var i = 1; i < s.pts.length; i++) {
      var x0 = s.pts[i - 1][0], y0 = s.pts[i - 1][1];
      var x1 = s.pts[i][0], y1 = s.pts[i][1];
      var seg = Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0));
      if (acc + seg >= target || i === s.pts.length - 1) {
        var u = seg > 0 ? clamp((target - acc) / seg, 0, 1) : 0;
        return [lerp(x0, x1, u), lerp(y0, y1, u)];
      }
      acc += seg;
    }
    return s.pts[s.pts.length - 1];
  }

  // ================= creature stroke builders =================
  // Each returns strokes in groups: wash, form, detail. Variant changes the
  // wash tint and one accent; geometry is jittered from the card seed.
  function makePainting(species, seed) {
    var rng = mulberry32(seed);
    function j(v, amt) { return v + (rng() * 2 - 1) * amt; }
    function J(pts, amt) {
      return pts.map(function (p) { return [j(p[0], amt), j(p[1], amt)]; });
    }
    var variant = Math.floor(rng() * 2);
    var washTints = [MOSS, GOLD, CORAL];
    var tint = washTints[Math.floor(rng() * washTints.length)];
    var S = [];
    // pale wash: three broad flat dabs (single-pass shapes, so the low
    // alpha stays pale instead of compounding like a wide ribbon would)
    S.push(blob(50, 38, 52, 15, tint, { alpha: 0.14, group: 'wash' }));
    S.push(blob(50, 76, 52, 16, tint, { alpha: 0.12, group: 'wash' }));
    S.push(blob(50, 112, 52, 14, tint, { alpha: 0.14, group: 'wash' }));

    if (species === 'fox') {
      var tip = variant ? GOLD : CREAM;
      S.push(ribbon(J([[21, 87], [11, 74], [13, 58], [20, 50]], 1.5), 6, 14, AMBER, { role: 'tail' }));
      S.push(blob(j(20, 1), j(46, 1), 6, 7, tip, {}));
      S.push(ribbon(J([[24, 88], [36, 78], [52, 76], [64, 82]], 1.5), 19, 15, AMBER, {}));
      S.push(blob(j(72, 1), j(68, 1), 11, 10, AMBER, {}));
      S.push(ribbon(J([[78, 70], [88, 73]], 1), 6, 2, AMBER, {}));
      S.push(ribbon(J([[66, 60], [63, 47]], 1), 5.5, 1.5, AMBER, { role: 'ear' }));
      S.push(ribbon(J([[75, 59], [77, 46]], 1), 5.5, 1.5, AMBER, { role: 'ear' }));
      S.push(ribbon(J([[38, 99], [37, 112]], 1), 4.5, 3.5, BARK, {}));
      S.push(ribbon(J([[58, 99], [59, 112]], 1), 4.5, 3.5, BARK, {}));
      S.push(blob(j(63, 1), j(82, 1), 4, 6, CREAM, { alpha: 0.9 }));
      S.push(dot(j(74, 0.7), j(66, 0.7), 1.9, BARK, { role: 'eye' }));
      S.push(dot(j(89, 0.7), j(73, 0.7), 1.8, BARK, {}));
      // the teaching: a forked path beside the fox, toward its gaze
      S.push(ribbon(J([[68, 127], [82, 116]], 1), 2.2, 2.2, BARK, { alpha: 0.75 }));
      S.push(ribbon(J([[82, 116], [93, 104]], 1), 2, 2, BARK, { alpha: 0.75 }));
      S.push(ribbon(J([[82, 116], [95, 121]], 1), 2, 2, BARK, { alpha: 0.75 }));
      S.push(ribbon(J([[16, 121], [15, 111]], 0.7), 2, 1, MOSS, {}));
      S.push(ribbon(J([[27, 122], [28, 113]], 0.7), 2, 1, MOSS, {}));
    } else if (species === 'frog') {
      S.push(ribbon(J([[28, 90], [40, 80], [60, 80], [72, 90]], 1.5), 20, 20, FGREEN, {}));
      S.push(ribbon(J([[36, 74], [50, 66], [64, 74]], 1.5), 13, 13, FGREEN, {}));
      S.push(ribbon(J([[40, 67], [39, 57]], 1), 4, 4, FGREEN, {}));
      S.push(ribbon(J([[60, 67], [61, 57]], 1), 4, 4, FGREEN, {}));
      S.push(ribbon(J([[28, 96], [18, 104], [26, 110]], 1), 5, 4, MOSS, {}));
      S.push(ribbon(J([[72, 96], [82, 104], [74, 110]], 1), 5, 4, MOSS, {}));
      S.push(blob(j(50, 1), j(87, 1), 8.5, 6, CREAM, { role: 'throat' }));
      S.push(dot(j(39, 0.7), j(55, 0.7), 3.6, BARK, { role: 'eye' }));
      S.push(dot(j(61, 0.7), j(55, 0.7), 3.6, BARK, { role: 'eye' }));
      S.push(dot(j(40, 0.5), j(54, 0.5), 1, CREAM, {}));
      S.push(dot(j(62, 0.5), j(54, 0.5), 1, CREAM, {}));
      // the teaching: rain falling on the frog
      for (var ri = 0; ri < 7; ri++) {
        var rx = 18 + ri * 10.5 + j(0, 2);
        S.push(ribbon([[rx, j(13, 2)], [rx - 3, j(30, 2)]], 1.6, 1.6, NIGHT, { alpha: 0.7, role: 'rain' }));
      }
      S.push(ribbon(J([[30, 117], [70, 117]], 1), 2, 2, NIGHT, { alpha: 0.5 }));
    } else if (species === 'seed') {
      S.push(blob(j(50, 1), j(86, 1), 15, 19, BARK, {}));
      S.push(blob(j(50, 1), j(86, 1), 10, 13.5, AMBER, { alpha: 0.95 }));
      S.push(ribbon(J([[50, 68], [49, 52], [46, 42]], 1), 4, 2, MOSS, { role: 'sprout' }));
      S.push(ribbon(J([[47, 47], [36, 40]], 1), 4.5, 1, MOSS, {}));
      S.push(ribbon(J([[48, 45], [58, 34]], 1), 4.5, 1, MOSS, {}));
      S.push(ribbon(J([[44, 103], [40, 116]], 1), 2, 1, BARK, {}));
      S.push(ribbon(J([[50, 104], [50, 118]], 1), 2, 1, BARK, {}));
      S.push(ribbon(J([[56, 103], [60, 116]], 1), 2, 1, BARK, {}));
      // the teaching: the present glows at the center
      S.push(glowS(j(50, 0.7), j(86, 0.7), 11, {}));
      S.push(dot(j(50, 0.5), j(86, 0.5), 3, CREAM, { role: 'glowdot' }));
      S.push(ribbon(J([[26, 121], [74, 121]], 1), 2.4, 2.4, BARK, { alpha: 0.8 }));
      S.push(dot(j(34, 1), j(125, 1), 1.4, BARK, {}));
      S.push(dot(j(65, 1), j(126, 1), 1.4, BARK, {}));
    } else if (species === 'mushroom') {
      S.push(ribbon(J([[50, 74], [50, 104]], 1), 12, 14, BARK, { alpha: 0.85 }));
      S.push(blob(j(50, 1), j(72, 1), 27, 17, CORAL, { half: 'top' }));
      S.push(ribbon(J([[26, 73], [74, 73]], 1), 2.6, 2.6, BARK, { alpha: 0.3 }));
      S.push(ribbon(J([[74, 97], [74, 107]], 0.7), 4, 5, BARK, { alpha: 0.85 }));
      S.push(blob(j(74, 0.7), j(96, 0.7), 8, 5, CORAL, { half: 'top' }));
      for (var gi = 0; gi < 5; gi++) {
        var gx = 22 + gi * 13 + j(0, 2);
        S.push(ribbon([[gx, 118], [gx - 1.5, j(108, 2)]], 2, 1, MOSS, {}));
      }
      // the teaching: a crescent moon above the mushroom
      S.push(crescent(j(78, 1), j(24, 1), 7, GOLD, {}));
      S.push(dot(j(38, 1), j(66, 1), 3, CREAM, { role: 'spore' }));
      S.push(dot(j(52, 1), j(61, 1), 3.6, CREAM, { role: 'spore' }));
      S.push(dot(j(64, 1), j(67, 1), 2.6, CREAM, { role: 'spore' }));
      if (variant) S.push(dot(j(28, 1), j(30, 1), 1.6, CREAM, { role: 'star' }));
    } else if (species === 'owl') {
      S.push(ribbon(J([[22, 114], [50, 108], [78, 112]], 1.5), 4.5, 4.5, BARK, {}));
      S.push(blob(j(50, 1), j(80, 1), 17, 25, NIGHT, {}));
      S.push(ribbon(J([[35, 62], [31, 84], [36, 100]], 1), 5, 4, BARK, { alpha: 0.55 }));
      S.push(ribbon(J([[65, 62], [69, 84], [64, 100]], 1), 5, 4, BARK, { alpha: 0.55 }));
      S.push(blob(j(43, 0.7), j(66, 0.7), 7.5, 8, CREAM, {}));
      S.push(blob(j(57, 0.7), j(66, 0.7), 7.5, 8, CREAM, {}));
      S.push(ribbon(J([[38, 53], [35, 42]], 0.7), 3.5, 1, NIGHT, { role: 'ear' }));
      S.push(ribbon(J([[62, 53], [65, 42]], 0.7), 3.5, 1, NIGHT, { role: 'ear' }));
      S.push(dot(j(43, 0.5), j(66, 0.5), 2.4, BARK, { role: 'eye' }));
      S.push(dot(j(57, 0.5), j(66, 0.5), 2.4, BARK, { role: 'eye' }));
      S.push(dot(j(50, 0.5), j(72, 0.5), 1.8, variant ? CREAM : GOLD, {}));
      S.push(dot(j(45, 0.7), j(88, 0.7), 1.3, CREAM, {}));
      S.push(dot(j(55, 0.7), j(93, 0.7), 1.3, CREAM, {}));
      S.push(dot(j(50, 0.7), j(99, 0.7), 1.3, CREAM, {}));
      S.push(ribbon(J([[44, 104], [43, 110]], 0.7), 2.4, 2, BARK, {}));
      S.push(ribbon(J([[56, 104], [57, 110]], 0.7), 2.4, 2, BARK, {}));
      // the teaching: stars above the owl
      S.push(dot(j(20, 1), j(24, 1), 1.6, CREAM, { role: 'star' }));
      S.push(dot(j(34, 1), j(14, 1), 1.3, CREAM, { role: 'star' }));
      S.push(dot(j(68, 1), j(15, 1), 1.5, CREAM, { role: 'star' }));
      S.push(dot(j(83, 1), j(29, 1), 1.3, CREAM, { role: 'star' }));
      S.push(ribbon(J([[79, 15], [79, 25]], 0.5), 1.2, 1.2, GOLD, {}));
      S.push(ribbon(J([[74, 20], [84, 20]], 0.5), 1.2, 1.2, GOLD, {}));
    } else { // squirrel
      S.push(ribbon(J([[52, 100], [72, 92], [76, 68], [66, 46], [54, 42]], 1.5), 6, 13, AMBER, { role: 'tail' }));
      S.push(blob(j(44, 1), j(86, 1), 14, 19, BARK, {}));
      S.push(blob(j(43, 1), j(57, 1), 11, 10.5, BARK, {}));
      S.push(ribbon(J([[39, 49], [36, 39]], 0.7), 4, 1.2, BARK, { role: 'ear' }));
      S.push(ribbon(J([[47, 48], [48, 38]], 0.7), 4, 1.2, BARK, { role: 'ear' }));
      S.push(blob(j(44, 0.7), j(93, 0.7), 6, 10, CREAM, {}));
      S.push(ribbon(J([[50, 79], [57, 83]], 0.7), 3.5, 3, BARK, {}));
      // the teaching: the nut it holds
      S.push(blob(j(60, 0.7), j(86, 0.7), 6, 7, variant ? BARK : AMBER, { role: 'nut' }));
      S.push(dot(j(60, 0.5), j(80.5, 0.5), 2.6, variant ? AMBER : BARK, {}));
      S.push(dot(j(46, 0.5), j(55, 0.5), 2, CREAM, { role: 'eye' }));
      S.push(blob(j(35, 0.7), j(106, 0.7), 5, 3, BARK, {}));
      S.push(blob(j(54, 0.7), j(106, 0.7), 5, 3, BARK, {}));
      S.push(ribbon(J([[24, 115], [72, 115]], 1), 2.4, 2.4, BARK, { alpha: 0.8 }));
      S.push(ribbon(J([[30, 114], [29, 105]], 0.7), 2, 1, MOSS, {}));
      S.push(ribbon(J([[66, 114], [67, 105]], 0.7), 2, 1, MOSS, {}));
    }

    // assign playback times by group order, overlapping, scaled to PAINT_DUR
    var order = { wash: 0, form: 1, detail: 2 };
    S.sort(function (a, b) { return order[a.group] - order[b.group]; });
    var cursor = 0, i, s;
    for (i = 0; i < S.length; i++) {
      s = S[i];
      s.dur = clamp(0.22 + strokeLen(s) * 0.006, 0.25, 0.85);
      s.start = cursor;
      cursor += s.dur * 0.78;
    }
    var end = 0;
    for (i = 0; i < S.length; i++) end = Math.max(end, S[i].start + S[i].dur);
    var k = PAINT_DUR / end;
    for (i = 0; i < S.length; i++) { S[i].start *= k; S[i].dur *= k; }
    return S;
  }

  // ================= deck =================
  var cards = [];
  var seqCounter = 0;
  (function () {
    var rng = mulberry32(BASE_SEED);
    var deal = [];
    SPECIES.forEach(function (sp) { deal.push(sp, sp); });
    for (var i = deal.length - 1; i > 0; i--) { // Fisher-Yates on the seeded stream
      var j = Math.floor(rng() * (i + 1));
      var tmp = deal[i]; deal[i] = deal[j]; deal[j] = tmp;
    }
    for (var n = 0; n < 12; n++) {
      cards.push({
        i: n, species: deal[n], state: 'down',
        x: 0, y: 0, fromX: 0, fromY: 0,
        slot: -1, freePos: null,
        animT: 0, paintStart: 0, drawSeq: 0, round: 0,
        phase: rng() * Math.PI * 2,
        painting: null
      });
      cards[n].painting = makePainting(deal[n], BASE_SEED * 1000 + n * 131);
    }
  })();

  function cardSeed(cd) { return BASE_SEED * 1000 + cd.i * 131 + cd.round * 7919; }
  function drawnCount() {
    var c = 0;
    for (var i = 0; i < cards.length; i++) if (cards[i].state !== 'down') c++;
    return c;
  }
  function freeSlot() {
    var used = {};
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].state !== 'down' && cards[i].slot >= 0) used[cards[i].slot] = true;
    }
    for (var s = 0; s < 12; s++) if (!used[s]) return s;
    return 0;
  }

  function drawCard(cd) {
    if (cd.state !== 'down') return;
    if (drawnCount() >= 12) { // cap: the oldest drawn card returns first
      var oldest = null;
      for (var i = 0; i < cards.length; i++) {
        if (cards[i].state === 'up' && (!oldest || cards[i].drawSeq < oldest.drawSeq)) oldest = cards[i];
      }
      if (oldest) returnCard(oldest);
    }
    cd.slot = freeSlot();
    cd.freePos = null;
    cd.fromX = cd.x; cd.fromY = cd.y;
    cd.state = 'rising';
    cd.animT = tNow;
  }
  function returnCard(cd) {
    if (cd.state !== 'up' && cd.state !== 'painting') return;
    cd.fromX = cd.x; cd.fromY = cd.y;
    cd.state = 'returning';
    cd.animT = tNow;
  }

  // ================= drawing helpers =================
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
  function circle(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  function drawBlobShape(x, y, rx, ry, half, scaleF) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(rx * scaleF, ry * scaleF);
    ctx.beginPath();
    if (half === 'top') { ctx.arc(0, 0, 1, Math.PI, Math.PI * 2); ctx.closePath(); }
    else ctx.arc(0, 0, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // role transforms for idle life, all pure functions of the anchored clock
  function roleTransform(s, t, cd) {
    // returns {dx, dy, rot, cx, cy, aMul, rMul, syMul}
    var ph = cd.phase;
    var out = { dx: 0, dy: 0, rot: 0, cx: 0, cy: 0, aMul: 1, rMul: 1, syMul: 1 };
    if (s.role === 'ear') {
      var fl = Math.pow(Math.max(0, Math.sin(t * 0.7 + ph)), 12) * Math.sin(t * 14 + ph) * 0.18;
      out.rot = fl + Math.sin(t * 1.3 + ph) * 0.02;
      out.cx = s.pts ? s.pts[0][0] : s.x; out.cy = s.pts ? s.pts[0][1] : s.y;
    } else if (s.role === 'tail') {
      out.rot = Math.sin(t * 0.9 + ph) * 0.045;
      out.cx = s.pts ? s.pts[0][0] : s.x; out.cy = s.pts ? s.pts[0][1] : s.y;
    } else if (s.role === 'throat') {
      out.rMul = 1 + 0.16 * (0.5 + 0.5 * Math.sin(t * 2.2 + ph));
    } else if (s.role === 'glow' || s.role === 'glowdot') {
      out.aMul = 0.72 + 0.28 * Math.sin(t * 1.6 + ph);
    } else if (s.role === 'eye' && cd.species === 'owl') {
      var cyc = (t + ph) % 4.7;
      out.syMul = cyc < 0.16 ? 0.15 : 1; // blink
    } else if (s.role === 'spore') {
      var drift = (t * 1.5 + ph * 3 + s.x) % 7;
      out.dy = -drift;
      out.dx = Math.sin(t * 1.1 + ph + s.y) * 1.2;
      out.aMul = 0.85 * (1 - drift / 7) + 0.15;
    } else if (s.role === 'star') {
      out.aMul = 0.6 + 0.4 * Math.sin(t * 2.4 + ph + s.x);
    }
    return out;
  }

  function drawStroke(s, lp, t, cd) {
    if (lp <= 0) return;
    var rt = roleTransform(s, t, cd);
    ctx.save();
    ctx.globalAlpha = s.alpha * rt.aMul * clamp(lp * 3, 0, 1);
    ctx.fillStyle = s.color;
    ctx.strokeStyle = s.color;
    if (rt.rot && s.kind === 'ribbon') {
      ctx.translate(rt.cx - 50, rt.cy - 70);
      ctx.rotate(rt.rot);
      ctx.translate(-(rt.cx - 50), -(rt.cy - 70));
    }
    var dx = rt.dx, dy = rt.dy;
    if (s.kind === 'ribbon') {
      var total = strokeLen(s), target = lp * total;
      var steps = Math.max(2, Math.ceil(total / 3));
      var drawn = 0, prev = ribbonPoint(s, 0);
      ctx.lineCap = 'round';
      for (var k = 1; k <= steps; k++) {
        var f = k / steps;
        if (f * total > target + total / steps) break;
        var p = ribbonPoint(s, f);
        ctx.beginPath();
        ctx.lineWidth = lerp(s.w0, s.w1, f);
        ctx.moveTo(prev[0] - 50 + dx, prev[1] - 70 + dy);
        ctx.lineTo(p[0] - 50 + dx, p[1] - 70 + dy);
        ctx.stroke();
        prev = p; drawn++;
      }
      if (!drawn) { // very short partial: a dab at the start
        ctx.beginPath();
        ctx.lineWidth = s.w0;
        var p0 = ribbonPoint(s, lp);
        ctx.moveTo(s.pts[0][0] - 50 + dx, s.pts[0][1] - 70 + dy);
        ctx.lineTo(p0[0] - 50 + dx, p0[1] - 70 + dy);
        ctx.stroke();
      }
    } else if (s.kind === 'dot') {
      var rr2 = s.r * easeOut(lp) * rt.rMul;
      ctx.save();
      ctx.translate(s.x - 50 + dx, s.y - 70 + dy);
      ctx.scale(1, rt.syMul);
      circle(0, 0, Math.max(0.01, rr2));
      ctx.restore();
    } else if (s.kind === 'blob') {
      drawBlobShape(s.x - 50 + dx, s.y - 70 + dy, s.rx, s.ry * rt.rMul, s.half, easeOut(lp));
    } else if (s.kind === 'glow') {
      var gr = s.r * easeOut(lp);
      ctx.globalAlpha = 0.10 * rt.aMul;
      circle(s.x - 50 + dx, s.y - 70 + dy, gr * 1.6);
      ctx.globalAlpha = 0.16 * rt.aMul;
      circle(s.x - 50 + dx, s.y - 70 + dy, gr * 1.15);
      ctx.globalAlpha = 0.22 * rt.aMul;
      circle(s.x - 50 + dx, s.y - 70 + dy, gr * 0.8);
    } else if (s.kind === 'crescent') {
      var cr = s.r * easeOut(lp);
      ctx.fillStyle = s.color;
      circle(s.x - 50 + dx, s.y - 70 + dy, Math.max(0.01, cr));
      ctx.fillStyle = FACE;
      ctx.globalAlpha = 1;
      circle(s.x - 50 + dx + cr * 0.38, s.y - 70 + dy - cr * 0.2, Math.max(0.01, cr * 0.84));
    }
    ctx.restore();
  }

  function strokeBrushPoint(s, lp) {
    if (s.kind === 'ribbon') return ribbonPoint(s, lp);
    return [s.x, s.y];
  }

  function drawBack(cd, t) {
    var breathe = 1 + 0.008 * Math.sin(t * 0.8 + cd.i * 0.7);
    ctx.save();
    ctx.scale(breathe, breathe);
    rr(-50, -70, 100, 140, 8);
    ctx.fillStyle = BACK;
    ctx.fill();
    rr(-45, -65, 90, 130, 6);
    ctx.strokeStyle = GOLD;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1.1;
    ctx.stroke();
    ctx.globalAlpha = 1;
    // single gold ring motif
    ctx.beginPath();
    ctx.arc(0, -6, 21, 0, Math.PI * 2);
    ctx.strokeStyle = GOLD;
    ctx.lineWidth = 2.2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, -6, 6, 0, Math.PI * 2);
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.fillStyle = GOLD;
    circle(0, -6, 1.8);
    // small dot ring around it
    for (var i = 0; i < 10; i++) {
      var a = (i / 10) * Math.PI * 2;
      circle(Math.cos(a) * 29.5, -6 + Math.sin(a) * 29.5, 1.6);
    }
    ctx.restore();
  }

  function drawFace(cd, t) {
    rr(-50, -70, 100, 140, 8);
    ctx.fillStyle = FACE;
    ctx.fill();
    rr(-45, -65, 90, 130, 6);
    ctx.strokeStyle = GOLD;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1.1;
    ctx.stroke();
    ctx.globalAlpha = 1;
    // painting strokes, clipped to the inner face
    ctx.save();
    rr(-46, -66, 92, 132, 6);
    ctx.clip();
    var pt = cd.state === 'painting' ? t - cd.paintStart : 999;
    var strokes = cd.painting, active = null, activeLp = 0;
    for (var i = 0; i < strokes.length; i++) {
      var s = strokes[i];
      var lp = clamp((pt - s.start) / s.dur, 0, 1);
      if (cd.state !== 'painting' && cd.state !== 'up' && cd.state !== 'returning') lp = 0;
      if (cd.state === 'up' || cd.state === 'returning') lp = 1;
      drawStroke(s, lp, t, cd);
      if (cd.state === 'painting' && lp > 0 && lp < 1) { active = s; activeLp = lp; }
    }
    // the brush dot rides the active stroke
    if (cd.state === 'painting' && active) {
      var bp = strokeBrushPoint(active, activeLp);
      ctx.fillStyle = active.color;
      circle(bp[0] - 50, bp[1] - 70, 2.6);
      ctx.fillStyle = BARK;
      circle(bp[0] - 50 + 2.4, bp[1] - 70 - 2.4, 1.7);
    }
    ctx.restore();
  }

  function drawCard(cd, t) {
    // state machine: advance timed states, compute position and flip
    var flip = 1, showFace = false;
    if (cd.state === 'rising') {
      var p = clamp((t - cd.animT) / RISE_DUR, 0, 1);
      var tgt = cd.freePos || slots[cd.slot];
      cd.x = lerp(cd.fromX, tgt.x, easeIO(p));
      cd.y = lerp(cd.fromY, tgt.y, easeIO(p));
      flip = Math.max(0.06, Math.round(Math.abs(Math.cos(Math.PI * p)) * 8) / 8);
      showFace = p >= 0.5;
      if (p >= 1) { cd.state = 'painting'; cd.paintStart = cd.animT + RISE_DUR; }
    } else if (cd.state === 'painting') {
      var tp = cd.freePos || slots[cd.slot];
      cd.x = tp.x; cd.y = tp.y;
      showFace = true;
      if (t - cd.paintStart >= PAINT_DUR) { cd.state = 'up'; cd.drawSeq = ++seqCounter; }
    } else if (cd.state === 'up') {
      var bp = cd.freePos || slots[cd.slot];
      cd.x = bp.x + Math.sin(t * 0.5 + cd.phase) * 2.2;
      cd.y = bp.y + Math.cos(t * 0.42 + cd.phase) * 2.6;
      showFace = true;
    } else if (cd.state === 'returning') {
      var q = clamp((t - cd.animT) / RETURN_DUR, 0, 1);
      cd.x = lerp(cd.fromX, homes[cd.i].x, easeIO(q));
      cd.y = lerp(cd.fromY, homes[cd.i].y, easeIO(q));
      flip = Math.max(0.06, Math.round(Math.abs(Math.cos(Math.PI * q)) * 8) / 8);
      showFace = q < 0.5;
      if (q >= 1) {
        cd.state = 'down';
        cd.slot = -1; cd.freePos = null;
        cd.round++;
        cd.painting = makePainting(cd.species, cardSeed(cd));
        cd.x = homes[cd.i].x; cd.y = homes[cd.i].y;
      }
    } else { // down
      cd.x = homes[cd.i].x; cd.y = homes[cd.i].y;
    }

    var sc = cardW / 100 * (cd.state === 'down' ? 1 : 1.12);
    ctx.save();
    ctx.translate(cd.x, cd.y);
    ctx.scale(flip * sc, sc);
    if (showFace) drawFace(cd, t); else drawBack(cd, t);
    ctx.restore();
  }

  function draw(t) {
    tNow = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    var i, sp;
    for (i = 0; i < specks.length; i++) {
      sp = specks[i];
      ctx.globalAlpha = sp.a;
      ctx.fillStyle = sp.g ? GOLD : CREAM;
      circle(sp.x * W, sp.y * H, sp.r);
    }
    ctx.globalAlpha = 1;
    // facedown row first, then active cards, dragged card last
    for (i = 0; i < cards.length; i++) if (cards[i].state === 'down') drawCard(cards[i], t);
    for (i = 0; i < cards.length; i++) {
      if (cards[i].state !== 'down' && cards[i] !== dragCard) drawCard(cards[i], t);
    }
    if (dragCard) drawCard(dragCard, t);
  }

  // ================= interaction =================
  var dragCard = null, dragOffX = 0, dragOffY = 0, dragMoved = false;
  var tapCand = null, tapX = 0, tapY = 0, tapT = 0;
  var lastUpTapCard = null, lastUpTapT = -10;

  function evPos(e) {
    var x = 0, y = 0;
    if (e.clientX != null) { x = e.clientX; y = e.clientY; }
    else if (e.touches && e.touches[0]) { x = e.touches[0].clientX; y = e.touches[0].clientY; }
    else if (e.changedTouches && e.changedTouches[0]) { x = e.changedTouches[0].clientX; y = e.changedTouches[0].clientY; }
    if (canvas.getBoundingClientRect) {
      var r = canvas.getBoundingClientRect();
      x -= r.left; y -= r.top;
    }
    return { x: x, y: y };
  }
  function hitCard(x, y) {
    var i, cd;
    if (dragCard) return dragCard;
    for (i = cards.length - 1; i >= 0; i--) { // active cards above the row
      cd = cards[i];
      if (cd.state === 'down') continue;
      if (Math.abs(x - cd.x) <= cardW * 0.62 && Math.abs(y - cd.y) <= cardH * 0.62) return cd;
    }
    for (i = cards.length - 1; i >= 0; i--) {
      cd = cards[i];
      if (cd.state !== 'down') continue;
      if (Math.abs(x - cd.x) <= cardW / 2 + 3 && Math.abs(y - cd.y) <= cardH / 2 + 3) return cd;
    }
    return null;
  }
  function onDown(e) {
    var p = evPos(e), cd = hitCard(p.x, p.y);
    tapCand = null;
    if (!cd) return;
    if (cd.state === 'down') {
      tapCand = cd; tapX = p.x; tapY = p.y; tapT = tNow;
    } else if (cd.state === 'up') {
      if (lastUpTapCard === cd && tNow - lastUpTapT < 0.35) { // double-tap: return
        lastUpTapCard = null;
        returnCard(cd);
        return;
      }
      dragCard = cd; dragMoved = false;
      dragOffX = p.x - (cd.freePos ? cd.freePos.x : (slots[cd.slot] || cd).x || cd.x);
      dragOffY = p.y - (cd.freePos ? cd.freePos.y : (slots[cd.slot] || cd).y || cd.y);
      tapCand = cd; tapX = p.x; tapY = p.y; tapT = tNow;
    }
  }
  function onMove(e) {
    if (!dragCard) return;
    var p = evPos(e);
    if (Math.abs(p.x - tapX) > 8 || Math.abs(p.y - tapY) > 8) dragMoved = true;
    if (dragMoved) {
      var nx = clamp(p.x - dragOffX, cardW * 0.4, W - cardW * 0.4);
      var ny = clamp(p.y - dragOffY, cardH * 0.4, H - cardH * 0.4);
      dragCard.freePos = { x: nx, y: ny };
    }
  }
  function onUp(e) {
    var p = evPos(e);
    if (tapCand && tapCand.state === 'down') {
      if (Math.abs(p.x - tapX) < 10 && Math.abs(p.y - tapY) < 10 && tNow - tapT < 0.5) drawCard(tapCand);
    } else if (tapCand && tapCand.state === 'up' && !dragMoved) {
      lastUpTapCard = tapCand; lastUpTapT = tNow;
    }
    tapCand = null;
    dragCard = null;
  }
  if (typeof window !== 'undefined' && window.PointerEvent) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  } else {
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
    canvas.addEventListener('touchstart', onDown);
    canvas.addEventListener('touchmove', onMove);
    canvas.addEventListener('touchend', onUp);
  }

  // ================= resize / main loop =================
  function resize() {
    var s = viewSize();
    W = s.w; H = s.h;
    canvas.width = W; canvas.height = H;
    layout();
    draw(tNow);
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    if (window.addEventListener) window.addEventListener('resize', resize);
  }

  // QA hook (render-piece.js passes its seed argument as location.search):
  // '?seed=showfox' pre-places one fully painted card of that species in the
  // constellation centre so a forced render can verify a finished face.
  // Production loads have no query string and are unaffected.
  var seedArg = '';
  if (typeof location !== 'undefined' && location.search) {
    var m = String(location.search).match(/seed=show([a-z]+)/);
    if (m) seedArg = m[1];
  }

  resize();
  if (seedArg) {
    for (var si = 0; si < cards.length; si++) {
      if (cards[si].species === seedArg) {
        var fc = cards[si];
        fc.slot = freeSlot();
        fc.freePos = { x: W / 2, y: H * 0.3 };
        fc.state = 'up';
        fc.drawSeq = ++seqCounter;
        fc.x = fc.freePos.x; fc.y = fc.freePos.y;
        break;
      }
    }
    draw(0);
  }

  if (typeof requestAnimationFrame === 'function') {
    var startTs = null;
    var loop = function (ts) {
      if (startTs === null) startTs = ts;
      draw((ts - startTs) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
