<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiplication Mass</title>
<style>
html, body { margin: 0; padding: 0; background: #0B0A09; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0B0A09';
var PLATE = '#17140F';
var PLATE_LINE = 'rgba(200,160,106,0.55)';
var TITLE_INK = '#F2E8D8';
var HINT_INK = '#C8A06A';
var PERIOD = 60;
var FRAME_T = 10.0;
var UNIT_COUNT = 600;
var COLS = 30;
var ROWS = 20;
var TAN = '#C8A06A';
var TAN_DARK = '#9A7648';
var WHISKER = '#C9C4BB';
var BAND = '#D8D2C4';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1744);
var phaseT = FRAME_T;
/* ---- the mass: 600 units on a jittered 30 x 20 grid, each with its own
   irrational period pair and friction, so no two whiskers ever agree.
   The felt phenomenon is hundreds of unsynchronized ticking units whose
   summed pulse breathes irregularly; the band at the base is that sum. ---- */
var GOLDEN = 0.6180339887498949;
var CLUSTERS = 12;
var CLUSTER_SIZE = UNIT_COUNT / CLUSTERS;
var CLUSTER_ENV = [];
(function () {
  var c;
  for (c = 0; c < CLUSTERS; c++) {
    /* slow breathing modes, 19 to 50 s, irrational spacing: the mass
       breathes because clusters drift in and out of phase, never together */
    CLUSTER_ENV.push({
      p: 19 + 31 * ((c * GOLDEN) % 1),
      ph: TAU * ((c * GOLDEN * GOLDEN) % 1)
    });
  }
})();
var UNITS = [];
(function () {
  var i, col, row;
  for (i = 0; i < UNIT_COUNT; i++) {
    col = i % COLS;
    row = Math.floor(i / COLS);
    var g1 = (i * GOLDEN) % 1;
    var g2 = (i * GOLDEN * GOLDEN) % 1;
    var g3 = (i * 0.3819660112501051) % 1;
    UNITS.push({
      u: (col + 0.5) / COLS + (rng() - 0.5) * 0.55 / COLS,
      v: (row + 0.5) / ROWS + (rng() - 0.5) * 0.55 / ROWS,
      cluster: Math.floor(i / CLUSTER_SIZE),
      /* tick periods: irrational pairs, 2.1 to 6.8 s, never a shared beat */
      p1: 2.1 + 2.3 * g1 + 0.4 * rng(),
      p2: 2.6 + 2.1 * g2 + 0.4 * rng(),
      /* whisker rotation: one slow turn every 5 to 13 s */
      rot: 5.0 + 8.0 * g3,
      ph1: TAU * rng(),
      ph2: TAU * rng(),
      phR: TAU * rng(),
      /* friction: how fast the whisker answers its own tick, 0.5 to 1 */
      fr: 0.5 + 0.5 * rng(),
      r: 0.9 + 1.1 * rng(),
      tan: rng() < 0.72 ? TAN : TAN_DARK
    });
  }
})();
function clusterEnv(c, t) {
  var e = CLUSTER_ENV[c];
  return 0.5 + 0.5 * Math.sin(TAU * t / e.p + e.ph);
}
function unitTick(u, t) {
  /* product of two sines with irrational periods: a tick that swells and
     thins on its own schedule, never quantized to a beat */
  return Math.sin(TAU * t / u.p1 + u.ph1) * Math.sin(TAU * t / u.p2 + u.ph2);
}
function unitEnergy(u, t) {
  /* a unit's momentary energy: its tick size times its cluster's slow
     breathing envelope, so the field breathes in patches, never in unison */
  return Math.abs(unitTick(u, t)) * clusterEnv(u.cluster, t);
}
function aggregate(t) {
  /* mean unit energy, normalized by the theoretical mean of |sin*sin|,
     (2/pi)^2 = 0.4053: the emergent sum of the whole mass */
  var s = 0, i;
  for (i = 0; i < UNITS.length; i++) {
    s += unitEnergy(UNITS[i], t);
  }
  return clamp((s / UNITS.length) / 0.4053, 0, 1);
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var cell = Math.min(VW / COLS, VH / ROWS);
  var dotR = Math.max(cell * 0.085, 1.1);
  var whiskLen = cell * 0.46;
  var t = phaseT;
  var i, u, x, y, tick, ang, wl;
  /* unit marks: warm cardboard dots */
  for (i = 0; i < UNITS.length; i++) {
    u = UNITS[i];
    x = u.u * VW;
    y = u.v * VH;
    ctx.fillStyle = u.tan;
    ctx.beginPath();
    ctx.moveTo(x + dotR, y);
    ctx.arc(x, y, dotR, 0, TAU);
    ctx.fill();
  }
  /* whiskers: one batched pale-grey path, each whisker rotated by its own
     slow turn and lengthened by its own tick, friction damping the swing */
  ctx.strokeStyle = WHISKER;
  ctx.lineWidth = Math.max(cell * 0.045, 0.7);
  ctx.beginPath();
  for (i = 0; i < UNITS.length; i++) {
    u = UNITS[i];
    x = u.u * VW;
    y = u.v * VH;
    tick = unitTick(u, t);
    ang = u.phR + TAU * t / u.rot;
    wl = whiskLen * (0.45 + 0.55 * unitEnergy(u, t) * u.fr + 0.55 * (1 - u.fr) * 0.5);
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(ang) * wl, y + Math.sin(ang) * wl);
  }
  ctx.stroke();
  /* aggregate band: the emergent sum, confined to the bottom margin.
     Height and glow follow the mean tick, swelling and thinning irregularly. */
  var A = aggregate(t);
  var bandMax = VH * 0.075;
  var bandH = bandMax * (0.30 + 0.70 * A);
  var bandY = VH - bandH;
  var grad = ctx.createLinearGradient(0, bandY, 0, VH);
  grad.addColorStop(0, rgba(BAND, 0));
  grad.addColorStop(0.55, rgba(BAND, (0.05 + 0.16 * A).toFixed(4) * 1));
  grad.addColorStop(1, rgba(BAND, (0.10 + 0.28 * A).toFixed(4) * 1));
  ctx.fillStyle = grad;
  ctx.fillRect(0, bandY, VW, bandH);
  ctx.strokeStyle = rgba(BAND, (0.18 + 0.30 * A).toFixed(4) * 1);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, bandY + 0.5);
  ctx.lineTo(VW, bandY + 0.5);
  ctx.stroke();
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Multiplication Mass').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Multiplication Mass').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 21').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Multiplication Mass', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 21', plateX + 14, plateY + 7 + titlePx + 3);
  /* hint plate top-right, clear of the pulse band at the base */
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = VW - hintPlateW - 12;
  var hintPlateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    unitCount: function () { return UNITS.length; },
    aggregate: function (t) { return aggregate(t); },
    phaseT: function () { return phaseT; },
    bandAt: function (t) {
      var A = aggregate(t);
      return { A: A, bandH: VH * 0.075 * (0.30 + 0.70 * A) };
    }
  };
}
/* ---- frame one: fixed phase t = 10.0 s of the 60 second cycle ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
