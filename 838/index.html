<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Spinning Collage</title>
<style>
  html, body { margin: 0; padding: 0; background: #7FB6C9; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var COL = {
    sky: '#7FB6C9',
    pink: '#E84A8C',
    turq: '#3FD0C0',
    cream: '#F2EAD8',
    red: '#C9563E',
    ink: '#141414'
  };

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- sizing: Visual Viewport API ----------
  var W = 0, H = 0, DPR = 1;
  function resize() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }
  function isPhone() {
    var s = (typeof window !== 'undefined') ? window.screen : null;
    if (s && typeof s.width === 'number' && typeof s.height === 'number') {
      return Math.min(s.width, s.height) < 700;
    }
    return H > W * 1.15;
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }

  // ---------- piece clock (never Date.now) ----------
  var startMs = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function nowT() {
    return (typeof performance !== 'undefined' && performance.now)
      ? (performance.now() - startMs) / 1000 : 0;
  }

  // ---------- fragment generator (seeded, disc coordinates) ----------
  // Disc space: unit circle, x right, y down. A fragment has a torn polygon
  // (local verts, radius about 1), a scale in disc units, a rotation, and a
  // flat motif drawn clipped inside the polygon.
  var BASE_SEED = 838102;
  var N_FRAG = 40;

  function tornPoly(rnd, elongated) {
    var corners = 5 + Math.floor(rnd() * 3); // 5-7 corners
    var phase = rnd() * Math.PI * 2;
    var verts = [];
    var i, a, r, mx, my, mr;
    for (i = 0; i < corners; i++) {
      a = phase + (i / corners) * Math.PI * 2 + (rnd() - 0.5) * 0.22;
      r = 0.78 + rnd() * 0.34;
      verts.push([Math.cos(a) * r, Math.sin(a) * r]);
      // torn midpoint pulled inward between this corner and the next
      mx = Math.cos(a + Math.PI / corners);
      my = Math.sin(a + Math.PI / corners);
      mr = 0.60 + rnd() * 0.22;
      verts.push([mx * mr, my * mr]);
    }
    if (elongated) {
      var sx = 1.15 + rnd() * 0.35, sy = 0.55 + rnd() * 0.25;
      for (i = 0; i < verts.length; i++) verts[i] = [verts[i][0] * sx, verts[i][1] * sy];
    }
    return verts;
  }

  function pick(rnd, arr) { return arr[Math.floor(rnd() * arr.length)]; }

  function genFragments(seed) {
    var rnd = mulberry32(seed);
    var frags = [];
    var i, m, base, accent;

    // The word fragment: cream torn label in the lower-left quadrant,
    // printed upside-down (its rotation carries the extra half-turn).
    var word = {
      cx: -(0.30 + rnd() * 0.20),
      cy: 0.28 + rnd() * 0.18,
      rot: (rnd() - 0.5) * 0.16 + Math.PI,
      scale: 0.28,
      verts: [],
      motif: 'word',
      base: COL.cream,
      accent: COL.ink,
      rings: null, cols: 0, rows: 0, stripeA: 0
    };
    var hw = 1.18, hh = 0.46, jag = 0.07;
    var rect = [[-hw, -hh], [0, -hh], [hw, -hh], [hw, 0], [hw, hh], [0, hh], [-hw, hh], [-hw, 0]];
    for (i = 0; i < rect.length; i++) {
      word.verts.push([rect[i][0] + (rnd() - 0.5) * jag, rect[i][1] + (rnd() - 0.5) * jag]);
    }
    frags.push(word);

    for (i = 1; i < N_FRAG; i++) {
      var u = rnd();
      if (u < 0.22) m = 'iris';
      else if (u < 0.40) m = 'lens';
      else if (u < 0.62) m = 'grid';
      else if (u < 0.84) m = 'stripes';
      else m = 'plain';

      if (m === 'grid') base = pick(rnd, [COL.ink, COL.turq, COL.pink]);
      else if (m === 'iris') base = pick(rnd, [COL.cream, COL.pink, COL.turq]);
      else if (m === 'stripes') base = pick(rnd, [COL.cream, COL.pink, COL.turq]);
      else base = pick(rnd, [COL.pink, COL.pink, COL.turq, COL.turq, COL.cream, COL.red, COL.ink]);

      accent = pick(rnd, [COL.pink, COL.turq, COL.cream, COL.ink, COL.red]);
      if (accent === base) accent = (base === COL.ink) ? COL.cream : COL.ink;

      var ang = rnd() * Math.PI * 2;
      var rad = Math.sqrt(rnd()) * 0.74;
      frags.push({
        cx: Math.cos(ang) * rad,
        cy: Math.sin(ang) * rad,
        rot: rnd() * Math.PI * 2,
        scale: 0.13 + rnd() * 0.17,
        verts: tornPoly(rnd, rnd() < 0.35),
        motif: m,
        base: base,
        accent: accent,
        rings: [pick(rnd, [COL.ink, COL.turq, COL.pink]), pick(rnd, [COL.cream, COL.pink, COL.turq])],
        cols: 3 + Math.floor(rnd() * 3),
        rows: 3 + Math.floor(rnd() * 3),
        stripeA: rnd() * Math.PI
      });
    }
    return frags;
  }

  var reseedCount = 0;
  var frags = genFragments(BASE_SEED);

  // ---------- spin state: closed-form segments ----------
  // 'decay' segment: theta(t) = th0 + OMEGA0*dt + (v0-OMEGA0)*TAU*(1-exp(-dt/TAU))
  // 'drag' segment: theta is piecewise-linear over recorded pointer points.
  var OMEGA0 = Math.PI * 2 / 45; // resting spin: one turn in 45 s
  var TAU = 1.8;
  var segments = [{ kind: 'decay', t0: 0, th0: 0, v0: OMEGA0 }];

  function angleAt(t) {
    var seg = segments[0], i;
    for (i = 1; i < segments.length; i++) {
      if (segments[i].t0 <= t) seg = segments[i]; else break;
    }
    if (seg.kind === 'decay') {
      var dt = t - seg.t0;
      return seg.th0 + OMEGA0 * dt + (seg.v0 - OMEGA0) * TAU * (1 - Math.exp(-dt / TAU));
    }
    var pts = seg.pts;
    if (t <= pts[0].t) return pts[0].th;
    for (i = 1; i < pts.length; i++) {
      if (t <= pts[i].t) {
        var a = pts[i - 1], b = pts[i];
        if (b.t === a.t) return b.th;
        return a.th + (b.th - a.th) * ((t - a.t) / (b.t - a.t));
      }
    }
    return pts[pts.length - 1].th;
  }

  // ---------- shear state: closed form of recorded tap times ----------
  var tapTimes = [];
  var BAND_VAR = [1.0, 0.8, 1.15, 0.9, 1.05, 0.75];
  function smooth(x) { return x * x * (3 - 2 * x); }
  function shearAt(t) {
    var ts = -1, i;
    for (i = 0; i < tapTimes.length; i++) if (tapTimes[i] <= t) ts = tapTimes[i];
    if (ts < 0) return 0;
    var u = (t - ts) / 3;
    if (u >= 1) return 0;
    if (u < 0.25 / 3) return smooth(u / (0.25 / 3));
    if (u < 2.2 / 3) return 1;
    return 1 - smooth((u - 2.2 / 3) / (0.8 / 3));
  }

  // ---------- pointer: circular drag spins, tap shears, double-tap reseeds ----------
  var dragging = false, dragSeg = null, lastPtrA = 0, accum = 0;
  var downT = 0, downX = 0, downY = 0, moved = false, suppressTap = false;
  var lastTapT = -10, lastTapX = 0, lastTapY = 0;

  function evtPos(e) {
    if (e && typeof e.clientX === 'number') return { x: e.clientX, y: e.clientY };
    if (e && e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e && e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: 0, y: 0 };
  }
  function ptrAngle(p) { return Math.atan2(p.y - H / 2, p.x - W / 2); }

  function onDown(e) {
    var t = nowT(), p = evtPos(e);
    var dx = p.x - lastTapX, dy = p.y - lastTapY;
    suppressTap = false;
    if (t - lastTapT < 0.35 && (dx * dx + dy * dy) < 1600) {
      reseedCount++;
      frags = genFragments((BASE_SEED + reseedCount * 7919) | 0);
      suppressTap = true;
      lastTapT = -10;
    }
    dragging = true; moved = false; dragSeg = null;
    downT = t; downX = p.x; downY = p.y;
    lastPtrA = ptrAngle(p);
    accum = angleAt(t);
    if (e && e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var t = nowT(), p = evtPos(e);
    var ddx = p.x - downX, ddy = p.y - downY;
    if (!moved && (ddx * ddx + ddy * ddy) > 9) moved = true;
    if (moved) {
      var a = ptrAngle(p);
      var d = a - lastPtrA;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      lastPtrA = a;
      accum += d;
      if (!dragSeg) {
        dragSeg = { kind: 'drag', t0: downT, pts: [{ t: downT, th: angleAt(downT) }] };
        segments.push(dragSeg);
      }
      var last = dragSeg.pts[dragSeg.pts.length - 1];
      if (t > last.t) dragSeg.pts.push({ t: t, th: accum });
      else last.th = accum;
    }
    if (e && e.preventDefault) e.preventDefault();
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    var t = nowT();
    if (dragSeg) {
      // release velocity from the last 0.15 s of recorded points
      var pts = dragSeg.pts, v = OMEGA0, i, j = pts.length - 1;
      for (i = pts.length - 1; i >= 0; i--) {
        if (pts[i].t >= t - 0.15) j = i; else break;
      }
      if (pts.length - 1 > j && pts[pts.length - 1].t > pts[j].t) {
        v = (pts[pts.length - 1].th - pts[j].th) / (pts[pts.length - 1].t - pts[j].t);
      }
      if (v > 7) v = 7; if (v < -7) v = -7;
      segments.push({ kind: 'decay', t0: t, th0: angleAt(t), v0: v });
      dragSeg = null;
    } else if (!suppressTap && t - downT < 0.4) {
      tapTimes.push(t);
      lastTapT = t; lastTapX = downX; lastTapY = downY;
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onUp);
    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
  }

  // ---------- drawing ----------
  function polyPath(f, s) {
    var v = f.verts, i;
    ctx.beginPath();
    for (i = 0; i < v.length; i++) {
      if (i === 0) ctx.moveTo(v[i][0] * s, v[i][1] * s);
      else ctx.lineTo(v[i][0] * s, v[i][1] * s);
    }
    ctx.closePath();
  }

  function drawFragment(f, R) {
    var s = f.scale * R;
    ctx.save();
    ctx.translate(f.cx * R, f.cy * R);
    ctx.rotate(f.rot);
    polyPath(f, s);
    ctx.fillStyle = f.base;
    ctx.fill();

    ctx.save();
    polyPath(f, s);
    ctx.clip();
    var i, j;
    if (f.motif === 'stripes') {
      ctx.rotate(f.stripeA);
      var bw = s * 0.34;
      ctx.fillStyle = f.accent;
      for (i = -4; i < 4; i += 2) ctx.fillRect(i * bw, -s * 1.6, bw, s * 3.2);
    } else if (f.motif === 'grid') {
      var cw = (2 * s) / f.cols, ch = (2 * s) / f.rows;
      ctx.fillStyle = COL.cream;
      for (i = 0; i < f.cols; i++) {
        for (j = 0; j < f.rows; j++) {
          ctx.fillRect(-s + i * cw + cw * 0.16, -s + j * ch + ch * 0.16, cw * 0.68, ch * 0.68);
        }
      }
    } else if (f.motif === 'iris') {
      ctx.fillStyle = COL.ink;
      ctx.beginPath(); ctx.arc(0, 0, s * 0.92, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = f.accent;
      ctx.beginPath(); ctx.arc(0, 0, s * 0.66, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = COL.ink;
      ctx.beginPath(); ctx.arc(0, 0, s * 0.32, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = COL.cream;
      ctx.beginPath(); ctx.arc(-s * 0.12, -s * 0.12, s * 0.10, 0, Math.PI * 2); ctx.fill();
    } else if (f.motif === 'lens') {
      var radii = [0.95, 0.78, 0.60, 0.42, 0.24];
      var cols = [f.rings[0], f.rings[1], f.rings[0], f.rings[1], f.rings[0]];
      for (i = 0; i < radii.length; i++) {
        ctx.fillStyle = cols[i];
        ctx.beginPath(); ctx.arc(0, 0, s * radii[i], 0, Math.PI * 2); ctx.fill();
      }
    } else if (f.motif === 'plain') {
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = f.accent;
      polyPath(f, s * 0.55);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (f.motif === 'word') {
      ctx.fillStyle = COL.ink;
      ctx.font = '700 ' + Math.round(s * 0.42) + 'px Arial, Helvetica, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('ILLUSION', 0, s * 0.03);
    }
    ctx.restore();

    polyPath(f, s);
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = Math.max(1, s * 0.03);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawContent(cx, cy, R, angle) {
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    var i;
    for (i = 0; i < frags.length; i++) {
      if (frags[i].motif !== 'word') drawFragment(frags[i], R);
    }
    // the printed label sits on top of the collage so the word stays readable
    for (i = 0; i < frags.length; i++) {
      if (frags[i].motif === 'word') drawFragment(frags[i], R);
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    ctx.fillStyle = COL.sky;
    ctx.fillRect(0, 0, W, H);

    var phone = isPhone();
    var cx = W / 2, cy = H / 2;
    var R = Math.min(W, H) * (phone ? 0.485 : 0.47);
    var angle = angleAt(t);
    var e = shearAt(t);
    var i, j;

    // soft contact shadow (flat alpha shape, no shadowBlur)
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = COL.ink;
    ctx.beginPath(); ctx.arc(cx, cy + R * 0.03, R, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    // disc base
    ctx.fillStyle = COL.cream;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();

    if (e > 0.002) {
      var bands = BAND_VAR.length;
      var y0 = cy - R, bh = (2 * R) / bands;
      for (i = 0; i < bands; i++) {
        var dir = (i % 2 === 0) ? 1 : -1;
        var shift = e * R * 0.10 * BAND_VAR[i] * dir;
        ctx.save();
        ctx.beginPath(); ctx.rect(cx - R, y0 + i * bh - 0.5, 2 * R, bh + 1); ctx.clip();
        ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
        ctx.translate(shift, 0);
        drawContent(cx, cy, R, angle);
        ctx.restore();
      }
      ctx.globalAlpha = 0.85 * e;
      ctx.strokeStyle = COL.red;
      ctx.lineWidth = 2.5;
      for (j = 1; j < bands; j++) {
        var y = y0 + j * bh;
        var chord = Math.sqrt(Math.max(0, R * R - (y - cy) * (y - cy)));
        ctx.beginPath(); ctx.moveTo(cx - chord, y); ctx.lineTo(cx + chord, y); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else {
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.clip();
      drawContent(cx, cy, R, angle);
      ctx.restore();
    }

    // rim and spindle
    ctx.globalAlpha = 0.4;
    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = COL.ink;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.045, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COL.cream;
    ctx.beginPath(); ctx.arc(cx, cy, R * 0.018, 0, Math.PI * 2); ctx.fill();
  }

  // ---------- run ----------
  resize();
  draw(0);
  function frame() {
    draw(nowT());
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
