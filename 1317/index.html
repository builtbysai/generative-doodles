<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folded Like Paper</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #9A968C; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Drag segments: closed-form scrub state. Each segment: {t0, t1, dx}
  // (t1 null while the drag is still active). Scrub decays after release.
  var dragSegs = [];
  var curSeg = null;
  var lastX = 0;
  var pointerDown = false;

  function scrubAt(t) {
    var s = 0;
    for (var i = 0; i < dragSegs.length; i++) {
      var g = dragSegs[i];
      if (g.t1 === null) { s += g.dx; }
      else {
        var age = t - g.t1;
        if (age < 0) age = 0;
        s += g.dx * Math.exp(-age / 2.5);
      }
    }
    return s;
  }

  function pieceTime() {
    if (typeof performance !== 'undefined' && performance.now) {
      return (performance.now() - bootMs) / 1000;
    }
    return 0;
  }

  function onDown(e) {
    pointerDown = true;
    lastX = e.clientX;
    curSeg = { t0: pieceTime(), t1: null, dx: 0 };
    dragSegs.push(curSeg);
  }
  function onMove(e) {
    if (!pointerDown || !curSeg) return;
    curSeg.dx += (e.clientX - lastX);
    lastX = e.clientX;
    draw(pieceTime());
  }
  function onUp() {
    if (curSeg) curSeg.t1 = pieceTime();
    curSeg = null;
    pointerDown = false;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function size() {
    var vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    W = Math.round(vw); H = Math.round(vh);
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // Five folded steel forms. Positions are fractions of the field; sizes are
  // fractions of min(W,H). Rotations are deliberately off-axis: never 0/90.
  // Portrait phones get their own scatter so the forms stay distinct.
  function formsFor() {
    if (W >= H) {
      return [
        { x: 0.14, y: 0.50, s: 0.26, rot: 0.21, type: 'corner', par: 1.15 },
        { x: 0.34, y: 0.60, s: 0.28, rot: -0.38, type: 'dogear', par: 0.85 },
        { x: 0.55, y: 0.48, s: 0.24, rot: 0.54, type: 'halved', par: 1.30 },
        { x: 0.76, y: 0.58, s: 0.26, rot: -0.16, type: 'corner', par: 0.70 },
        { x: 0.90, y: 0.46, s: 0.22, rot: 0.83, type: 'dogear', par: 1.00 }
      ];
    }
    return [
      { x: 0.26, y: 0.48, s: 0.24, rot: 0.21, type: 'corner', par: 1.15 },
      { x: 0.72, y: 0.55, s: 0.26, rot: -0.38, type: 'dogear', par: 0.85 },
      { x: 0.30, y: 0.67, s: 0.22, rot: 0.54, type: 'halved', par: 1.30 },
      { x: 0.70, y: 0.73, s: 0.24, rot: -0.16, type: 'corner', par: 0.70 },
      { x: 0.48, y: 0.85, s: 0.22, rot: 0.83, type: 'dogear', par: 1.00 }
    ];
  }

  function poly(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }
  function fillPoly(pts, color) {
    poly(pts); ctx.fillStyle = color; ctx.fill();
  }
  function strokePoly(pts, color, w) {
    poly(pts); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
  }
  function line(x1, y1, x2, y2, color, w) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.stroke();
  }

  function drawForm(f, s, t, orbit, lightA) {
    var S = Math.min(W, H) * f.s;
    var cx = f.x * W + orbit * f.par * W * 0.045;
    var cy = f.y * H;
    // Long floor shadow: flat alpha parallelogram falling down-right,
    // direction slowly raked by the light over the loop.
    var shx = Math.cos(lightA) * S * 0.42;
    var shy = Math.abs(Math.sin(lightA)) * S * 0.30 + S * 0.22;
    var hw = S * 0.5, hh = S * 0.42;
    var body;
    if (f.type === 'corner') {
      body = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw * 0.4, hh]];
    } else if (f.type === 'halved') {
      body = [[-hw, -hh], [hw, -hh * 0.7], [hw, hh * 0.8], [-hw, hh]];
    } else {
      body = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]];
    }
    // Long floor shadow: one consistent down-right direction for all forms,
    // drawn before the body so it never points sideways.
    ctx.save();
    ctx.translate(cx + shx, cy + shy);
    ctx.rotate(f.rot * 0.25);
    fillPoly(body, 'rgba(40,36,30,0.20)');
    ctx.restore();
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(f.rot);
    // Main steel face.
    fillPoly(body, '#F5F4F0');
    strokePoly(body, '#8A867C', Math.max(1, S * 0.006));
    // Slab thickness along the bottom edge: the steel has weight, it is not paper.
    fillPoly([[-hw, hh], [hw, hh * 0.92], [hw, hh * 0.92 + S * 0.045], [-hw, hh + S * 0.045]], '#B9B6AC');
    line(-hw, hh, hw, hh * 0.92, '#8A867C', Math.max(1, S * 0.005));
    // Folded flap: a corner folded back, in fold-shadow tone.
    var foldA = 0.30 + 0.14 * Math.sin(2 * Math.PI * t / 120 + f.rot * 3);
    if (f.type === 'corner') {
      var flap = [[hw, -hh], [hw * 0.25, -hh], [hw, -hh * 0.15]];
      fillPoly(flap, 'rgba(185,182,172,' + (0.55 + foldA).toFixed(3) + ')');
      line(hw * 0.25, -hh, hw, -hh * 0.15, '#8A867C', Math.max(1, S * 0.005));
    } else if (f.type === 'dogear') {
      var ear = [[hw, -hh], [hw * 0.45, -hh], [hw, -hh * 0.30]];
      fillPoly(ear, 'rgba(185,182,172,' + (0.55 + foldA).toFixed(3) + ')');
      line(hw * 0.45, -hh, hw, -hh * 0.30, '#8A867C', Math.max(1, S * 0.005));
    } else {
      // Halved sheet: a centre seam, one panel slightly darker.
      var seam = [[-hw * 0.1, -hh], [hw * 0.05, -hh * 0.7], [hw * 0.05, hh * 0.8], [-hw * 0.1, hh]];
      fillPoly(seam, 'rgba(185,182,172,' + (0.35 + foldA * 0.5).toFixed(3) + ')');
      line(-hw * 0.1, -hh, -hw * 0.1, hh, '#8A867C', Math.max(1, S * 0.005));
    }
    ctx.restore();
  }

  function drawPhotolith(x, y, s, kind, rng) {
    var half = s / 2;
    ctx.save();
    ctx.translate(x, y);
    // Set into the floor: a shallow dark inset.
    fillPoly([[-half - 2, -half - 2], [half + 2, -half - 2], [half + 2, half + 2], [-half - 2, half + 2]], '#14120E');
    fillPoly([[-half, -half], [half, -half], [half, half], [-half, half]], '#1E1B16');
    ctx.strokeStyle = '#8A8478'; ctx.lineWidth = Math.max(1, s * 0.03);
    ctx.strokeRect(-half, -half, s, s);
    ctx.beginPath();
    if (kind === 0) {
      // A shoulder's curve dissolving into static blur: stacked arcs.
      for (var i = 0; i < 5; i++) {
        var r = s * (0.16 + i * 0.09);
        ctx.moveTo(-r, s * 0.30);
        ctx.arc(0, s * 0.30, r, Math.PI, Math.PI * 2);
      }
    } else {
      // A swirl of hair as static blur: concentric broken arcs.
      for (var j = 0; j < 6; j++) {
        var rr = s * (0.10 + j * 0.07);
        var a0 = rng() * Math.PI * 2;
        ctx.moveTo(rr * Math.cos(a0), rr * Math.sin(a0));
        ctx.arc(0, 0, rr, a0, a0 + Math.PI * (0.9 + rng() * 0.8));
      }
    }
    ctx.strokeStyle = 'rgba(138,132,120,0.85)';
    ctx.lineWidth = Math.max(1, s * 0.045);
    ctx.stroke();
    // Static speckle over the fragment.
    ctx.fillStyle = 'rgba(138,132,120,0.35)';
    for (var k = 0; k < 26; k++) {
      var px = (rng() - 0.5) * s, py = (rng() - 0.5) * s;
      ctx.fillRect(px, py, Math.max(1, s * 0.02), Math.max(1, s * 0.02));
    }
    ctx.restore();
  }

  function drawBench() {
    var bx = 0.015 * W, by = 0.78 * H;
    var bw = Math.min(W, H) * 0.20, bh = Math.min(W, H) * 0.018;
    ctx.fillStyle = '#6B4A2F';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillRect(bx + bw * 0.08, by + bh, bw * 0.05, bh * 2.2);
    ctx.fillRect(bx + bw * 0.85, by + bh, bw * 0.05, bh * 2.2);
    ctx.fillStyle = 'rgba(40,36,30,0.18)';
    ctx.fillRect(bx + bw * 0.1, by + bh * 3.2, bw * 1.15, bh * 0.5);
  }

  function draw(t) {
    if (!W || !H) size();
    var rng = mulberry32(1317000);
    // Gallery: wall above, floor below. Horizon high so all forms sit on floor.
    var horizon = H * 0.32;
    ctx.fillStyle = '#EFEDE8';
    ctx.fillRect(0, 0, W, horizon);
    ctx.fillStyle = '#9A968C';
    ctx.fillRect(0, horizon, W, H - horizon);
    // Faint wall/floor seam and floor plank seams.
    line(0, horizon, W, horizon, 'rgba(60,55,48,0.35)', 1);
    ctx.strokeStyle = 'rgba(60,55,48,0.12)';
    ctx.lineWidth = 1;
    for (var p = 1; p < 5; p++) {
      var fy = horizon + (H - horizon) * p / 5;
      ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(W, fy); ctx.stroke();
    }
    // Floor speckle, seeded and identical every frame.
    ctx.fillStyle = 'rgba(60,55,48,0.10)';
    for (var i = 0; i < 120; i++) {
      ctx.fillRect(rng() * W, horizon + rng() * (H - horizon), 2, 2);
    }
    // Orbital drift: slow 2-minute sine, plus drag scrub (closed-form).
    var orbit = 0.12 * Math.sin(2 * Math.PI * (t % 120) / 120) + scrubAt(t) * 0.0022;
    // Light rakes across the folds over the same loop.
    var lightA = 0.9 + 0.35 * Math.sin(2 * Math.PI * (t % 120) / 120);
    drawBench();
    var forms = formsFor();
    for (var f = 0; f < forms.length; f++) drawForm(forms[f], 1, t, orbit, lightA);
    // Two tiny photolithographs set low near the centre, dwarfed by steel.
    // (Portrait phones: tucked to the lower-left clear gap instead.)
    var ps = Math.min(W, H) * 0.055;
    if (W >= H) {
      drawPhotolith(W * 0.40, H * 0.82, ps, 0, rng);
      drawPhotolith(W * 0.46, H * 0.85, ps * 0.9, 1, rng);
    } else {
      drawPhotolith(W * 0.20, H * 0.92, ps, 0, rng);
      drawPhotolith(W * 0.30, H * 0.94, ps * 0.9, 1, rng);
    }
  }

  var bootMs = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function loop(now) {
    var t = (now - bootMs) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }

  function init() {
    size();
    draw(0);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { size(); draw(pieceTime()); });
  window.addEventListener('resize', function () { size(); draw(pieceTime()); });
  init();
})();
</script>
</body>
</html>
