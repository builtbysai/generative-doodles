<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.414 Pattern Walker</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FCE8D5; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.414 Pattern Walker (yeti-iglesias, EXPANSION #44).
// After Yeti Iglesias's pattern-stacked garment
// mechanism (Self-care / "Read a little relax a lot",
// Sweetemberdays26 prompt 2): a girl walks right,
// mid-stride, on peachy cream - long black hair in a
// bun, an orange polka-dot top, olive pants with pink
// stripes, an olive scalloped tote with an orange cat
// face bouncing at her shoulder, and a pink book with
// a mushroom on its cover held up in front of her.
// Autumn leaves fall around her. WATCH-ONLY, one 24s
// seamless loop: the walk is the prompt's 8 KEYFRAMES
// interpolated over a 2s stride, 12 strides per loop,
// so the loop seam is a stride seam. Patterns stay
// glued to their garments: every frame each garment
// shape is drawn on the one canvas, clipped to, and
// its pattern (polka dot grid, pants stripes) drawn
// inside the clip under that limb's own transform -
// never an offscreen pattern layer, never a pattern
// in screen space. The tote is a shoulder pendulum
// whose phase lags the stride by exactly 2 of the 8
// keyframes (a quarter stride), the prompt's 2-frame
// lag made exact. Leaves are exactly 24, a fixed
// table, each falling a whole number of field heights
// per loop with sway on whole cycles. The only
// lettering is her hand-lettered "Yeti" signature,
// STROKE PATHS only, bottom right. Frame one is drawn
// at the constant phase T = 6.75s (keyframe 3 exactly:
// mid-stride, tote mid-bounce); the clock is anchored
// there and advances in fixed 1/60 ticks, never from
// a wall clock. Flat colour only, one canvas, no
// offscreen canvas, no gradients, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Ground peachy cream; hair black; skin warm; top
// orange with pink dots; pants olive with pink
// stripes; tote olive with an orange cat face; book
// pink with an orange mushroom cap; leaves autumn
// orange and green. Nothing else.
var CREAM = '#FCE8D5';
var HAIR = '#1A1A1A', SKIN = '#D97B4F';
var ORANGE = '#F26A1B', PINK = '#FF9ECF';
var OLIVE = '#6B7A2A', TOTE = '#8A9A33';
var LEAF_O = '#E08A2E', LEAF_G = '#6BAE6B';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 24;
if (LOOP !== 24) throw new Error('Pattern Walker loop must be 24s');
var TICK = 1 / 60;
var STRIDE = 2; // seconds per stride; 12 strides per loop

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every table below
// is baked from this at load and never changes between
// frames or renders. No Math.random anywhere.
function makeRng(seedStart) {
  var s = seedStart;
  return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}

// Leaves: exactly 24 asserted. Each falls k whole
// field heights per 24s loop (the field height here
// includes the wrap margin, 984 design px), sways on
// a whole number of cycles per loop and tumbles on a
// whole number of cycles per loop, so every leaf is
// exactly home at the seam.
var FIELD_H = 984;
var rngLeaf = makeRng(41424);
var LEAVES = [];
for (var li = 0; li < 24; li++) {
  LEAVES.push({
    x: 30 + rngLeaf() * 1220,
    y0: rngLeaf() * FIELD_H,
    k: rngLeaf() < 0.5 ? 1 : 2,
    swayCyc: 2 + Math.floor(rngLeaf() * 4),
    swayAmp: 14 + rngLeaf() * 20,
    ph: rngLeaf() * Math.PI * 2,
    size: 0.7 + rngLeaf() * 0.6,
    rotCyc: 1 + Math.floor(rngLeaf() * 3),
    green: li % 3 === 2
  });
}
if (LEAVES.length !== 24) throw new Error('leaves must be exactly 24');

// Paper grain: exactly 420 fixed speckle dots over the
// whole design field, leaf-orange and olive at flat
// alpha steps, drawn last in table order.
var rngGrain = makeRng(414);
var GRAIN = [];
for (var gi = 0; gi < 420; gi++) {
  GRAIN.push({
    x: rngGrain() * DW, y: rngGrain() * DH,
    r: 0.8 + rngGrain() * 1.6,
    olive: rngGrain() < 0.5,
    a: 0.05 + Math.floor(rngGrain() * 2) * 0.04
  });
}
if (GRAIN.length !== 420) throw new Error('grain must be exactly 420');

// ---- walk keyframes ------------------------------------
// The prompt's 8 keyframes, one row per joint, sampled
// at keyframe positions 0..7 across the 2s stride and
// interpolated with a smoothstep between neighbours
// (wrapping). Angles in radians: 0 hangs straight
// down, positive swings forward (she walks right).
// Near = the leg/arm on the viewer's side.
var THIGH_N = [ 0.55,  0.40,  0.05, -0.35, -0.55, -0.40, -0.05,  0.35];
var THIGH_F = [-0.55, -0.40, -0.05,  0.35,  0.55,  0.40,  0.05, -0.35];
// Knee bend: the shin trails the thigh by this much;
// it peaks mid-swing as the leg comes through.
var SHIN_N  = [ 0.06,  0.10,  0.08,  0.20,  0.48,  0.85,  0.58,  0.22];
var SHIN_F  = [ 0.48,  0.85,  0.58,  0.22,  0.06,  0.10,  0.08,  0.20];
// Body bob: two rises per stride, one over each step.
var BOB     = [ 0, -3, -6, -3, 0, -3, -6, -3];
// Far arm counter-swings against the far leg.
var ARMF_U  = [ 0.47,  0.34,  0.04, -0.30, -0.47, -0.34, -0.04,  0.30];
var ARMF_F  = [ 0.34,  0.30,  0.28,  0.30,  0.34,  0.30,  0.28,  0.30];
// Near arm is raised, holding the book up in front; it
// counter-bobs gently against the body bob instead of
// swinging (see process.md).
var ARMN_U  = [ 0.78,  0.74,  0.70,  0.74,  0.78,  0.74,  0.70,  0.74];
var ARMN_F  = [ 1.45,  1.42,  1.40,  1.42,  1.45,  1.42,  1.40,  1.42];

function sample(table, kfPos) {
  var i = Math.floor(kfPos) % 8;
  if (i < 0) i += 8;
  var f = kfPos - Math.floor(kfPos);
  var e = f * f * (3 - 2 * f);
  return table[i] * (1 - e) + table[(i + 1) % 8] * e;
}

// ---- small drawing helpers (local design coords) -------
function ell(x, y, rx, ry, rot, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fill();
}
function ellA(x, y, rx, ry, rot, color, alpha) {
  ctx.globalAlpha = alpha;
  ell(x, y, rx, ry, rot, color);
  ctx.globalAlpha = 1;
}
function seg(x1, y1, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function poly(color, pts) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  ctx.fill();
}

// A limb segment drawn along its own direction: local
// +y is the segment axis (joint at origin), reached by
// rotate(-ang) since ang is measured from straight
// down toward forward (+x). The tapered shape is
// filled, then patternFn runs INSIDE a clip of that
// same shape, in local coords, so the pattern is glued
// to the limb wherever the limb goes.
function segment(jx, jy, ang, len, w0, w1, color, patternFn) {
  ctx.save();
  ctx.translate(jx, jy);
  ctx.rotate(-ang);
  ctx.beginPath();
  ctx.moveTo(-w0 / 2, 0);
  ctx.lineTo(w0 / 2, 0);
  ctx.lineTo(w1 / 2, len);
  ctx.lineTo(-w1 / 2, len);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  if (patternFn) {
    ctx.save();
    ctx.clip();
    patternFn(len, w0, w1);
    ctx.restore();
  }
  ctx.restore();
}
// Pants stripes: pink bands across the segment, in
// segment-local coords (only called inside the clip).
function pantsStripes(len) {
  ctx.fillStyle = PINK;
  for (var y = 16; y < len - 6; y += 30) ctx.fillRect(-40, y, 80, 8);
}
// Forward kinematics: point at angle ang (from straight
// down, positive forward), distance len from a joint.
function fk(x, y, ang, len) {
  return { x: x + len * Math.sin(ang), y: y + len * Math.cos(ang) };
}

// ---- the figure ----------------------------------------
// Hip and shoulder ride the bob; everything else is
// forward kinematics from the keyframe tables.
var HIP = { x: 640, y: 522 };
var SHOULDER = { x: 648, y: 350 };
var THIGH = 108, SHIN = 102, UARM = 82, FARM = 76;

function drawLeg(hipX, hipY, thighAng, shinBend, near) {
  var shinAng = thighAng - shinBend;
  var knee = fk(hipX, hipY, thighAng, THIGH);
  var ankle = fk(knee.x, knee.y, shinAng, SHIN - 14);
  // Pants: thigh and shin, stripes clipped inside each.
  segment(hipX, hipY, thighAng, THIGH, 48, 40, OLIVE, pantsStripes);
  segment(knee.x, knee.y, shinAng, SHIN - 14, 40, 32, OLIVE, pantsStripes);
  // Bare ankle and a black shoe, toe forward.
  var toe = fk(ankle.x, ankle.y, shinAng, 14);
  seg(ankle.x, ankle.y, toe.x, toe.y, 19, SKIN);
  ell(toe.x + 9, toe.y + 3, 21, 10, shinAng * 0.35, HAIR);
}

function drawArm(shX, shY, upAng, foreRel, near) {
  var elbow = fk(shX, shY, upAng, UARM);
  var hand = fk(elbow.x, elbow.y, upAng + foreRel, FARM);
  // Short orange sleeve over the shoulder end of the
  // upper arm, then skin.
  var slEnd = fk(shX, shY, upAng, 40);
  seg(shX, shY, slEnd.x, slEnd.y, 37, ORANGE);
  seg(slEnd.x, slEnd.y, elbow.x, elbow.y, 25, SKIN);
  seg(elbow.x, elbow.y, hand.x, hand.y, 22, SKIN);
  ell(hand.x, hand.y, 11, 11, 0, SKIN);
  return hand;
}

function drawTorso(bob) {
  // The polka-dot top: shape in body coords, dot grid
  // clipped inside it, so the dots ride the bob.
  ctx.save();
  ctx.translate(0, bob);
  ctx.beginPath();
  ctx.moveTo(610, 336);
  ctx.quadraticCurveTo(648, 322, 690, 338);
  ctx.quadraticCurveTo(700, 420, 692, 530);
  ctx.lineTo(612, 530);
  ctx.quadraticCurveTo(602, 424, 610, 336);
  ctx.closePath();
  ctx.fillStyle = ORANGE;
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = PINK;
  for (var ry = 0; ry < 6; ry++) {
    for (var rx = 0; rx < 4; rx++) {
      var dx = 606 + rx * 34 + (ry % 2) * 17;
      var dy = 348 + ry * 34;
      ctx.beginPath();
      ctx.arc(dx, dy, 7, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
  ctx.restore();
}

function drawTote(shX, shY, kfLag, bob) {
  // Shoulder pendulum at the LAGGED keyframe phase:
  // exactly 2 of the 8 keyframes behind the stride.
  // The bag hangs back-down from the shoulder at a
  // fixed offset, swung by the lagged pendulum angle,
  // so it rides at her back clear of the legs and the
  // cat face stays readable.
  var ang = 0.24 * Math.sin(2 * Math.PI * kfLag / 8 - Math.PI / 2);
  var bounce = sample(BOB, kfLag) * 0.7;
  var vx = -92, vy = 148;
  var ca = Math.cos(ang), sa = Math.sin(ang);
  var topX = shX + vx * ca - vy * sa;
  var topY = shY + vx * sa + vy * ca + bounce;
  seg(shX, shY + 4, topX, topY, 7, TOTE);
  ctx.save();
  ctx.translate(topX, topY);
  ctx.rotate(ang * 0.8);
  // Bag body with a scalloped top edge.
  ctx.beginPath();
  ctx.moveTo(-66, 0);
  for (var sc = 0; sc < 5; sc++) {
    ctx.arc(-66 + 13.2 + sc * 26.4, 0, 13.2, Math.PI, 0, false);
  }
  ctx.lineTo(66, 134);
  ctx.quadraticCurveTo(66, 148, 52, 148);
  ctx.lineTo(-52, 148);
  ctx.quadraticCurveTo(-66, 148, -66, 134);
  ctx.closePath();
  ctx.fillStyle = TOTE;
  ctx.fill();
  // The orange cat face on the bag.
  ell(0, 78, 36, 32, 0, ORANGE);
  poly(ORANGE, [-32, 60, -26, 36, -11, 53]);
  poly(ORANGE, [32, 60, 26, 36, 11, 53]);
  ell(-14, 74, 4.4, 5.8, 0, HAIR);
  ell(14, 74, 4.4, 5.8, 0, HAIR);
  ell(0, 85, 4.8, 3.6, 0, HAIR);
  seg(-28, 87, -15, 89, 2.4, HAIR);
  seg(28, 87, 15, 89, 2.4, HAIR);
  ctx.restore();
}

function drawHead(bob, lt) {
  var hx = 656, hy = 256 + bob;
  // Hair bounce: two whole bounces per stride, so the
  // period divides the loop.
  var stridePh = (lt % STRIDE) / STRIDE;
  var hairAng = 0.045 * Math.sin(2 * Math.PI * 2 * stridePh + 1.1);
  ctx.save();
  ctx.translate(646, 302 + bob);
  ctx.rotate(hairAng);
  ctx.translate(-646, -(302 + bob));
  // Long hair mass down the back.
  ell(622, 336, 58, 128, 0.12, HAIR);
  // Bun on top.
  ell(608, 192, 31, 31, 0, HAIR);
  ctx.restore();
  // Face.
  ell(hx, hy, 45, 47, 0, SKIN);
  // Hair cap over the top and back of the head.
  ctx.beginPath();
  ctx.arc(hx - 4, hy - 6, 46, Math.PI * 0.92, Math.PI * 1.98);
  ctx.lineTo(hx - 4, hy - 6);
  ctx.closePath();
  ctx.fillStyle = HAIR;
  ctx.fill();
  ell(614, 300, 13, 44, 0.10, HAIR);
  // Closed eye, smile, cheek.
  ctx.strokeStyle = HAIR; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(676, 256 + bob, 6.5, Math.PI * 1.08, Math.PI * 1.72); ctx.stroke();
  ctx.beginPath(); ctx.arc(680, 272 + bob, 6, Math.PI * 0.15, Math.PI * 0.75); ctx.stroke();
  ellA(668, 274 + bob, 8, 5.5, 0, PINK, 0.75);
}

function drawBook(hand, bob) {
  // The pink book rides the near hand, held up in
  // front; a mushroom sits on its cover.
  ctx.save();
  ctx.translate(hand.x + 26, hand.y - 22);
  ctx.rotate(-0.14);
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-46, -60, 92, 120, 8); else ctx.rect(-46, -60, 92, 120);
  ctx.fillStyle = PINK;
  ctx.fill();
  // Mushroom: orange cap, cream stem, cream spots.
  ctx.beginPath();
  ctx.arc(0, -8, 27, Math.PI, 0);
  ctx.closePath();
  ctx.fillStyle = ORANGE;
  ctx.fill();
  poly(CREAM, [-8, -8, 8, -8, 5, 22, -5, 22]);
  ell(-11, -20, 4.4, 3.4, 0, CREAM);
  ell(10, -26, 3.6, 2.8, 0, CREAM);
  ell(2, -13, 3, 2.4, 0, CREAM);
  ctx.restore();
}

// ---- leaves --------------------------------------------
function drawLeaf(lf, lt) {
  var fall = (lt / LOOP) * lf.k * FIELD_H;
  var y = ((lf.y0 + fall) % FIELD_H) - 42;
  var sway = Math.sin(2 * Math.PI * lf.swayCyc * lt / LOOP + lf.ph) * lf.swayAmp;
  var x = lf.x + sway;
  var rot = lf.ph + 2 * Math.PI * lf.rotCyc * lt / LOOP + sway * 0.012;
  var col = lf.green ? LEAF_G : LEAF_O;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(lf.size, lf.size);
  ctx.beginPath();
  ctx.moveTo(0, -15);
  ctx.quadraticCurveTo(10, -4, 0, 15);
  ctx.quadraticCurveTo(-10, -4, 0, -15);
  ctx.closePath();
  ctx.fillStyle = col;
  ctx.fill();
  seg(0, -11, 0, 12, 1.8, CREAM);
  ctx.restore();
}

// ---- signature ------------------------------------------
// Her hand-lettered "Yeti": stroke paths only, the
// same letterforms as the rest of the set (No.413).
var SIG = [
  [[0, 2], [9, 15], [18, 2]],
  [[9, 15], [7, 30], [3, 40], [-2, 44]],
  [[25, 27], [29, 15], [34, 10], [39, 12], [37, 18], [31, 20], [28, 25], [34, 27], [42, 24]],
  [[58, 0], [56, 18], [57, 29], [62, 33]],
  [[49, 12], [67, 12]],
  [[79, 11], [77, 29]],
  [[-4, 46], [35, 50], [80, 47], [104, 44]]
];
function drawSignature() {
  ctx.save();
  ctx.translate(1136, 830);
  ctx.strokeStyle = HAIR; ctx.lineWidth = 3.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (var i = 0; i < SIG.length; i++) {
    var st = SIG[i];
    ctx.beginPath();
    ctx.moveTo(st[0][0], st[0][1]);
    for (var j = 1; j < st.length; j++) ctx.lineTo(st[j][0], st[j][1]);
    ctx.stroke();
  }
  ell(80, 3, 2.4, 2.4, 0, HAIR);
  ctx.restore();
}

// ---- the scene ------------------------------------------
function drawScene(lt) {
  // Ground: flat peachy cream, everywhere including
  // the letterbox (centred fit; the page ground is the
  // piece's own ground colour).
  ctx.fillStyle = CREAM;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);

  // Leaves behind the walker.
  var i;
  for (i = 0; i < LEAVES.length; i += 2) drawLeaf(LEAVES[i], lt);

  // Keyframe position across the 2s stride.
  var kfPos = ((lt % STRIDE) / STRIDE) * 8;
  var bob = sample(BOB, kfPos);
  var hipY = HIP.y + bob;
  var shX = SHOULDER.x, shY = SHOULDER.y + bob;

  // Soft ground shadow under the feet (olive, flat
  // alpha step).
  ellA(648, 742, 150, 16, 0, OLIVE, 0.16);

  // Far side first: far leg and far arm behind the
  // torso; then the torso (polka-dot top); then the
  // tote over the torso's back edge, its strap from
  // the far shoulder; then head and hair over the
  // strap's top.
  drawLeg(HIP.x - 8, hipY, sample(THIGH_F, kfPos), sample(SHIN_F, kfPos), false);
  drawArm(shX - 12, shY + 2, sample(ARMF_U, kfPos), sample(ARMF_F, kfPos), false);
  drawTorso(bob);
  drawTote(shX - 14, shY, kfPos - 2, bob);
  drawHead(bob, lt);

  // Near leg in front of the hem, then the near arm
  // holding the book up in front.
  drawLeg(HIP.x + 8, hipY, sample(THIGH_N, kfPos), sample(SHIN_N, kfPos), true);
  var hand = drawArm(shX + 6, shY, sample(ARMN_U, kfPos), sample(ARMN_F, kfPos), true);
  drawBook(hand, bob);

  // Leaves in front of the walker.
  for (i = 1; i < LEAVES.length; i += 2) drawLeaf(LEAVES[i], lt);

  // Paper grain over everything, fixed table order.
  for (i = 0; i < GRAIN.length; i++) {
    var gd = GRAIN[i];
    ellA(gd.x, gd.y, gd.r, gd.r, 0, gd.olive ? OLIVE : LEAF_O, gd.a);
  }

  drawSignature();
}

function draw() { drawScene(T % LOOP); }

// ---- piece state ----------------------------------------
// Constant first-frame phase: T = 6.75s into the 24s
// loop. 6.75 mod 2 = 0.75, so the stride sits exactly
// on keyframe 3: the near leg is swinging back through
// passing, the far leg forward, the tote (lagging 2
// keyframes, at keyframe 1) is mid-bounce, the body
// bob is at -3. The clock advances in fixed 1/60 ticks
// from there, never from a wall clock.
var T = 6.75;
var lastNow = -1, acc = 0;

function step() { /* watch-only: no per-tick state */ }

// ---- sizing: centred fit, page ground = peachy cream ---
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
