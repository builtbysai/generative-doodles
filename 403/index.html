<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.403 Costume Triple</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#43D3A2; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.403 Costume Triple (nina-clausonet, EXPANSION #43).
// After Nina Clausonet's Wonderful Winter Week rules:
// one portrait of her white-haired closed-eye muse,
// and every deal dresses her from three lexicons at
// once - a garment, an animal, a thing. The animal
// exists ONLY as a garment print, the thing ONLY as
// an oversized prop; no animal anatomy, no text. The
// prompt's seeded-RNG picks take the house treatment:
// a FIXED AUTHORED TABLE of 6 deals, one per animal,
// in a fixed order, wrapping. Frame one is table
// entry 1, her observed deal (knitted accessory +
// jaguar + festive headband, resolved here as the
// prompt's own mapping): a jaguar-print turtleneck
// and a giant fuchsia polka-dot bow, on mint.
// DOUBLE-TAP deals the next triple with a 0.7s
// dressing wipe (old print slides off inside a
// clip-rect, new print slides on, ground swaps at the
// wipe midpoint, the new prop pops in on an
// easeOutBack bounce). DRAG tilts the portrait toward
// the pointer; on release a spring returns it to
// exactly upright. Ambient 12s loop: breathing scale
// 0.98-1.02 on one whole cycle, a serene closed-eye
// flutter at two FIXED slots (4.0s and 9.5s - her
// muse's eyes stay closed, so the blink reads as a
// lash press), and 24 snowflake sparkles drifting and
// twinkling on whole cycles of the loop. Grain is
// her heavy paper grain as DATA: exactly 700 fixed
// speckle dots drawn in table order every frame,
// never a texture or filter. Frame one is drawn at
// the constant phase T = 2.4s; the clock is anchored
// there and advances in fixed 1/60 ticks, never from
// a wall clock. Flat colour only, one canvas, no
// offscreen canvas, no gradients, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Grounds alternate per deal. The muse slots are fixed:
// cream-pink skin, white hair, ink line, red lips.
var MINT = '#43D3A2', BLUSH = '#F7D8C9';
var SKIN = '#F2C9A8', HAIR = '#FFFFFF', INK = '#2B2620';
var CREAM = '#F5EFE0';
var JAG_DARK = '#14524F', JAG_GREEN = '#0FA968';
var HOG = '#7A5233';
var MONK = '#9AA0A3', MONK_D = '#6E7276';
var FUCHSIA = '#FF2E9C', RED = '#E63329';
var WHITE = '#FFFFFF';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 12;
if (LOOP !== 12) throw new Error('Costume Triple ambient loop must be 12s');
var TICK = 1 / 60;

// ---- the fixed authored deal table ----------------------
// One entry per animal, fixed order, wrapping. animal
// names appear only in this comment and in process.md -
// nothing is labelled on screen.
var DEALS = [
  { garment: 'turtleneck', animal: 'jaguar',      thing: 'bow',     ground: MINT  },
  { garment: 'coat',       animal: 'hedgehog',    thing: 'mugs',    ground: BLUSH },
  { garment: 'shaggy',     animal: 'snow monkey', thing: 'star',    ground: MINT  },
  { garment: 'poncho',     animal: 'lama',        thing: 'bowtie',  ground: BLUSH },
  { garment: 'shawl',      animal: 'polar bear',  thing: 'cane',    ground: MINT  },
  { garment: 'skirt',      animal: 'penguin',     thing: 'card',    ground: BLUSH }
];
if (DEALS.length !== 6) throw new Error('deal table must hold exactly 6');

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every table below
// is baked from this at load and never changes between
// frames or renders. No Math.random anywhere.
var seed = 403;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// Garment interior half-width at a given y (design
// coords), used to keep print tables inside the cloth.
function clothHW(y) { return 118 + (y - 560) * 0.30; }
function inCloth(x, y, m) { return Math.abs(x - 640) < clothHW(y) - m && y > 566 && y < 892; }

// Jaguar rosettes: exactly 44 inside the cloth.
var ROSETTES = [];
while (ROSETTES.length < 44) {
  var rx = 430 + rnd() * 420, ry = 580 + rnd() * 300;
  if (!inCloth(rx, ry, 26)) continue;
  ROSETTES.push({ x: rx, y: ry, r: 9 + rnd() * 8, rot: rnd() * Math.PI, solid: ROSETTES.length % 3 === 2 });
}
if (ROSETTES.length !== 44) throw new Error('rosette count');

// Polar bear blobs on the shawl: exactly 13.
var BEARS = [];
while (BEARS.length < 13) {
  var bx = 440 + rnd() * 400, by = 590 + rnd() * 280;
  if (!inCloth(bx, by, 34)) continue;
  BEARS.push({ x: bx, y: by, r: 15 + rnd() * 8 });
}
if (BEARS.length !== 13) throw new Error('bear count');

// Penguin glyphs on the skirt: exactly 15.
var PENGUINS = [];
while (PENGUINS.length < 15) {
  var px = 400 + rnd() * 480, py = 706 + rnd() * 168;
  var phw = 150 + (py - 700) * 0.55;
  if (Math.abs(px - 640) > phw - 22) continue;
  PENGUINS.push({ x: px, y: py, s: 0.85 + rnd() * 0.4 });
}
if (PENGUINS.length !== 15) throw new Error('penguin count');

// Snowflake sparkles on the ground: exactly 24, kept
// off the portrait, each drifting and twinkling on a
// whole number of cycles per 12s loop.
var SPARKS = [];
while (SPARKS.length < 24) {
  var sx = 40 + rnd() * 1200, sy = 40 + rnd() * 820;
  if (sx > 360 && sx < 920 && sy > 110 && sy < 890) continue;
  SPARKS.push({ x: sx, y: sy, r: 7 + rnd() * 9, k: 1 + Math.floor(rnd() * 3),
                ph: rnd() * Math.PI * 2, amp: 6 + rnd() * 9, m: 1 + Math.floor(rnd() * 2) });
}
if (SPARKS.length !== 24) throw new Error('sparkle count');

// Paper grain: exactly 700 fixed speckle dots over the
// whole design field, drawn last, in this order.
var GRAIN = [];
for (var gi = 0; gi < 700; gi++) {
  GRAIN.push({ x: rnd() * DW, y: rnd() * DH, r: 0.8 + rnd() * 1.4, white: rnd() < 0.45 });
}
if (GRAIN.length !== 700) throw new Error('grain count');

// ---- small drawing helpers (local design coords) -------
function ell(x, y, rx, ry, rot, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fill();
}
function ellA(x, y, rx, ry, rot, color, alpha) {
  ctx.globalAlpha = alpha;
  ell(x, y, rx, ry, rot, color);
  ctx.globalAlpha = 1;
}
function circ(x, y, r, color) { ell(x, y, r, r, 0, color); }
function seg(x1, y1, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function segA(x1, y1, x2, y2, w, color, alpha) {
  ctx.globalAlpha = alpha;
  seg(x1, y1, x2, y2, w, color);
  ctx.globalAlpha = 1;
}
function curve(x1, y1, cx, cy, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke();
}
function curveA(x1, y1, cx, cy, x2, y2, w, color, alpha) {
  ctx.globalAlpha = alpha;
  curve(x1, y1, cx, cy, x2, y2, w, color);
  ctx.globalAlpha = 1;
}
function poly(color, pts) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  ctx.fill();
}
function polyA(color, pts, alpha) {
  ctx.globalAlpha = alpha;
  poly(color, pts);
  ctx.globalAlpha = 1;
}
function starPath(cx, cy, rO, rI, rot) {
  ctx.beginPath();
  for (var i = 0; i < 10; i++) {
    var r = i % 2 === 0 ? rO : rI;
    var a = rot + i * Math.PI / 5 - Math.PI / 2;
    var X = cx + Math.cos(a) * r, Y = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  }
  ctx.closePath();
}
function easeInOut(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
function easeOutBack(x) {
  var c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

// ---- piece state ----------------------------------------
// Constant first-frame phase: T = 2.4s into the 12s
// loop (breath near full, sparkles mid-drift, no blink
// slot, first deal fully dressed).
var T = 2.4;
var lastNow = -1, acc = 0;
var dealIdx = 0, prevIdx = -1;
var wiping = false, wipeElapsed = 0, dealClock = 10;
var WIPE_LEN = 0.7;
var tilt = 0, tiltV = 0, tiltTarget = 0;

// Optional QA probe hooks via the query string the
// house renderer passes as ?seed=... : deal=N starts
// on table entry N, wipe=1 starts mid-wipe from the
// previous entry. Deterministic; default play is
// unaffected (deal 1, at rest).
var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
var dm = /deal=(\d)/.exec(qs);
if (dm) { dealIdx = clamp(parseInt(dm[1], 10), 0, 5); dealClock = 10; }
if (/wipe=1/.test(qs) && dealIdx > 0) {
  prevIdx = dealIdx - 1; wiping = true; wipeElapsed = 0.35; dealClock = 0.35;
}

function step() {
  dealClock += TICK;
  if (wiping) {
    wipeElapsed += TICK;
    if (wipeElapsed >= WIPE_LEN) { wiping = false; prevIdx = -1; }
  }
  // Drag tilt spring; snaps to exactly upright at rest.
  tiltV += ((tiltTarget - tilt) * 130 - tiltV * 15) * TICK;
  tilt += tiltV * TICK;
  if (tiltTarget === 0 && Math.abs(tilt) < 0.0004 && Math.abs(tiltV) < 0.004) { tilt = 0; tiltV = 0; }
}

function dealNext() {
  if (wiping) return;
  prevIdx = dealIdx;
  dealIdx = (dealIdx + 1) % DEALS.length;
  wiping = true; wipeElapsed = 0; dealClock = 0;
}

// ---- the muse -------------------------------------------
function garmentPath() {
  ctx.beginPath();
  ctx.moveTo(508, 548);
  ctx.bezierCurveTo(470, 700, 420, 800, 398, 902);
  ctx.lineTo(882, 902);
  ctx.bezierCurveTo(860, 800, 810, 700, 772, 548);
  ctx.quadraticCurveTo(640, 596, 508, 548);
  ctx.closePath();
}
function ponchoPath() {
  ctx.beginPath();
  ctx.moveTo(524, 532);
  ctx.bezierCurveTo(450, 640, 380, 720, 352, 806);
  ctx.lineTo(928, 806);
  ctx.bezierCurveTo(900, 720, 830, 640, 756, 532);
  ctx.quadraticCurveTo(640, 568, 524, 532);
  ctx.closePath();
}
function skirtPath() {
  ctx.beginPath();
  ctx.moveTo(474, 672);
  ctx.bezierCurveTo(430, 790, 392, 850, 366, 902);
  ctx.lineTo(914, 902);
  ctx.bezierCurveTo(888, 850, 850, 790, 806, 672);
  ctx.quadraticCurveTo(640, 700, 474, 672);
  ctx.closePath();
}

// One garment, fully drawn (base + print clipped to
// the cloth, then its details). The animal is present
// only inside the print.
function drawGarment(idx) {
  var g = DEALS[idx].garment;
  if (g === 'turtleneck') {
    ctx.save(); garmentPath(); ctx.clip();
    ctx.fillStyle = JAG_DARK; ctx.fillRect(380, 530, 520, 380);
    for (var i = 0; i < ROSETTES.length; i++) {
      var r = ROSETTES[i];
      if (r.solid) { ell(r.x, r.y, r.r * 0.62, r.r * 0.55, r.rot, JAG_GREEN); continue; }
      for (var k = 0; k < 5; k++) {
        var a = r.rot + k * Math.PI * 2 / 5;
        ell(r.x + Math.cos(a) * r.r * 0.58, r.y + Math.sin(a) * r.r * 0.58, r.r * 0.34, r.r * 0.30, a, JAG_GREEN);
      }
      ellA(r.x, r.y, r.r * 0.30, r.r * 0.27, 0, JAG_GREEN, 0.85);
    }
    ctx.restore();
    // Turtleneck collar over the neck.
    ctx.fillStyle = JAG_DARK;
    ctx.beginPath(); ctx.rect(586, 484, 108, 86); ctx.fill();
    for (var cx = 600; cx <= 682; cx += 13) segA(cx, 492, cx, 562, 3, JAG_GREEN, 0.5);
  } else if (g === 'coat') {
    ctx.save(); garmentPath(); ctx.clip();
    ctx.fillStyle = CREAM; ctx.fillRect(380, 530, 520, 380);
    ctx.globalAlpha = 0.20; ctx.fillStyle = HOG;
    for (var vx = 388; vx < 900; vx += 74) ctx.fillRect(vx, 530, 30, 380);
    for (var hy = 566; hy < 910; hy += 74) ctx.fillRect(380, hy, 520, 30);
    ctx.globalAlpha = 1;
    // Hedgehog spikes: short strokes on a fixed grid.
    ctx.strokeStyle = HOG; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    var row = 0;
    for (var sy = 584; sy < 892; sy += 26, row++) {
      for (var sx2 = 428 + (row % 2) * 11; sx2 < 856; sx2 += 22) {
        if (!inCloth(sx2, sy, 8)) continue;
        var ang = -0.5 + ((sx2 * 7 + sy * 13) % 10) / 10 * 0.9;
        ctx.beginPath();
        ctx.moveTo(sx2, sy);
        ctx.lineTo(sx2 + Math.sin(ang) * 11, sy - Math.cos(ang) * 11);
        ctx.stroke();
      }
    }
    ctx.restore();
    // Lapels, opening, buttons.
    polyA(HOG, [638, 556, 580, 540, 596, 668, 640, 624], 0.92);
    polyA(HOG, [642, 556, 700, 540, 684, 668, 640, 624], 0.92);
    segA(640, 624, 640, 900, 3, INK, 0.30);
    circ(640, 700, 7.5, INK); circ(640, 772, 7.5, INK); circ(640, 844, 7.5, INK);
  } else if (g === 'shaggy') {
    ctx.save(); garmentPath(); ctx.clip();
    ctx.fillStyle = MONK; ctx.fillRect(380, 530, 520, 380);
    // Snow monkey shag: rows of wavy fringe strokes.
    ctx.strokeStyle = MONK_D; ctx.lineWidth = 5; ctx.lineCap = 'round';
    for (var fy = 584; fy < 884; fy += 30) {
      var hw = clothHW(fy) - 12;
      for (var fx = 640 - hw; fx < 640 + hw; fx += 17) {
        ctx.beginPath();
        ctx.moveTo(fx, fy);
        ctx.quadraticCurveTo(fx + 3, fy + 9, fx, fy + 19);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 0.5; ctx.fillStyle = MONK_D;
    ctx.fillRect(380, 856, 520, 46);
    ctx.globalAlpha = 1;
    ctx.restore();
    // Knit neck rib.
    ctx.globalAlpha = 0.55; ctx.fillStyle = MONK_D;
    ctx.beginPath(); ctx.rect(592, 494, 96, 76); ctx.fill();
    ctx.globalAlpha = 1;
    for (var nx = 604; nx <= 678; nx += 12) segA(nx, 502, nx, 562, 3, INK, 0.25);
  } else if (g === 'poncho') {
    // The lama lives in the poncho's weave: cream cloth,
    // red bands, a fringed hem.
    ctx.save(); ponchoPath(); ctx.clip();
    ctx.fillStyle = CREAM; ctx.fillRect(330, 520, 620, 300);
    ctx.fillStyle = RED; ctx.fillRect(330, 694, 620, 20);
    ctx.globalAlpha = 0.75; ctx.fillRect(330, 742, 620, 12); ctx.globalAlpha = 1;
    ctx.globalAlpha = 0.16; ctx.fillStyle = INK;
    for (var bx2 = 360; bx2 < 930; bx2 += 34) ctx.fillRect(bx2, 520, 3, 286);
    ctx.globalAlpha = 1;
    ctx.restore();
    segA(618, 552, 640, 584, 3, INK, 0.30);
    segA(662, 552, 640, 584, 3, INK, 0.30);
    for (var fx2 = 372; fx2 <= 910; fx2 += 16) {
      seg(fx2, 806, fx2, 828, 4, (Math.round((fx2 - 372) / 16) % 4 === 0) ? RED : HOG);
    }
  } else if (g === 'shawl') {
    ctx.save(); garmentPath(); ctx.clip();
    ctx.fillStyle = CREAM; ctx.fillRect(380, 530, 520, 380);
    // Polar bears: white blobs with ear bumps, sparse.
    for (var b = 0; b < BEARS.length; b++) {
      var bb = BEARS[b];
      ellA(bb.x - bb.r * 0.4, bb.y - bb.r * 0.86, bb.r * 0.34, bb.r * 0.30, 0, WHITE, 0.95);
      ellA(bb.x + bb.r * 0.4, bb.y - bb.r * 0.86, bb.r * 0.34, bb.r * 0.30, 0, WHITE, 0.95);
      ellA(bb.x, bb.y, bb.r, bb.r * 0.88, 0, WHITE, 0.95);
      ellA(bb.x, bb.y + bb.r * 0.12, bb.r * 0.16, bb.r * 0.12, 0, INK, 0.30);
    }
    // The shawl's diagonal drape over everything.
    polyA(WHITE, [540, 540, 900, 902, 756, 902, 468, 602], 0.45);
    ctx.restore();
    segA(540, 540, 812, 902, 3, INK, 0.18);
    for (var df = 0; df < 9; df++) {
      var ddx = 566 + df * 28, ddy = 592 + df * 36;
      segA(ddx, ddy, ddx + 8, ddy + 16, 3, INK, 0.20);
    }
  } else if (g === 'skirt') {
    // Plain dark top, red waistband, and the wool skirt
    // carrying the penguin print.
    ctx.save(); garmentPath(); ctx.clip();
    ctx.fillStyle = INK; ctx.fillRect(380, 530, 520, 380);
    ctx.restore();
    ctx.save(); skirtPath(); ctx.clip();
    ctx.fillStyle = CREAM; ctx.fillRect(350, 660, 580, 250);
    for (var p = 0; p < PENGUINS.length; p++) {
      var pg = PENGUINS[p];
      ell(pg.x, pg.y, 13 * pg.s, 18 * pg.s, 0, INK);
      ell(pg.x, pg.y + 4 * pg.s, 7.5 * pg.s, 11 * pg.s, 0, WHITE);
      poly(RED, [pg.x - 3.5 * pg.s, pg.y - 4 * pg.s, pg.x + 3.5 * pg.s, pg.y - 4 * pg.s, pg.x, pg.y - 0.5 * pg.s]);
    }
    ctx.restore();
    ctx.save(); garmentPath(); ctx.clip();
    ctx.fillStyle = RED; ctx.fillRect(452, 646, 376, 30);
    ctx.restore();
    segA(366, 898, 914, 898, 3, INK, 0.20);
  }
}

// One prop, drawn around its anchor with a pop scale.
function drawProp(idx, scale, alpha) {
  var thing = DEALS[idx].thing;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (thing === 'bow') {
    ctx.translate(640, 182); ctx.scale(scale, scale); ctx.translate(-640, -182);
    poly(FUCHSIA, [634, 178, 528, 116, 508, 168, 520, 216, 634, 198]);
    poly(FUCHSIA, [646, 178, 752, 116, 772, 168, 760, 216, 646, 198]);
    poly(FUCHSIA, [618, 204, 588, 262, 622, 252, 636, 210]);
    poly(FUCHSIA, [662, 204, 692, 262, 658, 252, 644, 210]);
    var dots = [[566, 152], [596, 182], [548, 190], [714, 152], [684, 182], [732, 190]];
    for (var i = 0; i < dots.length; i++) circ(dots[i][0], dots[i][1], 10, WHITE);
    circ(640, 184, 25, FUCHSIA);
    ellA(640, 184, 25, 25, 0, INK, 0.10);
  } else if (thing === 'mugs') {
    // Christmas mugs as earrings, hanging from the ears.
    var sides = [[530, -1], [750, 1]];
    for (var s2 = 0; s2 < 2; s2++) {
      var ex = sides[s2][0], dir = sides[s2][1];
      ctx.save();
      ctx.translate(ex, 366); ctx.scale(scale, scale); ctx.translate(-ex, -366);
      seg(ex, 362, ex, 378, 3, INK);
      ctx.fillStyle = RED;
      ctx.beginPath(); ctx.rect(ex - 16, 378, 32, 28); ctx.fill();
      ell(ex, 378, 16, 5, 0, CREAM);
      ctx.strokeStyle = RED; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(ex + dir * 20, 392, 8, -Math.PI / 2, Math.PI / 2, dir < 0); ctx.stroke();
      ctx.restore();
    }
  } else if (thing === 'star') {
    ctx.translate(772, 200); ctx.scale(scale, scale); ctx.translate(-772, -200);
    starPath(772, 200, 58, 24, -0.21);
    ctx.fillStyle = RED; ctx.fill();
    circ(772, 200, 7, FUCHSIA);
  } else if (thing === 'bowtie') {
    ctx.translate(640, 514); ctx.scale(scale, scale); ctx.translate(-640, -514);
    segA(592, 514, 688, 514, 10, INK, 0.85);
    poly(FUCHSIA, [634, 514, 562, 486, 562, 542]);
    poly(FUCHSIA, [646, 514, 718, 486, 718, 542]);
    ctx.fillStyle = FUCHSIA;
    ctx.beginPath(); ctx.rect(626, 498, 28, 32); ctx.fill();
    ellA(640, 514, 14, 16, 0, INK, 0.12);
  } else if (thing === 'cane') {
    ctx.translate(452, 246); ctx.rotate(-0.30); ctx.scale(scale, scale);
    ctx.lineCap = 'round';
    // A soft ink halo first, so the white stripes still
    // read against the white hair.
    ctx.globalAlpha = alpha * 0.22;
    ctx.strokeStyle = INK; ctx.lineWidth = 37;
    ctx.beginPath(); ctx.moveTo(0, 74); ctx.lineTo(0, -14);
    ctx.arc(17, -14, 17, Math.PI, 0); ctx.lineTo(34, 10);
    ctx.stroke();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = RED; ctx.lineWidth = 29;
    ctx.beginPath(); ctx.moveTo(0, 74); ctx.lineTo(0, -14);
    ctx.arc(17, -14, 17, Math.PI, 0); ctx.lineTo(34, 10);
    ctx.stroke();
    ctx.strokeStyle = WHITE; ctx.lineWidth = 30;
    ctx.setLineDash([15, 21]);
    ctx.beginPath(); ctx.moveTo(0, 74); ctx.lineTo(0, -14);
    ctx.arc(17, -14, 17, Math.PI, 0); ctx.lineTo(34, 10);
    ctx.stroke();
    ctx.setLineDash([]);
  } else if (thing === 'card') {
    ctx.translate(640, 640); ctx.rotate(-0.06); ctx.scale(scale, scale);
    ctx.fillStyle = RED;
    ctx.beginPath(); ctx.rect(-88, -60, 176, 120); ctx.fill();
    ctx.fillStyle = CREAM;
    ctx.beginPath(); ctx.rect(-72, -44, 144, 88); ctx.fill();
    starPath(0, -6, 26, 11, 0);
    ctx.fillStyle = RED; ctx.fill();
    segA(-52, 26, 52, 26, 4, INK, 0.35);
    circ(-84, 26, 16, SKIN); circ(84, 26, 16, SKIN);
  }
  ctx.restore();
}

function drawMuse(lt) {
  var groundShown = DEALS[dealIdx].ground;
  if (wiping) {
    var p0 = easeInOut(clamp(wipeElapsed / WIPE_LEN, 0, 1));
    groundShown = p0 < 0.5 ? DEALS[prevIdx].ground : DEALS[dealIdx].ground;
  }
  ctx.fillStyle = groundShown;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);
  if (document.body && document.body.style && document.body.style.background !== groundShown) {
    document.body.style.background = groundShown;
  }

  // Snowflake sparkles on the ground, whole cycles only.
  for (var i = 0; i < SPARKS.length; i++) {
    var sp = SPARKS[i];
    var sy = sp.y + Math.sin(Math.PI * 2 * sp.k * lt / LOOP + sp.ph) * sp.amp;
    var tw = 0.30 + 0.70 * Math.abs(Math.sin(Math.PI * sp.m * lt / LOOP + sp.ph * 1.7));
    ctx.save();
    ctx.globalAlpha = tw * 0.9;
    ctx.translate(sp.x, sy);
    starPath(0, 0, sp.r, sp.r * 0.30, sp.ph);
    ctx.fillStyle = WHITE; ctx.fill();
    ctx.restore();
  }

  // Portrait group: drag tilt + breathing about the base.
  var breath = 1 + 0.02 * Math.sin(Math.PI * 2 * lt / LOOP);
  ctx.save();
  ctx.translate(640, 890);
  ctx.rotate(tilt);
  ctx.scale(breath, breath);
  ctx.translate(-640, -890);

  // Hair mass behind everything.
  ell(640, 372, 252, 272, 0, HAIR);
  ell(428, 560, 62, 120, 0, HAIR);
  ell(852, 560, 62, 120, 0, HAIR);
  // Neck.
  ell(640, 528, 36, 46, 0, SKIN);
  ellA(640, 552, 30, 18, 0, INK, 0.08);

  // Garment layer, with the dressing wipe.
  if (wiping && prevIdx >= 0) {
    var p = easeInOut(clamp(wipeElapsed / WIPE_LEN, 0, 1));
    var ySplit = 470 + p * 430;
    ctx.save();
    ctx.beginPath(); ctx.rect(-300, ySplit, DW + 600, DH - ySplit + 300); ctx.clip();
    ctx.translate(0, p * 50);
    drawGarment(prevIdx);
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.rect(-300, -300, DW + 600, ySplit + 300); ctx.clip();
    ctx.translate(0, -(1 - p) * 50);
    drawGarment(dealIdx);
    ctx.restore();
  } else {
    drawGarment(dealIdx);
  }

  // Head and face.
  ell(640, 338, 110, 126, 0, SKIN);
  circ(526, 352, 15, SKIN); circ(754, 352, 15, SKIN);
  curveA(522, 344, 518, 352, 524, 360, 2.5, INK, 0.25);
  curveA(758, 344, 762, 352, 756, 360, 2.5, INK, 0.25);

  // Hair front: cap with a scalloped fringe, side locks.
  ell(498, 452, 30, 118, 0, HAIR);
  ell(782, 452, 30, 118, 0, HAIR);
  ctx.fillStyle = HAIR;
  ctx.beginPath();
  ctx.moveTo(514, 356);
  ctx.bezierCurveTo(508, 210, 560, 126, 640, 124);
  ctx.bezierCurveTo(720, 126, 772, 210, 766, 356);
  ctx.lineTo(764, 286);
  for (var f = 0; f < 7; f++) {
    var fx0 = 764 - f * 36;
    ctx.quadraticCurveTo(fx0 - 18, 302, fx0 - 36, 286);
  }
  ctx.closePath();
  ctx.fill();

  // Face features. Her eyes stay closed; at the two
  // fixed slots the lash line presses a little deeper.
  var fl = 0;
  var slots = [4.0, 9.5];
  for (var s3 = 0; s3 < 2; s3++) {
    var d = lt - slots[s3];
    if (d > 0 && d < 0.26) fl = Math.max(fl, Math.sin(Math.PI * d / 0.26));
  }
  ellA(566, 386, 20, 12, 0, RED, 0.16);
  ellA(714, 386, 20, 12, 0, RED, 0.16);
  curveA(580, 318, 596, 312, 612, 318, 4, INK, 0.55);
  curveA(668, 318, 684, 312, 700, 318, 4, INK, 0.55);
  curve(578, 342, 596, 352 + 3 * fl, 614, 342, 5 + 2.5 * fl, INK);
  curve(666, 342, 684, 352 + 3 * fl, 702, 342, 5 + 2.5 * fl, INK);
  curveA(634, 366, 640, 376, 646, 366, 3, INK, 0.5);
  ell(640, 402, 13, 6.5, 0, RED);
  segA(631, 402, 649, 402, 2, INK, 0.30);

  // Prop layer: old prop fades and drops during the
  // wipe; the new one pops in on an easeOutBack bounce.
  if (wiping && prevIdx >= 0) {
    var pw = clamp(wipeElapsed / WIPE_LEN, 0, 1);
    ctx.save();
    ctx.translate(0, pw * 26);
    drawProp(prevIdx, 1, clamp(1 - pw * 1.6, 0, 1));
    ctx.restore();
    if (wipeElapsed >= 0.30) {
      var ps = easeOutBack(clamp((wipeElapsed - 0.30) / 0.45, 0.001, 1));
      drawProp(dealIdx, Math.max(0.01, ps), clamp((wipeElapsed - 0.30) / 0.2, 0, 1));
    }
  } else if (dealClock < 0.80) {
    var ps2 = easeOutBack(clamp((dealClock - 0.30) / 0.45, 0.001, 1));
    drawProp(dealIdx, Math.max(0.01, ps2), clamp((dealClock - 0.30) / 0.2, 0, 1));
  } else {
    drawProp(dealIdx, 1, 1);
  }

  ctx.restore();

  // Paper grain over all, fixed table order.
  for (var g2 = 0; g2 < GRAIN.length; g2++) {
    var gd = GRAIN[g2];
    if (gd.white) ellA(gd.x, gd.y, gd.r, gd.r, 0, WHITE, 0.08);
    else ellA(gd.x, gd.y, gd.r, gd.r, 0, INK, 0.05);
  }
}

function draw() { drawMuse(T % LOOP); }

// ---- pointer: drag tilts, double-tap deals ---------------
// A tap is a press and release close together in design
// space. Two taps within 0.4s of the piece clock deal
// the next triple. A drag tilts the portrait toward
// the pointer and is never a tap. The piece never
// reloads.
var downX = -1, downY = -1, downT = 0, lastTapT = -10, dragging = false;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y; downT = T; dragging = false;
});
canvas.addEventListener('pointermove', function (e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  if (Math.sqrt(dx * dx + dy * dy) > 6) dragging = true;
  if (dragging) tiltTarget = clamp((p.x - 640) / 640, -1, 1) * 0.11;
});
function endPointer(e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  var moved = Math.sqrt(dx * dx + dy * dy);
  var held = T - downT;
  var wasDrag = dragging || moved >= 28;
  downX = -1; dragging = false; tiltTarget = 0;
  if (wasDrag || held >= 0.8) return;
  if (T - lastTapT < 0.4) {
    lastTapT = -10;
    dealNext();
  } else {
    lastTapT = T;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { downX = -1; dragging = false; tiltTarget = 0; });

// ---- sizing: centred fit, page ground = deal ground -----
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
