<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1924 Mouth-Clicking in the Philharmonie</title>
<style>
  html, body { margin: 0; padding: 0; background: #2a0a0c; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt. The study
  // file studies/lauren-kinsella.md does not exist in the repo, so these
  // hex values are chosen from the prompt's own color names.
  var HALL_DEEP = '#2a0a0c';  // hall ground, page ground too
  var HALL_RED = '#8f1d22';   // hall red, acoustic curve body
  var HALL_LT = '#b3272e';    // lit red, curve highlight
  var HALL_DK = '#5c1013';    // dark red, curve shadow
  var WOOD = '#a97c2f';       // wood gold, disc body
  var WOOD_LT = '#c99a4a';    // light wood gold, disc highlight
  var WOOD_DK = '#7a5a22';    // dark wood gold, disc grain
  var PINK = '#e58aa8';       // voice one, pink floral
  var SAGE = '#9caf88';       // voice two, sage
  var CREAM = '#f2e6c8';      // voice three, cream
  var SLATE = '#6e7f8a';      // voice four, slate
  var CLICK = '#ffd23f';      // click-sprites, bright childlike yellow
  var INK = '#f5ead2';        // title and hint, warm cream
  var INK_SOFT = '#d9a86c';   // date line, muted wood gold

  // Fixed-phase first frame: t = 7 s. The melody token is a quarter of
  // the way around the circle, just leaving the pink singer and heading
  // for the sage singer, with the pink singer's ornament curls still
  // open. No click-sprites yet: frame one is the hall before anyone
  // in the audience joins in. Frame one is byte-reproducible: token,
  // breath-lines and ornaments are pure functions of t, and sprites
  // only exist after a tap.
  var FIRST_T = 7;

  // Seeded PRNG, mulberry32 with seed 1924. Used only for the fixed
  // grain of the disc and the fixed jitter of sprite rim positions,
  // so every render of the same state is identical.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1924);

  // Fixed disc grain: plank seams and knots, drawn once from the seed.
  var GRAIN = [];
  (function () {
    for (var i = 0; i < 26; i++) {
      GRAIN.push({ a: rng() * Math.PI * 2, r: 0.15 + rng() * 0.8, len: 0.05 + rng() * 0.16, w: 0.6 + rng() * 1.4 });
    }
    for (var k = 0; k < 5; k++) {
      GRAIN.push({ knot: true, a: rng() * Math.PI * 2, r: 0.25 + rng() * 0.6 });
    }
  })();

  // The four voices, in order around the circle. Angles are measured
  // around the singer ellipse, starting at the top.
  var VOICES = [
    { color: PINK,  name: 'pink' },
    { color: SAGE,  name: 'sage' },
    { color: CREAM, name: 'cream' },
    { color: SLATE, name: 'slate' }
  ];
  var SINGER_ANGLE = [-Math.PI / 2, 0, Math.PI / 2, Math.PI];

  // Melody: one token passes around the circle every 16 s.
  var MELODY_PERIOD = 16;
  // Click beat: sprites click twice a second, phase-locked to the melody.
  var BEAT = 2;
  // A click-sprite lives 12 s, then falls quiet.
  var SPRITE_LIFE = 12;
  var MAX_SPRITES = 8;

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var nowT = FIRST_T;
  var sprites = [];   // { angle, born, jitter }
  var spriteSeq = 0;  // counts taps, drives the seeded rim jitter

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Disc geometry. The wooden disc fills the lower two-thirds.
  function disc() {
    return { cx: W / 2, cy: H * 0.66, rx: W * 0.47, ry: H * 0.30 };
  }
  // Singer ellipse: the circle the four singers stand on, drawn in
  // perspective on the disc.
  function singerEllipse() {
    var d = disc();
    return { cx: d.cx, cy: d.cy + H * 0.01, rx: d.rx * 0.52, ry: d.ry * 0.42 };
  }
  function ellipsePoint(e, a) {
    return { x: e.cx + Math.cos(a) * e.rx, y: e.cy + Math.sin(a) * e.ry };
  }

  // Melody token angle at time t, and which singer currently holds it.
  function tokenAngle(t) {
    var ph = ((t % MELODY_PERIOD) + MELODY_PERIOD) % MELODY_PERIOD;
    return -Math.PI / 2 + (ph / MELODY_PERIOD) * Math.PI * 2;
  }
  function holderIndex(t) {
    var a = tokenAngle(t);
    var best = 0, bestD = 1e9;
    for (var i = 0; i < 4; i++) {
      var d = Math.abs(((a - SINGER_ANGLE[i]) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI);
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  // The red acoustic curve: concentric arcs of the hall shell arcing
  // above the disc, lit from the stage.
  function drawHall(t) {
    ctx.fillStyle = HALL_DEEP;
    ctx.fillRect(0, 0, W, H);
    var d = disc();
    var glow = ctx.createRadialGradient(d.cx, d.cy, H * 0.1, d.cx, d.cy, H * 0.95);
    glow.addColorStop(0, hexA(HALL_RED, 0.55));
    glow.addColorStop(0.6, hexA(HALL_RED, 0.18));
    glow.addColorStop(1, hexA(HALL_DEEP, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    // Shell arcs, upper half only, centered on the disc.
    var arcCols = [HALL_DK, HALL_RED, HALL_LT, HALL_RED, HALL_DK];
    for (var i = 0; i < arcCols.length; i++) {
      var r = H * (0.34 + i * 0.055);
      var lw = Math.max(2, H * (0.030 - i * 0.003));
      ctx.strokeStyle = hexA(arcCols[i], a4(0.85 - i * 0.10));
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(d.cx + r, d.cy - H * 0.02);
      ctx.arc(d.cx, d.cy - H * 0.02, r, 0, Math.PI, true);
      ctx.stroke();
    }
    // Warm light washing down from the shell, breathing slowly.
    var breathe = 0.10 + 0.04 * Math.sin(t * 0.35);
    var wash = ctx.createLinearGradient(0, 0, 0, H * 0.45);
    wash.addColorStop(0, hexA(HALL_LT, a4(breathe)));
    wash.addColorStop(1, hexA(HALL_LT, 0));
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, W, H * 0.45);
  }

  // The wooden disc: gold body, plank seams and knots from the seed,
  // a darker rim, and a soft shadow beneath.
  function drawDisc(t) {
    var d = disc();
    ctx.fillStyle = hexA('#1c0608', 0.55);
    ctx.beginPath();
    ctx.moveTo(d.cx + d.rx, d.cy + H * 0.035);
    ctx.ellipse(d.cx, d.cy + H * 0.035, d.rx, d.ry, 0, 0, Math.PI * 2);
    ctx.fill();

    var wood = ctx.createRadialGradient(d.cx, d.cy - d.ry * 0.4, d.ry * 0.1, d.cx, d.cy, d.rx);
    wood.addColorStop(0, WOOD_LT);
    wood.addColorStop(0.55, WOOD);
    wood.addColorStop(1, WOOD_DK);
    ctx.fillStyle = wood;
    ctx.beginPath();
    ctx.moveTo(d.cx + d.rx, d.cy);
    ctx.ellipse(d.cx, d.cy, d.rx, d.ry, 0, 0, Math.PI * 2);
    ctx.fill();

    // Plank seams: short arcs along the grain, fixed by the seed.
    ctx.lineCap = 'round';
    for (var i = 0; i < GRAIN.length; i++) {
      var g = GRAIN[i];
      if (g.knot) {
        var kp = { x: d.cx + Math.cos(g.a) * d.rx * g.r, y: d.cy + Math.sin(g.a) * d.ry * g.r };
        ctx.strokeStyle = hexA(WOOD_DK, 0.32);
        ctx.lineWidth = Math.max(1, H * 0.0016);
        ctx.beginPath();
        ctx.moveTo(kp.x + H * 0.009, kp.y);
        ctx.arc(kp.x, kp.y, H * 0.009, 0, Math.PI * 2);
        ctx.stroke();
        continue;
      }
      var gx = d.cx + Math.cos(g.a) * d.rx * g.r;
      var gy = d.cy + Math.sin(g.a) * d.ry * g.r;
      ctx.strokeStyle = hexA(WOOD_DK, a4(0.28));
      ctx.lineWidth = Math.max(0.8, H * 0.0016);
      ctx.beginPath();
      ctx.moveTo(gx - d.rx * g.len / 2, gy);
      ctx.lineTo(gx + d.rx * g.len / 2, gy);
      ctx.stroke();
    }

    // Rim: a darker gold ring so the disc reads as a raised platform.
    ctx.strokeStyle = hexA(WOOD_DK, 0.9);
    ctx.lineWidth = Math.max(2, H * 0.006);
    ctx.beginPath();
    ctx.moveTo(d.cx + d.rx, d.cy);
    ctx.ellipse(d.cx, d.cy, d.rx, d.ry, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = hexA(WOOD_LT, 0.45);
    ctx.lineWidth = Math.max(1, H * 0.002);
    ctx.beginPath();
    ctx.moveTo(d.cx + d.rx * 0.97, d.cy);
    ctx.ellipse(d.cx, d.cy, d.rx * 0.97, d.ry * 0.94, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  // One singer: a small robed figure in their voice color, standing on
  // the singer ellipse and facing the center. Head, shoulders, robe.
  function drawSinger(i, t) {
    var e = singerEllipse();
    var p = ellipsePoint(e, SINGER_ANGLE[i]);
    var v = VOICES[i];
    var u = Math.min(W, H);
    var headR = u * 0.021;
    var sway = Math.sin(t * 0.5 + i * 1.7) * u * 0.003;
    var px = p.x + sway;
    var py = p.y;

    // Shadow on the disc.
    ctx.fillStyle = hexA('#3a2408', 0.35);
    ctx.beginPath();
    ctx.moveTo(px + u * 0.030, py + u * 0.012);
    ctx.ellipse(px, py + u * 0.012, u * 0.030, u * 0.009, 0, 0, Math.PI * 2);
    ctx.fill();

    // Robe: a trapezoid widening to the disc.
    var robeH = u * 0.085;
    ctx.fillStyle = v.color;
    ctx.beginPath();
    ctx.moveTo(px - u * 0.012, py - u * 0.018);
    ctx.lineTo(px + u * 0.012, py - u * 0.018);
    ctx.lineTo(px + u * 0.026, py + robeH * 0.28);
    ctx.lineTo(px - u * 0.026, py + robeH * 0.28);
    ctx.closePath();
    ctx.fill();
    // Robe hem line.
    ctx.strokeStyle = hexA('#2a0a0c', 0.35);
    ctx.lineWidth = Math.max(1, u * 0.002);
    ctx.beginPath();
    ctx.moveTo(px - u * 0.026, py + robeH * 0.28);
    ctx.lineTo(px + u * 0.026, py + robeH * 0.28);
    ctx.stroke();

    // Shoulders and head.
    ctx.fillStyle = v.color;
    ctx.beginPath();
    ctx.moveTo(px + u * 0.016, py - u * 0.014);
    ctx.arc(px, py - u * 0.014, u * 0.016, 0, Math.PI, true);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(px + headR, py - u * 0.038);
    ctx.arc(px, py - u * 0.038, headR, 0, Math.PI * 2);
    ctx.fill();
    // Hair: a dark cap on the head.
    ctx.fillStyle = hexA('#2a0a0c', 0.8);
    ctx.beginPath();
    ctx.moveTo(px + headR, py - u * 0.040);
    ctx.arc(px, py - u * 0.040, headR * 0.92, Math.PI * 1.05, Math.PI * 1.95);
    ctx.closePath();
    ctx.fill();
    // Open mouth: the voice leaving the singer.
    ctx.fillStyle = '#2a0a0c';
    ctx.beginPath();
    ctx.moveTo(px + headR * 0.28, py - u * 0.032);
    ctx.arc(px, py - u * 0.032, headR * 0.20, 0, Math.PI * 2);
    ctx.fill();
  }

  // Breath-lines: the melody path drawn as four arcs between the
  // singers, each in the color of the singer it leaves. The arc the
  // token is travelling glows, and the singer holding the token grows
  // ornament curls above their head.
  function drawBreath(t) {
    var e = singerEllipse();
    var a = tokenAngle(t);
    var holder = holderIndex(t);
    var u = Math.min(W, H);

    // The full circle path, faint, in warm cream.
    ctx.strokeStyle = hexA(CREAM, 0.22);
    ctx.lineWidth = Math.max(1, u * 0.002);
    ctx.beginPath();
    ctx.moveTo(e.cx + e.rx, e.cy);
    ctx.ellipse(e.cx, e.cy, e.rx, e.ry, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Active arc: from the previous singer to the next, in the
    // holder's color, brighter where the token is.
    var prev = (holder + 3) % 4;
    var a0 = SINGER_ANGLE[prev];
    var a1 = SINGER_ANGLE[holder];
    // Travel direction is increasing angle; the token is between the
    // previous singer and the holder when it approaches the holder.
    ctx.strokeStyle = hexA(VOICES[holder].color, 0.85);
    ctx.lineWidth = Math.max(1.6, u * 0.0035);
    ctx.lineCap = 'round';
    ctx.beginPath();
    var steps = 24;
    for (var s = 0; s <= steps; s++) {
      var aa = a0 + ((a1 - a0 + Math.PI * 2) % (Math.PI * 2)) * (s / steps);
      var p = ellipsePoint(e, aa);
      if (s === 0) { ctx.moveTo(p.x, p.y); } else { ctx.lineTo(p.x, p.y); }
    }
    ctx.stroke();

    // Melody token: a glowing dot with a short trailing arc.
    var tp = ellipsePoint(e, a);
    ctx.strokeStyle = hexA(VOICES[holder].color, 0.5);
    ctx.lineWidth = Math.max(1.2, u * 0.0026);
    ctx.beginPath();
    for (var q = 0; q <= 10; q++) {
      var ta = a - (q / 10) * 0.35;
      var pp = ellipsePoint(e, ta);
      if (q === 0) { ctx.moveTo(pp.x, pp.y); } else { ctx.lineTo(pp.x, pp.y); }
    }
    ctx.stroke();
    var tr = u * 0.011;
    ctx.fillStyle = hexA(VOICES[holder].color, 0.95);
    ctx.beginPath();
    ctx.moveTo(tp.x + tr, tp.y);
    ctx.arc(tp.x, tp.y, tr, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = hexA('#ffffff', 0.85);
    ctx.beginPath();
    ctx.moveTo(tp.x + tr * 0.4, tp.y);
    ctx.arc(tp.x, tp.y, tr * 0.4, 0, Math.PI * 2);
    ctx.fill();

    // Ornament curls above the holder's head: three small spirals
    // that open as the token arrives and close as it leaves.
    var hp = ellipsePoint(e, SINGER_ANGLE[holder]);
    var hold = 1 - Math.abs(((a - SINGER_ANGLE[holder]) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI) / (Math.PI / 2);
    hold = clamp(hold, 0, 1);
    var curlR = u * 0.016 * (0.4 + 0.6 * hold);
    ctx.strokeStyle = hexA(VOICES[holder].color, a4(0.35 + 0.55 * hold));
    ctx.lineWidth = Math.max(1.2, u * 0.0024);
    ctx.lineCap = 'round';
    for (var c = -1; c <= 1; c++) {
      var cxp = hp.x + c * u * 0.038;
      var cyp = hp.y - u * 0.062 - Math.abs(c) * u * 0.010;
      ctx.beginPath();
      for (var k = 0; k <= 12; k++) {
        var ka = (k / 12) * Math.PI * 1.6;
        var kr = curlR * (1 - k / 12 * 0.55);
        var xx = cxp + Math.cos(ka) * kr;
        var yy = cyp + Math.sin(ka) * kr - (k / 12) * u * 0.008;
        if (k === 0) { ctx.moveTo(xx, yy); } else { ctx.lineTo(xx, yy); }
      }
      ctx.stroke();
    }
  }

  // Click-sprites: small yellow percussion sprites along the rim.
  // Each clicks on the beat, phase-locked to the melody, and fades
  // out over its last three seconds. Capped at eight so the four
  // voices always lead.
  function drawSprites(t) {
    var d = disc();
    var u = Math.min(W, H);
    for (var i = 0; i < sprites.length; i++) {
      var s = sprites[i];
      var age = t - s.born;
      if (age < 0 || age > SPRITE_LIFE) { continue; }
      var fade = age > SPRITE_LIFE - 3 ? (SPRITE_LIFE - age) / 3 : 1;
      var p = {
        x: d.cx + Math.cos(s.angle) * d.rx * 0.985,
        y: d.cy + Math.sin(s.angle) * d.ry * 0.985 + s.jitter
      };
      // Click pulse: bright on the beat, dim between.
      var beatPh = ((t % BEAT) + BEAT) % BEAT;
      var pulse = 0.55 + 0.45 * Math.cos((beatPh / BEAT) * Math.PI * 2);
      var r = u * 0.010 * (0.8 + 0.4 * pulse);
      ctx.fillStyle = hexA(CLICK, a4(0.9 * fade));
      ctx.beginPath();
      ctx.moveTo(p.x + r, p.y);
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
      // Tick rays on the beat.
      ctx.strokeStyle = hexA(CLICK, a4(0.75 * pulse * fade));
      ctx.lineWidth = Math.max(1, u * 0.002);
      ctx.lineCap = 'round';
      for (var k = 0; k < 4; k++) {
        var ra = k * Math.PI / 2 + Math.PI / 4;
        var r0 = r * 1.5, r1 = r * (2.1 + 0.5 * pulse);
        ctx.beginPath();
        ctx.moveTo(p.x + Math.cos(ra) * r0, p.y + Math.sin(ra) * r0);
        ctx.lineTo(p.x + Math.cos(ra) * r1, p.y + Math.sin(ra) * r1);
        ctx.stroke();
      }
      // A soft glow ring when the click lands.
      if (pulse > 0.9) {
        ctx.strokeStyle = hexA(CLICK, a4(0.35 * fade));
        ctx.lineWidth = Math.max(1, u * 0.0016);
        ctx.beginPath();
        ctx.moveTo(p.x + r * 2.6, p.y);
        ctx.arc(p.x, p.y, r * 2.6, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    drawHall(t);
    drawDisc(t);

    // Warmth: each click-sprite warms the hall a little.
    var live = 0;
    for (var i = 0; i < sprites.length; i++) {
      if (t - sprites[i].born >= 0 && t - sprites[i].born <= SPRITE_LIFE) { live++; }
    }
    if (live > 0) {
      ctx.fillStyle = hexA('#e8a33d', a4(0.028 * live));
      ctx.fillRect(0, 0, W, H);
    }

    // Singers behind the breath-lines, then the token and ornaments.
    for (var s = 0; s < 4; s++) { drawSinger(s, t); }
    drawBreath(t);
    drawSprites(t);

    // Title plate, top-left.
    var fs1 = Math.round((isPhone ? 19 : 20) * clamp(W / 460, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    var title = 'Mouth-Clicking in the Philharmonie';
    if (ctx.measureText(title).width > W - 36) {
      ctx.font = '600 ' + Math.round(fs1 * 0.85) + 'px Georgia, "Times New Roman", serif';
    }
    ctx.fillText(title, 18, 34);
    ctx.fillStyle = INK_SOFT;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1924 · 2007 · 04 · 19', 18, 34 + fs2 + 8);

    // Hint, centered at the bottom.
    ctx.fillStyle = hexA(INK, 0.92);
    ctx.textAlign = 'center';
    var hint = 'Tap to add a mouth-clicking voice.';
    ctx.font = Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(hint, W / 2, H - 20);
    ctx.textAlign = 'left';
  }

  // Tap anywhere: a mouth-clicking voice joins the rim. The tap is an
  // audience member joining in, never a reload. Sprites are capped at
  // eight so the four voices always lead.
  function onTap(ev) {
    var x = 0, y = 0;
    try {
      if (ev && typeof ev.clientX === 'number') { x = ev.clientX; y = ev.clientY; }
    } catch (e) {}
    var d = disc();
    var ang = Math.atan2((y - d.cy) / Math.max(1, d.ry), (x - d.cx) / Math.max(1, d.rx));
    spriteSeq++;
    var jitRng = mulberry32(1924 + spriteSeq * 7919);
    var jitter = (jitRng() - 0.5) * H * 0.02;
    sprites.push({ angle: ang, born: nowT, jitter: jitter });
    while (sprites.length > MAX_SPRITES) { sprites.shift(); }
    draw(nowT);
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onTap);
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(nowT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(nowT); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Tap only: no audio, no click-to-reload. All motion runs at or under
  // 0.5 Hz, well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      nowT = FIRST_T + (now - start) / 1000;
      draw(nowT);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
