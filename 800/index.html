<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ring</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #E8E5DD; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // The Ring (Olivier Mosset, EXPANSION #98 PP1).
  // One square enamel canvas, one black ring outline, drawn by a filing cabinet.
  // Loop: 30 s. Draw-on 0-6 s, hold 6-24 s (sheen sweeps), fade 24-30 s.
  // Frame one is phased to loop t = 15 s: ring fully drawn, holding, sheen mid-canvas.

  var LOOP = 30;
  var DRAW_END = 6;
  var HOLD_END = 24;
  var PHASE = 15; // frame-one loop phase: mid-hold, sheen mid-canvas

  var CANVAS_TONE = "#F4F2EC";
  var RING_TONE = "#141414";
  var SURROUND = "#E8E5DD"; // whisper-darker than the canvas, same family

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function viewSize() {
    var w, h;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    } else {
      w = window.innerWidth;
      h = window.innerHeight;
    }
    return { w: w, h: h };
  }

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    var s = viewSize();
    return s.h > s.w * 1.15;
  }

  // Per-cycle jitter: seeded by cycle index so every cycle differs slightly
  // and every cycle is reproducible. Center drift +-1% of canvas side,
  // radius +-0.5%, wobble phase and harmonic seeded.
  function cycleParams(cycle) {
    var rnd = mulberry32(800100 + cycle * 7919);
    return {
      dx: (rnd() * 2 - 1) * 0.01,
      dy: (rnd() * 2 - 1) * 0.01,
      dr: (rnd() * 2 - 1) * 0.005,
      wobPhase: rnd() * Math.PI * 2,
      wobHarm: 3 + Math.floor(rnd() * 2) // 3 or 4 lobes, low frequency
    };
  }

  function draw(loopT) {
    var s = viewSize();
    var w = s.w, h = s.h;
    canvas.width = Math.max(1, Math.round(w));
    canvas.height = Math.max(1, Math.round(h));
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";

    // Surround: the gallery wall the square hangs on.
    ctx.fillStyle = SURROUND;
    ctx.fillRect(0, 0, w, h);

    // The square canvas: fits the smaller dimension, centered.
    var side = Math.min(w, h) * (isPhone() ? 0.92 : 0.94);
    var ox = (w - side) / 2;
    var oy = (h - side) / 2;

    ctx.fillStyle = CANVAS_TONE;
    ctx.fillRect(ox, oy, side, side);

    // Hairline so the canvas edge stays just perceptible against the surround.
    ctx.strokeStyle = "rgba(20,20,20,0.10)";
    ctx.lineWidth = 1;
    ctx.strokeRect(ox + 0.5, oy + 0.5, side - 1, side - 1);

    var cycle = Math.floor(loopT / LOOP);
    var t = loopT - cycle * LOOP;
    var p = cycleParams(cycle);

    // Ring state for this loop phase.
    var sweep;      // arc fraction drawn, 0..1
    var widthFrac;  // stroke width fraction of full, 0..1
    var alpha = 1;
    if (t < DRAW_END) {
      var u = t / DRAW_END;
      var e = 1 - Math.pow(1 - u, 3); // ease-out: brisk start, administrative settle
      sweep = e;
      widthFrac = 0.18 + 0.82 * e;
    } else if (t < HOLD_END) {
      sweep = 1;
      widthFrac = 1;
    } else {
      var v = (t - HOLD_END) / (LOOP - HOLD_END);
      sweep = 1;
      widthFrac = 1;
      alpha = 1 - v;
    }

    // Sheen: a diagonal band of layered flat-alpha white sweeping the enamel.
    // Position is a pure function of loop phase; it crosses the canvas once
    // per loop, centred near mid-hold so frame one catches it mid-canvas.
    var sheenC = (t / LOOP) * 2.4 - 0.7; // diagonal coordinate of band centre
    ctx.save();
    ctx.beginPath();
    ctx.rect(ox, oy, side, side);
    ctx.clip();
    var bandWidths = [0.46, 0.34, 0.24, 0.15, 0.07];
    var bandAlphas = [0.020, 0.032, 0.048, 0.070, 0.095];
    ctx.fillStyle = "#FFFFFF";
    for (var b = 0; b < bandWidths.length; b++) {
      var bw = bandWidths[b] * side;
      var cx = ox + (sheenC - bw / (2 * side)) * side;
      ctx.globalAlpha = bandAlphas[b];
      ctx.beginPath();
      // Diagonal band: a parallelogram slanting at 35 degrees.
      var slant = side * 0.7;
      ctx.moveTo(cx, oy + side);
      ctx.lineTo(cx + bw, oy + side);
      ctx.lineTo(cx + bw + slant, oy);
      ctx.lineTo(cx + slant, oy);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // The ring: a stroked outline, never a disc. Built as small arc segments
    // so a low-frequency edge wobble (0.3% of side) can live in the radius.
    if (sweep > 0 && alpha > 0) {
      var cxr = ox + side / 2 + p.dx * side;
      var cyr = oy + side / 2 + p.dy * side;
      var R = side * 0.5 * 0.66 * (1 + p.dr); // ring radius: motif inside the square
      var fullStroke = side * 0.033;
      var wobbleAmp = side * 0.003;
      var startA = -Math.PI / 2; // top, sweeping clockwise
      var totalA = Math.PI * 2 * sweep;
      var steps = Math.max(8, Math.floor(160 * sweep));
      ctx.strokeStyle = RING_TONE;
      ctx.globalAlpha = alpha;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = Math.max(0.6, fullStroke * widthFrac);
      ctx.beginPath();
      for (var i = 0; i <= steps; i++) {
        var a = startA + (totalA * i) / steps;
        var rr = R + Math.sin(a * p.wobHarm + p.wobPhase) * wobbleAmp;
        var x = cxr + Math.cos(a) * rr;
        var y = cyr + Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  var startStamp = null;
  function frame(now) {
    if (startStamp === null) startStamp = now;
    var elapsed = (now - startStamp) / 1000;
    draw(PHASE + elapsed);
    if (typeof requestAnimationFrame === "function") {
      requestAnimationFrame(frame);
    }
  }

  function redrawStatic() {
    draw(PHASE);
  }

  function onResize() { redrawStatic(); }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener("resize", onResize);
  }
  window.addEventListener("resize", onResize);

  // Synchronous first frame at the fixed phase: the determinism gate.
  draw(PHASE);
  if (typeof requestAnimationFrame === "function") {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
