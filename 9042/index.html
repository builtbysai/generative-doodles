<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9042 · Frost</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #e9e2d0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; cursor: pointer; }
  .cap {
    position: fixed; left: 18px; bottom: 14px; pointer-events: none;
    color: #6b6250; font: italic 12.5px/1.5 Georgia, serif; opacity: 0.85;
  }
  .cap b { color: #3d382c; font-weight: normal; font-style: normal; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap"><b>№9042 · Frost</b>, first frost on the pane, click for another morning</div>
<script>
'use strict';
/*
  Frost: dendritic crystals growing inward from the corners of the print,
  the way a real windowpane frosts on a winter morning. Branching near
  sixty degrees, tapering to hairlines, feather ticks along the stems.
  The middle of the pane stays empty. That emptiness is the piece too.
*/

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const seed = parseInt(new URLSearchParams(location.search).get('seed') || '777001', 10) || 777001;
let rand = mulberry32(seed);

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const U = 1000; // virtual units, viewport-invariant

function fit() {
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  const s = Math.min(window.innerWidth, window.innerHeight) * 0.94;
  cv.width = s * DPR; cv.height = s * DPR;
  cv.style.width = s + 'px'; cv.style.height = s + 'px';
  ctx.setTransform(cv.width / U, 0, 0, cv.width / U, 0, 0);
}
window.addEventListener('resize', () => { fit(); draw(); });

// value noise for organic wobble
function makeNoise(r) {
  const p = new Array(256);
  for (let i = 0; i < 256; i++) p[i] = r();
  return function (x) {
    const xi = Math.floor(x), xf = x - xi;
    const a = p[xi & 255], b = p[(xi + 1) & 255];
    const u = xf * xf * (3 - 2 * xf);
    return a + (b - a) * u;
  };
}

const INK = [46, 74, 94]; // ink-blue, monochrome discipline

function draw() {
  rand = mulberry32(seed);
  const noise = makeNoise(rand);
  const R = (a, b) => a + rand() * (b - a);

  // ---- paper ----
  const paper = ctx.createLinearGradient(0, 0, U, U);
  paper.addColorStop(0, '#f3eee1');
  paper.addColorStop(0.6, '#efe8d6');
  paper.addColorStop(1, '#e9e1cc');
  ctx.fillStyle = paper;
  ctx.fillRect(0, 0, U, U);

  // print area with margins
  const MX = 90, MY = 90, PW = U - 2 * MX, PH = U - 2 * MY;
  const CX = U / 2, CY = U / 2;
  const breathe = R(185, 230); // breathing zone radius: crystals never enter

  // segments: {x1,y1,x2,y2,w,alpha}
  const segs = [];
  const inPrint = (x, y) => x > MX + 6 && x < MX + PW - 6 && y > MY + 6 && y < MY + PH - 6;
  const inBreathe = (x, y) => Math.hypot(x - CX, y - CY) < breathe;

  function stroke(x1, y1, x2, y2, w, alpha) {
    segs.push({ x1, y1, x2, y2, w, alpha });
  }

  // recursive dendrite: a fern frond. One wandering rib throwing dense
  // side branchlets near sixty degrees, each with its own sub-branchlets,
  // feather ticks everywhere. Frost grows fairly straight along the
  // thermal gradient; the wobble is gentle and mean-reverting.
  function grow(x, y, angle, len, w0, w1, depth, nSeed) {
    const stepLen = 7;
    const steps = Math.max(2, Math.floor(len / stepLen));
    const a0 = angle; // fronds remember their heading
    let w = w0;
    const wStep = (w0 - w1) / steps;
    for (let s = 0; s < steps; s++) {
      if (!inPrint(x, y) || inBreathe(x, y)) return;
      const nx = noise(nSeed + s * 0.31), ny = noise(nSeed + 500 + s * 0.31);
      angle += (nx - 0.5) * 0.2 + (ny - 0.5) * 0.09;
      // mean reversion: wander, but never stray far from the heading
      const dev = angle - a0;
      if (dev > 0.7) angle = a0 + 0.7; else if (dev < -0.7) angle = a0 - 0.7;
      const x2 = x + Math.cos(angle) * stepLen;
      const y2 = y + Math.sin(angle) * stepLen;
      if (!inPrint(x2, y2) || inBreathe(x2, y2)) return;
      const alpha = 0.5 + rand() * 0.3;
      stroke(x, y, x2, y2, w, alpha);
      // side branchlet, frost angles near sixty degrees
      if (depth < 3 && rand() < [0.34, 0.26, 0.16][depth]) {
        const side = rand() < 0.5 ? 1 : -1;
        const spread = (52 + rand() * 16) * Math.PI / 180;
        const clen = len * R(0.25, 0.45);
        grow(x2, y2, angle + side * spread, clen, w * 0.5, 0.5, depth + 1, nSeed + s * 7.3 + 91);
      }
      // feather ticks: hairline barbs along the rib, the feathery part
      if (depth < 2 && s % 2 === 1 && rand() < 0.8) {
        const side = rand() < 0.5 ? 1 : -1;
        const ta = angle + side * (58 + rand() * 10) * Math.PI / 180;
        const tl = R(8, 18) * (1 - depth * 0.25);
        const tx = x2 + Math.cos(ta) * tl, ty = y2 + Math.sin(ta) * tl;
        if (inPrint(tx, ty) && !inBreathe(tx, ty)) {
          stroke(x2, y2, tx, ty, 0.5, 0.45 + rand() * 0.25);
        }
      }
      x = x2; y = y2; w -= wStep;
    }
  }

  // corner crystal: a few long fern fronds fanning from the corner,
  // dense near the corner, dissolving outward
  function corner(cx, cy, diagAngle) {
    const fronds = 2 + Math.floor(rand() * 2); // 2 or 3
    for (let i = 0; i < fronds; i++) {
      const fan = (i / Math.max(1, fronds - 1) - 0.5) * 2 * R(20, 30) * Math.PI / 180;
      const a = diagAngle + fan;
      const len = R(320, 440);
      grow(cx, cy, a, len, R(2.8, 3.6), 0.8, 0, rand() * 1000);
    }
  }

  // choose two or three corners (roots inset just inside the print area)
  const corners = [
    { x: MX + 12, y: MY + 12, a: Math.PI / 4 },
    { x: MX + PW - 12, y: MY + 12, a: 3 * Math.PI / 4 },
    { x: MX + 12, y: MY + PH - 12, a: -Math.PI / 4 },
    { x: MX + PW - 12, y: MY + PH - 12, a: -3 * Math.PI / 4 }
  ];
  // shuffle, take 2 or 3
  for (let i = corners.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    const t = corners[i]; corners[i] = corners[j]; corners[j] = t;
  }
  const nC = rand() < 0.62 ? 3 : 2;
  for (let i = 0; i < nC; i++) corner(corners[i].x, corners[i].y, corners[i].a);

  // a few lone frost feathers for air: single small fronds,
  // kept clear of the breathing middle
  const loners = 2 + Math.floor(rand() * 2);
  for (let i = 0; i < loners; i++) {
    let lx, ly, tries = 0;
    do {
      lx = R(MX + 60, MX + PW - 60);
      ly = R(MY + 60, MY + PH - 60);
      tries++;
    } while (Math.hypot(lx - CX, ly - CY) < breathe + 90 && tries < 40);
    grow(lx, ly, rand() * Math.PI * 2, R(60, 110), R(1.4, 1.8), 0.5, 0, rand() * 1000);
  }

  // ---- paint the frost ----
  ctx.lineCap = 'round';
  for (const s of segs) {
    ctx.strokeStyle = 'rgba(' + INK[0] + ',' + INK[1] + ',' + INK[2] + ',' + s.alpha.toFixed(3) + ')';
    ctx.lineWidth = Math.max(0.45, s.w);
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();
  }

  // ---- wobbly plate frame ----
  ctx.strokeStyle = 'rgba(70,62,50,0.55)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const fr = 64, fw = 40;
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = fr + (U - 2 * fr) * t + (noise(t * 9.1) - 0.5) * 5;
    const y = fr + (noise(t * 7.3 + 40) - 0.5) * 5;
    s2 ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = U - fr + (noise(t * 8.2 + 80) - 0.5) * 5;
    const y = fr + (U - 2 * fr) * t + (noise(t * 6.1 + 120) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = U - fr - (U - 2 * fr) * t + (noise(t * 7.7 + 160) - 0.5) * 5;
    const y = U - fr + (noise(t * 9.4 + 200) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  for (let s2 = 0; s2 <= fw; s2++) {
    const t = s2 / fw;
    const x = fr + (noise(t * 6.6 + 240) - 0.5) * 5;
    const y = U - fr - (U - 2 * fr) * t + (noise(t * 8.8 + 280) - 0.5) * 5;
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.stroke();

  // ---- grain ----
  const gr = mulberry32(seed + 5);
  ctx.fillStyle = 'rgba(60,52,40,1)';
  for (let i = 0; i < 5200; i++) {
    ctx.globalAlpha = 0.025 + gr() * 0.06;
    const r = 0.6 + gr() * 1.6;
    ctx.beginPath();
    ctx.arc(gr() * U, gr() * U, r, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ---- vignette ----
  const v = ctx.createRadialGradient(U / 2, U / 2, U * 0.32, U / 2, U / 2, U * 0.72);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(40,30,18,0.16)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, U, U);
}

cv.addEventListener('click', () => {
  const s = 1000 + Math.floor(Math.random() * 900000);
  location.search = '?seed=' + s;
});

fit();
draw();
</script>
</body>
</html>
