<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.198 Brake-Light Wings</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#08080A; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.198 Brake-Light Wings (Amanda Willshire). Her Monarch, built
// the way she builds: the colourful parts of the wings are brake
// lights and turn signals, domed translucent lenses in red and
// amber set in a dark steel vein frame. The mosaic is the pattern;
// nothing is painted to imitate a butterfly. On a thirty second
// loop she beats her wings slowly, holds while light drifts across
// the domes, takes a hail strike that cracks three panels, and is
// repaired panel by panel, re-glossed as if re-epoxied. Drag a
// wing tip and the whole butterfly tilts, panels flaring on the
// side that catches the light.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#08080A', RED = '#C81E1E', AMBER = '#F59E0B', FRAME = '#23262B';
var CRACK = '#0A0A0A';
var W = 0, H = 0, phone = false;
var seed = 198198;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
function smooth(a, b, x) { var k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); }
function mixHex(h1, h2, k) {
  var a = [parseInt(h1.slice(1, 3), 16), parseInt(h1.slice(3, 5), 16), parseInt(h1.slice(5, 7), 16)];
  var b = [parseInt(h2.slice(1, 3), 16), parseInt(h2.slice(3, 5), 16), parseInt(h2.slice(5, 7), 16)];
  return 'rgb(' + Math.round(lerp(a[0], b[0], k)) + ',' + Math.round(lerp(a[1], b[1], k)) + ',' + Math.round(lerp(a[2], b[2], k)) + ')';
}

// ---- wing outlines in unit space (right wing; x out, y down) --------
var FORE = [[0.03, -0.05], [0.16, -0.33], [0.40, -0.52], [0.66, -0.56], [0.88, -0.46],
            [0.99, -0.30], [0.93, -0.15], [0.70, -0.05], [0.42, -0.01], [0.14, 0.01]];
var HIND = [[0.04, 0.03], [0.30, 0.02], [0.55, 0.08], [0.72, 0.20], [0.79, 0.36],
            [0.69, 0.51], [0.49, 0.58], [0.27, 0.52], [0.11, 0.35], [0.03, 0.16]];
function inPoly(pts, x, y) {
  var inside = false;
  for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    var xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

// ---- panels ------------------------------------------------------------
var panels = [];
function buildPanels() {
  panels = [];
  var r = rng(seed ^ 0x51F15E);
  var cs = 0.088;
  for (var gy = -0.60; gy < 0.62; gy += cs) {
    for (var gx = 0.0; gx < 1.02; gx += cs) {
      var cx = gx + cs / 2, cy = gy + cs / 2;
      if (!inPoly(FORE, cx, cy) && !inPoly(HIND, cx, cy)) continue;
      var d = Math.sqrt(cx * cx + cy * cy * 0.72);
      var band = Math.floor(d * 5.2 + (r() - 0.5) * 0.9);
      var col = (band % 2 === 0) ? RED : AMBER;
      if (r() < 0.16) col = (col === RED) ? AMBER : RED;
      // hairline fracture branches in panel-local coords, used if cracked
      var cracks = [];
      var nb = 2 + Math.floor(r() * 2);
      for (var b = 0; b < nb; b++) {
        var a0 = r() * 6.283, line = [], steps = 3;
        for (var sIdx = 0; sIdx <= steps; sIdx++) {
          var rr = (sIdx / steps) * 0.46;
          var aa = a0 + (r() - 0.5) * 0.5 * sIdx;
          line.push([Math.cos(aa) * rr, Math.sin(aa) * rr]);
        }
        cracks.push(line);
      }
      panels.push({ x: cx, y: cy, s: cs, col: col, h: r(), cracks: cracks, cracked: false });
    }
  }
  // the hail chooses three panels, spread across the right wing
  var picks = [];
  var zones = [[0.30, -0.30], [0.62, 0.28], [0.80, -0.28]];
  for (var z = 0; z < zones.length; z++) {
    var best = null, bd = 1e9;
    for (var i = 0; i < panels.length; i++) {
      var p = panels[i];
      var dd = (p.x - zones[z][0]) * (p.x - zones[z][0]) + (p.y - zones[z][1]) * (p.y - zones[z][1]);
      if (dd < bd && picks.indexOf(p) < 0) { bd = dd; best = p; }
    }
    if (best) { best.cracked = true; best.crackIdx = z; picks.push(best); }
  }
}

// ---- loop timeline (30s) ----------------------------------------------
var T = 12.5, lastNow = -1;  // frame one: the hold, sweep mid-crossing
function loopState(t) {
  var ph = t % 30;
  var fold = 0, sweep = -9, crackK = [0, 0, 0];
  if (ph < 8) {
    fold = 0.5 - 0.5 * Math.cos(6.2832 * ph / 4);       // two slow beats
  } else if (ph < 18) {
    fold = 0;
    sweep = -1.3 + (ph - 8) / 10 * 2.6;                  // light drifts across
  } else if (ph < 20) {
    for (var i = 0; i < 3; i++) crackK[i] = smooth(18 + i * 0.45, 19.6, ph);
  } else if (ph < 23) {
    crackK = [1, 1, 1];
  } else if (ph < 29.4) {
    for (var j = 0; j < 3; j++) crackK[j] = 1 - smooth(23 + j * 1.9, 25 + j * 1.9, ph);
  }
  return { fold: fold, sweep: sweep, crackK: crackK };
}

// ---- tilt (drag a wing tip) ----------------------------------------------
var tilt = 0, tiltTarget = 0, dragging = false, dragSX = 0, dragST = 0;
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; dragSX = e.clientX; dragST = tiltTarget;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  tiltTarget = clamp(dragST + (e.clientX - dragSX) / 320, -1, 1);
});
function endDrag() { dragging = false; tiltTarget = 0; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---- resize ------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700;
  if (!phone && !(sw > 0)) phone = H > W * 1.15;
  buildPanels();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- draw ------------------------------------------------------------------------
function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (lastNow >= 0 && now > 0) {
    var dt = Math.min(0.05, (now - lastNow) / 1000);
    T += dt;
    tilt += (tiltTarget - tilt) * Math.min(1, dt * 7);
  }
  lastNow = now;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var st = loopState(T);
  var span = phone ? W * 0.94 : Math.min(W * 0.80, H * 1.30);
  var ux = span / 2;                    // unit x in px (per wing)
  var uy = ux * 0.98;
  var cx = W / 2, cy = H * 0.50;
  var xScale = 1 - 0.5 * st.fold;       // folding to 60 degrees
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(tilt * 0.16);
  ctx.translate(-cx, -cy);
  function wingPath(pts, side, fresh) {
    // smooth closed path through the outline points, folded about
    // the body axis by the current wing-beat state
    function P(pt) {
      return [cx + side * pt[0] * ux * xScale,
              cy + pt[1] * uy + Math.abs(pt[0]) * st.fold * uy * 0.10];
    }
    var n = pts.length;
    var m0 = P([(pts[0][0] + pts[n - 1][0]) / 2, (pts[0][1] + pts[n - 1][1]) / 2]);
    if (fresh !== false) ctx.beginPath();
    ctx.moveTo(m0[0], m0[1]);
    for (var k = 0; k < n; k++) {
      var cur = P(pts[k]);
      var nxt = P(pts[(k + 1) % n]);
      ctx.quadraticCurveTo(cur[0], cur[1], (cur[0] + nxt[0]) / 2, (cur[1] + nxt[1]) / 2);
    }
    ctx.closePath();
  }
  for (var side = -1; side <= 1; side += 2) {
    // steel vein frame under the mosaic
    ctx.fillStyle = FRAME;
    var outlines = [FORE, HIND];
    for (var o = 0; o < 2; o++) { wingPath(outlines[o], side); ctx.fill(); }
    // panels, clipped to the wing outlines so the mosaic fits the wing
    ctx.save();
    wingPath(FORE, side, true);
    wingPath(HIND, side, false);
    ctx.clip();
    for (var i = 0; i < panels.length; i++) {
      var p = panels[i];
      var ck = p.cracked ? st.crackK[p.crackIdx || 0] : 0;
      // panel quad corners, folded about the body axis
      var half = p.s * 0.5 - 0.006;
      var corners = [[-half, -half], [half, -half], [half, half], [-half, half]];
      ctx.beginPath();
      for (var q = 0; q < 4; q++) {
        var lx = (p.x + corners[q][0]) * side * ux * xScale;
        var ly = (p.y + corners[q][1]) * uy + Math.abs(p.x + corners[q][0]) * st.fold * uy * 0.10;
        if (q === 0) ctx.moveTo(cx + lx, cy + ly); else ctx.lineTo(cx + lx, cy + ly);
      }
      ctx.closePath();
      var base = p.col;
      if (ck > 0) base = mixHex(base, '#26262A', ck * 0.72);
      ctx.fillStyle = base;
      ctx.fill();
      // dome: a soft highlight riding high on each lens, swelling
      // with the specular sweep and with tilt on the lit side
      var flare = Math.exp(-Math.pow((side * p.x - st.sweep) * 2.3, 2)) * 0.55;
      if (tilt !== 0 && side === Math.sign(tilt)) flare += Math.abs(tilt) * 0.22;
      flare *= (1 - ck * 0.8);
      ctx.save();
      ctx.clip();
      var hxp = cx + side * (p.x - 0.016) * ux * xScale;
      var hyp = cy + (p.y - 0.020) * uy + Math.abs(p.x) * st.fold * uy * 0.10;
      var hr = p.s * ux * 0.42;
      var hg = ctx.createRadialGradient(hxp, hyp, 0, hxp, hyp, hr);
      hg.addColorStop(0, 'rgba(255,255,255,' + (0.25 + flare * 0.45).toFixed(3) + ')');
      hg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hg;
      ctx.fillRect(hxp - hr, hyp - hr, hr * 2, hr * 2);
      ctx.restore();
      // fracture lines bloom as the panel cracks
      if (ck > 0.02) {
        ctx.strokeStyle = CRACK;
        ctx.lineWidth = Math.max(1, ux * 0.0022);
        ctx.globalAlpha = ck;
        for (var b = 0; b < p.cracks.length; b++) {
          var line = p.cracks[b];
          ctx.beginPath();
          for (var sIdx = 0; sIdx < line.length; sIdx++) {
            var gx2 = cx + side * (p.x + line[sIdx][0] * p.s) * ux * xScale;
            var gy2 = cy + (p.y + line[sIdx][1] * p.s) * uy + Math.abs(p.x) * st.fold * uy * 0.10;
            if (sIdx === 0) ctx.moveTo(gx2, gy2); else ctx.lineTo(gx2, gy2);
          }
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
    }
    ctx.restore();
  }
  // body: a slim dark steel bar, head, antennae
  ctx.fillStyle = FRAME;
  var bw = Math.max(5, ux * 0.030);
  ctx.beginPath();
  ctx.ellipse(cx, cy + uy * 0.03, bw, uy * 0.31, 0, 0, 6.284);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy - uy * 0.315, bw * 1.15, 0, 6.284);
  ctx.fill();
  ctx.strokeStyle = FRAME;
  ctx.lineWidth = Math.max(1.2, ux * 0.0035);
  for (var s2 = -1; s2 <= 1; s2 += 2) {
    ctx.beginPath();
    ctx.moveTo(cx + s2 * bw * 0.6, cy - uy * 0.35);
    ctx.quadraticCurveTo(cx + s2 * ux * 0.10, cy - uy * 0.52, cx + s2 * ux * 0.155, cy - uy * 0.555);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + s2 * ux * 0.155, cy - uy * 0.555, Math.max(1.6, ux * 0.006), 0, 6.284);
    ctx.fillStyle = FRAME; ctx.fill();
  }
  ctx.restore();
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
