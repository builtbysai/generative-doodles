<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bear Page</title>
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var BLUE = '#1E66B0';   // bear
  var WHITE = '#FFFFFF';  // ground and paw
  var RED = '#E63946';    // starburst, strands, headline
  var WELL = '#DCE8F2';   // text well
  var YELLOW = '#F2A81E'; // corner blobs

  var PHASE0 = 2.35; // constant loop phase for the synchronous first frame

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- stage ---------------------------------------------------------------
  // Portrait stage, 900 x 1200 (3:4), letterboxed into the viewport.
  var DW = 900, DH = 1200;

  // Bear silhouette: a union of seeded circles and ellipses, one flat fill.
  // The mass touches the top, left and bottom edges of the stage.
  var BEAR = [
    { e: 0, x: 150, y: 128, r: 92 },    // left ear
    { e: 0, x: 478, y: 118, r: 86 },    // right ear
    { e: 0, x: 312, y: 92,  r: 120 },   // crown bump, bleeds off the top
    { e: 0, x: 315, y: 292, r: 248 },   // head
    { e: 0, x: 150, y: 420, r: 130 },   // left cheek
    { e: 1, x: 372, y: 812, rx: 352, ry: 462 }, // torso, bleeds off the bottom
    { e: 1, x: 88,  y: 690, rx: 104, ry: 268 }, // left arm, bleeds off the left
    { e: 1, x: 668, y: 700, rx: 128, ry: 300 }, // right arm mass
    { e: 1, x: 185, y: 1172, rx: 155, ry: 92 }, // left foot
    { e: 1, x: 545, y: 1182, rx: 150, ry: 88 }  // right foot
  ];

  // Text well on the torso.
  var WELL_CX = 378, WELL_CY = 806, WELL_W = 400, WELL_H = 452;

  var seed = 509061;
  var layout = null;

  function wellPath(cx, cy, w, h, shape) {
    var rx = w / 2, ry = h / 2;
    ctx.beginPath();
    if (shape === 0) { // oval
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    } else if (shape === 1) { // arch: semicircular top, flat bottom
      ctx.moveTo(cx - rx, cy + ry);
      ctx.lineTo(cx - rx, cy - ry + rx);
      ctx.arc(cx, cy - ry + rx, rx, Math.PI, 0);
      ctx.lineTo(cx + rx, cy + ry);
      ctx.closePath();
    } else { // rounded rect
      var r = 56;
      ctx.moveTo(cx - rx + r, cy - ry);
      ctx.lineTo(cx + rx - r, cy - ry);
      ctx.arc(cx + rx - r, cy - ry + r, r, -Math.PI / 2, 0);
      ctx.lineTo(cx + rx, cy + ry - r);
      ctx.arc(cx + rx - r, cy + ry - r, r, 0, Math.PI / 2);
      ctx.lineTo(cx - rx + r, cy + ry);
      ctx.arc(cx - rx + r, cy + ry - r, r, Math.PI / 2, Math.PI);
      ctx.lineTo(cx - rx, cy - ry + r);
      ctx.arc(cx - rx + r, cy - ry + r, r, Math.PI, Math.PI * 1.5);
      ctx.closePath();
    }
  }

  // Half width of the well at a given offset from its centre, by shape.
  function wellHalfW(shape, dy) {
    var rx = WELL_W / 2, ry = WELL_H / 2;
    if (shape === 0) {
      var k = 1 - (dy / ry) * (dy / ry);
      return k <= 0 ? 0 : rx * Math.sqrt(k);
    }
    if (shape === 1) {
      var topC = -ry + rx;
      if (dy < topC) {
        var d = (dy - topC) / rx;
        var q = 1 - d * d;
        return q <= 0 ? 0 : rx * Math.sqrt(q);
      }
      return rx;
    }
    return rx;
  }

  function buildLayout(s) {
    var rnd = mulberry32(s);
    var L = {};
    L.wellShape = Math.floor(rnd() * 3);        // 0 oval, 1 arch, 2 rounded rect
    L.headlinePara = Math.floor(rnd() * 2);     // paragraph that gets the headline
    L.strandCount = 3 + Math.floor(rnd() * 3);  // 3 to 5 strands
    L.burstRot = rnd() * Math.PI / 7;
    L.spikes = 13 + Math.floor(rnd() * 3);      // 13 to 15 starburst spikes

    // Wavy strands trailing in from the right edge.
    L.strands = [];
    for (var i = 0; i < L.strandCount; i++) {
      L.strands.push({
        x: 874 - i * 27 - rnd() * 6,
        y0: 26 + rnd() * 70,
        len: 330 + rnd() * 230,
        amp: 9 + rnd() * 8,
        wl: 120 + rnd() * 60,
        ph: rnd() * Math.PI * 2
      });
    }

    // Text rows inside the well: newspaper style paragraphs of short lines,
    // two columns, ragged right edges, one red headline block.
    // Row widths are measured at the row edge farthest from the well centre,
    // so block corners never reach the well boundary on curved shapes.
    function rowMaxW(yy, pad) {
      var dyA = yy - WELL_CY;
      var dyF = dyA + (dyA >= 0 ? pad : -pad);
      return Math.min(WELL_W * 0.8, wellHalfW(L.wellShape, dyF) * 2 * 0.88);
    }
    L.rows = [];      // { y, blocks: [{x, w}], headline: bool }
    var innerTop = WELL_CY - WELL_H / 2 + WELL_H * 0.09;
    var innerBot = WELL_CY + WELL_H / 2 - WELL_H * 0.09;
    var rowH = 12, pitch = 27, paraGap = 17, gutter = 26;
    var y = innerTop + rowH / 2;
    var para = 0;
    while (y < innerBot - 40) {
      var maxW = rowMaxW(y, 14);
      if (maxW < 120) { y += pitch; continue; }
      if (para === L.headlinePara) {
        var hw = rowMaxW(y + 8, 22);
        L.rows.push({ y: y + 8, headline: true, blocks: [{ x: WELL_CX - hw / 2, w: hw * (0.68 + rnd() * 0.14) }] });
        y += 34 + paraGap;
      }
      var n = 3 + Math.floor(rnd() * 3);
      for (var r = 0; r < n; r++) {
        if (y > innerBot - 14) break;
        var mw = rowMaxW(y, 14);
        if (mw < 120) { y += pitch; continue; }
        var colW = (mw - gutter) / 2;
        var last = (r === n - 1);
        var blocks = [];
        for (var cix = 0; cix < 2; cix++) {
          var f = last ? (0.34 + rnd() * 0.3) : (0.72 + rnd() * 0.28);
          blocks.push({ x: WELL_CX - mw / 2 + cix * (colW + gutter), w: colW * f });
        }
        L.rows.push({ y: y, headline: false, blocks: blocks });
        y += pitch;
      }
      y += paraGap;
      para++;
    }

    // Corner blobs: small clusters of circles at both bottom corners.
    L.blobs = [];
    var corners = [{ x: 64, y: 1132 }, { x: 840, y: 1148 }];
    for (var ci = 0; ci < 2; ci++) {
      var cl = [];
      var nb = 3 + Math.floor(rnd() * 2);
      for (var b = 0; b < nb; b++) {
        cl.push({
          x: corners[ci].x + (rnd() - 0.5) * 96,
          y: corners[ci].y + (rnd() - 0.5) * 56,
          r: 24 + rnd() * 27
        });
      }
      L.blobs.push(cl);
    }
    return L;
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r);
    ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r);
    ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }

  function draw(t) {
    var vv = window.visualViewport;
    var cssW = vv ? vv.width : window.innerWidth;
    var cssH = vv ? vv.height : window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = WHITE;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Phone detection: screen physical size, aspect only as a fallback.
    // The composition keeps its 3:4 shape on phones and the page ground is
    // the piece's own white, so the letterbox margins are invisible.
    var phone = false;
    if (window.screen && window.screen.width) {
      phone = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      phone = cssH > cssW * 1.15;
    }

    var fit = Math.min(cssW / DW, cssH / DH);
    if (phone) fit = Math.min(cssW / DW, cssH / DH); // same fit: shape is kept
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.translate((cssW - DW * fit) / 2, (cssH - DH * fit) / 2);
    ctx.scale(fit, fit);

    // -- starburst behind the head, slowly pulsing ---------------------------
    var burstScale = 1 + 0.03 * Math.sin(t * (Math.PI * 2 / 5.0) + 1.0);
    ctx.save();
    ctx.translate(318, 292);
    ctx.scale(burstScale, burstScale);
    ctx.rotate(layout.burstRot);
    ctx.beginPath();
    var spikes = layout.spikes, innerR = 205, outerR = 338;
    for (var si = 0; si < spikes * 2; si++) {
      var ang = (si / (spikes * 2)) * Math.PI * 2;
      var rad = (si % 2 === 0) ? outerR : innerR;
      var px = Math.cos(ang) * rad, py = Math.sin(ang) * rad;
      if (si === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = RED;
    ctx.fill();
    ctx.restore();

    // -- wavy strands from the right edge ------------------------------------
    ctx.strokeStyle = RED;
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var wi = 0; wi < layout.strands.length; wi++) {
      var st = layout.strands[wi];
      ctx.beginPath();
      var steps = Math.floor(st.len / 16);
      for (var k = 0; k <= steps; k++) {
        var yy = st.y0 + k * 16;
        var xx = st.x + Math.sin((yy / st.wl) * Math.PI * 2 + st.ph) * st.amp;
        if (k === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
    }

    // -- bear silhouette -------------------------------------------------------
    ctx.fillStyle = BLUE;
    for (var bi = 0; bi < BEAR.length; bi++) {
      var p = BEAR[bi];
      ctx.beginPath();
      if (p.e === 0) ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      else ctx.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Inner ears.
    ctx.fillStyle = WHITE;
    ctx.beginPath(); ctx.arc(150, 128, 38, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(478, 118, 34, 0, Math.PI * 2); ctx.fill();

    // Face: the bear faces the viewer.
    ctx.fillStyle = WHITE;
    ctx.beginPath(); ctx.ellipse(238, 268, 17, 22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(392, 268, 17, 22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.arc(238, 272, 7.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(392, 272, 7.5, 0, Math.PI * 2); ctx.fill();
    // Muzzle, nose, smile.
    ctx.fillStyle = WHITE;
    ctx.beginPath(); ctx.ellipse(315, 374, 98, 68, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.ellipse(315, 342, 30, 19, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = BLUE;
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(315, 361); ctx.lineTo(315, 376); ctx.stroke();
    ctx.beginPath(); ctx.arc(315, 362, 34, Math.PI * 0.22, Math.PI * 0.78); ctx.stroke();

    // -- text well on the torso, breathing ------------------------------------
    var breath = 1 + 0.02 * Math.sin(t * (Math.PI * 2 / 6.5));
    ctx.save();
    ctx.translate(WELL_CX, WELL_CY);
    ctx.scale(breath, breath);
    ctx.translate(-WELL_CX, -WELL_CY);
    wellPath(WELL_CX, WELL_CY, WELL_W, WELL_H, layout.wellShape);
    ctx.fillStyle = WELL;
    ctx.fill();
    ctx.save();
    wellPath(WELL_CX, WELL_CY, WELL_W * 0.97, WELL_H * 0.97, layout.wellShape);
    ctx.clip();
    for (var ri = 0; ri < layout.rows.length; ri++) {
      var row = layout.rows[ri];
      var wave = 0.5 + 0.5 * Math.sin(t * 1.5 - (row.y - 580) * 0.014);
      for (var gi = 0; gi < row.blocks.length; gi++) {
        var blk = row.blocks[gi];
        if (row.headline) {
          ctx.globalAlpha = 0.82 + 0.18 * wave;
          ctx.fillStyle = RED;
          rr(blk.x, row.y - 17, blk.w, 34, 8);
          ctx.fill();
        } else {
          ctx.globalAlpha = 0.5 + 0.42 * wave;
          ctx.fillStyle = BLUE;
          rr(blk.x, row.y - 6, blk.w, 12, 6);
          ctx.fill();
        }
      }
    }
    ctx.restore();
    ctx.restore();
    ctx.globalAlpha = 1;

    // -- giant white paw waving from the top-right ------------------------------
    // Drawn as a fake union: a fat blue pass merges palm and toes into one
    // silhouette, then a white pass shrinks it back, leaving a clean outline.
    var pawRot = 0.14 * Math.sin(t * (Math.PI * 2 / 3.4));
    var pawShapes = [
      { e: 1, x: 26, y: -80, rx: 80, ry: 104 },            // palm pad
      { e: 1, x: -24, y: -168, rx: 16.5, ry: 26, rot: -0.22 }, // toes on the palm arc
      { e: 1, x: 9,   y: -188, rx: 16.5, ry: 26, rot: -0.07 },
      { e: 1, x: 43,  y: -188, rx: 16.5, ry: 26, rot: 0.07 },
      { e: 1, x: 76,  y: -162, rx: 16.5, ry: 26, rot: 0.22 },
      { e: 1, x: 102, y: -64,  rx: 15,   ry: 24, rot: 0.5 }    // thumb
    ];
    ctx.save();
    ctx.translate(742, 252);
    ctx.rotate(pawRot);
    var pass, sh;
    for (pass = 0; pass < 2; pass++) {
      ctx.fillStyle = pass === 0 ? BLUE : WHITE;
      ctx.strokeStyle = pass === 0 ? BLUE : WHITE;
      ctx.lineWidth = pass === 0 ? 20 : 2;
      for (sh = 0; sh < pawShapes.length; sh++) {
        var s2 = pawShapes[sh];
        ctx.save();
        ctx.translate(s2.x, s2.y);
        if (s2.rot) ctx.rotate(s2.rot);
        ctx.beginPath();
        ctx.ellipse(0, 0, s2.rx, s2.ry, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }
    ctx.restore();

    // -- corner blobs ------------------------------------------------------------
    ctx.fillStyle = YELLOW;
    for (var ci2 = 0; ci2 < layout.blobs.length; ci2++) {
      var cluster = layout.blobs[ci2];
      for (var bj = 0; bj < cluster.length; bj++) {
        ctx.beginPath();
        ctx.arc(cluster[bj].x, cluster[bj].y, cluster[bj].r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    draw(currentT);
  }

  window.addEventListener('resize', resize);
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }

  // ---- interaction: double-tap reseeds --------------------------------------
  var lastTap = 0;
  function performanceNow() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now();
    return lastTap + 1000; // renderer fallback: never triggers a reseed
  }
  function onTap() {
    var now = performanceNow();
    if (now - lastTap < 320) {
      seed = (seed * 1103515245 + 12345) % 2147483648;
      layout = buildLayout(seed);
      draw(currentT);
      lastTap = 0;
    } else {
      lastTap = now;
    }
  }
  if (canvas.addEventListener) canvas.addEventListener('pointerdown', onTap);

  // ---- loop -------------------------------------------------------------------
  layout = buildLayout(seed);
  var currentT = PHASE0;
  resize(); // synchronous first frame at the constant phase
  draw(PHASE0);

  if (typeof requestAnimationFrame === 'function') {
    var startStamp = null;
    var frame = function (ts) {
      if (startStamp === null) startStamp = ts;
      currentT = PHASE0 + (ts - startStamp) / 1000;
      draw(currentT);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
