<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.287 Wobble Mug</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0E0D0C; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.287 Wobble Mug (Sophia Golovanevskaya).
// A squat black-clay mug seen from slightly above. Its outer
// wall carries a deep radial wobble, the rim undulating like
// a thrown mistake kept on purpose, while the inner wall
// stays smooth satin, the functional constraint she insists
// on. No handle, no liquid, no steam. Dragging around the
// mug twists the wobble phase and depth live; double-tapping
// re-throws the mug from a new wobble seed. Nothing reloads.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var CLAY = '#1B1512', HIGH = '#3A2F26', SATIN = '#241E19', GROUND = '#0E0D0C', RIM = '#B98A4E';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0; // stored centred-fit transform, used by the pointer handlers
var T = 0, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }

// ---- mug geometry --------------------------------------------------------------
// Design space 1280 by 900, centred fit. The mug sits slightly
// above centre with a generous dark margin. It is drawn as two
// lathes sharing one profile: the outer lathe carries the
// wobble, the inner lathe is the same profile scaled in and
// kept smooth. Cross sections are ellipses (squash 0.36) whose
// centres step down from the rim centre to the base centre.
var CX = 640, RIMY = 315, HGT = 270;
var SQUASH = 0.36;
var RIN = 208; // inner opening radius, always smooth
var PROF = [
  [0.00, 265], [0.12, 275], [0.30, 287], [0.50, 285],
  [0.70, 264], [0.88, 234], [1.00, 218]
];
function baseHalf(s) {
  var n = PROF.length;
  var x = clamp(s, 0, 1) * (n - 1);
  var i = Math.min(n - 2, Math.floor(x));
  var u = x - i;
  var p0 = PROF[Math.max(0, i - 1)][1], p1 = PROF[i][1];
  var p2 = PROF[i + 1][1], p3 = PROF[Math.min(n - 1, i + 2)][1];
  return 0.5 * ((2 * p1) + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u * u + (-p0 + 3 * p1 - 3 * p2 + p3) * u * u * u);
}
// belly weight: zero at the rim (s = 0) and at the base
// (s = 1), full at mid wall, so base and rim stay anchored
// while the belly of the wall carries the deepest wobble
function belly(s) {
  var v = Math.sin(Math.PI * clamp(s, 0, 1));
  return Math.pow(Math.max(0, v), 0.8);
}

// ---- wobble state ----------------------------------------------------------------
// wobble(theta) = A * sin(k * theta + phase), with a smaller
// second harmonic from the seed so the throw reads hand-made
// rather than stamped. The state is rebuilt per seed; the
// first seed is fixed so frame one opens at full depth.
var seedCounter = 0;
var wob = null;
function buildWobble(seed) {
  var r = rng(seed);
  wob = {
    k: 6,
    phase: r() * Math.PI * 2,
    harmPhase: r() * Math.PI * 2,
    harmAmp: 0.22 + r() * 0.14,
    A: 25 + r() * 5
  };
}
buildWobble(287011);
var dragPhase = 0; // live phase added by dragging, on top of the seeded phase
var dragA = 0; // live depth offset added by dragging
function phaseNow() { return wob.phase + dragPhase + T * 0.045; }
function ampNow() {
  var breathe = 1 + 0.035 * Math.sin(T * 0.55);
  return clamp((wob.A + dragA) * breathe, 7, 50);
}
function wobbleAt(theta, s, A, ph) {
  var main = Math.sin(wob.k * theta + ph);
  var harm = Math.sin(2 * wob.k * theta + wob.harmPhase + ph * 0.7);
  return A * (main + wob.harmAmp * harm) * belly(s);
}
// radius of the outer lathe at height fraction s and angle
// theta. At the rim the radial wobble eases to a gentler
// share of A so the rim outline still waves in plan, and a
// small vertical undulation lifts and dips the rim edge;
// both fade down the wall as (1 - s) squared.
function surfR(s, theta, A, ph) {
  var rimShare = A * 0.55 * (Math.sin(wob.k * theta + ph) + wob.harmAmp * Math.sin(2 * wob.k * theta + wob.harmPhase + ph * 0.7));
  var fade = (1 - s) * (1 - s);
  return baseHalf(s) + wobbleAt(theta, s, A, ph) + rimShare * fade;
}
function surfPoint(s, theta, A, ph) {
  var R = surfR(s, theta, A, ph);
  var yu = 9 * Math.sin(wob.k * theta + ph + 0.9) * (1 - s) * (1 - s);
  return [CX + R * Math.cos(theta), RIMY + s * HGT + R * Math.sin(theta) * SQUASH + yu];
}
function innerPoint(theta) {
  return [CX + RIN * Math.cos(theta), RIMY + RIN * Math.sin(theta) * SQUASH];
}

// ---- simulation ---------------------------------------------------------------------
function stepSim() { T += TICK; }

// ---- drawing ---------------------------------------------------------------------------
function silhouettePath(A, ph) {
  var i, th, p;
  ctx.beginPath();
  // back rim arc, leftmost round the top to rightmost
  for (i = 0; i <= 40; i++) {
    th = Math.PI + (i / 40) * Math.PI;
    p = surfPoint(0, th, A, ph);
    if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  // right side down to the base
  for (i = 1; i <= 20; i++) {
    p = surfPoint(i / 20, 0, A, ph);
    ctx.lineTo(p[0], p[1]);
  }
  // base front arc, rightmost round the bottom to leftmost
  for (i = 1; i <= 40; i++) {
    th = (i / 40) * Math.PI;
    p = surfPoint(1, th, A, ph);
    ctx.lineTo(p[0], p[1]);
  }
  // left side back up to the rim
  for (i = 19; i >= 0; i--) {
    p = surfPoint(i / 20, Math.PI, A, ph);
    ctx.lineTo(p[0], p[1]);
  }
  ctx.closePath();
}
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-80, -80, DW + 160, DH + 160);
  var A = ampNow(), ph = phaseNow();
  var i, j, th, th2, p;
  // contact grounding: one flat translucent ellipse of clay
  // under the base so the mug sits on the dark ground
  ctx.fillStyle = rgba(CLAY, 0.55);
  ctx.beginPath();
  ctx.ellipse(CX, RIMY + HGT + 62, 268, 34, 0, 0, Math.PI * 2);
  ctx.fill();
  // the body
  silhouettePath(A, ph);
  ctx.fillStyle = CLAY;
  ctx.fill();
  // front wall fluting: flat highlight bands following the
  // wobble. Each strip runs from the front rim arc down the
  // profile to the base arc; strips on a wobble crest catch
  // the clay highlight, strips in a trough take a wash of
  // ground, so the wall ripples while staying flat coloured.
  var STRIPS = 72, SSTEPS = [0, 0.25, 0.5, 0.75, 1];
  ctx.save();
  silhouettePath(A, ph);
  ctx.clip();
  for (i = 0; i < STRIPS; i++) {
    th = (i / STRIPS) * Math.PI;
    th2 = ((i + 1) / STRIPS) * Math.PI;
    var mid = (th + th2) / 2;
    var lobe = Math.sin(wob.k * mid + ph);
    var style = null;
    if (lobe > 0.55) style = rgba(HIGH, 0.88);
    else if (lobe > 0.15) style = rgba(HIGH, 0.45);
    else if (lobe < -0.55) style = rgba(GROUND, 0.34);
    else if (lobe < -0.15) style = rgba(GROUND, 0.16);
    if (!style) continue;
    ctx.fillStyle = style;
    ctx.beginPath();
    for (j = 0; j < SSTEPS.length; j++) {
      p = surfPoint(SSTEPS[j], th, A, ph);
      if (j === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
    }
    for (j = SSTEPS.length - 1; j >= 0; j--) {
      p = surfPoint(SSTEPS[j], th2, A, ph);
      ctx.lineTo(p[0], p[1]);
    }
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  // top annulus of the wall, in sectors between the wobbled
  // outer rim and the smooth inner rim; crest sectors take
  // the highlight so the rim light follows the wobble too
  var SECT = 56;
  for (i = 0; i < SECT; i++) {
    th = (i / SECT) * Math.PI * 2;
    th2 = ((i + 1) / SECT) * Math.PI * 2;
    var midA = (th + th2) / 2;
    var lobe2 = Math.sin(wob.k * midA + ph);
    ctx.fillStyle = lobe2 > 0.3 ? rgba(HIGH, 0.62) : rgba(CLAY, 1);
    ctx.beginPath();
    p = surfPoint(0, th, A, ph); ctx.moveTo(p[0], p[1]);
    p = surfPoint(0, th2, A, ph); ctx.lineTo(p[0], p[1]);
    p = innerPoint(th2); ctx.lineTo(p[0], p[1]);
    p = innerPoint(th); ctx.lineTo(p[0], p[1]);
    ctx.closePath();
    ctx.fill();
  }
  // the smooth satin interior: one flat ellipse, a deeper
  // flat hollow laid inside it, and one quiet sheen arc.
  // Nothing in here wobbles, however hard the outside twists.
  ctx.fillStyle = SATIN;
  ctx.beginPath();
  ctx.ellipse(CX, RIMY, RIN, RIN * SQUASH, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = rgba(GROUND, 0.5);
  ctx.beginPath();
  ctx.ellipse(CX, RIMY + 17, RIN * 0.82, RIN * SQUASH * 0.78, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = rgba(HIGH, 0.5);
  ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.ellipse(CX, RIMY, RIN * 0.9, RIN * SQUASH * 0.9, 0, Math.PI * 1.12, Math.PI * 1.62);
  ctx.stroke();
  // warm rim, kept very subtle: the wobbled outer edge and
  // the smooth inner edge, each one thin translucent stroke
  ctx.strokeStyle = rgba(RIM, 0.55);
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (i = 0; i <= 72; i++) {
    th = (i / 72) * Math.PI * 2;
    p = surfPoint(0, th, A, ph);
    if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.strokeStyle = rgba(RIM, 0.32);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(CX, RIMY, RIN, RIN * SQUASH, 0, 0, Math.PI * 2);
  ctx.stroke();
  // a defining edge around the silhouette and along the base,
  // in the clay highlight, so the black body holds its shape
  // against the near black ground
  silhouettePath(A, ph);
  ctx.strokeStyle = rgba(HIGH, 0.85);
  ctx.lineWidth = 3;
  ctx.stroke();
}

// ---- resize ----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- interaction: drag twists, double-tap re-throws --------------------------------------
// Dragging around the mug sweeps the wobble phase by the
// angle travelled around the rim centre; dragging up or
// down deepens or shallows the wobble depth. Both apply
// live while the drag runs. A double-tap re-throws the mug
// from the next seed in a deterministic cycle. A single tap
// does nothing. Nothing ever reloads the page.
var dragging = false, dragId = null;
var startTheta = 0, startY = 0, startPhase = 0, startA = 0, dragMoved = 0, downAt = 0;
var lastTapAt = -10000;
function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
function thetaOf(p) {
  return Math.atan2((p[1] - RIMY) / SQUASH, p[0] - CX);
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  dragging = true;
  dragId = e.pointerId;
  startTheta = thetaOf(p);
  startY = p[1];
  startPhase = dragPhase;
  startA = dragA;
  dragMoved = 0;
  downAt = Date.now();
  if (canvas.setPointerCapture && e.pointerId !== undefined) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging || (dragId !== null && e.pointerId !== dragId)) return;
  var p = toDesign(e);
  var th = thetaOf(p);
  var d = th - startTheta;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  dragPhase = startPhase + d;
  dragA = clamp(startA + (startY - p[1]) * 0.14, -18, 22);
  dragMoved += Math.abs(d) * 60 + Math.abs(startY - p[1]) * 0.05;
});
canvas.addEventListener('pointerup', function (e) {
  if (!dragging) return;
  dragging = false;
  dragId = null;
  var wasTap = dragMoved < 6 && Date.now() - downAt < 500;
  if (!wasTap) { lastTapAt = -10000; return; }
  var now = Date.now();
  if (now - lastTapAt < 380) {
    lastTapAt = -10000;
    seedCounter++;
    buildWobble(287011 + seedCounter * 7919);
    dragPhase = 0;
    dragA = 0;
  } else {
    lastTapAt = now;
  }
});
canvas.addEventListener('pointercancel', function () { dragging = false; dragId = null; });

// ---- frame -----------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // centred fit: the shaped composition keeps its proportions,
  // centred, with the page ground in the piece ground colour
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { stepSim(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
