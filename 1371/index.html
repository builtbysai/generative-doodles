<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breathings</title>
<style>
  html, body { margin: 0; padding: 0; background: #101010; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). Never Math.random: frame one must be reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function smooth(a, b, x) {
    if (x <= a) return 0;
    if (x >= b) return 1;
    var u = (x - a) / (b - a);
    return u * u * (3 - 2 * u);
  }

  var INK = '#101010';
  var BONE = '#CFC7B4';
  var GOLD = '#B89A4A';
  var SKIES = ['#5a6b52', '#6b7a5e', '#4a5a43', '#7a7a62', '#5e6a6a', '#6a6252'];
  var RIDGES = ['#2e4a38', '#3a5238', '#2a3a2e', '#46523a', '#31402f', '#3e4636'];
  var WATERS = ['#3e5a6b', '#31424f', '#4a6b8a', '#3a5a5a'];

  // One pseudo-script glyph, drawn with strokes only. Each shape gets its
  // own beginPath (node-canvas renders batched arcs as connected polygons).
  function glyph(gx, gy, s, type, color) {
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = Math.max(1, s * 0.12);
    ctx.beginPath();
    if (type === 0) { // vertical bar
      ctx.moveTo(gx, gy - s * 0.4); ctx.lineTo(gx, gy + s * 0.4);
    } else if (type === 1) { // chevron
      ctx.moveTo(gx - s * 0.4, gy + s * 0.3); ctx.lineTo(gx, gy - s * 0.3); ctx.lineTo(gx + s * 0.4, gy + s * 0.3);
    } else if (type === 2) { // arc
      ctx.moveTo(gx + s * 0.4, gy);
      ctx.arc(gx, gy, s * 0.4, 0, Math.PI, true);
    } else if (type === 3) { // dot pair
      ctx.fillRect(gx - s * 0.35, gy - s * 0.08, s * 0.16, s * 0.16);
      ctx.fillRect(gx + s * 0.19, gy - s * 0.08, s * 0.16, s * 0.16);
      return;
    } else if (type === 4) { // diagonal tick
      ctx.moveTo(gx - s * 0.35, gy + s * 0.35); ctx.lineTo(gx + s * 0.35, gy - s * 0.35);
    } else if (type === 5) { // staircase (steps, never a letterform)
      ctx.moveTo(gx - s * 0.4, gy + s * 0.3); ctx.lineTo(gx - s * 0.4, gy);
      ctx.lineTo(gx, gy); ctx.lineTo(gx, gy - s * 0.3); ctx.lineTo(gx + s * 0.4, gy - s * 0.3);
    } else if (type === 6) { // triangle outline
      ctx.moveTo(gx, gy - s * 0.4); ctx.lineTo(gx + s * 0.4, gy + s * 0.35);
      ctx.lineTo(gx - s * 0.4, gy + s * 0.35); ctx.closePath();
    } else { // cross
      ctx.moveTo(gx - s * 0.35, gy); ctx.lineTo(gx + s * 0.35, gy);
      ctx.moveTo(gx, gy - s * 0.35); ctx.lineTo(gx, gy + s * 0.35);
    }
    ctx.stroke();
  }

  // Border glyph positions for one square: 7 per side, clockwise from top-left.
  function borderPositions(x0, y0, c) {
    var inset = c * 0.07;
    var pts = [];
    var i, u;
    for (i = 0; i < 7; i++) { u = (i + 0.5) / 7; pts.push([x0 + u * c, y0 + inset]); }
    for (i = 0; i < 7; i++) { u = (i + 0.5) / 7; pts.push([x0 + c - inset, y0 + u * c]); }
    for (i = 0; i < 7; i++) { u = (i + 0.5) / 7; pts.push([x0 + (1 - u) * c, y0 + c - inset]); }
    for (i = 0; i < 7; i++) { u = (i + 0.5) / 7; pts.push([x0 + inset, y0 + (1 - u) * c]); }
    return pts;
  }

  // One generative square landscape, seeded by (cell, generation).
  function drawLandscape(x0, y0, c, cell, gen) {
    var rng = mulberry32(1371000 + cell * 7919 + gen * 131 + 7);
    var sky = SKIES[Math.floor(rng() * SKIES.length)];
    var water = WATERS[Math.floor(rng() * WATERS.length)];
    ctx.save();
    ctx.beginPath();
    ctx.rect(x0, y0, c, c);
    ctx.clip();
    ctx.fillStyle = sky;
    ctx.fillRect(x0, y0, c, c);
    // Pale disc (sun through haze), present about half the time.
    if (rng() < 0.5) {
      var dx = x0 + c * (0.2 + rng() * 0.6);
      var dy = y0 + c * (0.15 + rng() * 0.2);
      var dr = c * (0.05 + rng() * 0.05);
      ctx.fillStyle = '#d9d2c2';
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      ctx.moveTo(dx + dr, dy);
      ctx.arc(dx, dy, dr, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    // Three ridges, far to near, each a harmonic-perturbed polyline filled down.
    var r, x, y, base, amp1, amp2, ph1, ph2, fr1, fr2;
    for (r = 0; r < 3; r++) {
      base = y0 + c * (0.42 + r * 0.16);
      amp1 = c * (0.03 + rng() * 0.03);
      amp2 = c * (0.015 + rng() * 0.02);
      ph1 = rng() * Math.PI * 2; ph2 = rng() * Math.PI * 2;
      fr1 = 2 + Math.floor(rng() * 2); fr2 = 3 + Math.floor(rng() * 3);
      ctx.fillStyle = RIDGES[Math.floor(rng() * RIDGES.length)];
      ctx.beginPath();
      ctx.moveTo(x0, y0 + c);
      for (x = 0; x <= 20; x++) {
        var u = x / 20;
        y = base + Math.sin(u * fr1 * Math.PI * 2 + ph1) * amp1
                  + Math.sin(u * fr2 * Math.PI * 2 + ph2) * amp2;
        ctx.lineTo(x0 + u * c, y);
      }
      ctx.lineTo(x0 + c, y0 + c);
      ctx.closePath();
      ctx.fill();
    }
    // Water band along the bottom, wavy top edge.
    var wy = y0 + c * 0.8;
    var wamp = c * 0.02, wph = rng() * Math.PI * 2;
    ctx.fillStyle = water;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(x0, y0 + c);
    for (x = 0; x <= 20; x++) {
      var uu = x / 20;
      ctx.lineTo(x0 + uu * c, wy + Math.sin(uu * Math.PI * 4 + wph) * wamp);
    }
    ctx.lineTo(x0 + c, y0 + c);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    // Sparse dark speckles (distant trees / stones).
    ctx.fillStyle = '#1e1a16';
    var d;
    for (d = 0; d < 12; d++) {
      var sx = x0 + rng() * c;
      var sy = y0 + c * (0.45 + rng() * 0.3);
      ctx.fillRect(sx, sy, Math.max(1, c * 0.012), Math.max(1, c * 0.012));
    }
    ctx.restore();
  }

  function isPhone() {
    var sw = window.screen.width, sh = window.screen.height;
    var minDim = Math.min(sw, sh);
    if (minDim < 700) return true;
    var w = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    return h > w * 1.15;
  }

  function sizeCanvas() {
    var w = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    canvas.width = w;
    canvas.height = h;
  }

  // How many times cell j has already been cycled before slot S.
  function pastCycles(j, S) {
    if (S - 1 < j) return 0;
    return Math.floor((S - 1 - j) / 16) + 1;
  }

  function draw(t) {
    sizeCanvas();
    var W = canvas.width, H = canvas.height;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, W, H);

    var phone = isPhone();
    var grid = phone ? W : Math.min(W, H) * 0.9;
    var gap = grid * 0.02;
    var cell = (grid - gap * 3) / 4;
    var ox = (W - grid) / 2;
    var oy = (H - grid) / 2;

    // Etch clock phase-shifted +8 s so frame one is already mid-etch.
    var etchClock = t + 8;
    var slot = Math.floor(etchClock / 20);
    var cycling = slot % 16;
    var slotT = etchClock % 20;
    var etchP = slotT / 20;
    var fadeIn = smooth(0, 4, slotT); // breathing: 4 s in, 4 s out.

    var j, x0, y0, gen, pts, g, gt, gx, gy, gs;
    for (j = 0; j < 16; j++) {
      var col = j % 4, row = Math.floor(j / 4);
      x0 = ox + col * (cell + gap);
      y0 = oy + row * (cell + gap);
      gen = pastCycles(j, slot);
      if (j === cycling) {
        // Old landscape fades out, new fades in over the first 4 s.
        ctx.globalAlpha = 1 - fadeIn;
        drawLandscape(x0, y0, cell, j, gen);
        ctx.globalAlpha = fadeIn;
        drawLandscape(x0, y0, cell, j, gen + 1);
        ctx.globalAlpha = 1;
      } else {
        drawLandscape(x0, y0, cell, j, gen);
      }
      // Border titles: pseudo-script glyphs around the square.
      pts = borderPositions(x0, y0, cell);
      gs = cell * 0.09;
      if (j === cycling) {
        // Etching in progress: glyphs appear one by one, clockwise.
        var total = pts.length;
        var drawn = Math.floor(etchP * total);
        var frac = etchP * total - drawn;
        for (g = 0; g < drawn; g++) {
          gt = (j * 7919 + g * 131 + 1371000) % 8;
          gx = pts[g][0]; gy = pts[g][1];
          glyph(gx, gy, gs, gt, BONE);
        }
        if (drawn < total) {
          // Partial next glyph + the draw-head's faint glow.
          gt = (j * 7919 + drawn * 131 + 1371000) % 8;
          gx = pts[drawn][0]; gy = pts[drawn][1];
          ctx.globalAlpha = Math.max(0.15, frac);
          glyph(gx, gy, gs, gt, BONE);
          ctx.globalAlpha = 1;
          ctx.fillStyle = GOLD;
          ctx.globalAlpha = 0.22;
          ctx.beginPath();
          ctx.moveTo(gx + gs * 0.55, gy);
          ctx.arc(gx, gy, gs * 0.55, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 0.10;
          ctx.beginPath();
          ctx.moveTo(gx + gs * 0.95, gy);
          ctx.arc(gx, gy, gs * 0.95, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      } else {
        for (g = 0; g < pts.length; g++) {
          gt = (j * 7919 + g * 131 + 1371000) % 8;
          glyph(pts[g][0], pts[g][1], gs, gt, BONE);
        }
      }
    }
  }

  // Synchronous first frame at a constant phase (boot flag).
  draw(0);

  // rAF loop, plain function declaration behind a typeof guard.
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    draw((ts - startT) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  function onResize() {
    var t = 0;
    if (startT !== null && typeof performance !== 'undefined' && performance.now) {
      t = (performance.now() - startT) / 1000;
    }
    draw(t);
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
})();
</script>
</body>
</html>
