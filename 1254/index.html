<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Traverse</title>
<style>
  html, body { margin: 0; padding: 0; background: #DCE4E6; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1254 "Traverse" - Jenna Maurice study block JM7.
   After Maurice's Subtle Appearances (2016), her attempt to walk
   through a mountain, and the Traverse performances (2023). A small
   blush figure crosses to a huge calm massif, climbs a little way up
   its face, plants its hands and pushes - leaning, trembling, in
   earnest - for twelve seconds. Then it slides back down, brushes
   itself off, looks up at the mountain for a while, and ambles off
   to try again somewhere else along the slope. It never gets
   through. It never gives up. The mountain never moves, never
   notices, never reacts; it is generated once per run and is the
   stillest thing in the frame. Attempts cycle every sixty seconds
   at hashed spots on the lower face. Drag sets the next attempt
   point; tap makes the figure sit down facing the mountain for
   eight seconds (defeat as rest); double-tap reseeds the mountain.
   No face. No victory. Silent; flat fills only; seeded hashes only. */

var T0 = 18;                   // fixed first-frame phase: mid-LEAN, attempt 1
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;

var PAL = {
  sky: '#DCE4E6', cloud: '#EDF1F2',
  ground: '#C6C9BF', groundBand: '#B7BAB0',
  ridgeFar: '#7C848E', ridgeMid: '#6E7680',
  slate: '#5C6470', slateDark: '#4D545F',
  shadow: '#3A3F47', snow: '#CFC9BC',
  scree: '#989CA1', screeDot: '#7E8288',
  agent: '#C98A7D', agentDark: '#AC7264', agentDeep: '#8F5B4F'
};

/* ---------- seeded hash (integer, deterministic) ---------- */
function ih(a, b) {
  var x = ((a | 0) * 374761393 + (b | 0) * 668265263) >>> 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function sstep(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function seedBase() { return 1254 + salt * 7919; }

/* ---------- time ---------- */
function perfNow() {
  return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : 0;
}
var startPerf = perfNow();
var booted = false;
function pieceNow() {
  if (!booted) return T0;              // frame one is drawn at exactly T0
  return T0 + (perfNow() - startPerf);
}

/* ---------- interaction state (recorded, never integrated) ----------
   salt:      double-tap reseed count (mountain + attempt flavour)
   runStart:  piece-time at which the current run's clock is 0
   sits:      sit intervals in RUN-SCHEDULE time {at}: while the
              schedule clock is inside [at, at+8] the figure is
              seated and its clock holds at 'at'
   overrides: drag-chosen attempt points {attemptIndex: surfaceFrac} */
var salt = 0;
var runStart = 0;
var sits = [];
var overrides = {};

/* Map run piece-time -> schedule time, applying sit holds. Also
   reports whether the figure is currently seated, and if so the
   schedule time it is frozen at. */
function schedTime(u) {
  var ft = u - runStart, seated = false, i, s;
  var sorted = sits.slice().sort(function (a, b) { return a.at - b.at; });
  for (i = 0; i < sorted.length; i++) {
    s = sorted[i].at;
    if (ft > s) {
      if (ft < s + 8) { ft = s; seated = true; break; }
      ft -= 8;
    }
  }
  return { t: ft, seated: seated };
}

/* ---------- layout ---------- */
function isPhone() {
  var s = window.screen;
  if (s && Math.min(s.width, s.height) < 700) return true;
  return H > W * 1.15;
}
function groundY() { return H * 0.80; }
function figH() { return Math.max(H * 0.052, 26); }

/* ---------- the mountain (built once per seed/salt) ---------- */
var ridge = null;      // near face polyline, foot -> apex: [{x,y}]
var ridgeLen = [];     // cumulative arc lengths
var ridgeTotal = 0;
var apexPt = null, footPt = null;
var farRidge = null, midRidge = null;

function buildMountain() {
  var gy = groundY(), sb = seedBase(), i, t, x, y;
  footPt = { x: W * 0.30, y: gy };
  apexPt = { x: W * 0.70, y: H * 0.15 };
  ridge = [];
  var N = 9;
  for (i = 0; i <= N; i++) {
    t = i / N;
    x = lerp(footPt.x, apexPt.x, t);
    y = lerp(footPt.y, apexPt.y, Math.pow(t, 1.12))
      + (ih(sb, 100 + i) - 0.5) * H * 0.028 * Math.sin(Math.PI * t);
    if (i === 0) y = footPt.y;
    if (i === N) y = apexPt.y;
    ridge.push({ x: x, y: y });
  }
  ridgeLen = [0]; ridgeTotal = 0;
  for (i = 1; i < ridge.length; i++) {
    ridgeTotal += Math.hypot(ridge[i].x - ridge[i - 1].x, ridge[i].y - ridge[i - 1].y);
    ridgeLen.push(ridgeTotal);
  }
  function backRidge(seedOff, baseX, apexX, apexY, footR) {
    var pts = [{ x: baseX, y: gy }], j, tt;
    for (j = 1; j <= 5; j++) {
      tt = j / 6;
      pts.push({
        x: lerp(baseX, apexX, tt),
        y: lerp(gy, apexY, Math.pow(tt, 1.1)) + (ih(sb, seedOff + j) - 0.5) * H * 0.02 * Math.sin(Math.PI * tt)
      });
    }
    pts.push({ x: apexX, y: apexY });
    pts.push({ x: W * 1.04, y: lerp(apexY, gy, footR) });
    pts.push({ x: W * 1.04, y: gy + 2 });
    pts.push({ x: baseX, y: gy + 2 });
    return pts;
  }
  farRidge = backRidge(300, W * 0.40, W * 0.80, H * 0.24, 0.55);
  midRidge = backRidge(400, W * 0.34, W * 0.64, H * 0.28, 0.7);
}

/* point on the near face at arc-length fraction f, plus slope angle */
function surfPoint(f) {
  var target = clamp(f, 0, 1) * ridgeTotal, i = 1, t;
  while (i < ridgeLen.length - 1 && ridgeLen[i] < target) i++;
  t = (target - ridgeLen[i - 1]) / Math.max(ridgeLen[i] - ridgeLen[i - 1], 0.001);
  var a = ridge[i - 1], b = ridge[i];
  return {
    x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t),
    ang: Math.atan2(b.y - a.y, b.x - a.x)
  };
}

/* ---------- attempt schedule ---------- */
var CYCLE = 60;
function attemptFrac(k) {
  if (overrides[k] !== undefined) return overrides[k];
  return 0.10 + ih(seedBase(), 500 + k) * 0.26;   // 0.10 .. 0.36 up the face
}
function stageX(k) {  // where the figure waits before attempt k
  if (k === 0) return W * 0.10;
  return footPt.x - (0.055 + ih(seedBase(), 600 + k) * 0.04) * W;
}
function restX(k) {   // where it steps back to after attempt k's slide
  return footPt.x - (0.034 + ih(seedBase(), 700 + k) * 0.02) * W;
}

/* figure state at schedule time ft */
function figState(ft) {
  var k = Math.floor(ft / CYCLE), lt = ft - k * CYCLE;
  var frac = attemptFrac(k), ap = surfPoint(frac);
  var gy = groundY(), fh = figH();
  var st = {
    x: 0, y: gy, tilt: 0, squash: 0, phase: '', legPh: 0,
    armMode: 'down', k: k, lt: lt, ap: ap, frac: frac, tremble: 0
  };
  if (lt < 10) {                                   /* APPROACH */
    st.phase = 'approach';
    var p = lt / 10, sx = stageX(k);
    if (p < 0.7) {
      var gp = p / 0.7;
      st.x = lerp(sx, footPt.x, gp); st.y = gy;
      st.legPh = lt * 5.2; st.tilt = 0.06;
      st.armMode = 'swing';
    } else {
      var cp = sstep((p - 0.7) / 0.3), sp = surfPoint(frac * cp);
      st.x = sp.x; st.y = sp.y;
      st.legPh = lt * 5.2; st.tilt = 0.10 + cp * 0.15;
      st.armMode = 'swing';
    }
  } else if (lt < 22) {                            /* LEAN / PUSH */
    st.phase = 'lean';
    var lp = lt - 10;
    st.x = ap.x; st.y = ap.y;
    st.leanAmt = sstep(lp / 1.2);
    st.squash = st.leanAmt;
    var step = Math.floor(ft * 8);
    st.tremble = (ih(seedBase() + k, step) - 0.5) * 2;
    st.trembleY = (ih(seedBase() + k, step + 977) - 0.5) * 1.4;
    st.tilt = 0.16 + st.leanAmt * 0.38;
    st.armMode = 'press';
    st.legPh = 0;
  } else if (lt < 26) {                            /* SLIDE */
    st.phase = 'slide';
    var sp2 = (lt - 22) / 4, e = sp2 * sp2;
    var fp = surfPoint(frac * (1 - e));
    st.x = fp.x; st.y = fp.y;
    st.tilt = 0.54 - e * 0.1 + sp2 * 0.18;
    st.squash = (1 - e) * 0.5;
    st.armMode = 'flail';
    st.legPh = 0;
  } else if (lt < 32) {                            /* RECOVER */
    st.phase = 'recover';
    var rp = lt - 26;
    st.y = gy;
    st.tilt = 0.44 * (1 - sstep(rp / 0.8));
    if (rp < 1) { st.x = footPt.x; st.armMode = 'down'; }
    else if (rp < 4) {
      var wp = sstep((rp - 1) / 3);
      st.x = lerp(footPt.x, restX(k), wp);
      st.legPh = lt * 5.2; st.armMode = 'swing'; st.tilt = 0.05;
    } else {
      st.x = restX(k); st.armMode = 'down'; st.tilt = -0.07;  /* gaze up */
    }
    st.dust = (rp > 0.1 && rp < 1.3) ? (rp - 0.1) / 1.2 : -1;
  } else {                                         /* REPOSITION */
    st.phase = 'reposition';
    var from = restX(k), to = stageX(k + 1);
    var dist = Math.abs(to - from), dur = clamp(dist / (W * 0.011), 4, 24);
    var rp2 = lt - 32;
    if (rp2 < dur) {
      var mp = rp2 / dur;
      st.x = lerp(from, to, mp); st.y = gy;
      st.legPh = lt * 5.2; st.tilt = 0.06; st.armMode = 'swing';
    } else {
      st.x = to; st.y = gy; st.tilt = -0.07; st.armMode = 'down';
    }
  }
  st.x += (st.tremble || 0);
  st.y += (st.trembleY || 0);
  return st;
}

/* ---------- drawing helpers ---------- */
function poly(pts, fill) {
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.fill();
}
function ellipse(x, y, rx, ry, fill) {
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.moveTo(x + rx, y);
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
}
function line(x1, y1, x2, y2, wdt, col) {
  ctx.strokeStyle = col;
  ctx.lineWidth = wdt;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function drawMountain() {
  var gy = groundY(), sb = seedBase(), i;
  poly(farRidge, PAL.ridgeFar);
  poly(midRidge, PAL.ridgeMid);
  /* snow caps on the back ridges */
  poly([{ x: W * 0.755, y: H * 0.275 }, { x: W * 0.80, y: H * 0.24 },
        { x: W * 0.845, y: H * 0.278 }, { x: W * 0.815, y: H * 0.30 },
        { x: W * 0.785, y: H * 0.295 }], PAL.snow);
  /* near massif: right face down from the apex */
  var pts = ridge.slice();
  pts.push({ x: W * 0.86, y: H * 0.34 });
  pts.push({ x: W * 1.03, y: H * 0.55 });
  pts.push({ x: W * 1.03, y: gy + 2 });
  pts.push({ x: footPt.x - W * 0.015, y: gy + 2 });
  poly(pts, PAL.slate);
  /* facet shading: shadow slabs down the left face segments */
  ctx.globalAlpha = 0.20;
  for (i = 1; i < ridge.length; i++) {
    if (ih(sb, 200 + i) < 0.55) {
      poly([ridge[i - 1], ridge[i],
            { x: ridge[i].x, y: gy }, { x: ridge[i - 1].x, y: gy }], PAL.shadow);
    }
  }
  ctx.globalAlpha = 1;
  /* deeper facet planes on the right face */
  ctx.globalAlpha = 0.22;
  poly([{ x: apexPt.x, y: apexPt.y }, { x: W * 0.86, y: H * 0.34 },
        { x: W * 0.88, y: gy }, { x: W * 0.74, y: gy }], PAL.shadow);
  ctx.globalAlpha = 1;
  /* snowline: jagged band following the upper ridge */
  var snow = [], snowB = [], done = false;
  for (i = 0; i < ridge.length && !done; i++) {
    if (ridge[i].y < H * 0.37) {
      snow.push(ridge[i]);
      snowB.push({ x: ridge[i].x, y: ridge[i].y + H * (0.022 + ih(sb, 800 + i) * 0.03) });
    } else if (snow.length) done = true;
  }
  if (snow.length > 1) {
    var sp = snow.concat(snowB.reverse());
    poly(sp, PAL.snow);
    /* snow continues over the apex onto the right face */
    poly([{ x: apexPt.x - W * 0.012, y: apexPt.y + H * 0.01 },
          { x: W * 0.86, y: H * 0.34 }, { x: W * 0.845, y: H * 0.365 },
          { x: apexPt.x + W * 0.01, y: apexPt.y + H * 0.045 }], PAL.snow);
  }
  /* scree: lighter speckled apron at the base */
  var scr = [{ x: W * 0.245, y: gy + 2 }];
  for (i = 0; i <= 10; i++) {
    scr.push({ x: W * (0.25 + i * 0.038), y: gy - 2 - ih(sb, 900 + i) * H * 0.012 });
  }
  scr.push({ x: W * 0.635, y: gy + 2 });
  poly(scr, PAL.scree);
  for (i = 0; i < 90; i++) {
    var px = W * (0.25 + ih(sb, 1000 + i) * 0.38);
    var py = gy - 4 + ih(sb, 1200 + i) * 14;
    ellipse(px, py, 1 + ih(sb, 1400 + i) * 1.6, 1 + ih(sb, 1500 + i) * 1.2, PAL.screeDot);
  }
}

function drawPebbles(ft) {
  var k = Math.floor(ft / CYCLE), j, i, sb = seedBase();
  for (j = Math.max(0, k - 2); j <= k; j++) {
    if (ft <= j * CYCLE + 26 && !(j === k && ft > j * CYCLE + 26)) {
      if (j === k) continue;
    }
    if (ft < j * CYCLE + 26) continue;
    var ap = surfPoint(attemptFrac(j));
    for (i = 0; i < 6; i++) {
      var px = ap.x - W * 0.012 + ih(sb, 2000 + j * 31 + i) * W * 0.026;
      var py = groundY() + 3 + ih(sb, 2200 + j * 31 + i) * 6;
      ellipse(px, py, 1.4 + ih(sb, 2400 + j * 31 + i) * 1.8,
              1.1 + ih(sb, 2500 + j * 31 + i) * 1.2, PAL.slateDark);
    }
  }
}

function drawFigure(st, seated) {
  var fh = figH(), x = st.x, y = st.y;
  /* contact shadow while pushing */
  if (st.phase === 'lean' && !seated) {
    ctx.globalAlpha = 0.28 + 0.08 * (st.leanAmt || 0);
    ellipse(st.ap.x + fh * 0.16, st.ap.y + fh * 0.10, fh * 0.34, fh * 0.13, PAL.shadow);
    ctx.globalAlpha = 1;
  } else {
    ctx.globalAlpha = 0.18;
    ellipse(x, y + 2, fh * 0.30, fh * 0.09, PAL.shadow);
    ctx.globalAlpha = 1;
  }
  ctx.save();
  ctx.translate(x, y);
  if (seated) {
    /* defeat as rest: lowered body, legs folded forward, facing the
       mountain (right), gazing up at it */
    line(-fh * 0.05, -fh * 0.16, fh * 0.34, -fh * 0.03, fh * 0.09, PAL.agentDeep);
    line(fh * 0.02, -fh * 0.14, fh * 0.38, -fh * 0.10, fh * 0.09, PAL.agentDark);
    ctx.rotate(-0.05);
    ellipse(0, -fh * 0.34, fh * 0.20, fh * 0.24, PAL.agent);
    ellipse(fh * 0.02, -fh * 0.62, fh * 0.135, fh * 0.135, PAL.agent);
    line(fh * 0.08, -fh * 0.38, fh * 0.30, -fh * 0.12, fh * 0.075, PAL.agentDark);
    ctx.restore();
    return;
  }
  ctx.rotate(st.tilt);
  if (st.squash) ctx.scale(1 + st.squash * 0.07, 1 - st.squash * 0.05);
  var hipY = -fh * 0.34, shY = -fh * 0.66;
  /* legs */
  if (st.phase === 'approach' || st.phase === 'recover' || st.phase === 'reposition') {
    var sw = Math.sin(st.legPh) * fh * 0.16;
    var lift = Math.abs(Math.cos(st.legPh)) * fh * 0.05;
    line(0, hipY, sw, -lift, fh * 0.085, PAL.agentDeep);
    line(0, hipY, -sw, -(fh * 0.05 - lift) * 0.4, fh * 0.085, PAL.agentDark);
  } else if (st.phase === 'slide') {
    line(0, hipY, -fh * 0.20, -fh * 0.10, fh * 0.085, PAL.agentDeep);
    line(0, hipY, -fh * 0.13, -fh * 0.02, fh * 0.085, PAL.agentDark);
  } else { /* lean: both feet planted on the face */
    line(0, hipY, -fh * 0.03, 0, fh * 0.085, PAL.agentDeep);
    line(0, hipY, fh * 0.12, fh * 0.02, fh * 0.085, PAL.agentDark);
  }
  /* torso: soft capsule */
  ctx.fillStyle = PAL.agent;
  ctx.beginPath();
  ctx.moveTo(-fh * 0.17, hipY + fh * 0.06);
  ctx.quadraticCurveTo(-fh * 0.20, shY, 0, shY - fh * 0.05);
  ctx.quadraticCurveTo(fh * 0.20, shY, fh * 0.17, hipY + fh * 0.06);
  ctx.quadraticCurveTo(0, hipY + fh * 0.14, -fh * 0.17, hipY + fh * 0.06);
  ctx.fill();
  /* head: plain circle, no face, seated into the torso */
  ellipse(fh * 0.02, shY - fh * 0.125, fh * 0.14, fh * 0.14, PAL.agent);
  /* arms (press arms are drawn in world space after restore) */
  if (st.armMode === 'press') {
    /* handled below */
  } else if (st.armMode === 'flail') {
    line(fh * 0.08, shY + fh * 0.04, fh * 0.30, shY - fh * 0.34, fh * 0.075, PAL.agentDark);
    line(fh * 0.04, shY + fh * 0.08, -fh * 0.22, shY - fh * 0.10, fh * 0.075, PAL.agentDeep);
  } else if (st.armMode === 'swing') {
    var asw = Math.sin(st.legPh) * fh * 0.10;
    line(fh * 0.08, shY + fh * 0.05, fh * 0.10 - asw, hipY + fh * 0.10, fh * 0.075, PAL.agentDark);
    line(-fh * 0.06, shY + fh * 0.05, -fh * 0.08 + asw, hipY + fh * 0.10, fh * 0.075, PAL.agentDeep);
  } else {
    line(fh * 0.08, shY + fh * 0.05, fh * 0.12, hipY + fh * 0.08, fh * 0.075, PAL.agentDark);
    line(-fh * 0.06, shY + fh * 0.05, -fh * 0.09, hipY + fh * 0.08, fh * 0.075, PAL.agentDeep);
  }
  ctx.restore();
  /* press arms in world space: shoulder (transformed by the same
     translate/rotate/scale the body used) to real contact points on
     the rock face, palms flat along the surface tangent */
  if (st.armMode === 'press' && !seated) {
    var sqx = 1 + (st.squash || 0) * 0.07, sqy = 1 - (st.squash || 0) * 0.05;
    var lx = fh * 0.09 * sqx, ly = (-fh * 0.63) * sqy;
    var cs = Math.cos(st.tilt), sn = Math.sin(st.tilt);
    var shx = x + lx * cs - ly * sn, shy = y + lx * sn + ly * cs;
    var c1 = surfPoint(Math.min(st.frac + 0.030, 1));
    var c2 = surfPoint(Math.min(st.frac + 0.058, 1));
    line(shx, shy, c1.x, c1.y, fh * 0.075, PAL.agentDark);
    line(shx, shy + fh * 0.05, c2.x, c2.y, fh * 0.075, PAL.agentDeep);
    var tx = Math.cos(c1.ang), ty = Math.sin(c1.ang);
    line(c1.x - tx * fh * 0.07, c1.y - ty * fh * 0.07,
         c1.x + tx * fh * 0.07, c1.y + ty * fh * 0.07, fh * 0.09, PAL.agentDark);
    line(c2.x - tx * fh * 0.06, c2.y - ty * fh * 0.06,
         c2.x + tx * fh * 0.06, c2.y + ty * fh * 0.06, fh * 0.09, PAL.agentDeep);
  }
  /* dust puff in early recover */
  if (st.dust !== undefined && st.dust >= 0) {
    var dp = st.dust, sb = seedBase();
    ctx.globalAlpha = 0.5 * (1 - dp);
    for (var i = 0; i < 3; i++) {
      ellipse(st.x - fh * 0.2 + i * fh * 0.2 + (ih(sb, 3000 + i) - 0.5) * 6,
              st.y - dp * fh * 0.22 - i * 1.5,
              fh * (0.06 + dp * 0.10), fh * (0.045 + dp * 0.07), PAL.groundBand);
    }
    ctx.globalAlpha = 1;
  }
}

function draw(u) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var sc = schedTime(u);
  var ft = sc.t;
  /* sky */
  ctx.fillStyle = PAL.sky;
  ctx.fillRect(0, 0, W, H);
  /* one cloud band, barely moving */
  var cx = ((ft * 0.9) % (W * 1.35)) - W * 0.18;
  ctx.globalAlpha = 0.8;
  ellipse(cx, H * 0.10, W * 0.16, H * 0.020, PAL.cloud);
  ellipse(cx + W * 0.10, H * 0.115, W * 0.12, H * 0.016, PAL.cloud);
  ellipse(cx - W * 0.11, H * 0.112, W * 0.10, H * 0.014, PAL.cloud);
  ctx.globalAlpha = 1;
  /* ground */
  ctx.fillStyle = PAL.ground;
  ctx.fillRect(0, groundY(), W, H - groundY());
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = PAL.groundBand;
  ctx.fillRect(0, groundY(), W, H * 0.012);
  ctx.globalAlpha = 1;
  drawMountain();
  drawPebbles(ft);
  var st = figState(ft);
  drawFigure(st, sc.seated);
}

/* ---------- interaction ---------- */
var pDown = null, lastTap = null, pendingSit = null;

function evPos(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return { x: (e.clientX || 0) - r.left, y: (e.clientY || 0) - r.top };
}
function requestSit() {
  var u = pieceNow();
  var sc = schedTime(u);
  if (sc.seated) return;
  var ft = sc.t, k = Math.floor(ft / CYCLE), lt = ft - k * CYCLE;
  var at;
  if (lt >= 10 && lt < 26) at = k * CYCLE + 26;      /* lean/slide: sit at recover */
  else at = ft;
  for (var i = 0; i < sits.length; i++) {
    if (Math.abs(sits[i].at - at) < 8) return;        /* already queued/active */
  }
  sits.push({ at: at });
}
canvas.addEventListener('pointerdown', function (e) {
  pDown = { p: evPos(e), t: perfNow(), drag: false };
});
canvas.addEventListener('pointermove', function (e) {
  if (!pDown) return;
  var p = evPos(e);
  if (Math.abs(p.x - pDown.p.x) > 12 || Math.abs(p.y - pDown.p.y) > 12) pDown.drag = true;
});
function endPointer(e) {
  if (!pDown) return;
  var p = evPos(e), wasDrag = pDown.drag;
  var dur = perfNow() - pDown.t;
  pDown = null;
  if (wasDrag) {
    /* drag: set the NEXT attempt point from the pointer's x */
    var sc = schedTime(pieceNow());
    var k = Math.floor(sc.t / CYCLE);
    var f = clamp((p.x / W - 0.30) / 0.40, 0, 1);   /* rough inverse along the face */
    /* refine: find frac whose surface x is closest to pointer x */
    var best = 0, bd = 1e9;
    for (var q = 0; q <= 40; q++) {
      var cand = q / 40 * 0.6, sp = surfPoint(cand);
      var d = Math.abs(sp.x - p.x);
      if (d < bd) { bd = d; best = cand; }
    }
    overrides[k + 1] = clamp(best, 0.05, 0.45);
    return;
  }
  if (dur < 0.45) {                                    /* tap */
    var now = perfNow();
    if (lastTap !== null && now - lastTap < 0.35) {    /* double-tap: reseed */
      salt++;
      sits = [];
      overrides = {};
      runStart = pieceNow() - T0;
      lastTap = null;
      buildMountain();
    } else {
      lastTap = now;
      pendingSit = now;
    }
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { pDown = null; });

/* ---------- boot ---------- */
function resize() {
  var vv = window.visualViewport;
  W = Math.floor(vv ? vv.width : window.innerWidth);
  H = Math.floor(vv ? vv.height : window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildMountain();
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { resize(); draw(pieceNow()); });
window.addEventListener('resize', function () { resize(); draw(pieceNow()); });

resize();
draw(T0);
booted = true;
if (typeof requestAnimationFrame === 'function') {
  var tick = function () {
    if (pendingSit !== null && perfNow() - pendingSit > 0.35) {
      pendingSit = null;
      requestSit();
    }
    draw(pieceNow());
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
