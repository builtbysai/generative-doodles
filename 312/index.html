<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.312 Marble &amp; Transfer</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#221E1A; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.312 Marble & Transfer (Xanthe Caesia).
// A centred slab-marbled ceramic mug: two-colour domain-warped
// fbm clay in brown and cream, recomputed as data each frame
// inside the mug clip on a single canvas. Dragging advects the
// warp phase so the clay re-swirls under the finger. Over the
// clay sits exactly one crisp silkscreen transfer at a time,
// drawn unwarped as flat path data in ink plus one accent.
// Tapping stamps the next motif in the authored four-motif
// cycle wattle, bee, banksia, butterfly, with a press pop.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var BROWN = '#8A6A4E', CREAM = '#EFE6D3', INK = '#1E1B16';
var GROUND = '#221E1A';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 4, lastNow = -1, acc = 0;
var TICK = 1 / 60;

// ---- seeded rng (static data generation only) -----------------------
function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }
function ell(x, y, rx, ry, rot, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }

// ---- seeded value noise + fbm (data-only marbling field) ------------
var PERM = [];
(function () {
  var r = rng(31277), i, j, tmp;
  var p = [];
  for (i = 0; i < 256; i++) p.push(i);
  for (i = 255; i > 0; i--) { j = Math.floor(r() * (i + 1)); tmp = p[i]; p[i] = p[j]; p[j] = tmp; }
  for (i = 0; i < 512; i++) PERM.push(p[i & 255]);
})();
function lat(ix, iy) { return PERM[(PERM[ix & 255] + iy) & 255] / 255; }
function vnoise(x, y) {
  var ix = Math.floor(x), iy = Math.floor(y);
  var fx = x - ix, fy = y - iy;
  var ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  var a = lat(ix, iy), b = lat(ix + 1, iy), c = lat(ix, iy + 1), d = lat(ix + 1, iy + 1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y) {
  var v = 0, amp = 0.55, f = 1, norm = 0, i;
  for (i = 0; i < 4; i++) {
    v += amp * vnoise(x * f, y * f);
    norm += amp; amp *= 0.5; f *= 2.03;
  }
  return v / norm;
}

// ---- mug geometry -----------------------------------------------------
var MCX = 640, MTOP = 268, MBOT = 656;
var MTX = MCX, MTY = MTOP + 8; // motif centre sits below
var FACEY = 478;
function mugPath() {
  ctx.beginPath();
  ctx.moveTo(MCX - 188, MTOP);
  ctx.lineTo(MCX + 188, MTOP);
  ctx.bezierCurveTo(MCX + 192, MTOP + 130, MCX + 180, MBOT - 92, MCX + 148, MBOT - 22);
  ctx.quadraticCurveTo(MCX + 138, MBOT, MCX + 108, MBOT);
  ctx.lineTo(MCX - 108, MBOT);
  ctx.quadraticCurveTo(MCX - 138, MBOT, MCX - 148, MBOT - 22);
  ctx.bezierCurveTo(MCX - 180, MBOT - 92, MCX - 192, MTOP + 130, MCX - 188, MTOP);
  ctx.closePath();
}
function handlePath() {
  ctx.beginPath();
  ctx.moveTo(MCX + 178, MTOP + 74);
  ctx.bezierCurveTo(MCX + 292, MTOP + 62, MCX + 306, MTOP + 168, MCX + 262, MTOP + 238);
  ctx.bezierCurveTo(MCX + 232, MTOP + 284, MCX + 204, MTOP + 292, MCX + 172, MTOP + 282);
}

// ---- warp state: drag advects the phase, idle holds still -----------
// Non-zero start so frame one already reads as developed marbling.
var warpX = 2.35, warpY = -1.15;
var warpVX = 0, warpVY = 0;

// ---- transfer motifs: authored cycle of exactly 4, asserted ---------
function drawWattle(cx, cy, accent) {
  // stem
  st(INK, 6);
  ctx.beginPath(); ctx.moveTo(cx - 54, cy + 78);
  ctx.quadraticCurveTo(cx - 18, cy + 10, cx + 26, cy - 72); ctx.stroke();
  st(INK, 4);
  ctx.beginPath(); ctx.moveTo(cx - 22, cy + 34);
  ctx.quadraticCurveTo(cx + 8, cy + 2, cx + 52, cy - 26); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 8, cy - 6);
  ctx.quadraticCurveTo(cx - 34, cy - 30, cx - 62, cy - 40); ctx.stroke();
  // narrow leaves in ink
  ctx.fillStyle = INK;
  var leaves = [[-38, 44, -0.7], [-26, 6, 0.8], [-2, -34, -0.9], [18, 20, 0.7]];
  var i, L;
  for (i = 0; i < leaves.length; i++) {
    L = leaves[i];
    ctx.save(); ctx.translate(cx + L[0], cy + L[1]); ctx.rotate(L[2]);
    ctx.beginPath(); ctx.moveTo(0, -16); ctx.quadraticCurveTo(7, 0, 0, 16); ctx.quadraticCurveTo(-7, 0, 0, -16); ctx.fill();
    ctx.restore();
  }
  // golden pom blossoms clustered at the branch tips
  ctx.fillStyle = accent;
  var poms = [[26, -76, 13], [12, -62, 10], [42, -62, 10], [52, -28, 11], [38, -16, 8], [-62, -44, 11], [-48, -32, 8], [30, -88, 8], [58, -40, 7]];
  for (i = 0; i < poms.length; i++) circ(cx + poms[i][0], cy + poms[i][1], poms[i][2], true);
  ctx.fillStyle = INK;
  for (i = 0; i < poms.length; i++) circ(cx + poms[i][0], cy + poms[i][1], 2.2, true);
}
function drawBee(cx, cy, accent) {
  // wings first, cream with ink outline, above the body
  ctx.fillStyle = CREAM;
  ell(cx - 16, cy - 52, 40, 20, -0.55, true); st(INK, 4); ell(cx - 16, cy - 52, 40, 20, -0.55, false);
  ell(cx + 30, cy - 50, 34, 17, 0.5, true); st(INK, 4); ell(cx + 30, cy - 50, 34, 17, 0.5, false);
  // body in amber with ink bands
  ctx.fillStyle = accent;
  ell(cx, cy + 6, 66, 50, 0.18, true);
  ctx.save();
  ell(cx, cy + 6, 66, 50, 0.18, false); ctx.clip();
  ctx.fillStyle = INK;
  ctx.fillRect(cx - 34, cy - 52, 17, 116);
  ctx.fillRect(cx + 4, cy - 52, 15, 116);
  ctx.fillRect(cx + 36, cy - 52, 11, 116);
  ctx.restore();
  st(INK, 4.5); ell(cx, cy + 6, 66, 50, 0.18, false);
  // head
  ctx.fillStyle = INK; circ(cx - 62, cy - 18, 24, true);
  ctx.fillStyle = CREAM; circ(cx - 68, cy - 24, 5, true);
  // antennae and legs
  st(INK, 4);
  ctx.beginPath(); ctx.moveTo(cx - 74, cy - 38); ctx.quadraticCurveTo(cx - 88, cy - 58, cx - 100, cy - 60); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 56, cy - 40); ctx.quadraticCurveTo(cx - 58, cy - 62, cx - 70, cy - 70); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 28, cy + 50); ctx.lineTo(cx - 36, cy + 74); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 8, cy + 54); ctx.lineTo(cx + 4, cy + 78); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 40, cy + 46); ctx.lineTo(cx + 48, cy + 68); ctx.stroke();
  // stinger
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.moveTo(cx + 62, cy - 4); ctx.lineTo(cx + 84, cy + 4); ctx.lineTo(cx + 60, cy + 16); ctx.closePath(); ctx.fill();
}
function drawBanksia(cx, cy, accent) {
  // stem
  st(INK, 6);
  ctx.beginPath(); ctx.moveTo(cx, cy + 46); ctx.quadraticCurveTo(cx - 4, cy + 66, cx - 14, cy + 84); ctx.stroke();
  ctx.fillStyle = INK;
  ctx.save(); ctx.translate(cx - 22, cy + 68); ctx.rotate(-0.8);
  ctx.beginPath(); ctx.moveTo(0, -15); ctx.quadraticCurveTo(7, 0, 0, 15); ctx.quadraticCurveTo(-7, 0, 0, -15); ctx.fill();
  ctx.restore();
  // cone body in rust
  ctx.fillStyle = accent;
  ctx.beginPath();
  ctx.moveTo(cx - 34, cy + 48);
  ctx.bezierCurveTo(cx - 40, cy - 10, cx - 26, cy - 66, cx, cy - 84);
  ctx.bezierCurveTo(cx + 26, cy - 66, cx + 40, cy - 10, cx + 34, cy + 48);
  ctx.quadraticCurveTo(cx, cy + 60, cx - 34, cy + 48);
  ctx.closePath(); ctx.fill();
  st(INK, 4); ctx.stroke();
  // hooked styles: rows of small ink hooks over the cone
  st(INK, 3.4);
  var row, k, yy, hw, xx;
  for (row = 0; row < 8; row++) {
    yy = cy - 66 + row * 15;
    hw = 30 - Math.abs(row - 3.2) * 2.6;
    for (k = -2; k <= 2; k++) {
      xx = cx + k * (hw / 2.4);
      ctx.beginPath(); ctx.moveTo(xx - 5, yy + 6);
      ctx.quadraticCurveTo(xx, yy - 5, xx + 6, yy - 3); ctx.stroke();
    }
  }
  // tip tuft
  st(INK, 3.4);
  for (k = -2; k <= 2; k++) {
    ctx.beginPath(); ctx.moveTo(cx + k * 6, cy - 82);
    ctx.quadraticCurveTo(cx + k * 9, cy - 96, cx + k * 13, cy - 100); ctx.stroke();
  }
}
function drawButterfly(cx, cy, accent) {
  ctx.fillStyle = accent;
  // upper wings
  ell(cx - 46, cy - 30, 42, 27, -0.5, true); st(INK, 4.5); ell(cx - 46, cy - 30, 42, 27, -0.5, false);
  ell(cx + 46, cy - 30, 42, 27, 0.5, true); st(INK, 4.5); ell(cx + 46, cy - 30, 42, 27, 0.5, false);
  // lower wings
  ell(cx - 36, cy + 28, 32, 22, 0.5, true); st(INK, 4.5); ell(cx - 36, cy + 28, 32, 22, 0.5, false);
  ell(cx + 36, cy + 28, 32, 22, -0.5, true); st(INK, 4.5); ell(cx + 36, cy + 28, 32, 22, -0.5, false);
  // ink spots on the wings
  ctx.fillStyle = INK;
  circ(cx - 52, cy - 34, 8, true); circ(cx + 52, cy - 34, 8, true);
  circ(cx - 36, cy + 28, 6, true); circ(cx + 36, cy + 28, 6, true);
  circ(cx - 68, cy - 18, 4.5, true); circ(cx + 68, cy - 18, 4.5, true);
  // body and head
  ell(cx, cy, 11, 46, 0, true);
  circ(cx, cy - 54, 11, true);
  st(INK, 4);
  ctx.beginPath(); ctx.moveTo(cx - 5, cy - 62); ctx.quadraticCurveTo(cx - 22, cy - 82, cx - 34, cy - 84); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 5, cy - 62); ctx.quadraticCurveTo(cx + 22, cy - 82, cx + 34, cy - 84); ctx.stroke();
  ctx.fillStyle = INK; circ(cx - 36, cy - 85, 3.4, true); circ(cx + 36, cy - 85, 3.4, true);
}
var MOTIFS = [
  { name: 'wattle', accent: '#D9A441', draw: drawWattle },
  { name: 'bee', accent: '#C97B2D', draw: drawBee },
  { name: 'banksia', accent: '#A4552F', draw: drawBanksia },
  { name: 'butterfly', accent: '#C97B2D', draw: drawButterfly }
];
if (MOTIFS.length !== 4) throw new Error('Marble & Transfer needs exactly 4 motifs in the cycle');
var motifIdx = 0; // exactly 1 motif stamped at any time
var popT0 = -9;

// ---- drawing -----------------------------------------------------------
function drawMarbling() {
  // two-colour domain-warp fbm sampled as data inside the mug clip:
  // warped fbm blended with warped sine bands so the clay reads as
  // flowing agate swirls rather than blobs
  var step = 8;
  var x, y, nx, ny, qx, qy, v, band;
  for (y = MTOP - 6; y < MBOT + step; y += step) {
    for (x = MCX - 200; x < MCX + 200; x += step) {
      nx = x * 0.006 + warpX;
      ny = y * 0.006 + warpY;
      qx = fbm(nx + 5.2, ny + 1.3);
      qy = fbm(nx + 8.3, ny + 2.8);
      v = fbm(nx + 3.4 * (qx - 0.5), ny + 3.4 * (qy - 0.5));
      band = 0.5 + 0.5 * Math.sin((nx * 2.6 + ny * 1.1 + 5.2 * (qx - 0.5) + 2.4 * (qy - 0.5)) * Math.PI);
      v = v * 0.62 + band * 0.38;
      ctx.fillStyle = v >= 0.5 ? CREAM : BROWN;
      ctx.fillRect(x, y, step + 1, step + 1);
    }
  }
}
function drawMug() {
  // contact shadow
  ctx.globalAlpha = 0.45; ctx.fillStyle = INK;
  ell(MCX + 8, MBOT + 22, 238, 20, 0, true);
  ctx.globalAlpha = 1;
  // handle behind the body, marbled clay suggested by layered strokes
  st(BROWN, 40); handlePath(); ctx.stroke();
  st(CREAM, 13); ctx.globalAlpha = 0.8; handlePath(); ctx.stroke(); ctx.globalAlpha = 1;
  st(BROWN, 5); ctx.globalAlpha = 0.65; handlePath(); ctx.stroke(); ctx.globalAlpha = 1;
  // marbled body, clipped to the profile
  ctx.save();
  mugPath(); ctx.clip();
  drawMarbling();
  // soft shading at the foot and right edge, flat translucent clay tones
  ctx.globalAlpha = 0.16; ctx.fillStyle = INK;
  ctx.fillRect(MCX + 118, MTOP, 74, MBOT - MTOP);
  ctx.globalAlpha = 0.10; ctx.fillStyle = CREAM;
  ctx.fillRect(MCX - 192, MTOP, 44, MBOT - MTOP);
  ctx.globalAlpha = 1;
  ctx.restore();
  // body outline
  mugPath(); st(INK, 4); ctx.stroke();
  // rim: marbled band and dark mouth
  ell(MCX, MTOP, 188, 30, 0, false);
  ctx.fillStyle = CREAM; ell(MCX, MTOP, 188, 30, 0, true);
  ctx.save();
  ell(MCX, MTOP, 188, 30, 0, false); ctx.clip();
  ctx.globalAlpha = 0.85; ctx.fillStyle = BROWN;
  ctx.fillRect(MCX - 188, MTOP - 30, 130, 60);
  ctx.fillRect(MCX + 40, MTOP - 30, 90, 60);
  ctx.globalAlpha = 1;
  ctx.restore();
  st(INK, 4); ell(MCX, MTOP, 188, 30, 0, false);
  ctx.fillStyle = GROUND; ell(MCX, MTOP, 158, 21, 0, true);
  st(INK, 3.5); ell(MCX, MTOP, 158, 21, 0, false);
  // foot line
  st(INK, 3); ctx.globalAlpha = 0.55;
  ctx.beginPath(); ctx.moveTo(MCX - 118, MBOT - 14); ctx.lineTo(MCX + 118, MBOT - 14); ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawTransfer() {
  var m = MOTIFS[motifIdx];
  var pa = T - popT0, scale = 1, alpha = 1;
  if (pa >= 0 && pa < 0.5) {
    var p = pa / 0.5;
    scale = 1 - 0.10 * Math.sin(p * Math.PI) + 0.05 * Math.sin(p * Math.PI * 2) * (1 - p);
    alpha = 0.82 + 0.18 * p;
  }
  ctx.save();
  ctx.translate(MCX, FACEY - 14);
  ctx.scale(scale * 1.5, scale * 1.5);
  ctx.globalAlpha = alpha;
  m.draw(0, 0, m.accent);
  ctx.restore();
  ctx.globalAlpha = 1;
}
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  drawMug();
  drawTransfer();
}

// ---- sizing -------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- interaction ----------------------------------------------------------
function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
function inMug(p) {
  return p[0] > MCX - 210 && p[0] < MCX + 330 && p[1] > MTOP - 50 && p[1] < MBOT + 40;
}
var drag = null;
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  drag = { x: p[0], y: p[1], sx: p[0], sy: p[1], moved: 0, inside: inMug(p) };
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var p = toDesign(e), dx = p[0] - drag.x, dy = p[1] - drag.y;
  drag.moved = Math.max(drag.moved, Math.abs(p[0] - drag.sx), Math.abs(p[1] - drag.sy));
  if (drag.inside) {
    // advect the warp phase by the drag vector: clay re-swirls,
    // the transfer above it is drawn unwarped and stays crisp
    warpVX += dx * 0.00035;
    warpVY += dy * 0.00035;
  }
  drag.x = p[0]; drag.y = p[1];
});
canvas.addEventListener('pointerup', function (e) {
  if (drag && drag.moved < 9) {
    var p = toDesign(e);
    if (inMug(p) || drag.inside) {
      motifIdx = (motifIdx + 1) % MOTIFS.length;
      popT0 = T;
    }
  }
  drag = null;
});
canvas.addEventListener('pointercancel', function () { drag = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) {
    T += TICK; acc -= TICK; guard++;
    warpX += warpVX; warpY += warpVY;
    warpVX *= Math.exp(-2.2 * TICK);
    warpVY *= Math.exp(-2.2 * TICK);
    if (Math.abs(warpVX) < 0.000001) warpVX = 0;
    if (Math.abs(warpVY) < 0.000001) warpVY = 0;
  }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
