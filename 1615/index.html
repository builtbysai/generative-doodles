<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replenishing the Wall</title>
<style>
html, body { margin: 0; padding: 0; background: #101014; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var WALL = '#101014';
var TEXT = '#D8D5CC';
var PALETTES = [
  ['#F2F1EC', '#191920'],
  ['#5B7A8C', '#DCE6EC'],
  ['#6E2A2E', '#1E1416'],
  ['#2E4A6B', '#EFE6D4']
];
var PHASE = 1.0;
var MINT_S = 20.0;
var DRAW_S = 2.0;
var SEED = 1615007;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH) * 0.96;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
var compRectCache = { x: 0, y: 0, w: 0, h: 0 };
function gridGeom(rect) {
  var pad = Math.max(8, 0.02 * rect.w);
  var headerH = Math.max(36, 0.085 * rect.h);
  var footerH = Math.max(22, 0.05 * rect.h);
  var gx = rect.x + pad, gy = rect.y + headerH;
  var gw = rect.w - 2 * pad, gh = rect.h - headerH - footerH - pad * 0.5;
  var g = Math.max(3, 0.008 * rect.w);
  var tw = (gw - 3 * g) / 4, th = (gh - 2 * g) / 3;
  return { x: gx, y: gy, w: gw, h: gh, g: g, tw: tw, th: th };
}
function slotRect(g, s) {
  var col = s % 4, row = Math.floor(s / 4);
  return { x: g.x + col * (g.tw + g.g), y: g.y + row * (g.th + g.g), w: g.tw, h: g.th };
}

/* ---- seeds: pure functions of (slot, mint generation); taps use a fixed sequence ---- */
function initSeed(s) { return (SEED + s * 104729 + 99991) >>> 0; }
function genSeed(s, k) { return (SEED + s * 104729 + k * 7919) >>> 0; }
function tapSeed(s, n) { return (SEED + s * 104729 + 500000 + n * 7919) >>> 0; }
var overrides = [];
(function () { var i; for (i = 0; i < 12; i++) overrides.push(null); })();

/* ---- op builders: each mini-system returns a list of closures, drawn in plot order ---- */
function opLine(x0, y0, x1, y1) {
  return function () {
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  };
}
function opArc(cx, cy, r, a0, a1) {
  return function () {
    ctx.beginPath();
    ctx.moveTo(cx + r * Math.cos(a0), cy + r * Math.sin(a0));
    ctx.arc(cx, cy, r, a0, a1);
    ctx.stroke();
  };
}
function opDot(x, y, r) {
  return function () {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  };
}
function sysAlley(tr, rng) {
  var ops = [], i, j;
  var vx = tr.x + tr.w * (0.35 + rng() * 0.3);
  var vy = tr.y + tr.h * (0.30 + rng() * 0.15);
  var px, py;
  for (i = 0; i <= 6; i++) {
    px = tr.x + (i / 6) * tr.w;
    ops.push(opLine(vx, vy, px, tr.y + tr.h));
  }
  for (i = 0; i <= 4; i++) {
    px = tr.x + (i / 4) * tr.w;
    ops.push(opLine(vx, vy, px, tr.y));
  }
  for (i = 0; i < 4; i++) {
    var fx = 0.12 + i * 0.25;
    var lx = tr.x + fx * tr.w;
    var rx = tr.x + (1 - fx) * tr.w;
    ops.push(opLine(lx, tr.y + tr.h * 0.55, lx + (vx - lx) * 0.25, tr.y + tr.h * 0.72));
    ops.push(opLine(rx, tr.y + tr.h * 0.55, rx + (vx - rx) * 0.25, tr.y + tr.h * 0.72));
  }
  for (i = 1; i <= 5; i++) {
    var f = i / 5;
    py = vy + (tr.y + tr.h - vy) * f * f;
    ops.push(opLine(tr.x + tr.w * 0.08 * f, py, tr.x + tr.w * (1 - 0.08 * f), py));
  }
  var dw = tr.w * 0.07, dh = tr.h * 0.16;
  ops.push(opLine(vx - dw, vy, vx - dw, vy + dh));
  ops.push(opLine(vx + dw, vy, vx + dw, vy + dh));
  ops.push(opLine(vx - dw, vy + dh, vx + dw, vy + dh));
  for (j = 0; j < 14; j++) {
    var hx = tr.x + rng() * tr.w;
    var hy = tr.y + tr.h * (0.55 + rng() * 0.4);
    ops.push(opLine(hx, hy, hx + tr.w * 0.03, hy + tr.h * 0.02));
  }
  return ops;
}
function sysCabin(tr, rng) {
  var ops = [], i;
  var cx = tr.x + tr.w * (0.30 + rng() * 0.40);
  var base = tr.y + tr.h * (0.55 + rng() * 0.20);
  var s = tr.w * (0.26 + rng() * 0.10);
  var roof = base - s * 0.85, peak = base - s * 1.25;
  ops.push(opLine(cx - s * 0.62, roof, cx, peak));
  ops.push(opLine(cx, peak, cx + s * 0.62, roof));
  ops.push(opLine(cx - s * 0.5, roof, cx - s * 0.5, base));
  ops.push(opLine(cx + s * 0.5, roof, cx + s * 0.5, base));
  ops.push(opLine(cx - s * 0.5, base, cx + s * 0.5, base));
  ops.push(opLine(cx - s * 0.12, base, cx - s * 0.12, base - s * 0.45));
  ops.push(opLine(cx + s * 0.12, base, cx + s * 0.12, base - s * 0.45));
  ops.push(opLine(cx - s * 0.12, base - s * 0.45, cx + s * 0.12, base - s * 0.45));
  ops.push(opLine(cx + s * 0.18, roof - s * 0.12, cx + s * 0.18, roof - s * 0.12));
  ops.push(opLine(cx + s * 0.18, roof - s * 0.12, cx + s * 0.42, roof - s * 0.12));
  ops.push(opLine(cx + s * 0.42, roof - s * 0.12, cx + s * 0.42, roof + s * 0.22));
  ops.push(opLine(cx + s * 0.18, roof + s * 0.22, cx + s * 0.42, roof + s * 0.22));
  ops.push(opLine(tr.x + tr.w * 0.08, base + s * 0.06, tr.x + tr.w * 0.92, base + s * 0.06));
  var ndot = 90;
  for (i = 0; i < ndot; i++) {
    var dx = tr.x + rng() * tr.w;
    var dy = tr.y + rng() * tr.h;
    if (dx > cx - s * 0.65 && dx < cx + s * 0.65 && dy > peak - s * 0.1 && dy < base + s * 0.1) continue;
    ops.push(opDot(dx, dy, Math.max(0.7, 0.006 * tr.w)));
  }
  return ops;
}
function sysScallop(tr, rng) {
  var ops = [], r, c;
  var rows = 4 + Math.floor(rng() * 2);
  var cols = 4 + Math.floor(rng() * 2);
  var rad = tr.w / (cols * 2);
  var y0 = tr.y + tr.h * 0.10;
  var yStep = (tr.h * 0.82) / rows;
  for (r = 0; r < rows; r++) {
    var off = (r % 2) * rad;
    for (c = -1; c < cols; c++) {
      var ax = tr.x + rad + c * rad * 2 + off;
      var ay = y0 + r * yStep + rad;
      if (ax < tr.x - rad || ax > tr.x + tr.w + rad) continue;
      ops.push(opArc(ax, ay, rad * 0.92, Math.PI, 0));
    }
    ops.push(opLine(tr.x + tr.w * 0.06, y0 + r * yStep + rad * 2, tr.x + tr.w * 0.94, y0 + r * yStep + rad * 2));
  }
  return ops;
}
function sysWhorl(tr, rng) {
  var ops = [], i, j;
  var nC = 2 + Math.floor(rng() * 2);
  for (i = 0; i < nC; i++) {
    var cx = tr.x + tr.w * (0.22 + rng() * 0.56);
    var cy = tr.y + tr.h * (0.22 + rng() * 0.56);
    var turns = 2.5 + rng() * 1.5;
    var steps = 30;
    var px = cx, py = cy;
    for (j = 1; j <= steps; j++) {
      var th = (j / steps) * turns * TAU;
      var rr = tr.w * 0.02 + (j / steps) * tr.w * 0.22;
      var nx = cx + rr * Math.cos(th + i);
      var ny = cy + rr * Math.sin(th + i) * 0.9;
      ops.push(opLine(px, py, nx, ny));
      px = nx; py = ny;
    }
  }
  for (i = 0; i < 10; i++) {
    var sx = tr.x + rng() * tr.w;
    var sy = tr.y + rng() * tr.h;
    ops.push(opLine(sx, sy, sx + tr.w * 0.04, sy + tr.h * 0.02));
  }
  return ops;
}
function sysFan(tr, rng) {
  var ops = [], i, j;
  var nF = 2 + Math.floor(rng() * 2);
  for (i = 0; i < nF; i++) {
    var bx = tr.x + tr.w * (0.15 + (i + rng() * 0.6) * (0.7 / nF));
    var by = tr.y + tr.h * 0.88;
    var blades = 9 + Math.floor(rng() * 4);
    for (j = 0; j < blades; j++) {
      var ang = -Math.PI * (0.92 - (j / (blades - 1)) * 0.84);
      var len = tr.h * (0.45 + rng() * 0.30);
      ops.push(opLine(bx, by, bx + len * Math.cos(ang), by + len * Math.sin(ang)));
    }
    ops.push(opArc(bx, by, tr.w * 0.05, Math.PI, 0));
    ops.push(opLine(bx - tr.w * 0.10, by, bx + tr.w * 0.10, by));
  }
  return ops;
}
var SYSTEMS = [sysAlley, sysCabin, sysScallop, sysWhorl, sysFan];
function drawTileArt(tr, seed, p) {
  var rng = mulberry32(seed);
  var pal = PALETTES[Math.floor(rng() * PALETTES.length)];
  var sys = Math.floor(rng() * SYSTEMS.length);
  ctx.fillStyle = pal[0];
  ctx.fillRect(tr.x, tr.y, tr.w, tr.h);
  ctx.strokeStyle = pal[1];
  ctx.fillStyle = pal[1];
  ctx.lineWidth = Math.max(1, 0.012 * tr.w);
  ctx.lineCap = 'round';
  var ops = SYSTEMS[sys](tr, rng);
  var n = Math.floor(ops.length * clamp(p, 0, 1));
  var i;
  for (i = 0; i < n; i++) ops[i]();
}
function slotContent(s, k, t) {
  var seed, prevSeed, drawStart;
  if (k < 0) {
    seed = initSeed(s);
    prevSeed = null;
    drawStart = -1e9;
  } else {
    seed = genSeed(s, k);
    prevSeed = (k - 12 < 0) ? initSeed(s) : genSeed(s, k - 12);
    drawStart = k * MINT_S;
  }
  var ov = overrides[s];
  if (ov && ov.t0 > drawStart) {
    prevSeed = seed;
    seed = ov.seed;
    drawStart = ov.t0;
  }
  var p = clamp((t - drawStart) / DRAW_S, 0, 1);
  return { seed: seed, prevSeed: prevSeed, p: p };
}
function drawTile(tr, content) {
  if (content.prevSeed !== null && content.p < 1) {
    ctx.save();
    ctx.globalAlpha = 1 - smooth(content.p);
    drawTileArt(tr, content.prevSeed, 1);
    ctx.restore();
  }
  ctx.save();
  ctx.beginPath();
  ctx.rect(tr.x, tr.y, Math.max(0, tr.w * content.p), tr.h);
  ctx.clip();
  drawTileArt(tr, content.seed, content.p);
  ctx.restore();
}
function onTap(e) {
  var x = (typeof e.clientX === 'number') ? e.clientX : 0;
  var y = (typeof e.clientY === 'number') ? e.clientY : 0;
  if (canvas.getBoundingClientRect) {
    var r = canvas.getBoundingClientRect();
    x -= r.left; y -= r.top;
  }
  var g = gridGeom(compRectCache);
  var col = Math.floor((x - g.x) / (g.tw + g.g));
  var row = Math.floor((y - g.y) / (g.th + g.g));
  if (col < 0 || col > 3 || row < 0 || row > 2) return;
  var lx = x - (g.x + col * (g.tw + g.g));
  var ly = y - (g.y + row * (g.th + g.g));
  if (lx < 0 || lx > g.tw || ly < 0 || ly > g.th) return;
  var s = row * 4 + col;
  var n = (overrides[s] ? overrides[s].n : 0) + 1;
  overrides[s] = { seed: tapSeed(s, n), t0: lastT, n: n };
  draw(lastT);
}
function draw(t) {
  lastT = t;
  size();
  var rect = compRect();
  compRectCache = rect;
  ctx.fillStyle = WALL;
  ctx.fillRect(0, 0, VW, VH);
  var titlePx = isPhone ? 15 : 17;
  var smallPx = isPhone ? 11 : 12;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = TEXT;
  ctx.fillText('Replenishing the Wall', rect.x + rect.w / 2, rect.y + Math.max(6, 0.012 * rect.h));
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(hexRgb(TEXT), 0.65);
  ctx.fillText('2006 · 06 · 14', rect.x + rect.w / 2, rect.y + Math.max(6, 0.012 * rect.h) + titlePx + 5);
  var g = gridGeom(rect);
  var m = Math.floor(t / MINT_S);
  var s;
  for (s = 0; s < 12; s++) {
    var tr = slotRect(g, s);
    var k = m - (((m - s) % 12 + 12) % 12);
    drawTile(tr, slotContent(s, k, t));
  }
  ctx.textAlign = 'center';
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(hexRgb(TEXT), 0.7);
  ctx.fillText('Tap a tile to mint one.', rect.x + rect.w / 2, rect.y + rect.h - smallPx - 10);
}
if (typeof canvas.addEventListener === 'function') canvas.addEventListener('pointerdown', onTap);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
