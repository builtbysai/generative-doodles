<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fifteen Years of Branching</title>
<style>
  html, body { margin: 0; padding: 0; background: #F4EFE3; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var PAPER = '#F4EFE3';
  var BARK = '#5D4037';        // trunk and first-order branches
  var BRANCH = '#2B2B2B';      // finer branch ink
  var LEAF_COLORS = ['#2E86AB', '#C0392B', '#7D3C98']; // three data classes
  var LABEL = '#1A1A1A';
  var GOLD = '#B9770E';         // the root

  var LOOP = 90;               // grow 65, hold 10, shed 8, bare/fade 7
  var OFFSET = 41;             // frame one sits 41s into the loop: lower canopy leafed, top still extending
  var SHED_START = 75, SHED_END = 83;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var viewW = 300, viewH = 300, dpr = 1, isPhone = false;

  function measure() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined') {
      if (window.visualViewport && window.visualViewport.width) {
        w = window.visualViewport.width; h = window.visualViewport.height;
      } else if (window.innerWidth) {
        w = window.innerWidth; h = window.innerHeight;
      }
    }
    if (!w) { w = 300; h = 300; }
    viewW = w; viewH = h;
    dpr = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (dpr < 1) dpr = 1; if (dpr > 3) dpr = 3;
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width || 0; sh = window.screen.height || 0; }
    isPhone = (Math.min(sw, sh) > 0 && Math.min(sw, sh) < 700);
    if (!(sw > 0 && sh > 0)) isPhone = (viewH > viewW * 1.15);
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
  }
  measure();

  var T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : 0;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000 - T0;
    return 0;
  }

  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', function () { measure(); draw(elapsed()); });
    if (window.addEventListener) window.addEventListener('resize', function () { measure(); draw(elapsed()); });
  }

  // Seeded RNG (mulberry32). All drawn data derives from fixed seeds, in a fixed order.
  function mulberry32(seed) {
    var a = seed | 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smoother(p) { p = clamp(p, 0, 1); return p * p * p * (p * (p * 6 - 15) + 10); }

  // ---- The three taxonomies (every split is a named decision) ----
  var DATASETS = [
    { name: 'projects', seed: 93411, root: 'work', children: [
      { name: 'data', children: [ { name: 'dear data' }, { name: 'listening' } ] },
      { name: 'drawing', children: [ { name: 'tree diagrams' }, { name: 'walking' } ] },
      { name: 'books', children: [ { name: 'i am a book' }, { name: 'weather' } ] }
    ] },
    { name: 'a dear data week', seed: 93422, root: 'week', children: [
      { name: 'clocks', children: [ { name: 'morning' }, { name: 'night' } ] },
      { name: 'thanks', children: [ { name: 'said' }, { name: 'meant' } ] },
      { name: 'sounds', children: [ { name: 'city' }, { name: 'home' } ] },
      { name: 'envy', children: [ { name: 'theirs' }, { name: 'mine' } ] },
      { name: 'food', children: [ { name: 'shared' }, { name: 'alone' } ] }
    ] },
    { name: 'a word tree', seed: 93433, root: 'branch', children: [
      { name: 'twig', children: [ { name: 'twiglet' }, { name: 'twigged' } ] },
      { name: 'leaf', children: [ { name: 'leaflet' }, { name: 'leafage' } ] },
      { name: 'root', children: [ { name: 'rootlet' }, { name: 'rootstock' } ] },
      { name: 'bark', children: [ { name: 'barky' }, { name: 'barkcloth' } ] },
      { name: 'canopy', children: [ { name: 'canopied' }, { name: 'understory' } ] }
    ] }
  ];

  // ---- Tree construction: seeded geometry in unit space (root at 0,0, growth toward -y) ----
  function buildTree(def) {
    var rand = mulberry32(def.seed);
    var branches = [], labels = [], sites = [], leaves = [];

    function addBranch(x0, y0, x1, y1, depth) {
      var dx = x1 - x0, dy = y1 - y0;
      var len = Math.sqrt(dx * dx + dy * dy) || 0.0001;
      var wob = depth >= 3 ? 0.5 : 1; // finer twigs wobble less, or they zigzag
      var amp = (0.006 + (0.02 + rand() * 0.035) * len) * wob;
      var fr = (2 + rand() * 2.5) * (depth >= 3 ? 0.7 : 1), ph = rand() * 6.2832;
      var pxv = -dy / len, pyv = dx / len;
      var SEG = 7, pts = [], cum = [0], tot = 0, i, s;
      for (i = 0; i <= SEG; i++) {
        s = i / SEG;
        var off = Math.sin(s * Math.PI) * amp * Math.sin(s * fr + ph);
        pts.push({ x: x0 + dx * s + pxv * off, y: y0 + dy * s + pyv * off, s: s });
        if (i > 0) { tot += Math.sqrt(Math.pow(pts[i].x - pts[i - 1].x, 2) + Math.pow(pts[i].y - pts[i - 1].y, 2)); cum.push(tot); }
      }
      var br = { pts: pts, cum: cum, total: tot, depth: depth, start: 2 + depth * 7.5, dur: 11, x1: x1, y1: y1 };
      branches.push(br);
      return br;
    }

    function twigFan(x, y, angle, len, depth) {
      var nB = 2 + (rand() < 0.55 ? 1 : 0), j, frac, a, L, ex, ey, br;
      for (j = 0; j < nB; j++) {
        frac = nB === 1 ? 0.5 : j / (nB - 1);
        a = angle + (frac - 0.5) * 0.85 + (rand() - 0.5) * 0.12;
        L = len * (0.6 + rand() * 0.18);
        ex = x + Math.sin(a) * L; ey = y - Math.cos(a) * L;
        br = addBranch(x, y, ex, ey, depth);
        // Every twig tip carries leaves, weighted toward the outer canopy, so
        // leaf arrives through the whole crown as it grows, not only at the end.
        sites.push({ x: ex, y: ey, br: br, w: depth - 2 });
        if (depth < 5 && L > 0.13) twigFan(ex, ey, a, L, depth + 1);
      }
    }

    function layout(node, x, y, angle, len, depth) {
      var kids = node.children || [], n = kids.length, i, frac, a, L, ex, ey, br;
      var fan = depth === 1 ? 1.35 : 1.0;
      for (i = 0; i < n; i++) {
        frac = n === 1 ? 0.5 : i / (n - 1);
        a = angle + (frac - 0.5) * fan + (rand() - 0.5) * 0.09;
        L = len * (0.74 + rand() * 0.18);
        ex = x + Math.sin(a) * L; ey = y - Math.cos(a) * L;
        br = addBranch(x, y, ex, ey, depth);
        labels.push({ x: ex, y: ey, text: kids[i].name, depth: depth, side: ex >= x ? 1 : -1, rot: (rand() - 0.5) * 0.1, br: br });
        if (kids[i].children) layout(kids[i], ex, ey, a, L, depth + 1);
        else twigFan(ex, ey, a, L * 0.62, 3);
      }
    }

    addBranch(0, 0, 0, -0.52, 0); // the trunk
    labels.push({ x: 0, y: 0, text: def.root, depth: 0, side: 1, rot: 0, br: branches[0], root: true });
    layout(def, 0, -0.52, 0, 1.02, 1);

    // Leaves: data-dots clustered at the twig tips. Site counts come from the
    // sites' weights by seeded stochastic rounding, landing near 250 in total.
    var sumW = 0, ti, li;
    for (ti = 0; ti < sites.length; ti++) sumW += sites[ti].w;
    for (ti = 0; ti < sites.length; ti++) {
      var site = sites[ti];
      var raw = 250 * site.w / Math.max(1, sumW);
      var cnt = Math.floor(raw) + (rand() < (raw - Math.floor(raw)) ? 1 : 0);
      if (site.w === 1 && cnt === 0) cnt = 1; // every first-order twig carries at least one leaf
      var clusterCls = Math.floor(rand() * 3);
      for (li = 0; li < cnt; li++) {
        var ang = rand() * 6.2832, rad = rand() * 0.07;
        leaves.push({
          x: site.x + Math.cos(ang) * rad,
          y: site.y + Math.sin(ang) * rad * 0.8,
          cls: rand() < 0.78 ? clusterCls : Math.floor(rand() * 3),
          r: 0.016 + rand() * 0.012,
          appear: site.br.start + site.br.dur * (0.55 + rand() * 0.45),
          shedDelay: rand() * 5.5,
          phase: rand() * 6.2832,
          px: -999, py: -999
        });
      }
    }

    // Bounding box over every drawn point.
    var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, k;
    function eat(x, y) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
    for (k = 0; k < branches.length; k++) for (var q = 0; q < branches[k].pts.length; q++) eat(branches[k].pts[q].x, branches[k].pts[q].y);
    for (k = 0; k < leaves.length; k++) eat(leaves[k].x, leaves[k].y);
    eat(0, 0);
    return { branches: branches, labels: labels, leaves: leaves, minX: minX, maxX: maxX, minY: minY, maxY: maxY, treeH: -minY };
  }

  var TREES = [buildTree(DATASETS[0]), buildTree(DATASETS[1]), buildTree(DATASETS[2])];

  // ---- Interaction state (recorded events; everything drawn is a function of these + t) ----
  var datasetIdx = 0;
  var pendingTap = null;        // {t}
  var winterEnd = -1;           // elapsed seconds
  var impulses = [];            // wind: {t, amp}
  var shaken = {};              // leafIdx -> {t0, x, y, cls, r, cyc}
  var lastCyc = -1;
  var lastShakeT = -10;
  var downInfo = null;

  function swayAt(t) {
    var s = 0, i, dt;
    for (i = 0; i < impulses.length; i++) {
      dt = t - impulses[i].t;
      if (dt > 0 && dt < 5) s += impulses[i].amp * Math.exp(-dt * 1.1) * Math.sin(dt * 5.5);
    }
    return s;
  }

  // ---- Audio (lazy, gesture-born, guarded; the piece is complete in silence) ----
  var AC = null, scratchGain = null, windGain = null, lastTickT = 0, lastPopped = 0;
  function ensureAudio() {
    if (AC) { if (AC.resume) AC.resume(); return; }
    var Ctor = null;
    if (typeof window !== 'undefined') Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    try {
      AC = new Ctor();
      var master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
      var nb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      var d = nb.getChannelData(0), nr = mulberry32(93477), i;
      for (i = 0; i < d.length; i++) d[i] = nr() * 2 - 1;
      function noiseChain(freq, type) {
        var src = AC.createBufferSource(); src.buffer = nb; src.loop = true;
        var f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
        var g = AC.createGain(); g.gain.value = 0;
        src.connect(f); f.connect(g); g.connect(master); src.start();
        return g;
      }
      scratchGain = noiseChain(1700, 'bandpass');   // pencil on paper
      windGain = noiseChain(420, 'lowpass');        // the drag wind
    } catch (e) { AC = null; }
  }
  function leafTick(t) {
    if (!AC || AC.state !== 'running') return;
    if (t - lastTickT < 0.09) return;
    lastTickT = t;
    try {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle'; o.frequency.value = 2100 + Math.random() * 500;
      g.gain.setValueAtTime(0.035, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 0.05);
      o.connect(g); g.connect(AC.destination);
      o.start(); o.stop(AC.currentTime + 0.06);
    } catch (e) {}
  }

  // ---- Drawing ----
  function draw(t) {
    var tree = TREES[datasetIdx];
    var cyc = Math.floor((t + OFFSET) / LOOP);
    var loopT = (t + OFFSET) - cyc * LOOP;
    if (cyc !== lastCyc) { shaken = {}; lastCyc = cyc; }
    if (pendingTap && t - pendingTap.t >= 0.38) {
      datasetIdx = (datasetIdx + 1) % TREES.length;
      pendingTap = null; shaken = {}; lastPopped = 0;
      tree = TREES[datasetIdx];
    }
    var winter = t < winterEnd;

    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, viewW, viewH);

    // Fit the tree's unit bbox into the frame with paper margins.
    var rectW = viewW * 0.9, rectH = viewH * 0.9;
    var bw = Math.max(0.001, tree.maxX - tree.minX), bh = Math.max(0.001, tree.maxY - tree.minY);
    var scale = Math.min(rectW / bw, rectH / bh);
    var ox = viewW / 2 - (tree.minX + tree.maxX) / 2 * scale;
    var oy = viewH / 2 - (tree.minY + tree.maxY) / 2 * scale;
    var sway = swayAt(t);

    function proj(x, y, leafBoost) {
      var hf = clamp(-y / Math.max(0.001, tree.treeH), 0, 1);
      var off = sway * Math.pow(hf, 1.3) * 0.16 * (leafBoost ? 1.35 : 1);
      return [ox + (x + off) * scale, oy + y * scale];
    }

    var env = 1;
    if (loopT < 2) env = loopT / 2;
    else if (loopT > 87.5) env = Math.max(0, (LOOP - loopT) / 2.5);
    ctx.globalAlpha = env;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // Branches, root to canopy.
    var bi, br, p, target, acc, pts2, i2;
    for (bi = 0; bi < tree.branches.length; bi++) {
      br = tree.branches[bi];
      p = smoother((loopT - br.start) / br.dur);
      if (p <= 0) continue;
      target = p * br.total; acc = 0; pts2 = [];
      for (i2 = 0; i2 < br.pts.length; i2++) {
        if (i2 === 0) { pts2.push(proj(br.pts[0].x, br.pts[0].y, false)); continue; }
        var seg = br.cum[i2] - br.cum[i2 - 1];
        if (acc + seg <= target) { pts2.push(proj(br.pts[i2].x, br.pts[i2].y, false)); acc += seg; }
        else {
          var f = seg > 0 ? (target - acc) / seg : 0;
          pts2.push(proj(br.pts[i2 - 1].x + (br.pts[i2].x - br.pts[i2 - 1].x) * f,
                         br.pts[i2 - 1].y + (br.pts[i2].y - br.pts[i2 - 1].y) * f, false));
          acc = target; break;
        }
      }
      if (pts2.length < 2) continue;
      ctx.strokeStyle = br.depth <= 1 ? BARK : BRANCH;
      ctx.lineWidth = clamp((0.04 - br.depth * 0.0065) * scale, 0.8, 5.5);
      ctx.beginPath();
      ctx.moveTo(pts2[0][0], pts2[0][1]);
      for (i2 = 1; i2 < pts2.length; i2++) ctx.lineTo(pts2[i2][0], pts2[i2][1]);
      ctx.stroke();
    }

    // Leaves.
    var popped = 0, li, lf, fp, pos;
    if (!winter) {
      for (li = 0; li < tree.leaves.length; li++) {
        lf = tree.leaves[li];
        if (shaken[li]) continue;
        if (loopT >= SHED_END) { lf.px = -999; continue; }
        if (loopT >= SHED_START) {
          fp = clamp((loopT - SHED_START - lf.shedDelay) / 2.4, 0, 1);
          if (fp >= 1) { lf.px = -999; continue; }
          pos = proj(lf.x + Math.sin(fp * 6 + lf.phase) * 0.03 * fp, lf.y + fp * fp * 1.5, true);
          ctx.globalAlpha = env * (1 - fp);
          ctx.fillStyle = LEAF_COLORS[lf.cls];
          ctx.beginPath(); ctx.arc(pos[0], pos[1], clamp(lf.r * scale, 1.8, 4.6), 0, 6.2832); ctx.fill();
          lf.px = pos[0]; lf.py = pos[1];
          popped++;
          continue;
        }
        if (loopT < lf.appear) { lf.px = -999; continue; }
        var sc = smoother((loopT - lf.appear) / 0.6);
        pos = proj(lf.x, lf.y, true);
        ctx.globalAlpha = env;
        ctx.fillStyle = LEAF_COLORS[lf.cls];
        ctx.beginPath(); ctx.arc(pos[0], pos[1], clamp(lf.r * scale, 1.8, 4.6) * sc, 0, 6.2832); ctx.fill();
        lf.px = pos[0]; lf.py = pos[1];
        popped++;
      }
      // Shaken-loose leaves fall in real time, then are gone for this cycle.
      ctx.globalAlpha = env;
      for (var key in shaken) {
        var sh = shaken[key];
        if (sh.cyc !== cyc) continue;
        fp = clamp((t - sh.t0) / 1.6, 0, 1);
        if (fp >= 1) continue;
        pos = proj(sh.x + Math.sin(fp * 5 + sh.phase) * 0.025 * fp, sh.y + fp * fp * 1.1, true);
        ctx.globalAlpha = env * (1 - fp * 0.7);
        ctx.fillStyle = LEAF_COLORS[sh.cls];
        ctx.beginPath(); ctx.arc(pos[0], pos[1], clamp(sh.r * scale, 1.8, 4.6), 0, 6.2832); ctx.fill();
      }
      ctx.globalAlpha = env;
    }
    // Audio cues ride on the pop count.
    if (popped > lastPopped) leafTick(t);
    lastPopped = popped;

    // Labels: a node's name arrives when its branch completes. Each sits above
    // its node with a thin paper halo so branch lines never strike through it.
    var fs = isPhone ? 9.5 : 12.5;
    ctx.font = '600 ' + fs + 'px "Segoe Print", "Bradley Hand", cursive, sans-serif';
    for (i2 = 0; i2 < tree.labels.length; i2++) {
      var lb = tree.labels[i2];
      if (!lb.root && smoother((loopT - lb.br.start) / lb.br.dur) < 0.97) continue;
      pos = proj(lb.x, lb.y, false);
      ctx.save();
      if (lb.root) {
        ctx.translate(pos[0] + 10, pos[1] + 1);
        ctx.textAlign = 'left';
      } else {
        ctx.translate(pos[0], pos[1] - fs * 0.95);
        ctx.rotate(lb.rot);
        ctx.textAlign = 'center';
      }
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3.5; ctx.strokeStyle = PAPER; ctx.lineJoin = 'round';
      ctx.strokeText(lb.text, 0, 0);
      ctx.fillStyle = LABEL;
      ctx.fillText(lb.text, 0, 0);
      ctx.restore();
    }

    // The root: a gold dot at the base of the trunk.
    pos = proj(0, 0, false);
    ctx.fillStyle = GOLD;
    ctx.beginPath(); ctx.arc(pos[0], pos[1], clamp(0.028 * scale, 3, 5.5), 0, 6.2832); ctx.fill();
    ctx.strokeStyle = BARK; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(pos[0], pos[1], clamp(0.028 * scale, 3, 5.5) + 2, 0, 6.2832); ctx.stroke();

    ctx.globalAlpha = 1;
    return { activity: 0 };
  }

  function audioUpdate(t) {
    if (!AC || AC.state !== 'running') return;
    var tree = TREES[datasetIdx];
    var loopT = (t + OFFSET) % LOOP;
    var mid = 0, i;
    for (i = 0; i < tree.branches.length; i++) {
      var pr = (loopT - tree.branches[i].start) / tree.branches[i].dur;
      if (pr > 0 && pr < 1) mid++;
    }
    try {
      var now = AC.currentTime;
      scratchGain.gain.setTargetAtTime(Math.min(0.045, mid * 0.006), now, 0.12);
      var sv = Math.abs(swayAt(t) - swayAt(t - 0.05)) * 14;
      windGain.gain.setTargetAtTime(Math.min(0.14, sv + (downInfo && downInfo.moved ? 0.025 : 0)), now, 0.1);
    } catch (e) {}
  }

  // ---- Pointer handling ----
  function evtPos(e) {
    if (e && typeof e.clientX === 'number') return [e.clientX, e.clientY];
    if (e && e.touches && e.touches[0]) return [e.touches[0].clientX, e.touches[0].clientY];
    return [0, 0];
  }
  function doShake(x, y, t) {
    var tree = TREES[datasetIdx], cyc = Math.floor((t + OFFSET) / LOOP);
    var cand = [], i, dx, dy, dd;
    for (i = 0; i < tree.leaves.length; i++) {
      if (tree.leaves[i].px < -100 || shaken[i]) continue;
      dx = tree.leaves[i].px - x; dy = tree.leaves[i].py - y; dd = dx * dx + dy * dy;
      if (dd < 8100) cand.push([dd, i]);
    }
    cand.sort(function (a, b) { return a[0] - b[0]; });
    for (i = 0; i < Math.min(3, cand.length); i++) {
      var lf = tree.leaves[cand[i][1]];
      shaken[cand[i][1]] = { t0: t, x: lf.x, y: lf.y, cls: lf.cls, r: lf.r, phase: lf.phase, cyc: cyc };
    }
    if (cand.length) lastShakeT = t;
  }
  function onDown(e) {
    ensureAudio();
    var p = evtPos(e), t = elapsed();
    downInfo = { x: p[0], y: p[1], t: t, moved: false, lx: p[0], ly: p[1], lt: t, dist: 0 };
  }
  function onMove(e) {
    if (!downInfo) return;
    var p = evtPos(e), t = elapsed();
    var dx = p[0] - downInfo.lx, dy = p[1] - downInfo.ly;
    downInfo.dist += Math.abs(dx) + Math.abs(dy);
    if (downInfo.dist > 10) downInfo.moved = true;
    if (downInfo.moved) {
      var dtm = Math.max(0.016, t - downInfo.lt);
      var vx = dx / dtm;
      impulses.push({ t: t, amp: clamp(vx * 0.00045, -0.05, 0.05) });
      if (impulses.length > 60) impulses.splice(0, impulses.length - 60);
      if (t - lastShakeT > 0.5 && Math.abs(vx) + Math.abs(dy / dtm) > 520) doShake(p[0], p[1], t);
    }
    downInfo.lx = p[0]; downInfo.ly = p[1]; downInfo.lt = t;
  }
  function onUp(e) {
    if (!downInfo) return;
    var t = elapsed(), wasDrag = downInfo.moved, dur = t - downInfo.t;
    downInfo = null;
    if (!wasDrag && dur < 0.4) {
      if (pendingTap && t - pendingTap.t < 0.38) { pendingTap = null; winterEnd = t + 8; }
      else pendingTap = { t: t };
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { downInfo = null; });
  }

  function tick() {
    var t = elapsed();
    draw(t);
    audioUpdate(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
  }
  draw(0); // frame one is the synchronous draw at exactly t=0 (fixed 38s loop offset)
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
})();
</script>
</body>
