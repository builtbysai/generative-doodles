<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatory</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #2E3440;
  }
  canvas {
    display: block;
    margin: 0;
    padding: 0;
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');

  // Palette (strict): sail base, the eight filter colors, the white
  // cell tone, and the dusk sky. The noon sky is the white cell tone
  // itself, so the sky at noon and a lit white cell are one material.
  var BASE = [237, 239, 240];   // #EDEFF0 sail base
  var WHITE = [246, 243, 236];  // #F6F3EC white cells / noon sky
  var DUSK = [46, 52, 64];      // #2E3440 dusk sky
  var COLORS = [
    [31, 95, 192],   // #1F5FC0 cobalt
    [31, 163, 160],  // #1FA3A0 teal
    [242, 106, 27],  // #F26A1B orange
    [47, 168, 79],   // #2FA84F green
    [214, 59, 47],   // #D63B2F red
    [122, 79, 176],  // #7A4FB0 violet
    [242, 192, 24],  // #F2C018 yellow
    [192, 38, 138]   // #C0268A magenta
  ];

  // One seamless 60 s day: 20 s dawn glow, 20 s noon wash, 20 s dusk
  // glow. Phase p = (t mod 60) / 60. Sun elevation e = sin(pi * p):
  // 0 at dawn's first instant, 1 at noon, 0 again at dusk's end, so
  // the loop closes on itself with integer ratios only.
  var LOOP = 60;

  // Seeded RNG (mulberry32): every phase offset, facet variation and
  // speckle position is precomputed once from this stream, so frame
  // one is a fixed function of the seed, never of the clock.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function mix(a, b, u) {
    return [
      a[0] + (b[0] - a[0]) * u,
      a[1] + (b[1] - a[1]) * u,
      a[2] + (b[2] - a[2]) * u
    ];
  }

  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }

  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a.toFixed(4) + ')';
  }

  function clamp01(v) {
    return v < 0 ? 0 : (v > 1 ? 1 : v);
  }

  // Sails: each is a curved patch bounded by two quadratic beziers
  // (top and bottom edges, in frame fractions). A point on the sail
  // is the vertical blend of the two edge points at the same u, so
  // the checkerboard grid bends with the sail's sweep. Drawn back to
  // front: the small upper-right sail first, the large lower-left
  // sail last.
  var SAILS = [
    { // smallest, upper-right
      top: [[0.58, -0.05], [0.82, -0.13], [1.07, 0.07]],
      bot: [[0.58, 0.33], [0.84, 0.27], [1.07, 0.41]],
      cols: 7, rows: 4, phaseOff: 0.62
    },
    { // middle, center-right
      top: [[0.38, 0.33], [0.64, 0.08], [1.03, 0.23]],
      bot: [[0.38, 0.78], [0.66, 0.62], [1.03, 0.72]],
      cols: 9, rows: 6, phaseOff: 0.34
    },
    { // largest, lower-left
      top: [[-0.06, 0.64], [0.28, 0.36], [0.67, 0.47]],
      bot: [[-0.06, 1.07], [0.30, 0.90], [0.67, 0.97]],
      cols: 11, rows: 7, phaseOff: 0.0
    }
  ];

  // Precompute every cell once: checker parity decides white vs
  // colored, the palette cycles by grid position, and each cell gets
  // a sun phase from its grid coordinates (plus the sail's offset),
  // a facet factor, and three dither speckles in cell-local coords.
  var rng = mulberry32(787001);
  var cells = [];
  for (var s = 0; s < SAILS.length; s++) {
    var sail = SAILS[s];
    for (var j = 0; j < sail.rows; j++) {
      for (var i = 0; i < sail.cols; i++) {
        var colored = ((i + j) % 2) === 1;
        var specks = [];
        for (var k = 0; k < 3; k++) {
          specks.push([rng(), rng()]);
        }
        cells.push({
          sail: s,
          u0: i / sail.cols,
          u1: (i + 1) / sail.cols,
          v0: j / sail.rows,
          v1: (j + 1) / sail.rows,
          colored: colored,
          color: COLORS[(i * 3 + j * 5 + s * 2) % COLORS.length],
          phase: ((i / sail.cols) * 0.72 + (j / sail.rows) * 0.28 + sail.phaseOff) % 1,
          facet: 0.90 + rng() * 0.10,
          specks: specks
        });
      }
    }
  }

  var viewW = 0;
  var viewH = 0;
  var isPhone = false;

  function measure() {
    var vv = window.visualViewport;
    viewW = vv ? vv.width : window.innerWidth;
    viewH = vv ? vv.height : window.innerHeight;
    var sw = window.screen ? window.screen.width : viewW;
    var sh = window.screen ? window.screen.height : viewH;
    isPhone = Math.min(sw, sh) < 700 || viewH > viewW * 1.15;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function qbez(e, u) {
    var w0 = (1 - u) * (1 - u);
    var w1 = 2 * (1 - u) * u;
    var w2 = u * u;
    return [
      w0 * e[0][0] + w1 * e[1][0] + w2 * e[2][0],
      w0 * e[0][1] + w1 * e[1][1] + w2 * e[2][1]
    ];
  }

  // Point on sail s at (u, v), in pixels.
  function sailPoint(s, u, v, w, h) {
    var sail = SAILS[s];
    var tp = qbez(sail.top, u);
    var bt = qbez(sail.bot, u);
    return [
      (tp[0] + (bt[0] - tp[0]) * v) * w,
      (tp[1] + (bt[1] - tp[1]) * v) * h
    ];
  }

  function tracePath(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var n = 1; n < pts.length; n++) {
      ctx.lineTo(pts[n][0], pts[n][1]);
    }
    ctx.closePath();
  }

  // The sail's whole silhouette, for the glass base under the cells:
  // sample the top edge left to right, the bottom edge back.
  function sailPath(s, w, h) {
    var pts = [];
    var steps = 24;
    for (var n = 0; n <= steps; n++) {
      pts.push(sailPoint(s, n / steps, 0, w, h));
    }
    for (var m = steps; m >= 0; m--) {
      pts.push(sailPoint(s, m / steps, 1, w, h));
    }
    tracePath(pts);
  }

  function draw(t) {
    var w = viewW;
    var h = viewH;
    if (!w || !h) return;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    var p = (t % LOOP) / LOOP;
    var e = Math.sin(Math.PI * p); // sun elevation, 0..1..0
    var az = p;                    // sun azimuth sweeping the loop

    // Sky: dusk blue-gray at the day's ends, the white cell tone at
    // noon. Frame one (t = 0) is dawn's first instant: sky deep.
    var sky = mix(DUSK, WHITE, Math.pow(e, 0.8));
    ctx.fillStyle = rgb(sky);
    ctx.fillRect(0, 0, w, h);
    if (typeof document !== 'undefined' && document.body && document.body.style) {
      document.body.style.background = rgb(sky);
    }

    // The wash at noon: colors are pulled toward the white tone as
    // the sun climbs, and come back saturated as it falls.
    var wash = e * 0.72;
    // Lantern strength: highest when the sun is low.
    var lantern = 1 - e;

    for (var s = 0; s < SAILS.length; s++) {
      // Glass base: the sail reads as one faceted form even where
      // its cells are quiet.
      sailPath(s, w, h);
      ctx.fillStyle = rgba(BASE, 0.20 + 0.25 * e);
      ctx.fill();

      for (var c = 0; c < cells.length; c++) {
        var cell = cells[c];
        if (cell.sail !== s) continue;

        var c00 = sailPoint(s, cell.u0, cell.v0, w, h);
        var c10 = sailPoint(s, cell.u1, cell.v0, w, h);
        var c11 = sailPoint(s, cell.u1, cell.v1, w, h);
        var c01 = sailPoint(s, cell.u0, cell.v1, w, h);

        // Inset the cell toward its centroid: the gap shows the
        // sail base between cells, the panel seam of the glass.
        var cx = (c00[0] + c10[0] + c11[0] + c01[0]) / 4;
        var cy = (c00[1] + c10[1] + c11[1] + c01[1]) / 4;
        var gap = isPhone ? 0.90 : 0.93;
        var pts = [c00, c10, c11, c01].map(function (pt) {
          return [cx + (pt[0] - cx) * gap, cy + (pt[1] - cy) * gap];
        });

        // Sun function: circular distance between the sweeping
        // azimuth and this cell's own phase; ignition is a tight
        // gaussian, so cells catch the light one after another as
        // the sun crosses, never all at once.
        var d = Math.abs(az - cell.phase);
        if (d > 0.5) d = 1 - d;
        var g = Math.exp(-(d * d) / (2 * 0.165 * 0.165));

        var alpha = 0.30 + 0.24 * e + g * (0.36 + 0.46 * lantern);
        alpha = clamp01(alpha * cell.facet);
        if (alpha > 0.98) alpha = 0.98;

        var base = cell.colored ? cell.color : WHITE;
        var fill = cell.colored ? mix(base, WHITE, wash) : base;
        tracePath(pts);
        ctx.fillStyle = rgba(fill, alpha);
        ctx.fill();

        // Dither: seeded speckles of the sail base inside the cell
        // at very low alpha, breaking up the flat fill.
        ctx.fillStyle = rgba(BASE, 0.06);
        for (var k = 0; k < cell.specks.length; k++) {
          var sp = cell.specks[k];
          var top = [
            pts[0][0] + (pts[1][0] - pts[0][0]) * sp[0],
            pts[0][1] + (pts[1][1] - pts[0][1]) * sp[0]
          ];
          var bot = [
            pts[3][0] + (pts[2][0] - pts[3][0]) * sp[0],
            pts[3][1] + (pts[2][1] - pts[3][1]) * sp[0]
          ];
          var sx = top[0] + (bot[0] - top[0]) * sp[1];
          var sy = top[1] + (bot[1] - top[1]) * sp[1];
          ctx.fillRect(sx, sy, 1.6, 1.6);
        }
      }
    }
  }

  function resize() {
    measure();
    draw(lastT);
  }

  var lastT = 0;
  measure();
  draw(0);

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  // Watch-only: no pointer interaction of any kind.
  if (typeof window.requestAnimationFrame === 'function') {
    var start = null;
    var frame = function (ts) {
      if (start === null) start = ts;
      lastT = (ts - start) / 1000;
      draw(lastT);
      window.requestAnimationFrame(frame);
    };
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
