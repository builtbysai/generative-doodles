<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Applause</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e0d0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (prompt only, no other color).
  var CREAM = '#e8e0d0';
  var GREY = '#b8bcc0';
  var CHARCOAL = '#2a2a30';
  var GOLD = '#d9a441';
  var CLOTH = ['#4a5a7a', '#6b4a3a', '#2f4636', '#7a6a8a'];
  var SKIN = '#f2ead8';

  var LOOP = 24;          // stillness 0-8, burst 8-16, stillness 16-24
  var BURST_START = 8, BURST_END = 16;
  var CLAP_PERIOD = 0.8;  // base seconds per clap at tempo 1
  var TAU = 1.5;          // tempo ease-back time constant after drag release

  // Seeded PRNG (mulberry32), never Math.random. Used only for fixed
  // per-figure decoration (head tilt seeds); frame one is fixed regardless.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1491000);
  var FIG_TILT = [];
  for (var i = 0; i < 4; i++) { FIG_TILT.push((rnd() - 0.5) * 0.08); }

  // Viewport sizing: Visual Viewport API first, window fallback.
  var W = 0, H = 0, PHONE = false;
  function sizeViewport() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    var w, h;
    if (vv && vv.width && vv.height) { w = vv.width; h = vv.height; }
    else { w = window.innerWidth; h = window.innerHeight; }
    W = w; H = h;
    var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : w;
    var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : h;
    var minDim = Math.min(sw, sh);
    if (minDim < 700) { PHONE = true; }
    else if (h > w * 1.15) { PHONE = true; }
    else { PHONE = false; }
    canvas.width = Math.round(w);
    canvas.height = Math.round(h);
  }

  // Drag state: closed-form over the recorded event list.
  // Dragging horizontally across the figures maps pointer x displacement
  // to clap tempo; release eases tempo back to 1 (tau 1.5 s).
  var dragEvents = [];   // {kind:'down'|'move'|'up', t, x}
  var dragging = false;

  function clampTempo(v) { return Math.max(0.5, Math.min(2.5, v)); }

  // State derived from events at or before time s.
  function stateAt(s) {
    var down = false, downX = 0, disp = 0, relT = -1, relTempo = 1, hasRel = false;
    for (var k = 0; k < dragEvents.length; k++) {
      var e = dragEvents[k];
      if (e.t > s) { break; }
      if (e.kind === 'down') { down = true; downX = e.x; disp = 0; hasRel = false; }
      else if (e.kind === 'move' && down) { disp = e.x - downX; }
      else if (e.kind === 'up') {
        down = false;
        relT = e.t;
        relTempo = clampTempo(1 + disp / 300);
        hasRel = true;
      }
    }
    return { down: down, disp: disp, relT: relT, relTempo: relTempo, hasRel: hasRel };
  }
  function tempoAt(s) {
    var st = stateAt(s);
    if (st.down) { return clampTempo(1 + st.disp / 300); }
    if (st.hasRel) { return 1 + (st.relTempo - 1) * Math.exp(-(s - st.relT) / TAU); }
    return 1;
  }
  // Exact integral of tempo over [a, b], splitting at event times so each
  // subsegment has either constant tempo (dragging) or exponential decay
  // (after release). Closed-form, deterministic, never frame-integrated.
  function tempoIntegral(a, b) {
    if (b <= a) { return 0; }
    var cuts = [a];
    for (var k = 0; k < dragEvents.length; k++) {
      var et = dragEvents[k].t;
      if (et > a && et < b) { cuts.push(et); }
    }
    cuts.push(b);
    var total = 0;
    for (var j = 0; j < cuts.length - 1; j++) {
      var s0 = cuts[j], s1 = cuts[j + 1];
      var st = stateAt(s0);
      if (st.down) {
        total += clampTempo(1 + st.disp / 300) * (s1 - s0);
      } else if (st.hasRel) {
        total += (s1 - s0) + (st.relTempo - 1) * TAU *
          (Math.exp(-(s0 - st.relT) / TAU) - Math.exp(-(s1 - st.relT) / TAU));
      } else {
        total += (s1 - s0);
      }
    }
    return total;
  }

  function pointerDown(x, y, t) {
    // Drags start across the figures (lower 60% of the frame); drags
    // starting on the broadcast panel are ignored.
    if (y < H * 0.40) { return; }
    dragging = true;
    dragEvents.push({ kind: 'down', t: t, x: x });
  }
  function pointerMove(x, t) {
    if (!dragging) { return; }
    dragEvents.push({ kind: 'move', t: t, x: x });
  }
  function pointerUp(t) {
    if (!dragging) { return; }
    dragging = false;
    dragEvents.push({ kind: 'up', t: t, x: 0 });
  }

  function disc(x, y, r, color) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }
  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }
  function smoothstep(a, b, x) {
    if (x <= a) { return 0; }
    if (x >= b) { return 1; }
    var u = (x - a) / (b - a);
    return u * u * (3 - 2 * u);
  }

  function draw(t) {
    if (!W || !H) { sizeViewport(); }
    var u = Math.min(W, H);
    var lt = t % LOOP;  // loop-local time: every animation value lives here
    var cycle = Math.floor(t / LOOP);
    var burstStart = cycle * LOOP + BURST_START;

    // Burst envelope: ramps in over 0.5 s at burst start, out over 0.5 s
    // at burst end. Bursts are gated by the loop timer only, so a drag
    // can never stop a burst mid-clap.
    var env = 0;
    if (lt >= BURST_START && lt < BURST_END) {
      env = Math.min(smoothstep(BURST_START, BURST_START + 0.5, lt),
                     1 - smoothstep(BURST_END - 0.5, BURST_END, lt));
    }
    // Clap phase: tempo-weighted time inside this burst over the base
    // period. Hands meet (separation 0) at phase fraction 0.5.
    var phase = 0;
    if (lt >= BURST_START && lt < BURST_END) {
      phase = tempoIntegral(burstStart, t) / CLAP_PERIOD;
    }
    var frac = phase - Math.floor(phase);
    var clapSep = (0.5 + 0.5 * Math.cos(2 * Math.PI * frac)); // 1 apart, 0 together

    // Ground.
    rect(0, 0, W, H, CREAM);

    // Broadcast panel, centered above, small. The suited figure inside
    // is fully static: it never reacts, at any time, to anything.
    var pw = Math.min(W * 0.30, u * 0.45);
    var ph = pw * 0.72;
    var px = W / 2 - pw / 2, py = H * 0.09;
    rect(px, py, pw, ph, GREY);
    // Suited figure fully inside the panel: head disc + torso, static.
    var sw = pw * 0.20, sh = ph * 0.52;
    var sx = W / 2 - sw / 2, sy = py + ph * 0.36;
    rect(sx, sy, sw, sh, CHARCOAL);
    disc(W / 2, py + ph * 0.22, ph * 0.13, CHARCOAL);
    rect(W / 2 - ph * 0.05, py + ph * 0.22, ph * 0.10, Math.max(2, ph * 0.02), GREY);

    // Four seated figures in a row across the lower half.
    var benchY = H * 0.78;
    rect(W * 0.08, benchY, W * 0.84, Math.max(2, H * 0.008), CLOTH[1]);
    var fw = Math.min(W * 0.11, u * 0.16);
    var fh = H * 0.20;
    for (var i = 0; i < 4; i++) {
      var fx = W * (0.16 + i * 0.225) - fw / 2;
      var fy = benchY - fh;
      var cloth = CLOTH[i];
      // Torso.
      rect(fx, fy, fw, fh, cloth);
      // Head with a fixed seeded tilt; mouth line still.
      var hx = fx + fw / 2, hy = fy - H * 0.055;
      disc(hx, hy, H * 0.045, SKIN);
      rect(hx - H * 0.008, hy - H * 0.006, Math.max(2, H * 0.008), Math.max(2, H * 0.008), CHARCOAL);
      var mw = H * 0.028;
      rect(hx - mw / 2 + FIG_TILT[i] * H * 0.10, hy + H * 0.018, mw, Math.max(2, H * 0.006), CHARCOAL);
      // Seated leg: horizontal thigh + vertical shin.
      rect(fx, fy + fh * 0.72, fw * 1.30, fh * 0.16, cloth);
      rect(fx + fw * 1.30 - fw * 0.16, fy + fh * 0.72, fw * 0.16, benchY - (fy + fh * 0.72), cloth);
      // Hands: paired gold discs. At rest they sit apart in the lap;
      // during a burst they rise to chest height and meet in unison.
      var lapY = fy + fh * 0.80;
      var chestY = fy + fh * 0.30;
      var handY = lapY + (chestY - lapY) * env;
      var restGap = fw * 0.70;
      var maxGap = fw * 1.15;
      var gap = restGap + (maxGap * clapSep - restGap) * env;
      var hr = Math.max(4, H * 0.022);
      disc(hx - gap / 2, handY, hr, GOLD);
      disc(hx + gap / 2, handY, hr, GOLD);
    }

    // Pin canvas size in CSS pixels (phone house rule).
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // Real pointer wiring (guarded so the QA renderer, which has no canvas
  // events, simply never fires them).
  var lastT = 0;
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (ev) {
      pointerDown(ev.clientX || 0, ev.clientY || 0, lastT);
    });
    canvas.addEventListener('pointermove', function (ev) {
      pointerMove(ev.clientX || 0, lastT);
    });
    canvas.addEventListener('pointerup', function () { pointerUp(lastT); });
    canvas.addEventListener('pointercancel', function () { pointerUp(lastT); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    var onResize = function () { sizeViewport(); draw(lastT); };
    window.addEventListener('resize', onResize);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
  }

  // Probe surface for the QA harness.
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: draw,
      pointerDown: pointerDown,
      pointerMove: pointerMove,
      pointerUp: pointerUp,
      tempoAt: tempoAt,
      tempoIntegral: tempoIntegral,
      loop: LOOP,
      burstStart: BURST_START,
      burstEnd: BURST_END
    };
  }

  // Frame one: synchronous, constant phase.
  sizeViewport();
  draw(0);

  // rAF loop, plain function declaration, typeof-guarded.
  var startMs = null;
  function loop(ts) {
    if (startMs === null) { startMs = ts; }
    var t = (ts - startMs) / 1000;
    lastT = t;
    draw(t);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
