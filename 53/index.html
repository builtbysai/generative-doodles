<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№53 · Intersecting Colour</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f4f1ea; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(23,23,28,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag a band</div>
<script>
'use strict';

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '53', 10) || 0;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
const ctx = canvas.getContext('2d');
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function artRect(w,h,full){
  if (full || isPhone()) return [0,0,w,h];
  const s=Math.min(w,h); return [(w-s)/2,(h-s)/2,s,s];
}
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}

const HB=['#e8502a','#8aa57e','#1c2fa8','#f7d354'];
const VB=['#f7d354','#1c2fa8','#f2c6c2','#e8502a'];
const MIX=['#b5542d','#3d5a3d','#2b2b6f','#d4a017','#c98a8a','#6f6f6f'];
const rng=mulberry(seed*31+5);
const LOOP=28;
function mkBands(vertical){
  const arr=[];
  for(let i=0;i<4;i++){ arr.push({p:(i*0.25+rng()*0.07)%1, wdt:0.10+rng()*0.08, v:(Math.floor(rng()*3)-1), col:(vertical?VB:HB)[i]}); }
  return arr;
}
const hB=mkBands(false), vB=mkBands(true);
// integer-ratio speeds so the 28s loop closes: v in {-2,-1,0,1,2} cycles
for(const b of hB.concat(vB)) b.v = [-2,-1,1,2][Math.floor(rng()*4)];
let grab=null, grabOff=0;
function pos(b,t,dim){ let p=(b.p + b.v*t/LOOP)%1; if(p<0)p+=1; return p*dim; }
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#f4f1ea'; ctx.fillRect(0,0,w,h);
  const [rx,ry,rw,rh]=artRect(w,h,false);
  const t=(nowMs/1000)%LOOP;
  ctx.save(); ctx.beginPath(); ctx.rect(rx,ry,rw,rh); ctx.clip();
  ctx.fillStyle='#f4f1ea'; ctx.fillRect(rx,ry,rw,rh);
  const hs=hB.map(b=>{ const y= grab&&grab.b===b ? grab.pos : pos(b,t,rh); return {b,y,hgt:b.wdt*rh}; });
  const vs=vB.map(b=>{ const x= grab&&grab.b===b ? grab.pos : pos(b,t,rw); return {b,x,wid:b.wdt*rw}; });
  for(const o of hs){ ctx.fillStyle=o.b.col; ctx.fillRect(rx,ry+o.y,rw,o.hgt); }
  for(const o of vs){ ctx.fillStyle=o.b.col; ctx.fillRect(rx+o.x,ry,o.wid,rh); }
  hs.forEach((ho,i)=>{ vs.forEach((vo,j)=>{ ctx.fillStyle=MIX[(i*2+j*3+((i+j)%2))%MIX.length]; ctx.fillRect(rx+vo.x,ry+ho.y,vo.wid,ho.hgt); }); });
  ctx.restore();
  return {};
}
function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(7000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
canvas.addEventListener('pointerdown',ev=>{
  const [w,h]=viewportWH(); const [rx,ry,rw,rh]=artRect(w,h,false); const t=(performance.now()/1000)%LOOP;
  let best=null,bd=1e9;
  hB.forEach(b=>{ const y=ry+pos(b,t,rh); const d=Math.abs(ev.clientY-y); if(d<bd){bd=d;best={b,vert:false,pos:pos(b,t,rh)};} });
  vB.forEach(b=>{ const x=rx+pos(b,t,rw); const d=Math.abs(ev.clientX-x); if(d<bd){bd=d;best={b,vert:true,pos:pos(b,t,rw)};} });
  if(best){ grab=best; grabOff= best.vert? ev.clientX-(rx+best.pos) : ev.clientY-(ry+best.pos); }
});
canvas.addEventListener('pointermove',ev=>{ if(!grab) return; const [w,h]=viewportWH(); const [rx,ry,rw,rh]=artRect(w,h,false); grab.pos = grab.vert? (ev.clientX-grabOff-rx) : (ev.clientY-grabOff-ry); });
function endDrag(){ grab=null; }
canvas.addEventListener('pointerup',endDrag); canvas.addEventListener('pointercancel',endDrag);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));

</script>
</body>
</html>
