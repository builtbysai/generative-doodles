<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№8979 · Almost Perfect — Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #14110c;
    color: #e8e2d2;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 620px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8f8875; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; }
  header h1 .num { color: #d9a441; }
  header p { color: #8f8875; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #c9c2ad; font-weight: normal; }
  #stage {
    width: min(92vw, 760px);
    aspect-ratio: 1 / 1;
    background: #f4edda;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  footer { margin-top: 4vmin; color: #6b6455; font-size: 13px; font-style: italic; }
  footer a { color: #d9a441; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№8979</span> · Almost Perfect</h1>
  <p>Twenty-some nested squares drawn without lifting the pen. The twist
  creeps in ring by ring, order straining against itself until the middle
  gives way. <b>Click the piece for a new drawing.</b></p>
</header>
<div id="stage" role="button" tabindex="0" aria-label="Almost Perfect: click for a new drawing"><canvas id="c"></canvas></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 424242;

const VU = 1000;               // virtual units: the drawing lives on a 1000x1000 square
const INK = "#211b14";         // warm black, constant everywhere
const PAPER = "#f4edda";       // warm paper
const LINE_W = 3.0;            // constant stroke weight, in virtual units
const DRAW_MS = 8000;          // plotter draw-on duration

const stage = document.getElementById("stage");
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let pts = [];          // the one continuous path, in virtual units
let grainCv = null;    // pre-rendered paper grain at device pixels
let t0 = 0;            // animation start timestamp
let drawing = true;    // still drawing on
const reduceMotion = window.matchMedia &&
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---- the drawing: one continuous pen path of nested drifting squares ----
function buildPath(s){
  const rnd = mulberry32(s);
  const rings = 24 + ((rnd() * 6) | 0);
  const outerHalf = 392, innerHalf = 24;
  const inset = (outerHalf - innerHalf) / (rings - 1);

  // rotation recipe: near-perfect start, accumulating drift, occasional
  // stalls where order resists, optional slow waver of the drift itself
  const baseRot = (rnd() - 0.5) * 14 * Math.PI / 180;
  let drift = (0.9 + rnd() * 2.3) * Math.PI / 180;
  if (rnd() < 0.5) drift = -drift;
  const maxSweep = 68 * Math.PI / 180;
  if (Math.abs(drift) * (rings - 1) > maxSweep)
    drift = Math.sign(drift) * maxSweep / (rings - 1);
  const stalls = [];
  const nStall = rnd() < 0.45 ? 1 : (rnd() < 0.55 ? 2 : 0);
  for (let k = 0; k < nStall; k++) stalls.push(rings * (0.3 + 0.4 * rnd()));
  const waverAmp = rnd() < 0.35 ? 0 : (1.5 + rnd() * 3.5) * Math.PI / 180;
  const waverCyc = 1.5 + rnd(), waverPh = rnd() * Math.PI * 2;

  // gentle center wander, bounded so squares stay nested
  const cAmp = rnd() * 12;
  const cF1 = 0.3 + rnd() * 0.25, cF2 = 0.8 + rnd() * 0.4;
  const cP1 = rnd() * 6.283, cP2 = rnd() * 6.283;

  // hand tremble: smooth periodic wobble along each ring so every
  // ring closes on itself exactly (integer cycle counts)
  const W = 1.2 + rnd() * 1.8;
  const F1 = 2 * Math.PI * (3 + ((rnd() * 3) | 0));
  const F2 = 2 * Math.PI * (8 + ((rnd() * 5) | 0));
  const P1 = rnd() * 6.283, P2 = rnd() * 6.283;

  function theta(i){
    let t = baseRot;
    for (let k = 0; k < i; k++){
      let r = 1;
      for (const sc of stalls){
        const d = (k - sc) / 2.0;
        r *= 1 - 0.8 * Math.exp(-d * d);
      }
      t += drift * r;
    }
    t += waverAmp * Math.sin(2 * Math.PI * waverCyc * i / (rings - 1) + waverPh);
    return t;
  }

  const P = [];
  const EDGE_SUB = 10, CONN_SUB = 5;
  let lastCx = VU / 2, lastCy = VU / 2;
  for (let i = 0; i < rings; i++){
    const half = outerHalf - inset * i;
    const cx = VU / 2 + cAmp * (Math.sin(i * cF1 + cP1) + 0.5 * Math.sin(i * cF2 + cP2));
    const cy = VU / 2 + cAmp * (Math.cos(i * cF1 * 0.9 + cP2) + 0.5 * Math.sin(i * cF2 * 1.1 + cP1));
    lastCx = cx; lastCy = cy;
    const th = theta(i);
    const corners = [];
    for (let k = 0; k < 4; k++){
      const a = Math.PI / 4 + th + k * Math.PI / 2;
      corners.push([cx + Math.cos(a) * half * Math.SQRT2,
                    cy + Math.sin(a) * half * Math.SQRT2]);
    }
    if (i === 0){
      P.push(corners[0].slice());
    } else {
      // the pen never lifts: short connector from the last point inward
      const p0 = P[P.length - 1];
      for (let sgi = 1; sgi <= CONN_SUB; sgi++){
        const f = sgi / CONN_SUB;
        P.push([p0[0] + (corners[0][0] - p0[0]) * f,
                p0[1] + (corners[0][1] - p0[1]) * f]);
      }
    }
    for (let e = 0; e < 4; e++){
      const A = corners[e], B = corners[(e + 1) % 4];
      const dx = B[0] - A[0], dy = B[1] - A[1];
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len;
      for (let sgi = 1; sgi <= EDGE_SUB; sgi++){
        const f = sgi / EDGE_SUB;
        const ringFrac = (e + f) / 4;
        const wob = W * (Math.sin(ringFrac * F1 + P1) +
                         0.55 * Math.sin(ringFrac * F2 + P2));
        P.push([A[0] + dx * f + nx * wob, A[1] + dy * f + ny * wob]);
      }
    }
  }
  // the pen runs out of room: a short spiral into the center, then rests
  const endP = P[P.length - 1];
  const r0 = Math.hypot(endP[0] - lastCx, endP[1] - lastCy);
  const a0 = Math.atan2(endP[1] - lastCy, endP[0] - lastCx);
  const turns = 1.5 + rnd() * 0.5, SP = 44;
  for (let sgi = 1; sgi <= SP; sgi++){
    const f = sgi / SP;
    const r = r0 * (1 - f);
    const a = a0 + f * turns * 2 * Math.PI * Math.sign(drift || 1);
    P.push([lastCx + Math.cos(a) * r, lastCy + Math.sin(a) * r]);
  }
  return P;
}

// ---- paper grain, pre-rendered per resize ----
function buildGrain(w, h){
  grainCv = document.createElement("canvas");
  grainCv.width = w; grainCv.height = h;
  const g = grainCv.getContext("2d");
  const rnd = mulberry32(1234);
  const n = Math.floor(w * h / 900);
  for (let i = 0; i < n; i++){
    const x = rnd() * w, y = rnd() * h;
    g.fillStyle = rnd() < 0.5
      ? "rgba(90,70,45," + (0.02 + rnd() * 0.035).toFixed(3) + ")"
      : "rgba(255,252,240," + (0.03 + rnd() * 0.04).toFixed(3) + ")";
    const r = 0.4 + rnd() * 1.1;
    g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
  }
}

function resize(){
  const rect = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(rect.width * dpr));
  const h = Math.max(1, Math.round(rect.height * dpr));
  if (canvas.width !== w || canvas.height !== h){
    canvas.width = w; canvas.height = h;
    buildGrain(w, h);
  }
  drawFrame(performance.now());
}

// ---- render: paper, grain, the revealed part of the one path ----
function drawFrame(now){
  const w = canvas.width, h = canvas.height;
  const sc = w / VU;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, w, h);
  if (grainCv) ctx.drawImage(grainCv, 0, 0);

  let count;
  if (reduceMotion || !drawing){
    count = pts.length;
  } else {
    const p = Math.min(1, (now - t0) / DRAW_MS);
    count = Math.max(2, Math.floor(p * (pts.length - 1)) + 1);
    if (p >= 1) drawing = false;
  }

  ctx.strokeStyle = INK;
  ctx.lineWidth = LINE_W * sc;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(pts[0][0] * sc, pts[0][1] * sc);
  for (let i = 1; i < count; i++)
    ctx.lineTo(pts[i][0] * sc, pts[i][1] * sc);
  ctx.stroke();

  if (drawing && !reduceMotion){
    // the pen tip, resting on the last drawn point
    const tip = pts[count - 1];
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.arc(tip[0] * sc, tip[1] * sc, LINE_W * sc * 0.85, 0, 6.2832);
    ctx.fill();
    requestAnimationFrame(drawFrame);
  }
}

function newDrawing(s){
  seed = s;
  pts = buildPath(seed);
  t0 = performance.now();
  drawing = true;
  try {
    const u = new URL(location.href);
    u.searchParams.set("seed", String(seed));
    history.replaceState(null, "", u.toString());
  } catch (e) { /* file:// or sandboxed: seed just won't persist */ }
  requestAnimationFrame(drawFrame);
}

stage.addEventListener("click", () => {
  newDrawing((Math.random() * 1e9) | 0);
});
stage.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " "){ e.preventDefault(); newDrawing((Math.random() * 1e9) | 0); }
});

let rsT = null;
window.addEventListener("resize", () => {
  clearTimeout(rsT);
  rsT = setTimeout(resize, 120);
});

pts = buildPath(seed);
t0 = performance.now();
resize();
requestAnimationFrame(drawFrame);
</script>
</body>
</html>
