<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wavefields for Sleepers</title>
<style>
html, body { margin: 0; padding: 0; background: #ddd9d0; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GOLDEN = 0.618034; /* horizon at the golden section */
var FRAME_T = 60.0; /* fixed phase: t = 60 s, horizon slightly lifted, swell mid-phase, one ripple partway out */
var CYCLE = 360.0; /* one cycle lasts six minutes */
var RIPPLE_DUR = 45.0; /* seconds a bell-tone ripple lives */
var CROW_DUR = 30.0; /* seconds a crow takes to cross */
var SKY_TOP = '#DCD9D1'; /* dawn grey */
var SKY_LOW = '#E6DDBE'; /* pale gold at the horizon */
var GOLD_BAND = '#E3CE8F';
var WATER_TOP = '#2B3641'; /* deep slate */
var WATER_LOW = '#1A222B';
var SWELL_LINE = '#8FA3B0';
var RIPPLE_INK = '#F2EDDC';
var CROW_INK = '#101216';
var PLATE_FILL = '#1A222B';
var PLATE_LINE = 'rgba(232,226,210,0.28)';
var PLATE_INK = '#E8E2D2';
var HINT_INK = '#E8E2D2';
var DURATION_INK = '#3A444E';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* ---- fixed ripple schedule, seed 1799 ----
   One ripple per cycle: t0 = 48 + k * 360 + jitter (+/-20 s).
   k = 0 fires at 51.0 s, so at frame one (t = 60 s) it is 9.0 s old,
   partway across the water. Next ripple at 406.2 s. */
var RIPPLES = [];
(function buildRipples() {
  var rng = mulberry32(1799 + 31);
  var k;
  for (k = -1; k <= 4; k++) {
    RIPPLES.push({
      t0: 48 + k * CYCLE + (rng() - 0.5) * 40,
      ox: 0.68, /* off-center origin, fraction of field width */
      oy: 0.42  /* fraction of water depth below the horizon */
    });
  }
})();
/* ---- fixed crow schedule, seed 1799 ----
   One crow per cycle: start = 150 + k * 360 + jitter (+/-20 s).
   k = 0 starts at 160.4 s, so no crow is in the sky at frame one.
   Next crow at 508.8 s. */
var CROWS = [];
(function buildCrows() {
  var rng = mulberry32(1799 + 57);
  var k;
  for (k = -1; k <= 4; k++) {
    CROWS.push({ start: 150 + k * CYCLE + (rng() - 0.5) * 40 });
  }
})();
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
/* Oscillator 1: horizon lift, one full breath per 360 s cycle.
   At t = 60 s, sin(2 PI * 60 / 360) = sin(PI / 3) = 0.866, a slight lift. */
function horizonLift(t) {
  return 0.012 * F.h * Math.sin(TAU * t / CYCLE);
}
/* Oscillator 2: swell phase, 120 s period, coupled to the lift oscillator
   by a fixed phase offset. At t = 60 s the swell is at zero crossing,
   rising: mid-phase. */
function swellPhase(t) {
  return Math.sin(TAU * t / 120 - Math.PI);
}
function horizonY(t) {
  return F.y + GOLDEN * F.h + horizonLift(t);
}
/* The horizon line itself breathes as a gentle sine, amplitude tied to
   the swell oscillator so the two stay coupled. */
function drawHorizonLine(t, hy) {
  var sw = swellPhase(t);
  var amp = 0.004 * F.h * (0.6 + 0.4 * sw);
  ctx.strokeStyle = rgba(GOLD_BAND, 0.85);
  ctx.lineWidth = Math.max(1, F.w * 0.002);
  ctx.beginPath();
  var x;
  for (x = F.x; x <= F.x + F.w; x += 8) {
    var yy = hy + amp * Math.sin(TAU * (x - F.x) / (F.w * 0.55) + sw * 1.2);
    if (x === F.x) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
  }
  ctx.stroke();
}
function drawSwell(t, hy) {
  var waterH = F.y + F.h - hy;
  var sw = swellPhase(t);
  var i;
  for (i = 0; i < 3; i++) {
    var depth = 0.22 + i * 0.26; /* fraction of water depth */
    var yy = hy + depth * waterH + 0.012 * F.h * Math.sin(sw * 1.4 + i * 1.7);
    var amp = 0.006 * F.h * (1 - i * 0.22);
    var al = 0.20 - i * 0.05;
    ctx.strokeStyle = rgba(SWELL_LINE, al);
    ctx.lineWidth = 1;
    ctx.beginPath();
    var x;
    for (x = F.x; x <= F.x + F.w; x += 10) {
      var y2 = yy + amp * Math.sin(TAU * (x - F.x) / (F.w * 0.42) + sw * 2.0 + i * 2.1);
      if (x === F.x) ctx.moveTo(x, y2); else ctx.lineTo(x, y2);
    }
    ctx.stroke();
  }
}
function drawRipple(t, hy) {
  var i;
  for (i = 0; i < RIPPLES.length; i++) {
    var r = RIPPLES[i];
    var age = t - r.t0;
    if (age < 0 || age >= RIPPLE_DUR) continue;
    var frac = age / RIPPLE_DUR;
    var cx = F.x + r.ox * F.w;
    var waterH = F.y + F.h - hy;
    var cy = hy + r.oy * waterH;
    var maxR = 0.42 * F.w;
    var rad = maxR * Math.pow(frac, 0.8);
    var al = 0.55 * Math.exp(-age / 18);
    ctx.strokeStyle = rgba(RIPPLE_INK, al);
    ctx.lineWidth = Math.max(1, F.w * 0.0016);
    ctx.beginPath();
    ctx.ellipse(cx, cy, rad, rad * 0.30, 0, 0, TAU);
    ctx.stroke();
    /* a fainter second ring trailing the first */
    if (frac > 0.25) {
      var rad2 = maxR * Math.pow(frac - 0.18, 0.8);
      ctx.strokeStyle = rgba(RIPPLE_INK, al * 0.35);
      ctx.beginPath();
      ctx.ellipse(cx, cy, rad2, rad2 * 0.30, 0, 0, TAU);
      ctx.stroke();
    }
  }
}
function drawCrow(t) {
  var i;
  for (i = 0; i < CROWS.length; i++) {
    var c = CROWS[i];
    var age = t - c.start;
    if (age < 0 || age >= CROW_DUR) continue;
    var frac = age / CROW_DUR;
    var cx = F.x + frac * F.w;
    var cy = F.y + 0.16 * F.h + Math.sin(frac * TAU * 1.5) * 0.008 * F.h;
    var s = Math.max(3, F.w * 0.011);
    var flap = Math.sin(age * TAU * 0.9) * 0.5;
    ctx.strokeStyle = CROW_INK;
    ctx.lineWidth = Math.max(1.2, s * 0.16);
    ctx.lineCap = 'round';
    /* body: a single short mark */
    ctx.beginPath();
    ctx.moveTo(cx - s, cy);
    ctx.lineTo(cx + s, cy);
    ctx.stroke();
    /* wings, one slow beat */
    ctx.beginPath();
    ctx.moveTo(cx - s * 0.4, cy);
    ctx.lineTo(cx - s * 1.1, cy - s * (0.9 + flap));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + s * 0.4, cy);
    ctx.lineTo(cx + s * 1.1, cy - s * (0.9 - flap));
    ctx.stroke();
  }
}
function drawDurationLine(t) {
  /* The piece states its duration plainly at the start, in canvas-drawn
     text. It fades on a closed-form schedule between t = 120 s and
     t = 180 s. No progress bar, no countdown, no reward. */
  var al = 1;
  if (t > 120) al = clamp(1 - (t - 120) / 60, 0, 1);
  if (al <= 0) return;
  var px = isPhone ? 13 : 14;
  ctx.font = px + 'px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = rgba(DURATION_INK, 0.72 * al);
  ctx.fillText('One cycle lasts six minutes.', F.x + 14, horizonY(t) - 18);
}
function drawField(t) {
  var hy = horizonY(t);
  /* sky: dawn grey fading to pale gold at the horizon */
  var g = ctx.createLinearGradient(0, F.y, 0, hy);
  g.addColorStop(0, SKY_TOP);
  g.addColorStop(0.82, SKY_LOW);
  g.addColorStop(1, GOLD_BAND);
  ctx.fillStyle = g;
  ctx.fillRect(F.x, F.y, F.w, hy - F.y);
  /* water: deep slate, darker toward the bottom */
  var w2 = ctx.createLinearGradient(0, hy, 0, F.y + F.h);
  w2.addColorStop(0, WATER_TOP);
  w2.addColorStop(1, WATER_LOW);
  ctx.fillStyle = w2;
  ctx.fillRect(F.x, hy, F.w, F.y + F.h - hy);
  drawSwell(t, hy);
  drawRipple(t, hy);
  drawHorizonLine(t, hy);
  drawCrow(t);
  drawDurationLine(t);
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Wavefields for Sleepers').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Wavefields for Sleepers').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 12 · 15').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Wavefields for Sleepers', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 12 · 15', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = SKY_TOP;
  ctx.fillRect(0, 0, VW, VH);
  drawField(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    horizonY: function (t) { return horizonY(t); },
    rippleAt: function (t) {
      var out = [], i;
      for (i = 0; i < RIPPLES.length; i++) {
        var age = t - RIPPLES[i].t0;
        if (age >= 0 && age < RIPPLE_DUR) out.push({ age: age, t0: RIPPLES[i].t0 });
      }
      return out;
    },
    crowAt: function (t) {
      var out = [], i;
      for (i = 0; i < CROWS.length; i++) {
        var age = t - CROWS[i].start;
        if (age >= 0 && age < CROW_DUR) out.push({ age: age, start: CROWS[i].start });
      }
      return out;
    }
  };
}
/* ---- frame one: fixed phase t = 60 s ----
   No wall clock is read for frame one. Input does nothing by design:
   no pointer or keyboard handlers are registered, so nothing the
   viewer does shortens or changes anything. */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  /* True time: phase is computed from a wall-clock start captured after
     the fixed first frame, so dropped frames never lose time. */
  var startMs = Date.now();
  (function loop() {
    function step() {
      phaseT = FRAME_T + (Date.now() - startMs) / 1000;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
