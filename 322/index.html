<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.322 Hide and Seek</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#163A38; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.322 Hide and Seek (meohmy_graphics).
// A dense daisy and gingko field in greens and teal on a deep
// teal ground. Exactly 7 butterflies hide in it by colour
// distance, exactly 9 decoys (3 worms, 3 snails, 3 spiders)
// are planted to mislead, and exactly 140 field motifs fill
// the ground. The piece carries an authored rotation of 5
// complete fields. A single tap resolves only after a 350ms
// window closes, so a second tap inside the window is read
// as a double-tap: it advances to the next authored field
// and resets the found count. A correct tap reveals its
// butterfly in full amber and advances the count caption,
// the only text in the piece. Wrong taps do nothing. Idle
// is a 36s seamless loop: the field breathes on sine phases
// and the decoys inch along short authored paths and back,
// so frame 36s is identical to frame 0.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var STEM = '#4A6B4F', LEAF = '#2E7D7B', CREAM = '#F2EBD8', AMBER = '#D9A441', GROUND = '#163A38';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 36;
var T = 8.5, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function rng(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function circ(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) ctx.fill(); else ctx.stroke(); }
function blendAlpha(diff) { return diff === 0 ? 1 : (diff === 1 ? 0.48 : 0.9); }

// ---- authored rotation of 5 fields --------------------------
// Per field: exactly 7 butterflies at mixed difficulty
// (2 easy, 3 mid, 2 hard), exactly 9 decoys (3 worms,
// 3 snails, 3 spiders), exactly 140 field motifs. All
// placements come from the fixed per-field seeds below at
// init; nothing is picked at runtime.
var FIELD_SEEDS = [32201, 32217, 32233, 32249, 32265];
var DIFFS = [0, 0, 1, 1, 1, 2, 2];
var FIELDS = [];
(function () {
  var fi, i, j;
  for (fi = 0; fi < FIELD_SEEDS.length; fi++) {
    var r = rng(FIELD_SEEDS[fi]);
    var motifs = [];
    for (i = 0; i < 140; i++) {
      motifs.push({
        x: 24 + r() * (DW - 48), y: 24 + r() * (DH - 48),
        kind: i % 3,
        scale: 0.9 + r() * 0.9,
        rot: r() * Math.PI * 2,
        phase: r() * Math.PI * 2,
        alt: r() < 0.5
      });
    }
    var flies = [];
    for (i = 0; i < 7; i++) {
      var fx = 0, fy = 0, ok = false, tries = 0;
      while (!ok && tries < 80) {
        fx = 90 + r() * (DW - 180); fy = 90 + r() * (DH - 180);
        ok = true;
        for (j = 0; j < flies.length; j++) {
          var dx = flies[j].x - fx, dy = flies[j].y - fy;
          if (dx * dx + dy * dy < 120 * 120) { ok = false; break; }
        }
        tries++;
      }
      flies.push({
        x: fx, y: fy,
        scale: 0.85 + r() * 0.35,
        rot: (r() - 0.5) * 1.1,
        diff: DIFFS[i],
        phase: r() * Math.PI * 2
      });
    }
    var kinds = ['worm', 'worm', 'worm', 'snail', 'snail', 'snail', 'spider', 'spider', 'spider'];
    var decoys = [];
    for (i = 0; i < 9; i++) {
      var px = 60 + r() * (DW - 120), py = 60 + r() * (DH - 120);
      decoys.push({
        x: px, y: py, kind: kinds[i],
        dx: (r() * 2 - 1) * 26, dy: (r() * 2 - 1) * 16,
        phase: r(), scale: 0.8 + r() * 0.4,
        rot: (r() - 0.5) * 0.9
      });
    }
    FIELDS.push({ motifs: motifs, flies: flies, decoys: decoys });
  }
})();
if (FIELDS.length !== 5) throw new Error('Hide and Seek needs exactly 5 authored fields');
(function () {
  var fi, i, easy, mid, hard, worms, snails, spiders;
  for (fi = 0; fi < FIELDS.length; fi++) {
    var f = FIELDS[fi];
    if (f.flies.length !== 7) throw new Error('Hide and Seek needs exactly 7 butterflies per field');
    if (f.decoys.length !== 9) throw new Error('Hide and Seek needs exactly 9 decoys per field');
    if (f.motifs.length !== 140) throw new Error('Hide and Seek needs exactly 140 field motifs per field');
    easy = 0; mid = 0; hard = 0;
    for (i = 0; i < f.flies.length; i++) {
      if (f.flies[i].diff === 0) easy++; else if (f.flies[i].diff === 1) mid++; else hard++;
    }
    if (easy !== 2 || mid !== 3 || hard !== 2) throw new Error('Hide and Seek butterfly difficulty mix mismatch');
    worms = 0; snails = 0; spiders = 0;
    for (i = 0; i < f.decoys.length; i++) {
      if (f.decoys[i].kind === 'worm') worms++;
      else if (f.decoys[i].kind === 'snail') snails++;
      else if (f.decoys[i].kind === 'spider') spiders++;
      else throw new Error('unknown decoy kind');
    }
    if (worms !== 3 || snails !== 3 || spiders !== 3) throw new Error('Hide and Seek decoy mix mismatch');
  }
})();

// ---- per-field play state ------------------------------------
var fieldIdx = 0;
var found = [false, false, false, false, false, false, false];
var revealT = [-10, -10, -10, -10, -10, -10, -10];
var foundCount = 0;
function resetField() {
  found = [false, false, false, false, false, false, false];
  revealT = [-10, -10, -10, -10, -10, -10, -10];
  foundCount = 0;
}
function field() { return FIELDS[fieldIdx]; }

function crawlOffset(d, t) {
  var p = (t / LOOP + d.phase) % 1;
  var prog = p < 0.5 ? p * 2 : 2 - p * 2;
  return [d.dx * prog, d.dy * prog];
}

// ---- field motifs ---------------------------------------------
function drawDaisyMotif(m) {
  // Droopy petal daisy: seven petals drooping around a centre.
  var k, a;
  st(CREAM, 1.8);
  for (k = 0; k < 7; k++) {
    a = k / 7 * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(Math.cos(a) * 10 * m.scale, Math.sin(a) * 10 * m.scale + 5 * m.scale,
      Math.cos(a) * 17 * m.scale, Math.sin(a) * 15 * m.scale + 8 * m.scale);
    ctx.stroke();
  }
  ctx.fillStyle = STEM; circ(0, 0, 3.6 * m.scale, true);
}
function drawGingkoMotif(m) {
  // Gingko fan: a fan outline with veins from one stem base.
  var R = 19 * m.scale, i, a;
  st(LEAF, 1.9);
  ctx.beginPath();
  ctx.moveTo(0, 8 * m.scale);
  for (i = 0; i <= 10; i++) {
    a = Math.PI * (1.08 + 0.84 * (i / 10));
    ctx.lineTo(Math.cos(a) * R, 8 * m.scale + Math.sin(a) * R);
  }
  ctx.closePath(); ctx.stroke();
  st(STEM, 1.4);
  for (i = 0; i < 5; i++) {
    a = Math.PI * (1.18 + 0.64 * (i / 4));
    ctx.beginPath(); ctx.moveTo(0, 8 * m.scale);
    ctx.lineTo(Math.cos(a) * R * 0.82, 8 * m.scale + Math.sin(a) * R * 0.82); ctx.stroke();
  }
  st(STEM, 2);
  ctx.beginPath(); ctx.moveTo(0, 8 * m.scale); ctx.lineTo(0, 17 * m.scale); ctx.stroke();
}
function drawLeafMotif(m) {
  // Filler leaf: one pointed oval with a centre vein.
  var col = m.alt ? STEM : LEAF;
  st(col, 1.9);
  ctx.beginPath();
  ctx.moveTo(0, -15 * m.scale);
  ctx.quadraticCurveTo(10 * m.scale, -4 * m.scale, 0, 15 * m.scale);
  ctx.quadraticCurveTo(-10 * m.scale, -4 * m.scale, 0, -15 * m.scale);
  ctx.stroke();
  st(col, 1.3);
  ctx.beginPath(); ctx.moveTo(0, -12 * m.scale); ctx.lineTo(0, 12 * m.scale); ctx.stroke();
}

// ---- butterflies ----------------------------------------------
function wingPaths() {
  var s;
  for (s = -1; s <= 1; s += 2) {
    ctx.beginPath();
    ctx.ellipse(s * 17, -8, 15, 10.5, s * 0.55, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(s * 13, 9, 11.5, 8, -s * 0.4, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }
}
function drawButterfly(b, idx) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.rot);
  ctx.scale(b.scale, b.scale);
  if (found[idx]) {
    // Revealed: full amber wings with ground linework.
    ctx.fillStyle = AMBER; st(GROUND, 2.2);
    wingPaths();
    st(GROUND, 3.4);
    ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(0, 15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -11); ctx.quadraticCurveTo(-8, -19, -13, -21); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -11); ctx.quadraticCurveTo(8, -19, 13, -21); ctx.stroke();
    // Reveal flash: a soft amber ring that settles fast.
    var fp = (T - revealT[idx]) / 0.45;
    if (fp >= 0 && fp < 1) {
      ctx.globalAlpha = (1 - fp) * 0.65;
      st(AMBER, 3);
      circ(0, 0, 20 + fp * 22, false);
      ctx.globalAlpha = 1;
    }
  } else if (b.diff === 0) {
    // Easy: amber at full strength against the deep teal.
    ctx.globalAlpha = 1;
    ctx.fillStyle = GROUND; st(AMBER, 2.3);
    wingPaths();
    st(AMBER, 2.6);
    ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(0, 15); ctx.stroke();
  } else if (b.diff === 1) {
    // Mid: amber blended toward the local leaf teal, laid
    // down as translucent amber over teal linework.
    ctx.fillStyle = GROUND; st(LEAF, 2.2);
    wingPaths();
    ctx.globalAlpha = blendAlpha(1);
    ctx.fillStyle = GROUND; st(AMBER, 2.2);
    wingPaths();
    ctx.globalAlpha = 1;
    st(LEAF, 1.6);
    ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(0, 15); ctx.stroke();
  } else {
    // Hard: lineweight only, in the local field colours at
    // a small colour distance. No outline, no hint.
    ctx.fillStyle = GROUND; st(LEAF, 1.9);
    wingPaths();
    st(STEM, 1.5);
    ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(0, 15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-24, -12); ctx.lineTo(24, -12); ctx.stroke();
  }
  ctx.restore();
}

// ---- decoys -----------------------------------------------------
function drawWorm(d) {
  var i;
  st(STEM, 3.4);
  ctx.beginPath();
  ctx.moveTo(-20, 4);
  ctx.quadraticCurveTo(-10, -7, 0, 2);
  ctx.quadraticCurveTo(10, -7, 20, 3);
  ctx.stroke();
  ctx.fillStyle = CREAM;
  circ(-13, -1, 1.9, true); circ(0, 0, 1.9, true); circ(13, 0, 1.9, true);
  for (i = 0; i < 3; i++) { /* segments counted in path above */ }
}
function drawSnail(d) {
  st(CREAM, 2.2);
  ctx.beginPath();
  ctx.moveTo(-16, 9); ctx.lineTo(13, 9); ctx.stroke();
  st(STEM, 2.4);
  ctx.beginPath(); ctx.moveTo(9, 9); ctx.quadraticCurveTo(16, 2, 19, -3); ctx.stroke();
  ctx.fillStyle = CREAM; circ(19, -4, 2.2, true);
  st(LEAF, 2.2);
  ctx.beginPath();
  ctx.arc(-3, 1, 10, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  ctx.arc(-3, 1, 5.5, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = STEM; circ(-3, 1, 2, true);
}
function drawSpider(d) {
  var k, a;
  st(LEAF, 1.9);
  for (k = 0; k < 8; k++) {
    a = (k < 4 ? -1 : 1) * (0.5 + (k % 4) * 0.42);
    var sx = k < 4 ? -1 : 1;
    ctx.beginPath();
    ctx.moveTo(sx * 4, 0);
    ctx.quadraticCurveTo(sx * 13, Math.sin(a) * 10 - 3, sx * 19, Math.sin(a) * 15 + 4);
    ctx.stroke();
  }
  ctx.fillStyle = STEM; circ(0, 2, 6.5, true);
  ctx.fillStyle = CREAM; circ(-2.2, 0, 1.4, true); circ(2.2, 0, 1.4, true);
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  var f = field();
  var bx = 3.5 * Math.sin(Math.PI * 2 * T / LOOP);
  var by = 2.5 * Math.sin(Math.PI * 2 * T / LOOP + 1.3);
  var i, m;
  ctx.save();
  ctx.translate(bx, by);
  for (i = 0; i < f.motifs.length; i++) {
    m = f.motifs[i];
    ctx.save();
    ctx.translate(m.x + 1.6 * Math.sin(Math.PI * 2 * T / LOOP + m.phase),
      m.y + 1.6 * Math.cos(Math.PI * 2 * T / LOOP + m.phase));
    ctx.rotate(m.rot);
    if (m.kind === 0) drawDaisyMotif(m); else if (m.kind === 1) drawGingkoMotif(m); else drawLeafMotif(m);
    ctx.restore();
  }
  for (i = 0; i < f.flies.length; i++) drawButterfly(f.flies[i], i);
  for (i = 0; i < f.decoys.length; i++) {
    var d = f.decoys[i], off = crawlOffset(d, T);
    ctx.save();
    ctx.translate(d.x + off[0], d.y + off[1]);
    ctx.rotate(d.rot);
    ctx.scale(d.scale, d.scale);
    if (d.kind === 'worm') drawWorm(d); else if (d.kind === 'snail') drawSnail(d); else drawSpider(d);
    ctx.restore();
  }
  ctx.restore();
  // The only text in the piece: the found count, low in the
  // corner, shown only after the first find.
  if (foundCount > 0) {
    ctx.fillStyle = CREAM;
    ctx.font = '600 24px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(foundCount + '/7', 26, DH - 26);
  }
}

// ---- interaction: tap to seek, double-tap to reseed -----------
// Single taps resolve only after the 350ms window closes.
// A second tap inside the window is a double-tap: the
// pending tap is resolved first, then the field advances
// and the count resets.
var tap = null;
var pending = null, pendingTimer = null;
function nowMs() {
  if (typeof performance !== 'undefined' && performance && typeof performance.now === 'function') return performance.now();
  return Date.now();
}
function resolveTap(p) {
  var f = field(), i, b, dx, dy, rr;
  for (i = 0; i < f.flies.length; i++) {
    if (found[i]) continue;
    b = f.flies[i];
    dx = p[0] - b.x; dy = p[1] - b.y;
    rr = 36 * b.scale;
    if (dx * dx + dy * dy <= rr * rr) {
      found[i] = true;
      revealT[i] = T;
      foundCount++;
      return;
    }
  }
  // Wrong taps do nothing at all.
}
function clearPending() {
  if (pendingTimer !== null && typeof clearTimeout === 'function') clearTimeout(pendingTimer);
  pendingTimer = null; pending = null;
}
function onTapPoint(p) {
  var n = nowMs();
  if (pending && n - pending.at <= 350) {
    var first = pending.p;
    clearPending();
    resolveTap(first);
    fieldIdx = (fieldIdx + 1) % FIELDS.length;
    resetField();
    return;
  }
  if (pending) { var old = pending.p; clearPending(); resolveTap(old); }
  pending = { p: p, at: n };
  if (typeof setTimeout === 'function') {
    pendingTimer = setTimeout(function () {
      if (pending) { var pp = pending.p; pending = null; pendingTimer = null; resolveTap(pp); }
    }, 350);
  } else {
    var pp2 = pending.p; pending = null; resolveTap(pp2);
  }
}
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  tap = { x: p[0], y: p[1], sx: p[0], sy: p[1], moved: 0 };
});
canvas.addEventListener('pointermove', function (e) {
  if (!tap) return;
  var p = toDesign(e);
  tap.moved = Math.max(tap.moved, Math.abs(p[0] - tap.sx), Math.abs(p[1] - tap.sy));
});
canvas.addEventListener('pointerup', function (e) {
  if (tap && tap.moved < 9) onTapPoint(toDesign(e));
  tap = null;
});
canvas.addEventListener('pointercancel', function () { tap = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
