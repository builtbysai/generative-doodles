<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.196 Mock Back</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#070708; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.196 Mock Back (Amanda Willshire, Maude). A bird of hard flat
// colour blocks, hot pink breast, teal wings, yellow crown, orange
// tail, and a dull aluminum belly panel off a 1970s plane, perched
// over five little worm stations. Tap a worm and you have spoken:
// the taps are the voice, there is no microphone. She mocks your
// pattern straight back, pitch-shifted into a bouncing note-ribbon
// from her beak, then answers with an older phrase from her memory
// of strangers, stuttered. Double-tap her and she performs a
// scrambled greatest hits. Left alone, she replays her memory to
// herself every twenty seconds, which teaches the whole mechanism.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#070708', PINK = '#FF2E88', TEAL = '#14C8C0';
var CROWN = '#FFD23F', TAIL = '#FF6B1A', ALU = '#9AA0A8';
var WORM_HI = '#7CFC00', WORM_LO = '#3E6B1F';
var NOTE_COLS = ['#FF2E88', '#14C8C0', '#FFD23F', '#FF6B1A', '#7CFC00'];
var W = 0, H = 0, phone = false;
var seed = 196196;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

// ---- history buffer -------------------------------------------------------------
var buffer = [];   // phrases: {events:[{dt, worm}]}
function ghostPhrase() {
  var n = 3 + Math.floor(rand() * 3), evs = [], t = 0, w0 = Math.floor(rand() * 5);
  for (var i = 0; i < n; i++) {
    evs.push({ dt: t, worm: (w0 + Math.floor(rand() * 3)) % 5 });
    t += 0.24 + rand() * 0.4;
  }
  return { events: evs };
}
for (var gi = 0; gi < 4; gi++) buffer.push(ghostPhrase());
function wormHas(i) {
  for (var p = 0; p < buffer.length; p++)
    for (var e = 0; e < buffer[p].events.length; e++)
      if (buffer[p].events[e].worm === i) return true;
  return false;
}

// ---- performance engine -------------------------------------------------------------
var perfs = [];    // {startT, notes:[{at, worm, yOff}]}
var T = 0, lastNow = -1, lastActT = 0;
function buildNotes(phrase, opt) {
  var notes = [], acc = 0;
  for (var i = 0; i < phrase.events.length; i++) {
    var ev = phrase.events[i];
    var at = ev.dt * (opt.speed || 1) + (opt.offset || 0);
    if (opt.stutter) {
      var r = rand();
      if (r < 0.28) continue;                       // gated out
      notes.push({ at: at, worm: ev.worm, yOff: opt.yOff });
      if (r > 0.78) notes.push({ at: at + 0.1, worm: ev.worm, yOff: opt.yOff }); // stutter repeat
    } else {
      notes.push({ at: at, worm: ev.worm, yOff: opt.yOff });
    }
    acc = at;
  }
  return { notes: notes, dur: acc + 0.4 };
}
function perform(phrase, opt) {
  var b = buildNotes(phrase, opt || {});
  if (!b.notes.length) return;
  perfs.push({ startT: T, notes: b.notes });
  lastActT = T;
}
function greatestHits() {
  if (!buffer.length) return;
  var notes = [], off = 0;
  var picks = 2 + Math.floor(rand() * 2);
  for (var k = 0; k < picks; k++) {
    var ph = buffer[Math.floor(rand() * buffer.length)];
    var take = Math.min(3, ph.events.length);
    for (var i = 0; i < take; i++) {
      notes.push({ at: off + ph.events[i].dt * 0.8, worm: ph.events[i].worm, yOff: (rand() - 0.5) * 56 });
    }
    off += ph.events[take - 1].dt * 0.8 + 0.55;
    if (off > 5.2) break;
  }
  if (notes.length) { perfs.push({ startT: T, notes: notes }); lastActT = T; }
}

// ---- worms ------------------------------------------------------------------------------
var WORM_XF = [0.16, 0.33, 0.5, 0.67, 0.84];
var wormFlash = [0, 0, 0, 0, 0];
function wormPos(i) {
  var xf = WORM_XF[i];
  return { x: xf * W, y: H * 0.82 + Math.pow((xf - 0.5) * 2, 2) * H * 0.045 };
}
function drawWorm(i) {
  var p = wormPos(i);
  var lit = wormHas(i) || wormFlash[i] > 0.05;
  var col = lit ? WORM_HI : WORM_LO;
  var s = Math.min(W, H) / 720 + 0.55;
  ctx.save();
  ctx.globalAlpha = lit ? 0.65 + 0.35 * wormFlash[i] : 0.8;
  ctx.fillStyle = col;
  for (var k = 4; k >= 0; k--) {
    var px = p.x - 24 * s + k * 12 * s;
    var py = p.y + Math.sin(k * 1.1 + T * 2 + i * 1.7) * 3 * s;
    ctx.beginPath();
    ctx.arc(px, py, (7.5 - Math.abs(k - 2) * 0.9) * s * (1 + wormFlash[i] * 0.25), 0, 6.284);
    ctx.fill();
  }
  // segment ticks
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1;
  for (var q = 0; q < 4; q++) {
    var qx = p.x - 18 * s + q * 12 * s;
    var qy = p.y + Math.sin(q * 1.1 + 0.55 + T * 2 + i * 1.7) * 3 * s;
    ctx.beginPath(); ctx.moveTo(qx, qy - 6 * s); ctx.lineTo(qx, qy + 6 * s); ctx.stroke();
  }
  ctx.restore();
}

// ---- the bird ------------------------------------------------------------------------------
function birdGeom() {
  var s = Math.min(W, H) / 430;
  return { x: W * (phone ? 0.34 : 0.30), y: H * 0.40, s: s };
}
function beakTip() {
  var b = birdGeom();
  return { x: b.x + 128 * b.s, y: b.y - 50 * b.s + Math.sin(T * 1.4) * 2 };
}
function poly(pts, col) {
  ctx.beginPath();
  for (var i = 0; i < pts.length; i++) {
    if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]); else ctx.lineTo(pts[i][0], pts[i][1]);
  }
  ctx.closePath();
  ctx.fillStyle = col;
  ctx.fill();
}
function performing() { return perfs.length > 0; }
function drawBird() {
  var b = birdGeom(), s = b.s;
  var bob = Math.sin(T * 1.4) * 2;
  var lean = performing() ? -0.045 : 0;
  ctx.save();
  ctx.translate(b.x, b.y + bob);
  ctx.scale(s, s);
  // legs and perch are furniture: they stay level while she leans
  ctx.strokeStyle = ALU; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-2, 56); ctx.lineTo(-2, 84); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(24, 54); ctx.lineTo(24, 84); ctx.stroke();
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(-122, 88); ctx.lineTo(132, 88); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-108, 88); ctx.lineTo(-108, 108); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(118, 88); ctx.lineTo(118, 108); ctx.stroke();
  ctx.rotate(lean);
  // tail, fanned orange blocks behind the body
  poly([[-56, 16], [-120, 46], [-124, 18], [-96, 0], [-116, -20], [-58, -10]], TAIL);
  // body, hot pink breast block
  poly([[-64, -30], [-20, -52], [34, -50], [66, -26], [72, 8], [54, 40], [10, 58], [-34, 52], [-62, 26], [-70, -4]], PINK);
  // aluminum belly panel, with rivets
  poly([[-32, 32], [46, 28], [54, 40], [10, 58], [-34, 52]], ALU);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  var riv = [[-22, 38], [6, 42], [34, 36]];
  for (var i = 0; i < riv.length; i++) { ctx.beginPath(); ctx.arc(riv[i][0], riv[i][1], 1.8, 0, 6.284); ctx.fill(); }
  // teal wing block with feather notches
  poly([[-52, -34], [-6, -44], [30, -30], [22, 6], [-8, 26], [-44, 16], [-58, -8]], TEAL);
  ctx.strokeStyle = 'rgba(0,0,0,0.20)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-40, -12); ctx.lineTo(16, -16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-34, 4); ctx.lineTo(12, 0); ctx.stroke();
  // head block
  poly([[46, -76], [74, -84], [100, -72], [106, -48], [94, -28], [64, -24], [46, -42]], PINK);
  // yellow crown cap
  poly([[46, -72], [62, -86], [86, -86], [102, -70], [88, -62], [58, -62]], CROWN);
  // beak, two orange blades that open while she performs
  var open = performing() ? 5.5 : 1.2;
  poly([[100, -58], [128, -49], [101, -43]], TAIL);
  ctx.save();
  ctx.translate(100, -44); ctx.rotate(open * 0.02);
  poly([[0, 0], [26, 3], [1, 7]], TAIL);
  ctx.restore();
  // eye
  ctx.beginPath(); ctx.arc(82, -56, 3.6, 0, 6.284);
  ctx.fillStyle = GROUND; ctx.fill();
  ctx.restore();
}

// ---- note ribbons ----------------------------------------------------------------------------------
function drawNotes() {
  var bt = beakTip();
  for (var p = 0; p < perfs.length; p++) {
    var perf = perfs[p];
    for (var n = 0; n < perf.notes.length; n++) {
      var note = perf.notes[n];
      var age = T - (perf.startT + note.at);
      if (age < 0 || age > 1.15) continue;
      var wp = wormPos(note.worm);
      var g = Math.min(1, age / 0.3);
      var tx = wp.x, ty = wp.y - 95 + note.yOff - Math.sin(g * 3.1416) * 24;
      var cxp = (bt.x + tx) / 2, cyp = Math.min(bt.y, ty) - 58;
      ctx.strokeStyle = NOTE_COLS[note.worm];
      var steps = 18, upto = Math.max(2, Math.floor(steps * g));
      function ribbonPath() {
        ctx.beginPath();
        for (var s2 = 0; s2 <= upto; s2++) {
          var u = s2 / steps;
          var x = (1 - u) * (1 - u) * bt.x + 2 * (1 - u) * u * cxp + u * u * tx;
          var y = (1 - u) * (1 - u) * bt.y + 2 * (1 - u) * u * cyp + u * u * ty;
          if (s2 === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
      }
      ctx.globalAlpha = 0.22 * (1 - Math.max(0, age - 0.55) / 0.6);
      ctx.lineWidth = 8;
      ribbonPath(); ctx.stroke();
      ctx.globalAlpha = 0.9 * (1 - Math.max(0, age - 0.55) / 0.6);
      ctx.lineWidth = 3;
      ribbonPath(); ctx.stroke();
      // note head and stem at the travelling tip
      var u2 = g;
      var hx = (1 - u2) * (1 - u2) * bt.x + 2 * (1 - u2) * u2 * cxp + u2 * u2 * tx;
      var hy = (1 - u2) * (1 - u2) * bt.y + 2 * (1 - u2) * u2 * cyp + u2 * u2 * ty;
      ctx.beginPath(); ctx.arc(hx, hy, 4.2, 0, 6.284);
      ctx.fillStyle = NOTE_COLS[note.worm]; ctx.fill();
      ctx.beginPath(); ctx.moveTo(hx + 4, hy); ctx.lineTo(hx + 4, hy - 15);
      ctx.lineWidth = 2; ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

// ---- input ---------------------------------------------------------------------------------------------
var recEvents = [], recStart = 0, lastTapT = -9, finalizing = false;
var lastBirdTapT = -9;
canvas.addEventListener('pointerdown', function (e) {
  var b = birdGeom();
  var bdx = e.clientX - b.x, bdy = e.clientY - b.y;
  // double-tap on the bird: greatest hits
  if (bdx * bdx + bdy * bdy < Math.pow(115 * b.s, 2)) {
    var now = (e.timeStamp || 0) / 1000;
    if (now - lastBirdTapT < 0.34) { greatestHits(); lastBirdTapT = -9; }
    else lastBirdTapT = now;
    return;
  }
  // tap a worm: speak
  for (var i = 0; i < 5; i++) {
    var wp = wormPos(i);
    var dx = e.clientX - wp.x, dy = e.clientY - wp.y;
    if (dx * dx + dy * dy < 56 * 56) {
      wormFlash[i] = 1;
      if (!recEvents.length || T - lastTapT > 1.6) { recEvents = []; recStart = T; finalizing = false; }
      recEvents.push({ dt: T - recStart, worm: i });
      lastTapT = T; lastActT = T;
      return;
    }
  }
});

// ---- resize -------------------------------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700;
  if (!phone && !(sw > 0)) phone = H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- step and draw ------------------------------------------------------------------------------------------------
function step(dt) {
  for (var i = 0; i < 5; i++) wormFlash[i] = Math.max(0, wormFlash[i] - dt * 1.4);
  // close an open phrase 1.5s after its last tap: mock it, then a ghost answers
  if (recEvents.length && !finalizing && T - lastTapT > 1.5) {
    finalizing = true;
    var phrase = { events: recEvents.slice() };
    recEvents = [];
    buffer.push(phrase);
    while (buffer.length > 40) buffer.shift();
    perform(phrase, { yOff: -46, speed: 0.92 });
    var ghosts = buffer.slice(0, buffer.length - 1);
    if (ghosts.length) {
      var g = ghosts[Math.floor(rand() * ghosts.length)];
      var dur = phrase.events[phrase.events.length - 1].dt * 0.92 + 0.55;
      var b = buildNotes(g, { yOff: -6, stutter: true, offset: dur });
      if (b.notes.length) perfs.push({ startT: T, notes: b.notes });
    }
  }
  // prune finished performances
  for (var p = perfs.length - 1; p >= 0; p--) {
    var last = 0;
    for (var n = 0; n < perfs[p].notes.length; n++) last = Math.max(last, perfs[p].notes[n].at);
    if (T - perfs[p].startT > last + 1.3) perfs.splice(p, 1);
  }
  // attract: idle twenty seconds, she replays her memory to herself
  if (T - lastActT > 20 && buffer.length && !recEvents.length) {
    perform(buffer[Math.floor(rand() * buffer.length)], { yOff: -24 });
  }
}

function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (lastNow >= 0 && now > 0) {
    var dt = Math.min(0.05, (now - lastNow) / 1000);
    T += dt;
    step(dt);
  }
  lastNow = now;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  drawBird();
  for (var i = 0; i < 5; i++) drawWorm(i);
  drawNotes();
}

// frame one: a ghost phrase is already mid-replay, ribbon in flight;
// pick the seeded phrase whose first note flies the longest diagonal
resize();
var fi = 0, fbest = -1;
for (var f = 0; f < buffer.length; f++) {
  var d0 = Math.abs(buffer[f].events[0].worm - 2);
  if (d0 > fbest) { fbest = d0; fi = f; }
}
perform(buffer[fi], { yOff: -24 });
perfs[0].startT = -0.55;
lastActT = -0.55;
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
