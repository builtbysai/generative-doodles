<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cham in the Grasslands</title>
<style>
  html, body { margin: 0; padding: 0; background: #c8d8dc; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  /* ---- seeded PRNG (mulberry32), never Math.random ---- */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1461000);

  /* ---- palette: prompt only ---- */
  var SKY = '#c8d8dc', GRASS = '#8a9a5b', EARTH = '#6b5a3e';
  var RUST = '#a34a24', OCHRE = '#d9a441', DEEP = '#1e2a3a';
  var IVORY = '#efe6d0', SCARLET = '#c1272d';

  /* ---- viewport ---- */
  var W = 0, H = 0, phone = false;
  function size() {
    var vv = (typeof visualViewport !== 'undefined' && visualViewport) ? visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = Math.round(W); canvas.height = Math.round(H);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    var minScreen = 99999;
    if (typeof window !== 'undefined' && window.screen) {
      minScreen = Math.min(window.screen.width, window.screen.height);
    }
    phone = minScreen < 700 || (H > W * 1.15 && minScreen >= 700 && W < 700);
  }
  size();
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', size);
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      visualViewport.addEventListener('resize', size);
    }
  }

  /* ---- helpers (node-canvas safe: no gradients, no shadowBlur, no Path2D) ---- */
  function a4(x) { return Math.round(x * 10000) / 10000; }
  function rect(x, y, w, h, fill) {
    ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
  }
  function dot(x, y, r, fill) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
  }
  function line(x1, y1, x2, y2, wdt, col) {
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = col; ctx.lineWidth = wdt; ctx.stroke();
  }
  function poly(pts, fill) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) { ctx.lineTo(pts[i][0], pts[i][1]); }
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  }
  function ellipse(x, y, rx, ry, fill) {
    ctx.beginPath(); ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
  }

  /* ---- dancers: 8 figures, robe colours from one seeded stream ---- */
  var ROBES = [RUST, OCHRE, DEEP];
  var ND = 8;
  var dancerRobe = [];
  for (var d = 0; d < ND; d++) {
    dancerRobe.push(ROBES[Math.floor(rng() * 3)]);
  }
  /* banner sway phases, seeded once */
  var bannerPhase = [rng() * Math.PI * 2, rng() * Math.PI * 2];

  /* ---- loop: 60 s. Rotation 60 s, drum 2 s, banner sway 12 s:
         every period divides 60, so t=60 redraws t=0 exactly ---- */
  var LOOP = 60;

  function draw(t) {
    var S = Math.min(W, H);
    var horizon = H * 0.70;

    /* sky, dominant */
    rect(0, 0, W, horizon, SKY);
    /* steppe */
    rect(0, horizon, W, H - horizon, GRASS);
    /* earth strip at the very bottom */
    rect(0, H * 0.93, W, H * 0.07, EARTH);

    /* train-window edge: thin dark strip at the left, 6% of width */
    var stripW = W * 0.06;
    rect(0, 0, stripW, H, DEEP);
    /* thin ivory inner edge line, so the frame reads as a window frame */
    rect(stripW, 0, Math.max(2, S * 0.004), H, IVORY);
    /* a horizontal window bar across the strip, low, hinting at a frame */
    rect(0, horizon * 0.55, stripW, Math.max(3, S * 0.006), IVORY);

    /* dance circle, centered, small against the steppe */
    var cx = W * 0.52, cy = horizon + (H - horizon) * 0.42;
    var baseR = S * 0.115;
    /* drum pulse: subtle scale pulse on the circle, 2 s period, amplitude 1.5% */
    var pulse = 1 + 0.015 * Math.sin(Math.PI * 2 * (t / 2));
    var R = baseR * pulse;

    /* faint circle ground-mark under the dancers */
    ctx.beginPath(); ctx.moveTo(cx + R * 1.35, cy);
    ctx.ellipse(cx, cy, R * 1.35, R * 0.42, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(107,90,62,0.25)'; ctx.fill();

    /* long banners on poles flanking the circle, hanging almost still */
    var bannerH = S * 0.30;
    var bannerW = S * 0.045;
    var poles = [cx - R * 1.9, cx + R * 1.9];
    for (var b = 0; b < 2; b++) {
      var px = poles[b];
      var sway = 0.012 * Math.sin(Math.PI * 2 * (t / 12) + bannerPhase[b]);
      line(px, cy - bannerH * 0.9, px, cy + bannerH * 0.15, Math.max(2, S * 0.005), DEEP);
      var topY = cy - bannerH * 0.9, botY = cy + bannerH * 0.15;
      var lean = Math.sin(sway) * bannerH * 0.5;
      poly([
        [px, topY],
        [px + bannerW + lean * 0.3, topY],
        [px + bannerW + lean, botY],
        [px + lean, botY]
      ], b === 0 ? RUST : OCHRE);
      /* small scarlet hem stripe on each banner */
      poly([
        [px + lean * 0.9, botY - bannerH * 0.08],
        [px + bannerW + lean, botY - bannerH * 0.08],
        [px + bannerW + lean, botY],
        [px + lean * 0.9, botY]
      ], SCARLET);
    }

    /* dancers: robed figures on the circle path, shared rotation phase.
       Rotation is one full turn per 60 s loop; after 60 s every dancer is
       back at its starting angle, so the loop point is hidden by symmetry. */
    var rot = Math.PI * 2 * (t / LOOP);
    for (var i = 0; i < ND; i++) {
      var ang = rot + (Math.PI * 2 * i) / ND;
      var dx = cx + Math.cos(ang) * R;
      var dy = cy + Math.sin(ang) * R * 0.42;
      var fh = S * 0.085;            /* figure height */
      var fw = fh * 0.42;            /* robe half-width at hem */
      var robe = dancerRobe[i];
      /* layered robe: trapezoid, wider at the hem */
      poly([
        [dx - fw * 0.45, dy - fh * 0.55],
        [dx + fw * 0.45, dy - fh * 0.55],
        [dx + fw, dy + fh * 0.45],
        [dx - fw, dy + fh * 0.45]
      ], robe);
      /* robe layer stripe */
      rect(dx - fw * 0.7, dy + fh * 0.10, fw * 1.4, Math.max(2, fh * 0.05),
        i % 2 === 0 ? OCHRE : DEEP);
      /* mask: fixed ivory oval, scarlet accent stripe */
      ellipse(dx, dy - fh * 0.72, fw * 0.42, fh * 0.20, IVORY);
      rect(dx - fw * 0.42, dy - fh * 0.76, fw * 0.84, Math.max(2, fh * 0.045), SCARLET);
      /* two scarlet eye dots */
      dot(dx - fw * 0.16, dy - fh * 0.70, Math.max(1.5, fh * 0.022), SCARLET);
      dot(dx + fw * 0.16, dy - fh * 0.70, Math.max(1.5, fh * 0.022), SCARLET);
    }
  }

  /* ---- boot: frame one is draw(0); the clock starts with the rAF loop ---- */
  var started = false, t0 = 0;
  draw(0);
  function loop(ts) {
    if (!started) { started = true; t0 = ts; }
    var t = ((ts - t0) / 1000) % LOOP;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }

  /* probe hooks: no pointer handlers exist anywhere in this piece */
  if (typeof window !== 'undefined') {
    window.__piece = { draw: draw, LOOP: LOOP };
  }
})();
</script>
</body>
</html>
