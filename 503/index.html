<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snowfall Report</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #5E79D0; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var CORN  = '#5E79D0';   // cornflower ground
  var SUIT  = '#2D2DB3';   // deep-blue suit, also face linework and pole
  var WHITE = '#FFFFFF';
  var SKIN  = '#F8F5F0';
  var FGREEN = '#007C58';  // flag green band
  var FRED   = '#FE0000';  // flag red band
  var DASHC  = '#B9C6D4';  // grey-blue snow-dash

  var PHASE = 3.2;         // fixed pre-roll phase for frame one
  var FLAG_LOOP = 8.0;     // flag ripple period, seconds
  var BOB_LOOP = 8.0;      // skater bob period, seconds
  var PULSE_LOOP = 6.0;    // dash-cluster alpha wave period, seconds

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ------------------------------------------------------------------
  // Seeded scene dressing: snowflakes and dash clusters. Positions are
  // stored as fractions of the frame, so the same seeded layout lands
  // identically at every size. Flakes sit in side/corner zones, well
  // clear of the face; dash clusters live only in the bottom 15%.
  // ------------------------------------------------------------------
  var rng = mulberry32(503607);

  var FLAKE_ZONES = [
    [0.10, 0.13], [0.90, 0.17], [0.075, 0.46], [0.925, 0.52],
    [0.13, 0.76], [0.875, 0.79], [0.30, 0.045]
  ];
  var flakes = [];
  for (var i = 0; i < FLAKE_ZONES.length; i++) {
    flakes.push({
      x: FLAKE_ZONES[i][0] + (rng() - 0.5) * 0.03,
      y: FLAKE_ZONES[i][1] + (rng() - 0.5) * 0.04,
      r: 0.034 + rng() * 0.028,              // radius, fraction of H
      a0: rng() * Math.PI * 2,               // base rotation
      rate: (0.05 + rng() * 0.10) * (rng() < 0.5 ? -1 : 1) // rad/s, slow
    });
  }

  var clusters = [];
  for (var c = 0; c < 6; c++) {
    var cl = {
      x: 0.07 + (c + 0.5) / 6 * 0.86 + (rng() - 0.5) * 0.04,
      y: 0.895 + rng() * 0.055,              // inside the bottom 15%
      dashes: []
    };
    var nd = 5 + Math.floor(rng() * 4);
    for (var d = 0; d < nd; d++) {
      cl.dashes.push({
        dx: (rng() - 0.5) * 0.075,
        dy: (rng() - 0.5) * 0.045,
        len: 0.014 + rng() * 0.02,           // fraction of stage unit
        ang: (rng() - 0.5) * 0.5
      });
    }
    clusters.push(cl);
  }

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (!DPR || DPR < 1) DPR = 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw(PHASE); // deterministic frame after any resize
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  // Tapered quad between two centre points, widths at each end.
  function limb(x0, y0, x1, y1, w0, w1) {
    var dx = x1 - x0, dy = y1 - y0;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = (-dy / len), ny = (dx / len);
    ctx.beginPath();
    ctx.moveTo(x0 + nx * w0 / 2, y0 + ny * w0 / 2);
    ctx.lineTo(x1 + nx * w1 / 2, y1 + ny * w1 / 2);
    ctx.lineTo(x1 - nx * w1 / 2, y1 - ny * w1 / 2);
    ctx.lineTo(x0 - nx * w0 / 2, y0 - ny * w0 / 2);
    ctx.closePath();
    ctx.fill();
  }

  function poly(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fill();
  }

  // ---- snowflake: six stroked branches with chevron barbs, outline only ----
  function drawFlake(f, t, S) {
    var r = Math.min(f.r * H, 0.11 * W);
    var cx = Math.max(r, Math.min(W - r, f.x * W));
    var cy = Math.max(r, Math.min(H - r, f.y * H));
    var ang = f.a0 + f.rate * t;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    ctx.strokeStyle = WHITE;
    ctx.lineWidth = Math.max(1.6, 5 * S / 1080);
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (var k = 0; k < 6; k++) {
      var a = k * Math.PI / 3;
      var ca = Math.cos(a), sa = Math.sin(a);
      ctx.moveTo(0, 0);
      ctx.lineTo(ca * r, sa * r);
      for (var b = 0; b < 2; b++) {
        var bp = b === 0 ? 0.52 : 0.76;      // barb position along branch
        var bl = r * (b === 0 ? 0.34 : 0.24); // barb length
        var bx = ca * r * bp, by = sa * r * bp;
        for (var s = -1; s <= 1; s += 2) {
          var ba = a + s * Math.PI / 4.5;
          ctx.moveTo(bx, by);
          ctx.lineTo(bx - Math.cos(ba) * bl, by - Math.sin(ba) * bl);
        }
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  // ---- the invented crest: shield, tricolour bands, navy chief, star ----
  function drawCrest(cx, cy, sw) {
    var sh = sw * 1.18;
    function shieldPath() {
      ctx.beginPath();
      ctx.moveTo(cx - sw / 2, cy - sh / 2);
      ctx.lineTo(cx + sw / 2, cy - sh / 2);
      ctx.lineTo(cx + sw / 2, cy + sh * 0.06);
      ctx.quadraticCurveTo(cx + sw / 2, cy + sh * 0.34, cx, cy + sh / 2);
      ctx.quadraticCurveTo(cx - sw / 2, cy + sh * 0.34, cx - sw / 2, cy + sh * 0.06);
      ctx.closePath();
    }
    ctx.save();
    shieldPath();
    ctx.clip();
    ctx.fillStyle = FGREEN; ctx.fillRect(cx - sw / 2, cy - sh / 2, sw / 3, sh);
    ctx.fillStyle = WHITE;  ctx.fillRect(cx - sw / 6, cy - sh / 2, sw / 3, sh);
    ctx.fillStyle = FRED;   ctx.fillRect(cx + sw / 6, cy - sh / 2, sw / 3, sh);
    ctx.fillStyle = SUIT;   ctx.fillRect(cx - sw / 2, cy - sh / 2, sw, sh * 0.24);
    // small white star on the chief
    var sx = cx, sy = cy - sh * 0.38, sr = sw * 0.10;
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var rr = i % 2 === 0 ? sr : sr * 0.45;
      var aa = -Math.PI / 2 + i * Math.PI / 5;
      var px = sx + Math.cos(aa) * rr, py = sy + Math.sin(aa) * rr;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = WHITE;
    ctx.fill();
    ctx.restore();
    shieldPath();
    ctx.strokeStyle = WHITE; // white keyline: a navy outline would vanish on the navy suit
    ctx.lineWidth = Math.max(2, sw * 0.055);
    ctx.stroke();
  }

  function draw(t) {
    if (!W || !H) return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var S = Math.min(W, H);
    // Portrait stage: horizontal extents key off a centred column so
    // the portrait composition keeps its shape on wide frames.
    var U = Math.min(W, H * 0.66);
    var cx = W / 2;

    // ---- ground ----
    ctx.fillStyle = CORN;
    ctx.fillRect(0, 0, W, H);

    // ---- snowflakes (behind the figure, none near the face) ----
    for (var i = 0; i < flakes.length; i++) drawFlake(flakes[i], t, S);

    // ---- dash clusters near the ground line, bottom 15% only ----
    ctx.strokeStyle = DASHC;
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(1.6, 0.005 * H);
    for (var c = 0; c < clusters.length; c++) {
      var cl = clusters[c];
      var wave = 0.5 + 0.5 * Math.sin((t / PULSE_LOOP) * Math.PI * 2 - cl.x * 9.0);
      ctx.globalAlpha = 0.30 + 0.45 * wave;
      ctx.beginPath();
      for (var d = 0; d < cl.dashes.length; d++) {
        var dd = cl.dashes[d];
        var dxp = (cl.x + dd.dx) * W, dyp = (cl.y + dd.dy) * H;
        var dl = dd.len * U, ca = Math.cos(dd.ang), sa = Math.sin(dd.ang);
        ctx.moveTo(dxp - ca * dl / 2, dyp - sa * dl / 2);
        ctx.lineTo(dxp + ca * dl / 2, dyp + sa * dl / 2);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // ---- figure group: skater + flag, bobbing gently ----
    var bob = Math.sin((t / BOB_LOOP) * Math.PI * 2) * 0.008 * H;
    ctx.save();
    ctx.translate(0, bob);

    // Flag pole geometry (pixel space)
    var P0x = cx - 0.44 * U, P0y = 0.150 * H;
    var P1x = cx + 0.44 * U, P1y = 0.095 * H;
    var pdx = P1x - P0x, pdy = P1y - P0y;
    var pLen = Math.sqrt(pdx * pdx + pdy * pdy);
    var dirx = pdx / pLen, diry = pdy / pLen;
    var nx = -diry, ny = dirx;               // cloth normal, points down
    var clothH = 0.125 * H;
    var phase = (t / FLAG_LOOP) * Math.PI * 2;

    function clothPoint(u, v) {
      var rip = Math.sin(u * Math.PI * 3 - phase + v * 0.6) * 0.018 * H * (0.3 + 0.7 * v);
      var sway = Math.sin(u * Math.PI * 3 - phase) * 0.004 * H * v;
      return [
        P0x + dirx * (u * pLen) + nx * (v * clothH + rip) + dirx * sway,
        P0y + diry * (u * pLen) + ny * (v * clothH + rip) + diry * sway
      ];
    }

    // Flag cloth: mesh of cells, three vertical bands
    var COLS = 18, ROWS = 5;
    for (var ci = 0; ci < COLS; ci++) {
      var uc = (ci + 0.5) / COLS;
      ctx.fillStyle = uc < 1 / 3 ? FGREEN : (uc < 2 / 3 ? WHITE : FRED);
      ctx.strokeStyle = ctx.fillStyle;
      ctx.lineWidth = 1.4;
      for (var ri = 0; ri < ROWS; ri++) {
        var u0 = ci / COLS, u1 = (ci + 1) / COLS;
        var v0 = ri / ROWS, v1 = (ri + 1) / ROWS;
        var q1 = clothPoint(u0, v0), q2 = clothPoint(u1, v0);
        var q3 = clothPoint(u1, v1), q4 = clothPoint(u0, v1);
        ctx.beginPath();
        ctx.moveTo(q1[0], q1[1]);
        ctx.lineTo(q2[0], q2[1]);
        ctx.lineTo(q3[0], q3[1]);
        ctx.lineTo(q4[0], q4[1]);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
    }

    // Pole
    ctx.strokeStyle = SUIT;
    ctx.lineWidth = Math.max(2.5, 0.006 * H);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(P0x - dirx * 0.02 * pLen, P0y - diry * 0.02 * pLen);
    ctx.lineTo(P1x + dirx * 0.025 * pLen, P1y + diry * 0.025 * pLen);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(P1x + dirx * 0.025 * pLen, P1y + diry * 0.025 * pLen, Math.max(2.5, 0.007 * H), 0, Math.PI * 2);
    ctx.fillStyle = SUIT;
    ctx.fill();

    // Grip points (hands) on the pole
    var HL = [P0x + pdx * 0.30, P0y + pdy * 0.30];
    var HR = [P0x + pdx * 0.72, P0y + pdy * 0.72];

    // Legs: hips to knees to boots, foreshortened, boots large and low
    var hipL = [cx - 0.105 * U, 0.560 * H], hipR = [cx + 0.105 * U, 0.560 * H];
    var kneeL = [cx - 0.195 * U, 0.695 * H], kneeR = [cx + 0.195 * U, 0.695 * H];
    var ankL = [cx - 0.255 * U, 0.800 * H], ankR = [cx + 0.255 * U, 0.800 * H];
    ctx.fillStyle = SUIT;
    limb(hipL[0], hipL[1], kneeL[0], kneeL[1], 0.078 * U, 0.052 * U);
    limb(hipR[0], hipR[1], kneeR[0], kneeR[1], 0.078 * U, 0.052 * U);
    limb(kneeL[0], kneeL[1], ankL[0], ankL[1], 0.052 * U, 0.060 * U);
    limb(kneeR[0], kneeR[1], ankR[0], ankR[1], 0.052 * U, 0.060 * U);
    // joint discs plug the wedge gaps where limb segments meet
    ctx.beginPath(); ctx.arc(kneeL[0], kneeL[1], 0.027 * U, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(kneeR[0], kneeR[1], 0.027 * U, 0, Math.PI * 2); ctx.fill();

    // Boots: chunky shapes angled outward, pale blades beneath
    function boot(ank, sgn) {
      var bx = ank[0], by = ank[1];
      poly([
        [bx - 0.045 * U, by - 0.010 * H],
        [bx + 0.045 * U, by - 0.010 * H],
        [bx + 0.062 * U + sgn * 0.018 * U, by + 0.038 * H],
        [bx + 0.030 * U, by + 0.052 * H],
        [bx - 0.038 * U, by + 0.050 * H],
        [bx - 0.058 * U - sgn * 0.010 * U, by + 0.030 * H]
      ]);
      ctx.strokeStyle = DASHC;
      ctx.lineWidth = Math.max(2, 0.0045 * H);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(bx - 0.055 * U, by + 0.062 * H);
      ctx.lineTo(bx + 0.058 * U, by + 0.062 * H);
      ctx.stroke();
    }
    ctx.fillStyle = SUIT;
    boot(ankL, -1);
    ctx.fillStyle = SUIT;
    boot(ankR, 1);

    // Torso
    ctx.fillStyle = SUIT;
    poly([
      [cx - 0.150 * U, 0.385 * H],
      [cx + 0.150 * U, 0.385 * H],
      [cx + 0.105 * U, 0.565 * H],
      [cx - 0.105 * U, 0.565 * H]
    ]);

    // Arms: shoulders up to the grips, two tapered segments each
    var shL = [cx - 0.145 * U, 0.395 * H], shR = [cx + 0.145 * U, 0.395 * H];
    var elL = [cx - 0.265 * U, 0.255 * H], elR = [cx + 0.270 * U, 0.240 * H];
    ctx.fillStyle = SUIT;
    limb(shL[0], shL[1], elL[0], elL[1], 0.055 * U, 0.042 * U);
    limb(elL[0], elL[1], HL[0], HL[1], 0.042 * U, 0.034 * U);
    limb(shR[0], shR[1], elR[0], elR[1], 0.055 * U, 0.042 * U);
    limb(elR[0], elR[1], HR[0], HR[1], 0.042 * U, 0.034 * U);
    ctx.beginPath(); ctx.arc(elL[0], elL[1], 0.022 * U, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(elR[0], elR[1], 0.022 * U, 0, Math.PI * 2); ctx.fill();

    // Hands
    ctx.fillStyle = SKIN;
    ctx.beginPath(); ctx.arc(HL[0], HL[1], 0.017 * H, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(HR[0], HR[1], 0.017 * H, 0, Math.PI * 2); ctx.fill();

    // Neck and head: face in her grammar (arc eyes, L-nose, curve smile)
    ctx.fillStyle = SKIN;
    poly([
      [cx - 0.028 * U, 0.345 * H],
      [cx + 0.028 * U, 0.345 * H],
      [cx + 0.034 * U, 0.400 * H],
      [cx - 0.034 * U, 0.400 * H]
    ]);
    var hx = cx, hy = 0.330 * H, hr = 0.047 * H;
    ctx.beginPath();
    ctx.arc(hx, hy, hr, 0, Math.PI * 2);
    ctx.fill();
    // flat hair block: cap over the top of the head
    ctx.fillStyle = SUIT;
    ctx.beginPath();
    ctx.ellipse(hx, hy - hr * 0.12, hr * 1.02, hr * 0.86, 0, Math.PI, Math.PI * 2);
    ctx.closePath();
    ctx.fill();
    // face linework
    ctx.strokeStyle = SUIT;
    ctx.lineWidth = Math.max(1.6, 0.0045 * H);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var e = -1; e <= 1; e += 2) {
      ctx.beginPath();
      ctx.arc(hx + e * hr * 0.38, hy + hr * 0.02, hr * 0.21, Math.PI * 1.12, Math.PI * 1.88);
      ctx.stroke();
    }
    ctx.beginPath(); // L-line nose
    ctx.moveTo(hx, hy + hr * 0.05);
    ctx.lineTo(hx, hy + hr * 0.34);
    ctx.lineTo(hx + hr * 0.17, hy + hr * 0.40);
    ctx.stroke();
    ctx.beginPath(); // short-curve smile
    ctx.arc(hx, hy + hr * 0.38, hr * 0.30, Math.PI * 0.18, Math.PI * 0.82);
    ctx.stroke();

    // Crest on the chest
    drawCrest(cx, 0.472 * H, 0.10 * S);

    ctx.restore();
  }

  // ---- run: watch-only, no interaction ----
  resize();
  draw(PHASE);

  var startStamp = null;
  if (typeof requestAnimationFrame === 'function') {
    var loop = function (stamp) {
      if (startStamp === null) startStamp = stamp;
      var elapsed = (stamp - startStamp) / 1000;
      draw(PHASE + elapsed);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
