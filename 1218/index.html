<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Splice Lines</title>
<style>
  html, body { margin: 0; padding: 0; background: #050505; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- constants ----------
  var CYCLE = 47;              // seconds per loop (his Splice Lines runtime, 0:47)
  var FPS = 24;                // film frames per second; all timing is frame-quantized
  var FRAMES = CYCLE * FPS;    // 1128 frames per cycle
  var BLACK = '#050505', WHITE = '#FFFFFF', GRAY = '#8A8A8A',
      ORANGE = '#E8620C', SCRATCH = '#B0B0B0';
  // Frame one lands mid-frame on splice #10: frame 400 of cycle 0, a 3-frame
  // white flash carrying a tape mark (corner 1). T0 sits at the frame's centre
  // so floor(T0*24) === 400 exactly.
  var T0 = 400.5 / 24;         // 16.6875 s

  // ---------- seeded hashes (no Math.random anywhere) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash2(a, b) {
    var x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  // ---------- base splice schedule (one 47 s cycle, generated once) ----------
  // Clusters of 3-7 splices at 0.18-0.50 s gaps, silences of 4-11 s between.
  // Seed 7932 yields: 5 clusters, 26 splices (21 flash, 5 scratch bursts),
  // 6 tape marks. Cluster frame ranges: 51-84, 247-273, 388-419, 601-645, 888-925.
  var EVENTS = (function buildSchedule() {
    var rnd = mulberry32(7932);
    var evs = [], t = 1.2 + rnd() * 1.6;
    while (t < 43.5) {
      var n = 3 + Math.floor(rnd() * 5), i;
      for (i = 0; i < n; i++) {
        var scratch = rnd() < 0.22;
        evs.push({
          frame: Math.round(t * FPS),
          type: scratch ? 'scratch' : 'flash',
          white: 1 + Math.floor(rnd() * 3),          // 1-3 white frames
          tape: (!scratch && rnd() < 0.25),
          corner: Math.floor(rnd() * 4)              // 0 TL, 1 TR, 2 BR, 3 BL
        });
        t += 0.18 + rnd() * 0.32;
        if (t > 46.4) break;
      }
      t += 4 + rnd() * 7;
    }
    return evs;
  })();

  // ---------- visitor splices ----------
  // A completed drag stores {frame: cycle-local frame, x, y, bornCycle, immFrame}.
  // It fires IMMEDIATELY (flash + mark + number at the point, 2 frames), then is
  // absorbed into the rhythm: it re-fires at the same cycle-local frame in every
  // later cycle. Cap 64, oldest dropped.
  var visitors = [];

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, isPhone = false;

  function fit() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    var sw = (window.screen && window.screen.width) || w;
    var sh = (window.screen && window.screen.height) || h;
    isPhone = (Math.min(sw, sh) < 700) || (h > w * 1.15);
  }

  // ---------- drawing helpers ----------
  function frameNum(tAbs) {
    var s = String(Math.floor(tAbs * FPS));
    while (s.length < 4) s = '0' + s;
    return s;
  }

  function drawTapeBand(cx, cy, ang, len, wid) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ang);
    ctx.fillStyle = ORANGE;
    ctx.globalAlpha = 0.92;
    ctx.fillRect(-len / 2, -wid / 2, len, wid);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // Tape mark for a base splice: diagonal band across one corner + splice line.
  function drawTapeMark(corner, nx, ny) {
    var m = Math.min(W, H), len = m * 0.42, wid = Math.max(14, m * 0.032);
    var inset = len * 0.30;
    if (corner === 0) drawTapeBand(inset, inset, Math.PI / 4, len, wid);
    else if (corner === 1) drawTapeBand(W - inset, inset, -Math.PI / 4, len, wid);
    else if (corner === 2) drawTapeBand(W - inset, H - inset, Math.PI / 4, len, wid);
    else drawTapeBand(inset, H - inset, -Math.PI / 4, len, wid);
    // small orange splice line under the frame number
    ctx.fillStyle = ORANGE;
    ctx.globalAlpha = 0.95;
    var lw = W * 0.22;
    ctx.fillRect(nx - lw / 2, ny + (isPhone ? 22 : 30), lw, 3);
    ctx.globalAlpha = 1;
  }

  function drawNumber(text, x, y) {
    ctx.fillStyle = GRAY;
    ctx.font = (isPhone ? 20 : 30) + 'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
    ctx.textAlign = 'left';
  }

  function drawAmbientScratches(tAbs) {
    var i, x, a;
    ctx.lineWidth = 1;
    for (i = 0; i < 8; i++) {
      var base = hash2(i, 7) * (W + 80);
      var speed = 0.5 + 1.5 * hash2(i, 13);
      var dir = hash2(i, 21) > 0.5 ? 1 : -1;
      x = ((base + dir * speed * tAbs) % (W + 80) + (W + 80)) % (W + 80) - 40;
      var tilt = (hash2(i, 31) - 0.5) * 0.05 * H;
      a = 0.08 + 0.26 * (0.5 + 0.5 * Math.sin(tAbs * 0.13 * (1 + hash2(i, 41)) + i * 2.3));
      ctx.strokeStyle = SCRATCH;
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.moveTo(x - tilt / 2, -4);
      ctx.lineTo(x + tilt / 2, H + 4);
      ctx.stroke();
    }
    // sparse dust specks, re-hashed in slow steps
    var step = Math.floor(tAbs * 1.4);
    ctx.fillStyle = SCRATCH;
    for (i = 0; i < 12; i++) {
      if (hash2(step, i * 3 + 1) < 0.45) continue;
      ctx.globalAlpha = 0.22;
      ctx.fillRect(hash2(step * 7 + i, 3) * W, hash2(step * 13 + i, 5) * H, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  function drawScratchBurst(evFrame, k) { // k = frame offset inside the burst (0..2)
    ctx.lineWidth = 1;
    ctx.strokeStyle = SCRATCH;
    var i, x;
    for (i = 0; i < 44; i++) {
      x = hash2(i * 3 + k * 57, evFrame) * W;
      ctx.globalAlpha = 0.25 + 0.55 * hash2(i, evFrame * 7 + k);
      var tilt = (hash2(i, evFrame + k) - 0.5) * 0.09 * H;
      ctx.beginPath();
      ctx.moveTo(x - tilt / 2, -4);
      ctx.lineTo(x + tilt / 2, H + 4);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- main draw ----------
  var lastT = T0;

  function draw(tAbs) {
    lastT = tAbs;
    fit();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var cyc = Math.floor(tAbs / CYCLE);
    var local = tAbs - cyc * CYCLE;
    var F = Math.floor(local * FPS);       // frame index within the cycle
    var gF = Math.floor(tAbs * FPS);       // global frame index

    // black leader
    ctx.fillStyle = BLACK;
    ctx.fillRect(0, 0, W, H);

    // --- base events ---
    var burst = null, flash = false, i, e;
    for (i = 0; i < EVENTS.length; i++) {
      e = EVENTS[i];
      if (e.type === 'flash') {
        if (F >= e.frame && F < e.frame + e.white) flash = true;
      } else if (F >= e.frame && F < e.frame + 3) {
        burst = e;
      }
    }
    // --- visitor events ---
    var vFlash = false;
    for (i = 0; i < visitors.length; i++) {
      var v = visitors[i];
      if (gF >= v.immFrame && gF < v.immFrame + 2) vFlash = true;
      else if (cyc > v.bornCycle && F >= v.frame && F < v.frame + 2) vFlash = true;
    }

    if (burst && !flash && !vFlash) {
      drawScratchBurst(burst.frame, F - burst.frame);
      return;
    }
    if (!flash && !vFlash) {
      drawAmbientScratches(tAbs);
      return;
    }

    // --- a cut: white flash frame ---
    ctx.fillStyle = WHITE;
    ctx.fillRect(0, 0, W, H);

    // number + tape only on a splice's FIRST white frame
    for (i = 0; i < EVENTS.length; i++) {
      e = EVENTS[i];
      if (e.type === 'flash' && F === e.frame) {
        var nx = W * (0.38 + 0.24 * hash2(i, 101));
        var ny = H * (0.42 + 0.16 * hash2(i, 103));
        drawNumber(frameNum(tAbs), nx, ny);
        if (e.tape) drawTapeMark(e.corner, nx, ny);
      }
    }
    // visitor splice marks at their points, on their first frame
    for (i = 0; i < visitors.length; i++) {
      var vv2 = visitors[i];
      var first = (gF === vv2.immFrame) || (cyc > vv2.bornCycle && F === vv2.frame);
      if (first) {
        drawNumber(frameNum(tAbs), vv2.x, Math.max(24, vv2.y - 26));
        drawTapeBand(vv2.x, vv2.y, -0.42, 96, 13);
      }
    }
  }

  // ---------- pointer: drag adds a cut ----------
  var dragging = false, dragX = 0, dragY = 0;
  function addVisitor(x, y) {
    var cyc = Math.floor(lastT / CYCLE);
    var local = lastT - cyc * CYCLE;
    visitors.push({
      frame: Math.floor(local * FPS),
      x: x, y: y,
      bornCycle: cyc,
      immFrame: Math.floor(lastT * FPS)
    });
    while (visitors.length > 64) visitors.shift();
    draw(lastT); // the flash lands the moment the drag completes
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (ev) { dragging = true; dragX = ev.clientX; dragY = ev.clientY; });
    canvas.addEventListener('pointermove', function (ev) { if (dragging) { dragX = ev.clientX; dragY = ev.clientY; } });
    canvas.addEventListener('pointerup', function (ev) {
      if (!dragging) return;
      dragging = false;
      addVisitor((typeof ev.clientX === 'number') ? ev.clientX : dragX,
                 (typeof ev.clientY === 'number') ? ev.clientY : dragY);
    });
    canvas.addEventListener('pointercancel', function () { dragging = false; });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointerup', function () { dragging = false; });
    window.addEventListener('resize', function () { draw(lastT); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { draw(lastT); });
    }
  }

  // ---------- first frame at fixed phase, then rAF anchored ----------
  draw(T0);
  if (typeof requestAnimationFrame !== 'undefined') {
    var startTs = null;
    var loop = function (ts) {
      if (startTs === null) startTs = ts;
      draw(T0 + (ts - startTs) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
