<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Single Scale Cannot Show It</title>
<style>
html, body { margin: 0; padding: 0; background: #F2EDE4; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = [242, 237, 228];
var INK = [28, 28, 30];
var WASH = [154, 160, 166];
var CORAL = [232, 115, 74];
var GOLD = [201, 162, 39];
var PHASE = 20.0;
var MORPH_S = 3.0;
var SEED = 1602003;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
function lerp(a, b, k) { return a + (b - a) * k; }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}

/* ---- mask shapes: 0 rectangle, 1 square, 2 circle ---- */
var SHAPES = [
  { w: 1.28, h: 0.84, r: 0.05 },
  { w: 1.00, h: 1.00, r: 0.05 },
  { w: 1.00, h: 1.00, r: 0.50 }
];
var morphFrom = 0, morphTo = 0, morphStart = PHASE;
function maskParams(t) {
  var k = smooth((t - morphStart) / MORPH_S);
  var a = SHAPES[morphFrom], b = SHAPES[morphTo];
  return {
    w: lerp(a.w, b.w, k),
    h: lerp(a.h, b.h, k),
    r: lerp(a.r, b.r, k),
    k: k
  };
}
function maskPath(cx, cy, w, h, r) {
  var x0 = cx - w / 2, y0 = cy - h / 2;
  var rr = Math.min(r * Math.min(w, h), w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x0 + rr, y0);
  ctx.lineTo(x0 + w - rr, y0);
  ctx.arc(x0 + w - rr, y0 + rr, rr, -Math.PI / 2, 0);
  ctx.lineTo(x0 + w, y0 + h - rr);
  ctx.arc(x0 + w - rr, y0 + h - rr, rr, 0, Math.PI / 2);
  ctx.lineTo(x0 + rr, y0 + h);
  ctx.arc(x0 + rr, y0 + h - rr, rr, Math.PI / 2, Math.PI);
  ctx.lineTo(x0, y0 + rr);
  ctx.arc(x0 + rr, y0 + rr, rr, Math.PI, Math.PI * 1.5);
  ctx.closePath();
}

/* ---- seeded content: one work, three frames ---- */
var washBlobs = (function () {
  var rng = mulberry32(SEED);
  var out = [], i;
  for (i = 0; i < 52; i++) {
    out.push({
      x: 0.06 + rng() * 0.88, y: 0.06 + rng() * 0.88,
      r: 0.05 + rng() * 0.16,
      a: 0.05 + rng() * 0.08,
      ph: rng() * TAU,
      sp: 0.10 + rng() * 0.16
    });
  }
  return out;
})();
/* faint cloud texture, an old master's clouds sampled into the wash */
var clouds = (function () {
  var rng = mulberry32(SEED + 31);
  var out = [], i, j;
  for (i = 0; i < 9; i++) {
    var cx = 0.12 + rng() * 0.76, cy = 0.14 + rng() * 0.72;
    var puffs = 3 + Math.floor(rng() * 3);
    for (j = 0; j < puffs; j++) {
      out.push({
        x: clamp(cx + (rng() - 0.5) * 0.22, 0.02, 0.98),
        y: clamp(cy + (rng() - 0.5) * 0.10, 0.02, 0.98),
        rx: 0.04 + rng() * 0.09, ry: 0.015 + rng() * 0.03,
        a: 0.05 + rng() * 0.03,
        ph: rng() * TAU
      });
    }
  }
  return out;
})();
var inkStrokes = (function () {
  var rng = mulberry32(SEED + 57);
  var out = [], i, j;
  for (i = 0; i < 9; i++) {
    var pts = [];
    var x = 0.10 + rng() * 0.80, y = 0.10 + rng() * 0.80;
    var ang = rng() * TAU;
    var n = 5 + Math.floor(rng() * 4);
    for (j = 0; j < n; j++) {
      pts.push({ x: x, y: y });
      ang += (rng() - 0.5) * 1.1;
      var step = 0.05 + rng() * 0.07;
      x = clamp(x + Math.cos(ang) * step, 0.03, 0.97);
      y = clamp(y + Math.sin(ang) * step, 0.03, 0.97);
    }
    out.push({
      pts: pts,
      w: 0.0035 + rng() * 0.006,
      a: 0.55 + rng() * 0.35
    });
  }
  return out;
})();
/* the one coral stroke, rising like a signal */
var coralStroke = (function () {
  var rng = mulberry32(SEED + 83);
  var pts = [];
  var x = 0.16 + rng() * 0.08, y = 0.86;
  var i;
  for (i = 0; i < 7; i++) {
    pts.push({ x: x, y: y });
    x += 0.10 + rng() * 0.04;
    y -= 0.10 + rng() * 0.03;
  }
  return pts;
})();
var goldThreads = (function () {
  var rng = mulberry32(SEED + 109);
  var out = [], i;
  for (i = 0; i < 7; i++) {
    var x1 = rng(), y1 = rng();
    var ang = rng() * TAU;
    var len = 0.25 + rng() * 0.45;
    out.push({
      x1: x1, y1: y1,
      x2: clamp(x1 + Math.cos(ang) * len, 0.02, 0.98),
      y2: clamp(y1 + Math.sin(ang) * len, 0.02, 0.98),
      a: 0.45 + rng() * 0.35
    });
  }
  return out;
})();

function dot(x, y, r) {
  ctx.moveTo(x + r, y);
  ctx.arc(x, y, r, 0, TAU);
}
function ellipseDot(x, y, rx, ry) {
  ctx.moveTo(x + rx, y);
  ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
}
function drawWork(bx, by, bw, bh, t) {
  var i, p;
  var breath = 1 + 0.03 * Math.sin(t * 0.22 + 1.3);
  var settle = 0.5 + 0.5 * Math.sin(t * 0.11);
  /* wash layer, breathing slowly */
  for (i = 0; i < washBlobs.length; i++) {
    var b = washBlobs[i];
    var br = b.r * bw * breath * (1 + 0.06 * Math.sin(t * b.sp + b.ph));
    ctx.fillStyle = rgba(WASH, b.a * (0.9 + 0.1 * settle));
    ctx.beginPath();
    dot(bx + b.x * bw, by + b.y * bh, br);
    ctx.fill();
  }
  /* hidden cloud texture, faint in the wash */
  for (i = 0; i < clouds.length; i++) {
    var c = clouds[i];
    ctx.fillStyle = rgba(INK, 0.08 * (0.85 + 0.15 * Math.sin(t * 0.09 + c.ph)));
    ctx.beginPath();
    ellipseDot(bx + c.x * bw, by + c.y * bh, c.rx * bw, c.ry * bh);
    ctx.fill();
  }
  /* ink gestures */
  for (i = 0; i < inkStrokes.length; i++) {
    var s = inkStrokes[i];
    ctx.strokeStyle = rgba(INK, s.a);
    ctx.lineWidth = Math.max(1, s.w * bw);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bx + s.pts[0].x * bw, by + s.pts[0].y * bh);
    for (p = 1; p < s.pts.length; p++) {
      ctx.lineTo(bx + s.pts[p].x * bw, by + s.pts[p].y * bh);
    }
    ctx.stroke();
  }
  /* gold thread-lines */
  for (i = 0; i < goldThreads.length; i++) {
    var g = goldThreads[i];
    ctx.strokeStyle = rgba(GOLD, g.a);
    ctx.lineWidth = Math.max(0.8, 0.0016 * bw);
    ctx.beginPath();
    ctx.moveTo(bx + g.x1 * bw, by + g.y1 * bh);
    ctx.lineTo(bx + g.x2 * bw, by + g.y2 * bh);
    ctx.stroke();
  }
  /* the coral stroke */
  ctx.strokeStyle = rgba(CORAL, 0.92);
  ctx.lineWidth = Math.max(2, 0.016 * bw);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(bx + coralStroke[0].x * bw, by + coralStroke[0].y * bh);
  for (i = 1; i < coralStroke.length; i++) {
    ctx.lineTo(bx + coralStroke[i].x * bw, by + coralStroke[i].y * bh);
  }
  ctx.stroke();
}

function draw(t) {
  lastT = t;
  size();
  ctx.fillStyle = 'rgb(' + PAPER[0] + ',' + PAPER[1] + ',' + PAPER[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  var s = Math.min(VW, VH) * 0.80;
  /* widest shape (the rectangle) must fit with margins on any screen */
  s = Math.min(s, VW * 0.92 / 1.28, VH * 0.95 / 0.84);
  var cx = VW / 2, cy = VH / 2;
  var mp = maskParams(t);
  var w = mp.w * s, h = mp.h * s;
  var bx = cx - w / 2, by = cy - h / 2;
  /* soft paper edge of the work */
  ctx.save();
  maskPath(cx, cy, w, h, mp.r);
  ctx.fillStyle = rgba(PAPER, 1);
  ctx.fill();
  ctx.clip();
  drawWork(bx, by, w, h, t);
  ctx.restore();
  /* wash bleed edge around the mask */
  ctx.save();
  maskPath(cx, cy, w, h, mp.r);
  ctx.strokeStyle = rgba(WASH, 0.28);
  ctx.lineWidth = Math.max(1, 0.004 * s);
  ctx.stroke();
  ctx.restore();
  var titlePx = isPhone ? 15 : 17;
  var smallPx = isPhone ? 11 : 12;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = rgba(INK, 0.75);
  ctx.fillText('A Single Scale Cannot Show It', VW / 2, Math.max(8, VH * 0.02));
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK, 0.5);
  ctx.fillText('2006 · 06 · 01', VW / 2, Math.max(8, VH * 0.02) + titlePx + 5);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK, 0.55);
  ctx.fillText('Press 1, 2, 3 to reshape.', VW / 2, VH - smallPx - 12);
}
function reshape(n, t) {
  if (n === morphTo && (t - morphStart) >= MORPH_S) return;
  var cur = maskParams(t);
  /* freeze the current interpolated shape as the morph origin */
  SHAPES[3] = { w: cur.w, h: cur.h, r: cur.r };
  morphFrom = 3;
  morphTo = n;
  morphStart = t;
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) {
    window.addEventListener('resize', size);
    window.addEventListener('keydown', function (e) {
      if (e.key === '1') reshape(0, lastT);
      else if (e.key === '2') reshape(1, lastT);
      else if (e.key === '3') reshape(2, lastT);
    });
  }
}
if (typeof window !== 'undefined') {
  window.__scale1602 = { draw: draw, maskParams: maskParams, washBlobs: washBlobs, inkStrokes: inkStrokes, coralStroke: coralStroke, goldThreads: goldThreads };
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
