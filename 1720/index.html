<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Milliseconds of Wind</title>
<style>
html, body { margin: 0; padding: 0; background: #0A120C; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0A120C';
var IVORY = '#F2EFE6';
var GREEN_TINT = '#BFE3C8';
var PLATE = '#0E1A12';
var PLATE_LINE = 'rgba(242,239,230,0.35)';
var TITLE_INK = '#F2EFE6';
var HINT_INK = '#9FD0A8';
var PERIOD = 24;
var FRAME_T = 3.0;
var STREAMLINES = 950;
var STEPS = 260;
var SLICE_LEN = 240;
var LINE_ALPHA = 10 / 255;
var GREEN_ALPHA = 10 / 255;
var REPLOT_SECONDS = 2.5;
var AUTO_ADVANCE_SECONDS = 8;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var tapCount = 0;
var sliceSeed = 1720;
var sliceOffset = 0;
var slice = [];
var lines = [];
var progress = 1;
var dirty = false;
var clockT = 0;
var lastAdvance = 0;
/* ---- 5ms slice of pink noise (Kellet filter), seeded, smoothed, normalized ---- */
function makeSlice(seed) {
  var rng = mulberry32(seed);
  var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
  var raw = new Float32Array(SLICE_LEN);
  var i, white;
  for (i = 0; i < SLICE_LEN; i++) {
    white = rng() * 2 - 1;
    b0 = 0.99886 * b0 + white * 0.0555179;
    b1 = 0.99332 * b1 + white * 0.0750759;
    b2 = 0.96900 * b2 + white * 0.1538520;
    b3 = 0.86650 * b3 + white * 0.3104856;
    b4 = 0.55000 * b4 + white * 0.5329522;
    b5 = -0.7616 * b5 - white * 0.0168980;
    raw[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
    b6 = white * 0.115926;
  }
  var sm = new Float32Array(SLICE_LEN);
  var maxAbs = 0;
  for (i = 0; i < SLICE_LEN; i++) {
    var s = 0;
    var k;
    for (k = -2; k <= 2; k++) s += raw[(i + k + SLICE_LEN) % SLICE_LEN];
    sm[i] = s / 5;
    if (Math.abs(sm[i]) > maxAbs) maxAbs = Math.abs(sm[i]);
  }
  var out = [];
  for (i = 0; i < SLICE_LEN; i++) out.push(maxAbs > 0 ? sm[i] / maxAbs : 0);
  return out;
}
function gauss(u, v, cx, cy, sx, sy) {
  var dx = (u - cx) / sx, dy = (v - cy) / sy;
  return Math.exp(-(dx * dx + dy * dy));
}
/* ---- wind angle at stage coords (u, v): slice-driven curl, calm top-left ---- */
function angleAt(u, v) {
  var idx = (Math.floor(u * (SLICE_LEN - 1)) + sliceOffset) % SLICE_LEN;
  var s = slice[idx];
  var mass = gauss(u, v, 0.68, 0.55, 0.16, 0.20);
  var calm = gauss(u, v, 0.12, 0.14, 0.18, 0.18);
  var curlAmp = (0.25 + 1.15 * mass) * (1 - 0.8 * calm);
  var base = 0.06 * Math.PI;
  return base + curlAmp * (0.8 * Math.sin(TAU * (2.3 * u + 1.1 * v) + 1.7 * s) + 0.6 * s);
}
function densityAt(u, v) {
  var mass = gauss(u, v, 0.68, 0.55, 0.16, 0.20);
  var calm = gauss(u, v, 0.12, 0.14, 0.18, 0.18);
  return clamp(0.35 + 0.75 * mass - 0.25 * calm, 0.05, 1);
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: square on desktop, full-bleed on phones (field-like composition) ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- integrate the streamlines through the current slice ---- */
function buildField() {
  slice = makeSlice(sliceSeed);
  var st = stageRect();
  var rng = mulberry32(sliceSeed);
  var stepLen = Math.min(st.w, st.h) / 360;
  lines = [];
  var guard = 0;
  while (lines.length < STREAMLINES && guard < STREAMLINES * 40) {
    guard++;
    var u = rng(), v = rng();
    if (rng() > densityAt(u, v)) continue;
    var pts = new Float32Array((STEPS + 1) * 2);
    var x = st.x + u * st.w, y = st.y + v * st.h;
    pts[0] = x; pts[1] = y;
    var n = 1, i;
    for (i = 0; i < STEPS; i++) {
      var uu = (x - st.x) / st.w, vv = (y - st.y) / st.h;
      if (uu < 0 || uu > 1 || vv < 0 || vv > 1) break;
      var a = angleAt(uu, vv);
      x += Math.cos(a) * stepLen;
      y += Math.sin(a) * stepLen;
      pts[n * 2] = x; pts[n * 2 + 1] = y;
      n++;
    }
    if (n < 20) continue;
    lines.push({ pts: pts, n: n, green: gauss(u, v, 0.68, 0.55, 0.16, 0.20) > 0.55 });
  }
}
function drawField(st) {
  /* faint green tint in the densest knots */
  var kx = st.x + 0.68 * st.w, ky = st.y + 0.55 * st.h;
  var kr = 0.30 * Math.min(st.w, st.h);
  var g = ctx.createRadialGradient(kx, ky, 0, kx, ky, kr);
  g.addColorStop(0, 'rgba(110,190,130,0.10)');
  g.addColorStop(1, 'rgba(110,190,130,0)');
  ctx.fillStyle = g;
  ctx.fillRect(st.x, st.y, st.w, st.h);
  var kx2 = st.x + 0.80 * st.w, ky2 = st.y + 0.32 * st.h;
  var g2 = ctx.createRadialGradient(kx2, ky2, 0, kx2, ky2, kr * 0.6);
  g2.addColorStop(0, 'rgba(110,190,130,0.06)');
  g2.addColorStop(1, 'rgba(110,190,130,0)');
  ctx.fillStyle = g2;
  ctx.fillRect(st.x, st.y, st.w, st.h);
  /* streamlines, drawn up to the re-plot progress, batched by color */
  var li, j, segCount;
  ctx.lineWidth = 1.25;
  ctx.beginPath();
  for (li = 0; li < lines.length; li++) {
    if (lines[li].green) continue;
    segCount = Math.floor(progress * (lines[li].n - 1));
    if (segCount < 1) continue;
    ctx.moveTo(lines[li].pts[0], lines[li].pts[1]);
    for (j = 1; j <= segCount; j++) ctx.lineTo(lines[li].pts[j * 2], lines[li].pts[j * 2 + 1]);
  }
  ctx.strokeStyle = rgba(IVORY, LINE_ALPHA);
  ctx.stroke();
  ctx.beginPath();
  for (li = 0; li < lines.length; li++) {
    if (!lines[li].green) continue;
    segCount = Math.floor(progress * (lines[li].n - 1));
    if (segCount < 1) continue;
    ctx.moveTo(lines[li].pts[0], lines[li].pts[1]);
    for (j = 1; j <= segCount; j++) ctx.lineTo(lines[li].pts[j * 2], lines[li].pts[j * 2 + 1]);
  }
  ctx.strokeStyle = rgba(GREEN_TINT, GREEN_ALPHA);
  ctx.stroke();
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  ctx.save();
  ctx.beginPath();
  ctx.rect(st.x, st.y, st.w, st.h);
  ctx.clip();
  drawField(st);
  ctx.restore();
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Five Milliseconds of Wind').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Five Milliseconds of Wind').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 27').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Five Milliseconds of Wind', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 27', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Tap for a new slice.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function newSlice() {
  tapCount++;
  sliceSeed = 1720 + tapCount * 7919;
  sliceOffset = 0;
  buildField();
  progress = reduced ? 1 : 0;
  lastAdvance = clockT;
  dirty = true;
}
function onDown(e) {
  newSlice();
  if (e.preventDefault) e.preventDefault();
}
function onResize() {
  size();
  buildField();
  progress = 1;
  dirty = true;
  draw();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    streamlineCount: function () { return lines.length; },
    sliceOffset: function () { return sliceOffset; },
    phaseT: function () { return phaseT; },
    tap: function () { newSlice(); draw(); }
  };
  canvas.addEventListener('pointerdown', onDown);
}
/* ---- frame one: fixed phase t = 3.0s of a 24s period, full field plotted ---- */
size();
buildField();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', onResize);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', onResize);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      if (progress < 1) {
        progress = Math.min(1, progress + dt / REPLOT_SECONDS);
        dirty = true;
      } else if (!reduced && clockT - lastAdvance > AUTO_ADVANCE_SECONDS) {
        sliceOffset = (sliceOffset + 7) % SLICE_LEN;
        buildField();
        progress = 0;
        lastAdvance = clockT;
        dirty = true;
      }
      if (dirty) {
        draw();
        if (progress >= 1) dirty = false;
      }
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
