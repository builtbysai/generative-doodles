<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Blue Garden</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#232B8F; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  // Palette: exactly the four colors of the brief, flat fills only.
  var NAVY  = '#232B8F';  // deep blue water and page ground
  var PERI  = '#7C86E8';  // periwinkle fish, dots and vase accents
  var CORAL = '#E14E2B';  // orange-red coral and flowers
  var CREAM = '#F5EEDC';  // arch frames, mullions and checker strip

  var LOOP = 24;      // seconds; every motion period below divides it
  var FIXED_T = 11;   // constant first-frame loop phase, in seconds

  // Seeded RNG (mulberry32). All scene tables are built from the seed
  // alone, so any loop time renders identically on any load.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- Scene tables for up to five arches. Layout chooses how many
  // arches are shown for the current aspect; the tables never change.
  var MAX_ARCHES = 5;
  var arches = [];

  // Recursive coral, generated once into a segment list in normalized
  // arch coordinates (x: 0..1 across the inner arch, y: 0..1 from its
  // top to its floor). Tips are collected for the dot-tip details.
  function genCoral(rng, startY) {
    var segs = [];
    var tips = [];
    // The x step is amplified (factor 2.0) because the arch is far
    // taller than wide: without it, branches that spread in normalized
    // coordinates collapse into near-vertical reeds in pixel space.
    function branch(x, y, ang, len, depth, wid) {
      var x2 = x + Math.sin(ang) * len * 2.0;
      var y2 = y - Math.cos(ang) * len;
      segs.push({ x1: x, y1: y, x2: x2, y2: y2, depth: depth, wid: wid });
      if (depth <= 0 || len < 0.030) {
        tips.push({ x: x2, y: y2, big: rng() < 0.34, alt: rng() < 0.5 });
        return;
      }
      var spread = 0.42 + rng() * 0.33;
      var a1 = ang - spread * (0.75 + rng() * 0.5);
      var a2 = ang + spread * (0.75 + rng() * 0.5);
      // Steer branches back toward the middle when they drift wide.
      if (x2 < 0.16) a1 = Math.abs(a1) * 0.5;
      if (x2 > 0.84) a2 = -Math.abs(a2) * 0.5;
      branch(x2, y2, a1, len * (0.72 + rng() * 0.13), depth - 1, wid * 0.80);
      branch(x2, y2, a2, len * (0.72 + rng() * 0.13), depth - 1, wid * 0.80);
    }
    branch(0.5, startY, (rng() * 2 - 1) * 0.08, 0.125 + rng() * 0.025, 5, 1);
    return { segs: segs, tips: tips, startY: startY };
  }

  function buildArches() {
    arches = [];
    for (var a = 0; a < MAX_ARCHES; a++) {
      var rng = mulberry32(482 * 1000 + a * 977 + 41);
      var type = a % 3; // 0: bare coral, 1: cream vase, 2: periwinkle vase
      var coral = genCoral(rng, type === 0 ? 0.985 : 0.80);

      var fishCount = 2 + Math.floor(rng() * 3); // exactly 2, 3 or 4
      // Fish are assigned to stratified lanes: the crossing positions
      // and the depths are each shuffled slot orders, so no two fish
      // in an arch share a lane and none overlap at the first frame.
      var uSlots = [], ySlots = [], si;
      for (si = 0; si < fishCount; si++) { uSlots.push(si); ySlots.push(si); }
      for (si = fishCount - 1; si > 0; si--) {
        var sj = Math.floor(rng() * (si + 1));
        var st = uSlots[si]; uSlots[si] = uSlots[sj]; uSlots[sj] = st;
        sj = Math.floor(rng() * (si + 1));
        st = ySlots[si]; ySlots[si] = ySlots[sj]; ySlots[sj] = st;
      }
      var fish = [];
      for (var f = 0; f < fishCount; f++) {
        var dir = rng() < 0.5 ? -1 : 1;
        var per = rng() < 0.5 ? 24 : 12;           // divides LOOP
        // The phase is back-solved from the fish's seeded lane
        // position in the middle of the arch, so at the constant
        // first frame (t = 11s) every fish is fully inside its
        // arch, mid crossing, in its own lane.
        var lenF = 0.30 + rng() * 0.16;            // fraction of inner width
        // Safe crossing window for this fish's length: outside it the
        // fish would poke past an arch edge at the first frame.
        var uMin = 1.15 * lenF / (1 + 1.3 * lenF) + 0.015;
        var wantU = uMin + ((uSlots[f] + 0.5) / fishCount) * (1 - 2 * uMin) + (rng() * 2 - 1) * 0.01;
        if (wantU < uMin) wantU = uMin;
        if (wantU > 1 - uMin) wantU = 1 - uMin;
        var ph = ((wantU - FIXED_T / per) % 1 + 1) % 1;
        fish.push({
          dir: dir,
          baseY: 0.14 + ((ySlots[f] + 0.5) / fishCount) * 0.38 + (rng() * 2 - 1) * 0.015,
          phase: ph,                               // loop phase offset
          period: per,
          lenF: lenF,
          bobPh: rng() * Math.PI * 2,
          wagPh: rng() * Math.PI * 2,
          kind: Math.floor(rng() * 3)              // 0 peri, 1 cream, 2 coral
        });
      }

      var dots = [];
      var dotCount = 14 + Math.floor(rng() * 6);
      for (var d = 0; d < dotCount; d++) {
        dots.push({
          x: 0.07 + rng() * 0.86,
          y: 0.06 + rng() * 0.88,
          rF: 0.010 + rng() * 0.014,               // fraction of inner width
          ph: rng() * Math.PI * 2,
          kind: Math.floor(rng() * 3)              // 0 peri, 1 cream, 2 coral
        });
      }

      arches.push({
        type: type,
        coral: coral,
        fish: fish,
        dots: dots,
        swayPh: rng() * Math.PI * 2
      });
    }
  }

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
  }

  // Arch path: a rectangle with a semicircular top. x, y is the top
  // left of the bounding box; the semicircle radius is w / 2.
  function archPath(x, y, w, bottom) {
    ctx.beginPath();
    ctx.moveTo(x, bottom);
    ctx.lineTo(x, y + w / 2);
    ctx.arc(x + w / 2, y + w / 2, w / 2, Math.PI, 0);
    ctx.lineTo(x + w, bottom);
    ctx.closePath();
  }

  // One striped fish in local coordinates, nose toward +x, then the
  // caller flips it for leftward swimmers. Stripes are clipped to the
  // body ellipse; the tail is a triangle wagged around its joint.
  function drawFish(f, cx, cy, len, t) {
    var hei = len * 0.42;
    var wag = Math.sin((t / 2) * Math.PI * 2 + f.wagPh); // 2s wag period
    var bodyCol = f.kind === 0 ? PERI : (f.kind === 1 ? CREAM : CORAL);
    var stripeCol = f.kind === 1 ? NAVY : CREAM;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(f.dir, 1);
    ctx.rotate(wag * 0.05);
    // Tail: triangle behind the body, wagging on its joint.
    ctx.save();
    ctx.translate(-len * 0.40, 0);
    ctx.rotate(wag * 0.28);
    ctx.fillStyle = bodyCol;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-len * 0.24, -hei * 0.52);
    ctx.lineTo(-len * 0.24, hei * 0.52);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    // Body.
    ctx.fillStyle = bodyCol;
    ctx.beginPath();
    ctx.ellipse(0, 0, len / 2, hei / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    // Stripes, clipped inside the body silhouette.
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, 0, len / 2, hei / 2, 0, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = stripeCol;
    var sx = [-0.16, 0.04, 0.24];
    for (var i = 0; i < sx.length; i++) {
      ctx.fillRect(sx[i] * len - len * 0.035, -hei / 2, len * 0.07, hei);
    }
    ctx.restore();
    // Eye.
    ctx.fillStyle = NAVY;
    ctx.beginPath();
    ctx.arc(len * 0.32, -hei * 0.10, Math.max(1.2, hei * 0.09), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // The vase for arch types 1 and 2: a flat ceremonial vessel centered
  // on the arch floor, with a cream band and a row of navy dots.
  function drawVase(type, ix, iy, iw, ih, vh) {
    // Height is tied to the arch width (capped against its height),
    // so the vessel keeps a squat ceremonial profile on tall phones.
    var vw = iw * 0.56;
    var cx = ix + iw / 2;
    var base = iy + ih;
    var top = base - vh;
    ctx.fillStyle = type === 1 ? CREAM : PERI;
    ctx.beginPath();
    ctx.moveTo(cx - vw * 0.20, top);
    ctx.lineTo(cx + vw * 0.20, top);
    ctx.quadraticCurveTo(cx + vw * 0.52, top + vh * 0.34, cx + vw * 0.40, base - vh * 0.10);
    ctx.quadraticCurveTo(cx + vw * 0.36, base, cx + vw * 0.26, base);
    ctx.lineTo(cx - vw * 0.26, base);
    ctx.quadraticCurveTo(cx - vw * 0.36, base, cx - vw * 0.40, base - vh * 0.10);
    ctx.quadraticCurveTo(cx - vw * 0.52, top + vh * 0.34, cx - vw * 0.20, top);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = type === 1 ? CORAL : CREAM;
    ctx.fillRect(cx - vw * 0.205, top + vh * 0.10, vw * 0.41, vh * 0.13);
    ctx.fillStyle = NAVY;
    for (var i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.arc(cx + i * vw * 0.20, top + vh * 0.58, Math.max(1.4, vw * 0.045), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawArch(a, ox, oy, ow, ob, frame, t) {
    var ix = ox + frame, iy = oy + frame;
    var iw = ow - frame * 2, ih = (ob - frame) - iy;

    // Cream frame, then the deep blue water inside it.
    ctx.fillStyle = CREAM;
    archPath(ox, oy, ow, ob);
    ctx.fill();
    ctx.fillStyle = NAVY;
    archPath(ix, iy, iw, ob - frame);
    ctx.fill();

    // Everything inside lives clipped to the inner arch.
    ctx.save();
    archPath(ix, iy, iw, ob - frame);
    ctx.clip();

    // Scattered dots, pulsing faintly on a 6s period.
    for (var d = 0; d < a.dots.length; d++) {
      var dot = a.dots[d];
      var pulse = 0.78 + 0.30 * (0.5 + 0.5 * Math.sin((t / 6) * Math.PI * 2 + dot.ph));
      ctx.fillStyle = dot.kind === 0 ? PERI : (dot.kind === 1 ? CREAM : CORAL);
      ctx.beginPath();
      ctx.arc(ix + dot.x * iw, iy + dot.y * ih, Math.max(1, dot.rF * iw * pulse), 0, Math.PI * 2);
      ctx.fill();
    }

    // The one central botanical form: vase first (behind the stems),
    // then the recursive coral swaying almost imperceptibly on a 12s
    // period around its base. The coral table is translated so its
    // roots sit at the arch floor, or just inside the vase neck.
    var vaseH = a.type === 0 ? 0 : Math.min(iw * 0.78, ih * 0.21);
    if (a.type !== 0) drawVase(a.type, ix, iy, iw, ih, vaseH);
    var sway = Math.sin((t / 12) * Math.PI * 2 + a.swayPh) * 0.016;
    var dy = (a.type === 0 ? 0.985 : 1 - (vaseH / ih) * 0.90) - a.coral.startY;
    ctx.strokeStyle = CORAL;
    ctx.lineCap = 'round';
    var segs = a.coral.segs;
    for (var s = 0; s < segs.length; s++) {
      var sg = segs[s];
      var bend = sway * (5 - sg.depth);
      ctx.lineWidth = Math.max(1.1, iw * 0.042 * sg.wid);
      ctx.beginPath();
      ctx.moveTo(ix + sg.x1 * iw + Math.sin(bend) * (1 - (sg.y1 + dy)) * iw * 0.10, iy + (sg.y1 + dy) * ih);
      ctx.lineTo(ix + sg.x2 * iw + Math.sin(bend * 1.6) * (1 - (sg.y2 + dy)) * iw * 0.10, iy + (sg.y2 + dy) * ih);
      ctx.stroke();
    }
    // Dot tips: small periwinkle or cream dots, with a few grown into
    // flat flowers (cream ring, periwinkle heart, coral center dot).
    for (var p = 0; p < a.coral.tips.length; p++) {
      var tip = a.coral.tips[p];
      var tipBend = sway * 5;
      var tx = ix + tip.x * iw + Math.sin(tipBend) * (1 - (tip.y + dy)) * iw * 0.10;
      var ty = iy + (tip.y + dy) * ih;
      if (tip.big) {
        ctx.fillStyle = tip.alt ? CREAM : PERI;
        ctx.beginPath();
        ctx.arc(tx, ty, Math.max(2.4, iw * 0.040), 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = CORAL;
        ctx.beginPath();
        ctx.arc(tx, ty, Math.max(1.2, iw * 0.017), 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = tip.alt ? CREAM : PERI;
        ctx.beginPath();
        ctx.arc(tx, ty, Math.max(1.4, iw * 0.020), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Fish drift across the arch on looping horizontal sine paths.
    // Each crossing period (12s or 24s) divides the loop, and the
    // sideways travel is measured past the arch edges, so a fish
    // enters and leaves gradually inside the clip.
    for (var fi = 0; fi < a.fish.length; fi++) {
      var f = a.fish[fi];
      var flen = f.lenF * iw;
      var u = ((t / f.period) + f.phase) % 1;
      var travel = iw + flen * 1.3;
      var fx = f.dir > 0
        ? ix - flen * 0.65 + u * travel
        : ix + iw + flen * 0.65 - u * travel;
      var fy = iy + f.baseY * ih +
        Math.sin(u * Math.PI * 4 + f.bobPh) * ih * 0.022 +
        Math.sin((t / 6) * Math.PI * 2 + f.bobPh) * ih * 0.008;
      drawFish(f, fx, fy, flen, t);
    }

    ctx.restore();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = NAVY;
    ctx.fillRect(0, 0, W, H);

    var aspect = W / H;
    var count = aspect < 0.75 ? 3 : (aspect < 1.15 ? 4 : 5);
    var mx = Math.max(12, W * 0.035);
    var top = Math.max(12, H * 0.045);
    var checkerH = Math.max(18, Math.min(32, Math.min(W, H) * 0.045));
    var archBottom = H - Math.max(12, H * 0.045) - checkerH - Math.max(8, H * 0.014);
    var gap = Math.max(8, Math.min(20, W * 0.015));
    var ow = (W - mx * 2 - gap * (count - 1)) / count;
    var frame = Math.max(6, Math.min(14, ow * 0.085));

    for (var i = 0; i < count; i++) {
      drawArch(arches[i], mx + i * (ow + gap), top, ow, archBottom, frame, t);
    }

    // Thin checkerboard strip along the base: two rows of alternating
    // cream and periwinkle squares under a cream rule.
    var stripY = archBottom + Math.max(8, H * 0.014);
    var stripW = W - mx * 2;
    var cell = checkerH / 2;
    var cells = Math.max(8, Math.round(stripW / cell));
    var cw = stripW / cells;
    ctx.fillStyle = CREAM;
    ctx.fillRect(mx, stripY - 3, stripW, 2);
    for (var r = 0; r < 2; r++) {
      for (var c = 0; c < cells; c++) {
        ctx.fillStyle = ((c + r) % 2 === 0) ? CREAM : PERI;
        ctx.fillRect(mx + c * cw, stripY + r * cell, cw + 0.5, cell);
      }
    }
  }

  // One synchronous, constant first frame at loop phase 11s: fish mid
  // crossing at developed positions, coral mid sway, dots mid pulse.
  // Never derived from the clock.
  buildArches();
  resize();
  draw(FIXED_T);

  // Motion: watch-only pure loop. rAF is typeof-guarded and anchored
  // as the fixed offset plus elapsed time, wrapped by the 24s loop.
  // No interaction of any kind, and nothing ever reloads.
  var startStamp = (typeof performance !== "undefined" && performance.now)
    ? performance.now() : 0;
  function step() {
    var elapsed = ((typeof performance !== "undefined" && performance.now)
      ? performance.now() - startStamp : 0) / 1000;
    draw((FIXED_T + elapsed) % LOOP);
  }
  if (typeof requestAnimationFrame === 'function') {
    var loopFn = function () { step(); requestAnimationFrame(loopFn); };
    requestAnimationFrame(loopFn);
  }

  if (typeof window !== "undefined" && window.addEventListener) {
    window.addEventListener('resize', resize);
  }
  if (typeof window !== "undefined" && window.visualViewport &&
      window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
})();
</script>
</body>
</html>
