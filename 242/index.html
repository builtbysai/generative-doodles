<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.242 Deluxe Unit</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#161616; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.242 Deluxe Unit (James Woodfill). After the Deluxe Unit of
// Crossing Signals 2022: a plywood tower on casters, speaker
// cones below, a tablet and an amp band with status LEDs, and a
// sign panel up top that flips ninety degrees every eight
// seconds through circle, triangle, bar and X. Each flip kicks
// the speaker cones. The whole rig rolls a slow small circle on
// the dark floor, casters swivelling with the direction of
// travel. Silent despite the speakers. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PLY = '#D9B98A', HW = '#222222', PANEL = '#F5F5F2', INK = '#1A1A1A';
var LEDG = '#39FF6A', LEDR = '#FF3B30', GROUND = '#161616';
var W = 0, H = 0, phone = false;
var T = 0.3, lastNow = -1; // frame one: mid flip into the triangle, cones just kicked

// Glyph ids: 0 circle, 1 triangle, 2 bar, 3 X. Seeded order.
var ORDER = [1, 3, 0, 2];

function drawGlyph(g) {
  ctx.strokeStyle = INK;
  ctx.fillStyle = INK;
  ctx.lineWidth = 11;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (g === 0) {
    ctx.beginPath();
    ctx.arc(0, 0, 33, 0, Math.PI * 2);
    ctx.stroke();
  } else if (g === 1) {
    ctx.beginPath();
    ctx.moveTo(0, -34);
    ctx.lineTo(37, 27);
    ctx.lineTo(-37, 27);
    ctx.closePath();
    ctx.stroke();
  } else if (g === 2) {
    ctx.fillRect(-42, -11, 84, 22);
  } else {
    ctx.beginPath();
    ctx.moveTo(-30, -30); ctx.lineTo(30, 30);
    ctx.moveTo(30, -30); ctx.lineTo(-30, 30);
    ctx.stroke();
  }
}

function drawCaster(x, y, sw, dim) {
  var wx = x + Math.cos(sw) * 11, wy = y + 10 + Math.sin(sw) * 4;
  ctx.strokeStyle = HW;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(x, y - 2);
  ctx.lineTo(wx, wy);
  ctx.stroke();
  ctx.fillStyle = HW;
  ctx.beginPath();
  ctx.arc(wx, wy, 12.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = PLY;
  ctx.beginPath();
  ctx.arc(wx, wy, 4, 0, Math.PI * 2);
  ctx.fill();
  if (dim) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.arc(wx, wy, 13, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawSpeaker(cx, P) {
  // cabinet
  ctx.fillStyle = HW;
  ctx.fillRect(cx - 48, -370, 96, 156);
  // tweeter
  ctx.fillStyle = GROUND;
  ctx.strokeStyle = PLY;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, -340, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = PLY;
  ctx.beginPath();
  ctx.arc(cx, -340, 2.5, 0, Math.PI * 2);
  ctx.fill();
  // woofer cone: concentric rings, scaled by the kick pulse
  var k = 1 + 0.16 * P, cy = -262;
  if (P > 0.02) {
    ctx.strokeStyle = 'rgba(217,185,138,' + P.toFixed(3) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, 33 + 34 * (1 - P), 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.fillStyle = GROUND;
  ctx.strokeStyle = PLY;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, 33 * k, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = HW;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, 22 * k, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = PLY;
  ctx.beginPath();
  ctx.arc(cx, cy, 9 * k, 0, Math.PI * 2);
  ctx.fill();
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var s = Math.min(W, H) * 0.98 / 1000;
  ctx.save();
  ctx.translate((W - 1000 * s) / 2, (H - 1000 * s) / 2);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.rect(0, 0, 1000, 1000);
  ctx.clip();

  // Roll: a slow small circle, 48 seconds a circuit.
  var phi = 2.2 + 2 * Math.PI * T / 48;
  var cx = 500 + 58 * Math.cos(phi);
  var cy = 700 + 26 * Math.sin(phi);
  var heading = Math.atan2(26 * Math.cos(phi), -58 * Math.sin(phi));
  var us = 1 + 0.05 * Math.sin(phi);

  // Glyph clock: an eight second cycle, flip in the first 400ms.
  var k = Math.floor(T / 8);
  var ft = T - 8 * k;
  var cur = ORDER[k % 4], prev = ORDER[(k + 3) % 4];
  var fp = Math.min(1, ft / 0.4);
  var glyph = fp < 0.5 ? prev : cur;
  var sx = fp >= 1 ? 1 : Math.max(0.07, Math.abs(Math.cos(Math.PI * fp)));
  var P = Math.exp(-ft / 0.3); // cone kick, 300ms decay
  var redOn = (k % 2 === 0);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(us, us);
  // floor shadow
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  ctx.save();
  ctx.translate(0, 12);
  ctx.scale(1, 0.18);
  ctx.beginPath();
  ctx.arc(0, 0, 190, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  ctx.rotate(0.02 * Math.sin(phi));

  // back casters, offset into the three-quarter view
  drawCaster(-95 + 30, -24, heading, true);
  drawCaster(95 + 30, -24, heading, true);

  // body side face (right) and top face
  ctx.fillStyle = PLY;
  ctx.beginPath();
  ctx.moveTo(110, -430); ctx.lineTo(140, -452); ctx.lineTo(140, -22); ctx.lineTo(110, 0);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  ctx.fill();
  ctx.fillStyle = PLY;
  ctx.beginPath();
  ctx.moveTo(-110, -430); ctx.lineTo(110, -430); ctx.lineTo(140, -452); ctx.lineTo(-80, -452);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.fill();
  // body front
  ctx.fillStyle = PLY;
  ctx.fillRect(-110, -430, 220, 430);
  ctx.strokeStyle = HW;
  ctx.lineWidth = 3;
  ctx.strokeRect(-110, -430, 220, 430);

  // speakers
  drawSpeaker(-56, P);
  drawSpeaker(56, P);

  // amp band: knobs and status LEDs
  ctx.fillStyle = HW;
  ctx.fillRect(-110, -150, 220, 42);
  ctx.fillStyle = PLY;
  [-30, 0, 30].forEach(function (kx) {
    ctx.beginPath();
    ctx.arc(kx, -129, 5, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.fillStyle = LEDG;
  ctx.beginPath();
  ctx.arc(-84, -129, 5.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = redOn ? LEDR : 'rgba(255,59,48,0.25)';
  ctx.beginPath();
  ctx.arc(-62, -129, 5.5, 0, Math.PI * 2);
  ctx.fill();

  // tablet, blank, no logo
  ctx.fillStyle = HW;
  ctx.fillRect(30, -96, 64, 58);
  ctx.fillStyle = GROUND;
  ctx.fillRect(36, -90, 52, 46);
  ctx.fillStyle = PLY;
  ctx.beginPath();
  ctx.arc(83, -49, 2, 0, Math.PI * 2);
  ctx.fill();

  // sign posts
  ctx.fillStyle = HW;
  ctx.fillRect(-72, -452, 8, 24);
  ctx.fillRect(64, -452, 8, 24);

  // sign panel, flipping around its vertical axis
  ctx.save();
  ctx.translate(0, -519);
  ctx.scale(sx, 1);
  ctx.fillStyle = PANEL;
  ctx.beginPath();
  ctx.moveTo(100, -64); ctx.lineTo(126, -82); ctx.lineTo(126, 46); ctx.lineTo(100, 64);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.10)';
  ctx.fill();
  ctx.fillStyle = PANEL;
  ctx.fillRect(-100, -64, 200, 128);
  ctx.strokeStyle = HW;
  ctx.lineWidth = 3;
  ctx.strokeRect(-100, -64, 200, 128);
  drawGlyph(glyph);
  ctx.restore();

  // front casters
  drawCaster(-95, 0, heading, false);
  drawCaster(95, 0, heading, false);

  ctx.restore();
  ctx.restore();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
