<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.341 Make Shake</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F4EFE3; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.341 Make Shake (myclayco).
// After their Make Shake dice game (2026-04-30): three
// chunky dice across the top, each die one parameter of a
// small generative system - die 1 a profile, die 2 a stack
// count, die 3 a palette - and below them the CURRENT
// rolled combination rendered as a study, so the dice read
// as the cause of the picture. Faces carry pips only:
// pip counts encode the rolled values, never glyphs,
// never text, never numbered faces.
// The study uses ONLY the No.337 stack grammar: concentric
// outlines of the rolled profile, at the rolled count, in
// the rolled duo, breathing gently on that grammar's 20s
// loop (bezier handles oscillate, whole cycles in 20s,
// seamless). No other renderer is imported. The outermost
// outline is filled with the duo's second colour so both
// duo colours stay visible on the paper ground (the paper
// and cream duos would otherwise lose half their outlines
// to the ground); every outline is then stroked in the
// duo's first colour. All marks are JS data drawn directly
// each frame on one canvas: no offscreen canvas, no
// filters, no gradients, no shadowBlur.
// Interaction: DOUBLE-TAP only (350ms window). The dice
// tumble and settle on the next entry of a fixed seeded
// roll table, and the study re-renders from that roll in
// the same frame the dice settle - it never changes on
// its own. No single-tap action. Frame one opens with a
// roll already settled and its study already rendered.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#F4EFE3', DICECREAM = '#FBF7EE', INK = '#1C1A17';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

// ---- the four profiles, hand-authored anchor data --------
// Closed anchor loops in a roughly +-105 box, y down. The
// authored values are deliberately a little irregular;
// smooth bezier handles are derived by Catmull-Rom and then
// offset per control point from the fixed wobble table
// below, so the line is never a clean bezier.
var PROFILES = [
  // 0 bird: beak tip, beak lower base, throat, big
  // round breast, belly, tail underside base, tail wedge
  // tip, tail top base, back dip (the neck saddle that
  // separates head from back), head rear, crown,
  // forehead, beak upper base.
  [[92,-44],[70,-34],[58,-8],[54,28],[30,56],[-8,66],
   [-40,54],[-56,32],[-92,10],[-66,-16],[-38,-34],[0,-56],
   [34,-64],[58,-56],[72,-50]],
  // 1 bow: knot top, right loop crown, right tip, right
  // loop foot, waist in, knot right, knot bottom, then
  // mirrored back up the left side.
  [[0,-18],[24,-28],[58,-52],[92,-30],[86,4],[58,32],
   [26,22],[9,15],[0,19],[-9,15],[-26,22],[-58,32],
   [-86,4],[-92,-30],[-58,-52],[-24,-28]],
  // 2 frame: a soft rectangle, three anchors per corner
  // so the Catmull-Rom corners round like a cutter frame.
  [[0,-58],[54,-58],[78,-42],[82,0],[78,42],[54,58],
   [0,58],[-54,58],[-78,42],[-82,0],[-78,-42],[-54,-58]],
  // 3 leaf: tip, right shoulder, right flank, lower
  // right, stem right, stem left, lower left, left flank,
  // left shoulder.
  [[0,-90],[36,-54],[54,-6],[40,46],[13,76],[3,90],
   [-3,90],[-13,76],[-40,46],[-54,-6],[-36,-54]]
];
var PROFILE_NAMES = ['bird', 'bow', 'frame', 'leaf'];
if (PROFILES.length !== 4) throw new Error('Make Shake needs exactly 4 profiles');

// ---- fixed wobble table ----------------------------------
// Per control point: static anchor offset (sx, sy), breath
// phase p (radians) and breath amplitude a (profile units).
// Fixed seed data, never runtime noise.
var WOB = [
  [2,-1,0.0,2.6],[-2,2,0.8,2.0],[1,3,1.7,3.0],[-3,-1,2.5,2.2],
  [0,-3,3.3,2.8],[3,1,4.1,2.1],[-1,-2,4.9,3.2],[2,2,5.6,2.4],
  [-2,0,0.4,2.9],[1,-3,1.2,2.3],[3,2,2.0,2.7],[-3,1,2.9,2.0],
  [0,3,3.7,3.1],[2,-2,4.5,2.5],[-1,2,5.3,2.2],[3,0,6.0,2.8]
];
function wob(i) { return WOB[i % WOB.length]; }

// ---- the four fixed palette duos --------------------------
// Fly's replaceable resolution, flagged in the batch spec:
// the prompt never lists die 3's duos, so they are taken
// from this set's own earlier palettes. Duo = [stroke,
// silhouette fill].
var DUOS = [
  ['#2E8B8B', '#1C1A17'],   // teal / ink
  ['#C25E3C', '#F4EFE3'],   // terracotta / paper
  ['#D9A441', '#F2EBD8'],   // gold / cream
  ['#D64545', '#F2EBD8']    // red / cream
];
if (DUOS.length !== 4) throw new Error('Make Shake needs exactly 4 duos');

// ---- the fixed seeded roll table --------------------------
// Each entry is a full triple [profile, count, duo].
// Double-tap advances to the next entry; the tumble
// settles on exactly that triple. Twelve authored rolls.
var ROLLS = [
  [0,5,0], [3,4,2], [1,6,1], [2,3,3],
  [0,7,2], [2,5,0], [3,3,1], [1,4,3],
  [2,7,1], [0,3,3], [3,6,0], [1,5,2]
];
(function () {
  if (ROLLS.length < 8) throw new Error('Make Shake roll table too short');
  for (var i = 0; i < ROLLS.length; i++) {
    var r = ROLLS[i];
    if (r[0] < 0 || r[0] > 3) throw new Error('Make Shake roll profile out of range');
    if (r[1] < 3 || r[1] > 7) throw new Error('Make Shake roll count out of 3-7');
    if (r[2] < 0 || r[2] > 3) throw new Error('Make Shake roll duo out of range');
  }
})();

// ---- pip layouts ------------------------------------------
// Dot arrangements per face value, as fractions of the die
// half-size. Values 1-7: die 1 shows profile index + 1,
// die 2 shows the stack count itself, die 3 shows duo
// index + 1. Pips are dots, never numbers.
var PIPS = {
  1: [[0,0]],
  2: [[-0.38,-0.38],[0.38,0.38]],
  3: [[-0.4,-0.4],[0,0],[0.4,0.4]],
  4: [[-0.4,-0.4],[0.4,-0.4],[-0.4,0.4],[0.4,0.4]],
  5: [[-0.4,-0.4],[0.4,-0.4],[0,0],[-0.4,0.4],[0.4,0.4]],
  6: [[-0.4,-0.42],[0.4,-0.42],[-0.4,0],[0.4,0],[-0.4,0.42],[0.4,0.42]],
  7: [[-0.4,-0.42],[0.4,-0.42],[-0.4,0],[0.4,0],[0,0],[-0.4,0.42],[0.4,0.42]]
};

// ---- state -------------------------------------------------
var DICE = 3;
if (DICE !== 3) throw new Error('Make Shake needs exactly 3 dice');
var rollIdx = 0;
var current = ROLLS[0];       // the settled roll on show
var target = ROLLS[0];        // the roll a tumble heads for
var tumbling = false;
var tumbleStart = 0;
var TUMBLE_MS = 950;
var TILT = [-0.05, 0.03, -0.04];
var DIE_X = [448, 640, 832], DIE_Y = 168, DIE_H = 74;

// ---- profile path: the No.337 stack grammar ---------------
// One closed bezier path through the profile anchors.
// Handles are Catmull-Rom derived, then offset by the
// wobble table: static offsets sit in the anchors, breath
// offsets ride on the handles and complete whole sine
// cycles in the 20s loop, so the loop is seamless.
var LOOP_MS = 20000;
function profilePath(prof, cx, cy, scale, bt) {
  var n = prof.length;
  var a = 2 * Math.PI * bt / LOOP_MS;
  var pulse = 1 + 0.012 * Math.sin(a + 0.9);
  var sc = scale * pulse;
  var pts = [];
  var i, j;
  for (i = 0; i < n; i++) {
    var w = wob(i);
    pts.push([cx + (prof[i][0] + w[0]) * sc, cy + (prof[i][1] + w[1]) * sc]);
  }
  function hoff(i2) {
    var w2 = wob(i2);
    var ph = a + w2[2];
    return [w2[3] * Math.sin(ph) * sc, w2[3] * 0.7 * Math.sin(ph + 1.1) * sc];
  }
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (i = 0; i < n; i++) {
    j = (i + 1) % n;
    var p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[j], p3 = pts[(j + 1) % n];
    var o1 = hoff(i), o2 = hoff(j);
    ctx.bezierCurveTo(
      p1[0] + (p2[0] - p0[0]) / 6 + o1[0], p1[1] + (p2[1] - p0[1]) / 6 + o1[1],
      p2[0] - (p3[0] - p1[0]) / 6 + o2[0], p2[1] - (p3[1] - p1[1]) / 6 + o2[1],
      p2[0], p2[1]);
  }
  ctx.closePath();
}

// ---- the study ----------------------------------------------
// Concentric outlines of the rolled profile at the rolled
// count in the rolled duo, x1.5 geometric progression,
// centred in the lower two thirds. Silhouette fill in the
// duo's second colour under strokes in the first (see the
// header note). Rebuilt from `current` only, so it changes
// in exactly the frame a tumble settles.
function drawStudy(bt) {
  var prof = PROFILES[current[0]];
  var count = current[1];
  var duo = DUOS[current[2]];
  var cx = 640, cy = 608, base = 2.15;
  profilePath(prof, cx, cy, base, bt);
  ctx.fillStyle = duo[1];
  ctx.fill();
  ctx.strokeStyle = duo[0];
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  for (var k = 0; k < count; k++) {
    profilePath(prof, cx, cy, base * Math.pow(1 / 1.5, k), bt);
    ctx.lineWidth = Math.max(2.3, 4.6 - 0.35 * k);
    ctx.stroke();
  }
}

// ---- the dice -------------------------------------------------
function drawDie(cx, cy, rot, pips) {
  var h = DIE_H, r = 26;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(-h + r, -h);
  ctx.lineTo(h - r, -h);
  ctx.arcTo(h, -h, h, -h + r, r);
  ctx.lineTo(h, h - r);
  ctx.arcTo(h, h, h - r, h, r);
  ctx.lineTo(-h + r, h);
  ctx.arcTo(-h, h, -h, h - r, r);
  ctx.lineTo(-h, -h + r);
  ctx.arcTo(-h, -h, -h + r, -h, r);
  ctx.closePath();
  ctx.fillStyle = DICECREAM;
  ctx.fill();
  ctx.strokeStyle = INK;
  ctx.lineWidth = 4;
  ctx.lineJoin = 'round';
  ctx.stroke();
  var lay = PIPS[pips];
  ctx.fillStyle = INK;
  for (var i = 0; i < lay.length; i++) {
    ctx.beginPath();
    ctx.arc(lay[i][0] * h, lay[i][1] * h, 10.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}
function easeOutCubic(u) { return 1 - Math.pow(1 - u, 3); }
function drawDice(now) {
  var u = tumbling ? clamp((now - tumbleStart) / TUMBLE_MS, 0, 1) : 1;
  for (var i = 0; i < DICE; i++) {
    var rot = TILT[i], yOff = 0, xOff = 0, pips;
    if (tumbling) {
      var e = easeOutCubic(u);
      rot = TILT[i] + (1 - e) * (Math.PI * 4 + i * 1.2) * (i === 1 ? -1 : 1);
      yOff = -Math.abs(Math.sin(u * Math.PI * 3)) * 30 * (1 - u);
      xOff = Math.sin(now * 0.09 + i * 2.1) * 3 * (1 - u);
      pips = 1 + ((Math.floor(now / 90) + i * 3) % 7);
    } else if (i === 0) {
      pips = current[0] + 1;
    } else if (i === 1) {
      pips = current[1];
    } else {
      pips = current[2] + 1;
    }
    drawDie(DIE_X[i] + xOff, DIE_Y + yOff, rot, pips);
  }
}

// ---- drawing ---------------------------------------------------
function draw(bt, now) {
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, DW, DH);
  drawStudy(bt);
  drawDice(now);
}

// ---- interaction: double-tap shakes ---------------------------
var lastTap = -1e9;
canvas.addEventListener('pointerdown', function (e) {
  var ts = (typeof e.timeStamp === 'number') ? e.timeStamp : 0;
  if (ts - lastTap < 350) {
    lastTap = -1e9;
    if (!tumbling) {
      rollIdx = (rollIdx + 1) % ROLLS.length;
      target = ROLLS[rollIdx];
      tumbling = true;
      tumbleStart = ts;
    }
  } else {
    lastTap = ts;
  }
});

// ---- sizing and frame ------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  var now = time || 0;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // A tumble settles atomically: the settled roll swaps in
  // here, before anything draws, so the study re-renders
  // from the new roll in the same frame the dice land.
  if (tumbling && now - tumbleStart >= TUMBLE_MS) {
    tumbling = false;
    current = target;
  }
  // Centred fit for this shaped composition; page ground
  // is the piece's own paper, so the letterbox is seamless.
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  // Breathing clock offset so frame one is already
  // mid-breath, roll settled, study rendered.
  draw(now + 5000, now);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now2) { frame(now2); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
