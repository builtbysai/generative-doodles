<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basic Waveforms</title>
<style>
  html, body { margin: 0; padding: 0; background: #050505; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // №1158 "Basic Waveforms" — Antonio Roberts study block AR7
  // (Basic Waveforms, 2025: artwork and visualisers for Charles
  // Celeste Hutchins's EP — sine/square/sawtooth as glitch-visual
  // material). Three huge flat waveform traces march across the
  // canvas in three lanes that never overlap — cyan sine on top,
  // pink square in the middle, green sawtooth at the bottom — drawn
  // as 6px neon traces with a 2px black outline over a near-black
  // field of dim databend bursts. The traces corrupt the field they
  // move over, and every effect is computed in the field's data
  // grid: where the square wave's rising edges pass, the field rows
  // tear (a vertical shift that steps back over one beat); cells
  // under the sine curve split sideways into dark cyan / dark
  // magenta channel ghosts; where the sawtooth drops, a flat
  // #FFD500 block is injected and decays in three hard steps over
  // the beat. A deterministic 120bpm beat (the 8-second loop is
  // exactly 16 beats) steps each trace's brightness through a
  // per-lane shade pattern — never a smooth pulse. Watch-only,
  // silent; the beat is visual only.

  // ---------- palette (flat only) ----------
  var BG = '#050505';
  var FIELD = '#1A1A1A';       // dim burst texture
  var ACCENT = '#FFD500';      // sparse field accents / saw blocks
  var SAW_SHADE = ['#FFD500', '#8A7300', '#453A08']; // block decay steps
  var SMEAR_L = '#0B3540';     // sine smear: dark cyan channel
  var SMEAR_R = '#3D0A21';     // sine smear: dark magenta channel
  var SMEAR_AL = '#8A7300';    // accent smear halves
  var SMEAR_AR = '#8A4D00';
  var TRACE_SHADE = [
    ['#00E5FF', '#00ADC2', '#007E94'],   // sine
    ['#FF2E88', '#C42066', '#8F184C'],   // square
    ['#B6FF00', '#8AC400', '#5E8500']    // sawtooth
  ];
  var BEAT_PATTERN = [
    [0, 0, 1, 0],   // sine shade level per beat (mod 4)
    [0, 1, 0, 2],   // square
    [1, 0, 0, 1]    // sawtooth
  ];

  var GRID = 96;               // field grid, cells per side
  var LOOP = 8;                // seconds = 16 beats at 120bpm
  var BEAT = 0.5;              // seconds per beat
  var T0 = 2.25;               // fixed first-frame phase, mid-beat

  // wave shape: cycles across the width, whole cycles marched per loop
  var CYC = [3, 2, 4];         // sine, square, saw
  var MARCH = [2, 1, 3];       // integer marches -> seamless 8s loop

  // ---------- seeded rng ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function frac(x) { return x - Math.floor(x); }
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }

  // ---------- the burst field: a data grid ----------
  // cell value: 0 empty, 1 field burst, 2 accent
  var FIELDGRID = new Uint8Array(GRID * GRID);
  (function buildField() {
    var rng = mulberry32(115807);
    var i, x, y, w, h, cx, cy;
    for (i = 0; i < 110; i++) {           // burst clusters
      w = 2 + Math.floor(rng() * 5);
      h = 1 + Math.floor(rng() * 3);
      cx = Math.floor(rng() * (GRID - w));
      cy = Math.floor(rng() * (GRID - h));
      for (y = 0; y < h; y++) {
        for (x = 0; x < w; x++) {
          if (rng() < 0.82) FIELDGRID[(cy + y) * GRID + (cx + x)] = 1;
        }
      }
    }
    for (i = 0; i < 46; i++) {            // sparse accents
      FIELDGRID[Math.floor(rng() * GRID * GRID)] = 2;
    }
  })();

  // ---------- phone detection ----------
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var minScreen = Math.min(sw || 9999, sh || 9999);
  var isPhone = minScreen < 700;

  // ---------- view / canvas ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  function viewW() {
    if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight || 800;
  }
  function fit() {
    W = viewW(); H = viewH();
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // ---------- waveforms ----------
  // lane 0 sine, 1 square, 2 sawtooth; x in [0,1], returns [-1,1]
  function waveY(lane, x, lt) {
    var m = MARCH[lane] * (lt / LOOP);
    if (lane === 0) return Math.sin(2 * Math.PI * (CYC[0] * x - m));
    if (lane === 1) return Math.sin(2 * Math.PI * (CYC[1] * x - m)) >= 0 ? 1 : -1;
    return 2 * frac(CYC[2] * x - m) - 1;
  }

  // ---------- draw ----------
  function draw(t) {
    fit();
    var lt = ((t % LOOP) + LOOP) % LOOP;
    var beat = Math.floor(lt / BEAT);

    var side = isPhone ? W : Math.min(W, H);
    var sx = (W - side) / 2, sy = (H - side) / 2;
    var cell = side / GRID;

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.beginPath();
    ctx.rect(sx, sy, side, side);
    ctx.clip();

    // ----- field geometry of the effects (closed-form in lt) -----
    var mSq = MARCH[1] * (lt / LOOP);
    var e0 = frac(mSq) / CYC[1];            // first rising edge, x in [0, .5)
    var mSaw = MARCH[2] * (lt / LOOP);
    var xd0 = frac(mSaw) / CYC[2];          // first saw drop, x in [0, .25)
    var V_SQ = MARCH[1] / (CYC[1] * LOOP);  // rising-edge speed, width/sec
    var V_SAW = MARCH[2] / (CYC[2] * LOOP); // drop speed, width/sec
    var laneRow = [GRID / 6, GRID / 2, GRID * 5 / 6]; // lane centres, grid rows
    var ampRows = GRID * 0.105;             // wave amplitude, grid rows

    // sine curve row per column (for the smear test)
    // square tear offset per column (middle-lane rows only)
    var tearOff = new Int8Array(GRID);
    var c, r, u;
    for (c = 0; c < GRID; c++) {
      u = (c + 0.5) / GRID;
      var age = Math.min(frac(e0 - u), frac(e0 + 0.5 - u)) / V_SQ;
      if (age < BEAT) tearOff[c] = 4 - Math.floor((age / BEAT) * 4); // 4,3,2,1
    }

    // ----- pass 1: the field, with tear + smear applied in the data -----
    var gField = [], gAccent = [], gSmL = [], gSmR = [], gSmAL = [], gSmAR = [];
    function push(arr, x, y, w, h) { arr.push(x, y, w, h); }
    for (r = 0; r < GRID; r++) {
      var midLane = r >= GRID / 3 && r < 2 * GRID / 3;
      for (c = 0; c < GRID; c++) {
        var v = FIELDGRID[r * GRID + c];
        if (!v) continue;
        var px = sx + c * cell, py = sy + r * cell;
        if (r < GRID / 3) {
          // sine smear: cells near the curve split into channel ghosts
          var curveRow = laneRow[0] - waveY(0, (c + 0.5) / GRID, lt) * ampRows;
          if (Math.abs(r + 0.5 - curveRow) <= 1.2) {
            if (v === 2) {
              push(gSmAL, px - 2 * cell, py, cell + 0.6, cell + 0.6);
              push(gSmAR, px + 2 * cell, py, cell + 0.6, cell + 0.6);
            } else {
              push(gSmL, px - 2 * cell, py, cell + 0.6, cell + 0.6);
              push(gSmR, px + 2 * cell, py, cell + 0.6, cell + 0.6);
            }
            continue;
          }
        }
        var dy = midLane ? tearOff[c] : 0;
        var rr = clamp(r + dy, 0, GRID - 1);
        push(v === 2 ? gAccent : gField, px, sy + rr * cell, cell + 0.6, cell + 0.6);
      }
    }
    function flush(arr, colour) {
      if (!arr.length) return;
      ctx.fillStyle = colour;
      ctx.beginPath();
      for (var i = 0; i < arr.length; i += 4) ctx.rect(arr[i], arr[i + 1], arr[i + 2], arr[i + 3]);
      ctx.fill();
    }
    flush(gField, FIELD);
    flush(gAccent, ACCENT);
    flush(gSmL, SMEAR_L);
    flush(gSmR, SMEAR_R);
    flush(gSmAL, SMEAR_AL);
    flush(gSmAR, SMEAR_AR);

    // ----- pass 2: sawtooth drop blocks -----
    // Each drop trails a 3-step decaying block one beat long, 3 rows
    // tall, centred on the saw lane. Step 0 (at the drop) is newest.
    var sawTop = sy + (laneRow[2] - 1.5) * cell;
    var trailW = V_SAW * BEAT;              // width units per beat
    for (var j = 0; j < CYC[2]; j++) {
      var xd = xd0 + j / CYC[2];
      for (var s = 0; s < 3; s++) {
        var x1 = xd - trailW * (s + 1) / 3;
        var x0 = xd - trailW * s / 3;
        ctx.fillStyle = SAW_SHADE[s];
        ctx.fillRect(sx + x0 * side, sawTop, (x1 - x0) * side + 0.6, 3 * cell + 0.6);
      }
    }

    // ----- pass 3: the three traces -----
    var SAMPLES = 720;
    for (var lane = 0; lane < 3; lane++) {
      var cyPx = sy + side * (2 * lane + 1) / 6;
      var ampPx = side * 0.105;
      var shade = TRACE_SHADE[lane][BEAT_PATTERN[lane][beat % 4]];
      for (var pass = 0; pass < 2; pass++) {
        ctx.beginPath();
        for (var i2 = 0; i2 <= SAMPLES; i2++) {
          var xx = i2 / SAMPLES;
          var px2 = sx + xx * side;
          var py2 = cyPx - waveY(lane, xx, lt) * ampPx;
          if (i2 === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
        }
        ctx.lineWidth = pass === 0 ? 10 : 6;
        ctx.strokeStyle = pass === 0 ? '#000000' : shade;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  // ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
  var lastT = T0;
  if (window.addEventListener) {
    window.addEventListener('resize', function () { draw(lastT); });
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { draw(lastT); });
  }

  draw(T0);

  var startStamp = null;
  function frame(stamp) {
    if (startStamp === null) startStamp = stamp;
    var t = T0 + (stamp - startStamp) / 1000;
    lastT = t;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
