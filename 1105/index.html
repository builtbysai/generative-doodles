<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Durchsehen — №1105</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #101114;
    overflow: hidden;
  }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- palette ----------
  var GALLERY = '#101114';   // room
  var CEILING = '#0C0D10';
  var FLOOR   = '#1A1C20';
  var LINE    = '#26282E';   // wall / perspective lines
  var FRAME   = '#43464C';   // artwork + window frames
  var ARTBG   = '#17191D';
  var PALE    = '#B9BCBE';   // artwork motif light
  var MIDGREY = '#8A8D91';   // artwork motif mid
  var DIMGREY = '#4A4E55';   // artwork motif dark
  var PANE    = '#252B34';   // window glass
  var PANELIT = '#313A46';   // window lit pane
  var CONCRETE  = '#6E7278'; // cube opaque face
  var CONC_TOP  = '#5B5F65';
  var CONC_SIDE = '#494D53';
  var EDGE      = '#33363B';
  var SEAM      = '#3F4247';
  var PLINTH    = '#22252B';
  var AMBER = [201, 150, 46]; // #C9962E selected-bystander ring

  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
  function smoothstep(a, b, x) {
    var t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function amber(a) { return 'rgba(' + AMBER[0] + ',' + AMBER[1] + ',' + AMBER[2] + ',' + a.toFixed(3) + ')'; }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var viewW = 720, viewH = 720, dpr = 1;

  function measure() {
    var w, h;
    if (window.visualViewport) { w = window.visualViewport.width; h = window.visualViewport.height; }
    else { w = window.innerWidth; h = window.innerHeight; }
    viewW = w; viewH = h;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    var bw = Math.round(w * dpr), bh = Math.round(h * dpr);
    if (canvas.width !== bw) canvas.width = bw;
    if (canvas.height !== bh) canvas.height = bh;
  }
  function onResize() { measure(); }
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', onResize);
  if (window.addEventListener) window.addEventListener('resize', onResize);
  measure();

  function isPhone() {
    var sw = 1024, sh = 768;
    if (typeof screen !== 'undefined' && screen) { sw = screen.width; sh = screen.height; }
    return Math.min(sw, sh) < 700 || viewH > viewW * 1.15;
  }

  // ---------- room contents (seeded, re-hangable) ----------
  var seedBase = 1105;
  var contentsIndex = 0;
  var contents = null;
  function buildContents() {
    var rng = mulberry32((seedBase + contentsIndex * 7919) >>> 0);
    contents = {
      motif: Math.floor(rng() * 5),          // artwork motif 0..4
      artShift: (rng() - 0.5) * 0.03,        // fraction of S
      plinth: rng() < 0.6,                   // low plinth on the floor
      litPane: Math.floor(rng() * 4),        // which window pane is lit
      sill: rng() < 0.5                      // small sill block under window
    };
  }
  buildContents();

  // concrete speckle for the opaque face (static, seeded)
  var speckles = [];
  (function () {
    var rng = mulberry32(4242);
    for (var i = 0; i < 130; i++) {
      speckles.push({ u: rng(), v: rng(), r: 0.6 + rng() * 1.7, light: rng() < 0.45, a: 0.04 + rng() * 0.08 });
    }
  })();

  // ---------- room geometry ----------
  function geom(w, h) {
    var S = Math.min(w, h), cx = w / 2, cy = h / 2;
    return {
      S: S, cx: cx, cy: cy,
      bwL: cx - 0.31 * S, bwR: cx + 0.31 * S,
      bwT: cy - 0.27 * S, bwB: cy + 0.25 * S,
      cs: 0.40 * S,
      dx: 0.085 * S, dy: -0.075 * S
    };
  }

  // ---------- the room scene (drawn twice: room + cube-face cheat) ----------
  function drawRoom(w, h) {
    var g = geom(w, h), S = g.S, cx = g.cx, cy = g.cy;

    ctx.fillStyle = GALLERY;
    ctx.fillRect(-S, -S, w + 2 * S, h + 2 * S);

    // ceiling
    ctx.fillStyle = CEILING;
    ctx.beginPath();
    ctx.moveTo(-S, -S); ctx.lineTo(w + S, -S);
    ctx.lineTo(g.bwR, g.bwT); ctx.lineTo(g.bwL, g.bwT);
    ctx.closePath(); ctx.fill();

    // floor
    ctx.fillStyle = FLOOR;
    ctx.beginPath();
    ctx.moveTo(g.bwL, g.bwB); ctx.lineTo(g.bwR, g.bwB);
    ctx.lineTo(w + S, h + S); ctx.lineTo(-S, h + S);
    ctx.closePath(); ctx.fill();

    // radiating perspective lines: back-wall corners + edge midpoints to frame
    ctx.strokeStyle = LINE;
    ctx.lineWidth = Math.max(1, S * 0.0022);
    ctx.beginPath();
    ctx.moveTo(g.bwL, g.bwT); ctx.lineTo(-S, -S);
    ctx.moveTo(g.bwR, g.bwT); ctx.lineTo(w + S, -S);
    ctx.moveTo(g.bwL, g.bwB); ctx.lineTo(-S, h + S);
    ctx.moveTo(g.bwR, g.bwB); ctx.lineTo(w + S, h + S);
    ctx.moveTo(cx, g.bwT); ctx.lineTo(cx, -S);
    ctx.moveTo(cx, g.bwB); ctx.lineTo(cx, h + S);
    ctx.moveTo(g.bwL, cy); ctx.lineTo(-S, cy);
    ctx.moveTo(g.bwR, cy); ctx.lineTo(w + S, cy);
    ctx.stroke();

    // floor boards converging
    ctx.beginPath();
    var fr = [-0.75, -0.375, 0.375, 0.75];
    for (var i = 0; i < fr.length; i++) {
      ctx.moveTo(cx + fr[i] * 0.31 * S, g.bwB);
      ctx.lineTo(cx + fr[i] * (w * 0.5 + S) * 0.92, h + S);
    }
    ctx.stroke();
    // floor cross-lines
    var depths = [0.18, 0.45];
    ctx.beginPath();
    for (var d = 0; d < depths.length; d++) {
      var yy = g.bwB + depths[d] * (h + S - g.bwB);
      var tt = (yy - g.bwB) / (h + S - g.bwB);
      var lx = lerp(g.bwL, -S, tt), rx = lerp(g.bwR, w + S, tt);
      ctx.moveTo(lx, yy); ctx.lineTo(rx, yy);
    }
    ctx.stroke();

    // back wall
    ctx.fillStyle = GALLERY;
    ctx.fillRect(g.bwL, g.bwT, g.bwR - g.bwL, g.bwB - g.bwT);
    ctx.strokeStyle = LINE;
    ctx.lineWidth = Math.max(1, S * 0.0028);
    ctx.strokeRect(g.bwL, g.bwT, g.bwR - g.bwL, g.bwB - g.bwT);

    drawArtwork(g);
    drawWindow(g);

    // low plinth on the floor (some hangings)
    if (contents.plinth) {
      var pw = 0.11 * S, ph = 0.028 * S;
      var px = cx - 0.50 * S, py = g.bwB + 0.36 * (h - g.bwB);
      ctx.fillStyle = PLINTH;
      ctx.fillRect(px, py, pw, ph);
      ctx.strokeStyle = LINE;
      ctx.lineWidth = 1;
      ctx.strokeRect(px, py, pw, ph);
    }
  }

  function drawArtwork(g) {
    var S = g.S;
    var aw = 0.125 * S, ah = 0.165 * S;
    var ax = g.bwL + 0.065 * S + contents.artShift * S;
    var ay = g.bwT + 0.055 * S;
    ctx.fillStyle = ARTBG;
    ctx.fillRect(ax, ay, aw, ah);
    ctx.strokeStyle = FRAME;
    ctx.lineWidth = Math.max(2, S * 0.004);
    ctx.strokeRect(ax, ay, aw, ah);
    var mx = ax + aw / 2, my = ay + ah / 2;
    ctx.fillStyle = PALE;
    ctx.strokeStyle = PALE;
    if (contents.motif === 0) {
      ctx.beginPath(); ctx.arc(mx - aw * 0.12, my - ah * 0.08, aw * 0.24, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = MIDGREY;
      ctx.fillRect(ax + aw * 0.14, my + ah * 0.22, aw * 0.72, ah * 0.09);
    } else if (contents.motif === 1) {
      ctx.fillStyle = MIDGREY;
      ctx.fillRect(ax + aw * 0.18, ay + ah * 0.16, aw * 0.2, ah * 0.68);
      ctx.fillStyle = DIMGREY;
      ctx.fillRect(ax + aw * 0.52, ay + ah * 0.16, aw * 0.2, ah * 0.68);
    } else if (contents.motif === 2) {
      ctx.lineWidth = Math.max(2, S * 0.0035);
      ctx.beginPath();
      ctx.moveTo(mx, ay + ah * 0.16);
      ctx.lineTo(ax + aw * 0.8, ay + ah * 0.82);
      ctx.lineTo(ax + aw * 0.2, ay + ah * 0.82);
      ctx.closePath(); ctx.stroke();
    } else if (contents.motif === 3) {
      ctx.lineWidth = Math.max(2, S * 0.0035);
      ctx.strokeStyle = MIDGREY;
      ctx.beginPath(); ctx.arc(mx, my, aw * 0.3, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = PALE;
      ctx.beginPath(); ctx.arc(mx, my, aw * 0.07, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.save();
      ctx.translate(mx, my);
      ctx.rotate(-0.6);
      ctx.fillStyle = MIDGREY;
      ctx.fillRect(-aw * 0.38, -ah * 0.05, aw * 0.76, ah * 0.1);
      ctx.restore();
      ctx.fillStyle = PALE;
      ctx.fillRect(ax + aw * 0.58, ay + ah * 0.58, aw * 0.2, ah * 0.2);
    }
  }

  function drawWindow(g) {
    var S = g.S;
    var ww = 0.135 * S, wh = 0.185 * S;
    var wx = g.bwR - 0.095 * S - ww;
    var wy = g.bwT + 0.05 * S;
    ctx.fillStyle = PANE;
    ctx.fillRect(wx, wy, ww, wh);
    // lit pane (one of four)
    var lp = contents.litPane;
    var lx = wx + (lp % 2) * ww / 2, ly = wy + Math.floor(lp / 2) * wh / 2;
    ctx.fillStyle = PANELIT;
    ctx.fillRect(lx, ly, ww / 2, wh / 2);
    // mullions
    ctx.strokeStyle = GALLERY;
    ctx.lineWidth = Math.max(2, S * 0.004);
    ctx.beginPath();
    ctx.moveTo(wx + ww / 2, wy); ctx.lineTo(wx + ww / 2, wy + wh);
    ctx.moveTo(wx, wy + wh / 2); ctx.lineTo(wx + ww, wy + wh / 2);
    ctx.stroke();
    ctx.strokeStyle = FRAME;
    ctx.strokeRect(wx, wy, ww, wh);
    // sill block (some hangings)
    if (contents.sill) {
      ctx.fillStyle = PLINTH;
      ctx.fillRect(wx - 0.008 * S, wy + wh, ww + 0.016 * S, 0.014 * S);
    }
  }

  // ---------- the cube ----------
  function drawCube(w, h, act, offX, offY) {
    var g = geom(w, h), S = g.S;
    var fx = g.cx - g.cs / 2, fy = g.cy - g.cs / 2, cs = g.cs;

    // floor shadow
    ctx.fillStyle = 'rgba(0,0,0,0.42)';
    ctx.beginPath();
    ctx.ellipse(g.cx + g.dx * 0.4, fy + cs + 0.035 * S, cs * 0.62, 0.028 * S, 0, 0, Math.PI * 2);
    ctx.fill();

    // top + side faces (always concrete)
    ctx.fillStyle = CONC_TOP;
    ctx.beginPath();
    ctx.moveTo(fx, fy); ctx.lineTo(fx + cs, fy);
    ctx.lineTo(fx + cs + g.dx, fy + g.dy); ctx.lineTo(fx + g.dx, fy + g.dy);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = CONC_SIDE;
    ctx.beginPath();
    ctx.moveTo(fx + cs, fy); ctx.lineTo(fx + cs + g.dx, fy + g.dy);
    ctx.lineTo(fx + cs + g.dx, fy + cs + g.dy); ctx.lineTo(fx + cs, fy + cs);
    ctx.closePath(); ctx.fill();

    // front face: concrete base
    ctx.fillStyle = CONCRETE;
    ctx.fillRect(fx, fy, cs, cs);
    if (act < 0.98) {
      var sa = (1 - act * 0.85);
      for (var i = 0; i < speckles.length; i++) {
        var sp = speckles[i];
        ctx.fillStyle = sp.light ? 'rgba(255,255,255,' + (sp.a * sa).toFixed(3) + ')'
                                 : 'rgba(0,0,0,' + (sp.a * sa).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(fx + sp.u * cs, fy + sp.v * cs, sp.r * (S / 720 + 0.4), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // the cheat: the room re-drawn inside the face, shifted by the viewer offset
    if (act > 0.003) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(fx, fy, cs, cs);
      ctx.clip();
      ctx.globalAlpha = act;
      ctx.translate(offX + 1.5, offY - 1.0); // + deliberate mis-registration: the seam of the trick
      drawRoom(w, h);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // seams: edges stay concrete, the mechanism stays visible
    ctx.strokeStyle = EDGE;
    ctx.lineWidth = Math.max(1.5, S * 0.003);
    ctx.beginPath();
    ctx.moveTo(fx, fy); ctx.lineTo(fx + g.dx, fy + g.dy);
    ctx.moveTo(fx + cs, fy); ctx.lineTo(fx + cs + g.dx, fy + g.dy);
    ctx.moveTo(fx + cs + g.dx, fy + cs + g.dy); ctx.lineTo(fx + cs, fy + cs);
    ctx.stroke();
    ctx.strokeStyle = SEAM;
    ctx.lineWidth = Math.max(2, S * 0.0042);
    ctx.strokeRect(fx, fy, cs, cs);
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 1;
    ctx.strokeRect(fx + 3.5, fy + 3.5, cs - 7, cs - 7);
  }

  function drawRing(x, y, S, a) {
    if (a <= 0.01) return;
    var r = Math.max(10, 0.02 * S) * (isPhone() ? 1.25 : 1);
    ctx.strokeStyle = amber(0.62 * a);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = amber(0.35 * a);
    ctx.beginPath(); ctx.arc(x, y, r * 1.45, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = amber(0.8 * a);
    ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill();
  }

  // ---------- viewer: phantom cycle + pointer ----------
  var PHASE = 25;               // fixed first-frame phase (s): phantom selected, cube vanished
  var CYCLE = 50;
  function phantomA(t) {
    var tc = ((t % CYCLE) + CYCLE) % CYCLE;
    return smoothstep(20, 23, tc) * (1 - smoothstep(42, 45, tc));
  }
  function phantomPos(t, w, h) {
    var g = geom(w, h), tc = ((t % CYCLE) + CYCLE) % CYCLE;
    return {
      x: g.cx + 0.29 * g.S * Math.sin(2 * Math.PI * 2 * tc / CYCLE - 0.2),
      y: g.cy + 0.19 * g.S * Math.sin(2 * Math.PI * 3 * tc / CYCLE + 1.9)
    };
  }

  var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  function tNow() {
    var n = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    return PHASE + (n - startStamp) / 1000;
  }

  var pointer = { seen: false, x: 0, y: 0, t: -100, down: false };
  var act = 1;                                   // initialised to the analytic value at PHASE
  var viewer = phantomPos(PHASE, viewW, viewH);  // smoothed viewer position
  var lastViewer = { x: viewer.x, y: viewer.y };
  var viewerSpeed = 0;

  function pointerActiveAt(t) {
    if (!pointer.seen) return false;
    if (t - pointer.t > 6) return false;
    var g = geom(viewW, viewH);
    var dx = pointer.x - g.cx, dy = pointer.y - g.cy;
    return (dx * dx + dy * dy) < (0.62 * g.S) * (0.62 * g.S);
  }

  // ---------- optional lazy audio: room tone + servo whirr ----------
  var AC = null, servoGain = null, servoOsc = null;
  function ensureAudio() {
    if (AC) { if (AC.resume) AC.resume(); return; }
    try {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return;
      AC = new Ctor();
      // room tone: filtered noise, very low
      var len = 2 * AC.sampleRate;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var data = buf.getChannelData(0);
      var rng = mulberry32(777);
      for (var i = 0; i < len; i++) data[i] = rng() * 2 - 1;
      var src = AC.createBufferSource();
      src.buffer = buf; src.loop = true;
      var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
      var ng = AC.createGain(); ng.gain.value = 0.012;
      src.connect(lp); lp.connect(ng); ng.connect(AC.destination);
      src.start();
      // servo whirr: quiet saw through lowpass, gain driven by tracking
      servoOsc = AC.createOscillator();
      servoOsc.type = 'sawtooth'; servoOsc.frequency.value = 72;
      var slp = AC.createBiquadFilter(); slp.type = 'lowpass'; slp.frequency.value = 260;
      servoGain = AC.createGain(); servoGain.gain.value = 0;
      servoOsc.connect(slp); slp.connect(servoGain); servoGain.connect(AC.destination);
      servoOsc.start();
    } catch (e) { AC = null; }
  }
  function updateAudio() {
    if (!AC || !servoGain) return;
    try {
      var target = 0.016 * act * clamp(viewerSpeed / 260, 0, 1);
      servoGain.gain.setTargetAtTime(target, AC.currentTime, 0.08);
      servoOsc.frequency.setTargetAtTime(58 + 46 * act, AC.currentTime, 0.1);
    } catch (e) { /* audio is garnish; the piece is complete silent */ }
  }

  // ---------- pointer events: viewer, tap = re-hang, double-tap = reseed ----------
  var downInfo = null;
  var lastTapT = -100;
  function evtPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function onMove(e) {
    var p = evtPos(e);
    pointer.seen = true; pointer.x = p.x; pointer.y = p.y; pointer.t = tNow();
  }
  function onDown(e) {
    ensureAudio();
    onMove(e);
    pointer.down = true;
    downInfo = { x: pointer.x, y: pointer.y, t: tNow() };
  }
  function onUp(e) {
    onMove(e);
    pointer.down = false;
    if (!downInfo) return;
    var dx = pointer.x - downInfo.x, dy = pointer.y - downInfo.y;
    var dt = tNow() - downInfo.t;
    downInfo = null;
    if ((dx * dx + dy * dy) > 64 || dt > 0.35) return;   // it was a drag, not a tap
    var g = geom(viewW, viewH);
    var fx = g.cx - g.cs / 2, fy = g.cy - g.cs / 2;
    if (pointer.x > fx - 4 && pointer.x < fx + g.cs + g.dx + 4 &&
        pointer.y > fy + g.dy - 4 && pointer.y < fy + g.cs + 4) return; // taps on the cube do nothing
    var now = tNow();
    if (now - lastTapT < 0.4) {                            // double-tap: reseed the room
      seedBase = (Math.imul(seedBase, 1664525) + 1013904223) >>> 0;
      contentsIndex = 0;
      lastTapT = -100;
    } else {                                               // tap a wall: hang a new object
      contentsIndex++;
      lastTapT = now;
    }
    buildContents();
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointerleave', function () { pointer.t = -100; pointer.down = false; });
  }

  // ---------- render ----------
  function render(t, dt) {
    measure();
    var w = viewW, h = viewH;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var g = geom(w, h);
    var pA = phantomA(t);
    var usePointer = pointerActiveAt(t);
    var targetPos, targetAct, ringPos = null, ringA = 0;
    if (usePointer) {
      targetPos = { x: pointer.x, y: pointer.y };
      targetAct = 1;
      ringPos = targetPos; ringA = 1;
    } else if (pA > 0.001) {
      targetPos = phantomPos(t, w, h);
      targetAct = pA;
      ringPos = targetPos; ringA = pA;
    } else {
      targetPos = { x: g.cx, y: g.cy };
      targetAct = 0;
    }
    if (dt > 0) {
      var ka = Math.min(1, dt * 3.2), kv = Math.min(1, dt * 5);
      act += (targetAct - act) * ka;
      viewer.x += (targetPos.x - viewer.x) * kv;
      viewer.y += (targetPos.y - viewer.y) * kv;
      viewerSpeed = Math.sqrt(Math.pow(viewer.x - lastViewer.x, 2) + Math.pow(viewer.y - lastViewer.y, 2)) / Math.max(dt, 0.001);
    } else {
      viewerSpeed = 0;
    }
    lastViewer.x = viewer.x; lastViewer.y = viewer.y;

    drawRoom(w, h);
    var offX = (g.cx - viewer.x) * 0.38;
    var offY = (g.cy - viewer.y) * 0.38;
    drawCube(w, h, act, offX, offY);
    if (ringPos) drawRing(ringPos.x, ringPos.y, g.S, ringA * clamp(act + 0.25, 0, 1));
    updateAudio();
  }

  // synchronous fixed-phase first frame
  render(PHASE, 0);

  var lastT = PHASE;
  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      var t = tNow();
      var dt = Math.min(0.1, t - lastT);
      lastT = t;
      render(t, dt);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
