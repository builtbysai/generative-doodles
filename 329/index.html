<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.329 Ways of Protection</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#14120F; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.329 Ways of Protection (arunima-dazess-wangchuk).
// Nine elongated kite or lozenge textile forms hang in dark
// air, in three loose depth layers of three. Each kite is a
// path outline whose control points are displaced every
// frame by a layered wind field held as JS data. Inside each
// kite, two to four triangular windows are drawn as filled
// translucent triangles, layered so the light reads through
// the fabric. Each kite drifts slowly along a fear to hope
// axis, so its window glow moves between warning rose and
// wellbeing peach. A drag throws a gust through the field:
// the kites it passes deform, their windows brighten as
// they catch the light, and everything settles back over
// about fifteen seconds on per kite springs. One canvas,
// no text, no chrome.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var MADDER = '#A52A2A', TERRA = '#C96F4A', MUSTARD = '#D9A441', WOOL = '#E4D8C3';
var NEARBLACK = '#14120F', UMBER = '#4A3428', SLATE = '#3D4E5C';
var ROSE = '#E88B7D', PEACH = '#F2B28C', GROUND = '#14120F';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 11.3, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function st(col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
function hexRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mixRgb(a, b, t) {
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' +
    Math.round(a[1] + (b[1] - a[1]) * t) + ',' +
    Math.round(a[2] + (b[2] - a[2]) * t) + ')';
}
var ROSE_RGB = hexRgb(ROSE), PEACH_RGB = hexRgb(PEACH);

// ---- authored kite table ---------------------------------------
// Layer 0 hangs farthest back, smallest and dimmest; layer 2
// hangs in front, largest. Every kite has a vertical aspect
// near 1 to 2.5 (half height is 2.5 times half width, held
// in the geometry below). Windows are authored per kite as
// triangles in local units: x as a fraction of half width,
// y as a fraction of half height, always inside the lozenge.
var KITES = [
  { layer: 0, cx: 195, cy: 258, hw: 36, fabric: MADDER, edge: WOOL, phase: 0.3, axisPh: 1.1, axisSp: 0.21,
    windows: [[[-0.30, -0.52], [0.28, -0.52], [0.0, -0.18]], [[-0.36, 0.06], [0.08, -0.06], [0.02, 0.34]], [[-0.20, 0.46], [0.24, 0.42], [0.0, 0.72]]] },
  { layer: 0, cx: 622, cy: 205, hw: 33, fabric: SLATE, edge: WOOL, phase: 2.4, axisPh: 3.4, axisSp: 0.17,
    windows: [[[-0.34, -0.30], [0.30, -0.44], [0.02, 0.02]], [[-0.26, 0.30], [0.30, 0.22], [0.0, 0.62]]] },
  { layer: 0, cx: 1052, cy: 262, hw: 38, fabric: TERRA, edge: WOOL, phase: 4.1, axisPh: 5.2, axisSp: 0.19,
    windows: [[[-0.28, -0.60], [0.24, -0.66], [-0.02, -0.34]], [[-0.40, -0.06], [0.05, -0.20], [0.10, 0.16]], [[0.12, 0.10], [0.42, 0.28], [0.02, 0.44]], [[-0.22, 0.48], [0.20, 0.52], [0.0, 0.78]]] },
  { layer: 1, cx: 362, cy: 545, hw: 50, fabric: UMBER, edge: WOOL, phase: 1.5, axisPh: 2.2, axisSp: 0.15,
    windows: [[[-0.32, -0.55], [0.30, -0.48], [0.0, -0.20]], [[-0.38, 0.02], [0.0, -0.10], [0.06, 0.30]], [[-0.20, 0.42], [0.28, 0.38], [0.02, 0.70]]] },
  { layer: 1, cx: 802, cy: 498, hw: 47, fabric: MUSTARD, edge: UMBER, phase: 3.6, axisPh: 0.4, axisSp: 0.23,
    windows: [[[-0.30, -0.42], [0.34, -0.36], [0.02, -0.04]], [[-0.24, 0.34], [0.26, 0.44], [0.0, 0.72]]] },
  { layer: 1, cx: 1148, cy: 608, hw: 52, fabric: SLATE, edge: WOOL, phase: 5.3, axisPh: 4.5, axisSp: 0.16,
    windows: [[[-0.26, -0.62], [0.28, -0.56], [0.0, -0.28]], [[-0.42, -0.02], [-0.02, -0.16], [0.02, 0.24]], [[0.10, 0.16], [0.40, 0.34], [0.04, 0.52]], [[-0.24, 0.52], [0.22, 0.58], [0.0, 0.82]]] },
  { layer: 2, cx: 152, cy: 622, hw: 60, fabric: TERRA, edge: WOOL, phase: 0.9, axisPh: 2.9, axisSp: 0.18,
    windows: [[[-0.30, -0.58], [0.26, -0.64], [0.0, -0.30]], [[-0.44, -0.08], [0.02, -0.22], [0.08, 0.14]], [[0.14, 0.08], [0.44, 0.26], [0.06, 0.46]], [[-0.22, 0.50], [0.24, 0.54], [0.0, 0.80]]] },
  { layer: 2, cx: 560, cy: 606, hw: 64, fabric: MADDER, edge: WOOL, phase: 2.0, axisPh: 5.8, axisSp: 0.14,
    windows: [[[-0.34, -0.50], [0.30, -0.56], [-0.02, -0.18]], [[-0.36, 0.10], [0.10, -0.02], [0.04, 0.42]], [[-0.18, 0.50], [0.26, 0.46], [0.02, 0.76]]] },
  { layer: 2, cx: 985, cy: 330, hw: 58, fabric: NEARBLACK, edge: WOOL, phase: 4.7, axisPh: 1.7, axisSp: 0.20,
    windows: [[[-0.28, -0.54], [0.32, -0.46], [0.02, -0.16]], [[-0.30, 0.24], [0.28, 0.30], [0.0, 0.60]]] }
];
(function () {
  var i, counts = [0, 0, 0];
  if (KITES.length !== 9) throw new Error('Ways of Protection needs exactly 9 kites');
  for (i = 0; i < KITES.length; i++) {
    counts[KITES[i].layer]++;
    if (KITES[i].windows.length < 2 || KITES[i].windows.length > 4) throw new Error('Ways of Protection needs 2 to 4 windows per kite');
    var j, k;
    for (j = 0; j < KITES[i].windows.length; j++) {
      if (KITES[i].windows[j].length !== 3) throw new Error('Ways of Protection windows are triangles');
      for (k = 0; k < 3; k++) {
        if (Math.abs(KITES[i].windows[j][k][0]) > 0.55) throw new Error('Ways of Protection window outside kite width');
      }
    }
  }
  if (counts[0] !== 3 || counts[1] !== 3 || counts[2] !== 3) throw new Error('Ways of Protection needs 3 layers of 3 kites');
})();
// Per kite gust spring state: offset, velocity, glow lift.
(function () {
  var i;
  for (i = 0; i < KITES.length; i++) {
    KITES[i].gx = 0; KITES[i].gy = 0; KITES[i].gvx = 0; KITES[i].gvy = 0;
    KITES[i].bright = 0; KITES[i].brightV = 0;
  }
})();

// Base lozenge outline in local units, widest above centre
// with a long lower point. Half height is 2.5 times the
// half width unit, so the aspect holds near 1 to 2.5.
var OUTLINE = [
  [0.00, -1.00], [0.72, -0.58], [1.00, -0.06], [0.56, 0.52],
  [0.00, 1.00], [-0.56, 0.52], [-1.00, -0.06], [-0.72, -0.58]
];
function hhOf(k) { return k.hw * 2.5; }

// Layered wind displacement for a local point on one kite.
// The tail end of the fabric moves more than the head, and
// two slow sine layers cross so the deform never repeats
// simply. The gust spring offset is added whole.
function displace(k, lx, ly, t) {
  var hh = hhOf(k);
  var free = 0.30 + 0.70 * ((ly / hh) + 1) / 2;
  var w1 = Math.sin(t * 0.42 + k.phase + ly * 0.011 + k.layer * 0.9);
  var w2 = Math.sin(t * 0.93 + k.phase * 1.7 + ly * 0.021 + lx * 0.014);
  var dx = (w1 * 7.5 + w2 * 3.2) * free + k.gx * free;
  var dy = (Math.cos(t * 0.31 + k.phase + lx * 0.012) * 3.4) * free + k.gy * free;
  return [lx + dx, ly + dy];
}
function kitePose(k, t) {
  var swayX = 15 * Math.sin(t * 0.23 + k.phase) + 6 * Math.sin(t * 0.57 + k.phase * 2.1);
  var swayY = 8 * Math.cos(t * 0.19 + k.phase * 1.3);
  var rot = 0.055 * Math.sin(t * 0.27 + k.phase) + k.gx * 0.0016;
  return { x: k.cx + swayX + k.gx * 0.55, y: k.cy + swayY + k.gy * 0.55, rot: rot };
}
function place(k, lx, ly, t, pose) {
  var d = displace(k, lx, ly, t);
  var c = Math.cos(pose.rot), s = Math.sin(pose.rot);
  return [pose.x + d[0] * c - d[1] * s, pose.y + d[0] * s + d[1] * c];
}
function axisOf(k, t) { return 0.5 + 0.5 * Math.sin(t * k.axisSp + k.axisPh); }

function kitePath(k, t, pose) {
  var i, p;
  ctx.beginPath();
  for (i = 0; i < OUTLINE.length; i++) {
    p = place(k, OUTLINE[i][0] * k.hw, OUTLINE[i][1] * hhOf(k), t, pose);
    if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
  }
  ctx.closePath();
}
function drawKite(k, t) {
  var pose = kitePose(k, t);
  var axis = axisOf(k, t);
  var glow = mixRgb(ROSE_RGB, PEACH_RGB, axis);
  var depthDim = k.layer === 0 ? 0.62 : (k.layer === 1 ? 0.84 : 1);
  var lift = Math.max(0, Math.min(1, k.bright));
  var top = place(k, 0, -hhOf(k), t, pose);
  // Hanging string, running off the top of the frame from
  // the kite head, thin wool at low alpha.
  ctx.globalAlpha = 0.22 * depthDim;
  st(WOOL, 1.4);
  ctx.beginPath();
  ctx.moveTo(top[0], top[1]);
  ctx.lineTo(top[0] + 26 * Math.sin(k.phase) - 10, -20);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // Fabric body.
  kitePath(k, t, pose);
  ctx.globalAlpha = depthDim;
  ctx.fillStyle = k.fabric;
  ctx.fill();
  ctx.globalAlpha = 1;
  // Windows, clipped to the kite path so the light never
  // spills past the fabric edge. Each window is three
  // nested translucent fills of the same triangle, wide
  // and faint, then smaller and stronger, then a bright
  // core, so the glow is layered translucency only.
  ctx.save();
  kitePath(k, t, pose);
  ctx.clip();
  var wi, w, pts, cxw, cyw, sc, si, sj;
  for (wi = 0; wi < k.windows.length; wi++) {
    w = k.windows[wi];
    pts = [];
    cxw = 0; cyw = 0;
    for (si = 0; si < 3; si++) {
      pts.push(place(k, w[si][0] * k.hw, w[si][1] * hhOf(k), t, pose));
      cxw += pts[si][0] / 3; cyw += pts[si][1] / 3;
    }
    var layers = [
      { s: 1.30, a: 0.14 + 0.10 * lift },
      { s: 1.00, a: 0.42 + 0.20 * axis * 0.4 + 0.22 * lift },
      { s: 0.58, a: 0.50 + 0.24 * lift }
    ];
    for (sj = 0; sj < layers.length; sj++) {
      sc = layers[sj].s;
      ctx.globalAlpha = layers[sj].a * (0.55 + 0.45 * depthDim);
      ctx.fillStyle = glow;
      ctx.beginPath();
      for (si = 0; si < 3; si++) {
        var px = cxw + (pts[si][0] - cxw) * sc;
        var py = cyw + (pts[si][1] - cyw) * sc;
        if (si === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Window rim, a fine wool line on the base triangle.
    ctx.globalAlpha = 0.55 * depthDim;
    st(WOOL, 1.2);
    ctx.beginPath();
    for (si = 0; si < 3; si++) {
      if (si === 0) ctx.moveTo(pts[si][0], pts[si][1]); else ctx.lineTo(pts[si][0], pts[si][1]);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  // Spars and edge, drawn over the windows.
  var head = place(k, 0, -hhOf(k), t, pose);
  var tail = place(k, 0, hhOf(k), t, pose);
  var left = place(k, -k.hw, -0.06 * hhOf(k), t, pose);
  var right = place(k, k.hw, -0.06 * hhOf(k), t, pose);
  ctx.globalAlpha = 0.38 * depthDim;
  st(k.edge, 1.6);
  ctx.beginPath(); ctx.moveTo(head[0], head[1]); ctx.lineTo(tail[0], tail[1]); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(left[0], left[1]); ctx.lineTo(right[0], right[1]); ctx.stroke();
  ctx.globalAlpha = 1;
  kitePath(k, t, pose);
  ctx.globalAlpha = 0.85 * depthDim;
  st(k.edge, k.layer === 2 ? 2.4 : 1.8);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // Tail ties, two short strokes below the lower point.
  var t1 = place(k, -0.18 * k.hw, 1.10 * hhOf(k), t, pose);
  var t2 = place(k, 0.16 * k.hw, 1.16 * hhOf(k), t, pose);
  ctx.globalAlpha = 0.5 * depthDim;
  st(k.edge, 1.5);
  ctx.beginPath(); ctx.moveTo(tail[0], tail[1]); ctx.lineTo(t1[0], t1[1]); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(tail[0], tail[1]); ctx.lineTo(t2[0], t2[1]); ctx.stroke();
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, DW, DH);
  var order = [0, 1, 2, 3, 4, 5, 6, 7, 8];
  order.sort(function (a, b) { return KITES[a].layer - KITES[b].layer; });
  var i;
  for (i = 0; i < order.length; i++) drawKite(KITES[order[i]], T);
}

// ---- gust springs ------------------------------------------------
// Slow underdamped springs: the decay envelope runs near
// fifteen seconds, so a gust breathes out long after the
// drag has passed. Stiffness 1.15, damping 0.42.
function stepPhysics(dt) {
  var i, k;
  for (i = 0; i < KITES.length; i++) {
    k = KITES[i];
    k.gvx += (-1.15 * k.gx - 0.42 * k.gvx) * dt;
    k.gvy += (-1.15 * k.gy - 0.42 * k.gvy) * dt;
    k.gx += k.gvx * dt;
    k.gy += k.gvy * dt;
    k.brightV += (-1.60 * k.bright - 0.50 * k.brightV) * dt;
    k.bright += k.brightV * dt;
  }
}

// ---- interaction: drag to gust the field -------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
var drag = null;
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  drag = { x: p[0], y: p[1] };
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var p = toDesign(e);
  var dx = p[0] - drag.x, dy = p[1] - drag.y;
  drag.x = p[0]; drag.y = p[1];
  var speed = Math.sqrt(dx * dx + dy * dy);
  if (speed < 0.5) return;
  var i, k, ddx, ddy, d, fall;
  for (i = 0; i < KITES.length; i++) {
    k = KITES[i];
    var pose = kitePose(k, T);
    ddx = pose.x - p[0]; ddy = pose.y - p[1];
    d = Math.sqrt(ddx * ddx + ddy * ddy);
    if (d < 360) {
      fall = 1 - d / 360;
      fall = fall * fall;
      k.gvx += dx * 2.4 * fall;
      k.gvy += dy * 2.4 * fall;
      k.brightV += Math.min(3.2, speed * 0.10) * fall;
      // Clamp so no kite can ever be thrown out of frame.
      k.gvx = Math.max(-90, Math.min(90, k.gvx));
      k.gvy = Math.max(-90, Math.min(90, k.gvy));
      k.brightV = Math.max(-4, Math.min(4, k.brightV));
    }
  }
});
canvas.addEventListener('pointerup', function () { drag = null; });
canvas.addEventListener('pointercancel', function () { drag = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; stepPhysics(TICK); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
