<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Song, Revoiced</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #2a2a30; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (NR5 only, no other color).
  var FIELD = '#2a2a30';
  var GOLD = '#d9a441';
  var SCARLET = '#c1272d';
  var SEAM = '#e8e0d0';
  var BLUE = '#4a5a7a';
  var BROWN = '#6b4a3a';

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1492000);

  // Fixed melody path: 49 points across the frame, seeded undulation.
  // Stored in unit coordinates (x 0..1, y offset in units of height).
  var NPTS = 49;
  var ph1 = rng() * Math.PI * 2;
  var ph2 = rng() * Math.PI * 2;
  var a1 = 0.045 + rng() * 0.02;
  var a2 = 0.02 + rng() * 0.015;
  var path = [];
  var i;
  for (i = 0; i < NPTS; i++) {
    var u = i / (NPTS - 1);
    var y = 0.45
      + a1 * Math.sin(u * Math.PI * 3 + ph1)
      + a2 * Math.sin(u * Math.PI * 7 + ph2);
    path.push([0.02 + u * 0.96, y]);
  }

  var LOOP = 24;        // seconds: draw 0-16, hold 16-18, exit 18-24
  var DRAW_END = 16;
  var HOLD_END = 18;

  // Drag state: closed-form integral of rate over recorded segments.
  var drags = [];       // {start, end (null while active), rate}
  var activeDrag = null;

  function effTime(t) {
    var total = 0, prev = 0, j, seg, segEnd;
    for (j = 0; j < drags.length; j++) {
      seg = drags[j];
      if (t <= seg.start) { total += (t - prev); return total; }
      total += (seg.start - prev);
      segEnd = (seg.end === null) ? t : Math.min(t, seg.end);
      total += seg.rate * (segEnd - seg.start);
      prev = (seg.end === null) ? t : seg.end;
      if (seg.end !== null && t <= seg.end) return total;
    }
    total += (t - prev);
    return total;
  }

  function onDown(e) {
    var x = (e.clientX !== undefined) ? e.clientX : e.touches[0].clientX;
    activeDrag = { start: lastT, x0: x, rate: 1, end: null };
    drags.push(activeDrag);
  }
  function onMove(e) {
    if (!activeDrag) return;
    var x = (e.clientX !== undefined) ? e.clientX : e.touches[0].clientX;
    var dx = x - activeDrag.x0;
    var r = 1 + dx / 150;
    if (r < 0.25) r = 0.25;
    if (r > 3) r = 3;
    // Close the previous rate segment and open a new one at this time.
    activeDrag.end = lastT;
    activeDrag = { start: lastT, x0: x, rate: r, end: null };
    drags.push(activeDrag);
  }
  function onUp() {
    if (!activeDrag) return;
    activeDrag.end = lastT;
    activeDrag = null;
  }

  var lastT = 0;
  var W = 0, H = 0;

  function size() {
    var vw = (typeof window !== 'undefined' && window.visualViewport)
      ? window.visualViewport.width : window.innerWidth;
    var vh = (typeof window !== 'undefined' && window.visualViewport)
      ? window.visualViewport.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  function drawFigure(cx, cy, s, clothes, facing) {
    // Small abstract singer-figure, still: torso rect, head disc, dot eye.
    ctx.fillStyle = clothes;
    ctx.fillRect(cx - 0.28 * s, cy, 0.56 * s, 0.95 * s);
    ctx.beginPath();
    ctx.moveTo(cx, cy - 0.28 * s);
    ctx.arc(cx, cy - 0.28 * s, 0.30 * s, 0, Math.PI * 2);
    ctx.fillStyle = SEAM;
    ctx.fill();
    ctx.fillStyle = FIELD;
    ctx.fillRect(cx + facing * 0.10 * s, cy - 0.32 * s, 0.07 * s, 0.07 * s);
  }

  function draw(t) {
    lastT = t;
    size();
    var lt = effTime(t) % LOOP;

    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);

    // Seam: thin vertical cream line at the vertical center.
    var seamX = 0.5 * W;
    var seamW = Math.max(2, Math.round(W * 0.002));
    ctx.fillStyle = SEAM;
    ctx.fillRect(seamX - seamW / 2, 0, seamW, H);

    // Singer-figures at the lower corners, still, facing the line.
    var s = Math.min(W, H) * 0.055;
    drawFigure(0.12 * W, 0.80 * H, s, BLUE, 1);
    drawFigure(0.88 * W, 0.80 * H, s, BROWN, -1);

    // Melody progress: draw 0-16s, hold 16-18s, exit 18-24s.
    var p, exit;
    if (lt < DRAW_END) { p = lt / DRAW_END; exit = 0; }
    else if (lt < HOLD_END) { p = 1; exit = 0; }
    else { p = 1; exit = (lt - HOLD_END) / (LOOP - HOLD_END); }
    if (p <= 0) return;

    // Visible points: first p fraction of the path, translated right by exit.
    var exitPx = exit * (W * 1.15);
    var total = NPTS - 1;
    var cut = p * total;
    var pts = [];
    var k, x, y;
    for (k = 0; k <= Math.floor(cut); k++) {
      pts.push([path[k][0] * W + exitPx, path[k][1] * H]);
    }
    if (cut > Math.floor(cut) && Math.floor(cut) + 1 < NPTS) {
      var f = cut - Math.floor(cut);
      var a = path[Math.floor(cut)], b = path[Math.floor(cut) + 1];
      pts.push([(a[0] + (b[0] - a[0]) * f) * W + exitPx,
                (a[1] + (b[1] - a[1]) * f) * H]);
    }
    if (pts.length < 2) {
      // A single tip dot at the very start of the draw.
      ctx.fillStyle = GOLD;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      ctx.arc(pts[0][0], pts[0][1], Math.max(2, W * 0.003), 0, Math.PI * 2);
      ctx.fill();
      return;
    }

    // Split the polyline at the seam: gold thin before, scarlet thick after.
    // Every point is assigned to its side; a point exactly on the seam goes
    // to both lists, and a straddling segment contributes its interpolated
    // crossing point to both, so neither stroke has a gap at the seam.
    var goldPts = [], scarPts = [];
    var j, pt, nx, tt, cp;
    for (j = 0; j < pts.length; j++) {
      pt = pts[j];
      if (pt[0] < seamX) goldPts.push(pt);
      else if (pt[0] > seamX) scarPts.push(pt);
      else { goldPts.push(pt); scarPts.push(pt); }
      if (j + 1 < pts.length) {
        nx = pts[j + 1][0];
        if ((pt[0] < seamX && nx > seamX) || (pt[0] > seamX && nx < seamX)) {
          tt = (seamX - pt[0]) / (nx - pt[0]);
          cp = [seamX, pt[1] + (pts[j + 1][1] - pt[1]) * tt];
          goldPts.push(cp); scarPts.push(cp);
        }
      }
    }

    function stroke(list, color, width) {
      if (list.length < 2) return;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(list[0][0], list[0][1]);
      for (var m = 1; m < list.length; m++) ctx.lineTo(list[m][0], list[m][1]);
      ctx.stroke();
    }
    var thin = Math.max(2, W * 0.004);
    var thick = thin * 1.8;
    stroke(goldPts, GOLD, thin);
    stroke(scarPts, SCARLET, thick);
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { draw(lastT); });
    }
    window.addEventListener('resize', function () { draw(lastT); });
  }

  // Frame one at a constant phase; clock starts only with the rAF loop.
  draw(0);
  if (typeof window !== 'undefined' && typeof window.__piece === 'undefined') {
    window.__piece = {
      draw: draw,
      down: function (x) { onDown({ clientX: x }); },
      move: function (x) { onMove({ clientX: x }); },
      up: function () { onUp(); },
      setTime: function (t) { lastT = t; }
    };
  }
  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
