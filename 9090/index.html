<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9090 · Interference</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #EDE8D8; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var SEED = 9090;
  var PAPER = '#EDE8D8';

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(SEED);

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, S = 24;

  var waves = [];   // plane waves: {dx,dy,freq,speed,phase}
  var autos = [];   // drifting radial emitters
  var ptrE = null;  // pointer emitter (the stone)
  var dots = [];    // flat [x0,y0,x1,y1,...]

  var inkPal = [], accPal = [];
  (function () {
    for (var i = 0; i <= 20; i++) {
      var a = i / 20;
      inkPal.push('rgba(27,27,22,' + (0.07 + 0.85 * a).toFixed(2) + ')');
      accPal.push('rgba(179,64,42,' + (0.08 + 0.87 * a).toFixed(2) + ')');
    }
  })();

  function newWaves() {
    waves.length = 0;
    for (var i = 0; i < 3; i++) {
      var a = rng() * Math.PI * 2;
      waves.push({
        dx: Math.cos(a), dy: Math.sin(a),
        freq: 0.004 + rng() * 0.010,
        speed: 0.6 + rng() * 1.6,
        phase: rng() * Math.PI * 2
      });
    }
  }

  function newAutos() {
    autos = [
      { ax: 0.21, ay: 0.33, p1: rng() * 6.28, p2: rng() * 6.28,
        freq: 0.045, speed: 4.2, amp: 1.0, decay: 0.004, x: 0, y: 0 },
      { ax: 0.17, ay: 0.27, p1: rng() * 6.28, p2: rng() * 6.28,
        freq: 0.060, speed: 5.1, amp: 0.8, decay: 0.005, x: 0, y: 0 }
    ];
  }

  function emitVal(x, y, e) {
    var dx = x - e.x, dy = y - e.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var att = Math.exp(-dist * e.decay);
    if (att < 0.02) return 0;
    return e.amp * Math.sin(dist * e.freq - t * e.speed) * att;
  }

  function layout() {
    dots.length = 0;
    S = Math.max(18, Math.min(34, Math.round(Math.min(W, H) / 26)));
    for (var y = S / 2; y < H; y += S) {
      for (var x = S / 2; x < W; x += S) {
        dots.push(x, y);
      }
    }
  }

  function resize() {
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  }

  var t = 0, last = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
    last = ts;
    t += dt;

    var k;
    for (k = 0; k < autos.length; k++) {
      var e = autos[k];
      e.x = W * (0.5 + 0.38 * Math.sin(t * e.ax + e.p1));
      e.y = H * (0.5 + 0.38 * Math.sin(t * e.ay + e.p2));
    }
    if (ptrE && !ptrE.held) {
      ptrE.amp *= Math.pow(0.35, dt);
      if (ptrE.amp < 0.04) ptrE = null;
    }

    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    var nw = waves.length, na = autos.length;
    for (var d = 0; d < dots.length; d += 2) {
      var x = dots[d], y = dots[d + 1];
      var v = 0, i;
      for (i = 0; i < nw; i++) {
        var wv = waves[i];
        v += Math.sin((x * wv.dx + y * wv.dy) * wv.freq - t * wv.speed + wv.phase);
      }
      for (i = 0; i < na; i++) v += emitVal(x, y, autos[i]);
      if (ptrE) v += emitVal(x, y, ptrE);

      var nv = v / 4.2;
      if (nv > 1) nv = 1; else if (nv < -1) nv = -1;
      var m = nv < 0 ? -nv : nv;
      var idx = (m * 20) | 0;
      ctx.fillStyle = nv > 0.45 ? accPal[idx] : inkPal[idx];
      var r = 1 + (S * 0.40) * Math.pow(m, 0.65);
      ctx.fillRect(x - r / 2, y - r / 2, r, r);
    }
  }

  var lastTap = 0;
  cv.addEventListener('pointerdown', function (e) {
    ptrE = { x: e.clientX, y: e.clientY, freq: 0.05 + rng() * 0.03,
             speed: 5, amp: 0.6, decay: 0.006, held: true };
  });
  window.addEventListener('pointermove', function (e) {
    if (ptrE && ptrE.held) {
      ptrE.x = e.clientX; ptrE.y = e.clientY;
      ptrE.amp = Math.min(1.7, ptrE.amp + 0.25);
    }
  });
  window.addEventListener('pointerup', function () {
    if (ptrE) ptrE.held = false;
    var now = Date.now();
    if (now - lastTap < 320) {
      rng = mulberry32((Date.now() ^ SEED) >>> 0);
      newWaves();
      newAutos();
    }
    lastTap = now;
  });
  window.addEventListener('resize', resize);

  newWaves();
  newAutos();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
