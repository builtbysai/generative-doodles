<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>checkerboard fbm</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B0E14; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- palette (strict) ----------
  var GROUND = [11, 14, 20];      // #0B0E14
  var CHK_L  = [185, 198, 216];   // #B9C6D8
  var CHK_D  = [20, 26, 36];      // #141A24
  var STORM  = [232, 241, 255];   // #E8F1FF
  var SMOKE  = [90, 107, 133];    // #5A6B85

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(907068);

  // permutation table for value noise, built from the seeded stream
  var perm = new Uint8Array(512);
  (function () {
    var p = [], i, j, tmp;
    for (i = 0; i < 256; i++) p[i] = i;
    for (i = 255; i > 0; i--) { j = Math.floor(rng() * (i + 1)); tmp = p[i]; p[i] = p[j]; p[j] = tmp; }
    for (i = 0; i < 512; i++) perm[i] = p[i & 255];
  })();

  function lat(ix, iy) { return perm[(perm[ix & 255] + iy) & 255] / 255; }

  function vnoise(x, y) {
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = x - xi, yf = y - yi;
    var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    var X = xi & 255, Y = yi & 255;
    var a = lat(X, Y), b = lat(X + 1, Y), c = lat(X, Y + 1), d = lat(X + 1, Y + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }

  // 4-octave fbm; time drifts each octave's sample window at a different
  // rate so the field morphs instead of sliding rigidly. Pure in (x, y, t).
  function fbm(x, y, t) {
    var s = 0, amp = 0.5, f = 1, norm = 0, o;
    for (o = 0; o < 4; o++) {
      s += amp * vnoise(x * f + t * 0.011 * (1 + o * 0.37),
                        y * f + t * 0.007 * (1 + o * 0.53));
      norm += amp; amp *= 0.5; f *= 2.03;
    }
    return s / norm; // 0..1
  }

  function height(u, v, t) { return fbm(u * 3.1 + 7.3, v * 3.1 + 2.9, t); }

  // ---------- sizing (Visual Viewport API) ----------
  var W = 300, H = 300, N = 60, isPhone = false;

  function screenMinDim() {
    try {
      if (window.screen) {
        var m = Math.min(window.screen.width || 9999, window.screen.height || 9999);
        if (m > 0 && m < 9999) return m;
      }
    } catch (e) {}
    return -1;
  }

  function detectPhone(w, h) {
    var sm = screenMinDim();
    if (sm > 0) return sm < 700;
    return h > w * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = Math.max(60, Math.floor(w));
    H = Math.max(60, Math.floor(h));
    canvas.width = W;
    canvas.height = H;
    isPhone = detectPhone(W, H);
    N = isPhone ? 44 : 60;
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  // ---------- clock (animation only; frame one is a synchronous t=0 draw) ----------
  var hasPerf = (typeof performance !== 'undefined' && performance && typeof performance.now === 'function');
  var t0 = hasPerf ? performance.now() : Date.now();
  function clockT() {
    var n = hasPerf ? performance.now() : Date.now();
    return (n - t0) / 1000;
  }

  // ---------- recorded interaction events ----------
  // Light anchors: {t, x, y} target positions in field coords. The light
  // position at any time is a closed-form exponential approach across the
  // anchor segments.
  var lightAnchors = [{ t: 0, x: 0.66, y: 0.30 }];
  var taps = [];        // times of committed tap releases (short, still presses)
  var downInfo = null;  // {t, x, y} of the current press
  var dragging = false;

  function addAnchor(t, x, y) {
    var last = lightAnchors[lightAnchors.length - 1];
    if (last && (t - last.t) < 0.04 && Math.abs(x - last.x) < 0.008 && Math.abs(y - last.y) < 0.008) return;
    lightAnchors.push({ t: t, x: x, y: y });
    if (lightAnchors.length > 400) lightAnchors.splice(1, lightAnchors.length - 400);
  }

  // Closed-form light position: piecewise exponential approach toward the
  // active anchor target, integrated exactly segment by segment.
  function lightPosAt(t) {
    var px = lightAnchors[0].x, py = lightAnchors[0].y;
    var segT = 0, tx = px, ty = py, i, a, dt, k;
    for (i = 1; i < lightAnchors.length; i++) {
      a = lightAnchors[i];
      if (a.t > t) break;
      dt = a.t - segT;
      k = 1 - Math.exp(-dt / 0.14);
      px += (tx - px) * k;
      py += (ty - py) * k;
      segT = a.t; tx = a.x; ty = a.y;
    }
    dt = t - segT;
    k = 1 - Math.exp(-dt / 0.14);
    px += (tx - px) * k;
    py += (ty - py) * k;
    return { x: px, y: py };
  }

  // Parse taps into actions: a tap followed within 0.32 s by another tap is
  // a double-tap (flatten, committed at the second tap); a lone tap is a
  // surge committed 0.32 s after the tap (so a double-tap can pre-empt it).
  function actionsAt(t) {
    var surges = [], flats = [], i = 0, used;
    var sorted = taps.slice().sort(function (a, b) { return a - b; });
    used = [];
    while (i < sorted.length) {
      if (i + 1 < sorted.length && sorted[i + 1] - sorted[i] <= 0.32) {
        flats.push(sorted[i + 1]);
        i += 2;
      } else {
        surges.push(sorted[i] + 0.32);
        i += 1;
      }
    }
    return { surges: surges, flats: flats };
  }

  function smooth01(x) { x = x < 0 ? 0 : (x > 1 ? 1 : x); return x * x * (3 - 2 * x); }

  // fbm amplitude multiplier from flatten events (1 = full relief).
  function ampFactorAt(t, flats) {
    var f = 1, i, dt, e;
    for (i = 0; i < flats.length; i++) {
      dt = t - flats[i];
      if (dt < 0) continue;
      if (dt < 0.8) e = 1 - smooth01(dt / 0.8);            // sink
      else if (dt < 5.4) e = 0;                             // held flat ~4.6 s
      else if (dt < 6.2) e = smooth01((dt - 5.4) / 0.8);    // rise again
      else continue;
      if (e < f) f = e;
    }
    return f;
  }

  // Storm centre + intensity at time t.
  function stormAt(t, surges) {
    var cx = 0.10 + 0.05 * Math.sin(t * 0.021);
    var cy = 0.46 + 0.06 * Math.sin(t * 0.017 + 1.3);
    var inten = 1, i, q;
    for (i = 0; i < surges.length; i++) {
      q = (t - surges[i]) / 3.2;
      if (q >= 0 && q <= 1) {
        cx = -0.25 + q * 1.5;
        cy = 0.50 + 0.10 * Math.sin(q * Math.PI);
        inten = 0.75 + 0.60 * Math.sin(q * Math.PI);
      }
    }
    return { x: cx * W, y: cy * H, r: 0.55 * Math.min(W, H), inten: inten, surgeQ: surgeProgress(t, surges) };
  }

  function surgeProgress(t, surges) {
    var i, q;
    for (i = 0; i < surges.length; i++) {
      q = (t - surges[i]) / 3.2;
      if (q >= 0 && q <= 1) return q;
    }
    return -1;
  }

  function mix(a, b, k) {
    return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
  }
  function rgb(c) {
    var r = Math.max(0, Math.min(255, Math.round(c[0])));
    var g = Math.max(0, Math.min(255, Math.round(c[1])));
    var b = Math.max(0, Math.min(255, Math.round(c[2])));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  // ---------- audio (lazy, gesture-gated, guarded) ----------
  var AC = null;
  if (typeof AudioContext !== 'undefined') AC = AudioContext;
  else if (typeof webkitAudioContext !== 'undefined') AC = webkitAudioContext;
  var audio = null;

  function initAudio() {
    if (!AC || audio) return;
    try {
      var ac = new AC();
      var len = 2 * ac.sampleRate;
      var buf = ac.createBuffer(1, len, ac.sampleRate);
      var d = buf.getChannelData(0);
      var last = 0, i, white;
      var arng = mulberry32(4242);
      for (i = 0; i < len; i++) { // brown noise
        white = arng() * 2 - 1;
        last = (last + 0.02 * white) / 1.02;
        d[i] = last * 3.2;
      }
      var src = ac.createBufferSource();
      src.buffer = buf; src.loop = true;
      var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 150; lp.Q.value = 0.4;
      var rumbleGain = ac.createGain(); rumbleGain.gain.value = 0.14;
      src.connect(lp); lp.connect(rumbleGain); rumbleGain.connect(ac.destination);
      var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 500; bp.Q.value = 1.1;
      var windGain = ac.createGain(); windGain.gain.value = 0;
      src.connect(bp); bp.connect(windGain); windGain.connect(ac.destination);
      src.start();
      audio = { ac: ac, lp: lp, bp: bp, windGain: windGain };
    } catch (e) { audio = null; }
  }

  function updateAudio(light, storm) {
    if (!audio) return;
    try {
      var elev = 1 - Math.min(1, Math.abs(light.y - 0.5) + Math.abs(light.x - 0.5));
      audio.lp.frequency.value = 110 + 260 * elev;
      if (storm.surgeQ >= 0) {
        audio.windGain.gain.value = 0.20 * Math.sin(storm.surgeQ * Math.PI);
        audio.bp.frequency.value = 300 + 1200 * storm.surgeQ;
      } else {
        audio.windGain.gain.value = 0;
      }
    } catch (e) {}
  }

  // ---------- pointer interaction ----------
  function fieldCoords(ev) {
    var r = canvas.getBoundingClientRect();
    var x = (ev.clientX - r.left) / Math.max(1, r.width);
    var y = (ev.clientY - r.top) / Math.max(1, r.height);
    return { x: Math.max(0, Math.min(1, x)), y: Math.max(0, Math.min(1, y)) };
  }

  canvas.addEventListener('pointerdown', function (ev) {
    initAudio();
    if (audio && audio.ac && audio.ac.state === 'suspended') { try { audio.ac.resume(); } catch (e) {} }
    var p = fieldCoords(ev);
    var t = clockT();
    downInfo = { t: t, x: p.x, y: p.y, moved: false };
    dragging = true;
    addAnchor(t, p.x, p.y);
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (!dragging || !downInfo) return;
    var p = fieldCoords(ev);
    var t = clockT();
    if (Math.abs(p.x - downInfo.x) > 0.02 || Math.abs(p.y - downInfo.y) > 0.02) downInfo.moved = true;
    addAnchor(t, p.x, p.y);
  });
  function endPress(ev) {
    if (!downInfo) { dragging = false; return; }
    var t = clockT();
    if (!downInfo.moved && (t - downInfo.t) < 0.35) taps.push(t);
    downInfo = null;
    dragging = false;
  }
  canvas.addEventListener('pointerup', endPress);
  canvas.addEventListener('pointercancel', endPress);

  // ---------- render ----------
  var heights = null; // (N+1) x (N+1) corner heights, rebuilt per frame

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.fillStyle = rgb(GROUND);
    ctx.fillRect(0, 0, W, H);

    var acts = actionsAt(t);
    var ampF = ampFactorAt(t, acts.flats);
    var breathe = 1 + 0.08 * Math.sin(t * 0.05);
    var ampPx = 0.17 * Math.min(W, H) * ampF * breathe;
    var light = lightPosAt(t);
    var storm = stormAt(t, acts.surges);

    // light direction (from field position, fixed elevation component)
    var lx = (light.x - 0.5) * 1.7, ly = (light.y - 0.5) * 1.7, lz = 0.85;
    var ll = Math.sqrt(lx * lx + ly * ly + lz * lz);
    lx /= ll; ly /= ll; lz /= ll;

    // corner heights; the grid overscans the frame on all sides so the
    // displaced sheet covers the full frame at any height
    var n1 = N + 1, i, j, u, v;
    if (!heights || heights.length !== n1 * n1) heights = new Float32Array(n1 * n1);
    for (j = 0; j < n1; j++) {
      v = -0.22 + (j / N) * 1.44;
      for (i = 0; i < n1; i++) {
        u = -0.07 + (i / N) * 1.14;
        heights[j * n1 + i] = 0.5 + (height(u, v, t) - 0.5) * ampF;
      }
    }

    var topMargin = ampPx;
    var fieldH = H - ampPx;
    var xOff = -0.07 * W, yOff = topMargin - 0.22 * fieldH;
    var cw = W * 1.14 / N, ch = fieldH * 1.44 / N;
    var relief = 2.1; // gradient-to-normal strength

    function cornerX(i, h) { return xOff + i * cw + (h - 0.5) * ampPx * 0.25; }
    function cornerY(j, h) { return yOff + j * ch - h * ampPx; }

    // draw rows top to bottom so lower rows overlap displaced uppers
    for (j = 0; j < N; j++) {
      for (i = 0; i < N; i++) {
        var hTL = heights[j * n1 + i],     hTR = heights[j * n1 + i + 1];
        var hBL = heights[(j + 1) * n1 + i], hBR = heights[(j + 1) * n1 + i + 1];
        var hc = (hTL + hTR + hBL + hBR) * 0.25;
        // gradient in field units (per-cell steps span 1.14 / 1.44 of field)
        var gx = ((hTR + hBR) - (hTL + hBL)) * 0.5 * N / (3.1 * 1.14) * 0.32;
        var gy = ((hBL + hBR) - (hTL + hTR)) * 0.5 * N / (3.1 * 1.44) * 0.32;
        var nx = -gx * relief, ny = -gy * relief, nz = 1;
        var nl = Math.sqrt(nx * nx + ny * ny + nz * nz);
        var diff = (nx * lx + ny * ly + nz * lz) / nl;
        if (diff < 0) diff = 0;
        var shade = 0.22 + 0.98 * diff;
        var ao = 0.52 + 0.48 * hc;
        var base = ((i + j) % 2 === 0) ? CHK_L : CHK_D;
        var c = [base[0] * shade * ao, base[1] * shade * ao, base[2] * shade * ao];

        // storm: smoke haze at the boundary band, bright wash inside
        var ccx = xOff + (i + 0.5) * cw, ccy = yOff + (j + 0.5) * ch - hc * ampPx;
        var dx = ccx - storm.x, dy = ccy - storm.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        var s = 1 - smooth01((d - storm.r * 0.35) / (storm.r * 0.65));
        s *= storm.inten;
        if (s > 0.01) {
          var band = 4 * s * (1 - s); // peaks mid-falloff
          c = mix(c, SMOKE, Math.min(1, band) * 0.45);
          c = mix(c, STORM, Math.min(1, s) * 0.78);
        }

        ctx.fillStyle = rgb(c);
        ctx.beginPath();
        ctx.moveTo(cornerX(i, hTL), cornerY(j, hTL));
        ctx.lineTo(cornerX(i + 1, hTR), cornerY(j, hTR));
        ctx.lineTo(cornerX(i + 1, hBR), cornerY(j + 1, hBR));
        ctx.lineTo(cornerX(i, hBL), cornerY(j + 1, hBL));
        ctx.closePath();
        ctx.fill();
      }
    }

    updateAudio(light, storm);
  }

  // frame one: synchronous draw at t = 0
  draw(0);

  // animation loop, anchored as elapsed-since-load
  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(clockT());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
