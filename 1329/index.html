<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>God Painting</title>
<style>
  html, body { margin: 0; padding: 0; background: #B3121B; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  // Seeded PRNG (mulberry32). No Math.random anywhere in this piece.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var RED = "#B3121B", DARK = "#4A0B0E", RIDGE = "#D93B2C", UNDERCUT = "#1F0608";

  // ---- Layout, generated once from a seeded stream (deterministic) ----
  var rng = mulberry32(1329000);
  var ROWS = [];
  var rowCount = 7;
  var yCursor = 0.0;
  var brokenIndex = -1;
  var totalAlmonds = 0;
  (function buildLayout() {
    var counts = [];
    var i, r;
    for (i = 0; i < rowCount; i++) {
      counts.push(4 + Math.floor(rng() * 4)); // 4..7 per row
    }
    var total = 0;
    for (i = 0; i < counts.length; i++) total += counts[i];
    brokenIndex = Math.floor(rng() * total);
    var y = 0.10; // top breathing margin region; rows spread over 0.10..0.90
    for (r = 0; r < rowCount; r++) {
      var n = counts[r];
      var row = { y: y, phase: rng() * Math.PI * 2, almonds: [] };
      var j;
      for (j = 0; j < n; j++) {
        var fx = (j + 0.5) / n + (rng() - 0.5) * 0.05;
        row.almonds.push({
          fx: fx,
          wJit: 0.85 + rng() * 0.3,
          hJit: 0.85 + rng() * 0.3,
          idx: totalAlmonds++
        });
      }
      ROWS.push(row);
      // Irregular vertical rhythm: gap varies per row.
      y += 0.105 + rng() * 0.03;
    }
  })();

  // Seeded impasto flecks (precomputed, drawn as flat-alpha dots).
  var FLECKS = [];
  (function buildFlecks() {
    var fr = mulberry32(1329001);
    var i;
    for (i = 0; i < 900; i++) {
      FLECKS.push({ x: fr(), y: fr(), r: 0.6 + fr() * 1.8, a: 0.04 + fr() * 0.08, light: fr() > 0.5 });
    }
  })();

  // ---- State: closed-form functions of recorded events and piece time ----
  var taps = [];    // {t, x, y, almond}
  var streaks = []; // {t, x1, y1, x2, y2}
  var pieceT = 0;   // seconds since the rAF loop started; frame one is t = 0
  var started = false;
  var startStamp = 0;
  var W = 0, H = 0, S = 0; // viewport w/h, min dimension
  var isPhone = false;

  function size() {
    var vp = (typeof visualViewport !== "undefined" && visualViewport) ? visualViewport : null;
    W = vp ? vp.width : window.innerWidth;
    H = vp ? vp.height : window.innerHeight;
    var sw = (typeof window.screen !== "undefined") ? window.screen.width : W;
    var sh = (typeof window.screen !== "undefined") ? window.screen.height : H;
    var minDim = Math.min(sw, sh);
    isPhone = minDim < 700 || (H > W * 1.15 && Math.min(W, H) < 700);
    canvas.width = Math.round(W);
    canvas.height = Math.round(H);
    canvas.style.width = Math.round(W) + "px";
    canvas.style.height = Math.round(H) + "px";
    S = Math.min(W, H);
  }

  function almondPath(cx, cy, a, b) {
    // Vesica piscis (lens): two quadratic curves meeting at pointed ends.
    ctx.beginPath();
    ctx.moveTo(cx - a, cy);
    ctx.quadraticCurveTo(cx, cy - b * 1.25, cx + a, cy);
    ctx.quadraticCurveTo(cx, cy + b * 1.25, cx - a, cy);
    ctx.closePath();
  }

  function nearestAlmond(x, y) {
    var best = null, bestD = 1e9, r, a, ax, ay, d;
    var margin = W * 0.08;
    var fieldW = W - margin * 2;
    var fieldH = H - margin * 2;
    for (r = 0; r < ROWS.length; r++) {
      for (a = 0; a < ROWS[r].almonds.length; a++) {
        ax = margin + ROWS[r].almonds[a].fx * fieldW;
        ay = margin + ROWS[r].y * fieldH;
        d = Math.hypot(x - ax, y - ay);
        if (d < bestD) { bestD = d; best = ROWS[r].almonds[a]; }
      }
    }
    if (best && bestD < S * 0.09) return best;
    return null;
  }

  function draw(t) {
    size();
    var margin = W * 0.08;
    var fieldW = W - margin * 2;
    var fieldH = H - margin * 2;

    // The red field IS the world.
    ctx.fillStyle = RED;
    ctx.fillRect(0, 0, W, H);

    // Impasto texture: seeded flecks, flat alpha only.
    var i, f;
    for (i = 0; i < FLECKS.length; i++) {
      f = FLECKS[i];
      ctx.fillStyle = f.light ? "rgba(217,59,44,0.10)" : "rgba(31,6,8,0.10)";
      ctx.beginPath();
      ctx.moveTo(f.x * W + f.r, f.y * H);
      ctx.arc(f.x * W, f.y * H, f.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Almonds, breathing on a 12 s cycle, each row phase-offset, never synced.
    var r, a, al, cx, cy, baseA, baseB, breathe, aw, ah, depth, age, tap, k;
    for (r = 0; r < ROWS.length; r++) {
      breathe = 1 + 0.06 * Math.sin((Math.PI * 2 * t) / 12 + ROWS[r].phase);
      for (a = 0; a < ROWS[r].almonds.length; a++) {
        al = ROWS[r].almonds[a];
        cx = margin + al.fx * fieldW;
        cy = margin + ROWS[r].y * fieldH;
        baseA = fieldW * 0.055 * al.wJit;
        baseB = fieldH * 0.032 * al.hJit;
        aw = baseA * breathe;
        ah = baseB * breathe;

        // Undercut shadow, offset down-right (flat alpha).
        ctx.fillStyle = "rgba(31,6,8,0.45)";
        almondPath(cx + 3, cy + 4, aw, ah);
        ctx.fill();

        // Carved dark inset.
        ctx.fillStyle = DARK;
        almondPath(cx, cy, aw, ah);
        ctx.fill();

        // Palette-knife ridge catching light along the upper edge.
        ctx.strokeStyle = "rgba(217,59,44,0.55)";
        ctx.lineWidth = Math.max(1, S * 0.002);
        ctx.beginPath();
        ctx.moveTo(cx - aw * 0.85, cy - ah * 0.25);
        ctx.quadraticCurveTo(cx, cy - ah * 1.05, cx + aw * 0.85, cy - ah * 0.25);
        ctx.stroke();

        // Broken almond: half-carved, abandoned — upper half stays red.
        if (al.idx === brokenIndex) {
          ctx.fillStyle = RED;
          ctx.beginPath();
          ctx.moveTo(cx - aw, cy);
          ctx.quadraticCurveTo(cx, cy - ah * 1.25, cx + aw, cy);
          ctx.lineTo(cx + aw, cy);
          ctx.lineTo(cx - aw, cy);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "rgba(31,6,8,0.5)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(cx - aw, cy);
          ctx.lineTo(cx + aw, cy);
          ctx.stroke();
        }

        // Touch deepening: deepens over 0.5 s, re-fills with red over 20 s.
        for (k = 0; k < taps.length; k++) {
          tap = taps[k];
          if (tap.almond !== al) continue;
          age = t - tap.t;
          if (age < 0 || age > 20.5) continue;
          depth = age < 0.5 ? age / 0.5 : 1 - (age - 0.5) / 20;
          if (depth <= 0) continue;
          ctx.fillStyle = "rgba(31,6,8," + (0.55 * depth).toFixed(3) + ")";
          almondPath(cx, cy, aw, ah);
          ctx.fill();
        }
      }
    }

    // Drag knife-ridge streaks, fading over 6 s.
    for (i = 0; i < streaks.length; i++) {
      age = t - streaks[i].t;
      if (age < 0 || age > 6) continue;
      ctx.strokeStyle = "rgba(217,59,44," + (0.5 * (1 - age / 6)).toFixed(3) + ")";
      ctx.lineWidth = Math.max(1, S * 0.0025);
      ctx.beginPath();
      ctx.moveTo(streaks[i].x1, streaks[i].y1);
      ctx.lineTo(streaks[i].x2, streaks[i].y2);
      ctx.stroke();
    }
  }

  function loop(stamp) {
    if (!started) { started = true; startStamp = stamp; }
    pieceT = (stamp - startStamp) / 1000;
    draw(pieceT);
    if (typeof requestAnimationFrame !== "undefined") {
      requestAnimationFrame(loop);
    }
  }

  // Interaction: tap deepens the nearest almond; drag leaves ridge streaks.
  var downPos = null, moved = false;
  function pos(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  canvas.addEventListener("pointerdown", function (e) {
    downPos = pos(e); moved = false;
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!downPos) return;
    var p = pos(e);
    if (Math.hypot(p.x - downPos.x, p.y - downPos.y) > 6) {
      moved = true;
      streaks.push({ t: pieceT, x1: downPos.x, y1: downPos.y, x2: p.x, y2: p.y });
      downPos = p;
    }
  });
  function endPointer(e) {
    if (!downPos) return;
    var p = pos(e);
    if (!moved) {
      var al = nearestAlmond(p.x, p.y);
      if (al) taps.push({ t: pieceT, x: p.x, y: p.y, almond: al });
    }
    downPos = null; moved = false;
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", function () { downPos = null; moved = false; });

  if (typeof window !== "undefined") {
    window.addEventListener("resize", function () { draw(pieceT); });
    if (typeof visualViewport !== "undefined" && visualViewport) {
      visualViewport.addEventListener("resize", function () { draw(pieceT); });
    }
  }

  // Frame one: exactly t = 0, drawn synchronously at load. The clock
  // starts only with the rAF loop, so the first frame is deterministic.
  draw(0);
  if (typeof requestAnimationFrame !== "undefined") {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
