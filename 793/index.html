<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Triangle</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F4F4F2; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict)
  var WALL = '#F4F4F2';
  var DOOR = '#232323';
  var BLACK = '#1A1A1A';
  var CANVAS_GROUND = '#EFEDE6';
  var ORANGE = '#E06A1B';

  var LOOP = 24;          // seconds, seamless
  var PHASE = 2.4;        // frame one sits 2.4 s into the loop (see process.md)
  var STAMP_GAP = 0.3;    // one imprint every 300 ms
  var STAMP_DUR = 0.2;    // press-and-lift duration
  var HOLD_END = 16.3;    // stamping ends 8.3 s; hold to 16.3 s (about 8 s)
  var FADE_END = 19.3;    // 3 s fade out, then quiet until the loop wraps

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  if (document.body && document.body.style) document.body.style.background = WALL;

  var W = 0, H = 0, dpr = 1;
  var dabs = [];        // triangle imprints, stamp order apex-first
  var layers = [];      // interior canvases: {x, y, w, h, dabs:[...]}
  var door = { x: 0, y: 0, w: 0, h: 0 };

  // One Toroni dab: squarish mark, bristle hairlines denser at the top edge
  // where the brush first pressed, drier toward the bottom.
  function makeDab(rand, x, y, s) {
    var streaks = [];
    var n = 22 + Math.floor(rand() * 10);
    var i, fx, len, a;
    for (i = 0; i < n; i++) {
      fx = (rand() * 2 - 1) * 0.44;
      len = 0.35 + rand() * 0.6;
      a = 0.10 + rand() * 0.22;
      streaks.push({ fx: fx, len: len, a: a, w: 0.6 + rand() * 1.1, drift: (rand() * 2 - 1) * 0.03 });
    }
    // dense short strokes in the top third: the press
    var m = 9 + Math.floor(rand() * 5);
    for (i = 0; i < m; i++) {
      fx = (rand() * 2 - 1) * 0.44;
      len = 0.10 + rand() * 0.22;
      a = 0.22 + rand() * 0.30;
      streaks.push({ fx: fx, len: len, a: a, w: 0.6 + rand() * 1.0, drift: (rand() * 2 - 1) * 0.02 });
    }
    // a few dry gaps where the ground shows through the bristles
    var gaps = [];
    var g = 4 + Math.floor(rand() * 4);
    for (i = 0; i < g; i++) {
      gaps.push({ fx: (rand() * 2 - 1) * 0.42, len: 0.3 + rand() * 0.6, a: 0.10 + rand() * 0.16, w: 0.5 + rand() * 0.9 });
    }
    return {
      x: x, y: y, s: s,
      rot: (rand() * 2 - 1) * 0.035,
      baseA: 0.78 + rand() * 0.14,
      streaks: streaks, gaps: gaps
    };
  }

  function layout() {
    var u = Math.min(W, H);
    var cx = W / 2;
    var rand = mulberry32(79397);

    // Doorway: centered, lower half, nearly reaching the bottom edge.
    door.w = 0.40 * u;
    door.x = cx - door.w / 2;
    door.y = 0.54 * H;
    door.h = 0.985 * H - door.y;

    // Triangle lattice: rows of 1..7, apex first, clipped by the triangle.
    var apexY = 0.055 * H;
    var baseY = 0.485 * H;
    var dy = (baseY - apexY) / 6;
    var dx = door.w * 0.215;
    var dabS = dx * 0.46;
    dabs = [];
    var r, i;
    for (r = 1; r <= 7; r++) {
      for (i = 0; i < r; i++) {
        var x = cx + (i - (r - 1) / 2) * dx;
        var y = apexY + (r - 1) * dy;
        dabs.push(makeDab(rand, x, y, dabS));
      }
    }

    // Interior: three nested canvases seen through the doorway, each
    // carrying a sparse grid of orange imprints.
    layers = [];
    var defs = [
      { inset: 0.10, top: 0.07, cols: 4, rows: 5, fill: 0.62 },
      { inset: 0.24, top: 0.18, cols: 3, rows: 4, fill: 0.66 },
      { inset: 0.37, top: 0.29, cols: 2, rows: 3, fill: 0.75 }
    ];
    for (var li = 0; li < defs.length; li++) {
      var d = defs[li];
      var lx = door.x + door.w * d.inset;
      var lw = door.w * (1 - 2 * d.inset);
      var ly = door.y + door.h * d.top;
      var lh = door.y + door.h * 0.93 - ly;
      var ld = [];
      var os = Math.min(lw / d.cols, lh / d.rows) * 0.34;
      for (var gy = 0; gy < d.rows; gy++) {
        for (var gx = 0; gx < d.cols; gx++) {
          if (rand() > d.fill) continue;
          var px = lx + lw * (gx + 0.5) / d.cols + (rand() * 2 - 1) * os * 0.2;
          var py = ly + lh * (gy + 0.5) / d.rows + (rand() * 2 - 1) * os * 0.2;
          ld.push(makeDab(rand, px, py, os));
        }
      }
      layers.push({ x: lx, y: ly, w: lw, h: lh, dabs: ld });
    }
  }

  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function drawDab(d, color, gapColor, alphaMul, scale) {
    if (alphaMul <= 0.003) return;
    var s = d.s;
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alphaMul * d.baseA;
    ctx.fillStyle = color;
    roundRectPath(-s / 2, -s / 2, s, s, s * 0.20);
    ctx.fill();
    var i, st;
    ctx.strokeStyle = color;
    ctx.lineCap = 'round';
    for (i = 0; i < d.streaks.length; i++) {
      st = d.streaks[i];
      ctx.globalAlpha = alphaMul * st.a;
      ctx.lineWidth = st.w;
      ctx.beginPath();
      ctx.moveTo(st.fx * s, -s / 2);
      ctx.lineTo((st.fx + st.drift) * s, -s / 2 + st.len * s);
      ctx.stroke();
    }
    ctx.strokeStyle = gapColor;
    for (i = 0; i < d.gaps.length; i++) {
      st = d.gaps[i];
      ctx.globalAlpha = alphaMul * st.a;
      ctx.lineWidth = st.w;
      ctx.beginPath();
      ctx.moveTo(st.fx * s, -s / 2);
      ctx.lineTo(st.fx * s, -s / 2 + st.len * s);
      ctx.stroke();
    }
    ctx.restore();
  }

  function triState(k, T) {
    // returns {alpha, scale} for imprint k at loop time T
    if (T >= FADE_END) return { alpha: 0, scale: 1 };
    var local = T - k * STAMP_GAP;
    if (local < 0) return { alpha: 0, scale: 1.06 };
    var a, sc;
    if (local < STAMP_DUR) {
      var p = local / STAMP_DUR;
      a = p; sc = 1.06 - 0.06 * p;
    } else { a = 1; sc = 1; }
    if (T > HOLD_END) a *= 1 - (T - HOLD_END) / (FADE_END - HOLD_END);
    return { alpha: a, scale: sc };
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var T = (PHASE + t) % LOOP;

    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);

    // Doorway
    ctx.globalAlpha = 1;
    ctx.fillStyle = DOOR;
    ctx.fillRect(door.x, door.y, door.w, door.h);

    // Interior canvases drawn at full strength, then dimmed by a veil of
    // doorway dark whose depth follows an independent 12 s breath, as if
    // someone is passing inside and the light in there rises and falls.
    var bright = 0.50 + 0.50 * (0.5 - 0.5 * Math.cos(2 * Math.PI * T / 12));
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = CANVAS_GROUND;
    ctx.fillRect(door.x + door.w * 0.04, door.y + door.h * 0.03, door.w * 0.92, door.h * 0.94);
    var li, di;
    for (li = 0; li < layers.length; li++) {
      var L = layers[li];
      ctx.globalAlpha = 1;
      ctx.fillStyle = CANVAS_GROUND;
      ctx.fillRect(L.x, L.y, L.w, L.h);
      // canvas edge, so the nesting reads in the dim interior
      ctx.globalAlpha = 0.38;
      ctx.strokeStyle = DOOR;
      ctx.lineWidth = 2;
      ctx.strokeRect(L.x, L.y, L.w, L.h);
      ctx.globalAlpha = 1;
      for (di = 0; di < L.dabs.length; di++) {
        drawDab(L.dabs[di], ORANGE, CANVAS_GROUND, 1, 1);
      }
    }
    ctx.globalAlpha = (1 - bright) * 0.62;
    ctx.fillStyle = DOOR;
    ctx.fillRect(door.x, door.y, door.w, door.h);
    ctx.globalAlpha = 1;

    // The triangle of black imprints above the doorway
    for (var k = 0; k < dabs.length; k++) {
      var st = triState(k, T);
      if (st.alpha > 0.003) drawDab(dabs[k], BLACK, WALL, st.alpha, st.scale);
    }
    ctx.globalAlpha = 1;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var screenMin = window.screen ? Math.min(window.screen.width, window.screen.height) : Math.min(w, h);
    var phone = screenMin < 700 || h > w * 1.15; // house detection; layout is proportional either way
    void phone;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(w); H = Math.round(h);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
    draw(lastT);
  }

  var lastT = 0;
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();
  draw(0);

  if (typeof requestAnimationFrame === 'function') {
    var start = null;
    var step = function (ts) {
      if (start === null) start = ts;
      lastT = (ts - start) / 1000;
      draw(lastT);
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
})();
</script>
</body>
</html>
