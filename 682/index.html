<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combarbalita Choir</title>
<style>
  html, body { margin: 0; padding: 0; background: #14100F; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict) ----------
  var STONE_PINK = '#C4908E';
  var STONE_MAUVE = '#A66A6B';
  var CARVED = '#5E3535';
  var GROUND = '#14100F';
  var RING_LIGHT = '#F5D9A8';
  var RING_GLOW = '#7A5A4A';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, PHONE = false;

  function resize() {
    var w, h;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    } else {
      w = window.innerWidth;
      h = window.innerHeight;
    }
    W = w; H = h;
    canvas.width = Math.max(1, Math.round(w));
    canvas.height = Math.max(1, Math.round(h));
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    PHONE = (minDim > 0 && minDim < 700) || (h > w * 1.15);
  }
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);
  resize();

  // ---------- time: anchored clock, never frame one from Date.now ----------
  var T0 = null;
  function elapsed(now) {
    if (T0 === null) T0 = now;
    return (now - T0) / 1000;
  }

  // ---------- carved channel systems (seeded, built once) ----------
  // Each block face carries a maze-walk carving: walks on a 6x8 occupancy
  // grid that only step into unvisited cells, so channels wind, branch and
  // stop at walls but never cross. Shared occupancy across a block's walks
  // means later channels respect earlier ones, like real carved separations.
  // Paths are stored as fractions of block width/height, centered on 0.
  function genCarving(rnd, coverage) {
    var C = 6, R = 8, N = C * R;
    var occ = [];
    for (var i = 0; i < N; i++) occ.push(false);
    var paths = [];
    var target = Math.floor(N * coverage);
    var filled = 0, attempts = 0;
    var DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    while (filled < target && attempts < 60) {
      attempts++;
      var si = Math.floor(rnd() * N);
      if (occ[si]) continue;
      var cx = si % C, cy = Math.floor(si / C);
      var path = [[cx, cy]];
      occ[si] = true; filled++;
      var guard = 0;
      while (guard++ < 80 && filled < target) {
        var opts = [];
        for (var d = 0; d < 4; d++) {
          var nx = cx + DIRS[d][0], ny = cy + DIRS[d][1];
          if (nx >= 0 && nx < C && ny >= 0 && ny < R && !occ[ny * C + nx]) opts.push([nx, ny]);
        }
        if (!opts.length) break;
        var nxt = opts[Math.floor(rnd() * opts.length)];
        cx = nxt[0]; cy = nxt[1];
        occ[cy * C + cx] = true; filled++;
        path.push([cx, cy]);
      }
      paths.push(path);
    }
    // convert cell paths to centered fractions with an inset margin
    var out = [];
    for (var p = 0; p < paths.length; p++) {
      var pts = [];
      for (var k = 0; k < paths[p].length; k++) {
        pts.push([
          ((paths[p][k][0] + 0.5) / C - 0.5) * 0.84,
          ((paths[p][k][1] + 0.5) / R - 0.5) * 0.86
        ]);
      }
      out.push(pts);
    }
    return out;
  }

  // ---------- the nine blocks (fixed layout, seeded character) ----------
  // grid position in unit space; tone alternates pink/mauve on the
  // checkerboard with an occasional seeded swap; rotation is a slight
  // seeded tilt; carving density varies per block.
  var FREQ = [196.00, 174.61, 164.81, 146.83, 130.81, 123.47, 110.00, 98.00, 87.31];
  var blocks = [];
  (function buildBlocks() {
    var rnd = mulberry32(682001);
    for (var row = 0; row < 3; row++) {
      for (var col = 0; col < 3; col++) {
        var idx = row * 3 + col;
        var tone = ((col + row) % 2 === 0) ? STONE_PINK : STONE_MAUVE;
        if (rnd() < 0.22) tone = (tone === STONE_PINK) ? STONE_MAUVE : STONE_PINK;
        var coverage = 0.30 + rnd() * 0.38; // no two faces alike
        blocks.push({
          idx: idx, col: col, row: row,
          tone: tone,
          rot: (rnd() * 2 - 1) * 0.05,
          carving: genCarving(mulberry32(682100 + idx * 37), coverage),
          strikes: [],
          lastStrikeT: -10
        });
      }
    }
  })();

  // block geometry for the current frame size (center two-thirds)
  function blockGeom(b) {
    var unit = Math.min(W, H);
    var grid = unit * (2 / 3);
    var gx = (W - grid) / 2, gy = (H - grid) / 2;
    var cell = grid / 3;
    return {
      cx: gx + cell * (b.col + 0.5),
      cy: gy + cell * (b.row + 0.5),
      bw: cell * 0.74,
      bh: cell * 0.88
    };
  }

  // ---------- audio (lazy, gesture-gated) ----------
  var AC = null;
  function ensureAudio() {
    if (typeof window === 'undefined') return null;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (typeof Ctor !== 'function') return null;
    if (!AC) {
      try { AC = new Ctor(); } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') {
      try { AC.resume(); } catch (e) {}
    }
    return AC;
  }

  // low stone resonance: fundamental + inharmonic partials, slow decay
  function tone(idx, hard) {
    var ac = ensureAudio();
    if (!ac) return;
    var t = ac.currentTime;
    var f = FREQ[idx];
    var amp = hard ? 0.30 : 0.19;
    var dur = hard ? 5.2 : 3.6;
    var master = ac.createGain();
    master.gain.value = 0.9;
    master.connect(ac.destination);
    var partials = [[1, 1.0], [2.74, 0.38], [5.43, 0.13]];
    for (var i = 0; i < partials.length; i++) {
      var osc = ac.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = f * partials[i][0];
      var g = ac.createGain();
      g.gain.setValueAtTime(amp * partials[i][1], t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur * (i === 0 ? 1 : 0.55));
      osc.connect(g); g.connect(master);
      osc.start(t);
      osc.stop(t + dur + 0.05);
    }
    // short mallet contact tick
    var len = Math.floor(ac.sampleRate * 0.03);
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var data = buf.getChannelData(0);
    for (var j = 0; j < len; j++) data[j] = (Math.random() * 2 - 1) * Math.exp(-j / (len * 0.3));
    var src = ac.createBufferSource();
    src.buffer = buf;
    var lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 900;
    var ng = ac.createGain();
    ng.gain.value = hard ? 0.16 : 0.10;
    src.connect(lp); lp.connect(ng); ng.connect(master);
    src.start(t);
  }

  // ---------- interaction: strikes recorded on the anchored clock ----------
  var lastNow = 0;
  var pointerDown = false;
  var lastDragBlock = -1;
  var lastTouchStamp = -1; // dedupe touchstart/pointerdown double-fire

  function pointFromEvent(e) {
    var rect = canvas.getBoundingClientRect();
    var cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return { x: cx - rect.left, y: cy - rect.top };
  }

  function hitBlock(px, py) {
    for (var i = blocks.length - 1; i >= 0; i--) {
      var b = blocks[i], g = blockGeom(b);
      var dx = px - g.cx, dy = py - g.cy;
      var cos = Math.cos(-b.rot), sin = Math.sin(-b.rot);
      var lx = dx * cos - dy * sin, ly = dx * sin + dy * cos;
      if (Math.abs(lx) <= g.bw / 2 && Math.abs(ly) <= g.bh / 2) {
        return { block: b, fx: lx / g.bw, fy: ly / g.bh };
      }
    }
    return null;
  }

  function strike(b, fx, fy, t) {
    var hard = (t - b.lastStrikeT) < 0.45; // quick second tap = harder strike
    b.lastStrikeT = t;
    b.strikes.push({ fx: fx, fy: fy, t0: t, hard: hard });
    if (b.strikes.length > 6) b.strikes.shift();
    tone(b.idx, hard);
  }

  function onDown(e) {
    var nowMs = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    if (e.type === 'pointerdown' && lastTouchStamp > 0 && nowMs - lastTouchStamp < 80) return;
    if (e.type === 'touchstart') lastTouchStamp = nowMs;
    ensureAudio();
    pointerDown = true;
    var p = pointFromEvent(e);
    var hit = hitBlock(p.x, p.y);
    var t = elapsed(lastNow);
    if (hit) {
      strike(hit.block, hit.fx, hit.fy, t);
      lastDragBlock = hit.block.idx;
    } else {
      lastDragBlock = -1;
    }
  }
  function onMove(e) {
    if (!pointerDown) return;
    var p = pointFromEvent(e);
    var hit = hitBlock(p.x, p.y);
    if (hit && hit.block.idx !== lastDragBlock) {
      strike(hit.block, hit.fx, hit.fy, elapsed(lastNow));
      lastDragBlock = hit.block.idx;
    }
  }
  function onUp() { pointerDown = false; lastDragBlock = -1; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointerleave', onUp);
  canvas.addEventListener('touchstart', function (e) { onDown(e); }, { passive: true });
  canvas.addEventListener('touchmove', function (e) { onMove(e); }, { passive: true });
  canvas.addEventListener('touchend', onUp);

  // ---------- drawing ----------
  function roundedRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function drawBlock(b, t) {
    var g = blockGeom(b);
    ctx.save();
    ctx.translate(g.cx, g.cy);
    ctx.rotate(b.rot);
    var x = -g.bw / 2, y = -g.bh / 2, r = Math.min(g.bw, g.bh) * 0.09;

    // slab
    roundedRectPath(x, y, g.bw, g.bh, r);
    ctx.fillStyle = b.tone;
    ctx.fill();
    ctx.strokeStyle = CARVED;
    ctx.globalAlpha = 0.28;
    ctx.lineWidth = Math.max(1, g.bw * 0.012);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // strike rings, clipped to the stone face
    ctx.save();
    roundedRectPath(x, y, g.bw, g.bh, r);
    ctx.clip();
    // carved channels (drawn under the rings)
    ctx.strokeStyle = CARVED;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var lw = Math.max(1, g.bw * (PHONE ? 0.016 : 0.013));
    for (var p = 0; p < b.carving.length; p++) {
      var pts = b.carving[p];
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = lw;
      if (pts.length === 1) {
        ctx.fillStyle = CARVED;
        ctx.beginPath();
        ctx.arc(pts[0][0] * g.bw, pts[0][1] * g.bh, lw * 0.95, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.beginPath();
        for (var k = 0; k < pts.length; k++) {
          var px = pts[k][0] * g.bw, py = pts[k][1] * g.bh;
          if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
        // tube mouth at the channel start
        ctx.fillStyle = CARVED;
        ctx.globalAlpha = 0.65;
        ctx.beginPath();
        ctx.arc(pts[0][0] * g.bw, pts[0][1] * g.bh, lw * 0.9, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // rings: functions of recorded strike times only
    var maxR = Math.sqrt(g.bw * g.bw + g.bh * g.bh) * 0.62;
    for (var s = 0; s < b.strikes.length; s++) {
      var st = b.strikes[s];
      var age = t - st.t0;
      if (age < 0) continue;
      var tau = st.hard ? 6.0 : 3.6; // mineral slowness
      var bright = Math.exp(-age / tau);
      if (bright < 0.01) continue;
      var sx = st.fx * g.bw, sy = st.fy * g.bh;
      var rr = maxR * (1 - Math.exp(-age * (st.hard ? 1.15 : 0.95)));
      var baseA = st.hard ? 0.95 : 0.75;
      // face flash at the moment of the strike
      ctx.globalAlpha = 0.10 * baseA * Math.exp(-age * 2.4);
      ctx.fillStyle = RING_LIGHT;
      ctx.fillRect(x, y, g.bw, g.bh);
      // afterglow ring, trailing and wider
      ctx.globalAlpha = 0.30 * baseA * bright;
      ctx.strokeStyle = RING_GLOW;
      ctx.lineWidth = Math.max(2, g.bw * 0.075);
      ctx.beginPath();
      ctx.arc(sx, sy, Math.max(0.1, rr * 0.82), 0, Math.PI * 2);
      ctx.stroke();
      // main luminous ring
      ctx.globalAlpha = baseA * bright;
      ctx.strokeStyle = RING_LIGHT;
      ctx.lineWidth = Math.max(1.2, g.bw * 0.02) * (1 + 0.6 * Math.exp(-age * 1.8));
      ctx.beginPath();
      ctx.arc(sx, sy, Math.max(0.1, rr), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore(); // unclip
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < blocks.length; i++) drawBlock(blocks[i], t);
  }

  // frame one: synchronous draw at t = 0, no strikes, stone still
  draw(0);

  function frame(now) {
    lastNow = now;
    draw(elapsed(now));
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
