<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Breath Vessels</title>
<style>
  html, body { margin: 0; padding: 0; background: #141110; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32) — never Math.random, so frame one and every loop
  // are reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var W = 0, H = 0, phone = false;

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    var sw = (window.screen) ? Math.min(window.screen.width, window.screen.height) : 9999;
    phone = (sw < 700) || (h > w * 1.15);
    layout();
  }

  // ---- Seeded field data (fixed at load, never re-rolled) ----
  var rng = mulberry32(1353000);
  var stars = [];
  for (var s = 0; s < 46; s++) {
    stars.push({ x: rng(), y: rng() * 0.30, r: 0.6 + rng() * 1.3, a: 0.08 + rng() * 0.18 });
  }
  var pebbles = [];
  for (var p = 0; p < 130; p++) {
    pebbles.push({ x: rng(), y: 0.36 + rng() * 0.62, r: 0.8 + rng() * 2.0, light: rng() > 0.5 });
  }

  // 8 vessels: back row (smaller, baseline 0.80H) and front row (larger, 0.93H).
  // Depth by scale, not perspective. Blow order is left-to-right by x.
  var vessels = [];
  var backX = [0.10, 0.32, 0.54, 0.76];
  var frontX = [0.21, 0.43, 0.65, 0.87];
  var chamberIdx = {};
  (function pickChambers() {
    var r2 = mulberry32(1353000 + 77);
    var picked = [];
    while (picked.length < 3) {
      var k = Math.floor(r2() * 8);
      if (picked.indexOf(k) < 0) picked.push(k);
    }
    for (var i = 0; i < picked.length; i++) chamberIdx[picked[i]] = true;
  })();
  function makeVessel(idx, xf, baseYf, wFrac, hMul, row) {
    var r3 = mulberry32(1353000 + idx * 7919);
    var jitter = [];
    for (var j = 0; j < 26; j++) jitter.push(0.90 + r3() * 0.20);
    var flecks = [];
    for (var f = 0; f < 14; f++) flecks.push({ a: r3() * Math.PI * 2, d: Math.sqrt(r3()) * 0.8, r: 0.8 + r3() * 1.6, light: r3() > 0.5 });
    return {
      idx: idx, xf: xf, baseYf: baseYf, wFrac: wFrac, hMul: hMul, row: row,
      headDir: r3() > 0.5 ? 1 : -1,
      headTilt: (r3() - 0.5) * 0.7,
      jitter: jitter, flecks: flecks,
      chamber: !!chamberIdx[idx],
      glowPhase: r3() * Math.PI * 2,
      blowAt: idx * 3.0 // seconds into each 30 s cycle; order is left-to-right by x below
    };
  }
  // Blow order must be left-to-right by x, not by row: interleave rows by x.
  var defs = [
    { xf: 0.10, baseYf: 0.80, wFrac: 0.085, hMul: 1.50 },
    { xf: 0.21, baseYf: 0.93, wFrac: 0.115, hMul: 1.45 },
    { xf: 0.32, baseYf: 0.80, wFrac: 0.085, hMul: 1.50 },
    { xf: 0.43, baseYf: 0.93, wFrac: 0.115, hMul: 1.45 },
    { xf: 0.54, baseYf: 0.80, wFrac: 0.085, hMul: 1.50 },
    { xf: 0.65, baseYf: 0.93, wFrac: 0.115, hMul: 1.45 },
    { xf: 0.76, baseYf: 0.80, wFrac: 0.085, hMul: 1.50 },
    { xf: 0.87, baseYf: 0.93, wFrac: 0.115, hMul: 1.45 }
  ];
  for (var vi = 0; vi < defs.length; vi++) {
    vessels.push(makeVessel(vi, defs[vi].xf, defs[vi].baseYf, defs[vi].wFrac, defs[vi].hMul, vi % 2));
  }
  // Re-assign blow times strictly left-to-right by x (defs are already x-sorted).
  for (var bi = 0; bi < vessels.length; bi++) vessels[bi].blowAt = bi * 3.0;

  // Geometry computed per size (fractions -> px).
  function geom(v) {
    var w = W * v.wFrac;
    var h = w * v.hMul;
    var x = W * v.xf;
    var baseY = H * v.baseYf;
    var cx = x, cy = baseY - h * 0.5;
    var hx = x + v.headDir * w * 0.38;
    var hy = baseY - h * 0.93;
    return { w: w, h: h, x: x, baseY: baseY, cx: cx, cy: cy, hx: hx, hy: hy };
  }

  function layout() { /* geometry is derived from W/H inside draw; nothing cached */ }

  // ---- Recorded visitor breath (closed-form over piece time, never integrated) ----
  var breaths = []; // {t, vx, vy, vessel}
  var dragging = false;
  var lastToneT = -1;
  var nowT = 0;

  function nearestVessel(x, y) {
    var best = null, bestD = 1e18;
    for (var i = 0; i < vessels.length; i++) {
      var g = geom(vessels[i]);
      var dx = x - g.cx, dy = y - g.cy;
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = vessels[i]; }
    }
    return best;
  }

  // Audio: lazy, inside the visitor gesture only, never on the clock, never autoplay.
  var actx = null;
  function ensureAudio() {
    try {
      if (typeof AudioContext !== 'undefined') {
        if (!actx) actx = new AudioContext();
      } else if (typeof webkitAudioContext !== 'undefined') {
        if (!actx) actx = new webkitAudioContext();
      } else {
        return null;
      }
      if (actx.state === 'suspended' && actx.resume) actx.resume();
      return actx;
    } catch (e) { return null; }
  }
  function playTone(vessel, t) {
    var ac = ensureAudio();
    if (!ac) return;
    try {
      var osc = ac.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = 90 + vessel.idx * 12; // 90–174 Hz across the row
      var gain = ac.createGain();
      var t0 = ac.currentTime;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.10, t0 + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.2);
      var node = osc;
      if (typeof ac.createStereoPanner === 'function') {
        var pan = ac.createStereoPanner();
        pan.pan.value = (vessel.xf - 0.5) * 1.4;
        osc.connect(pan); pan.connect(gain); node = gain;
      } else {
        osc.connect(gain);
      }
      gain.connect(ac.destination);
      osc.start(t0); osc.stop(t0 + 1.3);
    } catch (e) { /* visuals must never break on audio failure */ }
  }

  function onDown(e) {
    dragging = true;
  }
  function onMove(e) {
    if (!dragging) return;
    var x = (typeof e.clientX !== 'undefined') ? e.clientX : 0;
    var y = (typeof e.clientY !== 'undefined') ? e.clientY : 0;
    var v = nearestVessel(x, y);
    breaths.push({ t: nowT, vessel: v });
    if (breaths.length > 60) breaths.shift();
    if (nowT - lastToneT > 0.15) {
      lastToneT = nowT;
      playTone(v, nowT);
    }
  }
  function onUp(e) { dragging = false; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  if (window.addEventListener) {
    window.addEventListener('resize', function () { size(); draw(nowT); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { size(); draw(nowT); });
    }
  }

  // ---- Drawing ----
  function drawBlobPath(cx, cy, rx, ry, jitter) {
    ctx.beginPath();
    var N = jitter.length;
    for (var i = 0; i <= N; i++) {
      var a = (i % N) / N * Math.PI * 2 - Math.PI / 2;
      var rad = jitter[i % N];
      var px = cx + Math.cos(a) * rx * rad;
      var py = cy + Math.sin(a) * ry * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function draw(t) {
    nowT = t;
    var i, j;
    // Sky (dark) above, bare earth below; flat fields only, no gradients.
    ctx.fillStyle = '#141110';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#1a1512';
    ctx.fillRect(0, H * 0.34, W, H * 0.66);
    ctx.fillStyle = '#2a231d';
    ctx.fillRect(0, H * 0.34, W, 2);

    // Stars.
    for (i = 0; i < stars.length; i++) {
      var st = stars[i];
      ctx.fillStyle = 'rgba(232,226,212,' + st.a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(W * st.x, H * st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
    // Earth pebbles / flecks.
    for (i = 0; i < pebbles.length; i++) {
      var pb = pebbles[i];
      ctx.fillStyle = pb.light ? 'rgba(216,207,192,0.10)' : 'rgba(0,0,0,0.18)';
      ctx.beginPath();
      ctx.arc(W * pb.x, H * pb.y, pb.r, 0, Math.PI * 2);
      ctx.fill();
    }

    var ct = t % 30; // fixed 30 s clock; the visitor cannot change it, only join it.

    // Back row first, then front row (painter order).
    var order = [0, 2, 4, 6, 1, 3, 5, 7];
    for (var oi = 0; oi < order.length; oi++) {
      var v = vessels[order[oi]];
      var gm = geom(v);

      // Ground shadow.
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(gm.x, gm.baseY + 4, gm.w * 0.55, Math.max(4, H * 0.008), 0, 0, Math.PI * 2);
      ctx.fill();

      // Body: irregular hand-built blob.
      drawBlobPath(gm.cx, gm.cy, gm.w * 0.5, gm.h * 0.5, v.jitter);
      ctx.fillStyle = '#6b5a4a';
      ctx.fill();
      ctx.strokeStyle = 'rgba(62,54,48,0.45)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Lower-half char shading (flat alpha).
      ctx.fillStyle = 'rgba(62,54,48,0.22)';
      ctx.beginPath();
      ctx.ellipse(gm.cx - gm.w * 0.08, gm.cy + gm.h * 0.18, gm.w * 0.34, gm.h * 0.26, 0, 0, Math.PI * 2);
      ctx.fill();

      // Head hint: tilted bump rising from the vessel's shoulder (animal-head
      // suggestion, never a detailed skull face); faint outline so it reads as
      // one hand-built form, not a detached ball.
      ctx.fillStyle = '#6b5a4a';
      ctx.beginPath();
      ctx.ellipse(gm.cx + v.headDir * gm.w * 0.18, gm.cy - gm.h * 0.38, gm.w * 0.20, gm.h * 0.19, v.headDir * 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(62,54,48,0.25)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // Mouth aperture (breath source) at the head tip.
      ctx.fillStyle = '#14100d';
      ctx.beginPath();
      ctx.ellipse(gm.hx, gm.hy, Math.max(3, gm.w * 0.05), Math.max(2.5, gm.w * 0.035), v.headTilt, 0, Math.PI * 2);
      ctx.fill();

      // Speckle flecks (hand-rolled surface).
      for (j = 0; j < v.flecks.length; j++) {
        var fl = v.flecks[j];
        var fx = gm.cx + Math.cos(fl.a) * fl.d * gm.w * 0.42;
        var fy = gm.cy + Math.sin(fl.a) * fl.d * gm.h * 0.42;
        ctx.fillStyle = fl.light ? 'rgba(216,207,192,0.10)' : 'rgba(0,0,0,0.14)';
        ctx.beginPath();
        ctx.arc(fx, fy, fl.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Chamber glow: idle pulse (chamber vessels only) + clock-blow pulse + drag boost.
      var glow = 0;
      if (v.chamber) glow += 0.15 + 0.08 * Math.sin((Math.PI * 2 * t) / 6 + v.glowPhase);
      var dt = ct - v.blowAt;
      if (dt >= 0 && dt < 3.0) {
        var env = dt < 0.4 ? dt / 0.4 : Math.exp(-(dt - 0.4) / 1.0);
        glow += 0.55 * env;
      }
      for (j = 0; j < breaths.length; j++) {
        var br = breaths[j];
        if (br.vessel === v) {
          var bdt = t - br.t;
          if (bdt >= 0 && bdt < 4) glow += 0.7 * Math.exp(-bdt / 2.5);
        }
      }
      if (glow > 0.02) {
        ctx.fillStyle = 'rgba(224,120,47,' + Math.min(0.75, glow).toFixed(3) + ')';
        ctx.beginPath();
        ctx.ellipse(gm.cx, gm.cy - gm.h * 0.05, gm.w * 0.22, gm.h * 0.16, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Clock breath ripple: expanding flat-alpha ring from the aperture.
      if (dt >= 0 && dt < 2.5) {
        var maxR = W * 0.55;
        var rad = (dt / 2.5) * maxR;
        var alpha = 0.5 * (1 - dt / 2.5);
        ctx.strokeStyle = 'rgba(224,120,47,' + alpha.toFixed(3) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(gm.hx, gm.hy, rad, 0, Math.PI * 2);
        ctx.stroke();
        if (dt > 0.5) {
          var rad2 = ((dt - 0.5) / 2.5) * maxR;
          ctx.strokeStyle = 'rgba(224,120,47,' + (alpha * 0.5).toFixed(3) + ')';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(gm.hx, gm.hy, rad2, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }

    // Visitor breath ripples (stronger, warmer, from the dragged vessel).
    for (j = 0; j < breaths.length; j++) {
      var b = breaths[j];
      var vdt = t - b.t;
      if (vdt < 0 || vdt >= 3) continue;
      var bg = geom(b.vessel);
      var brad = (vdt / 3) * W * 0.35;
      var balpha = 0.6 * (1 - vdt / 3);
      ctx.strokeStyle = 'rgba(224,120,47,' + balpha.toFixed(3) + ')';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(bg.hx, bg.hy, brad, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // rAF loop as a plain function declaration behind a typeof guard.
  var startMs = null;
  function loop(ms) {
    if (startMs === null) startMs = ms;
    var t = (ms - startMs) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }

  size();
  draw(0); // frame one: synchronous fixed phase; the clock starts with the rAF loop.
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
