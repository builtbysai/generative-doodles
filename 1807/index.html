<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Permanent Room</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #43464a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: 14px; text-align: center;
    font: 12px/1.4 system-ui, -apple-system, sans-serif; letter-spacing: 0.14em;
    color: #7d8085; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">WATCH ONLY</div>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG, fixed seed: frame one is fully deterministic.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1807);

  var reduced = false;
  try {
    reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) { reduced = false; }

  // Dust motes: seeded positions and drift phases.
  var MOTES = [];
  for (var i = 0; i < 42; i++) {
    MOTES.push({
      x: rnd(), y: rnd(), r: 0.6 + rnd() * 1.5,
      a: 0.05 + rnd() * 0.16,
      px: rnd() * Math.PI * 2, py: rnd() * Math.PI * 2,
      sx: 0.004 + rnd() * 0.010, sy: 0.003 + rnd() * 0.008
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function alpha(v) {
    var a = Math.round(v * 10000) / 10000;
    if (a < 0) a = 0;
    if (a > 1) a = 1;
    return a;
  }

  function draw(t) {
    var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    var W = Math.max(1, Math.floor(vw));
    var H = Math.max(1, Math.floor(vh));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var isPhone = false;
    try {
      var sw = window.screen.width, sh = window.screen.height;
      var mn = Math.min(sw, sh);
      isPhone = mn < 700 || (H > W * 1.15);
    } catch (e) { isPhone = (H > W * 1.15); }

    // Page ground is the piece's own background color on both sizes.
    ctx.fillStyle = '#43464a';
    ctx.fillRect(0, 0, W, H);

    // Room rect, centered, fixed 4:3 interior shape on both sizes.
    var rw = Math.min(W * 0.94, H * 0.94 * 1.3333);
    var rh = rw / 1.3333;
    var rx = (W - rw) / 2;
    var ry = (H - rh) / 2;
    var floorY = ry + rh * 0.72;

    // Back wall: cool grey, slightly lighter toward the top.
    var wall = ctx.createLinearGradient(0, ry, 0, floorY);
    wall.addColorStop(0, '#5b5f64');
    wall.addColorStop(1, '#484b4f');
    ctx.fillStyle = wall;
    ctx.fillRect(rx, ry, rw, floorY - ry);

    // Side walls, faint darker edges for depth.
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    ctx.fillRect(rx, ry, rw * 0.02, floorY - ry);
    ctx.fillRect(rx + rw * 0.98, ry, rw * 0.02, floorY - ry);

    // Floor: darker grey.
    var fl = ctx.createLinearGradient(0, floorY, 0, ry + rh);
    fl.addColorStop(0, '#3a3c3f');
    fl.addColorStop(1, '#2f3134');
    ctx.fillStyle = fl;
    ctx.fillRect(rx, floorY, rw, ry + rh - floorY);

    // Daylight angle: very slow crawl, fixed at t = 0.
    var drift = t * 0.00004; // radians per second, barely moving
    var winW = rw * 0.085, winH = rh * 0.115;
    var winX = rx + rw * 0.10 + drift * rw * 0.5;
    var winY = ry + rh * 0.075;

    // Window: small, high, warm.
    ctx.fillStyle = '#20211f';
    ctx.fillRect(winX - 3, winY - 3, winW + 6, winH + 6);
    var glow = ctx.createLinearGradient(winX, winY, winX, winY + winH);
    glow.addColorStop(0, '#f7e3b0');
    glow.addColorStop(1, '#e8c98a');
    ctx.fillStyle = glow;
    ctx.fillRect(winX, winY, winW, winH);
    // Window mullion cross.
    ctx.fillStyle = '#20211f';
    ctx.fillRect(winX + winW / 2 - 1, winY, 2, winH);
    ctx.fillRect(winX, winY + winH / 2 - 1, winW, 2);

    // Light shaft from the window down to the floor.
    var shaftLen = (floorY - winY) * 1.35;
    var sx0 = winX + winW * 0.15, sx1 = winX + winW * 0.85;
    var spread = shaftLen * 0.22 + drift * rw * 0.5;
    ctx.beginPath();
    ctx.moveTo(sx0, winY + winH);
    ctx.lineTo(sx1, winY + winH);
    ctx.lineTo(sx1 + spread, floorY + rh * 0.10);
    ctx.lineTo(sx0 + spread * 0.4, floorY + rh * 0.10);
    ctx.closePath();
    ctx.fillStyle = 'rgba(240,205,140,' + alpha(0.07) + ')';
    ctx.fill();

    // Warm light patch on the floor.
    ctx.beginPath();
    ctx.moveTo(sx0 + spread * 0.4, floorY + rh * 0.02);
    ctx.lineTo(sx1 + spread, floorY + rh * 0.02);
    ctx.lineTo(sx1 + spread + rw * 0.03, floorY + rh * 0.10);
    ctx.lineTo(sx0 + spread * 0.4 - rw * 0.02, floorY + rh * 0.10);
    ctx.closePath();
    ctx.fillStyle = 'rgba(238,200,130,' + alpha(0.12) + ')';
    ctx.fill();

    // Pill cutouts: a row of six vertical pills, centered on the wall.
    var pills = 6;
    var pillW = rw * 0.045, pillH = rh * 0.20;
    var gap = rw * 0.022;
    var rowW = pills * pillW + (pills - 1) * gap;
    var rowX = rx + (rw - rowW) / 2;
    var pillY = ry + rh * 0.30;
    var pillR = pillW / 2;

    // Rare passing shadow: irregular, minutes apart. Cycle 240 s;
    // visible only in a 12 s window late in the cycle, never at t = 0.
    var cyc = t % 240;
    var shadowOn = (cyc > 200 && cyc < 212) ? (cyc - 200) / 12 : -1;

    for (var p = 0; p < pills; p++) {
      var px = rowX + p * (pillW + gap);
      // Faint warm light passing through the cutout.
      var pg = ctx.createLinearGradient(px, pillY, px, pillY + pillH);
      pg.addColorStop(0, '#d9c49a');
      pg.addColorStop(1, '#b7a37e');
      ctx.fillStyle = pg;
      roundRect(px, pillY, pillW, pillH, pillR);
      ctx.fill();
      // Inner shade so the pill reads as a hole, not a plaque.
      ctx.save();
      roundRect(px, pillY, pillW, pillH, pillR);
      ctx.clip();
      var psh = ctx.createLinearGradient(0, pillY, 0, pillY + pillH);
      psh.addColorStop(0, 'rgba(0,0,0,0)');
      psh.addColorStop(1, 'rgba(0,0,0,' + alpha(0.20) + ')');
      ctx.fillStyle = psh;
      ctx.fillRect(px, pillY, pillW, pillH);
      ctx.restore();
      // The passing shadow darkens whichever pills it crosses.
      if (shadowOn >= 0) {
        var scx = rowX - pillW + shadowOn * (rowW + pillW * 2);
        var sd = Math.abs((px + pillW / 2) - scx);
        if (sd < pillW * 1.4) {
          var sa = 0.45 * (1 - sd / (pillW * 1.4));
          ctx.fillStyle = 'rgba(40,36,30,' + alpha(sa) + ')';
          roundRect(px, pillY, pillW, pillH, pillR);
          ctx.fill();
        }
      }
      // Thin dark rim around each cutout.
      ctx.strokeStyle = 'rgba(0,0,0,' + alpha(0.25) + ')';
      ctx.lineWidth = 1;
      roundRect(px, pillY, pillW, pillH, pillR);
      ctx.stroke();
    }

    // Bench: dark wood, low, along the lower wall, right of center.
    var bx = rx + rw * 0.58, bw = rw * 0.34;
    var by = floorY - rh * 0.085, bh = rh * 0.028;
    ctx.fillStyle = '#2e241c';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#3a2e24';
    ctx.fillRect(bx, by, bw, 2);
    ctx.fillStyle = '#241c15';
    ctx.fillRect(bx + bw * 0.06, by + bh, 3, rh * 0.055);
    ctx.fillRect(bx + bw * 0.90, by + bh, 3, rh * 0.055);
    // Bench shadow on the floor.
    ctx.fillStyle = 'rgba(0,0,0,' + alpha(0.18) + ')';
    ctx.fillRect(bx - 4, floorY + rh * 0.055, bw + 8, 3);

    // Dust motes drifting in the window light and across the room.
    for (var m = 0; m < MOTES.length; m++) {
      var mo = MOTES[m];
      var mx = rx + (mo.x + Math.sin(t * mo.sx + mo.px) * 0.02) * rw;
      var my = ry + (mo.y + Math.sin(t * mo.sy + mo.py) * 0.015) * rh;
      var warm = (mx > winX - rw * 0.05 && mx < winX + winW + rw * 0.25 && my > winY && my < floorY);
      ctx.beginPath();
      ctx.moveTo(mx + mo.r, my);
      ctx.arc(mx, my, mo.r, 0, Math.PI * 2);
      ctx.fillStyle = warm
        ? 'rgba(245,220,170,' + alpha(mo.a + 0.08) + ')'
        : 'rgba(200,205,210,' + alpha(mo.a) + ')';
      ctx.fill();
    }

    // Faint wall/floor seam.
    ctx.fillStyle = 'rgba(0,0,0,' + alpha(0.22) + ')';
    ctx.fillRect(rx, floorY - 1, rw, 1);
  }

  function sizeAndDraw(t) { draw(t); }

  // One synchronous frame at load: t = 0, fixed phase, no shadow.
  sizeAndDraw(0);

  if (reduced) return;

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    var t = (ts - start) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }

  function onResize() { draw(0); }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
})();
</script>
</body>
</html>
