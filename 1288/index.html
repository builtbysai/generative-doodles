<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Prints</title>
<style>
  html, body { margin: 0; padding: 0; background: #142A45; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (verbatim from the prompt).
  var DEEP = '#1E3A5F', DEVELOPED = '#2C527A', GHOST = '#B9C8DA',
      SHADOW = '#142A45', FLASH = '#E8EEF4', COTTON = '#E7DCC6';

  // Seeded PRNG (mulberry32). Never Math.random: the loop sequence is reproducible.
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var W = 0, H = 0, phone = false;
  function size() {
    var vp = (typeof window.visualViewport !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vp ? vp.width : window.innerWidth;
    H = vp ? vp.height : window.innerHeight;
    var minDim = Math.min(window.screen.width, window.screen.height);
    phone = minDim < 700 || (H > W * 1.15 && Math.min(W, H) < 700);
    canvas.width = Math.round(W); canvas.height = Math.round(H);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }
  size();
  if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () { size(); draw(0); });
  }
  window.addEventListener('resize', function () { size(); draw(0); });

  // Cloth geometry, rebuilt on resize.
  var band = null;
  function build() {
    var bw = W, bh = H * (2 / 3);
    var bx = 0, by = (H - bh) / 2;
    var edge = Math.max(10, Math.round(bh * 0.06)); // raw cotton selvedge top/bottom
    var rows = 5;
    band = { x: bx, y: by, w: bw, h: bh, edge: edge, rows: rows,
             top: by + edge, bot: by + bh - edge,
             innerH: bh - 2 * edge };
  }

  // One loop's motif field, from a seeded RNG. Rows staggered and offset per row.
  // Motif kinds: 0 diamond, 1 rosette (diamond + dots), 2 square-with-dot.
  function genField(seed) {
    var r = rng(seed);
    var rows = [], i, j;
    var rowH = band.innerH / band.rows;
    for (i = 0; i < band.rows; i++) {
      var count = 9 + Math.floor(r() * 3);
      var stagger = (i % 2) * (band.w / count / 2);
      var cells = [];
      for (j = 0; j < count; j++) {
        var cx = ((j + 0.5) / count) * band.w + stagger;
        if (cx > band.w) cx -= band.w;
        cells.push({
          x: cx, y: band.top + (i + 0.5) * rowH,
          s: rowH * (0.30 + r() * 0.10),
          kind: Math.floor(r() * 3),
          rot: (r() - 0.5) * 0.5,
          a: 0.28 + r() * 0.30
        });
      }
      rows.push(cells);
    }
    // Clear double-stamp (mis-registration) on one row near the left third.
    var dRow = 2, dCell = null, dCells = rows[dRow];
    for (j = 0; j < dCells.length; j++) {
      if (dCells[j].x > band.w * 0.22 && dCells[j].x < band.w * 0.42) { dCell = dCells[j]; break; }
    }
    // Mirrors: 3-5 small irregular shards near the center.
    var mirrors = [], m;
    var nm = 3 + Math.floor(r() * 3);
    for (m = 0; m < nm; m++) {
      var mx = band.w * (0.38 + r() * 0.26);
      var my = band.top + band.innerH * (0.28 + r() * 0.44);
      var ms = Math.max(5, Math.min(16, band.innerH * 0.055));
      var pts = [], k;
      for (k = 0; k < 5; k++) {
        var ang = (k / 5) * Math.PI * 2 + r() * 0.6;
        var rad = ms * (0.6 + r() * 0.6);
        pts.push([Math.cos(ang) * rad, Math.sin(ang) * rad * 0.8]);
      }
      mirrors.push({ x: mx, y: my, pts: pts, s: ms });
    }
    return { rows: rows, dbl: dCell, mirrors: mirrors };
  }

  var LOOP = 24, WASH = 8; // seconds: wash develops 0-8, glint ~10, hold, fade back 20-24
  var BASE_SEED = 1288;
  var fieldCache = {};
  function fieldFor(t) {
    var k = Math.floor(t / LOOP);
    if (!fieldCache[k]) fieldCache[k] = genField(BASE_SEED + k * 7919);
    return fieldCache[k];
  }

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(v) { return v * v * (3 - 2 * v); }

  // Draw one motif at low alpha, as a worn block impression.
  function drawMotif(m, alpha) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rot);
    ctx.globalAlpha = alpha * m.a;
    ctx.strokeStyle = GHOST; ctx.fillStyle = GHOST; ctx.lineWidth = Math.max(1, m.s * 0.07);
    var s = m.s;
    if (m.kind === 0) {
      ctx.beginPath();
      ctx.moveTo(0, -s); ctx.lineTo(s * 0.7, 0); ctx.lineTo(0, s); ctx.lineTo(-s * 0.7, 0);
      ctx.closePath(); ctx.stroke();
    } else if (m.kind === 1) {
      ctx.beginPath();
      ctx.moveTo(0, -s); ctx.lineTo(s * 0.7, 0); ctx.lineTo(0, s); ctx.lineTo(-s * 0.7, 0);
      ctx.closePath(); ctx.stroke();
      var d = s * 0.45, dots = [[0, -d], [d, 0], [0, d], [-d, 0]];
      var i;
      for (i = 0; i < dots.length; i++) {
        ctx.beginPath(); ctx.moveTo(dots[i][0] + s * 0.10, dots[i][1]);
        ctx.arc(dots[i][0], dots[i][1], s * 0.10, 0, Math.PI * 2); ctx.fill();
      }
    } else {
      ctx.strokeRect(-s * 0.6, -s * 0.6, s * 1.2, s * 1.2);
      ctx.beginPath(); ctx.moveTo(s * 0.12, 0);
      ctx.arc(0, 0, s * 0.12, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    build();
    var lt = t % LOOP; // loop-local time
    var field = fieldFor(t);
    var washP = clamp(lt / WASH, 0, 1); // 0 pale, 1 fully developed
    var fadeP = 0;
    if (lt >= 20) fadeP = clamp((lt - 20) / 4, 0, 1); // loop sheds back to pale
    var dev = smooth(washP) * (1 - smooth(fadeP));

    // Page ground.
    ctx.globalAlpha = 1;
    ctx.fillStyle = SHADOW; ctx.fillRect(0, 0, W, H);

    // Un-dyed cloth ground (pale) across the whole band.
    ctx.fillStyle = COTTON; ctx.fillRect(band.x, band.y, band.w, band.h);

    // Indigo wash developing from the edges inward: flat alpha layers.
    // Top and bottom edges advance toward the middle; side edges advance too.
    if (dev > 0) {
      var reach = dev; // fraction of half-height covered from each edge
      ctx.globalAlpha = 1;
      ctx.fillStyle = DEVELOPED;
      var mid = band.top + band.innerH / 2;
      var topCover = band.top + band.innerH * 0.5 * reach;
      var botCover = band.bot - band.innerH * 0.5 * reach;
      ctx.fillRect(band.x, band.top, band.w, Math.max(0, topCover - band.top));
      ctx.fillRect(band.x, Math.min(band.bot, botCover), band.w, Math.max(0, band.bot - botCover));
      // Side advance, thinner.
      var side = band.w * 0.12 * reach;
      ctx.fillRect(band.x, band.top, side, band.innerH);
      ctx.fillRect(band.x + band.w - side, band.top, side, band.innerH);
      // Deep indigo core wash over the developed area, low alpha, flat.
      ctx.globalAlpha = 0.55 * dev;
      ctx.fillStyle = DEEP;
      ctx.fillRect(band.x, band.top, band.w, band.innerH);
      ctx.globalAlpha = 1;
    }

    // Ghost prints fade UP row by row as the wash reaches them.
    var r, cells, ci;
    for (r = 0; r < field.rows.length; r++) {
      var rowStart = 0.15 + r * 0.15; // staggered reveal across the wash
      var rowA = clamp((washP - rowStart) / 0.25, 0, 1) * (1 - smooth(fadeP));
      if (rowA <= 0) continue;
      cells = field.rows[r];
      for (ci = 0; ci < cells.length; ci++) drawMotif(cells[ci], rowA);
      if (field.dbl && r === 2) {
        // Double-stamp: the same motif printed twice, slightly offset.
        var d = field.dbl;
        ctx.save();
        ctx.translate(d.x + d.s * 0.35, d.y + d.s * 0.22);
        ctx.globalAlpha = rowA * d.a * 0.8;
        ctx.strokeStyle = GHOST; ctx.lineWidth = Math.max(1, d.s * 0.07);
        ctx.beginPath();
        ctx.moveTo(0, -d.s); ctx.lineTo(d.s * 0.7, 0); ctx.lineTo(0, d.s); ctx.lineTo(-d.s * 0.7, 0);
        ctx.closePath(); ctx.stroke();
        ctx.restore(); ctx.globalAlpha = 1;
      }
    }

    // Mirrors: flat pale shards, glinting once after the wash completes.
    var glint = 0;
    if (lt >= 9.5 && lt < 12) {
      var gp = (lt - 9.5) / 2.5;
      glint = gp < 0.3 ? gp / 0.3 : 1 - (gp - 0.3) / 0.7;
      glint = clamp(glint, 0, 1);
    }
    var mi, p;
    for (mi = 0; mi < field.mirrors.length; mi++) {
      var mir = field.mirrors[mi];
      ctx.save();
      ctx.translate(mir.x, mir.y);
      ctx.beginPath();
      ctx.moveTo(mir.pts[0][0], mir.pts[0][1]);
      for (p = 1; p < mir.pts.length; p++) ctx.lineTo(mir.pts[p][0], mir.pts[p][1]);
      ctx.closePath();
      // Mirrors develop with the wash: invisible on the un-dyed pale ground.
      ctx.globalAlpha = 0.85 * dev;
      ctx.fillStyle = FLASH; ctx.fill();
      ctx.globalAlpha = 0.85 * dev;
      ctx.strokeStyle = FLASH; ctx.lineWidth = 1; ctx.stroke();
      if (glint > 0) {
        ctx.globalAlpha = glint * 0.9;
        ctx.fillStyle = FLASH; ctx.fill();
        ctx.globalAlpha = glint * 0.35;
        ctx.beginPath(); ctx.moveTo(mir.s * 1.8, 0);
        ctx.arc(0, 0, mir.s * 1.8, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // Raw cotton selvedge edges, top and bottom of the band.
    ctx.globalAlpha = 1;
    ctx.fillStyle = COTTON;
    ctx.fillRect(band.x, band.y, band.w, band.edge);
    ctx.fillRect(band.x, band.y + band.h - band.edge, band.w, band.edge);
    // Frayed edge ticks.
    ctx.strokeStyle = COTTON; ctx.lineWidth = 1;
    var fx;
    for (fx = 0; fx < band.w; fx += 14) {
      var len = 3 + ((fx * 7) % 5);
      ctx.beginPath(); ctx.moveTo(fx, band.y + band.edge); ctx.lineTo(fx, band.y + band.edge + len); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx, band.y + band.h - band.edge); ctx.lineTo(fx, band.y + band.h - band.edge - len); ctx.stroke();
    }

    // Pin the canvas size in CSS (house rule).
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }

  // Boot flag: the synchronous first frame draws at exactly t = 0.
  draw(0);

  // The clock starts with the rAF loop.
  var T0 = null;
  function loop(ts) {
    if (T0 === null) T0 = ts;
    var t = (ts - T0) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
