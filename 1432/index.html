<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Hundred Doors</title>
<style>
  html, body { margin: 0; padding: 0; background: #141210; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function r4(x) { return Math.round(x * 10000) / 10000; }

  var SEED = 1432000;
  var panels = [];
  (function buildPanels() {
    for (var i = 0; i < 100; i++) {
      var rng = mulberry32(SEED + i * 7919);
      panels.push({
        finish: rng() < 0.5 ? 'matte' : 'gloss', // matte ochre / glossy gold
        dark: rng() < 0.32,
        curl: 0.6 + rng() * 0.8,               // scroll curl amount
        rosette: 0.10 + rng() * 0.06,           // rosette radius fraction
        archW: 0.62 + rng() * 0.16,             // arch width fraction
        saintH: 0.34 + rng() * 0.14,            // niche figure height fraction
        toneShift: rng()
      });
    }
  })();

  // Interaction state. Dragging across the wall moves the viewpoint close to
  // the panel under the finger; a tap (small movement, same cell) swaps that
  // panel's matte/gloss finish. Dragging back restores the whole: the near
  // zone follows the finger, and on release it fades back to ambient.
  var drag = null;       // {sx, sy, x, y, cell, moved}
  var dragCell = -1;     // cell index under the finger while dragging
  var dragMoved = false;
  var releaseT = -1e9;   // piece time of last pointerup
  var releaseCell = -1;

  function cellAt(x, y, W, H) {
    var cx = Math.floor(x / (W / 10));
    var cy = Math.floor(y / (H / 10));
    if (cx < 0) cx = 0; if (cx > 9) cx = 9;
    if (cy < 0) cy = 0; if (cy > 9) cy = 9;
    return cy * 10 + cx;
  }
  function cellDist(a, b) {
    var ax = a % 10, ay = Math.floor(a / 10);
    var bx = b % 10, by = Math.floor(b / 10);
    return Math.max(Math.abs(ax - bx), Math.abs(ay - by));
  }

  function onDown(e) {
    var W = canvas.width, H = canvas.height;
    drag = { sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY };
    dragCell = cellAt(e.clientX, e.clientY, W, H);
    dragMoved = false;
    releaseCell = -1;
  }
  function onMove(e) {
    if (!drag) return;
    drag.x = e.clientX; drag.y = e.clientY;
    var W = canvas.width, H = canvas.height;
    if (Math.abs(drag.x - drag.sx) + Math.abs(drag.y - drag.sy) > 24) dragMoved = true;
    if (dragMoved) dragCell = cellAt(e.clientX, e.clientY, W, H);
  }
  function onUp(e, t) {
    if (!drag) return;
    var W = canvas.width, H = canvas.height;
    var upCell = cellAt(e.clientX, e.clientY, W, H);
    if (!dragMoved && upCell === dragCell) {
      // Tap on one panel: swap its finish, persistently.
      var p = panels[upCell];
      p.finish = (p.finish === 'matte') ? 'gloss' : 'matte';
    }
    releaseT = t;
    releaseCell = dragCell;
    drag = null;
    dragCell = -1;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  // pointerup needs piece time; the loop passes t through a shared slot.
  var nowT = 0;
  canvas.addEventListener('pointerup', function (e) { onUp(e, nowT); });
  canvas.addEventListener('pointercancel', function (e) { onUp(e, nowT); });

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var W = vv ? vv.width : window.innerWidth;
    var H = vv ? vv.height : window.innerHeight;
    return { W: W, H: H };
  }

  // Boustrophedon drift of the current panel: row by row, alternating
  // direction, 5 s per panel, wrapping. Seamless: the path is periodic.
  function currentIndex(t) {
    var step = Math.floor(t / 5) % 100;
    var row = Math.floor(step / 10);
    var col = (row % 2 === 0) ? (step % 10) : (9 - (step % 10));
    return row * 10 + col;
  }

  function drawPanel(x, y, w, h, p, near) {
    var cx = x + w / 2;
    // Ground.
    ctx.fillStyle = p.dark ? '#2a241e' : '#e8e2d4';
    ctx.fillRect(x, y, w, h);
    var stone = '#c8bfa8';
    var shadow = '#4a4238';
    var accent = '#a01818';
    var finishCol = (p.finish === 'matte') ? '#b87a2a' : '#d4a24e';
    var ink = p.dark ? stone : shadow;

    if (!near) {
      // FAR reading: the screen as one grille. Simplified motif.
      ctx.strokeStyle = ink;
      ctx.lineWidth = Math.max(1, w * 0.02);
      ctx.strokeRect(x + w * 0.14, y + h * 0.10, w * 0.72, h * 0.80);
      ctx.beginPath();
      ctx.moveTo(x + w * 0.14, y + h * 0.28);
      ctx.lineTo(x + w * 0.86, y + h * 0.28);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + w * 0.38, y + h * 0.10);
      ctx.lineTo(x + w * 0.38, y + h * 0.90);
      ctx.moveTo(x + w * 0.62, y + h * 0.10);
      ctx.lineTo(x + w * 0.62, y + h * 0.90);
      ctx.stroke();
      // Small rosette.
      ctx.beginPath();
      ctx.arc(cx, y + h * 0.55, w * p.rosette * 0.7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = accent;
      ctx.fillRect(cx - w * 0.02, y + h * 0.82, w * 0.04, h * 0.04);
      return;
    }

    // NEAR reading: dense abstract ornament, finish drives the colour.
    ctx.strokeStyle = finishCol;
    ctx.lineWidth = Math.max(1, w * 0.028);
    var aw = w * p.archW;
    var ax = cx - aw / 2;
    // Outer arch.
    ctx.beginPath();
    ctx.moveTo(ax, y + h * 0.92);
    ctx.lineTo(ax, y + h * 0.30);
    ctx.arc(cx, y + h * 0.30, aw / 2, Math.PI, 0);
    ctx.lineTo(ax + aw, y + h * 0.92);
    ctx.stroke();
    // Inner arch.
    ctx.lineWidth = Math.max(1, w * 0.018);
    var iw = aw * 0.66;
    var ix = cx - iw / 2;
    ctx.beginPath();
    ctx.moveTo(ix, y + h * 0.88);
    ctx.lineTo(ix, y + h * 0.34);
    ctx.arc(cx, y + h * 0.34, iw / 2, Math.PI, 0);
    ctx.lineTo(ix + iw, y + h * 0.88);
    ctx.stroke();
    // Scrolls, left and right, curling by the panel's curl parameter.
    ctx.lineWidth = Math.max(1, w * 0.02);
    ctx.beginPath();
    ctx.arc(x + w * 0.16, y + h * 0.30, w * 0.10 * p.curl, Math.PI * 0.5, Math.PI * 1.5);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + w * 0.84, y + h * 0.30, w * 0.10 * p.curl, Math.PI * 1.5, Math.PI * 0.5);
    ctx.stroke();
    // Niche figure: abstract saint — head dot, body bar.
    var sh = h * p.saintH;
    var sy = y + h * 0.52;
    ctx.fillStyle = ink;
    ctx.fillRect(cx - w * 0.05, sy, w * 0.10, sh);
    ctx.beginPath();
    ctx.arc(cx, sy - h * 0.05, w * 0.055, 0, Math.PI * 2);
    ctx.fill();
    // Rosette with petals.
    var rr = w * p.rosette;
    ctx.strokeStyle = finishCol;
    ctx.lineWidth = Math.max(1, w * 0.018);
    ctx.beginPath();
    ctx.arc(cx, y + h * 0.22, rr, 0, Math.PI * 2);
    ctx.stroke();
    for (var k = 0; k < 8; k++) {
      var a = k * Math.PI / 4;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * rr * 1.5, y + h * 0.22 + Math.sin(a) * rr * 1.5, rr * 0.32, 0, Math.PI * 2);
      ctx.stroke();
    }
    // Glossy finish gets one bright highlight line; matte stays flat.
    if (p.finish === 'gloss') {
      ctx.strokeStyle = '#e8e2d4';
      ctx.lineWidth = Math.max(1, w * 0.010);
      ctx.beginPath();
      ctx.moveTo(ax + aw * 0.12, y + h * 0.40);
      ctx.lineTo(ax + aw * 0.12, y + h * 0.80);
      ctx.stroke();
    }
    // Carmine accent.
    ctx.fillStyle = accent;
    ctx.fillRect(cx - w * 0.025, y + h * 0.90, w * 0.05, h * 0.035);
  }

  function draw(t) {
    nowT = t;
    var s = size();
    var W = s.W, H = s.H;
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    // Frame ground.
    ctx.fillStyle = '#141210';
    ctx.fillRect(0, 0, W, H);

    var cw = W / 10, ch = H / 10;
    var g = Math.max(2, Math.round(Math.min(cw, ch) * 0.06));
    // Ambient breathing: 60 s cycle, far half / near half, never settles.
    var breath = 0.5 - 0.5 * Math.cos(2 * Math.PI * t / 60);
    var ambientNear = breath > 0.5;
    // Drag influence: while dragging, panels near the finger read near;
    // after release it fades over ~2 s back to ambient.
    var fade = 1;
    if (drag === null && releaseT > -1e8) {
      fade = Math.exp(-(t - releaseT) / 2);
      fade = r4(fade);
    }
    var cur = currentIndex(t);

    function isNear(i) {
      if (ambientNear) return true;
      if (drag !== null && cellDist(i, dragCell) <= 1) return true;
      if (drag === null && fade > 0.5 && releaseCell >= 0 && cellDist(i, releaseCell) <= 1) return true;
      return false;
    }

    // Draw all panels except the current one, then the current enlarged.
    for (var i = 0; i < 100; i++) {
      if (i === cur) continue;
      var col = i % 10, row = Math.floor(i / 10);
      drawPanel(col * cw + g, row * ch + g, cw - 2 * g, ch - 2 * g, panels[i], isNear(i));
    }
    // Current panel: slightly enlarged, but the wall stays visible.
    (function () {
      var col = cur % 10, row = Math.floor(cur / 10);
      var px = col * cw, py = row * ch;
      var ew = cw * 1.12, eh = ch * 1.12;
      var ex = px + cw / 2 - ew / 2, ey = py + ch / 2 - eh / 2;
      // Keep it inside the frame.
      if (ex < 0) ex = 0; if (ey < 0) ey = 0;
      if (ex + ew > W) ex = W - ew; if (ey + eh > H) ey = H - eh;
      ctx.fillStyle = '#141210';
      ctx.fillRect(ex - 1, ey - 1, ew + 2, eh + 2);
      drawPanel(ex + g, ey + g, ew - 2 * g, eh - 2 * g, panels[cur], isNear(cur));
    })();
  }

  // Frame one, synchronously, at a constant phase.
  draw(0);

  // rAF loop, anchored on the first call; typeof-guarded for node-canvas.
  var start = -1;
  function loop(ts) {
    if (start < 0) start = ts;
    draw((ts - start) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

  // Probe hook (harmless in browsers): lets QA drive time and pointers.
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: draw, panels: panels, currentIndex: currentIndex,
      state: function () { return { dragCell: dragCell, releaseCell: releaseCell }; },
      fire: function (type, x, y) {
        var e = { clientX: x, clientY: y };
        if (type === 'down') onDown(e);
        else if (type === 'move') onMove(e);
        else if (type === 'up') onUp(e, nowT);
      }
    };
  }
})();
</script>
</body>
</html>
