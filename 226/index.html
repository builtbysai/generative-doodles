<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.226 Resonance Field</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0A0A0C; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.226 Resonance Field (Kathy McTavish). Her chance sound drawn
// instead of heard: four out-of-phase ripple centres drift slowly on
// near-black ground, their concentric rings crossing into moire, and
// small warm glyphs orbit each centre like buffers of found sound
// made visible. The original mixes found sound with a Web Audio hum;
// this gallery piece stays silent, which suits her low-bandwidth
// discipline. Watch only: a pure motion loop, no interaction at all,
// not even a reseed. The centres are never synced: the out-of-phase
// drift is the piece.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0A0A0C', CYAN = '#35E0FF', WARM = '#D8A05A';
var W = 0, H = 0, phone = false;
var T = 41; // clock offset: frame one opens mid-interference

var CENTERS = [
  { fx: 0.30, fy: 0.38, ax: 0.045, ay: 0.055, fxq: 2 * Math.PI / 74, fyq: 2 * Math.PI / 57, p1: 0.0, p2: 2.1, spacing: 44, speed: 13.5, phase: 0 },
  { fx: 0.68, fy: 0.30, ax: 0.055, ay: 0.040, fxq: 2 * Math.PI / 63, fyq: 2 * Math.PI / 83, p1: 1.7, p2: 0.4, spacing: 49, speed: 15.5, phase: 130 },
  { fx: 0.58, fy: 0.67, ax: 0.040, ay: 0.050, fxq: 2 * Math.PI / 89, fyq: 2 * Math.PI / 66, p1: 3.9, p2: 5.2, spacing: 41, speed: 12.0, phase: 270 },
  { fx: 0.23, fy: 0.73, ax: 0.050, ay: 0.045, fxq: 2 * Math.PI / 58, fyq: 2 * Math.PI / 77, p1: 5.3, p2: 1.2, spacing: 52, speed: 14.5, phase: 390 }
];
function centerPos(c) {
  return {
    x: (c.fx + c.ax * Math.sin(T * c.fxq + c.p1)) * W,
    y: (c.fy + c.ay * Math.cos(T * c.fyq + c.p2)) * H
  };
}
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var maxR = Math.hypot(W, H) * 0.46;
  ctx.lineWidth = 1.3;
  ctx.strokeStyle = CYAN;
  CENTERS.forEach(function (c) {
    var p = centerPos(c);
    var n = Math.ceil(maxR / c.spacing);
    for (var k = 0; k < n; k++) {
      var r = ((T * c.speed + c.phase + k * c.spacing) % maxR);
      if (r < 2) continue;
      var f = 1 - r / maxR;
      ctx.globalAlpha = f * f * 0.55;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, 6.3);
      ctx.stroke();
    }
  });
  ctx.globalAlpha = 1;
  // warm glyphs orbiting each centre: buffers of found sound
  CENTERS.forEach(function (c, ci) {
    var p = centerPos(c);
    ctx.fillStyle = WARM;
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.4, 0, 6.3); ctx.fill();
    ctx.strokeStyle = WARM;
    ctx.lineWidth = 2;
    for (var j = 0; j < 3; j++) {
      var orad = 27 + j * 23 + ci * 4;
      var ang = T * (0.22 + j * 0.13) * (j % 2 ? -1 : 1) + ci * 2.1 + j * 2.4;
      var gx = p.x + Math.cos(ang) * orad, gy = p.y + Math.sin(ang) * orad * 0.92;
      ctx.beginPath();
      ctx.arc(gx, gy, 5, ang, ang + 1.9);
      ctx.stroke();
      ctx.beginPath(); ctx.arc(gx, gy, 1.4, 0, 6.3); ctx.fill();
    }
  });
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: this piece does not take input.
var lastNow = -1;
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
