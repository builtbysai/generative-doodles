<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Site Constrains the Piece</title>
<style>
html, body { margin: 0; padding: 0; background: #2E2A4A; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* The Site Constrains the Piece: a bare stone circle at dusk, drawn
   from above. The site is the score: one seed deals the stones, the
   wind direction and the shadow angle. A gust front sweeps the field
   on a fixed cycle; each stone rings, an expanding faint ring and a
   brief brightening, as the gust reaches it. The mountain shadow
   line sets the tempo of the slow light cycle. A tap deals a new
   site under the same rules. Audio is omitted; the visual ring
   pulse carries the resonance. */
var TAU = Math.PI * 2;
var GROUND = '#2E2A4A';
var GRANITE = '#8A8A92';
var GRASS = '#5C7A5A';
var GUST = '#E8E6F0';
var INDIGO = '#1E1B3A';
var SEED0 = 1895;
var FRAME_T = 6.0;       /* fixed phase: gust front mid-field, a stone ringing */
var GUST_PERIOD = 14;    /* seconds per gust sweep across the field */
var RING_LEN = 1.6;      /* seconds a stone rings after the gust reaches it */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smooth(f) { f = clamp(f, 0, 1); return f * f * (3 - 2 * f); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var tapCount = 0;
var siteSeed = SEED0;
/* QA hooks only: ?t=N sets the clock in seconds, ?seed=N deals the
   site with that seed. No link in the piece uses these. */
try {
  var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
  var mt = qs.match(/[?&]t=([0-9.]+)/);
  var ms = qs.match(/[?&]seed=([0-9]+)/);
  if (mt) phaseT = parseFloat(mt[1]);
  if (ms) siteSeed = parseInt(ms[1], 10);
} catch (e) { /* keep defaults */ }
FRAME_T = phaseT;
/* ---- the site: everything from one seed ---- */
var site = null;
function buildSite(seed) {
  var rng = mulberry32(seed);
  var i, j;
  var nStones = 9 + Math.floor(rng() * 4);   /* 9 to 12 stones */
  var stones = [];
  for (i = 0; i < nStones; i++) {
    var ang = (i / nStones) * TAU + (rng() * 2 - 1) * 0.16;
    stones.push({
      ang: ang,
      rad: 0.255 + (rng() * 2 - 1) * 0.022,
      w: 0.028 + rng() * 0.020,              /* stone width, fraction of S */
      h: 0.020 + rng() * 0.014,
      rot: ang + Math.PI / 2 + (rng() * 2 - 1) * 0.35,
      shade: 0.75 + rng() * 0.25
    });
  }
  var tufts = [];
  for (i = 0; i < 90; i++) {
    var ta = rng() * TAU;
    var tr = 0.30 + rng() * 0.11;
    tufts.push({ x: 0.5 + Math.cos(ta) * tr, y: 0.54 + Math.sin(ta) * tr,
                 a: rng() * TAU, len: 0.006 + rng() * 0.010 });
  }
  var peaks = [];
  var nPeaks = 7 + Math.floor(rng() * 4);
  for (i = 0; i <= nPeaks; i++) {
    peaks.push({ x: i / nPeaks, y: 0.25 + rng() * 0.75 });
  }
  var streaks = [];
  for (i = 0; i < 7; i++) {
    streaks.push({ off: rng(), lat: (rng() * 2 - 1) * 0.42,
                   len: 0.10 + rng() * 0.14, sp: 0.030 + rng() * 0.025,
                   a: 0.18 + rng() * 0.22 });
  }
  site = {
    stones: stones,
    tufts: tufts,
    peaks: peaks,
    streaks: streaks,
    windDir: rng() * TAU,                    /* gust travel direction */
    shadowAng: (rng() * 2 - 1) * 0.6,        /* shadow line tilt, radians */
    lightPeriod: 34 + rng() * 22,            /* shadow angle sets the tempo */
    lightPhase: rng() * TAU
  };
}
buildSite(siteSeed);
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: full-bleed on phones, a centered square on
   desktop. The page ground is the piece ground, so the square sits
   in its own dusk. Returns {ox, oy, s, w, h}. */
function pieceRect() {
  if (isPhone) return { ox: 0, oy: 0, s: Math.min(VW, VH), w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { ox: (VW - s) / 2, oy: (VH - s) / 2, s: s, w: s, h: s };
}
/* Projection of a point in the piece rect onto the wind axis, 0 to 1
   across the field. */
function windProj(x, y) {
  var dx = Math.cos(site.windDir), dy = Math.sin(site.windDir);
  return clamp(0.5 + ((x - 0.5) * dx + (y - 0.54) * dy) / 0.95, 0, 1);
}
/* Seconds into the current gust cycle when the front reaches a
   projection p. Front sweeps from -0.1 to 1.1 over GUST_PERIOD. */
function triggerTau(p) {
  return GUST_PERIOD * (p + 0.1) / 1.2;
}
function drawHorizon(R) {
  /* mountain silhouette: a thin jagged band along the top of the rect */
  var bandH = R.h * 0.085;
  ctx.fillStyle = INDIGO;
  ctx.beginPath();
  ctx.moveTo(R.ox, R.oy);
  ctx.lineTo(R.ox + R.w, R.oy);
  var i, p;
  for (i = site.peaks.length - 1; i >= 0; i--) {
    p = site.peaks[i];
    ctx.lineTo(R.ox + p.x * R.w, R.oy + bandH * (1 - p.y * 0.85));
  }
  ctx.closePath();
  ctx.fill();
}
function drawGrass(R) {
  var cx = R.ox + 0.5 * R.w, cy = R.oy + 0.54 * R.h;
  /* low grass ring around the circle */
  ctx.fillStyle = rgba(GRASS, 0.85);
  ctx.beginPath();
  ctx.moveTo(cx + 0.41 * R.s, cy);
  ctx.arc(cx, cy, 0.41 * R.s, 0, TAU);
  ctx.moveTo(cx + 0.295 * R.s, cy);
  ctx.arc(cx, cy, 0.295 * R.s, 0, TAU, true);
  ctx.fill('evenodd');
  /* grass tufts: short strokes scattered through the ring */
  ctx.strokeStyle = rgba(GRASS, 0.9);
  ctx.lineCap = 'round';
  var i, t;
  for (i = 0; i < site.tufts.length; i++) {
    t = site.tufts[i];
    var tx = R.ox + t.x * R.w, ty = R.oy + t.y * R.h;
    var tl = t.len * R.s;
    ctx.lineWidth = Math.max(1, R.s * 0.0016);
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx + Math.cos(t.a) * tl, ty + Math.sin(t.a) * tl);
    ctx.stroke();
  }
}
function drawShadow(R, t) {
  /* the shadow line: a straight cut across the field at the site
     shadow angle; the indigo side lies in deeper dusk, and the
     whole light level breathes slowly at the tempo the shadow sets */
  var cx = R.ox + 0.5 * R.w, cy = R.oy + 0.54 * R.h;
  var dx = Math.cos(site.shadowAng), dy = Math.sin(site.shadowAng);
  var nx = -dy, ny = dx;
  var L = Math.max(VW, VH);   /* cover the whole viewport, not just the field */
  var px = cx + dx * L, py = cy + dy * L;
  var qx = cx - dx * L, qy = cy - dy * L;
  ctx.fillStyle = rgba(INDIGO, 0.22);
  ctx.beginPath();
  ctx.moveTo(px + nx * L, py + ny * L);
  ctx.lineTo(qx + nx * L, qy + ny * L);
  ctx.lineTo(qx - nx * L, qy - ny * L);
  ctx.lineTo(px - nx * L, py - ny * L);
  ctx.closePath();
  ctx.fill();
  var light = 0.5 + 0.5 * Math.sin(TAU * t / site.lightPeriod + site.lightPhase);
  ctx.fillStyle = rgba(INDIGO, 0.10 * (1 - light) + 0.02);
  ctx.fillRect(0, 0, VW, VH);
}
function drawStones(R, t) {
  var cx = R.ox + 0.5 * R.w, cy = R.oy + 0.54 * R.h;
  var cyc = t % GUST_PERIOD;
  var i, st;
  for (i = 0; i < site.stones.length; i++) {
    st = site.stones[i];
    var sx = 0.5 + Math.cos(st.ang) * st.rad;
    var sy = 0.54 + Math.sin(st.ang) * st.rad;
    var px = R.ox + sx * R.w, py = R.oy + sy * R.h;
    var sw = st.w * R.s, sh = st.h * R.s;
    /* stone shadow, offset toward the shadow side */
    ctx.fillStyle = rgba(INDIGO, 0.5);
    ctx.beginPath();
    ctx.ellipse(px + sw * 0.18, py + sh * 0.55, sw * 0.52, sh * 0.55, st.rot, 0, TAU);
    ctx.fill();
    /* the stone itself, granite, shaded per stone */
    ctx.fillStyle = rgba(GRANITE, 0.55 + 0.45 * st.shade);
    ctx.beginPath();
    ctx.ellipse(px, py, sw * 0.52, sh * 0.55, st.rot, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = rgba(INDIGO, 0.55);
    ctx.lineWidth = Math.max(1, R.s * 0.0012);
    ctx.beginPath();
    ctx.ellipse(px, py, sw * 0.52, sh * 0.55, st.rot, 0, TAU);
    ctx.stroke();
    /* ringing: the gust front has passed this stone within RING_LEN */
    var age = cyc - triggerTau(windProj(sx, sy));
    if (age >= 0 && age < RING_LEN) {
      var frac = age / RING_LEN;
      var rr = (0.035 + frac * 0.065) * R.s;
      ctx.strokeStyle = rgba(GUST, (1 - frac) * 0.8);
      ctx.lineWidth = Math.max(1, R.s * 0.0022 * (1 - frac * 0.5));
      ctx.beginPath();
      ctx.moveTo(px + rr, py);
      ctx.arc(px, py, Math.max(0.5, rr), 0, TAU);
      ctx.stroke();
      ctx.fillStyle = rgba(GUST, (1 - frac) * 0.35);
      ctx.beginPath();
      ctx.ellipse(px, py, sw * 0.52, sh * 0.55, st.rot, 0, TAU);
      ctx.fill();
    }
  }
}
function drawGusts(R, t) {
  /* pale streaks sweeping across the field along the wind, plus the
     faint gust front line itself */
  var dx = Math.cos(site.windDir), dy = Math.sin(site.windDir);
  var nx = -dy, ny = dx;
  var cx = R.ox + 0.5 * R.w, cy = R.oy + 0.54 * R.h;
  var i, s;
  ctx.lineCap = 'round';
  for (i = 0; i < site.streaks.length; i++) {
    s = site.streaks[i];
    var along = ((s.off + t * s.sp) % 1.3) - 0.15;
    var bx = cx + dx * along * R.s + nx * s.lat * R.s;
    var by = cy + dy * along * R.s + ny * s.lat * R.s;
    var ex = bx + dx * s.len * R.s, ey = by + dy * s.len * R.s;
    ctx.strokeStyle = rgba(GUST, s.a);
    ctx.lineWidth = Math.max(1, R.s * 0.0022);
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(ex, ey);
    ctx.stroke();
  }
  /* gust front: the line the ringing follows */
  var f = -0.1 + 1.2 * ((t % GUST_PERIOD) / GUST_PERIOD);
  var fx = cx + dx * (f - 0.5) * 0.95 * R.s;
  var fy = cy + dy * (f - 0.5) * 0.95 * R.s;
  ctx.strokeStyle = rgba(GUST, 0.08);
  ctx.lineWidth = Math.max(1, R.s * 0.0015);
  ctx.beginPath();
  ctx.moveTo(fx + nx * 0.42 * R.s, fy + ny * 0.42 * R.s);
  ctx.lineTo(fx - nx * 0.42 * R.s, fy - ny * 0.42 * R.s);
  ctx.stroke();
}
function drawPlates(R) {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 19;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Site Constrains the Piece').width > R.w - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Site Constrains the Piece').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 03 · 21').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = R.ox + 12, plateY = R.oy + 12;
  ctx.fillStyle = INDIGO;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = rgba(GUST, 0.45);
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = GUST;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Site Constrains the Piece', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillText('2007 · 03 · 21', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Tap to deal a new site.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = R.ox + 12;
  var hintPlateY = R.oy + R.h - hintPlateH - 12;
  ctx.fillStyle = INDIGO;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = rgba(GUST, 0.45);
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = GUST;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var R = pieceRect();
  /* The circle itself lives in a square field: on phones the field
     is the centered square inside the full-bleed viewport, so the
     stone ring never stretches into an ellipse. */
  var S = Math.min(VW, VH);
  var F = isPhone
    ? { ox: (VW - S) / 2, oy: (VH - S) / 2, s: S, w: S, h: S }
    : R;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var t = phaseT;
  drawHorizon(R);
  drawGrass(F);
  drawShadow(F, t);
  drawStones(F, t);
  drawGusts(F, t);
  drawPlates(R);
}
/* Tap reseeds the site: a new arrangement of stones, a new wind
   direction, a new shadow angle, the same ritual logic. The tap
   never reloads. Seed advances deterministically per tap. */
function onTap() {
  tapCount += 1;
  siteSeed = SEED0 + tapCount;
  buildSite(siteSeed);
  draw();
}
try { canvas.addEventListener('pointerdown', onTap); } catch (e) { /* no pointer events */ }
/* ---- frame one: fixed phase t = 6 s, seed 1895, gust mid-sweep,
   a stone ringing ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
