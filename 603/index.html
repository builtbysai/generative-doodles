<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walk Into the Garden</title>
<style>
  html, body { margin:0; padding:0; background:#D8D5CC; height:100%; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.603 Walk Into the Garden - EXPANSION #73 paz-tamburrini, block 3 "Tunel de Papel".
   A tunnel book as a dolly shot: six cut-paper layers, drag vertically to walk in. */

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rng = mulberry32(603073);

var INK='#1A1A1A', SAGE='#A8B89A', PEACH='#E8C4A8', GRAY='#D8D5CC', BLUE='#A8C4D4', NAVY='#2B4A6F';

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var VW = 1000, VH = 900;
function computeSize(){
  var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
  VW = vv ? vv.width : (window.innerWidth || 1000);
  VH = vv ? vv.height : (window.innerHeight || 900);
}
computeSize();

var screenMin = 9999;
if (typeof window !== 'undefined' && window.screen) {
  screenMin = Math.min(window.screen.width || 9999, window.screen.height || 9999);
}
var IS_PHONE = screenMin < 700;

function resize(){
  computeSize();
  if (!IS_PHONE && VH > VW * 1.15) IS_PHONE = true;
  canvas.width = VW;
  canvas.height = VH;
  canvas.style.width = VW + 'px';
  canvas.style.height = VH + 'px';
}
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('resize', resize);
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
}
resize();

/* ---------------- stage ---------------- */
var STAGE = 1000, CTR = 500;

/* ---------------- layers ----------------
   idx 0 = nearest frame ... idx 4 = elephant frame, idx 5 = back wall.
   win = window half-size in local coords (0 for the solid back wall).
   p   = parallax factor: how much the layer grows as the dolly advances. */
var LAYERS = [
  { win: 400, band: SAGE,  p: 0.85 },
  { win: 352, band: PEACH, p: 0.72 },
  { win: 302, band: GRAY,  p: 0.58 },
  { win: 256, band: SAGE,  p: 0.45 },
  { win: 214, band: GRAY,  p: 0.32 },
  { win: 0,   band: GRAY,  p: 0.18 }
];

/* ---------------- precomputed seeded detail ---------------- */
function inBand(x, y, win){
  var dx = Math.abs(x - CTR), dy = Math.abs(y - CTR);
  return (dx > win || dy > win) && dx < 575 && dy < 575;
}
var speckles = [], wallSpeckles = [];
(function(){
  var i, x, y, tries;
  for (i = 0; i < LAYERS.length - 1; i++){
    var arr = [];
    tries = 0;
    while (arr.length < 110 && tries < 3000){
      tries++;
      x = CTR + (rng() * 2 - 1) * 570;
      y = CTR + (rng() * 2 - 1) * 570;
      if (inBand(x, y, LAYERS[i].win)) arr.push({x:x, y:y, r:0.8 + rng() * 1.9, a:0.05 + rng() * 0.08});
    }
    speckles.push(arr);
  }
  for (i = 0; i < 240; i++){
    wallSpeckles.push({x: CTR + (rng() * 2 - 1) * 560, y: CTR + (rng() * 2 - 1) * 560, r:0.8 + rng() * 2.0, a:0.04 + rng() * 0.07});
  }
})();

/* fern fronds: anchor, length, angle (deg, 0 = +x, CCW negative up), bend, leaflet count */
function frond(x, y, len, angDeg, bend, leaflets, jit){
  return { x:x, y:y, len:len, ang:angDeg * Math.PI / 180, bend:bend, n:leaflets, ph: jit };
}
var fronds0 = [ /* nearest frame: ferns left and right, reaching in */
  frond(58, 760, 255, -72, 0.5, 9, rng() * 6), frond(70, 820, 215, -58, 0.7, 8, rng() * 6),
  frond(52, 640, 195, -84, 0.4, 8, rng() * 6), frond(90, 880, 170, -46, 0.8, 7, rng() * 6),
  frond(942, 760, 255, -108, -0.5, 9, rng() * 6), frond(930, 820, 215, -122, -0.7, 8, rng() * 6),
  frond(948, 640, 195, -96, -0.4, 8, rng() * 6), frond(910, 880, 170, -134, -0.8, 7, rng() * 6),
  frond(235, 952, 150, -80, 0.5, 7, rng() * 6), frond(765, 952, 150, -100, -0.5, 7, rng() * 6)
];
var fronds1 = [ /* second frame: taller ferns */
  frond(140, 880, 380, -76, 0.45, 11, rng() * 6), frond(120, 760, 320, -64, 0.6, 10, rng() * 6),
  frond(860, 880, 380, -104, -0.45, 11, rng() * 6), frond(880, 760, 320, -116, -0.6, 10, rng() * 6),
  frond(180, 950, 260, -70, 0.5, 9, rng() * 6), frond(820, 950, 260, -110, -0.5, 9, rng() * 6)
];
var curls1 = [ /* curling stems, top corners of frame 2 */
  {x:168, y:150, r:42, dir:1, ph:rng() * 6}, {x:832, y:150, r:36, dir:-1, ph:rng() * 6},
  {x:140, y:320, r:27, dir:1, ph:rng() * 6}, {x:860, y:320, r:27, dir:-1, ph:rng() * 6}
];
/* seed pods hanging from the top edge of frame 3 */
var pods2 = [];
(function(){
  var xs = [318, 402, 598, 682], i;
  for (i = 0; i < xs.length; i++){
    var dots = [], k;
    for (k = 0; k < 7; k++) dots.push({dx:(rng() * 2 - 1) * 14, dy:(rng() * 2 - 1) * 20, r:2 + rng() * 2.4});
    pods2.push({x: xs[i] + (rng() * 2 - 1) * 10, stem: 38 + rng() * 26, w: 22 + rng() * 8, h: 33 + rng() * 10, dots: dots, ph: rng() * 6});
  }
})();
/* leafy arch along the top edge of frame 4 */
var archLeaves = [];
(function(){
  var i;
  for (i = 0; i < 9; i++){
    archLeaves.push({x: 292 + i * 52 + (rng() * 2 - 1) * 8, y: 238 + Math.sin(i / 8 * Math.PI) * -12 + (rng() * 2 - 1) * 6,
      rot: -0.85 + i * 0.21 + (rng() * 2 - 1) * 0.2, s: 0.75 + rng() * 0.4});
  }
})();
var pods3 = [
  {x:294, stem:44, w:19, h:28, ph:1.2}, {x:706, stem:44, w:19, h:28, ph:5.1}
];
/* small stars on the elephant frame band */
var bandStars = [];
(function(){
  var tries = 0;
  while (bandStars.length < 16 && tries < 3000){
    tries++;
    var x = CTR + (rng() * 2 - 1) * 540, y = CTR + (rng() * 2 - 1) * 540;
    if (inBand(x, y, LAYERS[4].win)) bandStars.push({x:x, y:y, r:5 + rng() * 6, ph:rng() * 6});
  }
})();
/* back wall: moon perforations + stars */
var moonHoles = [];
(function(){
  var i;
  for (i = 0; i < 15; i++){
    var a = rng() * Math.PI * 2, rr = Math.sqrt(rng()) * 82;
    moonHoles.push({dx: Math.cos(a) * rr, dy: Math.sin(a) * rr, r: 3.5 + rng() * 5});
  }
})();
var wallStars = [];
(function(){
  var i;
  for (i = 0; i < 22; i++){
    wallStars.push({x: CTR + (rng() * 2 - 1) * 470, y: CTR + (rng() * 2 - 1) * 430, r: 5 + rng() * 8, c: rng() < 0.6 ? NAVY : PEACH, ph: rng() * 6});
  }
})();

/* ---------------- interaction state ---------------- */
var D0 = 0.18;
var dUser = D0;              /* dolly target set by drag / settle */
var dragging = false;
var dragStartY = 0, dragStartD = D0, dragMoved = 0;
var downX = 0, downY = 0, downT = 0;
var settle = null;           /* {from,to,start} */
var liftStart = [-9, -9, -9, -9, -9, -9];
var elapsed = 0;

function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function easeOut(k){ return 1 - Math.pow(1 - k, 3); }

function currentD(t){
  var d = dUser;
  if (settle){
    var k = clamp((t - settle.start) / 0.38, 0, 1);
    d = settle.from + (settle.to - settle.from) * easeOut(k);
    if (k >= 1){ dUser = settle.to; settle = null; d = dUser; }
    return Math.round(d * 24) / 24;   /* stepped stops: her stopmotion grammar */
  }
  if (!dragging) d = d + 0.05 * Math.sin(t * Math.PI * 2 / 11);  /* slow breathing dolly */
  return clamp(Math.round(d * 72) / 72, 0, 1);
}
function liftVal(i, t){
  var k = (t - liftStart[i]) / 0.95;
  if (k < 0 || k > 1) return 0;
  return Math.sin(k * Math.PI);
}
function layerScale(i, t, d){
  return (1 + d * LAYERS[i].p) * (1 + 0.055 * liftVal(i, t));
}

/* ---------------- drawing helpers ---------------- */
function roundRectPath(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function framePath(win){
  ctx.beginPath();
  ctx.rect(CTR - 580, CTR - 580, 1160, 1160);
  var x = CTR - win, y = CTR - win, s = win * 2, r = 30;
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + s - r, y); ctx.arcTo(x + s, y, x + s, y + r, r);
  ctx.lineTo(x + s, y + s - r); ctx.arcTo(x + s, y + s, x + s - r, y + s, r);
  ctx.lineTo(x + r, y + s); ctx.arcTo(x, y + s, x, y + s - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function drawSpeckles(arr){
  var i;
  for (i = 0; i < arr.length; i++){
    ctx.fillStyle = 'rgba(26,26,26,' + arr[i].a.toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(arr[i].x, arr[i].y, arr[i].r, 0, Math.PI * 2); ctx.fill();
  }
}
function drawFrond(f, color, sway){
  var steps = 14, i, px = f.x, py = f.y, ang = f.ang + sway;
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(px, py);
  var pts = [{x:px, y:py}];
  for (i = 1; i <= steps; i++){
    var k = i / steps;
    ang += f.bend * 0.055;
    px += Math.cos(ang) * (f.len / steps);
    py += Math.sin(ang) * (f.len / steps);
    pts.push({x:px, y:py});
    ctx.lineTo(px, py);
  }
  ctx.stroke();
  for (i = 2; i < pts.length - 1; i++){
    var p0 = pts[i], kk = i / pts.length, ls = (1 - kk) * 26 + 6;
    var la = f.ang + f.bend * 0.055 * i;
    var sgn = (i % 2 === 0) ? 1 : -1;
    var ex = p0.x + Math.cos(la + sgn * 1.15) * ls, ey = p0.y + Math.sin(la + sgn * 1.15) * ls;
    ctx.beginPath();
    ctx.ellipse((p0.x + ex) / 2, (p0.y + ey) / 2, ls / 2, ls / 3.4, la + sgn * 1.15, 0, Math.PI * 2);
    ctx.fill();
  }
}
function drawCurl(c, color, sway){
  ctx.strokeStyle = color; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
  ctx.beginPath();
  var i, turns = 1.7, steps = 30;
  for (i = 0; i <= steps; i++){
    var k = i / steps, a = c.dir * k * turns * Math.PI + sway;
    var r = c.r * (1 - k * 0.82);
    var x = c.x + Math.cos(a) * r, y = c.y + Math.sin(a) * r - k * 26;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
}
function drawPod(p, topY, sway){
  var cxp = p.x + Math.sin(sway) * 5, cyp = topY + p.stem + p.h;
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(p.x, topY - 4); ctx.quadraticCurveTo(p.x + Math.sin(sway) * 3, topY + p.stem * 0.55, cxp, cyp - p.h); ctx.stroke();
  ctx.fillStyle = PEACH;
  ctx.beginPath(); ctx.ellipse(cxp, cyp, p.w, p.h, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(cxp, cyp, p.w, p.h, 0, 0, Math.PI * 2); ctx.stroke();
  var dots = p.dots || [{dx:-8, dy:-8, r:2.6}, {dx:7, dy:2, r:2.2}, {dx:-3, dy:12, r:2.8}];
  ctx.fillStyle = NAVY;
  var i;
  for (i = 0; i < dots.length; i++){ ctx.beginPath(); ctx.arc(cxp + dots[i].dx, cyp + dots[i].dy, dots[i].r, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = GRAY;
  ctx.beginPath(); ctx.arc(cxp + p.w * 0.34, cyp - p.h * 0.4, 3.2, 0, Math.PI * 2); ctx.fill();
}
function drawStar(x, y, r, color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y);
  ctx.quadraticCurveTo(x, y, x, y - r);
  ctx.fill();
}
function drawElephant(x, y, s, color, earColor, flip){
  ctx.save();
  ctx.translate(x, y); ctx.scale(flip * s, s);
  /* legs */
  ctx.fillStyle = color;
  ctx.fillRect(-46, -36, 12, 36); ctx.fillRect(-18, -36, 12, 36);
  ctx.fillRect(16, -36, 12, 36); ctx.fillRect(42, -36, 12, 36);
  /* body */
  ctx.beginPath(); ctx.ellipse(-4, -64, 56, 36, 0, 0, Math.PI * 2); ctx.fill();
  /* tail */
  ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-58, -78); ctx.quadraticCurveTo(-70, -58, -66, -34); ctx.stroke();
  /* head */
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(46, -72, 25, 0, Math.PI * 2); ctx.fill();
  /* ear */
  ctx.fillStyle = earColor;
  ctx.beginPath(); ctx.ellipse(34, -70, 13, 18, 0.2, 0, Math.PI * 2); ctx.fill();
  /* trunk */
  ctx.strokeStyle = color; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(64, -62); ctx.quadraticCurveTo(76, -38, 68, -12); ctx.stroke();
  /* eye */
  ctx.fillStyle = GRAY;
  ctx.beginPath(); ctx.arc(52, -76, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* ---------------- layers ---------------- */
function drawBackWall(t){
  var i = 5, d = drawState.d, s = layerScale(i, t, d), L = LAYERS[i];
  ctx.save();
  ctx.translate(CTR, CTR); ctx.scale(s, s); ctx.translate(-CTR, -CTR);
  ctx.fillStyle = GRAY;
  ctx.fillRect(CTR - 580, CTR - 580, 1160, 1160);
  drawSpeckles(wallSpeckles);
  /* stars */
  for (var k = 0; k < wallStars.length; k++){
    var st = wallStars[k];
    if (Math.abs(st.x - CTR) < 150 && Math.abs(st.y - (CTR - 46)) < 150) continue; /* keep the moon clear */
    drawStar(st.x, st.y, st.r, st.c);
  }
  /* sage ground the elephants stand on */
  ctx.fillStyle = SAGE;
  ctx.beginPath();
  ctx.moveTo(CTR - 580, 668);
  ctx.quadraticCurveTo(CTR - 200, 646, CTR, 660);
  ctx.quadraticCurveTo(CTR + 240, 676, CTR + 580, 656);
  ctx.lineTo(CTR + 580, CTR + 580); ctx.lineTo(CTR - 580, CTR + 580);
  ctx.closePath(); ctx.fill();
  /* perforated moon */
  var mx = CTR, my = CTR - 46;
  ctx.fillStyle = PEACH;
  ctx.beginPath(); ctx.arc(mx, my, 108, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = NAVY; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(mx, my, 108, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = GRAY;
  for (k = 0; k < moonHoles.length; k++){ ctx.beginPath(); ctx.arc(mx + moonHoles[k].dx, my + moonHoles[k].dy, moonHoles[k].r, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = NAVY;
  ctx.beginPath(); ctx.arc(mx - 34, my + 30, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 44, my - 18, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawFrameLayer(i, t){
  var d = drawState.d, s = layerScale(i, t, d), L = LAYERS[i];
  var lift = liftVal(i, t);
  var shOff = 7 + d * 10 + lift * 16;
  ctx.save();
  ctx.translate(CTR, CTR); ctx.scale(s, s); ctx.translate(-CTR, -CTR);
  /* contact shadow onto the layers behind */
  ctx.save();
  ctx.translate(shOff, shOff * 1.25);
  framePath(L.win);
  ctx.fillStyle = 'rgba(26,26,26,0.16)';
  ctx.fill('evenodd');
  ctx.restore();
  /* the paper frame itself */
  framePath(L.win);
  ctx.fillStyle = L.band;
  ctx.fill('evenodd');
  drawSpeckles(speckles[i]);
  /* cut edge */
  roundRectPath(CTR - L.win, CTR - L.win, L.win * 2, L.win * 2, 30);
  ctx.strokeStyle = 'rgba(26,26,26,0.30)'; ctx.lineWidth = 3; ctx.stroke();

  var sway = Math.sin(t * 0.9 + i * 1.7) * 0.02;
  var k;
  if (i === 0){
    for (k = 0; k < fronds0.length; k++) drawFrond(fronds0[k], INK, sway * (k % 2 ? 1 : -1));
  } else if (i === 1){
    for (k = 0; k < fronds1.length; k++) drawFrond(fronds1[k], SAGE, sway * (k % 2 ? 1 : -1));
    for (k = 0; k < curls1.length; k++) drawCurl(curls1[k], INK, sway * 2);
  } else if (i === 2){
    for (k = 0; k < pods2.length; k++) drawPod(pods2[k], CTR - L.win, Math.sin(t * 0.8 + pods2[k].ph) * 0.5);
  } else if (i === 3){
    for (k = 0; k < archLeaves.length; k++){
      var lf = archLeaves[k];
      ctx.save();
      ctx.translate(lf.x, lf.y); ctx.rotate(lf.rot + sway * 2); ctx.scale(lf.s, lf.s);
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.ellipse(0, 0, 11, 21, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    for (k = 0; k < pods3.length; k++) drawPod(pods3[k], CTR - L.win, Math.sin(t * 0.8 + pods3[k].ph) * 0.5);
  } else if (i === 4){
    for (k = 0; k < bandStars.length; k++) drawStar(bandStars[k].x, bandStars[k].y, bandStars[k].r, NAVY);
    /* the elephant pair, standing inside the window on the back wall's ground */
    ctx.fillStyle = 'rgba(26,26,26,0.15)';
    ctx.beginPath(); ctx.ellipse(CTR - 58, 656, 96, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(CTR + 92, 656, 58, 9, 0, 0, Math.PI * 2); ctx.fill();
    drawElephant(CTR - 62, 654, 1.06, INK, GRAY, 1);
    drawElephant(CTR + 96, 654, 0.74, BLUE, GRAY, -1);
  }
  ctx.restore();
}

var drawState = { d: D0 };

function draw(t){
  canvas.style.width = VW + 'px';
  canvas.style.height = VH + 'px';
  drawState.d = currentD(t);
  ctx.fillStyle = GRAY;
  ctx.fillRect(0, 0, VW, VH);
  var S = Math.min(VW, VH) / STAGE;
  var ox = (VW - STAGE * S) / 2, oy = (VH - STAGE * S) / 2;
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(S, S);
  ctx.beginPath();
  ctx.rect(0, 0, STAGE, STAGE);
  ctx.clip();
  drawBackWall(t);
  var i;
  for (i = 4; i >= 0; i--) drawFrameLayer(i, t);
  /* hint */
  ctx.fillStyle = 'rgba(26,26,26,0.5)';
  ctx.font = '24px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText('drag · tap', 500, 970);
  ctx.restore();
}

/* ---------------- loop ---------------- */
var startStamp = null;
function frame(now){
  if (startStamp === null) startStamp = now;
  elapsed = (now - startStamp) / 1000;
  draw(elapsed);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
draw(0);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);

/* ---------------- pointer ---------------- */
function toStage(e){
  var r = canvas.getBoundingClientRect();
  var S = Math.min(VW, VH) / STAGE;
  var ox = (VW - STAGE * S) / 2, oy = (VH - STAGE * S) / 2;
  return { x: (e.clientX - r.left - ox) / S, y: (e.clientY - r.top - oy) / S };
}
function bandAt(pt, t){
  var r = Math.max(Math.abs(pt.x - CTR), Math.abs(pt.y - CTR));
  var d = currentD(t), i;
  for (i = 0; i < 5; i++){
    if (r > LAYERS[i].win * layerScale(i, t, d)) return i;
  }
  return 5;
}
if (canvas.addEventListener){
  canvas.addEventListener('pointerdown', function(e){
    var pt = toStage(e);
    dragging = true; settle = null;
    dragStartY = pt.y; dragStartD = dUser; dragMoved = 0;
    downX = pt.x; downY = pt.y; downT = elapsed;
    if (canvas.setPointerCapture && e.pointerId !== undefined){ try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  canvas.addEventListener('pointermove', function(e){
    if (!dragging) return;
    var pt = toStage(e);
    var dy = pt.y - dragStartY;
    dragMoved = Math.max(dragMoved, Math.abs(dy), Math.abs(pt.x - downX));
    dUser = clamp(dragStartD - dy * 0.0035, 0, 1);   /* drag up = walk in */
  });
  function endPointer(e){
    if (!dragging) return;
    dragging = false;
    var pt = toStage(e);
    var quick = (elapsed - downT) < 0.35;
    var still = Math.max(Math.abs(pt.x - downX), Math.abs(pt.y - downY)) < 9;
    if (quick && still){
      liftStart[bandAt(pt, elapsed)] = elapsed;   /* tap: the frame lifts for a beat */
    } else {
      settle = { from: dUser, to: Math.round(dUser * 24) / 24, start: elapsed };
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
}
</script>
