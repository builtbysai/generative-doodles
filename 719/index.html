<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Dance</title>
<style>
  html, body { margin: 0; padding: 0; background: #1B1B1F; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// Paper Dance (EXPANSION #87 janine-antoni, block 8)
// A small abstract capsule figure crosses a dark gallery floor from crate
// to crate, trailing a long ribbon of brown paper. Each crate it reaches
// opens to reveal a small glowing abstract work. Across three cycles the
// works shuffle to different crates and the crates close again.
// The choreography is a precomputed seeded waypoint schedule: the figure's
// position, every lid angle and the ribbon are pure functions of time.
// The ribbon is the path function drawn over a trailing window, not an
// integrated verlet strip.

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var COL = {
  floor: '#1B1B1F',
  crate: '#4A4238',
  figure: '#2A2A30',
  paper: '#C9BFAE'
};
var WORK_COLS = ['#B0463C', '#3C6E8F', '#C9A13C'];

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, isPhone = false;
var U = 1, OX = 0, OY = 0; // design-unit scale and origin, set per frame
var curT = 0;

// Inert QA hook: ?seed=tNN renders the frame at NN seconds. No effect in
// the gallery, where location.search is empty.
(function () {
  var s = (typeof location !== 'undefined' && location.search) || '';
  var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(s);
  if (m) curT = parseFloat(m[1]);
})();

var SEED_BASE = 71987;
var PRE = 3.2;            // seconds of approach path before the start point
var RIBBON_TMAX = 34;     // longest stretch of path the ribbon keeps
var HOME = { x: 500, y: 902 };
var APPROACH = { x: HOME.x - 86, y: HOME.y + 62 }; // ribbon tail at t = 0

// ---------------------------------------------------------------------------
// Epoch state: layout, schedule, works. Regenerated on a double-tap reseed.
// ---------------------------------------------------------------------------
var epoch = 0;
var epochT0 = 0;
var crates = [];      // {x, y, s, w, h}
var visitOrder = [];
var openStart = [];   // cycle-relative time each crate begins opening
var segments = [];    // {type, t0, t1, from, to, crate}
var cycleDur = 1, closeStart = 0, closeDur = 2.2;
var works = [];       // per work id: {color, shapes:[{kind, rx, ry, s, rot}]}
var perms = [];       // per cycle phase 0..2: crate -> work id
var overrides = {};   // crate -> {cycle, startAbs} from taps
var dragEvents = [];  // {t0, dx, dy}
var liveDrag = null;  // {t0, dx, dy}
var lastTap = null;   // {t, x, y}

function buildEpoch(ep) {
  var rng = mulberry32(SEED_BASE + ep * 7919);

  // Loose 3x3 floor grid with jitter; keep 6-9 cells.
  var cells = [];
  for (var gy = 0; gy < 3; gy++) {
    for (var gx = 0; gx < 3; gx++) {
      cells.push({
        x: 268 + gx * 232 + (rng() * 2 - 1) * 42,
        y: 268 + gy * 218 + (rng() * 2 - 1) * 36
      });
    }
  }
  // Fisher-Yates shuffle, take the first n.
  for (var i = cells.length - 1; i > 0; i--) {
    var j = Math.floor(rng() * (i + 1));
    var tmp = cells[i]; cells[i] = cells[j]; cells[j] = tmp;
  }
  var n = 6 + Math.floor(rng() * 4);
  crates = [];
  for (i = 0; i < n; i++) {
    var s = 0.8 + 0.28 * (cells[i].y / 1000); // subtle perspective
    crates.push({ x: cells[i].x, y: cells[i].y, s: s, w: 98 * s, h: 66 * s });
  }

  // Visit order: greedy nearest neighbour from home.
  var remaining = crates.map(function (_, idx) { return idx; });
  visitOrder = [];
  var px = HOME.x, py = HOME.y;
  while (remaining.length) {
    var best = 0, bestD = Infinity;
    remaining.forEach(function (ci, k) {
      var d = Math.hypot(crates[ci].x - px, crates[ci].y - py);
      if (d < bestD) { bestD = d; best = k; }
    });
    var ci2 = remaining.splice(best, 1)[0];
    visitOrder.push(ci2);
    px = crates[ci2].x; py = crates[ci2].y;
  }

  // Waypoint schedule.
  segments = [];
  openStart = new Array(crates.length).fill(Infinity);
  var cur = 0;
  var from = { x: HOME.x, y: HOME.y };
  visitOrder.forEach(function (ci3) {
    var c = crates[ci3];
    var ap = { x: c.x, y: c.y + c.h * 0.5 + 30 * c.s }; // stand in front
    var d = Math.hypot(ap.x - from.x, ap.y - from.y);
    var td = Math.min(6, Math.max(1.4, d / 58));
    segments.push({ type: 'travel', t0: cur, t1: cur + td, from: from, to: ap, crate: ci3 });
    cur += td;
    openStart[ci3] = cur + 0.35;
    segments.push({ type: 'pause', t0: cur, t1: cur + 1.9, from: ap, to: ap, crate: ci3 });
    cur += 1.9;
    from = ap;
  });
  var rd = Math.hypot(HOME.x - from.x, HOME.y - from.y);
  var rtd = Math.min(6, Math.max(1.4, rd / 58));
  segments.push({ type: 'return', t0: cur, t1: cur + rtd, from: from, to: { x: HOME.x, y: HOME.y }, crate: -1 });
  cur += rtd;
  segments.push({ type: 'hold', t0: cur, t1: cur + 3.2, from: { x: HOME.x, y: HOME.y }, to: { x: HOME.x, y: HOME.y }, crate: -1 });
  cur += 3.2;
  closeStart = cur;
  segments.push({ type: 'close', t0: cur, t1: cur + closeDur, from: { x: HOME.x, y: HOME.y }, to: { x: HOME.x, y: HOME.y }, crate: -1 });
  cycleDur = cur + closeDur;

  // Works: one seeded mini-composition per crate slot.
  works = [];
  for (i = 0; i < crates.length; i++) {
    var wrng = mulberry32(SEED_BASE * 3 + ep * 104729 + i * 101 + 7);
    var shapes = [];
    var nsh = 3 + Math.floor(wrng() * 2);
    for (var k = 0; k < nsh; k++) {
      shapes.push({
        kind: Math.floor(wrng() * 4),
        rx: (wrng() * 2 - 1) * 0.52,
        ry: (wrng() * 2 - 1) * 0.5,
        s: 0.2 + wrng() * 0.3,
        rot: wrng() * Math.PI
      });
    }
    works.push({ color: WORK_COLS[i % 3], shapes: shapes });
  }

  // Work-to-crate permutations, one per cycle phase.
  perms = [];
  for (var ph = 0; ph < 3; ph++) {
    var prng = mulberry32(SEED_BASE * 7 + ep * 31 + ph * 131 + 17);
    var perm = crates.map(function (_, idx) { return idx; });
    for (i = perm.length - 1; i > 0; i--) {
      var jj = Math.floor(prng() * (i + 1));
      var t2 = perm[i]; perm[i] = perm[jj]; perm[jj] = t2;
    }
    perms.push(perm);
  }

  overrides = {};
  dragEvents = [];
  liveDrag = null;
  lastTap = null;
}

function smoother(u) { return u * u * u * (u * (u * 6 - 15) + 10); }
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

function segAt(tr) {
  for (var i = 0; i < segments.length; i++) {
    if (tr <= segments[i].t1) return segments[i];
  }
  return segments[segments.length - 1];
}

function posAt(tr) {
  var sg = segAt(tr);
  if (sg.type === 'travel' || sg.type === 'return') {
    var u = smoother(clamp01((tr - sg.t0) / (sg.t1 - sg.t0)));
    return { x: sg.from.x + (sg.to.x - sg.from.x) * u, y: sg.from.y + (sg.to.y - sg.from.y) * u };
  }
  return { x: sg.from.x, y: sg.from.y };
}

function headingAt(tr) {
  var sg = segAt(tr);
  if (sg.type === 'travel' || sg.type === 'return') {
    return Math.atan2(sg.to.y - sg.from.y, sg.to.x - sg.from.x);
  }
  if (sg.type === 'pause' && sg.crate >= 0) {
    var c = crates[sg.crate];
    return Math.atan2(c.y - sg.from.y, c.x - sg.from.x);
  }
  return -Math.PI / 2;
}

function closeProg(tr) {
  if (tr <= closeStart) return 0;
  return clamp01((tr - closeStart) / closeDur);
}

function cycleInfo(absT) {
  var rel = Math.max(0, absT - epochT0);
  var ci = Math.floor(rel / cycleDur);
  return { index: ci, tr: rel - ci * cycleDur, startAbs: epochT0 + ci * cycleDur };
}

// Open amount 0..1 for a crate at an absolute time: schedule, tap
// overrides for the current cycle, and the closing phase all fold in.
function crateOpen(i, absT) {
  var info = cycleInfo(absT);
  var p = 0;
  if (info.tr > openStart[i]) p = Math.min(1, (info.tr - openStart[i]) / 1.0);
  var ov = overrides[i];
  if (ov && ov.cycle === info.index && absT >= ov.startAbs) {
    p = Math.max(p, Math.min(1, (absT - ov.startAbs) / 1.0));
  }
  var cp = closeProg(info.tr);
  return p * (1 - smoother(cp));
}

// Drag offsets: pure function of the recorded events (plus the live drag).
function offsetAt(absT) {
  var ox = 0, oy = 0;
  for (var i = 0; i < dragEvents.length; i++) {
    var dt = absT - dragEvents[i].t0;
    if (dt >= 0) {
      var env = Math.exp(-dt / 4.5);
      ox += dragEvents[i].dx * env;
      oy += dragEvents[i].dy * env;
    }
  }
  if (liveDrag && absT >= liveDrag.t0) { ox += liveDrag.dx; oy += liveDrag.dy; }
  var m = Math.hypot(ox, oy);
  if (m > 130) { ox = ox / m * 130; oy = oy / m * 130; }
  return { x: ox, y: oy };
}

// Path position for ribbon time s (cycle-relative; negative = approach).
function pathPos(s) {
  if (s < 0) {
    var u = clamp01((s + PRE) / PRE);
    return { x: APPROACH.x + (HOME.x - APPROACH.x) * u, y: APPROACH.y + (HOME.y - APPROACH.y) * u };
  }
  return posAt(s);
}

// ---------------------------------------------------------------------------
// Drawing helpers.
// ---------------------------------------------------------------------------
function px(x) { return OX + x * U; }
function py(y) { return OY + y * U; }

function drawCrate(c, openAmt, work) {
  var x = c.x, y = c.y, w = c.w, h = c.h, s = c.s;
  var depth = 16 * s, inset = 9 * s;

  // Body.
  ctx.save();
  ctx.fillStyle = COL.crate;
  ctx.fillRect(px(x - w / 2), py(y - h / 2), w * U, h * U);
  // Front shading: a floor-tone wash on the lower band.
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = COL.floor;
  ctx.fillRect(px(x - w / 2), py(y + h * 0.12), w * U, h * 0.38 * U);
  ctx.restore();

  // Revealed work, sitting in the opening at the top of the box.
  if (openAmt > 0.01 && work) {
    var gx = x, gy = y - h / 2 - 2 * s - openAmt * 3 * s;
    ctx.save();
    ctx.fillStyle = work.color;
    [0.05, 0.09, 0.15].forEach(function (a, k) {
      ctx.globalAlpha = a * openAmt;
      ctx.beginPath();
      ctx.ellipse(px(gx), py(gy), (w * (0.42 + k * 0.16)) * U, (h * (0.4 + k * 0.15)) * U, 0, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 0.92 * openAmt;
    work.shapes.forEach(function (sh) {
      var sx = gx + sh.rx * w * 0.5, sy = gy + sh.ry * h * 0.42;
      var ss = sh.s * w;
      ctx.save();
      ctx.translate(px(sx), py(sy));
      ctx.rotate(sh.rot);
      ctx.beginPath();
      if (sh.kind === 0) { ctx.arc(0, 0, ss * 0.32 * U, 0, Math.PI * 2); }
      else if (sh.kind === 1) { ctx.moveTo(0, -ss * 0.36 * U); ctx.lineTo(ss * 0.34 * U, ss * 0.26 * U); ctx.lineTo(-ss * 0.34 * U, ss * 0.26 * U); ctx.closePath(); }
      else if (sh.kind === 2) { ctx.rect(-ss * 0.36 * U, -ss * 0.13 * U, ss * 0.72 * U, ss * 0.26 * U); }
      else { ctx.moveTo(0, -ss * 0.36 * U); ctx.lineTo(ss * 0.3 * U, 0); ctx.lineTo(0, ss * 0.36 * U); ctx.lineTo(-ss * 0.3 * U, 0); ctx.closePath(); }
      ctx.fill();
      ctx.restore();
    });
    ctx.restore();
  }

  // Lid: a quad hinged on the back-top edge; opening lifts its front edge.
  var o = openAmt;
  var bx0 = x - w / 2 + inset, bx1 = x + w / 2 - inset, by = y - h / 2 - depth;
  var fx0 = x - w / 2 + inset * (1 - o), fx1 = x + w / 2 - inset * (1 - o);
  var fy = (y - h / 2) - o * h * 0.92;
  ctx.save();
  ctx.fillStyle = COL.crate;
  ctx.beginPath();
  ctx.moveTo(px(bx0), py(by));
  ctx.lineTo(px(bx1), py(by));
  ctx.lineTo(px(fx1), py(fy));
  ctx.lineTo(px(fx0), py(fy));
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = COL.floor;
  ctx.lineWidth = Math.max(0.7, 1.4 * U);
  ctx.stroke();
  ctx.restore();

  // Edge definition and the closed lid line.
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = COL.floor;
  ctx.lineWidth = Math.max(0.7, 1.5 * U);
  ctx.strokeRect(px(x - w / 2), py(y - h / 2), w * U, h * U);
  ctx.globalAlpha = 0.65;
  ctx.beginPath();
  ctx.moveTo(px(x - w / 2), py(y - h / 2));
  ctx.lineTo(px(x + w / 2), py(y - h / 2));
  ctx.stroke();
  ctx.restore();
}

function drawRibbon(info, tr) {
  var sStart = Math.max(info.index === 0 ? -PRE : 0, tr - RIBBON_TMAX);
  if (tr - sStart < 0.05) return;
  var fade = 1 - 0.85 * smoother(closeProg(tr));
  var pts = [];
  var step = 0.15;
  for (var s = sStart; s <= tr; s += step) {
    var p = pathPos(s);
    var off = offsetAt(info.startAbs + s);
    pts.push({ x: p.x + off.x, y: p.y + off.y, s: s });
  }
  var fp = posAt(tr);
  var fo = offsetAt(info.startAbs + tr);
  pts.push({ x: fp.x + fo.x, y: fp.y + fo.y, s: tr });

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = COL.paper;
  for (var i = 1; i < pts.length; i++) {
    var f = (pts[i].s - sStart) / Math.max(0.001, tr - sStart);
    ctx.globalAlpha = 0.92 * fade;
    ctx.lineWidth = Math.max(0.8, (6.5 + 6.5 * f) * U);
    ctx.beginPath();
    ctx.moveTo(px(pts[i - 1].x), py(pts[i - 1].y));
    ctx.lineTo(px(pts[i].x), py(pts[i].y));
    ctx.stroke();
  }
  // Crease line down the middle of the strip.
  ctx.globalAlpha = 0.16 * fade;
  ctx.strokeStyle = COL.floor;
  ctx.lineWidth = Math.max(0.6, 1.1 * U);
  ctx.beginPath();
  pts.forEach(function (p, i) {
    if (i === 0) ctx.moveTo(px(p.x), py(p.y)); else ctx.lineTo(px(p.x), py(p.y));
  });
  ctx.stroke();
  ctx.restore();
}

function drawFigure(tr, absT) {
  var p = posAt(tr);
  var off = offsetAt(absT);
  var sg = segAt(tr);
  var bob = (sg.type === 'travel' || sg.type === 'return') ? Math.sin(tr * 7) * 1.3 : 0;
  var x = p.x + off.x, y = p.y + off.y + bob;
  var ang = headingAt(tr);
  var len = 36, wid = 19;

  ctx.save();
  ctx.translate(px(x), py(y));
  ctx.rotate(ang);
  // Capsule body.
  ctx.beginPath();
  var r = wid / 2 * U, hl = len / 2 * U;
  ctx.moveTo(-hl + r, -r);
  ctx.lineTo(hl - r, -r);
  ctx.arc(hl - r, 0, r, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(-hl + r, r);
  ctx.arc(-hl + r, 0, r, Math.PI / 2, Math.PI * 1.5);
  ctx.closePath();
  ctx.fillStyle = COL.figure;
  ctx.fill();
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = COL.paper;
  ctx.lineWidth = Math.max(0.6, 1 * U);
  ctx.stroke();
  ctx.restore();
}

function draw(t) {
  if (W === 0 || H === 0) return;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  var unit = Math.min(W, H);
  U = unit / 1000;
  OX = (W - unit) / 2;
  OY = (H - unit) / 2;

  ctx.fillStyle = COL.floor;
  ctx.fillRect(0, 0, W, H);

  var info = cycleInfo(t);
  var tr = info.tr;
  var perm = perms[info.index % 3];

  drawRibbon(info, tr);

  // Crates sorted back to front so nearer boxes overlap farther ones.
  var order = crates.map(function (_, i) { return i; });
  order.sort(function (a, b) { return crates[a].y - crates[b].y; });
  order.forEach(function (i) {
    drawCrate(crates[i], crateOpen(i, t), works[perm[i]]);
  });

  drawFigure(tr, t);
}

// ---------------------------------------------------------------------------
// Interaction: drag nudges the path, tap opens the nearest closed crate,
// double-tap reseeds the layout. Never a reload.
// ---------------------------------------------------------------------------
var pDown = null; // {t, x, y, dragging}

function toDesign(ev) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var unit = Math.min(W, H) || 1;
  return {
    x: ((ev.clientX - rect.left) - (W - unit) / 2) / (unit / 1000),
    y: ((ev.clientY - rect.top) - (H - unit) / 2) / (unit / 1000)
  };
}

if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (ev) {
    var p = toDesign(ev);
    pDown = { t: curT, x: p.x, y: p.y, dragging: false };
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (!pDown) return;
    var p = toDesign(ev);
    var dx = p.x - pDown.x, dy = p.y - pDown.y;
    if (!pDown.dragging && Math.hypot(dx, dy) > 14) pDown.dragging = true;
    if (pDown.dragging) liveDrag = { t0: pDown.t, dx: dx, dy: dy };
  });
  canvas.addEventListener('pointerup', function (ev) {
    if (!pDown) return;
    var p = toDesign(ev);
    if (pDown.dragging) {
      dragEvents.push({ t0: curT, dx: p.x - pDown.x, dy: p.y - pDown.y });
      if (dragEvents.length > 24) dragEvents.splice(0, dragEvents.length - 24);
      liveDrag = null;
    } else if (curT - pDown.t < 0.45) {
      // Tap. A second tap close behind is a double-tap: reseed.
      if (lastTap && curT - lastTap.t < 0.4 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 60) {
        epoch++;
        epochT0 = curT;
        buildEpoch(epoch);
        lastTap = null;
        pDown = null;
        draw(curT);
        return;
      }
      lastTap = { t: curT, x: p.x, y: p.y };
      // Open the nearest still-closed crate early.
      var info = cycleInfo(curT);
      var best = -1, bestD = Infinity;
      crates.forEach(function (c, i) {
        var d = Math.hypot(c.x - p.x, c.y - p.y);
        if (d < bestD && crateOpen(i, curT) < 0.5) { bestD = d; best = i; }
      });
      if (best >= 0) overrides[best] = { cycle: info.index, startAbs: curT };
    }
    pDown = null;
  });
}

// ---------------------------------------------------------------------------
// Sizing and main loop.
// ---------------------------------------------------------------------------
function resize() {
  var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
  var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  W = Math.round(vw);
  H = Math.round(vh);
  canvas.width = W;
  canvas.height = H;
  var sw = (window.screen && window.screen.width) || 9999;
  var sh = (window.screen && window.screen.height) || 9999;
  isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
  draw(curT);
}

if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
if (window.addEventListener) window.addEventListener('resize', resize);

buildEpoch(0);

// Frame one: synchronous draw at t=0 (deterministic; never clock-derived).
resize();

var bootOffset = curT; // nonzero only under the inert QA seed hook
var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
if (typeof requestAnimationFrame === 'function') {
  var loop = function () {
    curT = bootOffset + (performance.now() - startStamp) / 1000;
    draw(curT);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
