<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>A_n.'d gh[o]st.'s</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #F5F5F2; }
  canvas { display: block; margin: 0; padding: 0; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(896057);

  // ---------- palette (strict) ----------
  var GROUND_POS = '#F5F5F2';
  var GROUND_NEG = '#050505';
  var INK_POS = '#0A0A0A';   // ink on white
  var INK_NEG = '#F5F5F2';   // ink on black (the positive ground tone)
  var CORE = '#FFFFFF';
  var HAIR = '#8A8A88';

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    try {
      var sw = window.screen ? window.screen.width : 0;
      var sh = window.screen ? window.screen.height : 0;
      var mn = Math.min(sw, sh);
      if (mn > 0 && mn < 700) return true;
    } catch (e) {}
    return H > W * 1.15;
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 800);
    var h = vv ? vv.height : (window.innerHeight || 600);
    DPR = (window.devicePixelRatio && window.devicePixelRatio > 0) ? Math.min(window.devicePixelRatio, 2) : 1;
    W = Math.max(50, Math.floor(w));
    H = Math.max(50, Math.floor(h));
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
  }
  resize();
  if (window.visualViewport && typeof window.visualViewport.addEventListener === 'function') {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(currentT()); });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(currentT()); });
  }

  // ---------- the ink system (seeded, fixed) ----------
  var NB = 400; // blobs
  var blobs = [];
  var i, r;
  for (i = 0; i < NB; i++) {
    var ang = rng() * Math.PI * 2;
    var rad = Math.pow(rng(), 0.62);           // denser near heart, reaching rim
    blobs.push({
      a: ang,
      r: rad,
      s: 0.030 + Math.pow(rng(), 1.35) * 0.115, // blob radius, fraction of R
      jag: (rng() - 0.5) * 0.55,               // static jaggedness
      spk: rng() < 0.16 ? 0.25 + rng() * 0.5 : 0, // some blobs ride spikes outward
      w: 0.25 + rng() * 0.9,                   // shimmer rate
      p: rng() * Math.PI * 2                   // shimmer phase
    });
  }
  var NV = 96; // rim vertices of the solid body under the blobs
  var rim = [];
  for (i = 0; i < NV; i++) {
    var bf = 0.55 + rng() * 0.48;
    if (rng() < 0.13) bf *= 1.22 + rng() * 0.3; // spiky protrusions
    rim.push({ bf: bf, w: 0.2 + rng() * 0.7, p: rng() * Math.PI * 2 });
  }
  var NH = 300; // hairlines
  var hairs = [];
  for (i = 0; i < NH; i++) {
    hairs.push({
      a: rng() * Math.PI * 2,
      len: 0.55 + rng() * 0.43,                // fraction of reach
      wob: (rng() - 0.5) * 0.05,               // angular wobble amplitude
      w: 0.1 + rng() * 0.35,
      p: rng() * Math.PI * 2,
      lw: rng() < 0.5 ? 0.5 : 1,
      al: 0.16 + rng() * 0.22
    });
  }

  // ---------- pulsation: two detuned LFOs, pure functions of t ----------
  function massScale(t) {
    // 1.0 = full bloom, ~0.45 = tight knot. At t=0: 0.8 (mid-bloom).
    return 0.725
      + 0.200 * Math.sin(2 * Math.PI * t / 11.3)
      + 0.075 * Math.sin(2 * Math.PI * t / 4.7 + 1.31);
  }
  function spread(t) {
    // filament spread, detuned against the mass so the pair never repeats simply
    return 1
      + 0.10 * Math.sin(2 * Math.PI * t / 7.9 + 0.7)
      + 0.04 * Math.sin(2 * Math.PI * t / 3.3 + 2.9);
  }
  function contraction(t) {
    // 0 at full bloom, 1 at tightest knot
    var s = massScale(t);
    var c = (0.99 - s) / (0.99 - 0.46);
    return c < 0 ? 0 : (c > 1 ? 1 : c);
  }
  function flipInterval(t) {
    // baseline ~4 s, shortening toward ~2 s at max contraction. NEVER below 2 s.
    var iv = 4 - 2 * contraction(t);
    return iv < 2 ? 2 : iv;
  }

  // ---------- flicker clock ----------
  // Autonomous phase: P(t) = integral of 1/flipInterval(s) ds over the parts of
  // [0,t] not frozen by a hold. Each integer crossing of P is one autonomous flip.
  // The integral is tabulated incrementally at 0.02 s steps from pure functions of
  // (t, event log), so polarity(t) is computed from the log, never accumulated state.
  var STEP = 0.02;
  var phaseTab = [0]; // phaseTab[k] = P(k*STEP)
  var holds = [];     // [{start, end}] polarity freezes from double-taps
  function inHold(t) {
    for (var k = 0; k < holds.length; k++) {
      if (t >= holds[k].start && t < holds[k].end) return true;
    }
    return false;
  }
  function phaseAt(t) {
    var k = Math.floor(t / STEP);
    while (phaseTab.length <= k + 1) {
      var n = phaseTab.length - 1;
      var s0 = n * STEP;
      var mid = s0 + STEP / 2;
      var add = inHold(mid) ? 0 : STEP / flipInterval(mid);
      phaseTab.push(phaseTab[n] + add);
    }
    var frac = (t - k * STEP) / STEP;
    var base = phaseTab[k];
    var addNow = inHold(t) ? 0 : (frac * STEP) / flipInterval(t);
    return base + addNow;
  }
  function lastAutoFlipTime(t) {
    // most recent time <= t at which floor(P) last increased (0 if none / at origin)
    var target = Math.floor(phaseAt(t));
    if (target <= 0) return 0;
    var lo = 0, hi = t;
    for (var it = 0; it < 40; it++) {
      var mid = (lo + hi) / 2;
      if (Math.floor(phaseAt(mid)) >= target) hi = mid; else lo = mid;
    }
    return hi;
  }

  // ---------- interaction log ----------
  var taps = [];        // accepted tap times (each = one manual flip)
  var lastDownAt = -10; // for double-tap detection
  var HOLD_LEN = 5;
  var MIN_GAP = 0.5;    // global rate limiter: >= 0.5 s between ANY two flips

  function polarityAt(t) {
    var flips = Math.floor(phaseAt(t)) + taps.length;
    return (flips % 2 === 0) ? 0 : 1; // 0 = positive (white ground), 1 = inverted
  }

  // ---------- audio (lazy, guarded; first tap only) ----------
  var AC = null, bedGain = null, audioOn = false;
  function initAudio() {
    if (audioOn) return;
    audioOn = true;
    try {
      var Ctor = (typeof window !== 'undefined') ? (window.AudioContext || window.webkitAudioContext) : null;
      if (!Ctor) return;
      AC = new Ctor();
      // low filtered noise bed
      var len = AC.sampleRate * 2;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var d = buf.getChannelData(0);
      var ar = mulberry32(4242);
      var last = 0;
      for (var j = 0; j < len; j++) {
        var white = ar() * 2 - 1;
        last = (last + 0.02 * white) / 1.02; // brownish
        d[j] = last * 3.2;
      }
      var src = AC.createBufferSource();
      src.buffer = buf; src.loop = true;
      var lp = AC.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 220; lp.Q.value = 0.4;
      bedGain = AC.createGain(); bedGain.gain.value = 0.05;
      src.connect(lp); lp.connect(bedGain); bedGain.connect(AC.destination);
      src.start();
    } catch (e) { AC = null; }
  }
  function thump() {
    if (!AC) return;
    try {
      var t0 = AC.currentTime;
      var o = AC.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(96, t0);
      o.frequency.exponentialRampToValueAtTime(38, t0 + 0.16);
      var g = AC.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      var sh = null;
      if (typeof AC.createWaveShaper === 'function') {
        sh = AC.createWaveShaper();
        var curve = new Float32Array(256);
        for (var j = 0; j < 256; j++) {
          var x = j / 128 - 1;
          curve[j] = Math.max(-0.72, Math.min(0.72, x * 2.4)); // soft clip: weight, not sparkle
        }
        sh.curve = curve;
        o.connect(sh); sh.connect(g);
      } else {
        o.connect(g);
      }
      g.connect(AC.destination);
      o.start(t0); o.stop(t0 + 0.26);
    } catch (e) {}
  }

  // ---------- pointer ----------
  function onDown() {
    initAudio();
    if (AC && typeof AC.resume === 'function') { try { AC.resume(); } catch (e) {} }
    var t = currentT();
    if (inHold(t)) return;
    if (t - lastDownAt < 0.35) {
      // double-tap: hold the current polarity for 5 s (phase clock pauses)
      holds.push({ start: t, end: t + HOLD_LEN });
      phaseTab = [0]; // holds changed: retabulate the phase integral from the log
      lastDownAt = -10;
      return;
    }
    lastDownAt = t;
    // rate limiter: at least MIN_GAP since the last flip of any kind
    var lastFlip = lastAutoFlipTime(t);
    if (taps.length) lastFlip = Math.max(lastFlip, taps[taps.length - 1]);
    if (t - lastFlip >= MIN_GAP) {
      taps.push(t);
      thump();
    }
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('touchstart', function (e) { if (e && e.preventDefault) e.preventDefault(); }, { passive: false });
  }

  // ---------- draw ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var pol = polarityAt(t);
    var ground = pol === 0 ? GROUND_POS : GROUND_NEG;
    var ink = pol === 0 ? INK_POS : INK_NEG;
    if (document.body && document.body.style) document.body.style.background = ground;
    ctx.fillStyle = ground;
    ctx.fillRect(0, 0, W, H);

    var minDim = Math.min(W, H);
    var cx = W / 2, cy = H / 2;
    var R = minDim * 0.30;              // blot occupies the middle ~60%
    var reach = minDim * 0.495;         // hairlines reach near the edges
    var sc = massScale(t);
    var sp = spread(t);

    // hairlines (under the mass): cracked-glass filaments
    ctx.strokeStyle = HAIR;
    ctx.lineCap = 'round';
    for (var j = 0; j < hairs.length; j++) {
      var hh = hairs[j];
      var a = hh.a + hh.wob * Math.sin(t * hh.w + hh.p);
      var r0 = R * sc * 0.35;
      var r1 = reach * hh.len * sp;
      ctx.globalAlpha = hh.al;
      ctx.lineWidth = hh.lw;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // the solid body: a filled rim polygon, radius noise-displaced per vertex
    ctx.fillStyle = ink;
    ctx.beginPath();
    for (var v = 0; v <= NV; v++) {
      var rv = rim[v % NV];
      var va = (v % NV) / NV * Math.PI * 2;
      var vr = R * sc * rv.bf * (1 + 0.05 * Math.sin(t * rv.w + rv.p));
      var vx = cx + Math.cos(va) * vr;
      var vy = cy + Math.sin(va) * vr;
      if (v === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
    }
    ctx.closePath();
    ctx.fill();

    // the mass: 400 seeded blobs, jagged rim, internal shimmer
    ctx.fillStyle = ink;
    for (var k = 0; k < blobs.length; k++) {
      var b = blobs[k];
      var shim = 1 + 0.10 * Math.sin(t * b.w + b.p);
      var rr = b.r * R * sc * shim;
      rr *= 1 + b.jag * (b.r * b.r);           // jaggedness grows toward the rim
      rr += b.spk * R * sc * (0.5 + 0.5 * Math.sin(t * 0.6 + b.p)); // spike riders breathe
      var x = cx + Math.cos(b.a) * rr;
      var y = cy + Math.sin(b.a) * rr;
      var rad = b.s * R * sc + 0.6;
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fill();
    }

    // hot white core: layered flat-alpha discs (no gradients)
    var coreR = R * sc * 0.30;
    var layers = [1.0, 0.90, 0.81, 0.72, 0.63, 0.54, 0.45, 0.36, 0.28];
    var layerA = [0.12, 0.16, 0.22, 0.30, 0.40, 0.52, 0.66, 0.82, 1.0]; // innermost disc is solid white
    ctx.fillStyle = CORE;
    for (var m = 0; m < layers.length; m++) {
      ctx.globalAlpha = layerA[m];
      ctx.beginPath();
      ctx.arc(cx, cy, coreR * layers[m], 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- clock: frame one is the synchronous draw at t = 0 ----------
  var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function currentT() {
    if (typeof performance !== 'undefined' && performance.now) {
      return Math.max(0, (performance.now() - startStamp) / 1000);
    }
    return 0;
  }
  draw(0);

  var lastPol = polarityAt(0);
  function frame() {
    var t = currentT();
    draw(t);
    var p = polarityAt(t);
    if (p !== lastPol) { lastPol = p; thump(); } // the flip has weight
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
