<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sun Moon Stars Rain, Choreographed</title>
<style>
  html, body { margin:0; padding:0; background:#0A0A08; height:100%; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1224 "Sun Moon Stars Rain, Choreographed" - Leslie Supnet study block LS1.
   A 24-second ritual sky scored second by second, rendered at a stepped 7 fps.
   Everything is a function of piece time tau plus recorded drag/reseed events. */

var FIELD = '#0A0A08', BONE = '#F2EAD8', SULFUR = '#E8B71A',
    RED = '#C62B2B', BLUE = '#5A6B8C', GRAY = '#6A6258';

/* ---------- seeded hashes (no Math.random anywhere) ---------- */
function hash1(n) {
  n = Math.imul(n ^ (n >>> 16), 2246822507);
  n = Math.imul(n ^ (n >>> 13), 3266489909);
  n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
function h2(a, b) { return hash1((Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0); }
function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- the score: 24 seconds, glyph order drives assignments ---------- */
var SEED = 84;
var order = [], score = [], totalSteps = 0;
function genScore(seed) {
  var rng = mulberry(seed * 7919 + 13), i, j, t;
  order = [];
  for (i = 0; i < 24; i++) order.push(i);
  for (i = 23; i > 0; i--) { j = Math.floor(rng() * (i + 1)); t = order[i]; order[i] = order[j]; order[j] = t; }
  score = []; totalSteps = 0;
  for (var s = 0; s < 24; s++) {
    var r = mulberry(seed * 104729 + s * 1299709 + 7);
    var g = order[s];
    var sunSteps = 1 + Math.floor(r() * 3);
    var moonPhase = Math.floor(r() * 6);
    var scatter = [0, 0.25, 0.5, 0.75, 1][Math.floor(r() * 5)];
    var rain = Math.floor(r() * 3);
    var accent = Math.floor(r() * 5);
    if (g === 0) { sunSteps = 3; accent = 0; }
    if (g === 1) { accent = 1; }
    if (g === 2 || g === 3) { scatter = r() < 0.5 ? 0 : 1; }
    if (g === 3) { accent = 3; }
    if (g === 4) { rain = 2; accent = 4; }
    if (g === 6) { accent = 2; }
    score.push({ g: g, sunSteps: sunSteps, moonPhase: moonPhase, scatter: scatter, rain: rain, accent: accent });
    totalSteps += sunSteps;
  }
}
genScore(SEED);
function cumSteps(sec) { var a = 0; for (var k = 0; k < sec; k++) a += score[k].sunSteps; return a; }

/* ---------- piece time: segment model over recorded events ----------
   segments: {type:'const', t0, tau0, rate}  -> tau = tau0 + rate*(now-t0)
             {type:'ease',  t0, tau0, rate0} -> rate eases back to 1 over 4 s:
               u<4: tau = tau0 + u + (rate0-1)*(u - u*u/8)
               u>=4: tau = tau0 + u + 2*(rate0-1)                              */
var TAU0 = 9.3;
var segs = [{ type: 'const', t0: 0, tau0: TAU0, rate: 1 }];
var drag = { active: false, x0: 0, y0: 0, dx: 0, dy: 0, tau0: TAU0, t0: 0 };
var wallNow = 0, lastTapT = -10;
function tauAt(now) {
  if (drag.active) return drag.tau0 + drag.dx * 0.008;
  var s = segs[segs.length - 1], u = now - s.t0;
  if (s.type === 'const') return s.tau0 + s.rate * u;
  if (u < 4) return s.tau0 + u + (s.rate0 - 1) * (u - u * u / 8);
  return s.tau0 + u + 2 * (s.rate0 - 1);
}

/* ---------- canvas / viewport ---------- */
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = w; H = h;
  var bw = Math.round(w * DPR), bh = Math.round(h * DPR);
  if (canvas.width !== bw) canvas.width = bw;
  if (canvas.height !== bh) canvas.height = bh;
  var scr = window.screen || { width: w, height: h };
  PHONE = (Math.min(scr.width, scr.height) < 700) || (h > w * 1.15);
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

/* ---------- drawing helpers (jittered polygons, lines boil per frame) ---------- */
function jt(f, id, k, amp) { return (h2(f * 7 + id * 131, k) - 0.5) * 2 * amp; }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function poly(pts, close) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (close) ctx.closePath();
}
function circPts(cx, cy, r, f, id, n) {
  var pts = [];
  for (var k = 0; k < n; k++) {
    var a = k / n * Math.PI * 2;
    var rr = r + (h2(f + id * 57, k) - 0.5) * 2.2;
    pts.push([cx + Math.cos(a) * rr + jt(f, id, k + 40, 0.8), cy + Math.sin(a) * rr + jt(f, id, k + 80, 0.8)]);
  }
  return pts;
}

/* ---------- timeline glyphs: 24 distinct mini-shapes ---------- */
function drawGlyph(id, x, y, r, f, col) {
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.3;
  var j = function (k) { return jt(f, 300 + id, k, 0.5); };
  var L = function (x1, y1, x2, y2) { line(x + x1 * r, y + y1 * r, x + x2 * r, y + y2 * r); };
  var C = function (cx, cy, rr) { poly(circPts(x + cx * r, y + cy * r, rr * r, f, 300 + id, 12), true); ctx.stroke(); };
  var DOT = function (cx, cy) { ctx.fillRect(x + cx * r - 1, y + cy * r - 1, 2, 2); };
  var k, a, pts;
  switch (id) {
    case 0: C(0, 0, 0.5); for (k = 0; k < 8; k++) { a = k / 8 * Math.PI * 2; L(Math.cos(a) * 0.68, Math.sin(a) * 0.68, Math.cos(a), Math.sin(a)); } break;
    case 1: C(0, 0, 0.8); ctx.fillStyle = FIELD; poly(circPts(x + 0.38 * r, y, 0.66 * r, f, 301, 12), true); ctx.fill(); break;
    case 2: pts = []; for (k = 0; k < 8; k++) { a = k / 8 * Math.PI * 2 - Math.PI / 2; var rr2 = (k % 2 === 0) ? 1 : 0.32; pts.push([x + Math.cos(a) * rr2 * r, y + Math.sin(a) * rr2 * r]); } poly(pts, true); ctx.stroke(); break;
    case 3: for (k = 0; k < 8; k++) { a = k / 8 * Math.PI * 2; L(0, 0, Math.cos(a) * 0.95, Math.sin(a) * 0.95); } DOT(0, 0); break;
    case 4: L(-0.85, -0.55, 0.85, -0.55); L(-0.6, -0.2, -0.75, 0.6); L(0, -0.2, -0.15, 0.6); L(0.6, -0.2, 0.45, 0.6); break;
    case 5: pts = []; for (k = 0; k <= 8; k++) { a = k / 8 * Math.PI; pts.push([x + Math.cos(a) * r, y - Math.sin(a) * 0.5 * r]); } poly(pts, false); ctx.stroke();
            pts = []; for (k = 0; k <= 8; k++) { a = k / 8 * Math.PI; pts.push([x + Math.cos(a) * r, y + Math.sin(a) * 0.5 * r]); } poly(pts, false); ctx.stroke(); DOT(0, 0); break;
    case 6: poly([[x - r, y + 0.8 * r], [x, y - r], [x + r, y + 0.8 * r]], true); ctx.stroke(); L(-0.45, 0.3, 0.45, 0.3); break;
    case 7: pts = []; for (k = 0; k <= 12; k++) { pts.push([x - r + k / 12 * 2 * r, y + Math.sin(k / 12 * Math.PI * 4) * 0.45 * r]); } poly(pts, false); ctx.stroke(); break;
    case 8: C(0, 0, 0.8); break;
    case 9: C(0, 0, 0.85); C(0, 0, 0.38); DOT(0, 0); break;
    case 10: L(0, -0.9, 0, 0.9); L(-0.9, 0, 0.9, 0); break;
    case 11: pts = []; for (k = 0; k <= 16; k++) { a = k / 16 * Math.PI * 5; var rr3 = 0.12 + k / 16 * 0.8; pts.push([x + Math.cos(a) * rr3 * r, y + Math.sin(a) * rr3 * r]); } poly(pts, false); ctx.stroke(); break;
    case 12: poly([[x, y - r], [x + 0.75 * r, y], [x, y + r], [x - 0.75 * r, y]], true); ctx.stroke(); break;
    case 13: pts = [[x, y - r], [x + 0.5 * r, y - 0.15 * r], [x + 0.68 * r, y + 0.4 * r], [x + 0.4 * r, y + 0.88 * r], [x, y + r], [x - 0.4 * r, y + 0.88 * r], [x - 0.68 * r, y + 0.4 * r], [x - 0.5 * r, y - 0.15 * r]]; poly(pts, true); ctx.stroke(); break;
    case 14: poly([[x + 0.25 * r, y - r], [x - 0.35 * r, y + 0.15 * r], [x + 0.05 * r, y + 0.15 * r], [x - 0.25 * r, y + r], [x + 0.4 * r, y - 0.1 * r], [x, y - 0.1 * r]], true); ctx.stroke(); break;
    case 15: for (k = 0; k < 5; k++) { a = k / 5 * Math.PI * 2 - Math.PI / 2; C(Math.cos(a) * 0.55, Math.sin(a) * 0.55, 0.3); } DOT(0, 0); break;
    case 16: pts = []; for (k = 0; k <= 10; k++) { a = Math.PI + k / 10 * Math.PI; pts.push([x + Math.cos(a) * 0.9 * r, y + Math.sin(a) * 0.9 * r]); } poly(pts, false); ctx.stroke(); L(-0.9, 0, 0.9, 0); break;
    case 17: ctx.strokeRect(x - 0.8 * r, y - 0.8 * r, 1.6 * r, 1.6 * r); L(0, -0.8, 0, 0.8); L(-0.8, 0, 0.8, 0); break;
    case 18: L(-0.85, 0, 0.85, 0); L(0.4, -0.45, 0.9, 0); L(0.4, 0.45, 0.9, 0); break;
    case 19: pts = []; for (k = 0; k <= 10; k++) { a = -Math.PI / 2 + k / 10 * Math.PI * 1.6; pts.push([x + Math.cos(a) * 0.62 * r, y - 0.15 * r + Math.sin(a) * 0.62 * r]); } poly(pts, false); ctx.stroke(); L(0, 0.47, 0, 0.95); break;
    case 20: DOT(-0.45, -0.45); L(-0.3, -0.3, 0.75, 0.75); L(-0.55, -0.1, 0.45, 0.7); L(-0.1, -0.55, 0.7, 0.45); break;
    case 21: C(0, 0, 0.95); ctx.beginPath(); poly(circPts(x + 0.22 * r, y - 0.12 * r, 0.58 * r, f, 302, 12), true); ctx.fill(); break;
    case 22: poly([[x - 0.9 * r, y + 0.8 * r], [x - 0.3 * r, y + 0.8 * r], [x - 0.3 * r, y + 0.25 * r], [x + 0.3 * r, y + 0.25 * r], [x + 0.3 * r, y - 0.3 * r], [x + 0.9 * r, y - 0.3 * r]], false); ctx.stroke(); break;
    case 23: L(0, -0.2, 0, 0.9); L(-0.5, 0.9, 0.5, 0.9); poly([[x, y - 0.95 * r], [x + 0.22 * r, y - 0.5 * r], [x, y - 0.3 * r], [x - 0.22 * r, y - 0.5 * r]], true); ctx.stroke(); break;
  }
}

/* ---------- main draw ---------- */
function draw(now) {
  resize();
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = FIELD;
  ctx.fillRect(0, 0, W, H);

  var tau = tauAt(now);
  var loopPos = ((tau % 24) + 24) % 24;
  var loopIdx = Math.floor(tau / 24);
  var f = Math.floor(tau * 7);
  var sec = Math.floor(loopPos);
  var frac = loopPos - sec;
  var sub = Math.floor(frac * 7);
  var sc = score[sec];

  var TL = Math.max(44, Math.min(64, H * 0.09));
  var stageH = H - TL;
  var cx = W / 2, cy = stageH / 2;
  var R = Math.min(W, stageH) * (PHONE ? 0.46 : 0.44);

  ctx.globalAlpha = 0.92 + 0.08 * h2(f, 777);

  /* stars: gathered on a ring at scatter 0, hash-scattered at scatter 1 */
  var NST = 54, i, a, bx, by, ox, oy, px, py, L;
  for (i = 0; i < NST; i++) {
    a = i / NST * Math.PI * 2 + (i % 3) * 0.05;
    bx = cx + Math.cos(a) * R * 0.86;
    by = cy + Math.sin(a) * R * 0.86;
    ox = (h2(i, 501) - 0.5) * 1.15 * R;
    oy = (h2(i, 502) - 0.5) * 1.15 * R;
    px = bx + ox * sc.scatter + jt(f, 500 + i, 1, 0.7);
    py = by + oy * sc.scatter + jt(f, 500 + i, 2, 0.7);
    L = (3 + h2(i, 503) * 4) * (PHONE ? 0.9 : 1);
    ctx.strokeStyle = (i % 5 === 0) ? SULFUR : BONE;
    ctx.globalAlpha = (0.92 + 0.08 * h2(f, 777)) * 0.85;
    ctx.lineWidth = 1.2;
    line(px - L, py, px + L, py);
    line(px, py - L, px, py + L);
  }
  ctx.globalAlpha = 0.92 + 0.08 * h2(f, 777);

  /* rain sheets: short streaks falling in discrete cuts */
  if (sc.rain > 0) {
    ctx.strokeStyle = (sc.accent === 4) ? RED : BONE;
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = (0.92 + 0.08 * h2(f, 777)) * 0.78;
    for (var j = 0; j < sc.rain; j++) {
      var bandCx = cx + (h2(sec * 3 + j, 601) - 0.5) * 1.2 * R;
      for (i = 0; i < 13; i++) {
        var dx = (h2(j * 97 + i, 602) - 0.5) * 0.55 * R;
        var phase = h2(i, j * 7 + 603);
        var stepIdx = Math.floor((phase + sub * 0.16 + j * 0.31) * 22) % 22;
        var ry = cy - 0.85 * R + stepIdx * (1.7 * R / 22);
        var rx = bandCx + dx + (ry - cy) * 0.04 + jt(f, 600 + j * 20 + i, 3, 0.6);
        line(rx, ry, rx + 0.03 * R, ry + 0.075 * R);
      }
    }
    ctx.globalAlpha = 0.92 + 0.08 * h2(f, 777);
  }

  /* sun: disk + triangular rays, rotation in stepped substeps */
  var sunAng = (cumSteps(sec) + sc.sunSteps * (sub / 7) + loopIdx * totalSteps) * 15 * Math.PI / 180;
  var sunX = cx + jt(f, 10, 1, 0.8), sunY = cy + jt(f, 10, 2, 0.8), rSun = 0.20 * R;
  var sunCol = (sc.accent === 0) ? RED : SULFUR;
  ctx.fillStyle = sunCol;
  for (i = 0; i < 12; i++) {
    a = sunAng + i / 12 * Math.PI * 2;
    var b1 = a - 0.10, b2 = a + 0.10;
    poly([[sunX + Math.cos(b1) * rSun * 1.10, sunY + Math.sin(b1) * rSun * 1.10],
          [sunX + Math.cos(b2) * rSun * 1.10, sunY + Math.sin(b2) * rSun * 1.10],
          [sunX + Math.cos(a) * rSun * 1.48, sunY + Math.sin(a) * rSun * 1.48]], true);
    ctx.fill();
  }
  ctx.strokeStyle = sunCol; ctx.lineWidth = 2;
  poly(circPts(sunX, sunY, rSun, f, 10, 22), true); ctx.stroke();
  poly(circPts(sunX, sunY, rSun * 0.62, f, 11, 18), true); ctx.stroke();

  /* moon: six drawn phases, night-blue outline, bone light */
  var moonX = cx - 0.55 * R + jt(f, 20, 1, 0.8), moonY = cy - 0.48 * R + jt(f, 20, 2, 0.8), rMoon = 0.115 * R;
  var ph = sc.moonPhase;
  if (ph > 0) {
    ctx.fillStyle = BONE;
    poly(circPts(moonX, moonY, rMoon, f, 20, 20), true); ctx.fill();
    ctx.fillStyle = FIELD;
    if (ph === 1) { poly(circPts(moonX + 1.12 * rMoon, moonY, rMoon, f, 20, 20), true); ctx.fill(); }
    else if (ph === 2) { poly(circPts(moonX + 0.58 * rMoon, moonY, rMoon, f, 20, 20), true); ctx.fill(); }
    else if (ph === 3) { ctx.fillRect(moonX, moonY - rMoon - 2, rMoon + 3, 2 * rMoon + 4); }
    else if (ph === 4) { poly(circPts(moonX + 1.5 * rMoon, moonY, rMoon, f, 20, 20), true); ctx.fill(); }
  }
  ctx.strokeStyle = (sc.accent === 1) ? RED : BLUE; ctx.lineWidth = 2;
  poly(circPts(moonX, moonY, rMoon, f, 20, 20), true); ctx.stroke();

  /* pyramid: bone linework low in the mandala */
  var pyrCol = (sc.accent === 2) ? RED : BONE;
  var apexX = cx + jt(f, 30, 1, 0.8), apexY = cy + 0.30 * R, baseY = cy + 0.66 * R, halfW = 0.30 * R;
  ctx.strokeStyle = pyrCol; ctx.lineWidth = 2;
  poly([[apexX, apexY], [cx - halfW, baseY], [cx + halfW, baseY]], true); ctx.stroke();
  ctx.lineWidth = 1.3;
  var yy, ww;
  yy = apexY + (baseY - apexY) / 3; ww = halfW / 3; line(apexX - ww, yy, apexX + ww, yy);
  yy = apexY + 2 * (baseY - apexY) / 3; ww = 2 * halfW / 3; line(apexX - ww, yy, apexX + ww, yy);
  poly([[apexX, apexY + 2], [apexX - halfW * 0.18, apexY + (baseY - apexY) * 0.22], [apexX + halfW * 0.18, apexY + (baseY - apexY) * 0.22]], true); ctx.stroke();

  /* starburst: bone rays at the right of the mandala */
  var bstCol = (sc.accent === 3) ? RED : BONE;
  var bstX = cx + 0.56 * R + jt(f, 40, 1, 0.8), bstY = cy + 0.02 * R + jt(f, 40, 2, 0.8);
  ctx.strokeStyle = bstCol; ctx.lineWidth = 2;
  for (i = 0; i < 16; i++) {
    a = i / 16 * Math.PI * 2 + 0.2;
    var rl = (i % 2 === 0) ? 0.17 * R : 0.10 * R;
    line(bstX + Math.cos(a) * rl * 0.25, bstY + Math.sin(a) * rl * 0.25, bstX + Math.cos(a) * rl, bstY + Math.sin(a) * rl);
  }
  poly(circPts(bstX, bstY, 0.028 * R, f, 40, 10), true); ctx.stroke();

  /* outer ring + 24 second-ticks; the current second burns red */
  ctx.strokeStyle = BONE; ctx.globalAlpha = (0.92 + 0.08 * h2(f, 777)) * 0.45; ctx.lineWidth = 1;
  poly(circPts(cx, cy, R, f, 900, 56), true); ctx.stroke();
  for (i = 0; i < 24; i++) {
    a = i / 24 * Math.PI * 2 - Math.PI / 2;
    if (i === sec) { ctx.strokeStyle = RED; ctx.globalAlpha = 1; ctx.lineWidth = 2.5; }
    else { ctx.strokeStyle = BONE; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.5; }
    line(cx + Math.cos(a) * R * 0.955, cy + Math.sin(a) * R * 0.955, cx + Math.cos(a) * R * (i === sec ? 1.05 : 1.0), cy + Math.sin(a) * R * (i === sec ? 1.05 : 1.0));
  }

  /* print grain: hashed specks, re-dealt every stepped frame */
  ctx.globalAlpha = 1;
  for (i = 0; i < 130; i++) {
    var gx = h2(f, 700 + i) * W, gy = h2(f, 900 + i) * H;
    ctx.fillStyle = (i % 9 === 0) ? SULFUR : (i % 3 === 0 ? GRAY : BONE);
    ctx.globalAlpha = 0.04 + 0.09 * h2(f, 1100 + i);
    var gs = h2(f, 1300 + i) < 0.3 ? 2 : 1;
    ctx.fillRect(gx, gy, gs, gs);
  }
  ctx.globalAlpha = 1;

  /* timeline: the shooting plan, 24 glyph cells along the bottom edge */
  var y0 = stageH;
  ctx.strokeStyle = BONE; ctx.globalAlpha = 0.35; ctx.lineWidth = 1;
  line(0, y0 + 0.5, W, y0 + 0.5);
  ctx.globalAlpha = 1;
  var cw = W / 24;
  for (i = 0; i < 24; i++) {
    if (i === sec) {
      ctx.strokeStyle = SULFUR; ctx.lineWidth = 1.5;
      ctx.strokeRect(cw * i + 1.5, y0 + 3, cw - 3, TL - 6);
    }
    drawGlyph(order[i], cw * (i + 0.5), y0 + TL / 2, Math.min(cw, TL) * 0.30, f, (i === sec) ? SULFUR : BONE);
    if (i !== sec) { /* dim pass for non-current glyphs */
      ctx.fillStyle = FIELD; ctx.globalAlpha = 0.35;
      ctx.fillRect(cw * i + 1, y0 + 2, cw - 2, TL - 4);
      ctx.globalAlpha = 1;
    }
  }
}

/* ---------- interaction: drag scrubs / pedals, double-tap reseeds ---------- */
function ptr(e) { return { x: e.clientX || 0, y: e.clientY || 0 }; }
canvas.addEventListener('pointerdown', function (e) {
  var p = ptr(e);
  drag.active = true; drag.x0 = p.x; drag.y0 = p.y; drag.dx = 0; drag.dy = 0;
  drag.tau0 = tauAt(wallNow); drag.t0 = wallNow;
});
window.addEventListener('pointermove', function (e) {
  if (!drag.active) return;
  var p = ptr(e);
  drag.dx = p.x - drag.x0;
  drag.dy = p.y - drag.y0;
});
window.addEventListener('pointerup', function (e) {
  if (!drag.active) return;
  drag.active = false;
  var now = wallNow;
  var dist = Math.sqrt(drag.dx * drag.dx + drag.dy * drag.dy);
  var dur = now - drag.t0;
  if (dist < 8 && dur < 0.4) {
    if (now - lastTapT < 0.35) {
      SEED++; genScore(SEED);
      segs.push({ type: 'const', t0: now, tau0: drag.tau0, rate: 1 });
      lastTapT = -10;
      return;
    }
    lastTapT = now;
  }
  var rate0 = 1 - drag.dy / 140;
  if (rate0 > 3) rate0 = 3;
  if (rate0 < -3) rate0 = -3;
  segs.push({ type: 'ease', t0: now, tau0: drag.tau0 + drag.dx * 0.008, rate0: rate0 });
});
canvas.addEventListener('dblclick', function () {
  SEED++; genScore(SEED);
