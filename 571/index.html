<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Amarilla</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F2EDE0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (strict, from the prompt): ink black, grey wash, paper.
  // The ONLY colors in the piece: the yellow bike (chapter 1) and the
  // red sweater (chapter 5 and its drift panel). Flat fills, no gradients.
  var INK = '#141414', WASH = '#9A9A98', PAPER = '#F2EDE0',
      YELLOW = '#F2C230', RED = '#C23B2E';

  var PHASE0 = 1.3;          // constant first-frame phase
  var DW = 1200, DH = 1200;  // square design space
  var FONT = 'Arial, Helvetica, sans-serif';
  var GROUND = 856;          // ground line y in design space
  var BIKE_CX = 600;         // chapter bike center x

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function mod(a, n) { return ((a % n) + n) % n; }

  // ---- small canvas helpers ----
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
  function ell(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); }
  function fillStroke(fill, lw, strokeCol) {
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (lw) { ctx.strokeStyle = strokeCol || INK; ctx.lineWidth = lw; ctx.stroke(); }
  }
  function line(x1, y1, x2, y2, w, color) {
    ctx.strokeStyle = color || INK; ctx.lineWidth = w || 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  function text(str, x, y, size, weight, color, align) {
    ctx.font = weight + ' ' + size + 'px ' + FONT;
    ctx.fillStyle = color || INK;
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  }
  // Hand-lettered line: per-letter jitter from a fixed seed (stable forever).
  function jitterText(str, cx, y, size, seed, color, weight) {
    var r = mulberry32(seed);
    ctx.font = (weight || 900) + ' ' + size + 'px ' + FONT;
    var widths = [], total = 0, i, w;
    for (i = 0; i < str.length; i++) { w = ctx.measureText(str[i]).width; widths.push(w); total += w; }
    var x = cx - total / 2;
    ctx.fillStyle = color || INK;
    ctx.textBaseline = 'middle';
    for (i = 0; i < str.length; i++) {
      ctx.save();
      ctx.translate(x + widths[i] / 2 + (r() - 0.5) * 4, y + (r() - 0.5) * 6);
      ctx.rotate((r() - 0.5) * 0.055);
      ctx.textAlign = 'center';
      ctx.fillText(str[i], 0, 0);
      ctx.restore();
      x += widths[i];
    }
  }
  // Wobbly hand-drawn rectangle: jitter from a fixed seed, identical every frame.
  function wobblyRect(x, y, w, h, seed, amp) {
    var r = mulberry32(seed);
    function j() { return (r() - 0.5) * 2 * (amp || 5); }
    var pts = [
      [x + j(), y + j()], [x + w / 2 + j(), y + j()], [x + w + j(), y + j()],
      [x + w + j(), y + h / 2 + j()], [x + w + j(), y + h + j()],
      [x + w / 2 + j(), y + h + j()], [x + j(), y + h + j()],
      [x + j(), y + h / 2 + j()]
    ];
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }

  // ---- precomputed wash strokes (backgrounds + dissolve overlay) ----
  function makeWash(seed, n, region) {
    var r = mulberry32(seed), out = [];
    for (var i = 0; i < n; i++) {
      out.push({
        x: region.x + r() * region.w,
        y: region.y + r() * region.h,
        len: 180 + r() * 420,
        ang: (r() - 0.5) * 0.22,
        w: 26 + r() * 64,
        a: 0.05 + r() * 0.09
      });
    }
    return out;
  }
  function drawWash(strokes, alphaMul, dx) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = WASH;
    for (var i = 0; i < strokes.length; i++) {
      var s = strokes[i];
      ctx.globalAlpha = s.a * alphaMul;
      ctx.lineWidth = s.w;
      ctx.beginPath();
      ctx.moveTo(s.x + (dx || 0) - Math.cos(s.ang) * s.len / 2, s.y - Math.sin(s.ang) * s.len / 2);
      ctx.lineTo(s.x + (dx || 0) + Math.cos(s.ang) * s.len / 2, s.y + Math.sin(s.ang) * s.len / 2);
      ctx.stroke();
    }
    ctx.restore();
  }
  var DISSOLVE = makeWash(571900, 26, { x: 60, y: 120, w: 1080, h: 900 });

  // ---- the bicycle (parametric) ----
  // Local coords: origin at ground level, midway between the wheels.
  var R = 108;                       // wheel radius
  var A = [-175, -R], B = [175, -R]; // rear / front hubs
  var BB = [-25, -118];              // bottom bracket
  var ST = [-95, -262];              // seat top
  var HT = [120, -255], HB = [138, -205]; // head tube top / bottom
  var TUBES = [
    [A, BB], [A, ST], [BB, ST], [ST, HT], [BB, HB], [HB, B], [ST, BB]
  ];
  function tubeLine(p, q, w, color) { line(p[0], p[1], q[0], q[1], w, color); }

  // Rust specks scattered along the frame tubes (seeded, fixed forever).
  function rustSpecks(seed, n, color) {
    var r = mulberry32(seed), pts = [];
    for (var i = 0; i < n; i++) {
      var t = TUBES[Math.floor(r() * TUBES.length)];
      var u = r();
      pts.push({
        x: t[0][0] + (t[1][0] - t[0][0]) * u + (r() - 0.5) * 13,
        y: t[0][1] + (t[1][1] - t[0][1]) * u + (r() - 0.5) * 13,
        s: 1.6 + r() * 3.4
      });
    }
    ctx.fillStyle = color;
    for (var k = 0; k < pts.length; k++) {
      ctx.globalAlpha = 0.5;
      ctx.fillRect(pts[k].x, pts[k].y, pts[k].s, pts[k].s * 0.7);
    }
    ctx.globalAlpha = 1;
  }

  function drawWheel(hub, spokes, col, thin) {
    ctx.strokeStyle = col; ctx.lineCap = 'round';
    // tire
    circ(hub[0], hub[1], R); ctx.lineWidth = thin ? 8 : 13; ctx.stroke();
    // rim
    circ(hub[0], hub[1], R - 13); ctx.lineWidth = 4; ctx.stroke();
    // spokes
    ctx.lineWidth = 2.4;
    for (var i = 0; i < spokes; i++) {
      var a = (i / spokes) * Math.PI * 2 + (i % 2 ? 0.07 : -0.07);
      ctx.beginPath();
      ctx.moveTo(hub[0], hub[1]);
      ctx.lineTo(hub[0] + Math.cos(a) * (R - 15), hub[1] + Math.sin(a) * (R - 15));
      ctx.stroke();
    }
    circ(hub[0], hub[1], 9); ctx.fillStyle = col; ctx.fill();
  }

  // o: {frame:'diamond'|'step', bar:'flat'|'drop'|'swept', yellow, ghost,
  //     child, rack, pump, fenders, spokes, seed}
  function drawBike(o) {
    var main = o.ghost ? WASH : INK;
    var lw = o.ghost ? 7 : 11;
    if (o.ghost) ctx.globalAlpha = 0.5;
    drawWheel(A, o.spokes, main, o.ghost);
    drawWheel(B, o.spokes, main, o.ghost);
    // frame tubes
    function tube(p, q) {
      if (o.yellow) { tubeLine(p, q, lw + 6, INK); tubeLine(p, q, lw - 1, YELLOW); }
      else tubeLine(p, q, lw, main);
    }
    tube(A, BB); tube(A, ST); tube(BB, ST);
    if (o.frame === 'step') {
      // low curved step-through: seat to a low sweep into the head tube
      ctx.strokeStyle = o.yellow ? YELLOW : main; ctx.lineCap = 'round';
      if (o.yellow) {
        ctx.lineWidth = lw + 6; ctx.strokeStyle = INK;
        ctx.beginPath(); ctx.moveTo(ST[0], ST[1]);
        ctx.quadraticCurveTo(30, -120, HB[0], HB[1]); ctx.stroke();
        ctx.lineWidth = lw - 1; ctx.strokeStyle = YELLOW;
        ctx.beginPath(); ctx.moveTo(ST[0], ST[1]);
        ctx.quadraticCurveTo(30, -120, HB[0], HB[1]); ctx.stroke();
      } else {
        ctx.lineWidth = lw;
        ctx.beginPath(); ctx.moveTo(ST[0], ST[1]);
        ctx.quadraticCurveTo(30, -120, HB[0], HB[1]); ctx.stroke();
      }
      tube(ST, HT);
    } else {
      tube(ST, HT); tube(BB, HB);
    }
    tube(HB, B); // fork
    // seat post + saddle
    line(ST[0], ST[1], ST[0] - 4, ST[1] - 16, 7, main);
    ctx.beginPath();
    ell(ST[0] - 8, ST[1] - 22, 30, 9, -0.06);
    fillStroke(main, 3, main);
    if (o.rack) { // worn patch on the saddle
      ctx.fillStyle = WASH; ctx.globalAlpha = o.ghost ? 0.3 : 0.8;
      ell(ST[0] - 16, ST[1] - 24, 10, 4, -0.06); ctx.fill();
      ctx.globalAlpha = o.ghost ? 0.5 : 1;
    }
    // handlebar stem + bar
    line(HT[0], HT[1], HT[0] - 6, HT[1] - 22, 8, main);
    var hbx = HT[0] - 6, hby = HT[1] - 22;
    ctx.strokeStyle = main; ctx.lineCap = 'round'; ctx.lineWidth = 7;
    if (o.bar === 'drop') {
      ctx.beginPath(); ctx.moveTo(hbx - 16, hby);
      ctx.quadraticCurveTo(hbx + 16, hby - 8, hbx + 20, hby + 12);
      ctx.quadraticCurveTo(hbx + 22, hby + 26, hbx + 8, hby + 28);
      ctx.stroke();
    } else if (o.bar === 'swept') {
      ctx.beginPath(); ctx.moveTo(hbx + 14, hby + 2);
      ctx.quadraticCurveTo(hbx - 6, hby - 10, hbx - 30, hby - 2);
      ctx.stroke();
    } else {
      line(hbx - 24, hby + 3, hbx + 20, hby - 3, 7, main);
    }
    if (o.child) { // little bell
      circ(hbx + 8, hby - 12, 8); fillStroke(main, 3, main);
    }
    // chainring, cranks, pedals, chain, rear cog
    circ(BB[0], BB[1], 25); ctx.lineWidth = 5; ctx.strokeStyle = main; ctx.stroke();
    circ(A[0], A[1], 11); ctx.lineWidth = 4; ctx.stroke();
    line(BB[0], BB[1] - 25, A[0], A[1] - 11, 4, main);
    line(BB[0], BB[1] + 25, A[0], A[1] + 11, 4, main);
    var ca = 0.65;
    line(BB[0] - Math.cos(ca) * 34, BB[1] - Math.sin(ca) * 34,
         BB[0] + Math.cos(ca) * 34, BB[1] + Math.sin(ca) * 34, 6, main);
    line(BB[0] + Math.cos(ca) * 34 - 11, BB[1] + Math.sin(ca) * 34,
         BB[0] + Math.cos(ca) * 34 + 11, BB[1] + Math.sin(ca) * 34, 6, main);
    line(BB[0] - Math.cos(ca) * 34 - 11, BB[1] - Math.sin(ca) * 34,
         BB[0] - Math.cos(ca) * 34 + 11, BB[1] - Math.sin(ca) * 34, 6, main);
    if (o.fenders) {
      ctx.lineWidth = 6; ctx.strokeStyle = main;
      ctx.beginPath(); ctx.arc(A[0], A[1], R + 10, Math.PI * 1.12, Math.PI * 1.92); ctx.stroke();
      ctx.beginPath(); ctx.arc(B[0], B[1], R + 10, Math.PI * 1.08, Math.PI * 1.75); ctx.stroke();
    }
    if (o.rack) {
      line(-192, -248, -88, -248, 7, main);
      line(-186, -248, A[0], A[1], 5, main);
      line(-96, -248, ST[0], ST[1] + 8, 5, main);
    }
    if (o.pump) { // frame pump along the seat tube
      line(BB[0] - 22, BB[1] - 8, ST[0] + 12, ST[1] + 30, 7, main);
      circ(BB[0] - 24, BB[1] - 4, 5); ctx.fillStyle = main; ctx.fill();
      circ(ST[0] + 14, ST[1] + 34, 5); ctx.fill();
    }
    if (o.child) { // one training wheel, side view
      line(A[0], A[1], -228, -34, 6, main);
      circ(-232, -28, 28); ctx.lineWidth = 8; ctx.strokeStyle = main; ctx.stroke();
      circ(-232, -28, 5); ctx.fillStyle = main; ctx.fill();
    }
    if (!o.ghost && !o.yellow) rustSpecks(o.seed, 26, INK);
    if (o.yellow) rustSpecks(o.seed, 7, INK);
    ctx.globalAlpha = 1;
    return { hx: hbx, hy: hby }; // handlebar point (for the tag)
  }

  // ---- small standing figure (distant, back three-quarter) ----
  function drawFigure(x, gy, s, sweater) {
    ctx.save();
    ctx.translate(x, gy);
    ctx.scale(s, s);
    // legs
    line(-11, -78, -14, 0, 10, INK);
    line(11, -78, 14, 0, 10, INK);
    // torso: the sweater
    ctx.beginPath();
    ctx.moveTo(-24, -158); ctx.lineTo(24, -158); ctx.lineTo(19, -74); ctx.lineTo(-19, -74);
    ctx.closePath();
    if (sweater) { ctx.fillStyle = RED; ctx.fill(); }
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    // arms at sides
    line(-24, -150, -33, -84, 9, sweater ? RED : INK);
    line(24, -150, 33, -84, 9, sweater ? RED : INK);
    // head + hair cap (seen from behind: no face)
    circ(0, -186, 27); fillStroke(PAPER, 5);
    ctx.beginPath(); ctx.arc(0, -192, 28, Math.PI * 0.95, Math.PI * 2.05); ctx.closePath();
    fillStroke(INK, 3);
    ctx.restore();
  }

  // ---- stars / moon for the dream spreads ----
  function drawStars(seed, region, n) {
    var r = mulberry32(seed);
    ctx.fillStyle = INK;
    for (var i = 0; i < n; i++) {
      var x = region.x + r() * region.w, y = region.y + r() * region.h, s = 2 + r() * 3.4;
      if (r() > 0.72) { // four-point sparkle
        ctx.beginPath();
        ctx.moveTo(x, y - s * 2.2); ctx.lineTo(x + s * 0.55, y - s * 0.55);
        ctx.lineTo(x + s * 2.2, y); ctx.lineTo(x + s * 0.55, y + s * 0.55);
        ctx.lineTo(x, y + s * 2.2); ctx.lineTo(x - s * 0.55, y + s * 0.55);
        ctx.lineTo(x - s * 2.2, y); ctx.lineTo(x - s * 0.55, y - s * 0.55);
        ctx.closePath(); ctx.fill();
      } else {
        ctx.fillRect(x - s / 2, y - s / 2, s, s);
      }
    }
  }
  function drawMoon(x, y, r) {
    ctx.strokeStyle = INK; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(x, y, r, Math.PI * 0.42, Math.PI * 1.58, false);
    ctx.quadraticCurveTo(x + r * 0.72, y, x + Math.cos(Math.PI * 0.42) * r, y + Math.sin(Math.PI * 0.42) * r);
    ctx.stroke();
  }
  function drawRooftops(y, seed) {
    var r = mulberry32(seed);
    ctx.fillStyle = INK;
    var x = -10;
    while (x < DW + 10) {
      var w = 130 + r() * 190, h = 60 + r() * 110;
      ctx.fillRect(x, y - h, w, h + 4);
      if (r() > 0.45) ctx.fillRect(x + w * 0.62, y - h - 30, 20, 32); // chimney
      // paper windows
      ctx.fillStyle = PAPER;
      var cols = Math.floor(w / 52);
      for (var i = 0; i < cols; i++)
        if (r() > 0.4) ctx.fillRect(x + 18 + i * 52, y - h + 22 + (r() > 0.5 ? 30 : 0), 15, 20);
      ctx.fillStyle = INK;
      x += w + 6 + r() * 26;
    }
  }

  // ---- chapters ----
  var CHAPTERS = {
    1: { title: '1. La amarilla', bike: { frame: 'diamond', bar: 'flat', yellow: true, spokes: 22, seed: 571101 } },
    2: { title: '2. La robada', bike: { frame: 'diamond', bar: 'flat', ghost: true, spokes: 20, seed: 571102 } },
    3: { title: '3. La prestada', bike: { frame: 'step', bar: 'swept', fenders: true, spokes: 22, seed: 571103 } },
    4: { title: '4. La de la infancia', bike: { frame: 'diamond', bar: 'swept', child: true, spokes: 18, seed: 571104 } },
    5: { title: '5. La del sweater rojo', bike: { frame: 'diamond', bar: 'drop', spokes: 24, seed: 571105 } },
    6: { title: '6. La del sueño', bike: { frame: 'diamond', bar: 'flat', spokes: 22, seed: 571106 } },
    7: { title: '7. La última', bike: { frame: 'diamond', bar: 'flat', rack: true, pump: true, fenders: true, spokes: 28, seed: 571107 } }
  };
  // Drifting visit order (not chronological, like the book):
  // chapters 1, 3, 2, 5, 4, 7, 6 with drift panels interleaved.
  var SPREADS = [
    { type: 'chapter', ch: 1 },
    { type: 'drift', kind: 'street' },
    { type: 'chapter', ch: 3 },
    { type: 'chapter', ch: 2 },
    { type: 'drift', kind: 'sweater' },
    { type: 'chapter', ch: 5 },
    { type: 'chapter', ch: 4 },
    { type: 'drift', kind: 'dream' },
    { type: 'chapter', ch: 7 },
    { type: 'chapter', ch: 6 }
  ];
  // chapters seen up to and including each spread (for the counter)
  var SEEN = [];
  (function () { var c = 0; for (var i = 0; i < SPREADS.length; i++) { if (SPREADS[i].type === 'chapter') c++; SEEN.push(c); } })();

  var spreadWash = [];
  for (var wi = 0; wi < SPREADS.length; wi++)
    spreadWash.push(makeWash(571200 + wi * 17, 13, { x: 90, y: 260, w: 1020, h: 560 }));

  function drawChapter(idx, t) {
    var sp = SPREADS[idx], ch = CHAPTERS[sp.ch];
    drawWash(spreadWash[idx], 1, 0);
    jitterText(ch.title, DW / 2, 168, 66, 571300 + sp.ch, INK);
    var rot = rotBySpread[idx] || 0;
    var bobY = 0, tilt = 0;
    if (sp.ch === 6) { tilt = -0.055; bobY = Math.sin(t * (Math.PI * 2 / 3.4)) * 9; }
    if (sp.ch === 7) tilt = 0.028; // the last one leans a little
    ctx.save();
    if (sp.ch === 4) { // childhood backdrop: one house, one tree
      ctx.strokeStyle = INK; ctx.lineWidth = 4;
      ctx.strokeRect(96, GROUND - 196, 150, 196);
      ctx.beginPath(); ctx.moveTo(84, GROUND - 196); ctx.lineTo(171, GROUND - 268); ctx.lineTo(258, GROUND - 196); ctx.closePath(); ctx.stroke();
      ctx.strokeRect(148, GROUND - 108, 44, 108);
      line(1010, GROUND, 1010, GROUND - 120, 9, INK);
      circ(1010, GROUND - 168, 56); ctx.lineWidth = 4; ctx.stroke();
      circ(962, GROUND - 138, 34); ctx.stroke();
      circ(1058, GROUND - 138, 34); ctx.stroke();
    }
    if (sp.ch === 6) {
      drawStars(571606, { x: 90, y: 210, w: 1020, h: 430 }, 34);
      drawMoon(168, 300, 46);
    }
    // the bike, large; rotation pivots on its center for drag inspection
    var scale = sp.ch === 4 ? 1.02 : 1.55;
    var gy = sp.ch === 6 ? GROUND - 120 + bobY : GROUND;
    ctx.translate(BIKE_CX, gy - 150 * scale);
    ctx.rotate(tilt + rot);
    ctx.translate(-BIKE_CX, -(gy - 150 * scale));
    ctx.save();
    ctx.translate(BIKE_CX, gy);
    ctx.scale(scale, scale);
    var hb = drawBike(ch.bike);
    if (sp.ch === 3) { // the borrowed one: a plain paper tag on a string
      ctx.strokeStyle = INK; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(hb.hx, hb.hy); ctx.lineTo(hb.hx - 16, hb.hy + 38); ctx.stroke();
      ctx.save();
      ctx.translate(hb.hx - 18, hb.hy + 66); ctx.rotate(0.18);
      ctx.fillStyle = PAPER; ctx.fillRect(-23, -28, 46, 58);
      ctx.strokeStyle = INK; ctx.lineWidth = 3.4; ctx.strokeRect(-23, -28, 46, 58);
      circ(0, -16, 4); ctx.fillStyle = INK; ctx.fill();
      line(-13, 4, 13, 4, 3, WASH); line(-13, 16, 8, 16, 3, WASH);
      ctx.restore();
    }
    ctx.restore();
    ctx.restore();
    if (sp.ch === 2) {
      // what the theft left behind: a cut lock and loose chain links
      ctx.save();
      ctx.translate(856, GROUND + 6);
      ctx.rotate(0.5);
      ctx.strokeStyle = INK; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.arc(0, -6, 25, Math.PI * 0.95, Math.PI * 1.95); ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.translate(902, GROUND + 14);
      ctx.rotate(-0.35);
      ctx.strokeStyle = INK; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.arc(0, -4, 25, Math.PI * 1.1, Math.PI * 2.0); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = INK;
      ctx.fillRect(838, GROUND - 2, 62, 30);
      var r = mulberry32(571202);
      ctx.strokeStyle = INK; ctx.lineWidth = 4;
      for (var i = 0; i < 7; i++) {
        ell(300 + r() * 330, GROUND + 8 + r() * 14, 12, 7, r() * 1.4);
        ctx.stroke();
      }
    }
    if (sp.ch === 5) drawFigure(1012, GROUND, 1.18, true); // small, distant
    if (sp.ch === 6) drawRooftops(DH - 96, 571666);
    else line(56, GROUND + 2, DW - 56, GROUND + 2, 5, INK);
  }

  // ---- drift panels: small interludes between chapters ----
  var DRIFT = { x: 170, y: 300, w: 860, h: 540 };
  function drawDrift(idx, t) {
    var kind = SPREADS[idx].kind;
    wobblyRect(DRIFT.x, DRIFT.y, DRIFT.w, DRIFT.h, 571400 + idx, 5);
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
    ctx.save();
    ctx.beginPath(); ctx.rect(DRIFT.x + 4, DRIFT.y + 4, DRIFT.w - 8, DRIFT.h - 8); ctx.clip();
    drawWash(spreadWash[idx], 1, 0);
    var gy = DRIFT.y + DRIFT.h - 92;
    if (kind === 'street') {
      // a childhood street: house outlines, a tree, a faraway tiny bike
      ctx.strokeStyle = INK; ctx.lineWidth = 4;
      var hx = [DRIFT.x + 36, DRIFT.x + 268, DRIFT.x + 640];
      var hw = [196, 168, 184];
      for (var i = 0; i < 3; i++) {
        ctx.strokeRect(hx[i], gy - 168, hw[i], 168);
        ctx.beginPath();
        ctx.moveTo(hx[i] - 10, gy - 168); ctx.lineTo(hx[i] + hw[i] / 2, gy - 228); ctx.lineTo(hx[i] + hw[i] + 10, gy - 168);
        ctx.closePath(); ctx.stroke();
        ctx.strokeRect(hx[i] + hw[i] / 2 - 20, gy - 84, 40, 84);
      }
      line(DRIFT.x + 520, gy, DRIFT.x + 520, gy - 96, 8, INK);
      circ(DRIFT.x + 520, gy - 132, 44); ctx.stroke();
      line(DRIFT.x + 20, gy, DRIFT.x + DRIFT.w - 20, gy, 5, INK);
      line(DRIFT.x + 20, gy + 34, DRIFT.x + DRIFT.w - 20, gy + 34, 3, WASH);
      ctx.save();
      ctx.translate(DRIFT.x + 470, gy); ctx.scale(0.34, 0.34);
      drawBike({ frame: 'diamond', bar: 'swept', spokes: 14, seed: 571401 });
      ctx.restore();
    } else if (kind === 'sweater') {
      // a street corner; a small distant figure in the red sweater
      ctx.strokeStyle = INK; ctx.lineWidth = 4;
      line(DRIFT.x + 600, DRIFT.y + 30, DRIFT.x + 600, gy, 4, INK);
      line(DRIFT.x + 600, DRIFT.y + 130, DRIFT.x + DRIFT.w - 24, DRIFT.y + 96, 3, WASH);
      line(DRIFT.x + 24, gy, DRIFT.x + DRIFT.w - 24, gy, 5, INK);
      drawFigure(DRIFT.x + 330, gy, 1.05, true);
      ctx.save();
      ctx.translate(DRIFT.x + 700, gy); ctx.scale(0.5, 0.5);
      drawBike({ frame: 'diamond', bar: 'drop', spokes: 16, seed: 571402 });
      ctx.restore();
    } else {
      // dream: the bike floats over rooftops
      drawStars(571403, { x: DRIFT.x + 30, y: DRIFT.y + 26, w: DRIFT.w - 60, h: 250 }, 22);
      drawMoon(DRIFT.x + 108, DRIFT.y + 104, 34);
      var bobY = Math.sin(t * (Math.PI * 2 / 3.4) + 0.8) * 7;
      ctx.save();
      ctx.translate(DRIFT.x + DRIFT.w / 2, gy - 168 + bobY);
      ctx.rotate(-0.07);
      ctx.scale(0.82, 0.82);
      drawBike({ frame: 'diamond', bar: 'flat', spokes: 18, seed: 571404 });
      ctx.restore();
      drawRooftops(DRIFT.y + DRIFT.h, 571405);
    }
    ctx.restore();
  }

  function drawSpread(idx, t) {
    if (SPREADS[idx].type === 'chapter') drawChapter(idx, t);
    else drawDrift(idx, t);
    // footer: hint + chapter counter (the only UI)
    ctx.save();
    ctx.globalAlpha = 0.5;
    text('tap', 58, 1132, 29, 400, INK, 'left');
    ctx.restore();
    if (SPREADS[idx].type === 'chapter') {
      ctx.save();
      ctx.globalAlpha = 0.75;
      text('capítulo ' + SEEN[idx] + ' / 7', DW - 58, 1132, 29, 700, INK, 'right');
      ctx.restore();
    }
  }

  // ---- state ----
  var spreadIdx = 0;
  var rotBySpread = {};       // drag rotation per spread (stays after release)
  var transT0 = -1, transFrom = 0; // dissolve transition start (simT)
  var TRANS_LEN = 1.4;

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(SC, SC);
    if (transT0 >= 0) {
      var p = clamp((t - transT0) / TRANS_LEN, 0, 1);
      var f = p < 0.5 ? p * 2 : (1 - p) * 2; // wash density peaks mid-dissolve
      drawSpread(p < 0.5 ? transFrom : spreadIdx, t);
      drawWash(DISSOLVE, f * 1.15, (p - 0.5) * 90);
      ctx.fillStyle = WASH;
      ctx.globalAlpha = f * 0.16;
      ctx.fillRect(0, 0, DW, DH);
      ctx.globalAlpha = 1;
      if (p >= 1) transT0 = -1;
    } else {
      drawSpread(spreadIdx, t);
    }
    ctx.restore();
  }

  // ---- sizing (Visual Viewport API) ----
  var W = 0, H = 0, SC = 1, OX = 0, OY = 0;
  var simT = PHASE0;

  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) {
      SC = W / DW;
      OX = 0; OY = (H - DH * SC) / 2;
    } else {
      SC = Math.min(W / DW, H / DH);
      OX = (W - DW * SC) / 2; OY = (H - DH * SC) / 2;
    }
    draw(simT);
  }

  // ---- interaction ----
  // TAP advances to the next spread through an ink-wash dissolve.
  // DRAG on a chapter's bike rotates it for inspection; the angle stays
  // after release. Dragging never advances.
  function toDesign(p) { return { x: (p.x - OX) / (SC || 1), y: (p.y - OY) / (SC || 1) }; }
  function nearBike(d) {
    return Math.abs(d.x - BIKE_CX) < 500 && d.y > GROUND - 560 && d.y < GROUND + 46;
  }
  var downPos = null, downStamp = -1e9, lastPtrStamp = -1e9, dragging = false, lastX = 0;
  function evtPos(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var cx = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var cy = (e.clientY !== undefined) ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
    return { x: cx - rect.left, y: cy - rect.top };
  }
  function onDown(e) {
    if (e.timeStamp !== undefined) {
      if (e.timeStamp - downStamp < 350) return;
      downStamp = e.timeStamp;
    }
    var p = evtPos(e);
    downPos = p; lastX = p.x; dragging = false;
  }
  function onMove(e) {
    if (!downPos) return;
    var p = evtPos(e);
    var moved = Math.abs(p.x - downPos.x) + Math.abs(p.y - downPos.y);
    if (moved >= 16) dragging = true;
    if (dragging && SPREADS[spreadIdx].type === 'chapter' && transT0 < 0) {
      var d = toDesign(p);
      if (nearBike(d) || dragging) {
        var dx = (p.x - lastX) / (SC || 1);
        rotBySpread[spreadIdx] = clamp((rotBySpread[spreadIdx] || 0) + dx * 0.004, -0.55, 0.55);
      }
    }
    lastX = p.x;
    if (dragging) { draw(simT); if (e.preventDefault) e.preventDefault(); }
  }
  function onUp(e) {
    if (!downPos) return;
    var p = evtPos(e);
    var moved = Math.abs(p.x - downPos.x) + Math.abs(p.y - downPos.y);
    var wasDrag = dragging || moved >= 16;
    downPos = null; dragging = false;
    if (wasDrag || transT0 >= 0) return;
    transFrom = spreadIdx;
    spreadIdx = mod(spreadIdx + 1, SPREADS.length);
    transT0 = simT;
    draw(simT);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) { lastPtrStamp = e.timeStamp || 0; onDown(e); });
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { downPos = null; dragging = false; });
    canvas.addEventListener('touchstart', function (e) {
      if ((e.timeStamp || 0) - lastPtrStamp < 700) return;
      onDown(e);
    });
    canvas.addEventListener('touchmove', function (e) {
      if ((e.timeStamp || 0) - lastPtrStamp < 700) return;
      onMove(e);
    });
    canvas.addEventListener('touchend', function (e) {
      if ((e.timeStamp || 0) - lastPtrStamp < 700) return;
      onUp(e.changedTouches && e.changedTouches[0] ? { clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY, timeStamp: e.timeStamp } : e);
    });
  }

  // ---- animation: anchored at PHASE0 + elapsed, never clock-derived frame one ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }

  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
