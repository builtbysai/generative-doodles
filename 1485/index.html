<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Handover</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8e0d0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  // №1485 "The Handover" (ioana-wieder IW6, PP732).
  // A room of seated figures around a table plays in a loop. At the end of
  // each 48 s cycle one figure stands, walks to the frame edge, and a second
  // figure in a different muted color walks in from the opposite edge and
  // sits in the same chair. The table centerpiece changes color with each
  // handover (gold -> scarlet -> teal -> gold). Full cycle = 3 handovers =
  // 144 s, so the loop closes exactly at t = 144.
  var ROOM = '#e8e0d0';
  var SKIN = '#f2ead8';
  var CLOTHES = ['#4a5a7a', '#6b4a3a', '#2f4636', '#7a6a8a'];
  var CENTER = ['#d9a441', '#c1272d', '#2e6f6a'];
  var ROT = ['#4a5a7a', '#6b4a3a', '#2f4636']; // handover-chair rotation (period 3)
  var SCENE_LEN = 36;   // seconds of seated scene per cycle
  var WALK_LEN = 12;    // seconds of walk at rate 1
  var LOOP = 144;       // 3 cycles; t = LOOP must equal t = 0 exactly

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1485000);
  // Five fixed figures: seeded clothes color + bob phase. Bob periods divide
  // LOOP (6 s -> 24 cycles), so the bob closes exactly at t = LOOP.
  var FIXED = [];
  var ANGLES = [210, 270, 330, 30, 150]; // degrees around the table
  for (var i = 0; i < 5; i++) {
    FIXED.push({
      angle: ANGLES[i] * Math.PI / 180,
      color: CLOTHES[Math.floor(rnd() * CLOTHES.length)],
      phase: rnd() * Math.PI * 2
    });
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, lastT = 0, booted = false;
  var rateSegs = []; // {t, rate} — drag velocity segments (rate 1 = automatic)
  var dragging = false, downX = 0;

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = Math.round(w); H = Math.round(h);
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }
  function isPhone() {
    if (typeof window !== 'undefined' && window.screen) {
      var m = Math.min(window.screen.width, window.screen.height);
      if (m < 700) return true;
    }
    return H > W * 1.15;
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function rateAt(tau) {
    var r = 1;
    var segs = rateSegs.slice().sort(function (a, b) { return a.t - b.t; });
    for (var i = 0; i < segs.length; i++) { if (segs[i].t <= tau) r = segs[i].rate; }
    return r;
  }
  function integrateRate(a, b) {
    if (b <= a) return 0;
    var pts = [a];
    for (var i = 0; i < rateSegs.length; i++) {
      var t = rateSegs[i].t;
      if (t > a && t < b) pts.push(t);
    }
    pts.push(b);
    pts.sort(function (x, y) { return x - y; });
    var sum = 0;
    for (var j = 0; j < pts.length - 1; j++) {
      sum += rateAt((pts[j] + pts[j + 1]) / 2) * (pts[j + 1] - pts[j]);
    }
    return sum;
  }
  // Smallest t >= start with integrateRate(start, t) >= WALK_LEN.
  function handoverComplete(start) {
    var cur = start, acc = 0, guard = 0;
    while (guard++ < 10000) {
      var nextB = Infinity;
      for (var i = 0; i < rateSegs.length; i++) {
        var t = rateSegs[i].t;
        if (t > cur && t < nextB) nextB = t;
      }
      var r = rateAt(cur);
      var dt = (WALK_LEN - acc) / r;
      if (cur + dt <= nextB) return cur + dt;
      acc += r * (nextB - cur);
      cur = nextB;
    }
    return cur;
  }
  // Cycle containing time t. Cycles start at 0; each cycle = 36 s scene +
  // a handover that completes when 12 s of rate-weighted walk time elapse.
  function cycleAt(t) {
    var S = 0, k = 0;
    while (k < 10000) {
      var sceneEnd = S + SCENE_LEN;
      var C = handoverComplete(sceneEnd);
      if (t < sceneEnd) return { k: k, phase: 'scene', S: S, sceneEnd: sceneEnd, C: C };
      if (t < C) return { k: k, phase: 'handover', S: S, sceneEnd: sceneEnd, C: C };
      S = C; k++;
    }
    return { k: k, phase: 'scene', S: S, sceneEnd: S + SCENE_LEN, C: S + SCENE_LEN + WALK_LEN };
  }

  function disc(cx, cy, r, color) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }
  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }
  // Seated figure: chair back, torso, head, dot eyes, mouth line.
  function seatedFigure(x, y, s, color, bob) {
    var chairW = s * 0.7, chairH = s * 0.95;
    rect(x - chairW / 2, y - chairH - s * 0.55 + bob, chairW, chairH, '#2f4636');
    rect(x - s * 0.32, y - s * 0.55 + bob, s * 0.64, s * 0.55, color);
    disc(x, y - s * 0.85 + bob, s * 0.34, SKIN);
    rect(x - s * 0.16, y - s * 0.88 + bob, s * 0.07, s * 0.07, '#2f4636');
    rect(x + s * 0.09, y - s * 0.88 + bob, s * 0.07, s * 0.07, '#2f4636');
    rect(x - s * 0.14, y - s * 0.68 + bob, s * 0.28, s * 0.05, '#2f4636');
  }
  // Standing/walking figure: legs, torso, head. stand01: 0 = seated height
  // blend, 1 = full standing height.
  function standingFigure(x, y, s, color, bob, stand01) {
    var legH = s * 0.45 * stand01 + s * 0.05;
    rect(x - s * 0.22, y - legH, s * 0.16, legH, color);
    rect(x + s * 0.06, y - legH, s * 0.16, legH, color);
    rect(x - s * 0.32, y - legH - s * 0.62, s * 0.64, s * 0.62, color);
    disc(x, y - legH - s * 0.92, s * 0.34, SKIN);
    rect(x - s * 0.16, y - legH - s * 0.95, s * 0.07, s * 0.07, '#2f4636');
    rect(x + s * 0.09, y - legH - s * 0.95, s * 0.07, s * 0.07, '#2f4636');
    rect(x - s * 0.14, y - legH - s * 0.75, s * 0.28, s * 0.05, '#2f4636');
    void bob;
  }

  function draw(t) {
    lastT = t;
    size();
    var lt = ((t % LOOP) + LOOP) % LOOP; // loop-local time for every sine
    var cx = W / 2, cy = H * 0.42;
    var circleR = Math.min(W * 0.42, H * 0.32);
    var tableR = Math.min(W, H) * 0.15;
    var pathY = cy + circleR; // clear horizontal walking line, lower frame
    var s = Math.min(W, H) * 0.085; // figure unit
    var cyc = cycleAt(t);
    var k = cyc.k;

    ctx.fillStyle = ROOM;
    ctx.fillRect(0, 0, W, H);
    if (typeof document !== 'undefined' && document.body) document.body.style.background = ROOM;

    // Walking path line (thin, clothes tone) across the lower frame.
    rect(0, pathY + s * 0.55, W, Math.max(2, s * 0.03), '#6b4a3a');

    // Table + centerpiece (color changes with each completed handover).
    disc(cx, cy, tableR, '#4a5a7a');
    disc(cx, cy, tableR * 0.35, CENTER[k % 3]);

    // Five fixed seated figures around the table.
    for (var i = 0; i < FIXED.length; i++) {
      var f = FIXED[i];
      var fx = cx + Math.cos(f.angle) * circleR;
      var fy = cy + Math.sin(f.angle) * circleR * 0.78;
      var bob = Math.sin(lt * Math.PI * 2 / 6 + f.phase) * s * 0.03;
      seatedFigure(fx, fy, s, f.color, bob);
    }

    // Handover chair (bottom of the circle, on the walking path).
    var chairX = cx, chairY = pathY;
    var outColor = ROT[k % 3], inColor = ROT[(k + 1) % 3];
    if (cyc.phase === 'scene') {
      var bob0 = Math.sin(lt * Math.PI * 2 / 6 + 1.3) * s * 0.03;
      seatedFigure(chairX, chairY, s, outColor, bob0);
    } else {
      // Walk progress: rate-weighted walk time over WALK_LEN.
      var p = clamp(integrateRate(cyc.sceneEnd, t) / WALK_LEN, 0, 1);
      var walkBob = Math.sin(lt * Math.PI * 2 / 2) * s * 0.03;
      // Outgoing: seated -> standing in p 0..0.15, then walks left off-frame.
      var outStand = clamp(p / 0.15, 0, 1);
      var outX = chairX + (0 - chairX - s * 2) * clamp((p - 0.15) / 0.85, 0, 1);
      if (p < 1) standingFigure(outX, chairY, s, outColor, walkBob, outStand);
      // Incoming: walks in from the right edge, sits in p 0.85..1.
      var inStand = 1 - clamp((p - 0.85) / 0.15, 0, 1);
      var inX = (W + s * 2) + (chairX - (W + s * 2)) * p;
      if (p < 1) standingFigure(inX, chairY, s, inColor, walkBob, inStand);
      else seatedFigure(chairX, chairY, s, inColor, 0);
      // Empty chair back while the chair is in transit.
      if (p < 1) rect(chairX - s * 0.35, chairY - s * 1.5, s * 0.7, s * 0.95, '#2f4636');
    }
    void isPhone;
  }

  function pointerDown(x, y) {
    dragging = true;
    downX = x;
    void y;
  }
  function pointerMove(x, y) {
    if (!dragging) return;
    var dx = x - downX;
    var rate = clamp(1 + dx / 150, 0.25, 3);
    rateSegs.push({ t: lastT, rate: rate });
    void y;
  }
  function pointerUp(x, y) {
    if (!dragging) return;
    dragging = false;
    rateSegs.push({ t: lastT, rate: 1 });
    void x; void y;
  }

  function canvasPos(ev) {
    if (typeof ev.offsetX === 'number') return { x: ev.offsetX, y: ev.offsetY };
    if (canvas.getBoundingClientRect) {
      var r = canvas.getBoundingClientRect();
      return { x: (ev.clientX - r.left) * (canvas.width / r.width), y: (ev.clientY - r.top) * (canvas.height / r.height) };
    }
    return { x: ev.clientX, y: ev.clientY };
  }
  canvas.addEventListener('pointerdown', function (ev) { var p = canvasPos(ev); pointerDown(p.x, p.y); });
  canvas.addEventListener('pointermove', function (ev) { var p = canvasPos(ev); pointerMove(p.x, p.y); });
  canvas.addEventListener('pointerup', function (ev) { var p = canvasPos(ev); pointerUp(p.x, p.y); });
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { draw(lastT); });
    }
    window.addEventListener('resize', function () { draw(lastT); });
  }

  // Probe + rAF interface.
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: draw,
      pointerDown: pointerDown,
      pointerMove: pointerMove,
      pointerUp: pointerUp,
      state: function () {
        var cyc = cycleAt(lastT);
        return {
          phase: cyc.phase, cycle: cyc.k,
          centerpiece: CENTER[cyc.k % 3],
          walkP: cyc.phase === 'handover' ? clamp(integrateRate(cyc.sceneEnd, lastT) / WALK_LEN, 0, 1) : 0
        };
      }
    };
  }

  draw(0); // frame one, constant phase
  booted = true;
  var startTs = null;
  function loop(ts) {
    if (startTs === null) startTs = ts;
    var el = (ts - startTs) / 1000;
    draw(el);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  void booted;
})();
</script>
</body>
</html>
