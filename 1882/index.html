<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Music Gets There First</title>
<style>
html, body { margin: 0; padding: 0; background: #0E0E10; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* The Music Gets There First: a dark field crossed by faint veils,
   translucent grey curtains, structures and grids. The viewer draws a
   candidate path with a finger. Each proposed path is judged: accepted
   paths bloom into full melodic contours, amber lines that flower into
   tone clusters and grow richer the longer they hold; refused paths
   crumble to ash and fall. About half the proposals are refused. A
   small listening ear, drawn as a concentric ring, pulses at the
   judging point before each verdict. The field keeps no score; every
   new drag is judged fresh. Drag to propose a path. There is no reset,
   only the next proposal. */
var TAU = Math.PI * 2;
var GROUND = '#0E0E10';
var VEIL_GREY = '#8A8A92';
var GRID_GREY = '#6E6E76';
var JUDGE_AMBER = '#E8A33D';
var ASH = '#C9C9CC';
var GOLD = '#E8C878';
var GOLD_DEEP = '#D9A441';
var CHAR = '#3A3A3E';
var CHAR_DEEP = '#2E2E33';
var TITLE_INK = '#EDEAE2';
var HINT_INK = '#C9A86A';
var PLATE = '#0A0A0C';
var PLATE_LINE = 'rgba(232,163,61,0.30)';
var FRAME_T = 0.0;        /* fixed phase: veils at rest, seeded paths mid verdict */
var SEED0 = 1882;         /* fixed seed for frame one, thumb stable */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- the hidden target: the ear the music listens with ---- */
/* The target region drifts slowly over time, so refusal is principled,
   not random, and no drag can ever learn where it sits: it is veiled.
   Its motion is a pure function of phaseT, under 0.05 Hz. */
function targetPoint(sc, U, t) {
  var cx = sc.x + sc.w / 2, cy = sc.y + sc.h / 2;
  return {
    x: cx + Math.sin(t * 0.031 + 1.3) * sc.w * 0.26,
    y: cy + Math.sin(t * 0.021 + 0.7) * sc.h * 0.24
  };
}
/* ---- veils: translucent curtains, structures, grids ---- */
var VEIL_COUNT = 6;
var veilSeed = [];
(function () {
  var rng = mulberry32(SEED0);
  var i;
  for (i = 0; i < VEIL_COUNT; i++) {
    veilSeed.push({
      f: 0.06 + i * 0.15 + (rng() - 0.5) * 0.05,
      w: 0.07 + rng() * 0.06,
      sway: 0.6 + rng() * 0.9,
      ph: rng() * TAU,
      a: 0.07 + rng() * 0.06
    });
  }
})();
function drawVeils(sc, U, t) {
  var i, v, bx, bw, g;
  /* faint structure grid first, under the curtains */
  ctx.strokeStyle = rgba(GRID_GREY, 0.05);
  ctx.lineWidth = 1;
  var gx;
  for (gx = 0.1; gx < 1; gx += 0.1) {
    ctx.beginPath();
    ctx.moveTo(sc.x + sc.w * gx, sc.y);
    ctx.lineTo(sc.x + sc.w * gx, sc.y + sc.h);
    ctx.stroke();
  }
  ctx.strokeStyle = rgba(GRID_GREY, 0.035);
  var gy;
  for (gy = 0.2; gy < 1; gy += 0.2) {
    ctx.beginPath();
    ctx.moveTo(sc.x, sc.y + sc.h * gy);
    ctx.lineTo(sc.x + sc.w, sc.y + sc.h * gy);
    ctx.stroke();
  }
  /* the curtains themselves: soft vertical bands, swaying slowly */
  for (i = 0; i < VEIL_COUNT; i++) {
    v = veilSeed[i];
    bx = sc.x + sc.w * v.f + Math.sin(t * 0.10 * v.sway + v.ph) * U * 0.008;
    bw = sc.w * v.w;
    g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    g.addColorStop(0, rgba(VEIL_GREY, 0));
    g.addColorStop(0.5, rgba(VEIL_GREY, v.a));
    g.addColorStop(1, rgba(VEIL_GREY, 0));
    ctx.fillStyle = g;
    ctx.fillRect(bx, sc.y, bw, sc.h);
    /* a hem line at the curtain edge, barely there */
    ctx.strokeStyle = rgba(VEIL_GREY, v.a * 0.9);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bx + bw * 0.5, sc.y);
    ctx.lineTo(bx + bw * 0.5, sc.y + sc.h);
    ctx.stroke();
  }
}
/* ---- paths: proposed, judged, blooming or crumbling ---- */
function pathLength(pts) {
  var L = 0, i;
  for (i = 1; i < pts.length; i++) {
    L += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
  }
  return L;
}
function pathMid(pts) {
  var i = Math.floor(pts.length / 2);
  return { x: pts[i].x, y: pts[i].y };
}
function meanTurn(pts) {
  var sum = 0, n = 0, i, a1, a2, d;
  for (i = 1; i < pts.length - 1; i++) {
    a1 = Math.atan2(pts[i].y - pts[i - 1].y, pts[i].x - pts[i - 1].x);
    a2 = Math.atan2(pts[i + 1].y - pts[i].y, pts[i + 1].x - pts[i].x);
    d = Math.abs(a2 - a1);
    if (d > Math.PI) d = TAU - d;
    sum += d; n++;
  }
  return n ? sum / n : 0;
}
/* The acceptance function: closeness of the path midpoint to the hidden
   target, smoothness of the stroke, and length. About half of ordinary
   drags land under the threshold; the target keeps moving, so no drag
   can game it. */
function judgeStroke(pts, sc, U, t) {
  var mid = pathMid(pts);
  var tgt = targetPoint(sc, U, t);
  var R = U * 0.17;
  var d = Math.hypot(mid.x - tgt.x, mid.y - tgt.y);
  var prox = 1 - clamp(d / (2.2 * R), 0, 1);
  var smooth = clamp(1 - meanTurn(pts) / 0.9, 0, 1);
  var lenF = clamp(pathLength(pts) / (0.5 * U), 0, 1);
  var score = 0.55 * prox + 0.25 * smooth + 0.20 * lenF;
  return { accepted: score >= 0.5, score: score, mid: mid, target: tgt };
}
function makeAsh(pts, seed) {
  var rng = mulberry32(seed);
  var ash = [], i, p;
  for (i = 0; i < pts.length; i += 2) {
    p = pts[i];
    ash.push({
      x: p.x, y: p.y,
      vx: (rng() - 0.5) * 14,
      vy: 18 + rng() * 42,
      r: 0.8 + rng() * 2.2,
      drift: (rng() - 0.5) * 10,
      ph: rng() * TAU
    });
  }
  return ash;
}
function makeClusters(pts, seed) {
  var rng = mulberry32(seed);
  var cl = [], i, k, n = 5 + Math.floor(rng() * 3);
  for (k = 0; k < n; k++) {
    i = Math.floor((k / (n - 1)) * (pts.length - 1));
    cl.push({
      x: pts[i].x, y: pts[i].y,
      r: 0.006 + rng() * 0.010,
      ph: rng() * TAU
    });
  }
  return cl;
}
function smoothPath(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  var i, mx, my;
  for (i = 1; i < pts.length - 1; i++) {
    mx = (pts[i].x + pts[i + 1].x) / 2;
    my = (pts[i].y + pts[i + 1].y) / 2;
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
  }
  ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
}
/* The listening ear: concentric rings pulsing at the judging point. */
function drawRing(mid, U, t, col, alpha) {
  var i, r, a;
  for (i = 0; i < 3; i++) {
    r = U * (0.018 + i * 0.011) * (1 + 0.12 * Math.sin(t * 2.2 + i * 1.1));
    a = alpha * (0.85 - i * 0.25);
    ctx.strokeStyle = rgba(col, Math.max(0, a));
    ctx.lineWidth = Math.max(1, U * 0.0022);
    ctx.beginPath();
    ctx.moveTo(mid.x + r, mid.y);
    ctx.arc(mid.x, mid.y, r, 0, TAU);
    ctx.stroke();
  }
  ctx.fillStyle = rgba(col, alpha * 0.9);
  ctx.beginPath();
  ctx.moveTo(mid.x + U * 0.003, mid.y);
  ctx.arc(mid.x, mid.y, U * 0.003, 0, TAU);
  ctx.fill();
}
function drawStroke(s, U, t) {
  var age = t - s.verdictT;
  var i, p, a;
  if (s.state === 'judging') {
    /* the line waits, faint, while the ear listens */
    ctx.strokeStyle = rgba(VEIL_GREY, 0.55);
    ctx.lineWidth = Math.max(1, U * 0.003);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    smoothPath(s.pts);
    ctx.stroke();
    var pulse = 0.55 + 0.45 * Math.sin(age * 9);
    drawRing(s.mid, U, t, JUDGE_AMBER, 0.45 + 0.35 * pulse);
    return;
  }
  if (s.state === 'accepted') {
    var bloom = clamp(age / 2.5, 0, 1);
    var hold = age > 2.5 ? clamp(1 - (age - 2.5) / 6, 0, 1) : 1;
    var alpha = hold;
    /* harmonic echoes: the line thickens with overtones as it blooms */
    if (bloom > 0.35) {
      ctx.strokeStyle = rgba(GOLD_DEEP, 0.22 * bloom * alpha);
      ctx.lineWidth = Math.max(1, U * 0.0016);
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      var echo, mx, my;
      for (echo = -1; echo <= 1; echo += 2) {
        ctx.beginPath();
        var off = echo * U * 0.006 * bloom;
        ctx.moveTo(s.pts[0].x, s.pts[0].y + off);
        for (i = 1; i < s.pts.length - 1; i++) {
          mx = (s.pts[i].x + s.pts[i + 1].x) / 2;
          my = (s.pts[i].y + s.pts[i + 1].y) / 2 + off;
          ctx.quadraticCurveTo(s.pts[i].x, s.pts[i].y + off, mx, my);
        }
        ctx.lineTo(s.pts[s.pts.length - 1].x, s.pts[s.pts.length - 1].y + off);
        ctx.stroke();
      }
    }
    ctx.strokeStyle = rgba(GOLD, (0.55 + 0.40 * bloom) * alpha);
    ctx.lineWidth = Math.max(1, U * 0.003 * (1 + 1.6 * bloom));
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    smoothPath(s.pts);
    ctx.stroke();
    /* tone clusters flower along the contour as the phrase holds */
    for (i = 0; i < s.clusters.length; i++) {
      var c = s.clusters[i];
      var cr = U * c.r * (0.5 + bloom) * (1 + 0.08 * Math.sin(t * 1.4 + c.ph));
      var cg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, cr * 2.2);
      cg.addColorStop(0, rgba(GOLD, 0.55 * bloom * alpha));
      cg.addColorStop(1, rgba(GOLD, 0));
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.moveTo(c.x + cr * 2.2, c.y);
      ctx.arc(c.x, c.y, cr * 2.2, 0, TAU);
      ctx.fill();
      ctx.fillStyle = rgba(GOLD, (0.5 + 0.5 * bloom) * alpha);
      ctx.beginPath();
      ctx.moveTo(c.x + cr, c.y);
      ctx.arc(c.x, c.y, cr, 0, TAU);
      ctx.fill();
    }
    /* the verdict ring fades out in gold just after the bloom begins,
       then lingers faintly at the midpoint while the contour holds */
    if (age < 0.9) drawRing(s.mid, U, t, GOLD, 0.8 * (1 - age / 0.9));
    else drawRing(s.mid, U, t, GOLD, 0.22 * hold);
    return;
  }
  /* refused: the stroke breaks and falls as ash */
  var fall = clamp(age / 2.5, 0, 1);
  var fade = 1 - fall;
  ctx.strokeStyle = rgba(CHAR, 0.9 * fade);
  ctx.lineWidth = Math.max(1, U * 0.0028);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  /* broken segments: gaps where the line has already let go */
  for (i = 1; i < s.pts.length; i++) {
    if (!s.kept[i]) continue;
    ctx.beginPath();
    ctx.moveTo(s.pts[i - 1].x, s.pts[i - 1].y);
    ctx.lineTo(s.pts[i].x, s.pts[i].y);
    ctx.stroke();
  }
  for (i = 0; i < s.ash.length; i++) {
    p = s.ash[i];
    var ay = p.y + p.vy * age + Math.sin(t * 1.1 + p.ph) * p.drift * fall;
    var ax = p.x + p.vx * age;
    a = clamp(0.85 * (1 - fall) + 0.15, 0, 1) * (0.55 + 0.45 * Math.sin(t * 2 + p.ph));
    ctx.fillStyle = rgba(ASH, Math.max(0, a * 0.8));
    ctx.beginPath();
    ctx.moveTo(ax + p.r, ay);
    ctx.arc(ax, ay, p.r, 0, TAU);
    ctx.fill();
  }
  if (age < 0.9) drawRing(s.mid, U, t, ASH, 0.7 * (1 - age / 0.9));
}
/* ---- seeded frame-one paths: one blooming, one crumbling ---- */
function seedPaths(sc, U) {
  var rng = mulberry32(SEED0 + 7);
  var list = [];
  var i, f, x, y;
  /* accepted: a smooth contour across the upper field, mid bloom */
  var acc = [];
  for (i = 0; i <= 10; i++) {
    f = i / 10;
    x = sc.x + sc.w * (0.12 + 0.76 * f);
    y = sc.y + sc.h * (0.36 - 0.05 * Math.sin(f * Math.PI) + (rng() - 0.5) * 0.03);
    acc.push({ x: x, y: y });
  }
  list.push({
    pts: acc, state: 'accepted', verdictT: -1.4,
    mid: pathMid(acc), clusters: makeClusters(acc, SEED0 + 11),
    ash: [], kept: []
  });
  /* refused: a jagged contour low in the field, mid fall */
  var ref = [];
  for (i = 0; i <= 10; i++) {
    f = i / 10;
    x = sc.x + sc.w * (0.15 + 0.70 * f);
    y = sc.y + sc.h * (0.72 + (rng() - 0.5) * 0.09);
    ref.push({ x: x, y: y });
  }
  var kept = [];
  for (i = 0; i < ref.length; i++) kept.push(rng() < 0.72);
  list.push({
    pts: ref, state: 'refused', verdictT: -1.1,
    mid: pathMid(ref), clusters: [],
    ash: makeAsh(ref, SEED0 + 23), kept: kept
  });

}
var strokes = [];
var seeded = false;
/* ---- WebAudio: Karplus-Strong plucks, lazy, only inside a gesture ---- */
var audioCtx = null;
var audioReady = false;
function ensureAudio() {
  if (audioCtx) return;
  try {
    var AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return;
    audioCtx = new AC();
    audioReady = true;
  } catch (e) { audioCtx = null; audioReady = false; }
}
function ksPluck(freq, when, dur) {
  if (!audioCtx || !audioReady) return;
  try {
    var sr = audioCtx.sampleRate;
    var len = Math.floor(sr * dur);
    var buf = audioCtx.createBuffer(1, len, sr);
    var data = buf.getChannelData(0);
    var N = Math.max(2, Math.round(sr / freq));
    var i;
    for (i = 0; i < N && i < len; i++) data[i] = Math.random() * 2 - 1;
    for (i = N; i < len; i++) {
      data[i] = 0.996 * 0.5 * (data[i - N] + data[i - N - 1]);
    }
    var src = audioCtx.createBufferSource();
    src.buffer = buf;
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.22, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    src.connect(g); g.connect(audioCtx.destination);
    src.start(when);
  } catch (e) { /* audio is a garnish; a failure must never break the picture */ }

function playPhrase(s) {
  if (!audioCtx || !audioReady) return;
  try {
    var now = audioCtx.currentTime + 0.03;
    var scale = [0, 3, 5, 7, 10, 12, 15];
    var i, idx, semi, freq;
    var n = Math.min(s.clusters.length, 7);
    for (i = 0; i < n; i++) {
      idx = Math.floor((i / Math.max(1, n - 1)) * (s.pts.length - 1));
      var rel = clamp((s.pts[0].y - s.pts[idx].y) / (VH * 0.3), -1, 1);
      semi = scale[Math.floor((rel * 0.5 + 0.5) * (scale.length - 1))];
      freq = 220 * Math.pow(2, semi / 12);
      ksPluck(freq, now + i * 0.28, 2.2);
    }
  } catch (e) { /* ignore */ }
}
/* ---- drag: propose a path, the music judges it ---- */
var drag = null;
var strokeCount = 0;
function posOf(ev) {
  var r = { x: 0, y: 0 };
  try {
    if (canvas.getBoundingClientRect) {
      var b = canvas.getBoundingClientRect();
      r.x = (ev.clientX || 0) - b.left;
      r.y = (ev.clientY || 0) - b.top;
    } else {
      r.x = ev.clientX || 0; r.y = ev.clientY || 0;
    }
  } catch (e) {
    r.x = ev.clientX || 0; r.y = ev.clientY || 0;

}
function onDown(ev) {
  if (ev && ev.preventDefault) ev.preventDefault();

    try { if (audioCtx.resume) audioCtx.resume(); } catch (e) { /* ignore */ }

  drag = { pts: [p], t0: phaseT };

}
function onMove(ev) {
  if (!drag) return;
  if (ev && ev.preventDefault) ev.preventDefault();
  var p = posOf(ev);
  var last = drag.pts[drag.pts.length - 1];
  if (Math.hypot(p.x - last.x, p.y - last.y) < 3) return;
  drag.pts.push(p);
  draw();
}
function onUp(ev) {
  if (!drag) return;

  var sc = fieldRect();
  var U = Math.min(sc.w, sc.h);
  var verdict = judgeStroke(pts, sc, U, phaseT);
  strokeCount++;

    pts: pts, state: 'judging', verdictT: phaseT,
    mid: verdict.mid, clusters: [], ash: [], kept: [],
    verdict: verdict, pending: true

  strokes.push(s);
  draw();
  /* the ear listens for a beat, then the verdict lands */

  setTimeout(function () {
    judged.pending = false;
    if (judged.verdict.accepted) {
      judged.state = 'accepted';
      judged.verdictT = phaseT;
      judged.clusters = makeClusters(judged.pts, SEED0 + 100 + strokeCount * 7919);
      playPhrase(judged);
    } else {
      judged.state = 'refused';
      judged.verdictT = phaseT;
      judged.ash = makeAsh(judged.pts, SEED0 + 200 + strokeCount * 7919);
      var rng = mulberry32(SEED0 + 300 + strokeCount * 7919);
      var i;
      for (i = 0; i < judged.pts.length; i++) judged.kept.push(rng() < 0.72);

}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: full-bleed on phones, a centered square on
   desktop, the ground taking the piece's own dark grey. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Music Gets There First').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Music Gets There First').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 03 · 08').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Music Gets There First', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 03 · 08', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to propose a path.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
