<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No.165 Strange Loop (Five Colours)</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F2EDE3; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// No.165 Strange Loop (Five Colours). Squares hinged at their
// corners open and close like a breathing lattice while the
// whole plane rotates beneath them, and the rotation cancels
// exactly. The geometry: every square turns +theta about its
// own hinge corner inside a plane that turns -theta about the
// panel centre, so in the world frame no square ever rotates
// at all: they stay axis-aligned and only travel, each hinge
// tracing a circle whose radius is its distance from the
// centre. One hinge sits exactly at the centre. Its square
// has nowhere to travel to: it sits perfectly still for the
// whole loop while the field breathes around it. Map-coloured
// in exactly five colours, neighbours never matching. Watch
// only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAL = ['#D64533', '#D9A441', '#1F7A6B', '#2A2A72', '#F2EDE3'];
var BONE = '#F2EDE3', INK = '#1A1A1A';
var W = 0, H = 0, start = 0;
var OFFSET = 6000;         // frame one: mid-opening, theta ~50 deg

function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
function smooth(x) { x = clamp01(x); return x * x * (3 - 2 * x); }
function thetaAt(tt) {
  // 24s loop: open 0-11s, hold 11-13s, close 13-24s
  if (tt < 11) return (Math.PI / 2) * smooth(tt / 11);
  if (tt < 13) return Math.PI / 2;
  return (Math.PI / 2) * (1 - smooth((tt - 13) / 11));
}

function draw(now) {
  if (!W || !H) return;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = BONE;
  ctx.fillRect(0, 0, W, H);
  var tAbs = now - start + OFFSET;
  var loopIdx = Math.floor(tAbs / 24000);
  var tt = (tAbs % 24000) / 1000;
  var th = thetaAt(tt);
  var panel = Math.min(W, H) * 0.92;
  var p = panel / 8.8;                 // lattice pitch
  var s = p * 0.94;                    // square side
  var cx = W / 2, cy = H / 2;          // panel centre = a hinge
  var i, j;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-th);
  // squares: hinge at (i*p, j*p), turning +theta about it
  for (j = -3; j <= 2; j++) for (i = -3; i <= 2; i++) {
    ctx.fillStyle = PAL[(((i + 2 * j + loopIdx) % 5) + 5) % 5];
    ctx.save();
    ctx.translate(i * p, j * p);
    ctx.rotate(th);
    ctx.fillRect(0, 0, s, s);
    ctx.restore();
  }
  // hinge dots ride the plane to their squares' corners
  ctx.fillStyle = INK;
  var dr = Math.max(2, p * 0.05);
  for (j = -3; j <= 3; j++) for (i = -3; i <= 3; i++) {
    ctx.beginPath();
    ctx.arc(i * p, j * p, dr, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

var rafStarted = false;
function startLoop() {
  if (!rafStarted && typeof requestAnimationFrame === 'function') {
    rafStarted = true;
    requestAnimationFrame(function tick(now) {
      draw(now);
      if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
    });
  }
}
function resize() {
  var vv = window.visualViewport;
  W = vv ? vv.width : (window.innerWidth || 1280);
  H = vv ? vv.height : (window.innerHeight || 900);
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw(performance.now());
  startLoop();
}
start = performance.now();
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
