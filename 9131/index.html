<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>9131 — Rumor of a Turn</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#22384a; }
  canvas { display:block; width:100vw; height:100vh; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// RUMOR-OF-A-TURN-9131
// After Job Talle's Koi Farm: vertebra-chain koi (M5), turn contagion (M3),
// pulse-glide locomotion (M4). Tap = startle the nearest fish, not a reload.
(function(){
"use strict";
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildWater();
}
window.addEventListener('resize', resize);

// ---------- utils ----------
function rand(a, b){ return a + Math.random() * (b - a); }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function angDiff(a, b){ let d = (b - a) % (Math.PI*2); if (d > Math.PI) d -= Math.PI*2; if (d < -Math.PI) d += Math.PI*2; return d; }

// ---------- water (pre-rendered, rebuilt on resize) ----------
const waterCv = document.createElement('canvas');
const wctx = waterCv.getContext('2d');
let sands = [], causticSeeds = [];
function buildWater(){
  waterCv.width = Math.max(2, W); waterCv.height = Math.max(2, H);
  const g = wctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3d5a74');
  g.addColorStop(0.45, '#33506a');
  g.addColorStop(1, '#243b52');
  wctx.fillStyle = g; wctx.fillRect(0, 0, W, H);
  // white sand patches (soft, irregular)
  sands = [];
  const nS = 5;
  for (let i = 0; i < nS; i++){
    const sx = W * (0.12 + 0.76 * (i / (nS - 1))) + rand(-40, 40);
    const sy = H * rand(0.15, 0.85);
    const sr = Math.min(W, H) * rand(0.14, 0.24);
    sands.push({x:sx, y:sy, r:sr, blobs:[]});
    for (let b = 0; b < 7; b++){
      sands[i].blobs.push({dx:rand(-sr*0.5, sr*0.5), dy:rand(-sr*0.35, sr*0.35), r:sr*rand(0.35,0.7)});
    }
  }
  for (const s of sands){
    for (const b of s.blobs){
      const rg = wctx.createRadialGradient(s.x+b.dx, s.y+b.dy, 0, s.x+b.dx, s.y+b.dy, b.r);
      rg.addColorStop(0, 'rgba(232,224,204,0.20)');
      rg.addColorStop(1, 'rgba(232,224,204,0)');
      wctx.fillStyle = rg;
      wctx.fillRect(s.x+b.dx-b.r, s.y+b.dy-b.r, b.r*2, b.r*2);
    }
  }
  // vignette for depth
  const vg = wctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.35, W/2, H/2, Math.max(W,H)*0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(8,18,28,0.38)');
  wctx.fillStyle = vg; wctx.fillRect(0, 0, W, H);
  // caustic seeds (drifting light arcs)
  causticSeeds = [];
  for (let i = 0; i < 30; i++){
    causticSeeds.push({bx:Math.random(), by:Math.random(), len:rand(18,44), sp:rand(4,14), ph:rand(0,6.28), wob:rand(0.5,1.5)});
  }
  // scale interaction radii to the viewport so small screens don't clump
  const mwh = Math.min(W, H);
  T.attractR = clamp(mwh * 0.20, 90, 150);
  T.repulseR = clamp(mwh * 0.06, 28, 46);
  T.edge = clamp(mwh * 0.11, 44, 90);
}

// ---------- fish ----------
const N_FISH = 12, N_VERT = 14;
const fishes = [];
const ripples = [];

function makeFish(i, x, y, heading){
  const size = rand(0.85, 1.25);
  const verts = [];
  for (let v = 0; v < N_VERT; v++) verts.push({x:x, y:y});
  return {
    x:x, y:y, heading:heading, speed:rand(25,45),
    size:size, len: 80 * size,
    verts:verts, phase:rand(0, 6.28),
    turnT:0, turnDir:0, turnRate:0,
    boostT:0, boostPow:0, rippleT:0,
    nextTurn: rand(2, 9),
    hueJit: rand(-6, 6),
    spots: null,
    bank: 0
  };
}
function initSchool(){
  fishes.length = 0;
  const cx = W/2, cy = H/2, rx = Math.min(W,H)*0.30, ry = Math.min(W,H)*0.22;
  for (let i = 0; i < N_FISH; i++){
    const a = (i / N_FISH) * Math.PI * 2 + rand(-0.2, 0.2);
    const x = cx + Math.cos(a) * rx * rand(0.7, 1.1);
    const y = cy + Math.sin(a) * ry * rand(0.7, 1.1);
    const f = makeFish(i, x, y, a + Math.PI/2 + rand(-0.4, 0.4));
    // fixed spot pattern per fish (subtle darker gold patches)
    f.spots = [];
    const nSp = 3 + (i % 3);
    for (let s = 0; s < nSp; s++) f.spots.push({v: 2 + Math.floor(rand(0, 8)), off: rand(-0.5, 0.5), r: rand(2.2, 4.2) * f.size});
    fishes.push(f);
  }
}

// tunables (M3/M4, scaled to px)
const T = {
  decay: 0.996, minSpeed: 14, maxSpeed: 165,
  boostChance: 0.004, boostPow: 2.6, boostLen: [8, 26],
  attractR: 150, followChance: 0.03, turnCarry: 0.95,
  repulseR: 46, repulseF: 900,
  catchUp: 0.9,
  turnRateBase: 2.6,
  edge: 90
};

function startTurn(f, dir, strength){
  if (f.turnT > 0) return;
  f.turnDir = dir; f.turnT = rand(0.5, 1.1); f.turnRate = T.turnRateBase * (strength || 1);
}
function boost(f, pow){
  f.boostT = rand(T.boostLen[0], T.boostLen[1]);
  f.boostPow = pow || T.boostPow;
  f.rippleT = 0;
  spawnRipple(f.verts[N_VERT-1].x, f.verts[N_VERT-1].y, 1);
}

function stepFish(f, dt){
  // --- pulse-glide (M4) ---
  f.speed *= Math.pow(T.decay, dt * 60);
  if (f.speed < T.minSpeed) f.speed = T.minSpeed;
  if (f.boostT > 0){
    f.speed += f.boostPow * dt * 60 * 0.55;
    f.boostT -= dt;
    if (f.speed > T.maxSpeed) f.speed = T.maxSpeed;
    f.rippleT -= dt;
    if (f.rippleT <= 0){ spawnRipple(f.verts[N_VERT-1].x, f.verts[N_VERT-1].y, 0.6); f.rippleT = 0.45; }
  } else if (Math.random() < T.boostChance * dt * 60){
    boost(f, rand(1.6, 2.8));
  }
  // --- spontaneous instigator turns ---
  f.nextTurn -= dt;
  if (f.nextTurn <= 0){
    f.nextTurn = rand(4, 14);
    startTurn(f, Math.random() < 0.5 ? -1 : 1, rand(0.8, 1.3));
  }
  // --- active turn ---
  if (f.turnT > 0){
    f.heading += f.turnDir * f.turnRate * dt;
    f.turnT -= dt;
    f.bank += ((f.turnDir * 0.5) - f.bank) * Math.min(1, dt * 6);
  } else {
    f.bank += (0 - f.bank) * Math.min(1, dt * 4);
  }
  // --- edge containment (gentle steer, never a wall bounce) ---
  const m = T.edge;
  if (f.x < m || f.x > W - m || f.y < m || f.y > H - m){
    const want = Math.atan2(H/2 - f.y, W/2 - f.x);
    f.heading += angDiff(f.heading, want) * Math.min(1, dt * 1.6);
  }
  // --- integrate head ---
  f.x += Math.cos(f.heading) * f.speed * dt;
  f.y += Math.sin(f.heading) * f.speed * dt;
  // --- swim phase: large fish undulate slowly (M5) ---
  const speedF = clamp(f.speed / 60, 0.3, 2.2);
  f.phase += dt * 7.0 * speedF / f.size;
  // --- vertebra chain (M5) ---
  const spacing = f.len / (N_VERT - 1);
  const wigAmp = 0.42 * clamp(f.speed / 70, 0.35, 1.6); // head oscillation grows with speed
  let px = f.x, py = f.y;
  let pa = f.heading + Math.PI + Math.cos(f.phase) * wigAmp;
  f.verts[0].x = f.x; f.verts[0].y = f.y;
  for (let v = 1; v < N_VERT; v++){
    // each vertebra follows the previous at fixed spacing, corrected toward chain heading
    const vt = f.verts[v];
    const wantX = px - Math.cos(pa) * spacing;
    const wantY = py - Math.sin(pa) * spacing;
    const k = 0.55; // springiness
    vt.x += (wantX - vt.x) * k;
    vt.y += (wantY - vt.y) * k;
    // re-project to exact spacing (inextensible spine)
    const dx = vt.x - px, dy = vt.y - py;
    const d = Math.hypot(dx, dy) || 1;
    vt.x = px + dx / d * spacing;
    vt.y = py + dy / d * spacing;
    // traveling wave: phase lag grows down the chain, amplitude grows toward tail
    const lag = v * 0.55;
    const aGrow = 0.35 + 0.65 * (v / (N_VERT - 1));
    const wob = Math.cos(f.phase - lag) * wigAmp * aGrow * spacing * 0.9;
    const nx = -Math.sin(pa), ny = Math.cos(pa);
    vt.x += nx * wob; vt.y += ny * wob;
    px = vt.x; py = vt.y;
    pa = Math.atan2(vt.y - f.verts[v-1].y, vt.x - f.verts[v-1].x) + Math.PI;
  }
}

function stepContagion(dt){
  // M3: pair interactions — speed matching, repulsion, turn copying
  for (let i = 0; i < fishes.length; i++){
    const a = fishes[i];
    for (let j = i + 1; j < fishes.length; j++){
      const b = fishes[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      if (d > T.attractR || d < 1) continue;
      // speed matching: slower accelerates toward faster
      const avg = (a.speed + b.speed) / 2;
      a.speed += (avg - a.speed) * T.catchUp * dt;
      b.speed += (avg - b.speed) * T.catchUp * dt;
      // repulsion
      if (d < T.repulseR){
        const f = (1 - d / T.repulseR) * T.repulseF * dt / Math.max(d, 8);
        a.x -= dx * f * 0.02; a.y -= dy * f * 0.02;
        b.x += dx * f * 0.02; b.y += dy * f * 0.02;
      }
      // turn copying: the rumor spreads fish by fish
      if (a.turnT > 0 && b.turnT <= 0 && Math.random() < T.followChance * dt * 60){
        startTurn(b, a.turnDir, T.turnCarry);
      } else if (b.turnT > 0 && a.turnT <= 0 && Math.random() < T.followChance * dt * 60){
        startTurn(a, b.turnDir, T.turnCarry);
      }
    }
  }
}

// ---------- ripples ----------
function spawnRipple(x, y, strength){
  if (ripples.length > 40) ripples.shift();
  ripples.push({x:x, y:y, r:4, max: 40 + 34 * strength, a: 0.22 * strength + 0.06});
}
function stepRipples(dt){
  for (let i = ripples.length - 1; i >= 0; i--){
    const r = ripples[i];
    r.r += dt * 46;
    r.a -= dt * 0.22;
    if (r.a <= 0 || r.r > r.max) ripples.splice(i, 1);
  }
}

// ---------- drawing ----------
function widthAt(t, size){
  // slender koi plan: narrow snout, widest just behind the head third, long taper
  const w = Math.pow(Math.sin(Math.PI * Math.pow(t, 0.75)), 1.1);
  return Math.max(w, 0.22) * 7.5 * size;
}

function drawFish(f){
  const V = f.verts, n = V.length;
  const L = [], R = [];
  for (let i = 0; i < n; i++){
    const t = i / (n - 1);
    const p = V[i];
    const q = V[Math.min(n - 1, i + 1)], o = V[Math.max(0, i - 1)];
    let dx = q.x - o.x, dy = q.y - o.y;
    const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const w = widthAt(t, f.size);
    // banking: shift body sideways into the turn
    const bk = f.bank * w * 0.55;
    L.push({x: p.x - dy * w + dx * bk, y: p.y + dx * w + dy * bk});
    R.push({x: p.x + dy * w + dx * bk, y: p.y - dx * w + dy * bk});
  }
  const head = V[0], tail = V[n-1];
  // body gradient along the spine
  const g = ctx.createLinearGradient(head.x, head.y, tail.x, tail.y);
  const hj = f.hueJit;
  g.addColorStop(0, `rgb(${214+hj},${164+hj},${88})`);      // pale gold head
  g.addColorStop(0.55, `rgb(${228+hj},${184+hj},${112})`);
  g.addColorStop(1, `rgb(${238+hj},${206+hj},${146})`);      // pale belly tail
  ctx.beginPath();
  // smooth outline through vertebra offsets (quadratic midpoints kill faceting)
  const smoothSide = (pts) => {
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++){
      const mx = (pts[i].x + pts[i+1].x) / 2, my = (pts[i].y + pts[i+1].y) / 2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    const l = pts[pts.length - 1];
    ctx.lineTo(l.x, l.y);
  };
  smoothSide(L);
  const Rr = R.slice().reverse();
  // join tail tip smoothly then come back up the right side
  ctx.lineTo(Rr[0].x, Rr[0].y);
  smoothSide(Rr);
  ctx.closePath();
  ctx.fillStyle = g;
  ctx.fill();
  // subtle darker-gold pattern patches
  ctx.fillStyle = 'rgba(150,104,44,0.35)';
  for (const s of f.spots){
    const p = V[clamp(s.v, 0, n-1)];
    ctx.beginPath();
    ctx.ellipse(p.x + s.off * 4, p.y + s.off * 3, s.r, s.r * 0.7, f.heading, 0, 6.29);
    ctx.fill();
  }
  // soft top shading (light from above)
  ctx.save();
  ctx.clip();
  const sg = ctx.createLinearGradient(head.x, head.y - 14*f.size, head.x, head.y + 14*f.size);
  sg.addColorStop(0, 'rgba(255,246,220,0.30)');
  sg.addColorStop(0.5, 'rgba(255,246,220,0)');
  sg.addColorStop(1, 'rgba(60,40,16,0.22)');
  ctx.fillStyle = sg;
  ctx.fillRect(head.x - 60*f.size, head.y - 30*f.size, 120*f.size, 60*f.size);
  ctx.restore();

  // tail fin: forked, flowing, translucent — merges with the body, not a separate blob
  const ta = Math.atan2(tail.y - V[n-2].y, tail.x - V[n-2].x);
  const fl = 34 * f.size;
  const sway = Math.cos(f.phase - (n-1)*0.55) * 0.5;
  const a1 = ta + 0.55 + sway * 0.3, a2 = ta - 0.55 + sway * 0.3;
  const tip1x = tail.x + Math.cos(a1) * fl, tip1y = tail.y + Math.sin(a1) * fl;
  const tip2x = tail.x + Math.cos(a2) * fl, tip2y = tail.y + Math.sin(a2) * fl;
  // forked notch: trailing edge dips back toward the tail base
  const notx = tail.x + Math.cos(ta + sway*0.4) * fl * 0.55;
  const noty = tail.y + Math.sin(ta + sway*0.4) * fl * 0.55;
  ctx.beginPath();
  ctx.moveTo(tail.x, tail.y);
  ctx.lineTo(tip1x, tip1y);
  ctx.quadraticCurveTo(
    tail.x + Math.cos(ta + sway*0.4) * fl * 0.92,
    tail.y + Math.sin(ta + sway*0.4) * fl * 0.92,
    notx, noty);
  ctx.quadraticCurveTo(
    tail.x + Math.cos(ta + sway*0.4) * fl * 0.92,
    tail.y + Math.sin(ta + sway*0.4) * fl * 0.92,
    tip2x, tip2y);
  ctx.closePath();
  const tg = ctx.createLinearGradient(tail.x, tail.y, notx, noty);
  tg.addColorStop(0, `rgba(226,182,110,0.9)`);
  tg.addColorStop(1, `rgba(240,214,160,0.30)`);
  ctx.fillStyle = tg;
  ctx.fill();

  // pectoral fins: small, swept back, hugging the body
  const pv = V[3];
  const pa2 = Math.atan2(V[4].y - V[2].y, V[4].x - V[2].x);
  const flap = Math.sin(f.phase * 1.7) * 0.3;
  ctx.fillStyle = 'rgba(235,200,140,0.5)';
  for (const s of [-1, 1]){
    const fa = pa2 + s * (0.85 + flap * s);
    const fx = pv.x + Math.cos(fa) * 8 * f.size, fy = pv.y + Math.sin(fa) * 8 * f.size;
    ctx.beginPath();
    ctx.ellipse(fx, fy, 5.5*f.size, 2.4*f.size, fa + s*0.5, 0, 6.29);
    ctx.fill();
  }
  // dorsal fin: low ridge along the back
  const dv = V[6];
  const da = Math.atan2(V[7].y - V[5].y, V[7].x - V[5].x);
  const dw = widthAt(6/(n-1), f.size);
  ctx.beginPath();
  ctx.moveTo(dv.x - Math.cos(da)*10*f.size, dv.y - Math.sin(da)*10*f.size);
  ctx.lineTo(dv.x - Math.sin(da)*dw*1.5, dv.y + Math.cos(da)*dw*1.5);
  ctx.lineTo(dv.x + Math.cos(da)*10*f.size, dv.y + Math.sin(da)*10*f.size);
  ctx.closePath();
  ctx.fillStyle = 'rgba(200,150,90,0.5)';
  ctx.fill();

  // eye
  const ex = head.x + Math.cos(f.heading) * 6.5 * f.size;
  const ey = head.y + Math.sin(f.heading) * 6.5 * f.size;
  const exn = -Math.sin(f.heading), eyn = Math.cos(f.heading);
  const eyeOff = widthAt(0.06, f.size) * 0.72;
  for (const s of [-1, 1]){
    ctx.beginPath();
    ctx.arc(ex + exn * s * eyeOff, ey + eyn * s * eyeOff, 1.6 * f.size, 0, 6.29);
    ctx.fillStyle = '#2a1e10';
    ctx.fill();
  }
}

function drawCaustics(t){
  ctx.save();
  ctx.strokeStyle = 'rgba(220,235,245,0.07)';
  ctx.lineWidth = 1.2;
  for (const c of causticSeeds){
    const x = ((c.bx + t * c.sp / Math.max(W,1)) % 1.15 - 0.075) * W;
    const y = ((c.by + Math.sin(t*0.4 + c.ph) * 0.02 * c.wob) % 1) * H;
    const wob = Math.sin(t * 1.3 + c.ph) * 10 * c.wob;
    ctx.beginPath();
    ctx.moveTo(x - c.len/2, y + wob*0.3);
    ctx.quadraticCurveTo(x - c.len*0.1, y - wob, x + c.len/2, y + wob*0.5);
    ctx.stroke();
  }
  ctx.restore();
}

function drawRipples(){
  ctx.save();
  for (const r of ripples){
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, 6.29);
    ctx.strokeStyle = `rgba(225,238,248,${clamp(r.a, 0, 0.5).toFixed(3)})`;
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }
  ctx.restore();
}

// ---------- main loop ----------
let last = performance.now(), simT = 0;
function frame(now){
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  simT += dt;
  for (const f of fishes) stepFish(f, dt);
  stepContagion(dt);
  stepRipples(dt);
  // draw
  ctx.drawImage(waterCv, 0, 0, W, H);
  drawCaustics(simT);
  drawRipples();
  // draw fish sorted by y for slight depth
  const order = fishes.slice().sort((a, b) => a.y - b.y);
  for (const f of order) drawFish(f);
  requestAnimationFrame(frame);
}

// ---------- interaction: tap startles the nearest fish ----------
function onTap(px, py){
  let best = null, bd = 1e9;
  for (const f of fishes){
    const d = Math.hypot(f.x - px, f.y - py);
    if (d < bd){ bd = d; best = f; }
  }
  if (best){
    // startle: wheel away from the tap + burst
    const away = Math.atan2(best.y - py, best.x - px);
    const dir = angDiff(best.heading, away) > 0 ? 1 : -1;
    startTurn(best, dir, 1.6);
    boost(best, 3.4);
    spawnRipple(px, py, 1);
    // nearby fish may catch the rumor
    for (const f of fishes){
      if (f !== best && Math.hypot(f.x - best.x, f.y - best.y) < 120 && Math.random() < 0.4){
        startTurn(f, best.turnDir, 0.9);
      }
    }
  }
}
cv.addEventListener('pointerdown', e => onTap(e.clientX, e.clientY));

// audio lifecycle: nothing to suspend (no audio in this piece)

// ---------- test hooks ----------
window.__koi = {
  fishes: fishes,
  ripples: ripples,
  step: function(sec){ const n = Math.max(1, Math.round(sec * 60)); for (let i = 0; i < n; i++){ for (const f of fishes) stepFish(f, 1/60); stepContagion(1/60); stepRipples(1/60); } },
  tap: onTap,
  turning: function(){ return fishes.filter(f => f.turnT > 0).length; },
  state: function(){ return fishes.map(f => ({x:+f.x.toFixed(1), y:+f.y.toFixed(1), sp:+f.speed.toFixed(1), turn:+(f.turnT).toFixed(2)})); }
};

resize();
initSchool();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
