<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Koi Coil — JS clone of Adir-SL CodePen</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#add8e6;}
  canvas{display:block;width:100vw;height:100vh;}
  svg{position:absolute;width:0;height:0;overflow:hidden;}
</style>
</head>
<body>
<svg aria-hidden="true"><path id="koipath" d="M11.7692 229.5C14.552 200.052 7.51901 171.858 -42.8757 170.644C-105.869 169.128 -131.294 76.612 -101.695 51.5872C-72.0955 26.5625 -24.6607 -50.7867 70.5883 51.5872C165.837 153.961 27.7073 131.211 33.0199 183.157C38.3326 235.102 90.3211 195.669 139.274 223.727C188.226 251.785 207.959 299.56 139.274 316.243C70.5883 332.926 41.3685 398.9 81.9726 419.754C122.577 440.608 222 478.524 222 419.754C222 372.738 222 242.432 222 183.157C219.091 129.948 175.78 30.8091 25.8099 59.9288C-161.652 96.3284 -30.3529 119.837 25.8099 141.07C81.9726 162.303 171.529 204.769 126.751 260.506C81.9726 316.243 101.326 362.501 139.274 373.496C177.222 384.492 170.012 464.495 70.5883 462.979C-28.835 461.462 -42.8757 393.015 -42.8757 373.496C-42.8757 238.288 11.7692 293 11.7692 240.506C11.7692 208.05 11.7692 237.336 11.7692 229.5Z"/></svg>
<canvas id="c"></canvas>
<script>
"use strict";
/* JS clone of Adir-SL's CSS koi (codepen.io/Adir-SL/pen/LYEPzxW).
   Same system: 15 coils per fish on an offset path with staggered delays,
   size profile head->tail, flapping tail fin, pectoral fins, eyes. */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const pathEl = document.getElementById('koipath');
let W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();

// path bounds for scaling: x in [-162, 222], y in [-51, 479]
const PB = {x0:-162, y0:-51, x1:222, y1:479};
const L = pathEl.getTotalLength();
const LOOP_MS = 20000, DELAY_MS = 40, COIL = 14;

// size profile, coil index 0=head .. 14=tail (maps nth-of-type 15..1)
const SCALES = [1.2,1.2,1.35,1.55,1.75,1.9,2.0,2.0,2.0,1.9,1.75,1.55,1.35,1.2,1.0];

function pathPoint(d, mirror){
  d = ((d % L) + L) % L;
  const p = pathEl.getPointAtLength(d);
  const q = pathEl.getPointAtLength((d+2)%L);
  // scale path bounds to viewport with margin
  const sx = W/(PB.x1-PB.x0), sy = H/(PB.y1-PB.y0);
  const s = Math.min(sx,sy)*0.92;
  const ox = (W-(PB.x1-PB.x0)*s)/2, oy = (H-(PB.y1-PB.y0)*s)/2;
  let x = ox + (p.x-PB.x0)*s, y = oy + (p.y-PB.y0)*s;
  let x2 = ox + (q.x-PB.x0)*s, y2 = oy + (q.y-PB.y0)*s;
  if (mirror){ x = W-x; x2 = W-x2; }
  return {x, y, a: Math.atan2(y2-y, x2-x), s};
}

const fishes = [
  {base:'#ff4500', hi:'#ffffff', mirror:false, t:0},          // orangered
  {base:'#ffffff', hi:'#ff4500', mirror:true,  t:LOOP_MS/2},  // white, mirrored, half-loop offset
];

function drawCoil(x, y, r, base, hi){
  // ball with inset highlight (CodePen's inset box-shadow)
  const g = ctx.createRadialGradient(x-r*0.35, y-r*0.35, r*0.1, x, y, r);
  g.addColorStop(0, hi);
  g.addColorStop(0.45, base);
  g.addColorStop(1, base);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
}

function drawFish(f, now){
  const t = (now + f.t) % LOOP_MS;
  const pts = [];
  for (let i=0;i<15;i++){
    const d = (t/LOOP_MS)*L - i* (DELAY_MS/LOOP_MS)*L;
    pts.push(pathPoint(d, f.mirror));
  }
  const s = pts[0].s;
  const coilR = i => COIL*SCALES[i]*s*0.9;

  ctx.save();
  // drop shadow like the CSS filter
  ctx.shadowColor = 'rgba(0,0,0,0.3)';
  ctx.shadowBlur = 5*s;
  ctx.shadowOffsetX = (f.mirror?-1:1)*COIL*4*s*0.9;
  ctx.shadowOffsetY = COIL/3*s*0.9;

  // draw tail-first so head overlaps
  for (let i=14;i>=0;i--){
    drawCoil(pts[i].x, pts[i].y, coilR(i), f.base, f.hi);
  }
  ctx.restore();

  // tail fin: flapping triangle at tail coil (CodePen's backFlip, 200ms)
  const tail = pts[14];
  const flap = Math.sin(now/1000*Math.PI*2*2.5)*0.7; // ~2.5Hz
  const ta = tail.a + Math.PI + flap; // pointing backward + flap
  const tr = coilR(14);
  const finLen = tr*3.2;
  ctx.fillStyle = '#ffffff';
  ctx.save();
  ctx.translate(tail.x, tail.y);
  ctx.rotate(ta);
  ctx.beginPath();
  ctx.moveTo(0, -tr*0.55);
  ctx.lineTo(-finLen, -tr*1.15);
  ctx.lineTo(-finLen, tr*1.15);
  ctx.lineTo(0, tr*0.55);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // pectoral fins at coil index 3 (nth-of-type 12), flapping (CodePen's sideFlip, 500ms)
  const pf = pts[3];
  const pr = coilR(3);
  const pflap = Math.sin(now/1000*Math.PI*2*1 + (f.mirror?Math.PI:0));
  for (const side of [-1,1]){
    const fa = pf.a + side*(1.1 + pflap*0.35);
    const fx = pf.x + Math.cos(pf.a+side*1.4)*pr*0.8;
    const fy = pf.y + Math.sin(pf.a+side*1.4)*pr*0.8;
    ctx.fillStyle = '#ffffff';
    ctx.save();
    ctx.translate(fx, fy); ctx.rotate(fa);
    ctx.beginPath();
    ctx.ellipse(pr*1.1, 0, pr*1.15, pr*0.42, 0, 0, 6.2832);
    ctx.fill();
    ctx.restore();
  }

  // eyes on head coil (CodePen's ":" text)
  const head = pts[0];
  const hr = coilR(0);
  const ex = Math.cos(head.a), ey = Math.sin(head.a);
  const nx = -ey, ny = ex;
  ctx.fillStyle = '#111';
  for (const side of [-1,1]){
    ctx.beginPath();
    ctx.arc(head.x + ex*hr*0.45 + nx*side*hr*0.38,
            head.y + ey*hr*0.45 + ny*side*hr*0.38,
            hr*0.16, 0, 6.2832);
    ctx.fill();
  }
}

function frame(now){
  ctx.fillStyle = '#add8e6';
  ctx.fillRect(0,0,W,H);
  for (const f of fishes) drawFish(f, now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
