<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rumor of a Turn</title>
<style>html,body{margin:0;padding:0;background:#2e4a5c;overflow:hidden;height:100%}canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair}</style>
</head><body><canvas id="c"></canvas>
<!-- RUMOR-OF-A-TURN-9131 -->
<script>
(function(){
  'use strict';
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  // ---- constants (from Job Talle's koi: M3 turn contagion, M4 pulse-glide, M1 wake) ----
  var N = 12;                 // school size
  var SPEED_MIN = 0.5, SPEED_MAX = 3.2, SPEED_DECAY = 0.996;
  var BOOST_CHANCE = 0.003, BOOST_TICKS = 18;
  var TURN_CHANCE = 0.0016, TURN_DAMP = 0.94;
  var TURN_FOLLOW_CHANCE = 0.025, TURN_CARRY = 0.95;   // M3
  var NEIGHBOR_R = 150, SEPARATE_R = 55;
  var MID_TURN = 0.035;       // |turnVel| above this = "mid-turn"
  var WAKE_THRESHOLD = 2.2;   // tail-tip px displacement per frame to paint a ring

  var fish = [], rings = [];
  var startleLog = [];        // for the test hook: {t, idx}

  function rnd(a, b){ return a + Math.random() * (b - a); }

  function makeFish(i, cx, cy){
    var a = (i / N) * Math.PI * 2;
    var ex = cx + Math.cos(a) * Math.min(W,H) * 0.22;
    var ey = cy + Math.sin(a) * Math.min(W,H) * 0.16;
    return {
      x: ex, y: ey,
      heading: a + Math.PI/2 + rnd(-0.3, 0.3),
      speed: rnd(0.8, 1.4),
      turnVel: 0,
      tailPhase: rnd(0, Math.PI*2),
      size: rnd(9, 13),
      boostT: 0,
      turning: false,          // latched "has turned" for the wave test
      turnStartT: -1,
      tailTipX: ex, tailTipY: ey,
      id: i
    };
  }

  function reset(){
    fish = []; rings = []; startleLog = [];
    var cx = W/2, cy = H/2;
    for (var i = 0; i < N; i++) fish.push(makeFish(i, cx, cy));
  }

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    reset();
    paintSand();
  }

  // white sand: soft patches baked to an offscreen canvas
  var sandCv = null;
  function paintSand(){
    sandCv = document.createElement('canvas');
    sandCv.width = Math.max(2, Math.round(W/2)); sandCv.height = Math.max(2, Math.round(H/2));
    var s = sandCv.getContext('2d');
    s.fillStyle = '#2e4a5c'; s.fillRect(0,0,sandCv.width,sandCv.height);
    var i, x, y, r, g;
    for (i = 0; i < 26; i++){
      x = rnd(0, sandCv.width); y = rnd(sandCv.height*0.45, sandCv.height);
      r = rnd(30, 130);
      g = s.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(232,226,205,0.20)');
      g.addColorStop(1, 'rgba(232,226,205,0)');
      s.fillStyle = g;
      s.beginPath(); s.arc(x, y, r, 0, Math.PI*2); s.fill();
    }
  }

  function startle(x, y, t){
    var best = null, bd = 1e12, bi = -1, i, d;
    for (i = 0; i < fish.length; i++){
      d = Math.hypot(fish[i].x - x, fish[i].y - y);
      if (d < bd){ bd = d; best = fish[i]; bi = i; }
    }
    if (!best) return;
    // dart away from the tap
    var away = Math.atan2(best.y - y, best.x - x);
    var dh = away - best.heading;
    while (dh > Math.PI) dh -= Math.PI*2;
    while (dh < -Math.PI) dh += Math.PI*2;
    best.turnVel = (dh >= 0 ? 1 : -1) * 0.28;
    best.speed = SPEED_MAX;
    best.boostT = BOOST_TICKS;
    best.turning = true; best.turnStartT = t;
    startleLog.push({ t: t, idx: bi });
    // a hard flick throws a ring (M1)
    rings.push({ x: best.x, y: best.y, r: 6, alpha: 0.5 });
  }

  function step(t){
    var i, j, f, o, dx, dy, d, d2;
    // pairwise: boids + turn contagion (M3)
    for (i = 0; i < fish.length; i++){
      f = fish[i];
      var nCount = 0, ax = 0, ay = 0, cx = 0, cy = 0;
      for (j = 0; j < fish.length; j++){
        if (i === j) continue;
        o = fish[j];
        dx = o.x - f.x; dy = o.y - f.y; d2 = dx*dx + dy*dy;
        if (d2 > NEIGHBOR_R * NEIGHBOR_R) continue;
        d = Math.sqrt(d2) || 0.001;
        nCount++; ax += Math.cos(o.heading); ay += Math.sin(o.heading);
        cx += o.x; cy += o.y;
        if (d < SEPARATE_R){
          // separation: steer away
          var push = (SEPARATE_R - d) / SEPARATE_R * 0.012;
          var awayA = Math.atan2(-dy, -dx);
          var dd = awayA - f.heading;
          while (dd > Math.PI) dd -= Math.PI*2;
          while (dd < -Math.PI) dd += Math.PI*2;
          f.turnVel += Math.max(-0.05, Math.min(0.05, dd * push));
        }
        // M3 turn copying: mid-turn fish -> non-turning neighbor
        var fMid = Math.abs(f.turnVel) > MID_TURN;
        var oMid = Math.abs(o.turnVel) > MID_TURN;
        if (fMid && !oMid && Math.random() < TURN_FOLLOW_CHANCE){
          o.turnVel = f.turnVel * TURN_CARRY;
          if (!o.turning){ o.turning = true; o.turnStartT = t; }
        }
      }
      if (nCount > 0){
        // alignment
        var avgH = Math.atan2(ay / nCount, ax / nCount);
        var da = avgH - f.heading;
        while (da > Math.PI) da -= Math.PI*2;
        while (da < -Math.PI) da += Math.PI*2;
        f.turnVel += Math.max(-0.02, Math.min(0.02, da * 0.06));
        // cohesion
        var gx = cx / nCount, gy = cy / nCount;
        var ga = Math.atan2(gy - f.y, gx - f.x);
        var dg = ga - f.heading;
        while (dg > Math.PI) dg -= Math.PI*2;
        while (dg < -Math.PI) dg += Math.PI*2;
        f.turnVel += Math.max(-0.015, Math.min(0.015, dg * 0.04));
      }
      // soft boundary: steer back toward center
      var m = 90;
      if (f.x < m || f.x > W - m || f.y < m || f.y > H - m){
        var ba = Math.atan2(H/2 - f.y, W/2 - f.x);
        var db = ba - f.heading;
        while (db > Math.PI) db -= Math.PI*2;
        while (db < -Math.PI) db += Math.PI*2;
        f.turnVel += Math.max(-0.04, Math.min(0.04, db * 0.08));
      }
    }
    // integrate
    for (i = 0; i < fish.length; i++){
      f = fish[i];
      // M4 pulse-glide
      f.speed = Math.max(SPEED_MIN, f.speed * SPEED_DECAY);
      if (f.boostT > 0){ f.boostT--; f.speed = Math.min(SPEED_MAX, f.speed + 0.09); }
      else if (Math.random() < BOOST_CHANCE){ f.boostT = 5 + (Math.random() * 25 | 0); }
      if (Math.random() < TURN_CHANCE){
        f.turnVel += (Math.random() < 0.5 ? -1 : 1) * rnd(0.05, 0.12);
        if (!f.turning){ f.turning = true; f.turnStartT = t; }
      }
      f.heading += f.turnVel;
      f.turnVel *= TURN_DAMP;
      f.x += Math.cos(f.heading) * f.speed;
      f.y += Math.sin(f.heading) * f.speed;
      f.tailPhase += 0.12 + f.speed * 0.10;
      // M1 wake: tail-tip displacement paints rings
      var tl = f.size * 2.6;
      var sway = Math.sin(f.tailPhase) * f.size * 0.55;
      var tx = f.x - Math.cos(f.heading) * tl - Math.sin(f.heading) * sway;
      var ty = f.y - Math.sin(f.heading) * tl + Math.cos(f.heading) * sway;
      var td = Math.hypot(tx - f.tailTipX, ty - f.tailTipY);
      if (td > WAKE_THRESHOLD && rings.length < 220){
        rings.push({ x: tx, y: ty, r: 3, alpha: Math.min(0.45, 0.10 + td * 0.03) });
      }
      f.tailTipX = tx; f.tailTipY = ty;
    }
    // rings expand and fade
    for (i = rings.length - 1; i >= 0; i--){
      var r = rings[i];
      r.r += 1.1; r.alpha *= 0.965;
      if (r.alpha < 0.015) rings.splice(i, 1);
    }
  }

  function drawFish(f){
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.heading);
    var s = f.size, L = s * 3.2;
    var sway = Math.sin(f.tailPhase) * s * 0.35;
    // tail fin
    ctx.fillStyle = 'rgba(214,178,106,0.9)';
    ctx.beginPath();
    ctx.moveTo(-L*0.42, 0);
    ctx.quadraticCurveTo(-L*0.62, sway - s*0.9, -L*0.72, sway - s*1.15);
    ctx.quadraticCurveTo(-L*0.60, sway, -L*0.72, sway + s*1.15);
    ctx.quadraticCurveTo(-L*0.62, sway + s*0.9, -L*0.42, 0);
    ctx.fill();
    // body: pale gold, darker back
    var g = ctx.createLinearGradient(0, -s*0.8, 0, s*0.8);
    g.addColorStop(0, '#c99e52');
    g.addColorStop(0.45, '#ecd096');
    g.addColorStop(1, '#d9b96f');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, L*0.46, s*0.78, 0, 0, Math.PI*2);
    ctx.fill();
    // dorsal fin
    ctx.fillStyle = 'rgba(190,150,80,0.85)';
    ctx.beginPath();
    ctx.moveTo(-L*0.05, -s*0.55);
    ctx.quadraticCurveTo(-L*0.18, -s*1.25, -L*0.30, -s*0.55);
    ctx.closePath(); ctx.fill();
    // pectoral fins
    ctx.beginPath();
    ctx.moveTo(L*0.12, -s*0.4);
    ctx.quadraticCurveTo(L*0.02, -s*1.05 + sway*0.3, -L*0.08, -s*0.55);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(L*0.12, s*0.4);
    ctx.quadraticCurveTo(L*0.02, s*1.05 - sway*0.3, -L*0.08, s*0.55);
    ctx.closePath(); ctx.fill();
    // head + eye
    ctx.fillStyle = '#e8c987';
    ctx.beginPath(); ctx.arc(L*0.34, 0, s*0.52, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#20303a';
    ctx.beginPath(); ctx.arc(L*0.42, -s*0.18, s*0.10, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(L*0.42, s*0.18, s*0.10, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function draw(t){
    // water
    ctx.drawImage(sandCv, 0, 0, W, H);
    var vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.75);
    vg.addColorStop(0, 'rgba(20,40,54,0)');
    vg.addColorStop(1, 'rgba(16,32,44,0.55)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    // wake rings
    var i, r;
    for (i = 0; i < rings.length; i++){
      r = rings[i];
      ctx.strokeStyle = 'rgba(210,228,238,' + r.alpha.toFixed(3) + ')';
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI*2); ctx.stroke();
    }
    // fish, far (small) first
    var order = fish.slice().sort(function(a,b){ return a.size - b.size; });
    for (i = 0; i < order.length; i++) drawFish(order[i]);
  }

  var lastT = -1;
  function frame(now){
    var t = now / 1000, dt;
    if (lastT < 0){ lastT = t; requestAnimationFrame(frame); return; }
    dt = Math.min(0.05, t - lastT); lastT = t;
    var steps = dt > 0.025 ? 2 : 1;   // keep sim stable on slow frames
    for (var k = 0; k < steps; k++) step(t);
    draw(t);
    requestAnimationFrame(frame);
  }

  // tap = startle nearest fish (a disturbance, not a reload)
  var downX = 0, downY = 0, downT = 0;
  function pos(e){
    var r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  cv.addEventListener('pointerdown', function(e){
    var p = pos(e); downX = p.x; downY = p.y; downT = performance.now();
  });
  cv.addEventListener('pointerup', function(e){
    var p = pos(e), now = performance.now();
    if (now - downT < 400 && Math.hypot(p.x - downX, p.y - downY) < 16){
      startle(p.x, p.y, now / 1000);
    }
  });

  if (window.addEventListener) window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);

  // test hook
  window.__koi = {
    fish: fish,
    rings: rings,
    startleLog: startleLog,
    startle: startle,
    turnedCount: function(){ var n=0,i; for(i=0;i<fish.length;i++) if(fish[i].turning) n++; return n; },
    turnTimes: function(){ var a=[],i; for(i=0;i<fish.length;i++) if(fish[i].turnStartT>=0) a.push({id:fish[i].id,t:fish[i].turnStartT}); return a.sort(function(x,y){return x.t-y.t;}); }
  };
})();
</script>
</body></html>
