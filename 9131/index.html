<body>
<canvas id="water" role="img" aria-label="One lifelike red-and-white koi swims under a dark green water surface. Tap the water to invite the koi toward you. It turns and swims to your touch."></canvas>
<div class="chrome" id="chrome">

<noscript>JavaScript is required for this animated study.</noscript>
<script>
(() => {
  'use strict';
  const cvs=document.getElementById('water'), c=cvs.getContext('2d',{alpha:false});
  if(!c) return;
  const TAU=Math.PI*2, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
  const smooth=(a,b,x)=>{let t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
  const angleDiff=(a,b)=>Math.atan2(Math.sin(b-a),Math.cos(b-a));
  const rseed=(n)=>{let v=n>>>0;return()=>{v+=0x6D2B79F5;let t=v;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;};};
  const random=rseed(9131);
  const rand=(a,b)=>lerp(a,b,random());
  let W=0,H=0,DPR=1,L=350,water=null,now=0,last=0,paused=false,hidden=false,wakes=[],target=null,fish=null,particles=[];
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Each decision is local to the fish, not a prescribed loop. The fish chooses
  // a destination, turns with angular inertia, swims there, then coasts away.
  function pickRoamPoint(f, first=false){
    const border=Math.min(Math.min(W,H)*.22, L*.33+32);
    const spanX=Math.max(1,W-border*2),spanY=Math.max(1,H-border*2);
    let best=null,bestScore=-1e9;
    for(let k=0;k<14;k++){
      const x=border+random()*spanX,y=border+random()*spanY;
      const dx=x-f.x,dy=y-f.y,d=Math.hypot(dx,dy);
      const heading=Math.atan2(dy,dx),turn=Math.abs(angleDiff(f.heading,heading));
      const preferred=Math.abs(d-Math.min(Math.max(W,H)*.45,L*2));
      const score=-turn*L*.16-preferred*.11+Math.min(d,L*2.4)*.37+random()*L*.12;
      if(score>bestScore){best={x,y};bestScore=score;}
    }
    return best||{x:W*.5,y:H*.5};
  }
  function makeFish(){
    const portrait=W/H<.8;
    const x=W*(portrait?.54:.49),y=H*(portrait?.56:.58),heading=portrait?-1.18:-.68;
    const history=[];
    for(let i=0;i<=160;i++){
      const d=-i*L/72;
      history.push({x:x+d*Math.cos(heading),y:y+d*Math.sin(heading),d});
    }
    fish={x,y,heading,speed:L*.25,omega:0,
      phase:.8,energy:.68,finPhase:.2,headYaw:0,
      total:0,history,spine:[],points:[],nose:{x,y},tail:{x:0,y:0},
      waypoint:null,mode:'cruise',modeTime:3.3,inspectTime:0,
      cruiseSpeed:L*.31,travel:0,tailThrust:0,turnBank:0};
    fish.waypoint=pickRoamPoint(fish,true);
    computeBody();
  }
  function size(){
    const oldW=W,oldH=H,oldL=L;
    W=window.innerWidth;H=window.innerHeight;
    DPR=Math.min(window.devicePixelRatio||1,W<700?1.8:1.4);
    cvs.width=Math.round(W*DPR); cvs.height=Math.round(H*DPR);
    c.setTransform(DPR,0,0,DPR,0,0);
    L=clamp(Math.min(W*.50,H*.43),170,380);
    if(!fish)makeFish();
    else {
      const k=L/oldL;
      const sx=W/oldW,sy=H/oldH;
      fish.x*=sx;fish.y*=sy;fish.speed*=k;
      fish.history=fish.history.map(v=>({x:v.x*sx,y:v.y*sy,d:v.d*k}));
      fish.total*=k;
      fish.cruiseSpeed*=k;
      fish.waypoint=pickRoamPoint(fish);
      if(target){target.x=target.x*sx;target.y=target.y*sy;}
      computeBody();
    }
    makeWater();
  }
  function makeWater(){
    const off=document.createElement('canvas');off.width=Math.ceil(W);off.height=Math.ceil(H);
    const g=off.getContext('2d');
    const grad=g.createLinearGradient(0,0,W,H);
    grad.addColorStop(0,'#071e20'); grad.addColorStop(.32,'#113632');
    grad.addColorStop(.65,'#103d38'); grad.addColorStop(1,'#062727');
    g.fillStyle=grad;g.fillRect(0,0,W,H);
    const glow=g.createRadialGradient(W*.48,H*.43,0,W*.50,H*.50,Math.max(W,H)*.78);
    glow.addColorStop(0,'rgba(120,169,138,.16)');glow.addColorStop(.43,'rgba(44,109,93,.08)');glow.addColorStop(1,'rgba(0,5,13,.50)');
    g.fillStyle=glow;g.fillRect(0,0,W,H);
    const noise=rseed(46119);
    // Three frequency bands imply depth without a noisy photographic texture.
    for(let k=0;k<44;k++){
      const x=noise()*W,y=noise()*H,r=15+noise()*Math.min(W,H)*.24;
      const blur=g.createRadialGradient(x,y,0,x,y,r);
      blur.addColorStop(0,k%3?'rgba(10,24,26,.085)':'rgba(95,150,116,.035)');
      blur.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=blur;g.fillRect(x-r,y-r,r*2,r*2);
    }
    for(let i=0;i<Math.floor(W*H/270);i++){
      const x=noise()*W,y=noise()*H;
      g.fillStyle=`rgba(201,226,194,${.007+noise()*.022})`;
      g.fillRect(x,y,.4+noise()*1.2,.4+noise()*1.2);
    }
    water=off;
    const nr=rseed(38119);particles=[];
    for(let j=0;j<Math.min(180,Math.round(W*H/6000));j++){
      particles.push({x:nr()*W,y:nr()*H,depth:.1+nr()*.9,phase:nr()*TAU,r:.28+nr()*1.12});
    }
  }
  function drawWater(t){
    c.drawImage(water,0,0,W,H);
    // Sparse curved glints represent moving surface caustics rather than a grid.
    c.save();c.globalCompositeOperation='screen';
    const glintSeed=rseed(21819);
    for(let i=0;i<74;i++){
      const x=glintSeed()*W,y=glintSeed()*H;
      const r=13+glintSeed()*Math.min(W,H)*.09;
      const phase=glintSeed()*TAU;
      const slideX=Math.sin(t*.12+phase)*r*.34;
      const slideY=Math.cos(t*.16+phase)*r*.21;
      const a=phase+t*(i%2?.055:-.045);
      c.beginPath();
      c.ellipse(x+slideX,y+slideY,r,r*(.4+glintSeed()*.32),a,.18,1.4);
      c.lineWidth=.6+(i%4)*.13;
      c.strokeStyle=`rgba(169,225,196,${.014+.012*(.5+.5*Math.sin(t*.32+i*1.41))})`;
      c.stroke();
    }
    c.restore();
    // A soft passing shaft of reflected sky, nearly imperceptible until it moves.
    const sx=W*(.34+.08*Math.sin(t*.06));
    const beam=c.createLinearGradient(sx-W*.24,0,sx+W*.24,H);
    beam.addColorStop(0,'rgba(171,210,190,0)');beam.addColorStop(.38,'rgba(171,210,190,.022)');
    beam.addColorStop(.58,'rgba(171,210,190,.009)');beam.addColorStop(1,'rgba(171,210,190,0)');
    c.fillStyle=beam;c.fillRect(0,0,W,H);
  }
  function swim(dt){
    const f=fish;
    // Explicit navigation states: cruise, coast, seek a touch, and investigate it.
    if(target && target.mode==='seek'){
      f.mode='seek';
      f.modeTime=0;
      const dist=Math.hypot(f.x-target.x,f.y-target.y);
      if(dist<L*.12){
        target.mode='inspect';target.life=2.2;
        f.mode='inspect';
      }
    } else if(target && target.mode==='inspect'){
      f.mode='inspect';target.life-=dt;
      if(target.life<=0){target=null;f.mode='coast';f.modeTime=1.1;f.waypoint=pickRoamPoint(f);}
    } else {
      f.modeTime-=dt;
      if(f.modeTime<=0){
        if(f.mode==='coast') {f.mode='cruise'; f.modeTime=2.6+random()*2.4;}
        else {f.mode='coast'; f.modeTime=.8+random()*1.0;}
      }
      const d=Math.hypot(f.x-f.waypoint.x,f.y-f.waypoint.y);
      if(d<L*.38 && f.mode!=='coast'){
        f.waypoint=pickRoamPoint(f);
        f.mode='coast';f.modeTime=.6+random()*.6;
      }
    }
    let goal=target ? target : f.waypoint;
    let desired=Math.atan2(goal.y-f.y,goal.x-f.x);
    const dist=Math.hypot(goal.x-f.x,goal.y-f.y);

    // Anticipate the water's edge far enough ahead to turn without clipping it.
    const anticipate=f.speed*2.7+L*.42;
    const aheadX=f.x+Math.cos(f.heading)*anticipate;
    const aheadY=f.y+Math.sin(f.heading)*anticipate;
    const rimX=Math.min(L*.35+26,W*.34),rimY=Math.min(L*.35+26,H*.26);
    const clX=clamp(aheadX,rimX,W-rimX),clY=clamp(aheadY,rimY,H-rimY);
    const outside=Math.hypot(aheadX-clX,aheadY-clY);
    if(outside>1){
      const inward=Math.atan2(clamp(f.y,rimY,H-rimY)-aheadY,clamp(f.x,rimX,W-rimX)-aheadX);
      const w=smooth(0,L*.38,outside);
      const vx=Math.cos(desired)*(1-w)+Math.cos(inward)*w;
      const vy=Math.sin(desired)*(1-w)+Math.sin(inward)*w;
      desired=Math.atan2(vy,vx);
    }
    const error=angleDiff(f.heading,desired);
    const isSeek=f.mode==='seek',isInspect=f.mode==='inspect';
    const sharpSeek=isSeek && Math.abs(error)>1.12;
    const turnLimit=sharpSeek?1.72:outside>L*.16?1.35:isSeek?1.12:.99;
    const desiredOmega=clamp(error*2.25,-turnLimit,turnLimit);
    // Angular acceleration is deliberately limited; the tail trails the turn.
    const correction=clamp((desiredOmega-f.omega)*2.6,-1.78,1.78);
    f.omega=clamp(f.omega+correction*dt,-turnLimit,turnLimit);
    f.heading+=f.omega*dt;
    const turnEffort=Math.min(1,Math.abs(f.omega));

    const nearTarget=isSeek ? smooth(L*.08,L*.9,dist) : 1;
    const desiredEnergy=isInspect?.09:isSeek ? (.40+.49*nearTarget) :
      f.mode==='cruise' ? .66 : .105;
    f.energy+=(desiredEnergy-f.energy)*(1-Math.exp(-dt*(desiredEnergy>f.energy?3.1:2.1)));
    const beatsPerSecond=.48+f.energy*.97+turnEffort*.12;
    const oldPhase=f.phase;
    f.phase+=dt*TAU*beatsPerSecond;
    f.finPhase+=dt*TAU*(isInspect?2.0:.74+turnEffort*.34);

    // Alternating half-strokes deliver thrust; the speed then decays under drag.
    const halfStroke=Math.max(0,Math.sin(f.phase))**2;
    const thrust=L*.38*f.energy*(.38+halfStroke*.94);
    const drag=f.speed*.19+(f.speed*f.speed/L)*.87;
    const braking=isInspect?L*.55:(isSeek ? L*.24*(1-nearTarget):0);
    const accel=thrust-drag-braking;
    f.speed=clamp(f.speed+accel*dt,isInspect?L*.004:L*.045,L*.34);
    if(outside>1) f.speed *= Math.exp(-dt*1.65*smooth(1,L*.47,outside));
    if(sharpSeek) f.speed *= Math.exp(-dt*2.65);
    if(isInspect)f.speed*=Math.exp(-dt*2.25);
    const targetTurnDrag=1-.12*turnEffort;
    const vx=Math.cos(f.heading+f.headYaw)*f.speed*targetTurnDrag;
    const vy=Math.sin(f.heading+f.headYaw)*f.speed*targetTurnDrag;
    f.headYaw=-Math.sin(f.phase-.38)*(.005+.019*f.energy);
    f.x+=vx*dt;
    f.y+=vy*dt;
    f.x=clamp(f.x,L*.23,W-L*.23);
    f.y=clamp(f.y,L*.23,H-L*.23);
    f.travel+=Math.hypot(vx*dt,vy*dt);
    f.tailThrust=halfStroke*f.energy;
    f.turnBank+=(f.omega-f.turnBank)*(1-Math.exp(-dt*4));

    // Arc-length trail allows the body to follow an actual turn without stretching.
    const delta=Math.hypot(f.x-f.history[0].x,f.y-f.history[0].y);
    if(delta>.43){
      f.total+=delta;
      f.history.unshift({x:f.x,y:f.y,d:f.total});
    }
    const minimum=f.total-L*1.60;
    while(f.history.length>3 && f.history[f.history.length-2].d<minimum)f.history.pop();
    computeBody();

    // Caudal wakes are born at each completed half stroke, not on a timer.
    if(Math.floor(oldPhase/Math.PI)!==Math.floor(f.phase/Math.PI) && f.energy>.28){
      const q=f.tail;
      wakes.push({x:q.x,y:q.y,age:0,life:2.6,r:3+L*.011,
        power:f.energy,angle:f.heading,side:Math.sign(Math.sin(f.phase))||1});
      if(wakes.length>16)wakes.shift();
    }
  }
  function sampleTrail(back){
    const h=fish.history, t=fish.total-back;
    let i=0;
    while(i<h.length-2&&h[i+1].d>t)i++;
    const a=h[i], b=h[Math.min(i+1,h.length-1)];
    const v=clamp((a.d-t)/Math.max(.00001,a.d-b.d),0,1);
    return {x:lerp(a.x,b.x,v),y:lerp(a.y,b.y,v)};
  }
  // Measured proportions of a top-down carp: rounded shoulder, thicker mid-body,
  // quick taper through the caudal peduncle, and a blunt/soft snout.
  const widthKeys=[[0,.020],[.025,.044],[.065,.076],[.12,.108],[.21,.137],[.32,.151],[.42,.143],[.54,.122],[.67,.091],[.78,.059],[.88,.032],[.96,.018],[1,.011]];
  function widthAt(u){
    for(let i=0;i<widthKeys.length-1;i++)if(u<=widthKeys[i+1][0]){
      const a=widthKeys[i],b=widthKeys[i+1];return lerp(a[1],b[1],smooth(a[0],b[0],u));
    }
    return widthKeys[widthKeys.length-1][1];
  }
  function computeBody(){
    if(!fish)return;
    const f=fish, n=88;
    const raw=[];
    for(let i=0;i<=n;i++){
      const u=i/n,historyPoint=sampleTrail(L*u);
      const h=f.heading+f.headYaw;
      const straight={x:f.x-Math.cos(h)*L*u,y:f.y-Math.sin(h)*L*u};
      const follow=.30+.49*smooth(.07,.9,u);
      raw.push({x:lerp(straight.x,historyPoint.x,follow),y:lerp(straight.y,historyPoint.y,follow)});
    }
    const spine=[];
    for(let i=0;i<=n;i++){
      const u=i/n,prev=raw[Math.max(0,i-1)],next=raw[Math.min(n,i+1)];
      let tx=prev.x-next.x,ty=prev.y-next.y,mag=Math.hypot(tx,ty)||1;
      tx/=mag;ty/=mag;
      const envelope=Math.pow(u,1.95)*smooth(.08,.36,u);
      // Traveling wave reaches its largest excursion near the narrow peduncle.
      const displacement=L*(.006+.085*f.energy)*envelope*Math.sin(f.phase-u*5.45);
      spine.push({x:raw[i].x-ty*displacement,y:raw[i].y+tx*displacement});
    }
    const points=[];
    for(let i=0;i<=n;i++){
      const p=spine[i],prev=spine[Math.max(0,i-1)],next=spine[Math.min(n,i+1)];
      let tx=prev.x-next.x,ty=prev.y-next.y,mag=Math.hypot(tx,ty)||1;
      tx/=mag;ty/=mag;
      points.push({x:p.x,y:p.y,nx:-ty,ny:tx,w:widthAt(i/n)*L});
    }
    f.points=points;f.nose=points[0];f.tail=points[n];
  }
  function p(u,v=0){
    const pts=fish.points;
    const ix=clamp(u,0,1)*(pts.length-1),i=Math.min(pts.length-2,Math.floor(ix)),t=ix-i;
    const a=pts[i],b=pts[i+1];
    const x=lerp(a.x,b.x,t),y=lerp(a.y,b.y,t);
    let nx=lerp(a.nx,b.nx,t),ny=lerp(a.ny,b.ny,t);const m=Math.hypot(nx,ny)||1;nx/=m;ny/=m;
    const w=widthAt(u)*L;
    return {x:x+nx*w*v,y:y+ny*w*v,nx,ny};
  }
  function traceBody(){
    c.beginPath(); const z=p(0,0);c.moveTo(z.x,z.y);
    for(let i=1;i<=88;i++){let q=p(i/88,1);c.lineTo(q.x,q.y);}
    for(let i=88;i>=0;i--){let q=p(i/88,-1);c.lineTo(q.x,q.y);}c.closePath();
  }
  function finishPath(path){c.beginPath();c.moveTo(path[0].x,path[0].y);for(let i=1;i<path.length;i++)c.lineTo(path[i].x,path[i].y);c.closePath();}
  function fin(side,u,phase,size=1){
    const root=p(u,side*.91),root2=p(u+.075,side*.89),L0=L;
    const f=fish,turn=clamp(f.omega,-1,1);
    const paddling=f.mode==='inspect'?1:.20;
    const flutter=.48*Math.sin(phase) + .18*Math.sin(phase*.57+side);
    const fan=1+.16*flutter+side*turn*.26 + paddling*.13;
    const spread=(u>.5?.107:.183)*size*fan;
    const reach=(u>.5?.112:.138)*size*(1+.17*Math.cos(phase));
    // local tangent points toward the tail. Sideways spread pivots around bone.
    const t={x:-root.ny,y:root.nx};
    const tip={x:root.x+root.nx*side*spread*L0+t.x*reach*L0*.58,
               y:root.y+root.ny*side*spread*L0+t.y*reach*L0*.58};
    const rear={x:root.x+t.x*reach*L0,y:root.y+t.y*reach*L0};
    const g=c.createLinearGradient(root.x,root.y,tip.x,tip.y);
    g.addColorStop(0,'rgba(247,244,231,.94)');
    g.addColorStop(.25,'rgba(239,240,225,.72)');
    g.addColorStop(.70,'rgba(224,234,219,.34)');
    g.addColorStop(1,'rgba(205,227,215,.025)');
    c.beginPath();c.moveTo(root.x,root.y);
    c.bezierCurveTo(root.x+root.nx*side*spread*L0*.57,root.y+root.ny*side*spread*L0*.57,
      tip.x-t.x*reach*L0*.14,tip.y-t.y*reach*L0*.14,tip.x,tip.y);
    c.quadraticCurveTo(rear.x+root.nx*side*spread*L0*.38,rear.y+root.ny*side*spread*L0*.38,rear.x,rear.y);
    c.quadraticCurveTo(root2.x,root2.y,root.x,root.y);
    c.closePath();c.fillStyle=g;c.fill();
    c.lineWidth=Math.max(.5,L*.0018);c.strokeStyle='rgba(250,249,236,.24)';c.stroke();
    for(let j=1;j<=15;j++){
      const a=j/16,end={x:lerp(tip.x,rear.x,a),y:lerp(tip.y,rear.y,a)};
      c.beginPath();c.moveTo(root.x,root.y);
      c.quadraticCurveTo(lerp(root.x,end.x,.5)+root.nx*side*L*.01,
        lerp(root.y,end.y,.5)+root.ny*side*L*.01,end.x,end.y);
      c.strokeStyle=`rgba(255,253,243,${.085+.18*Math.sin(a*Math.PI)})`;
      c.lineWidth=Math.max(.4,L*.0011);c.stroke();
    }
  }
  function tailFin(){
    const root=p(.99,0),prev=p(.952,0),L0=L;
    const backX=root.x-prev.x, backY=root.y-prev.y;
    let mag=Math.hypot(backX,backY)||1,dx=backX/mag,dy=backY/mag;
    const nx=-dy,ny=dx;
    const flutter=Math.sin(fish.phase-4.9)*.10;
    const cs=Math.cos(flutter),sn=Math.sin(flutter);
    const v=(a,b)=>({x:root.x+dx*L0*a*cs+nx*L0*(b+sn*a),y:root.y+dy*L0*a*cs+ny*L0*(b+sn*a)});
    const tipTop=v(.225,-.179),tipBottom=v(.225,.179),notch=v(.100,0);
    const g=c.createLinearGradient(tipTop.x,tipTop.y,tipBottom.x,tipBottom.y);
    g.addColorStop(0,'rgba(239,234,215,.52)');g.addColorStop(.35,'rgba(250,246,226,.84)');g.addColorStop(.58,'rgba(247,243,223,.72)');g.addColorStop(1,'rgba(233,234,223,.22)');
    const upperShoulder=v(.105,-.045),innerUpper=v(.15,-.043),innerLower=v(.15,.043);
    c.beginPath();c.moveTo(root.x,root.y);
    let q=v(.17,-.133),q2=v(.222,-.18);
    c.bezierCurveTo(upperShoulder.x,upperShoulder.y,q.x,q.y,tipTop.x,tipTop.y);
    q=v(.183,-.142);q2=v(.159,-.069);
    c.bezierCurveTo(q.x,q.y,q2.x,q2.y,innerUpper.x,innerUpper.y);
    const valleyTop=v(.115,-.012);
    c.quadraticCurveTo(valleyTop.x,valleyTop.y,notch.x,notch.y);
    const valley=v(.115,.012);
    c.quadraticCurveTo(valley.x,valley.y,innerLower.x,innerLower.y);
    q=v(.159,.069);q2=v(.183,.142);
    c.bezierCurveTo(q.x,q.y,q2.x,q2.y,tipBottom.x,tipBottom.y);
    q=v(.17,.133);
    const lowerShoulder=v(.105,.045);
    c.bezierCurveTo(q.x,q.y,lowerShoulder.x,lowerShoulder.y,root.x,root.y);
    c.closePath();c.fillStyle=g;c.fill();
    c.lineWidth=Math.max(.6,L*.0016);c.strokeStyle='rgba(248,244,227,.31)';c.stroke();
    for(const side of [-1,1])for(let i=1;i<=15;i++){
      const t=i/16;const end=v(.13+.085*t,side*.174*t);
      c.beginPath();c.moveTo(root.x,root.y);
      const a=v(.12,side*.055*t);c.quadraticCurveTo(a.x,a.y,end.x,end.y);
      c.lineWidth=Math.max(.4,L*.00125);c.strokeStyle=`rgba(255,253,240,${.08+.16*(1-t)})`;c.stroke();
    }
  }
  const patterns=[
    {u:.104,v:-.015,rx:.076,ry:.51,seed:1},
    {u:.314,v:-.07,rx:.087,ry:.90,seed:2},
    {u:.512,v:.12,rx:.092,ry:.94,seed:3},
    {u:.733,v:-.12,rx:.082,ry:.86,seed:4}
  ];
  function hiPatch(mark){
    const N=100,shape=[];
    for(let j=0;j<=N;j++){
      const a=j/N*TAU;
      const noise=1+.115*Math.sin(a*5+mark.seed*1.3)+.072*Math.sin(a*9-mark.seed*2.1)+.035*Math.cos(a*17+mark.seed*5.8);
      const u=clamp(mark.u+Math.cos(a)*mark.rx*noise,.009,.974);
      const v=mark.v+Math.sin(a)*mark.ry*noise;
      shape.push(p(u,v));
    }
    finishPath(shape);
    const mid=p(mark.u,mark.v*.45);
    const grad=c.createRadialGradient(mid.x-L*.015,mid.y-L*.025,2,mid.x,mid.y,L*mark.rx*1.75);
    grad.addColorStop(0,'#f16b3a');grad.addColorStop(.45,'#e6532a');grad.addColorStop(.82,'#d54126');grad.addColorStop(1,'#b93521');
    c.fillStyle=grad;c.fill();
    c.lineWidth=Math.max(.6,L*.0018);c.strokeStyle='rgba(131,37,26,.22)';c.stroke();
  }
  function koiBody(){
    traceBody();
    // Body luminance is painted using lateral bands following the moving spine.
    c.fillStyle='#e7e4d7';c.fill();
    c.save();traceBody();c.clip();
    for(let i=0;i<56;i++){
      const u=i/56,q=p(u,0),w=widthAt(u)*L;
      const a=p(u,1),b=p(u,-1);
      let g=c.createLinearGradient(a.x,a.y,b.x,b.y);
      g.addColorStop(0,'rgba(66,81,75,.31)');g.addColorStop(.15,'rgba(204,209,195,.27)');
      g.addColorStop(.42,'rgba(255,255,246,.65)');g.addColorStop(.6,'rgba(255,253,241,.54)');g.addColorStop(.86,'rgba(172,188,175,.21)');g.addColorStop(1,'rgba(74,83,75,.29)');
      const u2=Math.min(1,(i+1)/56),s=p(u2,1),t=p(u2,-1);
      c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.lineTo(t.x,t.y);c.lineTo(s.x,s.y);c.closePath();c.fillStyle=g;c.fill();
    }
    for(const mark of patterns)hiPatch(mark);
    drawScales();
    c.restore();
    traceBody();c.lineWidth=Math.max(.65,L*.0019);c.strokeStyle='rgba(245,242,220,.25)';c.stroke();
  }
  function drawScales(){
    c.lineWidth=Math.max(.38,L*.00155);
    for(let i=0;i<27;i++){
      const u=.18+i*.026;
      for(let j=-5;j<=5;j++){
        const v=(j+(i%2)*.5)*.16;
        if(Math.abs(v)>.91)continue;
        const a=p(u,v-.046),m=p(u+.012,v),b=p(u,v+.046);
        c.beginPath();c.moveTo(a.x,a.y);c.quadraticCurveTo(m.x,m.y,b.x,b.y);
        c.strokeStyle=(i+j)%7===0?'rgba(255,255,248,.26)':'rgba(53,70,60,.14)';c.stroke();
      }
    }
    for(let i=0;i<65;i++){
      const u=.17+((i*17)%69)*.0105,v=Math.sin(i*41.2)*.83;
      const q=p(u,v);
      c.beginPath();c.ellipse(q.x,q.y,L*.0024,L*.00115,0,0,TAU);
      c.fillStyle=`rgba(255,255,246,${.075+.09*(.5+.5*Math.sin(i*4.3+now*.6))})`;c.fill();
    }
  }
  function drawDorsal(){
    // The dorsal ridge is a low, translucent blade: visible from above at the
    // shoulders and then swallowed by the white dorsal keel.
    const a=p(.37,-.010),b=p(.72,-.010);
    c.beginPath();c.moveTo(a.x,a.y);
    for(let i=1;i<=28;i++){
      let u=.37+.35*i/28,q=p(u,-.015-(.036*Math.sin(Math.PI*i/28)));
      c.lineTo(q.x,q.y);
    }
    c.lineTo(b.x,b.y);c.closePath();
    c.fillStyle='rgba(248,244,225,.32)';c.fill();
    c.lineWidth=Math.max(.65,L*.0024);c.strokeStyle='rgba(255,254,242,.31)';c.stroke();
    for(let j=1;j<=11;j++){
      const u=.37+.35*j/12,root=p(u,0),tip=p(u,-.02-.035*Math.sin(Math.PI*j/12));
      c.beginPath();c.moveTo(root.x,root.y);c.lineTo(tip.x,tip.y);
      c.strokeStyle='rgba(119,137,117,.14)';c.lineWidth=.55;c.stroke();
    }
  }
  function face(){
    for(const side of [-1,1]){
      // Curved operculum, nostril, and fine crease beside the cheek.
      let a=p(.182,side*.71),b=p(.258,side*.81),mid=p(.225,side*.54);
      c.beginPath();c.moveTo(a.x,a.y);c.quadraticCurveTo(mid.x,mid.y,b.x,b.y);
      c.lineWidth=Math.max(.56,L*.00245);c.strokeStyle='rgba(81,91,79,.29)';c.stroke();
      const gill=p(.235,side*.89);
      c.beginPath();c.moveTo(gill.x,gill.y);
      let g2=p(.261,side*.78);
      c.quadraticCurveTo(gill.x+gill.nx*side*L*.006,gill.y+gill.ny*side*L*.006,g2.x,g2.y);
      c.strokeStyle='rgba(255,255,241,.27)';c.lineWidth=Math.max(.48,L*.0018);c.stroke();
      const eye=p(.097,side*.81),r=L*.0104;
      c.beginPath();c.arc(eye.x,eye.y,r*1.48,0,TAU);c.fillStyle='rgba(137,110,82,.34)';c.fill();
      c.beginPath();c.arc(eye.x,eye.y,r*1.06,0,TAU);c.fillStyle='#28372c';c.fill();
      c.beginPath();c.arc(eye.x,eye.y,r*.73,0,TAU);c.fillStyle='#111d1c';c.fill();
      c.beginPath();c.arc(eye.x-r*.27,eye.y-r*.28,r*.27,0,TAU);c.fillStyle='rgba(255,255,240,.97)';c.fill();
      let nostril=p(.046,side*.33);
      c.beginPath();c.ellipse(nostril.x,nostril.y,L*.0034,L*.0024,fish.heading,0,TAU);
      c.fillStyle='rgba(72,84,69,.48)';c.fill();
      // Paired barbels extend from the corners of the mouth, not the eye.
      const whisk=p(.022,side*.52),a0=fish.heading;
      const end={x:whisk.x+whisk.nx*side*L*.052-Math.cos(a0)*L*.004,
        y:whisk.y+whisk.ny*side*L*.052-Math.sin(a0)*L*.004};
      c.beginPath();c.moveTo(whisk.x,whisk.y);
      c.quadraticCurveTo(whisk.x+whisk.nx*side*L*.028,whisk.y+whisk.ny*side*L*.028,end.x,end.y);
      c.lineWidth=Math.max(.52,L*.0023);c.strokeStyle='rgba(245,241,217,.82)';c.lineCap='round';c.stroke();
    }
    const m=p(.007,0),mouthPulse=.7+.3*Math.sin(fish.finPhase*.65);
    c.beginPath();c.ellipse(m.x,m.y,L*.0085*mouthPulse,L*.014,fish.heading,0,TAU);
    c.fillStyle='rgba(101,75,68,.26)';c.fill();
    c.lineWidth=Math.max(.4,L*.0014);c.strokeStyle='rgba(245,237,218,.45)';c.stroke();
    // Cheek highlights are thin, asymmetric and shift with the moving surface.
    for(const side of [-1,1]){
      const q=p(.133,side*.42),b=p(.178,side*.64);
      c.beginPath();c.moveTo(q.x,q.y);c.quadraticCurveTo((q.x+b.x)*.5,(q.y+b.y)*.5,b.x,b.y);
      c.lineWidth=Math.max(.6,L*.0038);c.strokeStyle='rgba(255,255,240,.19)';c.stroke();
    }
  }
  function drawShadow(){
    // The shadow is diffuse and displaced to imply a fish below the surface.
    c.save();c.translate(L*.046,L*.075);
    traceBody();c.fillStyle='rgba(0,10,11,.027)';
    c.shadowColor='rgba(0,11,13,.31)';c.shadowBlur=L*.095;c.fill();
    c.restore();
  }
  function drawKoi(){
    drawShadow();
    tailFin();
    for(const side of [-1,1]){
      fin(side,.70,fish.finPhase*.76+side*1.1,.77);
      fin(side,.257,fish.finPhase+side*.80,1);
    }
    koiBody();drawDorsal();face();
    // Tiny shifting highlights read as curved moist scales, not a metallic sheen.
    c.save();c.globalCompositeOperation='screen';
    for(let j=0;j<30;j++){
      const u=.23+((j*19)%33)*.019,v=.74*Math.sin(j*12.89),q=p(u,v);
      const alpha=.025+.06*Math.max(0,Math.sin(j*7.5+now*.49));
      c.beginPath();c.ellipse(q.x,q.y,L*.0045,L*.0012,fish.heading,0,TAU);
      c.fillStyle=`rgba(255,251,227,${alpha})`;c.fill();
    }
    c.restore();
  }
  function drawWakes(dt){
    for(let i=wakes.length-1;i>=0;i--){
      const w=wakes[i];w.age+=dt;
      if(w.age>=w.life){wakes.splice(i,1);continue;}
      const u=w.age/w.life;
      const rad=w.r+u*L*.19;
      // Caudal impulse opens into a bowed, soft pair of surface arcs.
      for(let j=0;j<2;j++){
        c.beginPath();c.ellipse(w.x,w.y,rad+j*L*.018,(rad+j*L*.018)*.79,w.angle,0,TAU);
        c.lineWidth=.72+j*.20;
        c.strokeStyle=`rgba(177,226,204,${(1-u)**2*w.power*(j===0?.19:.095)})`;
        c.stroke();
      }
    }
  }
  function drawTargetRipple(dt){
    if(!target)return;
    if(target.waveAge===undefined)target.waveAge=0;
    target.waveAge+=dt;
    const u=target.waveAge;
    for(let j=0;j<3;j++){
      const age=u-j*.24;
      if(age<0||age>2.9)continue;
      const r=6+age*(20+j*4),alpha=(1-age/2.9)**2*.29;
      c.beginPath();c.ellipse(target.x,target.y,r,r*.90,0,0,TAU);
      c.lineWidth=.9;
      c.strokeStyle=`rgba(207,240,214,${alpha})`;c.stroke();
    }
  }
  function render(dt){
    drawWater(now);
    // Suspended, differentially drifting micro-particles give distance and depth.
    for(const pt of particles){
      const x=(pt.x + Math.sin(now*.13+pt.phase)*pt.depth*6+W)%W;
      const y=(pt.y + Math.cos(now*.11+pt.phase)*pt.depth*5+H)%H;
      c.beginPath();c.arc(x,y,pt.r,0,TAU);
      c.fillStyle=`rgba(218,229,192,${pt.depth*.10})`;c.fill();
    }
    drawTargetRipple(dt);
    drawWakes(dt);
    // Reflected sky is refracted around the fish, without covering its markings.
    const q=fish.nose;
    const shine=c.createRadialGradient(q.x-L*.13,q.y-L*.17,0,q.x,q.y,L*.90);
    shine.addColorStop(0,'rgba(166,213,181,.043)');shine.addColorStop(1,'rgba(166,213,181,0)');
    c.fillStyle=shine;c.fillRect(q.x-L,q.y-L,L*2,L*2);
    drawKoi();
  }
  function frame(ts){
    const dt=paused?0:Math.min(.035,(ts-last)/1000||.016);last=ts;
    if(dt){now+=dt;swim(dt);}
    render(dt);requestAnimationFrame(frame);
  }
  const pauseButton=document.getElementById('pause'),chrome=document.getElementById('chrome');
  function togglePause(){paused=!paused;pauseButton.setAttribute('aria-pressed',String(paused));pauseButton.setAttribute('aria-label',paused?'Resume animation':'Pause animation');}
  function toggleChrome(){hidden=!hidden;chrome.classList.toggle('is-hidden',hidden);chrome.style.pointerEvents=hidden?'none':'';}
  pauseButton.addEventListener('click',togglePause);
  document.getElementById('hide').addEventListener('click',toggleChrome);
  cvs.addEventListener('pointerdown',e=>{
    if(hidden){toggleChrome();return;}
    const rimX=Math.min(L*.24+26,W*.27),rimY=Math.min(L*.24+26,H*.24);
    target={x:clamp(e.clientX,rimX,W-rimX),y:clamp(e.clientY,rimY,H-rimY),
      mode:'seek',life:35,waveAge:0};
    fish.mode='seek';
  });
  window.addEventListener('keydown',e=>{
    if(e.target instanceof HTMLButtonElement&&(e.code==='Space'||e.code==='Enter'))return;
    if(e.code==='Space'){e.preventDefault();togglePause();}
    if(e.key.toLowerCase()==='h')toggleChrome();
  });
  window.addEventListener('resize',size,{passive:true});
  document.addEventListener('visibilitychange',()=>{last=performance.now();});
  if(reduced){paused=true;pauseButton.setAttribute('aria-pressed','true');pauseButton.setAttribute('aria-label','Resume animation');}
  size();
  window.__koiStudy={snapshot:()=>({x:fish.x,y:fish.y,heading:fish.heading,speed:fish.speed,energy:fish.energy,
      phase:fish.phase,head:{x:fish.nose.x,y:fish.nose.y},tail:{x:fish.tail.x,y:fish.tail.y},
      mode:fish.mode,target:target?{x:target.x,y:target.y,mode:target.mode}:null,
      fishCount:1,leafCount:0})};
  requestAnimationFrame(frame);
})();
</script>
</body>
