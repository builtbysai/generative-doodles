<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rumor of a Turn — №9131</title>
<!-- RUMOR-OF-A-TURN-9131 -->
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1d3a2f;}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* №9131 "Rumor of a Turn" — after Job Talle's Koi Farm.
   Visual reference: Koi Farm screenshots (github.com/jobtalle/Koi) + Hans's top-down koi photo.
   - Smooth torpedo body, SINGLE fan tail (not forked), translucent pectoral fans
   - Ogon pale-gold with red head patch, subtle scale arcs, soft shadow beneath
   - Green-teal pond water, caustic light shimmer, sandy mottling
   - M3 turn contagion, M4 pulse-glide, M5 vertebra-chain swim (from the code study) */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W=0, H=0, DPR=1;
const bg = document.createElement('canvas'), bctx = bg.getContext('2d');
let caustics = [];

function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  bg.width = W*DPR; bg.height = H*DPR;
  bctx.setTransform(DPR,0,0,DPR,0,0);
  paintBackground();
  caustics = [];
  for (let i=0;i<26;i++) caustics.push({
    x: Math.random()*W, y: Math.random()*H,
    r: 30+Math.random()*70, ph: Math.random()*6.28, sp: .3+Math.random()*.5
  });
}
window.addEventListener('resize', resize);

/* ---------- pond background: green-teal water, sand mottling, vignette ---------- */
function paintBackground(){
  const g = bctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#2e5d4b'); g.addColorStop(.5,'#274e3f'); g.addColorStop(1,'#1e3d31');
  bctx.fillStyle = g; bctx.fillRect(0,0,W,H);
  for (let i=0;i<340;i++){
    const x=Math.random()*W, y=Math.random()*H, r=8+Math.random()*46;
    const gg=bctx.createRadialGradient(x,y,0,x,y,r);
    const warm = Math.random()<.5;
    gg.addColorStop(0, warm?'rgba(196,178,132,0.10)':'rgba(20,40,32,0.12)');
    gg.addColorStop(1,'rgba(0,0,0,0)');
    bctx.fillStyle=gg; bctx.beginPath(); bctx.arc(x,y,r,0,6.29); bctx.fill();
  }
  const v=bctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(8,18,14,0.42)');
  bctx.fillStyle=v; bctx.fillRect(0,0,W,H);
}

/* ---------- fish ---------- */
const N_FISH = 12;
const N_VERT = 14;
const fishes = [];
let attractR = 120; const followChance = 0.03, turnCarry = 0.95;

function spawnFish(){
  const s = Math.min(W,H);
  const cx = W/2 + (Math.random()-.5)*s*.45, cy = H/2 + (Math.random()-.5)*s*.45;
  const a = Math.random()*6.28;
  const len = s*(0.085+Math.random()*0.03);
  const f = {
    x:cx, y:cy, a, len, size: len/70,
    verts: [], phase: Math.random()*6.28,
    speed: 26+Math.random()*20, turn: 0, turnT: 0,
    boostT: 0,
    gold: .82+Math.random()*.18,
    patch: Math.random()<.8,
  };
  for (let v=0;v<N_VERT;v++) f.verts.push({x:cx - Math.cos(a)*v*(len/N_VERT), y:cy - Math.sin(a)*v*(len/N_VERT)});
  return f;
}

function bodyHalfWidth(t, len){
  const base = len*0.115;
  const snout = Math.min(1, t/0.10)*0.55+0.45; // blunt rounded head, not pointed
  const prof = Math.sin(Math.PI*(1-Math.pow(t,1.35)*0.92));
  return base*Math.max(0.10, snout*Math.max(0.12,prof));
}

function stepFish(f, dt){
  const decay = Math.pow(0.996, dt*60);
  let target = 15;
  if (f.boostT > 0){ f.boostT -= dt; target = 150*f.size+40; }
  else if (Math.random() < 0.004*dt*60){ f.boostT = .3+Math.random()*.9; spawnRipple(f.x, f.y, f.len*.5); }
  f.speed += (target - f.speed)*(1-decay);
  f.speed = Math.min(f.speed, 165);
  if (f.turnT > 0){ f.turnT -= dt; } else { f.turn = 0; if (Math.random() < 0.0016*dt*60){ f.turn = (Math.random()<.5?-1:1)*1.6; f.turnT = .5+Math.random()*.7; } }
  f.a += f.turn*dt*(0.6 + f.speed/120);
  const m = f.len*1.2;
  if (f.x < m || f.x > W-m || f.y < m || f.y > H-m){
    const ta = Math.atan2(H/2 - f.y, W/2 - f.x);
    let d = ta - f.a; while(d>Math.PI)d-=6.283; while(d<-Math.PI)d+=6.283;
    f.a += Math.max(-2.4*dt, Math.min(2.4*dt, d*2*dt));
  }
  const sp = f.speed*dt;
  f.x += Math.cos(f.a)*sp; f.y += Math.sin(f.a)*sp;
  const spacing = f.len/N_VERT;
  f.verts[0].x = f.x; f.verts[0].y = f.y;
  f.phase += dt*(5.2*f.speed/70 + 1.2);
  const amp = f.len*0.075*(0.5+f.speed/160);
  for (let v=1;v<N_VERT;v++){
    const p=f.verts[v-1], c=f.verts[v];
    const dx=c.x-p.x, dy=c.y-p.y;
    const d=Math.hypot(dx,dy)||1e-4;
    c.x = p.x + dx/d*spacing; c.y = p.y + dy/d*spacing;
    const wv = Math.sin(f.phase - v*0.62)*amp*(v/N_VERT);
    const nx = -(c.y-p.y)/d, ny=(c.x-p.x)/d;
    c.x += nx*wv*dt*8; c.y += ny*wv*dt*8;
  }
}

function interact(dt){
  for (let i=0;i<fishes.length;i++) for (let j=i+1;j<fishes.length;j++){
    const a=fishes[i], b=fishes[j];
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
    if (d < attractR && d > 1){
      const push = (attractR*0.35 - d);
      if (push > 0){ const px=dx/d*push*dt*3, py=dy/d*push*dt*3; a.x-=px; a.y-=py; b.x+=px; b.y+=py; }
      const turner = Math.abs(a.turn)>0.3 ? a : (Math.abs(b.turn)>0.3 ? b : null);
      const other = turner===a?b:(turner===b?a:null);
      if (turner && other && Math.abs(other.turn)<0.3 && Math.random()<followChance*dt*60){
        other.turn = turner.turn*turnCarry;
        other.turnT = .4+Math.random()*.5;
      }
      const avg=(a.speed+b.speed)/2;
      a.speed += (avg-a.speed)*0.02; b.speed += (avg-b.speed)*0.02;
    }
  }
}

/* ---------- ripples: faint, on startle only ---------- */
const ripples=[];
function spawnRipple(x,y,r){
  if (ripples.length>26) ripples.shift();
  ripples.push({x,y,r: r*0.4, max: r*2.6, a: .30});
}
function stepRipples(dt){
  for (let i=ripples.length-1;i>=0;i--){
    const r=ripples[i]; r.r += dt*46; r.a -= dt*0.34;
    if (r.a<=0 || r.r>r.max) ripples.splice(i,1);
  }
}

/* ---------- drawing ---------- */
function drawFish(f){
  const v=f.verts, n=v.length;
  // soft shadow beneath, offset down-right (as in the photo)
  ctx.save();
  ctx.translate(f.len*0.04, f.len*0.07);
  ctx.fillStyle='rgba(10,22,17,0.20)';
  ctx.beginPath();
  const hw0=bodyHalfWidth(0,f.len);
  ctx.ellipse(v[3].x, v[3].y, f.len*.48, hw0*1.7, Math.atan2(v[6].y-v[0].y, v[6].x-v[0].x), 0, 6.29);
  ctx.fill();
  ctx.restore();

  const L=[], R=[];
  for (let i=0;i<n;i++){
    const p=v[Math.max(0,i-1)], c=v[i], q=v[Math.min(n-1,i+1)];
    let tx=q.x-p.x, ty=q.y-p.y; const d=Math.hypot(tx,ty)||1e-4; tx/=d; ty/=d;
    const w=bodyHalfWidth(i/(n-1), f.len);
    L.push([c.x-ty*w, c.y+tx*w]); R.push([c.x+ty*w, c.y-tx*w]);
  }
  const g0=Math.round(212*f.gold+30), g1=Math.round(160*f.gold+22);
  const grad = ctx.createLinearGradient(L[2][0],L[2][1],R[2][0],R[2][1]);
  grad.addColorStop(0, `rgb(${g0-38},${g1-30},${Math.round(g1*0.52)})`);
  grad.addColorStop(.5, `rgb(${g0},${Math.round(g1+18)},${Math.round(g1*0.62)})`);
  grad.addColorStop(1, `rgb(${g0-38},${g1-30},${Math.round(g1*0.52)})`);
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.moveTo(L[0][0],L[0][1]);
  for (let i=1;i<n;i++) ctx.lineTo(L[i][0],L[i][1]);
  for (let i=n-1;i>=0;i--) ctx.lineTo(R[i][0],R[i][1]);
  ctx.closePath(); ctx.fill();

  // red head patch (ogon with hi, like the reference photo)
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(L[0][0],L[0][1]);
  for (let i=1;i<n;i++) ctx.lineTo(L[i][0],L[i][1]);
  for (let i=n-1;i>=0;i--) ctx.lineTo(R[i][0],R[i][1]);
  ctx.closePath(); ctx.clip();
  if (f.patch){
    const hx=v[1].x, hy=v[1].y;
    const pg=ctx.createRadialGradient(hx,hy,0,hx,hy,f.len*.20);
    pg.addColorStop(0,'rgba(206,72,38,0.9)');
    pg.addColorStop(.7,'rgba(206,72,38,0.55)');
    pg.addColorStop(1,'rgba(206,72,38,0)');
    ctx.fillStyle=pg;
    ctx.beginPath(); ctx.arc(hx,hy,f.len*.20,0,6.29); ctx.fill();
  }
  // subtle scale arcs
  ctx.strokeStyle='rgba(120,86,40,0.09)'; ctx.lineWidth=1;
  for (let rI=0;rI<5;rI++){
    const t0=0.12+rI*0.13;
    for (let k=0;k<7;k++){
      const t=t0+k*0.018;
      const idx=Math.min(n-2,Math.floor(t*(n-1)));
      const w=bodyHalfWidth(t,f.len);
      const cxp=(L[idx][0]+R[idx][0])/2, cyp=(L[idx][1]+R[idx][1])/2;
      ctx.beginPath(); ctx.arc(cxp,cyp,w*0.55,0.4,2.7); ctx.stroke();
    }
  }
  ctx.restore();
  // body edge
  ctx.strokeStyle='rgba(96,64,28,0.35)'; ctx.lineWidth=1.1;
  ctx.beginPath();
  ctx.moveTo(L[0][0],L[0][1]);
  for (let i=1;i<n;i++) ctx.lineTo(L[i][0],L[i][1]);
  for (let i=n-1;i>=0;i--) ctx.lineTo(R[i][0],R[i][1]);
  ctx.closePath(); ctx.stroke();

  // SINGLE fan tail (photo: one triangle, not forked)
  const te=v[n-1], te2=v[n-3];
  let tdx=te.x-te2.x, tdy=te.y-te2.y; const tdl=Math.hypot(tdx,tdy)||1e-4; tdx/=tdl; tdy/=tdl;
  const tailLen=f.len*0.30, tailW=f.len*0.22;
  const tipX=te.x+tdx*tailLen, tipY=te.y+tdy*tailLen;
  const tg=ctx.createLinearGradient(te.x,te.y,tipX,tipY);
  tg.addColorStop(0,`rgba(${g0},${g1},${Math.round(g1*0.6)},0.9)`);
  tg.addColorStop(1,`rgba(${g0},${g1},${Math.round(g1*0.6)},0.35)`);
  ctx.fillStyle=tg;
  ctx.beginPath();
  ctx.moveTo(te.x-tdy*tailW*.30, te.y+tdx*tailW*.30);
  ctx.quadraticCurveTo(te.x+tdx*tailLen*.55-tdy*tailW*.62, te.y+tdy*tailLen*.55+tdx*tailW*.62,
                        tipX-tdy*tailW*.34, tipY+tdx*tailW*.34);
  ctx.quadraticCurveTo(tipX+tdx*tailLen*.18, tipY+tdy*tailLen*.18,
                        tipX+tdy*tailW*.34, tipY-tdx*tailW*.34);
  ctx.quadraticCurveTo(te.x+tdx*tailLen*.55+tdy*tailW*.62, te.y+tdy*tailLen*.55-tdx*tailW*.62,
                        te.x+tdy*tailW*.30, te.y-tdx*tailW*.30);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(110,76,34,0.18)'; ctx.lineWidth=1;
  for (let rI=-1;rI<=1;rI++){
    ctx.beginPath();
    ctx.moveTo(te.x+tdx*tailLen*.25, te.y+tdy*tailLen*.25);
    ctx.lineTo(tipX+tdy*tailW*.3*rI, tipY-tdx*tailW*.3*rI);
    ctx.stroke();
  }

  // pectoral fins: translucent fans behind the head
  const hp=v[2];
  let hdx=v[3].x-v[1].x, hdy=v[3].y-v[1].y; const hdl=Math.hypot(hdx,hdy)||1e-4; hdx/=hdl; hdy/=hdl;
  const finLen=f.len*0.13;
  const flutter=Math.sin(f.phase*1.7)*0.12;
  for (const side of [-1,1]){
    const baseA=Math.atan2(hdy,hdx)+side*(0.85+flutter);
    const fx=hp.x-hdy*side*bodyHalfWidth(0.14,f.len)*.9;
    const fy=hp.y+hdx*side*bodyHalfWidth(0.14,f.len)*.9;
    const ftx=fx+Math.cos(baseA)*finLen, fty=fy+Math.sin(baseA)*finLen;
    ctx.fillStyle='rgba(226,196,130,0.30)';
    ctx.beginPath();
    ctx.moveTo(fx,fy);
    ctx.quadraticCurveTo(fx+Math.cos(baseA-.5)*finLen*.7, fy+Math.sin(baseA-.5)*finLen*.7, ftx, fty);
    ctx.quadraticCurveTo(fx+Math.cos(baseA+.5)*finLen*.7, fy+Math.sin(baseA+.5)*finLen*.7, fx, fy);
    ctx.closePath(); ctx.fill();
  }
  // eyes
  const ex=v[1].x, ey=v[1].y;
  let edx=v[2].x-v[0].x, edy=v[2].y-v[0].y; const edl=Math.hypot(edx,edy)||1e-4; edx/=edl; edy/=edl;
  const ew=bodyHalfWidth(0.07,f.len)*.62, er=Math.max(1.6,f.len*0.022);
  for (const side of [-1,1]){
    ctx.fillStyle='#1c1410';
    ctx.beginPath();
    ctx.arc(ex+edx*f.len*.015-edy*side*ew, ey+edy*f.len*.015+edx*side*ew, er, 0, 6.29);
    ctx.fill();
  }
}

let lastT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000||0.016); lastT=now;
  ctx.drawImage(bg,0,0,W,H);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for (const c of caustics){
    c.ph += dt*c.sp;
    const r=c.r*(1+0.12*Math.sin(c.ph*2));
    const g=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,r);
    g.addColorStop(0,`rgba(210,235,200,${0.05+0.028*Math.sin(c.ph)})`);
    g.addColorStop(1,'rgba(210,235,200,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(c.x,c.y,r,0,6.29); ctx.fill();
  }
  ctx.restore();
  interact(dt);
  for (const f of fishes) stepFish(f,dt);
  stepRipples(dt);
  for (const r of ripples){
    ctx.strokeStyle=`rgba(220,240,225,${r.a})`; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.ellipse(r.x,r.y,r.r,r.r*.72,0.4,0,6.29); ctx.stroke();
  }
  for (const f of fishes) drawFish(f);
  requestAnimationFrame(frame);
}

cv.addEventListener('pointerdown', e=>{
  let best=null, bd=1e9;
  for (const f of fishes){
    const d=Math.hypot(f.x-e.clientX, f.y-e.clientY);
    if (d<bd){bd=d;best=f;}
  }
  if (best && bd < Math.min(W,H)*.5){
    const away=Math.atan2(best.y-e.clientY, best.x-e.clientX);
    best.turn = (away>best.a?1:-1)*2.4; best.turnT=.6;
    best.boostT=1.1; best.speed=150;
    spawnRipple(best.x,best.y,best.len*.7);
    if (Math.random()<.4) for (const f of fishes){
      if (f!==best && Math.hypot(f.x-best.x,f.y-best.y)<attractR && Math.abs(f.turn)<0.3){
        f.turn=best.turn*turnCarry; f.turnT=.5;
      }
    }
  }
});

function init(){
  resize();
  attractR = Math.max(90, Math.min(150, Math.min(W,H)*0.20));
  fishes.length=0;
  for (let i=0;i<N_FISH;i++) fishes.push(spawnFish());
  requestAnimationFrame(frame);
}
init();

window.__koi={
  fishes, ripples,
  step(sec){ const n=Math.round(sec*60); for(let k=0;k<n;k++){ interact(1/60); for(const f of fishes) stepFish(f,1/60); stepRipples(1/60);} },
  tap(x,y){ cv.dispatchEvent(new PointerEvent('pointerdown',{clientX:x,clientY:y,bubbles:true})); },
  turning(){ return fishes.filter(f=>Math.abs(f.turn)>0.3).length; },
  state(){ return fishes.map(f=>({x:Math.round(f.x),y:Math.round(f.y),s:Math.round(f.speed)})); }
};
</script>
</body>
</html>
