<script>

  function populate(){

  const easeAngle=(from,to)=>Math.atan2(Math.sin(to-from),Math.cos(to-from));

    const cycle=(now*.47+f.id*.27)%1;

    f.y+=Math.sin(f.a)*f.speed*dt;

  }
  const widthKeys=[[0,.017],[.03,.072],[.09,.113],[.17,.146],[.27,.177],[.38,.182],[.49,.168],[.61,.142],[.74,.103],[.85,.060],[.94,.032],[1,.025]];

  function move(c,p){c.moveTo(p[0],p[1]);}
  function line(c,p){c.lineTo(p[0],p[1]);}
  function bodyPath(c,f){
    c.beginPath();move(c,point(f,0,0));
    for(let i=1;i<=56;i++)line(c,point(f,i/56,1));
    for(let i=56;i>=0;i--)line(c,point(f,i/56,-1));c.closePath();

  function paintFin(f,side,u,spread,length,phase,alpha=1){

        if(Math.abs(v)>.94)continue;
        const p=point(f,u,v), a=point(f,u+.018,v+.060), b=point(f,u+.018,v-.060);
        ctx.beginPath();move(ctx,a);ctx.quadraticCurveTo(p[0]-L*.001,p[1],b[0],b[1]);
        ctx.strokeStyle=(i+j)%6===0?'rgba(255,251,223,.18)':'rgba(39,60,52,.105)';ctx.stroke();
      }
    }
    for(let i=0;i<22;i++){
      let u=.26+((i*17)%31)*.019, v=Math.sin(i*23.7)*.73,p=point(f,u,v);
      ctx.fillStyle=`rgba(255,252,220,${.10+.13*(.5+.5*Math.sin(now*1.1+i*7))})`;
      ctx.beginPath();ctx.ellipse(p[0],p[1],L*.006,L*.002,-.25,0,TAU);ctx.fill();
    }
  }
  function drawFace(f){
    const L=f.L;
    // Gill plates are defined by thin, receding arcs, not cartoon outlines.
    for(const side of [-1,1]){
      const p=point(f,.206,side*.83), mid=point(f,.243,side*.64), end=point(f,.269,side*.88);
      ctx.beginPath();move(ctx,p);ctx.quadraticCurveTo(mid[0]+L*.009,mid[1],end[0],end[1]);
      ctx.strokeStyle=f.kind==='gold'?'rgba(106,78,45,.22)':'rgba(92,93,82,.21)';ctx.lineWidth=L*.003;ctx.stroke();
      const eye=point(f,.104,side*.81);const r=L*.0124;
      ctx.beginPath();ctx.arc(eye[0],eye[1],r*1.35,0,TAU);ctx.fillStyle='rgba(112,81,55,.29)';ctx.fill();
      ctx.beginPath();ctx.arc(eye[0],eye[1],r,0,TAU);ctx.fillStyle='#192522';ctx.fill();
      ctx.beginPath();ctx.arc(eye[0]-r*.29,eye[1]-r*.29,r*.28,0,TAU);ctx.fillStyle='rgba(255,249,227,.93)';ctx.fill();
      const jaw=point(f,.022,side*.40);
      ctx.beginPath();move(ctx,jaw);ctx.quadraticCurveTo(jaw[0]+L*.024,jaw[1]+side*L*.022,jaw[0]+L*.003,jaw[1]+side*L*.043);
      ctx.strokeStyle=f.kind==='gold'?'rgba(216,170,96,.64)':'rgba(240,229,204,.72)';ctx.lineWidth=L*.0031;ctx.stroke();
    }
    const mouth=point(f,.010,0);
    ctx.beginPath();ctx.ellipse(mouth[0],mouth[1],L*.008,L*.020,Math.PI/2,0,TAU);
    ctx.fillStyle='rgba(127,89,73,.24)';ctx.fill();
    // The ridge of the dorsal fin catches light just aft of the shoulders.
    ctx.beginPath();for(let i=0;i<=18;i++){
      const u=mix(.40,.73,i/18),p=point(f,u,-.018);
      i?line(ctx,p):move(ctx,p);
    }
    ctx.strokeStyle='rgba(255,246,218,.35)';ctx.lineWidth=L*.009;ctx.lineCap='round';ctx.stroke();
    ctx.strokeStyle='rgba(48,64,56,.24)';ctx.lineWidth=L*.0025;ctx.stroke();
  }
  function drawFish(f){
    const L=f.L;
    ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.a);
    // Soft bottom shadow separates the living fish from the pond.
    ctx.save();ctx.translate(-L*.48,L*.084);ctx.scale(1,.42);
    ctx.beginPath();ctx.ellipse(0,0,L*.61,L*.34,0,0,TAU);
    ctx.fillStyle=gradient(ctx,0,0,L*.58,[[0,'rgba(0,14,19,.30)'],[.46,'rgba(0,14,19,.19)'],[1,'rgba(0,14,19,0)']]);
    ctx.fill();ctx.restore();
    tailFin(f);
    for(const side of [-1,1]){
      paintFin(f,side,.68,.131,.14,f.finPhase*.74+side,.66);
      paintFin(f,side,.25,.245,.225,f.finPhase+side*1.1,1);
    }
    bodyPath(ctx,f);
    const body=ctx.createLinearGradient(0,-L*.17,0,L*.18);
    if(f.kind==='gold') {
      body.addColorStop(0,'#9b6628');body.addColorStop(.16,'#deab4c');body.addColorStop(.48,'#f5dc8e');body.addColorStop(.75,'#d4a04a');body.addColorStop(1,'#895e2e');
    } else {
      body.addColorStop(0,'#acae9e');body.addColorStop(.14,'#e3e3d3');body.addColorStop(.43,'#fff8e8');body.addColorStop(.64,'#f8f1df');body.addColorStop(.84,'#d4d6c7');body.addColorStop(1,'#9ea99d');
    }
    ctx.fillStyle=body;ctx.fill();
    ctx.save();bodyPath(ctx,f);ctx.clip();
    koiMarkings(f);
    // A faint lengthwise glow rounds the body without flattening its pattern.
    ribbon(ctx,f,.09,.93,.17,f.kind==='gold'?'rgba(255,238,171,.12)':'rgba(255,255,247,.15)');
    drawScales(f);
    const shine=ctx.createLinearGradient(0,-L*.07,0,L*.09);
    shine.addColorStop(0,'rgba(255,255,255,0)');shine.addColorStop(.37,'rgba(255,255,255,.10)');shine.addColorStop(.55,'rgba(255,255,255,.07)');shine.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=shine;ctx.fillRect(-L,-L*.2,L*1.1,L*.4);
    ctx.restore();
    bodyPath(ctx,f);ctx.strokeStyle='rgba(255,245,221,.22)';ctx.lineWidth=Math.max(.55,L*.002);ctx.stroke();
    drawFace(f);
    ctx.restore();
  }
  function drawLeaf(l,t){
    const r=l.r,drift=Math.sin(t*.4+l.float)*1.4;
    ctx.save();ctx.translate(l.x,l.y+drift);ctx.rotate(l.angle);
    ctx.beginPath();ctx.ellipse(r*.08,r*.18,r*.98,r*.94,0,0,TAU);
    ctx.fillStyle='rgba(0,15,20,.16)';ctx.fill();
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.arc(0,0,r,0,TAU-.28,false);ctx.closePath();
    const fill=ctx.createRadialGradient(-r*.25,-r*.3,r*.09,0,0,r*1.1);
    fill.addColorStop(0,l.hue>.5?'#416c58':'#3b6650');fill.addColorStop(.7,l.hue>.5?'#2b5947':'#2d5d49');fill.addColorStop(1,'#1b453c');
    ctx.fillStyle=fill;ctx.fill();
    ctx.strokeStyle='rgba(167,190,138,.20)';ctx.lineWidth=1;ctx.stroke();
    ctx.lineWidth=.7;
    for(let a=.18;a<TAU-.42;a+=.33){
      ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(Math.cos(a)*r*.35,Math.sin(a)*r*.32,Math.cos(a)*r*.83,Math.sin(a)*r*.83);
      ctx.strokeStyle='rgba(185,194,146,.115)';ctx.stroke();
    }
    ctx.restore();
  }
  function drawWater(t){
    ctx.drawImage(background,0,0,W,H);
    // Slow, refracted bands of light, intentionally quiet so the fish remain the focus.
    ctx.save();ctx.globalCompositeOperation='screen';
    const spacing=Math.max(41,Math.min(W,H)*.067);
    for(let k=-2;k<Math.ceil(H/spacing)+2;k++){
      let y=k*spacing+Math.sin(t*.19+k*1.27)*9;
      ctx.beginPath();
      for(let x=-30;x<W+40;x+=18){
        let yy=y+Math.sin(x*.009+t*.3+k*.8)*8+Math.sin(x*.018-t*.2+k*.77)*3;
        x===-30?ctx.moveTo(x,yy):ctx.lineTo(x,yy);
      }
      ctx.strokeStyle=`rgba(163,205,174,${.028+.013*Math.sin(k*2.3+t*.45)})`;
      ctx.lineWidth=1.1;ctx.stroke();
    }
    // broad overhead light dances through the upper water column
    const beam=ctx.createLinearGradient(0,0,W,H);
    beam.addColorStop(0,'rgba(100,181,157,0)');beam.addColorStop(.44,'rgba(140,193,157,.032)');beam.addColorStop(.56,'rgba(140,193,157,0)');beam.addColorStop(1,'rgba(100,181,157,0)');
    ctx.translate(Math.sin(t*.15)*35,0);ctx.fillStyle=beam;ctx.fillRect(-40,0,W+80,H);
    ctx.restore();
    for(const l of leaves)drawLeaf(l,t);
    for(const m of motes){
      const x=(m.x+Math.sin(t*.17+m.phase)*m.depth*9+W)%W;
      const y=(m.y+Math.cos(t*.13+m.phase)*m.depth*7+H)%H;
      ctx.beginPath();ctx.arc(x,y,m.r,0,TAU);ctx.fillStyle=`rgba(226,235,188,${m.a*.35})`;ctx.fill();
    }
  }
  function makeRipple(x,y,intensity=.8){ if(ripples.length>35)ripples.shift();ripples.push({x,y,age:0,size:rr(4,13),life:rr(3.3,5.2),intensity}); }
  function drawRipples(dt){
    for(let i=ripples.length-1;i>=0;i--){
      const r=ripples[i];r.age+=dt;if(r.age>=r.life){ripples.splice(i,1);continue;}
      const p=r.age/r.life, radius=r.size+r.age*(17+12*r.intensity);
      for(let j=0;j<2;j++){
        ctx.beginPath();ctx.ellipse(r.x,r.y,radius+j*6,radius*.74+j*5,0,0,TAU);
        ctx.lineWidth=1.15-j*.25;
        ctx.strokeStyle=`rgba(190,232,206,${(1-p)*(1-p)*(.27-j*.09)*r.intensity})`;
        ctx.stroke();
      }
    }
  }
  function frame(t){
    if(!W)return;
    const dt=paused?0:Math.min(.04,(t-last)/1000||.016);
    last=t;if(!paused)now+=dt;
    if(lure){lure.life-=dt;if(lure.life<=0)lure=null;}
    if(dt){for(const f of fish)steer(f,dt);}
    drawWater(now);
    if(dt&&now-lastWake>.48){
      for(const f of fish){const p=point(f,.98,0),a=f.a;let x=f.x+p[0]*Math.cos(a)-p[1]*Math.sin(a),y=f.y+p[0]*Math.sin(a)+p[1]*Math.cos(a);
        makeRipple(x,y,.28+f.tailEnergy*.13);
      }
      lastWake=now;
    }
    drawRipples(dt);
    for(const f of fish)drawFish(f);
    requestAnimationFrame(frame);
  }
  function reset(){seed=(seed+Math.floor(Math.random()*1e7)+1)>>>0;populate();}
  function togglePause(){paused=!paused;playButton.setAttribute('aria-pressed',String(paused));playButton.setAttribute('aria-label',paused?'Resume animation':'Pause animation');}
  function toggleUI(){uiHidden=!uiHidden;ui.classList.toggle('hidden',uiHidden);ui.style.pointerEvents=uiHidden?'none':'';}
  document.querySelector('#reset').addEventListener('click',reset);
  playButton.addEventListener('click',togglePause);
  document.querySelector('#hide').addEventListener('click',toggleUI);
  canvas.addEventListener('pointerdown',e=>{
    if(uiHidden){toggleUI();return;}
    if(paused)return;
    pointer={x:e.clientX,y:e.clientY};
    lure={x:e.clientX,y:e.clientY,life:6};
    makeRipple(e.clientX,e.clientY,1.4);
  });
  canvas.addEventListener('pointermove',e=>{
    if(e.buttons!==1||!pointer||paused)return;
    if(Math.hypot(e.clientX-pointer.x,e.clientY-pointer.y)>28){pointer.x=e.clientX;pointer.y=e.clientY;lure={x:e.clientX,y:e.clientY,life:5};makeRipple(e.clientX,e.clientY,.64);}
  });
  canvas.addEventListener('pointerup',()=>pointer=null);
  canvas.addEventListener('pointercancel',()=>pointer=null);
  addEventListener('keydown',e=>{
    if(e.target instanceof HTMLButtonElement&&(e.key===' '||e.key==='Enter'))return;
    if(e.code==='Space'){e.preventDefault();togglePause();}
    if(e.key.toLowerCase()==='r')reset();
    if(e.key.toLowerCase()==='h')toggleUI();
  });
  addEventListener('resize',size,{passive:true});
  document.addEventListener('visibilitychange',()=>{last=performance.now();});
  if(reduced){paused=true;playButton.setAttribute('aria-pressed','true');playButton.setAttribute('aria-label','Resume animation');}
  size();requestAnimationFrame(frame);
})();
</script>
</body>
