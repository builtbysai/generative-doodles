<!doctype html>

<title>Koi — No. 9131</title>
<style>

  button:hover { border-color:rgba(235,239,225,.68);background:rgba(235,239,225,.12); }

<body>
<canvas id="water" role="img" aria-label="Three lifelike red-and-white Kohaku koi float, roam, and wonder beneath a refractive emerald water surface over a deep river-stone pond bed. Tap or drag the water to invite the koi toward you."></canvas>
<div class="chrome" id="chrome">
  <header class="heading"><div class="stamp" aria-hidden="true"><span>鯉</span><span>水</span></div><div><div class="folio">9131 &nbsp;/&nbsp; STUDY IN MOTION</div><h1>Koi</h1></div></header>
  <div class="description">Tap or trace water to call the koi</div>
  <nav class="tools" aria-label="Artwork controls">
    <button id="pause" title="Pause / resume (Space)" aria-label="Pause animation" aria-pressed="false">
      <svg class="pause-symbol" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>
      <svg class="play-symbol" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></svg>
    </button>
    <button id="hide" title="Hide / show interface (H)" aria-label="Hide interface"><svg viewBox="0 0 24 24"><path d="M3 12s3.5-5.5 9-5.5 9 5.5 9 5.5-3.5 5.5-9 5.5S3 12 3 12Z"/><circle cx="12" cy="12" r="2.4"/></svg></button>
  </nav>
</div>
<noscript>JavaScript is required for this animated study.</noscript>
<script>
(() => {
  'use strict';
  const cvs = document.getElementById('water');
  const c = cvs.getContext('2d', { alpha: false });
  if (!c) return;

  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, x) => {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const angleDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
  const rseed = (n) => {
    let v = n >>> 0;
    return () => {
      v += 0x6D2B79F5;
      let t = v;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  const random = rseed(9131);

  // Spine discretization: 48 body vertebrae + 16 silky caudal veil nodes
  const N_BODY = 48;
  const N_TAIL = 16;
  const N_TOTAL = N_BODY + N_TAIL;

  let W = 0, H = 0, DPR = 1, L = 310;
  let waterCanvas = null, surfaceCanopyCanvas = null;
  let causticTileA = null, causticTileB = null;
  let particles = [], motes = [], wakes = [], ripples = [], bowTrails = [];
  let now = 0, last = 0, paused = false, hidden = false, pointerDown = false;
  let lastPointerX = 0, lastPointerY = 0;
  let target = null, fishes = [], fish = null;  // fish = current fish in loop
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Top-down anatomical half-width profile of a prize Kohaku carp (u in [0, 1])
  const widthProfile = [
    [0.000, 0.032], // Rounded snout tip
    [0.025, 0.064],
    [0.065, 0.096], // Head / eyes
    [0.125, 0.128], // Cheek / operculum
    [0.195, 0.150], // Gill cover flare
    [0.275, 0.162], // Broad muscular shoulder
    [0.365, 0.156], // Mid-body arch
    [0.470, 0.138],
    [0.580, 0.112],
    [0.690, 0.082],
    [0.790, 0.054],
    [0.880, 0.033], // Caudal peduncle taper
    [0.950, 0.022], // Narrowest peduncle waist
    [1.000, 0.026]  // Slight flare into caudal base
  ];

  function widthAt(u) {
    if (u <= 0) return widthProfile[0][1];
    if (u >= 1) return widthProfile[widthProfile.length - 1][1];
    for (let i = 0; i < widthProfile.length - 1; i++) {
      const a = widthProfile[i], b = widthProfile[i + 1];
      if (u <= b[0]) {
        return lerp(a[1], b[1], smooth(a[0], b[0], u));
      }
    }
    return 0.024;
  }

  // Authentic Sandan Kohaku + Maruten (crown) dorsal crimson markings
  const hiMarkings = [
    {
      uMin: 0.045, uMax: 0.165,
      left:  (t) => -0.58 * Math.sin(t * Math.PI) - 0.08 * Math.sin(t * TAU),
      right: (t) =>  0.62 * Math.sin(t * Math.PI) + 0.06 * Math.cos(t * TAU)
    },
    {
      uMin: 0.215, uMax: 0.435,
      left:  (t) => -0.82 * Math.pow(Math.sin(t * Math.PI), 0.7) + 0.12 * Math.sin(t * TAU * 1.5),
      right: (t) =>  0.92 * Math.pow(Math.sin(t * Math.PI), 0.65) + 0.08 * Math.cos(t * TAU)
    },
    {
      uMin: 0.475, uMax: 0.665,
      left:  (t) => -0.94 * Math.pow(Math.sin(t * Math.PI), 0.68) - 0.05 * Math.cos(t * TAU),
      right: (t) =>  0.68 * Math.pow(Math.sin(t * Math.PI), 0.75) + 0.14 * Math.sin(t * TAU)
    },
    {
      uMin: 0.720, uMax: 0.875,
      left:  (t) => -0.76 * Math.pow(Math.sin(t * Math.PI), 0.72),
      right: (t) =>  0.86 * Math.pow(Math.sin(t * Math.PI), 0.70)
    }
  ];

  // Pre-generate organic scale positions in body-space (u, v)
  const scaleNodes = [];
  for (let row = 0; row < 28; row++) {
    const u = 0.19 + (row / 27) * 0.74;
    const cols = Math.round(5 + 7 * Math.sin((u - 0.15) * 1.35));
    for (let col = -cols; col <= cols; col++) {
      const v = (col + (row % 2) * 0.5) / (cols + 0.8);
      if (Math.abs(v) > 0.92) continue;
      scaleNodes.push({ u, v, shimmerSeed: (row * 17 + col * 31) & 255 });
    }
  }

  // Generate seamlessly tileable optical caustic textures via forward ray-refraction splatting
  function buildCausticTiles() {
    const SIZE = 256;
    const RAYS = 384; // 384x384 refracted ray grid splatted into 256x256 accumulation buffer

    function createTile(seed, colorR, colorG, colorB) {
      const rng = rseed(seed);
      const modes = [];
      const pairs = [
        [1, 1], [2, -1], [1, -2], [3, 1], [-2, 3], [3, -2], [4, 1], [1, 4]
      ];
      for (let i = 0; i < pairs.length; i++) {
        const kx = pairs[i][0], ky = pairs[i][1];
        const kMag = Math.hypot(kx, ky);
        modes.push({
          kx: kx * TAU,
          ky: ky * TAU,
          amp: (0.022 / Math.pow(kMag, 1.15)) * (0.8 + 0.4 * rng()),
          phase: rng() * TAU
        });
      }

      const accum = new Float32Array(SIZE * SIZE);
      const refractDepth = 1.35;

      for (let ry = 0; ry < RAYS; ry++) {
        const v = ry / RAYS;
        for (let rx = 0; rx < RAYS; rx++) {
          const u = rx / RAYS;
          let gx = 0, gy = 0;
          for (let m = 0; m < modes.length; m++) {
            const md = modes[m];
            const ang = md.kx * u + md.ky * v + md.phase;
            const d = -Math.sin(ang) * md.amp;
            gx += d * md.kx;
            gy += d * md.ky;
          }
          // Refracted landing coordinate on pond bed (wrapped seamlessly to [0, SIZE))
          let px = ((u + gx * refractDepth) % 1 + 1) % 1 * SIZE;
          let py = ((v + gy * refractDepth) % 1 + 1) % 1 * SIZE;
          const x0 = Math.floor(px), y0 = Math.floor(py);
          const fx = px - x0, fy = py - y0;
          const x1 = (x0 + 1) & (SIZE - 1);
          const y1 = (y0 + 1) & (SIZE - 1);

          accum[y0 * SIZE + x0] += (1 - fx) * (1 - fy);
          accum[y0 * SIZE + x1] += fx * (1 - fy);
          accum[y1 * SIZE + x0] += (1 - fx) * fy;
          accum[y1 * SIZE + x1] += fx * fy;
        }
      }

      const mean = (RAYS * RAYS) / (SIZE * SIZE);
      const tile = document.createElement('canvas');
      tile.width = SIZE;
      tile.height = SIZE;
      const tctx = tile.getContext('2d');
      const img = tctx.createImageData(SIZE, SIZE);
      const data = img.data;

      for (let i = 0; i < SIZE * SIZE; i++) {
        const norm = accum[i] / mean;
        // Sharpen caustic cusps and suppress flat troughs
        const ridge = Math.max(0, norm - 0.78);
        const intensity = clamp(Math.pow(ridge * 0.82, 1.55), 0, 1);
        const idx = i * 4;
        data[idx]     = colorR;
        data[idx + 1] = colorG;
        data[idx + 2] = colorB;
        data[idx + 3] = Math.round(intensity * 255);
      }
      tctx.putImageData(img, 0, 0);
      return tile;
    }

    causticTileA = createTile(51923, 156, 228, 202);
    causticTileB = createTile(88417, 184, 240, 212);
  }

  // Ambient pond current field: slow, organic, curl-like water drift
  function sampleCurrent(x, y, t) {
    const nx = x / Math.max(1, W);
    const ny = y / Math.max(1, H);
    const a1 = Math.sin(ny * TAU * 1.15 + t * 0.09) + Math.cos(nx * TAU * 0.85 - t * 0.07);
    const a2 = Math.cos(nx * TAU * 1.10 + t * 0.08) - Math.sin(ny * TAU * 0.95 + t * 0.11);
    return {
      vx: a1 * L * 0.022,
      vy: a2 * L * 0.022
    };
  }

  function spawnMote(initial = false) {
    const pad = Math.min(W, H) * 0.14;
    return {
      x: pad + random() * Math.max(40, W - pad * 2),
      y: pad + random() * Math.max(40, H - pad * 2),
      vx: 0,
      vy: 0,
      r: 1.5 + random() * 1.6,
      phase: random() * TAU,
      hue: random() > 0.35 ? 'rgba(246, 236, 202,' : 'rgba(238, 198, 176,',
      age: initial ? random() * 14 : 0,
      life: 24 + random() * 22,
      inspected: false
    };
  }

  function pickRoamPoint(f, preferGentle = false) {
    const marginX = clamp(W * 0.16, 85, 200);
    const marginY = clamp(H * 0.16, 85, 190);
    const spanX = Math.max(80, W - marginX * 2);
    const spanY = Math.max(80, H - marginY * 2);
    let best = null, bestScore = -1e9;

    for (let k = 0; k < 20; k++) {
      const x = marginX + random() * spanX;
      const y = marginY + random() * spanY;
      const dx = x - f.x, dy = y - f.y;
      const dist = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);
      const turn = Math.abs(angleDiff(f.heading, angle));

      const idealDist = preferGentle
        ? Math.min(Math.max(W, H) * 0.36, L * 1.45)
        : Math.min(Math.max(W, H) * 0.52, L * 2.1);
      const distPenalty = Math.abs(dist - idealDist) * 0.38;
      const tooClose = dist < L * 0.65 ? -L * 1.8 : 0;
      const turnPref = preferGentle ? Math.abs(turn - 0.55) : Math.pow(turn, 1.3);
      const score = dist * 0.42 - distPenalty - turnPref * L * 0.32 + tooClose + random() * L * 0.22;
      if (score > bestScore) {
        bestScore = score;
        best = { x, y };
      }
    }
    return best || { x: W * 0.5, y: H * 0.5 };
  }

  function spawnRipple(x, y, maxR, alpha, count = 3) {
    ripples.push({ x, y, age: 0, maxR, alpha, count });
    if (ripples.length > 24) ripples.shift();
  }

  function makeFish(px, py) {
    const portrait = W / H < 0.85;
    const x = W * (portrait ? 0.52 : 0.46);
    const y = H * (portrait ? 0.58 : 0.55);
    const heading = portrait ? -1.12 : -0.55;
    const segLen = L / N_BODY;

    const spine = [];
    for (let i = 0; i <= N_TOTAL; i++) {
      const d = i * segLen;
      spine.push({
        x: x - Math.cos(heading) * d,
        y: y - Math.sin(heading) * d,
        angle: heading,
        nx: -Math.sin(heading),
        ny: Math.cos(heading),
        w: i <= N_BODY ? widthAt(i / N_BODY) * L : 0,
        turnBend: 0,
        dorsalOffset: 0,
        dorsalVel: 0
      });
    }

    const nf = {
      x: px, y: py,
      z: 0.58,          // Vertical depth in water column: 0.14 (deep stone bed) to 0.96 (surface meniscus)
      targetZ: 0.62,
      vz: 0,
      heading,
      speed: L * 0.20,
      driftVx: 0,
      driftVy: 0,
      omega: 0,
      turnBank: 0,
      wanderSeed: random() * 100,
      wonderYaw: 0,
      wonderYawTarget: 0,
      wonderTimer: 0,
      curiosityCooldown: 3.5,
      curiousMote: null,
      phase: 0.6,
      energy: 0.42,
      finPhase: 0,
      gillPhase: 0,
      pecL: { spread: 1.05, sweep: 0, scull: 0 },
      pecR: { spread: 1.05, sweep: 0, scull: 0 },
      barbelL: 0,
      barbelR: 0,
      spine,
      nose: { x, y },
      tail: { x: spine[N_BODY].x, y: spine[N_BODY].y },
      waypoint: { x: W * 0.5, y: H * 0.5 },
      mode: 'cruise',
      modeTime: 2.6,
      glidesSinceFloat: 0,
      nibbleDidRipple: false,
      lastStrokeHalf: 0,
      bowTimer: 0
    };
    nf.waypoint = pickRoamPoint(nf);
    fishes.push(nf);
    fish = nf;
    updateSpine(0.016);
  }

  function size() {
    const oldW = W, oldH = H, oldL = L;
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, W < 700 ? 1.85 : 1.5);
    cvs.width = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    L = clamp(Math.min(W * 0.42, H * 0.37), 160, 325);

    if (!causticTileA) buildCausticTiles();

    if (fishes.length === 0) {
      makeFish(W * 0.50, H * 0.38);
      makeFish(W * 0.28, H * 0.62);
      makeFish(W * 0.72, H * 0.66);
    } else {
      const sx = W / (oldW || W);
      const sy = H / (oldH || H);
      const k = L / (oldL || L);
      for (fish of fishes) {
        fish.x *= sx;
        fish.y *= sy;
        fish.speed *= k;
        const segLen = L / N_BODY;
        for (let i = 0; i <= N_TOTAL; i++) {
          const node = fish.spine[i];
          if (i === 0) {
            node.x = fish.x;
            node.y = fish.y;
          } else {
            const prev = fish.spine[i - 1];
            node.x = prev.x - Math.cos(node.angle) * segLen;
            node.y = prev.y - Math.sin(node.angle) * segLen;
          }
          node.w = i <= N_BODY ? widthAt(i / N_BODY) * L : 0;
        }
        fish.waypoint = pickRoamPoint(fish);
      }
      if (target) {
        target.x *= sx;
        target.y *= sy;
      }
    }
    buildWaterEnvironment();
  }

  // Pre-renders the deep benthic river-stone pond bed and the overhead canopy reflection map
  function buildWaterEnvironment() {
    const off = document.createElement('canvas');
    off.width = Math.ceil(W);
    off.height = Math.ceil(H);
    const g = off.getContext('2d');

    // 1. Deep Abyssal Emerald-Teal Base Gradient
    const grad = g.createLinearGradient(0, 0, W * 0.85, H);
    grad.addColorStop(0.00, '#041415');
    grad.addColorStop(0.32, '#092724');
    grad.addColorStop(0.68, '#0a302b');
    grad.addColorStop(1.00, '#031717');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);

    // 2. Benthic Topography: Submerged Mossy River Cobbles & Slate Stones
    const bgen = rseed(74109);
    const stoneCount = clamp(Math.round((W * H) / 9500), 75, 220);
    const stones = [];
    for (let i = 0; i < stoneCount; i++) {
      stones.push({
        x: bgen() * W,
        y: bgen() * H,
        rx: 18 + Math.pow(bgen(), 1.6) * Math.min(W, H) * 0.085,
        ry: 14 + Math.pow(bgen(), 1.6) * Math.min(W, H) * 0.068,
        angle: bgen() * TAU,
        tone: bgen(),
        moss: bgen()
      });
    }
    // Sort larger bed boulders first, smaller river cobbles on top
    stones.sort((a, b) => (b.rx * b.ry) - (a.rx * a.ry));

    for (let i = 0; i < stones.length; i++) {
      const s = stones[i];
      g.save();
      g.translate(s.x, s.y);
      g.rotate(s.angle);

      // Soft abyssal crevice shadow beneath each stone
      g.beginPath();
      g.ellipse(4, 6, s.rx * 1.12, s.ry * 1.12, 0, 0, TAU);
      g.fillStyle = 'rgba(1, 8, 9, 0.34)';
      g.fill();

      // River stone body shaded from top-left underwater skylight
      const sg = g.createRadialGradient(-s.rx * 0.28, -s.ry * 0.28, s.rx * 0.08, 0, 0, Math.max(s.rx, s.ry) * 1.05);
      if (s.moss > 0.58) {
        // Moss-dusted jade stone
        sg.addColorStop(0.00, 'rgba(32, 74, 62, 0.34)');
        sg.addColorStop(0.55, 'rgba(16, 46, 40, 0.30)');
        sg.addColorStop(1.00, 'rgba(5, 19, 18, 0.06)');
      } else if (s.tone > 0.45) {
        // Warm river slate
        sg.addColorStop(0.00, 'rgba(38, 66, 62, 0.28)');
        sg.addColorStop(0.58, 'rgba(18, 39, 38, 0.26)');
        sg.addColorStop(1.00, 'rgba(5, 18, 19, 0.05)');
      } else {
        // Deep basalt pebble
        sg.addColorStop(0.00, 'rgba(22, 48, 47, 0.32)');
        sg.addColorStop(0.62, 'rgba(10, 26, 27, 0.30)');
        sg.addColorStop(1.00, 'rgba(3, 12, 13, 0.06)');
      }
      g.beginPath();
      g.ellipse(0, 0, s.rx, s.ry, 0, 0, TAU);
      g.fillStyle = sg;
      g.fill();
      g.restore();
    }

    // 3. A few sunken, waterlogged autumn leaves resting quietly on the deep stone bed
    const lgen = rseed(99317);
    const sunkenLeaves = clamp(Math.round((W * H) / 140000), 4, 9);
    for (let k = 0; k < sunkenLeaves; k++) {
      const lx = W * (0.12 + 0.76 * lgen());
      const ly = H * (0.12 + 0.76 * lgen());
      const lr = 12 + lgen() * 14;
      const lang = lgen() * TAU;
      g.save();
      g.translate(lx, ly);
      g.rotate(lang);
      g.beginPath();
      g.moveTo(-lr, 0);
      g.quadraticCurveTo(0, -lr * 0.65, lr, 0);
      g.quadraticCurveTo(0, lr * 0.65, -lr, 0);
      g.closePath();
      g.fillStyle = k % 2 ? 'rgba(68, 48, 34, 0.22)' : 'rgba(78, 62, 36, 0.19)';
      g.fill();
      g.restore();
    }

    // 4. Volumetric Water Column Turbidity & Central Sunlight Well
    const sunGlow = g.createRadialGradient(W * 0.44, H * 0.36, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.80);
    sunGlow.addColorStop(0.00, 'rgba(92, 166, 136, 0.20)');
    sunGlow.addColorStop(0.42, 'rgba(34, 98, 84, 0.12)');
    sunGlow.addColorStop(0.75, 'rgba(8, 36, 33, 0.28)');
    sunGlow.addColorStop(1.00, 'rgba(2, 9, 12, 0.64)');
    g.fillStyle = sunGlow;
    g.fillRect(0, 0, W, H);

    // Subtle organic depth murk clouds
    const ngen = rseed(46119);
    for (let k = 0; k < 36; k++) {
      const x = ngen() * W, y = ngen() * H;
      const r = 40 + ngen() * Math.min(W, H) * 0.26;
      const patch = g.createRadialGradient(x, y, 0, x, y, r);
      patch.addColorStop(0, k % 3 ? 'rgba(5, 19, 20, 0.11)' : 'rgba(84, 148, 116, 0.04)');
      patch.addColorStop(1, 'rgba(0, 0, 0, 0)');
      g.fillStyle = patch;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }

    waterCanvas = off;

    // 5. Build Surface Canopy & Sky Fresnel Reflection Layer
    const surf = document.createElement('canvas');
    surf.width = Math.ceil(W);
    surf.height = Math.ceil(H);
    const sg = surf.getContext('2d');

    // Soft sky skylight window near upper-left/center
    const sky = sg.createRadialGradient(W * 0.38, H * 0.24, 10, W * 0.42, H * 0.32, Math.max(W, H) * 0.62);
    sky.addColorStop(0.00, 'rgba(188, 232, 214, 0.055)');
    sky.addColorStop(0.45, 'rgba(130, 192, 168, 0.024)');
    sky.addColorStop(1.00, 'rgba(0, 0, 0, 0)');
    sg.fillStyle = sky;
    sg.fillRect(0, 0, W, H);

    // Dappled overhanging foliage shadow vignette around pond perimeter
    const canopyRng = rseed(61309);
    for (let i = 0; i < 24; i++) {
      const edge = i % 4;
      const cx = edge === 0 ? canopyRng() * W * 0.25 : edge === 1 ? W * (0.75 + canopyRng() * 0.25) : canopyRng() * W;
      const cy = edge === 2 ? canopyRng() * H * 0.22 : edge === 3 ? H * (0.78 + canopyRng() * 0.22) : canopyRng() * H;
      const cr = 70 + canopyRng() * Math.min(W, H) * 0.24;
      const cg = sg.createRadialGradient(cx, cy, 0, cx, cy, cr);
      cg.addColorStop(0, 'rgba(2, 12, 12, 0.16)');
      cg.addColorStop(1, 'rgba(0, 0, 0, 0)');
      sg.fillStyle = cg;
      sg.fillRect(cx - cr, cy - cr, cr * 2, cr * 2);
    }
    surfaceCanopyCanvas = surf;

    // 6. Initialize Hydrodynamic Suspended Particles
    const pgen = rseed(38119);
    particles = [];
    const pCount = Math.min(165, Math.round((W * H) / 6800));
    for (let j = 0; j < pCount; j++) {
      particles.push({
        x: pgen() * W,
        y: pgen() * H,
        vx: 0,
        vy: 0,
        depth: 0.12 + pgen() * 0.88,
        phase: pgen() * TAU,
        r: 0.38 + pgen() * 1.18
      });
    }

    if (motes.length === 0) {
      for (let m = 0; m < 6; m++) motes.push(spawnMote(true));
    }
  }

  // Advect surface motes & suspended particles with ambient current AND the koi's hydrodynamic field
  function updateFluidParticles(dt) {
    const f = fish;
    const headX = f.nose.x, headY = f.nose.y;
    const headCos = Math.cos(f.heading), headSin = Math.sin(f.heading);
    const pushRadius = L * 0.30;
    const pushRadiusSq = pushRadius * pushRadius;

    // 1. Update Surface Botanical Motes
    const pad = 55;
    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      m.age += dt;
      const flow = sampleCurrent(m.x, m.y, now);

      // Gently push surface motes aside when koi bow waves pass near the surface (unless inspecting)
      for (const kf of fishes) {
        if (kf.z > 0.65 && kf.mode !== 'wonder' && kf.mode !== 'inspect') {
          const kdx = m.x - kf.nose.x, kdy = m.y - kf.nose.y;
          const kdSq = kdx * kdx + kdy * kdy;
          if (kdSq < pushRadiusSq && kdSq > 1) {
            const kd = Math.sqrt(kdSq);
            const kfalloff = Math.pow(1 - kd / pushRadius, 2);
            m.vx += (kdx / kd) * kf.speed * 0.45 * kfalloff * dt;
            m.vy += (kdy / kd) * kf.speed * 0.45 * kfalloff * dt;
          }
        }
      }

      // Caudal wakes also swirl nearby surface motes
      for (let w = 0; w < wakes.length; w++) {
        const wk = wakes[w];
        const dx = m.x - wk.x, dy = m.y - wk.y;
        const dSq = dx * dx + dy * dy;
        const rMax = wk.r + L * 0.18;
        if (dSq < rMax * rMax && dSq > 4) {
          const d = Math.sqrt(dSq);
          const strength = (1 - wk.age / wk.life) * (1 - d / rMax) * wk.power * 18;
          // Tangential vortex swirl + outward push
          m.vx += (-dy / d * wk.spin + dx / d * 0.4) * strength * dt;
          m.vy += ( dx / d * wk.spin + dy / d * 0.4) * strength * dt;
        }
      }

      m.vx *= Math.exp(-dt * 2.8);
      m.vy *= Math.exp(-dt * 2.8);
      m.x += (flow.vx * 0.55 + m.vx + Math.sin(now * 0.35 + m.phase) * 2.0) * dt;
      m.y += (flow.vy * 0.55 + m.vy + Math.cos(now * 0.28 + m.phase) * 2.0) * dt;

      if (m.age > m.life || m.x < pad || m.x > W - pad || m.y < pad || m.y > H - pad) {
        if (f.curiousMote === m) f.curiousMote = null;
        motes[i] = spawnMote(false);
      }
    }

    // 2. Update Suspended Water-Column Plankton / Silt Particles
    for (let i = 0; i < particles.length; i++) {
      const pt = particles[i];
      // Particles near koi get parted by bodies and swirled by tails
      for (const kf of fishes) {
        if (Math.abs(pt.depth - kf.z) < 0.35) {
          const khx = kf.nose.x, khy = kf.nose.y;
          const khCos = Math.cos(kf.heading), khSin = Math.sin(kf.heading);
          const dx = pt.x - khx, dy = pt.y - khy;
          const dSq = dx * dx + dy * dy;
          if (dSq < pushRadiusSq && dSq > 1) {
            const d = Math.sqrt(dSq);
            const lat = -dx * khSin + dy * khCos;
            const side = lat >= 0 ? 1 : -1;
            const falloff = (1 - d / pushRadius) * (kf.speed / L);
            pt.vx += (-khSin * side * 38 + (dx / d) * 18) * falloff * dt;
            pt.vy += ( khCos * side * 38 + (dy / d) * 18) * falloff * dt;
          }

          const tailX = kf.tail.x, tailY = kf.tail.y;
          const tdx = pt.x - tailX, tdy = pt.y - tailY;
          const tdSq = tdx * tdx + tdy * tdy;
          if (tdSq < pushRadiusSq * 0.7 && tdSq > 1) {
            const td = Math.sqrt(tdSq);
            const whip = kf.energy * (1 - td / (pushRadius * 0.84)) * 28;
            pt.vx += (tdx / td) * whip * dt;
            pt.vy += (tdy / td) * whip * dt;
          }
        }
      }

      pt.vx *= Math.exp(-dt * 2.2);
      pt.vy *= Math.exp(-dt * 2.2);
      pt.x = (pt.x + (pt.vx + Math.sin(now * 0.18 + pt.phase) * pt.depth * 3.5) * dt + W) % W;
      pt.y = (pt.y + (pt.vy + Math.cos(now * 0.14 + pt.phase) * pt.depth * 3.0) * dt + H) % H;
    }
  }

  function findCuriousMote(f) {
    if (f.curiosityCooldown > 0) return null;
    let best = null, bestDist = L * 1.55;
    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      if (m.inspected || m.age < 1.5 || m.life - m.age < 4.5) continue;
      const dx = m.x - f.nose.x, dy = m.y - f.nose.y;
      const d = Math.hypot(dx, dy);
      if (d < bestDist && d > L * 0.28) {
        const relAngle = Math.abs(angleDiff(f.heading, Math.atan2(dy, dx)));
        if (relAngle < 1.35) {
          best = m;
          bestDist = d;
        }
      }
    }
    return best;
  }

  function swim(dt) {
    const f = fish;
    f.curiosityCooldown = Math.max(0, f.curiosityCooldown - dt);

    // 1. Behavioral Ecology: User Call -> Curious Wonder -> Buoyant Float -> Burst-and-Glide Roaming
    if (target) {
      f.curiousMote = null;
      const distToTarget = Math.hypot(target.x - f.x, target.y - f.y);
      if (target.mode === 'seek') {
        f.mode = 'seek';
        f.targetZ = 0.92;
        const noseDist = Math.hypot(target.x - f.nose.x, target.y - f.nose.y);
        if (!pointerDown && (noseDist < L * 0.16 || distToTarget < L * 0.22)) {
          target.mode = 'inspect';
          target.life = 2.8;
          f.mode = 'inspect';
          f.nibbleDidRipple = false;
        }
      } else if (target.mode === 'inspect') {
        f.mode = 'inspect';
        f.targetZ = 0.95;
        target.life -= dt;
        if (!f.nibbleDidRipple && target.life < 2.0) {
          f.nibbleDidRipple = true;
          spawnRipple(f.nose.x, f.nose.y, L * 0.26, 0.30, 3);
        }
        if (target.life <= 0) {
          target = null;
          f.mode = 'float';
          f.modeTime = 2.4 + random() * 1.8;
          f.targetZ = 0.68;
          f.waypoint = pickRoamPoint(f, true);
        }
      }
    } else if (f.mode === 'wonder') {
      const m = f.curiousMote;
      if (!m) {
        f.mode = 'float';
        f.modeTime = 2.2 + random() * 2.0;
        f.targetZ = 0.55;
      } else {
        f.targetZ = 0.92;
        const noseDist = Math.hypot(m.x - f.nose.x, m.y - f.nose.y);
        f.modeTime -= dt;
        if (noseDist < L * 0.14) {
          f.wonderTimer += dt;
          if (!m.inspected && f.wonderTimer > 1.15) {
            m.inspected = true;
            if (random() < 0.68) {
              spawnRipple(m.x, m.y, L * 0.20, 0.24, 2);
              m.age = m.life - 0.4;
            }
          }
          if (f.wonderTimer > 2.3 || f.modeTime <= 0) {
            f.curiousMote = null;
            f.curiosityCooldown = 7.0 + random() * 6.0;
            f.mode = 'float';
            f.modeTime = 2.6 + random() * 2.2;
            f.targetZ = 0.45 + random() * 0.25;
            f.waypoint = pickRoamPoint(f, true);
          }
        } else if (f.modeTime <= 0) {
          f.curiousMote = null;
          f.curiosityCooldown = 5.0;
          f.mode = 'coast';
          f.modeTime = 2.0;
        }
      }
    } else {
      f.modeTime -= dt;
      const spottedMote = findCuriousMote(f);
      if (spottedMote && (f.mode === 'coast' || f.mode === 'float')) {
        f.curiousMote = spottedMote;
        f.mode = 'wonder';
        f.modeTime = 6.5;
        f.wonderTimer = 0;
      } else {
        const distToWaypoint = Math.hypot(f.waypoint.x - f.x, f.waypoint.y - f.y);
        if (distToWaypoint < L * 0.45 && f.mode !== 'float') {
          f.waypoint = pickRoamPoint(f);
          if (f.glidesSinceFloat >= 1 && random() < 0.58) {
            f.mode = 'float';
            f.modeTime = 3.2 + random() * 2.8;
            f.glidesSinceFloat = 0;
            f.targetZ = random() < 0.5 ? 0.80 : 0.34;
          } else {
            f.mode = 'coast';
            f.modeTime = 1.8 + random() * 2.0;
            f.glidesSinceFloat++;
          }
        } else if (f.modeTime <= 0) {
          if (f.mode === 'cruise') {
            f.mode = 'coast';
            f.modeTime = 2.2 + random() * 2.4;
            f.glidesSinceFloat++;
            f.targetZ = clamp(f.targetZ + (random() - 0.5) * 0.28, 0.22, 0.84);
          } else if (f.mode === 'coast') {
            if (f.glidesSinceFloat >= 2 || random() < 0.42) {
              f.mode = 'float';
              f.modeTime = 3.0 + random() * 3.2;
              f.glidesSinceFloat = 0;
              f.wonderYawTarget = (random() - 0.5) * 0.45;
              f.targetZ = clamp(f.z + (random() - 0.45) * 0.32, 0.24, 0.86);
            } else {
              f.mode = 'cruise';
              f.modeTime = 1.6 + random() * 1.9;
              f.targetZ = clamp(0.32 + random() * 0.48, 0.25, 0.82);
            }
          } else if (f.mode === 'float') {
            f.mode = 'cruise';
            f.modeTime = 1.8 + random() * 1.8;
            f.waypoint = pickRoamPoint(f, true);
            f.targetZ = clamp(0.35 + random() * 0.45, 0.25, 0.82);
          }
        }
      }
    }

    // 2. Smooth Vertical Buoyancy (Depth z in water column)
    const zSpring = 1.8, zDamp = 2.4;
    const zAcc = (f.targetZ - f.z) * zSpring - f.vz * zDamp;
    f.vz += zAcc * dt;
    f.z = clamp(f.z + f.vz * dt, 0.14, 0.96);

    // 3. Steering, Meandering Wander & Boundary Field
    let goal = f.waypoint;
    if (target) goal = target;
    else if (f.mode === 'wonder' && f.curiousMote) goal = f.curiousMote;

    const dx = goal.x - f.x;
    const dy = goal.y - f.y;
    const dist = Math.hypot(dx, dy);
    let desiredHeading = Math.atan2(dy, dx);

    if (f.mode === 'cruise' || f.mode === 'coast') {
      const meander = Math.sin(now * 0.42 + f.wanderSeed) * 0.24
                    + Math.cos(now * 0.27 - f.wanderSeed * 0.7) * 0.16;
      desiredHeading += meander * smooth(L * 0.35, L * 1.2, dist);
    }

    if (f.mode === 'float') {
      if (random() < dt * 0.65) {
        f.wonderYawTarget = (random() - 0.5) * 0.52;
      }
      f.wonderYaw += (f.wonderYawTarget - f.wonderYaw) * (1 - Math.exp(-dt * 1.4));
      desiredHeading = f.heading + f.wonderYaw;
    } else {
      f.wonderYaw *= Math.exp(-dt * 3);
    }

    if ((f.mode === 'inspect' || (f.mode === 'wonder' && dist < L * 0.20)) && dist < L * 0.18) {
      desiredHeading = f.heading + angleDiff(f.heading, desiredHeading) * 0.30;
    }

    const padX = Math.min(L * 0.46, W * 0.20);
    const padY = Math.min(L * 0.46, H * 0.20);
    const lookAhead = f.speed * 1.15 + L * 0.26;
    const probeX = f.x + Math.cos(f.heading) * lookAhead;
    const probeY = f.y + Math.sin(f.heading) * lookAhead;

    let wallPushX = 0, wallPushY = 0;
    if (probeX < padX) wallPushX = (padX - probeX) / padX;
    else if (probeX > W - padX) wallPushX = -((probeX - (W - padX)) / padX);
    if (probeY < padY) wallPushY = (padY - probeY) / padY;
    else if (probeY > H - padY) wallPushY = -((probeY - (H - padY)) / padY);

    const wallUrgency = clamp(Math.hypot(wallPushX, wallPushY), 0, 1);
    if (wallUrgency > 0.01 && f.mode !== 'seek') {
      const centerAngle = Math.atan2(H * 0.5 - f.y, W * 0.5 - f.x);
      const blend = smooth(0, 0.85, wallUrgency) * 0.82;
      desiredHeading = f.heading + angleDiff(f.heading, centerAngle) * blend;
      if (f.mode === 'float' && wallUrgency > 0.35) {
        f.mode = 'cruise';
        f.modeTime = 2.0;
        f.waypoint = pickRoamPoint(f, true);
      }
    }

    const headingError = angleDiff(f.heading, desiredHeading);
    const isSeek = f.mode === 'seek';
    const isInspect = f.mode === 'inspect';
    const isFloat = f.mode === 'float';
    const isWonder = f.mode === 'wonder';

    const maxTurnRate = isSeek ? 2.45 : isFloat ? 0.42 : isInspect ? 1.05 : isWonder ? 1.55 : 1.35;
    const turnGain = isSeek ? 2.55 : isFloat ? 0.85 : 1.65;
    const targetOmega = clamp(headingError * turnGain, -maxTurnRate, maxTurnRate);
    const omegaResp = isSeek ? 6.5 : isFloat ? 2.2 : 4.0;
    f.omega += (targetOmega - f.omega) * (1 - Math.exp(-dt * omegaResp));

    const headRecoil = -Math.cos(f.phase) * (0.02 + 0.13 * f.energy) * L * 0.0016;
    f.heading += (f.omega + headRecoil) * dt;
    f.turnBank += (f.omega - f.turnBank) * (1 - Math.exp(-dt * 4.8));

    // 4. Propulsive Energy, Tail Beat Cadence & Buoyant Drift
    const turnEffort = smooth(0.15, 1.8, Math.abs(f.omega));
    const approachFactor = (isSeek || isWonder) ? smooth(L * 0.12, L * 0.85, dist) : 1;

    let targetEnergy = 0.08;
    if (isFloat) {
      targetEnergy = 0.045 + 0.06 * turnEffort;
    } else if (isInspect) {
      targetEnergy = 0.08;
    } else if (isWonder) {
      targetEnergy = dist < L * 0.22 ? 0.07 : (0.14 + 0.36 * approachFactor + 0.15 * turnEffort);
    } else if (isSeek) {
      targetEnergy = 0.24 + 0.72 * approachFactor + 0.28 * turnEffort;
    } else if (f.mode === 'cruise') {
      targetEnergy = 0.48 + 0.18 * turnEffort;
    } else {
      targetEnergy = 0.075 + 0.14 * turnEffort;
    }
    targetEnergy = clamp(targetEnergy, 0.04, 1.0);

    const energyRate = targetEnergy > f.energy ? 3.8 : 1.85;
    f.energy += (targetEnergy - f.energy) * (1 - Math.exp(-dt * energyRate));

    const freq = (isFloat || isInspect)
      ? 0.38 + f.energy * 0.65
      : (0.48 + f.energy * 1.28 + turnEffort * 0.20);
    f.phase += dt * TAU * freq;
    f.finPhase += dt * TAU * ((isInspect || isFloat || (isWonder && dist < L * 0.25)) ? 1.35 : 0.72 + f.energy * 0.45);
    f.gillPhase += dt * TAU * (0.48 + f.energy * 0.38);

    const strokePulse = Math.pow(Math.sin(f.phase), 2);
    const cTurnPush = isFloat ? 0 : turnEffort * L * 0.16;
    const rawThrust = (isFloat || isInspect)
      ? L * 0.008
      : L * 0.50 * f.energy * (0.28 + 0.88 * strokePulse) + cTurnPush;

    const isHoverBraking = isInspect || isFloat || ((isSeek || isWonder) && dist < L * 0.60);
    const pectoralBrake = isInspect ? 2.8 : isFloat ? 1.65 : ((isSeek || isWonder) && dist < L * 0.60 ? (1 - approachFactor) * 1.85 : 0);
    const linearDragCoeff = 0.52 + pectoralBrake + 0.32 * turnEffort;
    const quadDragCoeff = 1.15 / L;

    const accel = rawThrust - f.speed * linearDragCoeff - f.speed * f.speed * quadDragCoeff;
    const minSpeed = (isInspect || isFloat || (isWonder && dist < L * 0.20)) ? L * 0.004 : L * 0.048;
    const maxSpeed = isSeek ? L * 0.52 : L * 0.36;
    f.speed = clamp(f.speed + accel * dt, minSpeed, maxSpeed);

    const ambient = sampleCurrent(f.x, f.y, now);
    f.driftVx += (ambient.vx - f.driftVx) * (1 - Math.exp(-dt * 2.5));
    f.driftVy += (ambient.vy - f.driftVy) * (1 - Math.exp(-dt * 2.5));
    const currentInfluence = isFloat ? 0.95 : (f.mode === 'coast' || isInspect || isWonder) ? 0.65 : 0.25;

    f.x += (Math.cos(f.heading) * f.speed + f.driftVx * currentInfluence) * dt;
    f.y += (Math.sin(f.heading) * f.speed + f.driftVy * currentInfluence) * dt;
    f.x = clamp(f.x, L * 0.12, W - L * 0.12);
    f.y = clamp(f.y, L * 0.12, H - L * 0.12);

    // 5. Pectoral Fin Articulation
    const isSculling = isFloat || isInspect || (isWonder && dist < L * 0.25);
    const baseSpread = isHoverBraking
      ? 1.26
      : (f.mode === 'coast' ? 1.15 : 1.0 - 0.25 * smooth(0.4, 0.95, f.energy));
    const baseSweep = (isInspect || ((isSeek || isWonder) && dist < L * 0.45))
      ? -0.36
      : isFloat ? -0.12 : (0.30 * smooth(0.35, 0.9, f.energy));
    const bankAsym = clamp(f.turnBank * 0.25, -0.35, 0.35);

    const scullAmp = isSculling ? 0.26 : 0.08;
    const scullL = Math.sin(f.finPhase) * scullAmp;
    const scullR = Math.sin(f.finPhase + (isSculling ? Math.PI * 0.85 : 0.9)) * scullAmp;

    f.pecL.spread += (baseSpread + bankAsym * 0.5 - f.pecL.spread) * (1 - Math.exp(-dt * 5.5));
    f.pecR.spread += (baseSpread - bankAsym * 0.5 - f.pecR.spread) * (1 - Math.exp(-dt * 5.5));
    f.pecL.sweep  += (baseSweep - bankAsym + scullL - f.pecL.sweep) * (1 - Math.exp(-dt * 6.5));
    f.pecR.sweep  += (baseSweep + bankAsym + scullR - f.pecR.sweep) * (1 - Math.exp(-dt * 6.5));

    // 6. Solve Inextensible Spine
    updateSpine(dt);

    // 7. Spawn Kármán Vortex Street Wakes & Surface Bow Meniscus Waves
    const currentHalf = Math.floor(f.phase / Math.PI);
    if (currentHalf !== f.lastStrokeHalf) {
      f.lastStrokeHalf = currentHalf;
      if (f.energy > 0.18) {
        const peduncle = f.spine[N_BODY];
        const tailTip = f.spine[N_TOTAL - 3];
        const spinSign = (currentHalf % 2 === 0) ? 1 : -1;
        wakes.push({
          x: lerp(peduncle.x, tailTip.x, 0.62),
          y: lerp(peduncle.y, tailTip.y, 0.62),
          vx: -Math.cos(peduncle.angle) * L * 0.052 + peduncle.nx * spinSign * L * 0.018 + f.driftVx * 0.4,
          vy: -Math.sin(peduncle.angle) * L * 0.052 + peduncle.ny * spinSign * L * 0.018 + f.driftVy * 0.4,
          age: 0,
          life: 2.8 + f.energy * 1.1,
          r: 5 + L * 0.016,
          power: clamp(f.energy * (0.42 + 0.58 * f.z), 0.15, 0.98),
          angle: peduncle.angle + spinSign * 0.25,
          spin: spinSign
        });
        if (wakes.length > 22) wakes.shift();
      }
    }

    // Continuous V-shaped Kelvin bow wave & shoulder wake when swimming near the surface
    f.bowTimer += dt * (f.speed / L);
    if (f.z > 0.58 && f.speed > L * 0.09 && f.bowTimer > 0.055) {
      f.bowTimer = 0;
      const shoulder = bodyPoint(0.14, 0);
      bowTrails.push({
        x: shoulder.x,
        y: shoulder.y,
        angle: f.heading,
        age: 0,
        life: 1.55,
        spread: L * 0.085,
        alpha: smooth(0.58, 0.95, f.z) * smooth(L * 0.08, L * 0.34, f.speed) * 0.22
      });
      if (bowTrails.length > 28) bowTrails.shift();
    }
  }

  function updateSpine(dt) {
    const f = fish;
    const pts = f.spine;
    const depthScale = lerp(0.90, 1.04, f.z);
    const segLen = (L * depthScale) / N_BODY;

    pts[0].x = f.x;
    pts[0].y = f.y;
    pts[0].angle = f.heading;
    pts[0].nx = -Math.sin(f.heading);
    pts[0].ny = Math.cos(f.heading);

    const advectRate = clamp((f.speed / L) * 1.45 + 0.92, 0.92, 2.5) * N_BODY * dt;
    pts[0].turnBend = clamp(-f.omega * 0.034, -0.068, 0.068);
    for (let i = N_TOTAL; i >= 1; i--) {
      const prevBend = pts[i - 1].turnBend;
      pts[i].turnBend = lerp(pts[i].turnBend, prevBend, clamp(advectRate, 0, 0.85)) * Math.exp(-dt * 0.58);
    }

    const turnSuppression = 1 - 0.32 * smooth(0.4, 2.0, Math.abs(f.omega));
    const tailFlow = sampleCurrent(pts[N_BODY].x, pts[N_BODY].y, now);
    const crossFlow = (-Math.sin(f.heading) * tailFlow.vx + Math.cos(f.heading) * tailFlow.vy) / (L * 0.03);

    for (let i = 1; i <= N_TOTAL; i++) {
      const prev = pts[i - 1];
      const curr = pts[i];
      const u = i / N_BODY;

      const dx = prev.x - curr.x;
      const dy = prev.y - curr.y;
      const trailAngle = (dx * dx + dy * dy > 1e-6) ? Math.atan2(dy, dx) : prev.angle;

      let relAngle = angleDiff(prev.angle, trailAngle);

      let waveAmp = 0;
      if (u <= 1.0) {
        waveAmp = Math.pow(clamp((u - 0.12) / 0.88, 0, 1), 1.85) * 0.056;
      } else {
        const tailU = (i - N_BODY) / N_TAIL;
        waveAmp = (0.056 + tailU * 0.040);
      }

      const waveK = 5.35;
      const idleSilk = (u > 0.55 ? Math.pow(u - 0.55, 1.4) * 0.014 * crossFlow : 0);
      const muscleWave = waveAmp * (0.11 + 0.89 * f.energy) * turnSuppression * Math.sin(f.phase - u * waveK) + idleSilk;
      const targetRelAngle = muscleWave + curr.turnBend * (u <= 1.0 ? (0.45 + 0.75 * u) : 1.15);

      const stiffness = u <= 1.0 ? lerp(22, 13.5, u) : lerp(11.5, 6.8, (i - N_BODY) / N_TAIL);
      relAngle += (targetRelAngle - relAngle) * (1 - Math.exp(-dt * stiffness));

      const maxJointAngle = u <= 1.0 ? (0.025 + 0.065 * u) : 0.11;
      relAngle = clamp(relAngle, -maxJointAngle, maxJointAngle);

      const segAngle = prev.angle + relAngle;
      curr.angle = segAngle;

      const prevX = curr.x, prevY = curr.y;
      curr.x = prev.x - Math.cos(segAngle) * segLen;
      curr.y = prev.y - Math.sin(segAngle) * segLen;
      curr.nx = -Math.sin(segAngle);
      curr.ny = Math.cos(segAngle);

      if (dt > 0) {
        const latVel = ((curr.x - prevX) * curr.nx + (curr.y - prevY) * curr.ny) / dt;
        const flowPush = crossFlow * L * 0.008 * Math.sin(now * 1.4 + u * 3);
        const targetDorsal = clamp(-latVel * 0.055 + relAngle * L * 0.42 + flowPush, -L * 0.055, L * 0.055);
        const springK = 36, damp = 7.2;
        const force = (targetDorsal - curr.dorsalOffset) * springK - curr.dorsalVel * damp;
        curr.dorsalVel += force * dt;
        curr.dorsalOffset += curr.dorsalVel * dt;
      }
    }

    for (let i = 1; i < N_TOTAL; i++) {
      const tx = pts[i - 1].x - pts[i + 1].x;
      const ty = pts[i - 1].y - pts[i + 1].y;
      const mag = Math.hypot(tx, ty) || 1;
      pts[i].nx = -ty / mag;
      pts[i].ny = tx / mag;
    }

    const headLatVel = f.omega * L * 0.18 + Math.sin(f.gillPhase) * 0.04;
    f.barbelL += (clamp(-headLatVel - 0.12, -0.55, 0.55) - f.barbelL) * (1 - Math.exp(-dt * 8));
    f.barbelR += (clamp(-headLatVel + 0.12, -0.55, 0.55) - f.barbelR) * (1 - Math.exp(-dt * 8));

    f.nose = { x: pts[0].x, y: pts[0].y };
    f.tail = { x: pts[N_BODY].x, y: pts[N_BODY].y };
  }

  function bodyPoint(u, v = 0) {
    const pts = fish.spine;
    const idx = clamp(u, 0, 1) * N_BODY;
    const i = Math.min(N_BODY - 1, Math.floor(idx));
    const t = idx - i;
    const a = pts[i], b = pts[i + 1];
    const x = lerp(a.x, b.x, t);
    const y = lerp(a.y, b.y, t);
    let nx = lerp(a.nx, b.nx, t);
    let ny = lerp(a.ny, b.ny, t);
    const m = Math.hypot(nx, ny) || 1;
    nx /= m; ny /= m;

    const depthScale = lerp(0.90, 1.04, fish.z);
    const rollShift = clamp(fish.turnBank * 0.08, -0.14, 0.14) * (1 - v * v) * Math.sin(u * Math.PI);
    const w = widthAt(u) * L * depthScale;
    return {
      x: x + nx * w * (v + rollShift),
      y: y + ny * w * (v + rollShift),
      nx, ny, w,
      angle: lerp(a.angle, b.angle, t)
    };
  }

  function traceBodyOutline() {
    const depthScale = lerp(0.90, 1.04, fish.z);
    const Ls = L * depthScale;
    const snout = bodyPoint(0, 0);
    const snoutL = bodyPoint(0.016, 1);
    const snoutR = bodyPoint(0.016, -1);
    const noseTipX = snout.x + Math.cos(fish.heading) * Ls * 0.016;
    const noseTipY = snout.y + Math.sin(fish.heading) * Ls * 0.016;

    c.beginPath();
    c.moveTo(noseTipX, noseTipY);
    c.quadraticCurveTo(
      noseTipX + snout.nx * Ls * 0.024,
      noseTipY + snout.ny * Ls * 0.024,
      snoutL.x, snoutL.y
    );

    for (let i = 1; i <= N_BODY; i++) {
      const q = bodyPoint(i / N_BODY, 1);
      c.lineTo(q.x, q.y);
    }
    for (let i = N_BODY; i >= 1; i--) {
      const q = bodyPoint(i / N_BODY, -1);
      c.lineTo(q.x, q.y);
    }

    c.quadraticCurveTo(
      noseTipX - snout.nx * Ls * 0.024,
      noseTipY - snout.ny * Ls * 0.024,
      noseTipX, noseTipY
    );
    c.closePath();
  }

  // Draws tiled, counter-drifting optical caustic networks
  function drawCausticNetwork(alphaA, alphaB, scaleMul = 1.0) {
    if (!causticTileA || !causticTileB) return;
    c.save();
    c.globalCompositeOperation = 'screen';

    const tileSpanA = 290 * scaleMul;
    const oxA = ((now * 14) % tileSpanA + tileSpanA) % tileSpanA;
    const oyA = ((now * 9.5) % tileSpanA + tileSpanA) % tileSpanA;
    c.globalAlpha = alphaA;
    for (let y = -tileSpanA + oyA; y < H + tileSpanA; y += tileSpanA) {
      for (let x = -tileSpanA + oxA; x < W + tileSpanA; x += tileSpanA) {
        c.drawImage(causticTileA, x, y, tileSpanA, tileSpanA);
      }
    }

    const tileSpanB = 240 * scaleMul;
    const oxB = ((-now * 11.5) % tileSpanB + tileSpanB) % tileSpanB;
    const oyB = ((now * 13.0) % tileSpanB + tileSpanB) % tileSpanB;
    c.globalAlpha = alphaB;
    for (let y = -tileSpanB + oyB; y < H + tileSpanB; y += tileSpanB) {
      for (let x = -tileSpanB + oxB; x < W + tileSpanB; x += tileSpanB) {
        c.drawImage(causticTileB, x, y, tileSpanB, tileSpanB);
      }
    }

    c.restore();
  }

  function drawShadow() {
    const z = fish.z;
    const dx = L * lerp(0.028, 0.068, z);
    const dy = L * lerp(0.045, 0.102, z);
    const alpha = lerp(0.32, 0.21, z);
    const blur = L * lerp(0.055, 0.110, z);

    c.save();
    c.translate(dx, dy);
    traceBodyOutline();
    c.fillStyle = `rgba(1, 10, 11, ${alpha})`;
    c.shadowColor = `rgba(0, 7, 8, ${alpha + 0.15})`;
    c.shadowBlur = blur;
    c.fill();
    c.restore();
  }

  function drawTailFin() {
    const depthScale = lerp(0.90, 1.04, fish.z);
    const Ls = L * depthScale;
    const pts = fish.spine;
    const root = pts[N_BODY - 1];
    const leftEdge = [];
    const rightEdge = [];

    for (let j = 0; j <= N_TAIL; j++) {
      const s = j / N_TAIL;
      const node = pts[N_BODY + j];
      const lobeSpread = Ls * (0.024 + 0.165 * Math.pow(s, 0.82) * (1 + 0.12 * fish.energy));
      leftEdge.push({
        x: node.x + node.nx * lobeSpread,
        y: node.y + node.ny * lobeSpread
      });
      rightEdge.push({
        x: node.x - node.nx * lobeSpread,
        y: node.y - node.ny * lobeSpread
      });
    }

    const notchNode = pts[N_BODY + Math.floor(N_TAIL * 0.46)];
    const tipR = rightEdge[N_TAIL];
    const midL = leftEdge[Math.floor(N_TAIL * 0.72)];
    const midR = rightEdge[Math.floor(N_TAIL * 0.72)];

    const grad = c.createRadialGradient(root.x, root.y, Ls * 0.01, notchNode.x, notchNode.y, Ls * 0.28);
    grad.addColorStop(0.00, 'rgba(244, 241, 228, 0.92)');
    grad.addColorStop(0.32, 'rgba(248, 245, 232, 0.76)');
    grad.addColorStop(0.68, 'rgba(232, 238, 224, 0.38)');
    grad.addColorStop(1.00, 'rgba(208, 226, 214, 0.04)');

    c.beginPath();
    c.moveTo(leftEdge[0].x, leftEdge[0].y);
    for (let j = 1; j <= N_TAIL; j++) {
      c.lineTo(leftEdge[j].x, leftEdge[j].y);
    }
    c.quadraticCurveTo(
      lerp(midL.x, notchNode.x, 0.45),
      lerp(midL.y, notchNode.y, 0.45),
      notchNode.x, notchNode.y
    );
    c.quadraticCurveTo(
      lerp(midR.x, notchNode.x, 0.45),
      lerp(midR.y, notchNode.y, 0.45),
      tipR.x, tipR.y
    );
    for (let j = N_TAIL - 1; j >= 0; j--) {
      c.lineTo(rightEdge[j].x, rightEdge[j].y);
    }
    c.closePath();
    c.fillStyle = grad;
    c.fill();

    c.lineWidth = Math.max(0.45, Ls * 0.0013);
    for (const side of [-1, 1]) {
      const edgeArr = side === 1 ? leftEdge : rightEdge;
      for (let r = 1; r <= 9; r++) {
        const frac = r / 9.5;
        const endIdx = Math.min(N_TAIL, Math.floor(N_TAIL * (0.52 + 0.48 * frac)));
        const midIdx = Math.floor(endIdx * 0.5);
        const midNode = pts[N_BODY + midIdx];
        const endNode = pts[N_BODY + endIdx];
        const endPt = {
          x: lerp(endNode.x, edgeArr[endIdx].x, frac),
          y: lerp(endNode.y, edgeArr[endIdx].y, frac)
        };
        const ctrlPt = {
          x: lerp(midNode.x, edgeArr[midIdx].x, frac * 0.82),
          y: lerp(midNode.y, edgeArr[midIdx].y, frac * 0.82)
        };
        c.beginPath();
        c.moveTo(root.x, root.y);
        c.quadraticCurveTo(ctrlPt.x, ctrlPt.y, endPt.x, endPt.y);
        c.strokeStyle = `rgba(255, 253, 242, ${0.09 + 0.16 * (1 - frac * 0.6)})`;
        c.stroke();
      }
    }
  }

  function drawPairedFin(side, uRoot, isPectoral) {
    const f = fish;
    const depthScale = lerp(0.90, 1.04, f.z);
    const Ls = L * depthScale;
    const gillPulse = isPectoral ? Math.sin(f.gillPhase) * 0.025 : 0;
    const rootAnt = bodyPoint(uRoot + (isPectoral ? gillPulse * 0.1 : 0), side * 0.86);
    const rootPost = bodyPoint(uRoot + (isPectoral ? 0.075 : 0.052), side * 0.82);

    const state = isPectoral
      ? (side === 1 ? f.pecL : f.pecR)
      : { spread: 0.86, sweep: 0.24 + 0.08 * Math.sin(f.finPhase * 0.8 + side) };

    const finLen = Ls * (isPectoral ? 0.192 : 0.108) * state.spread;
    const finWidth = Ls * (isPectoral ? 0.126 : 0.072);

    const outX = rootAnt.nx * side;
    const outY = rootAnt.ny * side;
    const backX = -Math.cos(rootAnt.angle);
    const backY = -Math.sin(rootAnt.angle);

    const sweepAngle = (isPectoral ? 0.38 : 0.58) + state.sweep;
    const cosS = Math.cos(sweepAngle), sinS = Math.sin(sweepAngle);

    const leadTip = {
      x: rootAnt.x + (outX * cosS + backX * sinS) * finLen,
      y: rootAnt.y + (outY * cosS + backY * sinS) * finLen
    };

    const webFlutter = Math.sin(f.finPhase * 1.15 - side * 0.7) * Ls * 0.012;
    const trailTip = {
      x: leadTip.x + backX * finWidth * 0.92 - outX * finWidth * 0.28 + outX * webFlutter,
      y: leadTip.y + backY * finWidth * 0.92 - outY * finWidth * 0.28 + outY * webFlutter
    };

    const grad = c.createLinearGradient(rootAnt.x, rootAnt.y, trailTip.x, trailTip.y);
    grad.addColorStop(0.00, 'rgba(248, 245, 233, 0.94)');
    grad.addColorStop(0.32, 'rgba(242, 241, 228, 0.74)');
    grad.addColorStop(0.72, 'rgba(225, 235, 222, 0.34)');
    grad.addColorStop(1.00, 'rgba(205, 226, 214, 0.03)');

    c.beginPath();
    c.moveTo(rootAnt.x, rootAnt.y);
    c.quadraticCurveTo(
      lerp(rootAnt.x, leadTip.x, 0.55) + outX * finLen * 0.14 - backX * finLen * 0.08,
      lerp(rootAnt.y, leadTip.y, 0.55) + outY * finLen * 0.14 - backY * finLen * 0.08,
      leadTip.x, leadTip.y
    );
    c.bezierCurveTo(
      leadTip.x + outX * finWidth * 0.12 + backX * finWidth * 0.42,
      leadTip.y + outY * finWidth * 0.12 + backY * finWidth * 0.42,
      trailTip.x + outX * finWidth * 0.18,
      trailTip.y + outY * finWidth * 0.18,
      trailTip.x, trailTip.y
    );
    c.quadraticCurveTo(
      lerp(trailTip.x, rootPost.x, 0.5) + backX * finWidth * 0.15,
      lerp(trailTip.y, rootPost.y, 0.5) + backY * finWidth * 0.15,
      rootPost.x, rootPost.y
    );
    c.closePath();
    c.fillStyle = grad;
    c.fill();

    if (isPectoral) {
      c.beginPath();
      c.moveTo(rootAnt.x, rootAnt.y);
      c.quadraticCurveTo(
        lerp(rootAnt.x, leadTip.x, 0.55) + outX * finLen * 0.14 - backX * finLen * 0.08,
        lerp(rootAnt.y, leadTip.y, 0.55) + outY * finLen * 0.14 - backY * finLen * 0.08,
        leadTip.x, leadTip.y
      );
      c.lineWidth = Math.max(1.1, Ls * 0.0042);
      c.strokeStyle = 'rgba(252, 249, 236, 0.72)';
      c.stroke();
    }

    const rays = isPectoral ? 11 : 7;
    c.lineWidth = Math.max(0.4, Ls * 0.0012);
    for (let r = 1; r <= rays; r++) {
      const a = r / (rays + 1);
      const rEnd = {
        x: lerp(leadTip.x, trailTip.x, a),
        y: lerp(leadTip.y, trailTip.y, a)
      };
      const rRoot = {
        x: lerp(rootAnt.x, rootPost.x, a * 0.65),
        y: lerp(rootAnt.y, rootPost.y, a * 0.65)
      };
      c.beginPath();
      c.moveTo(rRoot.x, rRoot.y);
      c.quadraticCurveTo(
        lerp(rRoot.x, rEnd.x, 0.55) + outX * finLen * 0.08 * (1 - a),
        lerp(rRoot.y, rEnd.y, 0.55) + outY * finLen * 0.08 * (1 - a),
        rEnd.x, rEnd.y
      );
      c.strokeStyle = `rgba(255, 253, 242, ${0.09 + 0.16 * Math.sin(a * Math.PI)})`;
      c.stroke();
    }
  }

  function drawKoiBody() {
    const depthScale = lerp(0.90, 1.04, fish.z);
    const Ls = L * depthScale;

    traceBodyOutline();
    c.fillStyle = '#ebe8dc';
    c.fill();

    c.save();
    traceBodyOutline();
    c.clip();

    // Cylindrical 3D Flank Shading
    for (const side of [-1, 1]) {
      c.beginPath();
      for (let i = 0; i <= N_BODY; i++) {
        const q = bodyPoint(i / N_BODY, side * 1.02);
        if (i === 0) c.moveTo(q.x, q.y);
        else c.lineTo(q.x, q.y);
      }
      for (let i = N_BODY; i >= 0; i--) {
        const q = bodyPoint(i / N_BODY, side * 0.42);
        c.lineTo(q.x, q.y);
      }
      c.closePath();
      c.fillStyle = 'rgba(58, 76, 68, 0.16)';
      c.fill();

      c.beginPath();
      for (let i = 0; i <= N_BODY; i++) {
        const q = bodyPoint(i / N_BODY, side * 1.02);
        if (i === 0) c.moveTo(q.x, q.y);
        else c.lineTo(q.x, q.y);
      }
      for (let i = N_BODY; i >= 0; i--) {
        const q = bodyPoint(i / N_BODY, side * 0.72);
        c.lineTo(q.x, q.y);
      }
      c.closePath();
      c.fillStyle = 'rgba(28, 44, 40, 0.18)';
      c.fill();
    }

    // Cranial blush
    const headMid = bodyPoint(0.095, 0);
    const headBlush = c.createRadialGradient(headMid.x, headMid.y, 1, headMid.x, headMid.y, Ls * 0.095);
    headBlush.addColorStop(0, 'rgba(238, 198, 168, 0.28)');
    headBlush.addColorStop(1, 'rgba(238, 198, 168, 0)');
    c.fillStyle = headBlush;
    c.fillRect(headMid.x - Ls * 0.12, headMid.y - Ls * 0.12, Ls * 0.24, Ls * 0.24);

    // Kohaku Crimson-Vermilion (Hi) Markings
    for (const mark of hiMarkings) {
      const steps = 28;
      c.beginPath();
      for (let k = 0; k <= steps; k++) {
        const t = k / steps;
        const u = lerp(mark.uMin, mark.uMax, t);
        const v = mark.right(t);
        const pt = bodyPoint(u, v);
        if (k === 0) c.moveTo(pt.x, pt.y);
        else c.lineTo(pt.x, pt.y);
      }
      for (let k = steps; k >= 0; k--) {
        const t = k / steps;
        const u = lerp(mark.uMin, mark.uMax, t);
        const v = mark.left(t);
        const pt = bodyPoint(u, v);
        c.lineTo(pt.x, pt.y);
      }
      c.closePath();

      const centerU = (mark.uMin + mark.uMax) * 0.5;
      const centerPt = bodyPoint(centerU, 0);
      const rSpan = (mark.uMax - mark.uMin) * Ls * 0.92;
      const hiGrad = c.createRadialGradient(
        centerPt.x - Ls * 0.012, centerPt.y - Ls * 0.015, rSpan * 0.05,
        centerPt.x, centerPt.y, rSpan
      );
      hiGrad.addColorStop(0.00, '#f36838');
      hiGrad.addColorStop(0.48, '#e34e26');
      hiGrad.addColorStop(0.84, '#c93a1f');
      hiGrad.addColorStop(1.00, '#a82c19');
      c.fillStyle = hiGrad;
      c.fill();

      c.lineWidth = Math.max(0.65, Ls * 0.0022);
      c.strokeStyle = 'rgba(138, 34, 20, 0.28)';
      c.stroke();
    }

    // Scale Mesh
    c.lineWidth = Math.max(0.4, Ls * 0.0015);
    const scaleRadius = Ls * 0.016;
    for (let s = 0; s < scaleNodes.length; s++) {
      const sc = scaleNodes[s];
      const pt = bodyPoint(sc.u, sc.v);
      const fade = (1 - Math.abs(sc.v) * 0.68) * smooth(0.18, 0.26, sc.u) * (1 - smooth(0.84, 0.95, sc.u));
      c.beginPath();
      c.arc(pt.x, pt.y, scaleRadius * (0.65 + 0.35 * (1 - sc.u * 0.4)), pt.angle + Math.PI - 0.85, pt.angle + Math.PI + 0.85);
      c.strokeStyle = (sc.shimmerSeed % 5 === 0)
        ? `rgba(255, 255, 246, ${0.22 * fade})`
        : `rgba(42, 62, 54, ${0.13 * fade})`;
      c.stroke();
    }

    // Pearl dorsal sheen
    c.beginPath();
    for (let i = 3; i <= N_BODY - 3; i++) {
      const u = i / N_BODY;
      const w = 0.22 * Math.sin(u * Math.PI);
      const q = bodyPoint(u, w);
      if (i === 3) c.moveTo(q.x, q.y);
      else c.lineTo(q.x, q.y);
    }
    for (let i = N_BODY - 3; i >= 3; i--) {
      const u = i / N_BODY;
      const w = -0.22 * Math.sin(u * Math.PI);
      const q = bodyPoint(u, w);
      c.lineTo(q.x, q.y);
    }
    c.closePath();
    c.fillStyle = `rgba(255, 254, 245, ${0.11 + 0.09 * fish.z})`;
    c.fill();

    // Underwater Caustic Light Projected Directly onto the Koi's Back!
    const bodyCausticAlpha = smooth(0.95, 0.25, fish.z) * 0.16;
    if (bodyCausticAlpha > 0.01) {
      drawCausticNetwork(bodyCausticAlpha, bodyCausticAlpha * 0.75, 0.72);
    }

    // Depth submergence glaze: deeper water tints the koi with cool emerald-teal
    const submergence = clamp(1 - fish.z, 0, 1);
    if (submergence > 0.04) {
      c.fillStyle = `rgba(7, 40, 38, ${submergence * 0.31})`;
      c.fillRect(0, 0, W, H);
    }

    c.restore();

    traceBodyOutline();
    c.lineWidth = Math.max(0.65, Ls * 0.002);
    c.strokeStyle = `rgba(244, 242, 224, ${0.18 + 0.14 * fish.z})`;
    c.stroke();
  }

  function drawDorsalFin() {
    const depthScale = lerp(0.90, 1.04, fish.z);
    const Ls = L * depthScale;
    const iStart = Math.round(N_BODY * 0.33);
    const iEnd = Math.round(N_BODY * 0.74);
    const basePts = [];
    const crestPts = [];

    for (let i = iStart; i <= iEnd; i++) {
      const s = (i - iStart) / (iEnd - iStart);
      const node = fish.spine[i];
      const profileHeight = Math.pow(Math.sin(s * Math.PI), 0.72);
      const sway = node.dorsalOffset * (0.35 + 0.95 * profileHeight) + Ls * 0.018 * Math.sin(s * Math.PI) * clamp(fish.turnBank * 0.5, -1, 1);

      basePts.push({ x: node.x, y: node.y });
      crestPts.push({
        x: node.x + node.nx * sway - Math.cos(node.angle) * Ls * 0.018 * s,
        y: node.y + node.ny * sway - Math.sin(node.angle) * Ls * 0.018 * s
      });
    }

    c.beginPath();
    c.moveTo(basePts[0].x, basePts[0].y);
    for (let k = 0; k < crestPts.length; k++) {
      c.lineTo(crestPts[k].x, crestPts[k].y);
    }
    for (let k = basePts.length - 1; k >= 0; k--) {
      c.lineTo(basePts[k].x, basePts[k].y);
    }
    c.closePath();
    c.fillStyle = 'rgba(248, 245, 232, 0.42)';
    c.fill();

    c.lineWidth = Math.max(0.45, Ls * 0.0015);
    for (let k = 1; k < crestPts.length - 1; k += 2) {
      c.beginPath();
      c.moveTo(basePts[k].x, basePts[k].y);
      c.lineTo(crestPts[k].x, crestPts[k].y);
      c.strokeStyle = 'rgba(255, 253, 240, 0.26)';
      c.stroke();
    }

    c.beginPath();
    c.moveTo(crestPts[0].x, crestPts[0].y);
    for (let k = 1; k < crestPts.length; k++) {
      c.lineTo(crestPts[k].x, crestPts[k].y);
    }
    c.lineWidth = Math.max(0.85, Ls * 0.0028);
    c.strokeStyle = 'rgba(254, 252, 240, 0.58)';
    c.stroke();
  }

  function drawHeadAndFace() {
    const f = fish;
    const depthScale = lerp(0.90, 1.04, f.z);
    const Ls = L * depthScale;
    const gillFlare = 0.025 * Math.sin(f.gillPhase);

    for (const side of [-1, 1]) {
      const opTop = bodyPoint(0.165, side * 0.62);
      const opMid = bodyPoint(0.205, side * (0.86 + gillFlare));
      const opBot = bodyPoint(0.242, side * (0.94 + gillFlare));

      c.beginPath();
      c.moveTo(opTop.x, opTop.y);
      c.quadraticCurveTo(opMid.x, opMid.y, opBot.x, opBot.y);
      c.lineWidth = Math.max(0.65, Ls * 0.0026);
      c.strokeStyle = 'rgba(64, 78, 68, 0.34)';
      c.stroke();

      c.beginPath();
      c.moveTo(opMid.x, opMid.y);
      c.lineTo(opBot.x, opBot.y);
      c.lineWidth = Math.max(0.5, Ls * 0.0018);
      c.strokeStyle = 'rgba(255, 255, 242, 0.34)';
      c.stroke();

      const eye = bodyPoint(0.088, side * 0.78);
      const r = Ls * 0.0108;
      c.beginPath();
      c.arc(eye.x, eye.y, r * 1.42, 0, TAU);
      c.fillStyle = 'rgba(135, 108, 82, 0.32)';
      c.fill();

      c.beginPath();
      c.arc(eye.x, eye.y, r * 1.05, 0, TAU);
      c.fillStyle = '#26352b';
      c.fill();

      c.beginPath();
      c.arc(eye.x, eye.y, r * 0.72, 0, TAU);
      c.fillStyle = '#0f1918';
      c.fill();

      c.beginPath();
      c.arc(eye.x - r * 0.26, eye.y - r * 0.26, r * 0.28, 0, TAU);
      c.fillStyle = 'rgba(255, 255, 242, 0.95)';
      c.fill();

      const nostril = bodyPoint(0.042, side * 0.36);
      c.beginPath();
      c.ellipse(nostril.x, nostril.y, Ls * 0.0034, Ls * 0.0022, f.heading, 0, TAU);
      c.fillStyle = 'rgba(68, 80, 66, 0.45)';
      c.fill();

      const barbelRoot = bodyPoint(0.018, side * 0.56);
      const lag = side === 1 ? f.barbelL : f.barbelR;
      const bAngle = f.heading + side * 1.15 + lag;
      const bLen = Ls * 0.048;
      const bCtrl = {
        x: barbelRoot.x + barbelRoot.nx * side * bLen * 0.55,
        y: barbelRoot.y + barbelRoot.ny * side * bLen * 0.55
      };
      const bTip = {
        x: barbelRoot.x + Math.cos(bAngle) * bLen - Math.cos(f.heading) * bLen * 0.32,
        y: barbelRoot.y + Math.sin(bAngle) * bLen - Math.sin(f.heading) * bLen * 0.32
      };

      c.beginPath();
      c.moveTo(barbelRoot.x, barbelRoot.y);
      c.quadraticCurveTo(bCtrl.x, bCtrl.y, bTip.x, bTip.y);
      c.lineWidth = Math.max(0.65, Ls * 0.0024);
      c.lineCap = 'round';
      c.strokeStyle = 'rgba(246, 241, 222, 0.86)';
      c.stroke();
    }

    const mouthPulse = ((f.mode === 'inspect' || f.mode === 'wonder') ? 1.12 : 0.75) + 0.35 * Math.sin(f.gillPhase);
    const mouthPos = bodyPoint(0.004, 0);
    c.beginPath();
    c.ellipse(mouthPos.x, mouthPos.y, Ls * 0.0075 * mouthPulse, Ls * 0.013, f.heading, 0, TAU);
    c.fillStyle = 'rgba(105, 76, 68, 0.28)';
    c.fill();
  }

  // Renders the benthic pond bed, deep caustics, volumetric sunbeams, and deep wakes
  function drawDeepWaterAndWakes(dt) {
    c.drawImage(waterCanvas, 0, 0, W, H);

    // 1. Benthic Caustic Mesh shimmering across the river-stone pond floor
    drawCausticNetwork(0.11, 0.085, 1.05);

    // 2. Volumetric Tyndall Sunbeams slanting through the emerald water column
    c.save();
    c.globalCompositeOperation = 'screen';
    for (let b = 0; b < 3; b++) {
      const sway = Math.sin(now * (0.07 + b * 0.02) + b * 2.1) * W * 0.07;
      const bx = W * (0.24 + b * 0.24) + sway;
      const bw = W * (0.16 + b * 0.04);
      const beam = c.createLinearGradient(bx - bw, 0, bx + bw, H * 0.75);
      const peak = 0.018 + 0.008 * Math.sin(now * 0.23 + b);
      beam.addColorStop(0.00, 'rgba(165, 224, 198, 0)');
      beam.addColorStop(0.38, `rgba(165, 224, 198, ${peak})`);
      beam.addColorStop(0.62, `rgba(145, 212, 186, ${peak * 0.55})`);
      beam.addColorStop(1.00, 'rgba(145, 212, 186, 0)');
      c.fillStyle = beam;
      c.fillRect(0, 0, W, H);
    }
    c.restore();

    // 3. Deep suspended silt particles (below the koi's current depth z)
    for (let i = 0; i < particles.length; i++) {
      const pt = particles[i];
      if (pt.depth > fish.z) continue;
      c.beginPath();
      c.arc(pt.x, pt.y, pt.r, 0, TAU);
      c.fillStyle = `rgba(198, 224, 190, ${pt.depth * 0.095})`;
      c.fill();
    }

    // 4. Kármán Vortex Street Eddies & Crescent Shear Wakes
    for (let i = wakes.length - 1; i >= 0; i--) {
      const w = wakes[i];
      w.age += dt;
      if (w.age >= w.life) {
        wakes.splice(i, 1);
        continue;
      }
      w.x += w.vx * dt;
      w.y += w.vy * dt;
      w.vx *= Math.exp(-dt * 0.55);
      w.vy *= Math.exp(-dt * 0.55);
      w.angle += w.spin * dt * 0.35 * (1 - w.age / w.life);

      const u = w.age / w.life;
      const rad = w.r + Math.pow(u, 0.76) * L * 0.21;
      const alpha = Math.pow(1 - u, 2.1) * w.power;

      // Dark refractive trough arc
      c.beginPath();
      c.ellipse(w.x + 1.5, w.y + 2.0, rad, rad * 0.78, w.angle, -1.8, 1.8);
      c.lineWidth = 1.4;
      c.strokeStyle = `rgba(2, 16, 17, ${alpha * 0.22})`;
      c.stroke();

      // Luminous caustic vortex crescent + inner spiral shear ring
      for (let j = 0; j < 2; j++) {
        const rJ = rad * (j === 0 ? 1 : 0.68);
        const span = j === 0 ? 2.15 : 1.55;
        c.beginPath();
        c.ellipse(w.x, w.y, rJ, rJ * 0.78, w.angle + j * w.spin * 0.4, -span, span);
        c.lineWidth = j === 0 ? 0.95 : 0.65;
        c.strokeStyle = `rgba(182, 236, 212, ${alpha * (j === 0 ? 0.21 : 0.11)})`;
        c.stroke();
      }
    }
  }

  // Renders upper water column, Kelvin bow wakes, dispersive refractive ripples, and surface Fresnel reflection
  function drawSurfaceAndRipples(dt) {
    // 1. Upper water column particles (above the koi's depth z)
    for (let i = 0; i < particles.length; i++) {
      const pt = particles[i];
      if (pt.depth <= fish.z) continue;
      c.beginPath();
      c.arc(pt.x, pt.y, pt.r, 0, TAU);
      c.fillStyle = `rgba(224, 240, 208, ${pt.depth * 0.11})`;
      c.fill();
    }

    // 2. Kelvin V-Shaped Bow Wave & Shoulder Meniscus Trails
    for (let i = bowTrails.length - 1; i >= 0; i--) {
      const bt = bowTrails[i];
      bt.age += dt;
      if (bt.age >= bt.life) {
        bowTrails.splice(i, 1);
        continue;
      }
      const p = bt.age / bt.life;
      const spread = bt.spread + Math.pow(p, 0.82) * L * 0.22;
      const back = Math.pow(p, 0.85) * L * 0.18;
      const a = Math.pow(1 - p, 2) * bt.alpha;

      const cosA = Math.cos(bt.angle), sinA = Math.sin(bt.angle);
      const nx = -sinA, ny = cosA;
      const apexX = bt.x + cosA * L * 0.09 * (1 - p * 0.4);
      const apexY = bt.y + sinA * L * 0.09 * (1 - p * 0.4);
      const leftX = bt.x - cosA * back + nx * spread;
      const leftY = bt.y - sinA * back + ny * spread;
      const rightX = bt.x - cosA * back - nx * spread;
      const rightY = bt.y - sinA * back - ny * spread;

      c.beginPath();
      c.moveTo(leftX, leftY);
      c.quadraticCurveTo(apexX + nx * spread * 0.25, apexY + ny * spread * 0.25, apexX, apexY);
      c.quadraticCurveTo(apexX - nx * spread * 0.25, apexY - ny * spread * 0.25, rightX, rightY);
      c.lineWidth = 0.85;
      c.strokeStyle = `rgba(195, 240, 218, ${a})`;
      c.stroke();
    }

    // 3. Floating Surface Botanical Motes with Meniscus Rings
    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      const fade = smooth(0, 2.0, m.age) * smooth(0, 2.5, m.life - m.age);
      if (fade <= 0.01) continue;

      // Subtle shadow on water below mote
      c.beginPath();
      c.arc(m.x + 2, m.y + 3, m.r * 1.2, 0, TAU);
      c.fillStyle = `rgba(1, 12, 12, ${0.22 * fade})`;
      c.fill();

      // Surface tension meniscus ring
      const ringR = m.r * (2.6 + 0.6 * Math.sin(now * 1.8 + m.phase));
      c.beginPath();
      c.arc(m.x, m.y, ringR, 0, TAU);
      c.lineWidth = 0.55;
      c.strokeStyle = `rgba(212, 240, 220, ${0.15 * fade})`;
      c.stroke();

      // Warm organic speck
      c.beginPath();
      c.arc(m.x, m.y, m.r, 0, TAU);
      c.fillStyle = `${m.hue} ${0.66 * fade})`;
      c.fill();
    }

    // 4. Fine Surface Specular Glints & Overhead Canopy Reflection
    if (surfaceCanopyCanvas) {
      c.drawImage(surfaceCanopyCanvas, 0, 0, W, H);
    }
    drawCausticNetwork(0.032, 0.024, 1.42);

    // 5. Dispersive Refractive Surface Ripples (Dark Trough + Caustic Crest + Capillary Train)
    for (let i = ripples.length - 1; i >= 0; i--) {
      const rp = ripples[i];
      rp.age += dt;
      if (rp.age > 3.2) {
        ripples.splice(i, 1);
        continue;
      }
      for (let j = 0; j < rp.count; j++) {
        const ringAge = rp.age - j * 0.22;
        if (ringAge <= 0 || ringAge > 2.7) continue;
        const progress = ringAge / 2.7;
        const r = 4 + Math.pow(progress, 0.80) * rp.maxR;
        const a = Math.pow(1 - progress, 2.1) * rp.alpha;

        // Refractive dark trough ring (offset slightly toward top-left skylight)
        c.beginPath();
        c.ellipse(rp.x - 1.2, rp.y - 1.2, r * 0.97, r * 0.90, 0, 0, TAU);
        c.lineWidth = 1.35 - j * 0.2;
        c.strokeStyle = `rgba(2, 18, 19, ${a * 0.42})`;
        c.stroke();

        // Luminous focused caustic crest ring
        c.beginPath();
        c.ellipse(rp.x + 0.8, rp.y + 0.8, r, r * 0.93, 0, 0, TAU);
        c.lineWidth = 1.0 - j * 0.16;
        c.strokeStyle = `rgba(214, 246, 224, ${a})`;
        c.stroke();
      }
    }
  }

  function render(dt) {
    drawDeepWaterAndWakes(dt);

    for (fish of fishes) {
      drawShadow();
      drawPairedFin(-1, 0.53, false);
      drawPairedFin(1, 0.53, false);
      drawPairedFin(-1, 0.235, true);
      drawPairedFin(1, 0.235, true);
      drawTailFin();
      drawKoiBody();
      drawDorsalFin();
      drawHeadAndFace();
    }

    drawSurfaceAndRipples(dt);
  }

  function frame(ts) {
    const dt = paused ? 0 : Math.min(0.033, (ts - last) / 1000 || 0.016);
    last = ts;
    if (dt > 0) {
      now += dt;
      updateFluidParticles(dt);
      for (fish of fishes) {
        swim(dt);
        updateSpine(dt);
      }
    }
    render(dt);
    requestAnimationFrame(frame);
  }

  const pauseButton = document.getElementById('pause');
  const chrome = document.getElementById('chrome');

  function togglePause() {
    paused = !paused;
    pauseButton.setAttribute('aria-pressed', String(paused));
    pauseButton.setAttribute('aria-label', paused ? 'Resume animation' : 'Pause animation');
  }

  function toggleChrome() {
    hidden = !hidden;
    chrome.classList.toggle('is-hidden', hidden);
    chrome.style.pointerEvents = hidden ? 'none' : '';
  }

  pauseButton.addEventListener('click', togglePause);
  document.getElementById('hide').addEventListener('click', toggleChrome);

  function setTouchTarget(clientX, clientY, isMove = false) {
    const padX = Math.min(L * 0.20 + 20, W * 0.20);
    const padY = Math.min(L * 0.20 + 20, H * 0.20);
    const tx = clamp(clientX, padX, W - padX);
    const ty = clamp(clientY, padY, H - padY);
    target = { x: tx, y: ty, mode: 'seek', life: 35 };
    fish.mode = 'seek';

    const moveDist = Math.hypot(clientX - lastPointerX, clientY - lastPointerY);
    if (!isMove || moveDist > 26) {
      lastPointerX = clientX;
      lastPointerY = clientY;
      spawnRipple(clientX, clientY, isMove ? 52 : 86, isMove ? 0.22 : 0.36, isMove ? 2 : 3);
    }
  }

  cvs.addEventListener('pointerdown', (e) => {
    if (hidden) {
      toggleChrome();
      return;
    }
    pointerDown = true;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    setTouchTarget(e.clientX, e.clientY, false);
  });

  window.addEventListener('pointermove', (e) => {
    if (!pointerDown || hidden) return;
    setTouchTarget(e.clientX, e.clientY, true);
  }, { passive: true });

  window.addEventListener('pointerup', () => { pointerDown = false; }, { passive: true });
  window.addEventListener('pointercancel', () => { pointerDown = false; }, { passive: true });

  window.addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLButtonElement && (e.code === 'Space' || e.code === 'Enter')) return;
    if (e.code === 'Space') {
      e.preventDefault();
      togglePause();
    }
    if (e.key.toLowerCase() === 'h') toggleChrome();
  });

  window.addEventListener('resize', size, { passive: true });
  document.addEventListener('visibilitychange', () => { last = performance.now(); });

  if (reduced) {
    paused = true;
    pauseButton.setAttribute('aria-pressed', 'true');
    pauseButton.setAttribute('aria-label', 'Resume animation');
  }

  size();

  window.__koiStudy = {
    snapshot: () => ({
      x: fish.x,
      y: fish.y,
      z: fish.z,
      heading: fish.heading,
      speed: fish.speed,
      energy: fish.energy,
      phase: fish.phase,
      head: { x: fish.nose.x, y: fish.nose.y },
      tail: { x: fish.tail.x, y: fish.tail.y },
      mode: fish.mode,
      target: target ? { x: target.x, y: target.y, mode: target.mode } : null,
      fishCount: 1,
      moteCount: motes.length
    })
  };

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
