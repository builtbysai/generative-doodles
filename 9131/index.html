<body>

<div class="chrome" id="chrome">
  <header class="heading"><div class="stamp" aria-hidden="true"><span>鯉</span><span>泳</span></div><div><div class="folio">9131 &nbsp;/&nbsp; STUDY IN MOTION</div><h1>Koi</h1></div></header>

<script>
(() => {
  'use strict';
  const cvs=document.getElementById('water'), c=cvs.getContext('2d',{alpha:false});
  if(!c) return;
  const TAU=Math.PI*2, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
  const smooth=(a,b,x)=>{let t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
  const angleDiff=(a,b)=>Math.atan2(Math.sin(b-a),Math.cos(b-a));
  const rseed=(n)=>{let v=n>>>0;return()=>{v+=0x6D2B79F5;let t=v;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;};};
  const random=rseed(9131);
  const rand=(a,b)=>lerp(a,b,random());
  let W=0,H=0,DPR=1,L=350,water=null,now=0,last=0,paused=false,hidden=false,wakes=[],target=null,fish=null;
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function circuit(t){
    const portrait=W/H<.8;
    const rx=Math.min(W*(portrait?.31:.24),(W-L*(portrait?.62:.72))*.5);
    const ry=Math.min(H*.27,(H-L*.67)*.5);
    // Slow breathing asymmetry prevents a perfectly mechanical oval.
    const small=1 + .055*Math.sin(t*2.3+.6);
    return {x:W*.5+rx*Math.cos(t)*small,y:H*.52+ry*Math.sin(t)};
  }
  function makeFish(){
    const portrait=W/H<.8, initialT=portrait?5.55:5.15;
    const start=circuit(initialT),ahead=circuit(initialT+.01);
    const headX=start.x,headY=start.y,heading=Math.atan2(ahead.y-start.y,ahead.x-start.x);
    const history=[];
    for(let i=0;i<=120;i++){
      const d=-i*L/60;
      history.push({x:headX+d*Math.cos(heading),y:headY+d*Math.sin(heading),d});
    }
    fish={x:headX,y:headY,heading,speed:L*.24,omega:0,strokes:0,beat:0,
      phase:.7,energy:.7,finPhase:.2,tailAngle:0,headYaw:0,
      total:0,history,trackT:initialT,
      spine:[],points:[],nose:{x:headX,y:headY},tail:{x:0,y:0},
      lastHeading:heading};
    computeBody();
  }
  function size(){
    const oldW=W,oldH=H,oldL=L;
    W=window.innerWidth;H=window.innerHeight;
    DPR=Math.min(window.devicePixelRatio||1,W<700?1.8:1.4);
    cvs.width=Math.round(W*DPR); cvs.height=Math.round(H*DPR);
    c.setTransform(DPR,0,0,DPR,0,0);
    L=clamp(Math.min(W*.50,H*.43),170,380);
    if(!fish)makeFish();
    else {
      const k=L/oldL;
      const sx=W/oldW,sy=H/oldH;
      fish.x*=sx;fish.y*=sy;fish.speed*=k;
      fish.history=fish.history.map(v=>({x:v.x*sx,y:v.y*sy,d:v.d*k}));
      fish.total*=k;
      computeBody();
    }
    makeWater();
  }
  function makeWater(){
    const off=document.createElement('canvas');off.width=Math.ceil(W);off.height=Math.ceil(H);
    const g=off.getContext('2d');
    const grad=g.createLinearGradient(0,0,W,H);
    grad.addColorStop(0,'#092522'); grad.addColorStop(.34,'#113c37');grad.addColorStop(.67,'#14443d');grad.addColorStop(1,'#082e2c');
    g.fillStyle=grad; g.fillRect(0,0,W,H);
    let rg=g.createRadialGradient(W*.50,H*.42,0,W*.5,H*.5,Math.max(W,H)*.75);
    rg.addColorStop(0,'rgba(117,162,129,.12)');rg.addColorStop(.65,'rgba(22,54,47,.04)');rg.addColorStop(1,'rgba(0,9,8,.44)');
    g.fillStyle=rg;g.fillRect(0,0,W,H);
    const noise=rseed(46119);
    for(let i=0;i<Math.floor(W*H/230);i++){
      const x=noise()*W,y=noise()*H;
      g.fillStyle=`rgba(216,229,190,${.01+noise()*.025})`;
      g.fillRect(x,y,.5+noise()*1.1,.5+noise()*1.1);
    }
    water=off;
  }
  function swim(dt){
    const f=fish;
    if(target && target.life<=0)target=null;
    if(target)target.life-=dt;
    // The virtual guide only sets a broad swimming course; forward travel still
    // comes from actual caudal-stroke impulses and hydrodynamic drag below.
    const next=circuit(f.trackT+.014),current=circuit(f.trackT);
    const ds=Math.max(80,Math.hypot(next.x-current.x,next.y-current.y)/.014);
    f.trackT+=f.speed*dt/ds;
    let goal=circuit(f.trackT+.48);
    if(target){
      const m=Math.min(L*.33,W*.23);
      goal={x:clamp(target.x,m,W-m),y:clamp(target.y,m,H-m)};
      if(Math.hypot(f.x-goal.x,f.y-goal.y)<L*.38)target=null;
    }
    let desired=Math.atan2(goal.y-f.y,goal.x-f.x);
    // Firm recovery if an interaction pulls the fish close to the boundary.
    const near=Math.min(f.x,W-f.x,f.y,H-f.y);
    if(near<L*.22){
      const inward=Math.atan2(H*.52-f.y,W*.5-f.x);
      desired=f.heading+angleDiff(f.heading,inward)*smooth(L*.22,-L*.25,near);
    }
    let err=angleDiff(f.heading,desired);
    // Curved steering, not a heading snapped onto a spline.
    const turnDemand=clamp(err*1.35,-(W<700?1.02:.72),(W<700?1.02:.72));
    f.omega += (turnDemand-f.omega)*(1-Math.exp(-dt*2.65));
    f.heading += f.omega*dt;
    const turning=clamp(Math.abs(f.omega)/.92,0,1);

    // Each stroke supplies an impulse. Drag then slows the koi during a coast.
    // Two or three complete beats, followed by a shorter low-effort glide.
    f.strokes+=dt;
    const beatCycle=f.strokes%5.9;
    const burst=1-smooth(3.45,4.15,beatCycle)+smooth(5.55,5.9,beatCycle);
    const effort=clamp(burst*.79 + .12 + turning*.27 + (target?.life>0?.12:0),.13,1.14);
    f.energy+=(effort-f.energy)*(1-Math.exp(-dt*(effort>f.energy?2.1:3.8)));
    const beatsPerSecond=.88 + f.energy*.63 + turning*.10;
    const phaseBefore=f.phase;
    f.phase+=dt*TAU*beatsPerSecond;
    f.beat+=dt*beatsPerSecond;
    const cycleImpulse=Math.max(0,Math.sin(f.phase))**2;
    const accel=L*(.47*f.energy*f.energy*cycleImpulse + .065*f.energy) - f.speed*(.34 + .13*f.speed/L);
    f.speed=clamp(f.speed+accel*dt,L*.085,L*.50);
    // A mostly steady head, slight opposing yaw in response to the tail.
    f.headYaw=-Math.sin(f.phase-.7)*.017*f.energy;
    f.finPhase+=dt*TAU*(1.12 + turning*.35);
    f.x+=Math.cos(f.heading+f.headYaw)*f.speed*dt;
    f.y+=Math.sin(f.heading+f.headYaw)*f.speed*dt;

    const delta=Math.hypot(f.x-f.history[0].x,f.y-f.history[0].y);
    if(delta>.55){
      f.total+=delta;
      f.history.unshift({x:f.x,y:f.y,d:f.total});
    }
    const minimum=f.total-L*1.6;
    while(f.history.length>3&&f.history[f.history.length-2].d<minimum)f.history.pop();
    computeBody();

    // Water displaced at the tail alternates with the active half-strokes.
    if(Math.floor(phaseBefore/Math.PI)!==Math.floor(f.phase/Math.PI)&&f.energy>.3){
      const p=f.tail;
      wakes.push({x:p.x,y:p.y,age:0,life:1.9,r:7+L*.025,power:f.energy});
      if(wakes.length>12)wakes.shift();
    }
  }
  function sampleTrail(back){
    const h=fish.history, t=fish.total-back;
    let i=0;
    while(i<h.length-2&&h[i+1].d>t)i++;
    const a=h[i], b=h[Math.min(i+1,h.length-1)];
    const v=clamp((a.d-t)/Math.max(.00001,a.d-b.d),0,1);
    return {x:lerp(a.x,b.x,v),y:lerp(a.y,b.y,v)};
  }
  const widthKeys=[[0,.012],[.025,.038],[.065,.071],[.12,.109],[.21,.141],[.32,.148],[.42,.139],[.54,.118],[.67,.087],[.78,.057],[.88,.034],[.96,.018],[1,.014]];
  function widthAt(u){
    for(let i=0;i<widthKeys.length-1;i++)if(u<=widthKeys[i+1][0]){
      const a=widthKeys[i],b=widthKeys[i+1];return lerp(a[1],b[1],smooth(a[0],b[0],u));
    }
    return widthKeys[widthKeys.length-1][1];
  }
  function computeBody(){
    if(!fish)return;
    const f=fish, n=88;
    const raw=[];
    for(let i=0;i<=n;i++){
      const u=i/n,historyPoint=sampleTrail(L*u);
      const h=f.heading+f.headYaw;
      const straight={x:f.x-Math.cos(h)*L*u,y:f.y-Math.sin(h)*L*u};
      const follow=.48+.13*u;
      raw.push({x:lerp(straight.x,historyPoint.x,follow),y:lerp(straight.y,historyPoint.y,follow)});
    }
    const spine=[];
    for(let i=0;i<=n;i++){
      const u=i/n,prev=raw[Math.max(0,i-1)],next=raw[Math.min(n,i+1)];
      let tx=prev.x-next.x,ty=prev.y-next.y,mag=Math.hypot(tx,ty)||1;
      tx/=mag;ty/=mag;
      const envelope=Math.pow(u,1.83);
      // Traveling wave reaches its largest excursion near the narrow peduncle.
      const displacement=L*(.013+.101*f.energy)*envelope*Math.sin(f.phase-u*5.0);
      spine.push({x:raw[i].x-ty*displacement,y:raw[i].y+tx*displacement});
    }
    const points=[];
    for(let i=0;i<=n;i++){
      const p=spine[i],prev=spine[Math.max(0,i-1)],next=spine[Math.min(n,i+1)];
      let tx=prev.x-next.x,ty=prev.y-next.y,mag=Math.hypot(tx,ty)||1;
      tx/=mag;ty/=mag;
      points.push({x:p.x,y:p.y,nx:-ty,ny:tx,w:widthAt(i/n)*L});
    }
    f.points=points;f.nose=points[0];f.tail=points[n];
  }
  function p(u,v=0){
    const pts=fish.points;
    const ix=clamp(u,0,1)*(pts.length-1),i=Math.min(pts.length-2,Math.floor(ix)),t=ix-i;
    const a=pts[i],b=pts[i+1];
    const x=lerp(a.x,b.x,t),y=lerp(a.y,b.y,t);
    let nx=lerp(a.nx,b.nx,t),ny=lerp(a.ny,b.ny,t);const m=Math.hypot(nx,ny)||1;nx/=m;ny/=m;
    const w=widthAt(u)*L;
    return {x:x+nx*w*v,y:y+ny*w*v,nx,ny};
  }
  function traceBody(){
    c.beginPath(); const z=p(0,0);c.moveTo(z.x,z.y);
    for(let i=1;i<=88;i++){let q=p(i/88,1);c.lineTo(q.x,q.y);}
    for(let i=88;i>=0;i--){let q=p(i/88,-1);c.lineTo(q.x,q.y);}c.closePath();
  }
  function finishPath(path){c.beginPath();c.moveTo(path[0].x,path[0].y);for(let i=1;i<path.length;i++)c.lineTo(path[i].x,path[i].y);c.closePath();}
  function fin(side,u,phase,size=1){
    const root=p(u,side*.87),root2=p(u+.105,side*.83),L0=L;
    const flutter=Math.sin(phase)*.18+Math.sin(phase*.61+.6)*.08;
    const turning=clamp(fish.omega/1.1,-1,1);
    const spread=(u>.5?.107:.169)*size*(1+.34*flutter+turning*side*.23);
    const reach=(u>.5?.113:.142)*size;
    const outer={x:root.x+root.nx*side*spread*L0-root.ny*reach*L0*.62,
                 y:root.y+root.ny*side*spread*L0+root.nx*reach*L0*.62};
    // Backward tangent is (-normal.y, normal.x).
    const back={x:root.x-root.ny*reach*L0,y:root.y+root.nx*reach*L0};
    const gradient=c.createLinearGradient(root.x,root.y,outer.x,outer.y);
    gradient.addColorStop(0,'rgba(244,240,224,.92)');gradient.addColorStop(.43,'rgba(240,233,215,.62)');gradient.addColorStop(1,'rgba(222,225,212,.03)');
    c.beginPath();c.moveTo(root.x,root.y);
    c.bezierCurveTo(root.x+root.nx*side*spread*L0*.62,root.y+root.ny*side*spread*L0*.62,outer.x+root.ny*reach*L0*.15,outer.y-root.nx*reach*L0*.15,outer.x,outer.y);
    c.quadraticCurveTo(back.x+root.nx*side*spread*L0*.45,back.y+root.ny*side*spread*L0*.45,back.x,back.y);
    c.quadraticCurveTo(root2.x,root2.y,root.x,root.y);c.closePath();c.fillStyle=gradient;c.fill();
    c.strokeStyle='rgba(250,242,219,.2)';c.lineWidth=.7;c.stroke();
    for(let j=1;j<=12;j++){
      const a=j/13;
      const end={x:lerp(outer.x,back.x,a),y:lerp(outer.y,back.y,a)};
      c.beginPath();c.moveTo(root.x,root.y);
      c.quadraticCurveTo(lerp(root.x,end.x,.58)+root.nx*side*L*.013,lerp(root.y,end.y,.58)+root.ny*side*L*.013,end.x,end.y);
      c.strokeStyle=`rgba(255,250,236,${.09+.14*Math.sin(a*Math.PI)})`;
      c.lineWidth=Math.max(.45,L*.0014);c.stroke();
    }
  }
  function tailFin(){
    const root=p(.99,0),prev=p(.952,0),L0=L;
    const backX=root.x-prev.x, backY=root.y-prev.y;
    let mag=Math.hypot(backX,backY)||1,dx=backX/mag,dy=backY/mag;
    const nx=-dy,ny=dx;
    const flutter=Math.sin(fish.phase-4.9)*.10;
    const cs=Math.cos(flutter),sn=Math.sin(flutter);
    const v=(a,b)=>({x:root.x+dx*L0*a*cs+nx*L0*(b+sn*a),y:root.y+dy*L0*a*cs+ny*L0*(b+sn*a)});
    const tipTop=v(.225,-.179),tipBottom=v(.225,.179),notch=v(.100,0);
    const g=c.createLinearGradient(tipTop.x,tipTop.y,tipBottom.x,tipBottom.y);
    g.addColorStop(0,'rgba(239,234,215,.52)');g.addColorStop(.35,'rgba(250,246,226,.84)');g.addColorStop(.58,'rgba(247,243,223,.72)');g.addColorStop(1,'rgba(233,234,223,.22)');
    const upperShoulder=v(.105,-.045),innerUpper=v(.15,-.043),innerLower=v(.15,.043);
    c.beginPath();c.moveTo(root.x,root.y);
    let q=v(.17,-.133),q2=v(.222,-.18);
    c.bezierCurveTo(upperShoulder.x,upperShoulder.y,q.x,q.y,tipTop.x,tipTop.y);
    q=v(.183,-.142);q2=v(.159,-.069);
    c.bezierCurveTo(q.x,q.y,q2.x,q2.y,innerUpper.x,innerUpper.y);
    const valleyTop=v(.115,-.012);
    c.quadraticCurveTo(valleyTop.x,valleyTop.y,notch.x,notch.y);
    const valley=v(.115,.012);
    c.quadraticCurveTo(valley.x,valley.y,innerLower.x,innerLower.y);
    q=v(.159,.069);q2=v(.183,.142);
    c.bezierCurveTo(q.x,q.y,q2.x,q2.y,tipBottom.x,tipBottom.y);
    q=v(.17,.133);
    const lowerShoulder=v(.105,.045);
    c.bezierCurveTo(q.x,q.y,lowerShoulder.x,lowerShoulder.y,root.x,root.y);
    c.closePath();c.fillStyle=g;c.fill();
    c.lineWidth=Math.max(.6,L*.0016);c.strokeStyle='rgba(248,244,227,.31)';c.stroke();
    for(const side of [-1,1])for(let i=1;i<=15;i++){
      const t=i/16;const end=v(.13+.085*t,side*.174*t);
      c.beginPath();c.moveTo(root.x,root.y);
      const a=v(.12,side*.055*t);c.quadraticCurveTo(a.x,a.y,end.x,end.y);
      c.lineWidth=Math.max(.4,L*.00125);c.strokeStyle=`rgba(255,253,240,${.08+.16*(1-t)})`;c.stroke();
    }
  }
  const patterns=[
    {u:.073,v:.03,rx:.075,ry:.85,seed:1},
    {u:.285,v:-.05,rx:.091,ry:.94,seed:2},
    {u:.502,v:.12,rx:.086,ry:.99,seed:3},
    {u:.724,v:-.04,rx:.088,ry:.87,seed:4},
    {u:.870,v:.14,rx:.033,ry:.59,seed:5}
  ];
  function hiPatch(mark){
    const N=100,shape=[];
    for(let j=0;j<=N;j++){
      const a=j/N*TAU;
      const noise=1+.115*Math.sin(a*5+mark.seed*1.3)+.072*Math.sin(a*9-mark.seed*2.1)+.035*Math.cos(a*17+mark.seed*5.8);
      const u=clamp(mark.u+Math.cos(a)*mark.rx*noise,.009,.974);
      const v=mark.v+Math.sin(a)*mark.ry*noise;
      shape.push(p(u,v));
    }
    finishPath(shape);
    const mid=p(mark.u,mark.v*.45);
    const grad=c.createRadialGradient(mid.x-L*.015,mid.y-L*.025,2,mid.x,mid.y,L*mark.rx*1.75);
    grad.addColorStop(0,'#f16b3a');grad.addColorStop(.45,'#e6532a');grad.addColorStop(.82,'#d54126');grad.addColorStop(1,'#b93521');
    c.fillStyle=grad;c.fill();
    c.lineWidth=Math.max(.6,L*.0018);c.strokeStyle='rgba(131,37,26,.22)';c.stroke();
  }
  function koiBody(){
    traceBody();
    const grad=c.createLinearGradient(0,0,W,H);
    // Body luminance is painted using lateral bands following the moving spine.
    c.fillStyle='#e7e4d7';c.fill();
    c.save();traceBody();c.clip();
    for(let i=0;i<56;i++){
      const u=i/56,q=p(u,0),w=widthAt(u)*L;
      const a=p(u,1),b=p(u,-1);
      let g=c.createLinearGradient(a.x,a.y,b.x,b.y);
      g.addColorStop(0,'rgba(66,81,75,.31)');g.addColorStop(.15,'rgba(204,209,195,.27)');
      g.addColorStop(.42,'rgba(255,255,246,.65)');g.addColorStop(.6,'rgba(255,253,241,.54)');g.addColorStop(.86,'rgba(172,188,175,.21)');g.addColorStop(1,'rgba(74,83,75,.29)');
      const u2=Math.min(1,(i+1)/56),s=p(u2,1),t=p(u2,-1);
      c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.lineTo(t.x,t.y);c.lineTo(s.x,s.y);c.closePath();c.fillStyle=g;c.fill();
    }
    for(const mark of patterns)hiPatch(mark);
    drawScales();
    c.restore();
    traceBody();c.lineWidth=Math.max(.65,L*.0019);c.strokeStyle='rgba(245,242,220,.25)';c.stroke();
  }
  function drawScales(){
    c.lineWidth=Math.max(.38,L*.00155);
    for(let i=0;i<27;i++){
      const u=.18+i*.026;
      for(let j=-5;j<=5;j++){
        const v=(j+(i%2)*.5)*.16;
        if(Math.abs(v)>.91)continue;
        const a=p(u,v-.046),m=p(u+.012,v),b=p(u,v+.046);
        c.beginPath();c.moveTo(a.x,a.y);c.quadraticCurveTo(m.x,m.y,b.x,b.y);
        c.strokeStyle=(i+j)%7===0?'rgba(255,255,248,.26)':'rgba(53,70,60,.14)';c.stroke();
      }
    }
    for(let i=0;i<65;i++){
      const u=.17+((i*17)%69)*.0105,v=Math.sin(i*41.2)*.83;
      const q=p(u,v);
      c.beginPath();c.ellipse(q.x,q.y,L*.0024,L*.00115,0,0,TAU);
      c.fillStyle=`rgba(255,255,246,${.075+.09*(.5+.5*Math.sin(i*4.3+now*.6))})`;c.fill();
    }
  }
  function drawDorsal(){
    // Fine low dorsal ridge, bent with the spine, restrained in a top view.
    const path=[];
    for(let i=0;i<=20;i++){
      const u=lerp(.38,.70,i/20),q=p(u,-.045);
      path.push(q);
    }
    c.beginPath();c.moveTo(path[0].x,path[0].y);for(let i=1;i<path.length;i++)c.lineTo(path[i].x,path[i].y);
    c.strokeStyle='rgba(224,224,205,.19)';c.lineWidth=Math.max(.5,L*.004);c.lineCap='round';c.stroke();
    c.strokeStyle='rgba(105,115,100,.14)';c.lineWidth=Math.max(.3,L*.0013);c.stroke();
  }
  function face(){
    for(const side of [-1,1]){
      let a=p(.18,side*.74),b=p(.248,side*.86),mid=p(.214,side*.53);
      c.beginPath();c.moveTo(a.x,a.y);c.quadraticCurveTo(mid.x,mid.y,b.x,b.y);
      c.lineWidth=Math.max(.55,L*.0027);c.strokeStyle='rgba(107,102,86,.34)';c.stroke();
      const eye=p(.098,side*.82),r=L*.011;
      c.beginPath();c.arc(eye.x,eye.y,r*1.38,0,TAU);c.fillStyle='rgba(135,112,92,.35)';c.fill();
      c.beginPath();c.arc(eye.x,eye.y,r,0,TAU);c.fillStyle='#1b2824';c.fill();
      c.beginPath();c.arc(eye.x-r*.28,eye.y-r*.3,r*.27,0,TAU);c.fillStyle='#fffdf1';c.fill();
      const whisk=p(.018,side*.43);
      c.beginPath();c.moveTo(whisk.x,whisk.y);
      c.quadraticCurveTo(whisk.x+whisk.nx*side*L*.024,whisk.y+whisk.ny*side*L*.024,
         whisk.x+whisk.nx*side*L*.046-Math.cos(fish.heading)*L*.015,
         whisk.y+whisk.ny*side*L*.046-Math.sin(fish.heading)*L*.015);
      c.lineWidth=Math.max(.55,L*.0024);c.strokeStyle='rgba(252,242,220,.88)';c.stroke();
    }
    let m=p(.009,0);
    c.beginPath();c.ellipse(m.x,m.y,L*.009,L*.015,fish.heading,0,TAU);
    c.fillStyle='rgba(106,81,74,.24)';c.fill();
    c.strokeStyle='rgba(237,228,213,.4)';c.lineWidth=.7;c.stroke();
  }
  function drawShadow(){
    c.save();c.translate(11,20);
    traceBody();c.fillStyle='rgba(0,10,11,.15)';c.shadowColor='rgba(0,10,11,.35)';c.shadowBlur=L*.12;c.fill();
    c.restore();
  }
  function drawKoi(){
    drawShadow();
    tailFin();
    for(const side of [-1,1]){
      fin(side,.70,fish.finPhase*.79+side*1.1,.83);
      fin(side,.255,fish.finPhase+side*.8,1);
    }
    koiBody();drawDorsal();face();
  }
  function drawWakes(dt){
    for(let i=wakes.length-1;i>=0;i--){
      const w=wakes[i];w.age+=dt;if(w.age>=w.life){wakes.splice(i,1);continue;}
      const u=w.age/w.life;
      c.beginPath();c.ellipse(w.x,w.y,w.r+u*L*.16,(w.r+u*L*.16)*.7,0,0,TAU);
      c.lineWidth=1;c.strokeStyle=`rgba(178,219,194,${(1-u)*(1-u)*w.power*.17})`;c.stroke();
    }
  }
  function render(dt){
    c.drawImage(water,0,0,W,H);
    // The only surrounding detail is the water disturbed by the fish itself.
    const q=fish.nose;
    let shine=c.createRadialGradient(q.x-L*.18,q.y-L*.30,0,q.x,q.y,L*1.12);
    shine.addColorStop(0,'rgba(157,206,167,.035)');shine.addColorStop(1,'rgba(157,206,167,0)');
    c.fillStyle=shine;c.fillRect(0,0,W,H);
    drawWakes(dt);
    drawKoi();
  }
  function frame(ts){
    const dt=paused?0:Math.min(.035,(ts-last)/1000||.016);last=ts;
    if(dt){now+=dt;swim(dt);}
    render(dt);requestAnimationFrame(frame);
  }
  const pauseButton=document.getElementById('pause'),chrome=document.getElementById('chrome');
  function togglePause(){paused=!paused;pauseButton.setAttribute('aria-pressed',String(paused));pauseButton.setAttribute('aria-label',paused?'Resume animation':'Pause animation');}
  function toggleChrome(){hidden=!hidden;chrome.classList.toggle('is-hidden',hidden);chrome.style.pointerEvents=hidden?'none':'';}
  pauseButton.addEventListener('click',togglePause);
  document.getElementById('hide').addEventListener('click',toggleChrome);
  cvs.addEventListener('pointerdown',e=>{if(hidden){toggleChrome();return;}target={x:e.clientX,y:e.clientY,life:10};});
  window.addEventListener('keydown',e=>{
    if(e.target instanceof HTMLButtonElement&&(e.code==='Space'||e.code==='Enter'))return;
    if(e.code==='Space'){e.preventDefault();togglePause();}
    if(e.key.toLowerCase()==='h')toggleChrome();
  });
  window.addEventListener('resize',size,{passive:true});
  document.addEventListener('visibilitychange',()=>{last=performance.now();});
  if(reduced){paused=true;pauseButton.setAttribute('aria-pressed','true');pauseButton.setAttribute('aria-label','Resume animation');}
  size();
  window.__koiStudy={snapshot:()=>({x:fish.x,y:fish.y,heading:fish.heading,speed:fish.speed,energy:fish.energy,
      phase:fish.phase,head:{x:fish.nose.x,y:fish.nose.y},tail:{x:fish.tail.x,y:fish.tail.y},
      fishCount:1,leafCount:0})};
  requestAnimationFrame(frame);
})();
</script>
</body>
