<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.392 The Secret Life of the Still Life</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F3EBDD; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.392 The Secret Life of the Still Life (maryna-lagereva).
// After Maryna Lagereva's still life doctrine: a watercolor
// still life of pears and a squash on a wooden table that is
// quietly alive. The pears lean toward each other like
// conspirators on a slow rock, the squash stem curls and
// uncurls, a tiny beetle crosses the table once a minute, and
// flat stepped window-light bands drift across the backdrop.
// DRAG near a pear and it leans toward the pointer, springing
// back to exactly its ambient lean on release. There are no
// faces on the fruit; the life is in the lean. Her doctrine
// line is lettered small at the bottom, the piece's designed
// text under the batch's text exception, and the only text in
// the piece. Palette is closed at the seven specced hexes.
// All scatter is fixed seeded data baked at load; one canvas,
// no offscreen canvas, no gradients, no filters, no
// shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PEAR = '#A8B85C', BLUSH = '#C9A24A', SQUASH = '#D98E32';
var TABLE = '#C9A875', SHADOW = '#5B7A99', BACK = '#F3EBDD';
var INK = '#3A2E2A';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 60;
if (LOOP !== 60) throw new Error('Still Life loop must be 60s');
var ROCK_P = 20; // 3 whole pear-rock cycles per loop
if (LOOP % ROCK_P !== 0) throw new Error('pear rock must complete whole cycles per loop');
var STEM_P = 30; // 2 whole stem curl cycles per loop
if (LOOP % STEM_P !== 0) throw new Error('stem curl must complete whole cycles per loop');
var LIGHT_P = 30; // 2 whole light drifts per loop
if (LOOP % LIGHT_P !== 0) throw new Error('light drift must complete whole cycles per loop');
var TICK = 1 / 60;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every random-looking
// value is baked from this at load and never changes
// between frames or renders.
var seed = 392;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// Paper and tabletop speckle: fixed tiny ink dots at low
// alpha, the watercolor paper feel.
var SPECKS = [];
(function () {
  var i;
  for (i = 0; i < 120; i++) {
    SPECKS.push({ x: rnd() * DW, y: rnd() * DH, r: 0.8 + rnd() * 1.4 });
  }
  if (SPECKS.length !== 120) throw new Error('still life needs its speckle table');
})();

// ---- the pears ------------------------------------------
// Three pears in a left cluster, each rotating about its
// base point on the table. Ambient rock is plus/minus 2
// degrees on the 20s period, phases staggered so that at
// frame one all three lean in toward the cluster, mid-
// conspiracy. drag.lean is the spring-driven extra lean
// the pointer earns; it settles to exactly zero, so a
// released pear returns to exactly its ambient lean.
var PEARS = [
  { x: 336, y: 650, s: 1.02, ph: Math.PI,         lean: 0, vel: 0, leaf: true,  freck: [] },
  { x: 458, y: 658, s: 0.90, ph: 0,               lean: 0, vel: 0, leaf: false, freck: [] },
  { x: 240, y: 664, s: 0.80, ph: Math.PI * 1.5,   lean: 0, vel: 0, leaf: false, freck: [] }
];
(function () {
  var i, j;
  for (i = 0; i < PEARS.length; i++) {
    for (j = 0; j < 6; j++) {
      PEARS[i].freck.push({ x: (rnd() - 0.5) * 72, y: -18 - rnd() * 112, r: 1.1 + rnd() * 1.3 });
    }
  }
  if (PEARS.length !== 3) throw new Error('still life needs exactly 3 pears');
})();

function pearPath() {
  ctx.beginPath();
  ctx.moveTo(0, -186);
  ctx.bezierCurveTo(14, -172, 26, -148, 30, -120);
  ctx.bezierCurveTo(36, -84, 60, -70, 60, -30);
  ctx.bezierCurveTo(60, 4, 32, 8, 0, 8);
  ctx.bezierCurveTo(-32, 8, -60, 4, -60, -30);
  ctx.bezierCurveTo(-60, -70, -36, -84, -30, -120);
  ctx.bezierCurveTo(-26, -148, -14, -172, 0, -186);
  ctx.closePath();
}

function drawPear(p, t) {
  var rock = 2 * Math.sin(Math.PI * 2 * t / ROCK_P + p.ph);
  var total = (rock + p.lean) * Math.PI / 180;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(total);
  ctx.scale(p.s, p.s);
  // Wash layer 1: the full silhouette.
  ctx.fillStyle = PEAR;
  ctx.globalAlpha = 0.92;
  pearPath();
  ctx.fill();
  // Wash layer 2: the same silhouette drawn in at 0.88
  // about the heart of the fruit, so the rim stays
  // lighter and the colour pools toward the middle.
  ctx.save();
  ctx.translate(0, -84);
  ctx.scale(0.88, 0.88);
  ctx.translate(0, 84);
  ctx.globalAlpha = 0.5;
  pearPath();
  ctx.fill();
  ctx.restore();
  // The blush cheek, low on the sun side.
  ctx.fillStyle = BLUSH;
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.ellipse(25, -50, 19, 26, -0.3, 0, Math.PI * 2);
  ctx.fill();
  // A dry light spot high on the shoulder, in the
  // backdrop tone.
  ctx.fillStyle = BACK;
  ctx.globalAlpha = 0.3;
  ctx.beginPath();
  ctx.ellipse(-23, -122, 10, 22, 0.35, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  // Freckles, fixed per pear.
  ctx.fillStyle = INK;
  ctx.globalAlpha = 0.16;
  for (var i = 0; i < p.freck.length; i++) {
    ctx.beginPath();
    ctx.arc(p.freck[i].x, p.freck[i].y, p.freck[i].r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Pooled edge: a band of the pear's own colour drawn
  // heavier along the outline, then the ink line.
  ctx.strokeStyle = PEAR;
  ctx.globalAlpha = 0.4;
  ctx.lineWidth = 5;
  pearPath();
  ctx.stroke();
  ctx.strokeStyle = INK;
  ctx.globalAlpha = 0.22;
  ctx.lineWidth = 1.6;
  pearPath();
  ctx.stroke();
  ctx.globalAlpha = 1;
  // Stem, ink, with a shorter second pass for taper.
  ctx.strokeStyle = INK;
  ctx.lineCap = 'round';
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(0, -182);
  ctx.quadraticCurveTo(3, -202, 13, -216);
  ctx.stroke();
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(6, -200);
  ctx.quadraticCurveTo(9, -208, 13, -216);
  ctx.stroke();
  // One leaf on the tallest pear, in the pear green.
  if (p.leaf) {
    ctx.fillStyle = PEAR;
    ctx.beginPath();
    ctx.moveTo(4, -206);
    ctx.quadraticCurveTo(26, -222, 44, -214);
    ctx.quadraticCurveTo(28, -200, 4, -206);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// ---- the squash -----------------------------------------
// Right of the table, one ribbed squash. Its stem curls
// and uncurls on the 30s cycle: the curl parameter k runs
// 0 (stem leaning open) to 1 (tip hooked down and in),
// and the stem path interpolates between the two poses.
var SQUASH_POS = { x: 908, y: 668 };

function squashPath() {
  ctx.beginPath();
  ctx.moveTo(-118, -46);
  ctx.bezierCurveTo(-118, -96, -60, -118, 0, -118);
  ctx.bezierCurveTo(60, -118, 118, -96, 118, -46);
  ctx.bezierCurveTo(118, -8, 60, 4, 0, 4);
  ctx.bezierCurveTo(-60, 4, -118, -8, -118, -46);
  ctx.closePath();
}

function drawSquash(t) {
  ctx.save();
  ctx.translate(SQUASH_POS.x, SQUASH_POS.y);
  // Wash layer 1.
  ctx.fillStyle = SQUASH;
  ctx.globalAlpha = 0.92;
  squashPath();
  ctx.fill();
  // Wash layer 2, drawn in about the heart.
  ctx.save();
  ctx.translate(0, -56);
  ctx.scale(0.9, 0.86);
  ctx.translate(0, 56);
  ctx.globalAlpha = 0.5;
  squashPath();
  ctx.fill();
  ctx.restore();
  // Ribs: soft ink curves running top to bottom.
  ctx.strokeStyle = INK;
  ctx.globalAlpha = 0.15;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  var ribs = [-80, -40, 0, 40, 80];
  for (var i = 0; i < ribs.length; i++) {
    var rx = ribs[i];
    ctx.beginPath();
    ctx.moveTo(rx * 0.32, -112);
    ctx.quadraticCurveTo(rx * 1.04, -58, rx * 0.8, -6);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // Pooled edge and ink line.
  ctx.strokeStyle = SQUASH;
  ctx.globalAlpha = 0.4;
  ctx.lineWidth = 5;
  squashPath();
  ctx.stroke();
  ctx.strokeStyle = INK;
  ctx.globalAlpha = 0.22;
  ctx.lineWidth = 1.6;
  squashPath();
  ctx.stroke();
  ctx.globalAlpha = 1;
  // The stem, curling on the 30s cycle: a short stalk
  // whose tip travels from leaning open (right, high)
  // to hooked down and in (left, low) as k runs 0 to 1.
  var k = 0.5 - 0.5 * Math.cos(Math.PI * 2 * t / STEM_P);
  var mx = 4 + (-6 - 4) * k, my = -132 + (-130 + 132) * k;
  var c2x = 12 + (-18 - 12) * k, c2y = -142 + (-136 + 142) * k;
  var tipX = 26 + (-10 - 26) * k, tipY = -144 + (-116 + 144) * k;
  ctx.strokeStyle = INK;
  ctx.lineCap = 'round';
  ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(0, -108);
  ctx.quadraticCurveTo(-1, -122, mx, my);
  ctx.quadraticCurveTo(c2x, c2y, tipX, tipY);
  ctx.stroke();
  ctx.lineWidth = 4.5;
  ctx.beginPath();
  ctx.moveTo(1, -114);
  ctx.quadraticCurveTo(0, -124, mx, my);
  ctx.quadraticCurveTo(c2x, c2y, tipX, tipY);
  ctx.stroke();
  ctx.restore();
}

// ---- the table ------------------------------------------
// Table line in the lower third: top surface from the
// back edge at y 585 to the front edge at y 706, a front
// face below, wood grain as faint wavy ink strokes.
function drawTable() {
  // Top surface.
  ctx.fillStyle = TABLE;
  ctx.beginPath();
  ctx.moveTo(-60, 585);
  ctx.lineTo(1340, 585);
  ctx.lineTo(1292, 706);
  ctx.lineTo(-12, 706);
  ctx.closePath();
  ctx.fill();
  // Grain on the top.
  ctx.strokeStyle = INK;
  ctx.globalAlpha = 0.08;
  ctx.lineWidth = 2;
  var gy = [618, 652, 684];
  for (var i = 0; i < gy.length; i++) {
    ctx.beginPath();
    ctx.moveTo(-40, gy[i]);
    ctx.bezierCurveTo(360, gy[i] - 5, 760, gy[i] + 5, 1320, gy[i] - 3);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // Front face, shaded with a flat ink wash step.
  ctx.fillStyle = TABLE;
  ctx.beginPath();
  ctx.moveTo(-12, 706);
  ctx.lineTo(1292, 706);
  ctx.lineTo(1292, 764);
  ctx.lineTo(-12, 764);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = INK;
  ctx.globalAlpha = 0.07;
  ctx.fillRect(-12, 706, 1304, 58);
  ctx.globalAlpha = 1;
  // The table edge line.
  ctx.strokeStyle = INK;
  ctx.globalAlpha = 0.25;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-12, 706);
  ctx.lineTo(1292, 706);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // Soft shadow the table throws on the ground below.
  ctx.fillStyle = SHADOW;
  ctx.globalAlpha = 0.08;
  ctx.beginPath();
  ctx.ellipse(640, 782, 470, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

// ---- window light ---------------------------------------
// Flat stepped-alpha bands in the blush tone, slanted
// like light through a window, drifting sideways on the
// 30s cycle. The drift travels exactly one band spacing
// per cycle, so the pattern wraps seamlessly. Drawn over
// the backdrop only, behind the table and fruit.
var BAND_SPACING = 560;
function drawLight(t) {
  var off = ((t % LIGHT_P) / LIGHT_P) * BAND_SPACING;
  var steps = [ [320, 0.05], [220, 0.07], [130, 0.1] ];
  ctx.fillStyle = BLUSH;
  // Backdrop only: the bands stop at the table's back
  // edge and never cross the table or the caption.
  ctx.save();
  ctx.beginPath();
  ctx.rect(-100, -100, DW + 200, 685);
  ctx.clip();
  for (var i = 0; i < 5; i++) {
    var cx = -500 + i * BAND_SPACING + off;
    for (var j = 0; j < steps.length; j++) {
      var w = steps[j][0];
      ctx.globalAlpha = steps[j][1];
      ctx.beginPath();
      ctx.moveTo(cx - w / 2 + 45, -80);
      ctx.lineTo(cx + w / 2 + 45, -80);
      ctx.lineTo(cx + w / 2 - 45, 980);
      ctx.lineTo(cx - w / 2 - 45, 980);
      ctx.closePath();
      ctx.fill();
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

// The blue shadow the arrangement casts on the backdrop:
// stepped flat ellipses in the shadow blue, low alpha.
function drawBackdropShadow() {
  var steps = [ [520, 220, 0.03], [400, 168, 0.035], [290, 124, 0.04] ];
  ctx.fillStyle = SHADOW;
  for (var i = 0; i < steps.length; i++) {
    ctx.globalAlpha = steps[i][2];
    ctx.beginPath();
    ctx.ellipse(620, 360, steps[i][0], steps[i][1], 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// Contact shadows where the fruit meets the table.
function drawFruitShadows() {
  ctx.fillStyle = SHADOW;
  var i, p;
  for (i = 0; i < PEARS.length; i++) {
    p = PEARS[i];
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 5, 68 * p.s, 11, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 0.32;
  ctx.beginPath();
  ctx.ellipse(SQUASH_POS.x, SQUASH_POS.y + 5, 122, 13, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

// ---- the beetle -----------------------------------------
// One crossing per 60s loop, starting at a fixed phase:
// the beetle enters at loop time 8s and walks a straight
// line along the front of the tabletop for 20s, then is
// gone until the next loop. Its six legs run a 3-frame
// cycle stepped on fixed ticks of the piece clock.
var BEETLE_START = 8, BEETLE_LEN = 20;
function drawBeetle(t) {
  var lt = t % LOOP;
  if (lt < BEETLE_START || lt >= BEETLE_START + BEETLE_LEN) return;
  var p = (lt - BEETLE_START) / BEETLE_LEN;
  var x = -50 + p * 1380;
  var y = 690;
  // Its own small shadow.
  ctx.fillStyle = SHADOW;
  ctx.globalAlpha = 0.25;
  ctx.beginPath();
  ctx.ellipse(x, y + 9, 20, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  // Legs: three pairs, alternating swing by frame.
  var frame = Math.floor(t * 6) % 3;
  var swing = [-1, 0, 1][frame];
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  var offs = [-9, 0, 9];
  for (var i = 0; i < 3; i++) {
    var sw = swing * (i % 2 === 0 ? 1 : -1) * 5;
    ctx.beginPath(); // near leg
    ctx.moveTo(x + offs[i], y + 2);
    ctx.lineTo(x + offs[i] + sw - 2, y + 13);
    ctx.stroke();
    ctx.beginPath(); // far leg
    ctx.moveTo(x + offs[i], y + 2);
    ctx.lineTo(x + offs[i] - sw + 2, y + 13);
    ctx.stroke();
  }
  // Body and head.
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.ellipse(x, y, 17, 9.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + 19, y + 1, 5.5, 0, Math.PI * 2);
  ctx.fill();
  // Shell groove, in the backdrop tone.
  ctx.strokeStyle = BACK;
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(x - 14, y);
  ctx.lineTo(x + 12, y);
  ctx.stroke();
  ctx.globalAlpha = 1;
  // Antennae.
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(x + 23, y - 2);
  ctx.quadraticCurveTo(x + 29, y - 6, x + 33, y - 5);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + 23, y + 3);
  ctx.quadraticCurveTo(x + 29, y + 6, x + 33, y + 7);
  ctx.stroke();
}

// ---- the doctrine line ----------------------------------
// Her caption doctrine, lettered small at the bottom in
// a serif face, ink on the backdrop. The only text in
// the piece, by the batch's designed-text exception.
var DOCTRINE = 'If your pictures do not tell a story, they are worthless.';
function drawDoctrine() {
  ctx.fillStyle = INK;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'italic 30px Georgia, "Times New Roman", serif';
  ctx.globalAlpha = 0.9;
  ctx.fillText(DOCTRINE, DW / 2, 850);
  ctx.globalAlpha = 1;
}

// ---- motion state ---------------------------------------
// Constant first-frame phase: T = 12.5s into the 60s
// loop. The three pears sit mid-conspiracy, leaning in
// toward the cluster; the stem is most of the way into
// a curl; the beetle is a fifth of the way across the
// table. Frame one is drawn synchronously at this
// constant; the rAF loop advances T from the same
// anchor in fixed ticks. Frame one never reads a
// wall clock.
var T = 12.5;
var lastNow = -1, acc = 0;

// ---- drag: the still life notices you -------------------
// While the pointer is down, any pear whose heart is
// within 230 design px leans toward the pointer: the
// target extra lean follows the pointer's sideways
// offset from the pear's base, clamped at 9 degrees.
// Springs integrate on fixed ticks; on release the
// target returns to zero and the spring settles the
// extra lean to exactly zero, leaving exactly the
// ambient rock.
var dragging = false;
var ptrX = -9999, ptrY = -9999;
function step() {
  for (var i = 0; i < PEARS.length; i++) {
    var p = PEARS[i];
    var target = 0;
    if (dragging) {
      var dx = ptrX - p.x;
      var dy = ptrY - (p.y - 95 * p.s);
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 230) {
        target = dx * 0.055;
        if (target > 9) target = 9;
        if (target < -9) target = -9;
      }
    }
    var accS = (target - p.lean) * 120 - p.vel * 14;
    p.vel += accS * TICK;
    p.lean += p.vel * TICK;
    if (!dragging && Math.abs(target) === 0 && Math.abs(p.lean) < 0.001 && Math.abs(p.vel) < 0.001) {
      p.lean = 0;
      p.vel = 0;
    }
  }
}

function draw() {
  ctx.fillStyle = BACK;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);
  drawBackdropShadow();
  drawLight(T);
  drawTable();
  drawFruitShadows();
  for (var i = 0; i < PEARS.length; i++) drawPear(PEARS[i], T);
  drawSquash(T);
  drawBeetle(T);
  // Speckle over the scene, faintest last touch.
  ctx.fillStyle = INK;
  ctx.globalAlpha = 0.04;
  for (var j = 0; j < SPECKS.length; j++) {
    ctx.beginPath();
    ctx.arc(SPECKS[j].x, SPECKS[j].y, SPECKS[j].r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawDoctrine();
}

// ---- pointer --------------------------------------------
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  ptrX = p.x; ptrY = p.y;
  dragging = true;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  ptrX = p.x; ptrY = p.y;
});
function endDrag() { dragging = false; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', endDrag);

// ---- sizing: centred fit, page ground = backdrop tone ---
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
