<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fly the Camera Move</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07080B;
  }
  canvas {
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="piece"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('piece');
  var ctx = canvas.getContext('2d');

  var VOID = '#07080B';
  var ORB = '#CFE8FF';
  var BAR = '#2A2E35';
  var BODY = '#101114';
  var DOT = '#FFFFFF';
  var CONE = '#9FD8FF';
  var TRACE = '#4FF2E0';

  var TRACE_FADE = 10;      // seconds for the flown trace to evaporate
  var HOLD_A = 0.9;         // hold between record pass and playback pass
  var HOLD_B = 1.6;         // hold at the end of the two-pass cycle
  var PROFILE_A = 0.25;     // accel / decel fraction of each pass

  var W = 0;
  var H = 0;
  var DPR = 1;
  var isPhone = false;

  var setSeed = 10730917;
  var orbs = [];
  var bars = [];

  var move = null;
  var flight = { start: 0 };
  var START_T = 0;          // set after the initial move is built

  var startStamp = 0;
  if (typeof performance !== 'undefined' && performance && typeof performance.now === 'function') {
    startStamp = performance.now();
  }

  var drag = { active: false, authoring: false, points: [], startX: 0, startY: 0, startElapsed: 0, freezeElapsed: 0, clicked: false };
  var pendingTap = null;
  var audio = null;
  var lastPassKey = null;

  function clamp(v, a, b) {
    return v < a ? a : (v > b ? b : v);
  }

  function mod(v, n) {
    return ((v % n) + n) % n;
  }

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- velocity profile: accelerate, hold, decelerate (never linear) ----
  // Integral of the smootherstep ramp; peak factor vp makes total distance 1.
  var VP = 1 / (1 - PROFILE_A);

  function smoother(x) {
    x = clamp(x, 0, 1);
    return x * x * x * (x * (x * 6 - 15) + 10);
  }

  function smootherInt(x) {
    x = clamp(x, 0, 1);
    return x * x * x * x * (2.5 - 3 * x + x * x);
  }

  function profile(q) {
    var a = PROFILE_A;
    if (q < a) return VP * a * smootherInt(q / a);
    if (q > 1 - a) return 1 - VP * a * smootherInt((1 - q) / a);
    return VP * (q - 0.5 * a);
  }

  function profileRate(q) {
    var a = PROFILE_A;
    if (q < a) return VP * smoother(q / a);
    if (q > 1 - a) return VP * smoother((1 - q) / a);
    return VP;
  }

  // ---- the set: sparse orbs and light-bars in the lower two-thirds ----
  function makeSet() {
    var rand = mulberry32(setSeed);
    var i;
    orbs = [];
    bars = [];
    for (i = 0; i < 7; i++) {
      orbs.push({
        x: 0.08 + rand() * 0.84,
        y: 0.40 + rand() * 0.53,
        r: 0.010 + rand() * 0.018
      });
    }
    for (i = 0; i < 6; i++) {
      var vertical = rand() < 0.3;
      bars.push({
        x: 0.07 + rand() * 0.80,
        y: 0.44 + rand() * 0.50,
        len: 0.10 + rand() * 0.20,
        th: 0.006 + rand() * 0.006,
        vertical: vertical
      });
    }
  }

  // ---- a move: closed Catmull-Rom loop, arc-length sampled ----
  function buildMove(ctrl) {
    var n = ctrl.length;
    var pts = [];
    var i;
    var j;
    for (i = 0; i < n; i++) {
      var p0 = ctrl[(i + n - 1) % n];
      var p1 = ctrl[i];
      var p2 = ctrl[(i + 1) % n];
      var p3 = ctrl[(i + 2) % n];
      var SEG = 160;
      for (j = 0; j < SEG; j++) {
        var t = j / SEG;
        var t2 = t * t;
        var t3 = t2 * t;
        pts.push({
          x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
          y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
        });
      }
    }
    var cum = [0];
    var total = 0;
    for (i = 1; i <= pts.length; i++) {
      var a = pts[i - 1];
      var b = pts[i % pts.length];
      total += Math.sqrt((b.x - a.x) * (b.x - a.x) + (b.y - a.y) * (b.y - a.y));
      cum.push(total);
    }
    return {
      pts: pts,
      cum: cum,
      total: total,
      passDur: clamp(total / 0.16, 7, 13)
    };
  }

  function initialMove() {
    return buildMove([
      { x: 0.50, y: 0.90 },
      { x: 0.34, y: 0.82 },
      { x: 0.20, y: 0.62 },
      { x: 0.22, y: 0.42 },
      { x: 0.38, y: 0.30 },
      { x: 0.60, y: 0.27 },
      { x: 0.79, y: 0.38 },
      { x: 0.83, y: 0.60 },
      { x: 0.70, y: 0.79 }
    ]);
  }

  function movePos(mv, dist) {
    var cum = mv.cum;
    var pts = mv.pts;
    var n = pts.length;
    var d = mod(dist, mv.total);
    var lo = 0;
    var hi = n;
    while (lo < hi) {
      var mid = (lo + hi) >> 1;
      if (cum[mid + 1] < d) lo = mid + 1;
      else hi = mid;
    }
    var i = lo;
    var segLen = cum[i + 1] - cum[i];
    var f = segLen > 0 ? (d - cum[i]) / segLen : 0;
    var a = pts[i];
    var b = pts[(i + 1) % n];
    var dx = b.x - a.x;
    var dy = b.y - a.y;
    var mag = Math.sqrt(dx * dx + dy * dy) || 1;
    return {
      x: a.x + dx * f,
      y: a.y + dy * f,
      hx: dx / mag,
      hy: dy / mag
    };
  }

  // ---- flight timeline: record pass, hold, playback pass, hold, repeat ----
  function phaseInfo(ct) {
    var P = move.passDur;
    var C = 2 * P + HOLD_A + HOLD_B;
    var c = mod(ct, C);
    if (c < P) return { kind: 'pass', pass: 0, q: c / P, cycle: Math.floor(ct / C) };
    if (c < P + HOLD_A) return { kind: 'hold', pass: 0, q: 1, cycle: Math.floor(ct / C) };
    if (c < 2 * P + HOLD_A) return { kind: 'pass', pass: 1, q: (c - P - HOLD_A) / P, cycle: Math.floor(ct / C) };
    return { kind: 'hold', pass: 1, q: 1, cycle: Math.floor(ct / C) };
  }

  function posAtElapsed(e) {
    var ct = e - flight.start;
    var ph = phaseInfo(ct);
    var p;
    var speed = 0;
    if (ph.kind === 'pass') {
      var u = profile(ph.q);
      p = movePos(move, u * move.total);
      speed = (move.total / move.passDur) * profileRate(ph.q);
    } else {
      p = movePos(move, 0);
    }
    return { x: p.x, y: p.y, hx: p.hx, hy: p.hy, speed: speed, pass: ph.pass, kind: ph.kind, cycle: ph.cycle };
  }

  function elapsedNow() {
    if (typeof performance !== 'undefined' && performance && typeof performance.now === 'function') {
      return Math.max(0, (performance.now() - startStamp) / 1000);
    }
    return 0;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = (vv && vv.width) ? vv.width : window.innerWidth;
    var h = (vv && vv.height) ? vv.height : window.innerHeight;
    var sw = (window.screen && window.screen.width) ? window.screen.width : w;
    var sh = (window.screen && window.screen.height) ? window.screen.height : h;
    W = Math.max(1, Math.round(w));
    H = Math.max(1, Math.round(h));
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    isPhone = Math.min(sw, sh) < 700 || (Math.min(sw, sh) >= 700 && H > W * 1.15);
  }

  function toScreen(nx, ny, geom) {
    return { x: geom.ox + nx * geom.unit, y: geom.oy + ny * geom.unit };
  }

  // ---- audio: lazy, gesture-gated, silent before the first touch ----
  function initAudio() {
    var AC;
    if (audio) {
      if (audio.ctx && typeof audio.ctx.resume === 'function') audio.ctx.resume();
      return;
    }
    AC = window.AudioContext || window.webkitAudioContext;
    if (typeof AC !== 'function') return;
    try {
      var ac = new AC();
      var master = ac.createGain();
      master.gain.value = 0.8;
      master.connect(ac.destination);
      var osc = ac.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.value = 48;
      var filter = ac.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 260;
      var gain = ac.createGain();
      gain.gain.value = 0;
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(master);
      osc.start();
      audio = { ctx: ac, master: master, osc: osc, gain: gain };
    } catch (err) {
      audio = null;
    }
  }

  function blip(freq, dur, peak, type) {
    if (!audio || !audio.ctx) return;
    try {
      var ac = audio.ctx;
      var o = ac.createOscillator();
      var g = ac.createGain();
      var t0 = ac.currentTime;
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g);
      g.connect(audio.master);
      o.start(t0);
      o.stop(t0 + dur + 0.05);
    } catch (err) {}
  }

  function updateAudio(speedNorm, flying) {
    if (!audio || !audio.ctx) return;
    try {
      audio.osc.frequency.value = 44 + speedNorm * 42;
      audio.gain.gain.value = flying ? 0.012 + speedNorm * 0.008 : 0.004;
    } catch (err) {
      audio = null;
    }
  }

  // ---- drawing ----
  function drawSet(geom) {
    var i;
    var p;
    ctx.fillStyle = BAR;
    ctx.globalAlpha = 1;
    for (i = 0; i < bars.length; i++) {
      var b = bars[i];
      p = toScreen(b.x, b.y, geom);
      if (b.vertical) {
        ctx.fillRect(p.x - b.th * geom.unit / 2, p.y, b.th * geom.unit, b.len * geom.unit);
      } else {
        ctx.fillRect(p.x, p.y - b.th * geom.unit / 2, b.len * geom.unit, b.th * geom.unit);
      }
    }
    for (i = 0; i < orbs.length; i++) {
      var o = orbs[i];
      p = toScreen(o.x, o.y, geom);
      var r = o.r * geom.unit;
      ctx.fillStyle = ORB;
      ctx.globalAlpha = 0.07;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 3.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.16;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r * 1.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawTrace(geom, now) {
    var from = Math.max(flight.start, now - TRACE_FADE);
    var step = 0.045;
    var samples = [];
    var tau;
    for (tau = from; tau < now; tau += step) {
      samples.push({ p: posAtElapsed(tau), age: now - tau });
    }
    samples.push({ p: posAtElapsed(now), age: 0 });
    if (samples.length < 2) return;
    var pass;
    var i;
    var a;
    var b;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = TRACE;
      ctx.lineWidth = pass === 0 ? Math.max(2.5, geom.unit * 0.010) : Math.max(1.3, geom.unit * 0.0032);
      for (i = 1; i < samples.length; i++) {
        a = toScreen(samples[i - 1].p.x, samples[i - 1].p.y, geom);
        b = toScreen(samples[i].p.x, samples[i].p.y, geom);
        var fade = 1 - samples[i].age / TRACE_FADE;
        ctx.globalAlpha = (pass === 0 ? 0.14 : 0.9) * fade * fade;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawAuthoring(geom) {
    if (!drag.authoring || drag.points.length < 2) return;
    var i;
    var p;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = TRACE;
      ctx.globalAlpha = pass === 0 ? 0.16 : 0.9;
      ctx.lineWidth = pass === 0 ? Math.max(2.5, geom.unit * 0.010) : Math.max(1.3, geom.unit * 0.0032);
      ctx.beginPath();
      for (i = 0; i < drag.points.length; i++) {
        p = toScreen(drag.points[i].x, drag.points[i].y, geom);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawDrone(geom, st) {
    var c = toScreen(st.x, st.y, geom);
    var s = geom.unit * (isPhone ? 0.062 : 0.052);
    var ang = Math.atan2(st.hy, st.hx);
    var i;
    ctx.save();
    ctx.translate(c.x, c.y);

    // view cone: layered flat alpha, no gradients
    ctx.fillStyle = CONE;
    ctx.globalAlpha = 0.10;
    ctx.beginPath();
    ctx.moveTo(s * 0.2, 0);
    ctx.arc(0, 0, geom.unit * 0.32, ang - 0.34, ang + 0.34);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 0.25;
    ctx.beginPath();
    ctx.moveTo(s * 0.2, 0);
    ctx.arc(0, 0, geom.unit * 0.30, ang - 0.26, ang + 0.26);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.rotate(ang);
    // rotor blur discs
    ctx.fillStyle = CONE;
    for (i = 0; i < 4; i++) {
      var sx = (i % 2 === 0 ? -1 : 1) * s * 0.62;
      var sy = (i < 2 ? -1 : 1) * s * 0.62;
      ctx.globalAlpha = 0.10;
      ctx.beginPath();
      ctx.arc(sx, sy, s * 0.36, 0, Math.PI * 2);
      ctx.fill();
    }
    // arms
    ctx.strokeStyle = BODY;
    ctx.globalAlpha = 1;
    ctx.lineWidth = s * 0.17;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-s * 0.62, -s * 0.62);
    ctx.lineTo(s * 0.62, s * 0.62);
    ctx.moveTo(-s * 0.62, s * 0.62);
    ctx.lineTo(s * 0.62, -s * 0.62);
    ctx.stroke();
    // rotor hubs
    ctx.fillStyle = BODY;
    for (i = 0; i < 4; i++) {
      var rx = (i % 2 === 0 ? -1 : 1) * s * 0.62;
      var ry = (i < 2 ? -1 : 1) * s * 0.62;
      ctx.beginPath();
      ctx.arc(rx, ry, s * 0.27, 0, Math.PI * 2);
      ctx.fill();
    }
    // center body
    ctx.beginPath();
    ctx.moveTo(s * 0.52, 0);
    ctx.lineTo(0, s * 0.42);
    ctx.lineTo(-s * 0.52, 0);
    ctx.lineTo(0, -s * 0.42);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = CONE;
    ctx.globalAlpha = 0.40;
    ctx.lineWidth = Math.max(1, geom.unit * 0.0016);
    ctx.stroke();
    ctx.globalAlpha = 1;
    // camera dot
    ctx.fillStyle = DOT;
    ctx.beginPath();
    ctx.arc(s * 0.17, 0, s * 0.115, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawAt(elapsed) {
    var now = drag.authoring ? drag.freezeElapsed : elapsed;
    var st = posAtElapsed(now);
    var geom = {
      unit: Math.min(W, H),
      ox: (W - Math.min(W, H)) / 2,
      oy: (H - Math.min(W, H)) / 2
    };

    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    ctx.fillStyle = VOID;
    ctx.fillRect(0, 0, W, H);

    drawSet(geom);
    drawTrace(geom, now);
    drawAuthoring(geom);
    drawDrone(geom, st);

    // confirm tone when the playback pass begins (audio exists only after a gesture)
    var key = st.cycle * 4 + st.pass * 2 + (st.kind === 'pass' ? 1 : 0);
    if (lastPassKey !== null && key !== lastPassKey && st.kind === 'pass' && st.pass === 1) {
      blip(740, 0.16, 0.05, 'sine');
    }
    lastPassKey = key;

    var peak = (move.total / move.passDur) * VP;
    updateAudio(peak > 0 ? st.speed / peak : 0, st.kind === 'pass');
  }

  // ---- interaction ----
  function eventPoint(e) {
    var rect = { left: 0, top: 0 };
    if (typeof canvas.getBoundingClientRect === 'function') rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX || 0) - rect.left,
      y: (e.clientY || 0) - rect.top
    };
  }

  function toNorm(px, py) {
    var unit = Math.min(W, H);
    return {
      x: (px - (W - unit) / 2) / unit,
      y: (py - (H - unit) / 2) / unit
    };
  }

  function restartFlight() {
    flight.start = elapsedNow();
    lastPassKey = null;
  }

  function registerTap() {
    var elapsed = elapsedNow();
    if (pendingTap && elapsed - pendingTap.elapsed < 0.36) {
      if (pendingTap.timer) clearTimeout(pendingTap.timer);
      pendingTap = null;
      setSeed = (Math.imul(setSeed, 1664525) + 1013904223) >>> 0;
      makeSet();
      return;
    }
    pendingTap = { elapsed: elapsed, timer: null };
    if (typeof setTimeout === 'function') {
      pendingTap.timer = setTimeout(function () {
        pendingTap = null;
        restartFlight();
        blip(1500, 0.05, 0.05, 'triangle');
      }, 335);
    } else {
      pendingTap = null;
      restartFlight();
    }
  }

  function onPointerDown(e) {
    var p = eventPoint(e);
    initAudio();
    drag.active = true;
    drag.authoring = false;
    drag.clicked = false;
    drag.points = [];
    drag.startX = p.x;
    drag.startY = p.y;
    drag.startElapsed = elapsedNow();
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (e.preventDefault) e.preventDefault();
  }

  function onPointerMove(e) {
    if (!drag.active) return;
    var p = eventPoint(e);
    if (!drag.authoring) {
      if (Math.abs(p.x - drag.startX) > 9 || Math.abs(p.y - drag.startY) > 9) {
        drag.authoring = true;
        drag.freezeElapsed = elapsedNow();
        drag.points.push(toNorm(drag.startX, drag.startY));
        blip(1500, 0.05, 0.05, 'triangle');
      } else {
        return;
      }
    }
    var np = toNorm(p.x, p.y);
    var last = drag.points[drag.points.length - 1];
    if (!last || Math.abs(np.x - last.x) > 0.012 || Math.abs(np.y - last.y) > 0.012) {
      drag.points.push(np);
    }
    if (e.preventDefault) e.preventDefault();
  }

  function pathLength(points) {
    var total = 0;
    var i;
    for (i = 1; i < points.length; i++) {
      var dx = points[i].x - points[i - 1].x;
      var dy = points[i].y - points[i - 1].y;
      total += Math.sqrt(dx * dx + dy * dy);
    }
    return total;
  }

  function onPointerUp(e) {
    if (!drag.active) return;
    var wasAuthoring = drag.authoring;
    var points = drag.points;
    drag.active = false;
    drag.authoring = false;
    drag.points = [];
    if (wasAuthoring) {
      if (points.length >= 4 && pathLength(points) >= 0.15) {
        move = buildMove(points);
        restartFlight();
      }
    } else if (elapsedNow() - drag.startElapsed < 0.35) {
      registerTap();
    }
    if (e.preventDefault) e.preventDefault();
  }

  function onPointerCancel() {
    drag.active = false;
    drag.authoring = false;
    drag.points = [];
  }

  if (window.visualViewport && typeof window.visualViewport.addEventListener === 'function') {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', resize);
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerCancel);
  }

  makeSet();
  move = initialMove();
  START_T = 5.2;
  flight.start = -START_T;
  resize();
  if (typeof performance !== 'undefined' && performance && typeof performance.now === 'function') {
    startStamp = performance.now();
  }
  drawAt(0);

  var raf = null;
  if (typeof window.requestAnimationFrame === 'function') raf = window.requestAnimationFrame;
  else if (typeof requestAnimationFrame === 'function') raf = requestAnimationFrame;

  function loop() {
    drawAt(elapsedNow());
    if (raf) raf(loop);
  }
  if (raf) raf(loop);
})();
</script>
</body>
</html>
