<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.232 Parsing the Lingo</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B2A5B; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.232 Parsing the Lingo (Matthew Kluber). After the 2019 work:
// wide horizontal bands of turquoise and chartreuse, darker blue
// vertical sections at the left and right fifths, and at the centre
// a large rectangle of ninety fine horizontal lines, alternating
// blue and green on deep blue, an optical field that suggests data
// visualisation. This is the one Kluber the viewer disturbs: a drag
// across the fine field kicks the line segments near the finger and
// scrambles them locally; a spring damper then relaxes every line
// back to order over about four seconds. The piece heals itself.
// At rest a faint data shimmer runs through the lines. No click
// action at all, nothing reloads, nothing clears.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var TURQ = '#3FD8C7', CHART = '#D8F34E', DBLUE = '#123C8C';
var FIELD = '#0B2A5B', LINE_A = '#1E6FEB', LINE_B = '#35D07F';
var W = 0, H = 0, phone = false;
var T = 3.2, lastNow = -1; // frame one: field at rest, shimmer already running

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// wide band layout: seeded heights, alternating turquoise / chartreuse
var BANDS = [];
(function () {
  var rnd = mulberry32(232);
  var y = 0, i = 0;
  while (y < 1) {
    var h = 0.05 + rnd() * 0.09;
    if (y + h > 1) h = 1 - y;
    BANDS.push({ y: y, h: h, color: (i % 2 === 0) ? TURQ : CHART });
    y += h; i++;
  }
})();

// the fine field: NL lines x NP points, vertical displacement physics
var NL = 90, NP = 60;
var off = new Float32Array(NL * NP);
var vel = new Float32Array(NL * NP);

function panel() {
  var pw = W * (phone ? 1 : 0.94);
  var ph = pw / 2;
  if (ph > H * 0.94) { ph = H * 0.94; pw = ph * 2; }
  return { x: (W - pw) / 2, y: (H - ph) / 2, w: pw, h: ph };
}
function fieldRect(p) {
  return {
    x: p.x + p.w * 0.2 + p.w * 0.022,
    y: p.y + p.h * 0.10,
    w: p.w * 0.6 - p.w * 0.044,
    h: p.h * 0.80
  };
}

function stepPhysics(dt) {
  // spring damper: stiffness 22, damping 1.5 -> visible wobble, settled in ~4s
  var K = 22, C = 1.5, i, n = NL * NP;
  for (i = 0; i < n; i++) {
    var a = -K * off[i] - C * vel[i];
    vel[i] += a * dt;
    off[i] += vel[i] * dt;
  }
}

function draw() {
  ctx.fillStyle = FIELD;
  ctx.fillRect(0, 0, W, H);
  var p = panel();
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x, p.y, p.w, p.h); ctx.clip();
  // wide bands, full panel
  for (var b = 0; b < BANDS.length; b++) {
    ctx.fillStyle = BANDS[b].color;
    ctx.fillRect(p.x, p.y + BANDS[b].y * p.h, p.w, BANDS[b].h * p.h + 1);
  }
  // vertical dark blue sections, left and right fifths
  ctx.fillStyle = DBLUE;
  ctx.fillRect(p.x, p.y, p.w * 0.2, p.h);
  ctx.fillRect(p.x + p.w * 0.8, p.y, p.w * 0.2, p.h);
  // one thin turquoise divider inside each blue section
  ctx.fillStyle = TURQ;
  ctx.fillRect(p.x + p.w * 0.128, p.y, Math.max(2, p.w * 0.006), p.h);
  ctx.fillRect(p.x + p.w * 0.866, p.y, Math.max(2, p.w * 0.006), p.h);
  // the fine-line field
  var f = fieldRect(p);
  ctx.fillStyle = FIELD;
  ctx.fillRect(f.x, f.y, f.w, f.h);
  var lw = Math.max(1, f.h / NL * 0.42);
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  var shimAmp = f.h * 0.0022;
  for (var i = 0; i < NL; i++) {
    var ry = f.y + f.h * (i + 0.5) / NL;
    ctx.strokeStyle = (i % 2 === 0) ? LINE_A : LINE_B;
    ctx.beginPath();
    for (var j = 0; j < NP; j++) {
      var rx = f.x + f.w * j / (NP - 1);
      var o = off[i * NP + j];
      var shim = shimAmp * Math.sin(j * 0.55 + i * 0.32 + T * 2.1) * Math.sin(T * 0.7 + i * 0.13);
      var y = ry + o + shim;
      if (j === 0) ctx.moveTo(rx, y); else ctx.lineTo(rx, y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drag to disturb (no click action) ---------------------------------------------------
var dragging = false, lastPX = 0, lastPY = 0;
function kick(cx, cy, vy) {
  var p = panel();
  var f = fieldRect(p);
  var R = p.h * 0.22, R2 = R * R;
  for (var i = 0; i < NL; i++) {
    var ry = f.y + f.h * (i + 0.5) / NL;
    if (Math.abs(ry - cy) > R) continue;
    for (var j = 0; j < NP; j++) {
      var rx = f.x + f.w * j / (NP - 1);
      var dx = rx - cx, dy = ry - cy;
      var d2 = dx * dx + dy * dy;
      if (d2 < R2) {
        var fall = 1 - Math.sqrt(d2) / R;
        var nv = vel[i * NP + j] + (vy * 5 + dy * 0.3) * fall;
        vel[i * NP + j] = Math.max(-260, Math.min(260, nv));
      }
    }
  }
}
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; lastPX = e.clientX; lastPY = e.clientY;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var vy = e.clientY - lastPY;
  kick(e.clientX, e.clientY, vy);
  lastPX = e.clientX; lastPY = e.clientY;
});
canvas.addEventListener('pointerup', function () { dragging = false; });
canvas.addEventListener('pointercancel', function () { dragging = false; });

// ---- frame --------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.033, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  if (dt > 0) stepPhysics(dt);
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
