<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flat-Lay Bestiary</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F2D8D5; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- palette (strict) ----------
  var PINK = '#F2D8D5';
  var INK = '#1A1A1A';
  var PAPER = '#FAF7F0';
  var GRAY = '#9A9A98';
  var ORANGE = '#E09A5A';
  var SHADOW = 'rgba(26,26,26,0.15)';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var SEED = 608073;
  var texRng = mulberry32(SEED);        // paper texture layout
  var hopRng = mulberry32(SEED + 17);   // hop scheduling choices
  var stirRng = mulberry32(SEED + 41);  // drag-stir scatter choices

  // ---------- viewport ----------
  var W = 0, H = 0, DPR = 1;
  function fit() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }
  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width; sh = window.screen.height;
    }
    if (Math.min(sw, sh) < 700) return true;
    // aspect fallback only
    return H > W * 1.15 && Math.min(W, H) < 700;
  }

  // ---------- paper texture (precomputed, fraction space) ----------
  var patches = [];   // soft tonal patchiness: big translucent ellipses
  var i, r;
  for (i = 0; i < 16; i++) {
    patches.push({
      x: texRng(), y: texRng(),
      rx: 0.16 + texRng() * 0.26, ry: 0.12 + texRng() * 0.20,
      col: texRng() < 0.55 ? PAPER : GRAY,
      a: 0.025 + texRng() * 0.035
    });
  }
  var fibers = [];    // short fibre strokes
  for (i = 0; i < 700; i++) {
    fibers.push({
      x: texRng(), y: texRng(),
      len: 0.004 + texRng() * 0.010,
      ang: texRng() * Math.PI,
      col: texRng() < 0.6 ? PAPER : GRAY,
      a: 0.10 + texRng() * 0.16
    });
  }
  var speckles = [];  // tiny fibre dots
  for (i = 0; i < 500; i++) {
    speckles.push({
      x: texRng(), y: texRng(),
      r: 0.0008 + texRng() * 0.0016,
      col: texRng() < 0.5 ? GRAY : INK,
      a: 0.05 + texRng() * 0.10
    });
  }

  // ---------- creature silhouettes (local coords, ground at y=+0.42s) ----------

  function hedgePath(s, flip) {
    ctx.beginPath();
    var n = 9, k, ang, rad, px, py;
    for (k = 0; k <= n * 2; k++) {
      ang = Math.PI - (k / (n * 2)) * Math.PI;         // PI .. 0 over the dome
      rad = (k % 2 === 0) ? 1.0 : 0.80;                // spike tip / valley
      px = Math.cos(ang) * s * rad * (flip ? -1 : 1);
      py = 0.42 * s - Math.sin(ang) * s * 0.92 * (rad === 1.0 ? 1.0 : 0.86);
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.lineTo((flip ? -1 : 1) * s, 0.42 * s);
    ctx.lineTo((flip ? 1 : -1) * s, 0.42 * s);
    ctx.closePath();
  }

  function birdPath(s) {
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 0.92, s * 0.72, -0.25, 0, Math.PI * 2);
  }

  function elephantPath(s) {
    ctx.beginPath();
    ctx.ellipse(-s * 0.08, -s * 0.12, s * 0.88, s * 0.60, 0, 0, Math.PI * 2);
  }

  function blobPath(s) {
    ctx.beginPath();
    ctx.arc(0, -s * 0.02, s * 0.82, 0, Math.PI * 2);
  }

  function teardropPath(s) {
    ctx.beginPath();
    ctx.moveTo(0, -s * 1.05);
    ctx.bezierCurveTo(s * 0.72, -s * 0.28, s * 0.78, s * 0.18, s * 0.55, s * 0.52);
    ctx.bezierCurveTo(s * 0.30, s * 0.82, -s * 0.30, s * 0.82, -s * 0.55, s * 0.52);
    ctx.bezierCurveTo(-s * 0.78, s * 0.18, -s * 0.72, -s * 0.28, 0, -s * 1.05);
    ctx.closePath();
  }

  function archPath(s) {
    ctx.beginPath();
    ctx.moveTo(-s * 0.85, s * 0.55);
    ctx.lineTo(-s * 0.85, -s * 0.05);
    ctx.arc(0, -s * 0.05, s * 0.85, Math.PI, 0);
    ctx.lineTo(s * 0.85, s * 0.55);
    ctx.lineTo(s * 0.42, s * 0.55);
    ctx.lineTo(s * 0.42, -s * 0.05);
    ctx.arc(0, -s * 0.05, s * 0.42, 0, Math.PI, true);
    ctx.lineTo(-s * 0.42, s * 0.55);
    ctx.closePath();
  }

  function crescentPath(s) {
    // two-circle crescent: outer disc minus an offset bite disc,
    // traced through the circles' true intersection points
    var R = s * 0.85, d = s * 0.45, rr = s * 0.66;
    var a = (R * R - rr * rr + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, R * R - a * a));
    var angO = Math.atan2(h, a);        // intersection angle on outer circle
    var angB = Math.atan2(h, a - d);    // intersection angle on bite circle
    ctx.beginPath();
    ctx.arc(0, 0, R, -angO, angO, true);        // around the left bulge
    ctx.arc(d, 0, rr, angB, -angB, false);      // back up the bite curve
    ctx.closePath();
  }

  // ---------- creature detail drawing (ctx already translated/scaled) ----------

  function drawHedgehog(s, flip) {
    hedgePath(s, flip); ctx.fillStyle = INK; ctx.fill();
    // feet
    ctx.fillRect(-s * 0.55, s * 0.40, s * 0.22, s * 0.12);
    ctx.fillRect(s * 0.30, s * 0.40, s * 0.22, s * 0.12);
    // eye + nose (face toward facing side)
    var fx = flip ? -1 : 1;
    ctx.beginPath(); ctx.arc(fx * s * 0.52, -s * 0.02, s * 0.075, 0, Math.PI * 2);
    ctx.fillStyle = PAPER; ctx.fill();
    ctx.beginPath(); ctx.arc(fx * s * 0.97, s * 0.16, s * 0.05, 0, Math.PI * 2);
    ctx.fillStyle = INK; ctx.fill();
  }

  function drawBird(s) {
    // tail
    ctx.beginPath();
    ctx.moveTo(-s * 0.70, -s * 0.05);
    ctx.lineTo(-s * 1.18, -s * 0.42);
    ctx.lineTo(-s * 1.05, s * 0.18);
    ctx.closePath();
    ctx.fillStyle = INK; ctx.fill();
    // body
    birdPath(s); ctx.fillStyle = INK; ctx.fill();
    // head
    ctx.beginPath(); ctx.arc(s * 0.62, -s * 0.62, s * 0.40, 0, Math.PI * 2);
    ctx.fillStyle = INK; ctx.fill();
    // belly
    ctx.beginPath();
    ctx.ellipse(s * 0.08, s * 0.24, s * 0.52, s * 0.36, -0.25, 0, Math.PI * 2);
    ctx.fillStyle = PAPER; ctx.fill();
    // beak (the one orange in the piece)
    ctx.beginPath();
    ctx.moveTo(s * 0.94, -s * 0.72);
    ctx.lineTo(s * 1.30, -s * 0.58);
    ctx.lineTo(s * 0.92, -s * 0.44);
    ctx.closePath();
    ctx.fillStyle = ORANGE; ctx.fill();
    // eye
    ctx.beginPath(); ctx.arc(s * 0.70, -s * 0.68, s * 0.065, 0, Math.PI * 2);
    ctx.fillStyle = PAPER; ctx.fill();
    // legs
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.4, s * 0.045);
    ctx.beginPath();
    ctx.moveTo(-s * 0.10, s * 0.62); ctx.lineTo(-s * 0.10, s * 0.88);
    ctx.moveTo(s * 0.28, s * 0.58); ctx.lineTo(s * 0.28, s * 0.88);
    ctx.stroke();
  }

  function drawElephant(s) {
    // legs
    ctx.fillStyle = GRAY;
    ctx.fillRect(-s * 0.72, s * 0.28, s * 0.24, s * 0.50);
    ctx.fillRect(-s * 0.34, s * 0.30, s * 0.24, s * 0.48);
    ctx.fillRect(s * 0.16, s * 0.30, s * 0.24, s * 0.48);
    ctx.fillRect(s * 0.52, s * 0.26, s * 0.24, s * 0.52);
    // tail
    ctx.strokeStyle = GRAY; ctx.lineWidth = Math.max(1.4, s * 0.05);
    ctx.beginPath();
    ctx.moveTo(-s * 0.92, -s * 0.28);
    ctx.quadraticCurveTo(-s * 1.08, s * 0.05, -s * 0.98, s * 0.34);
    ctx.stroke();
    // body + head mass
    elephantPath(s); ctx.fillStyle = GRAY; ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.62, -s * 0.22, s * 0.50, 0, Math.PI * 2);
    ctx.fillStyle = GRAY; ctx.fill();
    // trunk
    ctx.strokeStyle = GRAY; ctx.lineWidth = s * 0.20; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(s * 0.94, -s * 0.10);
    ctx.quadraticCurveTo(s * 1.12, s * 0.30, s * 0.92, s * 0.58);
    ctx.stroke();
    ctx.lineCap = 'butt';
    // ear
    ctx.beginPath();
    ctx.ellipse(s * 0.42, -s * 0.22, s * 0.26, s * 0.32, 0.15, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(250,247,240,0.5)'; ctx.fill();
    // eye
    ctx.beginPath(); ctx.arc(s * 0.70, -s * 0.30, s * 0.055, 0, Math.PI * 2);
    ctx.fillStyle = INK; ctx.fill();
  }

  function drawBlob(s) {
    blobPath(s); ctx.fillStyle = PAPER; ctx.fill();
    // wing
    ctx.beginPath();
    ctx.ellipse(-s * 0.10, s * 0.02, s * 0.38, s * 0.24, -0.5, 0, Math.PI * 2);
    ctx.fillStyle = GRAY; ctx.fill();
    // eye
    ctx.beginPath(); ctx.arc(s * 0.36, -s * 0.28, s * 0.06, 0, Math.PI * 2);
    ctx.fillStyle = INK; ctx.fill();
    // small gray beak (gray, not orange)
    ctx.beginPath();
    ctx.moveTo(s * 0.74, -s * 0.22);
    ctx.lineTo(s * 0.98, -s * 0.12);
    ctx.lineTo(s * 0.72, -s * 0.04);
    ctx.closePath();
    ctx.fillStyle = GRAY; ctx.fill();
    // feet
    ctx.strokeStyle = GRAY; ctx.lineWidth = Math.max(1.3, s * 0.04);
    ctx.beginPath();
    ctx.moveTo(-s * 0.18, s * 0.74); ctx.lineTo(-s * 0.18, s * 0.92);
    ctx.moveTo(s * 0.16, s * 0.74); ctx.lineTo(s * 0.16, s * 0.92);
    ctx.stroke();
  }

  function drawTeardrop(s) {
    teardropPath(s); ctx.fillStyle = PAPER; ctx.fill();
    // small ink seed dot
    ctx.beginPath(); ctx.arc(0, s * 0.34, s * 0.09, 0, Math.PI * 2);
    ctx.fillStyle = INK; ctx.fill();
  }

  function drawArch(s) {
    archPath(s); ctx.fillStyle = GRAY; ctx.fill();
  }

  function drawCrescent(s) {
    crescentPath(s); ctx.fillStyle = INK; ctx.fill();
  }

  // ---------- the fixed set of eight ----------
  // kind, home x/y (fractions), radius (fraction of min(W,H)), flip
  var CREATURES = [
    { kind: 'hedgehog', hx: 0.27, hy: 0.31, r: 0.088, flip: false, sil: hedgePath },
    { kind: 'bird',     hx: 0.59, hy: 0.25, r: 0.074, flip: false, sil: birdPath },
    { kind: 'teardrop', hx: 0.83, hy: 0.37, r: 0.068, flip: false, sil: teardropPath },
    { kind: 'blob',     hx: 0.44, hy: 0.50, r: 0.064, flip: false, sil: blobPath },
    { kind: 'elephant', hx: 0.71, hy: 0.58, r: 0.094, flip: false, sil: elephantPath },
    { kind: 'hedgehog', hx: 0.19, hy: 0.63, r: 0.064, flip: true,  sil: hedgePath },
    { kind: 'arch',     hx: 0.41, hy: 0.77, r: 0.070, flip: false, sil: archPath },
    { kind: 'crescent', hx: 0.62, hy: 0.81, r: 0.066, flip: false, sil: crescentPath }
  ];
  for (i = 0; i < CREATURES.length; i++) {
    CREATURES[i].x = CREATURES[i].hx;
    CREATURES[i].y = CREATURES[i].hy;
    CREATURES[i].squashUntil = -1;
  }

  var DRAWERS = {
    hedgehog: drawHedgehog, bird: drawBird, elephant: drawElephant,
    blob: drawBlob, teardrop: drawTeardrop, arch: drawArch, crescent: drawCrescent
  };

  // ---------- hop engine (stepped: exactly 3 frames per hop) ----------
  var STEP_MS = 150;
  var HOP_STEPS = 3;
  var hop = null;              // {ci, fx, fy, tx, ty, start, lift, inPlace}
  var nextAutoAt = 2600;       // first idle rearrangement

  function clampPos(c, nx, ny) {
    var m = 0.13;
    nx = Math.max(m, Math.min(0.87, nx));
    ny = Math.max(m + 0.02, Math.min(0.88, ny));
    return [nx, ny];
  }

  function startHop(ci, tx, ty, now, liftScale, inPlace) {
    var c = CREATURES[ci];
    var p = clampPos(c, tx, ty);
    hop = {
      ci: ci, fx: c.x, fy: c.y, tx: p[0], ty: p[1],
      start: now, lift: liftScale, inPlace: !!inPlace
    };
  }

  function updateHops(now) {
    if (hop) {
      var phase = (now - hop.start) / STEP_MS;
      if (phase >= HOP_STEPS) {
        var c = CREATURES[hop.ci];
        c.x = hop.tx; c.y = hop.ty;
        c.squashUntil = now + 170;
        hop = null;
      }
    }
    if (!hop && now >= nextAutoAt) {
      var ci = Math.floor(hopRng() * CREATURES.length);
      var c2 = CREATURES[ci];
      var dx = (hopRng() * 2 - 1) * 0.075;
      var dy = (hopRng() * 2 - 1) * 0.065;
      if (Math.abs(dx) < 0.02 && Math.abs(dy) < 0.02) dx = 0.045;
      startHop(ci, c2.x + dx, c2.y + dy, now, 1, false);
      nextAutoAt = now + 2400 + hopRng() * 1900;
    }
  }

  // position + vertical lift for a creature at time `now`
  function creaturePose(c, idx, now) {
    var px = c.x, py = c.y, lift = 0;
    if (hop && hop.ci === idx) {
      var phase = (now - hop.start) / STEP_MS;
      var step = Math.min(HOP_STEPS - 1, Math.max(0, Math.floor(phase)));
      var t = step / (HOP_STEPS - 1);          // 0, 0.5, 1 : stepped, never smooth
      px = hop.fx + (hop.tx - hop.fx) * t;
      py = hop.fy + (hop.ty - hop.fy) * t;
      lift = Math.sin(t * Math.PI) * hop.lift;
    }
    return { x: px, y: py, lift: lift };
  }

  // ---------- drawing ----------
  function draw(now) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // ground
    ctx.fillStyle = PINK;
    ctx.fillRect(0, 0, W, H);

    // tonal patchiness
    var p, f, s2;
    for (i = 0; i < patches.length; i++) {
      p = patches[i];
      ctx.beginPath();
      ctx.ellipse(p.x * W, p.y * H, p.rx * W, p.ry * H, 0, 0, Math.PI * 2);
      ctx.globalAlpha = p.a;
      ctx.fillStyle = p.col;
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // fibres
    ctx.lineWidth = 1;
    for (i = 0; i < fibers.length; i++) {
      f = fibers[i];
      var fx = f.x * W, fy = f.y * H, fl = f.len * Math.min(W, H);
      ctx.beginPath();
      ctx.moveTo(fx, fy);
      ctx.lineTo(fx + Math.cos(f.ang) * fl, fy + Math.sin(f.ang) * fl);
      ctx.globalAlpha = f.a;
      ctx.strokeStyle = f.col;
      ctx.stroke();
    }
    // speckles
    for (i = 0; i < speckles.length; i++) {
      s2 = speckles[i];
      ctx.beginPath();
      ctx.arc(s2.x * W, s2.y * H, Math.max(0.6, s2.r * Math.min(W, H)), 0, Math.PI * 2);
      ctx.globalAlpha = s2.a;
      ctx.fillStyle = s2.col;
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    updateHops(now);

    var unit = Math.min(W, H);

    // shadows first (flat translucent offset silhouettes)
    for (i = 0; i < CREATURES.length; i++) {
      var c = CREATURES[i];
      var pose = creaturePose(c, i, now);
      var sPx = c.r * unit * (1 - pose.lift * 0.12);
      ctx.save();
      ctx.translate(pose.x * W + sPx * 0.10, pose.y * H + sPx * 0.13 - pose.lift * sPx * 0.5);
      if (c.kind === 'hedgehog') c.sil(sPx, c.flip); else c.sil(sPx);
      ctx.fillStyle = SHADOW;
      ctx.fill();
      ctx.restore();
    }

    // creatures
    for (i = 0; i < CREATURES.length; i++) {
      var c3 = CREATURES[i];
      var pose3 = creaturePose(c3, i, now);
      var s3 = c3.r * unit;
      var squash = (now < c3.squashUntil) ? 1 : 0;
      ctx.save();
      ctx.translate(pose3.x * W, pose3.y * H - pose3.lift * s3 * 0.5);
      if (squash) ctx.scale(1.08, 0.86);
      DRAWERS[c3.kind](s3, c3.flip);
      ctx.restore();
    }

    // hint
    ctx.fillStyle = 'rgba(154,154,152,0.95)';
    ctx.font = (isPhone() ? 12 : 13) + 'px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('drag \u00B7 tap', W - 14, H - 12);
  }

  // ---------- interaction ----------
  var drag = null; // {x, y, t, moved}

  function toFrac(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: (e.clientX - rect.left) / W, y: (e.clientY - rect.top) / H };
  }
  function nowMs() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() - T0 : 0;
  }

  function onDown(e) {
    var p = toFrac(e);
    drag = { x: p.x, y: p.y, t: nowMs(), moved: false };
  }
  function onMove(e) {
    if (!drag) return;
    var p = toFrac(e);
    if (Math.abs(p.x - drag.x) * W > 8 || Math.abs(p.y - drag.y) * H > 8) drag.moved = true;
    if (!drag.moved) return;
    // stir: creatures near the finger scatter in small stepped hops
    var now = nowMs(), unit = Math.min(W, H);
    for (var k = 0; k < CREATURES.length; k++) {
      if (hop && hop.ci === k) continue;
      var c = CREATURES[k];
      var dx = (c.x - p.x) * W, dy = (c.y - p.y) * H;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < unit * 0.20) {
        var ang = Math.atan2(dy, dx) + (stirRng() - 0.5) * 0.8;
        var dist = 0.028 + stirRng() * 0.030;
        startHop(k, c.x + Math.cos(ang) * dist * (unit / W), c.y + Math.sin(ang) * dist * (unit / H), now, 0.7, false);
        break; // one stir hop at a time keeps the stepped read clean
      }
    }
  }
  function onUp(e) {
    if (!drag) return;
    var now = nowMs();
    var wasDrag = drag.moved;
    var downT = drag.t;
    var p = toFrac(e);
    drag = null;
    if (wasDrag) return;
    if (now - downT > 450) return;
    // tap: hop the tapped creature in place
    var unit = Math.min(W, H);
    for (var k = 0; k < CREATURES.length; k++) {
      var c = CREATURES[k];
      var dx = (c.x - p.x) * W, dy = (c.y - p.y) * H;
      if (Math.sqrt(dx * dx + dy * dy) < c.r * unit * 1.25) {
        if (!(hop && hop.ci === k)) startHop(k, c.x, c.y, now, 1.5, true);
        break;
      }
    }
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { drag = null; });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { fit(); draw(lastNow); });
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(lastNow); });
  }

  // ---------- boot: synchronous deterministic first frame ----------
  var T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  var lastNow = 0;
  fit();
  draw(0);

  if (typeof requestAnimationFrame === 'function') {
    var loop = function (ts) {
      lastNow = ts - T0;
      draw(lastNow);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
