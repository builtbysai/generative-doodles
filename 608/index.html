<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№608 The Deer in Wintercroft</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d1520; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt.
  // No study file exists for ruth-goller.
  var BONE = '#e8e4d8';       // bone white, the mask and the snow caps
  var BONE_DIM = '#cfc9b8';   // shaded bone, cloak shadow side
  var FOG = '#9aa3a8';         // fog grey
  var FOG_LIGHT = '#c3c9cc';   // pale fog, drifting blobs
  var FOG_PALE = '#d3d8db';    // foreground wisps
  var NIGHT = '#0d1520';       // snow blue-black, page ground
  var NIGHT_DEEP = '#080f18';  // deepest night, forest floor
  var NIGHT_BLUE = '#16202e';  // forest background
  var WOOD = '#3a2a1e';        // the staff's dark wood
  var GREEN = '#7fb89a';       // bass interference, cold green ripples
  var INK = '#1c2226';         // hard dark outlines on the mask
  var CLOAK = '#5a6672';       // hooded cloak, fog grey-blue
  var CLOAK_DARK = '#49545f';  // hood, darker grey-blue
  var SNOW = '#c9d2d8';        // snow ground

  // Fixed-phase first frame: t = 6 s. Phase 6 sits mid first staging
  // (the mask in fog, 0 to 24 s): the deer-mask costume stands full in
  // the frame, the bass is near its peak so the fog displacement reads,
  // and the ripple ring from the note onset at t = 4 s is 2 s old and
  // clearly visible. Frame one is byte-reproducible: figure, fog,
  // ripples and snow are all pure functions of t.
  var FIRST_T = 6;

  // Cycle: 48 s. Fog staging 0 to 24 s, snow-forest staging 24 to 48 s,
  // with a 4 s slow cross-dissolve at each boundary.
  var CYCLE = 48;

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hash(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- sub-bass oscillator ----
  // Slow closed-form amplitude, one swell every 16 s. Note onsets fall
  // every 4 s; each onset emits a cold-green ripple ring.
  function bassAmp(t) {
    return 0.55 + 0.45 * Math.sin(t * Math.PI * 2 / 16);
  }

  // Fog staging alpha over the 48 s cycle: 1 through the fog staging,
  // dissolving out 20 to 24 s, back in 44 to 48 s.
  function fogAlpha(t) {
    var ph = t - Math.floor(t / CYCLE) * CYCLE;
    if (ph < 20) { return 1; }
    if (ph < 24) { return 1 - smooth((ph - 20) / 4); }
    if (ph < 44) { return 0; }
    return smooth((ph - 44) / 4);
  }

  // ---- fog ----
  // Layered noise fields: soft ellipses drifting slowly, their sideways
  // displacement driven by the sub-bass amplitude. The figure is drawn
  // between the back and front layers, so fog veils its lower half while
  // the mask stays hard-edged.
  function drawFogBack(t) {
    var bass = bassAmp(t);
    var i, hx1, hx2, hx3, bx, by, rr, grad;
    for (i = 0; i < 16; i++) {
      hx1 = hash(i * 7 + 1); hx2 = hash(i * 7 + 2); hx3 = hash(i * 7 + 3);
      bx = hx1 * W + Math.sin(t * 0.05 + i * 1.7) * W * 0.02 * (0.5 + bass);
      by = H * (0.16 + 0.62 * hx2);
      rr = W * (0.08 + 0.15 * hx3);
      grad = ctx.createRadialGradient(bx, by, 0, bx, by, rr);
      grad.addColorStop(0, hexA(FOG_LIGHT, a4(0.06 + 0.07 * hx2)));
      grad.addColorStop(1, hexA(FOG_LIGHT, 0));
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.moveTo(bx + rr, by);
      ctx.arc(bx, by, rr, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawFogFront(t) {
    var bass = bassAmp(t);
    var i, hx1, hx2, hx3, bx, by, rr, grad;
    for (i = 0; i < 9; i++) {
      hx1 = hash(i * 11 + 41); hx2 = hash(i * 11 + 42); hx3 = hash(i * 11 + 43);
      bx = hx1 * W + Math.sin(t * 0.08 + i * 2.3) * W * 0.03 * (0.5 + bass);
      by = H * (0.62 + 0.26 * hx2);
      rr = W * (0.10 + 0.14 * hx3);
      grad = ctx.createRadialGradient(bx, by, 0, bx, by, rr);
      grad.addColorStop(0, hexA(FOG_PALE, a4(0.07 + 0.06 * hx2)));
      grad.addColorStop(1, hexA(FOG_PALE, 0));
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.moveTo(bx + rr, by);
      ctx.arc(bx, by, rr, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ---- bass interference ripples ----
  // Two expanding ring sets, one at the figure's feet and one further
  // out in the fog, offset by 2 s so their rings cross: the interference
  // pattern the low tones shake into the fog.
  function drawRipples(t, cx, baseY, u) {
    var centers = [[cx, baseY + 2], [W * 0.66, baseY - H * 0.05]];
    var bass = bassAmp(t);
    for (var ci = 0; ci < centers.length; ci++) {
      var off = ci === 0 ? 0 : 2;
      var tt = t + off;
      var age = tt - Math.floor(tt / 4) * 4;
      if (age >= 3.6) { continue; }
      for (var r2 = 0; r2 < 2; r2++) {
        var rr = u * (0.25 + r2 * 0.18 + age * 0.85);
        var a = 0.36 * bass * (1 - age / 3.6) * (r2 ? 0.6 : 1);
        if (a <= 0.01) { continue; }
        ctx.strokeStyle = hexA(GREEN, a4(a));
        ctx.lineWidth = Math.max(1, 0.03 * u);
        ctx.beginPath(); ctx.moveTo(centers[ci][0] + rr, centers[ci][1]);
        ctx.arc(centers[ci][0], centers[ci][1], rr, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }

  // ---- the figure ----
  // One static sprite, two costumes. It barely moves: a sway of at most
  // 0.004 rad on a 24 s period. The mask is the only hard-edged thing
  // in a soft world, so every mask edge is a straight polygon line.
  function drawAntler(cx, hy, m, side) {
    var bx = cx + side * 0.28 * m, by = hy - 0.45 * m;
    var p1x = cx + side * 0.75 * m, p1y = hy - 1.15 * m;
    var p2x = cx + side * 1.05 * m, p2y = hy - 1.85 * m;
    var p3x = cx + side * 1.15 * m, p3y = hy - 2.30 * m;
    var segs = [
      [bx, by, p1x, p1y], [p1x, p1y, p2x, p2y], [p2x, p2y, p3x, p3y],
      [p1x, p1y, cx + side * 1.35 * m, hy - 1.50 * m],
      [p2x, p2y, cx + side * 1.50 * m, hy - 2.05 * m]
    ];
    for (var s = 0; s < segs.length; s++) {
      ctx.strokeStyle = INK;
      ctx.lineWidth = Math.max(1.5, 0.14 * m);
      ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.moveTo(segs[s][0], segs[s][1]);
      ctx.lineTo(segs[s][2], segs[s][3]); ctx.stroke();
      ctx.strokeStyle = BONE;
      ctx.lineWidth = Math.max(1, 0.09 * m);
      ctx.beginPath(); ctx.moveTo(segs[s][0], segs[s][1]);
      ctx.lineTo(segs[s][2], segs[s][3]); ctx.stroke();
    }
  }

  function drawDeerMask(cx, hy, m) {
    // Ears, small triangles pointing out from the mask.
    ctx.fillStyle = BONE;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(cx - 0.50 * m, hy - 0.35 * m);
    ctx.lineTo(cx - 0.95 * m, hy - 0.05 * m);
    ctx.lineTo(cx - 0.50 * m, hy + 0.05 * m);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx + 0.50 * m, hy - 0.35 * m);
    ctx.lineTo(cx + 0.95 * m, hy - 0.05 * m);
    ctx.lineTo(cx + 0.50 * m, hy + 0.05 * m);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Antlers, bone over a dark under-stroke.
    drawAntler(cx, hy, m, -1);
    drawAntler(cx, hy, m, 1);
    // Faceted mask: straight polygon edges only.
    ctx.fillStyle = BONE;
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1.2, 0.02 * m);
    ctx.beginPath();
    ctx.moveTo(cx - 0.40 * m, hy - 0.62 * m);
    ctx.lineTo(cx + 0.40 * m, hy - 0.62 * m);
    ctx.lineTo(cx + 0.55 * m, hy - 0.10 * m);
    ctx.lineTo(cx + 0.36 * m, hy + 0.38 * m);
    ctx.lineTo(cx + 0.16 * m, hy + 0.72 * m);
    ctx.lineTo(cx, hy + 0.82 * m);
    ctx.lineTo(cx - 0.16 * m, hy + 0.72 * m);
    ctx.lineTo(cx - 0.36 * m, hy + 0.38 * m);
    ctx.lineTo(cx - 0.55 * m, hy - 0.10 * m);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Facet seams, faint bone-dark lines.
    ctx.strokeStyle = hexA(BONE_DIM, 0.7);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, hy - 0.62 * m); ctx.lineTo(cx, hy + 0.80 * m); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - 0.40 * m, hy - 0.62 * m); ctx.lineTo(cx, hy + 0.10 * m); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 0.40 * m, hy - 0.62 * m); ctx.lineTo(cx, hy + 0.10 * m); ctx.stroke();
    // Eye slits, dark angled polygons.
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(cx - 0.34 * m, hy - 0.18 * m);
    ctx.lineTo(cx - 0.10 * m, hy - 0.22 * m);
    ctx.lineTo(cx - 0.12 * m, hy - 0.08 * m);
    ctx.lineTo(cx - 0.32 * m, hy - 0.06 * m);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + 0.34 * m, hy - 0.18 * m);
    ctx.lineTo(cx + 0.10 * m, hy - 0.22 * m);
    ctx.lineTo(cx + 0.12 * m, hy - 0.08 * m);
    ctx.lineTo(cx + 0.32 * m, hy - 0.06 * m);
    ctx.closePath(); ctx.fill();
    // Nose, small dark triangle at the muzzle.
    ctx.beginPath();
    ctx.moveTo(cx - 0.10 * m, hy + 0.55 * m);
    ctx.lineTo(cx + 0.10 * m, hy + 0.55 * m);
    ctx.lineTo(cx, hy + 0.72 * m);
    ctx.closePath(); ctx.fill();
  }

  function drawHoodedHead(cx, hy, m) {
    // Horns sweep out from the hood, bone over a dark under-stroke.
    var sides = [-1, 1];
    for (var s = 0; s < sides.length; s++) {
      var sd = sides[s];
      ctx.strokeStyle = INK;
      ctx.lineWidth = Math.max(1.5, 0.16 * m);
      ctx.lineCap = 'butt';
      ctx.beginPath();
      ctx.moveTo(cx + sd * 0.45 * m, hy - 0.45 * m);
      ctx.quadraticCurveTo(cx + sd * 1.10 * m, hy - 1.15 * m, cx + sd * 1.28 * m, hy - 1.55 * m);
      ctx.stroke();
      ctx.strokeStyle = BONE;
      ctx.lineWidth = Math.max(1, 0.10 * m);
      ctx.beginPath();
      ctx.moveTo(cx + sd * 0.45 * m, hy - 0.45 * m);
      ctx.quadraticCurveTo(cx + sd * 1.10 * m, hy - 1.15 * m, cx + sd * 1.28 * m, hy - 1.55 * m);
      ctx.stroke();
    }
    // Pointed hood.
    ctx.fillStyle = CLOAK_DARK;
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1.2, 0.02 * m);
    ctx.beginPath();
    ctx.moveTo(cx - 0.62 * m, hy + 0.55 * m);
    ctx.lineTo(cx - 0.55 * m, hy - 0.35 * m);
    ctx.lineTo(cx - 0.25 * m, hy - 0.75 * m);
    ctx.lineTo(cx, hy - 0.95 * m);
    ctx.lineTo(cx + 0.25 * m, hy - 0.75 * m);
    ctx.lineTo(cx + 0.55 * m, hy - 0.35 * m);
    ctx.lineTo(cx + 0.62 * m, hy + 0.55 * m);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Face opening, deep shadow with two faint bone eyes.
    ctx.fillStyle = NIGHT_DEEP;
    ctx.beginPath();
    ctx.moveTo(cx - 0.34 * m, hy - 0.42 * m);
    ctx.lineTo(cx + 0.34 * m, hy - 0.42 * m);
    ctx.lineTo(cx + 0.30 * m, hy + 0.30 * m);
    ctx.lineTo(cx - 0.30 * m, hy + 0.30 * m);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = hexA(BONE, 0.85);
    ctx.beginPath(); ctx.moveTo(cx - 0.16 * m + 0.045 * m, hy - 0.10 * m);
    ctx.arc(cx - 0.16 * m, hy - 0.10 * m, 0.045 * m, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + 0.16 * m + 0.045 * m, hy - 0.10 * m);
    ctx.arc(cx + 0.16 * m, hy - 0.10 * m, 0.045 * m, 0, Math.PI * 2); ctx.fill();
  }

  function drawFigure(cx, baseY, u, t, costume) {
    var sway = 0.004 * Math.sin(t * Math.PI * 2 / 24);
    ctx.save();
    ctx.translate(cx, baseY);
    ctx.rotate(sway);
    ctx.translate(-cx, -baseY);
    var shY = baseY - 3.4 * u;
    var m = 0.5 * u;
    var hy = baseY - 3.72 * u;
    // Cloak: a long straight-edged robe, bone in the fog staging,
    // fog grey-blue in the forest staging.
    ctx.fillStyle = costume === 0 ? BONE : CLOAK;
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1.2, 0.02 * u);
    ctx.beginPath();
    ctx.moveTo(cx - 0.50 * u, shY);
    ctx.lineTo(cx + 0.50 * u, shY);
    ctx.lineTo(cx + 1.05 * u, baseY);
    ctx.lineTo(cx - 1.05 * u, baseY);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Shaded half of the cloak, and a centre fold line.
    ctx.fillStyle = hexA(costume === 0 ? BONE_DIM : NIGHT_DEEP, 0.45);
    ctx.beginPath();
    ctx.moveTo(cx, shY);
    ctx.lineTo(cx + 0.50 * u, shY);
    ctx.lineTo(cx + 1.05 * u, baseY);
    ctx.lineTo(cx, baseY);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = hexA(costume === 0 ? BONE_DIM : NIGHT_DEEP, 0.6);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, shY); ctx.lineTo(cx + 0.12 * u, baseY); ctx.stroke();
    if (costume === 0) {
      drawDeerMask(cx, hy, m);
    } else {
      // Staff in the figure's right hand, dark wood with a forked top.
      var sx = cx + 1.35 * u;
      var topY = baseY - 4.9 * u;
      ctx.strokeStyle = WOOD;
      ctx.lineWidth = Math.max(2, 0.11 * u);
      ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.moveTo(sx, baseY); ctx.lineTo(sx, topY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx, topY); ctx.lineTo(sx - 0.14 * u, topY - 0.28 * u); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx, topY); ctx.lineTo(sx + 0.14 * u, topY - 0.28 * u); ctx.stroke();
      // Arm reaching from the shoulder to the staff.
      ctx.strokeStyle = CLOAK_DARK;
      ctx.lineWidth = Math.max(2, 0.18 * u);
      ctx.beginPath();
      ctx.moveTo(cx + 0.45 * u, shY + 0.35 * u);
      ctx.lineTo(sx, baseY - 2.7 * u);
      ctx.stroke();
      // Hand gripping the staff, and a small bone charm at its top.
      ctx.fillStyle = BONE;
      ctx.beginPath(); ctx.moveTo(sx + 0.10 * u, baseY - 2.7 * u);
      ctx.arc(sx, baseY - 2.7 * u, 0.10 * u, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(sx + 0.07 * u, topY - 0.18 * u);
      ctx.arc(sx, topY - 0.18 * u, 0.07 * u, 0, Math.PI * 2); ctx.fill();
      drawHoodedHead(cx, hy, m);
    }
    ctx.restore();
  }

  // ---- snow forest ----
  function drawPine(x, baseY, h, color, snowA) {
    ctx.fillStyle = color;
    ctx.fillRect(x - 0.03 * h, baseY - 0.12 * h, 0.06 * h, 0.12 * h);
    for (var j = 0; j < 3; j++) {
      var apexY = baseY - h + j * 0.26 * h;
      var baseTy = apexY + 0.34 * h;
      var halfW = (0.30 - j * 0.05) * h;
      ctx.beginPath();
      ctx.moveTo(x, apexY);
      ctx.lineTo(x + halfW, baseTy);
      ctx.lineTo(x - halfW, baseTy);
      ctx.closePath(); ctx.fill();
      // Snow cap on each tier.
      ctx.fillStyle = hexA(BONE, a4(snowA));
      ctx.beginPath();
      ctx.moveTo(x, apexY);
      ctx.lineTo(x + halfW * 0.45, apexY + 0.10 * h);
      ctx.lineTo(x - halfW * 0.45, apexY + 0.10 * h);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = color;
    }
  }

  function drawTrees(cx) {
    // Distant trees behind the figure, smaller and lighter.
    for (var i = 0; i < 7; i++) {
      var dx = hash(i * 13 + 5) * W;
      if (Math.abs(dx - cx) < W * 0.14) { continue; }
      var dh = H * (0.20 + 0.14 * hash(i * 13 + 6));
      drawPine(dx, H * 0.80, dh, '#1a2836', 0.55);
    }
    // Near trees at the sides, holding the same composition as the fog
    // staging: the figure stays off-centre, trees replace the dark.
    for (var j = 0; j < 8; j++) {
      var nx = hash(j * 17 + 9) * W;
      if (Math.abs(nx - cx) < W * 0.13) { continue; }
      var nh = H * (0.30 + 0.22 * hash(j * 17 + 10));
      drawPine(nx, H * 0.82, nh, j % 2 ? NIGHT : NIGHT_BLUE, 0.85);
    }
  }

  function drawSnow(t) {
    for (var i = 0; i < 70; i++) {
      var sx = hash(i * 3 + 1) * W;
      var sy0 = hash(i * 3 + 2) * H;
      var speed = 6 + hash(i * 3 + 3) * 8;
      var sy = (sy0 + t * speed) % H;
      var r = 1 + hash(i * 3 + 4) * 1.6;
      ctx.fillStyle = hexA(BONE, a4(0.35 + 0.5 * hash(i * 3 + 5)));
      ctx.beginPath(); ctx.moveTo(sx + r, sy); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ---- stagings ----
  function drawFogStaging(t, cx, baseY, u) {
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#7d8894');
    grad.addColorStop(0.55, '#5b6773');
    grad.addColorStop(1, '#232d38');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    // Pale ground the figure stands on.
    var ggrad = ctx.createLinearGradient(0, baseY - H * 0.06, 0, H);
    ggrad.addColorStop(0, hexA(FOG, 0.55));
    ggrad.addColorStop(1, hexA('#3a4550', 0.9));
    ctx.fillStyle = ggrad;
    ctx.fillRect(0, baseY - H * 0.06, W, H - baseY + H * 0.06);
    drawFogBack(t);
    drawFigure(cx, baseY, u, t, 0);
    drawFogFront(t);
    drawRipples(t, cx, baseY, u);
  }

  function drawForestStaging(t, cx, baseY, u) {
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#1a2836');
    grad.addColorStop(0.6, '#101c2a');
    grad.addColorStop(1, NIGHT_DEEP);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    // Snow ground.
    var ggrad = ctx.createLinearGradient(0, baseY - H * 0.06, 0, H);
    ggrad.addColorStop(0, hexA(SNOW, 0.75));
    ggrad.addColorStop(1, hexA('#5d6b78', 0.9));
    ctx.fillStyle = ggrad;
    ctx.fillRect(0, baseY - H * 0.06, W, H - baseY + H * 0.06);
    drawTrees(cx);
    drawFigure(cx, baseY, u, t, 1);
    drawSnow(t);
    drawFogFront(t);
    drawRipples(t, cx, baseY, u);
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Snow blue-black ground; the stage square blends into it on desktop.
    ctx.fillStyle = NIGHT;
    ctx.fillRect(0, 0, W, H);

    var cx = W * 0.38;
    var baseY = H * 0.80;
    var u = Math.min(W, H) * 0.12;

    var fogA = fogAlpha(t);
    if (fogA > 0.001) {
      ctx.save();
      ctx.globalAlpha = a4(fogA);
      drawFogStaging(t, cx, baseY, u);
      ctx.restore();
    }
    if (fogA < 0.999) {
      ctx.save();
      ctx.globalAlpha = a4(1 - fogA);
      drawForestStaging(t, cx, baseY, u);
      ctx.restore();
    }

    // Staging label, small bone caps above the hint.
    var ph = t - Math.floor(t / CYCLE) * CYCLE;
    var label = ph < 24 ? 'I · The Mask in Fog' : 'II · The Horned Figure in Snow';
    var fsL = Math.round(clamp(W / 30, 11, 16));
    ctx.fillStyle = hexA(BONE, 0.85);
    ctx.font = '600 ' + fsL + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(label, W / 2, H - 44);

    // Title plate, top-left.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = BONE;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('The Deer in Wintercroft', 18, 34);
    ctx.fillStyle = FOG_LIGHT;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№608 · 2007 · 04 · 10', 18, 34 + fs2 + 8);
    ctx.fillStyle = hexA(FOG_LIGHT, 0.9);
    ctx.textAlign = 'center';
    ctx.fillText('Watch the fog answer the bass while the masked figure barely moves.', W / 2, H - 20);
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Watch only: no pointer handlers, no audio. All motion runs well under
  // the 14 Hz ceiling: fog drift near 0.05 Hz, sway 1/24 Hz, ripples 1/4 Hz.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
