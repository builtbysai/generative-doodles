<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No-Media Trio, Again — №1186</title>
<style>
  html, body { margin: 0; padding: 0; background: #08080A; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32 only) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function frac(x) { return x - Math.floor(x); }
  function astep(x) { return Math.round(clamp01(x) * 5) / 5; }        // stepped alpha
  function hash1(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
  function pulse(x) { var v = 1 - frac(x) * 2.6; return v < 0 ? 0 : v; }  // sharp beat, decays
  function triw(x) { var f = frac(x); return f < 0.5 ? f * 2 : 2 - f * 2; }
  var TAU = Math.PI * 2;

  // ---------- the nine mechanism modules ----------
  var MODS = [
    { key: 'OSC',  color: '#FF2B6E' },   // oscillator triangle
    { key: 'FLT',  color: '#00FFC2' },   // filter bars
    { key: 'BELL', color: '#FFE14D' },   // alarm bell
    { key: 'JGL',  color: '#7C5CFF' },   // jingle notes
    { key: 'CHM',  color: '#FF8A00' },   // chime arcs
    { key: 'RAD',  color: '#4DD2FF' },   // radio wave
    { key: 'DING', color: '#B8FF2E' },   // doorbell dot
    { key: 'CB',   color: '#FF5C5C' },   // trucker CB squiggle
    { key: 'WIND', color: '#8A8A93' }    // wind gust
  ];
  // pairwise link blends (50/50 stepped mixes of the round-0 trio colors)
  var MIX = { '0-1': '#80E0E8', '1-2': '#80F088', '0-2': '#FF885E' };
  function blendFor(a, b) {
    var k = Math.min(a, b) + '-' + Math.max(a, b);
    if (MIX[k]) return MIX[k];
    // generic stepped mix for any other pairing
    function hx(c) { return [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16)]; }
    var A = hx(MODS[a].color), B = hx(MODS[b].color), o = '#';
    for (var i = 0; i < 3; i++) { var v = Math.round((A[i] + B[i]) / 2 / 16) * 16; if (v > 255) v = 255; var s = v.toString(16); o += s.length < 2 ? '0' + s : s; }
    return o;
  }

  // ---------- continuum constants ----------
  var BG = '#08080A';
  var MASTER = 1186001;
  var ROUND_LEN = 45;         // 45 s of piece time = a compressed 10 minutes
  var GAP_LEN = 2;            // black wipe: the trio leaves no trace
  var CYCLE = ROUND_LEN + GAP_LEN;
  var T0 = 19;                // fixed first frame: round 0, rt = 19 s, countdown 5:47
  var SLOT_ANG = [-Math.PI / 2, Math.PI * 5 / 6, Math.PI / 6];

  // ---------- round derivation: hashed per round, addressed not accumulated ----------
  var trioCache = [];
  function sameSet(a, b) {
    if (!b) return false;
    for (var i = 0; i < 3; i++) if (b.indexOf(a[i]) < 0) return false;
    return true;
  }
  function trioFor(r) {
    while (trioCache.length <= r) {
      var idx = trioCache.length;
      var rng = mulberry32((MASTER ^ Math.imul(idx + 1, 0x9E3779B9)) >>> 0);
      var prev = idx > 0 ? trioCache[idx - 1].mods : null;
      var mods = null, guard = 0;
      do {
        mods = []; guard++;
        while (mods.length < 3) { var m = Math.floor(rng() * 9); if (mods.indexOf(m) < 0) mods.push(m); }
      } while (sameSet(mods, prev) && guard < 60);
      var slots = [];
      for (var s = 0; s < 3; s++) {
        slots.push({
          ph0: rng() * TAU, ph1: rng() * TAU, ph2: rng() * TAU,
          f1: 0.7 + rng() * 1.1, f2: 0.5 + rng() * 1.3, seed: 1 + Math.floor(rng() * 900)
        });
      }
      trioCache.push({
        mods: mods, slots: slots,
        wAB: 0.5 + rng() * 0.5, wBC: 0.5 + rng() * 0.5, wCA: 0.5 + rng() * 0.5
      });
    }
    return trioCache[r];
  }

  // ---------- canonical signals: the analytic layer the chain reads ----------
  // amp: the module's momentary amplitude. beat: its rhythm pulse. spd: its rate.
  function sig(mod, rt, P) {
    var amp, beat, spd, e, q, p;
    switch (mod) {
      case 0: amp = 0.55 + 0.45 * Math.sin(rt * (1.5 + P.f1) + P.ph0); beat = pulse(rt * (0.8 + P.f2 * 0.4) + P.ph1); spd = 0.5 + 0.5 * Math.sin(rt * 0.9 + P.ph2); break;
      case 1: amp = triw(rt * 0.13 + P.ph0); beat = pulse(rt * 0.6 + P.ph1); spd = 0.5 + 0.5 * Math.sin(rt * 1.3 + P.ph2); break;
      case 2: e = 1 - frac(rt * (0.5 + P.f2 * 0.3) + P.ph0); amp = e; beat = e; spd = 0.4 + 0.6 * e; break;
      case 3: amp = Math.abs(Math.sin(rt * (1.2 + P.f1 * 0.5) + P.ph0)); beat = pulse(rt * (0.9 + P.f2 * 0.3) + P.ph1); spd = 0.5 + 0.5 * Math.sin(rt * 1.1 + P.ph2); break;
      case 4: q = frac(rt * (0.4 + P.f1 * 0.2) + P.ph0); amp = 1 - q; beat = pulse(rt * (0.4 + P.f1 * 0.2) + P.ph0); spd = 0.5 + 0.5 * Math.sin(rt * 0.8 + P.ph2); break;
      case 5: amp = 0.5 + 0.5 * Math.sin(rt * (1.4 + P.f1) + P.ph0); beat = pulse(rt * (0.7 + P.f2 * 0.5) + P.ph1); spd = 0.5 + 0.5 * Math.sin(rt * 1.7 + P.ph2); break;
      case 6: p = pulse(rt * (0.8 + P.f2 * 0.5) + P.ph0); amp = 0.25 + 0.75 * p; beat = p; spd = 0.5 + 0.5 * Math.cos(rt * 0.8 + P.ph2); break;
      case 7: amp = 0.5 + 0.5 * Math.sin(rt * (2.0 + P.f1) + P.ph0); beat = pulse(rt * 1.4 + P.ph1); spd = 0.5 + 0.5 * Math.sin(rt * 2.3 + P.ph2); break;
      default: var g = 0.5 + 0.5 * Math.sin(rt * 0.23 + P.ph0); amp = 0.25 + 0.75 * g * Math.abs(Math.sin(rt * 0.71 + P.ph1)); beat = pulse(rt * 0.35 + P.ph1); spd = g; break;
    }
    return { amp: amp, beat: beat, spd: spd };
  }

  // ---------- canvas ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, lastT = T0;

  function viewW() {
    if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width;
    if (window.innerWidth) return window.innerWidth;
    return 1280;
  }
  function viewH() {
    if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    if (window.innerHeight) return window.innerHeight;
    return 800;
  }
  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return H > W * 1.15;
  }
  function fit() {
    W = viewW(); H = viewH();
    DPR = Math.min((window.devicePixelRatio || 1), 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // ---------- small drawing helpers ----------
  function disc(x, y, r, color, a) {
    ctx.globalAlpha = a; ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function ringPath(x, y, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
  function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  function link(x1, y1, x2, y2, cx, cy, bulge, color, a) {
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = -dy / len, ny = dx / len;
    if ((cx - mx) * nx + (cy - my) * ny < 0) { nx = -nx; ny = -ny; }
    ctx.globalAlpha = a; ctx.strokeStyle = color; ctx.lineWidth = Math.max(1, Math.min(W, H) * 0.0022);
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(mx + nx * bulge, my + ny * bulge, x2, y2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---------- static ring glyphs ----------
  function glyph(mod, x, y, s, color, a) {
    ctx.save(); ctx.translate(x, y);
    ctx.globalAlpha = a; ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineWidth = Math.max(1, s * 0.14);
    var k;
    if (mod === 0) {           // oscillator: triangle
      ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * 0.9, s * 0.75); ctx.lineTo(-s * 0.9, s * 0.75); ctx.closePath(); ctx.stroke();
    } else if (mod === 1) {    // filter: three bars
      var hs = [0.5, 1.0, 0.7];
      for (k = 0; k < 3; k++) ctx.fillRect((k - 1) * s * 0.55 - s * 0.16, s * 0.8 - hs[k] * s * 1.5, s * 0.32, hs[k] * s * 1.5);
    } else if (mod === 2) {    // bell: dome + base
      ctx.beginPath(); ctx.moveTo(s * 0.8, s * 0.45); ctx.arc(0, s * 0.45, s * 0.8, Math.PI, 0); ctx.lineTo(-s * 0.8, s * 0.45); ctx.stroke();
      line(-s, s * 0.8, s, s * 0.8);
    } else if (mod === 3) {    // jingle: two note dots + stems
      disc(-s * 0.45, s * 0.5, s * 0.3, color, a); disc(s * 0.5, s * 0.25, s * 0.3, color, a);
      line(-s * 0.15, s * 0.5, -s * 0.15, -s * 0.8); line(s * 0.8, s * 0.25, s * 0.8, -s * 0.55);
      line(-s * 0.15, -s * 0.8, s * 0.8, -s * 0.55);
    } else if (mod === 4) {    // chime: nested arcs
      ctx.beginPath(); ctx.moveTo(s * 0.95, 0); ctx.arc(0, 0, s * 0.95, -0.6, 1.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s * 0.55, 0); ctx.arc(0, 0, s * 0.55, -0.6, 1.5); ctx.stroke();
    } else if (mod === 5) {    // radio: dot + wave arcs
      disc(0, 0, s * 0.22, color, a);
      ctx.beginPath(); ctx.moveTo(s * 0.95, 0); ctx.arc(0, 0, s * 0.95, -0.9, 0.9); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-s * 0.95, 0); ctx.arc(0, 0, s * 0.95, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
    } else if (mod === 6) {    // doorbell: dot in a ring
      disc(0, 0, s * 0.3, color, a); ringPath(0, 0, s * 0.85); ctx.stroke();
    } else if (mod === 7) {    // CB: squiggle
      ctx.beginPath(); ctx.moveTo(-s, s * 0.3);
      for (k = 1; k <= 4; k++) ctx.lineTo(-s + k * s * 0.5, (k % 2 ? -s * 0.45 : s * 0.3));
      ctx.stroke();
    } else {                   // wind: two curved streaks
      ctx.beginPath(); ctx.moveTo(-s, -s * 0.3); ctx.quadraticCurveTo(0, -s * 0.85, s, -s * 0.3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-s * 0.8, s * 0.45); ctx.quadraticCurveTo(0, -s * 0.05, s * 0.8, s * 0.45); ctx.stroke();
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }

  // ---------- live sketches: each module's own small world ----------
  function sketch(mod, x, y, s, rt, P, color, aMul) {
    ctx.save(); ctx.translate(x, y);
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineWidth = Math.max(1, s * 0.07);
    var k, j, q, e;
    if (mod === 0) {           // oscillator: spiky waveform star
      for (k = 0; k < 14; k++) {
        var ang = k / 14 * TAU + rt * 0.25;
        var wv = 0.5 + 0.5 * Math.sin(rt * (1.5 + P.f1) + k * 0.85 + P.ph0);
        var r0 = s * 0.16, r1 = s * (0.4 + 0.55 * wv), ca = Math.cos(ang), sa = Math.sin(ang);
        ctx.globalAlpha = aMul * (0.45 + 0.55 * wv);
        line(ca * r0, sa * r0, ca * r1, sa * r1);
      }
      ctx.globalAlpha = aMul; disc(0, 0, s * 0.1, color, aMul);
    } else if (mod === 1) {    // filter: sweeping bar equalizer
      var peak = triw(rt * 0.13 + P.ph0) * 6, bw = s * 0.2;
      for (k = 0; k < 7; k++) {
        var d = k - peak, h = s * (0.25 + 1.05 * Math.exp(-(d * d) / 2.5));
        ctx.globalAlpha = aMul * 0.9;
        ctx.fillRect((k - 3) * bw * 1.14 - bw / 2, s * 0.7 - h, bw, h);
      }
      ctx.globalAlpha = aMul * 0.6; line(-s, s * 0.7, s, s * 0.7);
    } else if (mod === 2) {    // alarm bell with radiating arcs
      ctx.globalAlpha = aMul;
      ctx.beginPath(); ctx.moveTo(s * 0.55, s * 0.1); ctx.arc(0, s * 0.1, s * 0.55, Math.PI, 0); ctx.lineTo(-s * 0.55, s * 0.1); ctx.stroke();
      line(-s * 0.55, s * 0.1, -s * 0.72, s * 0.42); line(s * 0.55, s * 0.1, s * 0.72, s * 0.42);
      line(-s * 0.78, s * 0.42, s * 0.78, s * 0.42);
      disc(Math.sin(rt * 3 + P.ph0) * s * 0.2, s * 0.58, s * 0.11, color, aMul);
      q = frac(rt * (0.5 + P.f2 * 0.3) + P.ph0);
      if (q < 0.55) { ctx.globalAlpha = aMul * astep(1 - q / 0.55); ctx.beginPath(); ctx.moveTo(Math.cos(Math.PI * 1.15) * s * (0.7 + q), Math.sin(Math.PI * 1.15) * s * (0.7 + q)); ctx.arc(0, 0, s * (0.7 + q * 1.1), Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
    } else if (mod === 3) {    // jingle: bouncing note dots
      for (k = 0; k < 3; k++) {
        var nx = (k - 1) * s * 0.55;
        var ny = s * 0.4 - Math.abs(Math.sin(rt * (1.2 + P.f1 * 0.5) + k * 1.35 + P.ph0)) * s * 0.8;
        ctx.globalAlpha = aMul;
        disc(nx, ny, s * 0.13, color, aMul);
        line(nx + s * 0.13, ny, nx + s * 0.13, ny - s * 0.5);
        line(nx + s * 0.13, ny - s * 0.5, nx + s * 0.34, ny - s * 0.38);
      }
    } else if (mod === 4) {    // chime: expanding thin arcs
      for (j = 0; j < 3; j++) {
        q = frac(rt * (0.4 + P.f1 * 0.2) + j / 3 + P.ph0 * 0.05);
        var rad = s * (0.2 + q * 0.95), a0 = rt * 0.4 + j * 2.1;
        ctx.globalAlpha = aMul * astep(1 - q);
        ctx.beginPath(); ctx.moveTo(Math.cos(a0) * rad, Math.sin(a0) * rad); ctx.arc(0, 0, rad, a0, a0 + 2.2); ctx.stroke();
      }
      ctx.globalAlpha = aMul; disc(0, 0, s * 0.07, color, aMul);
    } else if (mod === 5) {    // radio: concentric wave rings
      for (j = 0; j < 3; j++) {
        q = frac(rt * (0.35 + P.f1 * 0.15) + j / 3 + P.ph0 * 0.05);
        ctx.globalAlpha = aMul * astep((1 - q) * 0.9);
        ringPath(0, 0, s * (0.15 + q)); ctx.stroke();
      }
      ctx.globalAlpha = aMul; disc(0, 0, s * 0.12, color, aMul);
    } else if (mod === 6) {    // doorbell: pulsing dot rings
      var p = pulse(rt * (0.8 + P.f2 * 0.5) + P.ph0);
      q = frac(rt * (0.8 + P.f2 * 0.5) + P.ph0);
      ctx.globalAlpha = aMul * astep(1 - q); ringPath(0, 0, s * (0.3 + q * 0.85)); ctx.stroke();
      ctx.globalAlpha = aMul * (0.35 + 0.65 * p); ringPath(0, 0, s * 0.45); ctx.stroke();
      disc(0, 0, s * (0.14 + 0.1 * p), color, aMul);
    } else if (mod === 7) {    // CB: jagged squiggle crawling
      var step = Math.floor(rt * 7);
      ctx.globalAlpha = aMul;
      ctx.beginPath();
      for (k = 0; k <= 12; k++) {
        var xx = -s + (k / 12) * 2 * s;
        var yy = (hash1(P.seed * 7 + step + k) - 0.5) * s * 1.1;
        if (k === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
      }
      ctx.stroke();
      disc(s * 0.92, (hash1(P.seed * 7 + step + 12) - 0.5) * s * 1.1, s * 0.08, color, aMul);
    } else {                   // wind: drifting curved streaks
      for (j = 0; j < 4; j++) {
        var ph = frac(rt * (0.05 + P.f1 * 0.02) * (1 + j * 0.13) + j * 0.29 + P.ph0 * 0.03);
        var sx = -s + ph * 2 * s, sy = (j - 1.5) * s * 0.34 + Math.sin(rt * 0.9 + j * 1.7) * s * 0.08;
        ctx.globalAlpha = aMul * astep(Math.sin(ph * Math.PI));
        ctx.beginPath(); ctx.moveTo(sx - s * 0.3, sy); ctx.quadraticCurveTo(sx, sy - s * 0.22, sx + s * 0.3, sy); ctx.stroke();
      }
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function fmtCountdown(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  // ---------- draw ----------
  function draw(t) {
    lastT = t;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var U = Math.min(W, H), cx = W / 2, cy = H / 2;
    ctx.globalAlpha = 1; ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

    var r = Math.floor(t / CYCLE);
    var rt = t - r * CYCLE;
    var inGap = rt >= ROUND_LEN;
    var srt = inGap ? ROUND_LEN : rt;
    var TR = trioFor(r);
    var phone = isPhone();

    // pool ring: ellipse of the nine glyphs at the stage edge
    var rx = W / 2 - U * (phone ? 0.085 : 0.075);
    var ry = H / 2 - U * (phone ? 0.085 : 0.075);
    ctx.strokeStyle = '#FFFFFF'; ctx.globalAlpha = 0.05; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx + rx, cy); ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
    var gs = U * 0.017;
    ctx.font = '600 ' + Math.max(9, U * 0.016) + 'px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    for (var k = 0; k < 9; k++) {
      var ga = -Math.PI / 2 + Math.PI / 9 + k * TAU / 9;
      var gx = cx + Math.cos(ga) * rx, gy = cy + Math.sin(ga) * ry;
      var active = !inGap && TR.mods.indexOf(k) >= 0;
      if (active) { ctx.strokeStyle = MODS[k].color; ctx.globalAlpha = 0.6; ctx.lineWidth = Math.max(1, U * 0.002); ringPath(gx, gy, gs * 1.9); ctx.stroke(); ctx.globalAlpha = 1; }
      glyph(k, gx, gy, gs, MODS[k].color, inGap ? 0.3 : (active ? 0.4 : 0.95));
      ctx.globalAlpha = inGap ? 0.3 : (active ? 0.45 : 0.8);
      ctx.fillStyle = MODS[k].color;
      ctx.fillText(MODS[k].key, gx, gy + gs * 2.6);
      ctx.globalAlpha = 1;
    }

    // boundary circle + spotlight wash
    var R = Math.min(W, H) * 0.30;
    ctx.strokeStyle = '#2A2A2E'; ctx.globalAlpha = inGap ? 0.4 : 1; ctx.lineWidth = Math.max(1, U * 0.0022);
    ringPath(cx, cy, R); ctx.stroke(); ctx.globalAlpha = 1;

    if (!inGap) {
      disc(cx, cy, R, '#F5F0E6', 0.08);   // one flat wash over the whole circle

      var sA = sig(TR.mods[0], srt, TR.slots[0]);
      var sB = sig(TR.mods[1], srt, TR.slots[1]);
      var sC = sig(TR.mods[2], srt, TR.slots[2]);

      // stage positions: triangle at 55% of the circle radius
      var px = [], py = [];
      for (var s2 = 0; s2 < 3; s2++) {
        px.push(cx + Math.cos(SLOT_ANG[s2]) * R * 0.55);
        py.push(cy + Math.sin(SLOT_ANG[s2]) * R * 0.55);
      }
      // A -> B: A's amplitude bends B's path
      px[1] += (sA.amp - 0.5) * U * 0.07 * TR.wAB;
      py[1] += (sA.amp - 0.5) * U * 0.05 * TR.wAB;
      // C -> A: C's speed warps A's scale
      var scaleA = 1 + 0.3 * sC.spd * TR.wCA;
      // B -> C: B's rhythm gates C's flashes
      var gateC = sB.beat > 0.45 ? 1 : 0.15;

      var ss = U * 0.115;
      for (var s3 = 0; s3 < 3; s3++) disc(px[s3], py[s3], ss * 1.12, MODS[TR.mods[s3]].color, 0.18);

      // chain links, bulging with the signal each one carries
      link(px[0], py[0], px[1], py[1], cx, cy, Math.abs((sA.amp - 0.5) * U * 0.16 * TR.wAB) + U * 0.012, blendFor(TR.mods[0], TR.mods[1]), astep(0.35 + 0.4 * sA.amp));
      link(px[1], py[1], px[2], py[2], cx, cy, Math.abs((sB.beat - 0.35) * U * 0.16 * TR.wBC) + U * 0.012, blendFor(TR.mods[1], TR.mods[2]), astep(0.35 + 0.4 * sB.beat));
      link(px[2], py[2], px[0], py[0], cx, cy, Math.abs((sC.spd - 0.5) * U * 0.16 * TR.wCA) + U * 0.012, blendFor(TR.mods[2], TR.mods[0]), astep(0.35 + 0.4 * sC.spd));

      var env = clamp01(Math.min(srt / 1.5, (ROUND_LEN - srt) / 1.5));
      sketch(TR.mods[0], px[0], py[0], ss * scaleA, srt, TR.slots[0], MODS[TR.mods[0]].color, env);
      sketch(TR.mods[1], px[1], py[1], ss, srt, TR.slots[1], MODS[TR.mods[1]].color, env);
      sketch(TR.mods[2], px[2], py[2], ss, srt, TR.slots[2], MODS[TR.mods[2]].color, env * gateC);
      if (gateC === 1) { ctx.strokeStyle = MODS[TR.mods[2]].color; ctx.globalAlpha = 0.5; ctx.lineWidth = Math.max(1, U * 0.002); ringPath(px[2], py[2], ss * 1.15); ctx.stroke(); ctx.globalAlpha = 1; }
    }

    // countdown: compressed 10:00, holds 0:00 through the wipe
    ctx.font = '600 ' + Math.round(U * 0.045) + 'px ui-monospace, Menlo, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1; ctx.fillStyle = '#E8E8E8';
    var label = inGap ? '0:00' : fmtCountdown(Math.ceil((ROUND_LEN - srt) * (600 / ROUND_LEN)));
    ctx.fillText(label, cx, U * 0.085);
    ctx.globalAlpha = 1;
  }

  // ---------- run ----------
  fit();
  draw(T0);

  var anchorStamp = null;
  function frame(stamp) {
    if (anchorStamp === null) anchorStamp = stamp;
    draw(T0 + (stamp - anchorStamp) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { fit(); draw(lastT); });
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { fit(); draw(lastT); });
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(function (stamp) {
      anchorStamp = stamp;
      frame(stamp);
    });
  }
})();
</script>
