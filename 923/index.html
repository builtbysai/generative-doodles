<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>142,036</title>
<style>
  html, body { margin: 0; padding: 0; background: #0D0B08; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- data: EU laws per year 1952-2019, synthesized ----------
   Facts honored: total = 142,036 laws; quiet opening (1952 = 1 voice);
   legislative peaks reach 8 voices, the documented maximum.
   Weights: slow growth + gaussian legislative peaks (~1973, ~1986,
   ~1992, ~2004, ~2009) + seeded jitter. Counts are floor-allocated,
   then the remainder is distributed one law at a time to the
   largest-weight years until the sum is EXACTLY 142,036 (verified:
   sum check in process.md). SCALE = maxCount/8 = 476.50, so
   voices = clamp(round(laws / SCALE), 1, 8).
   Result: 1952 -> 618 laws -> 1 voice; 1968 -> 1,524 laws -> 3 voices;
   peak 3,812 laws -> 8 voices. */
var YEARS = 68, YEAR0 = 1952;
var SCALE = 476.50;
var lawCounts = [], voiceCounts = [];
(function buildData(){
  var rng = mulberry32(923142);
  var w = [], i, g;
  for(i=0;i<YEARS;i++){
    g = 0.34 + 0.011*i;
    g += 0.95*Math.exp(-Math.pow(i-21,2)/(2*4*4));
    g += 0.70*Math.exp(-Math.pow(i-34,2)/(2*3.5*3.5));
    g += 1.35*Math.exp(-Math.pow(i-40,2)/(2*3*3));
    g += 0.80*Math.exp(-Math.pow(i-52,2)/(2*3.5*3.5));
    g += 0.55*Math.exp(-Math.pow(i-57,2)/(2*2.5*2.5));
    g *= (0.88 + 0.24*rng());
    w.push(g);
  }
  var sumW=0; for(i=0;i<YEARS;i++) sumW+=w[i];
  var total=142036, acc=0, counts=[];
  for(i=0;i<YEARS;i++){ var c=Math.floor(total*w[i]/sumW); counts.push(c); acc+=c; }
  var order=[]; for(i=0;i<YEARS;i++) order.push(i);
  order.sort(function(a,b){return w[b]-w[a];});
  var rem=total-acc, k=0;
  while(rem>0){ counts[order[k%YEARS]]++; rem--; k++; }
  while(rem<0){ counts[order[YEARS-1-(k%YEARS)]]--; rem++; k++; }
  var chk=0; for(i=0;i<YEARS;i++) chk+=counts[i];
  lawCounts = counts;
  for(i=0;i<YEARS;i++){
    var v=Math.round(counts[i]/SCALE); if(v<1)v=1; if(v>8)v=8;
    voiceCounts.push(v);
  }
})();

/* entry year index per voice (first year that voice is active) */
var entryIdx = [];
for(var v=0; v<8; v++){
  entryIdx.push(-1);
  for(var i=0;i<YEARS;i++){ if(voiceCounts[i]>v){ entryIdx[v]=i; break; } }
}

/* ---------- ribbons: per-voice normalized weave offsets ----------
   off[v][k], k = quarter-year steps (272 intervals). Lane offset plus
   two seeded sine waves; values are fractions of the weave amplitude. */
var Q = 4; /* samples per year */
var ribbonOff = [];
(function buildRibbons(){
  var rng = mulberry32(923777);
  for(var v=0; v<8; v++){
    var lane = (v-3.5)*0.085;
    var f1 = 1.6 + rng()*1.8, p1 = rng()*Math.PI*2;
    var f2 = 4.5 + rng()*4.0, p2 = rng()*Math.PI*2;
    var a1 = 0.34 + rng()*0.14, a2 = 0.13 + rng()*0.08;
    var arr = [];
    for(var k=0;k<=YEARS*Q;k++){
      var u = k/(YEARS*Q);
      arr.push(lane + a1*Math.sin(2*Math.PI*f1*u+p1) + a2*Math.sin(2*Math.PI*f2*u+p2));
    }
    ribbonOff.push(arr);
  }
})();

/* Ode to Joy subject head (semitones above tonic): E E F G G F E D */
var MELODY = [4,4,5,7,7,5,4,2];
var TONIC = [65.41, 82.41, 98.00, 110.00, 130.81, 146.83, 164.81, 196.00]; /* C2..G3 */

var GOLD = ['#4A3A18','#5E4A20','#7A5C1E','#8A6D2F','#C9A227','#D4AF37','#E3C766','#F0D878'];
var GROUND = '#0D0B08', NOTATION = '#F2EDE0', LABEL = '#6E6250', CAPTION = '#8A7B5F', CURSOR = '#F2F0EB';

/* ---------- timing / interaction state ----------
   All state is a function of t plus the recorded event list. */
var SEC_PER_YEAR = 180/68; /* 68 years in ~3 minutes */
var events = [];           /* {kind:'scrub',t0,t1,year} | {kind:'hold',t0,dur} */
var bursts = [];           /* {t0, yearIdx} tap flashes (visual) */
var pendingTap = null;     /* {t0, yearIdx} awaiting double-tap window */
var lastCursorYear = 1968;

function sweepFrom(anchorT, anchorYear, t){
  var dy = (anchorYear - YEAR0) + (t - anchorT)/SEC_PER_YEAR;
  dy = ((dy % YEARS) + YEARS) % YEARS;
  return YEAR0 + dy;
}
function cursorYearAt(t){
  var anchorT = 0, anchorYear = 1968, i, ev;
  for(i=0;i<events.length;i++){
    ev = events[i];
    if(ev.t0 > t) break;
    if(ev.kind === 'scrub'){
      if(ev.t1 !== null && ev.t1 <= t){ anchorT = ev.t1; anchorYear = ev.year; }
      else return ev.year;
    } else if(ev.kind === 'hold'){
      var end = ev.t0 + ev.dur;
      if(t < end) return YEAR0;
      anchorT = end; anchorYear = YEAR0;
    }
  }
  return sweepFrom(anchorT, anchorYear, t);
}

/* ---------- audio (lazy, first gesture only) ---------- */
var AC = null, masterFilter = null, masterGain = null;
var voiceNext = [0,0,0,0,0,0,0,0], voiceNote = [0,0,0,0,0,0,0,0];
function ensureAudio(){
  if(AC) { if(AC.resume) AC.resume(); return; }
  if(typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return;
  try{
    var Ctor = (typeof AudioContext !== 'undefined') ? AudioContext : webkitAudioContext;
    AC = new Ctor();
    masterFilter = AC.createBiquadFilter();
    masterFilter.type = 'lowpass'; masterFilter.frequency.value = 800; masterFilter.Q.value = 0.4;
    masterGain = AC.createGain(); masterGain.gain.value = 0.9;
    masterFilter.connect(masterGain); masterGain.connect(AC.destination);
    var now = AC.currentTime;
    for(var v=0; v<8; v++){ voiceNext[v] = now + 0.1 + v*0.76; voiceNote[v] = 0; }
  }catch(e){ AC = null; }
}
function playNote(v, when, dur){
  var semi = MELODY[voiceNote[v] % MELODY.length];
  var freq = TONIC[v] * Math.pow(2, semi/12);
  var osc = AC.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = freq;
  var g = AC.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(0.05, when + 0.06);
  g.gain.setValueAtTime(0.05, when + dur - 0.08);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  osc.connect(g); g.connect(masterFilter);
  osc.start(when); osc.stop(when + dur + 0.05);
}
function audioTick(){
  if(!AC) return;
  var now = AC.currentTime;
  var yi = Math.floor(lastCursorYear) - YEAR0;
  if(yi < 0) yi = 0; if(yi > YEARS-1) yi = YEARS-1;
  var active = voiceCounts[yi];
  for(var v=0; v<8; v++){
    if(v < active){
      while(voiceNext[v] <= now + 0.15){
        var start = Math.max(voiceNext[v], now);
        playNote(v, start, 0.38);
        voiceNote[v]++;
        voiceNext[v] = start + (voiceNote[v] % MELODY.length === 0 ? 1.14 : 0.38);
      }
    } else if(voiceNext[v] < now){
      voiceNext[v] = now + 0.1;
    }
  }
}
function fireBurst(yearIdx){
  bursts.push({t0: perfNow(), yearIdx: yearIdx});
  if(!AC) return;
  var active = voiceCounts[yearIdx];
  var now = AC.currentTime;
  for(var v=0; v<active; v++){
    var savedNote = voiceNote[v];
    for(var n=0; n<MELODY.length; n++){
      voiceNote[v] = n;
      playNote(v, now + 0.05 + v*0.19 + n*0.19, 0.19);
    }
    voiceNote[v] = savedNote;
  }
}

/* ---------- layout / sizing ---------- */
var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
function perfNow(){
  if(typeof performance !== 'undefined' && performance.now) return (performance.now() - startStamp)/1000;
  return 0;
}
function isPhone(){
  try{
    if(typeof window !== 'undefined' && window.screen){
      var m = Math.min(window.screen.width, window.screen.height);
      if(m > 0 && m < 700) return true;
    }
  }catch(e){}
  return false;
}
var L = { w:0, h:0, x0:0, x1:0, timelineY:0, amp:0, phone:false };
function layout(){
  var w, h;
  if(typeof window !== 'undefined' && window.visualViewport){
    w = window.visualViewport.width; h = window.visualViewport.height;
  } else {
    w = window.innerWidth; h = window.innerHeight;
  }
  var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
  if(canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  L.w = w; L.h = h;
  L.phone = isPhone() || (h > w*1.15 && Math.min(w,h) < 700);
  L.x0 = L.phone ? 16 : 72;
  L.x1 = w - (L.phone ? 16 : 48);
  L.timelineY = h*0.56;
  L.amp = h*0.27;
}
function yearToX(yf){ return L.x0 + ((yf - YEAR0)/YEARS)*(L.x1 - L.x0); }
function xToYear(x){
  var u = (x - L.x0)/(L.x1 - L.x0);
  if(u < 0) u = 0; if(u > 1) u = 1;
  return YEAR0 + u*YEARS;
}
function ribbonY(v, k){ return L.timelineY + ribbonOff[v][k]*L.amp*1.1; }

/* ---------- drawing ---------- */
function draw(t){
  layout();
  canvas.style.width = L.w + 'px';
  canvas.style.height = L.h + 'px';
  var w = L.w, h = L.h;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  var cursorYear = cursorYearAt(t);
  lastCursorYear = cursorYear;
  var cursorYi = Math.floor(cursorYear) - YEAR0;

  /* timeline */
  ctx.strokeStyle = LABEL; ctx.globalAlpha = 0.55; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(L.x0, L.timelineY); ctx.lineTo(L.x1, L.timelineY); ctx.stroke();
  ctx.globalAlpha = 1;

  var lw = Math.max(4.5, Math.min(w, h)*0.015);
  var v, k, yi;
  function strokeSpan(vv, y0, y1, alpha){
    /* one continuous stroke over years [y0, y1): no doubled-alpha joints */
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    var k0 = (y0 - YEAR0)*Q, k1 = (y1 - YEAR0)*Q;
    ctx.moveTo(yearToX(YEAR0 + k0/Q), ribbonY(vv, k0));
    for(var kk=k0+1; kk<=k1; kk++){
      ctx.lineTo(yearToX(YEAR0 + kk/Q), ribbonY(vv, kk));
    }
    ctx.stroke();
  }
  /* ribbons, back voices first so voice 1 (darkest) sits deepest */
  for(v=7; v>=0; v--){
    ctx.strokeStyle = GOLD[v];
    ctx.lineWidth = lw;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    /* ghost pass: the whole ribbon as one stroke */
    strokeSpan(v, YEAR0, YEAR0 + YEARS, 0.055);
    /* active pass: contiguous active runs, chunked to 3 years so the
       cursor boost can vary; alpha per chunk from its midpoint */
    yi = 0;
    while(yi < YEARS){
      if(v < voiceCounts[yi]){
        var start = yi;
        while(yi < YEARS && (v < voiceCounts[yi]) && (yi - start) < 3) yi++;
        var midYear = YEAR0 + (start + yi)/2;
        var dc = midYear - cursorYear;
        var a = 0.82 + 0.18*Math.exp(-(dc*dc)/(2*2.5*2.5));
        if(a > 1) a = 1;
        strokeSpan(v, YEAR0 + start, YEAR0 + yi, a);
      } else yi++;
    }
    /* tap-burst flash on the tapped year and its neighbours */
    for(var b=0; b<bursts.length; b++){
      var age = t - bursts[b].t0;
      if(age < 0 || age >= 1.1) continue;
      var by = bursts[b].yearIdx;
      var fa = (1 - age/1.1);
      for(var dy=-1; dy<=1; dy++){
        var yy = by + dy;
        if(yy < 0 || yy >= YEARS) continue;
        var isAct = v < voiceCounts[yy];
        strokeSpan(v, YEAR0 + yy, YEAR0 + yy + 1, fa*(isAct ? 0.95 : 0.28));
      }
    }
  }
  ctx.globalAlpha = 1;

  /* notation heads at each voice's entry */
  var nScale = L.phone ? 0.72 : 1;
  ctx.strokeStyle = NOTATION; ctx.fillStyle = NOTATION;
  for(v=0; v<8; v++){
    var ei = entryIdx[v];
    if(ei < 0) continue;
    var ex = yearToX(YEAR0 + ei);
    var ey = ribbonY(v, ei*Q);
    var sp = 6.4*nScale;
    ctx.globalAlpha = 0.35; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ex - 3*nScale, ey + 7*nScale); ctx.lineTo(ex + 8*sp + 3*nScale, ey + 7*nScale); ctx.stroke();
    ctx.globalAlpha = 0.92;
    for(var n=0; n<MELODY.length; n++){
      var nx = ex + n*sp, ny = ey - (MELODY[n]-2)*1.7*nScale;
      ctx.beginPath();
      ctx.ellipse(nx, ny, 2.7*nScale, 1.9*nScale, -0.35, 0, Math.PI*2);
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(nx + 2.4*nScale, ny); ctx.lineTo(nx + 2.4*nScale, ny - 8*nScale); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  /* cursor */
  var cx = yearToX(cursorYear);
  ctx.strokeStyle = CURSOR; ctx.globalAlpha = 0.9; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(cx, L.timelineY - L.amp*1.25); ctx.lineTo(cx, L.timelineY + L.amp*1.25); ctx.stroke();
  ctx.fillStyle = CURSOR;
  ctx.beginPath(); ctx.moveTo(cx - 4, L.timelineY - L.amp*1.25 - 6); ctx.lineTo(cx + 4, L.timelineY - L.amp*1.25 - 6); ctx.lineTo(cx, L.timelineY - L.amp*1.25); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;

  /* year labels */
  ctx.fillStyle = LABEL;
  ctx.font = (L.phone ? 9 : 11) + 'px ui-monospace, SFMono-Regular, Menlo, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  var labelYears = [1952, 1960, 1970, 1980, 1990, 2000, 2010, 2019];
  for(var li=0; li<labelYears.length; li++){
    var lx = yearToX(labelYears[li] + (labelYears[li] === 2019 ? 0.9 : 0));
    /* small tick */
    ctx.globalAlpha = 0.7;
    ctx.fillRect(yearToX(labelYears[li]) - 0.5, h - 52, 1, 5);
    ctx.globalAlpha = 1;
    ctx.fillText(String(labelYears[li]), lx, h - 34);
  }

  /* caption */
  ctx.fillStyle = CAPTION;
  ctx.font = (L.phone ? 10 : 12) + 'px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('one encoding: laws per year = voices.', L.x0, h - 14);
}

/* ---------- interaction ---------- */
var pDown = null; /* {x, y, t, scrubbing, scrubEv} */
function evtYear(e){
  var r = canvas.getBoundingClientRect();
  return xToYear(e.clientX - r.left);
}
function onDown(e){
  ensureAudio();
  var t = perfNow();
  pDown = { x: e.clientX, y: e.clientY, t: t, scrubbing: false, scrubEv: null };
}
function onMove(e){
  if(!pDown) return;
  var dx = e.clientX - pDown.x, dy = e.clientY - pDown.y;
  if(!pDown.scrubbing && Math.sqrt(dx*dx + dy*dy) > 7){
    pDown.scrubbing = true;
    var ev = { kind:'scrub', t0: perfNow(), t1: null, year: evtYear(e) };
    events.push(ev);
    pDown.scrubEv = ev;
    pendingTap = null;
  }
  if(pDown.scrubbing && pDown.scrubEv){
    var y = evtYear(e);
    if(y > YEAR0 + YEARS - 0.001) y = YEAR0 + YEARS - 0.001;
    pDown.scrubEv.year = y;
  }
}
function onUp(e){
  if(!pDown) return;
  var t = perfNow();
  if(pDown.scrubbing && pDown.scrubEv){
    pDown.scrubEv.t1 = t;
    pDown.scrubEv.year = evtYear(e);
    if(pDown.scrubEv.year > YEAR0 + YEARS - 0.001) pDown.scrubEv.year = YEAR0 + YEARS - 0.001;
  } else if(t - pDown.t < 0.6){
    var yi = Math.floor(evtYear(e)) - YEAR0;
    if(yi < 0) yi = 0; if(yi > YEARS-1) yi = YEARS-1;
    if(pendingTap && (t - pendingTap.t0) <= 0.35){
      /* double-tap: the quiet year */
      pendingTap = null;
      events.push({ kind:'hold', t0: t, dur: 6 });
    } else {
      pendingTap = { t0: t, yearIdx: yi };
    }
  }
  pDown = null;
}
if(typeof window !== 'undefined' && window.addEventListener){
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', function(){ pDown = null; });
  if(window.visualViewport && window.visualViewport.addEventListener){
    window.visualViewport.addEventListener('resize', function(){ draw(perfNow()); });
  }
  window.addEventListener('resize', function(){ draw(perfNow()); });
}

/* ---------- main loop ---------- */
function tick(){
  var t = perfNow();
  if(pendingTap && (t - pendingTap.t0) > 0.35){
    fireBurst(pendingTap.yearIdx);
    pendingTap = null;
  }
  draw(t);
  audioTick();
}
draw(0);
if(typeof requestAnimationFrame === 'function'){
  var loop = function(){ tick(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
