<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Mouth</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #161616; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // ---- Palette (strict) ----
  var BRASS = "#B08D3C";   // teeth
  var INNER = "#2A0D0A";   // mouth interior
  var LIPS  = "#7A3B2A";   // lips
  var WALL  = "#161616";   // wall

  function mixHex(a, b, t) {
    var pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
    var pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
    var r = Math.round(pa[0] + (pb[0] - pa[0]) * t);
    var g = Math.round(pa[1] + (pb[1] - pa[1]) * t);
    var bl = Math.round(pa[2] + (pb[2] - pa[2]) * t);
    return "rgb(" + r + "," + g + "," + bl + ")";
  }
  // Lips fill: the lip line tone deepened toward the interior (recorded mix).
  var LIP_FILL = mixHex(LIPS, INNER, 0.18);
  var LIP_EDGE = mixHex(LIPS, INNER, 0.42);

  // ---- Seeded RNG (mulberry32) ----
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- Teeth jitter, precomputed from the seed ----
  var TOP_N = 9, BOT_N = 8;
  var rng = mulberry32(815815);
  function toothSet(n) {
    var arr = [];
    for (var i = 0; i < n; i++) {
      arr.push({
        w: 0.90 + rng() * 0.16,        // width factor
        h: 0.92 + rng() * 0.16,        // length factor
        r: (rng() - 0.5) * 0.05        // rotation, radians (about +/-1.4 deg)
      });
    }
    return arr;
  }
  var topTeeth = toothSet(TOP_N);
  var botTeeth = toothSet(BOT_N);

  // ---- Canvas / viewport ----
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function fit() {
    var w = window.innerWidth, h = window.innerHeight;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    }
    DPR = window.devicePixelRatio || 1;
    W = Math.round(w); H = Math.round(h);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    if (window.screen && window.screen.width) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = H > W * 1.15;
    }
  }

  // ---- Laugh cycle ----
  // 16 s loop: open (0-3.2s) / hold open (3.2-7.2s) / close (7.2-10.4s) / hold closed (10.4-16s).
  var CYCLE = 16;
  var O_MIN = 0.06, O_MAX = 1.0;
  // Frame one is phased into the opening sweep: t=0 lands at cycle 2.56 s,
  // open parameter ~0.90, so the laugh and the teeth are already showing.
  var PHASE0 = 2.56;
  var TAP_JUMP = 5.37;      // each tap advances the cycle by this many seconds
  var SETTLE = 0.35;        // seconds for the post-tap settle

  function easeInOut(x) {
    return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  }
  function smooth(x) {
    x = Math.max(0, Math.min(1, x));
    return x * x * (3 - 2 * x);
  }
  function cycleOpen(ct) {
    var p = ((ct % CYCLE) + CYCLE) % CYCLE;
    if (p < 3.2)  return O_MIN + (O_MAX - O_MIN) * easeInOut(p / 3.2);
    if (p < 7.2)  return O_MAX;
    if (p < 10.4) return O_MAX - (O_MAX - O_MIN) * easeInOut((p - 7.2) / 3.2);
    return O_MIN;
  }

  // Tap records: { t, oBefore, jump } where jump is the cumulative cycle offset
  // in effect AFTER this tap. Open parameter is a closed-form function of
  // (t, taps): after a tap, the displayed openness settles from oBefore to
  // the new cycle value over SETTLE seconds.
  var taps = [];
  var cumJump = 0;

  function openAt(t) {
    var last = null;
    for (var i = taps.length - 1; i >= 0; i--) {
      if (taps[i].t <= t) { last = taps[i]; break; }
    }
    if (!last) return cycleOpen(t + PHASE0);
    var target = cycleOpen(t + PHASE0 + last.jump);
    var dt = t - last.t;
    if (dt >= SETTLE) return target;
    var k = smooth(dt / SETTLE);
    return last.oBefore + (target - last.oBefore) * k;
  }

  // ---- Mouth geometry ----
  // Quadratic edge curves of the inner opening, u in [0,1] left to right.
  function innerGeom(o) {
    var cx = W / 2;
    var cy = H * 0.52;
    var miw = W * (PHONE ? 0.455 : 0.42);
    var cyi = cy + o * H * 0.02;
    var topArch = H * (0.030 + 0.050 * o);
    var botArch = H * (0.040 + 0.300 * o);
    return { cx: cx, cy: cy, miw: miw, cyi: cyi, topArch: topArch, botArch: botArch };
  }
  function topY(g, u) { return g.cyi - 2 * u * (1 - u) * g.topArch; }
  function botY(g, u) { return g.cyi + 2 * u * (1 - u) * g.botArch; }

  function innerPath(g) {
    ctx.beginPath();
    ctx.moveTo(g.cx - g.miw, g.cyi);
    ctx.quadraticCurveTo(g.cx, g.cyi - g.topArch, g.cx + g.miw, g.cyi);
    ctx.quadraticCurveTo(g.cx, g.cyi + g.botArch, g.cx - g.miw, g.cyi);
    ctx.closePath();
  }

  function drawToothRow(g, teeth, isTop) {
    var n = teeth.length;
    var span = 2 * g.miw;
    var baseLen = H * (isTop ? 0.088 : 0.062);
    for (var i = 0; i < n; i++) {
      var j = teeth[i];
      var u0 = i / n, u1 = (i + 1) / n;
      var uc = (u0 + u1) / 2;
      var tw = (span / n) * 0.92 * j.w;
      var xc = g.cx - g.miw + span * uc;
      var yEdge = isTop ? topY(g, uc) : botY(g, uc);
      var len = baseLen * j.h;
      ctx.save();
      ctx.translate(xc, yEdge);
      ctx.rotate(j.r);
      ctx.fillStyle = BRASS;
      if (isTop) {
        ctx.fillRect(-tw / 2, -1, tw, len);
      } else {
        ctx.fillRect(-tw / 2, -len, tw, len + 1);
      }
      ctx.restore();
    }
  }

  function draw(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    // Wall
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);

    var o = openAt(t);
    var cx = W / 2, cy = H * 0.52;
    var mw = W * (PHONE ? 0.485 : 0.47);
    var topYlip = cy - H * (0.105 + 0.045 * o);
    var botYlip = cy + H * (0.115 + 0.205 * o);
    var cornerY = cy + H * (0.005 + 0.030 * o);

    // Outer lip shape (flat fill, caricature line via the deeper edge tone)
    ctx.beginPath();
    ctx.moveTo(cx - mw, cornerY);
    // upper lip: two humps with a shallow center dip (cupid's bow)
    ctx.bezierCurveTo(cx - mw * 0.58, topYlip - H * 0.028, cx - mw * 0.20, topYlip + H * 0.004, cx, topYlip + H * 0.020);
    ctx.bezierCurveTo(cx + mw * 0.20, topYlip + H * 0.004, cx + mw * 0.58, topYlip - H * 0.028, cx + mw, cornerY);
    // lower lip: one full arc
    ctx.bezierCurveTo(cx + mw * 0.62, botYlip, cx - mw * 0.62, botYlip, cx - mw, cornerY);
    ctx.closePath();
    ctx.fillStyle = LIP_FILL;
    ctx.fill();
    ctx.lineWidth = Math.max(2, H * 0.006);
    ctx.strokeStyle = LIP_EDGE;
    ctx.stroke();

    var g = innerGeom(o);

    // Interior
    innerPath(g);
    ctx.fillStyle = INNER;
    ctx.fill();

    // Teeth, clipped to the opening so they flash only as it opens
    ctx.save();
    innerPath(g);
    ctx.clip();
    drawToothRow(g, topTeeth, true);
    drawToothRow(g, botTeeth, false);
    ctx.restore();

    // Inner lip edge line over the opening rim
    innerPath(g);
    ctx.lineWidth = Math.max(1.5, H * 0.004);
    ctx.strokeStyle = LIP_EDGE;
    ctx.stroke();
  }

  // ---- Time / events ----
  var T0 = (window.performance && performance.now) ? performance.now() : 0;
  function nowT() {
    var n = (window.performance && performance.now) ? performance.now() : 0;
    return (n - T0) / 1000;
  }

  function onTap() {
    var t = nowT();
    var oBefore = openAt(t);
    cumJump += TAP_JUMP;
    taps.push({ t: t, oBefore: oBefore, jump: cumJump });
    draw(t);
  }
  if (window.addEventListener) {
    canvas.addEventListener("pointerdown", onTap);
    window.addEventListener("resize", function () { fit(); draw(nowT()); });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", function () { fit(); draw(nowT()); });
    }
  }

  fit();
  draw(0);

  if (typeof requestAnimationFrame === "function") {
    var loop = function () {
      draw(nowT());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
