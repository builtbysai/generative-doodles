<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9086 · Shear</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #E6E1D3; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var SEED = 9086;
  var GROUND = '#E6E1D3';
  var ACCENT = '#1F5A5A';
  var INKS = ['#1F1E1A', '#3A382F', '#7A766A', '#A8A294', '#C08A2D'];

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0;

  var els = [];
  var accentIdx = 0;

  function resize() {
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  }

  function layout() {
    var rnd = mulberry32(SEED);
    els = [];
    var diag = Math.min(W, H);
    // Asymmetric composition: elements spaced along a diagonal energy band
    // from upper-left toward lower-right, with deliberate negative space.
    var bandAngle = -Math.PI / 4;
    var count = 9; // fixed for balanced spacing
    accentIdx = Math.floor(rnd() * count);

    // Stratified positions along the band so nothing clumps
    var slots = [];
    for (var s = 0; s < count; s++) slots.push((s + 0.5) / count);
    // Shuffle slot order for organic feel
    for (var sh = slots.length - 1; sh > 0; sh--) {
      var sk = Math.floor(rnd() * (sh + 1));
      var st = slots[sh]; slots[sh] = slots[sk]; slots[sk] = st;
    }

    for (var i = 0; i < count; i++) {
      var along = slots[i];
      var perp = (rnd() - 0.5) * 0.34;      // tight band, not scatter
      var bx = along * W, by = along * H * 0.86 + H * 0.07;
      var px = Math.cos(bandAngle + Math.PI / 2), py = Math.sin(bandAngle + Math.PI / 2);
      var x = bx + px * perp * diag;
      var y = by + py * perp * diag;
      x = Math.max(diag * 0.1, Math.min(W - diag * 0.1, x));
      y = Math.max(diag * 0.1, Math.min(H - diag * 0.1, y));

      var kind = rnd();
      var type = kind < 0.45 ? 'bar' : (kind < 0.7 ? 'tri' : (kind < 0.88 ? 'line' : 'diamond'));
      var angle = (rnd() < 0.5 ? 1 : -1) * (Math.PI / 4) + (rnd() - 0.5) * 0.12;
      if (type === 'diamond') angle = Math.PI / 4;
      var len = diag * (0.1 + rnd() * 0.22);
      var wid = type === 'line' ? Math.max(2, diag * 0.008)
              : type === 'bar' ? diag * (0.028 + rnd() * 0.04)
              : type === 'diamond' ? diag * (0.05 + rnd() * 0.05)
              : diag * (0.09 + rnd() * 0.12);
      var color = INKS[Math.floor(rnd() * INKS.length)];
      var slideAmp = diag * (0.015 + rnd() * 0.03);
      var slideSpeed = 0.25 + rnd() * 0.4;
      var phase = rnd() * Math.PI * 2;
      var flipEvery = 7 + rnd() * 8;
      els.push({
        x: x, y: y, type: type, angle: angle, len: len, wid: wid,
        color: color, slideAmp: slideAmp, slideSpeed: slideSpeed,
        phase: phase, flipEvery: flipEvery, flipT: 0, flipFrom: angle,
        flipTo: angle, pop: 0
      });
    }

    // Relaxation: push apart any elements whose bounding circles overlap
    for (var iter = 0; iter < 24; iter++) {
      for (var a = 0; a < els.length; a++) {
        for (var b = a + 1; b < els.length; b++) {
          var ea = els[a], eb = els[b];
          var ra = Math.max(ea.len, ea.wid) * 0.42;
          var rb = Math.max(eb.len, eb.wid) * 0.42;
          var dx = eb.x - ea.x, dy = eb.y - ea.y;
          var d = Math.sqrt(dx * dx + dy * dy) || 0.001;
          var minD = (ra + rb) * 0.92;
          if (d < minD) {
            var push = (minD - d) / 2;
            var nx = dx / d, ny = dy / d;
            ea.x -= nx * push; ea.y -= ny * push;
            eb.x += nx * push; eb.y += ny * push;
          }
        }
      }
    }
    // Re-clamp after relaxation
    for (var c = 0; c < els.length; c++) {
      els[c].x = Math.max(diag * 0.08, Math.min(W - diag * 0.08, els[c].x));
      els[c].y = Math.max(diag * 0.08, Math.min(H - diag * 0.08, els[c].y));
    }
  }

  function drawEl(e, t, isAccent) {
    var col = isAccent ? ACCENT : e.color;
    // Slide along element's long axis
    var slide = e.slideAmp * Math.sin(t * e.slideSpeed + e.phase);
    // Flip easing for triangles
    var ang = e.angle;
    if (e.flipT > 0 && e.flipT < 1) {
      var k = e.flipT;
      var ease = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      ang = e.flipFrom + (e.flipTo - e.flipFrom) * ease;
    }
    var popScale = 1 + e.pop * 0.3;

    ctx.save();
    ctx.translate(e.x + Math.cos(ang) * slide, e.y + Math.sin(ang) * slide);
    ctx.rotate(ang);
    ctx.scale(popScale, popScale);
    ctx.fillStyle = col;

    if (e.type === 'bar') {
      ctx.fillRect(-e.len / 2, -e.wid / 2, e.len, e.wid);
    } else if (e.type === 'line') {
      ctx.fillRect(-e.len / 2, -e.wid / 2, e.len, e.wid);
    } else if (e.type === 'tri') {
      // Right triangle pointing along the diagonal
      ctx.beginPath();
      ctx.moveTo(-e.wid / 2, -e.wid / 2);
      ctx.lineTo(e.wid / 2, -e.wid / 2);
      ctx.lineTo(e.wid / 2, e.wid / 2);
      ctx.closePath();
      ctx.fill();
    } else { // diamond
      var s = e.wid * 0.7;
      ctx.beginPath();
      ctx.moveTo(0, -s); ctx.lineTo(s, 0); ctx.lineTo(0, s); ctx.lineTo(-s, 0);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  var startT = performance.now() / 1000;

  function frame() {
    var now = performance.now() / 1000;
    var t = now - startT;
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < els.length; i++) {
      var e = els[i];
      // Triangle flips
      if (e.type === 'tri') {
        var cyc = t / e.flipEvery;
        var step = Math.floor(cyc);
        var frac = cyc - step;
        if (frac < 0.12) {
          // Start a new flip at the beginning of each cycle
          if (e.flipT === 0 || e.flipT >= 1) {
            e.flipFrom = e.angle;
            e.flipTo = e.angle + Math.PI / 2;
            e.flipT = 0.0001;
          }
        }
        if (e.flipT > 0 && e.flipT < 1) {
          e.flipT = Math.min(1, e.flipT + 0.03);
          if (e.flipT >= 1) e.angle = e.flipTo;
        }
      }
      if (e.pop > 0) e.pop = Math.max(0, e.pop - 0.03);
      drawEl(e, t, i === accentIdx);
    }
    requestAnimationFrame(frame);
  }

  // Tap: flip nearest triangle, or nudge nearest bar to a new angle
  cv.addEventListener('pointerdown', function (ev) {
    var x = ev.clientX, y = ev.clientY;
    var best = -1, bestD = Infinity;
    for (var i = 0; i < els.length; i++) {
      var dx = els[i].x - x, dy = els[i].y - y;
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best >= 0) {
      var e = els[best];
      if (e.type === 'tri') {
        e.flipFrom = e.angle;
        e.flipTo = e.angle + Math.PI / 2;
        e.flipT = 0.0001;
      } else {
        e.angle += (Math.random() < 0.5 ? 1 : -1) * Math.PI / 2;
      }
      e.pop = 1;
    }
  });

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
