<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shibboleth Field</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #121110; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Strict palette
  var GROUND = '#121110';
  var INTERIOR = '#050505';
  var EDGE = '#E8E0D4';
  var GLOW = '#FF6B2C';

  var TAU = Math.PI * 2;
  var BASE = 696001;
  var CYCLE = 50;      // seconds per fault cycle
  var GROW_END = 40;   // propagation finishes at 40s, heal runs 40-50s

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function angDiff(a, b) {
    var d = a - b;
    while (d > Math.PI) d -= TAU;
    while (d < -Math.PI) d += TAU;
    return d;
  }
  function segHit(ax, ay, bx, by, cx, cy, dx, dy) {
    var d = (bx - ax) * (dy - cy) - (by - ay) * (dx - cx);
    if (Math.abs(d) < 1e-12) return false;
    var t = ((cx - ax) * (dy - cy) - (cy - ay) * (dx - cx)) / d;
    var u = ((cx - ax) * (by - ay) - (cy - ay) * (bx - ax)) / d;
    var e = 0.02;
    return t > e && t < 1 - e && u > e && u < 1 - e;
  }

  // ---- Viewport (Visual Viewport API, listeners on both) ----
  var viewW = 0, viewH = 0, dpr = 1, isPhone = false;
  function computeSize() {
    var vv = window.visualViewport;
    var w = (vv && vv.width) ? vv.width : window.innerWidth;
    var h = (vv && vv.height) ? vv.height : window.innerHeight;
    viewW = w; viewH = h;
    dpr = window.devicePixelRatio || 1;
    if (window.screen && window.screen.width && window.screen.height) {
      isPhone = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      isPhone = viewH > viewW * 1.15;
    }
    var bw = Math.max(1, Math.round(viewW * dpr));
    var bh = Math.max(1, Math.round(viewH * dpr));
    if (canvas.width !== bw) canvas.width = bw;
    if (canvas.height !== bh) canvas.height = bh;
  }

  // ---- Anchored clock (frame one is never wall-clock derived) ----
  var hasPerf = (typeof performance !== 'undefined' && performance && typeof performance.now === 'function');
  var t0 = hasPerf ? performance.now() : 0;
  function elapsed() { return hasPerf ? (performance.now() - t0) / 1000 : 0; }

  // ---- Ground grain (fixed seed, independent of cycle) ----
  var grain = [];
  (function buildGrain() {
    var rng = mulberry32(BASE + 4242);
    for (var i = 0; i < 2800; i++) {
      grain.push({
        x: rng(), y: rng(),
        s: 0.6 + rng() * 1.5,
        pale: rng() < 0.30,
        a: 0.04 + rng() * 0.10
      });
    }
  })();

  // ---- Fracture generation ----
  // A fault is a flat list of small segments:
  // { x1, y1, x2, y2, w1, w2 (widths in px-at-720), appear, dur } in growth order.
  var faultCache = {};

  function walk(rng, start, heading, target, maxSteps, committed, skipSeg) {
    // Random walk with heading inertia plus a gentle bias toward target.
    var pts = [{ x: start.x, y: start.y, h: heading }];
    var x = start.x, y = start.y, h = heading;
    for (var i = 0; i < maxSteps; i++) {
      var toT = Math.atan2(target.y - y, target.x - x);
      h += clamp(angDiff(toT, h), -0.04, 0.04) + (rng() - 0.5) * 0.52;
      var len = 0.020 + rng() * 0.014;
      var nx = x + Math.cos(h) * len;
      var ny = y + Math.sin(h) * len;
      var hit = false;
      for (var j = 0; j < committed.length; j++) {
        var s = committed[j];
        if (s === skipSeg) continue;
        if (segHit(x, y, nx, ny, s.x1, s.y1, s.x2, s.y2)) { hit = true; break; }
      }
      if (hit) break;
      pts.push({ x: nx, y: ny, h: h });
      x = nx; y = ny;
      if (x < -0.04 || x > 1.04 || y < -0.04 || y > 1.04) break;
    }
    return pts;
  }

  function buildFault(cycle) {
    if (faultCache[cycle]) return faultCache[cycle];
    var rng = mulberry32(BASE + cycle * 104729 + 17);
    var segs = [];
    var committed = [];

    // Origin on a seeded edge, aimed across the field at a target edge point.
    var side = Math.floor(rng() * 4);
    var along = 0.18 + rng() * 0.64;
    var origin, target;
    if (side === 0) { origin = { x: along, y: -0.02 }; target = { x: 0.2 + rng() * 0.6, y: 1.05 }; }
    else if (side === 1) { origin = { x: along, y: 1.02 }; target = { x: 0.2 + rng() * 0.6, y: -0.05 }; }
    else if (side === 2) { origin = { x: -0.02, y: along }; target = { x: 1.05, y: 0.2 + rng() * 0.6 }; }
    else { origin = { x: 1.02, y: along }; target = { x: -0.05, y: 0.2 + rng() * 0.6 }; }
    var h0 = Math.atan2(target.y - origin.y, target.x - origin.x) + (rng() - 0.5) * 0.5;

    // Main fault.
    var main = walk(rng, origin, h0, target, 110, committed, null);
    var mainSegs = [];
    var i, a, b;
    for (i = 0; i + 1 < main.length; i++) {
      a = main[i]; b = main[i + 1];
      var f1 = i / (main.length - 1), f2 = (i + 1) / (main.length - 1);
      var s = {
        x1: a.x, y1: a.y, x2: b.x, y2: b.y,
        w1: 6 + (2.1 - 6) * f1, w2: 6 + (2.1 - 6) * f2,
        appear: f1 * 0.58, dur: (0.58 / Math.max(1, main.length - 1)) * 1.7
      };
      mainSegs.push(s); committed.push(s);
    }
    for (i = 0; i < mainSegs.length; i++) segs.push(mainSegs[i]);

    // Side branches: 3-6, attached along the main, angled 30-60 degrees off it.
    var nBr = 3 + Math.floor(rng() * 4);
    var usedFrac = [];
    for (var k = 0; k < nBr; k++) {
      var frac = 0.14 + rng() * 0.74;
      var okF = true;
      for (var q = 0; q < usedFrac.length; q++) if (Math.abs(usedFrac[q] - frac) < 0.09) okF = false;
      if (!okF) continue;
      usedFrac.push(frac);
      var idx = Math.min(main.length - 2, Math.floor(frac * (main.length - 1)));
      var root = main[idx];
      var sign = rng() < 0.5 ? -1 : 1;
      var bh = root.h + sign * (0.52 + rng() * 0.53); // 30-60 degrees
      var bt = { x: root.x + Math.cos(bh) * 1.2, y: root.y + Math.sin(bh) * 1.2 };
      var maxSteps = Math.floor(14 + rng() * 22);
      var pts = walk(rng, root, bh, bt, maxSteps, committed, mainSegs[idx]);
      if (pts.length < 4) continue;
      var parentW = 6 + (2.1 - 6) * frac;
      var startW = Math.max(1.4, parentW * (0.60 + rng() * 0.16));
      var attachAppear = frac * 0.58;
      var span = Math.max(0.08, 0.97 - attachAppear - 0.02);
      for (i = 0; i + 1 < pts.length; i++) {
        a = pts[i]; b = pts[i + 1];
        var g1 = i / (pts.length - 1), g2 = (i + 1) / (pts.length - 1);
        var bs = {
          x1: a.x, y1: a.y, x2: b.x, y2: b.y,
          w1: startW + (1 - startW) * g1, w2: startW + (1 - startW) * g2,
          appear: attachAppear + g1 * span, dur: (span / Math.max(1, pts.length - 1)) * 1.7
        };
        segs.push(bs); committed.push(bs);
      }
    }

    segs.sort(function (p, r) { return p.appear - r.appear; });
    faultCache[cycle] = segs;
    return segs;
  }

  // ---- Cycle state: anchored epoch, taps advance it ----
  var anchorStart = 0;
  var anchorIndex = 0;

  function cycleState(t) {
    var local = t - anchorStart;
    var idx = anchorIndex + Math.floor(local / CYCLE);
    var phase = local - Math.floor(local / CYCLE) * CYCLE;
    return { index: idx, phase: phase };
  }

  // ---- Drawing ----
  function drawFault(segs, growT, phase, t, alphaMul) {
    var wScale = clamp(Math.min(viewW, viewH) / 720, 0.6, 2.2);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var i, s, f;
    // Pass 1: underglow on the freshest 30 percent of the growth front.
    for (i = 0; i < segs.length; i++) {
      s = segs[i];
      var age = growT - s.appear;
      if (age < 0 || age > 0.30) continue;
      f = clamp(age / s.dur, 0, 1);
      if (f <= 0) continue;
      var inten = 1 - age / 0.30;
      var pulse = 0.72 + 0.28 * Math.sin(TAU * t / 5.5 - s.appear * 46);
      var ex = s.x1 + (s.x2 - s.x1) * f, ey = s.y1 + (s.y2 - s.y1) * f;
      var w = (s.w1 + (s.w2 - s.w1) * f) * wScale;
      ctx.strokeStyle = GLOW;
      ctx.globalAlpha = 0.055 * inten * pulse * alphaMul;
      ctx.lineWidth = w * 3.4;
      ctx.beginPath(); ctx.moveTo(s.x1 * viewW, s.y1 * viewH); ctx.lineTo(ex * viewW, ey * viewH); ctx.stroke();
      ctx.globalAlpha = 0.11 * inten * pulse * alphaMul;
      ctx.lineWidth = w * 1.9;
      ctx.beginPath(); ctx.moveTo(s.x1 * viewW, s.y1 * viewH); ctx.lineTo(ex * viewW, ey * viewH); ctx.stroke();
    }
    // Pass 2: stamp discs along each revealed segment (heavily overlapped,
    // so the crack reads as one continuous tapered fissure, no joints).
    // Pale rim stamps first, then the dark interior core at 0.66 radius.
    var pass, radMul;
    for (pass = 0; pass < 2; pass++) {
      radMul = pass === 0 ? 0.5 : 0.33;
      ctx.fillStyle = pass === 0 ? EDGE : INTERIOR;
      ctx.globalAlpha = (pass === 0 ? 0.30 : 1) * alphaMul;
      for (i = 0; i < segs.length; i++) {
        s = segs[i];
        f = clamp((growT - s.appear) / s.dur, 0, 1);
        if (f <= 0) continue;
        var ax = s.x1 * viewW, ay = s.y1 * viewH;
        var bx = s.x2 * viewW, by = s.y2 * viewH;
        var segLen = Math.sqrt((bx - ax) * (bx - ax) + (by - ay) * (by - ay));
        var wMid = (s.w1 + s.w2) * 0.5 * wScale;
        var step = clamp(wMid * 0.32, 0.9, 3);
        var n = Math.max(1, Math.ceil(segLen / step));
        for (var k = 0; k <= n; k++) {
          var u = (k / n) * f;
          var wHere = (s.w1 + (s.w2 - s.w1) * u) * wScale;
          var r = Math.max(0.45, wHere * radMul);
          ctx.beginPath();
          ctx.arc(ax + (bx - ax) * u, ay + (by - ay) * u, r, 0, TAU);
          ctx.fill();
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    // Pin canvas CSS size every frame (house rule).
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, viewW, viewH);

    // Seeded grain over the ground.
    var gs = clamp(Math.min(viewW, viewH) / 720, 0.6, 2.2);
    for (var i = 0; i < grain.length; i++) {
      var g = grain[i];
      ctx.fillStyle = g.pale ? EDGE : INTERIOR;
      ctx.globalAlpha = g.a;
      ctx.fillRect(g.x * viewW, g.y * viewH, g.s * gs, g.s * gs);
    }
    ctx.globalAlpha = 1;

    var cs = cycleState(t);
    var segs = buildFault(cs.index);
    var growT, alphaMul;
    if (cs.phase < GROW_END) {
      var u = cs.phase / GROW_END;
      growT = u * u * (3 - 2 * u) * 0.25 + u * 0.75; // gentle easing, ends at 1
      if (cs.phase === 0) growT = 0.0035; // origin segment just beginning
      alphaMul = 1;
    } else {
      growT = 1;
      var hu = (cs.phase - GROW_END) / (CYCLE - GROW_END);
      alphaMul = 1 - (hu * hu * (3 - 2 * hu));
    }
    if (alphaMul > 0.001) drawFault(segs, growT, cs.phase, t, alphaMul);
  }

  // ---- Interaction: tap advances to a fresh fault ----
  var downInfo = null;
  function onDown(ev) {
    var t = elapsed();
    downInfo = { t: t, x: ev.clientX || 0, y: ev.clientY || 0 };
    if (ev.preventDefault) ev.preventDefault();
  }
  function onUp(ev) {
    if (!downInfo) return;
    var t = elapsed();
    var dx = (ev.clientX || 0) - downInfo.x, dy = (ev.clientY || 0) - downInfo.y;
    if ((t - downInfo.t) < 0.4 && dx * dx + dy * dy < 30 * 30) {
      var cs = cycleState(t);
      anchorIndex = cs.index + 1;
      anchorStart = t;
    }
    downInfo = null;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', function () { downInfo = null; });
  }
  function onResize() { computeSize(); draw(forcedT !== null ? forcedT : elapsed()); }
  if (window.addEventListener) window.addEventListener('resize', onResize);
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }

  // ---- Optional QA hook: ?seed=tNN forces the cycle clock (inert in production) ----
  var forcedT = null;
  try {
    var loc = (typeof location !== 'undefined' && location) ? location
      : ((window.location) ? window.location : null);
    var qs = (loc && loc.search) || '';
    var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(qs);
    if (m) forcedT = parseFloat(m[1]);
  } catch (e) { forcedT = null; }

  // ---- Boot: frame one is the synchronous draw at cycle t = 0 ----
  computeSize();
  draw(forcedT !== null ? forcedT : 0);

  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(forcedT !== null ? forcedT : elapsed());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
