<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№69 · Mineral Bloom</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f2ede3; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(58,58,56,0.6); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to stir the curl</div>
<script>
'use strict';

const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hash2(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); }
function vnoise(x,y){ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi; const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf); const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,y){ return vnoise(x,y)*0.6+vnoise(x*2.13+5.2,y*2.13+1.3)*0.28+vnoise(x*4.7+9.1,y*4.7+3.7)*0.12; }
let pointer=null, pointerDown=false;
canvas.addEventListener('pointerdown',e=>{ pointer={x:e.clientX,y:e.clientY}; pointerDown=true; if(onDown) onDown(e.clientX,e.clientY); });
canvas.addEventListener('pointermove',e=>{ if(pointer){ pointer.x=e.clientX; pointer.y=e.clientY; } if(onMove) onMove(e.clientX,e.clientY,pointerDown); });
function endP(){ pointerDown=false; if(onUp) onUp(); }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function makeGrowth(seed,cx,cy,r,opts){
  const rnd=mulberry(seed); const o=Object.assign({maxNodes:1000,maxLen:0.012,R:0.028,k1:0.18,k2:0.55,curl:0.0016,rect:null},opts||{});
  const pts=[]; const n0=26;
  for(let i=0;i<n0;i++){ const a=i/n0*Math.PI*2; pts.push({x:cx+Math.cos(a)*r*(0.8+rnd()*0.4), y:cy+Math.sin(a)*r*(0.8+rnd()*0.4)}); }
  const spacing=o.maxLen*0.72, Rr=Math.max(o.R, spacing*2.6), rate=Math.max(1,Math.round(o.maxNodes/170));
  const g={pts,o,seed,rnd,
    step:function(t){
      const p=this.pts, oo=this.o;
      const n=p.length;
      const fx=new Float32Array(n), fy=new Float32Array(n);
      // springs to neighbours: expand edges toward spacing
      for(let i=0;i<n;i++){ const a=p[i], b=p[(i+1)%n]; let dx=b.x-a.x, dy=b.y-a.y; let d=Math.sqrt(dx*dx+dy*dy)||0.001; const diff=(d-spacing)/d*0.22; fx[i]+=dx*diff*0.5; fy[i]+=dy*diff*0.5; fx[(i+1)%n]-=dx*diff*0.5; fy[(i+1)%n]-=dy*diff*0.5; }
      // repulsion from non-neighbours within Rr via buckets
      const cell=Rr, map=new Map();
      for(let i=0;i<n;i++){ const k=Math.floor(p[i].x/cell)+','+Math.floor(p[i].y/cell); if(!map.has(k)) map.set(k,[]); map.get(k).push(i); }
      for(let i=0;i<n;i++){ const pt=p[i]; const bx=Math.floor(pt.x/cell), by=Math.floor(pt.y/cell);
        for(let a=-1;a<=1;a++) for(let b=-1;b<=1;b++){ const arr=map.get((bx+a)+','+(by+b)); if(!arr) continue;
          for(let j=0;j<arr.length;j++){ const q=arr[j]; if(q===i) continue; const idxd=Math.min(Math.abs(q-i), n-Math.abs(q-i)); if(idxd<=2) continue; const dx=pt.x-p[q].x, dy=pt.y-p[q].y; const d2=dx*dx+dy*dy; if(d2<Rr*Rr&&d2>0.01){ const d=Math.sqrt(d2); const f=(Rr-d)/Rr*0.85; fx[i]+=dx/d*f; fy[i]+=dy/d*f; } } }
        // curl drift
        const ang=fbm(pt.x*0.0038+seed*0.37, pt.y*0.0038)*Math.PI*4;
        const ca=oo.curl*170; fx[i]+=Math.cos(ang)*ca*0.35; fy[i]+=Math.sin(ang)*ca*0.35;
      }
      for(let i=0;i<n;i++){ const pt=p[i]; pt.x+=fx[i]; pt.y+=fy[i];
        if(oo.rect){ pt.x=Math.max(oo.rect.x,Math.min(oo.rect.x+oo.rect.w,pt.x)); pt.y=Math.max(oo.rect.y,Math.min(oo.rect.y+oo.rect.h,pt.y)); } }
      // growth: insert nodes at random edges
      if(p.length<oo.maxNodes){ for(let s=0;s<rate&&p.length<oo.maxNodes;s++){ const i=Math.floor(this.rnd()*p.length); const a=p[i], b=p[(i+1)%p.length]; p.splice(i+1,0,{x:(a.x+b.x)/2+(this.rnd()-0.5)*1.5, y:(a.y+b.y)/2+(this.rnd()-0.5)*1.5}); } }
      // subdivide any overstretched edge
      for(let i=p.length-1;i>=0&&p.length<oo.maxNodes;i--){ const a=p[i], b=p[(i+1)%p.length]; const dx=b.x-a.x, dy=b.y-a.y; if(dx*dx+dy*dy>oo.maxLen*oo.maxLen*1.7){ p.splice(i+1,0,{x:(a.x+b.x)/2,y:(a.y+b.y)/2}); } }
    },
    grow:function(steps,t){ for(let s=0;s<steps;s++) this.step(t); }
  };
  return g;
}
function drawPoly(pts,close){ ctx.beginPath(); for(let i=0;i<pts.length;i++){ if(i===0) ctx.moveTo(pts[i].x,pts[i].y); else ctx.lineTo(pts[i].x,pts[i].y); } if(close) ctx.closePath(); ctx.stroke(); }

let onDown=null,onMove=null,onUp=null;
let blooms=[], vortex=null;
function buildBlooms(){ const [w,h]=viewportWH(); const phone=isPhone(); let ox,oy,S; if(phone){ ox=0; oy=0; S=Math.min(w,h); } else { S=Math.min(w,h); ox=(w-S)/2; oy=(h-S)/2; } const f={x:ox,y:oy,w:phone?w:S,h:phone?h:S};
  const defs=[{cx:0.50,cy:0.50,r:0.10,n:560,seed:6901},{cx:0.30,cy:0.32,r:0.06,n:330,seed:6902},{cx:0.70,cy:0.68,r:0.06,n:330,seed:6903}];
  blooms=defs.map(d=>{ const g=makeGrowth(d.seed, f.x+f.w*d.cx, f.y+f.h*d.cy, S*d.r, {maxNodes:d.n, maxLen:S*0.013, R:S*0.034, curl:0.0020, rect:{x:f.x+f.w*0.03,y:f.y+f.h*0.03,w:f.w*0.94,h:f.h*0.94}}); g.grow(170,0); return g; });
}
buildBlooms();
onDown=function(x,y){ vortex={x:x,y:y}; };
onMove=function(x,y,down){ if(down) vortex={x:x,y:y}; };
onUp=function(){ vortex=null; };
const PASTELS=['#e8b4a0','#9fb08a','#8aa3b8'];
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#f2ede3'; ctx.fillRect(0,0,w,h);
  const t=nowMs/1000; const breath=0.5+0.5*Math.sin(t*Math.PI*2/24);
  for(let bi=0;bi<blooms.length;bi++){ const g=blooms[bi]; g.o.curl=0.0008+breath*0.0022; g.step(t);
    if(vortex){ for(const pt of g.pts){ const dx=pt.x-vortex.x, dy=pt.y-vortex.y; const d2=dx*dx+dy*dy; if(d2<32400&&d2>4){ const d=Math.sqrt(d2); const s=(1-d/180)*0.06; const nx=pt.x+(-dy/d)*d*s*0.14, ny=pt.y+(dx/d)*d*s*0.14; pt.x=nx; pt.y=ny; } } }
    const pts=g.pts;
    ctx.lineJoin='round';
    ctx.strokeStyle=PASTELS[bi]; ctx.lineWidth=3.6; ctx.beginPath(); for(let k=0;k<pts.length;k++){ if(k===0) ctx.moveTo(pts[k].x,pts[k].y); else ctx.lineTo(pts[k].x,pts[k].y); } ctx.closePath(); ctx.stroke();
    ctx.strokeStyle='#3a3a38'; ctx.lineWidth=0.9; ctx.beginPath(); for(let k=0;k<pts.length;k++){ if(k===0) ctx.moveTo(pts[k].x,pts[k].y); else ctx.lineTo(pts[k].x,pts[k].y); } ctx.closePath(); ctx.stroke();
  }
  return {};
}
function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(10000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>{ buildBlooms(); drawFrame(performance.now()); });
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));

</script>
</body>
</html>
