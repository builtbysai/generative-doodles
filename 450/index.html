<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Big Disc</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#D8C8E0; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1, PHONE = false;

  function resize() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    if (window.screen && window.screen.width && window.screen.height) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = h > w * 1.15;
    }
  }
  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  if (window.addEventListener) window.addEventListener('resize', resize);

  var PHASE0 = 1.5;
  // Fixed palette modes in fixed order: lilac, sepia, cream. Each holds 30s,
  // cross-fading to the next over the last 5s of its block. Full cycle 90s.
  var MODES = [
    { sky: [216, 200, 224], disc: [242, 168, 140], roof: [46, 36, 48] },
    { sky: [138, 111, 92], disc: [181, 84, 47], roof: [51, 41, 31] },
    { sky: [240, 234, 224], disc: [242, 168, 122], roof: [46, 52, 64] }
  ];
  function mix(a, b, f) {
    return [Math.round(a[0] + (b[0] - a[0]) * f), Math.round(a[1] + (b[1] - a[1]) * f), Math.round(a[2] + (b[2] - a[2]) * f)];
  }
  function css(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
  function paletteAt(t) {
    var ct = t % 90;
    var mi = Math.floor(ct / 30) % 3;
    var within = ct % 30;
    var ni = (mi + 1) % 3;
    var f = within > 25 ? (within - 25) / 5 : 0;
    return {
      sky: css(mix(MODES[mi].sky, MODES[ni].sky, f)),
      disc: css(mix(MODES[mi].disc, MODES[ni].disc, f)),
      roof: css(mix(MODES[mi].roof, MODES[ni].roof, f))
    };
  }

  // Fixed skyline: roof blocks across the square, plus crane and cypresses.
  var BLOCKS = [
    { x: 0.00, w: 0.13, h: 0.16 }, { x: 0.13, w: 0.10, h: 0.22 },
    { x: 0.23, w: 0.14, h: 0.12 }, { x: 0.37, w: 0.11, h: 0.26 },
    { x: 0.48, w: 0.13, h: 0.14 }, { x: 0.61, w: 0.12, h: 0.20 },
    { x: 0.73, w: 0.12, h: 0.11 }, { x: 0.85, w: 0.15, h: 0.18 }
  ];

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var pal = paletteAt(t);
    // page ground takes the current sky color; the square keeps its shape
    ctx.fillStyle = pal.sky;
    ctx.fillRect(0, 0, W, H);

    var S = Math.min(W, H);
    var sx = (W - S) / 2, sy = (H - S) / 2;

    // the disc: flat, centered in the upper third, about 40% of frame width,
    // breathing slowly over 90s (rise, fall, and a slight radius swell)
    var breathe = Math.sin((t / 90) * Math.PI * 2);
    var dcx = sx + S * 0.5;
    var dcy = sy + S * 0.32 + breathe * S * 0.012;
    var dr = S * 0.20 * (1 + 0.03 * breathe);
    ctx.fillStyle = pal.disc;
    ctx.beginPath(); ctx.arc(dcx, dcy, dr, 0, Math.PI * 2); ctx.fill();

    // a thin cloud band occasionally crosses the disc (one pass per minute)
    var cloudT = t % 60;
    if (cloudT >= 20 && cloudT < 40) {
      var cx = sx - S * 0.25 + ((cloudT - 20) / 20) * S * 1.5;
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.beginPath(); ctx.ellipse(cx, dcy - dr * 0.15, S * 0.16, dr * 0.16, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + S * 0.10, dcy + dr * 0.10, S * 0.11, dr * 0.12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx - S * 0.11, dcy + dr * 0.05, S * 0.08, dr * 0.10, 0, 0, Math.PI * 2); ctx.fill();
    }

    // skyline: silhouetted rooftops filling the bottom 30% of the square
    var base = sy + S;
    ctx.fillStyle = pal.roof;
    for (var i = 0; i < BLOCKS.length; i++) {
      var bl = BLOCKS[i];
      var bx = sx + bl.x * S, bw = bl.w * S, bh = bl.h * S;
      ctx.fillRect(bx, base - bh, bw, bh);
      // pitched cap on alternating blocks
      if (i % 2 === 0) {
        ctx.beginPath();
        ctx.moveTo(bx, base - bh);
        ctx.lineTo(bx + bw / 2, base - bh - S * 0.03);
        ctx.lineTo(bx + bw, base - bh);
        ctx.closePath(); ctx.fill();
      }
    }
    // crane over the right-hand roofs
    var crx = sx + S * 0.70, cry = base - S * 0.26;
    ctx.strokeStyle = pal.roof; ctx.lineWidth = Math.max(2, S * 0.006); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(crx, base); ctx.lineTo(crx, cry); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(crx - S * 0.05, cry); ctx.lineTo(crx + S * 0.16, cry); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(crx + S * 0.13, cry); ctx.lineTo(crx + S * 0.13, cry + S * 0.07); ctx.stroke();
    ctx.fillRect(crx - S * 0.055, cry - S * 0.012, S * 0.03, S * 0.024);
    // cypress trees: thin dark verticals at the skyline edge
    var cyps = [0.06, 0.30, 0.56, 0.92];
    for (var c = 0; c < cyps.length; c++) {
      var gx = sx + cyps[c] * S;
      ctx.beginPath(); ctx.ellipse(gx, base - S * 0.075, S * 0.012, S * 0.075, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  draw(PHASE0);
  if (typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    var loop = function (now) {
      draw(PHASE0 + (now - start) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
