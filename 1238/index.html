<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Air We Breathe</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #C08A3E; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* No.1238 "The Air We Breathe" - Christina Battle study block CB7.
   Shared air made visible: five unequal flat air bands, smell ribbons
   drifting through them, and two branching-tree lungs breathing on a
   12-second cycle that never changes tempo. Inhalation is shared and
   unequal: the clean smells ride high, the pollutants sink into the murk. */

var T0 = 3.2;                 /* fixed first-frame phase: mid-inhale */
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

/* ---------- seeded randomness only ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash2(a, b) {
  var h = Math.imul(a + 1, 374761393) + Math.imul(b + 1, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/* ---------- smell table: clean rides high, pollutants sink ---------- */
var SMELLS = [
  { name: 'sweetgrass', color: '#7A9A5A', y: 0.155 },
  { name: 'cut grass',  color: '#86A860', y: 0.285 },
  { name: 'rain',       color: '#8A8D94', y: 0.415 },
  { name: 'diesel',     color: '#7A5A3E', y: 0.600 },
  { name: 'exhaust',    color: '#6E6258', y: 0.715 },
  { name: 'wildfire',   color: '#D96A2E', y: 0.815 },
  { name: 'smoke',      color: '#C85A28', y: 0.905 }
];

/* ribbon order derives from the seed; double-tap reseeds */
var seedSalt = 0;
var BASE_SEED = 1238;
function smellOrder() {
  var idx = [0, 1, 2, 3, 4, 5, 6];
  var rnd = mulberry32(BASE_SEED * 31 + seedSalt * 7919);
  for (var i = idx.length - 1; i > 0; i--) {
    var j = Math.floor(rnd() * (i + 1));
    var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
  }
  return idx;
}

/* ---------- interaction state (recorded events only) ---------- */
var holdIntervals = [];       /* closed [start, end] press intervals, piece seconds */
var holdStart = -1;           /* open press start, or -1 */
var lastTapAt = -10;          /* wall-piece time of last tap, for double-tap */
var loadWall = null;          /* performance.now at first frame */

/* drift time: advances at full rate, quarter rate while the piece is held.
   Closed-form from the recorded intervals. Breathing never uses this clock. */
function driftTime(t) {
  var held = 0;
  for (var i = 0; i < holdIntervals.length; i++) {
    var a = holdIntervals[i][0], b = Math.min(holdIntervals[i][1], t);
    if (b > a) held += b - a;
  }
  if (holdStart >= 0 && t > holdStart) held += t - holdStart;
  return t - 0.75 * held;
}

function pieceNow() {
  if (loadWall === null) return T0;
  return T0 + (performance.now() - loadWall) / 1000;
}
function beginHold() { if (holdStart < 0) holdStart = pieceNow(); }
function endHold() {
  if (holdStart >= 0) { holdIntervals.push([holdStart, pieceNow()]); holdStart = -1; }
}
canvas.addEventListener('pointerdown', function () { beginHold(); });
window.addEventListener('pointerup', function () {
  var now = pieceNow();
  if (now - lastTapAt < 0.32) { seedSalt++; lastTapAt = -10; }
  else lastTapAt = now;
  endHold();
});
canvas.addEventListener('pointercancel', function () { endHold(); });

/* ---------- viewport ---------- */
function viewport() {
  var w, h;
  if (window.visualViewport) { w = window.visualViewport.width; h = window.visualViewport.height; }
  else { w = window.innerWidth; h = window.innerHeight; }
  return { w: w, h: h };
}
function isPhone(w, h) {
  var sw = window.screen ? window.screen.width : 0;
  var sh = window.screen ? window.screen.height : 0;
  var minPhys = Math.min(sw, sh);
  if (minPhys > 0 && minPhys < 700) return true;
  return h > w * 1.15;
}

/* ---------- air bands: flat fills, flat intermediate strips ---------- */
var BAND_COLORS = ['#A8C8DC', '#BCC6BC', '#C9C2AE', '#C4A668', '#C08A3E'];
var BAND_MIX = ['#B2C7CC', '#C2C4B5', '#C6B48A', '#C29852'];   /* 50/50 mixes */
var BAND_EDGES = [0, 0.10, 0.26, 0.46, 0.68, 1.0];            /* clear scarce, murk thickest */

function bandEdgeY(k, t, H) {
  if (k === 0) return 0;
  if (k === BAND_EDGES.length - 1) return H;
  var base = BAND_EDGES[k] * H;
  return base + Math.sin(t * 0.11 + k * 1.7) * H * 0.006 + Math.sin(t * 0.043 + k * 3.1) * H * 0.005;
}
function drawBands(W, H, t) {
  var ys = [];
  for (var k = 0; k < BAND_EDGES.length; k++) ys.push(bandEdgeY(k, t, H));
  for (var b = 0; b < 5; b++) {
    ctx.fillStyle = BAND_COLORS[b];
    ctx.fillRect(0, ys[b], W, ys[b + 1] - ys[b]);
  }
  /* soft boundaries: two flat intermediate strips straddling each edge */
  var sw = Math.max(2, H * 0.011);
  ctx.fillStyle = BAND_MIX[0];
  for (var e = 1; e < 5; e++) {
    ctx.fillStyle = BAND_MIX[e - 1];
    ctx.globalAlpha = 0.55;
    ctx.fillRect(0, ys[e] - sw, W, sw);
    ctx.globalAlpha = 0.35;
    ctx.fillRect(0, ys[e], W, sw);
    ctx.globalAlpha = 1;
  }
  /* murk blobs drifting in the lower bands */
  for (var m = 0; m < 6; m++) {
    var bx = ((hash2(m, 11) + t * (0.004 + 0.003 * hash2(m, 12))) % 1.2 - 0.1) * W;
    var by = (0.62 + 0.33 * hash2(m, 13)) * H + Math.sin(t * 0.07 + m * 2.3) * H * 0.012;
    var br = (0.05 + 0.06 * hash2(m, 14)) * W;
    ctx.fillStyle = m % 2 ? '#8A5A26' : '#D9B878';
    ctx.globalAlpha = 0.05 + 0.04 * hash2(m, 15);
    ctx.beginPath();
    ctx.ellipse(bx, by, br, br * 0.20, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/* ---------- breathing: the one constant, a 12 s cycle ---------- */
function breathE(t) {
  var p = ((t % 12) + 12) % 12;
  if (p < 5) { var u = p / 5; return u * u * (3 - 2 * u); }        /* inhale */
  if (p < 6) return 1;                                             /* hold */
  if (p < 11) { var v = (p - 6) / 5; return 1 - v * v * (3 - 2 * v); } /* exhale */
  return 0;                                                        /* rest */
}

/* ---------- lungs: two branching trees ---------- */
function drawBranch(x, y, ang, len, wid, level, spread) {
  var ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
  ctx.lineWidth = wid;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  if (level <= 0) return;
  drawBranch(ex, ey, ang - spread, len * 0.78, Math.max(0.7, wid * 0.68), level - 1, spread);
  drawBranch(ex, ey, ang + spread, len * 0.78, Math.max(0.7, wid * 0.68), level - 1, spread);
}
function drawLungs(W, H, t) {
  var e = breathE(t);
  var cx = W / 2, topY = H * 0.285, splitY = H * 0.435;
  var lenScale = 1 + 0.06 * e;
  var spread = 0.34 + 0.10 * e;
  var rootLen = H * 0.085 * lenScale;
  ctx.strokeStyle = '#2E3438';
  ctx.globalAlpha = 0.88;
  ctx.lineCap = 'round';
  /* trachea */
  ctx.lineWidth = Math.max(2.5, H * 0.007);
  ctx.beginPath();
  ctx.moveTo(cx, topY);
  ctx.lineTo(cx, splitY);
  ctx.stroke();
  /* bronchi + trees, mirrored */
  var bx = W * 0.030, by = H * 0.012;
  ctx.lineWidth = Math.max(2, H * 0.0055);
  ctx.beginPath(); ctx.moveTo(cx, splitY); ctx.lineTo(cx - bx, splitY + by); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, splitY); ctx.lineTo(cx + bx, splitY + by); ctx.stroke();
  drawBranch(cx - bx, splitY + by, Math.PI * 0.68, rootLen, Math.max(1.8, H * 0.005), 4, spread);
  drawBranch(cx + bx, splitY + by, Math.PI * 0.32, rootLen, Math.max(1.8, H * 0.005), 4, spread);
  ctx.globalAlpha = 1;
}

/* ---------- smell ribbons ---------- */
var STREAM = 1.75;             /* stream length, width units: one full smell cycle */
var BASE_SPEED = 0.052;        /* width units per drift-second */

function ribbonPathPt(inst, smell, s, W, H, tau, e) {
  var head = inst.head, len = inst.len;
  var px = head - s * len;
  var wob = Math.sin(px * 0.011 + tau * 0.6 + inst.phase) * H * 0.012
          + Math.sin(px * 0.027 - tau * 0.35 + inst.phase * 2.1) * H * 0.006;
  var py = smell.y * H + inst.yJit * H + wob;
  /* on the inhale, air near the lungs is drawn in toward them */
  var cx = W / 2, cy = H * 0.52;
  var dxn = (px - cx) / (W * 0.30);
  var prox = Math.exp(-dxn * dxn);
  py += (cy - py) * 0.38 * prox * e;
  return { x: px, y: py };
}
function drawRibbon(inst, smell, W, H, tau, e, labelFs) {
  var N = 22, top = [], bot = [], i, s, pt;
  var maxTh = H * (0.016 + 0.010 * inst.thVar);
  for (i = 0; i <= N; i++) {
    s = i / N;
    pt = ribbonPathPt(inst, smell, s, W, H, tau, e);
    var th = maxTh * Math.sin(Math.PI * (0.10 + 0.80 * s)) + 0.6;
    top.push({ x: pt.x, y: pt.y - th });
    bot.push({ x: pt.x, y: pt.y + th });
  }
  ctx.fillStyle = smell.color;
  ctx.globalAlpha = 0.46;
  ctx.beginPath();
  ctx.moveTo(top[0].x, top[0].y);
  for (i = 1; i <= N; i++) ctx.lineTo(top[i].x, top[i].y);
  for (i = N; i >= 0; i--) ctx.lineTo(bot[i].x, bot[i].y);
  ctx.closePath();
  ctx.fill();
  /* centre thread */
  ctx.strokeStyle = smell.color;
  ctx.globalAlpha = 0.65;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (i = 0; i <= N; i++) {
    s = i / N;
    pt = ribbonPathPt(inst, smell, s, W, H, tau, e);
    if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
  /* trailing particles past the tail */
  ctx.fillStyle = smell.color;
  for (var j = 1; j <= 9; j++) {
    var sj = 1 + j * 0.055;
    var pp = ribbonPathPt(inst, smell, sj, W, H, tau, e);
    var jx = (hash2(inst.idx * 7 + j, 21) - 0.5) * H * 0.02;
    var jy = (hash2(inst.idx * 7 + j, 22) - 0.5) * H * 0.02;
    ctx.globalAlpha = 0.5 * (1 - j / 10);
    var r = 1.6 * (1 - j / 14);
    ctx.fillRect(pp.x + jx - r / 2, pp.y + jy - r / 2, r, r);
  }
  ctx.globalAlpha = 1;
  /* label, small, bottom-left of the ribbon */
  var lp = ribbonPathPt(inst, smell, 0.95, W, H, tau, e);
  if (lp.x > 2 && lp.x < W * 0.92) {
    ctx.fillStyle = '#3A3A38';
    ctx.globalAlpha = 0.9;
    ctx.font = labelFs + 'px system-ui, -apple-system, "Segoe UI", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(smell.name, lp.x, lp.y + maxTh + H * 0.008);
    ctx.globalAlpha = 1;
  }
}
function drawRibbons(W, H, tau, e, labelFs) {
  var order = smellOrder();
  var insts = [];
  for (var i = 0; i < 7; i++) {
    var f = 0.85 + 0.35 * hash2(i, seedSalt * 3 + 31);
    var pos = (i * (STREAM / 7) + tau * BASE_SPEED * f) % STREAM;
    var head = (pos - 0.42) * W;
    var len = (0.30 + 0.20 * hash2(i, 41)) * W;
    if (head < -0.05 * W || head - len > 1.08 * W) continue;
    insts.push({
      idx: i, head: head, len: len,
      phase: hash2(i, 51) * Math.PI * 2,
      yJit: (hash2(i, 52) - 0.5) * 0.03,
      thVar: hash2(i, 53),
      smell: SMELLS[order[i % 7]]
    });
  }
  insts.sort(function (a, b) { return a.smell.y - b.smell.y; });
  for (var k = 0; k < insts.length; k++) drawRibbon(insts[k], insts[k].smell, W, H, tau, e, labelFs);
}

/* ---------- frame ---------- */
function draw(t) {
  var vp = viewport();
  var W = Math.max(50, Math.round(vp.w)), H = Math.max(50, Math.round(vp.h));
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var phone = isPhone(W, H);
  var labelFs = Math.round(Math.min(15, Math.max(11, W * 0.012)) * (phone ? 1.1 : 1));
  var tau = driftTime(t);
  var e = breathE(t);
  drawBands(W, H, t);
  drawRibbons(W, H, tau, e, labelFs);
  drawLungs(W, H, t);
}

draw(T0);
if (typeof requestAnimationFrame === 'function') {
  loadWall = performance.now();
  var loop = function () {
    draw(pieceNow());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', function () { draw(pieceNow()); });
}
window.addEventListener('resize', function () { draw(pieceNow()); });
</script>
</body>
</html>
