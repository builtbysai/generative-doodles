<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chamán-Cóndor</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F0EAD9; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict): paper, ink, condor brown, one pale sky wash.
  var PAPER = '#F0EAD9';
  var INK = '#1C1A17';
  var BROWN = '#4A3226';
  var SKY = '#B9C4C9';

  var LOOP_S = 45;          // seconds per loop: human -> condor -> human
  var FORCE_T = -1;         // QA hook: -1 = live clock, else fixed loop time in seconds

  // QA seed hook: ?seed=tNN pins the loop time (used by the headless renderer).
  try {
    if (typeof location !== 'undefined' && location.search) {
      var qm = /[?&]seed=t([0-9]+(?:\.[0-9]+)?)/.exec(location.search);
      if (qm) FORCE_T = parseFloat(qm[1]);
    }
  } catch (e) { /* live mode */ }

  // Seeded RNG (mulberry32): every jitter table is built once from it.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function lerp(a, b, u) { return a + (b - a) * u; }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function frac(x) { return ((x % 1) + 1) % 1; }

  // ------------------------------------------------------------------
  // The ambiguity easing. The loop position is a triangle wave (0 at
  // the human ends, 1 at the condor midpoint). The morph amount m is
  // the triangle pushed through m = tri + C*sin(2*pi*tri), whose slope
  // is 1.8x at the ends and 0.2x in the middle: the figure hurries out
  // of the pure states and dwells where arms are half wings, feathers
  // half grown, and neither form can be named.
  // ------------------------------------------------------------------
  var DWELL_C = 0.8 / (2 * Math.PI);
  function dwell(tri) { return tri + DWELL_C * Math.sin(2 * Math.PI * tri); }
  function dwellInv(m) {
    var tri = m;
    for (var i = 0; i < 6; i++) {
      var f = dwell(tri) - m;
      var d = 1 + 0.8 * Math.cos(2 * Math.PI * tri);
      tri -= f / d;
    }
    return clamp(tri, 0, 1);
  }

  // ------------------------------------------------------------------
  // Two skeletons, matched joint for joint, in body-local units
  // (x right, y up, ground line at y = -0.53, pelvis near origin).
  // The head joint barely moves between poses: the head stays human.
  // ------------------------------------------------------------------
  var HUMAN = {
    pelvis: [0, 0.02], chest: [0, 0.32], neck: [0, 0.43], headC: [0, 0.55],
    shoulder: [0.17, 0.395], elbow: [0.27, 0.19], wrist: [0.235, -0.01],
    hip: [0.09, 0.0], knee: [0.105, -0.25], ankle: [0.105, -0.50]
  };
  var CONDOR = {
    pelvis: [0, -0.02], chest: [0, 0.26], neck: [0, 0.37], headC: [0.01, 0.50],
    shoulder: [0.15, 0.35], elbow: [0.78, 0.52], wrist: [1.38, 0.35],
    hip: [0.085, -0.04], knee: [0.10, -0.26], ankle: [0.115, -0.49]
  };
  var JOINTS = ['pelvis', 'chest', 'neck', 'headC', 'shoulder', 'elbow',
                'wrist', 'hip', 'knee', 'ankle'];

  // ------------------------------------------------------------------
  // Seeded stroke tables. A limb segment is drawn as longitudinal
  // wavy strokes plus diagonal cross-hatches; the table holds the
  // per-stroke parameters so the jitter is identical every frame.
  // ------------------------------------------------------------------
  function makeSegTable(seed, nLong, nCross) {
    var rng = mulberry32(seed);
    var longs = [], crosses = [], i;
    for (i = 0; i < nLong; i++) {
      longs.push({
        v: -0.62 + 1.24 * (nLong === 1 ? 0.5 : i / (nLong - 1)) + (rng() - 0.5) * 0.14,
        wob: (rng() - 0.5) * 0.16,
        ph: rng() * Math.PI * 2,
        a: 0.45 + rng() * 0.4
      });
    }
    for (i = 0; i < nCross; i++) {
      crosses.push({
        u: 0.06 + 0.88 * ((i + 0.5) / nCross) + (rng() - 0.5) * 0.03,
        slant: 0.5 + rng() * 0.9,
        a: 0.30 + rng() * 0.35
      });
    }
    return { longs: longs, crosses: crosses };
  }
  var SEG = {
    upperArm: makeSegTable(666101, 3, 6),
    foreArm: makeSegTable(666113, 3, 5),
    thigh: makeSegTable(666127, 3, 6),
    shin: makeSegTable(666139, 3, 5),
    torsoUp: makeSegTable(666149, 4, 5),
    torsoLo: makeSegTable(666157, 5, 7),
    neck: makeSegTable(666163, 2, 3)
  };

  // Feathers: 36 per wing, rooted along the arm spine (shoulder ->
  // elbow -> wrist). t = arc-length position along the spine; the
  // primaries near the tip are the longest and the last to grow.
  var FEATHERS = (function () {
    var rng = mulberry32(666211);
    var out = [];
    for (var i = 0; i < 36; i++) {
      var t = (i + 0.5) / 36;
      out.push({
        t: t + (rng() - 0.5) * 0.012,
        lenJ: 0.92 + rng() * 0.16,
        widJ: 0.85 + rng() * 0.35,
        ph: rng() * Math.PI * 2
      });
    }
    return out;
  })();
  function featherLen(t) { return 0.13 + 0.40 * Math.pow(t, 1.35) + 0.05 * Math.sin(t * Math.PI); }
  function featherGrow(m, t) { return smooth((m - 0.05 - 0.45 * t) / 0.4); }

  // Ground sketch ticks (seeded).
  var GROUND_TICKS = (function () {
    var rng = mulberry32(666307);
    var out = [];
    for (var i = 0; i < 26; i++) {
      out.push({ x: (rng() * 2 - 1) * 0.85, y: 0.006 + rng() * 0.03, l: 0.02 + rng() * 0.05, a: 0.15 + rng() * 0.3 });
    }
    return out;
  })();

  // ------------------------------------------------------------------
  // Canvas + layout
  // ------------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, isPhone = false;
  var CX = 0, S = 100, groundY = 0, LW = 1.2;
  var lastElapsed = 0, lastPhi = 0, lastM = 0;

  function layout() {
    CX = W / 2;
    S = isPhone ? Math.min(0.31 * W, 0.50 * H) : Math.min(0.29 * W, 0.55 * H);
    groundY = isPhone ? 0.60 * H : 0.78 * H;
    LW = clamp(S * 0.0042, 0.8, 2.4);
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (window.screen) {
      isPhone = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      isPhone = H > W * 1.15;
    }
    layout();
    draw(lastElapsed);
  }

  // ------------------------------------------------------------------
  // Interaction state: pupils track the pointer; a horizontal drag
  // scrubs the morph phase. Events carry anchored times only through
  // the rAF clock; frame one (no events) is untouched by them.
  // ------------------------------------------------------------------
  var pointer = { x: -1, y: -1 };
  var dragging = false, dragStartX = 0, dragStartM = 0, dragBranchUp = true, dragPhi = 0;
  var phaseOffset = 0;

  function setPointer(e) {
    var r = (typeof canvas.getBoundingClientRect === 'function')
      ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    pointer.x = e.clientX - r.left;
    pointer.y = e.clientY - r.top;
  }
  function onDown(e) {
    setPointer(e);
    dragging = true;
    dragStartX = pointer.x;
    dragStartM = lastM;
    dragBranchUp = lastPhi < 0.5;
    dragPhi = lastPhi;
  }
  function onMove(e) {
    setPointer(e);
    if (!dragging) return;
    var dm = (pointer.x - dragStartX) / (0.55 * W);
    var targetM = clamp(dragStartM + dm, 0, 1);
    var tri = dwellInv(targetM);
    dragPhi = dragBranchUp ? tri / 2 : 1 - tri / 2;
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    phaseOffset = dragPhi - frac(lastElapsed / LOOP_S);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('mousedown', onDown);
  }
  if (window.addEventListener) {
    window.addEventListener('pointermove', onMove);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('mouseup', onUp);
  }

  // ------------------------------------------------------------------
  // Skeleton: interpolate every joint, add breath and the condor's
  // slow ride, convert to canvas points.
  // ------------------------------------------------------------------
  function toCanvas(p, bobPx) {
    return [CX + p[0] * S, groundY - (p[1] + 0.53) * S + bobPx];
  }
  function skeleton(m, vt) {
    var sk = {}, i, name;
    var bob = Math.sin(vt * 2 * Math.PI / 5.0) * 0.0035 * S;
    for (i = 0; i < JOINTS.length; i++) {
      name = JOINTS[i];
      sk[name] = [
        lerp(HUMAN[name][0], CONDOR[name][0], m),
        lerp(HUMAN[name][1], CONDOR[name][1], m)
      ];
    }
    // The condor rides: wing joints breathe on a slow swell, more as
    // the form becomes bird. Never a flap.
    var ride = Math.sin(vt * 2 * Math.PI / 6.3) * 0.010 * m;
    var ride2 = Math.sin(vt * 2 * Math.PI / 6.3 + 0.7) * 0.010 * m;
    var out = { bob: bob };
    out.pelvis = toCanvas(sk.pelvis, bob);
    out.chest = toCanvas(sk.chest, bob);
    out.neck = toCanvas(sk.neck, bob);
    var headBob = Math.sin(vt * 2 * Math.PI / 7.7) * 0.002 * S;
    out.headC = toCanvas(sk.headC, bob + headBob);
    for (var s = -1; s <= 1; s += 2) {
      var k = s < 0 ? 'L' : 'R';
      var sh = [s * sk.shoulder[0], sk.shoulder[1]];
      var el = [s * sk.elbow[0], sk.elbow[1] + (s < 0 ? ride : ride2)];
      var wr = [s * sk.wrist[0], sk.wrist[1] + (s < 0 ? ride : ride2) * 1.4];
      out['shoulder' + k] = toCanvas(sh, bob);
      out['elbow' + k] = toCanvas(el, bob);
      out['wrist' + k] = toCanvas(wr, bob);
      out['hip' + k] = toCanvas([s * sk.hip[0], sk.hip[1]], bob);
      out['knee' + k] = toCanvas([s * sk.knee[0], sk.knee[1]], bob);
      out['ankle' + k] = toCanvas([s * sk.ankle[0], sk.ankle[1]], bob);
    }
    return out;
  }

  // ------------------------------------------------------------------
  // Hatch segment renderer: longitudinal wavy strokes + cross-hatch.
  // Point(u, v): u along A->B, v across in units of the local width.
  // ------------------------------------------------------------------
  function segPoint(A, B, wA, wB, u, v) {
    var dx = B[0] - A[0], dy = B[1] - A[1];
    var len = Math.hypot(dx, dy) || 1;
    var px = -dy / len, py = dx / len;
    var w = lerp(wA, wB, u);
    return [A[0] + dx * u + px * v * w, A[1] + dy * u + py * v * w];
  }
  function drawSeg(A, B, wA, wB, tbl, color, alphaMul) {
    var dx = B[0] - A[0], dy = B[1] - A[1];
    var len = Math.hypot(dx, dy) || 1;
    ctx.strokeStyle = color;
    ctx.lineCap = 'round';
    var i, j, u;
    ctx.lineWidth = LW;
    for (i = 0; i < tbl.longs.length; i++) {
      var L = tbl.longs[i];
      ctx.globalAlpha = L.a * alphaMul;
      ctx.beginPath();
      for (j = 0; j <= 3; j++) {
        u = j / 3;
        var wob = Math.sin(u * Math.PI + L.ph) * L.wob;
        var p = segPoint(A, B, wA, wB, u, L.v + wob);
        if (j === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
      }
      ctx.stroke();
    }
    ctx.lineWidth = LW * 0.85;
    for (i = 0; i < tbl.crosses.length; i++) {
      var c = tbl.crosses[i];
      var wHere = lerp(wA, wB, c.u);
      var p1 = segPoint(A, B, wA, wB, c.u, -0.85);
      var p2 = segPoint(A, B, wA, wB, c.u, 0.85);
      var sx = (dx / len) * c.slant * wHere, sy = (dy / len) * c.slant * wHere;
      ctx.globalAlpha = c.a * alphaMul;
      ctx.beginPath();
      ctx.moveTo(p1[0], p1[1]);
      ctx.lineTo(p2[0] + sx, p2[1] + sy);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------
  // Feathers. Compute one wing's feather set (roots, tips, growth)
  // for the current skeleton, then draw membrane and feathers.
  // ------------------------------------------------------------------
  function computeFeathers(sk, side, m, vt) {
    var k = side < 0 ? 'L' : 'R';
    var P0 = sk['shoulder' + k], P1 = sk['elbow' + k], P2 = sk['wrist' + k];
    var l1 = Math.hypot(P1[0] - P0[0], P1[1] - P0[1]);
    var l2 = Math.hypot(P2[0] - P1[0], P2[1] - P1[1]);
    var total = l1 + l2 || 1;
    var out = [];
    for (var i = 0; i < FEATHERS.length; i++) {
      var f = FEATHERS[i];
      var d = f.t * total;
      var root, tx, ty;
      if (d < l1) {
        var u1 = l1 > 0 ? d / l1 : 0;
        root = [lerp(P0[0], P1[0], u1), lerp(P0[1], P1[1], u1)];
        tx = (P1[0] - P0[0]) / (l1 || 1); ty = (P1[1] - P0[1]) / (l1 || 1);
      } else {
        var u2 = l2 > 0 ? (d - l1) / l2 : 0;
        root = [lerp(P1[0], P2[0], u2), lerp(P1[1], P2[1], u2)];
        tx = (P2[0] - P1[0]) / (l2 || 1); ty = (P2[1] - P1[1]) / (l2 || 1);
      }
      root = [root[0], root[1] + 0.012 * S];
      var g = featherGrow(m, f.t);
      var lenPx = featherLen(f.t) * f.lenJ * S * Math.pow(g, 0.7) * (0.35 + 0.65 * m);
      // Direction: mostly downward, swept back toward the body, with
      // the tangent mixed in; primaries splay outward near the tip.
      var dx = -0.38 * side + tx * 0.22;
      var dy = 1 + ty * 0.22;
      if (f.t > 0.78) {
        var sp = (f.t - 0.78) * 1.5;
        var cs = Math.cos(sp * side), sn = Math.sin(sp * side);
        var ndx = dx * cs - dy * sn, ndy = dx * sn + dy * cs;
        dx = ndx; dy = ndy;
      }
      var dl = Math.hypot(dx, dy) || 1;
      dx /= dl; dy /= dl;
      // Minute phase-staggered flutter: the feathers ripple, they do
      // not flap.
      var fl = Math.sin(vt * 2 * Math.PI / 3.1 + f.ph + f.t * 5.0) * 0.006 * S * g;
      var tip = [root[0] + dx * lenPx + (-dy) * fl, root[1] + dy * lenPx + dx * fl];
      var ctrl = [root[0] + dx * lenPx * 0.52 + (-dy) * lenPx * 0.08 * side,
                  root[1] + dy * lenPx * 0.52 + dx * lenPx * 0.08 * side];
      out.push({ root: root, tip: tip, ctrl: ctrl, g: g, t: f.t, wid: 0.020 * f.widJ * S * (0.4 + 0.6 * g) });
    }
    return out;
  }

  function drawLeaf(root, ctrl, tip, wid, color, alpha) {
    if (alpha <= 0.004 || wid <= 0.2) return;
    var dx = tip[0] - root[0], dy = tip[1] - root[1];
    var dl = Math.hypot(dx, dy) || 1;
    var px = -dy / dl, py = dx / dl;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(root[0] + px * wid / 2, root[1] + py * wid / 2);
    ctx.quadraticCurveTo(ctrl[0], ctrl[1], tip[0], tip[1]);
    ctx.lineTo(root[0] - px * wid / 2, root[1] - py * wid / 2);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawWing(sk, side, m, vt) {
    var k = side < 0 ? 'L' : 'R';
    var feathers = computeFeathers(sk, side, m, vt);
    // Membrane: leading edge along the arm, trailing edge along the
    // feather tips, closing through the body side.
    var mAlpha = 0.50 * smooth((m - 0.20) / 0.6);
    if (mAlpha > 0.004) {
      ctx.globalAlpha = mAlpha;
      ctx.fillStyle = BROWN;
      ctx.beginPath();
      ctx.moveTo(sk['shoulder' + k][0], sk['shoulder' + k][1]);
      ctx.lineTo(sk['elbow' + k][0], sk['elbow' + k][1]);
      ctx.lineTo(sk['wrist' + k][0], sk['wrist' + k][1]);
      for (var i = feathers.length - 1; i >= 0; i -= 2) {
        if (feathers[i].t < 0.35) break;
        ctx.lineTo(feathers[i].tip[0], feathers[i].tip[1]);
      }
      ctx.lineTo(sk['hip' + k][0] + side * 0.04 * S, sk['hip' + k][1]);
      ctx.lineTo(sk['shoulder' + k][0] - side * 0.05 * S, sk['shoulder' + k][1] + 0.10 * S);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    for (var j = 0; j < feathers.length; j++) {
      var f = feathers[j];
      drawLeaf(f.root, f.ctrl, f.tip, f.wid, BROWN, 0.82 * f.g);
      if (f.t > 0.25 && f.g > 0.05) {
        ctx.globalAlpha = 0.30 * f.g;
        ctx.strokeStyle = INK;
        ctx.lineWidth = LW * 0.7;
        ctx.beginPath();
        ctx.moveTo(f.root[0], f.root[1]);
        ctx.lineTo(f.tip[0], f.tip[1]);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  // Tail fan: short leaves spreading below the pelvis, sketched in
  // as the form turns bird.
  function drawTail(sk, m) {
    var g = smooth((m - 0.25) / 0.6);
    if (g <= 0.004) return;
    var ox = sk.pelvis[0], oy = sk.pelvis[1] + 0.01 * S;
    for (var i = 0; i < 7; i++) {
      var ang = -0.7 + 1.4 * (i / 6);
      var len = (0.16 + 0.10 * (1 - Math.abs(ang) / 0.7)) * S * g;
      var dx = Math.sin(ang), dy = Math.cos(ang);
      var tip = [ox + dx * len, oy + dy * len];
      var ctrl = [ox + dx * len * 0.5, oy + dy * len * 0.5];
      drawLeaf([ox, oy], ctrl, tip, 0.024 * S * g, BROWN, 0.75 * g);
    }
  }

  // ------------------------------------------------------------------
  // The head: always human. Parametric face in pencil hatch; pupils
  // offset toward the pointer, clamped to a small radius.
  // ------------------------------------------------------------------
  function drawHead(sk) {
    var HC = sk.headC;
    var hw = 0.078 * S, hh = 0.098 * S;
    function P(lx, ly) { return [HC[0] + lx * S, HC[1] + ly * S]; }
    ctx.strokeStyle = INK;
    ctx.lineCap = 'round';

    // Skull: two arcs with sketch gaps at the sides.
    ctx.lineWidth = LW * 1.1;
    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    ctx.ellipse(HC[0], HC[1], hw, hh, 0, Math.PI * 1.08, Math.PI * 1.92);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(HC[0], HC[1], hw, hh, 0, Math.PI * 0.08, Math.PI * 0.92);
    ctx.stroke();
    // Hair: hatch arcs over the crown.
    ctx.lineWidth = LW * 0.9;
    for (var i = 0; i < 3; i++) {
      ctx.globalAlpha = 0.40 + 0.12 * i;
      ctx.beginPath();
      ctx.ellipse(HC[0], HC[1] - 0.018 * S, hw * (0.99 - i * 0.10), hh * (0.97 - i * 0.09),
                  0, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
    }
    // Jaw and chin.
    ctx.globalAlpha = 0.65;
    ctx.lineWidth = LW;
    ctx.beginPath();
    ctx.ellipse(HC[0], HC[1] + 0.010 * S, 0.060 * S, 0.080 * S, 0, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
    // Brows.
    ctx.globalAlpha = 0.8;
    ctx.lineWidth = LW * 1.15;
    var s;
    for (s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.ellipse(HC[0] + s * 0.030 * S, HC[1] - 0.020 * S, 0.027 * S, 0.011 * S,
                  0, Math.PI * 1.12, Math.PI * 1.88);
      ctx.stroke();
    }
    // Eyes: almond outlines; pupils track the pointer.
    ctx.lineWidth = LW;
    for (s = -1; s <= 1; s += 2) {
      var ex = HC[0] + s * 0.030 * S, ey = HC[1] + 0.002 * S;
      var ew = 0.027 * S, eh = 0.0095 * S;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.moveTo(ex - ew, ey);
      ctx.quadraticCurveTo(ex, ey - eh * 1.6, ex + ew, ey);
      ctx.quadraticCurveTo(ex, ey + eh * 1.3, ex - ew, ey);
      ctx.stroke();
      var gx = 0, gy = 0;
      if (pointer.x >= 0) {
        var vx = pointer.x - ex, vy = pointer.y - ey;
        var vl = Math.hypot(vx, vy);
        if (vl > 0.001) {
          var off = Math.min(vl * 0.06, 0.011 * S);
          gx = vx / vl * off; gy = vy / vl * off;
        }
      }
      ctx.globalAlpha = 0.95;
      ctx.fillStyle = INK;
      ctx.beginPath();
      ctx.arc(ex + gx, ey + gy, Math.max(1.1, 0.0045 * S), 0, Math.PI * 2);
      ctx.fill();
    }
    // Nose: bridge, tip, nostril ticks.
    ctx.globalAlpha = 0.75;
    ctx.lineWidth = LW;
    ctx.beginPath();
    var n0 = P(0, -0.008), n1 = P(0.002, 0.028);
    ctx.moveTo(n0[0], n0[1]);
    ctx.lineTo(n1[0], n1[1]);
    ctx.quadraticCurveTo(n1[0] + 0.006 * S, n1[1] + 0.008 * S, P(0.010, 0.036)[0], P(0.010, 0.036)[1]);
    ctx.moveTo(P(-0.011, 0.036)[0], P(-0.011, 0.036)[1]);
    ctx.quadraticCurveTo(P(0, 0.041)[0], P(0, 0.041)[1], P(0.010, 0.036)[0], P(0.010, 0.036)[1]);
    ctx.stroke();
    // Lips.
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    var l0 = P(-0.016, 0.056), l1 = P(0, 0.050), l2 = P(0.016, 0.056);
    ctx.moveTo(l0[0], l0[1]);
    ctx.quadraticCurveTo(P(-0.007, 0.048)[0], P(-0.007, 0.048)[1], l1[0], l1[1]);
    ctx.quadraticCurveTo(P(0.007, 0.048)[0], P(0.007, 0.048)[1], l2[0], l2[1]);
    ctx.quadraticCurveTo(P(0, 0.064)[0], P(0, 0.064)[1], l0[0], l0[1]);
    ctx.stroke();
    // Ears.
    ctx.globalAlpha = 0.5;
    for (s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.ellipse(HC[0] + s * hw * 0.99, HC[1] + 0.006 * S, 0.008 * S, 0.014 * S,
                  0, -Math.PI * 0.4, Math.PI * 0.4, s < 0);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // The condor's pale ruff at the neck, drawn in paper tone over the
  // brown as the bird arrives.
  function drawRuff(sk, m) {
    var a = 0.55 * smooth((m - 0.40) / 0.45);
    if (a <= 0.004) return;
    var nx = sk.neck[0], ny = sk.neck[1] + 0.015 * S;
    ctx.strokeStyle = PAPER;
    ctx.lineCap = 'round';
    for (var i = 0; i < 3; i++) {
      ctx.globalAlpha = a * (1 - i * 0.22);
      ctx.lineWidth = 0.016 * S;
      ctx.beginPath();
      ctx.ellipse(nx, ny, (0.082 + i * 0.013) * S, (0.062 + i * 0.010) * S,
                  0, Math.PI * 0.15, Math.PI * 0.85);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------
  // Frame
  // ------------------------------------------------------------------
  function draw(elapsed) {
    lastElapsed = elapsed;
    var vt = FORCE_T >= 0 ? FORCE_T : elapsed;
    var phi;
    if (FORCE_T >= 0) phi = frac(FORCE_T / LOOP_S);
    else if (dragging) phi = dragPhi;
    else phi = frac(vt / LOOP_S + phaseOffset);
    lastPhi = phi;
    var tri = phi < 0.5 ? 2 * phi : 2 - 2 * phi;
    var m = dwell(tri);
    lastM = m;

    // Paper.
    ctx.fillStyle = PAPER;
    ctx.globalAlpha = 1;
    ctx.fillRect(0, 0, W, H);

    // One pale sky wash band behind the figure.
    ctx.fillStyle = SKY;
    ctx.globalAlpha = 0.38;
    ctx.fillRect(0.05 * W, groundY - 1.25 * S, 0.90 * W, 1.00 * S);
    ctx.globalAlpha = 1;

    var sk = skeleton(m, vt);

    // Ground: a few sketchy strokes and ticks under the feet.
    ctx.strokeStyle = INK;
    ctx.lineCap = 'round';
    for (var gi = 0; gi < 3; gi++) {
      ctx.globalAlpha = 0.35 - gi * 0.08;
      ctx.lineWidth = LW * (1 - gi * 0.18);
      ctx.beginPath();
      ctx.moveTo(CX - 0.78 * S, groundY + gi * 0.012 * S);
      ctx.lineTo(CX + 0.78 * S, groundY + gi * 0.012 * S);
      ctx.stroke();
    }
    ctx.lineWidth = LW * 0.8;
    for (var ti = 0; ti < GROUND_TICKS.length; ti++) {
      var gt = GROUND_TICKS[ti];
      ctx.globalAlpha = gt.a;
      ctx.beginPath();
      ctx.moveTo(CX + gt.x * S, groundY + gt.y * S);
      ctx.lineTo(CX + (gt.x + gt.l) * S, groundY + gt.y * S);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Tail behind the legs; wings behind the torso.
    drawTail(sk, m);
    drawWing(sk, -1, m, vt);
    drawWing(sk, 1, m, vt);

    // Legs.
    for (var s = -1; s <= 1; s += 2) {
      var k = s < 0 ? 'L' : 'R';
      drawSeg(sk['hip' + k], sk['knee' + k], 0.055 * S, 0.042 * S, SEG.thigh, INK, 1);
      drawSeg(sk['knee' + k], sk['ankle' + k], 0.040 * S, 0.028 * S, SEG.shin, INK, 1);
      // Foot tick at the ground.
      ctx.globalAlpha = 0.7;
      ctx.strokeStyle = INK;
      ctx.lineWidth = LW;
      ctx.beginPath();
      ctx.moveTo(sk['ankle' + k][0] - 0.030 * S, groundY);
      ctx.lineTo(sk['ankle' + k][0] + 0.048 * S, groundY);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Torso: body mass deepens to condor brown as the bird arrives,
    // under the graphite hatch; the brown hatch deepens over it.
    var bodyA = 0.50 * smooth((m - 0.15) / 0.7);
    if (bodyA > 0.004) {
      var bcx = (sk.chest[0] + sk.pelvis[0]) / 2;
      var bcy = (sk.chest[1] + sk.pelvis[1]) / 2;
      ctx.globalAlpha = bodyA;
      ctx.fillStyle = BROWN;
      ctx.beginPath();
      ctx.ellipse(bcx, bcy, 0.175 * S, 0.235 * S, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    drawSeg(sk.neck, sk.chest, 0.085 * S, 0.185 * S, SEG.torsoUp, INK, 1);
    drawSeg(sk.chest, sk.pelvis, 0.185 * S, 0.115 * S, SEG.torsoLo, INK, 1);
    drawSeg(sk.neck, sk.chest, 0.085 * S, 0.185 * S, SEG.torsoUp, BROWN, bodyA * 1.4);
    drawSeg(sk.chest, sk.pelvis, 0.185 * S, 0.115 * S, SEG.torsoLo, BROWN, bodyA * 1.4);

    // Arms: the spines of the wings, hatched like the rest.
    for (s = -1; s <= 1; s += 2) {
      var k2 = s < 0 ? 'L' : 'R';
      drawSeg(sk['shoulder' + k2], sk['elbow' + k2], 0.048 * S, 0.038 * S, SEG.upperArm, INK, 1);
      drawSeg(sk['elbow' + k2], sk['wrist' + k2], 0.036 * S, 0.026 * S, SEG.foreArm, INK, 1);
    }

    // Neck, ruff, and the head that never changes.
    drawSeg(sk.chest, sk.neck, 0.055 * S, 0.048 * S, SEG.neck, INK, 1);
    drawRuff(sk, m);
    drawHead(sk);
  }

  // ------------------------------------------------------------------
  resize();
  draw(0);

  if (typeof window.requestAnimationFrame === 'function') {
    var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var raf = function () {
      var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : t0;
      draw((now - t0) / 1000);
      window.requestAnimationFrame(raf);
    };
    window.requestAnimationFrame(raf);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
})();
</script>
</body>
</html>
