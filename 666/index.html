<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hue Bingo Canvas — No.666</title>
<!-- phantom-fill-8936 -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#141210; cursor:pointer; }
  canvas { display:block; width:100vw; height:100dvh; }
  .label {
    position:fixed; left:0; right:0; bottom:0; padding:14px 18px 16px;
    display:flex; justify-content:space-between; align-items:baseline;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color:#f2ede3; pointer-events:none; user-select:none;
  }
  .label .t { font-size:11px; letter-spacing:.28em; text-transform:uppercase; opacity:.9; }
  .label .n { font-size:11px; letter-spacing:.18em; opacity:.5; }
  .hint {
    position:fixed; top:16px; right:18px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:10px; letter-spacing:.22em; text-transform:uppercase;
    color:rgba(242,237,227,.55); pointer-events:none; user-select:none;
  }
  .swatches {
    position:fixed; top:16px; left:18px; display:flex; gap:6px; pointer-events:none;
  }
  .swatches i { display:block; width:14px; height:14px; border-radius:50%; border:1px solid rgba(255,255,255,.25); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="swatches" id="sw"></div>
<div class="hint">tap &middot; re-roll the palette</div>
<div class="label"><span class="t">Hue Bingo Canvas</span><span class="n">No. 666 &middot; a fresh draw every visit</span></div>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const swEl = document.getElementById('sw');
  let W, H, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // Hue Bingo: draw 5 hues from the wheel, each at least 40 degrees from the
  // last, so every random palette is coherent by construction.
  function rollPalette() {
    const hues = [];
    let h = Math.random() * 360;
    for (let i = 0; i < 5; i++) {
      hues.push(h);
      h = (h + 40 + Math.random() * 200) % 360;
    }
    return hues.map(function (hue, i) {
      const s = 62 + Math.random() * 26;      // 62-88% saturation
      const l = 44 + (i % 3) * 7;             // stepped lightness, not random
      return 'hsl(' + hue.toFixed(0) + ',' + s.toFixed(0) + '%,' + l + '%)';
    });
  }

  let palette = rollPalette();
  let rollTime = 0; // time of last roll, for the settle-in animation

  function showSwatches() {
    swEl.innerHTML = '';
    palette.forEach(function (c) {
      const i = document.createElement('i');
      i.style.background = c;
      swEl.appendChild(i);
    });
  }
  showSwatches();

  function reroll() {
    palette = rollPalette();
    rollTime = performance.now();
    showSwatches();
  }
  window.addEventListener('pointerdown', reroll);

  // Each ring wobbles on its own slow sine pair; wobble grows with radius.
  function draw(t) {
    ctx.fillStyle = '#141210';
    ctx.fillRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2;
    const maxR = Math.min(W, H) * 0.52;
    const settle = Math.min(1, (t - rollTime) / 900); // rings ease in after a roll
    const rings = 9;

    for (let k = rings; k >= 1; k--) {
      const base = (k / rings) * maxR * (0.55 + 0.45 * settle);
      const wob = 4 + k * 3.2;
      const f1 = 3 + (k % 4), f2 = 5 + (k % 3);
      const p1 = t * 0.00022 * (1 + k * 0.07), p2 = t * 0.00017 * (1 + k * 0.05);
      ctx.strokeStyle = palette[(k - 1) % palette.length];
      ctx.lineWidth = Math.max(2, (maxR / rings) * 0.42);
      ctx.globalAlpha = 0.92;
      ctx.beginPath();
      const segs = 180;
      for (let i = 0; i <= segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        const r = base + Math.sin(a * f1 + p1) * wob + Math.cos(a * f2 + p2) * wob * 0.6;
        const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // Centre dot: the bingo ball.
    ctx.fillStyle = palette[0];
    ctx.beginPath();
    ctx.arc(cx, cy, 5 + Math.sin(t * 0.002) * 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  function frame(ts) { draw(ts); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
