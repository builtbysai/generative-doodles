<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.379 Romantsy Toile</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F3EBDD; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.379 Romantsy Toile (jenkbdoodles).
// After Jen K's modern toile: fine purple line-art vignettes
// tiled in half-drop on cream, non-directional, with her
// sparkly speckle over the top. The vignette library is exactly
// the prompt's eight: dragon, castle, books with roses, sword,
// crown, candle, moon, clouds. LINE ART ONLY: every mark is a
// 2px round-cap stroke in romantasy purple #7B5FA6 on cream
// #F3EBDD, no filled shapes anywhere. Each vignette's paths are
// point lists resampled to a fine step and given a fixed 1px
// seeded wobble, so the line reads hand-drawn, never vector
// perfect. The speckle is a fixed seeded dot table drawn
// directly each frame: white dots at 0.15 alpha and gold
// #C9A24B micro-dots. This piece ships the cream colourway only.
// Loop: a seamless 36s master loop (LOOP) in three whole
// phases. Draw-in (12s): the vignettes ink themselves in, the
// reveal walking each vignette's points with the start
// staggered by row. Hold (12s): the field sits complete while
// the speckle shimmers faintly. Fade (12s): the linework alpha
// eases to blank, then the loop redraws. WATCH-ONLY: there is
// no interaction at all, it is a wallpaper to watch being inked.
// Flat colour only, one canvas, all marks drawn directly each
// frame from the authored tables below. No offscreen canvas,
// no gradients, no filters, no shadowBlur.
// Determinism: the first frame is drawn synchronously at the
// constant phase T = 18.0, the middle of the HOLD phase with
// the vignettes complete (the constant anchor, not blank),
// never Date.now() minus an offset, and the animation advances
// from that anchor in fixed 1/60 ticks.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DW = 1280, DH = 900;
var LOOP = 36;
var TAU = Math.PI * 2;
var PAGE = '#F3EBDD';
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 18.0, lastNow = -1, acc = 0;
var TICK = 1 / 60;

// ---- palette ---------------------------------------------------------------
var GROUND = '#F3EBDD';
var INK = '#7B5FA6';
var GOLD = '#C9A24B';
var WHITE = '#FFFFFF';

// ---- seeded rng --------------------------------------------------------------
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- path geometry helpers ---------------------------------------------------
// Every vignette is a list of paths; every path is a list of
// [x, y] points in a local box centred on (0, 0), about 200
// wide and 180 tall.
function ptsLine(x0, y0, x1, y1) { return [[x0, y0], [x1, y1]]; }
function ptsArc(cx, cy, r, a0, a1, n) {
  var out = [], i, a;
  for (i = 0; i <= n; i++) {
    a = a0 + (a1 - a0) * (i / n);
    out.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  return out;
}
function ptsCircle(cx, cy, r) { return ptsArc(cx, cy, r, 0, TAU, 30); }
function ptsSpiral(cx, cy, r0, r1, turns, n) {
  var out = [], i, a, r;
  for (i = 0; i <= n; i++) {
    a = turns * TAU * (i / n);
    r = r0 + (r1 - r0) * (i / n);
    out.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  return out;
}
function ptsBez(p0, p1, p2, p3, n) {
  var out = [], i, t, u, x, y;
  for (i = 0; i <= n; i++) {
    t = i / n; u = 1 - t;
    x = u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0];
    y = u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1];
    out.push([x, y]);
  }
  return out;
}
function ptsQuad(p0, p1, p2, n) {
  var out = [], i, t, u, x, y;
  for (i = 0; i <= n; i++) {
    t = i / n; u = 1 - t;
    x = u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0];
    y = u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1];
    out.push([x, y]);
  }
  return out;
}
function sparkle(cx, cy, r) {
  return [ptsLine(cx, cy - r, cx, cy + r), ptsLine(cx - r, cy, cx + r, cy)];
}
function xlate(paths, dx, dy, s) {
  return paths.map(function (p) {
    return p.map(function (q) { return [q[0] * s + dx, q[1] * s + dy]; });
  });
}
// Crescent from two circles: the outer arc of circle 1 and the
// inner arc of circle 2, joined at the circles' intersections,
// sampled as one continuous path.
function ptsCrescent(cx1, cy1, r1, cx2, cy2, r2) {
  var dx = cx2 - cx1, dy = cy2 - cy1;
  var d = Math.sqrt(dx * dx + dy * dy);
  var a = (r1 * r1 - r2 * r2 + d * d) / (2 * d);
  var h = Math.sqrt(Math.max(0, r1 * r1 - a * a));
  var mx = cx1 + a * dx / d, my = cy1 + a * dy / d;
  var t1 = [mx - dy / d * h, my + dx / d * h];
  var t2 = [mx + dy / d * h, my - dx / d * h];
  function arcPts(cx, cy, r, pFrom, pTo, awayX, awayY, n) {
    var a0 = Math.atan2(pFrom[1] - cy, pFrom[0] - cx);
    var a1 = Math.atan2(pTo[1] - cy, pTo[0] - cx);
    var dShort = a1 - a0;
    while (dShort > Math.PI) dShort -= TAU;
    while (dShort < -Math.PI) dShort += TAU;
    var midA = a0 + dShort / 2;
    var midX = cx + Math.cos(midA) * r - (pFrom[0] + pTo[0]) / 2;
    var midY = cy + Math.sin(midA) * r - (pFrom[1] + pTo[1]) / 2;
    var dA = (midX * awayX + midY * awayY < 0)
      ? dShort - Math.sign(dShort) * TAU : dShort;
    var out = [], i, ang;
    for (i = 0; i <= n; i++) {
      ang = a0 + dA * (i / n);
      out.push([cx + Math.cos(ang) * r, cy + Math.sin(ang) * r]);
    }
    return out;
  }
  // Both arcs bulge away from circle 2, toward circle 1's far side.
  var awayX = cx1 - cx2, awayY = cy1 - cy2;
  var outer = arcPts(cx1, cy1, r1, t1, t2, awayX, awayY, 52);
  var inner = arcPts(cx2, cy2, r2, t2, t1, awayX, awayY, 40);
  return outer.concat(inner.slice(1));
}
// One puffy cloud outline: a sampled bump-function top edge and
// a flat bottom, closed.
function cloudOutline(w, base, bumps) {
  var pts = [], x, y, k, b, dd;
  for (x = -w; x <= w; x += 4) {
    y = 0;
    for (k = 0; k < bumps.length; k++) {
      b = bumps[k];
      dd = (x - b[0]) / b[1];
      y -= b[2] * Math.exp(-dd * dd);
    }
    pts.push([x, y]);
  }
  pts.push([w, base]);
  pts.push([-w, base]);
  pts.push([pts[0][0], pts[0][1]]);
  return pts;
}

// ---- the vignette library: exactly 8, line art only ---------------------------
function buildDragon() {
  var spine = ptsBez([-70, 45], [-25, -40], [25, 60], [62, -35], 44);
  var paths = [spine];
  // Jagged membrane wings, big mid-body and smaller near the tail.
  paths.push([[-4, 4], [-16, -52], [2, -30], [10, -58], [22, -28], [44, -40], [30, 2]]);
  paths.push([[-48, 28], [-58, -8], [-42, -2], [-36, -22], [-26, 6], [-34, 32]]);
  // Head: small circle, snout, horn, eye.
  paths.push(ptsCircle(68, -40, 7));
  paths.push(ptsLine(73, -36, 87, -29));
  paths.push(ptsLine(72, -31, 83, -24));
  paths.push(ptsLine(64, -46, 56, -58));
  paths.push(ptsCircle(69, -41, 1.8));
  // Belly ticks across the spine, from the sampled spine itself.
  [10, 18, 27, 35].forEach(function (idx) {
    var p = spine[idx], q = spine[idx + 1];
    var vx = q[0] - p[0], vy = q[1] - p[1];
    var len = Math.sqrt(vx * vx + vy * vy) || 1;
    var nx = -vy / len * 7, ny = vx / len * 7;
    paths.push(ptsLine(p[0] - nx, p[1] - ny, p[0] + nx, p[1] + ny));
  });
  // Legs with claw ticks.
  paths.push([[-38, 34], [-42, 50], [-49, 45]]);
  paths.push([[28, 26], [26, 42], [19, 38]]);
  // Tail curl.
  paths.push(ptsSpiral(-80, 54, 2, 13, 1.6, 30));
  return paths;
}
function buildCastle() {
  var paths = [];
  // Mountain ridge with a plateau for the castle.
  paths.push([[-88, 72], [-40, 10], [40, 10], [88, 72]]);
  paths.push(ptsLine(-64, 44, -46, 44));
  paths.push(ptsLine(48, 40, 66, 40));
  // Centre tower with crenellated top.
  paths.push([[-16, 10], [-16, -58], [-9, -58], [-9, -50], [-2, -50], [-2, -58],
              [5, -58], [5, -50], [12, -50], [12, -58], [16, -58], [16, 10]]);
  // Flag on a pole.
  paths.push(ptsLine(0, -58, 0, -76));
  paths.push([[0, -76], [15, -71], [0, -66]]);
  // Side towers with triangle roofs.
  paths.push([[-44, 10], [-44, -28], [-26, -28], [-26, 10]]);
  paths.push([[-48, -28], [-35, -47], [-22, -28]]);
  paths.push([[26, 10], [26, -28], [44, -28], [44, 10]]);
  paths.push([[22, -28], [35, -47], [48, -28]]);
  // Door arch and windows.
  paths.push([[-9, 10], [-9, 0]].concat(ptsArc(0, 0, 9, Math.PI, TAU, 12).slice(1), [[9, 10]]));
  paths.push(ptsCircle(0, -28, 3.5));
  paths.push(ptsCircle(-35, -10, 3));
  paths.push(ptsCircle(35, -10, 3));
  return paths;
}
function buildBooks() {
  function book(x0, y0, x1, y1, spineX, pageYs) {
    var out = [];
    out.push([[x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, y0]]);
    out.push(ptsLine(spineX, y0, spineX, y1));
    pageYs.forEach(function (py) { out.push(ptsLine(spineX + 8, py, x1 - 10, py)); });
    return out;
  }
  var paths = [];
  paths = paths.concat(book(-58, 28, 58, 58, -46, [38, 48]));
  paths = paths.concat(book(-48, 0, 52, 28, -36, [14]));
  paths = paths.concat(book(-38, -26, 44, 0, -27, [-13]));
  // Rose on top: spiral, stem, two pointed leaves.
  paths.push(ptsSpiral(2, -50, 2, 15, 2.6, 46));
  paths.push(ptsLine(2, -35, 2, -26));
  paths.push(ptsQuad([-12, -42], [-28, -54], [-37, -37], 12));
  paths.push(ptsQuad([-37, -37], [-26, -29], [-12, -42], 12));
  paths.push(ptsQuad([16, -42], [32, -54], [41, -37], 12));
  paths.push(ptsQuad([41, -37], [30, -29], [16, -42], 12));
  return paths;
}
function buildSword() {
  var paths = [];
  paths.push([[0, -80], [7, -60], [7, 18]]);
  paths.push([[0, -80], [-7, -60], [-7, 18]]);
  paths.push(ptsLine(0, -68, 0, 18));
  // Guard with curled ends.
  paths.push(ptsLine(-30, 24, 30, 24));
  paths.push(ptsCircle(-34, 24, 3.5));
  paths.push(ptsCircle(34, 24, 3.5));
  // Grip and wraps.
  paths.push(ptsLine(-5, 24, -5, 44));
  paths.push(ptsLine(5, 24, 5, 44));
  paths.push(ptsLine(-5, 30, 5, 35));
  paths.push(ptsLine(-5, 37, 5, 42));
  // Pommel.
  paths.push(ptsCircle(0, 53, 7.5));
  // Sparkle beside the blade.
  paths = paths.concat(xlate(sparkle(0, 0, 11), 50, -42, 1));
  paths = paths.concat(xlate(sparkle(0, 0, 7), -52, -18, 1));
  return paths;
}
function buildCrown() {
  var paths = [];
  // Zigzag points.
  paths.push([[-58, 34], [-42, -6], [-26, 26], [0, -22], [26, 26], [42, -6], [58, 34]]);
  // Tip circles.
  paths.push(ptsCircle(-42, -13, 5.5));
  paths.push(ptsCircle(0, -29, 5.5));
  paths.push(ptsCircle(42, -13, 5.5));
  // Band.
  paths.push([[-58, 34], [58, 34], [58, 54], [-58, 54], [-58, 34]]);
  // Jewels: three diamonds and two dots in the band.
  [-30, 0, 30].forEach(function (jx) {
    paths.push([[jx, 38], [jx + 6, 44], [jx, 50], [jx - 6, 44], [jx, 38]]);
  });
  paths.push(ptsCircle(-47, 44, 2.2));
  paths.push(ptsCircle(47, 44, 2.2));
  return paths;
}
function buildCandle() {
  var paths = [];
  // Body: sides, base, top rim arc.
  paths.push(ptsLine(-13, 62, -13, -2));
  paths.push(ptsLine(13, -2, 13, 62));
  paths.push(ptsLine(-13, 62, 13, 62));
  paths.push(ptsArc(0, -2, 13, Math.PI, TAU, 14));
  // Wick and flame: two quads forming a teardrop, inner dot.
  paths.push(ptsLine(0, -8, 0, -18));
  paths.push(ptsQuad([0, -48], [-10, -31], [0, -18], 14));
  paths.push(ptsQuad([0, -18], [10, -31], [0, -48], 14));
  paths.push(ptsCircle(0, -28, 3));
  // Wax drips down the sides.
  paths.push([[-13, 4], [-9, 11], [-13, 19], [-10, 27]]);
  paths.push([[13, 0], [10, 8], [13, 16]]);
  // Holder: dish curve, connectors, base line.
  paths.push(ptsQuad([-34, 64], [0, 80], [34, 64], 16));
  paths.push(ptsLine(-21, 69, -19, 82));
  paths.push(ptsLine(21, 69, 19, 82));
  paths.push(ptsLine(-22, 82, 22, 82));
  // Glow ticks around the flame.
  paths.push(ptsLine(-27, -36, -21, -29));
  paths.push(ptsLine(27, -36, 21, -29));
  paths.push(ptsLine(-25, -14, -18, -18));
  paths.push(ptsLine(25, -14, 18, -18));
  return paths;
}
function buildMoon() {
  var paths = [];
  paths.push(ptsCrescent(-8, 0, 58, 16, 0, 49));
  paths = paths.concat(xlate(sparkle(0, 0, 10), 56, -40, 1));
  paths = paths.concat(xlate(sparkle(0, 0, 6), 68, 22, 1));
  paths.push(ptsCircle(46, 48, 4));
  return paths;
}
function buildClouds() {
  var big = [cloudOutline(78, 14, [[-40, 15, 12], [-4, 30, 30], [38, 17, 16]])];
  var small = [cloudOutline(78, 14, [[-34, 16, 14], [6, 28, 26], [40, 15, 12]])];
  var tiny = [cloudOutline(70, 12, [[-30, 15, 13], [4, 26, 24], [36, 14, 11]])];
  var paths = [];
  paths = paths.concat(xlate(big, 0, -6, 1));
  paths = paths.concat(xlate(small, -34, 48, 0.62));
  paths = paths.concat(xlate(tiny, 46, -48, 0.45));
  return paths;
}
var MOTIFS = [buildDragon, buildCastle, buildBooks, buildSword,
              buildCrown, buildCandle, buildMoon, buildClouds];
if (MOTIFS.length !== 8) throw new Error('Romantsy Toile needs exactly 8 vignettes');

// Resample every path to a fine step so the reveal grows
// smoothly, then bake the fixed 1px seeded wobble into the
// points. The wobble never changes after load.
function resample(path, step) {
  var out = [path[0]], i, p, q, dx, dy, d, n, k;
  for (i = 1; i < path.length; i++) {
    p = path[i - 1]; q = path[i];
    dx = q[0] - p[0]; dy = q[1] - p[1];
    d = Math.sqrt(dx * dx + dy * dy);
    n = Math.max(1, Math.ceil(d / step));
    for (k = 1; k <= n; k++) out.push([p[0] + dx * (k / n), p[1] + dy * (k / n)]);
  }
  return out;
}
var VIGNETTES = MOTIFS.map(function (build, idx) {
  var rng = mulberry32(4100 + idx * 131);
  var paths = build().map(function (p) { return resample(p, 3.5); });
  var total = 0;
  paths.forEach(function (p) {
    total += p.length;
    p.forEach(function (q) {
      q[0] += (rng() * 2 - 1) * 1.0;
      q[1] += (rng() * 2 - 1) * 1.0;
    });
  });
  return { paths: paths, total: total };
});

// ---- the half-drop field -------------------------------------------------------
// Tile about 1/5 of the design height (180) tall, columns 256
// apart, odd rows dropped half a tile. The grid bleeds past the
// design edges so the cover-fit crop on any aspect stays full.
// Instances pull motifs from a seeded shuffle of the 8-library,
// rotations within +-15 degrees, small position jitter: evenly
// spaced but not rigidly.
var INSTANCES = [];
(function buildField() {
  var rng = mulberry32(20240);
  var queue = [], r, c, sh, i, tmp;
  while (queue.length < 49) {
    sh = [0, 1, 2, 3, 4, 5, 6, 7];
    for (i = sh.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      tmp = sh[i]; sh[i] = sh[j]; sh[j] = tmp;
    }
    queue = queue.concat(sh);
  }
  var k = 0;
  for (r = 0; r < 7; r++) {
    for (c = 0; c < 7; c++) {
      INSTANCES.push({
        x: -128 + 256 * c + (r % 2) * 128 + (rng() * 2 - 1) * 10,
        y: -90 + 180 * r + (rng() * 2 - 1) * 8,
        row: r,
        motif: queue[k++],
        rot: (rng() * 2 - 1) * 15 * Math.PI / 180,
        scale: 0.94 + rng() * 0.10
      });
    }
  }
})();

// ---- the speckle table -----------------------------------------------------------
// Fixed seeded dots drawn directly each frame: whites at 0.15
// alpha with a faint whole-cycle shimmer, gold micro-dots with
// per-dot phases.
var SPECK_W = [], SPECK_G = [];
(function buildSpeckle() {
  var rng = mulberry32(9137), i;
  for (i = 0; i < 240; i++) {
    SPECK_W.push({ x: -20 + rng() * 1340, y: -20 + rng() * 940, r: 0.9 + rng() * 1.1 });
  }
  for (i = 0; i < 90; i++) {
    SPECK_G.push({ x: -20 + rng() * 1340, y: -20 + rng() * 940, r: 1.1 + rng() * 0.7, ph: rng() * TAU });
  }
})();

// ---- drawing ---------------------------------------------------------------------

function drawVignette(inst, frac) {
  var v = VIGNETTES[inst.motif];
  var budget = Math.round(frac * v.total);
  if (budget <= 0) return;
  ctx.save();
  ctx.translate(inst.x, inst.y);
  ctx.rotate(inst.rot);
  ctx.scale(inst.scale, inst.scale);
  ctx.beginPath();
  var pi, pj, p, k;
  for (pi = 0; pi < v.paths.length && budget > 0; pi++) {
    p = v.paths[pi];
    k = Math.min(budget, p.length);
    budget -= k;
    if (k < 1) continue;
    ctx.moveTo(p[0][0], p[0][1]);
    if (k === 1) ctx.lineTo(p[0][0], p[0][1]);
    for (pj = 1; pj < k; pj++) ctx.lineTo(p[pj][0], p[pj][1]);
  }
  ctx.stroke();
  ctx.restore();
}

function draw(t) {
  var lt = t % LOOP;
  var alpha = 1, p, i, inst, start, frac;
  // Phase machinery: draw-in 0-12, hold 12-24, fade 24-36.
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (lt < 12) {
    p = lt / 12;
    ctx.globalAlpha = 1;
    for (i = 0; i < INSTANCES.length; i++) {
      inst = INSTANCES[i];
      start = inst.row * 0.05;
      frac = (p - start) / 0.70;
      if (frac < 0) frac = 0;
      if (frac > 1) frac = 1;
      drawVignette(inst, frac);
    }
  } else if (lt < 24) {
    ctx.globalAlpha = 1;
    for (i = 0; i < INSTANCES.length; i++) drawVignette(INSTANCES[i], 1);
  } else {
    ctx.globalAlpha = 1 - (lt - 24) / 12;
    for (i = 0; i < INSTANCES.length; i++) drawVignette(INSTANCES[i], 1);
  }
  // Speckle over the top: white shimmer on 3 whole cycles per
  // loop, gold twinkle on 5 whole cycles with per-dot phases.
  var shim = 0.8 + 0.2 * Math.sin(TAU * 3 * (t / LOOP));
  ctx.globalAlpha = 0.15 * shim;
  ctx.fillStyle = WHITE;
  for (i = 0; i < SPECK_W.length; i++) {
    ctx.beginPath();
    ctx.arc(SPECK_W[i].x, SPECK_W[i].y, SPECK_W[i].r, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = GOLD;
  for (i = 0; i < SPECK_G.length; i++) {
    ctx.globalAlpha = 0.5 * (0.85 + 0.15 * Math.sin(TAU * 5 * (t / LOOP) + SPECK_G[i].ph));
    ctx.beginPath();
    ctx.arc(SPECK_G[i].x, SPECK_G[i].y, SPECK_G[i].r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---- sizing ------------------------------------------------------------------------

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame ---------------------------------------------------------------------------

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Cover-fit: the toile field bleeds past the frame at any
  // aspect and the page ground stays the piece's cream.
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PAGE;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  ctx.fillStyle = GROUND;
  ctx.fillRect(-160, -120, DW + 320, DH + 240);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw(T);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loopFn = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loopFn); };
  requestAnimationFrame(loopFn);
}
})();
</script>
