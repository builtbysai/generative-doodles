<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chimba Hue</title>
<style>
  html, body { margin: 0; padding: 0; background: #0F1416; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ---- palette (strict) ----
var WARM  = '#D98A3D'; // chimba warm
var EMBER = '#B0532A'; // chimba ember
var RIVER = '#3E7C8C'; // river
var FOAM  = '#DCEBF2'; // river foam
var COOL  = '#5B8FA6'; // right-bank cool
var DEEP  = '#2B3538'; // right-bank deep
var NIGHT = '#0F1416'; // night ground

// ---- seeded RNG (mulberry32) ----
function mulberry32(a) {
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(686083);

// ---- canvas / viewport ----
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;

function measure() {
  var w, h;
  if (typeof window !== 'undefined' && window.visualViewport) {
    w = window.visualViewport.width; h = window.visualViewport.height;
  } else {
    w = window.innerWidth; h = window.innerHeight;
  }
  W = Math.max(1, Math.round(w)); H = Math.max(1, Math.round(h));
  canvas.width = W; canvas.height = H;
  // phone detection: window.screen physical size; aspect is fallback only
  if (typeof window !== 'undefined' && window.screen &&
      typeof window.screen.width === 'number' && typeof window.screen.height === 'number') {
    PHONE = Math.min(window.screen.width, window.screen.height) < 700;
  } else {
    PHONE = H > W * 1.15;
  }
  buildField();
}
if (typeof window !== 'undefined' && window.visualViewport &&
    typeof window.visualViewport.addEventListener === 'function') {
  window.visualViewport.addEventListener('resize', measure);
}
window.addEventListener('resize', measure);

// ---- anchored clock: frame one is t = 0, drawn synchronously ----
// performance.now() and rAF timestamps share one origin; events and frames
// both read this clock, so ripples are pure functions of recorded times.
var T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
function nowT() {
  if (typeof performance !== 'undefined' && performance.now) {
    return (performance.now() - T0) / 1000;
  }
  return 0;
}

// ---- field construction (all seeded, rebuilt on resize) ----
var ticks = [];    // left bank
var drops = [];    // river particles
var flecks = [];   // river foam flecks
var arcs = [];     // right bank

function buildField() {
  var i, j;
  // LEFT BANK: radial tick marks on a loose grid, three interlocking phase groups.
  // Groups pulse on periods 2.4 / 3.6 / 4.8 s with staggered offsets: a 3-against-4
  // weave against the river's slow flow.
  ticks = [];
  var cols = PHONE ? 5 : 9;
  var rows = PHONE ? 14 : 12;
  var bw = W * 0.40;
  for (i = 0; i < cols; i++) {
    for (j = 0; j < rows; j++) {
      if (rng() < 0.14) continue; // loose grid: some cells empty
      var gx = (i + 0.5) / cols, gy = (j + 0.5) / rows;
      var group = (i + j * 2) % 3;
      ticks.push({
        x: gx * bw + (rng() - 0.5) * bw / cols * 0.7,
        y: gy * H + (rng() - 0.5) * H / rows * 0.7,
        rot: rng() * Math.PI,
        nTick: 5 + Math.floor(rng() * 4),
        group: group,
        period: [2.4, 3.6, 4.8][group],
        off: [0.0, 0.9, 2.1][group] + rng() * 0.35,
        base: 0.55 + rng() * 0.45,
        ember: rng() < 0.38
      });
    }
  }
  // RIVER: particles drift mostly downward (net down), a few climb.
  drops = [];
  var nD = PHONE ? 90 : 150;
  for (i = 0; i < nD; i++) {
    var up = rng() < 0.22;
    drops.push({
      fx: rng(),                       // fraction across the band
      y0: rng(),                       // starting fraction down the band
      speed: (up ? -1 : 1) * (0.008 + rng() * 0.022), // band-heights per second
      swayPh: rng() * Math.PI * 2,
      swayAmp: 0.02 + rng() * 0.05,
      r: 0.8 + rng() * 1.7,
      a: 0.25 + rng() * 0.5
    });
  }
  // FOAM: sparse bright flecks riding the surface flow.
  flecks = [];
  var nF = PHONE ? 26 : 44;
  for (i = 0; i < nF; i++) {
    flecks.push({
      fx: rng(),
      y0: rng(),
      speed: 0.014 + rng() * 0.026,
      len: 3 + rng() * 8,
      ph: rng() * Math.PI * 2,
      a: 0.3 + rng() * 0.5
    });
  }
  // RIGHT BANK: few, wide, slow arcs; each breathes on its own long period.
  arcs = [];
  var nA = PHONE ? 11 : 15;
  for (i = 0; i < nA; i++) {
    arcs.push({
      x: W * 0.60 + (0.06 + rng() * 0.36) * W,
      y: (0.06 + rng() * 0.88) * H,
      rad: (0.05 + rng() * 0.11) * Math.min(W, H),
      a0: rng() * Math.PI * 2,
      span: 0.7 + rng() * 1.5,
      drift: (rng() - 0.5) * 0.05,          // rad/s, slow rotation
      breath: 8 + rng() * 7,                // seconds
      bOff: rng() * Math.PI * 2,
      deep: rng() < 0.45,
      wob: rng() * Math.PI * 2
    });
  }
}

// ---- interaction state: recorded drag events on the anchored clock ----
var ripples = [];        // {y, t0, hitL, hitR}
var leftShiftTarget = 0; // accumulated phase answer of the left bank
var leftShift = 0;       // eased current value
var rightSwells = [];    // times at which ripples reached the right bank

function spawnRipple(y, t) {
  ripples.push({ y: y, t0: t, hitL: false, hitR: false });
  if (ripples.length > 24) ripples.shift();
}

var dragging = false, lastPX = 0, lastPY = 0, lastRippleY = -1e9, lastRippleT = -1e9;

function ptrPos(e) {
  if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}
function onDown(e) {
  var p = ptrPos(e);
  dragging = true; lastPX = p.x; lastPY = p.y;
  var rx0 = W * 0.40, rx1 = W * 0.60;
  // a press inside the river plants a ripple seed too
  if (p.x > rx0 && p.x < rx1) { spawnRipple(p.y, nowT()); lastRippleY = p.y; lastRippleT = nowT(); }
}
function onMove(e) {
  if (!dragging) return;
  var p = ptrPos(e);
  var rx0 = W * 0.40, rx1 = W * 0.60;
  // horizontal drag across the river: spawn ripples where the stroke crosses the band
  var steps = 8, i;
  for (i = 1; i <= steps; i++) {
    var x = lastPX + (p.x - lastPX) * i / steps;
    var y = lastPY + (p.y - lastPY) * i / steps;
    if (x > rx0 && x < rx1) {
      var t = nowT();
      if (Math.abs(y - lastRippleY) > 14 || t - lastRippleT > 0.22) {
        spawnRipple(y, t); lastRippleY = y; lastRippleT = t;
      }
    }
  }
  lastPX = p.x; lastPY = p.y;
}
function onUp() { dragging = false; }
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
canvas.addEventListener('touchstart', onDown, { passive: true });
canvas.addEventListener('touchmove', onMove, { passive: true });
window.addEventListener('touchend', onUp);

// ---- helpers ----
function hexA(hex, a) {
  var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

// ---- draw ----
function draw(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var rx0 = W * 0.40, rx1 = W * 0.60, rw = rx1 - rx0;
  var i, j;

  // ground
  ctx.fillStyle = NIGHT;
  ctx.fillRect(0, 0, W, H);
  // bank grounds: left barely warm-dark, river band, right deep
  ctx.fillStyle = hexA(EMBER, 0.05);
  ctx.fillRect(0, 0, rx0, H);
  ctx.fillStyle = hexA(RIVER, 0.16);
  ctx.fillRect(rx0, 0, rw, H);
  ctx.fillStyle = hexA(DEEP, 0.35);
  ctx.fillRect(rx1, 0, W - rx1, H);

  // ease the left bank's phase answer toward its target (time-based smoothing)
  leftShift += (leftShiftTarget - leftShift) * Math.min(1, 0.9 * 0.016 + 0.02);
  // (kept frame-rate tolerant: also snap when far behind after tab sleep)
  if (Math.abs(leftShiftTarget - leftShift) < 0.0005) leftShift = leftShiftTarget;

  // ---- LEFT BANK: interlocking tick pulses ----
  var unit = Math.min(W, H);
  for (i = 0; i < ticks.length; i++) {
    var tk = ticks[i];
    var ph = ((t + leftShift) / tk.period + tk.off) % 1;
    var pulse = Math.pow(0.5 + 0.5 * Math.sin(ph * Math.PI * 2), 2.2);
    var a = 0.16 + 0.84 * pulse;
    var len = unit * 0.012 * tk.base * (0.7 + 0.9 * pulse);
    var col = tk.ember ? EMBER : WARM;
    ctx.strokeStyle = hexA(col, a * 0.9);
    ctx.lineWidth = Math.max(1, unit * 0.0022);
    ctx.beginPath();
    for (j = 0; j < tk.nTick; j++) {
      var ang = tk.rot + (j / tk.nTick) * Math.PI * 2 + pulse * 0.12;
      var inner = len * 0.35;
      ctx.moveTo(tk.x + Math.cos(ang) * inner, tk.y + Math.sin(ang) * inner);
      ctx.lineTo(tk.x + Math.cos(ang) * len, tk.y + Math.sin(ang) * len);
    }
    ctx.stroke();
    ctx.fillStyle = hexA(col, a);
    ctx.beginPath();
    ctx.arc(tk.x, tk.y, Math.max(0.8, unit * 0.0022), 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- RIVER: particles + foam ----
  for (i = 0; i < drops.length; i++) {
    var d = drops[i];
    var yf = ((d.y0 + d.speed * t) % 1 + 1) % 1;
    var x = rx0 + (d.fx + Math.sin(t * 0.35 + d.swayPh) * d.swayAmp) * rw;
    ctx.fillStyle = hexA(RIVER, d.a);
    ctx.beginPath();
    ctx.arc(x, yf * H, d.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.lineCap = 'round';
  for (i = 0; i < flecks.length; i++) {
    var f = flecks[i];
    var fy = ((f.y0 + f.speed * t) % 1 + 1) % 1;
    var fx = rx0 + f.fx * rw + Math.sin(t * 0.5 + f.ph) * rw * 0.03;
    var tw = 0.5 + 0.5 * Math.sin(t * 1.3 + f.ph * 3.0);
    ctx.strokeStyle = hexA(FOAM, f.a * (0.35 + 0.65 * tw));
    ctx.lineWidth = Math.max(1, unit * 0.0016);
    ctx.beginPath();
    ctx.moveTo(fx, fy * H - f.len);
    ctx.lineTo(fx, fy * H + f.len);
    ctx.stroke();
  }

  // ---- RIPPLES: wavefronts crossing the band toward both banks ----
  var speed = rw * 0.55; // px per second, each direction
  for (i = ripples.length - 1; i >= 0; i--) {
    var rp = ripples[i];
    var age = t - rp.t0;
    if (age < 0) continue;
    var reach = speed * age;
    if (reach > rw * 0.75 && rp.hitL && rp.hitR) { ripples.splice(i, 1); continue; }
    var fade = Math.max(0, 1 - reach / (rw * 0.78));
    // left-going and right-going fronts inside the band
    var dirs = [-1, 1];
    for (j = 0; j < 2; j++) {
      var cx = (rx0 + rx1) / 2 + dirs[j] * reach;
      if (cx < rx0 - 2 || cx > rx1 + 2) continue;
      ctx.strokeStyle = hexA(FOAM, 0.55 * fade);
      ctx.lineWidth = Math.max(1, unit * 0.0024);
      ctx.beginPath();
      ctx.moveTo(cx, rp.y - H * 0.045 * (0.4 + fade));
      ctx.quadraticCurveTo(cx + dirs[j] * rw * 0.03, rp.y, cx, rp.y + H * 0.045 * (0.4 + fade));
      ctx.stroke();
    }
    // bank arrivals: the call is answered
    if (!rp.hitL && reach >= rw / 2) {
      rp.hitL = true;
      leftShiftTarget += Math.PI * 0.5; // left bank re-phases its rhythm
    }
    if (!rp.hitR && reach >= rw / 2) {
      rp.hitR = true;
      rightSwells.push(rp.t0 + (rw / 2) / speed);
      if (rightSwells.length > 12) rightSwells.shift();
    }
  }

  // ---- RIGHT BANK: slow breathing arcs, swelling once when answered ----
  var swell = 0;
  for (i = 0; i < rightSwells.length; i++) {
    var dt = t - rightSwells[i];
    if (dt >= 0) swell += Math.exp(-dt / 1.4);
  }
  swell = Math.min(1.2, swell);
  for (i = 0; i < arcs.length; i++) {
    var ar = arcs[i];
    var br = 0.5 + 0.5 * Math.sin((t / ar.breath) * Math.PI * 2 + ar.bOff);
    var aAmp = 0.18 + 0.55 * br + 0.5 * swell * br;
    var rad = ar.rad * (1 + 0.10 * Math.sin(t * 0.11 + ar.wob)) * (1 + 0.16 * swell);
    var a0 = ar.a0 + ar.drift * t;
    ctx.strokeStyle = hexA(ar.deep ? DEEP : COOL, Math.min(1, aAmp) * (ar.deep ? 0.9 : 0.8));
    ctx.lineWidth = Math.max(1, unit * 0.0032);
    ctx.beginPath();
    ctx.arc(ar.x, ar.y, rad, a0, a0 + ar.span);
    ctx.stroke();
    // a fainter, wider companion arc: sustained tone, not an echo effect
    ctx.strokeStyle = hexA(ar.deep ? DEEP : COOL, Math.min(1, aAmp) * 0.28);
    ctx.lineWidth = Math.max(1, unit * 0.0016);
    ctx.beginPath();
    ctx.arc(ar.x, ar.y, rad * 1.18, a0 + 0.15, a0 + ar.span * 0.8);
    ctx.stroke();
  }
}

// ---- boot: frame one at t = 0, then the loop ----
measure();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function() {
    draw(nowT());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
