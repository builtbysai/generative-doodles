<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Yellow Movie</title>
<style>
  html, body { margin: 0; padding: 0; background: #cfcec9; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Seeded RNG (mulberry32). All texture is precomputed from this stream.
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(827101);

  // Palette (strict): paper, frame black, field white drifting to yellowed.
  var PAPER = [247, 245, 240];        // #F7F5F0
  var BLACK = [26, 26, 26];           // #1A1A1A
  var WHITE = [255, 255, 255];        // #FFFFFF
  var YELLOWED = [245, 234, 200];     // #F5EAC8
  function mix(a, b, t) {
    return [Math.round(a[0] + (b[0] - a[0]) * t),
            Math.round(a[1] + (b[1] - a[1]) * t),
            Math.round(a[2] + (b[2] - a[2]) * t)];
  }
  function css(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
  var SURROUND = mix(PAPER, BLACK, 0.18);  // paper at a lower value
  var LABELC = mix(PAPER, BLACK, 0.45);    // quiet grey for the label

  // The film's clock: age since the creation epoch baked in at build time.
  // Ship date 2026-10-31T00:00:00Z. The prompt seeds the yellowing from a
  // real-world timestamp; this is the piece's one sanctioned wall-clock input.
  var CREATION = Date.UTC(2026, 9, 31, 0, 0, 0);
  var YEAR_MS = 365.25 * 24 * 60 * 60 * 1000;
  function ageYears() {
    var a = (Date.now() - CREATION) / YEAR_MS;
    return a > 0 ? a : 0;
  }

  // ---- Seeded precomputed data (normalized coordinates) ----

  // Sheet corner jitter (fractions of sheet size).
  var corners = [];
  for (var i = 0; i < 4; i++) corners.push([(rng() * 2 - 1) * 0.006, (rng() * 2 - 1) * 0.006]);

  // Brush strokes for the frame: {e edge, t0/t1 along edge, p0/p1 perpendicular
  // offset in stroke-width units (positive = inward), w width fraction, a alpha}.
  var strokes = [];
  var edgeRel = [1, 0.55, 1, 0.55]; // right/left edges are shorter
  function addPass(count, wMin, wMax, aMin, aMax, perp, overlap) {
    for (var e = 0; e < 4; e++) {
      var n = Math.max(6, Math.round(count * edgeRel[e]));
      for (var k = 0; k < n; k++) {
        var tc = (k + 0.5) / n + (rng() * 2 - 1) * 0.5 / n;
        var len = (1 / n) * overlap * (0.75 + rng() * 0.6);
        var p = (rng() * 2 - 1) * perp;
        strokes.push({
          e: e, t0: tc - len / 2, t1: tc + len / 2,
          p0: p, p1: p + (rng() * 2 - 1) * 0.3,
          w: wMin + rng() * (wMax - wMin),
          a: aMin + rng() * (aMax - aMin)
        });
      }
    }
  }
  addPass(26, 0.95, 1.2, 0.16, 0.30, 0.30, 1.5);  // broad underlayer
  addPass(34, 0.60, 1.05, 0.50, 0.88, 0.34, 1.7); // main brushed band
  addPass(30, 0.20, 0.45, 0.22, 0.50, 0.62, 0.8); // dry-brush speckle

  // One drip, hanging from the bottom edge near the right corner.
  var drip = { t: 0.90 + rng() * 0.06, len: 1.5 + rng() * 0.7, w: 0.13 + rng() * 0.06 };

  // Age-driven grain speckles in sheet coordinates (drawn in stepped counts).
  var grain = [];
  for (var g = 0; g < 600; g++) grain.push([rng(), rng(), 1 + rng() * 1.5]);

  // ---- Canvas setup (Visual Viewport sizing, house rules) ----
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function isPhone(w, h) {
    var sw = (window.screen && window.screen.width) || 9999;
    var sh = (window.screen && window.screen.height) || 9999;
    if (Math.min(sw, sh) < 700) return true;
    return h > w * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    draw();
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  function edgePoint(e, tt, p, fx0, fy0, fx1, fy1) {
    var fw = fx1 - fx0, fh = fy1 - fy0;
    if (e === 0) return [fx0 + tt * fw, fy0 + p];       // top, inward = +y
    if (e === 1) return [fx1 - p, fy0 + tt * fh];       // right, inward = -x
    if (e === 2) return [fx0 + tt * fw, fy1 - p];       // bottom, inward = -y
    return [fx0 + p, fy0 + tt * fh];                    // left, inward = +x
  }

  function draw() {
    if (!W || !H) return;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var age = ageYears();
    var t = Math.min(age / 50, 1); // 50-year yellowing curve, linear

    // Surround.
    ctx.fillStyle = css(SURROUND);
    ctx.fillRect(0, 0, W, H);

    // Sheet geometry: roughly 16:10, centered, ~80% of the frame.
    var phone = isPhone(W, H);
    var m = Math.min(W, H);
    var sw = m * (phone ? 0.86 : 0.80);
    var sh = sw * 10 / 16;
    var sx = (W - sw) / 2, sy = (H - sh) / 2;
    var pts = [
      [sx + corners[0][0] * sw, sy + corners[0][1] * sh],
      [sx + sw + corners[1][0] * sw, sy + corners[1][1] * sh],
      [sx + sw + corners[2][0] * sw, sy + sh + corners[2][1] * sh],
      [sx + corners[3][0] * sw, sy + sh + corners[3][1] * sh]
    ];
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fillStyle = css(PAPER);
    ctx.fill();

    // Frame rectangle and the field of house paint inside it.
    var fx0 = sx + sw * 0.085, fx1 = sx + sw * 0.915;
    var fy0 = sy + sh * 0.14, fy1 = sy + sh * 0.86;
    var sW = sw * 0.034; // brush stroke width unit
    var field = mix(WHITE, YELLOWED, t);
    ctx.fillStyle = css(field);
    ctx.fillRect(fx0, fy0, fx1 - fx0, fy1 - fy0);

    // Hand-brushed frame: seeded overlapping strokes along the rectangle.
    ctx.lineCap = 'round';
    for (var s = 0; s < strokes.length; s++) {
      var st = strokes[s];
      var a = edgePoint(st.e, st.t0, st.p0 * sW, fx0, fy0, fx1, fy1);
      var b = edgePoint(st.e, st.t1, st.p1 * sW, fx0, fy0, fx1, fy1);
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.lineWidth = Math.max(0.6, st.w * sW);
      ctx.strokeStyle = 'rgba(26,26,26,' + st.a.toFixed(3) + ')';
      ctx.stroke();
    }

    // The drip: down from the bottom edge, over the paper.
    var dx = fx0 + drip.t * (fx1 - fx0);
    ctx.beginPath();
    ctx.moveTo(dx, fy1 - 0.2 * sW);
    ctx.lineTo(dx, fy1 + drip.len * sW);
    ctx.lineWidth = Math.max(0.6, drip.w * sW);
    ctx.strokeStyle = 'rgba(26,26,26,0.82)';
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(dx, fy1 + drip.len * sW, Math.max(0.5, drip.w * sW * 0.95), 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(26,26,26,0.82)';
    ctx.fill();

    // Age veil over the whole sheet (imperceptible for years).
    if (t > 0) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (var j = 1; j < 4; j++) ctx.lineTo(pts[j][0], pts[j][1]);
      ctx.closePath();
      ctx.fillStyle = 'rgba(245,234,200,' + (0.10 * t).toFixed(4) + ')';
      ctx.fill();
    }

    // Grain: stepped counts so the count changes only every ~12 days.
    var grainCount = Math.min(grain.length, Math.floor(age * 30) * 8);
    ctx.fillStyle = 'rgba(26,26,26,0.05)';
    for (var q = 0; q < grainCount; q++) {
      ctx.fillRect(sx + grain[q][0] * sw, sy + grain[q][1] * sh, grain[q][2], grain[q][2]);
    }

    // Gallery label: the only visible text besides the title.
    var fs = Math.max(10, Math.round(m * 0.017));
    ctx.font = fs + 'px sans-serif';
    ctx.textBaseline = 'top';
    ctx.fillStyle = css(LABELC);
    ctx.fillText('Yellow Movie, frame ' + age.toFixed(2) + ' / 50 years.', sx, sy + sh + fs * 0.9);
  }

  resize();

  // The age display changes at most once every ~3.65 days (the label's second
  // decimal), so a guarded rAF watch that redraws only on change is more than
  // enough; the 1 Hz age recompute lives inside draw(). No loop in renderers
  // without rAF: frame one is the synchronous draw above.
  var lastLabel = ageYears().toFixed(2);
  function tick() {
    var s = ageYears().toFixed(2);
    if (s !== lastLabel) { lastLabel = s; draw(); }
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
})();
</script>
</body>
</html>
