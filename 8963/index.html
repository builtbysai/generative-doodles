<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>№ 8963 — One Series Two Materials</title>
<!-- phantom-fill-8963 -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #f2ecdf;
    color: #1a1712;
    font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    overflow: hidden;
  }
  canvas { position: fixed; inset: 0; display: block; }
  header {
    position: fixed; top: 28px; left: 32px; z-index: 2; pointer-events: none;
  }
  header .no {
    font-size: 11px; letter-spacing: .35em; text-transform: uppercase;
    color: #8a6d2f; margin-bottom: 8px;
  }
  header h1 {
    font-size: 30px; font-weight: normal; letter-spacing: .02em; color: #211c14;
  }
  header .sub {
    margin-top: 8px; font-size: 13px; font-style: italic; color: #6d6455;
    max-width: 360px; line-height: 1.5;
  }
  footer {
    position: fixed; right: 32px; bottom: 24px; z-index: 2;
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: #8a8072; pointer-events: none; text-align: right; line-height: 1.9;
  }
  footer b { color: #8a6d2f; font-weight: normal; }
  #readout {
    position: fixed; left: 32px; bottom: 24px; z-index: 2;
    font-size: 13px; color: #4a4234; pointer-events: none; line-height: 1.7;
  }
  #readout .big {
    font-size: 22px; color: #211c14; font-style: italic;
  }
  #soundBtn {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    z-index: 3; cursor: pointer;
    font-family: Georgia, serif; font-size: 12px; letter-spacing: .22em;
    text-transform: uppercase; color: #f2ecdf; background: #211c14;
    border: none; border-radius: 999px; padding: 11px 22px;
  }
  #soundBtn:hover { background: #8a6d2f; }
  @media (max-width: 640px) {
    header { top: 18px; left: 20px; }
    header h1 { font-size: 23px; }
    header .sub { font-size: 12px; max-width: 250px; }
    footer { right: 20px; bottom: 16px; }
    #readout { left: 20px; bottom: 70px; }
  }
</style>
</head>
<body>
<canvas id="ribbon"></canvas>
<header>
  <div class="no">№ 8963</div>
  <h1>One Series Two Materials</h1>
  <div class="sub">One logarithmic series drives both a ribbon&rsquo;s geometry
  and a striker&rsquo;s rhythm. The same structure, felt twice — seen in the
  ribbon, heard in the strikes.</div>
</header>
<div id="readout"><div class="big">&mdash;</div><div>tap for sound</div></div>
<footer>
  <div>series <b>log&#8322;(n + 2)</b></div>
  <div>12 strikes &middot; ribbon + rhythm</div>
</footer>
<button id="soundBtn" type="button">Tap for sound</button>
<script>
(function () {
  'use strict';
  // DRIVER: A single logarithmic series, log2(n+2), sets both the ribbon's
  // marks in space and the striker's rhythm in time — the striker travels at
  // constant speed, so log-spaced marks become log-spaced strikes, each
  // sounding the harmonic (n+2) of 55 Hz.
  var N = 12;            // strikes per pass
  var LOOP_MS = 15000;   // one pass of the striker
  var F0 = 55;           // harmonic root

  var canvas = document.getElementById('ribbon');
  var ctx = canvas.getContext('2d');
  var readout = document.getElementById('readout');
  var soundBtn = document.getElementById('soundBtn');
  var W, H, X0, X1, CY, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    X0 = Math.max(48, W * 0.07);
    X1 = W - X0;
    CY = H * 0.56;
  }
  window.addEventListener('resize', resize);
  resize();

  // Log-spaced mark positions: x_n = X0 + (X1-X0) * log2(n+2)/log2(N+1).
  function markX(n) {
    return X0 + (X1 - X0) * (Math.log2(n + 2) / Math.log2(N + 1));
  }
  // Ribbon half-width swells with the series value at each mark.
  function halfAt(x) {
    var t = (x - X0) / (X1 - X0);
    var v = Math.log2(1 + t * (N + 1)) / Math.log2(N + 2);
    return (14 + v * 46) * Math.min(W, H) / 700 + 10;
  }

  // ---- audio ----
  var actx = null, muted = false, audioOn = false;
  function ensureAudio() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
    }
    if (actx.state === 'suspended' && !muted) actx.resume();
  }
  function strikeTone(n) {
    if (!audioOn || muted || !actx) return;
    var f = F0 * (n + 2);
    var t = actx.currentTime;
    var o1 = actx.createOscillator(), o2 = actx.createOscillator();
    var g = actx.createGain();
    o1.type = 'sine'; o1.frequency.value = f;
    o2.type = 'sine'; o2.frequency.value = f * 2;
    var g2 = actx.createGain(); g2.gain.value = 0.25;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    o1.connect(g); o2.connect(g2); g2.connect(g);
    g.connect(actx.destination);
    o1.start(t); o2.start(t);
    o1.stop(t + 1); o2.stop(t + 1);
  }
  // Audio lifecycle: suspend on hide/blur/close, resume on return.
  function suspendAudio() { if (actx && actx.state === 'running') actx.suspend(); }
  function resumeAudio() {
    if (actx && actx.state === 'suspended' && audioOn && !muted) actx.resume();
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) suspendAudio(); else resumeAudio();
  });
  window.addEventListener('blur', suspendAudio);
  window.addEventListener('focus', resumeAudio);
  window.addEventListener('pagehide', suspendAudio);

  soundBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (!audioOn) {
      audioOn = true; ensureAudio();
      soundBtn.textContent = 'Sound on — tap to mute';
      readout.innerHTML = '<div class="big">&mdash;</div><div>listening — the bead strikes as it passes each mark</div>';
    } else {
      muted = !muted;
      soundBtn.textContent = muted ? 'Muted — tap for sound' : 'Sound on — tap to mute';
      if (muted) suspendAudio(); else resumeAudio();
    }
  });
  // First tap anywhere also enables sound.
  document.addEventListener('pointerdown', function (e) {
    if (e.target === soundBtn) return;
    if (!audioOn) soundBtn.click();
  }, { once: false });
  window.__audioState = function () {
    return actx ? actx.state : 'no-context';
  };

  // ---- animation ----
  var flashes = []; // {x, t0}
  var lastStrike = -1;

  function fmtHz(n) { return (F0 * (n + 2)) + ' Hz'; }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    var phase = (now % LOOP_MS) / LOOP_MS;
    var sx = X0 + (X1 - X0) * phase;

    // Ribbon: filled band, half-width from the series.
    ctx.beginPath();
    var x;
    for (x = X0; x <= X1; x += 4) ctx.lineTo(x, CY - halfAt(x));
    for (x = X1; x >= X0; x -= 4) ctx.lineTo(x, CY + halfAt(x));
    ctx.closePath();
    ctx.fillStyle = '#211c14';
    ctx.fill();

    // Series marks: brass ticks + numerals.
    ctx.textAlign = 'center';
    for (var n = 0; n < N; n++) {
      var mx = markX(n);
      var hh = halfAt(mx);
      ctx.beginPath();
      ctx.moveTo(mx, CY - hh - 6);
      ctx.lineTo(mx, CY + hh + 6);
      ctx.strokeStyle = 'rgba(190,158,84,0.9)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#8a6d2f';
      ctx.font = 'italic 12px Georgia, serif';
      ctx.fillText(String(n + 2), mx, CY + hh + 26);
      ctx.fillStyle = 'rgba(74,66,52,0.75)';
      ctx.font = '10px Georgia, serif';
      ctx.fillText(fmtHz(n), mx, CY - hh - 14);
    }

    // Strikes: the striker sounds each mark as it passes.
    for (var m = 0; m < N; m++) {
      if (markX(m) <= sx && m > lastStrike) {
        lastStrike = m;
        flashes.push({ x: markX(m), t0: now });
        strikeTone(m);
        readout.innerHTML = '<div class="big">strike ' + (m + 1) +
          ' &mdash; ' + fmtHz(m) + '</div><div>log&#8322;(' + (m + 2) +
          ') = ' + Math.log2(m + 2).toFixed(3) + ' &middot; harmonic ' + (m + 2) + '</div>';
      }
    }
    if (phase < 0.01) lastStrike = -1;

    // Flash rings at struck marks.
    flashes = flashes.filter(function (f) { return now - f.t0 < 700; });
    flashes.forEach(function (f) {
      var p = (now - f.t0) / 700;
      ctx.beginPath();
      ctx.arc(f.x, CY, 6 + p * 42, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(190,158,84,' + (0.9 * (1 - p)).toFixed(2) + ')';
      ctx.lineWidth = 2 * (1 - p) + 0.5;
      ctx.stroke();
    });

    // The striker: a brass bead riding the ribbon's centre line.
    ctx.beginPath();
    ctx.arc(sx, CY, 9, 0, Math.PI * 2);
    ctx.fillStyle = '#c9a24d';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(sx, CY, 13, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(201,162,77,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // Striker stem up to a small handle, brass so it reads on the dark ribbon.
    ctx.beginPath();
    ctx.moveTo(sx, CY - 9);
    ctx.lineTo(sx, CY - 34);
    ctx.strokeStyle = '#c9a24d';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(sx, CY - 40, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#c9a24d';
    ctx.fill();

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
