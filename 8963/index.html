<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>&#8470;8963 &middot; One Series Two Materials</title>
<style>
  :root{ --paper:#f5efe0; --ink:#26221c; --ink-soft:#6e6455; --verm:#c23b22; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--paper)}
  body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--ink);
       -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #wrap{position:fixed;inset:0;overflow:hidden}
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
  #plate{position:absolute;top:14px;left:18px;pointer-events:none;user-select:none;
    font-size:13px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}
  #plate b{color:var(--ink);font-weight:700}
  #sub{position:absolute;top:36px;left:18px;pointer-events:none;user-select:none;
    font-size:11px;letter-spacing:.08em;color:var(--ink-soft)}
  #beat{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom));pointer-events:none;user-select:none;
    font-size:12px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase}
  #beat b{color:var(--verm)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="stage"></canvas>
  <div id="plate"><b>&#8470;8963</b> &middot; One Series Two Materials</div>
  <div id="sub">log&#8322;(1&hellip;16) drawn as shape, struck as rhythm</div>
  <div id="beat">segment <b id="segnum">–</b> of 16</div>
</div>
<script>
"use strict";
/* Seed 263 "One Series Two Materials": one parametric series drives both
   geometry and timing. The series s(j) = log2(j), j = 1..16, is drawn as
   a ribbon whose segment lengths and thicknesses follow it, and struck as
   a rhythm whose beat intervals follow the same numbers. A vermilion
   striker lands on the current segment at each beat, so the correspondence
   is seen and felt without being explained. */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const segNum = document.getElementById('segnum');

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seedFromURL(){
  const m = /[?&]seed=(\d+)/.exec(location.search);
  return m ? (parseInt(m[1],10) >>> 0) : ((Math.random()*1e9)|0);
}
let SEED = seedFromURL();

const N = 16;
const INKS = ['#26221c','#1e2a33','#3a2a20'];
let W=0,H=0,DPR=1;
let rnd, ink, segs, beats, beatIdx, beatT, nextBeat, wander, ripples, cycleN, paused;

function series(j){ return Math.log2(j); }   // j = 1..16

function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
window.addEventListener('resize', resize);

function layout(){
  // geometry from the series: segment widths and ribbon thickness
  const totalW = W*0.78, x0 = W*0.11;
  let sw = 0;
  const raw = [];
  for(let j=1;j<=N;j++){ const w = series(j)+0.35; raw.push(w); sw += w; }
  segs = [];
  let x = x0;
  for(let j=1;j<=N;j++){
    const w = raw[j-1]/sw*totalW;
    segs.push({j:j, x:x, w:w, s:series(j)/4});
    x += w;
  }
  // timing from the SAME series: beat intervals
  beats = [];
  let acc = 0.8;
  for(let j=1;j<=N;j++){
    const iv = 0.42*(0.45+0.55*series(j)/4);
    beats.push({at:acc, iv:iv});
    acc += iv;
  }
}

function newCycle(){
  rnd = mulberry32(SEED + cycleN*31337);
  ink = INKS[(rnd()*INKS.length)|0];
  wander = rnd()*10;
  ripples = [];
  beatIdx = -1;
  nextBeat = 0.8;
  paused = false;
  layout();
}

function ribbonY(x, t){
  return H*0.52 + Math.sin(x*0.008 + wander + t*0.35)*H*0.055
       + Math.sin(x*0.021 + wander*2.0 - t*0.22)*H*0.028;
}

function draw(now){
  const t = now/1000;
  const ct = t - newCycle.t0;
  ctx.fillStyle = '#f5efe0';
  ctx.fillRect(0,0,W,H);

  // beat clock: advance through the series as rhythm
  if(!paused && ct >= nextBeat && beatIdx < N-1){
    beatIdx++;
    nextBeat = beats[beatIdx].at + beats[beatIdx].iv;
    const sg = segs[beatIdx];
    ripples.push({x:sg.x+sg.w/2, y:ribbonY(sg.x+sg.w/2, t), born:t});
    segNum.textContent = String(beatIdx+1).padStart(2,'0');
  }
  const cycleEnd = beats[N-1].at + beats[N-1].iv + 2.2;
  if(ct >= cycleEnd){
    cycleN++;
    newCycle();
    newCycle.t0 = t;
    segNum.textContent = '–';
    return requestAnimationFrame(draw);
  }

  // the ribbon, drawn from the series: each segment clipped to its own
  // strip so the round caps cannot overlap into dark dots at the joints
  for(let i=0;i<N;i++){
    const sg = segs[i];
    const active = (i === beatIdx);
    const thick = (7 + 30*sg.s) * Math.min(1.2, Math.max(0.7, Math.min(W,H)/700));
    ctx.save();
    ctx.beginPath();
    ctx.rect(sg.x, 0, sg.w, H);
    ctx.clip();
    ctx.strokeStyle = ink;
    ctx.globalAlpha = active ? 1 : 0.88;
    ctx.lineWidth = thick;
    ctx.lineCap = 'round';
    ctx.beginPath();
    const steps = Math.max(6, sg.w/14|0);
    for(let k=0;k<=steps;k++){
      const x = sg.x + sg.w*k/steps;
      const y = ribbonY(x, t);
      if(k===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
    // active segment glows vermilion at its core
    if(active){
      ctx.strokeStyle = '#c23b22';
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = Math.max(2, thick*0.28);
      ctx.beginPath();
      for(let k=0;k<=steps;k++){
        const x = sg.x + sg.w*k/steps;
        const y = ribbonY(x, t);
        if(k===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    // segment number, small
    ctx.fillStyle = 'rgba(38,34,28,0.5)';
    ctx.font = '400 10px "Avenir Next","Segoe UI",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(String(sg.j), sg.x+sg.w/2, ribbonY(sg.x+sg.w/2, t)-thick/2-8);
  }

  // the striker: falls from above, lands on the current segment each beat
  if(beatIdx >= 0 && beatIdx < N){
    const sg = segs[beatIdx];
    const bt = beats[beatIdx];
    const since = ct - bt.at;                    // time since this beat fired
    const f = Math.min(1, since/(bt.iv*0.9));    // striker cycle within the interval
    const sx = sg.x+sg.w/2, sy = ribbonY(sx, t);
    const lift = Math.sin(f*Math.PI);            // up and back down
    const bx = sx, by = sy - 90*lift*Math.min(1,Math.min(W,H)/600) - 14;
    ctx.strokeStyle = '#c23b22'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(bx, by); ctx.stroke();
    ctx.fillStyle = '#c23b22';
    ctx.beginPath(); ctx.arc(bx, by, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#f5efe0';
    ctx.beginPath(); ctx.arc(bx, by, 3.5, 0, 7); ctx.fill();
  }

  // ripples where beats landed (time-based so they read at any frame rate)
  for(let i=ripples.length-1;i>=0;i--){
    const rp = ripples[i];
    const age = t - rp.born;
    if(age > 0.85){ ripples.splice(i,1); continue; }
    const rr = 6 + age*160, aa = 0.9*(1-age/0.85);
    ctx.strokeStyle = 'rgba(194,59,34,'+aa.toFixed(2)+')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rr, 0, 7); ctx.stroke();
  }

  requestAnimationFrame(draw);
}

canvas.addEventListener('pointerdown', ()=>{
  SEED = (Math.random()*1e9)|0;
  cycleN = 0;
  newCycle.t0 = performance.now()/1000;
  segNum.textContent = '–';
});

resize();
cycleN = 0;
newCycle();
newCycle.t0 = performance.now()/1000;
requestAnimationFrame(draw);
</script>
</body>
</html>
