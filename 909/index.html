<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hilbert goes for a walk</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0A0A0A; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict) ----------
  var GROUND = '#0A0A0A';
  var RED = [224, 49, 27];      // #E0311B
  var ORANGE = [242, 140, 26];  // #F28C1A
  var PALE = [255, 247, 230];   // #FFF7E6
  var HOLLOW = [90, 42, 26];    // #5A2A1A

  function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function lerpC(a, b, t) {
    return [Math.round(a[0] + (b[0] - a[0]) * t),
            Math.round(a[1] + (b[1] - a[1]) * t),
            Math.round(a[2] + (b[2] - a[2]) * t)];
  }

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- palette variants (the re-rollable heat) ----------
  // Roll 0 is the canonical ramp from the prompt: pale at the head,
  // orange just behind, red settled, hollow tone at the cold end.
  // Later rolls are drawn in order from the seeded stream: they may
  // flip which end burns pale, move the orange stop, mix the mid tone
  // toward red (or toward pale when flipped), and shift the settled
  // size floor. All stops stay inside the warm family.
  var variants = [];
  variants.push({ flip: false, midStop: 0.55, midMix: 0.0, floor: 0.55 });
  (function () {
    var r = mulberry32(90917);
    for (var i = 1; i < 32; i++) {
      variants.push({
        flip: r() < 0.35,
        midStop: 0.35 + r() * 0.35,
        midMix: r() * 0.5,
        floor: 0.45 + r() * 0.2
      });
    }
  })();
  var tapCount = 0;   // palette roll = tapCount % variants.length

  // Heat color at h in [0,1] for a variant. Stops:
  // h=0 hollow tone, h=0.18 settled end, h=midStop mid, h=1 head end.
  function colorFor(h, v) {
    var headEnd = v.flip ? RED : PALE;
    var settledEnd = v.flip ? PALE : RED;
    var mid = lerpC(ORANGE, v.flip ? PALE : RED, v.midMix);
    var stops = [[0, HOLLOW], [0.18, settledEnd], [v.midStop, mid], [1, headEnd]];
    for (var i = 1; i < stops.length; i++) {
      if (h <= stops[i][0]) {
        var t = (h - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]);
        return lerpC(stops[i - 1][1], stops[i][1], t);
      }
    }
    return headEnd;
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 300, H = 300;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 9999;
    var sh = (window.screen && window.screen.height) || 9999;
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = Math.max(50, Math.floor(w));
    H = Math.max(50, Math.floor(h));
    canvas.width = W;
    canvas.height = H;
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Hilbert traversal ----------
  function rot(n, xy, rx, ry) {
    if (ry === 0) {
      if (rx === 1) { xy[0] = n - 1 - xy[0]; xy[1] = n - 1 - xy[1]; }
      var t = xy[0]; xy[0] = xy[1]; xy[1] = t;
    }
  }
  function d2xy(n, d) {
    var xy = [0, 0], t = d;
    for (var s = 1; s < n; s *= 2) {
      var rx = 1 & Math.floor(t / 2);
      var ry = 1 & (t ^ rx);
      rot(s, xy, rx, ry);
      xy[0] += rx * s; xy[1] += ry * s;
      t = Math.floor(t / 4);
    }
    return xy;
  }
  function xy2d(n, x, y) {
    var d = 0;
    for (var s = Math.floor(n / 2); s > 0; s = Math.floor(s / 2)) {
      var rx = (x & s) > 0 ? 1 : 0;
      var ry = (y & s) > 0 ? 1 : 0;
      d += s * s * ((3 * rx) ^ ry);
      var xy = [x, y];
      rot(s, xy, rx, ry);
      x = xy[0]; y = xy[1];
    }
    return d;
  }
  function buildOrder(order) {
    var n = Math.pow(2, order);
    var cells = [];
    for (var d = 0; d < n * n; d++) cells.push(d2xy(n, d));
    return { order: order, n: n, count: n * n, cells: cells };
  }
  var ORD4 = buildOrder(4);   // 16x16, 256 cells
  var ORD5 = buildOrder(5);   // 32x32, 1024 cells

  // ---------- walk state (closed-form over time + recorded events) ----------
  var SPEED = 12;             // cells per second, in order-4 units
  var PHASE0 = 100;           // frame one: head mid-journey at index ~100
  var simTime = 0;
  // Anchor: at time t0 the walker's float position (order-4 units) was base.
  // headFloat(t) = base + SPEED * (t - t0); scrub events append anchors.
  var anchors = [{ t0: 0, base: PHASE0 }];
  var recursionStart = -100;  // simTime of the last double-tap
  var RECURSION_SPAN = 8;     // seconds of order-5 subdivision

  function anchorAt(t) {
    for (var i = anchors.length - 1; i >= 0; i--) {
      if (anchors[i].t0 <= t) return anchors[i];
    }
    return anchors[0];
  }
  function headFloat(t) {
    var a = anchorAt(t);
    return a.base + SPEED * (t - a.t0);
  }
  function inRecursion(t) {
    return t - recursionStart < RECURSION_SPAN && recursionStart >= 0;
  }

  // ---------- audio (lazy, gesture-only, guarded) ----------
  var AC = null;
  function ensureAudio() {
    if (AC) { if (AC.resume) AC.resume(); return; }
    var Ctor = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!Ctor) return;
    try { AC = new Ctor(); } catch (e) { AC = null; }
  }
  var PENTA = [0, 2, 4, 7, 9];
  function stepFreq(idx) {
    var within = idx % 25;
    var semi = PENTA[within % 5] + 12 * Math.floor(within / 5);
    return 220 * Math.pow(2, semi / 12);
  }
  function blip(freq, gain, dur, when) {
    if (!AC) return;
    try {
      var t = AC.currentTime + (when || 0);
      var o = AC.createOscillator();
      o.type = 'sine';
      o.frequency.value = freq;
      var g = AC.createGain();
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(AC.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function tick(idx) {
    var f = stepFreq(idx);
    blip(f, 0.045, 0.07, 0);          // the footstep
    blip(f * 2, 0.014, 0.05, 0);      // the head's higher ping
  }
  function chord() {
    var root = 220;
    [0, 4, 7].forEach(function (semi, i) {
      blip(root * Math.pow(2, semi / 12), 0.04, 0.5, i * 0.06);
    });
  }

  // ---------- interaction ----------
  var dragging = false;
  var downPos = null;
  var downTime = 0;
  var moved = false;
  var lastTapTime = -10;

  function gridGeom() {
    var side = Math.min(W, H) * 0.8;
    return { side: side, ox: (W - side) / 2, oy: (H - side) / 2 };
  }
  function cellFromPoint(px, py, ord) {
    var g = gridGeom();
    var cx = Math.floor((px - g.ox) / (g.side / ord.n));
    var cy = Math.floor((py - g.oy) / (g.side / ord.n));
    if (cx < 0 || cy < 0 || cx >= ord.n || cy >= ord.n) return -1;
    return xy2d(ord.n, cx, cy);
  }

  function onTap() {
    var now = simTime;
    if (now - lastTapTime < 0.35) {
      lastTapTime = -10;
      recursionStart = now;           // double-tap: the recursion
    } else {
      lastTapTime = now;
      tapCount++;                     // single tap: re-roll the heat
      chord();
    }
  }

  canvas.addEventListener('pointerdown', function (e) {
    ensureAudio();
    dragging = true;
    moved = false;
    downPos = { x: e.clientX, y: e.clientY };
    downTime = simTime;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging || !downPos) return;
    var dx = e.clientX - downPos.x;
    var dy = e.clientY - downPos.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
    if (moved) {
      // scrub: re-anchor the walk at the finger's cell, in the
      // traversal of whichever order is currently on screen
      var ord = inRecursion(simTime) ? ORD5 : ORD4;
      var idx = cellFromPoint(e.clientX, e.clientY, ord);
      if (idx >= 0) {
        var base = idx * (ORD4.count / ord.count) + (headFloat(simTime) % 1) * (ORD4.count / ord.count);
        anchors.push({ t0: simTime, base: base });
      }
    }
  });
  function endPointer(e) {
    if (!dragging) return;
    dragging = false;
    if (!moved && simTime - downTime < 0.4) onTap();
    downPos = null;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---------- simulation ----------
  var DT = 1 / 240;
  var lastHeadIdx = Math.floor(headFloat(0)) % ORD4.count;
  function step() {
    simTime += DT;
    var idx = Math.floor(headFloat(simTime)) % ORD4.count;
    if (idx !== lastHeadIdx) {
      lastHeadIdx = idx;
      tick(idx);
    }
  }

  // ---------- drawing ----------
  var SPAN4 = 100;   // cells of warm trail behind the head, order 4

  function drawOrder(ord, t) {
    var g = gridGeom();
    var cell = g.side / ord.n;
    var scale = ord.count / ORD4.count;          // 1 or 4
    var headF = headFloat(t) * scale;            // float head, this order's units
    var span = SPAN4 * scale;
    var v = variants[tapCount % variants.length];
    var headCol = colorFor(1, v);
    var i, d, h, col, frac, cx, cy, size;

    // hollow cells first (ahead of the head: unvisited)
    ctx.strokeStyle = rgb(HOLLOW);
    ctx.lineWidth = Math.max(1, cell * 0.05);
    for (i = 0; i < ord.count; i++) {
      d = (headF - i) % ord.count;
      if (d < 0) d += ord.count;
      if (d < span) continue;
      cx = g.ox + (ord.cells[i][0] + 0.5) * cell;
      cy = g.oy + (ord.cells[i][1] + 0.5) * cell;
      size = cell * 0.34;
      ctx.strokeRect(cx - size / 2, cy - size / 2, size, size);
    }
    // warm trail (behind the head)
    for (i = 0; i < ord.count; i++) {
      d = (headF - i) % ord.count;
      if (d < 0) d += ord.count;
      if (d >= span) continue;
      h = 1 - d / span;
      cx = g.ox + (ord.cells[i][0] + 0.5) * cell;
      cy = g.oy + (ord.cells[i][1] + 0.5) * cell;
      // the head's glow: layered flat-alpha squares, breathing with
      // the fractional part of the head's advance
      if (d < 3) {
        var pulse = 0.75 + 0.25 * (headF - Math.floor(headF));
        var gl = (1 - d / 3) * pulse;
        for (var L = 0; L < 3; L++) {
          var gs = cell * (1.55 - L * 0.24);
          ctx.fillStyle = rgba(headCol, 0.05 * gl + 0.03 * gl * L);
          ctx.fillRect(cx - gs / 2, cy - gs / 2, gs, gs);
        }
      }
      if (h <= 0.03) {
        // cold end of the trail: shrink into the hollow outline
        ctx.strokeStyle = rgb(colorFor(0, v));
        ctx.lineWidth = Math.max(1, cell * 0.05);
        size = cell * 0.34;
        ctx.strokeRect(cx - size / 2, cy - size / 2, size, size);
        continue;
      }
      col = colorFor(h, v);
      // size: hollow size at the cold end, the variant's settled floor
      // at h=0.18, swelling to near-full cell at the head
      if (h < 0.18) {
        frac = 0.34 + (v.floor - 0.34) * (h / 0.18);
      } else {
        frac = v.floor + (0.94 - v.floor) * Math.pow((h - 0.18) / 0.82, 0.7);
      }
      size = cell * frac;
      ctx.fillStyle = rgb(col);
      ctx.fillRect(cx - size / 2, cy - size / 2, size, size);
    }
  }

  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    drawOrder(inRecursion(simTime) ? ORD5 : ORD4, simTime);
  }

  draw();  // frame one: synchronous, deterministic

  // ---------- main loop (fixed timestep) ----------
  var acc = 0, lastTs = null;
  function frame(ts) {
    if (lastTs === null) lastTs = ts;
    var elapsed = (ts - lastTs) / 1000;
    lastTs = ts;
    if (elapsed > 0.25) elapsed = 0.25;
    acc += elapsed;
    while (acc >= DT) { step(); acc -= DT; }
    draw();
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(frame);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
