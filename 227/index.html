<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.227 Crash Stripes</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FAFAF6; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.227 Crash Stripes (Matthew Kluber). After his 2006 Untitled
// (green), the origin piece: thin horizontal bands of lime and
// charcoal on a near-white ground, frozen crash data, flat and
// hard-edged. One band off-centre glitches on its own seeded
// schedule: it stutters, doubles, flashes cyan for a beat, then
// settles, re-firing every nine to fourteen seconds. Nothing is
// clickable and nothing asks to be: the crash re-happening is the
// whole piece. Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var LIME = '#B8F02B', CHAR = '#1C1C1C', CYAN = '#38E8E0', GROUND = '#FAFAF6';
var W = 0, H = 0, phone = false;
var T = 3.4, lastNow = -1; // frame one: settled field, glitch band at rest

function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash(n) {
  var x = Math.sin(n * 127.1) * 43758.5453;
  return x - Math.floor(x);
}

// ---- band layouts (design space: panel height = 300 units) ---------------------
var DH = 300;
function buildBands(rand, maxH, gapMax) {
  // Coloured bands always sit on a hairline of bare ground, so stripes
  // stay individual even when the sequence repeats a colour; wider
  // ground gaps open breathing spaces in the field.
  var bands = [], y = 0;
  while (y < DH) {
    var r = rand();
    if (r < 0.18) {
      var gh = 4 + rand() * 9;
      bands.push({ y: y, h: gh, color: GROUND });
      y += gh;
      continue;
    }
    var h = 3 + rand() * (maxH - 3);
    var color = rand() < 0.55 ? LIME : CHAR;
    bands.push({ y: y, h: h, color: color });
    y += h + 1.2 + rand() * gapMax;
  }
  return bands;
}
var bands = buildBands(rng(227001), 14, 2.4);
var colBands = buildBands(rng(227555), 9, 1.6);

// the glitch band: a taller lime band, off-centre, found once at build time
var glitchBand = null;
(function () {
  var best = 1e9;
  for (var i = 0; i < bands.length; i++) {
    var b = bands[i];
    if (b.color !== LIME || b.h < 7.5) continue;
    var c = (b.y + b.h / 2) / DH;
    if (c < 0.34 || c > 0.82) continue;
    var d = Math.abs(c - 0.58);
    if (d < best) { best = d; glitchBand = b; }
  }
  if (!glitchBand) { // relax: any lime band in the middle stretch
    for (var j = 0; j < bands.length; j++) {
      if (bands[j].color === LIME) { glitchBand = bands[j]; break; }
    }
  }
})();

// ---- glitch schedule: seeded, fires every 9-14s, 0.3-0.6s long -----------------
var events = [];
(function () {
  var rand = rng(227909);
  var t = 9 + rand() * 5;
  while (t < 7200) {
    events.push({ s: t, d: 0.3 + rand() * 0.3 });
    t += 9 + rand() * 5;
  }
})();
function activeGlitch() {
  for (var i = 0; i < events.length; i++) {
    if (events[i].s > T) break;
    if (T < events[i].s + events[i].d) return events[i];
  }
  return null;
}

function panel() {
  var pw = W * (phone ? 1 : 0.94);
  var ph = pw / 2;
  if (ph > H * 0.94) { ph = H * 0.94; pw = ph * 2; }
  return { x: (W - pw) / 2, y: (H - ph) / 2, w: pw, h: ph };
}

function drawBands(list, x0, w, p, sy) {
  for (var i = 0; i < list.length; i++) {
    var b = list[i];
    if (b.color === GROUND) continue;
    ctx.fillStyle = b.color;
    ctx.fillRect(x0, p.y + b.y * sy, w, Math.max(1, b.h * sy));
  }
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var p = panel();
  var sy = p.h / DH;
  var colW = p.w * 0.075, gap = p.w * 0.014;
  var mx = p.x + colW + gap, mw = p.w - colW - gap;
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x, p.y, p.w, p.h); ctx.clip();
  drawBands(colBands, p.x, colW, p, sy);
  drawBands(bands, mx, mw, p, sy);
  var ev = activeGlitch();
  if (ev && glitchBand) {
    var pr = (T - ev.s) / ev.d;
    var env = Math.sin(Math.PI * pr);
    var step = Math.floor((T - ev.s) / 0.055);
    var unit = p.w / 1100;
    var dx1 = (hash(step) - 0.5) * 26 * env * unit;
    var dx2 = (hash(step + 977) - 0.5) * 14 * env * unit;
    var dy = (hash(step + 331) - 0.5) * 3 * env;
    var by = p.y + glitchBand.y * sy, bh = Math.max(1, glitchBand.h * sy);
    ctx.globalAlpha = 0.35 * env;
    ctx.fillStyle = glitchBand.color;
    ctx.fillRect(mx + dx1 * 1.8, by, mw, bh);
    ctx.globalAlpha = 0.75 * env;
    ctx.fillRect(mx + dx1, by + dy, mw, bh);
    ctx.globalAlpha = 0.6 * env;
    ctx.fillStyle = CYAN;
    ctx.fillRect(mx + dx2, by, mw, bh);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only, the glitch fires on its own schedule.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
