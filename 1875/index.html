<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Pedalboard Mass</title>
<style>
  html, body { margin: 0; padding: 0; background: #070708; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded rng (deterministic, no Math.random in frame one) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- palette: pedal-LED hues ----------
  var LED = [
    '#4da3ff', // blue, Chase Bliss
    '#ff5252', // red
    '#4dff88', // green
    '#ffb84d', // amber
    '#f2f2f2'  // white
  ];
  var BG = '#070708';
  var CHALK = 'rgba(235, 235, 230, 0.09)';

  // ---------- sizing: visualViewport, phone detection ----------
  var W = 0, H = 0, DPR = 1;
  var rect = { x: 0, y: 0, s: 0 }; // play field: full-bleed on phones, square on desktop
  var isPhone = false;
  var reduced = false;

  function measure() {
    var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    W = vw; H = vh;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    var sw = (window.screen && window.screen.width) || vw;
    var sh = (window.screen && window.screen.height) || vh;
    var minDim = Math.min(sw, sh);
    isPhone = minDim < 700 || H > W * 1.15;
    if (isPhone) {
      rect = { x: 0, y: 0, w: W, h: H, s: Math.min(W, H) };
    } else {
      var s = Math.min(W, H);
      rect = { x: (W - s) / 2, y: (H - s) / 2, w: s, h: s, s: s };
    }
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  // ---------- rings ----------
  // A ring: { fx, fy (fractions of the play field), r (target radius px, fraction of s),
  //   birth (seconds, negative = already aged at load), period, phase, color, voice }
  var MAX_ACTIVE = 16;
  var DECAY_S = 180;      // about 3 minutes to a chalk outline
  var EXPAND_S = 8;       // seconds to grow from small to fixed radius
  var rings = [];

  function addRing(fx, fy, rFrac, birth, colorIdx, period, phase) {
    var ring = {
      fx: fx, fy: fy, rFrac: rFrac, birth: birth,
      color: LED[colorIdx % LED.length],
      colorIdx: colorIdx,
      period: period, phase: phase,
      voice: null
    };
    rings.push(ring);
    // Cap active voices: the oldest rings fade first, becoming chalk.
    if (rings.length > MAX_ACTIVE) {
      var oldest = rings[0];
      oldest.birth = Math.min(oldest.birth, -DECAY_S); // force to chalk now
      rings.shift();
      rings.push(oldest); // chalk outline stays, at the back of the list
      // keep chalk rings from accumulating without bound
      var chalk = 0;
      for (var i = 0; i < rings.length; i++) if (rings[i].birth <= -DECAY_S) chalk++;
      if (chalk > 24) rings.splice(0, chalk - 24);
    }
    return ring;
  }

  // Seeded first frame: the looper was played before the viewer arrived.
  function seedRings() {
    var rng = mulberry32(1875);
    var ages = [18, 92, 168]; // young, mid, near-chalk
    for (var i = 0; i < 3; i++) {
      var fx = 0.22 + 0.56 * rng();
      var fy = 0.24 + 0.52 * rng();
      var rFrac = 0.10 + 0.07 * rng();
      var colorIdx = Math.floor(rng() * LED.length);
      var period = 2.6 + 1.4 * rng();
      var phase = rng() * Math.PI * 2;
      addRing(fx, fy, rFrac, -ages[i], colorIdx, period, phase);
    }
  }

  function ringState(ring, t) {
    var age = t - ring.birth;
    var expand = Math.min(age / EXPAND_S, 1);
    var ease = 1 - (1 - expand) * (1 - expand);
    var radius = ring.rFrac * rect.s * (0.12 + 0.88 * ease);
    var bright;
    if (age >= DECAY_S) {
      bright = 0; // chalk only
    } else {
      bright = 1 - 0.85 * (age / DECAY_S);
      var pulse = 0.86 + 0.14 * Math.sin((2 * Math.PI * t) / ring.period + ring.phase);
      bright *= pulse;
    }
    return { age: age, radius: radius, bright: bright };
  }

  function hexA(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + a.toFixed(3) + ')';
  }

  // ---------- drawing ----------
  function draw(t) {
    measure();
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // stage floor
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    var sheen = ctx.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.42, Math.max(W, H) * 0.75);
    sheen.addColorStop(0, 'rgba(255, 255, 255, 0.035)');
    sheen.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = sheen;
    ctx.fillRect(0, 0, W, H);

    // rings, oldest first so young rings glow over the sediment
    for (var i = 0; i < rings.length; i++) {
      var ring = rings[i];
      var st = ringState(ring, t);
      var cx = rect.x + ring.fx * rect.w;
      var cy = rect.y + ring.fy * rect.h;
      if (st.bright <= 0) {
        // chalk outline: faint, never quite disappears
        ctx.strokeStyle = CHALK;
        ctx.lineWidth = Math.max(1, rect.s * 0.0016);
        ctx.beginPath();
        ctx.arc(cx, cy, st.radius, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        var lw = Math.max(1.5, rect.s * 0.006);
        ctx.strokeStyle = hexA(ring.color, Math.min(1, 0.25 + 0.65 * st.bright));
        ctx.lineWidth = lw;
        ctx.beginPath();
        ctx.arc(cx, cy, st.radius, 0, Math.PI * 2);
        ctx.stroke();
        // soft inner glow while young
        if (st.bright > 0.55) {
          ctx.strokeStyle = hexA(ring.color, 0.10 * st.bright);
          ctx.lineWidth = lw * 3.2;
          ctx.beginPath();
          ctx.arc(cx, cy, st.radius, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }

    drawPlates();
  }

  function drawPlates() {
    var pad = isPhone ? 18 : 28;
    var titleSize = Math.max(17, Math.min(26, rect.s * 0.034));
    var dateSize = Math.max(12, Math.min(16, rect.s * 0.02));
    var hintSize = Math.max(12, Math.min(15, rect.s * 0.019));

    ctx.textBaseline = 'alphabetic';

    // title plate, top left
    ctx.font = '600 ' + titleSize + 'px Helvetica, Arial, sans-serif';
    var title = 'The Pedalboard Mass';
    var tw = ctx.measureText(title).width;
    var titleY = pad + titleSize * 0.85;
    var dateY = titleY + dateSize * 1.6;
    var plateTop = pad - 8;
    var plateBottom = dateY + 8;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
    roundRect(pad - 10, plateTop, tw + 20, plateBottom - plateTop, 6);
    ctx.fill();
    ctx.fillStyle = '#f0f0ea';
    ctx.textAlign = 'left';
    ctx.fillText(title, pad, titleY);

    ctx.font = '400 ' + dateSize + 'px Helvetica, Arial, sans-serif';
    ctx.fillStyle = 'rgba(240, 240, 234, 0.72)';
    ctx.fillText('2007 \u00b7 03 \u00b7 01', pad, dateY);

    // hint plate, bottom center
    ctx.font = '400 ' + hintSize + 'px Helvetica, Arial, sans-serif';
    var hint = 'Tap to lay a loop.';
    var hw = ctx.measureText(hint).width;
    var hx = (W - hw) / 2;
    var hy = H - pad - 4;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
    roundRect(hx - 10, hy - hintSize - 6, hw + 20, hintSize + 14, 6);
    ctx.fill();
    ctx.fillStyle = 'rgba(240, 240, 234, 0.85)';
    ctx.textAlign = 'left';
    ctx.fillText(hint, hx, hy);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------- audio: Karplus-Strong plucks, lazily inside the first tap ----------
  var audioCtx = null;
  var masterGain = null;

  function ensureAudio() {
    if (audioCtx) return true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (typeof AC === 'undefined' || !AC) return false;
    try {
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.5;
      masterGain.connect(audioCtx.destination);
      return true;
    } catch (e) {
      audioCtx = null;
      return false;
    }
  }

  function ksBuffer(freq, seconds, seed) {
    var sr = audioCtx.sampleRate;
    var n = Math.floor(sr * seconds);
    var buf = audioCtx.createBuffer(1, n, sr);
    var out = buf.getChannelData(0);
    var period = Math.max(2, Math.round(sr / freq));
    var rng = mulberry32(seed);
    var delay = new Float32Array(period);
    for (var i = 0; i < period; i++) delay[i] = rng() * 2 - 1;
    var idx = 0;
    for (var j = 0; j < n; j++) {
      var cur = delay[idx];
      var nxt = delay[(idx + 1) % period];
      var v = 0.996 * 0.5 * (cur + nxt);
      delay[idx] = v;
      out[j] = cur;
      idx = (idx + 1) % period;
    }
    return buf;
  }

  function playLoopVoice(colorIdx, seed) {
    if (!ensureAudio()) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    // short plucked motif: three notes from a minor pentatonic, staggered
    var scale = [0, 3, 5, 7, 10];
    var base = 110 * Math.pow(2, (colorIdx * 2) / 12);
    var t0 = audioCtx.currentTime + 0.02;
    for (var k = 0; k < 3; k++) {
      var step = scale[(seed + k * 2) % scale.length];
      var freq = base * Math.pow(2, step / 12);
      var src = audioCtx.createBufferSource();
      src.buffer = ksBuffer(freq, 1.4, seed * 31 + k * 17 + 7);
      var g = audioCtx.createGain();
      var at = t0 + k * 0.22;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.22, at + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 1.3);
      src.connect(g);
      g.connect(masterGain);
      src.start(at);
      src.stop(at + 1.4);
    }
  }

  // ---------- interaction: tap lays a loop, drag does nothing, never clears ----------
  var tapCount = 0;

  function onTap(clientX, clientY) {
    measure();
    var fx = rect.w > 0 ? (clientX - rect.x) / rect.w : 0.5;
    var fy = rect.h > 0 ? (clientY - rect.y) / rect.h : 0.5;
    fx = Math.max(0.04, Math.min(0.96, fx));
    fy = Math.max(0.04, Math.min(0.96, fy));
    var colorIdx = tapCount % LED.length;
    var birth = reduced ? -EXPAND_S : nowSec();
    var ring = addRing(fx, fy, 0.11 + 0.05 * ((tapCount * 37 % 10) / 10), birth, colorIdx, 2.8 + (tapCount % 5) * 0.35, (tapCount * 1.7) % (Math.PI * 2));
    playLoopVoice(colorIdx, tapCount + 1);
    tapCount++;
    if (reduced) draw(0);
    return ring;
  }

  var startMs = null;
  function nowSec() {
    if (startMs === null) return 0;
    return (performance.now() - startMs) / 1000;
  }

  // ---------- animation loop (fixed phase first frame) ----------
  function frame(ts) {
    if (startMs === null) startMs = ts;
    var t = (ts - startMs) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function' && !reduced) {
      requestAnimationFrame(frame);
    }
  }

  // ---------- init ----------
  seedRings();
  measure();
  if (typeof window.matchMedia === 'function') {
    try {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (e) { reduced = false; }
  }
  draw(0); // deterministic first frame, synchronous

  if (typeof requestAnimationFrame === 'function' && !reduced) {
    requestAnimationFrame(frame);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { draw(reduced ? 0 : nowSec()); });
    if (window.visualViewport && typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { draw(reduced ? 0 : nowSec()); });
    }
  }
  canvas.addEventListener('pointerdown', function (ev) {
    onTap(ev.clientX, ev.clientY);
  });
  // touch fallback for older browsers
  canvas.addEventListener('touchstart', function (ev) {
    if (ev.touches && ev.touches.length > 0) {
      onTap(ev.touches[0].clientX, ev.touches[0].clientY);
    }
  });
})();
</script>
</body>
</html>
