<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Hidden Beauty of Long Multiplication</title>
<style>
  html, body { margin: 0; padding: 0; background: #F7F3E8; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var PAPER = '#F7F3E8';
  var INK = '#1A1A1A';      // black digits, rules
  var RED = '#C0392B';      // multiplier
  var BLUE = '#2471A3';     // partial products
  var VIOLET = '#7D3C98';   // carry arcs and carried digits
  var BOX = '#B9770E';      // the boxed product

  var LOOP = 90;            // seconds per full loop
  var WORK = 78;            // seconds of drawing inside the loop
  var HOLD_END = 86;        // complete and held until here, then a 4 s fade
  var OFFSET = 33;          // frame one opens mid-working, about 40 percent in

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var viewW = 300, viewH = 300, dpr = 1, isPhone = false;

  function measure() {
    var w = 0, h = 0;
    if (typeof window !== 'undefined') {
      if (window.visualViewport && window.visualViewport.width) {
        w = window.visualViewport.width; h = window.visualViewport.height;
      } else if (window.innerWidth) {
        w = window.innerWidth; h = window.innerHeight;
      }
    }
    if (!w) { w = 300; h = 300; }
    viewW = w; viewH = h;
    dpr = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (dpr < 1) dpr = 1; if (dpr > 3) dpr = 3;
    var sw = 0, sh = 0;
    if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width || 0; sh = window.screen.height || 0; }
    isPhone = (Math.min(sw, sh) > 0 && Math.min(sw, sh) < 700) || (viewH > viewW * 1.15);
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
  }
  measure();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', measure);
    if (window.addEventListener) window.addEventListener('resize', measure);
  }

  // Seeded RNG (mulberry32).
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Clock: elapsed seconds since load. Frame one is drawn at t = 0 synchronously.
  function rawNow() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return 0;
  }
  var startT = rawNow();
  function elapsed() { return Math.max(0, rawNow() - startT); }

  // ----- Hand drawn digit strokes -----
  // Control points live in a box x in [0, 0.62], y in [0, 1], y down.
  function loopPts(cx, cy, rx, ry, a0, a1, n) {
    var pts = [];
    for (var i = 0; i <= n; i++) {
      var a = a0 + (a1 - a0) * (i / n);
      pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
    }
    return pts;
  }
  function digitControls(d) {
    switch (d) {
      case 0: return [loopPts(0.31, 0.50, 0.265, 0.475, -1.35, 4.55, 16)];
      case 1: return [
        [[0.10, 0.32], [0.28, 0.13], [0.45, 0.03]],
        [[0.45, 0.03], [0.43, 0.50], [0.41, 0.97]],
        [[0.17, 0.97], [0.40, 0.99], [0.60, 0.97]]
      ];
      case 2: return [[[0.11, 0.30], [0.16, 0.10], [0.34, 0.02], [0.50, 0.08], [0.55, 0.24], [0.47, 0.42], [0.30, 0.62], [0.13, 0.90], [0.30, 0.95], [0.57, 0.94]]];
      case 3: return [[[0.11, 0.12], [0.33, 0.03], [0.50, 0.09], [0.52, 0.26], [0.42, 0.40], [0.29, 0.46], [0.42, 0.52], [0.54, 0.66], [0.53, 0.85], [0.36, 0.98], [0.13, 0.93]]];
      case 4: return [
        [[0.47, 0.02], [0.45, 0.50], [0.44, 0.98]],
        [[0.47, 0.03], [0.28, 0.34], [0.08, 0.67]],
        [[0.02, 0.67], [0.32, 0.68], [0.61, 0.67]]
      ];
      case 5: return [
        [[0.55, 0.05], [0.36, 0.04], [0.20, 0.05], [0.17, 0.24], [0.16, 0.41]],
        [[0.16, 0.41], [0.30, 0.35], [0.47, 0.40], [0.55, 0.58], [0.52, 0.78], [0.38, 0.94], [0.20, 0.98], [0.08, 0.90]]
      ];
      case 6: return [[[0.50, 0.05], [0.32, 0.06], [0.18, 0.22], [0.10, 0.48], [0.09, 0.68], [0.16, 0.88], [0.31, 0.97], [0.47, 0.91], [0.54, 0.72], [0.47, 0.56], [0.30, 0.52], [0.15, 0.62]]];
      case 7: return [
        [[0.07, 0.07], [0.32, 0.05], [0.57, 0.06]],
        [[0.56, 0.06], [0.42, 0.45], [0.25, 0.98]]
      ];
      case 8: return [
        loopPts(0.30, 0.255, 0.20, 0.24, -1.35, 4.55, 13),
        loopPts(0.30, 0.735, 0.26, 0.255, -1.35, 4.55, 15)
      ];
      case 9: return [
        loopPts(0.30, 0.27, 0.25, 0.255, 1.35, 7.45, 15),
        [[0.55, 0.30], [0.52, 0.55], [0.43, 0.80], [0.28, 0.96], [0.12, 0.93]]
      ];
    }
    return [];
  }
  // Catmull-Rom smoothing of an open control polyline.
  function smooth(pts, sub) {
    if (pts.length < 3) return pts.slice();
    var out = [pts[0]];
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
      for (var j = 1; j <= sub; j++) {
        var u = j / sub, u2 = u * u, u3 = u2 * u;
        out.push([
          0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3),
          0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3)
        ]);
      }
    }
    return out;
  }
  // Bake one glyph instance: smoothed strokes with seeded jitter, rotation and
  // scale baked in, plus cumulative lengths for the stroke-in reveal.
  function bakeGlyph(digit, rng) {
    var rot = (rng() - 0.5) * 0.07;
    var sc = 0.95 + rng() * 0.10;
    var cosr = Math.cos(rot), sinr = Math.sin(rot);
    var ctrls = digitControls(digit);
    var strokes = [], total = 0;
    for (var s = 0; s < ctrls.length; s++) {
      var sm = smooth(ctrls[s], 5);
      var pts = [];
      for (var i = 0; i < sm.length; i++) {
        var x = (sm[i][0] - 0.31) * sc, y = (sm[i][1] - 0.5) * sc;
        var rx = x * cosr - y * sinr + 0.31, ry = x * sinr + y * cosr + 0.5;
        pts.push({
          x: rx + (rng() - 0.5) * 0.026,
          y: ry + (rng() - 0.5) * 0.026
        });
      }
      var cum = [0];
      for (var k = 1; k < pts.length; k++) {
        var dx = pts[k].x - pts[k - 1].x, dy = pts[k].y - pts[k - 1].y;
        cum.push(cum[k - 1] + Math.sqrt(dx * dx + dy * dy));
      }
      total += cum[cum.length - 1];
      strokes.push({ pts: pts, cum: cum, len: cum[cum.length - 1] });
    }
    return { strokes: strokes, total: total };
  }
  // Wobbly horizontal rule, normalized: u along the span, v in digit-height units.
  function bakeRule(rng) {
    var pts = [], n = 14;
    for (var i = 0; i <= n; i++) pts.push({ u: i / n, v: (rng() - 0.5) * 0.045 });
    return pts;
  }
  // Wobbly rectangle loop (the box), points in product-row local units.
  function bakeBoxLoop(rng, x0, y0, x1, y1) {
    var pts = [];
    function side(ax, ay, bx, by) {
      var n = 8;
      for (var i = 0; i < n; i++) {
        var u = i / n;
        pts.push({ x: ax + (bx - ax) * u + (rng() - 0.5) * 0.05, y: ay + (by - ay) * u + (rng() - 0.5) * 0.05 });
      }
    }
    side(x0, y0, x1, y0); side(x1, y0, x1, y1); side(x1, y1, x0, y1); side(x0, y1, x0, y0);
    pts.push({ x: pts[0].x, y: pts[0].y });
    var cum = [0];
    for (var k = 1; k < pts.length; k++) {
      var dx = pts[k].x - pts[k - 1].x, dy = pts[k].y - pts[k - 1].y;
      cum.push(cum[k - 1] + Math.sqrt(dx * dx + dy * dy));
    }
    return { pts: pts, cum: cum, len: cum[cum.length - 1] };
  }

  // ----- The working: honest arithmetic, seeded per generation -----
  function buildWorking(g) {
    var rng = mulberry32(93000 + g * 7919);
    var aLen = 5 + Math.floor(rng() * 2);
    var bLen = 3 + Math.floor(rng() * 2);
    var A = 0, B = 0, i, d;
    for (i = 0; i < aLen; i++) { d = (i === 0) ? 1 + Math.floor(rng() * 9) : Math.floor(rng() * 10); A = A * 10 + d; }
    for (i = 0; i < bLen; i++) { d = 1 + Math.floor(rng() * 9); B = B * 10 + d; }
    var aStr = String(A), bStr = String(B);
    var product = A * B, pStr = String(product);
    var N = pStr.length;
    // Partial products, units multiplier digit first (top row of the working).
    var partials = [];
    for (i = bLen - 1; i >= 0; i--) partials.push(A * Number(bStr[i]));
    // Column addition of the partials gives the product digits and the carries.
    var carryOut = [], carryIn = [0];
    var c = 0;
    for (var j = 0; j < N; j++) {
      var sum = c;
      for (var r = 0; r < partials.length; r++) {
        var ps = String(partials[r]), k = j - r;
        if (k >= 0 && k < ps.length) sum += Number(ps[ps.length - 1 - k]);
      }
      c = Math.floor(sum / 10);
      carryOut.push(c);
      if (j + 1 < N) carryIn.push(c);
    }

    var events = [];
    function glyphEvent(kind, digit, col, row, color, rowIdx) {
      var gph = bakeGlyph(digit, rng);
      events.push({
        kind: kind, glyph: gph, col: col, row: row, color: color,
        dx: (rng() - 0.5) * 0.05, dy: (rng() - 0.5) * 0.04,
        raw: 1.0, rowIdx: rowIdx, total: gph.total
      });
    }
    // Factors, written left to right.
    for (i = 0; i < aLen; i++) glyphEvent('factorA', Number(aStr[i]), aLen - 1 - i, 0, INK, 0);
    for (i = 0; i < bLen; i++) glyphEvent('factorB', Number(bStr[i]), bLen - 1 - i, 1, RED, 1);
    events.push({ kind: 'rule1', pts: bakeRule(rng), raw: 1.5, rowIdx: 1 });
    // Partial products, each computed and written right to left.
    for (var r2 = 0; r2 < partials.length; r2++) {
      var ps2 = String(partials[r2]);
      for (var k2 = ps2.length - 1; k2 >= 0; k2--) {
        glyphEvent('partial', Number(ps2[k2]), r2 + (ps2.length - 1 - k2), 2 + r2, BLUE, 2 + r2);
      }
    }
    events.push({ kind: 'rule2', pts: bakeRule(rng), raw: 1.5, rowIdx: 2 + partials.length - 1 });
    // The addition: carry arc first where one is owed, then the product digit.
    var prodRow = 2 + partials.length;
    for (var j2 = 0; j2 < N; j2++) {
      if (j2 > 0 && carryIn[j2] > 0) {
        var cg = bakeGlyph(carryIn[j2], rng);
        events.push({ kind: 'carry', glyph: cg, col: j2, color: VIOLET, raw: 0.85, rowIdx: prodRow, total: cg.total + 1.6 });
      }
      glyphEvent('product', Number(pStr[N - 1 - j2]), j2, prodRow, INK, prodRow);
    }
    // The box, drawn around the product as two wobbly loops.
    var bOuter = bakeBoxLoop(rng, -0.30, -0.22, N * 0.74 + 0.30, 1.24);
    var bInner = bakeBoxLoop(rng, -0.20, -0.13, N * 0.74 + 0.20, 1.15);
    events.push({ kind: 'box', loops: [bOuter, bInner], raw: 2.4, rowIdx: prodRow, total: bOuter.len + bInner.len });

    // Schedule: scale raw durations so the whole working takes WORK seconds.
    var rawTotal = 0;
    for (i = 0; i < events.length; i++) rawTotal += events[i].raw + 0.14;
    var scale = WORK / rawTotal, t = 0;
    for (i = 0; i < events.length; i++) {
      events[i].start = t;
      events[i].dur = events[i].raw * scale;
      t += events[i].dur + 0.14 * scale;
    }

    // Per-row skew, seeded: a small rotation and shift, never grid perfect.
    var rowSkew = [];
    var nRows = prodRow + 1;
    for (i = 0; i < nRows; i++) rowSkew.push({ rot: (rng() - 0.5) * 0.016, dx: (rng() - 0.5) * 0.06 });

    return {
      A: A, B: B, aStr: aStr, bStr: bStr, product: product, pStr: pStr,
      N: N, partials: partials, events: events, rowSkew: rowSkew, prodRow: prodRow
    };
  }

  // ----- Recorded state -----
  var gen = 0;
  var genStartT = 0;               // piece time when the current generation began
  var work = buildWorking(0);
  var pendingTap = null;           // {t}
  var carryModes = [];             // [{t0}] double tap windows
  var stamps = [];                 // smudge stamps {x, y, dx, dy, t}
  var pointer = null;              // {x, y, tDown, moved, lastX, lastY, lastStampT}

  function loopT(t) {
    var lt = (t - genStartT + OFFSET) % LOOP;
    return lt < 0 ? lt + LOOP : lt;
  }
  function carryFactor(t) {
    var f = 0;
    for (var i = 0; i < carryModes.length; i++) {
      var a = (t - carryModes[i].t0) / 0.35;
      var b = (carryModes[i].t0 + 6 - t) / 0.5;
      var v = Math.min(1, Math.max(0, Math.min(a, b)));
      if (v > f) f = v;
    }
    return f;
  }
  function smudgeAt(x, y, t, s) {
    var ox = 0, oy = 0, R = 2.4 * s;
    for (var i = 0; i < stamps.length; i++) {
      var st = stamps[i], age = t - st.t;
      if (age < 0 || age > 7) continue;
      var dx = x - st.x, dy = y - st.y, d2 = dx * dx + dy * dy;
      var w = Math.exp(-age / 2.4) * Math.exp(-d2 / (R * R));
      ox += st.dx * w; oy += st.dy * w;
    }
    return { x: ox, y: oy };
  }

  // ----- Audio: lazy, gesture gated, silent in QA -----
  var actx = null, noiseBuf = null;
  function ensureAudio() {
    if (actx) { if (actx.resume) actx.resume(); return; }
    if (typeof AudioContext === 'undefined' && typeof window !== 'undefined' && typeof window.webkitAudioContext === 'undefined') return;
    try {
      var AC = (typeof AudioContext !== 'undefined') ? AudioContext : window.webkitAudioContext;
      actx = new AC();
      var len = Math.floor(actx.sampleRate * 0.5);
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      var ch = noiseBuf.getChannelData(0);
      var r = mulberry32(4242);
      for (var i = 0; i < len; i++) ch[i] = r() * 2 - 1;
    } catch (e) { actx = null; }
  }
  function tick(rowIdx, soft) {
    if (!actx || !noiseBuf) return;
    try {
      var t0 = actx.currentTime;
      var src = actx.createBufferSource(); src.buffer = noiseBuf;
      src.playbackRate.value = 0.9 + Math.random() * 0.2;
      var bp = actx.createBiquadFilter(); bp.type = 'bandpass';
      bp.frequency.value = soft ? 900 : 1300 + rowIdx * 130;
      bp.Q.value = 1.1;
      var gn = actx.createGain();
      gn.gain.setValueAtTime(soft ? 0.05 : 0.10, t0);
      gn.gain.exponentialRampToValueAtTime(0.001, t0 + 0.07);
      src.connect(bp); bp.connect(gn); gn.connect(actx.destination);
      src.start(t0); src.stop(t0 + 0.09);
    } catch (e) { /* audio is decoration; the drawing never depends on it */ }
  }
  function thump() {
    if (!actx) return;
    try {
      var t0 = actx.currentTime;
      var o = actx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(150, t0);
      o.frequency.exponentialRampToValueAtTime(55, t0 + 0.16);
      var gn = actx.createGain();
      gn.gain.setValueAtTime(0.16, t0);
      gn.gain.exponentialRampToValueAtTime(0.001, t0 + 0.2);
      o.connect(gn); gn.connect(actx.destination);
      o.start(t0); o.stop(t0 + 0.22);
    } catch (e) { /* ignore */ }
  }
  var audioCursor = 0; // last loop time for which event sounds were fired
  function fireAudio(lt) {
    if (!actx) { audioCursor = lt; return; }
    var evs = work.events, i, e;
    function fireRange(a, b) {
      for (var k = 0; k < evs.length; k++) {
        e = evs[k];
        if (e.start > a && e.start <= b) {
          if (e.kind === 'box') thump();
          else tick(e.rowIdx || 0, e.kind === 'carry');
        }
      }
    }
    if (lt >= audioCursor) fireRange(audioCursor, lt);
    else { fireRange(audioCursor, WORK); fireRange(0, lt); }
    audioCursor = lt;
  }

  // ----- Layout (a function of size and the current working) -----
  function layout() {
    var N = work.N, bRows = work.partials.length;
    var sf = 1.24;                                  // factor digit height, in s units
    var partialsTop = 3.62;
    var lastPartialBottom = partialsTop + (bRows - 1) * 1.42 + 1.0;
    var rule2Y = lastPartialBottom + 0.30;
    var prodTop = rule2Y + 0.98;
    var totalUnits = prodTop + 1.0 + 0.40;          // product plus box padding
    var availW = viewW * (isPhone ? 0.94 : 0.90);
    var availH = viewH * 0.92;
    var s = Math.min(availW / (N * 0.74 + 0.7), availH / (totalUnits + 0.4));
    var totalH = totalUnits * s;
    var y0 = Math.max(viewH * 0.035, (viewH - totalH) / 2);
    var R = viewW / 2 + (N * 0.74 * s) / 2;         // right edge of the fine grid
    return {
      s: s, sf: sf * s, adv: 0.74 * s, advF: 0.74 * sf * s,
      y0: y0, R: R,
      yA: y0, yB: y0 + 1.60 * s,
      rule1Y: y0 + 3.02 * s,
      partialTop: function (r) { return y0 + (partialsTop + r * 1.42) * s; },
      rule2Y: y0 + rule2Y * s,
      prodTop: y0 + prodTop * s,
      colX: function (j) { return R - (j + 0.5) * 0.74 * s; }
    };
  }

  // ----- Drawing helpers -----
  // Stroke a baked glyph at pixel anchor (ax, ay) with pixel height ph,
  // revealing the first frac of its total path length.
  function strokeGlyph(gph, ax, ay, ph, frac) {
    if (frac <= 0) return;
    var target = frac * gph.total, walked = 0;
    ctx.beginPath();
    for (var s = 0; s < gph.strokes.length; s++) {
      var st = gph.strokes[s];
      if (walked >= target) break;
      var upto = Math.min(st.len, target - walked);
      var pts = st.pts;
      ctx.moveTo(ax + pts[0].x * ph, ay + pts[0].y * ph);
      for (var i = 1; i < pts.length; i++) {
        if (st.cum[i] <= upto) {
          ctx.lineTo(ax + pts[i].x * ph, ay + pts[i].y * ph);
        } else {
          var segLen = st.cum[i] - st.cum[i - 1];
          var u = segLen > 0 ? (upto - st.cum[i - 1]) / segLen : 0;
          ctx.lineTo(ax + (pts[i - 1].x + (pts[i].x - pts[i - 1].x) * u) * ph,
                     ay + (pts[i - 1].y + (pts[i].y - pts[i - 1].y) * u) * ph);
          break;
        }
      }
      walked += st.len;
    }
    ctx.stroke();
  }
  function strokePolyline(pts, frac) {
    if (frac <= 0 || pts.length < 2) return;
    var total = 0, cum = [0], i;
    for (i = 1; i < pts.length; i++) {
      var dx = pts[i].x - pts[i - 1].x, dy = pts[i].y - pts[i - 1].y;
      total += Math.sqrt(dx * dx + dy * dy); cum.push(total);
    }
    var target = frac * total;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (i = 1; i < pts.length; i++) {
      if (cum[i] <= target) ctx.lineTo(pts[i].x, pts[i].y);
      else {
        var seg = cum[i] - cum[i - 1], u = seg > 0 ? (target - cum[i - 1]) / seg : 0;
        ctx.lineTo(pts[i - 1].x + (pts[i].x - pts[i - 1].x) * u, pts[i - 1].y + (pts[i].y - pts[i - 1].y) * u);
        break;
      }
    }
    ctx.stroke();
  }
  function eventFrac(e, lt) {
    if (lt <= e.start) return 0;
    if (lt >= e.start + e.dur) return 1;
    return (lt - e.start) / e.dur;
  }

  function draw(t) {
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, viewW, viewH);

    var lt = loopT(t);
    var fade = 1;
    if (lt > HOLD_END) fade = 1 - (lt - HOLD_END) / (LOOP - HOLD_END);
    var cf = carryFactor(t);
    var alphaPlain = fade * (1 - 0.95 * cf);
    var alphaCarry = fade;

    var L = layout(), s = L.s;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    var evs = work.events;
    for (var i = 0; i < evs.length; i++) {
      var e = evs[i], f = eventFrac(e, lt);
      if (f <= 0) continue;
      var isCarry = (e.kind === 'carry');
      ctx.globalAlpha = isCarry ? alphaCarry : alphaPlain;
      if (ctx.globalAlpha <= 0.004) continue;

      if (e.kind === 'rule1' || e.kind === 'rule2') {
        var isR1 = e.kind === 'rule1';
        var x0, x1, y = isR1 ? L.rule1Y : L.rule2Y;
        if (isR1) {
          var aLeft = L.R - work.aStr.length * L.advF;
          x0 = aLeft - 0.20 * L.advF; x1 = L.R + 0.14 * L.advF;
        } else { x0 = L.R - work.N * L.adv; x1 = L.R + 0.14 * L.adv; }
        var rp = [];
        for (var q = 0; q < e.pts.length; q++) rp.push({ x: x0 + e.pts[q].u * (x1 - x0), y: y + e.pts[q].v * s });
        var sm = smudgeAt((x0 + x1) / 2, y, t, s);
        ctx.save();
        ctx.translate(sm.x, sm.y);
        ctx.strokeStyle = INK;
        ctx.lineWidth = Math.max(1.1, 0.045 * s);
        strokePolyline(rp, f);
        ctx.restore();
      } else if (e.kind === 'carry') {
        // Arc from above column col-1 to above column col, then the tiny digit.
        var xA = L.colX(e.col - 1), xB = L.colX(e.col);
        var yBase = L.prodTop - 0.14 * s, yPeak = L.prodTop - 0.80 * s;
        var arcPts = [];
        for (var a2 = 0; a2 <= 14; a2++) {
          var u = a2 / 14;
          arcPts.push({
            x: (1 - u) * (1 - u) * xA + 2 * (1 - u) * u * ((xA + xB) / 2) + u * u * xB,
            y: (1 - u) * (1 - u) * yBase + 2 * (1 - u) * u * yPeak + u * u * yBase
          });
        }
        var smc = smudgeAt((xA + xB) / 2, yPeak, t, s);
        ctx.save();
        ctx.translate(smc.x, smc.y);
        ctx.strokeStyle = VIOLET;
        ctx.lineWidth = Math.max(1.1, 0.05 * s);
        // The event path is the arc (budgeted 1.6 units) then the digit strokes.
        var arcLen = 1.6, target = f * e.total;
        strokePolyline(arcPts, Math.min(1, target / arcLen));
        if (target > arcLen) {
          ctx.lineWidth = Math.max(1, 0.075 * 0.40 * s);
          var cs = 0.40 * s;
          strokeGlyph(e.glyph, xB - 0.31 * cs, L.prodTop - 0.56 * s, cs, (target - arcLen) / e.glyph.total);
        }
        ctx.restore();
      } else if (e.kind === 'box') {
        var bx0 = L.R - work.N * L.adv, by0 = L.prodTop;
        var smb = smudgeAt(bx0 + (work.N * L.adv) / 2, by0 + s / 2, t, s);
        ctx.save();
        ctx.translate(smb.x, smb.y);
        ctx.strokeStyle = BOX;
        ctx.lineWidth = Math.max(1.4, 0.10 * s);
        var walked = 0;
        for (var lp = 0; lp < e.loops.length; lp++) {
          var loop = e.loops[lp];
          var lf = Math.max(0, Math.min(1, (f * e.total - walked) / loop.len));
          if (lf > 0) {
            var bp = [];
            for (var b2 = 0; b2 < loop.pts.length; b2++) bp.push({ x: bx0 + loop.pts[b2].x * s, y: by0 + loop.pts[b2].y * s });
            strokePolyline(bp, lf);
          }
          walked += loop.len;
        }
        ctx.restore();
      } else {
        // A digit glyph in a row.
        var isFactor = (e.kind === 'factorA' || e.kind === 'factorB');
        var ph = isFactor ? L.sf : s;
        var adv = isFactor ? L.advF : L.adv;
        var rowTop = e.kind === 'factorA' ? L.yA
          : e.kind === 'factorB' ? L.yB
          : e.kind === 'partial' ? L.partialTop(e.row - 2)
          : L.prodTop;
        var cxp = L.R - (e.col + 0.5) * adv;
        var cyp = rowTop + ph / 2;
        var sk = work.rowSkew[e.row] || { rot: 0, dx: 0 };
        var smg = smudgeAt(cxp, cyp, t, s);
        ctx.save();
        ctx.translate(L.R, cyp);
        ctx.rotate(sk.rot);
        ctx.translate(-L.R, -cyp);
        ctx.translate(smg.x + sk.dx * s, smg.y);
        ctx.strokeStyle = e.color;
        ctx.lineWidth = Math.max(1.1, 0.078 * ph);
        strokeGlyph(e.glyph, cxp - 0.31 * ph + e.dx * s, rowTop + e.dy * s, ph, f);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
  }

  // ----- Interaction -----
  function pieceTime() { return elapsed(); }
  function onDown(x, y) {
    ensureAudio();
    pointer = { x: x, y: y, tDown: pieceTime(), moved: 0, lx: x, ly: y };
  }
  function onMove(x, y) {
    if (!pointer) return;
    var t = pieceTime();
    var dx = x - pointer.lx, dy = y - pointer.ly;
    var step = Math.sqrt(dx * dx + dy * dy);
    pointer.moved += step;
    if (step > 20) {
      var mag = Math.min(26, step) * 0.55;
      stamps.push({ x: x, y: y, dx: (dx / (step || 1)) * mag, dy: (dy / (step || 1)) * mag, t: t });
      if (stamps.length > 120) stamps.shift();
    }
    pointer.lx = x; pointer.ly = y;
  }
  function onUp() {
    if (!pointer) return;
    var t = pieceTime();
    var wasDrag = pointer.moved > 12;
    pointer = null;
    if (wasDrag) return;
    if (pendingTap && t - pendingTap.t < 0.38) {
      pendingTap = null;
      carryModes.push({ t0: t });
      if (carryModes.length > 3) carryModes.shift();
    } else {
      pendingTap = { t: t };
    }
  }
  function attach(el, down, move, up) {
    if (!el || !el.addEventListener) return;
    el.addEventListener('pointerdown', function (ev) { down(ev.clientX, ev.clientY); });
    el.addEventListener('pointermove', function (ev) { move(ev.clientX, ev.clientY); });
    el.addEventListener('pointerup', function () { up(); });
    el.addEventListener('pointercancel', function () { pointer = null; });
  }
  attach(canvas, onDown, onMove, onUp);

  // Frame one: synchronous, t = 0, deterministic.
  draw(0);

  function frame() {
    var t = elapsed();
    if (pendingTap && t - pendingTap.t > 0.38) {
      pendingTap = null;
      gen++;
      work = buildWorking(gen);
      genStartT = t;
      audioCursor = loopT(t);
    }
    var lt = loopT(t);
    fireAudio(lt);
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
