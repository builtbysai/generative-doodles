<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turbulence Disc</title>
<style>
html, body { margin: 0; padding: 0; background: #0d0d0d; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = [13, 13, 13];
var STREAK = [242, 242, 242];
var NP = 520;
var DT = 1 / 60;
var SEED = 1555000;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Fixed field phases, drawn once from their own stream so resets stay identical.
var phRng = mulberry32(1555111);
var PH = [];
for (var pi = 0; pi < 8; pi++) PH.push(phRng() * TAU);
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastW = -1, lastH = -1;
var CX = 0, CY = 0, R = 0, isPhone = false;
var lastT = 0, simT = 0, acc = 0, inited = false;
var parts = [];
var respawnRng = null;
var drag = null;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (Math.round(a * 10000) / 10000) + ')'; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  // Assign backing size only on change: reassigning clears the canvas and
  // would erase the accumulated trails.
  if (canvas.width !== VW) canvas.width = VW;
  if (canvas.height !== VH) canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  var sw = 0, sh = 0;
  if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width; sh = window.screen.height; }
  var minScr = Math.min(sw, sh);
  isPhone = (minScr > 0 && minScr < 700) || (VH > VW * 1.15);
  CX = VW / 2; CY = VH / 2;
  R = (isPhone ? 0.46 : 0.42) * Math.min(VW, VH);
}
// Noise flow field: velocity from the gradient of a streamfunction, so the
// flow is divergence-free and particles spread evenly instead of piling
// into fixed lines. A weak uniform drift keeps direction defined where the
// gradient vanishes. Layered sines give transient swirls and shear lines;
// the field drifts slowly with piece time.
function fieldAngle(u, v, t) {
  var c1 = Math.cos(2.3 * u + 1.4 * v + 0.21 * t + PH[0]);
  var c2 = Math.cos(-1.6 * u + 2.7 * v - 0.13 * t + PH[1]);
  var c3 = Math.cos(3.8 * u - 2.9 * v + 0.07 * t + PH[2]);
  var c4 = Math.cos(-3.1 * u - 3.7 * v - 0.05 * t + PH[3]);
  var dPdu = 0.9 * 2.3 * c1 + 0.7 * -1.6 * c2 + 0.45 * 3.8 * c3 + 0.3 * -3.1 * c4;
  var dPdv = 0.9 * 1.4 * c1 + 0.7 * 2.7 * c2 + 0.45 * -2.9 * c3 + 0.3 * -3.7 * c4;
  var vx = dPdv + 0.15, vy = -dPdu + 0.1;
  return Math.atan2(vy, vx);
}
function spawnInto(p, rng) {
  var u = 0, v = 0, r = 2;
  while (r > 1) {
    u = rng() * 2 - 1; v = rng() * 2 - 1;
    r = Math.sqrt(u * u + v * v);
  }
  p.x = CX + u * R; p.y = CY + v * R;
  p.px = p.x; p.py = p.y;
  p.sp = 0.25 + rng() * 0.75;
  p.life = 4 + rng() * 10;
  p.age = 0;
}
function reset() {
  var rng = mulberry32(SEED);
  respawnRng = mulberry32(1555999);
  parts = [];
  for (var i = 0; i < NP; i++) {
    var p = {};
    spawnInto(p, rng);
    parts.push(p);
  }
  lastT = 0; simT = 0; acc = 0;
  ctx.fillStyle = rgb(GROUND);
  ctx.fillRect(0, 0, VW, VH);
  ctx.beginPath();
  ctx.moveTo(CX + R, CY);
  ctx.arc(CX, CY, R, 0, TAU);
  ctx.fillStyle = rgb(GROUND);
  ctx.fill();
  // First frame: every particle already carries a seeded streak along the
  // field direction, so the disc reads as weather from the first paint.
  ctx.lineCap = 'round';
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(CX + R, CY);
  ctx.arc(CX, CY, R, 0, TAU);
  ctx.clip();
  for (var j = 0; j < NP; j++) {
    var q = parts[j];
    var u = (q.x - CX) / R, v = (q.y - CY) / R;
    var a = fieldAngle(u, v, 0);
    var len = (0.02 + 0.07 * q.sp) * R;
    var dx = Math.cos(a) * len, dy = Math.sin(a) * len;
    ctx.strokeStyle = rgba(STREAK, 0.22 + 0.55 * q.sp);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(q.x - dx, q.y - dy);
    ctx.lineTo(q.x, q.y);
    ctx.stroke();
  }
  ctx.restore();
  drawRing();
  inited = true;
}
function drawRing() {
  // Erase the previous ring first, then redraw it faint: without the erase
  // the 0.14 stroke would accumulate one draw per step into a bright outline.
  // Both strokes are clipped to the disc so no paint lands outside the mask.
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(CX + R, CY);
  ctx.arc(CX, CY, R, 0, TAU);
  ctx.clip();
  ctx.strokeStyle = rgb(GROUND);
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(CX + R, CY);
  ctx.arc(CX, CY, R, 0, TAU);
  ctx.stroke();
  ctx.strokeStyle = rgba(STREAK, 0.14);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(CX + R, CY);
  ctx.arc(CX, CY, R, 0, TAU);
  ctx.stroke();
  ctx.restore();
}
function step() {
  simT += DT;
  var Rv = 0.45 * R;
  for (var i = 0; i < NP; i++) {
    var p = parts[i];
    p.px = p.x; p.py = p.y;
    var u = (p.x - CX) / R, v = (p.y - CY) / R;
    var a = fieldAngle(u, v, simT);
    var speed = (0.04 + 0.09 * p.sp) * R;
    var vx = Math.cos(a) * speed, vy = Math.sin(a) * speed;
    if (drag) {
      var ddx = p.x - drag.x, ddy = p.y - drag.y;
      var d = Math.sqrt(ddx * ddx + ddy * ddy);
      if (d > 1 && d < Rv) {
        var fall = 1 - d / Rv;
        var w = 2.6 * fall;
        var ts = w * d;
        vx += (-ddy / d) * ts - (ddx / d) * 0.15 * fall * speed;
        vy += (ddx / d) * ts - (ddy / d) * 0.15 * fall * speed;
      }
    }
    // Near the rim, shed outward radial motion so streaks slide along the
    // edge instead of crossing it.
    var rr = Math.sqrt(u * u + v * v);
    if (rr > 0.97) {
      var nx = u / rr, ny = v / rr;
      var vr = vx * nx + vy * ny;
      if (vr > 0) { vx -= vr * nx * 0.9; vy -= vr * ny * 0.9; }
    }
    p.x += vx * DT; p.y += vy * DT;
    p.age += DT;
    var nr = Math.sqrt((p.x - CX) * (p.x - CX) + (p.y - CY) * (p.y - CY)) / R;
    if (p.age > p.life || nr > 1.02) spawnInto(p, respawnRng);
  }
  // Fade old trails inside the mask only, then draw this step's streaks.
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(CX + R, CY);
  ctx.arc(CX, CY, R, 0, TAU);
  ctx.clip();
  ctx.fillStyle = rgba(GROUND, 0.12);
  ctx.fillRect(CX - R - 1, CY - R - 1, 2 * R + 2, 2 * R + 2);
  ctx.lineCap = 'round';
  for (var j = 0; j < NP; j++) {
    var q = parts[j];
    var qdx = q.x - q.px, qdy = q.y - q.py;
    var qlen = Math.sqrt(qdx * qdx + qdy * qdy);
    var tail = 0.12 * (0.03 + 0.09 * q.sp) * R;
    var ext = qlen > 0.001 ? tail / qlen : 0;
    ctx.strokeStyle = rgba(STREAK, 0.22 + 0.55 * q.sp);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(q.px - qdx * ext, q.py - qdy * ext);
    ctx.lineTo(q.x, q.y);
    ctx.stroke();
  }
  ctx.restore();
  drawRing();
}
function stateSnapshot() {
  var s = [];
  for (var i = 0; i < NP; i++) s.push([Math.round(parts[i].x * 100) / 100, Math.round(parts[i].y * 100) / 100]);
  var inV = 0;
  if (drag) {
    var Rv = 0.45 * R;
    for (var j = 0; j < NP; j++) {
      var dx = parts[j].x - drag.x, dy = parts[j].y - drag.y;
      if (Math.sqrt(dx * dx + dy * dy) < Rv) inV++;
    }
  }
  return { t: Math.round(simT * 1000) / 1000, n: NP, sample: s, drag: drag ? { x: drag.x, y: drag.y } : null, vortexCount: inV };
}
function publishHook() {
  if (typeof window !== 'undefined') window.__p1555 = stateSnapshot();
}
function draw(t) {
  size();
  var resized = (VW !== lastW || VH !== lastH);
  if (resized) { lastW = VW; lastH = VH; }
  if (!inited || resized || t < lastT - 0.000001) {
    reset();
    publishHook();
    lastT = t;
    return;
  }
  acc += t - lastT;
  lastT = t;
  var steps = Math.floor(acc / DT);
  if (steps > 360) { steps = 360; acc = 0; }
  acc -= steps * DT;
  for (var s = 0; s < steps; s++) step();
  publishHook();
}
function onDown(e) {
  drag = { x: e.clientX, y: e.clientY };
  publishHook();
}
function onMove(e) {
  if (!drag) return;
  drag.x = e.clientX; drag.y = e.clientY;
  publishHook();
}
function onUp(e) {
  drag = null;
  publishHook();
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
var startT = null;
function loop(ts) {
  if (startT === null) startT = ts;
  var t = (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
