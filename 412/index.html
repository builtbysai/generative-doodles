<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.412 Eat Your Colors</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FF9500; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.412 Eat Your Colors (yeti-iglesias, EXPANSION #44).
// After Yeti Iglesias's juicy mode: six giant
// vegetables scattered on a flat orange ground, each
// filled with her signature hue-shifted 2-stop
// gradient. The set gradient rule renders every
// gradient as TWO FLAT TONES WITH A HARD DIAGONAL
// EDGE inside the shape: eggplant magenta to purple,
// carrot orange to purple, garlic pink to white,
// pepper red to magenta, zucchini green to yellow,
// celery dark green to light green. No smooth
// gradients anywhere. Black contour ribs cross the
// garlic and the carrot, clipped to their shapes.
// Grain is data: exactly 250 fixed speckle dots per
// vegetable at 0.06 alpha (1500 total, asserted),
// rejection-sampled inside each vegetable's own
// outline from a fixed seed and drawn clipped to
// that shape, so the grain lives on the produce and
// nowhere else. White 4-point sparkles and dots
// season the negative space, twinkling on whole
// cycles of the loop. WATCH-ONLY, 30s seamless loop:
// the whole arrangement breathes 0.99 to 1.01 on 12s
// cycles, and one vegetable at a time wiggles 5
// degrees on a FIXED SCHEDULE, a 4s window per
// vegetable at slots 0/5/10/15/20/25s in the order
// eggplant, carrot, garlic, pepper, zucchini,
// celery. The only lettering is her hand-lettered
// "Yeti" signature bottom right, drawn as stroke
// paths, never font text. Frame one is drawn at the
// constant phase T = 11.0s (garlic at full wiggle,
// breathing mid-cycle, sparkles staggered); the
// clock is anchored there and advances in fixed
// 1/60 ticks, never from a wall clock. Flat colour
// only, one canvas, no offscreen canvas, no
// gradients, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Ground flat orange; each vegetable owns exactly its
// two tones. Sparkles and dots white; ribs and the
// signature ink black. Nothing else.
var GROUND = '#FF9500';
var INK = '#111111';
var WHITE = '#FFFFFF';
var EGG_A = '#FF2E9C', EGG_B = '#9B30FF';   // eggplant magenta / purple
var CAR_A = '#FF9500', CAR_B = '#9B30FF';   // carrot orange / purple
var GAR_A = '#FFB6D5', GAR_B = '#FFFFFF';   // garlic pink / white
var PEP_A = '#E63329', PEP_B = '#FF2E9C';   // pepper red / magenta
var ZUC_A = '#2E7D4F', ZUC_B = '#E8FF00';   // zucchini green / yellow
var CEL_A = '#1E5A2F', CEL_B = '#7AC74F';   // celery dark / light green

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 30;
if (LOOP !== 30) throw new Error('Eat Your Colors loop must be 30s');
var TICK = 1 / 60;
var TAU = Math.PI * 2;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every table below
// is baked from this at load and never changes between
// frames or renders. No Math.random anywhere.
function makeRng(seedStart) {
  var s = seedStart;
  return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}

// ---- shape helpers -------------------------------------
function cubic(p0, p1, p2, p3, n, out) {
  for (var i = 0; i < n; i++) {
    var t = i / n, u = 1 - t;
    out.push([
      u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
      u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]
    ]);
  }
}
function polarOutline(rFn, n, ySquash) {
  var pts = [];
  for (var k = 0; k < n; k++) {
    var th = k / n * TAU;
    var r = rFn(th);
    pts.push([r * Math.sin(th), -r * Math.cos(th) * (ySquash || 1)]);
  }
  return pts;
}
function tracePolys(polys) {
  ctx.beginPath();
  for (var p = 0; p < polys.length; p++) {
    var pts = polys[p];
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }
}
function inPoly(pts, x, y) {
  var inside = false;
  for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    var xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

// ---- vegetable outlines, local coords, centre 0,0 ------
// Eggplant: a fat teardrop, sampled from beziers.
var EGG_PTS = [];
cubic([0, -140], [70, -136], [118, -40], [112, 60], 14, EGG_PTS);
cubic([112, 60], [108, 132], [58, 168], [0, 168], 12, EGG_PTS);
cubic([0, 168], [-58, 168], [-108, 132], [-112, 60], 12, EGG_PTS);
cubic([-112, 60], [-118, -40], [-70, -136], [0, -140], 14, EGG_PTS);

// Carrot: a tapered, slightly bent body down local +y,
// wide top at -170, rounded tip at +176.
var CAR_PTS = [];
(function () {
  var i, t, cx, w;
  for (i = 0; i <= 16; i++) {
    t = i / 16; cx = 12 * Math.sin(t * 2.1); w = 5 + 52 * Math.pow(1 - t, 0.8);
    CAR_PTS.push([cx - w, -170 + 340 * t]);
  }
  CAR_PTS.push([12 * Math.sin(2.1), 178]);
  for (i = 16; i >= 0; i--) {
    t = i / 16; cx = 12 * Math.sin(t * 2.1); w = 5 + 52 * Math.pow(1 - t, 0.8);
    CAR_PTS.push([cx + w, -170 + 340 * t]);
  }
})();

// Garlic: a lobed bulb, five swells around a circle.
var GAR_PTS = polarOutline(function (th) { return 104 * (1 + 0.05 * Math.cos(5 * th)); }, 64, 1.02);

// Pepper: a three-lobe outline.
var PEP_PTS = polarOutline(function (th) { return 96 * (1 + 0.085 * Math.cos(3 * th)); }, 60, 1.06);

// Zucchini: a long stadium capsule along local x.
var ZUC_PTS = [];
(function () {
  var k, th;
  // right cap, top edge to bottom edge
  for (k = 0; k <= 10; k++) { th = -Math.PI / 2 + (k / 10) * Math.PI; ZUC_PTS.push([150 + 44 * Math.cos(th), 44 * Math.sin(th)]); }
  // left cap, bottom edge back to top edge
  for (k = 0; k <= 10; k++) { th = Math.PI / 2 + (k / 10) * Math.PI; ZUC_PTS.push([-150 + 44 * Math.cos(th), 44 * Math.sin(th)]); }
})();

// Celery: three stalks fanning from one base.
function stalkPts(bx, lean) {
  return [
    [bx - 17, 128], [bx + lean - 12, -100], [bx + lean - 8, -118],
    [bx + lean + 8, -118], [bx + lean + 12, -100], [bx + 17, 128]
  ];
}
var CEL_POLYS = [stalkPts(-30, -40), stalkPts(0, 0), stalkPts(30, 40)];

// ---- the six vegetables ---------------------------------
// slot is the wiggle schedule: vegetable i wiggles in
// the 4s window opening at slot*5 seconds, one full
// sine swing of 5 degrees. Draw order is back to
// front: celery, pepper, carrot, zucchini, garlic,
// eggplant (the dominant, left of centre, in front).
var VEG = [
  { name: 'celery',   polys: CEL_POLYS, x: 228,  y: 238, rot: -0.10, s: 1.05, slot: 5, a: CEL_A, b: CEL_B, nx: 0.15, ny: 1, off: -30 },
  { name: 'pepper',   polys: [PEP_PTS], x: 1058, y: 268, rot: 0.24,  s: 1.05, slot: 3, a: PEP_A, b: PEP_B, nx: -0.65, ny: -0.55, off: 5 },
  { name: 'carrot',   polys: [CAR_PTS], x: 770,  y: 302, rot: 0.65,  s: 1.00, slot: 1, a: CAR_A, b: CAR_B, nx: 0.25, ny: -0.97, off: 20 },
  { name: 'zucchini', polys: [ZUC_PTS], x: 685,  y: 688, rot: -0.17, s: 1.00, slot: 4, a: ZUC_A, b: ZUC_B, nx: -0.8, ny: -0.45, off: 10 },
  { name: 'garlic',   polys: [GAR_PTS], x: 958,  y: 622, rot: 0.14,  s: 1.00, slot: 2, a: GAR_A, b: GAR_B, nx: 0.8, ny: 0.3, off: 0 },
  { name: 'eggplant', polys: [EGG_PTS], x: 468,  y: 482, rot: -0.28, s: 1.15, slot: 0, a: EGG_A, b: EGG_B, nx: -0.7, ny: -0.7, off: -10 }
];
if (VEG.length !== 6) throw new Error('exactly 6 vegetables');

// Grain: exactly 250 speckle dots per vegetable,
// rejection-sampled inside its outline from the fixed
// seed, baked once at load. 1500 total, asserted.
var rngGrain = makeRng(412);
VEG.forEach(function (v) {
  var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  v.polys.forEach(function (pts) {
    pts.forEach(function (p) {
      if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];
      if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1];
    });
  });
  v.grain = [];
  var guard = 0;
  while (v.grain.length < 250 && guard < 20000) {
    guard++;
    var gx = minX + rngGrain() * (maxX - minX);
    var gy = minY + rngGrain() * (maxY - minY);
    var ok = false;
    for (var p = 0; p < v.polys.length; p++) if (inPoly(v.polys[p], gx, gy)) { ok = true; break; }
    if (ok) v.grain.push({ x: gx, y: gy, r: 1.1 + rngGrain() * 1.5, white: rngGrain() < 0.5 });
  }
  if (v.grain.length !== 250) throw new Error(v.name + ' grain must be exactly 250');
});
var grainTotal = 0;
VEG.forEach(function (v) { grainTotal += v.grain.length; });
if (grainTotal !== 1500) throw new Error('grain total must be 1500');

// ---- sparkles and dots in the negative space -----------
// 4-point stars twinkling on whole cycles of the 30s
// loop (k cycles each, fixed phases), plus small white
// dots placed in the gaps of the arrangement.
var SPARKLES = [
  { x: 130, y: 120, r: 26, k: 2, ph: 0.0 }, { x: 585, y: 100, r: 20, k: 1, ph: 0.7 },
  { x: 905, y: 115, r: 24, k: 3, ph: 1.4 }, { x: 1195, y: 470, r: 22, k: 1, ph: 2.1 },
  { x: 95, y: 600, r: 20, k: 2, ph: 2.8 }, { x: 355, y: 858, r: 18, k: 3, ph: 3.5 },
  { x: 1208, y: 700, r: 20, k: 2, ph: 4.2 }, { x: 640, y: 88, r: 16, k: 1, ph: 4.9 },
  { x: 88, y: 330, r: 16, k: 3, ph: 5.6 }, { x: 1150, y: 120, r: 16, k: 2, ph: 0.9 },
  { x: 470, y: 120, r: 18, k: 1, ph: 1.6 }, { x: 1252, y: 180, r: 14, k: 1, ph: 2.3 }
];
var DOTS = [
  { x: 70, y: 210, r: 4.5 }, { x: 150, y: 470, r: 3.4 }, { x: 90, y: 760, r: 4.2 },
  { x: 300, y: 120, r: 3.2 }, { x: 520, y: 60, r: 4.6 }, { x: 760, y: 80, r: 3.4 },
  { x: 1010, y: 60, r: 4.2 }, { x: 1240, y: 300, r: 3.4 }, { x: 1235, y: 760, r: 4.4 },
  { x: 560, y: 845, r: 3.6 }, { x: 420, y: 180, r: 3.0 }, { x: 830, y: 540, r: 3.4 },
  { x: 180, y: 880, r: 4.0 }, { x: 60, y: 40, r: 3.2 }
];

// ---- small drawing helpers ------------------------------
function ell(x, y, rx, ry, rot, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU);
  ctx.fill();
}
function sparklePath(cx, cy, r) {
  var ri = r * 0.22;
  ctx.beginPath();
  for (var i = 0; i < 8; i++) {
    var rad = i % 2 === 0 ? r : ri;
    var a = -Math.PI / 2 + i * Math.PI / 4;
    var X = cx + Math.cos(a) * rad, Y = cy + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  }
  ctx.closePath();
}

// Fill a vegetable two-tone: base tone everywhere,
// then the second tone over the half-plane where
// (p . n) < off, clipped to the shape. The hard edge
// between the tones is the gradient rule at work.
function twoTone(v) {
  tracePolys(v.polys);
  ctx.fillStyle = v.b;
  ctx.fill();
  var nl = Math.sqrt(v.nx * v.nx + v.ny * v.ny);
  var nx = v.nx / nl, ny = v.ny / nl;
  var cx = nx * v.off, cy = ny * v.off;
  var dx = -ny * 700, dy = nx * 700;
  ctx.save();
  tracePolys(v.polys);
  ctx.clip();
  ctx.beginPath();
  ctx.moveTo(cx + dx, cy + dy);
  ctx.lineTo(cx - dx, cy - dy);
  ctx.lineTo(cx - dx - nx * 700, cy - dy - ny * 700);
  ctx.lineTo(cx + dx - nx * 700, cy + dy - ny * 700);
  ctx.closePath();
  ctx.fillStyle = v.a;
  ctx.fill();
  ctx.restore();
}
function clippedTo(v, fn) {
  ctx.save();
  tracePolys(v.polys);
  ctx.clip();
  fn();
  ctx.restore();
}

// ---- per-vegetable dressing ------------------------------
// Ribs, caps, stems and fronds, drawn in local coords
// after the two-tone fill, still inside the vegetable
// transform. Grain goes on last, over everything.
function dress(v) {
  if (v.name === 'eggplant') {
    // Calyx: a scalloped cap in the purple tone, plus
    // a short stem. Drawn over the body's split.
    var cap = [[-64, -128], [-30, -147], [0, -138], [30, -147], [64, -128], [48, -103], [24, -116], [0, -105], [-24, -116], [-48, -103]];
    ctx.beginPath();
    ctx.moveTo(cap[0][0], cap[0][1]);
    for (var i = 1; i < cap.length; i++) ctx.lineTo(cap[i][0], cap[i][1]);
    ctx.closePath();
    ctx.fillStyle = EGG_B; ctx.fill();
    ctx.fillStyle = EGG_B;
    ctx.fillRect(-6, -172, 12, 34);
  } else if (v.name === 'carrot') {
    // Fronds at the wide top, in the purple tone.
    ell(-16, -186, 9, 26, -0.5, CAR_B);
    ell(2, -192, 9, 28, 0, CAR_B);
    ell(20, -184, 9, 24, 0.5, CAR_B);
    // Black contour ribs across the body, clipped.
    clippedTo(v, function () {
      ctx.strokeStyle = INK; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
      ctx.globalAlpha = 0.75;
      [0.26, 0.45, 0.62, 0.78].forEach(function (t) {
        var cx = 12 * Math.sin(t * 2.1), cy = -170 + 340 * t;
        var w = 5 + 52 * Math.pow(1 - t, 0.8);
        ctx.beginPath();
        ctx.moveTo(cx - w * 0.82, cy - 6);
        ctx.quadraticCurveTo(cx, cy + 7, cx + w * 0.82, cy - 6);
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
    });
  } else if (v.name === 'garlic') {
    // A pointed tip at the top, pink tone.
    ctx.beginPath();
    ctx.moveTo(-11, -100); ctx.lineTo(0, -140); ctx.lineTo(11, -100); ctx.closePath();
    ctx.fillStyle = GAR_A; ctx.fill();
    // Black contour ribs following the lobes, clipped.
    clippedTo(v, function () {
      ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.globalAlpha = 0.6;
      [-1.5, -0.5, 0.5, 1.5].forEach(function (k) {
        ctx.beginPath();
        ctx.moveTo(k * 27, -90);
        ctx.quadraticCurveTo(k * 37, 0, k * 25, 88);
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
    });
  } else if (v.name === 'pepper') {
    // Stem and calyx in the magenta tone.
    ctx.fillStyle = PEP_B;
    ctx.fillRect(-6, -128, 13, 30);
    var cal = [[-34, -92], [-12, -104], [0, -94], [12, -104], [34, -92], [14, -82], [0, -90], [-14, -82]];
    ctx.beginPath();
    ctx.moveTo(cal[0][0], cal[0][1]);
    for (var j = 1; j < cal.length; j++) ctx.lineTo(cal[j][0], cal[j][1]);
    ctx.closePath(); ctx.fill();
  } else if (v.name === 'zucchini') {
    // End nubs: stem end dark green, blossom end a
    // small green dot on the yellow side.
    ell(-192, 0, 11, 11, 0, ZUC_A);
    ell(192, 0, 7, 7, 0, ZUC_A);
  } else if (v.name === 'celery') {
    // Leafy tops: light-green ellipse clusters at each
    // stalk tip, plus a binding band at the base.
    [[-70, -128], [0, -134], [70, -128]].forEach(function (p) {
      ell(p[0] - 12, p[1] + 4, 17, 9, -0.6, CEL_B);
      ell(p[0] + 12, p[1] + 4, 17, 9, 0.6, CEL_B);
      ell(p[0], p[1] - 6, 15, 9, 0, CEL_B);
    });
    ctx.fillStyle = CEL_A;
    ctx.fillRect(-52, 106, 104, 24);
    ctx.fillStyle = CEL_B;
    ctx.fillRect(-52, 114, 104, 5);
  }
}

function drawGrain(v) {
  clippedTo(v, function () {
    ctx.globalAlpha = 0.06;
    for (var i = 0; i < v.grain.length; i++) {
      var g = v.grain[i];
      ell(g.x, g.y, g.r, g.r, 0, g.white ? WHITE : INK);
    }
    ctx.globalAlpha = 1;
  });
}

// ---- the signature: "Yeti" as stroke paths -------------
// Hand-lettered strokes in a 120x52 box, drawn with
// round caps in the ink. No font text anywhere.
var SIG = [
  [[0, 2], [11, 16], [22, 2]], [[11, 16], [11, 40]],
  [[48, 23], [44, 14], [35, 12], [29, 19], [29, 28], [35, 35], [45, 34], [49, 27]],
  [[29, 23], [48, 23]],
  [[67, 4], [65, 26], [68, 34], [77, 33]], [[58, 15], [76, 15]],
  [[93, 14], [91, 35]],
  [[2, 49], [42, 53], [92, 51], [122, 44]]
];
function drawSignature() {
  ctx.save();
  ctx.translate(950, 826);
  ctx.strokeStyle = INK; ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  SIG.forEach(function (stroke) {
    ctx.beginPath();
    ctx.moveTo(stroke[0][0], stroke[0][1]);
    for (var i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i][0], stroke[i][1]);
    ctx.stroke();
  });
  ell(93, 5, 2.6, 2.6, 0, INK);
  ctx.restore();
}

// ---- animation ------------------------------------------
function wiggleAngle(v, lt) {
  var u = (lt - v.slot * 5) / 4;
  if (u < 0 || u > 1) return 0;
  return 5 * Math.PI / 180 * Math.sin(TAU * u);
}

// Constant first-frame phase: T = 11.0s into the 30s
// loop (garlic at full +5 degree wiggle, breathing at
// 0.995, sparkles staggered mid-twinkle).
var T = 11.0;
var lastNow = -1, acc = 0;

function drawScene(lt) {
  // Page ground: flat orange, everywhere.
  ctx.fillStyle = GROUND;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);

  // The arrangement breathes about the design centre:
  // scale 0.99 to 1.01 on 12s cycles.
  var br = 1 + 0.01 * Math.sin(TAU * lt / 12);
  ctx.save();
  ctx.translate(640, 450);
  ctx.scale(br, br);
  ctx.translate(-640, -450);
  for (var i = 0; i < VEG.length; i++) {
    var v = VEG[i];
    ctx.save();
    ctx.translate(v.x, v.y);
    ctx.rotate(v.rot + wiggleAngle(v, lt));
    ctx.scale(v.s, v.s);
    twoTone(v);
    dress(v);
    drawGrain(v);
    ctx.restore();
  }
  ctx.restore();

  // Sparkles twinkle on whole cycles of the loop.
  for (var s2 = 0; s2 < SPARKLES.length; s2++) {
    var sp = SPARKLES[s2];
    ctx.globalAlpha = 0.2 + 0.8 * (0.5 + 0.5 * Math.sin(TAU * sp.k * lt / LOOP + sp.ph));
    sparklePath(sp.x, sp.y, sp.r);
    ctx.fillStyle = WHITE;
    ctx.fill();
  }
  ctx.globalAlpha = 0.85;
  for (var d = 0; d < DOTS.length; d++) ell(DOTS[d].x, DOTS[d].y, DOTS[d].r, DOTS[d].r, 0, WHITE);
  ctx.globalAlpha = 1;

  drawSignature();
}

function draw() { drawScene(T % LOOP); }

// ---- sizing: cover fit, page ground = flat orange -------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
