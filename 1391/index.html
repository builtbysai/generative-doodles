<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masked Wanderer</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1b1d; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1391000);
  function hash2(x, y) {
    var h = Math.imul(x * 374761393 + y * 668265263, 974634211) ^ 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  var W = 0, H = 0, isPhone = false;
  function resize() {
    var vp = (typeof window.visualViewport !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vp ? vp.width : window.innerWidth;
    H = vp ? vp.height : window.innerHeight;
    var sw = window.screen ? window.screen.width : W;
    var sh = window.screen ? window.screen.height : H;
    var minDim = Math.min(sw, sh);
    isPhone = minDim < 700 || (H > W * 1.15 && minDim < 900);
    canvas.width = W; canvas.height = H;
    draw(lastT);
  }
  if (typeof window.visualViewport !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  // Palette (flat fills only).
  var GRAY = '#8b8d90', GLASS = '#b8ccd4', GLOW = '#e0962a', MASK = '#e8e4da',
      FLOOR = '#1a1b1d', BODY = '#8b8d90', DARK = '#101114';

  // Vitrine segments: 9 per side, seeded object per segment index.
  var NSEG = 9;
  var segObj = [];
  for (var i = 0; i < NSEG; i++) {
    var r = mulberry32(1391000 + i * 7919);
    segObj.push({ type: Math.floor(r() * 5), seed: Math.floor(r() * 100000), tilt: (r() - 0.5) * 0.3 });
  }
  function segRand(seg, k) { return hash2(seg.seed, k); }

  // Pause schedule: 30 s cycle, walk [0,18), pause [18,24), walk [24,30).
  function pauseElapsed(t) {
    var cyc = Math.floor(t / 30), c = t - cyc * 30;
    var inPause = c > 18 ? (c < 24 ? c - 18 : 6) : 0;
    return cyc * 6 + inPause;
  }
  function pauseEnv(t) {
    var c = t - Math.floor(t / 30) * 30;
    if (c < 18) return 0;
    if (c < 19) return c - 18;
    if (c < 23) return 1;
    if (c < 24) return 24 - c;
    return 0;
  }
  function walkTime(t) { return t - pauseElapsed(t); }

  // Drag: recorded samples {dx, t}; pan decays with tau 3 s, clamped.
  var drags = [];
  var lastT = 0;
  function panX(t) {
    var s = 0;
    for (var i = 0; i < drags.length; i++) {
      var dt = t - drags[i].t;
      if (dt >= 0) s += drags[i].dx * Math.exp(-dt / 3);
    }
    if (s > 60) s = 60; if (s < -60) s = -60;
    return s;
  }
  var downX = null, downY = null;
  canvas.addEventListener('pointerdown', function (e) {
    downX = e.clientX; downY = e.clientY;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (downX === null) return;
    var dx = e.clientX - downX;
    if (dx !== 0) drags.push({ dx: dx, t: lastT });
    downX = e.clientX; downY = e.clientY;
    if (drags.length > 200) drags.splice(0, drags.length - 200);
  });
  function endDrag() { downX = null; downY = null; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  function circle(x, y, r, fill) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
  }
  function rect(x, y, w, h, fill) {
    ctx.fillStyle = fill;
    ctx.fillRect(x, y, w, h);
  }
  function line(x1, y1, x2, y2, w, col) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = col;
    ctx.lineWidth = w;
    ctx.stroke();
  }

  function drawObject(cx, cy, s, type, seed) {
    // Flat-alpha halo, then the seeded form in object amber.
    ctx.globalAlpha = 0.10; circle(cx, cy, s * 0.95, GLOW);
    ctx.globalAlpha = 0.16; circle(cx, cy, s * 0.62, GLOW);
    ctx.globalAlpha = 1;
    ctx.fillStyle = GLOW;
    ctx.strokeStyle = GLOW;
    if (type === 0) {
      // Faceted gem: diamond.
      ctx.beginPath();
      ctx.moveTo(cx, cy - s * 0.55); ctx.lineTo(cx + s * 0.42, cy);
      ctx.lineTo(cx, cy + s * 0.55); ctx.lineTo(cx - s * 0.42, cy);
      ctx.closePath(); ctx.fill();
    } else if (type === 1) {
      // Spiral as a polyline.
      ctx.beginPath();
      for (var a = 0; a <= 4.5; a += 0.25) {
        var rr = s * 0.12 + a * s * 0.10;
        var px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
        if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.lineWidth = Math.max(1, s * 0.08); ctx.stroke();
    } else if (type === 2) {
      // Ring.
      ctx.lineWidth = Math.max(1, s * 0.16);
      ctx.beginPath(); ctx.moveTo(cx + s * 0.5, cy); ctx.arc(cx, cy, s * 0.5, 0, Math.PI * 2); ctx.stroke();
      circle(cx, cy, s * 0.14, GLOW);
    } else if (type === 3) {
      // Vessel: trapezoid body + neck.
      ctx.beginPath();
      ctx.moveTo(cx - s * 0.34, cy - s * 0.1); ctx.lineTo(cx + s * 0.34, cy - s * 0.1);
      ctx.lineTo(cx + s * 0.2, cy + s * 0.55); ctx.lineTo(cx - s * 0.2, cy + s * 0.55);
      ctx.closePath(); ctx.fill();
      rect(cx - s * 0.1, cy - s * 0.55, s * 0.2, s * 0.45, GLOW);
    } else {
      // Shard cluster: three small triangles.
      for (var k = 0; k < 3; k++) {
        var ox = (segRand(seed, k * 2) - 0.5) * s * 0.7, oy = (segRand(seed, k * 2 + 1) - 0.5) * s * 0.7;
        ctx.beginPath();
        ctx.moveTo(cx + ox, cy + oy - s * 0.3);
        ctx.lineTo(cx + ox + s * 0.22, cy + oy + s * 0.25);
        ctx.lineTo(cx + ox - s * 0.22, cy + oy + s * 0.25);
        ctx.closePath(); ctx.fill();
      }
    }
  }

  function drawVitrine(x, y, w, h, seg) {
    // Frame (dark), glass, seeded object.
    rect(x - w * 0.06, y - h * 0.04, w * 1.12, h * 1.08, DARK);
    ctx.globalAlpha = 0.85; rect(x, y, w, h, GLASS); ctx.globalAlpha = 1;
    var o = segObj[seg];
    var s = Math.min(w, h) * 0.30;
    ctx.save();
    ctx.translate(x + w / 2, y + h * 0.52);
    ctx.rotate(o.tilt);
    ctx.translate(-(x + w / 2), -(y + h * 0.52));
    drawObject(x + w / 2, y + h * 0.52, s, o.type, o.seed);
    ctx.restore();
    // Glass sheen: one flat-alpha diagonal bar.
    ctx.globalAlpha = 0.12; rect(x + w * 0.18, y, w * 0.16, h, '#ffffff'); ctx.globalAlpha = 1;
  }

  function draw(t) {
    lastT = t;
    if (!W || !H) return;
    var cx = W / 2, vpy = H * 0.46;
    var vpx = cx + panX(t);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    // Room: floor dark base.
    rect(0, 0, W, H, FLOOR);
    // Ceiling triangle.
    ctx.globalAlpha = 0.30; ctx.fillStyle = GRAY;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.lineTo(vpx, vpy); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    // Floor triangle.
    ctx.fillStyle = FLOOR;
    ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(W, H); ctx.lineTo(vpx, vpy); ctx.closePath(); ctx.fill();
    // Side walls.
    ctx.globalAlpha = 0.45; ctx.fillStyle = GRAY;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(vpx, vpy); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W, 0); ctx.lineTo(vpx, vpy); ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    // Aisle: center trapezoid, slightly lighter.
    ctx.globalAlpha = 0.10; ctx.fillStyle = GRAY;
    ctx.beginPath(); ctx.moveTo(vpx - 2, vpy); ctx.lineTo(vpx + 2, vpy);
    ctx.lineTo(cx + W * 0.10, H); ctx.lineTo(cx - W * 0.10, H); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    // Floor perspective lines.
    ctx.strokeStyle = GRAY; ctx.globalAlpha = 0.22; ctx.lineWidth = 1;
    for (var i = 0; i <= 8; i++) {
      ctx.beginPath(); ctx.moveTo(vpx, vpy); ctx.lineTo(W * i / 8, H); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Vitrines: scroll slows to 0.15x during pauses (closed-form).
    var scroll = 0.045 * (t - 0.85 * pauseElapsed(t));
    var items = [];
    for (var j = 0; j < NSEG; j++) {
      var d = (j / NSEG + scroll) % 1; if (d < 0) d += 1;
      items.push({ seg: j, d: d, side: -1 });
      items.push({ seg: j, d: d, side: 1 });
    }
    items.sort(function (a, b) { return a.d - b.d; });
    for (var k = 0; k < items.length; k++) {
      var it = items[k];
      var e = Math.pow(it.d, 1.7);
      var w = 6 + (Math.min(W, 900) * 0.16 - 6) * e;
      var h = 10 + (H * 0.34 - 10) * e;
      var x, y;
      if (it.side < 0) {
        x = vpx + (0 - vpx) * e - w / 2;
      } else {
        x = vpx + (W - vpx) * e - w / 2;
      }
      y = vpy + (H * 0.52 - vpy) * e - h / 2;
      drawVitrine(x, y, w, h, it.seg);
    }

    // Wanderer: small, frame center, surveillance distance holds (never panned, never scaled by drag).
    var wt = walkTime(t);
    var phase = wt * Math.PI * 2 * 0.9;
    var amp = 1 - pauseEnv(t);
    var fy = H * 0.74, hh = H * 0.17;
    var sway = Math.sin(phase * 0.5) * 3 * amp;
    var wx = cx + sway;
    var bob = Math.abs(Math.sin(phase)) * H * 0.008 * amp;
    var hipY = fy - hh * 0.52 - bob, shY = fy - hh * 0.82 - bob;
    var headY = fy - hh * 0.93 - bob, headR = hh * 0.09;
    var legSwing = Math.sin(phase) * hh * 0.10 * amp;
    var armSwing = -Math.sin(phase) * hh * 0.08 * amp;
    // Legs.
    line(wx, hipY, wx - hh * 0.05 + legSwing, fy, Math.max(1, hh * 0.03), BODY);
    line(wx, hipY, wx + hh * 0.05 - legSwing, fy, Math.max(1, hh * 0.03), BODY);
    // Torso.
    line(wx, hipY, wx, shY, Math.max(1, hh * 0.05), BODY);
    // Arms: during pause, the arm on the pause side raises toward that vitrine.
    var cycIdx = Math.floor(t / 30);
    var pSide = (cycIdx % 2 === 0) ? -1 : 1;
    var pEnv = pauseEnv(t);
    var armLx = wx - hh * 0.10 + armSwing * 0.5, armLy = shY + hh * 0.22;
    var armRx = wx + hh * 0.10 - armSwing * 0.5, armRy = shY + hh * 0.22;
    if (pSide < 0) {
      armLx = wx - hh * 0.10 - pEnv * hh * 0.06;
      armLy = shY - pEnv * hh * 0.18 + (1 - pEnv) * hh * 0.22;
    } else {
      armRx = wx + hh * 0.10 + pEnv * hh * 0.06;
      armRy = shY - pEnv * hh * 0.18 + (1 - pEnv) * hh * 0.22;
    }
    line(wx, shY, armLx, armLy, Math.max(1, hh * 0.025), BODY);
    line(wx, shY, armRx, armRy, Math.max(1, hh * 0.025), BODY);
    // Head: mask with eye slits, tilted toward the pause side while paused.
    ctx.save();
    ctx.translate(wx, headY);
    ctx.rotate(pEnv * pSide * 0.22);
    circle(0, 0, headR, MASK);
    rect(-headR * 0.55, -headR * 0.15, headR * 0.32, headR * 0.14, DARK);
    rect(headR * 0.23, -headR * 0.15, headR * 0.32, headR * 0.14, DARK);
    ctx.restore();

    // Surveillance frame: fixed corner brackets, locked and detached.
    ctx.globalAlpha = 0.5; ctx.strokeStyle = GRAY; ctx.lineWidth = 2;
    var bl = Math.min(W, H) * 0.03, m = 14;
    ctx.beginPath(); ctx.moveTo(m, m + bl); ctx.lineTo(m, m); ctx.lineTo(m + bl, m); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W - m - bl, m); ctx.lineTo(W - m, m); ctx.lineTo(W - m, m + bl); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(m, H - m - bl); ctx.lineTo(m, H - m); ctx.lineTo(m + bl, H - m); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W - m - bl, H - m); ctx.lineTo(W - m, H - m); ctx.lineTo(W - m, H - m - bl); ctx.stroke();
    ctx.globalAlpha = 1;

    // Grain: seeded dots keyed by (dot, quantized 2 s index).
    var qi = Math.floor(t / 2);
    ctx.globalAlpha = 0.05; ctx.fillStyle = '#ffffff';
    for (var g = 0; g < 120; g++) {
      var gx = hash2(g, qi) * W, gy = hash2(qi, g) * H;
      ctx.fillRect(gx, gy, 1, 1);
    }
    ctx.globalAlpha = 1;
  }

  // Frame one synchronously at a constant phase; clock starts with the rAF loop.
  var started = false, t0 = 0;
  function loop(ts) {
    if (!started) { started = true; t0 = ts; }
    draw((ts - t0) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  resize();
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
