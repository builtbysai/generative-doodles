<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Friends, Wrong Mirrors</title>
<style>
  html, body { margin: 0; padding: 0; background: #5a6a3a; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Round fading alphas to 4 decimals (node-canvas scientific-notation quirk).
  function a4(x) {
    var v = Math.round(x * 10000) / 10000;
    if (v < 0) v = 0; if (v > 1) v = 1;
    return v;
  }
  function rgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  var GRASS = '#5a6a3a', GRASS_D = '#4a5a2e', GRASS_L = '#6a7a4a';
  var GROUND = '#e8e2d4', SKIN = '#d4a880', SKIN_SH = '#8a6a54';
  var DARK = '#141210', LIGHT = '#e8e2d4';
  var GOLD = '#d4a24e', TEAL = '#2e7a74', RUST = '#9a4a28';

  // Four distinct bodies. Same pose family per pair slot, different body.
  var bodies = [
    { len: 1.15, wid: 0.30, pose: 'lying' },   // 0 lean lying
    { len: 0.85, wid: 0.46, pose: 'sitting' }, // 1 stocky sitting
    { len: 1.30, wid: 0.28, pose: 'lying' },   // 2 tall lying
    { len: 0.75, wid: 0.50, pose: 'sitting' }  // 3 compact sitting
  ];
  // Each figure's reflection starts as its pair-partner's body: always mismatched.
  // neg: this figure's reflection is the negative; otherwise the positive.
  var figures = [
    { body: 0, pair: 0, refl: 1, neg: true },
    { body: 1, pair: 0, refl: 0, neg: false },
    { body: 2, pair: 1, refl: 3, neg: true },
    { body: 3, pair: 1, refl: 2, neg: false }
  ];
  // Dragging a figure cycles its reflection through the OTHER pair's bodies only:
  // a figure is never paired with its own mirror.
  function otherPairBodies(pair) {
    return pair === 0 ? [2, 3] : [0, 1];
  }

  var W = 0, H = 0, curT = 0;
  var boxes = []; // hit boxes per figure, refreshed each draw
  var blades = [];

  function isPhone() {
    var sw = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = Math.min(window.screen.width, window.screen.height);
    }
    if (sw < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
    if (vv && vv.width && vv.height) { W = vv.width; H = vv.height; }
    else if (typeof window !== 'undefined') { W = window.innerWidth; H = window.innerHeight; }
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    // Seeded grass blades, regenerated deterministically per size.
    blades = [];
    var rnd = mulberry32(1435000);
    var n = Math.floor(W * H / 4500);
    for (var i = 0; i < n; i++) {
      blades.push({ x: rnd() * W, y: rnd() * H, lean: (rnd() - 0.5) * 6, len: 6 + rnd() * 8, dark: rnd() < 0.5 });
    }
    draw(curT);
  }

  // Stylized, non-sexualized body form: capsule limbs, passive repose only.
  function limb(x1, y1, x2, y2, w, cs) {
    ctx.strokeStyle = cs.shade; ctx.lineWidth = w * 1.15; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1 + 1, y1 + 1.5); ctx.lineTo(x2 + 1, y2 + 1.5); ctx.stroke();
    ctx.strokeStyle = cs.main; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  function headDot(x, y, r, cs) {
    ctx.fillStyle = cs.main;
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    if (cs.ring) {
      ctx.strokeStyle = cs.ring; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    }
  }
  function drawBody(cx, cy, u, b, cs) {
    var len = b.len * u, wid = b.wid * u;
    if (b.pose === 'lying') {
      // Reclining: horizontal torso, head clear of the torso end, arms tucked behind it.
      limb(cx - 0.20 * len, cy, cx + 0.78 * len, cy - 0.06 * len, wid, cs);
      headDot(cx + 1.02 * len, cy - 0.16 * len, 0.17 * len, cs);
      limb(cx + 0.55 * len, cy - 0.05 * len, cx + 0.88 * len, cy - 0.34 * len, 0.09 * len, cs);
      limb(cx + 0.88 * len, cy - 0.34 * len, cx + 1.08 * len, cy - 0.30 * len, 0.09 * len, cs);
      limb(cx - 0.20 * len, cy + 0.02 * len, cx - 0.70 * len, cy + 0.18 * len, 0.12 * len, cs);
      limb(cx - 0.70 * len, cy + 0.18 * len, cx - 1.05 * len, cy + 0.06 * len, 0.10 * len, cs);
      limb(cx - 0.18 * len, cy + 0.05 * len, cx - 0.62 * len, cy + 0.26 * len, 0.12 * len, cs);
      limb(cx - 0.62 * len, cy + 0.26 * len, cx - 0.95 * len, cy + 0.18 * len, 0.10 * len, cs);
    } else {
      // Seated, leaning back: slim torso, head on a clear neck gap, one arm behind the head.
      limb(cx, cy + 0.10 * len, cx + 0.14 * len, cy - 0.88 * len, wid * 0.72, cs);
      headDot(cx + 0.20 * len, cy - 1.14 * len, 0.17 * len, cs);
      limb(cx + 0.10 * len, cy - 0.70 * len, cx - 0.12 * len, cy - 1.02 * len, 0.09 * len, cs);
      limb(cx - 0.12 * len, cy - 1.02 * len, cx - 0.28 * len, cy - 1.18 * len, 0.09 * len, cs);
      limb(cx + 0.12 * len, cy - 0.60 * len, cx + 0.42 * len, cy - 0.72 * len, 0.09 * len, cs);
      limb(cx, cy + 0.12 * len, cx + 0.55 * len, cy + 0.30 * len, 0.12 * len, cs);
      limb(cx + 0.55 * len, cy + 0.30 * len, cx + 0.60 * len, cy + 0.68 * len, 0.10 * len, cs);
      limb(cx + 0.02 * len, cy + 0.14 * len, cx + 0.50 * len, cy + 0.38 * len, 0.12 * len, cs);
      limb(cx + 0.50 * len, cy + 0.38 * len, cx + 0.55 * len, cy + 0.72 * len, 0.10 * len, cs);
    }
  }

  function draw(t) {
    curT = t;
    if (!W || !H) return;
    var phone = isPhone();
    // Grass field.
    ctx.fillStyle = GRASS;
    ctx.fillRect(0, 0, W, H);

    // Pair clearings: side by side on desktop, stacked on phones.
    var pairs = [];
    if (phone) {
      var pw = W * 0.92, ph = H * 0.44;
      pairs.push({ x: W * 0.04, y: H * 0.03, w: pw, h: ph });
      pairs.push({ x: W * 0.04, y: H * 0.53, w: pw, h: ph });
    } else {
      var pw2 = W * 0.46, ph2 = H * 0.72;
      pairs.push({ x: W * 0.02, y: H * 0.14, w: pw2, h: ph2 });
      pairs.push({ x: W * 0.52, y: H * 0.14, w: pw2, h: ph2 });
    }
    for (var p = 0; p < pairs.length; p++) {
      ctx.fillStyle = GROUND;
      ctx.fillRect(pairs[p].x, pairs[p].y, pairs[p].w, pairs[p].h);
    }
    // Grass blades, skipping the clearings.
    ctx.lineCap = 'round'; ctx.lineWidth = 1.5;
    for (var i = 0; i < blades.length; i++) {
      var bl = blades[i], inside = false;
      for (var q = 0; q < pairs.length; q++) {
        if (bl.x >= pairs[q].x && bl.x <= pairs[q].x + pairs[q].w &&
            bl.y >= pairs[q].y && bl.y <= pairs[q].y + pairs[q].h) { inside = true; break; }
      }
      if (inside) continue;
      ctx.strokeStyle = bl.dark ? GRASS_D : GRASS_L;
      ctx.beginPath(); ctx.moveTo(bl.x, bl.y); ctx.lineTo(bl.x + bl.lean, bl.y - bl.len); ctx.stroke();
    }

    boxes = [];
    var normal = { main: SKIN, shade: SKIN_SH, ring: null };
    var negative = { main: DARK, shade: '#2a241e', ring: LIGHT };
    for (var f = 0; f < figures.length; f++) {
      var fig = figures[f], b = bodies[fig.body];
      var pr = pairs[fig.pair];
      var slot = (f % 2 === 0) ? 0 : 1; // left / right figure within the pair
      var cx = pr.x + pr.w * (slot === 0 ? 0.26 : 0.74);
      var yMirror = pr.y + pr.h * 0.52;
      var zoneH = pr.h * 0.40;
      var slotW = pr.w * 0.44;
      var vExt = (b.pose === 'lying') ? 0.72 : 2.0;
      var hExt = (b.pose === 'lying') ? 2.15 : 0.95;
      var u = Math.min(zoneH / (vExt * b.len), slotW / (hExt * b.len));
      var len = b.len * u;
      var drawCx = cx + ((b.pose === 'sitting') ? -0.15 * len : 0);
      var cy = yMirror - ((b.pose === 'lying') ? 0.30 * len : 0.78 * len);
      // Figure, in passive composure.
      drawBody(drawCx, cy, u, b, normal);
      // Faint gold varnish breath on the figure.
      ctx.fillStyle = rgba(GOLD, 0.04 + 0.02 * Math.sin(2 * Math.PI * t / 30 + f * 1.7));
      ctx.beginPath(); ctx.ellipse(drawCx, cy - 0.3 * len, slotW * 0.22, zoneH * 0.40, 0, 0, Math.PI * 2); ctx.fill();

      // Mirror line: dark, legible, with end ticks — the waterline between body and mirror.
      ctx.strokeStyle = rgba(SKIN_SH, 0.9); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx - slotW * 0.5, yMirror); ctx.lineTo(cx + slotW * 0.5, yMirror); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - slotW * 0.5, yMirror - 5); ctx.lineTo(cx - slotW * 0.5, yMirror + 5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + slotW * 0.5, yMirror - 5); ctx.lineTo(cx + slotW * 0.5, yMirror + 5); ctx.stroke();

      // Reflection: the partner's body, flipped, never the figure's own.
      var rb = bodies[fig.refl];
      var cs = fig.neg ? negative : normal;
      var ru = u * 0.62;
      ctx.save();
      ctx.globalAlpha = 0.92;
      ctx.translate(0, 2 * yMirror);
      ctx.scale(1, -1);
      drawBody(drawCx, cy, ru, rb, cs);
      ctx.restore();
      // Varnish layers breathing over the reflection; contours flicker slowly.
      var reflH = ((rb.pose === 'lying') ? 0.68 : 1.93) * rb.len * ru;
      var flick = 2.5 * Math.sin(2 * Math.PI * t / 15 + f * 2.1);
      ctx.save();
      ctx.translate(0, 2 * yMirror);
      ctx.scale(1, -1);
      ctx.strokeStyle = rgba(GOLD, 0.18 + 0.05 * Math.sin(2 * Math.PI * t / 20 + f));
      ctx.lineWidth = Math.max(1, 0.06 * rb.len * ru);
      ctx.beginPath();
      ctx.moveTo(drawCx - 0.2 * rb.len * ru + flick, cy);
      ctx.lineTo(drawCx + 0.8 * rb.len * ru + flick, cy - 0.08 * rb.len * ru);
      ctx.stroke();
      ctx.restore();
      var vap = [
        { c: GOLD, T: 20, ph: f * 1.3 },
        { c: TEAL, T: 30, ph: f * 2.2 + 1 }
      ];
      for (var v = 0; v < vap.length; v++) {
        ctx.fillStyle = rgba(vap[v].c, 0.05 + 0.04 * Math.sin(2 * Math.PI * t / vap[v].T + vap[v].ph));
        ctx.beginPath();
        ctx.ellipse(drawCx, yMirror + reflH * 0.5, slotW * 0.24, reflH * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      boxes.push({
        x0: cx - slotW * 0.5, y0: yMirror - zoneH - 10,
        x1: cx + slotW * 0.5, y1: yMirror + reflH + 10,
        fig: f
      });
    }
  }

  // Drag a figure: swap which mirror it is paired with (other pair's bodies only).
  var active = -1, startX = 0, startY = 0, swapped = false;
  function pos(e) {
    var r = { left: 0, top: 0 };
    if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect();
    var x = (e.clientX !== undefined) ? e.clientX - r.left : 0;
    var y = (e.clientY !== undefined) ? e.clientY - r.top : 0;
    return { x: x, y: y };
  }
  function hitFigure(x, y) {
    for (var i = 0; i < boxes.length; i++) {
      if (x >= boxes[i].x0 && x <= boxes[i].x1 && y >= boxes[i].y0 && y <= boxes[i].y1) return boxes[i].fig;
    }
    return -1;
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = pos(e);
    active = hitFigure(p.x, p.y);
    startX = p.x; startY = p.y; swapped = false;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (active < 0 || swapped) return;
    var p = pos(e);
    if (Math.abs(p.x - startX) + Math.abs(p.y - startY) < 12) return;
    var fig = figures[active];
    var cands = otherPairBodies(fig.pair);
    var idx = cands.indexOf(fig.refl);
    fig.refl = cands[(idx + 1) % cands.length];
    swapped = true;
    draw(curT);
  });
  canvas.addEventListener('pointerup', function () { active = -1; });
  canvas.addEventListener('pointercancel', function () { active = -1; });

  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    if (window.addEventListener) window.addEventListener('resize', resize);
  }
  resize();

  // Deterministic first frame: draw(0) at load, clock starts with the rAF loop.
  draw(0);
  var booted = false, startT = 0;
  function loop(ts) {
    if (!booted) { booted = true; startT = ts; }
    var t = (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
