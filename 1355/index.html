<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIPI Reskin</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e1420; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, nowT = 0;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1355000);

  // Seeded stars (fixed positions, sky region only).
  var stars = [];
  for (var si = 0; si < 70; si++) {
    stars.push({ x: rng(), y: rng() * 0.80, r: 0.6 + rng() * 1.4, a: 0.25 + rng() * 0.55 });
  }
  // Seeded per-panel pattern data (deadstock fabric + denim wear).
  var NP = 9;
  var panelPat = [];
  for (var pi = 0; pi < NP; pi++) {
    var pr = mulberry32(1355000 + pi * 7919);
    var diamonds = [];
    for (var di = 0; di < 14; di++) {
      diamonds.push({ x: pr(), y: pr(), s: 3 + pr() * 7, c: di % 3 });
    }
    var stitches = [];
    for (var sti = 0; sti < 5; sti++) {
      stitches.push({ y: pr(), off: pr() });
    }
    panelPat.push({ diamonds: diamonds, stitches: stitches, tone: pr() });
  }

  function isPhone() {
    try {
      var m = Math.min(window.screen.width, window.screen.height);
      if (m < 700) return true;
    } catch (e) {}
    return H > W * 1.15;
  }

  function resize() {
    var w, h;
    try {
      if (window.visualViewport) { w = window.visualViewport.width; h = window.visualViewport.height; }
      else { w = window.innerWidth; h = window.innerHeight; }
    } catch (e) { w = window.innerWidth; h = window.innerHeight; }
    W = w; H = h;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    draw(nowT);
  }

  // ---- rotation state: closed-form function of recorded events + piece time ----
  var drag = null;          // {startX, lastX, startAngle}
  var released = null;      // {angle, t}
  var settleAngle = 0;      // angle at rest (0: cone faces forward)
  function rotationAt(t) {
    if (drag) return drag.startAngle + (drag.lastX - drag.startX) * 0.004;
    if (released) return released.angle * Math.exp(-(t - released.t) / 1.2);
    return settleAngle;
  }
  function onDown(e) {
    if (e.preventDefault) e.preventDefault();
    drag = { startX: e.clientX, lastX: e.clientX, startAngle: rotationAt(nowT) };
    released = null;
  }
  function onMove(e) {
    if (drag) drag.lastX = e.clientX;
  }
  function onUp(e) {
    if (!drag) return;
    released = { angle: rotationAt(nowT), t: nowT };
    drag = null;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  try {
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  } catch (e) {}
  window.addEventListener('resize', resize);

  // ---- skins: 50 s cycle, 4 skins x 12.5 s, 2 s crossfade between slots ----
  var SKINS = ['fabric', 'mirror', 'hide', 'denim'];
  function skinAt(t) {
    if (t < 12.5) return { prev: 0, cur: 0, alpha: 1 };
    var slot = Math.floor(t / 12.5) % 4;
    var slotT = t % 12.5;
    var prev = (slot + 3) % 4;
    var alpha = slotT < 2 ? slotT / 2 : 1;
    return { prev: prev, cur: slot, alpha: alpha };
  }

  function fillTri(ax, ay, bx, by, cx2, cy2) {
    ctx.beginPath();
    ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx2, cy2);
    ctx.closePath(); ctx.fill();
  }

  function drawSkinPanel(skin, x0, y0, x1, y1, x2, y2, p, rot, t) {
    // Clip to the panel triangle, then paint the skin over its bbox.
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.closePath(); ctx.clip();
    var minX = Math.min(x0, x1, x2), maxX = Math.max(x0, x1, x2);
    var minY = Math.min(y0, y1, y2), maxY = Math.max(y0, y1, y2);
    var bw = maxX - minX, bh = maxY - minY;
    if (skin === 0) { // deadstock fabric: hide base + seeded diamond pattern
      ctx.fillStyle = '#d8cfc0'; ctx.fillRect(minX, minY, bw, bh);
      var dc = ['#b4552d', '#3a4a63', '#8a7a5a'];
      for (var i = 0; i < p.diamonds.length; i++) {
        var d = p.diamonds[i];
        var dx = minX + d.x * bw, dy = minY + d.y * bh;
        ctx.fillStyle = dc[d.c];
        ctx.beginPath();
        ctx.moveTo(dx, dy - d.s); ctx.lineTo(dx + d.s, dy);
        ctx.lineTo(dx, dy + d.s); ctx.lineTo(dx - d.s, dy);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = 'rgba(60,40,20,0.25)';
      ctx.fillRect(minX, minY + bh * 0.32, bw, 2);
      ctx.fillRect(minX, minY + bh * 0.68, bw, 2);
    } else if (skin === 1) { // mirrored vinyl: silver + flat mirrored sky bands
      ctx.fillStyle = '#c8ccd2'; ctx.fillRect(minX, minY, bw, bh);
      var par = rot * 26; // tilt parallax: bands slide with rotation
      ctx.fillStyle = 'rgba(14,20,32,0.55)';
      ctx.fillRect(minX, minY + ((par % (bh + 40)) + bh + 40) % (bh + 40) - 20, bw, bh * 0.16);
      ctx.fillStyle = 'rgba(232,226,212,0.70)';
      ctx.fillRect(minX, minY + bh * 0.42 + par * 0.4, bw, bh * 0.10);
      ctx.fillStyle = 'rgba(14,20,32,0.35)';
      ctx.fillRect(minX, minY + bh * 0.72, bw, bh * 0.12);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillRect(minX + bw * 0.30, minY + bh * 0.20, 3, 3);
      ctx.fillRect(minX + bw * 0.62, minY + bh * 0.55, 2, 2);
      ctx.fillRect(minX + bw * 0.45, minY + bh * 0.80, 3, 3);
    } else if (skin === 2) { // hide: plain + tone variation + blotches
      ctx.fillStyle = '#d8cfc0'; ctx.fillRect(minX, minY, bw, bh);
      ctx.fillStyle = p.tone > 0.5 ? 'rgba(120,100,70,0.18)' : 'rgba(255,250,235,0.14)';
      ctx.fillRect(minX, minY, bw, bh);
      ctx.fillStyle = 'rgba(90,70,45,0.20)';
      ctx.fillRect(minX + bw * 0.25, minY + bh * 0.30, bw * 0.30, bh * 0.12);
      ctx.fillRect(minX + bw * 0.55, minY + bh * 0.62, bw * 0.22, bh * 0.10);
    } else { // denim: faded blue + stitch dashes + worn patches
      ctx.fillStyle = '#3a4a63'; ctx.fillRect(minX, minY, bw, bh);
      ctx.fillStyle = 'rgba(140,160,190,0.20)';
      ctx.fillRect(minX + bw * 0.15, minY + bh * 0.20, bw * 0.5, bh * 0.25);
      ctx.fillStyle = '#7a8aa5';
      for (var s = 0; s < p.stitches.length; s++) {
        var st = p.stitches[s];
        var sy = minY + st.y * bh;
        for (var k = 0; k < 6; k++) {
          ctx.fillRect(minX + ((st.off + k * 0.16) % 1) * bw, sy, bw * 0.07, 1.5);
        }
      }
    }
    ctx.restore();
  }

  function draw(t) {
    nowT = t;
    if (!W || !H) return;
    var m = Math.min(W, H);
    // Sky.
    ctx.fillStyle = '#0e1420'; ctx.fillRect(0, 0, W, H);
    // Stars (sky region only).
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.fillStyle = 'rgba(232,226,212,' + s.a.toFixed(2) + ')';
      ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
    }
    // Moon, large upper-left: disc + two flat-alpha halo rings (one arc each).
    var moonX = 0.16 * W, moonY = 0.17 * H, moonR = 0.085 * m;
    ctx.fillStyle = 'rgba(232,226,212,0.10)';
    ctx.beginPath(); ctx.arc(moonX, moonY, moonR * 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(232,226,212,0.16)';
    ctx.beginPath(); ctx.arc(moonX, moonY, moonR * 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8e2d4';
    ctx.beginPath(); ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2); ctx.fill();
    // Ground: flat dark band.
    var groundY = 0.86 * H;
    ctx.fillStyle = '#07090f'; ctx.fillRect(0, groundY, W, H - groundY);

    // Tipi geometry: apex above the top edge (poles lean past the frame top).
    var cx = 0.56 * W;
    var apexY = -0.06 * H;
    var baseY = 0.84 * H;
    var halfW = Math.min(W * 0.30, H * 0.34);
    var rot = rotationAt(t);
    var ripple = Math.min(1, Math.abs(rot) / 1.5);
    // Base points with rotation shift + ripple.
    var base = [];
    for (var b = 0; b <= NP; b++) {
      var f = b / NP - 0.5; // -0.5 .. 0.5
      var bx = cx + f * 2 * halfW + rot * f * 2 * halfW * 0.35
        + Math.sin(b * 1.7 + t * 2.2) * ripple * 6;
      base.push(bx);
    }
    var sk = skinAt(t);
    // Flat shadow under the base.
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(cx - halfW, baseY, halfW * 2, H - baseY);
    // Panels (previous skin full, then current skin at crossfade alpha).
    for (var pass = 0; pass < 2; pass++) {
      var skinIdx = pass === 0 ? sk.prev : sk.cur;
      if (pass === 1 && sk.alpha >= 1 && sk.prev === sk.cur) continue;
      if (pass === 1) ctx.globalAlpha = sk.alpha;
      for (var p2 = 0; p2 < NP; p2++) {
        drawSkinPanel(skinIdx, cx, apexY, base[p2], baseY, base[p2 + 1], baseY,
          panelPat[p2], rot, t);
      }
      ctx.globalAlpha = 1;
    }
    // Lodge poles: lines from base points through the apex, past the top edge.
    ctx.strokeStyle = '#2e2318'; ctx.lineWidth = Math.max(3, m * 0.006);
    for (var q = 0; q <= NP; q += 2) {
      var px = base[q];
      var dx2 = cx - px, dy2 = apexY - baseY;
      var ext = 1.25; // extend past the apex
      ctx.beginPath();
      ctx.moveTo(px, baseY);
      ctx.lineTo(px + dx2 * ext, baseY + dy2 * ext);
      ctx.stroke();
    }
    // Panel seams.
    ctx.strokeStyle = 'rgba(20,14,8,0.55)'; ctx.lineWidth = 1.5;
    for (var r = 1; r < NP; r++) {
      ctx.beginPath();
      ctx.moveTo(cx, apexY); ctx.lineTo(base[r], baseY);
      ctx.stroke();
    }
  }

  resize();
  draw(0); // boot-flagged first frame: constant phase, deterministic
  var startMs = null;
  function loop(ts) {
    if (startMs === null) startMs = ts;
    var t = (ts - startMs) / 1000;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
