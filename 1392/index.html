<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physiological Flicker</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a09; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). Never Math.random.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(1392000);

  // Seeded polyhedron: one fixed set of vertices, drawn every frame.
  var NV = 9;
  var verts = [];
  for (var i = 0; i < NV; i++) {
    var ang = (i / NV) * Math.PI * 2 + (rand() - 0.5) * 0.5;
    var rad = 0.72 + rand() * 0.28;
    verts.push({ a: ang, r: rad });
  }
  // Facet chords: seeded pairs of vertex indices.
  var chords = [];
  for (var j = 0; j < 7; j++) {
    chords.push([Math.floor(rand() * NV), Math.floor(rand() * NV)]);
  }

  // Viewport from the Visual Viewport API, window size only as fallback.
  function viewportSize() {
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      return { w: visualViewport.width, h: visualViewport.height };
    }
    return { w: window.innerWidth, h: window.innerHeight };
  }
  function isPhone() {
    if (typeof window !== 'undefined' && window.screen) {
      var m = Math.min(window.screen.width, window.screen.height);
      if (m < 700) return true;
    }
    var s = viewportSize();
    return s.h > s.w * 1.15;
  }

  var W = 0, H = 0, CX = 0, CY = 0, R = 0;
  function resize() {
    var s = viewportSize();
    W = s.w; H = s.h;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    CX = W / 2; CY = H / 2;
    R = Math.min(W, H) * 0.38;
    if (typeof document !== 'undefined' && document.body) {
      document.body.style.background = '#0a0a09';
    }
  }
  if (typeof visualViewport !== 'undefined' && visualViewport) {
    visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- Strobe state (all closed-form functions of piece time + recorded events) ----
  // Base rate breathes 6 -> 12 Hz on a slow 24 s cycle.
  function baseRate(t) {
    return 9 + 3 * Math.sin((t / 24) * Math.PI * 2 - Math.PI / 2);
  }
  // Drag shifts the rate; the offset decays (tau 8 s) so the loop resumes.
  var drags = []; // {t, dx}
  function rateOffset(t) {
    var off = 0;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i];
      off += d.dx * 0.02 * Math.exp(-(t - d.t) / 8);
    }
    return off;
  }
  function rateAt(t) {
    var r = baseRate(t) + rateOffset(t);
    if (r < 4) r = 4;
    if (r > 14) r = 14;
    return r;
  }
  // Smooth partial-contrast strobe envelope. Phase advances at the live rate,
  // so the pulse train stays continuous when the rate shifts.
  // pulse: 0 in the dark hold, rising smoothly to 1 for a brief illumination
  // (duty ~0.28 of each cycle), then falling smoothly. Never a hard cut.
  function smoothstep(a, b, x) {
    if (x <= a) return 0;
    if (x >= b) return 1;
    var u = (x - a) / (b - a);
    return u * u * (3 - 2 * u);
  }
  // Start mid-rise of the first flash so frame one shows the form in
  // partial illumination rather than a bare dark hold.
  var phase = 0.05, lastT = 0;
  function envelope(t) {
    var dt = t - lastT;
    if (dt < 0) dt = 0;
    if (dt > 0.25) dt = 0.25;
    phase += rateAt(t) * dt;
    lastT = t;
    var frac = phase - Math.floor(phase);
    var up = smoothstep(0.0, 0.10, frac);
    var down = 1 - smoothstep(0.28, 0.42, frac);
    return up * down;
  }
  // After-image ghosts: recorded flash peaks, drawn as fading teal outlines.
  // A peak is recorded when the envelope crosses 0.9 upward.
  var peaks = []; // {t}
  var prevEnv = 0;
  function recordPeaks(t, e) {
    if (prevEnv < 0.9 && e >= 0.9) peaks.push({ t: t });
    prevEnv = e;
    while (peaks.length > 12) peaks.shift();
  }

  // Desaturation warning at the high end: above 10.5 Hz the palette greys out.
  function desatAt(t) {
    var r = rateAt(t);
    if (r <= 10.5) return 0;
    var d = (r - 10.5) / 3.5;
    return d > 1 ? 1 : d;
  }
  function mix(c1, c2, u) {
    return [
      Math.round(c1[0] + (c2[0] - c1[0]) * u),
      Math.round(c1[1] + (c2[1] - c1[1]) * u),
      Math.round(c1[2] + (c2[2] - c1[2]) * u)
    ];
  }
  function rgb(c, a) {
    // Round alpha to 4 decimals: JS stringifies tiny alphas (below ~1e-6)
    // in scientific notation ('2.5e-15'), which the QA renderer's color
    // parser misreads as opaque - a one-frame opaque flash when a ghost's
    // age lands within floating-point epsilon of its 1.4 s expiry. Rounding
    // makes such alphas exactly 0 ('rgba(...,0)'), transparent everywhere.
    var ar = Math.round(a * 10000) / 10000;
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + ar + ')';
  }
  var WHITE = [242, 240, 232], AMBER = [224, 150, 42], TEAL = [46, 143, 134];
  var GREY = [150, 148, 142];

  function drawForm(alpha, stroke, fill, lineWidth) {
    ctx.beginPath();
    for (var i = 0; i < NV; i++) {
      var v = verts[i];
      var x = CX + Math.cos(v.a) * v.r * R;
      var y = CY + Math.sin(v.a) * v.r * R;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = rgb(fill, alpha * 0.55);
    ctx.fill();
    ctx.strokeStyle = rgb(stroke, alpha);
    ctx.lineWidth = lineWidth;
    ctx.stroke();
    // Facet chords.
    ctx.lineWidth = Math.max(1, lineWidth * 0.5);
    for (var k = 0; k < chords.length; k++) {
      var a = verts[chords[k][0]], b = verts[chords[k][1]];
      ctx.beginPath();
      ctx.moveTo(CX + Math.cos(a.a) * a.r * R, CY + Math.sin(a.a) * a.r * R);
      ctx.lineTo(CX + Math.cos(b.a) * b.r * R, CY + Math.sin(b.a) * b.r * R);
      ctx.stroke();
    }
    // Inner hub: small seeded polygon echo.
    ctx.beginPath();
    for (var m = 0; m < NV; m++) {
      var w = verts[m];
      var hx = CX + Math.cos(w.a) * w.r * R * 0.38;
      var hy = CY + Math.sin(w.a) * w.r * R * 0.38;
      if (m === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy);
    }
    ctx.closePath();
    ctx.stroke();
  }

  function draw(t) {
    ctx.fillStyle = '#0a0a09';
    ctx.fillRect(0, 0, W, H);
    var e = envelope(t);
    recordPeaks(t, e);
    var d = desatAt(t);
    var stroke = mix(WHITE, GREY, d);
    var fill = mix(AMBER, GREY, d);
    // After-image ghosts: teal outlines fading over 1.4 s after each peak.
    for (var i = 0; i < peaks.length; i++) {
      var age = t - peaks[i].t;
      if (age < 0 && age > -0.01) age = 0;
      if (age >= 0 && age <= 1.4) {
        var ga = (1 - age / 1.4) * 0.5;
        var grow = 1 + age * 0.12;
        ctx.save();
        ctx.translate(CX, CY);
        ctx.scale(grow, grow);
        ctx.translate(-CX, -CY);
        drawForm(ga, TEAL, TEAL, 1);
        ctx.restore();
      }
    }
    // The form itself: never fully dark, never full white-on-black.
    // Partial contrast by construction: alpha floor 0.18, ceiling 0.72.
    var a = 0.18 + 0.54 * e;
    drawForm(a, stroke, fill, 2);
  }

  // ---- Interaction: drag left/right shifts the rate. Never click-to-reload. ----
  var dragging = false, lastX = 0;
  canvas.addEventListener('pointerdown', function (ev) {
    dragging = true;
    lastX = ev.clientX;
    ensureAudio();
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (!dragging) return;
    var dx = ev.clientX - lastX;
    lastX = ev.clientX;
    if (dx !== 0) drags.push({ t: clockT(), dx: dx });
  });
  function endDrag() { dragging = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---- Audio: sub-bass pulse, lazy, gesture-gated, never autoplay. ----
  // No AudioContext exists until the first pointerdown. Blips sound only
  // while the pointer is held down, locked to flash peaks.
  var actx = null, audioOn = false, lastBlipPhase = -1;
  function ensureAudio() {
    if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return;
    if (!actx) {
      var AC = typeof AudioContext !== 'undefined' ? AudioContext : webkitAudioContext;
      try { actx = new AC(); } catch (err) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
    audioOn = true;
  }
  function maybeBlip(t) {
    if (!audioOn || !actx || !dragging) return;
    var ph = Math.floor(phase);
    if (ph !== lastBlipPhase) {
      lastBlipPhase = ph;
      try {
        var o = actx.createOscillator();
        var g = actx.createGain();
        o.type = 'sine';
        o.frequency.value = 55;
        g.gain.setValueAtTime(0.0001, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.12, actx.currentTime + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.18);
        o.connect(g);
        g.connect(actx.destination);
        o.start();
        o.stop(actx.currentTime + 0.2);
      } catch (err) { /* silent if audio fails */ }
    }
  }

  // ---- Clock: frame one is draw(0); the clock starts with the rAF loop. ----
  var startTime = 0, started = false;
  function clockT() {
    if (!started) return 0;
    return (performance.now() - startTime) / 1000;
  }
  function loop() {
    var t = clockT();
    draw(t);
    maybeBlip(t);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  // Synchronous first frame at a constant phase.
  draw(0);
  if (typeof requestAnimationFrame !== 'undefined') {
    startTime = performance.now();
    started = true;
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
