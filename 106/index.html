<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№106 · Fossil Bed</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#1A1512; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(216,203,178,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to move the light</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function hash2(x,y){ let h=Math.imul(x,374761393)+Math.imul(y,668265263); h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296; }
function vnoise(x,y){ const ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy; const sx=fx*fx*(3-2*fx), sy=fy*fy*(3-2*fy); const a=hash2(ix,iy), b=hash2(ix+1,iy), c=hash2(ix,iy+1), d=hash2(ix+1,iy+1); return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy; }
function fbm(x,y,oct){ let v=0, amp=0.5, f=1, tot=0; for(let o=0;o<oct;o++){ v+=amp*vnoise(x*f,y*f); tot+=amp; amp*=0.5; f*=2.03; } return v/tot; }
function mixc(c1,c2,t){ return [c1[0]+(c2[0]-c1[0])*t, c1[1]+(c2[1]-c1[1])*t, c1[2]+(c2[2]-c1[2])*t]; }
function smooth(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }

// No.106 Fossil Bed: seeded PRNG "Fossil Bed". Static relief slab, 7 fossil imprints
// (1 dominant near centre-left + 6 smaller). Drag moves the relief light only.
const STRATA=[58,49,41], SEDIMENT=[107,91,69], BONE=[216,203,178], SHADOW=[26,21,18];
const DEFAULT_LIGHT=-Math.PI*0.75; // 45 degrees, upper left
let lightAngle=DEFAULT_LIGHT, dragging=false, needsRender=true;
let grid=null;

const rnd=mulberry(hashStr('Fossil Bed'));
const FOSSILS=[{ x:0.38, y:0.52, rx:0.205, ry:0.135, rot:-0.4, amp:1.0, phase:rnd()*6.28 }];
for(let k=0;k<6;k++){
  let fx=0, fy=0, tries=0;
  do { fx=0.10+rnd()*0.80; fy=0.10+rnd()*0.80; tries++; } while(Math.hypot(fx-0.38,fy-0.52)<0.30 && tries<40);
  FOSSILS.push({ x:fx, y:fy, rx:0.045+rnd()*0.04, ry:0.04+rnd()*0.035, rot:rnd()*Math.PI, amp:0.55+rnd()*0.3, phase:rnd()*6.28 });
}
if(FOSSILS.length!==7) console.assert(false,'fossils',FOSSILS.length);

function layout(w,h){
  const phone=isPhone();
  const RW=phone?w:Math.min(w,h), RH=phone?h:Math.min(w,h);
  const ox=(w-RW)/2, oy=(h-RH)/2;
  const m=Math.min(RW,RH)*(phone?0.025:0.045);
  return { x:ox+m, y:oy+m, w:RW-2*m, h:RH-2*m, cx:ox+RW/2, cy:oy+RH/2 };
}

function buildGrid(L){
  const cell=clamp(Math.min(L.w,L.h)/290,2.2,4);
  const cols=Math.max(8,Math.round(L.w/cell)), rows=Math.max(8,Math.round(L.h/cell));
  const H=new Float32Array(cols*rows), B=new Float32Array(cols*rows);
  for(let j=0;j<rows;j++){
    for(let i=0;i<cols;i++){
      const u=(i+0.5)/cols, v=(j+0.5)/rows;
      const wx=u+0.07*(fbm(u*1.9+13.1, v*1.9+7.7, 3)-0.5)*2;
      const wy=v+0.07*(fbm(u*1.9+3.3, v*1.9+21.9, 3)-0.5)*2;
      let h=0.5+(fbm(wx*4.2, wy*4.2, 4)-0.5)*0.55;
      h+= (1-v)*0.08;
      let bone=0;
      for(const f of FOSSILS){
        const dx=u-f.x, dy=v-f.y;
        const ca=Math.cos(f.rot), sa=Math.sin(f.rot);
        const lx=(dx*ca+dy*sa)/f.rx, ly=(-dx*sa+dy*ca)/f.ry;
        const ang=Math.atan2(ly,lx);
        const wob=1+0.34*(fbm(Math.cos(ang)*1.3+f.phase*3, Math.sin(ang)*1.3+f.phase, 2)-0.5)*2;
        const r=Math.hypot(lx,ly)*wob;
        if(r<1.4){
          const mask=smooth(1.05,0.35,r);
          const mottle=fbm(u*30+f.phase*5, v*30, 3);
          h+= -0.055*mask*f.amp + Math.exp(-Math.pow((r-1.02)*5,2))*0.03*f.amp + mask*(mottle-0.5)*0.03*f.amp;
          bone=Math.max(bone, mask*(0.50+0.40*mottle)*f.amp);
        }
      }
      H[j*cols+i]=h; B[j*cols+i]=bone;
    }
  }
  // base colour per cell (light applied at render time); grain folded in here
  const C=new Float32Array(cols*rows*3);
  for(let j=0;j<rows;j++){
    for(let i=0;i<cols;i++){
      const idx=j*cols+i;
      const tt=clamp(H[idx],0,1);
      const band=0.5+0.5*Math.sin(tt*13+fbm(i*0.05,j*0.05,2)*3);
      const patch=fbm(i*0.016+4.7, j*0.016+9.2, 2);
      let c=mixc(SHADOW,STRATA,smooth(0.02,0.34,tt));
      c=mixc(c,SEDIMENT, clamp(smooth(0.42,0.85,tt)*0.65+band*0.18,0,1));
      const bm=smooth(0.18,0.55,B[idx]);
      if(bm>0) c=mixc(c,BONE,bm);
      const g=0.93+0.14*hash2(i*3+11,j*3+7);
      C[idx*3]=c[0]*g; C[idx*3+1]=c[1]*g; C[idx*3+2]=c[2]*g;
    }
  }
  grid={ cols, rows, H, B, C, cellW:L.w/cols, cellH:L.h/rows };
}

function renderSlab(L){
  if(!grid) buildGrid(L);
  const { cols, rows, H, C, cellW, cellH }=grid;
  const Lx=Math.cos(lightAngle), Ly=Math.sin(lightAngle);
  const reliefK=0.26;
  for(let j=0;j<rows;j++){
    for(let i=0;i<cols;i++){
      const idx=j*cols+i;
      const hl=H[j*cols+Math.max(0,i-1)], hr=H[j*cols+Math.min(cols-1,i+1)];
      const hu=H[Math.max(0,j-1)*cols+i], hd=H[Math.min(rows-1,j+1)*cols+i];
      const slope=-((hr-hl)*Lx+(hd-hu)*Ly)*reliefK*cols;
      const bright=clamp(0.78+slope,0.52,1.10);
      const r=clamp(C[idx*3]*bright,0,255), gg=clamp(C[idx*3+1]*bright,0,255), bb=clamp(C[idx*3+2]*bright,0,255);
      ctx.fillStyle='rgb('+(r|0)+','+(gg|0)+','+(bb|0)+')';
      ctx.fillRect(L.x+i*cellW-0.4, L.y+j*cellH-0.4, cellW+0.8, cellH+0.8);
    }
  }
}

function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#1A1512'; ctx.fillRect(0,0,w,h);
  const L=layout(w,h);
  if(needsRender || !grid){ renderSlab(L); needsRender=false; }
  return { L };
}

let lastL=null;
function frameStore(nowMs){ const r=drawFrame(nowMs); lastL=r.L; }
canvas.addEventListener('pointerdown',e=>{ dragging=true; });
canvas.addEventListener('pointermove',e=>{
  if(!dragging||!lastL) return;
  const a=Math.atan2(e.clientY-lastL.cy, e.clientX-lastL.cx);
  const q=Math.round(a/(Math.PI/120))*(Math.PI/120);
  if(Math.abs(q-lightAngle)>0.001){ lightAngle=q; needsRender=true; }
});
function endP(){ if(dragging){ dragging=false; lightAngle=DEFAULT_LIGHT; needsRender=true; } }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ frameStore(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
frameStore(1000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>{ grid=null; needsRender=true; frameStore(performance.now()); });
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>{ grid=null; needsRender=true; frameStore(performance.now()); });
</script>
</body>
</html>
