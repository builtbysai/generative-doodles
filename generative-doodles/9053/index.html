<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>№9053 · Misregister</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f7f4ec; overflow: hidden; }
  canvas { display: block; }
  .cap { position: fixed; left: 14px; bottom: 10px; font: italic 12px Georgia, serif;
         color: #8a8478; user-select: none; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">№9053 · Misregister · click for another pull</div>
<script>
// Misregister: one geometric form pulled three times — cyan, magenta,
// yellow — each slightly offset and rotated, like a misregistered print.
// The form is nested rotated squares; the misregistration makes the color.
let seed = 42;
const q = new URLSearchParams(location.search);
if (q.has('seed')) seed = parseInt(q.get('seed'), 10) || 42;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function render() {
  const rnd = mulberry32(seed);
  const canvas = document.getElementById('c');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  ctx.fillStyle = '#f7f4ec';
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;
  const S = Math.min(W, H);
  const baseR = S * 0.34;

  // the form: nested rotated squares, count and twist from seed
  const layers = 9 + ((rnd() * 5) | 0);
  const twist = 0.12 + rnd() * 0.25;
  const wob = rnd() * 0.06;

  // three plates: C, M, Y with offsets
  const plates = [
    { color: '#00a3c8', dx: (rnd() - 0.5) * 26, dy: (rnd() - 0.5) * 26, rot: (rnd() - 0.5) * 0.05 },
    { color: '#d8367f', dx: (rnd() - 0.5) * 26, dy: (rnd() - 0.5) * 26, rot: (rnd() - 0.5) * 0.05 },
    { color: '#e8b400', dx: (rnd() - 0.5) * 26, dy: (rnd() - 0.5) * 26, rot: (rnd() - 0.5) * 0.05 },
  ];

  ctx.globalCompositeOperation = 'multiply';
  ctx.lineCap = 'round';

  for (const pl of plates) {
    ctx.strokeStyle = pl.color;
    ctx.globalAlpha = 0.85;
    for (let l = 0; l < layers; l++) {
      const t = l / (layers - 1);
      const r = baseR * (1 - t * 0.82);
      const rot = t * twist * layers * 0.5 + pl.rot;
      ctx.lineWidth = 1 + (1 - t) * 2.2;
      ctx.beginPath();
      for (let k = 0; k <= 4; k++) {
        const a = rot + (k / 4) * Math.PI * 2 + Math.PI / 4;
        // slight hand wobble per corner
        const rr = r * (1 + (rnd() - 0.5) * wob);
        const x = cx + pl.dx + Math.cos(a) * rr;
        const y = cy + pl.dy + Math.sin(a) * rr;
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // registration marks in the corners, also misregistered
  ctx.globalCompositeOperation = 'multiply';
  for (const pl of plates) {
    ctx.strokeStyle = pl.color;
    ctx.globalAlpha = 0.7;
    ctx.lineWidth = 1.2;
    const m = 34;
    for (const [mx, my] of [[m, m], [W - m, m], [m, H - m], [W - m, H - m]]) {
      ctx.beginPath();
      ctx.arc(mx + pl.dx * 0.4, my + pl.dy * 0.4, 7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(mx + pl.dx * 0.4 - 11, my + pl.dy * 0.4);
      ctx.lineTo(mx + pl.dx * 0.4 + 11, my + pl.dy * 0.4);
      ctx.moveTo(mx + pl.dx * 0.4, my + pl.dy * 0.4 - 11);
      ctx.lineTo(mx + pl.dx * 0.4, my + pl.dy * 0.4 + 11);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

render();
window.addEventListener('resize', render);
window.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  render();
});
</script>
</body>
</html>
