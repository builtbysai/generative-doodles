<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>№9052 · Weave</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #101418; overflow: hidden; }
  canvas { display: block; }
  .cap { position: fixed; left: 14px; bottom: 10px; font: italic 12px Georgia, serif;
         color: #5a6a72; user-select: none; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">№9052 · Weave · click for another threading</div>
<script>
// Weave: warp and weft threads crossing in plain weave — each thread
// alternates over/under at every crossing, like real cloth.
// Inspired by the plotter-weaving current, threaded originally.
let seed = 42;
const q = new URLSearchParams(location.search);
if (q.has('seed')) seed = parseInt(q.get('seed'), 10) || 42;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function render() {
  const rnd = mulberry32(seed);
  const canvas = document.getElementById('c');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  ctx.fillStyle = '#101418';
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;
  const size = Math.min(W, H) * 0.78;
  const x0 = cx - size / 2, y0 = cy - size / 2;

  const n = 14 + ((rnd() * 8) | 0); // threads per direction
  const gap = size / n;
  const wobAmp = gap * (0.15 + rnd() * 0.2);
  const wobFreq = 2 + ((rnd() * 3) | 0);

  const ink = '#e8e2d4';
  const ink2 = '#c9bfa8';
  ctx.lineCap = 'round';

  // thread path with sine wobble
  function warpPath(i) {
    const pts = [];
    const yBase = y0 + i * gap;
    for (let s = 0; s <= 120; s++) {
      const x = x0 + (s / 120) * size;
      const y = yBase + Math.sin((s / 120) * Math.PI * wobFreq + i * 0.7) * wobAmp;
      pts.push([x, y]);
    }
    return pts;
  }
  function weftPath(j) {
    const pts = [];
    const xBase = x0 + j * gap;
    for (let s = 0; s <= 120; s++) {
      const y = y0 + (s / 120) * size;
      const x = xBase + Math.sin((s / 120) * Math.PI * wobFreq + j * 0.7 + 1.3) * wobAmp;
      pts.push([x, y]);
    }
    return pts;
  }

  // draw order: for plain weave, at crossing (i,j), warp is over if (i+j) even
  // draw all under-segments first, then over-segments with gaps

  // pass 1: draw full threads in dimmer ink (the unders)
  ctx.strokeStyle = ink2;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.5;
  for (let i = 0; i < n; i++) {
    ctx.beginPath();
    warpPath(i).forEach((p, s) => { if (s === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
    ctx.stroke();
    ctx.beginPath();
    weftPath(i).forEach((p, s) => { if (s === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // pass 2: over-segments in bright ink with paper gap underneath
  const segLen = 120 / n; // approx samples per cell
  for (let i = 0; i < n; i++) {
    const wp = warpPath(i);
    for (let j = 0; j < n; j++) {
      if ((i + j) % 2 !== 0) continue; // warp over at even parity
      const c = Math.round((j + 0.5) * segLen);
      const a = Math.max(0, c - 7), b = Math.min(120, c + 7);
      // gap
      ctx.strokeStyle = '#101418';
      ctx.lineWidth = 7;
      ctx.beginPath();
      for (let s = a; s <= b; s++) {
        if (s === a) ctx.moveTo(wp[s][0], wp[s][1]); else ctx.lineTo(wp[s][0], wp[s][1]);
      }
      ctx.stroke();
      // bright over-segment
      ctx.strokeStyle = ink;
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      for (let s = a; s <= b; s++) {
        if (s === a) ctx.moveTo(wp[s][0], wp[s][1]); else ctx.lineTo(wp[s][0], wp[s][1]);
      }
      ctx.stroke();
    }
    const fp = weftPath(i);
    for (let j = 0; j < n; j++) {
      if ((i + j) % 2 !== 1) continue; // weft over at odd parity
      const c = Math.round((j + 0.5) * segLen);
      const a = Math.max(0, c - 7), b = Math.min(120, c + 7);
      ctx.strokeStyle = '#101418';
      ctx.lineWidth = 7;
      ctx.beginPath();
      for (let s = a; s <= b; s++) {
        if (s === a) ctx.moveTo(fp[s][0], fp[s][1]); else ctx.lineTo(fp[s][0], fp[s][1]);
      }
      ctx.stroke();
      ctx.strokeStyle = ink;
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      for (let s = a; s <= b; s++) {
        if (s === a) ctx.moveTo(fp[s][0], fp[s][1]); else ctx.lineTo(fp[s][0], fp[s][1]);
      }
      ctx.stroke();
    }
  }

  ctx.fillStyle = '#5a6a72';
  ctx.font = 'italic 11px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText(n + '×' + n + ' plain weave', cx, y0 + size + 28);
}

render();
window.addEventListener('resize', render);
window.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  render();
});
</script>
</body>
</html>
