<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>№9054 · Dusk Shore</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a1620; overflow: hidden;
               display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges;
           height: 100vh; max-width: 100vw; aspect-ratio: 2/3; }
  .cap { position: fixed; left: 14px; bottom: 10px; font: italic 12px Georgia, serif;
         color: #5a6a72; user-select: none; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c" width="160" height="240"></canvas>
<div class="cap">№9054 · Dusk Shore · click for another evening</div>
<script>
// Dusk Shore: a pixel-art beach from above at sunset, drawn with code.
// Low-res grid scaled up with crisp pixels. Water breathes, waves roll,
// sun glitter twinkles, tiny figures wait at the water's edge.
let seed = 42;
const q = new URLSearchParams(location.search);
if (q.has('seed')) seed = parseInt(q.get('seed'), 10) || 42;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const GW = 160, GH = 240;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let rnd, figures, glints, waves;

function init() {
  rnd = mulberry32(seed);
  // sun glitter positions (concentrated upper-center)
  glints = [];
  for (let i = 0; i < 90; i++) {
    const gx = 80 + (rnd() - 0.5) * 110 * (0.4 + rnd() * 0.6);
    const gy = rnd() * 110;
    glints.push({ x: gx | 0, y: gy | 0, ph: rnd() * Math.PI * 2, sp: 1 + rnd() * 3 });
  }
  // wave bands: y position, speed, length
  waves = [];
  for (let i = 0; i < 14; i++) {
    waves.push({
      y: 20 + rnd() * 120,
      sp: 0.3 + rnd() * 0.7,
      len: 20 + rnd() * 60,
      x: rnd() * GW,
      bright: rnd() > 0.4
    });
  }
  // tiny figures along the shore
  figures = [];
  const nf = 4 + ((rnd() * 3) | 0);
  for (let i = 0; i < nf; i++) {
    figures.push({
      x: 20 + rnd() * 120,
      dark: rnd() > 0.25,
      ph: rnd() * Math.PI * 2
    });
  }
}

// water color: deep navy-teal at top -> turquoise near shore
function waterColor(y, shoreY) {
  const t = Math.min(1, Math.max(0, y / shoreY));
  // deep #0e2a3a -> mid #1a5a6a -> light #3aa88f
  const c1 = [14, 42, 58], c2 = [26, 90, 106], c3 = [58, 168, 143];
  let a, b, f;
  if (t < 0.55) { a = c1; b = c2; f = t / 0.55; }
  else { a = c2; b = c3; f = (t - 0.55) / 0.45; }
  return [a[0] + (b[0] - a[0]) * f | 0, a[1] + (b[1] - a[1]) * f | 0, a[2] + (b[2] - a[2]) * f | 0];
}

function shoreAt(x, t) {
  // scalloped shoreline, base at y=165, breathing with time
  return 165
    + Math.sin(x * 0.09 + t * 0.5) * 7
    + Math.sin(x * 0.023 + 1.7 + t * 0.23) * 10
    + Math.sin(x * 0.21 + t * 0.9) * 2.5;
}

let start = null;
function frame(ts) {
  if (!start) start = ts;
  const t = (ts - start) / 1000;

  const img = ctx.createImageData(GW, GH);
  const d = img.data;

  // precompute shore per column
  const shore = [];
  for (let x = 0; x < GW; x++) shore[x] = shoreAt(x, t);

  for (let y = 0; y < GH; y++) {
    for (let x = 0; x < GW; x++) {
      const i = (y * GW + x) * 4;
      const sy = shore[x];
      if (y < sy - 3) {
        // water
        const c = waterColor(y, sy);
        // subtle moving caustic shimmer
        const sh = Math.sin(x * 0.3 + t * 2 + y * 0.12) * 6;
        d[i] = Math.max(0, c[0] + sh); d[i + 1] = Math.max(0, c[1] + sh); d[i + 2] = Math.max(0, c[2] + sh);
        d[i + 3] = 255;
      } else if (y < sy + 2) {
        // foam edge: white with flicker
        const fl = Math.sin(x * 0.5 + t * 4) > -0.2 ? 255 : 230;
        d[i] = fl; d[i + 1] = fl; d[i + 2] = fl - 8; d[i + 3] = 255;
      } else {
        // sand: pale tan with grain
        const g = Math.sin(x * 12.9 + y * 78.2 + seed) * 8;
        const wet = Math.max(0, 1 - (y - sy) / 26); // wet band near water
        d[i] = 232 - wet * 40 + g;
        d[i + 1] = 214 - wet * 34 + g;
        d[i + 2] = 178 - wet * 26 + g;
        d[i + 3] = 255;
      }
    }
  }

  // wave caps: horizontal streaks drifting
  for (const w of waves) {
    w.x += w.sp * 0.35;
    if (w.x - w.len > GW) { w.x = -w.len; w.y = 20 + rnd() * 120; }
    const yy = w.y | 0;
    if (yy < 0 || yy >= GH) continue;
    for (let x = Math.max(0, w.x | 0); x < Math.min(GW, (w.x + w.len) | 0); x++) {
      if (yy > shore[x] - 4) continue;
      const i = (yy * GW + x) * 4;
      const b = w.bright ? 235 : 200;
      d[i] = b; d[i + 1] = b + 8 > 255 ? 255 : b + 8; d[i + 2] = b + 15 > 255 ? 255 : b + 15;
    }
  }

  // sun glitter: twinkling gold pixels
  for (const g of glints) {
    const tw = Math.sin(t * g.sp + g.ph);
    if (tw < 0.55) continue;
    if (g.y > shore[g.x] - 4) continue;
    const i = (g.y * GW + g.x) * 4;
    const warm = 200 + tw * 55;
    d[i] = warm; d[i + 1] = warm * 0.82 | 0; d[i + 2] = warm * 0.45 | 0;
  }

  ctx.putImageData(img, 0, 0);

  // figures: 2x3 pixel people at the water's edge, bobbing
  for (const f of figures) {
    const sy = shore[f.x | 0];
    const bob = Math.sin(t * 2 + f.ph) > 0 ? 0 : 1;
    const fx = f.x | 0, fy = (sy + 3 + bob) | 0;
    ctx.fillStyle = f.dark ? '#1a1a22' : '#d8a83a';
    ctx.fillRect(fx - 1, fy, 3, 1);     // shoulders
    ctx.fillRect(fx, fy + 1, 1, 2);     // body
  }

  requestAnimationFrame(frame);
}

init();
requestAnimationFrame(frame);

window.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  init();
});
</script>
</body>
</html>
