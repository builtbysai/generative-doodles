<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1973 Hyper-Real</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0b0d; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Hyper-Real, TL6 / PP1220, study #257 theodora-laird.
  // A clean diptych, equal halves, a thin pure black gutter
  // between them, 2% of the width. The same figure sits at the
  // same position in both panels, and the two panels never
  // merge, never exchange elements.
  // Left panel, the solo room: monochrome, nearly silent. The
  // figure composes at a desk, erases, composes again, in the
  // TL1 white-whale cycle: a composition builds for 14 s,
  // holds almost complete for 1 s, then dissolves for 7 s, and
  // only a single bare line survives on the paper. The motions
  // are small and deliberate.
  // Right panel, the live room: the same monochrome figure with
  // a band of warm amber energies moving around her, orbiting
  // light trails, pulsing rings, ribbons of warm light. The
  // improvisation never stops and never rests.
  // Watch-only. The separation is the content: the left panel
  // is authored alone, the right is played together, and the
  // gutter is the boundary she guards.
  var GROUND = '#0b0b0d';  // near-black ground, page ground
  var PANEL_L = '#161619'; // left panel ground, cool dark gray
  var PANEL_R = '#1b1813'; // right panel ground, warm dark
  var GUTTER = '#000000';  // pure black gutter
  var SILVER = '#c9c9c6';  // monochrome figure, silver
  var SILVERHI = '#e8e8e4';// figure highlight, near white
  var GRAY = '#8a8d90';    // monochrome mid gray
  var ASH = '#6e6a62';     // dissolution, ash gray
  var INK = '#1a1a1a';     // marks on the paper
  var PAPER = '#cfcfc8';   // the paper on the desk
  var AMBER = '#e8a33d';   // warm moving energies
  var AMBERHI = '#f7c65a'; // energy highlight
  var AMBERLO = '#8a5f1f'; // dim amber

  // Fixed-phase first frame: FIRST_T = 12 s. The 22 s cycle
  // builds for 14 s, so at t = 12 the left panel is almost
  // complete: the staff is mostly traced, the notes mostly
  // placed, nothing has started to fray yet, and the survivor
  // line runs steady on the paper. The right panel energies
  // are mid orbit.
  var FIRST_T = 12;
  var SEED = 1973;
  var CYC = 22;       // cycle length in seconds
  var BUILD = 14;     // build phase length
  var HOLD = 1;       // almost-complete hold
  var AGENTS = 12;    // energy agents in the right panel

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Deterministic hash: a pure function of its integer inputs,
  // so every frame is a pure function of the clock.
  function hash(n) {
    var s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return s - Math.floor(s);
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function lerp(a, b, k) { return a + (b - a) * k; }
  function ease(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
  function hexRGB(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mix(h1, h2, k) {
    var a = hexRGB(h1), b = hexRGB(h2);
    return 'rgba(' + Math.round(lerp(a[0], b[0], k)) + ',' + Math.round(lerp(a[1], b[1], k)) + ',' + Math.round(lerp(a[2], b[2], k)) + ',';
  }
  function colA(h, a) { return mix(h, h, 0) + a4(a) + ')'; }
  function colMix(h1, h2, k, a) { return mix(h1, h2, k) + a4(a) + ')'; }

  var L = {};
  function layout() {
    var u = Math.min(W, H);
    L.u = u;
    L.gutter = W * 0.02;
    L.pw = (W - L.gutter) / 2;
    L.leftCx = L.pw / 2;
    L.rightCx = L.pw + L.gutter + L.pw / 2;
    L.paperHalf = Math.min(u * 0.17, L.pw * 0.44);
    L.figCY = H * 0.44; // energy orbit centre, right panel
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Composition state --------------------------------------
  // Closed-form cycle of the composition clock c, as in TL1.
  // Build 0 to 14, almost-complete hold 14 to 15, dissolve 15
  // to 22. The form never quite reaches 1: it tops out at
  // 0.97, then unravels. Returns { s, d, phase, p } where s is
  // completeness 0..0.97 and d is dissolution 0..1.
  function compState(c) {
    var p = ((c % CYC) + CYC) % CYC;
    var s, d, phase;
    if (p < BUILD) {
      s = 0.97 * ease(p / BUILD);
      d = 0;
      phase = (p < 12) ? 'BUILDING' : 'ALMOST';
    } else if (p < BUILD + HOLD) {
      s = 0.97;
      d = 0;
      phase = 'ALMOST';
    } else {
      var q = (p - BUILD - HOLD) / (CYC - BUILD - HOLD);
      d = ease(q);
      s = 0.97 * (1 - ease(q));
      phase = (s < 0.05) ? 'ONE LINE' : 'UNRAVELLING';
    }
    return { s: s, d: d, phase: phase, p: p };
  }

  // ---- Shared figure rig --------------------------------------
  // The same figure in both panels: same head, same shoulders,
  // same torso, same seat height. Only the arms differ: in the
  // solo room the right hand works the paper in small deliberate
  // sweeps; in the live room both arms open out and sway with
  // the energies. cx is the figure centre, identical relative
  // position inside each panel.
  function drawFigure(cx, mode, t, st) {
    var u = L.u;
    var headR = u * 0.048;
    var hx = cx, hy = H * 0.335;
    var shLx = cx - u * 0.085, shRx = cx + u * 0.085, shY = H * 0.415;
    var waistY = H * 0.60;
    // Torso: a draped shape, shoulders to the desk line.
    ctx.beginPath();
    ctx.moveTo(shLx, shY);
    ctx.quadraticCurveTo(cx - u * 0.105, H * 0.50, cx - u * 0.105, waistY);
    ctx.lineTo(cx + u * 0.105, waistY);
    ctx.quadraticCurveTo(cx + u * 0.105, H * 0.50, shRx, shY);
    ctx.quadraticCurveTo(cx, shY + u * 0.02, shLx, shY);
    ctx.closePath();
    ctx.fillStyle = colA(SILVER, a4(0.10));
    ctx.fill();
    ctx.strokeStyle = colA(SILVER, a4(0.55));
    ctx.lineWidth = Math.max(1.5, u * 0.004);
    ctx.stroke();
    // Head and bun, monochrome in both panels.
    ctx.fillStyle = colA(SILVERHI, a4(0.92));
    ctx.beginPath();
    ctx.moveTo(hx + headR, hy);
    ctx.arc(hx, hy, headR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = colA(SILVER, a4(0.85));
    ctx.beginPath();
    ctx.moveTo(hx + headR * 0.42, hy - headR * 1.02);
    ctx.arc(hx, hy - headR * 1.02, headR * 0.42, 0, Math.PI * 2);
    ctx.fill();
    // Neck.
    ctx.strokeStyle = colA(SILVER, a4(0.6));
    ctx.lineWidth = Math.max(1.5, u * 0.005);
    ctx.beginPath();
    ctx.moveTo(cx, hy + headR * 0.9);
    ctx.lineTo(cx, shY);
    ctx.stroke();
    // Warm rim on the head in the live room only: the energies
    // light her, they do not change her.
    if (mode === 'open') {
      ctx.strokeStyle = colA(AMBER, a4(0.30));
      ctx.lineWidth = Math.max(1, u * 0.002);
      ctx.beginPath();
      ctx.moveTo(hx + headR + 2, hy);
      ctx.arc(hx, hy, headR + 2, 0, Math.PI * 2);
      ctx.stroke();
    }
    // Arms.
    ctx.strokeStyle = colA(SILVER, a4(0.70));
    ctx.lineWidth = Math.max(2, u * 0.006);
    if (mode === 'compose') {
      // Right hand works the paper: a slow sweep left and
      // right while building, lifting and stilling as the
      // composition dissolves. Left hand rests on the paper.
      var sweep = Math.sin(t * 0.45) * L.paperHalf * 0.65 * (1 - st.d * 0.6);
      var handX = cx + sweep;
      var handY = H * 0.635 - st.d * u * 0.03;
      ctx.beginPath();
      ctx.moveTo(shRx, shY);
      ctx.lineTo(cx + u * 0.115, H * 0.52);
      ctx.lineTo(handX, handY);
      ctx.stroke();
      ctx.fillStyle = colA(SILVERHI, a4(0.9));
      ctx.beginPath();
      ctx.moveTo(handX + u * 0.012, handY);
      ctx.arc(handX, handY, u * 0.012, 0, Math.PI * 2);
      ctx.fill();
      var lHandX = cx - u * 0.055;
      var lHandY = H * 0.625 + Math.sin(t * 0.3) * u * 0.002;
      ctx.strokeStyle = colA(SILVER, a4(0.70));
      ctx.beginPath();
      ctx.moveTo(shLx, shY);
      ctx.lineTo(cx - u * 0.105, H * 0.52);
      ctx.lineTo(lHandX, lHandY);
      ctx.stroke();
      ctx.fillStyle = colA(SILVERHI, a4(0.9));
      ctx.beginPath();
      ctx.moveTo(lHandX + u * 0.012, lHandY);
      ctx.arc(lHandX, lHandY, u * 0.012, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Arms open out, swaying slowly with the energies.
      var sway = Math.sin(t * 0.4) * u * 0.008;
      var sway2 = Math.sin(t * 0.4 + 1.3) * u * 0.008;
      ctx.beginPath();
      ctx.moveTo(shLx, shY);
      ctx.lineTo(cx - u * 0.15, H * 0.50);
      ctx.lineTo(cx - u * 0.19, H * 0.46 + sway);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(shRx, shY);
      ctx.lineTo(cx + u * 0.15, H * 0.50);
      ctx.lineTo(cx + u * 0.19, H * 0.46 + sway2);
      ctx.stroke();
      ctx.fillStyle = colA(SILVERHI, a4(0.9));
      ctx.beginPath();
      ctx.moveTo(cx - u * 0.19 + u * 0.012, H * 0.46 + sway);
      ctx.arc(cx - u * 0.19, H * 0.46 + sway, u * 0.012, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx + u * 0.19 + u * 0.012, H * 0.46 + sway2);
      ctx.arc(cx + u * 0.19, H * 0.46 + sway2, u * 0.012, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Left panel: the solo room -------------------------------
  function drawLeft(t, st) {
    var cx = L.leftCx, u = L.u;
    // Desk line across the panel.
    ctx.strokeStyle = colA(GRAY, a4(0.6));
    ctx.lineWidth = Math.max(1.5, u * 0.003);
    ctx.beginPath();
    ctx.moveTo(8, H * 0.60);
    ctx.lineTo(L.pw - 8, H * 0.60);
    ctx.stroke();
    drawFigure(cx, 'compose', t, st);
    // Paper on the desk.
    var px = cx - L.paperHalf, py = H * 0.615;
    var pw2 = L.paperHalf * 2, ph = u * 0.13;
    ctx.fillStyle = colA(PAPER, a4(0.94));
    ctx.fillRect(px, py, pw2, ph);
    ctx.strokeStyle = colA(INK, a4(0.35));
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, pw2 - 1, ph - 1);
    var lx0 = px + pw2 * 0.08, lx1 = px + pw2 * 0.92;
    // Staff lines: five lines traced left to right as the
    // composition builds, fading as it dissolves.
    var i;
    for (i = 0; i < 5; i++) {
      var ly = py + ph * (0.20 + i * 0.15);
      var seg = (lx1 - lx0) * st.s;
      ctx.strokeStyle = colA(INK, a4(0.55 * (1 - st.d * 0.7)));
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(lx0, ly);
      ctx.lineTo(lx0 + seg, ly);
      ctx.stroke();
    }
    // Notes: sixteen marks placed on the staff, appearing in
    // turn as completeness grows, fading and drifting as the
    // composition is erased.
    for (i = 0; i < 16; i++) {
      var thr = i / 16;
      if (st.s < thr) { continue; }
      var nx = lx0 + hash(SEED + 300 + i * 7) * (lx1 - lx0);
      var nline = Math.floor(hash(SEED + 400 + i * 11) * 5);
      var ny = py + ph * (0.20 + nline * 0.15);
      var na = 0.85 * (1 - st.d);
      if (na <= 0.01) { continue; }
      var drift = st.d * (hash(SEED + 500 + i * 13) - 0.5) * 6;
      ctx.fillStyle = colA(INK, a4(na));
      ctx.beginPath();
      ctx.moveTo(nx + 3, ny + drift);
      ctx.arc(nx, ny + drift, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    // Survivor line: the single bare line that stays on the
    // paper after everything else is erased.
    ctx.strokeStyle = colA(INK, a4(0.9));
    ctx.lineWidth = Math.max(1.5, u * 0.003);
    ctx.beginPath();
    ctx.moveTo(lx0, py + ph * 0.90);
    ctx.lineTo(lx1, py + ph * 0.90);
    ctx.stroke();
  }

  // ---- Right panel: the live room ------------------------------
  function drawRight(t) {
    var cx = L.rightCx, u = L.u;
    var cy = L.figCY;
    var x0 = L.pw + L.gutter, x1 = W;
    // Warm glow behind the figure.
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, u * 0.26);
    g.addColorStop(0, 'rgba(232,163,61,0.14)');
    g.addColorStop(1, 'rgba(232,163,61,0)');
    ctx.fillStyle = g;
    ctx.fillRect(cx - u * 0.26, cy - u * 0.26, u * 0.52, u * 0.52);
    // Pulsing rings around the figure.
    var ri;
    for (ri = 0; ri < 2; ri++) {
      var rr = (ri === 0 ? u * 0.13 : u * 0.19) * (1 + 0.06 * Math.sin(t * 0.5 + ri * 1.5));
      ctx.strokeStyle = colA(AMBER, a4(ri === 0 ? 0.10 : 0.07));
      ctx.lineWidth = Math.max(1, u * 0.002);
      ctx.beginPath();
      ctx.moveTo(cx + rr, cy);
      ctx.arc(cx, cy, rr, 0, Math.PI * 2);
      ctx.stroke();
    }
    // Ribbons of warm light flowing across the panel.
    var k, px, py;
    for (k = 0; k < 3; k++) {
      var ry = H * (0.30 + k * 0.14);
      ctx.strokeStyle = colA(AMBER, a4(0.12 - k * 0.02));
      ctx.lineWidth = Math.max(1.2, u * 0.002);
      ctx.beginPath();
      var started = false;
      for (px = x0; px <= x1; px += (x1 - x0) / 40) {
        py = ry + Math.sin(px * 0.012 + t * 0.3 + k * 1.7) * H * 0.02;
        if (!started) { ctx.moveTo(px, py); started = true; }
        else { ctx.lineTo(px, py); }
      }
      ctx.stroke();
    }
    // Energy agents: twelve lights on two ellipses around the
    // figure, inner ring one way, outer ring the other, each
    // with a short trail behind it. They never rest.
    var i, a, ang, ex, ey, rx, ry2, dir, spd, ph0, sz;
    for (i = 0; i < AGENTS; i++) {
      var inner = (i % 2 === 0);
      rx = inner ? u * 0.16 : u * 0.225;
      ry2 = inner ? u * 0.115 : u * 0.16;
      dir = inner ? 1 : -1;
      spd = inner ? (Math.PI * 2) / 9 : (Math.PI * 2) / 13;
      ph0 = hash(SEED + 700 + i * 29) * Math.PI * 2;
      sz = (inner ? u * 0.008 : u * 0.011) * (0.8 + hash(SEED + 800 + i * 31) * 0.4);
      ang = ph0 + dir * spd * t;
      // Trail: a short arc of the ellipse behind the agent,
      // drawn as a polyline so it never becomes a batched
      // ellipse subpath.
      ctx.strokeStyle = colA(AMBER, a4(0.35));
      ctx.lineWidth = Math.max(1.5, u * 0.003);
      ctx.beginPath();
      var ts;
      for (ts = 0; ts <= 10; ts++) {
        a = ang - dir * 0.5 * (ts / 10);
        ex = cx + rx * Math.cos(a);
        ey = cy + ry2 * Math.sin(a);
        if (ts === 0) { ctx.moveTo(ex, ey); }
        else { ctx.lineTo(ex, ey); }
      }
      ctx.stroke();
      ex = cx + rx * Math.cos(ang);
      ey = cy + ry2 * Math.sin(ang);
      // Glow, then core.
      ctx.fillStyle = colA(AMBERHI, a4(0.18));
      ctx.beginPath();
      ctx.moveTo(ex + sz * 2.2, ey);
      ctx.arc(ex, ey, sz * 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = colA(AMBERHI, a4(0.95));
      ctx.beginPath();
      ctx.moveTo(ex + sz, ey);
      ctx.arc(ex, ey, sz, 0, Math.PI * 2);
      ctx.fill();
    }
    drawFigure(cx, 'open', t, null);
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var st = compState(t);

    // Page ground is the piece's own near-black.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // The two panels and the gutter between them.
    ctx.fillStyle = PANEL_L;
    ctx.fillRect(0, 0, L.pw, H);
    ctx.fillStyle = PANEL_R;
    ctx.fillRect(L.pw + L.gutter, 0, L.pw, H);
    ctx.fillStyle = GUTTER;
    ctx.fillRect(L.pw, 0, L.gutter, H);

    // Left panel content, clipped to its half so nothing
    // crosses the gutter.
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, L.pw, H);
    ctx.clip();
    drawLeft(t, st);
    ctx.restore();

    // Right panel content, clipped the same way.
    ctx.save();
    ctx.beginPath();
    ctx.rect(L.pw + L.gutter, 0, L.pw, H);
    ctx.clip();
    drawRight(t);
    ctx.restore();

    // ---- Plates: title top-left, number and date below it.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = SILVERHI;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Hyper-Real', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = colA(GRAY, a4(0.9));
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1973 · 2007 · 06 · 07', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.fillStyle = colA(GRAY, a4(0.7));
    ctx.fillText('TL6 · PP1220', 18, 18 + fsTitle * 0.8 + fsSub * 2 + 16);

    // ---- State word, top-right: the left panel cycle phase.
    var fsState = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    ctx.font = '600 ' + fsState + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = (st.phase === 'UNRAVELLING' || st.phase === 'ONE LINE') ? colA(ASH, a4(0.95)) : colA(SILVERHI, a4(0.95));
    ctx.fillText(st.phase, W - 18, 18 + fsState);
    ctx.textAlign = 'left';

    // ---- Panel captions, centred low in each panel.
    var fsCap = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    ctx.font = '600 ' + fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = colA(SILVER, a4(0.75));
    ctx.fillText('T H E   S O L O   R O O M', L.leftCx, H - 44);
    ctx.fillStyle = colA(AMBER, a4(0.85));
    ctx.fillText('T H E   L I V E   R O O M', L.rightCx, H - 44);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom, dark pill.
    var hint = 'Watch only.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = 'rgba(20,20,22,0.92)';
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = colA(SILVER, a4(0.4));
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
    ctx.fillStyle = SILVERHI;
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1973 exposes the composition state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1973 = {
      firstT: FIRST_T,
      state: function (t) { return compState(t); },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: the left panel builds, almost lands, and
  // unravels on a 22 s closed-form cycle; the right panel
  // energies orbit and pulse without pause. All motion is on
  // multi second timescales, well under the 14 Hz ceiling.
  // Guarded so node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
