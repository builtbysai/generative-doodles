<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Not a Quasicrystal</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F4F1E8; }
  canvas { display:block; touch-action:none; }
  #hint { position:fixed; left:0; right:0; bottom:10px; text-align:center;
    font:12px system-ui, sans-serif; color:#1A1A1A; opacity:0.55;
    pointer-events:none; letter-spacing:0.04em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">tap to x-ray the hidden grid</div>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
  build();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function smooth(v) { v = clamp01(v); return v * v * (3 - 2 * v); }

// Bonner's forensic rebuttal (his Fig. 223g, the Darb-i Imam
// shrine): a field of ten pointed stars that reads as
// quasiperiodic scatter. It is nothing of the kind. The stars
// are generated FROM a perfectly periodic tessellation of
// decagons and bow ties, wallpaper group cmm: each decagon
// carries a {10/3} star by the polygonal technique, each bow
// tie a pair of diamonds. Tap and the tessellation itself is
// X-rayed in red over the stars: it draws on from the tap
// point over two seconds, holds three, then fades. The grid
// was never hidden; it was the drawing.
var decs = [];   // {x, y} decagon centres
var ties = [];   // {x, y, rot} bow tie centres
var R = 100;     // decagon circumradius

function build() {
  decs = []; ties = [];
  if (!W || !H) return;
  R = Math.min(W, H) * 0.145;
  var dx = R * 2.28, dy = R * 1.98;
  var cx0 = W / 2, cy0 = H / 2;
  var ni = Math.ceil(W / dx) + 2, nj = Math.ceil(H / dy) + 2;
  var i, j, x, y;
  for (j = -nj; j <= nj; j++) for (i = -ni; i <= ni; i++) {
    x = cx0 + i * dx + (Math.abs(j) % 2 ? dx / 2 : 0);
    y = cy0 + j * dy;
    decs.push({ x: x, y: y });
    ties.push({ x: x + dx / 2, y: y, rot: 0 });
    ties.push({ x: x + dx / 4, y: y + dy / 2, rot: Math.PI / 2 });
  }
}

function starPolyPath(cx, cy, r, n, k, rot) {
  // the true {n/k} star polygon: one continuous path through
  // every kth vertex of the n-gon, crossings and all
  ctx.beginPath();
  for (var i = 0; i <= n; i++) {
    var idx = (i * k) % n;
    var a = rot + idx * Math.PI * 2 / n;
    var x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function polyPath(cx, cy, r, n, rot) {
  ctx.beginPath();
  for (var i = 0; i < n; i++) {
    var a = rot + i * Math.PI * 2 / n;
    var x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}
function tiePath(cx, cy, w, h, rot) {
  var pts = [[-w / 2, -h / 2], [w / 2, -h / 2], [0, 0], [w / 2, h / 2], [-w / 2, h / 2], [0, 0]];
  var c = Math.cos(rot), s = Math.sin(rot);
  ctx.beginPath();
  pts.forEach(function (p, k) {
    var x = cx + p[0] * c - p[1] * s, y = cy + p[0] * s + p[1] * c;
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
}
function diamond(cx, cy, r, rot) {
  var c = Math.cos(rot), s = Math.sin(rot);
  var pts = [[0, -r], [r * 0.62, 0], [0, r], [-r * 0.62, 0]];
  ctx.beginPath();
  pts.forEach(function (p, k) {
    var x = cx + p[0] * c - p[1] * s, y = cy + p[0] * s + p[1] * c;
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
}

// reveal state: phase 'off' | 'in' | 'hold' | 'out'
var reveal = { phase: 'off', t0: 0, x: 0, y: 0, fadeAt: 0 };
var downAt = 0, downX = 0, downY = 0;
canvas.addEventListener('pointerdown', function (e) { downAt = performance.now(); downX = e.clientX; downY = e.clientY; });
canvas.addEventListener('pointerup', function (e) {
  var dt = performance.now() - downAt;
  var moved = Math.sqrt((e.clientX - downX) * (e.clientX - downX) + (e.clientY - downY) * (e.clientY - downY));
  if (dt >= 500 || moved >= 12) return;
  var now = performance.now();
  if (reveal.phase === 'off' || reveal.phase === 'out') {
    reveal.phase = 'in'; reveal.t0 = now; reveal.x = e.clientX; reveal.y = e.clientY;
  } else {
    reveal.phase = 'out'; reveal.fadeAt = now;
  }
});

function drawMotif() {
  var i, d, t;
  // pencil construction residue: the circumcircle of each decagon
  ctx.strokeStyle = 'rgba(138,138,138,0.16)'; ctx.lineWidth = 1;
  for (i = 0; i < decs.length; i++) {
    d = decs[i];
    ctx.beginPath(); ctx.arc(d.x, d.y, R, 0, Math.PI * 2); ctx.stroke();
  }
  // the stars, in ink: the {10/3} star polygon inside each decagon
  ctx.strokeStyle = '#1A1A1A'; ctx.lineWidth = 2;
  for (i = 0; i < decs.length; i++) {
    d = decs[i];
    starPolyPath(d.x, d.y, R * 0.88, 10, 3, -Math.PI / 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(d.x, d.y, 2.2, 0, Math.PI * 2);
    ctx.fillStyle = '#1A1A1A'; ctx.fill();
  }
  // one small diamond at the heart of each bow tie
  ctx.lineWidth = 1.6;
  for (i = 0; i < ties.length; i++) {
    t = ties[i];
    diamond(t.x, t.y, R * 0.17, t.rot); ctx.stroke();
  }
}

function draw(now) {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#F4F1E8'; ctx.fillRect(0, 0, W, H);
  drawMotif();
  // advance the reveal state machine
  var pIn = 2000, holdEnd = 5000, fadeLen = 1500;
  if (reveal.phase === 'in' && now - reveal.t0 >= holdEnd) { reveal.phase = 'out'; reveal.fadeAt = reveal.t0 + holdEnd; }
  if (reveal.phase !== 'off') {
    var age = now - reveal.t0;
    var maxR = Math.max(
      Math.sqrt(reveal.x * reveal.x + reveal.y * reveal.y),
      Math.sqrt((W - reveal.x) * (W - reveal.x) + reveal.y * reveal.y),
      Math.sqrt(reveal.x * reveal.x + (H - reveal.y) * (H - reveal.y)),
      Math.sqrt((W - reveal.x) * (W - reveal.x) + (H - reveal.y) * (H - reveal.y)));
    var radius, alpha;
    if (reveal.phase === 'out') {
      alpha = 1 - (now - reveal.fadeAt) / fadeLen;
      radius = maxR;
      if (alpha <= 0) { reveal.phase = 'off'; alpha = 0; }
    } else {
      var p = clamp01(age / pIn);
      radius = smooth(p) * maxR;
      alpha = Math.min(1, p * 1.8);
    }
    if (alpha > 0) {
      ctx.save();
      ctx.beginPath(); ctx.arc(reveal.x, reveal.y, Math.max(radius, 0.1), 0, Math.PI * 2); ctx.clip();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#B03A2E'; ctx.lineWidth = 2.2;
      var i, d, t;
      for (i = 0; i < decs.length; i++) { d = decs[i]; polyPath(d.x, d.y, R, 10, -Math.PI / 2); ctx.stroke(); }
      for (i = 0; i < ties.length; i++) { t = ties[i]; tiePath(t.x, t.y, R * 0.84, R * 0.56, t.rot); ctx.stroke(); }
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }
}

var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
function frame(now) {
  draw(typeof now === 'number' ? now : start);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
resize();
draw(start);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
