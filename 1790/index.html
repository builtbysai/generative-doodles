<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Song From Under the Floor Boards</title>
<style>
html, body { margin: 0; padding: 0; background: #ece6d9; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#ece6d9';
var FRAME_T = 60.0; /* fixed phase: t = 60 s, mid fold cycle, reading position panel 6 */
var PANELS = 12;
var CYCLE = 48.0; /* seconds per fold cycle */
var ORANGE = '#C4502E';
var ORANGE_DEEP = '#A03E22';
var TAN = '#C9A86A';
var WARM_WHITE = '#F2EDE3';
var SHADOW_GREY = 'rgba(60,55,48,0.20)';
var PLATE_FILL = '#ffffff';
var PLATE_LINE = 'rgba(0,0,0,0.28)';
var PLATE_INK = '#2b2b28';
var HINT_INK = '#2b2b28';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* ---- fixed authored panel table, seed 1790 ----
   Per panel: type 0 architecture, 1 legs, 2 plants, 3 orange patch,
   4 mixed; then six jitter values driving the collage details. */
var TABLE = [];
(function buildTable() {
  var rng = mulberry32(1790);
  var i, k;
  for (i = 0; i < PANELS; i++) {
    var j = [];
    for (k = 0; k < 10; k++) j.push(rng());
    TABLE.push({ type: Math.floor(j[0] * 5), j: j });
  }
})();
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var readOff = 0; /* bounded horizontal reading offset in px, 0 at frame one */
var impulse = 0; /* bounded fold impulse from dragging, 0 at frame one */
var impulseT0 = FRAME_T;
var dragging = false, dragStartX = 0, dragStartOff = 0;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
var S = { x0: 0, cy: 0, pw: 0, h: 0, amax: 0 }; /* strip geometry */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
  S.pw = 0.98 * F.w / PANELS;
  S.h = 0.44 * F.h;
  S.cy = F.y + 0.50 * F.h;
  S.amax = 0.09 * S.h;
  S.x0 = F.x + (F.w - PANELS * S.pw) / 2;
}
/* Crease offset at crease j (0..PANELS), closed form of piece time.
   Creases alternate in sign, so each panel is a parallelogram leaning
   against its neighbour; folds bend only at the creases. */
function creaseOff(j, t) {
  var amp = S.amax * (0.55 + 0.45 * Math.sin(TAU * t / CYCLE - j * 0.62));
  var sgn = (j % 2 === 0) ? 1 : -1;
  var off = sgn * amp;
  if (impulse !== 0) {
    off += impulse * S.amax * 0.9 * Math.sin(j * 0.9 - (t - impulseT0) * 1.5);
  }
  return off;
}
/* Panel quad corners, in screen space. */
function panelQuad(i, t) {
  var x0 = S.x0 + readOff + i * S.pw;
  var x1 = x0 + S.pw;
  var yT = S.cy - S.h / 2, yB = S.cy + S.h / 2;
  var o0 = creaseOff(i, t), o1 = creaseOff(i + 1, t);
  return { tl: [x0, yT + o0], tr: [x1, yT + o1], br: [x1, yB + o1], bl: [x0, yB + o0], o0: o0, o1: o1 };
}
function quadPath(q) {
  ctx.beginPath();
  ctx.moveTo(q.tl[0], q.tl[1]);
  ctx.lineTo(q.tr[0], q.tr[1]);
  ctx.lineTo(q.br[0], q.br[1]);
  ctx.lineTo(q.bl[0], q.bl[1]);
  ctx.closePath();
}
/* Collage for one panel, drawn in local coords (0..pw, 0..ph). */
function drawCollage(p, pw, ph) {
  var j = p.j, k, x, y, w, h;
  var type = p.type;
  if (type === 0) { /* architecture: grey photo, columns and windows */
    ctx.fillStyle = '#D9D6CF';
    ctx.fillRect(0, 0, pw, ph);
    ctx.fillStyle = '#3A3A38';
    for (k = 0; k < 4; k++) {
      x = pw * (0.08 + j[1 + k] * 0.75);
      w = pw * (0.07 + j[5 + k] * 0.06);
      ctx.fillRect(x, 0, w, ph * (0.55 + j[1 + k] * 0.2));
    }
    ctx.fillStyle = '#6E6C66';
    ctx.fillRect(0, ph * 0.60, pw, ph * 0.045);
    ctx.fillStyle = '#2E2E2C';
    for (k = 0; k < 6; k++) {
      x = pw * (0.10 + (k % 3) * 0.28 + j[2 + k] * 0.05);
      y = ph * (0.10 + Math.floor(k / 3) * 0.14);
      ctx.fillRect(x, y, pw * 0.13, ph * 0.07);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.moveTo(0, ph * 0.25);
    ctx.lineTo(pw, ph * 0.12);
    ctx.lineTo(pw, ph * 0.30);
    ctx.lineTo(0, ph * 0.43);
    ctx.closePath();
    ctx.fill();
  } else if (type === 1) { /* legs: two dark forms on a pale ground */
    ctx.fillStyle = '#E3E0D8';
    ctx.fillRect(0, 0, pw, ph);
    ctx.fillStyle = '#2B2926';
    ctx.fillRect(0, 0, pw, ph * 0.06);
    ctx.fillStyle = 'rgba(60,55,48,0.16)';
    ctx.beginPath();
    ctx.ellipse(pw * 0.5, ph * 0.80, pw * 0.36, ph * 0.02, 0, 0, TAU);
    ctx.fill();
    var legX = [pw * 0.28, pw * 0.60];
    for (k = 0; k < 2; k++) {
      x = legX[k] + (j[2 + k] - 0.5) * pw * 0.06;
      ctx.fillStyle = '#33312E';
      ctx.beginPath();
      ctx.moveTo(x - pw * 0.07, ph * 0.08);
      ctx.lineTo(x + pw * 0.07, ph * 0.08);
      ctx.lineTo(x + pw * 0.055, ph * 0.74);
      ctx.lineTo(x - pw * 0.055, ph * 0.74);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.fillRect(x - pw * 0.05, ph * 0.10, pw * 0.025, ph * 0.55);
    }
    ctx.fillStyle = '#6E6C66';
    ctx.fillRect(0, ph * 0.78, pw, 1.5);
  } else if (type === 2) { /* plants: stems and grey leaves */
    ctx.fillStyle = '#DCD8CC';
    ctx.fillRect(0, 0, pw, ph);
    for (k = 0; k < 3; k++) {
      x = pw * (0.18 + k * 0.30 + (j[2 + k] - 0.5) * 0.1);
      ctx.strokeStyle = '#4A4A44';
      ctx.lineWidth = Math.max(1.2, pw * 0.03);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, ph);
      ctx.quadraticCurveTo(x + (j[5 + k] - 0.5) * pw * 0.3, ph * 0.55, x + (j[5 + k] - 0.5) * pw * 0.4, ph * (0.12 + j[2 + k] * 0.2));
      ctx.stroke();
      ctx.fillStyle = (k % 2 === 0) ? '#7A7A70' : '#55554E';
      for (var l = 0; l < 3; l++) {
        var ly = ph * (0.35 + l * 0.16 + j[1 + l] * 0.05);
        var lx = x + (j[5 + k] - 0.5) * pw * 0.25 * (1 - l * 0.2);
        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate((j[2 + l] - 0.5) * 1.6 + (l % 2 === 0 ? 0.6 : -0.6));
        ctx.beginPath();
        ctx.ellipse(0, 0, pw * 0.11, ph * 0.035, 0, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
    }
    ctx.fillStyle = 'rgba(43,41,38,0.5)';
    for (k = 0; k < 5; k++) {
      ctx.beginPath();
      ctx.arc(pw * (0.15 + j[2 + k] * 0.7), ph * (0.06 + j[5 + k] * 0.1), Math.max(1, pw * 0.02), 0, TAU);
      ctx.fill();
    }
  } else if (type === 3) { /* orange-red painted patch on tan */
    ctx.fillStyle = TAN;
    ctx.fillRect(0, 0, pw, ph);
    ctx.fillStyle = ORANGE;
    ctx.beginPath();
    ctx.moveTo(pw * (0.10 + j[1] * 0.1), ph * (0.12 + j[2] * 0.08));
    ctx.lineTo(pw * (0.85 - j[3] * 0.1), ph * (0.08 + j[4] * 0.1));
    ctx.lineTo(pw * (0.92 - j[5] * 0.08), ph * (0.55 + j[6] * 0.12));
    ctx.lineTo(pw * (0.55 + j[7] * 0.15), ph * (0.70 - j[8] * 0.08));
    ctx.lineTo(pw * (0.08 + j[9] * 0.08), ph * (0.52 + j[1] * 0.1));
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = ORANGE_DEEP;
    ctx.beginPath();
    ctx.moveTo(pw * 0.30, ph * 0.34);
    ctx.lineTo(pw * (0.62 + j[4] * 0.1), ph * 0.30);
    ctx.lineTo(pw * 0.70, ph * 0.52);
    ctx.lineTo(pw * 0.36, ph * 0.58);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#8A8A82';
    ctx.fillRect(pw * 0.12, ph * 0.80, pw * 0.55, ph * 0.08);
  } else { /* mixed: grey photo fragment, orange stripe, tan block */
    ctx.fillStyle = WARM_WHITE;
    ctx.fillRect(0, 0, pw, ph);
    ctx.fillStyle = '#9A9A92';
    ctx.fillRect(pw * 0.10, ph * 0.06, pw * 0.80, ph * 0.38);
    ctx.fillStyle = '#4A4A44';
    ctx.fillRect(pw * (0.18 + j[1] * 0.2), ph * 0.12, pw * 0.16, ph * 0.26);
    ctx.fillStyle = '#6E6C66';
    ctx.fillRect(pw * (0.45 + j[2] * 0.15), ph * 0.18, pw * 0.30, ph * 0.06);
    ctx.fillStyle = ORANGE;
    ctx.fillRect(0, ph * 0.52, pw, ph * 0.05);
    ctx.fillStyle = TAN;
    ctx.fillRect(pw * 0.08, ph * 0.66, pw * 0.84, ph * 0.26);
    ctx.fillStyle = '#2B2926';
    ctx.fillRect(pw * 0.08, ph * 0.66, pw * 0.84, Math.max(1, ph * 0.008));
  }
  /* paper speckle, seeded per panel */
  ctx.fillStyle = 'rgba(43,41,38,0.06)';
  for (k = 0; k < 26; k++) {
    var sx = ((k * 37 + Math.floor(j[1] * 97)) % 100) / 100 * pw;
    var sy = ((k * 53 + Math.floor(j[2] * 89)) % 100) / 100 * ph;
    ctx.fillRect(sx, sy, 1.2, 1.2);
  }
}
function drawPanel(i, t) {
  var q = panelQuad(i, t);
  var pw = S.pw, ph = S.h;
  ctx.save();
  quadPath(q);
  ctx.clip();
  /* affine map from local (0..pw, 0..ph) to the panel parallelogram */
  var a = (q.tr[0] - q.tl[0]) / pw;
  var b = (q.tr[1] - q.tl[1]) / ph;
  var c = (q.bl[0] - q.tl[0]) / pw;
  var d = (q.bl[1] - q.tl[1]) / ph;
  ctx.setTransform(a, b, c, d, q.tl[0], q.tl[1]);
  drawCollage(TABLE[i], pw, ph);
  /* light caught as the panel turns: lean is the crease difference */
  var lean = (q.o1 - q.o0) / (2 * S.amax);
  if (lean > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + (0.18 * lean).toFixed(4) + ')';
    ctx.fillRect(0, 0, pw, ph);
  } else if (lean < 0) {
    ctx.fillStyle = 'rgba(0,0,0,' + (0.16 * -lean).toFixed(4) + ')';
    ctx.fillRect(0, 0, pw, ph);
  }
  ctx.restore();
  /* paper edge */
  ctx.strokeStyle = 'rgba(43,41,38,0.30)';
  ctx.lineWidth = 1;
  quadPath(q);
  ctx.stroke();
}
function drawStrip(t) {
  var i;
  /* soft shadow under the strip */
  var shGrad = ctx.createLinearGradient(0, S.cy + S.h / 2, 0, S.cy + S.h / 2 + 30);
  shGrad.addColorStop(0, 'rgba(60,55,48,0.14)');
  shGrad.addColorStop(1, 'rgba(60,55,48,0)');
  ctx.fillStyle = shGrad;
  ctx.fillRect(S.x0 + readOff - 4, S.cy + S.h / 2 + 2, PANELS * S.pw + 8, 30);
  for (i = 0; i < PANELS; i++) drawPanel(i, t);
  /* soft shadow in each fold */
  for (i = 1; i < PANELS; i++) {
    var cx = S.x0 + readOff + i * S.pw;
    var g = ctx.createLinearGradient(cx - 9, 0, cx + 9, 0);
    g.addColorStop(0, 'rgba(60,55,48,0)');
    g.addColorStop(0.5, 'rgba(60,55,48,0.13)');
    g.addColorStop(1, 'rgba(60,55,48,0)');
    ctx.fillStyle = g;
    ctx.fillRect(cx - 9, S.cy - S.h / 2 + S.amax, 18, S.h - 2 * S.amax);
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('A Song From Under the Floor Boards').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('A Song From Under the Floor Boards').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 12 · 06').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('A Song From Under the Floor Boards', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 12 · 06', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to read along it.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawStrip(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    readPos: function () { return 6 + readOff / S.pw; },
    readOff: function () { return readOff; },
    creaseOffsets: function (t) {
      var out = [], j;
      for (j = 0; j <= PANELS; j++) out.push(creaseOff(j, t));
      return out;
    },
    panelTypes: function () {
      var out = [], i;
      for (i = 0; i < PANELS; i++) out.push(TABLE[i].type);
      return out;
    }
  };
}
/* ---- frame one: fixed phase t = 60 s ---- */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('pointerdown', function (e) {
    dragging = true;
    dragStartX = (e && typeof e.clientX === 'number') ? e.clientX : 0;
    dragStartOff = readOff;
    impulseT0 = phaseT;
  });
  window.addEventListener('pointermove', function (e) {
    if (!dragging || !e || typeof e.clientX !== 'number') return;
    var dx = e.clientX - dragStartX;
    readOff = clamp(dragStartOff + dx, -1.5 * S.pw, 1.5 * S.pw);
    impulse = clamp(dx / S.pw * 0.25, -0.6, 0.6);

  window.addEventListener('pointercancel', function () { dragging = false; });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, clockT = 0;

      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      if (!dragging && Math.abs(impulse) > 0.001) {
        impulse += (0 - impulse) * (1 - Math.exp(-dt / 2));
        if (Math.abs(impulse) < 0.001) impulse = 0;
      }
      if (!dragging && Math.abs(readOff) > 0.001) {
        readOff += (0 - readOff) * (1 - Math.exp(-dt / 6));
        if (Math.abs(readOff) < 0.001) readOff = 0;
      }
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
