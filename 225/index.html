<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.225 Messy Desk</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#C9B896; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.225 Messy Desk (Kathy McTavish). Her Thought Machine: a messy
// desk as a cogitation machine. Note-cards, print-out fragments,
// arrows and coffee rings lie in deliberate clutter on kraft paper,
// denser at the edges. A wandering reader cursor underlines fragments
// and ties the last few together with red thread, then redraws its
// thinking. Drag a fragment and it snaps back elastically, unless the
// thread currently holds it: threaded fragments stay where dropped.
// The card texts are part of the piece, written for it.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#C9B896', INK = '#22262B', HI = '#FFE14D', THREAD = '#C0392B';
var CARDFILL = '#DCCDA9', PRINTFILL = '#E4D8BA';
var W = 0, H = 0, phone = false;
var seed = 225225;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
var rand = rng(seed);
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

var T = 0;
// ---- the desk: fragment cards (fx, fy = home centre as fractions) --------------------
var CARDS = [
  { fx: 0.15, fy: 0.18, pfx: 0.26, pfy: 0.09, w: 198, h: 84, rot: -0.06, kind: 'card',  lines: ['remember: the machine', 'is not the music'] },
  { fx: 0.41, fy: 0.13, pfx: 0.73, pfy: 0.165, w: 208, h: 84, rot: 0.04,  kind: 'print', lines: ['call the river. ask', 'about the ledger'] },
  { fx: 0.66, fy: 0.17, pfx: 0.27, pfy: 0.25, w: 192, h: 84, rot: -0.03, kind: 'card',  lines: ['TODO: teach the choir', 'to count in threes'] },
  { fx: 0.88, fy: 0.27, pfx: 0.74, pfy: 0.33, w: 182, h: 84, rot: 0.09,  kind: 'card',  lines: ['a bird left. the', 'suitcase is still here'] },
  { fx: 0.18, fy: 0.46, pfx: 0.26, pfy: 0.415, w: 208, h: 84, rot: 0.05,  kind: 'print', lines: ['counts & probabilities', '(again, slower)'], hilite: 0 },
  { fx: 0.47, fy: 0.40, pfx: 0.75, pfy: 0.475, w: 148, h: 62, rot: -0.10, kind: 'sticky', lines: ['messy = alive'] },
  { fx: 0.79, fy: 0.50, pfx: 0.27, pfy: 0.565, w: 170, h: 84, rot: -0.05, kind: 'card',  lines: ['do not iron', 'the map'] },
  { fx: 0.13, fy: 0.75, pfx: 0.74, pfy: 0.625, w: 208, h: 84, rot: 0.03,  kind: 'card',  lines: ['the typist denies', 'everything, twice'] },
  { fx: 0.40, fy: 0.72, pfx: 0.26, pfy: 0.715, w: 178, h: 84, rot: -0.04, kind: 'print', lines: ['buy thread. red.', 'more red.'] },
  { fx: 0.64, fy: 0.79, pfx: 0.75, pfy: 0.775, w: 148, h: 62, rot: 0.08,  kind: 'sticky', lines: ['thread it!'] },
  { fx: 0.88, fy: 0.77, pfx: 0.27, pfy: 0.855, w: 206, h: 84, rot: -0.07, kind: 'card',  lines: ['hypothesis: the desk', 'thinks back'] },
  { fx: 0.56, fy: 0.60, pfx: 0.74, pfy: 0.905, w: 200, h: 84, rot: 0.02,  kind: 'card',  lines: ['unsent: dear machine,', 'thank you'] },
  { fx: 0.28, fy: 0.585, pfx: 0.48, pfy: 0.965, w: 190, h: 84, rot: 0.07, kind: 'print', lines: ['field note: rain,', 'wire, static'] }
];
CARDS.forEach(function (c) { c.ox = 0; c.oy = 0; c.vx = 0; c.vy = 0; c.underlined = 0; c.hx = 0; c.hy = 0; });
function cardPos(c) { return { x: c.hx + c.ox, y: c.hy + c.oy }; }
function cardSize(c) { var s = phone ? 0.80 : 1; return { w: c.w * s, h: c.h * s }; }
function activeFrac(c) { return (phone && typeof c.pfx === 'number') ? [c.pfx, c.pfy] : [c.fx, c.fy]; }
// pixel homes, clamped on resize so every fragment stays on the desk
function layoutHomes() {
  CARDS.forEach(function (c) {
    var s = cardSize(c), f = activeFrac(c);
    c.hx = clamp(f[0] * W, s.w / 2 + 5, Math.max(s.w / 2 + 5, W - s.w / 2 - 5));
    c.hy = clamp(f[1] * H, s.h / 2 + 5, Math.max(s.h / 2 + 5, H - s.h / 2 - 5));
  });
}
// static marks under the cards: coffee rings and arrows, in fractions
var RINGS = [{ fx: 0.315, fy: 0.315, r: 34 }, { fx: 0.715, fy: 0.665, r: 40 }, { fx: 0.525, fy: 0.235, r: 27 }];
var ARROWS = [
  { x1: 0.30, y1: 0.36, cx: 0.36, cy: 0.33, x2: 0.435, y2: 0.375 },
  { x1: 0.70, y1: 0.335, cx: 0.755, cy: 0.385, x2: 0.775, y2: 0.435 },
  { x1: 0.475, y1: 0.865, cx: 0.53, cy: 0.815, x2: 0.60, y2: 0.845 }
];

// ---- reader cursor state machine -------------------------------------------------------
var threads = []; // {a, b, prog}
var cursor = { x: 0, y: 0, state: 'wander', t: 0, target: -1, last: 5, ux: 0, uy: 0, ux2: 0, uy2: 0 };
// two thread arcs are already on the desk when the piece opens
threads.push({ a: 0, b: 4, prog: 1 });
threads.push({ a: 4, b: 5, prog: 1 });
CARDS[0].underlined = 1; CARDS[4].underlined = 1; CARDS[5].underlined = 1;
function underlineGeom(ci) {
  var c = CARDS[ci], p = cardPos(c), s = cardSize(c);
  var lx1 = -s.w / 2 + 11, lx2 = s.w / 2 - 11, ly = s.h / 2 - 13;
  var co = Math.cos(c.rot), sn = Math.sin(c.rot);
  return {
    x1: p.x + lx1 * co - ly * sn, y1: p.y + lx1 * sn + ly * co,
    x2: p.x + lx2 * co - ly * sn, y2: p.y + lx2 * sn + ly * co
  };
}
function pickTarget() {
  var n;
  do { n = Math.floor(rand() * CARDS.length); } while (n === cursor.last || n === cursor.target);
  cursor.target = n;
  var g = underlineGeom(n);
  cursor.ux = g.x1; cursor.uy = g.y1; cursor.ux2 = g.x2; cursor.uy2 = g.y2;
  cursor.state = 'wander'; cursor.t = 0;
}
function threadedSet() {
  var set = {};
  threads.forEach(function (t) { set[t.a] = true; set[t.b] = true; });
  return set;
}
function stepCursor(dt) {
  cursor.t += dt;
  if (cursor.state === 'wander') {
    var dx = cursor.ux - cursor.x, dy = cursor.uy - cursor.y;
    var d = Math.hypot(dx, dy);
    var sp = 320 * dt;
    if (d <= sp || d < 2) { cursor.x = cursor.ux; cursor.y = cursor.uy; cursor.state = 'underline'; cursor.t = 0; }
    else { cursor.x += dx / d * sp; cursor.y += dy / d * sp; }
  } else if (cursor.state === 'underline') {
    var p = clamp(cursor.t / 0.75, 0, 1);
    cursor.x = cursor.ux + (cursor.ux2 - cursor.ux) * p;
    cursor.y = cursor.uy + (cursor.uy2 - cursor.uy) * p;
    CARDS[cursor.target].underlined = Math.max(CARDS[cursor.target].underlined, p);
    if (p >= 1) {
      threads.push({ a: cursor.last, b: cursor.target, prog: 0 });
      if (threads.length > 4) threads.shift();
      cursor.last = cursor.target;
      cursor.state = 'thread'; cursor.t = 0;
    }
  } else if (cursor.state === 'thread') {
    var th = threads[threads.length - 1];
    if (th) th.prog = clamp(cursor.t / 0.8, 0, 1);
    if (cursor.t >= 0.85) { cursor.state = 'pause'; cursor.t = 0; }
  } else if (cursor.state === 'pause') {
    if (cursor.t >= 1.1) pickTarget();
  }
}
function step(dt) {
  T += dt;
  stepCursor(dt);
  // elastic snap-back for displaced fragments the thread does not hold
  var held = threadedSet();
  CARDS.forEach(function (c, i) {
    if (drag.card === c) return;
    if (held[i]) return;
    if (c.ox === 0 && c.oy === 0 && c.vx === 0 && c.vy === 0) return;
    var k = 110, damp = 8.5;
    c.vx += (-k * c.ox - damp * c.vx) * dt;
    c.vy += (-k * c.oy - damp * c.vy) * dt;
    c.ox += c.vx * dt;
    c.oy += c.vy * dt;
    if (Math.abs(c.ox) < 0.3 && Math.abs(c.vx) < 2) { c.ox = 0; c.vx = 0; }
    if (Math.abs(c.oy) < 0.3 && Math.abs(c.vy) < 2) { c.oy = 0; c.vy = 0; }
  });
}

// ---- drawing -----------------------------------------------------------------------------
function drawMarks() {
  ctx.strokeStyle = INK;
  RINGS.forEach(function (r) {
    var rr = r.r * (phone ? 0.75 : 1);
    ctx.globalAlpha = 0.16;
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(r.fx * W, r.fy * H, rr, 0, 6.3); ctx.stroke();
    ctx.globalAlpha = 0.09;
    ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.arc(r.fx * W + 3, r.fy * H + 2, rr * 0.92, 0, 6.3); ctx.stroke();
  });
  ctx.globalAlpha = 0.42;
  ctx.lineWidth = 1.6;
  ARROWS.forEach(function (a) {
    var x1 = a.x1 * W, y1 = a.y1 * H, cx = a.cx * W, cy = a.cy * H, x2 = a.x2 * W, y2 = a.y2 * H;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(cx, cy, x2, y2);
    ctx.stroke();
    var ang = Math.atan2(y2 - cy, x2 - cx);
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - Math.cos(ang - 0.45) * 9, y2 - Math.sin(ang - 0.45) * 9);
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - Math.cos(ang + 0.45) * 9, y2 - Math.sin(ang + 0.45) * 9);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
}
function drawCard(c) {
  var p = cardPos(c), s = cardSize(c);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(c.rot);
  ctx.fillStyle = c.kind === 'sticky' ? HI : c.kind === 'print' ? PRINTFILL : CARDFILL;
  ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
  ctx.strokeStyle = INK;
  ctx.globalAlpha = 0.38;
  ctx.lineWidth = 1;
  ctx.strokeRect(-s.w / 2, -s.h / 2, s.w, s.h);
  ctx.globalAlpha = 1;
  if (typeof c.hilite === 'number') { // a highlighter swipe over one line
    ctx.fillStyle = HI;
    ctx.globalAlpha = 0.55;
    var hy = -s.h / 2 + 12 + c.hilite * 17;
    ctx.fillRect(-s.w / 2 + 9, hy, s.w - 18, 13);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = INK;
  ctx.font = (phone ? 10 : 12.5) + 'px monospace';
  for (var i = 0; i < c.lines.length; i++) {
    ctx.fillText(c.lines[i], -s.w / 2 + 11, -s.h / 2 + 25 + i * 17);
  }
  ctx.restore();
  if (c.underlined > 0) {
    var g = underlineGeom(CARDS.indexOf(c));
    ctx.strokeStyle = THREAD;
    ctx.globalAlpha = 0.8;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(g.x1, g.y1);
    ctx.lineTo(g.x1 + (g.x2 - g.x1) * c.underlined, g.y1 + (g.y2 - g.y1) * c.underlined);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}
function drawThread(t) {
  var pa = cardPos(CARDS[t.a]), pb = cardPos(CARDS[t.b]);
  var mx = (pa.x + pb.x) / 2, my = (pa.y + pb.y) / 2;
  var dx = pb.x - pa.x, dy = pb.y - pa.y;
  var d = Math.hypot(dx, dy) || 1;
  var bend = d * 0.18 * (((t.a * 7 + t.b * 13) % 2) ? 1 : -1);
  var cxp = mx - dy / d * bend, cyp = my + dx / d * bend;
  ctx.strokeStyle = THREAD;
  ctx.globalAlpha = 0.85;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  var steps = 18, lim = Math.floor(steps * t.prog);
  for (var i = 0; i <= lim; i++) {
    var u = i / steps, v = 1 - u;
    var x = v * v * pa.x + 2 * v * u * cxp + u * u * pb.x;
    var y = v * v * pa.y + 2 * v * u * cyp + u * u * pb.y;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  drawMarks();
  CARDS.forEach(drawCard);
  threads.forEach(drawThread);
  // the reader cursor: a small ink ring with a dot
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(cursor.x, cursor.y, 5.5, 0, 6.3); ctx.stroke();
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(cursor.x, cursor.y, 1.6, 0, 6.3); ctx.fill();
}

// ---- interaction: drag fragments ---------------------------------------------------------
var drag = { card: null, gx: 0, gy: 0 };
function hitCard(x, y) {
  for (var i = CARDS.length - 1; i >= 0; i--) {
    var c = CARDS[i], p = cardPos(c), s = cardSize(c);
    var dx = x - p.x, dy = y - p.y;
    var co = Math.cos(c.rot), sn = Math.sin(c.rot);
    var lx = dx * co + dy * sn, ly = -dx * sn + dy * co;
    if (Math.abs(lx) <= s.w / 2 && Math.abs(ly) <= s.h / 2) return c;
  }
  return null;
}
canvas.addEventListener('pointerdown', function (e) {
  var c = hitCard(e.clientX || 0, e.clientY || 0);
  if (c) {
    drag.card = c;
    var p = cardPos(c);
    drag.gx = (e.clientX || 0) - p.x;
    drag.gy = (e.clientY || 0) - p.y;
    c.vx = 0; c.vy = 0;
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag.card) return;
  var c = drag.card;
  c.ox = (e.clientX || 0) - drag.gx - c.hx;
  c.oy = (e.clientY || 0) - drag.gy - c.hy;
});
function endDrag() {
  if (!drag.card) return;
  var c = drag.card, held = threadedSet();
  if (held[CARDS.indexOf(c)]) { // the thread holds it: this is its home now
    if (phone && typeof c.pfx === 'number') { c.pfx = clamp((c.hx + c.ox) / W, 0, 1); c.pfy = clamp((c.hy + c.oy) / H, 0, 1); }
    else { c.fx = clamp((c.hx + c.ox) / W, 0, 1); c.fy = clamp((c.hy + c.oy) / H, 0, 1); }
    c.ox = 0; c.oy = 0;
    layoutHomes();
  }
  drag.card = null;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
  CARDS.forEach(function (c) { c.ox = 0; c.oy = 0; c.vx = 0; c.vy = 0; });
  layoutHomes();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
var lastNow = -1;
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  if (dt > 0) step(dt);
  draw();
}
resize();
cursor.x = W * 0.24; cursor.y = H * 0.3;
pickTarget();
// pre-run until the reader is caught mid-underline: frame one opens
// mid-thought, two thread arcs already on the desk
for (var pre = 0; pre < 900; pre++) {
  step(1 / 30);
  if (cursor.state === 'underline' && cursor.t > 0.3) break;
}
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
