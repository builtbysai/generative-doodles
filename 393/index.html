<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.393 Wimmelwald</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F4EBD8; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.393 Wimmelwald (galitskaya-illustration).
// After Anna Galitskaya's seek-and-find Wimmelbuch
// mechanism: a snowy forest village at dusk, candle-lit
// windows, a frozen lake, the bakery hut, and exactly ten
// findable micro-narratives hiding in it, each a tiny
// looping animation in flat kidlit shapes. TAP a findable
// and the camera eases in close while a soft gold ring
// pulses once around it, no label, no text; DOUBLE-TAP
// steps back to the wide view. The layout is ONE fixed
// authored arrangement (the prompt's per-load seeded
// placement, resolved to a single layout per the batch
// adaptation flag), asserted at ten findables and 120
// snow particles. Palette is closed at the four specced
// hexes, used flat or at flat alpha steps: paper, night
// navy, candle gold for windows and lanterns only, rust
// for the sled and the choir scarves. One canvas, no
// offscreen canvas, no gradients, no filters, no
// shadowBlur, no text anywhere.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#F4EBD8', NAVY = '#24425E', GOLD = '#E8A93D', RUST = '#C0562F';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 60;
if (LOOP !== 60) throw new Error('Wimmelwald loop must be 60s');
var TICK = 1 / 60;
var TAU = Math.PI * 2;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every random-looking
// value is baked from this at load and never changes
// between frames or renders. It only supplies hand-wobble
// jitter and scatter, never placement of the finds.
var seed = 393;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
function wob() { return (rnd() - 0.5) * 3; } // 1.5px hand wobble

// ---- tiny shape helpers ---------------------------------
function C(x, y, r, col, a) {
  ctx.fillStyle = col; ctx.globalAlpha = a === undefined ? 1 : a;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
}
function E(x, y, rx, ry, col, a) {
  ctx.fillStyle = col; ctx.globalAlpha = a === undefined ? 1 : a;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
}
function R(x, y, w, h, col, a) {
  ctx.fillStyle = col; ctx.globalAlpha = a === undefined ? 1 : a;
  ctx.fillRect(x, y, w, h); ctx.globalAlpha = 1;
}
function P(pts, col, a) {
  ctx.fillStyle = col; ctx.globalAlpha = a === undefined ? 1 : a;
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
}
function L(x1, y1, x2, y2, col, w, a) {
  ctx.strokeStyle = col; ctx.globalAlpha = a === undefined ? 1 : a;
  ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.globalAlpha = 1;
}

// ---- snow: exactly 120 particles ------------------------
// Each flake falls a whole number of field heights per
// 60s loop, so the snowfall wraps seamlessly; the sway
// periods are whole divisors of the loop too.
var SNOW = [];
(function () {
  var periods = [60, 30, 20, 15, 12, 10];
  for (var i = 0; i < 120; i++) {
    SNOW.push({
      x: rnd() * DW,
      ph: rnd(),
      falls: 1 + Math.floor(rnd() * 3),
      swayPer: periods[Math.floor(rnd() * periods.length)],
      swayAmp: 6 + rnd() * 14,
      swayPh: rnd() * TAU,
      r: 1.5 + rnd() * 1.9
    });
  }
  if (SNOW.length !== 120) throw new Error('Wimmelwald needs exactly 120 snowflakes');
})();

// ---- stars ----------------------------------------------
var STARS = [];
(function () {
  for (var i = 0; i < 26; i++) {
    STARS.push({ x: 30 + rnd() * 1220, y: 24 + rnd() * 330, r: 1.4 + rnd() * 1.8, tw: rnd() < 0.4, ph: rnd() * TAU });
  }
})();

// ---- distant pine ridge ---------------------------------
// A row of navy triangles along the horizon behind the
// houses, at a stepped alpha so the sky reads deeper than
// the silhouettes in front of it.
var RIDGE = [];
(function () {
  var x = -30;
  while (x < DW + 30) {
    var w = 34 + rnd() * 30, h = 52 + rnd() * 62;
    RIDGE.push({ x: x, w: w, h: h });
    x += w * (0.55 + rnd() * 0.3);
  }
})();

// ---- snowline -------------------------------------------
// The wobbled top edge of the snowfield, baked once.
var SNOWLINE = [];
(function () {
  for (var x = -60; x <= DW + 60; x += 80) SNOWLINE.push({ x: x, y: 618 + (rnd() - 0.5) * 12 });
})();

function snowY(x) {
  var i = Math.max(0, Math.min(SNOWLINE.length - 2, Math.floor((x + 60) / 80)));
  var a = SNOWLINE[i], b = SNOWLINE[i + 1];
  var f = Math.max(0, Math.min(1, (x - a.x) / 80));
  return a.y + (b.y - a.y) * f;
}

// ---- scenery: sky, moon, ridge, ground, lake, path ------
function drawSky() {
  // Dusk sky: navy at a flat alpha step over the paper, so
  // full-strength navy silhouettes read in front of it.
  R(-80, -80, DW + 160, 700, NAVY, 0.88);
  // A full paper moon, top left.
  C(168, 108, 27, PAPER, 0.95);
  C(160, 100, 6, NAVY, 0.10);
  C(178, 118, 4, NAVY, 0.10);
  // Stars, a few of them twinkling on the 6s cycle.
  for (var i = 0; i < STARS.length; i++) {
    var st = STARS[i];
    var a = 0.75;
    if (st.tw) a = 0.35 + 0.4 * (0.5 + 0.5 * Math.sin(TAU * T / 6 + st.ph));
    C(st.x, st.y, st.r, PAPER, a);
  }
}

function drawRidge() {
  for (var i = 0; i < RIDGE.length; i++) {
    var p = RIDGE[i];
    P([p.x, 626, p.x + p.w / 2, 626 - p.h, p.x + p.w, 626], NAVY, 0.45);
  }
}

function drawGround() {
  ctx.fillStyle = PAPER;
  ctx.beginPath();
  ctx.moveTo(-80, SNOWLINE[0].y);
  for (var i = 1; i < SNOWLINE.length; i++) ctx.lineTo(SNOWLINE[i].x, SNOWLINE[i].y);
  ctx.lineTo(DW + 80, DH + 80);
  ctx.lineTo(-80, DH + 80);
  ctx.closePath();
  ctx.fill();
  // Soft drift shading: navy at the faintest step.
  E(300, 700, 180, 16, NAVY, 0.05);
  E(880, 812, 230, 18, NAVY, 0.05);
  E(620, 872, 260, 14, NAVY, 0.04);
  E(1120, 700, 140, 12, NAVY, 0.05);
}

function drawLake() {
  // The frozen lake, lower third, left to centre: a pale
  // navy wash over the paper with a firmer rim.
  E(380, 772, 322, 80, NAVY, 0.13);
  ctx.strokeStyle = NAVY; ctx.globalAlpha = 0.30; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(380, 772, 322, 80, 0, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
  // Skate marks and cracks: pale arcs over the ice, a few
  // darker scratches under them.
  ctx.lineCap = 'round';
  var arcs = [
    [250, 760, 90, 22, 0.4, 2.4], [430, 800, 120, 26, 3.4, 5.2],
    [540, 742, 70, 16, 0.2, 1.8], [180, 806, 80, 18, 3.8, 5.6]
  ];
  for (var i = 0; i < arcs.length; i++) {
    var a = arcs[i];
    ctx.strokeStyle = PAPER; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(a[0], a[1], a[2], a[3], 0, a[4], a[5]); ctx.stroke();
  }
  ctx.strokeStyle = NAVY; ctx.globalAlpha = 0.15; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(120, 730); ctx.lineTo(210, 742); ctx.lineTo(268, 736); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(560, 812); ctx.lineTo(636, 802); ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawPath() {
  // The village path through the snow, a faint navy band
  // the walkers share, with footprint dots.
  ctx.fillStyle = NAVY; ctx.globalAlpha = 0.07;
  ctx.beginPath();
  ctx.moveTo(-40, 650);
  ctx.bezierCurveTo(320, 640, 700, 668, 1320, 652);
  ctx.lineTo(1320, 684);
  ctx.bezierCurveTo(700, 700, 320, 672, -40, 682);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = NAVY;
  for (var i = 0; i < 40; i++) {
    var fx = 30 + i * 32 + (i % 2) * 7;
    C(fx, 660 + (i % 2) * 9, 1.8, NAVY, 0.10);
  }
  ctx.globalAlpha = 1;
}
// ---- scenery: houses, bakery, tower, pines --------------
// A snow cap is a paper band laid along a roof's slopes.
function snowCap(x1, y1, xp, yp, x2, y2) {
  P([x1, y1 + 9, xp, yp + 9, x2, y2 + 9, x2, y2, xp, yp, x1, y1], PAPER, 0.95);
}

function chimneySmoke(x, y, t) {
  // Three paper puffs rising on the 6s cycle.
  for (var i = 0; i < 3; i++) {
    var p = ((t % 6) / 6 + i / 3) % 1;
    C(x + p * 16 + Math.sin(p * 5) * 3, y - p * 52, 4 + p * 8, PAPER, 0.5 * (1 - p) + 0.08);
  }
}

function goldWindow(x, y, w, h) {
  R(x, y, w, h, GOLD, 1);
  L(x + w / 2, y, x + w / 2, y + h, NAVY, 2, 0.55);
  L(x, y + h / 2, x + w, y + h / 2, NAVY, 2, 0.55);
}

function drawHouseA(t) {
  // Left house: navy body and steep roof, paper snow cap,
  // two gold windows, a paper door, a smoking chimney.
  P([150 + wob(), 502, 250, 404, 350 + wob(), 502], NAVY, 1);
  snowCap(150, 502, 250, 404, 350, 502);
  R(168, 498, 164, 154, NAVY, 1);
  R(292, 420, 24, 56, NAVY, 1);
  chimneySmoke(304, 414, t);
  goldWindow(196, 548, 26, 34);
  goldWindow(282, 548, 26, 34);
  R(238, 576, 24, 76, PAPER, 1);
  C(256, 616, 2.5, GOLD, 1);
}

function drawCottageB() {
  // Centre cottage, smaller, two gold windows.
  P([472, 532, 570, 446, 668, 532], NAVY, 1);
  snowCap(472, 532, 570, 446, 668, 532);
  R(494, 526, 152, 126, NAVY, 1);
  goldWindow(518, 560, 24, 30);
  goldWindow(600, 560, 24, 30);
  R(558, 586, 22, 66, PAPER, 1);
  C(574, 620, 2.2, GOLD, 1);
}

function drawTinyHouse() {
  // A small house tucked between house A and the cottage.
  P([368, 548, 416, 478, 464, 548], NAVY, 1);
  snowCap(368, 548, 416, 478, 464, 548);
  R(378, 542, 76, 110, NAVY, 1);
  goldWindow(402, 574, 22, 28);
}

function drawBakery(t) {
  // The bakery hut, centre-right: wide gold shop window,
  // paper door, an awning with snow on it, smoke above.
  P([792, 512, 905, 430, 1018, 512], NAVY, 1);
  snowCap(792, 512, 905, 430, 1018, 512);
  R(812, 506, 186, 146, NAVY, 1);
  R(852, 448, 22, 48, NAVY, 1);
  chimneySmoke(863, 442, t + 2);
  R(812, 530, 186, 12, NAVY, 0.85);
  R(812, 524, 186, 7, PAPER, 0.95);
  R(838, 552, 62, 46, GOLD, 1);
  L(869, 552, 869, 598, NAVY, 2, 0.55);
  L(838, 575, 900, 575, NAVY, 2, 0.55);
  R(934, 560, 26, 92, PAPER, 1);
  C(954, 608, 2.5, GOLD, 1);
}

function drawTower() {
  // The lantern tower, right: tall navy body, a pointed
  // roof, one small gold window low, and the gold-lit
  // lantern room at the top where the owl sits (the owl
  // itself is findable 5, drawn with the finds).
  R(1130, 318, 70, 334, NAVY, 1);
  R(1136, 244, 58, 78, NAVY, 1);
  P([1126, 248, 1165, 192, 1204, 248], NAVY, 1);
  P([1126, 248, 1165, 192, 1204, 248, 1196, 248, 1165, 202, 1134, 248], PAPER, 0.95);
  goldWindow(1152, 424, 26, 34);
  R(1150, 580, 30, 72, PAPER, 1);
  C(1174, 618, 2.5, GOLD, 1);
}

function pine(x, base, h, a) {
  // One framing pine: trunk and three stacked navy
  // triangles with paper snow dashes on the branches.
  var w = h * 0.30;
  L(x, base, x, base - h * 0.14, NAVY, 6, a);
  for (var i = 0; i < 3; i++) {
    var fy = base - h * (0.10 + i * 0.26);
    var fw = w * (1 - i * 0.24);
    var fh = h * 0.36;
    P([x - fw / 2, fy, x, fy - fh, x + fw / 2, fy], NAVY, a);
    L(x - fw * 0.30, fy - fh * 0.30, x - fw * 0.05, fy - fh * 0.38, PAPER, 2.5, 0.75 * a);
    L(x + fw * 0.06, fy - fh * 0.42, x + fw * 0.30, fy - fh * 0.34, PAPER, 2.5, 0.75 * a);
  }
}

function drawForest() {
  // Forest framing the sides, full-strength navy in front
  // of the dusk sky.
  pine(30, 668, 520, 1);
  pine(82, 660, 380, 1);
  pine(1250, 672, 500, 1);
  pine(1206, 662, 350, 1);
  pine(700, 640, 130, 0.85);
  pine(452, 638, 110, 0.85);
}

function drawLanternPost(x, baseY, t) {
  // A village lantern post: navy post and cap, gold lamp.
  // The flame steps its alpha on the 2s cycle.
  L(x, baseY, x, baseY - 78, NAVY, 5, 1);
  L(x, baseY - 78, x + 14, baseY - 78, NAVY, 4, 1);
  var fl = (t % 2) < 1 ? 0.85 : 1;
  C(x + 16, baseY - 66, 17, GOLD, 0.16);
  R(x + 9, baseY - 76, 14, 19, GOLD, fl);
  P([x + 6, baseY - 76, x + 26, baseY - 76, x + 16, baseY - 86], NAVY, 1);
}
// ---- the ten findables ----------------------------------
// Each is 3-6 flat bezier-and-blob shapes with a tiny
// looping animation. Every micro-cycle is a whole divisor
// of the 60s loop: 2, 3, 4, 5 or 6 seconds.
function twoF(t, per) { return Math.floor(t / per) % 2; }

function drawOwl(t) {
  // Findable 5: the owl in the lantern tower. The gold-lit
  // room is drawn here so the owl sits inside it.
  R(1143, 252, 44, 64, GOLD, 1);
  L(1143, 252, 1187, 252, NAVY, 3, 0.6);
  L(1143, 316, 1187, 316, NAVY, 3, 0.6);
  ctx.save();
  ctx.translate(1165, 288);
  ctx.rotate(Math.sin(TAU * t / 5) * 0.05);
  E(0, 6, 15, 19, NAVY, 1);              // body
  C(0, -14, 12.5, NAVY, 1);              // head
  P([-11, -22, -7, -30, -3, -22], NAVY, 1); // ear tufts
  P([3, -22, 7, -30, 11, -22], NAVY, 1);
  E(0, 12, 8, 11, PAPER, 0.85);          // belly
  if ((t % 5) > 4.55) {                  // the blink
    L(-8, -14, -2, -14, PAPER, 1.8, 0.9);
    L(2, -14, 8, -14, PAPER, 1.8, 0.9);
  } else {
    C(-5, -14, 2.6, PAPER, 1);
    C(5, -14, 2.6, PAPER, 1);
  }
  P([-3, -8, 3, -8, 0, -4], GOLD, 1);    // beak, lantern-lit
  ctx.restore();
}

function drawCat(t) {
  // Findable 9: a cat asleep on the bakery sacks, left of
  // the bakery. Sacks are paper with navy stitch dashes;
  // the cat breathes on the 4s cycle and its tail tip
  // flicks between two poses.
  E(756, 624, 27, 17, PAPER, 1);
  E(788, 628, 22, 14, PAPER, 1);
  L(738, 618, 772, 614, NAVY, 1.6, 0.45);
  L(770, 622, 802, 619, NAVY, 1.6, 0.45);
  var br = 1 + 0.03 * Math.sin(TAU * t / 4);
  ctx.save();
  ctx.translate(764, 600);
  ctx.scale(br, br);
  E(0, 0, 19, 12.5, NAVY, 1);            // curled body
  C(14, -3, 9, NAVY, 1);                 // head, tucked in
  P([8, -10, 11, -17, 15, -10], NAVY, 1);  // ears
  P([16, -11, 20, -17, 22, -9], NAVY, 1);
  L(10, -3, 16, -3, PAPER, 1.5, 0.8);    // closed eye
  ctx.restore();
  // Tail wrapping the body, tip flicking on the 4s cycle.
  var tip = twoF(t, 2) === 0 ? 0 : -7;
  ctx.strokeStyle = NAVY; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(764, 602, 21, Math.PI * 0.85, Math.PI * 1.55 + tip * 0.02);
  ctx.stroke();
}

function drawGnomes(t) {
  // Findable 3: three gnomes shuffling in the bakery
  // queue, cycle 3s, each out of phase with the next.
  for (var i = 2; i >= 0; i--) {
    var gx = 998 + i * 33 + Math.sin(TAU * t / 3 + i * 2.1) * 4;
    var gy = 646 + Math.abs(Math.sin(TAU * t / 3 + i * 2.1)) * -2;
    P([gx - 12, gy, gx, gy - 34, gx + 12, gy], NAVY, 1);        // body
    E(gx, gy - 16, 7.5, 9.5, PAPER, 1);                        // beard
    C(gx, gy - 27, 6.5, PAPER, 0.95);                          // face
    P([gx - 8, gy - 30, gx, gy - 50, gx + 8, gy - 30], NAVY, 1); // hat
    C(gx, gy - 24, 1.8, NAVY, 1);                              // nose shadow dot
    C(gx - 3, gy - 28, 1.2, NAVY, 1);
    C(gx + 3, gy - 28, 1.2, NAVY, 1);
  }
}

function drawMice(t) {
  // Findable 8: the mouse choir on a bench in front of the
  // cottage, rust scarves, bobbing in staggered phase on
  // the 2s cycle. The second mouse conducts.
  R(506, 640, 120, 8, NAVY, 1);
  L(516, 648, 516, 658, NAVY, 3, 1);
  L(616, 648, 616, 658, NAVY, 3, 1);
  for (var i = 0; i < 4; i++) {
    var mx = 528 + i * 26;
    var bob = Math.sin(TAU * t / 2 + i * 0.95) * 2.4;
    ctx.strokeStyle = NAVY; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(mx - 8, 634 + bob);
    ctx.quadraticCurveTo(mx - 18, 630 + bob, mx - 15, 622 + bob);
    ctx.stroke();
    E(mx, 628 + bob, 9, 11.5, NAVY, 1);          // body
    C(mx, 613 + bob, 6.5, NAVY, 1);              // head
    C(mx - 5, 607 + bob, 3.4, NAVY, 1);          // ears
    C(mx + 5, 607 + bob, 3.4, NAVY, 1);
    C(mx - 2, 612 + bob, 1.2, PAPER, 1);         // eyes
    C(mx + 2.5, 612 + bob, 1.2, PAPER, 1);
    R(mx - 7, 619 + bob, 14, 4.5, RUST, 1);      // the scarf
    if (i === 1) {                               // conductor paw
      var up = twoF(t, 0.5) === 0 ? -8 : -3;
      L(mx + 7, 624 + bob, mx + 13, 618 + bob + up, NAVY, 2.4, 1);
    }
  }
}

function drawHedgehog(t) {
  // Findable 10: a hedgehog at the left lantern post,
  // reaching up with a lit taper to light the lamp,
  // cycle 3s.
  var reach = Math.sin(TAU * t / 3);
  // Spines: short paper ticks over the back.
  E(152, 642, 17, 12.5, NAVY, 1);
  var ticks = [[-10, -8], [-4, -11], [3, -11], [9, -8], [-7, -4], [0, -6], [7, -4]];
  for (var i = 0; i < ticks.length; i++) {
    L(152 + ticks[i][0], 642 + ticks[i][1], 152 + ticks[i][0] - 2, 642 + ticks[i][1] - 4, PAPER, 1.6, 0.55);
  }
  C(168, 638, 8, NAVY, 1);                        // head
  C(175, 636, 1.6, PAPER, 1);                     // nose
  C(166, 635, 1.3, PAPER, 1);                     // eye
  C(146, 655, 3, NAVY, 1);                        // feet
  C(160, 655, 3, NAVY, 1);
  // The taper arm, rising toward the lamp.
  var tipY = 618 + reach * 3;
  L(160, 632, 148, tipY + 6, NAVY, 3, 1);
  L(148, tipY + 6, 146, tipY, NAVY, 2, 1);
  C(146, tipY - 3, 2.6, GOLD, 1);                 // taper flame
  C(146, tipY - 3, 6, GOLD, 0.25);
}

function badger(x, y, fr) {
  L(x - 6, y - 2, x - 8 + (fr ? 3 : -3), y + 9, NAVY, 3.2, 1);
  L(x + 7, y - 2, x + 9 + (fr ? -3 : 3), y + 9, NAVY, 3.2, 1);
  E(x, y - 6, 15, 10, NAVY, 1);                   // body
  C(x + 14, y - 12, 8, NAVY, 1);                  // head
  E(x + 14, y - 14, 6.5, 3.2, PAPER, 1);          // the badger stripe
  C(x + 11, y - 20, 2.8, NAVY, 1);                // ear
  C(x + 20, y - 10, 1.5, PAPER, 1);               // eye
}

function drawBadgers(t) {
  // Findable 2: the Badger family carrying a tree along
  // the path, swaying on the 6s cycle, legs alternating.
  var gx = 255 + Math.sin(TAU * t / 6) * 20;
  var gy = 664 + Math.sin(TAU * t / 2) * 1.5;
  var fr = twoF(t, 0.5);
  // The tree, held above all three: trunk and foliage.
  L(gx - 46, gy - 30, gx + 52, gy - 34, NAVY, 4, 1);
  P([gx - 12, gy - 32, gx + 4, gy - 66, gx + 20, gy - 32], NAVY, 1);
  P([gx - 4, gy - 48, gx + 4, gy - 74, gx + 13, gy - 48], NAVY, 1);
  badger(gx - 46, gy, fr);
  badger(gx, gy + 2, 1 - fr);
  badger(gx + 46, gy, fr);
  // Raised paws to the trunk.
  L(gx - 40, gy - 14, gx - 44, gy - 29, NAVY, 3, 1);
  L(gx + 6, gy - 14, gx + 3, gy - 31, NAVY, 3, 1);
  L(gx + 52, gy - 14, gx + 50, gy - 33, NAVY, 3, 1);
}

function drawDeer(t) {
  // Findable 7: a deer pulling a rust sled along the
  // path, gliding back and forth on the 6s cycle and
  // turning at the ends, legs in a 2-frame cycle.
  var ph = TAU * t / 6;
  var gx = 838 + Math.sin(ph) * 36;
  var d = Math.cos(ph) >= 0 ? 1 : -1;
  var fr = twoF(t, 0.5);
  ctx.save();
  ctx.translate(gx, 668);
  ctx.scale(d, 1);
  // The sled, behind: rust runners and slats, a paper sack.
  L(-106, 0, -56, 0, RUST, 3.5, 1);
  L(-106, 0, -100, -7, RUST, 3.5, 1);
  R(-102, -10, 42, 5, RUST, 1);
  L(-98, -5, -98, 0, RUST, 2.5, 1);
  L(-66, -5, -66, 0, RUST, 2.5, 1);
  E(-81, -17, 12, 9, PAPER, 1);
  C(-81, -24, 2.2, NAVY, 1);
  // Harness.
  L(-22, -20, -58, -8, NAVY, 2, 0.8);
  // Legs, alternating pairs.
  var l1 = fr ? 5 : -5, l2 = fr ? -5 : 5;
  L(-14, -12, -16 + l1, 0, NAVY, 3.4, 1);
  L(-6, -12, -4 + l2, 0, NAVY, 3.4, 1);
  L(12, -12, 10 + l2, 0, NAVY, 3.4, 1);
  L(19, -12, 21 + l1, 0, NAVY, 3.4, 1);
  E(0, -20, 25, 14, NAVY, 1);                     // body
  P([-24, -28, -30, -38, -20, -34], NAVY, 1);     // tail
  L(16, -28, 29, -42, NAVY, 6, 1);                // neck
  E(35, -44, 10.5, 6.5, NAVY, 1);                 // head
  L(30, -49, 24, -60, NAVY, 2, 1);                // antlers
  L(24, -54, 19, -57, NAVY, 1.6, 1);
  L(36, -50, 34, -62, NAVY, 2, 1);
  L(34, -56, 29, -60, NAVY, 1.6, 1);
  C(38, -45, 1.6, PAPER, 1);                      // eye
  ctx.restore();
}

function drawFox(t) {
  // Findable 4: a fox trotting the path with a letter,
  // swaying on the 6s cycle, legs in a 2-frame cycle.
  var gx = 600 + Math.sin(TAU * t / 6) * 40;
  var fr = twoF(t, 0.5);
  ctx.save();
  ctx.translate(gx, 662);
  var l1 = fr ? 4 : -4;
  L(-12, 4, -14 + l1, 14, NAVY, 3.4, 1);
  L(-4, 4, -2 - l1, 14, NAVY, 3.4, 1);
  L(10, 4, 8 - l1, 14, NAVY, 3.4, 1);
  L(17, 4, 19 + l1, 14, NAVY, 3.4, 1);
  // The brush tail, behind and low.
  ctx.save();
  ctx.translate(-20, -2); ctx.rotate(-0.25);
  E(0, 0, 16, 8, NAVY, 1);
  E(-12, 0, 6, 5.5, PAPER, 0.9);
  ctx.restore();
  E(0, -2, 21, 11.5, NAVY, 1);                    // body
  E(13, 1, 8, 7, PAPER, 0.9);                     // chest
  C(24, -11, 9.5, NAVY, 1);                       // head
  P([30, -14, 43, -8, 30, -5], NAVY, 1);         // snout
  P([17, -17, 19, -27, 24, -18], NAVY, 1);       // ears
  P([25, -18, 29, -27, 31, -16], NAVY, 1);
  C(25, -12, 1.6, PAPER, 1);                      // eye
  // The letter, held out in front.
  ctx.save();
  ctx.translate(36, 2); ctx.rotate(0.15);
  R(-8, -6, 16, 12, PAPER, 1);
  ctx.strokeStyle = NAVY; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.4;
  ctx.strokeRect(-8, -6, 16, 12);
  L(-8, -6, 0, 1, NAVY, 1.1, 0.55);
  L(8, -6, 0, 1, NAVY, 1.1, 0.55);
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawBears(t) {
  // Findable 1: two bear children ice-skating the lake,
  // circling on the 6s cycle in opposite phases.
  for (var i = 0; i < 2; i++) {
    var a = TAU * (t % 6) / 6 + i * Math.PI;
    var bx = 300 + Math.cos(a) * 58;
    var by = 740 + Math.sin(a) * 15;
    var d = -Math.sin(a) >= 0 ? 1 : -1;
    var fr = twoF(t + i * 0.5, 0.5);
    ctx.save();
    ctx.translate(bx, by);
    ctx.scale(d, 1);
    L(-9, 13, 5, 13, NAVY, 2.2, 0.7);             // skate blade
    L(-4, 4, -6 + (fr ? 3 : -3), 12, NAVY, 3.4, 1);
    L(6, 4, 8 + (fr ? -3 : 3), 12, NAVY, 3.4, 1);
    E(0, 0, 17, 13, NAVY, 1);                     // body
    L(4, -2, 13 + (fr ? -4 : 4), 6, NAVY, 3.4, 1); // swinging arm
    C(14, -10, 9.5, NAVY, 1);                     // head
    C(8, -18, 3.6, NAVY, 1);                      // ears
    C(19, -18, 3.6, NAVY, 1);
    E(19, -6, 5, 4, PAPER, 0.9);                  // muzzle
    C(15, -11, 1.6, PAPER, 1);                    // eye
    ctx.restore();
  }
}

function rabbit(x, y, t, ph, ball) {
  var hop = Math.abs(Math.sin(TAU * t / 2 + ph)) * 7;
  ctx.save();
  ctx.translate(x, y - hop);
  E(0, 0, 13, 10, NAVY, 1);                       // body
  C(10, -9, 8, NAVY, 1);                          // head
  ctx.save(); ctx.translate(7, -14); ctx.rotate(-0.15);
  E(0, -8, 3, 9.5, NAVY, 1); ctx.restore();       // ears
  ctx.save(); ctx.translate(13, -13); ctx.rotate(0.12);
  E(0, -8, 3, 8.5, NAVY, 1); ctx.restore();
  C(12, -10, 1.4, PAPER, 1);                      // eye
  C(-12, -3, 4.2, PAPER, 1);                      // tail
  if (ball) C(16, 2, 5.5, PAPER, 1);              // the snowball
  ctx.restore();
}

function drawRabbits(t) {
  // Findable 6: a rabbit family building a snowman on
  // the right snowfield, hopping on the 2s cycle.
  // The snowman: paper, with a navy outline and buttons.
  C(988, 772, 25, PAPER, 1);
  C(988, 730, 18, PAPER, 1);
  C(988, 698, 12.5, PAPER, 1);
  ctx.strokeStyle = NAVY; ctx.globalAlpha = 0.35; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(988, 772, 25, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(988, 730, 18, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(988, 698, 12.5, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
  C(988, 722, 2, NAVY, 1);
  C(988, 738, 2, NAVY, 1);
  C(988, 762, 2.2, NAVY, 1);
  C(984, 696, 1.5, NAVY, 1);
  C(992, 696, 1.5, NAVY, 1);
  L(972, 726, 950, 712, NAVY, 2.6, 1);            // stick arms
  L(1004, 726, 1026, 714, NAVY, 2.6, 1);
  rabbit(908, 762, t, 0, true);
  rabbit(938, 776, t, 2.2, false);
}

// The findables, asserted at exactly ten. Hit circles sit
// on the authored anchors; moving finds sway inside them.
var FIND = [
  { x: 300, y: 740, r: 80, draw: drawBears },
  { x: 255, y: 660, r: 62, draw: drawBadgers },
  { x: 1030, y: 620, r: 58, draw: drawGnomes },
  { x: 600, y: 662, r: 56, draw: drawFox },
  { x: 1165, y: 283, r: 52, draw: drawOwl },
  { x: 945, y: 748, r: 72, draw: drawRabbits },
  { x: 838, y: 660, r: 68, draw: drawDeer },
  { x: 566, y: 620, r: 52, draw: drawMice },
  { x: 766, y: 598, r: 46, draw: drawCat },
  { x: 146, y: 624, r: 54, draw: drawHedgehog }
];
if (FIND.length !== 10) throw new Error('Wimmelwald needs exactly 10 findables');
// ---- snowfall -------------------------------------------
function drawSnow() {
  for (var i = 0; i < SNOW.length; i++) {
    var f = SNOW[i];
    var y = ((f.ph + (T / LOOP) * f.falls) % 1) * (DH + 36) - 18;
    var x = f.x + Math.sin(TAU * T / f.swayPer + f.swayPh) * f.swayAmp;
    C(x + 1.5, y + 1.5, f.r, NAVY, 0.16);   // faint blue shade
    C(x, y, f.r, PAPER, 0.95);             // the flake
  }
}

// ---- motion state ---------------------------------------
// Constant first-frame phase: T = 21.4s into the 60s loop.
// The village is complete, the skaters are mid-glide, the
// fox and deer mid-path, the snowfall mid-fall, the camera
// wide. Frame one is drawn synchronously at this constant;
// the rAF loop advances T from the same anchor in fixed
// ticks. Frame one never reads a wall clock.
var T = 21.4;
var lastNow = -1, acc = 0;

// ---- camera ---------------------------------------------
// The camera lives inside the design transform: the wide
// view is the whole scene; a tap on a findable eases the
// camera to it at FOCUS_Z; a double-tap returns wide. The
// ease runs on fixed ticks in step(), so it is the same
// on every device.
var WIDE = { x: DW / 2, y: DH / 2, z: 1 };
var cam = { x: WIDE.x, y: WIDE.y, z: 1 };
var camTgt = { x: WIDE.x, y: WIDE.y, z: 1 };
var ring = null; // { x, y, r, t0 } while a focus ring pulses
function focusZ() { return phone ? 3.0 : 2.35; }

function step() {
  cam.x += (camTgt.x - cam.x) * 0.085;
  cam.y += (camTgt.y - cam.y) * 0.085;
  cam.z += (camTgt.z - cam.z) * 0.085;
  if (Math.abs(camTgt.x - cam.x) < 0.05) cam.x = camTgt.x;
  if (Math.abs(camTgt.y - cam.y) < 0.05) cam.y = camTgt.y;
  if (Math.abs(camTgt.z - cam.z) < 0.002) cam.z = camTgt.z;
}

// ---- pointer: tap a findable, double-tap to step back ---
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
function toScene(p) {
  return { x: cam.x + (p.x - DW / 2) / cam.z, y: cam.y + (p.y - DH / 2) / cam.z };
}
var downInfo = null;
var lastTapT = -99;
function handleTap(p) {
  if (T - lastTapT < 0.45) {           // double-tap: step back
    camTgt = { x: WIDE.x, y: WIDE.y, z: 1 };
    ring = null;
    lastTapT = -99;
    return;
  }
  lastTapT = T;
  var sp = toScene(p);
  var best = null, bestD = 1e9;
  for (var i = 0; i < FIND.length; i++) {
    var f = FIND[i];
    var rr = f.r * (phone ? 1.25 : 1);
    var dx = sp.x - f.x, dy = sp.y - f.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < rr && d < bestD) { best = f; bestD = d; }
  }
  if (best) {
    camTgt = { x: best.x, y: best.y, z: focusZ() };
    ring = { x: best.x, y: best.y, r: best.r, t0: T };
  }
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downInfo = { x: p.x, y: p.y, t: T, moved: false };
});
canvas.addEventListener('pointermove', function (e) {
  if (!downInfo) return;
  var p = toDesign(e);
  var dx = p.x - downInfo.x, dy = p.y - downInfo.y;
  if (Math.sqrt(dx * dx + dy * dy) > 16) downInfo.moved = true;
});
canvas.addEventListener('pointerup', function (e) {
  if (!downInfo) return;
  var info = downInfo;
  downInfo = null;
  if (!info.moved && T - info.t < 0.8) handleTap(toDesign(e));
});
canvas.addEventListener('pointercancel', function () { downInfo = null; });
canvas.addEventListener('pointerleave', function () { downInfo = null; });

// Painter order for the finds: back to front by anchor.
var FIND_ORDER = [4, 8, 2, 7, 9, 1, 6, 3, 0, 5];

function draw() {
  ctx.fillStyle = PAPER;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);
  ctx.save();
  ctx.translate(DW / 2, DH / 2);
  ctx.scale(cam.z, cam.z);
  ctx.translate(-cam.x, -cam.y);
  drawSky();
  drawRidge();
  drawGround();
  drawLake();
  drawPath();
  drawHouseA(T);
  drawTinyHouse();
  drawCottageB();
  drawBakery(T);
  drawTower();
  drawForest();
  drawLanternPost(140, 652, T);
  drawLanternPost(1104, 666, T);
  for (var i = 0; i < FIND_ORDER.length; i++) FIND[FIND_ORDER[i]].draw(T);
  drawSnow();
  if (ring) {
    var p = (T - ring.t0) / 1.2;
    if (p >= 1) {
      ring = null;
    } else {
      C(ring.x, ring.y, ring.r * (0.8 + 0.5 * p), GOLD, 0.10 * (1 - p));
      ctx.strokeStyle = GOLD;
      ctx.globalAlpha = 0.9 * (1 - p);
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(ring.x, ring.y, ring.r * (0.8 + 0.5 * p), 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
}

// ---- sizing: centred fit, page ground = paper tone ------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
