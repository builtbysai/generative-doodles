<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From the Rotting Body, Flowers</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #BFE3D0; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ---------- palette (strict) ----------
var MINT  = '#BFE3D0';
var BONE  = '#F2EFE6';
var GREEN = '#6A9A5B';
var PINK  = '#E87B9C';
var GOLD  = '#F2C14E';
var NIGHT = '#2B3A67';

// ---------- seeded rng ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function smooth(a, b, x) {
  var t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}
function lerp(a, b, t) { return a + (b - a) * t; }

// ---------- cycle ----------
// u in [0,1): bare [0,.20) shoots [.20,.46) bloom [.46,.72) fall [.72,1)
var CYCLE_S = 48;
var U0 = 0.355; // frame one: shoots just begun

// ---------- canvas ----------
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, lastElapsed = 0;

function viewSize() {
  var vv = window.visualViewport;
  var w = vv && vv.width ? vv.width : window.innerWidth;
  var h = vv && vv.height ? vv.height : window.innerHeight;
  return { w: w, h: h };
}
function isPhone() {
  var sw = 9999, sh = 9999;
  if (window.screen) { sw = window.screen.width || 9999; sh = window.screen.height || 9999; }
  if (Math.min(sw, sh) < 700) return true;
  return H > W * 1.15 && W < 700;
}
function resize() {
  var s = viewSize();
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = s.w; H = s.h;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw(lastElapsed);
}
if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
window.addEventListener('resize', resize);

// ---------- flora generation (seeded, fixed) ----------
var SEED = 620075;
var plants = [];
var moss = [];
(function buildFlora() {
  var rng = mulberry32(SEED);
  var i, p;
  for (i = 0; i < 60; i++) {
    var bx = (rng() * 2 - 1) * 238;
    var by = (rng() * 2 - 1) * 26;
    // direction: outward, biased away from the body axis
    var dx = bx / 240 * 0.9 + (rng() - 0.5) * 0.9;
    var dy = (by >= 0 ? 1 : -1) * (0.45 + rng() * 0.65) + (rng() - 0.5) * 0.3;
    var dl = Math.sqrt(dx * dx + dy * dy) || 1;
    dx /= dl; dy /= dl;
    var typeR = rng();
    var type = typeR < 0.55 ? 'stem' : (typeR < 0.80 ? 'frond' : 'sprig');
    var len = type === 'frond' ? 70 + rng() * 120 : 100 + rng() * 175;
    if (Math.abs(bx) > 180) len *= 0.8;
    p = {
      bx: bx, by: by, dx: dx, dy: dy, len: len, type: type,
      bend: (rng() - 0.5) * 46,
      stag: clamp(Math.abs(bx) / 240 * 0.45 + rng() * 0.3 - 0.08, 0, 0.8),
      bstag: rng(),
      swayPh: rng() * Math.PI * 2,
      swaySp: 0.7 + rng() * 0.6,
      leafN: 2 + Math.floor(rng() * 2),
      fr: 9 + rng() * 6.5,
      fcol: rng() < 0.5 ? PINK : GOLD,
      prot: rng() * Math.PI * 2,
      petalN: 5 + Math.floor(rng() * 2),
      thresholds: [], spins: [], drifts: []
    };
    for (var j = 0; j < p.petalN; j++) {
      p.thresholds.push(0.73 + rng() * 0.21);
      p.spins.push((rng() - 0.5) * 3.2);
      p.drifts.push(rng() * Math.PI * 2);
    }
    plants.push(p);
  }
  // exactly three night flowers, spread across the field
  var flowerIdx = [];
  for (i = 0; i < plants.length; i++) if (plants[i].type === 'stem') flowerIdx.push(i);
  var picks = [0.18, 0.5, 0.82];
  for (i = 0; i < picks.length; i++) {
    var k = flowerIdx[Math.floor(picks[i] * flowerIdx.length)];
    plants[k].fcol = NIGHT;
  }
  // moss dots hugging the bones
  var mrng = mulberry32(SEED + 7);
  for (i = 0; i < 46; i++) {
    moss.push({
      x: (mrng() * 2 - 1) * 248,
      y: (mrng() * 2 - 1) * 22,
      r: 1.6 + mrng() * 1.9,
      a: 0.45 + mrng() * 0.45
    });
  }
})();

// per-plant growth / bloom as functions of cycle u
function plantGrowth(u, stag) {
  var rise = smooth(0.20 + stag * 0.16, 0.44 + stag * 0.10, u);
  var shrink = smooth(0.82 + stag * 0.08, 0.985, u);
  return rise * (1 - shrink * 0.92);
}
function bloomOpen(u, bstag) {
  var open = smooth(0.46 + bstag * 0.12, 0.64 + bstag * 0.08, u);
  var close = smooth(0.80, 0.96, u);
  return open * (1 - close * 0.85);
}

// ---------- interaction state ----------
var uOffset = 0;
var jump = null; // {from,to,start}
var windX = 0, windT = -100;
var dragging = false, dragMoved = false, downX = 0, downY = 0, lastTapT = -1000, downT = 0;

function currentU(elapsed) {
  var base = U0 + elapsed / CYCLE_S;
  if (jump) {
    var pr = clamp((elapsed - jump.start) / 0.9, 0, 1);
    var e = pr * pr * (3 - 2 * pr);
    var u = lerp(jump.from, jump.to, e);
    uOffset = u - base;
    if (pr >= 1) jump = null;
    return u - Math.floor(u);
  }
  var uu = base + uOffset;
  return uu - Math.floor(uu);
}
function advancePhase(elapsed) {
  var u = currentU(elapsed);
  var bounds = [0.20, 0.46, 0.72, 1.00];
  var target = 1.00;
  for (var i = 0; i < bounds.length; i++) {
    if (bounds[i] > u + 0.002) { target = bounds[i]; break; }
  }
  var base = U0 + elapsed / CYCLE_S + uOffset;
  var from = base;
  var to = base + (target - u);
  if (to <= from) to += 1;
  jump = { from: from, to: to, start: elapsed };
}
function windNow(elapsed) {
  var age = elapsed - windT;
  if (age < 0) return 0;
  return windX * Math.exp(-age * 1.1);
}

canvas.addEventListener('pointerdown', function (e) {
  dragging = true; dragMoved = false;
  downX = e.clientX; downY = e.clientY; downT = lastElapsed;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var dx = e.clientX - downX;
  if (Math.abs(dx) > 6 || Math.abs(e.clientY - downY) > 6) dragMoved = true;
  if (dragMoved) {
    windX = clamp(dx / 180, -1, 1);
    windT = lastElapsed;
  }
});
canvas.addEventListener('pointerup', function (e) {
  if (!dragging) return;
  dragging = false;
  if (dragMoved) { windT = lastElapsed; return; }
  // tap
  if (lastElapsed - lastTapT < 0.32) {
    advancePhase(lastElapsed);
    lastTapT = -1000;
  } else {
    lastTapT = lastElapsed;
  }
});

// ---------- drawing helpers ----------
function quadAt(bx, by, cx, cy, ex, ey, t) {
  var a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t;
  return { x: a * bx + b * cx + c * ex, y: a * by + b * cy + c * ey };
}
function stemPoints(p, g, swayX, unit) {
  var bx = p.bx, by = p.by;
  var ex = bx + p.dx * p.len, ey = by + p.dy * p.len;
  var px = -p.dy, py = p.dx;
  var cx = bx + p.dx * p.len * 0.5 + px * p.bend, cy = by + p.dy * p.len * 0.5 + py * p.bend;
  cx += swayX * 0.5; cy += 0;
  ex += swayX; ey += swayX * 0.12;
  var pts = [], N = 18, i, t;
  for (i = 0; i <= N; i++) {
    t = (i / N) * g;
    pts.push(quadAt(bx, by, cx, cy, ex, ey, t));
  }
  return { pts: pts, tip: quadAt(bx, by, cx, cy, ex, ey, g), cx: cx, cy: cy, ex: ex, ey: ey };
}
function drawLeaf(x, y, ang, size, unit) {
  ctx.save();
  ctx.translate(x * unit, y * unit);
  ctx.rotate(ang);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(size * unit * 0.5, -size * unit * 0.34, size * unit, 0);
  ctx.quadraticCurveTo(size * unit * 0.5, size * unit * 0.34, 0, 0);
  ctx.fillStyle = GREEN;
  ctx.fill();
  ctx.restore();
}
function drawFlower(x, y, r, col, open, rot, petalMask, unit) {
  var n = petalMask.length;
  ctx.save();
  ctx.translate(x * unit, y * unit);
  for (var k = 0; k < n; k++) {
    if (!petalMask[k]) continue;
    var a = rot + k / n * Math.PI * 2;
    var d = r * 0.52 * open;
    ctx.save();
    ctx.translate(Math.cos(a) * d * unit, Math.sin(a) * d * unit);
    ctx.rotate(a);
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.60 * open * unit, r * 0.32 * open * unit, 0, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.fill();
    ctx.restore();
  }
  ctx.beginPath();
  ctx.arc(0, 0, Math.max(r * 0.30 * open, 0.4) * unit, 0, Math.PI * 2);
  ctx.fillStyle = col === NIGHT ? BONE : (col === PINK ? GOLD : PINK);
  ctx.fill();
  ctx.restore();
}

// ---------- skeleton (design coords, skull left, feet right) ----------
function boneLine(x1, y1, x2, y2, w, unit) {
  ctx.strokeStyle = BONE;
  ctx.lineWidth = w * unit;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1 * unit, y1 * unit);
  ctx.lineTo(x2 * unit, y2 * unit);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x1 * unit, y1 * unit, w * 0.62 * unit, 0, Math.PI * 2);
  ctx.arc(x2 * unit, y2 * unit, w * 0.62 * unit, 0, Math.PI * 2);
  ctx.fillStyle = BONE;
  ctx.fill();
}
function drawSkeleton(unit) {
  ctx.save();
  // back limbs (drawn first)
  boneLine(58, 12, 136, 22, 8, unit);   // back femur
  boneLine(136, 22, 210, 14, 6.5, unit); // back tibia
  boneLine(210, 14, 228, 9, 4.5, unit);  // back foot
  boneLine(-88, 6, -52, 36, 7, unit);    // back upper arm
  boneLine(-52, 36, -18, 28, 6, unit);   // back forearm
  // vertebrae
  var i, x;
  ctx.fillStyle = BONE;
  for (i = 0; i < 13; i++) {
    x = -150 + i * 16;
    ctx.beginPath();
    ctx.arc(x * unit, (Math.sin(i * 0.7) * 2) * unit, 5.4 * unit, 0, Math.PI * 2);
    ctx.fill();
  }
  // ribcage: nested ellipse arcs
  ctx.strokeStyle = BONE;
  ctx.lineWidth = 6.4 * unit;
  for (i = 0; i < 5; i++) {
    var cx = -98 + i * 17, rx = 33 - i * 1.8, ry = 29 - i * 1.4;
    ctx.beginPath();
    ctx.ellipse(cx * unit, 1 * unit, rx * unit, ry * unit, 0.12, Math.PI * 0.08, Math.PI * 0.92);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(cx * unit, 1 * unit, rx * unit, ry * unit, 0.12, Math.PI * 1.08, Math.PI * 1.92);
    ctx.stroke();
  }
  // spine over the ribs
  boneLine(-152, 0, 44, 1, 7, unit);
  // pelvis
  ctx.beginPath();
  ctx.ellipse(60 * unit, 3 * unit, 21 * unit, 14 * unit, 0.25, 0, Math.PI * 2);
  ctx.fillStyle = BONE;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(48 * unit, -4 * unit, 9 * unit, 0, Math.PI * 2);
  ctx.fill();
  // scapula
  ctx.beginPath();
  ctx.moveTo(-104 * unit, -14 * unit);
  ctx.lineTo(-84 * unit, -10 * unit);
  ctx.lineTo(-94 * unit, 4 * unit);
  ctx.closePath();
  ctx.fill();
  // skull: cranium + jaw, profile facing left
  ctx.beginPath();
  ctx.arc(-196 * unit, -10 * unit, 30 * unit, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath(); // jaw and face block
  ctx.moveTo(-224 * unit, -2 * unit);
  ctx.lineTo(-206 * unit, 2 * unit);
  ctx.lineTo(-204 * unit, 15 * unit);
  ctx.lineTo(-220 * unit, 17 * unit);
  ctx.closePath();
  ctx.fill();
  // eye socket (calm), nose gap: mint cut-outs
  ctx.fillStyle = MINT;
  ctx.beginPath();
  ctx.arc(-205 * unit, -11 * unit, 7.4 * unit, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-226 * unit, -1 * unit);
  ctx.lineTo(-219 * unit, 1 * unit);
  ctx.lineTo(-224 * unit, 6 * unit);
  ctx.closePath();
  ctx.fill();
  // teeth lines
  ctx.strokeStyle = MINT;
  ctx.lineWidth = 1.8 * unit;
  ctx.beginPath();
  ctx.moveTo(-217 * unit, 8 * unit); ctx.lineTo(-217 * unit, 15 * unit);
  ctx.moveTo(-211 * unit, 9 * unit); ctx.lineTo(-211 * unit, 16 * unit);
  ctx.stroke();
  // front limbs
  boneLine(-92, -2, -58, 30, 8, unit);   // front upper arm
  boneLine(-58, 30, -24, 20, 6.5, unit); // front forearm
  boneLine(-24, 20, -12, 24, 4, unit);   // hand hint
  boneLine(66, 4, 146, 12, 8.5, unit);   // front femur
  boneLine(146, 12, 222, 2, 7, unit);    // front tibia
  boneLine(222, 2, 241, -2, 5, unit);    // front foot
  ctx.restore();
}

// ---------- main draw ----------
function draw(elapsed) {
  lastElapsed = elapsed;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var u = currentU(elapsed);
  var phone = isPhone();
  var figLen = phone ? W * 0.88 : Math.min(W * 0.64, H * 1.0);
  var unit = figLen / 520;
  var cx = W / 2, cy = H * 0.52;
  var wind = windNow(elapsed);

  ctx.fillStyle = MINT;
  ctx.fillRect(0, 0, W, H);

  // moon, top-left corner, bone white disc
  var mr = Math.min(W, H) * 0.034 + 6;
  ctx.beginPath();
  ctx.arc(W * 0.055, H * 0.075, mr, 0, Math.PI * 2);
  ctx.fillStyle = BONE;
  ctx.fill();

  ctx.save();
  ctx.translate(cx, cy);

  // flora (behind the bones, so the figure always reads)
  var i, p, g, swayX, st, tip;
  for (i = 0; i < plants.length; i++) {
    p = plants[i];
    g = plantGrowth(u, p.stag);
    if (g <= 0.01) continue;
    swayX = (Math.sin(elapsed * p.swaySp + p.swayPh) * 5 + wind * 16) * g;
    st = stemPoints(p, g, swayX, unit);
    // stem
    ctx.beginPath();
    ctx.moveTo(st.pts[0].x * unit, st.pts[0].y * unit);
    for (var s = 1; s < st.pts.length; s++) ctx.lineTo(st.pts[s].x * unit, st.pts[s].y * unit);
    ctx.strokeStyle = GREEN;
    ctx.lineWidth = Math.max(2.3 * unit * (p.type === 'frond' ? 0.7 : 1), 1.1);
    ctx.lineCap = 'round';
    ctx.stroke();
    if (p.type === 'frond') {
      // coral branchlets along the stem
      ctx.lineWidth = Math.max(1.1 * unit, 0.8);
      for (var b = 0; b < 6; b++) {
        var bt = 0.3 + b * 0.11;
        if (bt > g) break;
        var bp = quadAt(p.bx, p.by, st.cx, st.cy, st.ex, st.ey, bt);
        var bl = (1 - bt) * p.len * 0.34 * g;
        var ba = Math.atan2(p.dy, p.dx) + (b % 2 === 0 ? -0.65 : 0.65);
        ctx.beginPath();
        ctx.moveTo(bp.x * unit, bp.y * unit);
        ctx.lineTo((bp.x + Math.cos(ba) * bl) * unit, (bp.y + Math.sin(ba) * bl) * unit);
        ctx.stroke();
        var tipb = { x: bp.x + Math.cos(ba) * bl, y: bp.y + Math.sin(ba) * bl };
        ctx.beginPath();
        ctx.moveTo(tipb.x * unit, tipb.y * unit);
        ctx.lineTo((tipb.x + Math.cos(ba - 0.5) * bl * 0.4) * unit, (tipb.y + Math.sin(ba - 0.5) * bl * 0.4) * unit);
        ctx.moveTo(tipb.x * unit, tipb.y * unit);
        ctx.lineTo((tipb.x + Math.cos(ba + 0.5) * bl * 0.4) * unit, (tipb.y + Math.sin(ba + 0.5) * bl * 0.4) * unit);
        ctx.stroke();
      }
    } else {
      // leaves along the grown stem
      var leafSpots = [0.34, 0.58, 0.82];
      for (var lf = 0; lf < p.leafN + 1 && lf < leafSpots.length; lf++) {
        var lt = leafSpots[lf];
        if (lt > g) break;
        var lp = quadAt(p.bx, p.by, st.cx, st.cy, st.ex, st.ey, lt);
        var lang = Math.atan2(p.dy, p.dx) + (lf % 2 === 0 ? -0.75 : 0.75);
        var lsize = (12 + (lf * 3.2)) * clamp((g - lt) * 3 + 0.4, 0.4, 1.15);
        drawLeaf(lp.x, lp.y, lang, lsize, unit);
      }
    }
    tip = st.tip;
    // flowers
    var open = bloomOpen(u, p.bstag);
    if (p.type === 'stem' && g > 0.8 && open > 0.03) {
      var mask = [];
      for (var m = 0; m < p.petalN; m++) mask.push(!(u > 0.72 && u > p.thresholds[m]));
      drawFlower(tip.x, tip.y, p.fr, p.fcol, open, p.prot, mask, unit);
    }
    if (p.type === 'sprig' && g > 0.55 && open > 0.03) {
      var spots = [0.62, 0.82, 1.0];
      for (var sg = 0; sg < spots.length; sg++) {
        var sgt = spots[sg] * g;
        var sp = quadAt(p.bx, p.by, st.cx, st.cy, st.ex, st.ey, sgt);
        var off = (sg % 2 === 0 ? -1 : 1) * 7;
        var mask2 = [];
        for (var m2 = 0; m2 < p.petalN; m2++) mask2.push(!(u > 0.72 && u > p.thresholds[m2]));
        drawFlower(sp.x - p.dy * off, sp.y + p.dx * off, p.fr * 0.68, p.fcol, open, p.prot + sg, mask2, unit);
      }
    }
  }

  // moss hugging the bones
  for (i = 0; i < moss.length; i++) {
    ctx.globalAlpha = moss[i].a;
    ctx.beginPath();
    ctx.arc(moss[i].x * unit, moss[i].y * unit, moss[i].r * unit, 0, Math.PI * 2);
    ctx.fillStyle = GREEN;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // the figure, always on top, always recognizable
  drawSkeleton(unit);

  // falling petals (fall phase), in front
  if (u > 0.72) {
    for (i = 0; i < plants.length; i++) {
      p = plants[i];
      if (p.type === 'frond') continue;
      g = plantGrowth(u, p.stag);
      if (g < 0.6) continue;
      swayX = (Math.sin(elapsed * p.swaySp + p.swayPh) * 5 + wind * 16) * g;
      st = stemPoints(p, g, swayX, unit);
      tip = st.tip;
      var openF = bloomOpen(u, p.bstag);
      if (openF < 0.02 && u < 0.9) { /* flower spent */ }
      for (var j = 0; j < p.petalN; j++) {
        if (u <= p.thresholds[j]) continue;
        var age = (u - p.thresholds[j]) * CYCLE_S; // seconds since detach
        var fx = tip.x + Math.sin(age * 1.7 + p.drifts[j]) * 9 + wind * age * 6;
        var fy = tip.y + age * age * 4.2 + age * 5;
        if (fy > 340) continue;
        var al = clamp(1.15 - age / 4.2, 0, 1);
        if (al <= 0) continue;
        ctx.save();
        ctx.globalAlpha = al;
        ctx.translate(fx * unit, fy * unit);
        ctx.rotate(age * p.spins[j]);
        ctx.beginPath();
        ctx.ellipse(0, 0, p.fr * 0.55 * unit, p.fr * 0.30 * unit, 0, 0, Math.PI * 2);
        ctx.fillStyle = p.fcol;
        ctx.fill();
        ctx.restore();
      }
    }
  }

  ctx.restore();
}

// ---------- run ----------
resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var t0 = null;
  var loop = function (ts) {
    if (t0 === null) t0 = ts;
    draw((ts - t0) / 1000);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
