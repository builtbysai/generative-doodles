<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№620 Third Hand Dealt</title>
<style>
  html, body { margin: 0; padding: 0; background: #26262a; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Third Hand Dealt, CW2 / PP1208, study #256 caius-williams.
  // A dark gray ground with black gestural calligraphic brush
  // marks, after the GRAIN Series#1 covers. Three voices sound:
  // each is a hand dealt into the trio. The same small set of
  // six motifs persists across deals; only the voicing changes,
  // tenor-like against bass-like against percussion-like. Tap
  // deals a new hand: the trio re-voices with the same motif
  // set, personnel rotating per the patch-bay logic. Tap is a
  // deal, never a reseed; the motifs never change, only the
  // hands. Visual only: the prompt's WebAudio is not built;
  // the visuals run on a closed-form sound model, no audio.
  var GROUND = '#26262a'; // dark gray ground
  var INK = '#111114';    // ink black
  var INK_SOFT = '#1c1c20'; // ink, softened
  var OCHRE = '#d9a441';   // tenor accent, warm ochre
  var RUST = '#b4552d';    // bass accent, rust
  var CHALK = '#e8e4d8';   // percussion accent, chalk
  var PAPER = '#e8e4d8';   // plate text, chalk white

  // Fixed-phase first frame: FIRST_T = 18 s. At t = 18 the
  // three tokens sit mid-orbit at spread angles, radii mid
  // pulse, and the dealt hand (deal 0: motifs 0, 2, 4) is fully
  // in, so frame one already shows the trio dealing in and out
  // around the ink field.
  var FIRST_T = 18;
  var SEED = 1961;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at
  // load. ?deal=<n> sets the dealt hand at load; ?seed=<n> is
  // accepted as an alias for the deal, so the node-canvas render
  // tool (which passes its probe value as ?seed=) can verify
  // that a new deal re-voices the trio. Read at load only.
  var probeT = null, probeDeal = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    var md = qs.match(/[?&]deal=([0-9]+)/);
    if (md) { probeDeal = parseInt(md[1], 10); }
    if (probeDeal === null) {
      var ms = qs.match(/[?&]seed=([0-9]+)/);
      if (ms) { probeDeal = parseInt(ms[1], 10); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Fresh instances per draw from the
  // piece number and fixed salts, so every frame is a pure
  // function of t and the deal count.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  // The three voices. Each holds one warm accent and one
  // character: tenor-like (quick, high), bass-like (slow, low),
  // percussion-like (dry, struck). Orbit speeds and pulse
  // phases are fixed per voice.
  var VOICES = [
    { name: 'tenor', col: OCHRE, w: 0.060, ph: 0.0, a0: -Math.PI / 2 },
    { name: 'bass', col: RUST, w: 0.045, ph: 2.1, a0: Math.PI / 6 },
    { name: 'percussion', col: CHALK, w: 0.080, ph: 4.2, a0: Math.PI * 5 / 6 }
  ];

  // The motif bank: six motifs, fixed for the whole piece.
  // Deal d gives voice v the motif (d + 2v) mod 6, so each deal
  // sounds three of the six and the set rotates through all six
  // as hands are dealt. The bank itself never changes.
  var MOTIFS = ['sweep', 'slash', 'dot run', 'cross', 'arc', 'stab'];
  function motifFor(deal, v) { return (deal + v * 2) % 6; }
  function handFor(deal) {
    return [motifFor(deal, 0), motifFor(deal, 1), motifFor(deal, 2)];
  }

  // Deal state. dealT is the virtual time of the last deal;
  // a deal crossfades old motif to new over 1.2 s.
  var deal = (probeDeal !== null) ? probeDeal : 0;
  var dealT = -1000;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function lerp(a, b, f) { return a + (b - a) * f; }

  var L = {};
  function layout() {
    var u = Math.min(W, H);
    L.u = u;
    if (isPhone) {
      L.cx = W / 2; L.cy = H * 0.42;
      L.rx = W * 0.36; L.ry = H * 0.22;
      L.bankY = H * 0.82;
    } else {
      L.cx = W / 2; L.cy = H * 0.46;
      L.rx = u * 0.30; L.ry = u * 0.30;
      L.bankY = H * 0.84;
    }
    L.tokenS = u * 0.085;
    L.bankS = isPhone ? W * 0.045 : u * 0.042;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Quadratic bezier point.
  function qpt(x0, y0, cx, cy, x1, y1, s) {
    var mx = lerp(lerp(x0, cx, s), lerp(cx, x1, s), s);
    var my = lerp(lerp(y0, cy, s), lerp(cy, y1, s), s);
    return { x: mx, y: my };
  }

  // One tapered gestural brush stroke: a filled ribbon along a
  // quadratic curve, wide at the start, tapering to a point.
  // moveTo before every subpath so batched arcs never connect.
  function brushStroke(x0, y0, cx, cy, x1, y1, w0, w1, col, alpha) {
    var steps = 20, i;
    var top = [], bot = [];
    for (i = 0; i <= steps; i++) {
      var s = i / steps;
      var p = qpt(x0, y0, cx, cy, x1, y1, s);
      var p2 = qpt(x0, y0, cx, cy, x1, y1, Math.min(1, s + 0.02));
      var dx = p2.x - p.x, dy = p2.y - p.y;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var nx = -dy / len, ny = dx / len;
      var w = lerp(w0, w1, s) / 2;
      top.push({ x: p.x + nx * w, y: p.y + ny * w });
      bot.push({ x: p.x - nx * w, y: p.y - ny * w });
    }
    ctx.fillStyle = hexA(col, a4(alpha));
    ctx.beginPath();
    ctx.moveTo(top[0].x, top[0].y);
    for (i = 1; i < top.length; i++) { ctx.lineTo(top[i].x, top[i].y); }
    for (i = bot.length - 1; i >= 0; i--) { ctx.lineTo(bot[i].x, bot[i].y); }
    ctx.closePath();
    ctx.fill();
  }

  // The ink field: fixed gestural brush marks, seeded once from
  // the piece number. Pure function of the seed, so the field
  // is identical on every deal and every render.
  function drawInkField() {
    var rng = mulberry32(SEED * 7919 + 13);
    var i;
    // Large sweeping calligraphic marks across the field.
    for (i = 0; i < 13; i++) {
      var x0 = rng() * W, y0 = rng() * H;
      var ang = rng() * Math.PI * 2;
      var len = (0.25 + rng() * 0.45) * Math.min(W, H);
      var x1 = x0 + Math.cos(ang) * len;
      var y1 = y0 + Math.sin(ang) * len * 0.7;
      var cx = (x0 + x1) / 2 + (rng() - 0.5) * len * 0.5;
      var cy = (y0 + y1) / 2 + (rng() - 0.5) * len * 0.5;
      var w0 = (5 + rng() * 16) * clamp(L.u / 700, 0.7, 1.3);
      brushStroke(x0, y0, cx, cy, x1, y1, w0, Math.max(0.6, w0 * 0.08),
        INK, 0.45 + rng() * 0.4);
    }
    // Dry-brush texture: short broken strokes in softened ink.
    for (i = 0; i < 26; i++) {
      var bx = rng() * W, by = rng() * H;
      var ba = rng() * Math.PI * 2;
      var bl = (0.03 + rng() * 0.08) * Math.min(W, H);
      brushStroke(bx, by, bx + Math.cos(ba) * bl * 0.5 + (rng() - 0.5) * 8,
        by + Math.sin(ba) * bl * 0.5 + (rng() - 0.5) * 8,
        bx + Math.cos(ba) * bl, by + Math.sin(ba) * bl,
        1.5 + rng() * 2.5, 0.5, INK_SOFT, 0.18 + rng() * 0.2);
    }
    // Grain: faint ink flecks.
    for (i = 0; i < 60; i++) {
      var gx = rng() * W, gy = rng() * H;
      var gr = 0.6 + rng() * 1.8;
      ctx.fillStyle = hexA(INK, a4(0.05 + rng() * 0.08));
      ctx.beginPath();
      ctx.moveTo(gx + gr, gy);
      ctx.arc(gx, gy, gr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // One motif glyph, drawn centred at (x, y) at size s, in the
  // voice colour over an ink under-stroke. Rotation is a slow
  // function of the token angle, for a gestural feel.
  function drawMotif(idx, x, y, s, col, alpha, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    var u = s;
    // Ink under-stroke first, slightly offset, then the accent.
    function stroke(colour, a) {
      ctx.strokeStyle = hexA(colour, a4(a));
      ctx.fillStyle = hexA(colour, a4(a));
      ctx.lineCap = 'round';
      if (idx === 0) { // sweep: one long rising curve
        ctx.lineWidth = u * 0.10;
        ctx.beginPath(); ctx.moveTo(-u * 0.62, u * 0.30);
        ctx.quadraticCurveTo(0, -u * 0.48, u * 0.62, u * 0.02); ctx.stroke();
      } else if (idx === 1) { // slash: one hard diagonal
        ctx.lineWidth = u * 0.12;
        ctx.beginPath(); ctx.moveTo(-u * 0.45, u * 0.45);
        ctx.lineTo(u * 0.45, -u * 0.45); ctx.stroke();
      } else if (idx === 2) { // dot run: five dots on a slight arc
        var i;
        for (i = 0; i < 5; i++) {
          var dx = -u * 0.5 + i * u * 0.25;
          var dy = Math.sin(i * 0.7) * u * 0.08;
          var r = u * 0.09;
          ctx.beginPath(); ctx.moveTo(dx + r, dy);
          ctx.arc(dx, dy, r, 0, Math.PI * 2); ctx.fill();
        }
      } else if (idx === 3) { // cross: two crossing strokes
        ctx.lineWidth = u * 0.10;
        ctx.beginPath(); ctx.moveTo(-u * 0.42, -u * 0.30);
        ctx.lineTo(u * 0.42, u * 0.30); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-u * 0.42, u * 0.30);
        ctx.lineTo(u * 0.42, -u * 0.30); ctx.stroke();
      } else if (idx === 4) { // arc: a half circle, open below
        ctx.lineWidth = u * 0.10;
        ctx.beginPath(); ctx.arc(0, u * 0.10, u * 0.42, Math.PI, 0); ctx.stroke();
      } else { // stab: three short vertical strokes
        var j;
        ctx.lineWidth = u * 0.11;
        for (j = -1; j <= 1; j++) {
          var sx = j * u * 0.28;
          ctx.beginPath(); ctx.moveTo(sx, -u * 0.42);
          ctx.lineTo(sx + u * 0.05, u * 0.42); ctx.stroke();
        }
      }
    }
    ctx.translate(u * 0.03, u * 0.03);
    stroke(INK, a4(0.85 * alpha));
    ctx.translate(-u * 0.03, -u * 0.03);
    stroke(col, a4(alpha));
    ctx.restore();
  }

  // Orbit position of voice v at time t: angle drifts slowly,
  // radius breathes in and out (dealing in and out).
  function tokenPos(v, t) {
    var vc = VOICES[v];
    var ang = vc.a0 + t * vc.w;
    var pulse = 0.85 + 0.15 * Math.sin(t * 0.22 + vc.ph);
    return {
      x: L.cx + Math.cos(ang) * L.rx * pulse,
      y: L.cy + Math.sin(ang) * L.ry * pulse,
      rot: ang * 0.3
    };
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    // Dark gray ground.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // The ink field, fixed across deals.
    drawInkField();

    // The table: a faint chalk ring marking the orbit centre.
    ctx.strokeStyle = hexA(CHALK, a4(0.16));
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(L.cx + L.rx * 0.12, L.cy);
    ctx.arc(L.cx, L.cy, L.rx * 0.12, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = hexA(INK, a4(0.8));
    ctx.beginPath();
    ctx.moveTo(L.cx + L.u * 0.012, L.cy);
    ctx.arc(L.cx, L.cy, L.u * 0.012, 0, Math.PI * 2);
    ctx.fill();

    // Deal crossfade: within 1.2 s of a deal, the old hand
    // fades out while the new hand fades in.
    var fade = 1;
    var oldHand = null;
    if (t - dealT < 1.2 && dealT > -100) {
      fade = clamp((t - dealT) / 1.2, 0, 1);
      oldHand = handFor(deal - 1);
    }
    var hand = handFor(deal);

    // The three tokens, orbiting the centre.
    var v;
    for (v = 0; v < 3; v++) {
      var pos = tokenPos(v, t);
      var vc = VOICES[v];
      // Faint orbit ring in the voice colour.
      ctx.strokeStyle = hexA(vc.col, a4(0.20));
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pos.x + L.u * 0.075, pos.y);
      ctx.arc(pos.x, pos.y, L.u * 0.075, 0, Math.PI * 2);
      ctx.stroke();
      // Old motif fading out during a deal.
      if (oldHand) {
        drawMotif(oldHand[v], pos.x, pos.y, L.tokenS, vc.col, 1 - fade, pos.rot);
      }
      // Current motif.
      drawMotif(hand[v], pos.x, pos.y, L.tokenS, vc.col, oldHand ? fade : 1, pos.rot);
      // Voice label under the token.
      var fsV = Math.round(11 * clamp(W / 560, 0.85, 1.1));
      ctx.font = 'italic ' + fsV + 'px Georgia, "Times New Roman", serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = hexA(vc.col, a4(0.85));
      ctx.fillText(vc.name, pos.x, pos.y + L.u * 0.115);
      ctx.textAlign = 'left';
    }

    // The motif bank: all six motifs in a row, the three
    // currently dealt marked with a voice-coloured tick above.
    var bw = Math.min(W * 0.86, L.u * 0.78);
    var bx0 = (W - bw) / 2;
    var i;
    for (i = 0; i < 6; i++) {
      var gx = bx0 + (i + 0.5) * (bw / 6);
      var dealtV = -1, k;
      for (k = 0; k < 3; k++) { if (hand[k] === i) { dealtV = k; } }
      // Non-dealt motifs in mid gray so the whole fixed set
      // stays visible against the ink field; dealt motifs in
      // their voice colour.
      drawMotif(i, gx, L.bankY, L.bankS, dealtV >= 0 ? VOICES[dealtV].col : '#6a6a72',
        dealtV >= 0 ? 0.95 : 0.9, 0);
      if (dealtV >= 0) {
        ctx.fillStyle = hexA(VOICES[dealtV].col, a4(0.9));
        ctx.beginPath();
        ctx.moveTo(gx + 3, L.bankY - L.bankS * 0.85);
        ctx.arc(gx, L.bankY - L.bankS * 0.85, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    var fsBank = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    ctx.font = 'italic ' + fsBank + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = hexA(PAPER, a4(0.55));
    ctx.fillText('the motif bank', W / 2, L.bankY + L.bankS * 1.25);
    ctx.textAlign = 'left';

    // ---- Plates: title top-left, number and date below it,
    // descriptor and hand readout top-right.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = PAPER;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Third Hand Dealt', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(PAPER, 0.8);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№620 · 2007 · 05 · 26', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(PAPER, 0.65);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('three voices, one motif set', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.fillStyle = hexA(PAPER, 0.8);
    ctx.font = fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Hand ' + (deal + 1) + ' of the trio', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8 + fsSmall + 6);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom, chalk on a faint dark
    // pill so it stays legible over the ink field.
    var hint = 'Tap to deal a new hand.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = hexA(PAPER, a4(0.08));
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = hexA(PAPER, a4(0.25));
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
    ctx.fillStyle = hexA(PAPER, a4(0.9));
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  // Tap deals a new hand: the motif set stays fixed, only the
  // voicing rotates. Never a reseed.
  function dealHand() {
    deal += 1;
    dealT = lastT;
    draw(lastT);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}
  try {
    if (typeof canvas.addEventListener === 'function') {
      canvas.addEventListener('pointerdown', function (e) {
        if (e && typeof e.preventDefault === 'function') { e.preventDefault(); }
        dealHand();
      });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1961 exposes the deal, the hand, the motif
  // bank, and a tap simulation.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1961 = {
      deal: function () { return deal; },
      hand: function (d) { return handFor(typeof d === 'number' ? d : deal); },
      bank: function () { return MOTIFS.slice(); },
      tap: function () { dealHand(); return handFor(deal); },
      firstT: FIRST_T
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: tokens drift around the centre at 0.045 to
  // 0.08 rad/s and breathe in and out at about 0.035 Hz, all
  // well under the 14 Hz ceiling. Guarded so node-canvas QA
  // (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
