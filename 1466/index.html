<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>India Song Ballroom</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #e8dcc4; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (only these colors).
  var CREAM = '#e8dcc4';
  var SILVER = '#c8d0cc';
  var AMBER = '#e0b26a';
  var DRESS = '#f5f0e2';
  var SKIN = '#f2ead8';
  var PLUM = '#5b2a4a';

  // Seeded PRNG (mulberry32), never Math.random.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(1466000);
  // Seeded chandelier drop lengths and ripple seeds (fixed at load).
  var chandelierDrops = [];
  for (var i = 0; i < 5; i++) chandelierDrops.push(0.10 + rand() * 0.05);
  var rippleSeed = [];
  for (var j = 0; j < 4; j++) rippleSeed.push(rand());

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function round4(v) { return Math.round(v * 10000) / 10000; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  var W = 0, H = 0;
  function size() {
    var vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
  }
  size();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', size);
  }
  if (window.addEventListener) window.addEventListener('resize', size);

  function isPhone() {
    if (window.screen && window.screen.width && window.screen.height) {
      return Math.min(window.screen.width, window.screen.height) < 700;
    }
    return H > W * 1.15;
  }

  // Drift model: closed-form phase over recorded heat-change segments.
  var CYCLE = 72; // seconds for one full out-and-back at base heat
  var BEAT = 4;  // seconds; reflections lag half a beat (2s) and a full beat (4s)
  var heat = 0.35;
  function speedOf(h) { return Math.max(0.2, 1 + (0.35 - h) * 0.8); }
  // Phase-shifted +0.15 so frame one opens mid-crossing, moving right,
  // with both reflections trailing behind her (to the left), not wrapped ahead.
  var segs = [{ t: 0, phase: 0.15, speed: speedOf(heat) }];
  function phaseAt(t) {
    var s = segs[0];
    for (var i = 0; i < segs.length; i++) {
      if (segs[i].t <= t) s = segs[i]; else break;
    }
    return s.phase + (t - s.t) * s.speed / CYCLE;
  }
  function pushSeg(t) {
    var ph = phaseAt(t);
    segs.push({ t: t, phase: ph, speed: speedOf(heat) });
  }
  function triX(phase) {
    var u = ((phase % 1) + 1) % 1;
    var p = u < 0.5 ? u * 2 : 2 - u * 2;
    return { p: p, u: u };
  }
  function figureXAt(t) {
    var xMin = W * 0.12, xMax = W * 0.80;
    var r = triX(phaseAt(t));
    return lerp(xMin, xMax, r.p);
  }
  function figureDirAt(t) {
    var e = 0.002;
    return figureXAt(t + e) >= figureXAt(t - e) ? 1 : -1;
  }

  var currentT = 0;
  var dragging = false;
  var lastX = 0;

  function onDown(x) { dragging = true; lastX = x; }
  function onMove(x) {
    if (!dragging) return;
    var dx = x - lastX;
    lastX = x;
    var nh = clamp(heat + dx * 0.002, 0, 1);
    if (nh !== heat) { heat = nh; pushSeg(currentT); }
  }
  function onUp() { dragging = false; }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) { onDown(e.clientX); });
    canvas.addEventListener('pointermove', function (e) { onMove(e.clientX); });
    canvas.addEventListener('pointerup', function () { onUp(); });
    canvas.addEventListener('pointercancel', function () { onUp(); });
  }

  function dot(x, y, s, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x - s / 2, y - s / 2, s, s);
  }
  function disc(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }

  // One figure: flat silhouette, eyes only, no mouth ever.
  function drawFigure(x, feetY, s, facing, t, alpha) {
    ctx.save();
    ctx.globalAlpha = round4(alpha);
    var bob = Math.sin(t * Math.PI * 2 / 3) * s * 0.012;
    var sway = Math.sin(t * Math.PI * 2 / 6) * s * 0.03;
    var y = feetY + bob;
    var headR = s * 0.09;
    var headY = y - s * 0.82;
    // Dress: trapezoid from shoulders to feet.
    ctx.fillStyle = DRESS;
    ctx.beginPath();
    ctx.moveTo(x - s * 0.08, y - s * 0.72);
    ctx.lineTo(x + s * 0.08, y - s * 0.72);
    ctx.lineTo(x + s * 0.17, y);
    ctx.lineTo(x - s * 0.17, y);
    ctx.closePath();
    ctx.fill();
    // Arms: skin rects angled by the dance sway.
    ctx.fillStyle = SKIN;
    ctx.save();
    ctx.translate(x - s * 0.08, y - s * 0.70);
    ctx.rotate(-0.35 + sway * 0.02);
    ctx.fillRect(-s * 0.02, 0, s * 0.04, s * 0.30);
    ctx.restore();
    ctx.save();
    ctx.translate(x + s * 0.08, y - s * 0.70);
    ctx.rotate(0.35 - sway * 0.02);
    ctx.fillRect(-s * 0.02, 0, s * 0.04, s * 0.30);
    ctx.restore();
    // Head: skin disc, plum hair cap, eyes only (no mouth).
    disc(x, headY, headR, SKIN);
    ctx.fillStyle = PLUM;
    ctx.beginPath();
    ctx.moveTo(x - headR, headY);
    ctx.arc(x, headY, headR, Math.PI, Math.PI * 2);
    ctx.closePath();
    ctx.fill();
    var eyeS = Math.max(2, s * 0.018);
    ctx.fillStyle = PLUM;
    ctx.fillRect(x - headR * 0.45 - eyeS / 2 + facing * headR * 0.08, headY - eyeS / 2, eyeS, eyeS);
    ctx.fillRect(x + headR * 0.45 - eyeS / 2 + facing * headR * 0.08, headY - eyeS / 2, eyeS, eyeS);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    currentT = t;
    size();
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var floorY = H * 0.62;
    var phone = isPhone();
    var fh = Math.min(W, H) * (phone ? 0.42 : 0.36);

    // Back wall.
    rect(0, 0, W, H, CREAM);

    // Tall windows at the far edges (silver panes, plum mullions).
    var winW = W * 0.09, winH = H * 0.46, winTop = H * 0.05;
    var winXs = [W * 0.015, W - W * 0.015 - winW];
    for (var wi = 0; wi < 2; wi++) {
      var wx = winXs[wi];
      rect(wx, winTop, winW, winH, SILVER);
      rect(wx + winW / 2 - 1, winTop, 2, winH, PLUM);
      rect(wx, winTop + winH / 2 - 1, winW, 2, PLUM);
    }

    // Mirrors: tall rectangles along the back wall.
    var mirW = W * 0.10, mirH = H * 0.44, mirTop = H * 0.07;
    for (var mi = 0; mi < 4; mi++) {
      var mx = W * (0.17 + mi * 0.175);
      rect(mx - 2, mirTop - 2, mirW + 4, mirH + 4, PLUM);
      rect(mx, mirTop, mirW, mirH, SILVER);
    }

    // Chandelier: silver stem and arms, amber lights as filled rects.
    var cx = W * 0.5;
    rect(cx - 1, 0, 2, H * 0.10, SILVER);
    rect(cx - W * 0.055, H * 0.10, W * 0.11, 2, SILVER);
    for (var ci = 0; ci < 5; ci++) {
      var dx = cx + (ci - 2) * W * 0.026;
      var dy = H * chandelierDrops[ci];
      rect(dx - 1, H * 0.10, 2, dy - H * 0.10, SILVER);
      dot(dx, dy, Math.max(4, Math.min(W, H) * 0.012), AMBER);
    }

    // Heat haze: flat-alpha amber bands + full-room veil (before the figure).
    ctx.save();
    ctx.globalAlpha = round4(0.05 + heat * 0.20);
    ctx.fillStyle = AMBER;
    ctx.fillRect(0, H * 0.08, W, H * 0.07);
    ctx.fillRect(0, H * 0.28, W, H * 0.07);
    ctx.fillRect(0, H * 0.48, W, H * 0.07);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = round4(heat * 0.10);
    ctx.fillStyle = AMBER;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // Floor band + sheen line.
    rect(0, floorY, W, H - floorY, CREAM);
    rect(0, floorY, W, 2, SILVER);

    // The figure three times: now, half a beat back, a full beat back.
    var lags = [0, BEAT / 2, BEAT];
    var opacities = [1.0, 0.5, 0.25];
    for (var fi = 0; fi < 3; fi++) {
      var tt = t - lags[fi];
      var fx = figureXAt(tt);
      var fd = figureDirAt(tt);
      // Reflection: mirrored across the floor line, clipped to the floor band.
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, floorY, W, H - floorY);
      ctx.clip();
      ctx.translate(0, 2 * floorY);
      ctx.scale(1, -1);
      drawFigure(fx, floorY, fh, fd, tt, round4(opacities[fi] * 0.45));
      ctx.restore();
      // Plum floor shadow under each instance.
      ctx.save();
      ctx.globalAlpha = round4(opacities[fi] * 0.5);
      ctx.fillStyle = PLUM;
      ctx.beginPath();
      ctx.moveTo(fx + fh * 0.20, floorY + 2);
      ctx.ellipse(fx, floorY + 2, fh * 0.20, Math.max(2, fh * 0.02), 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      // The figure herself.
      drawFigure(fx, floorY, fh, fd, tt, opacities[fi]);
    }

    // Floor ripples: slow expanding ellipses on a separate clock.
    for (var ri = 0; ri < 4; ri++) {
      var prog = (((t + ri * 3) % 12) + 12) % 12 / 12;
      var rx = prog * W * 0.16 + 10;
      var ry = floorY + (ri + 1) * ((H - floorY) / 5);
      ctx.save();
      ctx.globalAlpha = round4((1 - prog) * 0.22);
      ctx.strokeStyle = PLUM;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(rx * 0 + W * (0.15 + ri * 0.22), ry, rx, Math.max(3, rx * 0.18), 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // Synchronous first frame at a constant phase.
  draw(0);

  var startT = null;
  function loop(now) {
    if (startT === null) startT = now;
    draw((now - startT) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);

  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: draw,
      figureX: figureXAt,
      getHeat: function () { return heat; },
      down: function (x, t) { currentT = t; onDown(x); },
      move: function (x, t) { currentT = t; onMove(x); },
      up: function (t) { currentT = t; onUp(); }
    };
  }
})();
</script>
</body>
</html>
