<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1930 Human Error</title>
<style>
  html, body { margin: 0; padding: 0; background: #23262b; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the prompt's named colors. The study file
  // studies/chris-hyson.md does not exist in the repo, so these hex
  // values are chosen from the prompt's own color names.
  var BG = '#23262b';        // dim interior ground, grey
  var WALL = '#2e3238';      // dim interior wall
  var WALL_LT = '#3a3f47';   // wall lit by the window
  var BLUE = '#3d4a63';      // figure shadow blue
  var BLUE_LT = '#5a6b8a';   // figure mid blue
  var OCHRE = '#b98a3e';     // ochre blanket
  var OCHRE_LT = '#c9a35c';  // ochre highlight
  var GREY = '#6b6f73';      // muted grey skin tone
  var GREY_LT = '#8a8f94';   // lighter grey
  var BONE = '#e8e2d4';      // bone white scratches
  var PAPER = '#1c1712';     // dark paper beneath tears
  var DUST = '#a89a7a';      // dust, grey-ochre
  var INK = '#e8e2d4';       // plate ink on the dim ground

  // Fixed-phase first frame: t = 0 s. The sleeper breathes on a slow
  // 6 s cycle and dust motes drift on a 40 s cycle; at t = 0 the breath
  // is at rest and the figure is fully visible, so the portrait reads
  // at frame one. Frame one is byte-reproducible: every shape, scratch
  // and dust speck is a pure function of t and the seeded PRNG.
  var FIRST_T = 0;
  var MAX_DAMAGE = 400; // generous bound a render probe never hits

  // Seeded PRNG, mulberry32. A fresh instance is built per draw from the
  // piece number, so every frame is reproducible regardless of call order.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }
  function mixHex(h1, h2, t) {
    var r1 = parseInt(h1.slice(1, 3), 16), g1 = parseInt(h1.slice(3, 5), 16), b1 = parseInt(h1.slice(5, 7), 16);
    var r2 = parseInt(h2.slice(1, 3), 16), g2 = parseInt(h2.slice(3, 5), 16), b2 = parseInt(h2.slice(5, 7), 16);
    var r = Math.round(lerp(r1, r2, t)), g = Math.round(lerp(g1, g2, t)), b = Math.round(lerp(b1, b2, t));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Parse ?tap=x,y (repeatable) and ?seed= from the URL, for QA probes.
  // In the browser a tap is a pointer event; the param only replays taps.
  function readParams() {
    var out = { taps: [], seed: 1930 };
    var s = '';
    try { s = (typeof location !== 'undefined' && location.search) ? location.search : ''; } catch (e) {}
    if (!s) { return out; }
    var q = s.replace(/^\?/, '').split('&');
    for (var i = 0; i < q.length; i++) {
      var kv = q[i].split('=');
      if (kv[0] === 'tap' && kv[1]) {
        var xy = kv[1].split(',');
        var x = parseFloat(xy[0]), y = parseFloat(xy[1]);
        if (!isNaN(x) && !isNaN(y)) { out.taps.push([clamp(x, 0, 1), clamp(y, 0, 1)]); }
      } else if (kv[0] === 'seed' && kv[1]) {
        var sd = parseInt(kv[1], 10);
        if (!isNaN(sd)) { out.seed = sd; }
      }
    }
    return out;
  }
  var PARAMS = readParams();
  var BASE_SEED = PARAMS.seed;

  // ---- Damage layer: persistent, never clears, never heals. ----
  // Each accident is generated from mulberry32(BASE_SEED * 1000 + index),
  // so the same tap sequence always produces the same accidents.
  var accidents = [];
  function makeAccident(index, nx, ny) {
    var rng = mulberry32(BASE_SEED * 1000 + index * 7919 + 13);
    var kind = rng();
    var type = kind < 0.42 ? 'scratch' : (kind < 0.72 ? 'tear' : 'dust');
    var a = { type: type, x: nx, y: ny };
    if (type === 'scratch') {
      var ang = rng() * Math.PI * 2;
      var len = 0.08 + rng() * 0.14;
      var pts = [];
      var px = nx, py = ny;
      var steps = 5 + Math.floor(rng() * 4);
      for (var i = 0; i <= steps; i++) {
        pts.push([px, py]);
        px += Math.cos(ang) * len / steps + (rng() - 0.5) * 0.03;
        py += Math.sin(ang) * len / steps + (rng() - 0.5) * 0.03;
      }
      a.pts = pts;
      a.w = 0.8 + rng() * 1.6;
      a.alpha = 0.55 + rng() * 0.35;
    } else if (type === 'tear') {
      var n = 5 + Math.floor(rng() * 3);
      var r0 = 0.018 + rng() * 0.022;
      var pts2 = [];
      for (var j = 0; j < n; j++) {
        var th = (j / n) * Math.PI * 2;
        var rr = r0 * (0.6 + rng() * 0.8);
        pts2.push([nx + Math.cos(th) * rr, ny + Math.sin(th) * rr * 0.8]);
      }
      a.pts = pts2;
      a.lift = rng() * Math.PI * 2; // direction the torn flap lifts
    } else {
      var dots = [];
      var m = 14 + Math.floor(rng() * 18);
      for (var k = 0; k < m; k++) {
        var th2 = rng() * Math.PI * 2;
        var rr2 = Math.pow(rng(), 0.6) * (0.02 + rng() * 0.03);
        dots.push([nx + Math.cos(th2) * rr2, ny + Math.sin(th2) * rr2,
                   0.0015 + rng() * 0.004, 0.25 + rng() * 0.55]);
      }
      a.dots = dots;
    }
    return a;
  }
  function addAccident(nx, ny) {
    if (accidents.length >= MAX_DAMAGE) { return; }
    accidents.push(makeAccident(accidents.length, nx, ny));
  }

  // Pre-existing wear: the figure is already a little worn at frame one.
  // Fixed tap points near the edges, so damage starts at the margins and
  // works inward as the visitor taps.
  (function seedWear() {
    var pre = [[0.07, 0.42], [0.93, 0.58], [0.06, 0.88], [0.88, 0.92], [0.50, 0.92]];
    for (var i = 0; i < pre.length; i++) { addAccident(pre[i][0], pre[i][1]); }
  })();
  // Replay any ?tap= params (QA hook), in order, after the pre-wear.
  for (var pi = 0; pi < PARAMS.taps.length; pi++) {
    addAccident(PARAMS.taps[pi][0], PARAMS.taps[pi][1]);
  }

  // ---- The sleeping figure, drawn as layered sprites. ----
  // One lying figure: head at left, body stretching right under a blanket.
  // cx, cy are the figure centre in px; s scales it; rot rotates it;
  // alpha fades the whole sprite; breathe adds a slow chest rise.
  function drawFigure(cx, cy, s, rot, alpha, breathe, palette) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.scale(s, s);
    ctx.globalAlpha = a4(alpha);
    var u = Math.min(W, H);
    // Pillow under the head: a flat soft mound, mostly hidden by the head.
    ctx.fillStyle = palette.pillow;
    ctx.beginPath();
    ctx.moveTo(-0.22 * u + 0.075 * u, 0.015 * u);
    ctx.ellipse(-0.22 * u, 0.015 * u, 0.075 * u, 0.034 * u, 0, 0, Math.PI * 2);
    ctx.fill();
    // Head: a quiet circle, face turned away, hair as a dark cap.
    ctx.fillStyle = palette.skin;
    ctx.beginPath(); ctx.moveTo(-0.185 * u + 0.052 * u, -0.03 * u);
    ctx.arc(-0.185 * u, -0.03 * u, 0.052 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = palette.hair;
    ctx.beginPath(); ctx.moveTo(-0.185 * u + 0.052 * u, -0.055 * u);
    ctx.arc(-0.185 * u, -0.045 * u, 0.050 * u, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
    // Torso under the blanket: one long rising curve, chest at breathe.
    ctx.fillStyle = palette.blanket;
    ctx.beginPath();
    ctx.moveTo(-0.13 * u, 0.05 * u);
    ctx.bezierCurveTo(-0.10 * u, -0.10 * u, 0.02 * u, -0.13 * u - breathe,
      0.10 * u, -0.08 * u - breathe);
    ctx.bezierCurveTo(0.20 * u, -0.03 * u, 0.26 * u, 0.02 * u, 0.30 * u, 0.05 * u);
    ctx.lineTo(0.30 * u, 0.09 * u);
    ctx.lineTo(-0.13 * u, 0.09 * u);
    ctx.closePath(); ctx.fill();
    // Blanket folds: three ochre seams following the torso curve.
    ctx.strokeStyle = hexA(palette.fold, 0.8);
    ctx.lineWidth = Math.max(1, u * 0.006);
    ctx.lineCap = 'round';
    var foldX = [-0.06, 0.04, 0.14];
    for (var f = 0; f < foldX.length; f++) {
      ctx.beginPath();
      ctx.moveTo(foldX[f] * u, -0.09 * u - breathe * 0.7);
      ctx.quadraticCurveTo((foldX[f] + 0.03) * u, -0.02 * u, (foldX[f] + 0.01) * u, 0.08 * u);
      ctx.stroke();
    }
    // Arm resting along the body, hand near the hip.
    ctx.strokeStyle = palette.skin;
    ctx.lineWidth = Math.max(2, u * 0.020);
    ctx.beginPath();
    ctx.moveTo(-0.10 * u, -0.01 * u);
    ctx.quadraticCurveTo(0.02 * u, 0.03 * u, 0.16 * u, 0.05 * u);
    ctx.stroke();
    // Legs: a low second rise under the blanket toward the right.
    ctx.fillStyle = palette.blanket2;
    ctx.beginPath();
    ctx.moveTo(0.28 * u, 0.05 * u);
    ctx.quadraticCurveTo(0.36 * u, -0.02 * u, 0.42 * u, 0.04 * u);
    ctx.lineTo(0.42 * u, 0.09 * u);
    ctx.lineTo(0.28 * u, 0.09 * u);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // Drifting dust motes in the room light, pure functions of t.
  var MOTES = [];
  (function buildMotes() {
    var rng = mulberry32(BASE_SEED + 77);
    for (var i = 0; i < 26; i++) {
      MOTES.push({ x: rng(), y: rng(), r: 0.001 + rng() * 0.0025,
                   ph: rng() * Math.PI * 2, sp: 0.4 + rng() * 0.8 });
    }
  })();

  function drawDamage() {
    for (var i = 0; i < accidents.length; i++) {
      var a = accidents[i];
      var ax = a.x * W, ay = a.y * H;
      if (a.type === 'scratch') {
        ctx.strokeStyle = hexA(BONE, a4(a.alpha));
        ctx.lineWidth = Math.max(0.8, a.w);
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (var p = 0; p < a.pts.length; p++) {
          var px = a.pts[p][0] * W, py = a.pts[p][1] * H;
          if (p === 0) { ctx.moveTo(px, py); } else { ctx.lineTo(px, py); }
        }
        ctx.stroke();
        // Faint parallel echo, as if the scratch caught twice.
        ctx.strokeStyle = hexA(BONE, a4(a.alpha * 0.35));
        ctx.lineWidth = Math.max(0.6, a.w * 0.5);
        ctx.beginPath();
        for (var q = 0; q < a.pts.length; q++) {
          var qx = a.pts[q][0] * W + 3, qy = a.pts[q][1] * H + 2;
          if (q === 0) { ctx.moveTo(qx, qy); } else { ctx.lineTo(qx, qy); }
        }
        ctx.stroke();
      } else if (a.type === 'tear') {
        // Dark paper beneath, torn edge in bone white, flap lifting.
        ctx.fillStyle = PAPER;
        ctx.beginPath();
        for (var p2 = 0; p2 < a.pts.length; p2++) {
          var tx = a.pts[p2][0] * W, ty = a.pts[p2][1] * H;
          if (p2 === 0) { ctx.moveTo(tx, ty); } else { ctx.lineTo(tx, ty); }
        }
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = hexA(BONE, 0.85);
        ctx.lineWidth = Math.max(1, Math.min(W, H) * 0.002);
        ctx.stroke();
        var lx = Math.cos(a.lift), ly = Math.sin(a.lift);
        ctx.fillStyle = hexA(BONE, 0.28);
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(ax + lx * Math.min(W, H) * 0.05, ay + ly * Math.min(W, H) * 0.05);
        ctx.lineTo(ax + lx * Math.min(W, H) * 0.02 - ly * Math.min(W, H) * 0.02,
                   ay + ly * Math.min(W, H) * 0.02 + lx * Math.min(W, H) * 0.02);
        ctx.closePath(); ctx.fill();
      } else {
        for (var d = 0; d < a.dots.length; d++) {
          var dd = a.dots[d];
          ctx.fillStyle = hexA(DUST, a4(dd[3]));
          ctx.beginPath();
          ctx.moveTo(dd[0] * W + dd[2] * Math.min(W, H), dd[1] * H);
          ctx.arc(dd[0] * W, dd[1] * H, dd[2] * Math.min(W, H), 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var u = Math.min(W, H);
    var breathe = Math.sin((t / 6) * Math.PI * 2) * u * 0.006;

    // Dim interior: wall, floor, a window of cold light at right.
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);
    var glow = ctx.createRadialGradient(W * 0.82, H * 0.22, 0, W * 0.82, H * 0.22, u * 0.62);
    glow.addColorStop(0, hexA(BLUE_LT, 0.35));
    glow.addColorStop(1, hexA(BLUE_LT, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
    // Window frame, upper right, dim and out of focus.
    ctx.strokeStyle = hexA(GREY, 0.35);
    ctx.lineWidth = Math.max(1, u * 0.004);
    ctx.strokeRect(W * 0.72, H * 0.06, W * 0.22, H * 0.26);
    ctx.beginPath();
    ctx.moveTo(W * 0.83, H * 0.06); ctx.lineTo(W * 0.83, H * 0.32);
    ctx.moveTo(W * 0.72, H * 0.19); ctx.lineTo(W * 0.94, H * 0.19);
    ctx.stroke();
    // Figure placement, shared by the bed and both sprites.
    var figScale = isPhone ? 1.35 : 1.3;
    var figY = isPhone ? H * 0.42 : H * 0.50;
    var bedY = figY + u * 0.085 * figScale;
    // Floor line and wall seam.
    ctx.strokeStyle = hexA(GREY, 0.25);
    ctx.beginPath();
    ctx.moveTo(0, bedY + H * 0.16); ctx.lineTo(W, bedY + H * 0.16);
    ctx.moveTo(W * 0.06, 0); ctx.lineTo(W * 0.06, H);
    ctx.stroke();
    // Bed: a low dark slab the figure lies on, tucked under the figure.
    ctx.fillStyle = '#26221c';
    ctx.fillRect(W * 0.05, bedY, W * 0.90, H * 0.16);
    ctx.fillStyle = hexA(OCHRE, 0.25);
    ctx.fillRect(W * 0.05, bedY, W * 0.90, Math.max(1, H * 0.008));

    // Double exposure: the ghost figure, offset up and left, faint,
    // sitting above the sleeper so the two bodies read as one double image.
    drawFigure(W * 0.50, figY - u * 0.10, 0.88 * figScale, -0.07, 0.20, breathe * 0.5,
      { skin: hexA(GREY_LT, 0.9), hair: BLUE, blanket: OCHRE_LT,
        blanket2: OCHRE, fold: OCHRE, pillow: WALL_LT });
    // The sleeper, centred and filling the frame.
    drawFigure(W * 0.50, figY, figScale, 0, 1, breathe,
      { skin: GREY_LT, hair: '#33302a', blanket: BLUE, blanket2: BLUE_LT,
        fold: OCHRE_LT, pillow: GREY });

    // Room dust motes drifting in the window light.
    for (var m = 0; m < MOTES.length; m++) {
      var mo = MOTES[m];
      var mx = ((mo.x + Math.sin(t * 0.05 * mo.sp + mo.ph) * 0.01) % 1) * W;
      var my = ((mo.y + Math.cos(t * 0.04 * mo.sp + mo.ph) * 0.012) % 1) * H;
      ctx.fillStyle = hexA(DUST, a4(0.18 + 0.12 * Math.sin(t * 0.3 + mo.ph)));
      ctx.beginPath();
      ctx.moveTo(mx + mo.r * u, my);
      ctx.arc(mx, my, mo.r * u, 0, Math.PI * 2);
      ctx.fill();
    }

    // Vignette: the edges age first.
    var vg = ctx.createRadialGradient(W / 2, H / 2, u * 0.35, W / 2, H / 2, u * 0.75);
    vg.addColorStop(0, hexA(PAPER, 0));
    vg.addColorStop(1, hexA(PAPER, 0.45));
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    // The damage layer: every accident ever added, in order.
    drawDamage();

    // Plates: title top-left, accident count top-right, hint bottom.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Human Error', 18, 34);
    ctx.fillStyle = hexA(INK, 0.75);
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1930 · 2007 · 04 · 25', 18, 34 + fs2 + 8);

    ctx.textAlign = 'right';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(accidents.length + ' accidents', W - 18, 34);
    ctx.fillStyle = hexA(INK, 0.75);
    ctx.font = 'italic ' + fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('the figure never clears', W - 18, 34 + fs2 + 8);
    ctx.textAlign = 'left';

    ctx.fillStyle = hexA(INK, 0.85);
    ctx.textAlign = 'center';
    ctx.font = Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    var hint = 'Tap to add one accident. It never heals.';
    if (W < 560) {
      ctx.fillText('Tap to add one accident.', W / 2, H - 34);
      ctx.fillText('It never heals.', W / 2, H - 16);
    } else {
      ctx.fillText(hint, W / 2, H - 20);
    }
    ctx.textAlign = 'left';
  }

  // Tap to add one accident at the tap point. Never a reload, never a heal.
  function onTap(clientX, clientY) {
    var rect = { left: stageX, top: stageY };
    try {
      var r = canvas.getBoundingClientRect();
      if (r) { rect = r; }
    } catch (e) {}
    var nx = clamp((clientX - rect.left) / Math.max(1, stageW), 0, 1);
    var ny = clamp((clientY - rect.top) / Math.max(1, stageH), 0, 1);
    addAccident(nx, ny);
    draw(FIRST_T);
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      if (e && typeof e.clientX === 'number') { onTap(e.clientX, e.clientY); }
    });
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Slow motion loop: the sleeper breathes on a 6 s cycle, dust drifts
  // on a 40 s cycle. All motion is under 1 Hz, well under the 14 Hz
  // ceiling. Visual only, no audio. Guarded so node-canvas QA works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
