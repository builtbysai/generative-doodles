<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.338 Double Inset</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#101314; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.338 Double Inset (myclayco).
// After their Double Ellipse Inset Hoopla and Scalloped
// Fridge Frame cutters: nested-outline product language as
// clean boolean linework on near-black. Exactly 3 nested
// ellipses, asserted: an outer cream ring, a middle ring
// scalloped in gold, an inner cream ring. Every ring is the
// parallel curve of one base ellipse at a distance along
// its inward normal, held as parametric data and drawn
// directly each frame on one canvas; no offscreen canvas,
// no gradients, no shadowBlur, no filters. The middle
// ring's scallop is a radius modulation sin(K*theta) with
// K = 24 fixed in code; its phase rotates on a seamless
// 30s cycle. Around the margin sits a ring of exactly 8
// small inset studies, asserted, each the same 3-ring
// system at a fixed inset preset, none of them interactive.
// Drag is horizontal only: pointer x in design coords
// slides the middle ring's inset distance d, clamped so
// the middle ring never crosses either neighbour, and on
// release d eases back to the designed inset with an
// exponential approach that cannot overshoot.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#101314', CREAM = '#F2EBD8', GOLD = '#D9A441';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

// ---- the inset system ----------------------------------------
// Base ellipse, centred in the design space.
var CX = 640, CY = 450;
var EA = 445, EB = 308;          // outer semi-axes
var D_INNER = 100;               // inner ring: parallel distance from outer
var D0 = 50;                     // designed middle inset
var D_MIN = 18, D_MAX = 82;      // drag clamp: middle never crosses a neighbour
var K = 24;                      // scallop count, FIXED (asserted in process.md)
var AMP = 9;                     // scallop depth in design px along the normal
var CYCLE = 30;                  // scallop phase rotation, seconds, seamless

// Point on the parallel curve at distance dist from the
// base ellipse (semi-axes a, b) at parameter theta. The
// offset runs along the inward unit normal; when amp is
// non-zero the distance is modulated by sin(K*theta+phase),
// which is the scallop.
function ringPoint(a, b, dist, theta, phase, amp) {
  var c = Math.cos(theta), s = Math.sin(theta);
  var nx = c / a, ny = s / b;
  var nl = Math.sqrt(nx * nx + ny * ny) || 1;
  var d = dist + (amp ? amp * Math.sin(K * theta + phase) : 0);
  return [a * c - d * nx / nl, b * s - d * ny / nl];
}
function strokeRing(cx, cy, a, b, dist, phase, amp, colour, width, steps) {
  ctx.strokeStyle = colour;
  ctx.lineWidth = width;
  ctx.beginPath();
  for (var i = 0; i <= steps; i++) {
    var th = (i / steps) * Math.PI * 2;
    var p = ringPoint(a, b, dist, th, phase, amp);
    if (i === 0) ctx.moveTo(cx + p[0], cy + p[1]);
    else ctx.lineTo(cx + p[0], cy + p[1]);
  }
  ctx.stroke();
}

// The main composition: exactly 3 nested ellipses, asserted.
var MAIN_RINGS = [
  { role: 'outer', dist: 0, amp: 0, colour: CREAM, width: 5 },
  { role: 'middle', dist: D0, amp: AMP, colour: GOLD, width: 5.5 },
  { role: 'inner', dist: D_INNER, amp: 0, colour: CREAM, width: 5 }
];
if (MAIN_RINGS.length !== 3) throw new Error('Double Inset needs exactly 3 nested ellipses');
if (K !== 24) throw new Error('Double Inset scallop K must stay 24');

// The margin ring: exactly 8 small inset studies, asserted,
// each the same 3-ring system at a fixed inset preset.
var STUDIES = [];
(function () {
  var presets = [7, 9, 10, 12, 13, 14, 15, 17];
  for (var i = 0; i < 8; i++) {
    var ang = i * Math.PI / 4;
    STUDIES.push({
      x: CX + 565 * Math.cos(ang),
      y: CY + 398 * Math.sin(ang),
      a: 56, b: 40, inner: 22, d: presets[i]
    });
  }
})();
if (STUDIES.length !== 8) throw new Error('Double Inset needs exactly 8 margin studies');

// ---- state -----------------------------------------------------
var dCur = D0;                   // live middle inset distance
var drag = null;                 // { gx, gd } while dragging
var rel = null;                  // { d, t } while easing home
var clock0 = Date.now() - 7500;  // frame one starts developed, 7.5s into the cycle
function tNow() { return (Date.now() - clock0) / 1000; }

// ---- drawing ---------------------------------------------------
function draw(t) {
  var phase = Math.PI * 2 * ((t % CYCLE) / CYCLE);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  var i, st;
  for (i = 0; i < STUDIES.length; i++) {
    st = STUDIES[i];
    strokeRing(st.x, st.y, st.a, st.b, 0, 0, 0, CREAM, 1.8, 160);
    strokeRing(st.x, st.y, st.a, st.b, st.d, phase, 2, GOLD, 1.8, 160);
    strokeRing(st.x, st.y, st.a, st.b, st.inner, 0, 0, CREAM, 1.8, 160);
  }
  for (i = 0; i < MAIN_RINGS.length; i++) {
    var r = MAIN_RINGS[i];
    var dist = r.role === 'middle' ? dCur : r.dist;
    strokeRing(CX, CY, EA, EB, dist, phase, r.amp, r.colour, r.width, 420);
  }
}

// ---- interaction: horizontal drag slides the middle ring -------
function toDesign(e) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  drag = { gx: p[0], gd: dCur };
  rel = null;
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  var p = toDesign(e);
  // Horizontal only: pointer x in design coords maps to the
  // inset distance, clamped so the middle ring, scallop
  // swing included, never crosses either neighbour.
  dCur = clamp(drag.gd + (p[0] - drag.gx), D_MIN, D_MAX);
});
function endDrag() {
  if (!drag) return;
  drag = null;
  rel = { d: dCur, t: tNow() };
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---- frame ------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame() {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var t = tNow();
  if (rel) {
    // Exponential ease home: approaches the designed inset
    // monotonically, so it can never overshoot past a
    // neighbour, and snaps the last fraction of a pixel.
    var e = t - rel.t;
    dCur = D0 + (rel.d - D0) * Math.exp(-e * 3.0);
    if (Math.abs(dCur - D0) < 0.05) { dCur = D0; rel = null; }
    dCur = clamp(dCur, D_MIN, D_MAX);
  }
  // Centred fit: the whole canvas takes the piece's own
  // near-black ground, then the design space is centred in it.
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  draw(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame();
if (typeof requestAnimationFrame === 'function') {
  var loop = function () { frame(); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
