    ctx.arc(jp2[0], jp2[1], rr, 0, TAU);

    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(jp2[0] + rr * 1.7, jp2[1]);

    gg.addColorStop(0.6, 'rgba(192,138,138,' + (ga * 0.5).toFixed(4) + ')');
    gg.addColorStop(1, 'rgba(192,138,138,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.moveTo(gp[0] + gr * 2, gp[1]);
    ctx.arc(gp[0], gp[1], gr * 2, 0, TAU);

  ctx.lineWidth = 2;
  ctx.beginPath();

}

  ctx.font = smallPx + 'px monospace';

  var plateH = titlePx + smallPx + 20;

  ctx.fillStyle = PLATE;

  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Movement-Reactive Cloth', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';

  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);

function draw(t) {
