<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In Situ</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #EFEAE0; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  // No.789 "In Situ" - EXPANSION #96 daniel-buren, PP6.
  //
  // The frame itself is the site. Nothing here is composed; everything is
  // anchored to a feature of the piece's own frame:
  //   1. a vertical striped band, full height, exactly one module in from
  //      the left edge;
  //   2. a striped L hugging the top-right corner (the blocked entrance);
  //   3. a striped band laid along the frame's own diagonal, corner to
  //      corner.
  // Plus one site condition: a small threshold block at the bottom-right
  // corner exists only when the frame is not taller than wide, and
  // breathes on a 90 s loop while it exists.
  //
  // COLOR AS MATERIAL (the rule, per the prompt): exactly one color is
  // used - deep blue #27408B - chosen for this site. It is never a symbol,
  // never decoration; it is the material the visual tool is made of. The
  // only other tones are the stripe white and the ground. One color,
  // always the same color, on every frame this piece ever occupies.
  //
  // The module: one stripe pair = frame width / 17.4 (the 8.7 cm tool).
  // All vertical stripes share one global grid anchored at the frame's
  // left edge, so every band is measured from the same origin.
  //
  // Motion: watch-only. On resize the bands re-measure and re-anchor
  // with a 300 ms eased slide - the tool re-laying itself. Layout is a
  // pure function of (w, h); transitions are closed-form interpolations
  // between recorded layouts. Frame one is the synchronous draw at t=0.
  // No clock reads for state, no randomness.

  var GROUND = "#EFEAE0";
  var SWHITE = "#F6F3EC";
  var BLUE = "#27408B";   // the one color: material, not symbol

  var PAIRS_ACROSS = 17.4;  // stripe pairs across the frame width
  var VBAND_PAIRS = 2;      // vertical band is two pairs wide
  var ARM_PAIRS = 3;        // corner L arms reach three pairs
  var SLIDE = 0.3;          // re-anchor slide, seconds
  var BREATH = 90;          // threshold breath loop, seconds

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1, phone = false;

  // Layout history: each entry is { t, w, h } recorded when a size takes
  // effect. The displayed geometry at time t interpolates from the
  // previous entry's (w, h) to the current one over SLIDE seconds.
  var layouts = [];
  var nowT = 0;

  function measure() {
    var vv = (typeof window !== "undefined" && window.visualViewport) ? window.visualViewport : null;
    W = Math.round(vv ? vv.width : (window.innerWidth || 800));
    H = Math.round(vv ? vv.height : (window.innerHeight || 600));
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    var sw = (typeof window !== "undefined" && window.screen) ? window.screen : null;
    if (sw && sw.width && sw.height) {
      phone = Math.min(sw.width, sw.height) < 700;
    } else {
      phone = H > W * 1.15;
    }
  }

  function ease(u) {
    // easeInOut cubic, u in [0, 1]
    return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  }

  // Displayed (w, h) at time t, sliding between recorded layouts.
  function geomAt(t) {
    if (layouts.length === 0) return { w: W, h: H };
    var cur = layouts[layouts.length - 1];
    if (layouts.length === 1 || t >= cur.t + SLIDE) return { w: cur.w, h: cur.h };
    var prev = layouts[layouts.length - 2];
    var u = (t - cur.t) / SLIDE;
    if (u <= 0) return { w: prev.w, h: prev.h };
    var e = ease(u);
    return { w: prev.w + (cur.w - prev.w) * e, h: prev.h + (cur.h - prev.h) * e };
  }

  // Fill the rect (x, y, w, h) with vertical stripes from the global grid:
  // stripe boundaries sit at multiples of stripeW measured from x = 0.
  function stripeRect(x, y, w, h, pair) {
    var stripeW = pair / 2;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    ctx.fillStyle = SWHITE;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = BLUE;
    var k = Math.floor(x / stripeW);
    for (var sx = k * stripeW; sx < x + w; sx += stripeW, k++) {
      if (k % 2 !== 0) ctx.fillRect(sx, y, stripeW + 0.5, h);
    }
    ctx.restore();
  }

  function draw(t) {
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;

    // Ground: the site, flat.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var g = geomAt(t);
    var gw = g.w, gh = g.h;
    var pair = gw / PAIRS_ACROSS;
    var stripeW = pair / 2;

    // 1. Vertical band: full height of the site, its left edge exactly
    //    one module in from the frame's left edge, two pairs wide.
    stripeRect(pair, 0, VBAND_PAIRS * pair, gh, pair);

    // 2. The corner L at the top-right: a horizontal arm along the top
    //    edge (three pairs long, one pair deep) and a vertical arm down
    //    the right edge (one pair wide, three pairs deep).
    stripeRect(gw - ARM_PAIRS * pair, 0, ARM_PAIRS * pair, pair, pair);
    stripeRect(gw - pair, 0, pair, ARM_PAIRS * pair, pair);

    // 3. The diagonal band: laid along the frame's own diagonal from
    //    top-left corner to bottom-right corner, one pair wide, stripes
    //    measured along the diagonal at the same module.
    var L = Math.sqrt(gw * gw + gh * gh);
    var ang = Math.atan2(gh, gw);
    ctx.save();
    ctx.rotate(ang);
    ctx.fillStyle = SWHITE;
    ctx.fillRect(0, -pair / 2, L, pair);
    ctx.fillStyle = BLUE;
    for (var k = 0; k * stripeW < L; k++) {
      if (k % 2 === 1) ctx.fillRect(k * stripeW, -pair / 2, stripeW + 0.5, pair);
    }
    ctx.restore();

    // The threshold block: a site condition, present only when the frame
    // is not taller than wide. One pair square at the bottom-right
    // corner, solid site color, breathing on a 90 s loop.
    if (W >= H) {
      var ph = ((t % BREATH) + BREATH) % BREATH;
      var a = 0.625 + 0.375 * Math.sin((ph / BREATH) * Math.PI * 2 - Math.PI / 2);
      ctx.globalAlpha = a;
      ctx.fillStyle = BLUE;
      ctx.fillRect(gw - pair, gh - pair, pair, pair);
      ctx.globalAlpha = 1;
    }
  }

  measure();
  layouts.push({ t: 0, w: W, h: H });

  // QA hook: only when there is no rAF (headless renderer), an optional
  // ?seed=tNN in the URL selects the time of the single frame.
  var hasRAF = (typeof requestAnimationFrame === "function");
  var t0 = 0;
  if (!hasRAF) {
    var seedT = 0;
    if (typeof location !== "undefined" && location.search) {
      var m = /seed=t([0-9.]+)/.exec(location.search);
      if (m) seedT = parseFloat(m[1]);
    }
    draw(seedT);
  } else {
    draw(0);
    var tick = function (ts) {
      if (!t0) t0 = ts;
      nowT = (ts - t0) / 1000;
      draw(nowT);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  var onResize = function () {
    var ow = W, oh = H;
    measure();
    if (W !== ow || H !== oh) {
      layouts.push({ t: nowT, w: W, h: H });
      if (layouts.length > 2) layouts.splice(0, layouts.length - 2);
    }
    if (!hasRAF) draw(0);
  };
  if (typeof window !== "undefined" && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener("resize", onResize);
  }
  if (typeof window !== "undefined" && window.addEventListener) {
    window.addEventListener("resize", onResize);
  }
})();
</script>
</body>
</html>
