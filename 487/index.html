<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Literal Idiom</title>
<style>
  html, body { margin: 0; padding: 0; background: #9AA87E; overflow: hidden; height: 100%; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var CREAM = '#F2E8D0';
  var BLACK = '#1A1A1A';
  var CORAL = '#D9622B';
  var SAGE = '#9AA87E';

  var HOUSE_SEED = 487007;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Idiom to motif table: one motif per vessel, one short fragmentary phrase.
  var PAIRINGS = [
    { motif: 'feet',   phrase: 'CON I PIEDI' },
    { motif: 'hands',  phrase: 'IN MANO' },
    { motif: 'eyes',   phrase: 'A OCCHI APERTI' },
    { motif: 'tongues', phrase: 'LINGUA LUNGA' },
    { motif: 'ears',   phrase: 'ORECCHIE APERTE' }
  ];

  var W = 720, H = 720;
  var isPhone = false;
  var tapCount = 0;

  function detectPhone() {
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr && scr.width && scr.height) {
      return Math.min(scr.width, scr.height) < 700;
    }
    return H > W * 1.15;
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var nw, nh;
    if (vv && vv.width && vv.height) {
      nw = Math.floor(vv.width); nh = Math.floor(vv.height);
    } else if (typeof window !== 'undefined' && window.innerWidth) {
      nw = Math.floor(window.innerWidth); nh = Math.floor(window.innerHeight);
    } else { nw = W; nh = H; }
    if (nw > 0 && nh > 0) { W = nw; H = nh; }
    if (canvas.width !== W) canvas.width = W;
    if (canvas.height !== H) canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    isPhone = detectPhone();
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(); });
  }

  // ---- Seeded lathe profile ----------------------------------------------
  // Half-profile control points: t down the vessel, r as a fraction of the
  // half width. Each seed jitters radii and shoulder / belly heights a
  // little; the profile is drawn with bezier segments and mirrored.
  function makeProfile(seed) {
    var rng = mulberry32(seed);
    function j(amount) { return 1 + (rng() - 0.5) * amount; }
    var pts = [
      { t: 0.00, r: 0.58 * j(0.08) },
      { t: 0.04, r: 0.58 * j(0.08) },
      { t: 0.10, r: 0.43 * j(0.08) },
      { t: 0.18, r: 0.37 * j(0.08) },
      { t: 0.25, r: 0.40 * j(0.08) },
      { t: 0.33, r: 0.64 * j(0.06) },
      { t: 0.45, r: 0.90 * j(0.05) },
      { t: 0.56, r: 1.00 * j(0.04) },
      { t: 0.69, r: 0.90 * j(0.05) },
      { t: 0.82, r: 0.62 * j(0.06) },
      { t: 0.90, r: 0.47 * j(0.06) },
      { t: 0.96, r: 0.44 * j(0.06) },
      { t: 1.00, r: 0.46 * j(0.06) }
    ];
    return pts;
  }

  function radiusAt(pts, t) {
    for (var i = 0; i < pts.length - 1; i++) {
      if (t >= pts[i].t && t <= pts[i + 1].t) {
        var f = (t - pts[i].t) / Math.max(0.0001, pts[i + 1].t - pts[i].t);
        var s = f * f * (3 - 2 * f);
        return pts[i].r + (pts[i + 1].r - pts[i].r) * s;
      }
    }
    return pts[pts.length - 1].r;
  }

  // The lathe silhouette is sampled from the smoothstep-interpolated
  // half-profile (the seeded bezier profile data above), right side down
  // and mirrored left side up, so the outline never ripples or overshoots.
  function vesselPath(cx, topY, vw, vh, pts) {
    var hw = vw / 2;
    var steps = 72, s, t;
    ctx.beginPath();
    ctx.moveTo(cx - pts[0].r * hw, topY);
    ctx.lineTo(cx + pts[0].r * hw, topY);
    for (s = 1; s <= steps; s++) {
      t = s / steps;
      ctx.lineTo(cx + radiusAt(pts, t) * hw, topY + t * vh);
    }
    ctx.lineTo(cx - pts[pts.length - 1].r * hw, topY + vh);
    for (s = steps - 1; s >= 0; s--) {
      t = s / steps;
      ctx.lineTo(cx - radiusAt(pts, t) * hw, topY + t * vh);
    }
    ctx.closePath();
  }

  // ---- Motif glyphs --------------------------------------------------------
  // Foot: a bold footprint. Sole is one filled bezier shape, toes are five
  // discs stepping down in size from the big toe. Drawn toes up, then tilted
  // and stepped so the row reads as striding.
  function drawFoot(cx, cy, size, flip, angle) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.scale(flip * size, size);
    ctx.fillStyle = BLACK;
    // sole: wide rounded ball at the top, a concave arch on the inner
    // side, and a narrow rounded heel at the bottom
    ctx.beginPath();
    ctx.moveTo(-0.10, 0.50);
    ctx.bezierCurveTo(-0.24, 0.46, -0.235, 0.30, -0.25, 0.14);
    ctx.bezierCurveTo(-0.27, -0.02, -0.315, -0.12, -0.30, -0.24);
    ctx.bezierCurveTo(-0.285, -0.345, -0.16, -0.375, 0, -0.375);
    ctx.bezierCurveTo(0.16, -0.375, 0.285, -0.345, 0.30, -0.24);
    ctx.bezierCurveTo(0.315, -0.12, 0.27, 0.0, 0.225, 0.10);
    ctx.bezierCurveTo(0.185, 0.19, 0.155, 0.24, 0.175, 0.33);
    ctx.bezierCurveTo(0.195, 0.42, 0.16, 0.50, -0.10, 0.50);
    ctx.closePath();
    ctx.fill();
    // toes: big toe on the +x side, shrinking across, overlapping the
    // top of the sole so the whole glyph reads as one footprint
    var toes = [
      { x: 0.215, y: -0.435, r: 0.135 },
      { x: 0.075, y: -0.475, r: 0.105 },
      { x: -0.045, y: -0.485, r: 0.090 },
      { x: -0.155, y: -0.465, r: 0.075 },
      { x: -0.25, y: -0.42, r: 0.060 }
    ];
    for (var i = 0; i < toes.length; i++) {
      ctx.beginPath();
      ctx.arc(toes[i].x, toes[i].y, toes[i].r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawHand(cx, cy, size, flip, angle) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.scale(flip, 1);
    ctx.strokeStyle = BLACK;
    ctx.fillStyle = BLACK;
    ctx.lineCap = 'round';
    var s = size;
    // fingers
    ctx.lineWidth = s * 0.17;
    var fx = [-0.30, -0.10, 0.10, 0.29];
    var fl = [0.62, 0.78, 0.72, 0.55];
    for (var i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(fx[i] * s, -0.05 * s);
      ctx.lineTo(fx[i] * s, -fl[i] * s);
      ctx.stroke();
    }
    // thumb
    ctx.beginPath();
    ctx.moveTo(-0.34 * s, 0.18 * s);
    ctx.lineTo(-0.58 * s, -0.10 * s);
    ctx.stroke();
    // palm
    ctx.beginPath();
    ctx.ellipse(0, 0.22 * s, 0.38 * s, 0.34 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawEye(cx, cy, size, flip, angle) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    var s = size;
    ctx.fillStyle = CREAM;
    ctx.strokeStyle = BLACK;
    ctx.lineWidth = Math.max(2, s * 0.09);
    ctx.beginPath();
    ctx.moveTo(-0.62 * s, 0);
    ctx.bezierCurveTo(-0.30 * s, -0.52 * s, 0.30 * s, -0.52 * s, 0.62 * s, 0);
    ctx.bezierCurveTo(0.30 * s, 0.52 * s, -0.30 * s, 0.52 * s, -0.62 * s, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = BLACK;
    ctx.beginPath(); ctx.arc(0, 0, 0.21 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = CREAM;
    ctx.beginPath(); ctx.arc(0.06 * s, -0.06 * s, 0.07 * s, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    void flip;
  }

  function drawTongue(cx, cy, size, flip, angle) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    var s = size;
    ctx.fillStyle = CORAL;
    ctx.strokeStyle = BLACK;
    ctx.lineWidth = Math.max(2, s * 0.07);
    ctx.beginPath();
    ctx.moveTo(-0.34 * s, -0.42 * s);
    ctx.lineTo(-0.34 * s, 0.10 * s);
    ctx.bezierCurveTo(-0.34 * s, 0.52 * s, 0.34 * s, 0.52 * s, 0.34 * s, 0.10 * s);
    ctx.lineTo(0.34 * s, -0.42 * s);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -0.05 * s);
    ctx.lineTo(0, 0.34 * s);
    ctx.stroke();
    ctx.restore();
    void flip;
  }

  function drawEar(cx, cy, size, flip, angle) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.scale(flip, 1);
    var s = size;
    ctx.strokeStyle = BLACK;
    ctx.lineCap = 'round';
    ctx.lineWidth = s * 0.16;
    ctx.beginPath();
    ctx.arc(0, 0, 0.42 * s, -0.4, Math.PI * 1.35);
    ctx.stroke();
    ctx.lineWidth = s * 0.12;
    ctx.beginPath();
    ctx.arc(0.04 * s, 0.02 * s, 0.20 * s, -0.3, Math.PI * 1.2);
    ctx.stroke();
    ctx.restore();
  }

  function drawMotif(motif, cx, cy, size, flip, angle) {
    if (motif === 'feet') drawFoot(cx, cy, size, flip, angle);
    else if (motif === 'hands') drawHand(cx, cy, size, flip, angle);
    else if (motif === 'eyes') drawEye(cx, cy, size, flip, angle);
    else if (motif === 'tongues') drawTongue(cx, cy, size, flip, angle);
    else drawEar(cx, cy, size, flip, angle);
  }

  // Letter-spaced block caps, drawn character by character so spacing works
  // in every renderer.
  function drawSpacedText(text, cx, cy, fontPx, maxWidth, col) {
    var px = fontPx;
    function totalWidth(p) {
      ctx.font = '700 ' + p + 'px Arial, Helvetica, sans-serif';
      var spacing = p * 0.22;
      var w = 0;
      for (var i = 0; i < text.length; i++) w += ctx.measureText(text[i]).width + spacing;
      return w - spacing;
    }
    while (px > 8 && totalWidth(px) > maxWidth) px -= 1;
    ctx.font = '700 ' + px + 'px Arial, Helvetica, sans-serif';
    ctx.fillStyle = col;
    ctx.textBaseline = 'middle';
    var spacing2 = px * 0.22;
    var x = cx - totalWidth(px) / 2;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      var cw = ctx.measureText(ch).width;
      ctx.fillText(ch, x, cy);
      x += cw + spacing2;
    }
    ctx.textBaseline = 'alphabetic';
    return px;
  }

  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    var seed = HOUSE_SEED + tapCount * 1013;
    var pairing = PAIRINGS[tapCount % PAIRINGS.length];
    var pts = makeProfile(seed);
    var rng = mulberry32(seed ^ 0x9E3779B9);

    // sage ground, full frame on every device
    ctx.fillStyle = SAGE;
    ctx.fillRect(0, 0, W, H);

    // vessel geometry: shape kept on phones, sized off the tighter axis
    var vh = Math.min(H * 0.78, W * 1.06);
    var vw = vh / 1.32;
    var cx = W / 2;
    var topY = (H - vh) / 2;
    var hw = vw / 2;
    var u = vw / 100;

    // handles, behind the body: black pass then cream pass leaves an outline
    var neckX = radiusAt(pts, 0.14) * hw;
    var shX = radiusAt(pts, 0.30) * hw;
    var hy1 = topY + vh * 0.12, hy2 = topY + vh * 0.315;
    var bulge = vw * 0.085;
    var outX = Math.max(neckX, shX) + bulge;
    ctx.lineCap = 'round';
    [-1, 1].forEach(function (side) {
      [BLACK, CREAM].forEach(function (col, pass) {
        ctx.strokeStyle = col;
        ctx.lineWidth = Math.max(3, u * (pass === 0 ? 6.8 : 3.8));
        ctx.beginPath();
        ctx.moveTo(cx + side * neckX * 0.94, hy1);
        ctx.bezierCurveTo(
          cx + side * outX, hy1 + (hy2 - hy1) * 0.18,
          cx + side * outX, hy2 - (hy2 - hy1) * 0.18,
          cx + side * shX * 0.97, hy2
        );
        ctx.stroke();
      });
    });

    // vessel body in cream slip
    vesselPath(cx, topY, vw, vh, pts);
    ctx.fillStyle = CREAM;
    ctx.fill();

    // everything painted on the vessel is clipped to its silhouette
    ctx.save();
    vesselPath(cx, topY, vw, vh, pts);
    ctx.clip();

    // coral phrase band at the shoulder
    var bandT = 0.255, bandH = vh * 0.115;
    var bandY = topY + vh * bandT;
    ctx.fillStyle = CORAL;
    ctx.fillRect(cx - hw - 2, bandY, vw + 4, bandH);
    ctx.fillStyle = BLACK;
    ctx.fillRect(cx - hw - 2, bandY + bandH - Math.max(1.5, u * 0.45), vw + 4, Math.max(1.5, u * 0.45));

    // belly motif band, bounded by thin black rules
    var mT = 0.455, mH = vh * 0.265;
    var mY = topY + vh * mT;
    ctx.fillStyle = BLACK;
    ctx.fillRect(cx - hw - 2, mY, vw + 4, Math.max(1.5, u * 0.5));
    ctx.fillRect(cx - hw - 2, mY + mH, vw + 4, Math.max(1.5, u * 0.5));

    var isFeet = pairing.motif === 'feet';
    var count = isFeet ? 5 : 4;
    var step = vw * 1.06 / count;
    var size = isFeet ? mH * 0.68 : mH * 0.52;
    for (var i = 0; i < count; i++) {
      var gx = cx - vw * 0.53 + step * (i + 0.5);
      var flip = (i % 2 === 0) ? 1 : -1;
      var gy = mY + mH / 2 + (i % 2 === 0 ? -mH * 0.07 : mH * 0.07);
      var angle = isFeet ? (i % 2 === 0 ? -0.14 : 0.14) : (rng() - 0.5) * 0.14;
      if (isFeet) drawFoot(gx, gy, size, flip, angle);
      else drawMotif(pairing.motif, gx, gy, size, flip, angle);
    }
    ctx.restore();

    // phrase, cream block caps on the coral band
    var shoulderW = radiusAt(pts, bandT + 0.055) * hw * 2;
    drawSpacedText(pairing.phrase, cx, bandY + bandH / 2 + 1, vh * 0.052, shoulderW * 0.92, CREAM);

    // vessel outline where it meets the ground, plus the rim line
    vesselPath(cx, topY, vw, vh, pts);
    ctx.strokeStyle = BLACK;
    ctx.lineWidth = Math.max(2, u * 0.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - pts[0].r * hw, topY);
    ctx.lineTo(cx + pts[0].r * hw, topY);
    ctx.stroke();

    // hint
    ctx.globalAlpha = 0.38;
    ctx.fillStyle = BLACK;
    ctx.font = '400 ' + Math.max(12, Math.min(15, W * 0.02)) + 'px Arial, Helvetica, sans-serif';
    ctx.fillText('tap', 14, H - 14);
    ctx.globalAlpha = 1;
    void isPhone;
  }

  function onTap() {
    tapCount += 1;
    draw();
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onTap);
  }

  resize();
  draw();
})();
</script>
</body>
</html>
