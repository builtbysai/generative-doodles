<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hover — No. 675</title>
<!-- phantom-fill-8957 -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#08090c;color:#c9ced6;overflow:hidden;
    font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif}
  #c{position:fixed;inset:0;display:block;cursor:none}
  .hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;
    justify-content:space-between;padding:28px 32px 26px}
  .top{display:flex;justify-content:space-between;align-items:flex-start}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(26px,4vw,44px);
    line-height:1.05;color:#eceef2}
  h1 em{font-style:italic;color:#93a7c4}
  .no{font-size:11px;letter-spacing:.28em;color:#5d6673;text-transform:uppercase;text-align:right;line-height:1.9}
  .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
  .hint{font-size:12px;color:#6b7480;line-height:1.7;max-width:360px}
  .hint b{color:#c9ced6;font-weight:600}
  .meter{text-align:right}
  .meter b{display:block;font-family:Georgia,serif;font-style:italic;font-weight:400;
    font-size:30px;color:#eceef2;font-variant-numeric:tabular-nums}
  .meter span{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#5d6673}
  @media(max-width:560px){.hud{padding:20px}.hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="top">
    <h1>Hover</h1>
    <div class="no">No. 675<br>Marks at the edge<br>of visibility</div>
  </div>
  <div class="bottom">
    <p class="hint"><b>Move slowly.</b> The marks breathe at the edge of
    sight — your pointer steadies them. Hold still over one place and
    watch it come into focus.</p>
    <div class="meter"><b id="calm">0%</b><span>field steadied</span></div>
  </div>
</div>
<script>
(function(){
  const cv=document.getElementById('c'), ctx=cv.getContext('2d');
  let W,H,dpr,marks=[];
  const R=150; // steadying radius
  function resize(){
    dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    cv.width=W*dpr; cv.height=H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    seed();
  }
  function seed(){
    marks=[];
    const cols=Math.max(10,Math.floor(W/86)), rows=Math.max(7,Math.floor(H/86));
    for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
      const x=(i+.5)*W/cols+(Math.random()-.5)*22, y=(j+.5)*H/rows+(Math.random()-.5)*22;
      marks.push({x:x,y:y, bx:x, by:y, len:6+Math.random()*16,
        ang:Math.random()*Math.PI, ph:Math.random()*Math.PI*2,
        br:2.2+Math.random()*2.6, calm:0});
    }
  }
  addEventListener('resize',resize); resize();
  const ptr={x:-9999,y:-9999,inside:false};
  addEventListener('pointermove',e=>{ ptr.x=e.clientX; ptr.y=e.clientY; ptr.inside=true; });
  addEventListener('pointerleave',()=>{ ptr.inside=false; });
  addEventListener('pointerdown',e=>{ ptr.x=e.clientX; ptr.y=e.clientY; ptr.inside=true; });
  const calmEl=document.getElementById('calm');
  let last=performance.now(), t=0;
  function frame(nowMs){
    const dt=Math.min((nowMs-last)/1000,.05); last=nowMs; t+=dt;
    ctx.clearRect(0,0,W,H);
    let calmSum=0;
    for(const m of marks){
      const d=Math.hypot(m.x-ptr.x,m.y-ptr.y);
      const near=ptr.inside?Math.max(0,1-d/R):0;
      // calm eases toward proximity: near marks steady, far marks drift back to breathing
      m.calm+=(near-m.calm)*Math.min(1,dt*2.2);
      calmSum+=m.calm;
      // breathing: slow opacity swell + jitter, both damped by calm
      const breath=.5+.5*Math.sin(t*(2*Math.PI/m.br)+m.ph);
      const jitter=(1-m.calm)*4;
      const jx=(Math.random()-.5)*jitter, jy=(Math.random()-.5)*jitter;
      const a=.06+.30*breath*(1-m.calm*.5)+.62*m.calm;
      const w=.6+1.5*m.calm;
      const drift=(1-m.calm)*Math.sin(t*.8+m.ph)*.35;
      const ang=m.ang+drift;
      const cx=m.bx+jx, cy=m.by+jy;
      ctx.strokeStyle='rgba(196,208,224,'+a.toFixed(3)+')';
      ctx.lineWidth=w; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(cx-Math.cos(ang)*m.len/2, cy-Math.sin(ang)*m.len/2);
      ctx.lineTo(cx+Math.cos(ang)*m.len/2, cy+Math.sin(ang)*m.len/2);
      ctx.stroke();
      // steadied marks gain a faint dot at their centre
      if(m.calm>.55){
        ctx.fillStyle='rgba(220,228,240,'+((m.calm-.55)*1.4).toFixed(3)+')';
        ctx.beginPath(); ctx.arc(cx,cy,1.6,0,7); ctx.fill();
      }
    }
    // soft field ring around the pointer
    if(ptr.inside){
      const g=ctx.createRadialGradient(ptr.x,ptr.y,0,ptr.x,ptr.y,R);
      g.addColorStop(0,'rgba(147,167,196,0.05)');
      g.addColorStop(1,'rgba(147,167,196,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(ptr.x,ptr.y,R,0,7); ctx.fill();
      ctx.strokeStyle='rgba(147,167,196,.18)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(ptr.x,ptr.y,R,0,7); ctx.stroke();
    }
    calmEl.textContent=Math.round(calmSum/marks.length*100)+'%';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
