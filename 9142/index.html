<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№9142 — The Tunnel</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #07060d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .cap {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 18px 20px calc(18px + env(safe-area-inset-bottom));
    color: rgba(235, 230, 255, 0.55);
    font: 13px/1.5 Georgia, 'Times New Roman', serif;
    letter-spacing: 0.04em; text-align: center;
    pointer-events: none; user-select: none;
  }
  .cap b { color: rgba(235, 230, 255, 0.85); font-weight: normal; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap"><b>№9142 — The Tunnel.</b> The first one through carves the way.</div>
<script>
(function () {
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var MX = 0; // membrane centre x
  var HALF = 36; // membrane half-width (a thick wall, not a line)

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    MX = W * 0.5;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- membrane: ripple + tunnels ----
  // tunnels[i] = 0..1, how carved-open row i is. Crossings carve it, it heals slowly.
  var ROWS = 0, disp = [], vel = [], tunnels = [];
  function initRows() {
    ROWS = Math.max(48, Math.floor(H / 12));
    disp = new Array(ROWS).fill(0);
    vel = new Array(ROWS).fill(0);
    tunnels = new Array(ROWS).fill(0);
  }
  initRows();
  window.addEventListener('resize', initRows);

  function rowY(i) { return (i + 0.5) * (H / ROWS); }

  function poke(y0, strength) {
    for (var i = 0; i < ROWS; i++) {
      var d = Math.abs(rowY(i) - y0);
      var g = Math.exp(-(d * d) / (2 * 26 * 26));
      vel[i] += g * strength;
    }
  }

  function carve(y0, amount) {
    for (var i = 0; i < ROWS; i++) {
      var d = Math.abs(rowY(i) - y0);
      var g = Math.exp(-(d * d) / (2 * 5 * 5));
      tunnels[i] = Math.min(1, tunnels[i] + g * amount);
    }
  }

  function tunnelAt(y) {
    var fi = (y / H) * ROWS - 0.5;
    var i0 = Math.max(0, Math.min(ROWS - 1, Math.floor(fi)));
    var i1 = Math.max(0, Math.min(ROWS - 1, i0 + 1));
    var f = Math.max(0, Math.min(1, fi - i0));
    return tunnels[i0] * (1 - f) + tunnels[i1] * f;
  }

  function stepMembrane(dt) {
    var k = 0.14, damp = 0.90, spread = 0.28;
    var next = new Array(ROWS);
    for (var i = 0; i < ROWS; i++) {
      var left = disp[i - 1] || 0, right = disp[i + 1] || 0;
      var acc = -k * disp[i] + spread * (left + right - 2 * disp[i]);
      vel[i] = (vel[i] + acc) * damp;
      next[i] = disp[i] + vel[i] * dt * 60;
      // tunnels heal slowly
      tunnels[i] = Math.max(0, tunnels[i] - dt * 0.035);
    }
    disp = next;
  }

  function membraneXAt(y) {
    var fi = (y / H) * ROWS - 0.5;
    var i0 = Math.max(0, Math.min(ROWS - 1, Math.floor(fi)));
    var i1 = Math.max(0, Math.min(ROWS - 1, i0 + 1));
    var f = Math.max(0, Math.min(1, fi - i0));
    var base = Math.sin(y * 0.008 + t * 0.35) * 3;
    return MX + base + disp[i0] * (1 - f) + disp[i1] * f;
  }

  // ---- particles ----
  var parts = [];
  var SPAWN_EVERY = 0.6, spawnT = 0;

  function spawn() {
    var y = H * (0.08 + Math.random() * 0.84);
    parts.push({
      x: -12,
      y: y,
      vy: (Math.random() - 0.5) * 12,
      speed: 26 + Math.random() * 28,
      r: 2.2 + Math.random() * 2.4,
      hue: 42 + Math.random() * 8,
      phase: Math.random() * Math.PI * 2,
      through: false,
      flare: 0
    });
  }

  function stepParts(dt) {
    spawnT -= dt;
    if (spawnT <= 0 && parts.length < 20) { spawn(); spawnT = SPAWN_EVERY * (0.7 + Math.random() * 0.6); }
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      var mx = membraneXAt(p.y);
      var inside = p.x > mx - HALF && p.x < mx + HALF;
      var tun = tunnelAt(p.y);
      // inside the wall: crawl through solid stone, glide through a carved tunnel
      var sp = p.speed;
      if (inside) {
        sp = p.speed * (0.28 + 0.72 * tun);
        carve(p.y, dt * 0.8);
      }
      p.x += sp * dt;
      p.y += (p.vy + Math.sin(t * 0.9 + p.phase) * 6) * dt;
      if (p.y < 6) p.y = 6; if (p.y > H - 6) p.y = H - 6;
      var near = inside ? 1 : Math.max(0, 1 - Math.abs(mx - p.x) / 70);
      p.flare = Math.max(near, p.flare * 0.92);
      if (!p.through && p.x >= mx + HALF) {
        p.through = true;
        poke(p.y, 4.5);
        p.hue = 190 + Math.random() * 20;
      }
      if (p.x > W + 16) parts.splice(i, 1);
    }
  }

  // ---- draw ----
  var t = 0, last = performance.now();
  function draw(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
    stepMembrane(dt);
    stepParts(dt);

    ctx.fillStyle = '#07060d';
    ctx.fillRect(0, 0, W, H);
    var bg = ctx.createRadialGradient(MX, H / 2, 0, MX, H / 2, Math.max(W, H) * 0.55);
    bg.addColorStop(0, 'rgba(88, 60, 180, 0.10)');
    bg.addColorStop(1, 'rgba(88, 60, 180, 0)');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // the wall: a thick band, solid violet where uncarved, open and glowing
    // where a tunnel has been cut through it
    var rh = H / ROWS;
    for (var i = 0; i < ROWS; i++) {
      var y = rowY(i), x = membraneXAt(y), s = tunnels[i];
      // solid stone
      ctx.fillStyle = 'rgba(124, 92, 255, ' + (0.20 * (1 - s)).toFixed(3) + ')';
      ctx.fillRect(x - HALF, y - rh / 2, HALF * 2, rh + 0.5);
      // carved channel glow
      if (s > 0.02) {
        ctx.fillStyle = 'rgba(150, 220, 255, ' + (0.55 * s).toFixed(3) + ')';
        ctx.fillRect(x - HALF, y - rh / 2, HALF * 2, rh + 0.5);
      }
      // centre seam
      ctx.fillStyle = 'rgba(178, 152, 255, ' + (0.5 * (1 - s * 0.7)).toFixed(3) + ')';
      ctx.fillRect(x - 0.7, y - rh / 2, 1.4, rh + 0.5);
    }

    // particles
    for (var k = 0; k < parts.length; k++) {
      var p = parts[k];
      var R = p.r * (3.2 + p.flare * 3.5);
      var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
      g.addColorStop(0, 'hsla(' + p.hue + ', 95%, 72%, ' + (0.85 + p.flare * 0.15) + ')');
      g.addColorStop(0.35, 'hsla(' + p.hue + ', 90%, 60%, 0.35)');
      g.addColorStop(1, 'hsla(' + p.hue + ', 90%, 60%, 0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.55, 0, Math.PI * 2); ctx.fill();
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) last = performance.now();
  });
})();
</script>
</body>
</html>
