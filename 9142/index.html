<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№9142 — Drift</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0812; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .cap {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 18px 20px calc(18px + env(safe-area-inset-bottom));
    color: rgba(235, 230, 255, 0.5);
    font: 13px/1.5 Georgia, 'Times New Roman', serif;
    letter-spacing: 0.04em; text-align: center;
    pointer-events: none; user-select: none;
  }
  .cap b { color: rgba(235, 230, 255, 0.85); font-weight: normal; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap"><b>№9142 — Drift.</b></div>
<script>
(function () {
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ribbons: bands of colour that drift, undulate, and pass through each other.
  // No objects, no story. Only colour, light, and slow motion.
  var ribbons = [
    { base: 0.16, amp1: 48, amp2: 24, k1: 0.004, k2: 0.011, s1: 0.21, s2: -0.13, drift: 0.05, thick: 20, color: '124, 92, 255' },  // violet
    { base: 0.30, amp1: 60, amp2: 28, k1: 0.003, k2: 0.009, s1: -0.17, s2: 0.19, drift: 0.04, thick: 28, color: '45, 212, 191' },  // teal
    { base: 0.44, amp1: 44, amp2: 36, k1: 0.005, k2: 0.013, s1: 0.15, s2: 0.11, drift: 0.06, thick: 18, color: '236, 72, 153' },  // magenta
    { base: 0.58, amp1: 64, amp2: 26, k1: 0.002, k2: 0.008, s1: -0.12, s2: -0.21, drift: 0.05, thick: 32, color: '59, 130, 246' },  // blue
    { base: 0.72, amp1: 52, amp2: 32, k1: 0.004, k2: 0.010, s1: 0.19, s2: 0.15, drift: 0.04, thick: 24, color: '245, 158, 11' },  // amber
    { base: 0.86, amp1: 56, amp2: 20, k1: 0.003, k2: 0.012, s1: -0.15, s2: -0.09, drift: 0.06, thick: 26, color: '167, 139, 250' }  // lavender
  ];
  ribbons.forEach(function (r, i) {
    r.p1 = i * 1.7;
    r.p2 = i * 2.3 + 1;
    r.pd = i * 1.1;
  });

  function centreY(r, x, t) {
    var y = r.base * H + Math.sin(t * r.drift + r.pd) * H * 0.05;
    y += r.amp1 * Math.sin(x * r.k1 + t * r.s1 + r.p1);
    y += r.amp2 * Math.sin(x * r.k2 + t * r.s2 + r.p2);
    return y;
  }

  function trace(r, t) {
    ctx.beginPath();
    var step = 6;
    for (var x = -10; x <= W + 10; x += step) {
      var y = centreY(r, x, t);
      if (x === -10) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
  }

  var t = 0, last = performance.now();
  function draw(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;

    ctx.fillStyle = '#0a0812';
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (var i = 0; i < ribbons.length; i++) {
      var r = ribbons[i];
      // layered strokes: a bright core with a soft halo, so the band glows
      var layers = [
        { w: r.thick * 3.2, a: 0.05 },
        { w: r.thick * 1.8, a: 0.12 },
        { w: r.thick, a: 0.42 },
        { w: r.thick * 0.45, a: 0.75 }
      ];
      for (var j = 0; j < layers.length; j++) {
        trace(r, t);
        ctx.strokeStyle = 'rgba(' + r.color + ', ' + layers[j].a + ')';
        ctx.lineWidth = layers[j].w;
        ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) last = performance.now();
  });
})();
</script>
</body>
</html>
