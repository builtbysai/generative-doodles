<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dual Level Five</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0D0D0F; }
  canvas { display:block; touch-action:none; }
  .hint { position:fixed; left:0; right:0; bottom:14px; text-align:center;
    font:12px/1.4 monospace; color:#8f8a7d; letter-spacing:0.08em; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">drag to scrub between the levels</div>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
var INK = '#2E7D4F', RED = '#C0392B', PAPER = '#FAF6EC';

// Three members of the five-fold family: same grammar, different tuning.
var SEEDS = [
  { rot: -90, satRing: 0.60, satScale: 0.30, petal: 0.34, cell: 0.13 },
  { rot: -54, satRing: 0.55, satScale: 0.26, petal: 0.46, cell: 0.11 },
  { rot: -90, satRing: 0.66, satScale: 0.34, petal: 0.26, cell: 0.15 }
];
var seedIdx = 0;
var lvl = 0.3, restLvl = 0.3; // opens with level 1 dominant, level 2 threading through

function pentPts(cx, cy, r, rotDeg) {
  var out = [], i, a;
  for (i = 0; i < 5; i++) {
    a = (rotDeg + i * 72) * Math.PI / 180;
    out.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
  }
  return out;
}
function strokePoly(pts, close) {
  var i;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (close) ctx.closePath();
  ctx.stroke();
}
function star52(cx, cy, r, rotDeg) {
  var v = pentPts(cx, cy, r, rotDeg);
  strokePoly([v[0], v[2], v[4], v[1], v[3]], true);
}
function rosette(cx, cy, r, S) {
  // level 1 motif: {5/2} star, its pentagon, a petal ring, an outer decagon
  var v = pentPts(cx, cy, r, S.rot), i, mx, my;
  star52(cx, cy, r, S.rot);
  strokePoly(v, true);
  for (i = 0; i < 5; i++) {
    var p = v[i], q = v[(i + 1) % 5];
    mx = (p[0] + q[0]) / 2; my = (p[1] + q[1]) / 2;
    var dx = mx - cx, dy = my - cy, d = Math.hypot(dx, dy) || 1;
    var bx = mx + dx / d * r * S.petal, by = my + dy / d * r * S.petal;
    ctx.beginPath();
    ctx.moveTo(p[0], p[1]);
    ctx.quadraticCurveTo(bx, by, q[0], q[1]);
    ctx.stroke();
  }
  var dec = [], k, a;
  for (k = 0; k < 10; k++) {
    a = (S.rot + 36 + k * 36) * Math.PI / 180;
    dec.push([cx + Math.cos(a) * r * 1.18, cy + Math.sin(a) * r * 1.18]);
  }
  strokePoly(dec, true);
}

function draw() {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#0D0D0F'; ctx.fillRect(0, 0, W, H);
  var m = Math.min(W, H) * 0.035;
  var px = m, py = m, pw = W - 2 * m, ph = H - 2 * m;
  ctx.fillStyle = PAPER; ctx.fillRect(px, py, pw, ph);
  var cx = W / 2, cy = H / 2;
  var R = Math.min(pw, ph) / 2 * 0.94;
  var S = SEEDS[seedIdx];
  var sats = pentPts(cx, cy, R * S.satRing, S.rot);
  var i;

  ctx.save();
  ctx.beginPath(); ctx.rect(px, py, pw, ph); ctx.clip();

  // construction: compass circles and arcs, never hidden, always 0.25 alpha
  ctx.strokeStyle = RED; ctx.globalAlpha = 0.25; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, R * S.satRing, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.42, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, R * 1.02, 0, Math.PI * 2); ctx.stroke();
  for (i = 0; i < 5; i++) {
    ctx.beginPath(); ctx.arc(sats[i][0], sats[i][1], R * S.satScale * 1.5, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(sats[i][0], sats[i][1], R * S.satRing, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // level 2 first (it threads underneath): relationships among the motifs
  if (lvl > 0.02) {
    ctx.strokeStyle = RED;
    ctx.globalAlpha = 0.15 + 0.75 * lvl;
    ctx.lineWidth = 1 + 1.6 * lvl;
    strokePoly(sats, true);                       // connect the star centres
    var inner = pentPts(cx, cy, R * S.satRing * 0.45, S.rot + 36);
    strokePoly([inner[0], inner[2], inner[4], inner[1], inner[3]], true);
    ctx.globalAlpha = 0.25 + 0.55 * lvl;          // half-scale pattern in each cell
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1 + 1.2 * lvl;
    for (i = 0; i < 5; i++) {
      var a1 = sats[i], a2 = sats[(i + 1) % 5];
      var gx = (cx + a1[0] + a2[0]) / 3, gy = (cy + a1[1] + a2[1]) / 3;
      star52(gx, gy, R * S.cell, S.rot + 36);
    }
    ctx.globalAlpha = 1;
  }

  // level 1: the primary rosette field
  ctx.strokeStyle = INK;
  ctx.globalAlpha = 1 - 0.78 * lvl;
  ctx.lineWidth = 1.7 - 0.6 * lvl;
  rosette(cx, cy, R * 0.42, S);
  for (i = 0; i < 5; i++) rosette(sats[i][0], sats[i][1], R * S.satScale, S);
  ctx.globalAlpha = 1;
  ctx.restore();
}
var drag = null, lastTap = { t: 0, x: 0, y: 0 };
canvas.addEventListener('pointerdown', function (e) {
  var now = Date.now();
  if (now - lastTap.t < 320 && Math.abs(e.clientX - lastTap.x) < 44 && Math.abs(e.clientY - lastTap.y) < 44) {
    seedIdx = (seedIdx + 1) % SEEDS.length;
    lastTap.t = 0; drag = null;
    return;
  }
  lastTap = { t: now, x: e.clientX, y: e.clientY };
  drag = { x: e.clientX, l0: lvl };
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  lvl = clamp01(drag.l0 + (e.clientX - drag.x) / (0.55 * W));
});
function endDrag() { if (drag) { restLvl = lvl; drag = null; } }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

resize();
draw();
function frame() {
  if (!drag) lvl += (restLvl - lvl) * 0.08;
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
