<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No.176 Paper Tree</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F2EDE1; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// No.176 Paper Tree. One small branch-cluster motif - seven curved
// ink strokes with three growth tips - iterated eight generations:
// at every tip, three copies of the block at 0.55 scale, one rotated
// differently, one reflected, one lightened to #3A3A3A for depth
// (Fathauer's depth trick). The block is pure path data, replayed
// under composed affine transforms; no offscreen canvas anywhere.
// Where stamps pile up, short jittered pencil marks in #6B6B6B are
// seeded into the overlaps. The tree grows a generation every two
// seconds, holds with a faint paper-grain shimmer, fades, regrows.
// Double-tap reseeds a new tree. No hint; the gallery note carries it.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#F2EDE1', INK = '#141414', LIGHT = '#3A3A3A', PENCIL = '#6B6B6B';
var W = 0, H = 0;
var T = 30000, OFFSET = 20000;
var GENS = 8;
var seed = 20240706;
(function () {
  var m = /seed=(\d+)/.exec(location.search || '');
  if (m) seed = parseInt(m[1], 10) >>> 0;
})();
var epoch = -OFFSET; // local loop time = (now - epoch) mod T

function rng(seedIn) {
  var a = seedIn >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
function easeOut(k) { return 1 - Math.pow(1 - k, 3); }

// ---------- the block: 7 strokes, 3 tips (unit space, up = -y) --------
var BLOCK = [
  { p: [0, 0, -0.02, -0.5, 0.06, -1.0], w: 0.030 },        // stem -> tip 0
  { p: [0.01, -0.30, -0.22, -0.52, -0.44, -0.80], w: 0.022 }, // -> tip 1
  { p: [0.02, -0.42, 0.24, -0.60, 0.42, -0.86], w: 0.022 },   // -> tip 2
  { p: [-0.10, -0.44, -0.26, -0.60, -0.30, -0.72], w: 0.014 },
  { p: [0.12, -0.55, 0.26, -0.70, 0.28, -0.88], w: 0.014 },
  { p: [0.03, -0.60, -0.06, -0.78, -0.10, -0.92], w: 0.014 },
  { p: [0.0, -0.12, -0.10, -0.26, -0.16, -0.34], w: 0.016 }
];
var TIPS = [0, 1, 2].map(function (si) {
  var s = BLOCK[si].p;
  var dx = s[4] - s[2], dy = s[5] - s[3];
  var L = Math.sqrt(dx * dx + dy * dy);
  return { x: s[4], y: s[5], ang: Math.atan2(dy, dx) }; // outgoing direction
});
var UP = Math.atan2(-1, 0); // block's native growth direction

// ---------- affine helpers ----------------------------------------------
function mIdent() { return [1, 0, 0, 1, 0, 0]; }
function mMul(m, n) { // m after n: apply n first
  return [
    m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1],
    m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3],
    m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]
  ];
}
function mTrans(x, y) { return [1, 0, 0, 1, x, y]; }
function mRot(a) { var c = Math.cos(a), s = Math.sin(a); return [c, s, -s, c, 0, 0]; }
function mScale(sx, sy) { return [sx, 0, 0, sy, 0, 0]; }
function mPt(m, x, y) { return [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]]; }

// ---------- build the flat entry list -------------------------------------
// entry: {pts: [x0,y0,cx,cy,x1,y1] in tree units, w, color, gen, mark}
var entries = [], grain = [];
function buildTree(seedIn) {
  entries = [];
  var rand = rng(seedIn);
  var rotA = 10 + rand() * 10, rotB = 12 + rand() * 12, rotC = 6 + rand() * 8;
  var stamps = [{ m: mIdent(), gen: 0, light: false }];
  var all = [];
  while (stamps.length) {
    var st = stamps.shift();
    all.push(st);
    if (st.gen >= GENS - 1) continue;
    // roles rotate per generation: 0 rotated, 1 reflected, 2 lightened
    for (var ti = 0; ti < 3; ti++) {
      var tip = TIPS[ti];
      var role = (ti + st.gen) % 3;
      var sc = 0.55 * (0.94 + rand() * 0.12);
      var local = mTrans(tip.x, tip.y);
      local = mMul(local, mRot(tip.ang - UP));
      if (role === 0) local = mMul(local, mRot(rotA * Math.PI / 180 * (0.8 + rand() * 0.4)));
      else if (role === 1) { local = mMul(local, mRot(-rotB * Math.PI / 180 * (0.8 + rand() * 0.4))); local = mMul(local, mScale(-1, 1)); }
      else local = mMul(local, mRot(rotC * Math.PI / 180 * (0.8 + rand() * 0.4)));
      local = mMul(local, mScale(sc, sc));
      stamps.push({ m: mMul(st.m, local), gen: st.gen + 1, light: role === 2 });
    }
  }
  all.forEach(function (st) {
    var det = Math.abs(st.m[0] * st.m[3] - st.m[1] * st.m[2]);
    var cs = Math.sqrt(det);
    var col = st.light ? LIGHT : INK;
    BLOCK.forEach(function (s) {
      var a = mPt(st.m, s.p[0], s.p[1]), b = mPt(st.m, s.p[2], s.p[3]), c = mPt(st.m, s.p[4], s.p[5]);
      entries.push({ pts: [a[0], a[1], b[0], b[1], c[0], c[1]], w: s.w * cs, color: col, gen: st.gen, alpha: st.light ? 0.8 : 0.92 });
    });
    // pencil marks at overlaps on mid generations
    if (st.gen >= 2 && st.gen <= 5) {
      for (var q = 0; q < 2; q++) {
        var s2 = BLOCK[Math.floor(rand() * BLOCK.length)].p;
        var tt = 0.3 + rand() * 0.4, u = 1 - tt;
        var mx = u * u * s2[0] + 2 * u * tt * s2[2] + tt * tt * s2[4];
        var my = u * u * s2[1] + 2 * u * tt * s2[3] + tt * tt * s2[5];
        var a2 = mPt(st.m, mx, my);
        var jx = (rand() - 0.5) * 0.09 * cs * 8, jy = (rand() - 0.5) * 0.09 * cs * 8;
        entries.push({ pts: [a2[0] - jx, a2[1] - jy, a2[0], a2[1], a2[0] + jx, a2[1] + jy], w: 0.008 * cs, color: PENCIL, gen: st.gen, alpha: 0.5, mark: true });
      }
    }
  });
  // paper grain in screen space
  grain = [];
  var gr = rng(seedIn * 3 + 11);
  for (var i = 0; i < 700; i++)
    grain.push({ x: gr(), y: gr(), r: 0.6 + gr() * 1.1, ph: gr() * 6.28 });
}
buildTree(seed);

// ---------- layout -----------------------------------------------------------
var fit = { s: 100, ox: 0, oy: 0 };
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  if (H > W * 1.15) { // portrait phone: fill the frame, canopy bleeds off the sides
    fit.s = Math.min(H * 0.66 / 2.5, W * 1.9 / 3.8);
    fit.oy = H * 0.96;
  } else {
    fit.s = Math.min(H * 0.84 / 2.5, W * 0.92 / 3.8);
    fit.oy = H * 0.90;
  }
  fit.ox = W / 2;
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

var lastTapAt = -1000;
canvas.addEventListener('pointerup', function (e) {
  if (e.timeStamp - lastTapAt < 350) {
    seed = (seed * 1103515245 + 12345 + (e.timeStamp | 0)) >>> 0;
    buildTree(seed);
    epoch = e.timeStamp;
    lastTapAt = -1000;
  } else lastTapAt = e.timeStamp;
});

function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var ts = ((((now - epoch) % T) + T) % T) / 1000;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  var fade = ts >= 24 ? 1 - (ts - 24) / 6 : 1;
  // paper grain shimmer during the hold
  var shim = ts >= 16 && ts < 24 ? 1 : 0.35;
  ctx.fillStyle = PENCIL;
  for (var i = 0; i < grain.length; i++) {
    var g = grain[i];
    ctx.globalAlpha = 0.05 * shim * (0.7 + 0.3 * Math.sin(ts * 0.8 + g.ph)) * fade;
    ctx.beginPath();
    ctx.arc(g.x * W, g.y * H, g.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.lineCap = 'round';
  for (i = 0; i < entries.length; i++) {
    var e = entries[i];
    var gp = clamp01((ts - e.gen * 2 - (i % 89) / 89 * 0.7) / 1.3);
    if (gp <= 0) continue;
    var wPx = e.w * fit.s;
    var a = e.alpha * easeOut(gp) * fade;
    if (wPx < 0.5) a *= Math.max(0.25, wPx / 0.5);
    if (a <= 0.01) continue;
    ctx.globalAlpha = a;
    ctx.strokeStyle = e.color;
    ctx.lineWidth = Math.max(0.4, wPx);
    var p = e.pts;
    ctx.beginPath();
    ctx.moveTo(fit.ox + p[0] * fit.s, fit.oy + p[1] * fit.s);
    ctx.quadraticCurveTo(fit.ox + p[2] * fit.s, fit.oy + p[3] * fit.s, fit.ox + p[4] * fit.s, fit.oy + p[5] * fit.s);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
