<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.440 Abstract Fruits</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F5F0E6; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.440 Abstract Fruits (angelina_bambina_dsgn, EXPANSION #47).
// After Angelina Bambina's "Abstract fruits" licensing collection:
// her commercial pattern grid as art. A 2x2 grid of four seamless
// fruit patterns, each quadrant a live tile drawn from motif DATA
// on the one canvas (the prompt's offscreen tile canvases are
// overridden by the house rule, same as No.436):
//   Q1 (top-left)     minimalist leaf motif on mustard
//   Q2 (top-right)    dense stylised pomegranates, teal/pink/orange
//   Q3 (bottom-left)  orange pomegranates with dark-green leaves
//                     on soft pink
//   Q4 (bottom-right) speckled polka-dot texture on light gray
// Thin cream dividers, 2px in design space, split the halves.
//
// WATCH-ONLY 80s master loop. Motifs pulse at 2% sine scale on
// per-quadrant periods that divide 80 (8s, 10s, 16s, 20s in
// quadrant order), each quadrant at its own fixed phase, so
// frame one already shows the pulses at differing phases.
// Palette rotation: in every 80s loop each quadrant takes one
// 20s rotation window (Q4 [0,20), Q1 [20,40), Q2 [40,60),
// Q3 [60,80)); inside its window it steps through the four
// authored harvest schemes in its own order, one scheme every
// 5s, and is back on its opening scheme when the window ends.
// Outside its window a quadrant rests on its opening scheme.
// The scheme at any moment is an index read from the loop
// clock, never a hue shift or filter, and because every
// quadrant's state is a pure function of loop time the 80s
// seam is exact: at the seam all four are on their frame-one
// schemes. TAP advances all four motif tables by one at once
// (the prompt's re-seed, as a fixed authored table).
//
// Frame one is drawn synchronously at the constant phase
// T = 2.0s (all four quadrants on their authored opening
// schemes, pulses at differing phases); the clock is anchored
// there and advances in fixed 1/60 ticks, never from a wall
// clock. One canvas, flat colour only, no gradients, no
// shadowBlur, no text anywhere.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Closed set from the prompt, nothing else. The four harvest
// schemes below only ever assign these hexes to the roles.
var MUSTARD = '#D9A441', TEAL = '#2E8B8B', PINK = '#F06A8A';
var ORANGE = '#E8823C', SOFTPINK = '#F6C9D4', LEAF = '#2E5B3E';
var GRAY = '#D8D8D8', SPECK = '#8A8A8A', CREAM = '#F5F0E6';

// The four authored harvest schemes. Roles:
//   q1g/q1l  Q1 ground / leaf
//   q2g/q2f  Q2 ground / fruit colours (cycled per fruit)
//   q3g/q3f/q3l  Q3 ground / fruit / leaf
//   q4g/q4d/q4s  Q4 ground / polka dot / speckle
// Scheme 0 is the authored opening for every quadrant:
// leaves on mustard, pomegranates on mustard in teal/pink/
// orange, orange pomegranates with green leaves on soft
// pink, gray dots and speckles on light gray.
var SCHEMES = [
  { q1g: MUSTARD,  q1l: LEAF,
    q2g: MUSTARD,  q2f: [TEAL, PINK, ORANGE],
    q3g: SOFTPINK, q3f: ORANGE, q3l: LEAF,
    q4g: GRAY,     q4d: SPECK,  q4s: SPECK },
  { q1g: SOFTPINK, q1l: LEAF,
    q2g: TEAL,     q2f: [PINK, ORANGE, MUSTARD],
    q3g: MUSTARD,  q3f: PINK,   q3l: LEAF,
    q4g: SOFTPINK, q4d: ORANGE, q4s: SPECK },
  { q1g: GRAY,     q1l: LEAF,
    q2g: SOFTPINK, q2f: [TEAL, ORANGE, MUSTARD],
    q3g: TEAL,     q3f: ORANGE, q3l: MUSTARD,
    q4g: TEAL,     q4d: SOFTPINK, q4s: SPECK },
  { q1g: TEAL,     q1l: MUSTARD,
    q2g: GRAY,     q2f: [TEAL, PINK, ORANGE],
    q3g: GRAY,     q3f: TEAL,   q3l: LEAF,
    q4g: MUSTARD,  q4d: LEAF,   q4s: SPECK }
];
if (SCHEMES.length !== 4) throw new Error('Abstract Fruits needs 4 harvest schemes');

// Each quadrant cycles the schemes in its own order during
// its rotation window; every order starts at scheme 0, the
// authored opening.
var ORDERS = [
  [0, 1, 2, 3],
  [0, 2, 3, 1],
  [0, 3, 1, 2],
  [0, 1, 3, 2]
];
// Rotation windows within the 80s loop, per quadrant.
var ROT_WIN = [
  [20, 40],
  [40, 60],
  [60, 80],
  [0, 20]
];
// Motif pulse periods (divide 80) and fixed phases, per quadrant.
var PULSE_PERIOD = [8, 10, 16, 20];
var PULSE_PHASE = [0, 0.25, 0.5, 0.75];

var DW = 1280, DH = 900;
var QW = DW / 2, QH = DH / 2;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 80;
if (LOOP !== 80) throw new Error('Abstract Fruits loop must be 80s');
var TICK = 1 / 60;

// ---- small draw helpers ---------------------------------
function circ(x, y, r, fill) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function rect(x, y, w, h, fill) {
  ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
}
// One leaf: a pointed ellipse of length len along the local
// +y axis, drawn around (x, y) at rotation ang, with a vein
// in the ground colour.
function leaf(x, y, len, ang, col, veinCol) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(ang);
  var w = len * 0.40, h = len / 2;
  ctx.beginPath();
  ctx.moveTo(0, -h);
  ctx.quadraticCurveTo(w, -len * 0.08, 0, h);
  ctx.quadraticCurveTo(-w, -len * 0.08, 0, -h);
  ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, -h + 3); ctx.lineTo(0, h - 3);
  ctx.strokeStyle = veinCol; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}
// A leaf pair: two leaves growing out of one stem point,
// each leaf's centre offset along its own direction so the
// pair reads as a sprig, not a crossed star.
function leafPair(x, y, len, baseAng, splay, scale, col, veinCol) {
  var L = len * scale, off = L * 0.40;
  var a1 = baseAng - splay, a2 = baseAng + splay;
  leaf(x + Math.sin(a1) * off, y - Math.cos(a1) * off, L, a1, col, veinCol);
  leaf(x + Math.sin(a2) * off, y - Math.cos(a2) * off, L, a2, col, veinCol);
}
// A stylised pomegranate: round body, a crown of three
// points on top, seed dots inside in the ground colour.
function pomegranate(x, y, r, scale, col, seedCol, seedCount) {
  var rr = r * scale;
  // crown
  ctx.fillStyle = col;
  ctx.beginPath();
  var cw = rr * 0.50, ch = rr * 0.44, cy = y - rr * 0.98;
  ctx.moveTo(x - cw, cy + ch * 0.4);
  ctx.lineTo(x - cw * 0.55, cy - ch * 0.5);
  ctx.lineTo(x - cw * 0.18, cy + ch * 0.15);
  ctx.lineTo(x, cy - ch * 0.62);
  ctx.lineTo(x + cw * 0.18, cy + ch * 0.15);
  ctx.lineTo(x + cw * 0.55, cy - ch * 0.5);
  ctx.lineTo(x + cw, cy + ch * 0.4);
  ctx.closePath(); ctx.fill();
  circ(x, y, rr, col);
  // seeds: a fixed ring plus centre, count from the table
  var seeds = [[0, 0], [-0.38, -0.28], [0.38, -0.28], [-0.42, 0.3], [0.42, 0.3], [0, -0.52], [0, 0.55], [-0.16, 0.05], [0.16, 0.05]];
  var n = Math.min(seedCount, seeds.length);
  for (var i = 0; i < n; i++) {
    circ(x + seeds[i][0] * rr, y + seeds[i][1] * rr, Math.max(2.2, rr * 0.10), seedCol);
  }
}

// ---- motif tables ---------------------------------------
// Three authored motif sets per quadrant (the tap table).
// Q1: a leaf pair per 160x150 tile, orientation alternating
// by tile parity.
var Q1_SETS = [
  { len: 56, splay: 0.50, tilt: 0.55, dot: false },
  { len: 42, splay: 0.90, tilt: 0.95, dot: false },
  { len: 66, splay: 0.30, tilt: 0.30, dot: true }
];
// Q2: pomegranates on a 128x150 tile; fruit colour cycles
// through the scheme's three fruit colours by tile index.
var Q2_SETS = [
  { r: 36, small: false, seeds: 7 },
  { r: 28, small: true,  seeds: 5 },
  { r: 44, small: false, seeds: 9 }
];
// Q3: a pomegranate with a leaf pair beside it, 160x150 tile.
var Q3_SETS = [
  { r: 36, leafLen: 44, seeds: 7 },
  { r: 30, leafLen: 36, seeds: 5 },
  { r: 42, leafLen: 52, seeds: 9 }
];
// Q4: polka dots 2x2 per 160x150 tile plus a fixed speckle
// table per tile, generated once from a fixed seed.
var Q4_SETS = [
  { dotR: 11, seed: 4401 },
  { dotR: 8,  seed: 4402 },
  { dotR: 14, seed: 4403 }
];
function speckleTable(seed) {
  // Tiny fixed-seed LCG: deterministic data, built once.
  var pts = [], s = seed >>> 0;
  for (var i = 0; i < 14; i++) {
    s = (s * 1664525 + 1013904223) >>> 0;
    var px = 8 + (s % 1000) / 1000 * 144;
    s = (s * 1664525 + 1013904223) >>> 0;
    var py = 8 + (s % 1000) / 1000 * 134;
    pts.push([px, py]);
  }
  return pts;
}
var Q4_SPECKLES = [speckleTable(Q4_SETS[0].seed), speckleTable(Q4_SETS[1].seed), speckleTable(Q4_SETS[2].seed)];
var MOTIF_TABLES = 3;
if (Q1_SETS.length !== MOTIF_TABLES || Q2_SETS.length !== MOTIF_TABLES ||
    Q3_SETS.length !== MOTIF_TABLES || Q4_SETS.length !== MOTIF_TABLES) {
  throw new Error('Abstract Fruits motif tables must hold 3 sets each');
}
var motifIdx = 0;

// ---- time, scheme, pulse --------------------------------
var T = 2.0;
var lastNow = -1, acc = 0;
var SEARCH = (typeof location !== 'undefined' && location.search) || '';
if (SEARCH.indexOf('m1') >= 0) motifIdx = 1;
if (SEARCH.indexOf('m2') >= 0) motifIdx = 2;
if (SEARCH.indexOf('late') >= 0) T = 47.0;

function step() { T += TICK; }

function schemeFor(q, tau) {
  var win = ROT_WIN[q];
  if (tau >= win[0] && tau < win[1]) {
    var s = Math.floor((tau - win[0]) / 5);
    if (s > 3) s = 3;
    return SCHEMES[ORDERS[q][s]];
  }
  return SCHEMES[0];
}
function pulseFor(q, t) {
  return 1 + 0.02 * Math.sin(2 * Math.PI * (t / PULSE_PERIOD[q] + PULSE_PHASE[q]));
}

// ---- quadrant painters ----------------------------------
// Each painter fills its ground, clips to its rect, and
// draws its tile at every wrapped offset covering the
// quadrant (one tile of margin on each side), so motifs
// complete across tile borders inside the quadrant.
function paintQ1(qx, qy, sch, pulse) {
  rect(qx, qy, QW, QH, sch.q1g);
  ctx.save(); ctx.beginPath(); ctx.rect(qx, qy, QW, QH); ctx.clip();
  var set = Q1_SETS[motifIdx], TW = 160, TH = 150;
  for (var oy = qy - TH; oy < qy + QH; oy += TH) {
    for (var ox = qx - TW; ox < qx + QW; ox += TW) {
      var cx = ox + TW / 2, cy = oy + TH / 2;
      var parity = (((ox - qx) / TW + (oy - qy) / TH) % 2 + 2) % 2;
      var ang = set.tilt + (parity ? 0.55 : -0.55);
      leafPair(cx, cy, set.len, ang, set.splay, pulse, sch.q1l, sch.q1g);
      if (set.dot) circ(cx, cy, 5 * pulse, sch.q1l);
    }
  }
  ctx.restore();
}
function paintQ2(qx, qy, sch, pulse) {
  rect(qx, qy, QW, QH, sch.q2g);
  ctx.save(); ctx.beginPath(); ctx.rect(qx, qy, QW, QH); ctx.clip();
  var set = Q2_SETS[motifIdx], TW = 128, TH = 150;
  var col = 0;
  for (var oy = qy - TH; oy < qy + QH; oy += TH) {
    col = 0;
    for (var ox = qx - TW; ox < qx + QW; ox += TW) {
      var row = Math.round((oy - qy) / TH);
      var idx = ((col + row * 2) % 3 + 3) % 3;
      pomegranate(ox + TW / 2, oy + TH / 2, set.r, pulse, sch.q2f[idx], sch.q2g, set.seeds);
      if (set.small) {
        pomegranate(ox + TW - 24, oy + TH - 28, 16, pulse, sch.q2f[(idx + 1) % 3], sch.q2g, 5);
      }
      col++;
    }
  }
  ctx.restore();
}
function paintQ3(qx, qy, sch, pulse) {
  rect(qx, qy, QW, QH, sch.q3g);
  ctx.save(); ctx.beginPath(); ctx.rect(qx, qy, QW, QH); ctx.clip();
  var set = Q3_SETS[motifIdx], TW = 160, TH = 150;
  for (var oy = qy - TH; oy < qy + QH; oy += TH) {
    for (var ox = qx - TW; ox < qx + QW; ox += TW) {
      pomegranate(ox + 58, oy + TH / 2, set.r, pulse, sch.q3f, sch.q3g, set.seeds);
      leafPair(ox + 122, oy + TH / 2, set.leafLen, 0.5, 0.55, pulse, sch.q3l, sch.q3g);
    }
  }
  ctx.restore();
}
function paintQ4(qx, qy, sch, pulse) {
  rect(qx, qy, QW, QH, sch.q4g);
  ctx.save(); ctx.beginPath(); ctx.rect(qx, qy, QW, QH); ctx.clip();
  var set = Q4_SETS[motifIdx], TW = 160, TH = 150;
  var spk = Q4_SPECKLES[motifIdx];
  for (var oy = qy - TH; oy < qy + QH; oy += TH) {
    for (var ox = qx - TW; ox < qx + QW; ox += TW) {
      var dx = [40, 120, 40, 120], dy = [38, 38, 113, 113];
      for (var i = 0; i < 4; i++) circ(ox + dx[i], oy + dy[i], set.dotR * pulse, sch.q4d);
      for (var j = 0; j < spk.length; j++) circ(ox + spk[j][0], oy + spk[j][1], 2, sch.q4s);
    }
  }
  ctx.restore();
}

function draw() {
  var tau = ((T % LOOP) + LOOP) % LOOP;
  var s0 = schemeFor(0, tau), s1 = schemeFor(1, tau), s2 = schemeFor(2, tau), s3 = schemeFor(3, tau);
  paintQ1(0, 0, s0, pulseFor(0, T));
  paintQ2(QW, 0, s1, pulseFor(1, T));
  paintQ3(0, QH, s2, pulseFor(2, T));
  paintQ4(QW, QH, s3, pulseFor(3, T));
  // Cream dividers, exactly 2px in design space, drawn over
  // the quadrant joins.
  rect(QW - 1, 0, 2, DH, CREAM);
  rect(0, QH - 1, DW, 2, CREAM);
}

// ---- pointer: tap advances all four motif tables --------
function toDesign(ev) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cx = (ev.clientX !== undefined ? ev.clientX : (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 0)) - r.left;
  var cy = (ev.clientY !== undefined ? ev.clientY : (ev.touches && ev.touches[0] ? ev.touches[0].clientY : 0)) - r.top;
  return { x: (cx - OX) / S, y: (cy - OY) / S };
}
var downT = -1, downX = 0, downY = 0, lastAdvance = -1;
function onDown(ev) {
  var p = toDesign(ev);
  downX = p.x; downY = p.y;
  downT = (typeof ev.timeStamp === 'number') ? ev.timeStamp : -1;
  if (ev.preventDefault) ev.preventDefault();
}
function onUp(ev) {
  var now = (typeof ev.timeStamp === 'number') ? ev.timeStamp : -1;
  if (downT >= 0 && now >= 0 && now - downT < 280) {
    var p = toDesign(ev);
    var moved = Math.abs(p.x - downX) + Math.abs(p.y - downY);
    // Pointer and touch handlers can both report one tap;
    // the 80ms guard counts it once.
    if (moved < 14 && now - lastAdvance > 80) {
      motifIdx = (motifIdx + 1) % MOTIF_TABLES;
      lastAdvance = now;
    }
  }
  downT = -1;
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', function () { downT = -1; });
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('touchcancel', function () { downT = -1; });
}

// ---- sizing ------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = CREAM;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
