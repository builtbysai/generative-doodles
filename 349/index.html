<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.349 Murder in the Garden</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0D0A; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.349 Murder in the Garden (emibeebuzz).
// After Emi Bee's Dark Academia "Murder in the Garden"
// series: a dense lattice of poisonous oleander-like blooms
// on thorned stems over near-black, with one tiny key and
// one small bird hidden among the blooms and slow spores
// drifting over all of it. Moody, cozy-noir. Watch-only.
//
// Counts are the concept and are asserted in code:
// exactly 30 blooms, exactly 3 of them blood red (the
// one-in-ten rule made exact), exactly 40 spore dots,
// exactly ONE key and exactly ONE bird. The key and bird
// are fixed parametric paths at rule-of-thirds positions,
// drawn in the lattice's own inks so they hide the way
// the lattice hides them. Everything is flat colour and
// JS data drawn directly each frame on one canvas: no
// gradients, no shadowBlur, no filters, no offscreen
// canvas, no soft particles. All geometry comes from a
// fixed-seed table built once at load, so every render
// of the script is the same picture.
//
// Motion: one 24s seamless master loop shared by the
// lattice drift and the spore drift. The lattice slides
// on a slow sinusoid that completes whole cycles in 24s;
// each spore rides its own sinusoid with a whole number
// of cycles per loop, so frame 24s is pixel-identical
// to frame 0. Frame one is drawn at a CONSTANT phase
// (T_OFFSET seconds into the loop), never from a wall
// clock, so the thumbnail reproduces byte-identically;
// the live loop advances from that same anchor.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0B0D0A';
var GREEN  = '#2D4A2B';
var BONE   = '#E8DCC8';
var GOLD   = '#C9A227';
var BLOOD  = '#8C2F39';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var CYCLE = 24;               // seconds, seamless master loop

// ---- fixed seed table --------------------------------------
// One deterministic generator, seeded once. All layout
// data is built from it at load and never changes.
function makeRng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
var rng = makeRng(3490517);
function rr(a, b) { return a + rng() * (b - a); }

// ---- blooms: exactly 30, exactly 3 blood red ----------------
// A jittered 6 x 5 lattice of rosettes. Petal counts come
// from the seeded table; the blood-red set is fixed by
// index so the one-in-ten rule is exact, asserted below.
var RED_IDX = { 4: true, 14: true, 24: true };
var blooms = [];
(function buildBlooms() {
  var cols = 6, rows = 5, i, c, r;
  for (r = 0; r < rows; r++) {
    for (c = 0; c < cols; c++) {
      i = blooms.length;
      blooms.push({
        x: 108 + c * 213 + rr(-30, 30),
        y: 96 + r * 178 + rr(-26, 26),
        rad: rr(31, 53),
        petals: 5 + Math.floor(rng() * 4),       // 5..8
        rot: rng() * Math.PI * 2,
        red: !!RED_IDX[i]
      });
    }
  }
})();
if (blooms.length !== 30) throw new Error('Murder in the Garden needs exactly 30 blooms');
var redCount = 0, bi;
for (bi = 0; bi < blooms.length; bi++) if (blooms[bi].red) redCount++;
if (redCount !== 3) throw new Error('Murder in the Garden needs exactly 3 blood-red blooms');

// ---- stems: seeded-walk bezier vines -------------------------
// One winding vine per bloom column, walking from above
// the top edge to below the bottom edge, passing the
// column's blooms. Thorns and leaves sit at fixed walk
// points along each vine.
var vines = [];
(function buildVines() {
  var c, r, k;
  for (c = 0; c < 6; c++) {
    var pts = [], x = 108 + c * 213;
    for (k = 0; k <= 15; k++) {
      pts.push({ x: x + rr(-34, 34), y: -50 + k * 66 + rr(-9, 9) });
    }
    var marks = [];
    for (k = 2; k < 14; k++) {
      marks.push({ at: k, side: (k % 2 === 0) ? 1 : -1, leaf: rng() < 0.55 });
    }
    vines.push({ pts: pts, marks: marks });
  }
  // Four diagonal tendrils tying the columns together,
  // each ending in a small curl.
  var tendrils = [];
  for (k = 0; k < 4; k++) {
    var x0 = 140 + k * 300 + rr(-30, 30), y0 = rr(120, 700);
    tendrils.push({
      x0: x0, y0: y0,
      x1: x0 + rr(90, 150), y1: y0 + rr(-70, 70),
      x2: x0 + rr(200, 280), y2: y0 + rr(-40, 110),
      curl: rr(9, 15)
    });
  }
  vines.tendrils = tendrils;
  // Poison-gold berries at fixed seeded spots in the weave.
  var berries = [];
  for (k = 0; k < 14; k++) berries.push({ x: rr(50, 1230), y: rr(50, 850), r: rr(2.6, 4.2) });
  vines.berries = berries;
  // Small leafy sprigs filling the gaps between blooms, so
  // the lattice reads dense rather than scattered.
  var sprigs = [];
  for (k = 0; k < 26; k++) {
    sprigs.push({ x: rr(40, 1240), y: rr(40, 860), a: rng() * Math.PI * 2, s: rr(0.8, 1.3) });
  }
  vines.sprigs = sprigs;
})();

// ---- spores: exactly 40 flat bone dots -----------------------
var spores = [];
(function buildSpores() {
  for (var k = 0; k < 40; k++) {
    spores.push({
      x: rr(20, 1260), y: rr(20, 880),
      r: rr(1.6, 3.4),
      ax: rr(6, 16), ay: rr(5, 14),
      px: rng() * Math.PI * 2, py: rng() * Math.PI * 2,
      cx: rng() < 0.3 ? 2 : 1, cy: rng() < 0.3 ? 2 : 1   // whole cycles per loop
    });
  }
})();
if (spores.length !== 40) throw new Error('Murder in the Garden needs exactly 40 spores');

// ---- the hidden key and bird: exactly one each ---------------
// Fixed parametric paths at rule-of-thirds positions:
// key low-left third, bird high-right third. Drawn in the
// lattice's own inks (gold for the key, bone for the bird)
// so they hide among the accents and blooms.
var KEY = { x: DW / 3, y: DH * 2 / 3, s: 1 };
var BIRD = { x: DW * 2 / 3, y: DH / 3, s: 1 };

function drawKey() {
  ctx.save();
  ctx.translate(KEY.x, KEY.y);
  ctx.strokeStyle = GOLD;
  ctx.fillStyle = GOLD;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  // bow: a ring
  ctx.beginPath();
  ctx.arc(-13, 0, 9, 0, Math.PI * 2);
  ctx.stroke();
  // shaft
  ctx.beginPath();
  ctx.moveTo(-4, 0);
  ctx.lineTo(24, 0);
  ctx.stroke();
  // collar
  ctx.beginPath();
  ctx.moveTo(2, -5);
  ctx.lineTo(2, 5);
  ctx.stroke();
  // two teeth
  ctx.beginPath();
  ctx.moveTo(15, 0);
  ctx.lineTo(15, 9);
  ctx.moveTo(23, 0);
  ctx.lineTo(23, 7);
  ctx.stroke();
  ctx.restore();
}

function drawBird() {
  ctx.save();
  ctx.translate(BIRD.x, BIRD.y);
  ctx.fillStyle = BONE;
  // body and breast: one filled bezier silhouette
  ctx.beginPath();
  ctx.moveTo(-17, 4);
  ctx.bezierCurveTo(-16, -7, -6, -12, 2, -10);
  ctx.bezierCurveTo(10, -8, 14, -2, 13, 4);
  ctx.bezierCurveTo(12, 10, 4, 14, -3, 12);
  ctx.bezierCurveTo(-11, 10, -16, 9, -17, 4);
  ctx.fill();
  // head
  ctx.beginPath();
  ctx.arc(12, -9, 6.5, 0, Math.PI * 2);
  ctx.fill();
  // beak: small gold triangle
  ctx.fillStyle = GOLD;
  ctx.beginPath();
  ctx.moveTo(17.5, -11);
  ctx.lineTo(24, -8.5);
  ctx.lineTo(17.5, -6.5);
  ctx.closePath();
  ctx.fill();
  // tail flick
  ctx.fillStyle = BONE;
  ctx.beginPath();
  ctx.moveTo(-15, 6);
  ctx.lineTo(-26, 13);
  ctx.lineTo(-24, 6);
  ctx.lineTo(-27, 0);
  ctx.closePath();
  ctx.fill();
  // eye: a pinhole of ground in the head
  ctx.fillStyle = GROUND;
  ctx.beginPath();
  ctx.arc(13.5, -10, 1.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ---- drawing ---------------------------------------------------
function petalPath(x, y, ang, len, wid) {
  var ca = Math.cos(ang), sa = Math.sin(ang);
  var px = -sa, py = ca;
  var bx = x + ca * len * 0.16, by = y + sa * len * 0.16;
  var tx = x + ca * len, ty = y + sa * len;
  ctx.beginPath();
  ctx.moveTo(bx, by);
  ctx.quadraticCurveTo(
    x + ca * len * 0.5 + px * wid, y + sa * len * 0.5 + py * wid, tx, ty);
  ctx.quadraticCurveTo(
    x + ca * len * 0.5 - px * wid, y + sa * len * 0.5 - py * wid, bx, by);
  ctx.closePath();
  ctx.fill();
}

function drawBloom(b) {
  var col = b.red ? BLOOD : BONE;
  var i, a;
  // green calyx disc behind the petals
  ctx.fillStyle = GREEN;
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.rad * 0.74, 0, Math.PI * 2);
  ctx.fill();
  // outer petal layer
  ctx.fillStyle = col;
  for (i = 0; i < b.petals; i++) {
    a = b.rot + (i / b.petals) * Math.PI * 2;
    petalPath(b.x, b.y, a, b.rad, b.rad * 0.30);
  }
  // inner petal layer, half-step offset, shorter
  for (i = 0; i < b.petals; i++) {
    a = b.rot + ((i + 0.5) / b.petals) * Math.PI * 2;
    petalPath(b.x, b.y, a, b.rad * 0.55, b.rad * 0.20);
  }
  // poison-gold heart
  ctx.fillStyle = GOLD;
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.rad * 0.17, 0, Math.PI * 2);
  ctx.fill();
}

function drawVine(v) {
  var pts = v.pts, i;
  ctx.strokeStyle = GREEN;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (i = 1; i < pts.length - 1; i++) {
    var mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2;
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
  }
  ctx.stroke();
  // thorns and leaves at the walk marks
  for (i = 0; i < v.marks.length; i++) {
    var m = v.marks[i], p = pts[m.at];
    var q = pts[m.at + 1];
    var dx = q.x - p.x, dy = q.y - p.y, dl = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = -dy / dl * m.side, ny = dx / dl * m.side;
    ctx.fillStyle = GREEN;
    ctx.beginPath();
    ctx.moveTo(p.x + nx * 2, p.y + ny * 2);
    ctx.lineTo(p.x + nx * 13, p.y + ny * 13);
    ctx.lineTo(p.x + (dx / dl) * 6, p.y + (dy / dl) * 6);
    ctx.closePath();
    ctx.fill();
    if (m.leaf) {
      ctx.beginPath();
      ctx.ellipse(p.x - nx * 9, p.y - ny * 9, 10, 4.6,
        Math.atan2(-ny, -nx), 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function draw(t) {
  var ph = (t % CYCLE) / CYCLE;
  var ldx = 13 * Math.sin(Math.PI * 2 * ph);         // lattice drift,
  var ldy = 9 * Math.cos(Math.PI * 2 * ph);          // whole cycles in 24s
  ctx.save();
  ctx.translate(ldx, ldy);
  var i;
  for (i = 0; i < vines.length; i++) drawVine(vines[i]);
  // tendrils, thin, with a curl at the end
  ctx.strokeStyle = GREEN;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  for (i = 0; i < vines.tendrils.length; i++) {
    var td = vines.tendrils[i];
    ctx.beginPath();
    ctx.moveTo(td.x0, td.y0);
    ctx.quadraticCurveTo(td.x1, td.y1, td.x2, td.y2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(td.x2 + td.curl, td.y2, td.curl, Math.PI * 0.9, Math.PI * 2.6);
    ctx.stroke();
  }
  // gold berries in the weave
  ctx.fillStyle = GOLD;
  for (i = 0; i < vines.berries.length; i++) {
    var be = vines.berries[i];
    ctx.beginPath();
    ctx.arc(be.x, be.y, be.r, 0, Math.PI * 2);
    ctx.fill();
  }
  // leafy sprigs in the gaps: a short stem with five
  // small leaves, all in the lattice green
  ctx.strokeStyle = GREEN;
  ctx.fillStyle = GREEN;
  for (i = 0; i < vines.sprigs.length; i++) {
    var sg = vines.sprigs[i];
    var ca = Math.cos(sg.a), sa = Math.sin(sg.a);
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(sg.x - ca * 14 * sg.s, sg.y - sa * 14 * sg.s);
    ctx.lineTo(sg.x + ca * 14 * sg.s, sg.y + sa * 14 * sg.s);
    ctx.stroke();
    for (var j = 0; j < 5; j++) {
      var f = -1 + j * 0.5;
      var bx = sg.x + ca * f * 12 * sg.s, by = sg.y + sa * f * 12 * sg.s;
      var la = sg.a + (j % 2 === 0 ? 0.8 : -0.8);
      var lx = bx + Math.cos(la) * 7 * sg.s, ly = by + Math.sin(la) * 7 * sg.s;
      ctx.beginPath();
      ctx.ellipse(lx, ly, 9.5 * sg.s, 3.6 * sg.s, la, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  for (i = 0; i < blooms.length; i++) drawBloom(blooms[i]);
  drawKey();
  drawBird();
  ctx.restore();
  // spores over all of it, each on its own sinusoid
  ctx.fillStyle = BONE;
  for (i = 0; i < spores.length; i++) {
    var sp = spores[i];
    var sx = sp.x + sp.ax * Math.sin(Math.PI * 2 * sp.cx * ph + sp.px);
    var sy = sp.y + sp.ay * Math.cos(Math.PI * 2 * sp.cy * ph + sp.py);
    ctx.beginPath();
    ctx.arc(sx, sy, sp.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---- state -----------------------------------------------------
// Frame one starts developed: exactly 7s into the 24s
// cycle, lattice drifted off-centre and spores mid-drift.
// Drawn at this fixed phase, never from a wall clock.
var T_OFFSET = 7;

// ---- frame -------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // Full-bleed field composition: cover-fit on every
  // screen, phones included, ground in the piece's own
  // near-black so any letterbox edge reads as garden dark.
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  draw(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(T_OFFSET);
if (typeof requestAnimationFrame === 'function') {
  var loadMs = Date.now();
  var loop = function () {
    frame(T_OFFSET + (Date.now() - loadMs) / 1000);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
