<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>№9144 — The River</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #cap{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;
    padding:0 18px;font:10px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.2em;
    text-transform:uppercase;color:#ffe9b0;opacity:.42;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">№9144 — The River · “Only sin is loving you knowing you can’t have me”</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);

  let W, H, dpr, S, hw, R, bg, bloomA, bloomB, forms, motes, dust;
  let T = 0, last = 0, raf = 0;

  // soft gold glow sprite, shared by motes, dust and form halos
  const glow = (() => {
    const g = document.createElement('canvas'); g.width = g.height = 64;
    const x = g.getContext('2d'), r = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    r.addColorStop(0, 'rgba(255,240,200,1)');
    r.addColorStop(.12, 'rgba(255,225,150,.75)');
    r.addColorStop(.4, 'rgba(242,185,94,.22)');
    r.addColorStop(1, 'rgba(192,127,46,0)');
    x.fillStyle = r; x.fillRect(0, 0, 64, 64);
    return g;
  })();

  // the river's meandering centre line
  const cy = x => H * .5 + Math.sin(x / W * Math.PI * 1.4 + .5) * H * .045;

  // a flower made of light, pre-rendered once; petals lengthen toward the other bank
  function makeBloom(face, seed) {
    const size = Math.ceil(R * 2.8 * dpr), c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    x.scale(dpr, dpr); x.translate(R * 1.4, R * 1.4);
    x.globalCompositeOperation = 'lighter';
    const layers = [[9, 1, .34], [12, .8, .3], [15, .58, .26], [18, .38, .24]];
    layers.forEach(([n, len, w], li) => {
      for (let i = 0; i < n; i++) {
        const a = (i + (li % 2) * .5) / n * TAU + seed * (li + 1);
        const lean = 1 + .3 * Math.cos(a - face); // longer toward the other bank
        const L = R * len * lean * (.92 + .16 * Math.sin(i * 12.9 + seed * 7 + li));
        const pw = L * w;
        x.save(); x.rotate(a + Math.PI / 2);
        const g = x.createLinearGradient(0, 0, 0, -L);
        g.addColorStop(0, 'rgba(255,233,176,.5)');
        g.addColorStop(.45, 'rgba(242,185,94,.2)');
        g.addColorStop(1, 'rgba(192,127,46,0)');
        x.beginPath(); x.moveTo(0, 0);
        x.bezierCurveTo(pw, -L * .3, pw * .8, -L * .85, 0, -L);
        x.bezierCurveTo(-pw * .8, -L * .85, -pw, -L * .3, 0, 0);
        x.fillStyle = g; x.fill();
        x.strokeStyle = 'rgba(247,201,106,.16)'; x.lineWidth = 1; x.stroke();
        x.restore();
      }
    });
    const core = x.createRadialGradient(0, 0, 0, 0, 0, R * .34);
    core.addColorStop(0, 'rgba(255,246,220,1)');
    core.addColorStop(.35, 'rgba(255,225,150,.7)');
    core.addColorStop(1, 'rgba(242,185,94,0)');
    x.fillStyle = core; x.beginPath(); x.arc(0, 0, R * .34, 0, TAU); x.fill();
    for (let i = 0; i < 26; i++) { // stamen sparks
      const a = i / 26 * TAU + seed, d = R * (.2 + .12 * ((i * 7) % 5) / 4);
      x.fillStyle = 'rgba(255,233,176,.7)';
      x.beginPath(); x.arc(Math.cos(a) * d, Math.sin(a) * d, 1.3, 0, TAU); x.fill();
    }
    return c;
  }

  // static layer: night field, banks, and the river's luminous body
  function paintBackground() {
    bg = document.createElement('canvas'); bg.width = W * dpr; bg.height = H * dpr;
    const x = bg.getContext('2d'); x.scale(dpr, dpr);
    const sky = x.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#04050e'); sky.addColorStop(.5, '#0a0c1f'); sky.addColorStop(1, '#04050e');
    x.fillStyle = sky; x.fillRect(0, 0, W, H);
    x.globalCompositeOperation = 'lighter';
    // warm ground-glow on each bank
    forms.forEach(f => {
      const edge = f.y < H / 2 ? 0 : H;
      x.save(); x.translate(f.x, edge); x.scale(2.4, 1);
      const g = x.createRadialGradient(0, 0, 0, 0, 0, R * 1.5);
      g.addColorStop(0, 'rgba(192,127,46,.22)'); g.addColorStop(1, 'rgba(192,127,46,0)');
      x.fillStyle = g; x.beginPath(); x.arc(0, 0, R * 1.5, 0, TAU); x.fill(); x.restore();
    });
    // river body: stacked strokes from wide/faint to narrow/bright
    x.lineCap = 'round'; x.lineJoin = 'round';
    for (let k = 0; k < 10; k++) {
      const t = k / 9;
      x.lineWidth = hw * 2 * (1.7 - 1.45 * t);
      x.strokeStyle = `rgba(${t > .6 ? '247,201,106' : '192,127,46'},${.028 + .02 * t})`;
      x.beginPath();
      for (let px = -20; px <= W + 20; px += 8) px < 0 ? x.moveTo(px, cy(px)) : x.lineTo(px, cy(px));
      x.stroke();
    }
    // the river takes on each form's light where it passes
    forms.forEach(f => {
      x.save(); x.translate(f.x, cy(f.x)); x.scale(2, .55);
      const g = x.createRadialGradient(0, 0, 0, 0, 0, R * 1.2);
      g.addColorStop(0, 'rgba(255,225,150,.2)'); g.addColorStop(1, 'rgba(242,185,94,0)');
      x.fillStyle = g; x.beginPath(); x.arc(0, 0, R * 1.2, 0, TAU); x.fill(); x.restore();
    });
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    S = Math.max(.7, Math.min(W, H) / 600);
    hw = Math.min(H * .11, 90 * S);
    R = Math.min(W * .4, H * .19);

    const near = { x: W * .4, y: H - R * 1.05 }, far = { x: W * .6, y: R * 1.05 };
    near.face = Math.atan2(far.y - near.y, far.x - near.x);
    far.face = Math.atan2(near.y - far.y, near.x - far.x);
    near.ph = 0; far.ph = 2.1;
    forms = [near, far];
    near.sprite = makeBloom(near.face, 1.3); far.sprite = makeBloom(far.face, 4.1);

    motes = Array.from({ length: 50 }, () => {
      const v = rnd(-1, 1);
      return { u: Math.random() * (W + 80), v, r: rnd(1.3, 2.8) * S, ph: rnd(0, TAU),
               sp: rnd(32, 62) * (1 - .45 * v * v) * S };
    });
    dust = Array.from({ length: 48 }, () => {
      let y; const x = rnd(0, W);
      do y = rnd(0, H); while (Math.abs(y - cy(x)) < hw * 1.1);
      return { x, y, r: rnd(.5, 1.5) * S, ph: rnd(0, TAU), a: rnd(8, 22) * S, sp: rnd(.15, .4) };
    });
    paintBackground();
  }

  function motePos(m, t) {
    const x = (((m.u + m.sp * t) % (W + 80)) + W + 80) % (W + 80) - 40;
    const y = cy(x) + m.v * hw * .9 + Math.sin(x * .02 + m.ph + t * .8) * hw * .12;
    return [x, y];
  }

  // brightness of the river near each form (fed by that form's light)
  function feed(x) {
    let b = 0;
    for (const f of forms) b = Math.max(b, Math.exp(-((x - f.x) ** 2) / (2 * (R * 1.1) ** 2)));
    return .5 + .75 * b;
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.drawImage(bg, 0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    for (const d of dust) { // bank dust
      const x = d.x + Math.sin(T * d.sp + d.ph) * d.a, y = d.y + Math.cos(T * d.sp * .8 + d.ph) * d.a * .6;
      ctx.globalAlpha = .25 + .2 * Math.sin(T * .9 + d.ph);
      const g = d.r * 5; ctx.drawImage(glow, x - g, y - g, g * 2, g * 2);
    }

    for (const f of forms) { // still, pulsing blooms
      const p = Math.sin(T * .9 + f.ph), s = 1 + .035 * p;
      const h = R * 4.4;
      ctx.globalAlpha = .38 + .1 * p;
      ctx.drawImage(glow, f.x - h / 2, f.y - h / 2, h, h);
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(Math.sin(T * .25 + f.ph) * .03); ctx.scale(s, s);
      ctx.globalAlpha = .88 + .12 * p;
      ctx.drawImage(f.sprite, -R * 1.4, -R * 1.4, R * 2.8, R * 2.8);
      ctx.restore();
    }

    ctx.lineCap = 'round';
    for (const m of motes) { // flowing motes with fading trails
      const [x, y] = motePos(m, T), b = feed(x);
      let [px, py] = [x, y];
      for (let k = 1; k <= 7; k++) {
        const [qx, qy] = motePos(m, T - k * .09);
        if (Math.abs(qx - px) < 100) {
          ctx.globalAlpha = .55 * b * (1 - k / 8);
          ctx.strokeStyle = '#f7c96a'; ctx.lineWidth = m.r * (1.5 - k / 6);
          ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke();
        }
        px = qx; py = qy;
      }
      ctx.globalAlpha = Math.min(1, .75 * b * (.85 + .15 * Math.sin(T * 2 + m.ph)));
      const g = m.r * 6.5; ctx.drawImage(glow, x - g, y - g, g * 2, g * 2);
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
    draw(); raf = requestAnimationFrame(frame);
  }
  function start() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
  function stop() { cancelAnimationFrame(raf); raf = 0; }

  addEventListener('resize', () => { resize(); draw(); });
  addEventListener('blur', stop);
  addEventListener('focus', start);
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

  resize(); draw();
  if (!document.hidden) start();
})();
</script>
</body>
</html>
