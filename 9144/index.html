<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№9144 — The Veil</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0b0813; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }
  .cap {
    position:fixed; left:0; right:0; bottom:18px; text-align:center;
    color:rgba(232,225,240,.42); font:12px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing:.14em; text-transform:uppercase; pointer-events:none; user-select:none;
  }
  .cap b { color:rgba(245,205,130,.62); font-weight:600; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">№9144 — <b>The Veil</b> &nbsp;·&nbsp; “Only sin is loving you knowing you can’t have me”</div>
<script>
(function(){
  "use strict";
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1, S = 1;
  var CX = 0, CY = 0, VEIL = 0;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.min(W, H) / 700;
    CX = W * 0.5; CY = H * 0.5;
    VEIL = Math.min(W, H) * 0.26;
    buildLovers();
  }
  window.addEventListener('resize', resize);

  // ---- lovers: golden lights swirling around the veil ----
  var lovers = [];
  var veilMarks = [];   // bright dimples on the veil where a lover pressed {ang, alpha, born}
  var stars = [];
  var motes = [];       // golden dust drifting around the veil

  function buildLovers(){
    lovers = [];
    var n = 11;
    for (var i = 0; i < n; i++){
      var dir = (i % 2 === 0) ? 1 : -1;
      lovers.push({
        ang: (i / n) * 6.283 + Math.random() * 0.5,
        spd: dir * (0.06 + Math.random() * 0.06),
        orbitR: VEIL * (1.25 + Math.random() * 0.45),
        pressPh: Math.random() * 6.283,
        pressSpd: 0.20 + Math.random() * 0.14,
        r: (8 + Math.random() * 6) * S,
        hue: 40 + Math.random() * 8,
        trail: []
      });
    }
    stars = [];
    for (var s = 0; s < 80; s++){
      stars.push({ x: Math.random(), y: Math.random(), r: 0.4 + Math.random()*1.1, a: 0.10 + Math.random()*0.28, p: Math.random()*6.28 });
    }
  }

  function pressAmt(lv, t){
    var u = (Math.sin(t * lv.pressSpd + lv.pressPh) + 1) / 2;
    return Math.pow(u, 3);
  }

  function loverPos(lv, t){
    var p = pressAmt(lv, t);
    var r = lv.orbitR + (VEIL + lv.r * 0.8 - lv.orbitR) * p;
    var a = lv.ang + t * lv.spd;
    return { x: CX + Math.cos(a) * r, y: CY + Math.sin(a) * r, a: a, r: r, p: p };
  }

  function step(dt, t){
    for (var i = 0; i < lovers.length; i++){
      var lv = lovers[i];
      var pos = loverPos(lv, t);
      lv.trail.push({ x: pos.x, y: pos.y });
      if (lv.trail.length > 50) lv.trail.shift();
      var p = pos.p;
      if (p > 0.92 && !lv.marked){
        lv.marked = true;
        veilMarks.push({ ang: pos.a, alpha: 0.75, born: t });
      }
      if (p < 0.5) lv.marked = false;
    }
    for (var j = veilMarks.length - 1; j >= 0; j--){
      var mk = veilMarks[j];
      var age = t - mk.born;
      mk.alpha = 0.75 * Math.max(0, 1 - age / 22);
      if (mk.alpha <= 0.005) veilMarks.splice(j, 1);
    }
    // golden dust motes drifting around the veil
    if (Math.random() < 0.5){
      var a = Math.random() * 6.283;
      var rr = VEIL * (1.05 + Math.random() * 0.7);
      motes.push({ x: CX + Math.cos(a) * rr, y: CY + Math.sin(a) * rr,
                   vx: (Math.random()-0.5)*10*S, vy: (Math.random()-0.5)*10*S,
                   life: 0, max: 3 + Math.random()*3, r: (1 + Math.random()*1.8)*S });
    }
    for (var k = motes.length - 1; k >= 0; k--){
      var m = motes[k];
      m.life += dt; m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.life >= m.max) motes.splice(k, 1);
    }
    if (motes.length > 70) motes.splice(0, motes.length - 70);
  }

  function drawBloom(t){
    // the speaker: a large radiant bloom at the center, breathing slowly
    var pulse = 1 + 0.07 * Math.sin(t * 0.45);
    var R = 52 * S * pulse;
    // glow
    var gl = ctx.createRadialGradient(CX, CY, 0, CX, CY, R * 3.2);
    gl.addColorStop(0, 'rgba(250,205,130,0.42)');
    gl.addColorStop(0.5, 'rgba(240,180,100,0.12)');
    gl.addColorStop(1, 'rgba(240,180,100,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(CX, CY, R * 3.2, 0, 6.2832); ctx.fill();
    // outer petals (12, soft gold)
    ctx.save();
    ctx.translate(CX, CY);
    for (var k = 0; k < 12; k++){
      ctx.rotate(6.2832 / 12);
      var pr = R * (1 + 0.08 * Math.sin(t * 0.6 + k));
      ctx.fillStyle = 'rgba(240,185,105,0.85)';
      ctx.beginPath();
      ctx.ellipse(pr * 0.72, 0, pr * 0.72, pr * 0.36, 0, 0, 6.2832);
      ctx.fill();
    }
    ctx.restore();
    // inner petals (8, lighter)
    ctx.save();
    ctx.translate(CX, CY);
    for (var k2 = 0; k2 < 8; k2++){
      ctx.rotate(6.2832 / 8 + 0.2);
      ctx.fillStyle = 'rgba(250,210,140,0.95)';
      ctx.beginPath();
      ctx.ellipse(R * 0.45, 0, R * 0.45, R * 0.26, 0, 0, 6.2832);
      ctx.fill();
    }
    ctx.restore();
    // bright core
    var core = ctx.createRadialGradient(CX - R*0.15, CY - R*0.15, 0, CX, CY, R * 0.5);
    core.addColorStop(0, '#fff3cf');
    core.addColorStop(0.6, '#f7c96a');
    core.addColorStop(1, '#dd9a45');
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(CX, CY, R * 0.48, 0, 6.2832); ctx.fill();
  }

  function draw(now){
    var t = now;
    ctx.clearRect(0, 0, W, H);
    // dusk background, warm at the center
    var bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.8);
    bg.addColorStop(0, '#1a1328');
    bg.addColorStop(0.5, '#100c1d');
    bg.addColorStop(1, '#08060f');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // stars
    for (var i = 0; i < stars.length; i++){
      var st = stars[i];
      var tw = 0.7 + 0.3 * Math.sin(now * 0.6 + st.p);
      ctx.fillStyle = 'rgba(205,195,235,' + (st.a * tw) + ')';
      ctx.beginPath(); ctx.arc(st.x * W, st.y * H, st.r * S, 0, 6.2832); ctx.fill();
    }

    // the bloom (the speaker)
    drawBloom(t);

    // the veil: a soft luminous band of golden mist around the bloom
    // (several concentric soft strokes + a radial wash so it reads as a cloud, not a line)
    var vw = ctx.createRadialGradient(CX, CY, VEIL - 26*S, CX, CY, VEIL + 26*S);
    vw.addColorStop(0, 'rgba(245,205,130,0)');
    vw.addColorStop(0.5, 'rgba(245,205,130,0.16)');
    vw.addColorStop(1, 'rgba(245,205,130,0)');
    ctx.fillStyle = vw;
    ctx.beginPath(); ctx.arc(CX, CY, VEIL + 26*S, 0, 6.2832);
    ctx.arc(CX, CY, VEIL - 26*S, 0, 6.2832, true);
    ctx.fill();
    ctx.save();
    ctx.strokeStyle = 'rgba(245,210,140,0.30)';
    ctx.lineWidth = 2 * S;
    ctx.shadowColor = 'rgba(245,195,110,0.6)';
    ctx.shadowBlur = 12 * S;
    ctx.beginPath(); ctx.arc(CX, CY, VEIL, 0, 6.2832); ctx.stroke();
    ctx.restore();

    // veil marks: bright dimples where lovers pressed
    for (var m = 0; m < veilMarks.length; m++){
      var mk = veilMarks[m];
      var mx = CX + Math.cos(mk.ang) * VEIL, my = CY + Math.sin(mk.ang) * VEIL;
      var mg = ctx.createRadialGradient(mx, my, 0, mx, my, 34 * S);
      mg.addColorStop(0, 'rgba(255,225,160,' + mk.alpha + ')');
      mg.addColorStop(1, 'rgba(255,225,160,0)');
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(mx, my, 34 * S, 0, 6.2832); ctx.fill();
    }

    // golden dust motes
    for (var p = 0; p < motes.length; p++){
      var mt = motes[p];
      var u = mt.life / mt.max;
      var a = 0.5 * (u < 0.2 ? u / 0.2 : 1) * (1 - u);
      ctx.fillStyle = 'rgba(245,205,120,' + Math.max(0, a) + ')';
      ctx.beginPath(); ctx.arc(mt.x, mt.y, mt.r, 0, 6.2832); ctx.fill();
    }

    // lovers
    for (var k = 0; k < lovers.length; k++){
      var lv = lovers[k];
      var pos = loverPos(lv, t);
      if (lv.trail.length > 1){
        ctx.strokeStyle = 'rgba(240,190,110,0.14)';
        ctx.lineWidth = 1.2 * S;
        ctx.beginPath();
        ctx.moveTo(lv.trail[0].x, lv.trail[0].y);
        for (var q = 1; q < lv.trail.length; q++) ctx.lineTo(lv.trail[q].x, lv.trail[q].y);
        ctx.stroke();
      }
      var glowA = 0.22 + pos.p * 0.32;
      var gl = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, lv.r * 4);
      gl.addColorStop(0, 'rgba(240,185,95,' + glowA + ')');
      gl.addColorStop(0.55, 'rgba(230,160,70,0.09)');
      gl.addColorStop(1, 'rgba(230,160,70,0)');
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, lv.r * 4, 0, 6.2832); ctx.fill();
      // body: flatten and spread along the veil tangent when pressing
      var stretch = 1 + pos.p * 0.9;
      var tang = pos.a + Math.PI / 2;
      ctx.save();
      ctx.translate(pos.x, pos.y);
      ctx.rotate(tang);
      ctx.scale(stretch, 1 / Math.sqrt(stretch));
      var body = ctx.createRadialGradient(-lv.r*0.25, -lv.r*0.25, lv.r*0.1, 0, 0, lv.r);
      body.addColorStop(0, '#ffe9b0');
      body.addColorStop(0.45, '#f2b95e');
      body.addColorStop(1, '#c07f2e');
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.arc(0, 0, lv.r, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
  }

  // ---- loop ----
  resize();
  var last = performance.now();
  var running = true;
  function frame(nowMs){
    if (!running) return;
    var dt = Math.min(0.05, (nowMs - last) / 1000);
    last = nowMs;
    var t = nowMs / 1000;
    step(dt, t);
    draw(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ running = false; }
    else { running = true; last = performance.now(); requestAnimationFrame(frame); }
  });
  window.addEventListener('blur', function(){ running = false; });
  window.addEventListener('focus', function(){
    if (!running){ running = true; last = performance.now(); requestAnimationFrame(frame); }
  });
})();
</script>
</body>
</html>
