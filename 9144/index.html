<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>№9144 — The Horizon</title>
<style>
  html,body{margin:0;height:100%;background:#04060f;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #cap{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));padding:0 18px;text-align:center;
    font:10px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.22em;text-transform:uppercase;
    color:#ffe9b0;opacity:.38;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">№9144 — The Horizon · “Only sin is loving you knowing you can’t have me”</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const trail = document.createElement('canvas'), tx = trail.getContext('2d');   // accumulated light
  const R = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const GOLD = '242,185,94', PALE = '255,233,176', DEEP = '192,127,46';

  // soft radial sprites, drawn scaled
  function sprite(stops) {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    stops.forEach(s => r.addColorStop(s[0], s[1]));
    g.fillStyle = r; g.fillRect(0, 0, 64, 64); return c;
  }
  const lamp = sprite([[0, 'rgba(255,246,220,1)'], [.14, `rgba(${PALE},.95)`], [.38, `rgba(${GOLD},.32)`], [1, `rgba(${DEEP},0)`]]);
  const haloP = sprite([[0, `rgba(${PALE},1)`], [.35, `rgba(${PALE},.4)`], [1, `rgba(${PALE},0)`]]);
  const haloG = sprite([[0, `rgba(${GOLD},1)`], [.4, `rgba(${GOLD},.38)`], [1, `rgba(${DEEP},0)`]]);

  let W, H, dpr, u, hy, G, LAMBDA = 0.018;
  let walkers, stars, streaks, t, fadeT, raf = 0, last = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const c of [cv, trail]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    u = Math.max(1, Math.min(W, H) / 520) * (H > W ? 1.15 : 1);
    hy = Math.round(H * 0.58);           // horizon at 58%: a real field of ground below it
    G = H - hy;                          // ground depth in px: q = (y-hy)/G is 1 at the viewer, 0 at the horizon
    t = 0; fadeT = 0;
    stars = Array.from({ length: Math.round(W * H / 5500) }, () => ({
      x: R(0, W), y: R(0, hy), r: R(.4, 1.3) * u, ph: R(0, 6.3), z: R(.15, .5)
    }));
    streaks = [{ x: .5, hw: .85, hh: 5, y: 0, a: .95, p: PALE, f: 0 }];
    for (let i = 0; i < 9; i++) streaks.push({
      x: R(.1, .9), hw: R(.12, .4), hh: R(2, 8), y: R(-9, 11), a: R(.25, .6),
      p: i % 3 ? GOLD : PALE, f: R(.05, .18), ph: R(0, 6.3), dx: R(.03, .12)
    });
    walkers = Array.from({ length: W < H ? 9 : 11 }, () => spawn(R(0, 28)));
    for (let i = 0; i < 1500; i++) step(1 / 30, true);   // pre-walk so the field starts already woven
    walkers.forEach((w, i) => {                          // spread depths near to far: a few large in front, mid, a few small at the horizon
      const n = walkers.length, k = i < 3 ? R(.8, .98) : i < n - 3 ? R(.4, .68) : R(.12, .3);
      Object.assign(w, { g: k * G, mode: 'walk', fading: false, a: Math.max(w.a, .8), delay: 0, init: false, age: Math.min(w.age, 20), standAt: 0 });
      w.y = hy + w.g; w.x = W / 2 + w.X * k;
    });
  }

  function spawn(delay) {
    return {
      X: R(-.4, .4) * W, g: (Math.random() < .4 ? R(.8, 1) : R(.45, .8)) * G, x: 0, y: hy + G, a: 0, age: 0, delay, mode: 'walk', fading: false,
      life: R(55, 105), standAt: Math.random() < .7 ? R(14, 55) : 0, standFor: R(5, 11), turn: Math.random() < .5,
      p1: R(0, 6.3), p2: R(0, 6.3), ph: R(0, 6.3), amp: R(7, 15), px: 0, py: 0, init: false
    };
  }
  const scaleOf = w => clamp((w.y - hy) / G, .06, 1);   // perspective scale: 1 at the viewer, tiny at the horizon

  function update(w, dt, fast) {
    if (w.delay > 0) { w.delay -= dt; return; }
    w.age += dt;
    if (w.mode === 'walk' && w.standAt && w.age > w.standAt) { w.mode = 'stand'; w.until = w.age + w.standFor; w.standAt = 0; }
    if (w.mode === 'stand' && w.age > w.until) { if (w.turn) { w.mode = 'turn'; w.fading = true; } else w.mode = 'walk'; }
    if (w.age > w.life) w.fading = true;
    w.a += ((w.fading ? 0 : 1) - w.a) * dt * (w.fading ? .45 : .7);

    const q = clamp(w.g / G, 0, 1);                     // depth: 1 - q (0 = viewer, 1 = horizon)
    let vg, vX = w.amp * u * (Math.sin(.11 * w.age + w.p1) + .6 * Math.sin(.27 * w.age + w.p2));
    if (w.mode === 'walk') vg = -LAMBDA * w.g;          // walking: closing the gap ever more slowly, never arriving
    else if (w.mode === 'stand') { vg = 0; vX = 0; }    // standing: still, on the ground
    else { vg = .05 * (w.g + 30 * u); vX *= .5; }       // turning: back toward the viewer, into the dark
    const lim = W * .46;
    vX -= (w.X - clamp(w.X, -lim, lim)) * .8;
    w.X += vX * dt; w.g = clamp(w.g + vg * dt, 0, G * 1.15);
    w.ph += dt * (w.mode === 'stand' ? 1.3 : 6.5);
    const qq = clamp(w.g / G, 0, 1.15);
    w.x = W / 2 + w.X * qq; w.y = hy + w.g;             // perspective: lateral spread converges on the horizon

    if (w.init) {                                       // paint the trail on the ground behind them
      const sc = scaleOf(w), seg = Math.hypot(w.x - w.px, w.y - w.py);
      const lit = clamp(w.a, 0, 1) * (.3 + .7 * sc);
      tx.lineCap = 'round'; tx.beginPath(); tx.moveTo(w.px, w.py); tx.lineTo(w.x, w.y + .01);
      const wg = Math.max(2, 9 * u * sc), wp = Math.max(.8, 1.3 * u * sc);
      tx.strokeStyle = `rgba(${GOLD},${clamp(.1 * seg / wg, 0, .3) * lit})`; tx.lineWidth = wg; tx.stroke();   // evenly lit along length, any speed
      tx.strokeStyle = `rgba(${PALE},${clamp(.55 * seg / wp, 0, .5) * lit})`; tx.lineWidth = wp; tx.stroke();
    }
    w.px = w.x; w.py = w.y; w.init = true;
    if (w.fading && w.a < .02) Object.assign(w, spawn(R(1, 7)));
  }

  function fade() {                                     // let old light slowly die
    tx.setTransform(1, 0, 0, 1, 0, 0); tx.globalCompositeOperation = 'destination-out';
    tx.fillStyle = 'rgba(0,0,0,.08)'; tx.fillRect(0, 0, trail.width, trail.height);
    tx.globalCompositeOperation = 'source-over'; tx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function step(dt) {
    t += dt;
    tx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const w of walkers) update(w, dt);
    if ((fadeT += dt) >= 2) { fadeT -= 2; fade(); }
    for (const s of stars) { s.y -= 10 * u * s.z * .3 * dt; if (s.y < 0) { s.y += hy; s.x = R(0, W); } }
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    let g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#03050d'); g.addColorStop(hy / H * .55, '#0a1230'); g.addColorStop(hy / H, '#13203f');
    g.addColorStop(hy / H + .001, '#070a14'); g.addColorStop(1, '#04060c');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // the horizon breathes; now and then it seems to look back
    const gaze = Math.pow(Math.max(0, Math.sin(t * .17)), 8);
    const b = .78 + .12 * Math.sin(t * .55) + .07 * Math.sin(t * 1.7 + 1) + .2 * gaze;

    ctx.globalCompositeOperation = 'lighter';
    for (const s of stars) {                             // stars, fading toward both edges of the sky
      const e = Math.min(s.y / (hy * .12), (hy - s.y) / (hy * .3), 1);
      if (e <= 0) continue;
      ctx.globalAlpha = e * (.35 + .35 * Math.sin(t * .9 + s.ph)) ;
      ctx.drawImage(haloP, s.x - s.r * 2, s.y - s.r * 2, s.r * 4, s.r * 4);
    }
    ctx.globalAlpha = 1;

    const L = H * .6;                                    // dusk glow rising off the horizon
    g = ctx.createLinearGradient(0, hy, 0, hy - L);
    g.addColorStop(0, `rgba(${GOLD},${.4 * b})`); g.addColorStop(.18, `rgba(${DEEP},${.2 * b})`);
    g.addColorStop(.5, `rgba(${DEEP},${.05 * b})`); g.addColorStop(1, `rgba(${DEEP},0)`);
    ctx.fillStyle = g; ctx.fillRect(0, hy - L, W, L);

    ctx.drawImage(trail, 0, 0, W, H);                    // the map of devotion

    ctx.globalCompositeOperation = 'source-over';        // keep the top of the sky deep
    g = ctx.createLinearGradient(0, 0, 0, H * .2);
    g.addColorStop(0, 'rgba(3,5,13,.9)'); g.addColorStop(1, 'rgba(3,5,13,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * .2);
    ctx.globalCompositeOperation = 'lighter';

    // ground below the horizon, glowing faintly
    g = ctx.createLinearGradient(0, hy, 0, H);
    g.addColorStop(0, `rgba(${GOLD},${.3 * b})`); g.addColorStop(.3, `rgba(${DEEP},${.08 * b})`); g.addColorStop(1, `rgba(${DEEP},0)`);
    ctx.fillStyle = g; ctx.fillRect(0, hy, W, H - hy);
    for (let k = 1; k <= 9; k++) {                       // shimmering reflections
      const y = hy + u * (4 + k * k * 1.1); if (y > H) break;
      const w = W * (.55 - k * .035) * (.8 + .2 * Math.sin(t * .7 + k * 2.1));
      ctx.globalAlpha = .22 * b / Math.sqrt(k);
      ctx.drawImage(haloG, W / 2 - w, y - u * 1.2, w * 2, u * 2.4);
    }

    // the horizon itself: soft layered streaks of light, never a hard line
    for (const s of streaks) {
      const x = W * (s.x + (s.dx ? Math.sin(t * s.f + s.ph) * s.dx : 0));
      const pulse = s.dx ? .65 + .35 * Math.sin(t * s.f * 4 + s.ph) : 1;
      ctx.globalAlpha = clamp(s.a * pulse * b, 0, 1);
      ctx.drawImage(s.p === PALE ? haloP : haloG, x - s.hw * W, hy + s.y * u - s.hh * u, s.hw * W * 2, s.hh * u * 2);
    }
    for (const w of walkers) {                           // it warms toward whoever is nearest
      if (w.a < .02) continue;
      const near = (1 - clamp((w.y - hy) / G, 0, 1)) ** 2;   // the horizon warms toward whoever is farthest along
      ctx.globalAlpha = .28 * w.a * near * b;
      ctx.drawImage(haloP, w.x - 90 * u, hy - 20 * u, 180 * u, 40 * u);
    }

    for (const w of walkers) {                           // the walkers: small warm lamps
      if (w.a < .01 || w.delay > 0) continue;
      const sc = scaleOf(w), br = .35 + .65 * sc, r = 15 * u * (.1 + .9 * sc) * (.94 + .06 * Math.sin(t * 3.1 + w.p1));
      const x = w.x + Math.sin(w.ph * .5) * 1.1 * u * (.2 + .8 * sc), y = w.y - Math.abs(Math.sin(w.ph)) * (w.mode === 'stand' ? .5 : 1.8) * u * (.15 + .85 * sc) * 1.4;
      ctx.globalAlpha = w.a * .8 * br; ctx.drawImage(haloG, x - r * 2, y - r * 2, r * 4, r * 4);
      ctx.globalAlpha = w.a * br; ctx.drawImage(lamp, x - r, y - r, r * 2, r * 2);
      ctx.globalAlpha = w.a * br; ctx.drawImage(lamp, x - r * .3, y - r * .3, r * .6, r * .6);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

  function frame(ts) {
    const dt = Math.min(.05, (ts - last) / 1000); last = ts;
    step(dt); render(); raf = requestAnimationFrame(frame);
  }
  const start = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } };
  const stop = () => { cancelAnimationFrame(raf); raf = 0; };

  addEventListener('resize', () => { resize(); render(); });
  addEventListener('blur', stop); addEventListener('focus', start);
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
  resize(); start();
})();
</script>
</body>
</html>
