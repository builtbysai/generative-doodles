<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№9144 — Untouchable</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0812; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }
  .cap {
    position:fixed; left:0; right:0; bottom:18px; text-align:center;
    color:rgba(232,225,240,.42); font:12px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing:.14em; text-transform:uppercase; pointer-events:none; user-select:none;
  }
  .cap b { color:rgba(200,215,255,.62); font-weight:600; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">№9144 — <b>Untouchable</b> &nbsp;·&nbsp; “Only sin is loving you knowing you can’t have me”</div>
<script>
(function(){
  "use strict";
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1, S = 1;
  var CX = 0, CY = 0, RING = 0;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.min(W, H) / 700;
    CX = W * 0.5; CY = H * 0.5;
    RING = Math.min(W, H) * 0.24;
    buildLovers();
  }
  window.addEventListener('resize', resize);

  // ---- lovers: golden lights orbiting the center, pressing against the ring ----
  var lovers = [];
  var ringMarks = [];   // bright spots on the ring where a lover pressed {ang, alpha, born}
  var stars = [];

  function buildLovers(){
    lovers = [];
    var n = 8;
    for (var i = 0; i < n; i++){
      var dir = (i % 2 === 0) ? 1 : -1;
      lovers.push({
        ang: (i / n) * 6.283 + Math.random() * 0.6,
        spd: dir * (0.05 + Math.random() * 0.05),   // rad/s, slow
        orbitR: RING * (1.22 + Math.random() * 0.30),
        pressPh: Math.random() * 6.283,              // press cycle phase
        pressSpd: 0.22 + Math.random() * 0.12,       // rad/s
        r: (10 + Math.random() * 6) * S,
        hue: 40 + Math.random() * 8,
        trail: []
      });
    }
    stars = [];
    for (var s = 0; s < 80; s++){
      stars.push({ x: Math.random(), y: Math.random(), r: 0.4 + Math.random()*1.1, a: 0.10 + Math.random()*0.28, p: Math.random()*6.28 });
    }
  }

  // press amount: 0 = out at orbit, 1 = pressed against the ring
  function pressAmt(lv, t){
    // smooth periodic press: rises, holds, releases
    var u = (Math.sin(t * lv.pressSpd + lv.pressPh) + 1) / 2; // 0..1
    // sharpen: press only near the top of the sine
    var p = Math.pow(u, 3);
    return p;
  }

  function loverPos(lv, t){
    var p = pressAmt(lv, t);
    var r = lv.orbitR + (RING + lv.r * 0.9 - lv.orbitR) * p;
    var a = lv.ang + t * lv.spd;
    return { x: CX + Math.cos(a) * r, y: CY + Math.sin(a) * r, a: a, r: r, p: p };
  }

  function step(dt, t){
    for (var i = 0; i < lovers.length; i++){
      var lv = lovers[i];
      var pos = loverPos(lv, t);
      // trail
      lv.trail.push({ x: pos.x, y: pos.y });
      if (lv.trail.length > 60) lv.trail.shift();
      // when a press peaks, leave a bright mark on the ring
      var p = pos.p;
      if (p > 0.92 && !lv.marked){
        lv.marked = true;
        ringMarks.push({ ang: pos.a, alpha: 0.7, born: t });
      }
      if (p < 0.5) lv.marked = false;
    }
    // ring marks fade over ~25s
    for (var j = ringMarks.length - 1; j >= 0; j--){
      var mk = ringMarks[j];
      var age = t - mk.born;
      mk.alpha = 0.7 * Math.max(0, 1 - age / 25);
      if (mk.alpha <= 0.005) ringMarks.splice(j, 1);
    }
  }

  function draw(now){
    var t = now;
    ctx.clearRect(0, 0, W, H);
    // background
    var bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.75);
    bg.addColorStop(0, '#151126');
    bg.addColorStop(0.55, '#0d0a18');
    bg.addColorStop(1, '#08060f');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // stars
    for (var i = 0; i < stars.length; i++){
      var st = stars[i];
      var tw = 0.7 + 0.3 * Math.sin(now * 0.6 + st.p);
      ctx.fillStyle = 'rgba(200,190,230,' + (st.a * tw) + ')';
      ctx.beginPath(); ctx.arc(st.x * W, st.y * H, st.r * S, 0, 6.2832); ctx.fill();
    }

    var rM = 30 * S;
    var breathe = 1 + 0.04 * Math.sin(now * 0.4);

    // ring marks (bright spots where lovers pressed)
    for (var m = 0; m < ringMarks.length; m++){
      var mk = ringMarks[m];
      var mx = CX + Math.cos(mk.ang) * RING, my = CY + Math.sin(mk.ang) * RING;
      var mg = ctx.createRadialGradient(mx, my, 0, mx, my, 32 * S);
      mg.addColorStop(0, 'rgba(245,205,120,' + mk.alpha + ')');
      mg.addColorStop(1, 'rgba(245,205,120,0)');
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(mx, my, 32 * S, 0, 6.2832); ctx.fill();
    }

    // the ring: a soft luminous boundary
    ctx.save();
    ctx.strokeStyle = 'rgba(190,205,255,0.28)';
    ctx.lineWidth = 1.4 * S;
    ctx.shadowColor = 'rgba(170,190,255,0.55)';
    ctx.shadowBlur = 10 * S;
    ctx.beginPath(); ctx.arc(CX, CY, RING, 0, 6.2832); ctx.stroke();
    ctx.restore();
    // inner faint second ring (the boundary has depth)
    ctx.strokeStyle = 'rgba(190,205,255,0.10)';
    ctx.lineWidth = 1 * S;
    ctx.beginPath(); ctx.arc(CX, CY, RING * 0.94, 0, 6.2832); ctx.stroke();

    // center: the speaker, radiant and serene
    var rm = rM * breathe;
    var halo = ctx.createRadialGradient(CX, CY, 0, CX, CY, rm * 5);
    halo.addColorStop(0, 'rgba(200,215,255,0.34)');
    halo.addColorStop(0.5, 'rgba(175,195,250,0.09)');
    halo.addColorStop(1, 'rgba(175,195,250,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(CX, CY, rm * 5, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#e9effd';
    ctx.beginPath(); ctx.arc(CX, CY, rm, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(CX - rm*0.3, CY - rm*0.3, rm*0.45, 0, 6.2832); ctx.fill();
    ctx.fillStyle = 'rgba(180,195,230,0.35)';
    ctx.beginPath(); ctx.arc(CX + rm*0.35, CY + rm*0.2, rm*0.16, 0, 6.2832); ctx.fill();

    // lovers
    for (var k = 0; k < lovers.length; k++){
      var lv = lovers[k];
      var pos = loverPos(lv, t);
      // trail (faint)
      if (lv.trail.length > 1){
        ctx.strokeStyle = 'rgba(240,190,110,0.16)';
        ctx.lineWidth = 1.2 * S;
        ctx.beginPath();
        ctx.moveTo(lv.trail[0].x, lv.trail[0].y);
        for (var q = 1; q < lv.trail.length; q++) ctx.lineTo(lv.trail[q].x, lv.trail[q].y);
        ctx.stroke();
      }
      // glow
      var glowA = 0.22 + pos.p * 0.30;
      var gl = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, lv.r * 4);
      gl.addColorStop(0, 'rgba(240,185,95,' + glowA + ')');
      gl.addColorStop(0.55, 'rgba(230,160,70,0.09)');
      gl.addColorStop(1, 'rgba(230,160,70,0)');
      ctx.fillStyle = gl;
      ctx.beginPath(); ctx.arc(pos.x, pos.y, lv.r * 4, 0, 6.2832); ctx.fill();
      // body: when pressed, flatten and spread along the ring tangent
      var stretch = 1 + pos.p * 0.9;   // elongate along tangent
      var tang = pos.a + Math.PI / 2;  // tangent direction
      ctx.save();
      ctx.translate(pos.x, pos.y);
      ctx.rotate(tang);
      ctx.scale(stretch, 1 / Math.sqrt(stretch));
      var body = ctx.createRadialGradient(-lv.r*0.25, -lv.r*0.25, lv.r*0.1, 0, 0, lv.r);
      body.addColorStop(0, '#ffe9b0');
      body.addColorStop(0.45, '#f2b95e');
      body.addColorStop(1, '#c07f2e');
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.arc(0, 0, lv.r, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
  }

  // ---- loop ----
  resize();
  var last = performance.now();
  var running = true;
  function frame(nowMs){
    if (!running) return;
    var dt = Math.min(0.05, (nowMs - last) / 1000);
    last = nowMs;
    var t = nowMs / 1000;
    step(dt, t);
    draw(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ running = false; }
    else { running = true; last = performance.now(); requestAnimationFrame(frame); }
  });
  window.addEventListener('blur', function(){ running = false; });
  window.addEventListener('focus', function(){
    if (!running){ running = true; last = performance.now(); requestAnimationFrame(frame); }
  });
})();
</script>
</body>
</html>
