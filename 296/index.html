<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.296 Squiggle and Dot</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F5B301; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.296 Squiggle and Dot (Ruby Waters).
// Pure pattern study: top field cadmium yellow filled with
// black squiggle marks, bottom field white filled with orange
// polka dots, split by a hard wavy seam near the middle. The
// seam breathes on a 40 second loop, squiggles crawl slowly,
// dots pulse in traveling waves down the rows. Dragging pushes
// the seam; it deforms around the pointer and springs back.
// DATA-ONLY: no offscreen canvas, no masks. The seam is a
// spring control-point polyline; each frame both fields are
// drawn as path clips from the current seam curve.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var YELLOW = '#F5B301', INK = '#141414', WHITE = '#FFFFFF', ORANGE = '#E8722A';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var T = 9.0, lastNow = -1, acc = 0; // frame one mid-breath, dot wave mid-travel
var TICK = 1 / 60;
var LOOP = 40;

function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }

// ---- seam: spring control points across the width ----------------
// Points run past both edges so the cover-fit crop never shows
// an end. Each point springs toward its breathing target and is
// coupled to its neighbours, so a drag dent travels and settles.
var SN = 19;
var seamX = [], seamY = [], seamV = [];
for (var si = 0; si < SN; si++) seamX.push(-80 + si * (1440 / (SN - 1)));
function seamTarget(i, t) {
  var ph = t / LOOP * Math.PI * 2;
  var x = seamX[i];
  return 450 + Math.sin(ph + x * 0.0028) * 52 + Math.sin(ph * 2 + x * 0.0061 + 1.3) * 20;
}
for (var sj = 0; sj < SN; sj++) { seamY.push(seamTarget(sj, T)); seamV.push(0); }
function seamYAt(x) {
  // linear interpolation of the seam curve at design x
  var f = (x + 80) / 1440 * (SN - 1);
  var i = clamp(Math.floor(f), 0, SN - 2);
  var u = clamp(f - i, 0, 1);
  return seamY[i] * (1 - u) + seamY[i + 1] * u;
}

// ---- squiggles: fixed-count random-walk strokes (top field) ------
// Each squiggle is point data relative to an anchor. Anchors
// crawl slowly on seeded wander paths whose periods divide the
// 40 second loop, so the loop is seamless. Squiggles are drawn
// clipped to the top path, so they re-anchor to the moving seam
// field every frame.
var squiggles = [];
(function () {
  var r = rng(296771);
  for (var i = 0; i < 150; i++) {
    var ax = 16 + r() * 1248;
    var ay = 22 + r() * 396;
    var pts = [[0, 0]];
    var x = 0, y = 0, a = r() * Math.PI * 2;
    var steps = 7 + Math.floor(r() * 5);
    for (var k = 0; k < steps; k++) {
      a += (r() - 0.5) * 0.85;
      var len = 10 + r() * 7;
      x += Math.cos(a) * len; y += Math.sin(a) * len;
      pts.push([x, y]);
    }
    squiggles.push({
      ax: ax, ay: ay, pts: pts,
      ph1: r() * Math.PI * 2, ph2: r() * Math.PI * 2,
      per: [40, 20, 10][Math.floor(r() * 3)],
      amp: 16 + r() * 22, lw: 5.5 + r() * 1.6
    });
  }
})();

// ---- dots: fixed grid (bottom field) ------------------------------
// Rows of orange dots, alternate rows offset by half a step.
// Scale pulses in a wave traveling down the rows (8 second
// period, five cycles per loop, so the seam stays exact).
var dotRows = [];
(function () {
  var r = rng(296331);
  var rowGap = 62, colGap = 68;
  for (var row = 0; row * rowGap < DH + 80; row++) {
    var y = 486 + row * rowGap;
    if (y > DH + 40) break;
    var off = (row % 2) * colGap * 0.5;
    var dots = [];
    for (var cx = -20 + off; cx < DW + 40; cx += colGap) {
      dots.push({ x: cx + (r() - 0.5) * 5, y: y + (r() - 0.5) * 5, r: 12.5 + r() * 3.5, ph: r() * 0.6 });
    }
    dotRows.push(dots);
  }
})();

// ---- interaction: drag pushes the seam -----------------------------
var dragging = false, dragPt = null;
function stepSim() {
  T += TICK;
  for (var i = 0; i < SN; i++) {
    var target = seamTarget(i, T);
    if (dragging && dragPt) {
      var dx = seamX[i] - dragPt[0];
      var w = Math.exp(-(dx * dx) / (230 * 230));
      target = target * (1 - w) + dragPt[1] * w;
    }
    var nbr = 0, cnt = 0;
    if (i > 0) { nbr += seamY[i - 1]; cnt++; }
    if (i < SN - 1) { nbr += seamY[i + 1]; cnt++; }
    nbr /= cnt;
    seamV[i] += ((target - seamY[i]) * 26 + (nbr - seamY[i]) * 30 - seamV[i] * 7.5) * TICK;
    seamY[i] += seamV[i] * TICK * 3.2;
  }
}

// ---- drawing ---------------------------------------------------------
function seamPathTop() {
  ctx.beginPath();
  ctx.moveTo(-90, -90);
  ctx.lineTo(DW + 90, -90);
  ctx.lineTo(seamX[SN - 1], seamY[SN - 1]);
  for (var i = SN - 2; i >= 0; i--) ctx.lineTo(seamX[i], seamY[i]);
  ctx.closePath();
}
function seamPathBottom() {
  ctx.beginPath();
  ctx.moveTo(seamX[0], seamY[0]);
  for (var i = 1; i < SN; i++) ctx.lineTo(seamX[i], seamY[i]);
  ctx.lineTo(DW + 90, DH + 90);
  ctx.lineTo(-90, DH + 90);
  ctx.closePath();
}
function draw() {
  var ph = T / LOOP * Math.PI * 2;
  // bottom field first: white with pulsing orange dots
  seamPathBottom();
  ctx.fillStyle = WHITE;
  ctx.fill();
  ctx.save();
  seamPathBottom();
  ctx.clip();
  ctx.fillStyle = ORANGE;
  for (var ri = 0; ri < dotRows.length; ri++) {
    var rowDots = dotRows[ri];
    for (var di = 0; di < rowDots.length; di++) {
      var d = rowDots[di];
      var pulse = 1 + 0.34 * Math.sin(ph * 5 - ri * 0.85 + d.ph);
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r * pulse, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
  // top field: yellow with crawling black squiggles
  seamPathTop();
  ctx.fillStyle = YELLOW;
  ctx.fill();
  ctx.save();
  seamPathTop();
  ctx.clip();
  ctx.strokeStyle = INK;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (var i = 0; i < squiggles.length; i++) {
    var q = squiggles[i];
    var wph = T / q.per * Math.PI * 2;
    var ox = Math.sin(wph + q.ph1) * q.amp + Math.sin(ph + q.ph2) * 6;
    var oy = Math.cos(wph * 1 + q.ph2) * q.amp * 0.6;
    // keep the crawl inside the top field relative to the seam
    var maxY = seamYAt(q.ax) - 26;
    var ay = q.ay + oy;
    if (ay > maxY) ay = maxY;
    ctx.lineWidth = q.lw;
    ctx.beginPath();
    for (var j = 0; j < q.pts.length; j++) {
      var px = q.ax + ox + q.pts[j][0], py = ay + q.pts[j][1];
      if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  ctx.restore();
  // the hard seam edge itself: a crisp black line, no blend
  ctx.beginPath();
  ctx.moveTo(seamX[0], seamY[0]);
  for (var s2 = 1; s2 < SN; s2++) ctx.lineTo(seamX[s2], seamY[s2]);
  ctx.strokeStyle = INK;
  ctx.lineWidth = 4;
  ctx.stroke();
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function toDesign(e) {
  var rect = canvas.getBoundingClientRect();
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
canvas.addEventListener('pointerdown', function (e) {
  dragPt = toDesign(e);
  dragging = true;
  if (canvas.setPointerCapture && e.pointerId !== undefined) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  dragPt = toDesign(e);
});
canvas.addEventListener('pointerup', function () { dragging = false; dragPt = null; });
canvas.addEventListener('pointercancel', function () { dragging = false; dragPt = null; });

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = YELLOW;
  ctx.fillRect(0, 0, W, H);
  // cover-fit: full-bleed field, crop the overflow
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { stepSim(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
