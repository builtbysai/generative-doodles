<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№870 The Flash Cadence</title>
<style>
  html, body { margin: 0; padding: 0; background: #050505; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №870 The Flash Cadence, ZW8 / PP1270, study #263 zach-wolfe.
  // A dark party room. Nothing is visible except when the flash
  // fires: then the room strobes into hard light, faces mid-laugh
  // mid-dance frozen mid-gesture, then falls back to dark. The
  // flash is the light source and the aesthetic. Tight crops on
  // faces and gestures at the flash moment; darkness otherwise.
  // Watch-only; the cadence is the piece, and triggering the
  // flash by hand would make it a toy. Visual-only: no WebAudio,
  // no autoplay audio, per the Franke rule.
  var GROUND = '#050505'; // page ground, black room

  // Fixed-phase first frame: FIRST_T = 0 s into a 20 s cycle.
  // Four flashes per cycle, one every 5 s, each with a 0.8 s lit
  // hold: 0.05 s attack, 0.6 s full hold, 0.15 s decay, then dark.
  // The flash fires 0.35 s before each 5 s slot boundary, so at
  // FIRST_T the first flash is mid-hold at full light and the
  // first frame shows the frozen faces. Flash rate is 0.2 Hz,
  // far below the 14 Hz safety limit by construction; there is
  // no rapid on/off flicker anywhere in the piece. All motion is
  // a function of cycle phase, so the frame at FIRST_T + 20
  // equals the frame at FIRST_T.
  var FIRST_T = 0;
  var CYCLE = 20;
  var FLASH_EVERY = 5;
  var FLASH_HOLD = 0.8;
  var FLASH_LEAD = 0.35; // flash fires this far before the slot boundary
  var SEED = 870;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }
  function circle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }
  function ellipse(x, y, rx, ry) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  }

  // ---- Palette ------------------------------------------------------
  var SKINS = [
    [232, 185, 138], [201, 141, 95], [138, 90, 59], [240, 200, 160]
  ];
  var PARTY = [
    [210, 60, 46], [31, 138, 138], [242, 194, 48],
    [201, 58, 122], [74, 158, 74], [46, 95, 163]
  ];
  var HAIRS = [
    [30, 20, 14], [58, 38, 20], [12, 12, 12], [96, 58, 28]
  ];
  var WHITE = [240, 238, 232];
  var INK = [16, 14, 12];

  // ---- Fixed party tables: four flashes, three figures each --------
  // Each figure is a tight crop: a head large in frame, a raised
  // arm or a hand mid-gesture, a torso in a party color. Heads
  // sit partly outside the frame edge on purpose.
  var figRng = mulberry32(SEED * 31 + 7);
  var FLASHES = [];
  var fi, fj;
  for (fi = 0; fi < 4; fi++) {
    var figs = [];
    for (fj = 0; fj < 3; fj++) {
      figs.push({
        hx: 0.12 + figRng() * 0.76,           // head center, frame fractions
        hy: 0.16 + figRng() * 0.34,
        hr: 0.10 + figRng() * 0.075,          // head radius, of min(frame)
        skin: SKINS[Math.floor(figRng() * SKINS.length)],
        shirt: PARTY[Math.floor(figRng() * PARTY.length)],
        hair: HAIRS[Math.floor(figRng() * HAIRS.length)],
        tilt: (figRng() - 0.5) * 0.5,         // head tilt, radians
        armA: -Math.PI * (0.25 + figRng() * 0.55), // raised arm angle
        armLen: 0.16 + figRng() * 0.12,
        armSide: figRng() > 0.5 ? 1 : -1,
        drift: (figRng() - 0.5) * 0.10,       // dark-phase drift, x fraction
        driftY: (figRng() - 0.5) * 0.05,
        blurX: (figRng() - 0.5) * 0.03,       // motion-blur ghost offset
        blurY: (figRng() - 0.5) * 0.02
      });
    }
    FLASHES.push(figs);
  }
  // ---- Fixed confetti: caught in the air only when the flash fires -
  var confRng = mulberry32(SEED * 17 + 3);
  var CONFETTI = [];
  for (fi = 0; fi < 4; fi++) {
    var arr = [];
    for (fj = 0; fj < 42; fj++) {
      arr.push({
        x: confRng(), y: confRng() * 0.85,
        s: 0.004 + confRng() * 0.008,
        c: PARTY[Math.floor(confRng() * PARTY.length)],
        rot: confRng() * Math.PI
      });
    }
    CONFETTI.push(arr);
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Flash state: which flash, seconds since it fired, light -----
  function flashAt(t) {
    var p = (((t - FIRST_T) % CYCLE) + CYCLE) % CYCLE;
    var k = Math.floor((((p + FLASH_LEAD) % CYCLE)) / FLASH_EVERY);
    var s = (p + FLASH_LEAD) % FLASH_EVERY; // seconds since this flash fired
    var light;
    if (s < 0.05) { light = smooth(s / 0.05); }            // attack
    else if (s < 0.65) { light = 1; }                       // full hold
    else if (s < FLASH_HOLD) { light = 1 - smooth((s - 0.65) / 0.15); } // decay
    else { light = 0; }                                     // dark
    return { k: k, s: s, light: light, p: p };
  }

  // ---- One party figure, drawn at (fx, fy) frame origin ------------
  // mode 'lit': color, skin, party shirt, laughing face, raised arm.
  // mode 'ghost': pale wash copy offset by the blur vector.
  // mode 'dark': near-black silhouette.
  function drawFigure(f, fx, fy, fw, fh, mode, dx, dy) {
    var m = Math.min(fw, fh);
    var hx = fx + (f.hx + dx) * fw;
    var hy = fy + (f.hy + dy) * fh;
    var hr = f.hr * m;
    var shX = hx + f.armSide * hr * 0.55;
    var shY = hy + hr * 1.55;
    var handX = shX + Math.cos(f.armA) * f.armLen * m;
    var handY = shY + Math.sin(f.armA) * f.armLen * m;

    if (mode === 'ghost') {
      ctx.fillStyle = rgba([255, 250, 240], a4(0.20));
      ellipse(hx, hy + hr * 1.9, hr * 0.95, hr * 1.7);
      ctx.fill();
      circle(hx, hy, hr);
      ctx.fill();
      return;
    }

    // Torso, party color in the light, silhouette in the dark.
    ctx.fillStyle = (mode === 'lit') ? rgb(f.shirt) : rgb([29, 27, 25]);
    ellipse(hx, hy + hr * 1.9, hr * 0.95, hr * 1.7);
    ctx.fill();

    // Raised arm, mid-gesture.
    ctx.strokeStyle = (mode === 'lit') ? rgb(f.shirt) : rgb([29, 27, 25]);
    ctx.lineWidth = Math.max(2, hr * 0.34);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(shX, shY);
    ctx.lineTo(handX, handY);
    ctx.stroke();
    ctx.fillStyle = (mode === 'lit') ? rgb(f.skin) : rgb([29, 27, 25]);
    circle(handX, handY, hr * 0.22);
    ctx.fill();

    if (mode === 'dark') {
      // In the dark the figure is a silhouette only, head included,
      // no features.
      ctx.save();
      ctx.translate(hx, hy);
      ctx.rotate(f.tilt);
      ctx.fillStyle = rgb([29, 27, 25]);
      circle(0, 0, hr);
      ctx.fill();
      ctx.restore();
      return;
    }

    // Head, skin, tilted slightly.
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(f.tilt);
    ctx.fillStyle = rgb(f.skin);
    circle(0, 0, hr);
    ctx.fill();
    // Hair cap, shallow so the laughing eyes stay visible below it.
    ctx.fillStyle = rgb(f.hair);
    ctx.beginPath();
    ctx.moveTo(-hr * 0.97, -hr * 0.24);
    ctx.arc(0, 0, hr, Math.PI * 1.08, Math.PI * 1.92);
    ctx.closePath();
    ctx.fill();
    // Laughing eyes: closed arcs.
    ctx.strokeStyle = rgba([30, 18, 12], a4(0.9));
    ctx.lineWidth = Math.max(1.2, hr * 0.07);
    ctx.beginPath();
    ctx.arc(-hr * 0.38, -hr * 0.12, hr * 0.16, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(hr * 0.38, -hr * 0.12, hr * 0.16, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
    // Open laughing mouth.
    ctx.fillStyle = rgba([40, 10, 8], a4(0.95));
    ellipse(0, hr * 0.42, hr * 0.30, hr * 0.38);
    ctx.fill();
    ctx.restore();
  }

  // ---- The lit room: hard white wash, frozen faces, confetti -------
  function drawLit(f, fx, fy, fw, fh) {
    var hot = ctx.createRadialGradient(fx + fw * 0.5, fy + fh * 0.42, 0,
      fx + fw * 0.5, fy + fh * 0.42, Math.max(fw, fh) * 0.75);
    hot.addColorStop(0, rgb([255, 253, 246]));
    hot.addColorStop(0.6, rgb([246, 240, 228]));
    hot.addColorStop(1, rgb([214, 206, 192]));
    ctx.fillStyle = hot;
    ctx.fillRect(fx, fy, fw, fh);
    // Motion-blur ghosts first, then the frozen figures sharp.
    var i, g;
    for (i = 0; i < FLASHES[f.k].length; i++) {
      g = FLASHES[f.k][i];
      drawFigure(g, fx, fy, fw, fh, 'ghost', g.blurX, g.blurY);
    }
    for (i = 0; i < FLASHES[f.k].length; i++) {
      drawFigure(FLASHES[f.k][i], fx, fy, fw, fh, 'lit', 0, 0);
    }
    // Confetti caught mid-air by the flash.
    var c;
    for (i = 0; i < CONFETTI[f.k].length; i++) {
      c = CONFETTI[f.k][i];
      ctx.save();
      ctx.translate(fx + c.x * fw, fy + c.y * fh);
      ctx.rotate(c.rot);
      ctx.fillStyle = rgb(c.c);
      ctx.fillRect(-c.s * fw / 2, -c.s * fw / 2, c.s * fw, c.s * fw * 0.6);
      ctx.restore();
    }
  }

  // ---- The dark room: drifting silhouettes, nothing else -----------
  function drawDark(f, fx, fy, fw, fh) {
    ctx.fillStyle = GROUND;
    ctx.fillRect(fx, fy, fw, fh);
    // A breath of warm dark at the floor, the room barely there.
    var glow = ctx.createRadialGradient(fx + fw * 0.5, fy + fh, 0,
      fx + fw * 0.5, fy + fh, fh * 0.7);
    glow.addColorStop(0, rgba([48, 36, 24], a4(0.5)));
    glow.addColorStop(1, rgba([48, 36, 24], 0));
    ctx.fillStyle = glow;
    ctx.fillRect(fx, fy, fw, fh);
    // The figures of this flash drift slowly in the dark, swaying
    // out from their frozen pose and back to it by the next flash.
    var v = (f.s < FLASH_HOLD) ? 0 : (f.s - FLASH_HOLD) / (FLASH_EVERY - FLASH_HOLD);
    var sway = Math.sin(Math.PI * clamp(v, 0, 1));
    var i, g;
    for (i = 0; i < FLASHES[f.k].length; i++) {
      g = FLASHES[f.k][i];
      drawFigure(g, fx, fy, fw, fh, 'dark', g.drift * sway, g.driftY * sway);
    }
  }

  // ---- Caption plate and hint --------------------------------------
  // The text inverts with the flash: quiet white in the dark,
  // near-black under the hard light, so it stays readable either way.
  function drawText(f) {
    var lit = f.light;
    var col = [
      WHITE[0] + (INK[0] - WHITE[0]) * lit,
      WHITE[1] + (INK[1] - WHITE[1]) * lit,
      WHITE[2] + (INK[2] - WHITE[2]) * lit
    ];
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(col, a4(0.9));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№870 · The Flash Cadence', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(col, a4(0.6));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 30', W * 0.04, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(col, a4(0.75));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch the flash fire.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var f = flashAt(t);
    var fx = 0, fy = 0, fw = W, fh = H; // field-like, full-bleed
    drawDark(f, fx, fy, fw, fh);
    if (f.light > 0) {
      ctx.save();
      ctx.globalAlpha = a4(f.light);
      drawLit(f, fx, fy, fw, fh);
      ctx.restore();
    }
    drawText(f);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece870 exposes the flash state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece870 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      flashEvery: FLASH_EVERY,
      flashHold: FLASH_HOLD,
      flashAt: function (t) { return flashAt(t); },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: 20 s cycle, closed-form. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
