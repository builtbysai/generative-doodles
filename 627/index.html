<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Marvelous Dance of Cause and Effect</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1A2440; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ================= palette (strict, nothing else) =================
  var BG    = '#1A2440'; // night indigo
  var AMBER = '#E8B93B'; // butterfly amber
  var ROSE  = '#E87B9C'; // dawn rose
  var CREAM = '#F5F1E8'; // day cream
  var GREEN = '#5C8A4D'; // leaf green
  var GOLD  = '#C98A2E'; // thread gold
  var BASE_SEED = 627076;

  // ================= model constants =================
  var LANES = 5;
  var LANE_Y = [0.15, 0.31, 0.47, 0.63, 0.80]; // fractions of H
  var BEADS = 14;
  var SPACING = 0.045;      // bead gap, in journey progress
  var TRAVERSE = 24;        // seconds for the head bead to cross
  var BEAT_EVERY = 6;       // seconds between automatic wingbeats
  var FIREFLY_DUR = 5.5;    // seconds for a firefly to fly home

  // ================= seeded rng =================
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ================= canvas / viewport =================
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 300, H = 300;

  function viewSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.width === 'number') {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && typeof window.innerWidth === 'number') {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = W; h = H; }
    return { w: Math.max(50, Math.floor(w)), h: Math.max(50, Math.floor(h)) };
  }

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999; sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var s = viewSize();
    W = s.w; H = s.h;
    canvas.width = W; canvas.height = H;
    draw(tNow);
  }

  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    if (window.addEventListener) window.addEventListener('resize', resize);
  }

  // ================= layout =================
  function butterflyPos() {
    var phone = isPhone();
    return { x: W * (phone ? 0.20 : 0.15), y: H * LANE_Y[2] };
  }
  function laneY(lane) { return H * LANE_Y[lane]; }
  function beadS() { return Math.min(W, H) * 0.017; }

  function smooth(u) { return u * u * (3 - 2 * u); }
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

  // Position of bead with journey progress p in the given lane.
  // Near the butterfly the bead is still leaving the perch, so its y
  // eases from the butterfly's height to the lane height.
  function beadPos(lane, p) {
    var b = butterflyPos();
    var x = b.x + p * (W * 0.99 - b.x);
    var e = smooth(clamp01(p / 0.16));
    var y = b.y + (laneY(lane) - b.y) * e;
    return { x: x, y: y };
  }

  // ================= bead stage drawings =================
  // Each stage draws centred on 0,0 inside a box of half-size s.
  // A morph crossfades between consecutive stages by local progress.
  function circle(x, y, r) {
    ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); ctx.fill();
  }
  function ellipse(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, Math.PI * 2);
    ctx.fill();
  }
  function line(x0, y0, x1, y1, wdt) {
    ctx.lineWidth = Math.max(0.75, wdt); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }

  // --- pair 0: seed -> tree -> fruit -> seed, drawn dot -> sprout -> round fruit -> dot
  function stSeedDot(s) {
    ctx.fillStyle = GREEN;
    circle(0, 0, s * 0.34);
    ctx.fillStyle = GOLD;
    circle(0, 0, s * 0.12);
  }
  function stSprout(s) {
    ctx.strokeStyle = GOLD;
    line(0, s * 0.55, 0, -s * 0.25, s * 0.14);
    ctx.fillStyle = GREEN;
    ellipse(-s * 0.28, -s * 0.3, s * 0.3, s * 0.14, -0.6);
    ellipse(s * 0.28, -s * 0.42, s * 0.3, s * 0.14, 0.6);
  }
  function stFruit(s) {
    ctx.strokeStyle = GOLD;
    line(0, -s * 0.45, 0, -s * 0.62, s * 0.13);
    ctx.fillStyle = GREEN;
    ellipse(s * 0.22, -s * 0.62, s * 0.3, s * 0.13, 0.5);
    ctx.fillStyle = AMBER;
    circle(0, s * 0.08, s * 0.52);
    ctx.fillStyle = CREAM;
    circle(-s * 0.16, -s * 0.1, s * 0.11);
  }

  // --- pair 1: night -> dawn -> day -> night
  function stNight(s) {
    ctx.fillStyle = BG;
    circle(0, 0, s * 0.58);
    ctx.strokeStyle = GOLD; ctx.lineWidth = Math.max(0.75, s * 0.09);
    ctx.beginPath(); ctx.arc(0, 0, s * 0.58, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = GOLD;
    circle(s * 0.2, -s * 0.22, s * 0.09);
    circle(-s * 0.28, s * 0.12, s * 0.06);
  }
  function stDawn(s) {
    stNightBase(s);
    ctx.fillStyle = ROSE;
    ctx.beginPath(); ctx.arc(0, 0, s * 0.58, 0, Math.PI); ctx.fill(); // lower half rose
    ctx.fillStyle = CREAM;
    ctx.beginPath(); ctx.arc(0, s * 0.58, s * 0.3, Math.PI, 0); ctx.fill(); // rising sliver
  }
  function stNightBase(s) {
    ctx.fillStyle = BG;
    circle(0, 0, s * 0.58);
    ctx.strokeStyle = GOLD; ctx.lineWidth = Math.max(0.75, s * 0.09);
    ctx.beginPath(); ctx.arc(0, 0, s * 0.58, 0, Math.PI * 2); ctx.stroke();
  }
  function stDay(s) {
    ctx.fillStyle = CREAM;
    circle(0, 0, s * 0.58);
    ctx.fillStyle = AMBER;
    circle(0, 0, s * 0.32);
    ctx.strokeStyle = GOLD;
    for (var k = 0; k < 8; k++) {
      var a = (k / 8) * Math.PI * 2;
      line(Math.cos(a) * s * 0.66, Math.sin(a) * s * 0.66,
           Math.cos(a) * s * 0.82, Math.sin(a) * s * 0.82, s * 0.09);
    }
  }

  // --- pair 2: winter -> spring (bare branch ticks grow leaves)
  function branchPath(s) {
    ctx.strokeStyle = GOLD;
    line(-s * 0.55, s * 0.5, s * 0.5, -s * 0.45, s * 0.15);
    line(-s * 0.1, s * 0.05, -s * 0.42, -s * 0.28, s * 0.11);
    line(s * 0.18, -s * 0.2, s * 0.12, -s * 0.55, s * 0.11);
    line(s * 0.34, -s * 0.34, s * 0.62, -s * 0.42, s * 0.11);
  }
  function stWinter(s) { branchPath(s); }
  function stSpring(s) {
    branchPath(s);
    ctx.fillStyle = GREEN;
    circle(-s * 0.42, -s * 0.3, s * 0.17);
    circle(s * 0.12, -s * 0.58, s * 0.17);
    circle(s * 0.64, -s * 0.42, s * 0.16);
    circle(-s * 0.2, s * 0.22, s * 0.15);
    circle(s * 0.3, s * 0.02, s * 0.14);
  }

  // --- pair 3: death -> life (pale ghost oval becomes a green sprout figure)
  function stDeath(s) {
    ctx.strokeStyle = CREAM; ctx.lineWidth = Math.max(0.75, s * 0.1);
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 0.34, s * 0.55, 0.12, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = CREAM;
    circle(-s * 0.12, -s * 0.14, s * 0.05);
    circle(s * 0.12, -s * 0.14, s * 0.05);
  }
  function stLife(s) {
    ctx.strokeStyle = GREEN;
    line(0, s * 0.55, 0, -s * 0.1, s * 0.16);
    ctx.fillStyle = GREEN;
    ellipse(-s * 0.26, -s * 0.18, s * 0.28, s * 0.13, -0.6);
    ellipse(s * 0.26, -s * 0.3, s * 0.28, s * 0.13, 0.6);
    ctx.fillStyle = CREAM;
    circle(0, -s * 0.52, s * 0.16);
  }

  var PAIRS = [
    [stSeedDot, stSprout, stFruit, stSeedDot], // seed cycle
    [stNight, stDawn, stDay, stNight],         // night cycle
    [stWinter, stSpring],                      // season
    [stDeath, stLife]                          // death to life
  ];

  function drawBead(x, y, s, pairIdx, local, wobble) {
    var stages = PAIRS[pairIdx];
    var pos = clamp01(local) * (stages.length - 1);
    var i0 = Math.floor(pos), frac = pos - i0;
    if (i0 >= stages.length - 1) { i0 = stages.length - 1; frac = 0; }
    ctx.save();
    ctx.translate(x, y + wobble);
    if (frac <= 0.001 || i0 === stages.length - 1) {
      stages[i0](s);
    } else {
      ctx.globalAlpha = 1 - frac;
      stages[i0](s);
      ctx.globalAlpha = frac;
      stages[i0 + 1](s);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  // ================= chains =================
  var chains = [];       // {lane, pair, headP, converted, pluckT0}
  var fireflies = [];    // {fx, lane, t0, dur, seed}
  var chainCounter = 0;  // drives the pair cycle
  var pendingEmit = 0;   // queued taps waiting for a free lane
  var glow = 0;          // butterfly glow, fed by returning fireflies
  var lastBeat = -BEAT_EVERY;
  var beatFlashT0 = -100;

  function laneFree(lane) {
    for (var i = 0; i < chains.length; i++) if (chains[i].lane === lane) return false;
    return true;
  }
  function nextFreeLane() {
    for (var l = 0; l < LANES; l++) if (laneFree(l)) return l;
    return -1;
  }

  function emitChain() {
    var lane = nextFreeLane();
    if (lane < 0) return false;
    chains.push({
      lane: lane,
      pair: chainCounter % PAIRS.length,
      headP: 0,
      converted: 0,
      pluckT0: -100
    });
    chainCounter++;
    return true;
  }

  function spawnFirefly(x, lane) {
    var rng = mulberry32(BASE_SEED + fireflies.length * 7919 + chainCounter * 131);
    fireflies.push({
      fx: x / W, lane: lane, t0: tNow, dur: FIREFLY_DUR,
      wob: 2 + rng() * 3, wph: rng() * Math.PI * 2
    });
  }

  // Firefly position at time t: a quadratic arc from its birth point,
  // high along the top of the frame, home to the butterfly.
  function fireflyPos(f, t) {
    var u = clamp01((t - f.t0) / f.dur);
    var b = butterflyPos();
    var x0 = f.fx * W, y0 = laneY(f.lane);
    var cx = (x0 + b.x) / 2, cy = H * 0.05;
    var qx = (1 - u) * (1 - u) * x0 + 2 * (1 - u) * u * cx + u * u * b.x;
    var qy = (1 - u) * (1 - u) * y0 + 2 * (1 - u) * u * cy + u * u * b.y;
    qx += Math.sin(u * f.wob * Math.PI + f.wph) * Math.min(W, H) * 0.012;
    qy += Math.cos(u * f.wob * Math.PI + f.wph) * Math.min(W, H) * 0.008;
    return { x: qx, y: qy, u: u };
  }

  // ================= the butterfly =================
  function drawButterfly(t) {
    var b = butterflyPos();
    var unit = Math.min(W, H);
    var s = unit * 0.085; // wing half-span scale
    // wings half open at t = 0, slow sine flap after that
    var open = 0.5 - 0.5 * Math.cos(Math.PI / 2 + (t / 3.0) * Math.PI * 2);
    var beatAge = t - beatFlashT0;
    var burst = beatAge >= 0 && beatAge < 1.4 ? Math.sin((beatAge / 1.4) * Math.PI) : 0;
    open = clamp01(open + burst * 0.35);

    // soft glow, refilled by returning fireflies: concentric layers
    // with falling alpha so the halo has no hard edge
    var gr = s * (1.9 + glow * 1.1);
    ctx.fillStyle = AMBER;
    var gl;
    for (gl = 5; gl >= 1; gl--) {
      ctx.globalAlpha = (0.028 + glow * 0.05) * (6 - gl) / 5 + 0.012;
      circle(b.x, b.y, gr * gl / 5);
    }
    ctx.globalAlpha = 1;

    // perch: a small gold stem and dot; the butterfly never leaves it
    ctx.strokeStyle = GOLD;
    line(b.x, b.y + s * 0.55, b.x - s * 0.18, b.y + s * 1.05, s * 0.07);
    ctx.fillStyle = GOLD;
    circle(b.x - s * 0.2, b.y + s * 1.1, s * 0.08);

    var flap = 0.3 + 0.7 * open; // horizontal squash of the wings
    var side, k;
    for (k = 0; k < 2; k++) {
      side = k === 0 ? -1 : 1;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.scale(side * flap, 1);
      // lower wing
      ctx.fillStyle = AMBER;
      ellipse(s * 0.52, s * 0.42, s * 0.42, s * 0.3, 0.5);
      ctx.fillStyle = ROSE;
      circle(s * 0.55, s * 0.45, s * 0.1);
      // upper wing
      ctx.fillStyle = AMBER;
      ellipse(s * 0.62, -s * 0.38, s * 0.58, s * 0.42, -0.45);
      ctx.strokeStyle = GOLD; ctx.lineWidth = Math.max(0.75, s * 0.05);
      ctx.beginPath();
      ctx.ellipse(s * 0.62, -s * 0.38, s * 0.58, s * 0.42, -0.45, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = CREAM;
      circle(s * 0.85, -s * 0.55, s * 0.09);
      circle(s * 0.45, -s * 0.2, s * 0.06);
      ctx.restore();
    }

    // body: a small dark spindle (thread gold), head, antennae
    ctx.fillStyle = GOLD;
    ellipse(b.x, b.y, s * 0.13, s * 0.5, 0);
    circle(b.x, b.y - s * 0.55, s * 0.16);
    ctx.strokeStyle = GOLD;
    line(b.x - s * 0.05, b.y - s * 0.66, b.x - s * 0.4, b.y - s * 1.05, s * 0.05);
    line(b.x + s * 0.05, b.y - s * 0.66, b.x + s * 0.4, b.y - s * 1.05, s * 0.05);
    ctx.fillStyle = AMBER;
    circle(b.x - s * 0.42, b.y - s * 1.08, s * 0.06);
    circle(b.x + s * 0.42, b.y - s * 1.08, s * 0.06);

    // wingbeat ring pulse at the moment of emission
    if (burst > 0) {
      ctx.strokeStyle = GOLD;
      ctx.globalAlpha = burst * 0.5;
      ctx.lineWidth = Math.max(0.75, s * 0.05);
      ctx.beginPath();
      ctx.arc(b.x, b.y, s * (1.3 + (1 - burst) * 0.9), 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // ================= main draw =================
  var tNow = 0;
  var lastT = 0;

  function draw(t) {
    var dt = Math.max(0, Math.min(0.05, t - lastT));
    lastT = t;

    // automatic wingbeats: the cause of every automatic chain
    if (t - lastBeat >= BEAT_EVERY) {
      lastBeat = t;
      beatFlashT0 = t;
      if (pendingEmit > 0) {
        if (emitChain()) pendingEmit--;
      } else {
        emitChain();
      }
    }

    // advance chains; beads that finish their journey become fireflies
    var ci, ch, bi;
    for (ci = chains.length - 1; ci >= 0; ci--) {
      ch = chains[ci];
      var pluckAge = t - ch.pluckT0;
      var pluckEnv = pluckAge >= 0 && pluckAge < 2 ? 1 - pluckAge / 2 : 0;
      var speed = 1 + 0.8 * pluckEnv;
      ch.headP += (dt / TRAVERSE) * speed;
      for (bi = ch.converted; bi < BEADS; bi++) {
        var p = ch.headP - bi * SPACING;
        if (p >= 1) {
          var bp = beadPos(ch.lane, 1);
          spawnFirefly(bp.x, ch.lane);
          ch.converted++;
        } else break;
      }
      if (ch.converted >= BEADS) chains.splice(ci, 1);
    }

    // fireflies fly home; arriving ones refill the butterfly's glow
    for (ci = fireflies.length - 1; ci >= 0; ci--) {
      if (t - fireflies[ci].t0 >= fireflies[ci].dur) {
        fireflies.splice(ci, 1);
        glow = Math.min(1, glow + 0.25);
      }
    }
    glow = Math.max(0, glow - dt * 0.05);

    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var s = beadS();
    var unit = Math.min(W, H);

    // chains: dotted gold thread first, then the morphing beads
    for (ci = 0; ci < chains.length; ci++) {
      ch = chains[ci];
      var page = t - ch.pluckT0;
      var env = page >= 0 && page < 2 ? 1 - page / 2 : 0;
      var pts = [];
      for (bi = 0; bi < BEADS; bi++) {
        var pp = ch.headP - bi * SPACING;
        if (pp <= 0.005 || pp >= 1) { pts.push(null); continue; }
        var pos = beadPos(ch.lane, pp);
        var wob = env > 0 ? Math.sin(pp * 22 - page * 10) * unit * 0.012 * env : 0;
        pts.push({ x: pos.x, y: pos.y, p: pp, wob: wob });
      }
      // thread: small gold dots interpolated along the bead path
      ctx.fillStyle = GOLD;
      for (bi = 0; bi < pts.length - 1; bi++) {
        var a = pts[bi], c2 = pts[bi + 1];
        if (!a || !c2) continue;
        var steps = 5, si;
        for (si = 1; si < steps; si++) {
          var f = si / steps;
          ctx.globalAlpha = 0.55;
          circle(a.x + (c2.x - a.x) * f,
                 (a.y + a.wob) + ((c2.y + c2.wob) - (a.y + a.wob)) * f,
                 Math.max(0.8, s * 0.1));
        }
      }
      ctx.globalAlpha = 1;
      for (bi = 0; bi < pts.length; bi++) {
        if (!pts[bi]) continue;
        drawBead(pts[bi].x, pts[bi].y, s, ch.pair, pts[bi].p, pts[bi].wob);
      }
    }

    // fireflies: layered alpha dots on their arc home
    for (ci = 0; ci < fireflies.length; ci++) {
      var fp2 = fireflyPos(fireflies[ci], t);
      var fade = Math.sin(Math.PI * fp2.u);
      var fr = unit * 0.006;
      ctx.fillStyle = AMBER;
      ctx.globalAlpha = 0.07 * fade;
      circle(fp2.x, fp2.y, fr * 2.8);
      ctx.globalAlpha = 0.12 * fade;
      circle(fp2.x, fp2.y, fr * 2.0);
      ctx.globalAlpha = 0.4 * fade;
      circle(fp2.x, fp2.y, fr * 1.35);
      ctx.fillStyle = CREAM;
      ctx.globalAlpha = 0.9 * fade;
      circle(fp2.x, fp2.y, fr * 0.7);
      ctx.globalAlpha = 1;
    }

    drawButterfly(t);
  }

  // ================= interaction =================
  var dragPlucking = false;

  function evPos(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: (e.clientX || 0) - r.left, y: (e.clientY || 0) - r.top };
  }

  canvas.addEventListener('pointerdown', function (e) {
    var p = evPos(e);
    var b = butterflyPos();
    var unit = Math.min(W, H);
    var dx = p.x - b.x, dy = p.y - b.y;
    if (Math.sqrt(dx * dx + dy * dy) <= unit * 0.11) {
      // tap the butterfly: one wingbeat, one fresh chain (queued if busy)
      beatFlashT0 = tNow;
      lastBeat = tNow;
      if (!emitChain()) pendingEmit++;
      dragPlucking = false;
      return;
    }
    dragPlucking = true;
    pluckAt(p);
  });

  function pluckAt(p) {
    var unit = Math.min(W, H);
    for (var i = 0; i < chains.length; i++) {
      var ch = chains[i];
      if (Math.abs(p.y - laneY(ch.lane)) <= unit * 0.07) {
        var tail = beadPos(ch.lane, Math.max(0, ch.headP - (BEADS - 1) * SPACING));
        var head = beadPos(ch.lane, Math.min(1, ch.headP));
        if (p.x >= tail.x - unit * 0.03 && p.x <= head.x + unit * 0.03) {
          ch.pluckT0 = tNow;
        }
      }
    }
  }

  canvas.addEventListener('pointermove', function (e) {
    if (!dragPlucking) return;
    pluckAt(evPos(e));
  });
  function endDrag() { dragPlucking = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', endDrag);

  // ================= boot =================
  // Frame one is fixed: chain 1 (the seed cycle) already mid-flight in
  // lane 1, beads spread with their morph stages varying along the lane,
  // and two fireflies already on their arc home along the top.
  chains.push({ lane: 0, pair: 0, headP: 0.78, converted: 0, pluckT0: -100 });
  chainCounter = 1;
  fireflies.push({ fx: 0.97, lane: 0, t0: -1.5, dur: FIREFLY_DUR, wob: 2.4, wph: 0.7 });
  fireflies.push({ fx: 0.97, lane: 0, t0: -2.6, dur: FIREFLY_DUR, wob: 3.1, wph: 2.9 });
  lastBeat = 0; // first automatic wingbeat lands at t = 6

  var s0 = viewSize();
  W = s0.w; H = s0.h;
  canvas.width = W; canvas.height = H;
  draw(0); // synchronous first frame at phase 0

  var startTs = null;
  function frame(ts) {
    if (startTs === null) startTs = ts;
    tNow = (ts - startTs) / 1000;
    draw(tNow);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
