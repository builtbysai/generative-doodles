<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№627 The White Whale</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d0c0a; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // The White Whale, TL1 / PP1215, study #257 theodora-laird.
  // A composition almost finishes on screen: a melodic line
  // traced as a luminous contour, harmonic bands stacking
  // beneath it in a golden dome, everything converging toward
  // a perfect finished form. Just before it lands, the system
  // starts unbuilding it: bands dissolve, the contour frays at
  // the edges, and only a single bare vocal-like line survives,
  // thin and true, across the lower third. Then the building
  // starts again. The piece never arrives; it keeps almost
  // arriving. Drag to chase the arrangement: press and hold and
  // the form builds faster toward completeness, but the harder
  // you hold the faster it dissolves when you release, because
  // the white whale always sounds bad when chased. Release is
  // the abandonment. Visual only: the chased-arrangement synth
  // is a closed-form visual model, no real audio.
  var GROUND = '#0d0c0a'; // near-black ground, page ground
  var GOLD = '#d9a441';    // forming composition, warm gold
  var GOLDHI = '#f2c14e';  // contour highlight gold
  var GOLDLO = '#8a6a24';  // dim gold, ghost of the finished form
  var WHITE = '#f2f4ef';   // survivor line, cold white
  var ASH = '#8a857c';     // dissolution, ash gray
  var ASHD = '#6e6a62';    // darker ash

  // Fixed-phase first frame: FIRST_T = 10 s. The 22 s cycle
  // builds for 14 s, holds almost complete for 1 s, then
  // dissolves for 7 s. At t = 10 the form is about four fifths
  // built: the dome bands are mostly traced, the contour is
  // mostly drawn, nothing has started to fray yet, and the
  // survivor line runs steady below.
  var FIRST_T = 10;
  var SEED = 1968;
  var CYC = 22;       // cycle length in seconds
  var BUILD = 14;     // build phase length
  var HOLD = 1;       // almost-complete hold
  var BANDS = 7;      // harmonic bands in the dome

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Deterministic hash for segment visibility and jitter: a pure
  // function of its integer inputs, so every frame is a pure
  // function of the clock and the chase state.
  function hash(n) {
    var s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return s - Math.floor(s);
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function lerp(a, b, k) { return a + (b - a) * k; }
  function ease(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
  function hexRGB(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mix(h1, h2, k) {
    var a = hexRGB(h1), b = hexRGB(h2);
    return 'rgba(' + Math.round(lerp(a[0], b[0], k)) + ',' + Math.round(lerp(a[1], b[1], k)) + ',' + Math.round(lerp(a[2], b[2], k)) + ',';
  }
  function colA(h, a) { return mix(h, h, 0) + a4(a) + ')'; }
  function colMix(h1, h2, k, a) { return mix(h1, h2, k) + a4(a) + ')'; }

  var L = {};
  function layout() {
    var u = Math.min(W, H);
    L.u = u;
    L.cx = W / 2;
    // On phones the tall sheet gets the form lifted so it does
    // not sit low in a field of empty black; on desktop the
    // form sits in the square stage as specced.
    L.domeY = isPhone ? H * 0.60 : H * 0.70; // dome base, just above the survivor line
    L.survY = isPhone ? H * 0.64 : H * 0.74; // survivor line, lower third
    L.rMax = u * 0.38;           // outermost band radius
    L.rMin = u * 0.10;           // innermost band radius
    L.contX0 = W * 0.10;         // contour span
    L.contX1 = W * 0.90;
    L.contBase = isPhone ? H * 0.56 : H * 0.66; // contour endpoints height
    L.archH = u * 0.34;          // contour arch height, from the short side so the peak never spikes on tall phones
    L.sideX = Math.max(14, W * 0.045);
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // ---- Composition state --------------------------------------
  // Closed-form cycle of the composition clock c. Build 0 to 14,
  // almost-complete hold 14 to 15, dissolve 15 to 22. The form
  // never quite reaches 1: it tops out at 0.97, then unravels.
  // Returns { s, d, phase } where s is completeness 0..0.97 and
  // d is dissolution 0..1.
  function compState(c) {
    var p = ((c % CYC) + CYC) % CYC;
    var s, d, phase;
    if (p < BUILD) {
      s = 0.97 * ease(p / BUILD);
      d = 0;
      phase = (p < 12) ? 'BUILDING' : 'ALMOST';
    } else if (p < BUILD + HOLD) {
      s = 0.97;
      d = 0;
      phase = 'ALMOST';
    } else {
      var q = (p - BUILD - HOLD) / (CYC - BUILD - HOLD);
      d = ease(q);
      s = 0.97 * (1 - ease(q));
      phase = (s < 0.05) ? 'ONE LINE' : 'UNRAVELLING';
    }
    return { s: s, d: d, phase: phase, p: p };
  }

  // ---- Chase state (live interaction only) --------------------
  // The chase clock advances at rate 1 on its own. While the
  // visitor holds, it advances up to 3x faster and brittleness
  // grows. On release, brittleness is banked as a dissolve
  // boost, so a long chase dissolves the form fast. Holding can
  // never win: the faster build only buys a faster unbuilding.
  var chase = {
    c: FIRST_T,        // chase clock
    holding: false,
    holdRamp: 0,       // 0..1, eases in while held
    brittleness: 0,    // 0..2.5, grows with hold time
    dissolveBoost: 0,  // banked on release, speeds the dissolve
    chaseX: null,      // pointer x while dragging
    peakX: 0           // contour peak x, eased toward chaseX
  };
  function chaseStep(dt) {
    if (dt <= 0) { return; }
    if (chase.holding) {
      chase.holdRamp = clamp(chase.holdRamp + dt * 2, 0, 1);
      chase.brittleness = clamp(chase.brittleness + dt * 0.5, 0, 2.5);
    } else {
      chase.holdRamp = clamp(chase.holdRamp - dt, 0, 1);
      chase.brittleness = clamp(chase.brittleness - dt * 0.1, 0, 2.5);
      chase.dissolveBoost = clamp(chase.dissolveBoost - dt * 0.2, 0, 2.5);
    }
    var st = compState(chase.c);
    var rate = 1 + 2 * chase.holdRamp;
    if (!chase.holding && st.d > 0) { rate *= (1 + chase.dissolveBoost); }
    chase.c += dt * rate;
    // The contour peak follows the pointer while dragging, and
    // drifts back to centre when the visitor lets go.
    var target = (chase.holding && chase.chaseX !== null) ? chase.chaseX : W / 2;
    chase.peakX += (target - chase.peakX) * clamp(dt * 3, 0, 1);
  }
  function chasePress(x) {
    chase.holding = true;
    chase.chaseX = (typeof x === 'number') ? x : W / 2;
  }
  function chaseRelease() {
    if (chase.holding) {
      chase.dissolveBoost = chase.brittleness;
    }
    chase.holding = false;
    chase.chaseX = null;
  }
  function chaseMove(x) {
    if (chase.holding && typeof x === 'number') { chase.chaseX = x; }
  }

  // ---- Drawing -------------------------------------------------
  function contourY(u, t, peakX) {
    // Melodic contour: an arch over the dome, waving gently, its
    // peak leaning toward the chased point while dragging.
    var lean = (peakX - W / 2) / Math.max(1, W) * 0.35;
    var uu = clamp(u + lean * Math.sin(Math.PI * u), 0, 1);
    var wave = 0.75 + 0.25 * Math.sin(2 * Math.PI * 2 * uu + t * 0.15);
    return L.contBase - L.archH * Math.pow(Math.sin(Math.PI * uu), 0.9) * wave;
  }

  function drawBands(t, st) {
    var i, r, prog, sweep, a0, a1, col, alpha;
    // Ghost of the finished form: the complete dome, barely
    // there, the perfect shape the piece never reaches.
    ctx.lineWidth = Math.max(1.5, L.u * 0.010);
    ctx.strokeStyle = colA(GOLDLO, a4(0.10));
    for (i = 0; i < BANDS; i++) {
      r = L.rMin + (L.rMax - L.rMin) * (i / (BANDS - 1));
      ctx.beginPath();
      ctx.moveTo(L.cx + r, L.domeY);
      ctx.arc(L.cx, L.domeY, r, Math.PI, 2 * Math.PI);
      ctx.stroke();
    }
    // Formed bands: each appears in turn as completeness grows,
    // sweeping out from the centre of its arc. During the
    // dissolve each band breaks into segments that scatter
    // outward and turn to ash.
    for (i = 0; i < BANDS; i++) {
      r = L.rMin + (L.rMax - L.rMin) * (i / (BANDS - 1));
      prog = clamp((st.s - (i / BANDS)) / (1 / BANDS), 0, 1);
      if (prog <= 0) { continue; }
      sweep = Math.PI * ease(prog);
      a0 = Math.PI + (Math.PI - sweep) / 2;
      a1 = a0 + sweep;
      col = (st.d > 0) ? GOLD : GOLD;
      alpha = (0.30 + 0.70 * prog) * (1 - 0.55 * st.d);
      ctx.lineWidth = Math.max(2, L.u * 0.014);
      if (st.d <= 0) {
        ctx.strokeStyle = (i === BANDS - 1) ? colA(GOLDHI, a4(alpha)) : colA(col, a4(alpha));
        ctx.beginPath();
        ctx.moveTo(L.cx + r * Math.cos(a0), L.domeY + r * Math.sin(a0));
        ctx.arc(L.cx, L.domeY, r, a0, a1);
        ctx.stroke();
      } else {
        // Dissolving: draw the band as short segments; each
        // segment survives only while its seeded hash beats the
        // dissolution, and drifts outward as it frays.
        var segs = 26;
        var k;
        for (k = 0; k < segs; k++) {
          var h = hash(SEED + i * 131 + k * 17);
          if (h < st.d * 0.9) { continue; }
          var sa0 = a0 + (a1 - a0) * (k / segs);
          var sa1 = a0 + (a1 - a0) * ((k + 0.7) / segs);
          var jr = st.d * (h - 0.5) * L.u * 0.10;
          var rr = r + jr;
          ctx.strokeStyle = colMix(GOLD, ASH, st.d, a4(alpha * (1 - st.d * 0.4)));
          ctx.beginPath();
          ctx.moveTo(L.cx + rr * Math.cos(sa0), L.domeY + rr * Math.sin(sa0));
          ctx.arc(L.cx, L.domeY, rr, sa0, sa1);
          ctx.stroke();
        }
      }
    }
  }

  function drawContour(t, st, peakX) {
    var x0 = L.contX0, x1 = L.contX1;
    var span = (x1 - x0) * st.s; // grows center-out with completeness
    var cx0 = L.cx - span / 2, cx1 = L.cx + span / 2;
    if (cx1 - cx0 < 2) { return; }
    var N = 48;
    var i, u, x, y;
    // Glow pass: wide, faint.
    ctx.lineWidth = Math.max(3, L.u * 0.012);
    ctx.strokeStyle = colMix(GOLDHI, ASH, st.d, a4(0.16 * (1 - st.d * 0.5)));
    ctx.beginPath();
    var started = false;
    for (i = 0; i <= N; i++) {
      u = i / N;
      x = cx0 + (cx1 - cx0) * u;
      y = contourY((x - x0) / (x1 - x0), t, peakX);
      if (st.d > 0) {
        var hg = hash(SEED + 5000 + i * 23);
        if (hg < st.d * 0.55) { started = false; continue; }
        y += st.d * (hg - 0.5) * L.u * 0.06;
      }
      if (!started) { ctx.moveTo(x, y); started = true; }
      else { ctx.lineTo(x, y); }
    }
    ctx.stroke();
    // Core pass: thin, bright, the luminous line itself.
    ctx.lineWidth = Math.max(1.5, L.u * 0.004);
    ctx.strokeStyle = colMix(GOLDHI, ASH, st.d, a4(0.95 * (1 - st.d * 0.35)));
    ctx.beginPath();
    started = false;
    for (i = 0; i <= N; i++) {
      u = i / N;
      x = cx0 + (cx1 - cx0) * u;
      y = contourY((x - x0) / (x1 - x0), t, peakX);
      if (st.d > 0) {
        var hg2 = hash(SEED + 5000 + i * 23);
        if (hg2 < st.d * 0.55) { started = false; continue; }
        y += st.d * (hg2 - 0.5) * L.u * 0.06;
      }
      if (!started) { ctx.moveTo(x, y); started = true; }
      else { ctx.lineTo(x, y); }
    }
    ctx.stroke();
  }

  function drawSurvivor(t) {
    // The bare vocal-like line: horizontal across the lower
    // third, steady while everything above it unravels. A slow
    // vibrato keeps it alive; it never stops.
    var x0 = W * 0.06, x1 = W * 0.94;
    var N = 60;
    ctx.lineWidth = Math.max(1.5, L.u * 0.003);
    ctx.strokeStyle = colA(WHITE, a4(0.95));
    ctx.beginPath();
    var i, x, y;
    for (i = 0; i <= N; i++) {
      var u = i / N;
      x = x0 + (x1 - x0) * u;
      y = L.survY + 1.5 * Math.sin(x * 0.02 + t * 0.6);
      if (i === 0) { ctx.moveTo(x, y); }
      else { ctx.lineTo(x, y); }
    }
    ctx.stroke();
    // Faint echo a little below, the line's own shadow.
    ctx.lineWidth = Math.max(1, L.u * 0.0015);
    ctx.strokeStyle = colA(WHITE, a4(0.18));
    ctx.beginPath();
    for (i = 0; i <= N; i++) {
      var u2 = i / N;
      x = x0 + (x1 - x0) * u2;
      y = L.survY + H * 0.018 + 1.5 * Math.sin(x * 0.02 + t * 0.6 + 1.2);
      if (i === 0) { ctx.moveTo(x, y); }
      else { ctx.lineTo(x, y); }
    }
    ctx.stroke();
  }

  function draw(t, ch) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    var st = compState(t);
    var peakX = (ch && typeof ch.peakX === 'number') ? ch.peakX : W / 2;

    // Page ground is the piece's own near-black.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawBands(t, st);
    drawContour(t, st, peakX);
    drawSurvivor(t);

    // ---- Vertical side text along the left edge.
    var fsSide = Math.round(12 * clamp(W / 560, 0.85, 1.1));
    ctx.save();
    ctx.translate(L.sideX + 2, L.survY - H * 0.06);
    ctx.rotate(-Math.PI / 2);
    ctx.font = '600 ' + fsSide + 'px Georgia, "Times New Roman", serif';
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = colA(GOLD, a4(0.78));
    ctx.fillText('T H E   W H I T E   W H A L E', 0, 0);
    ctx.font = fsSide + 'px Georgia, "Times New Roman", serif';
    ctx.fillStyle = colA(ASH, a4(0.75));
    ctx.fillText('T L 1   ·   P P 1 2 1 5', 0, fsSide + 7);
    ctx.restore();

    // ---- Plates: title top-left, number and date below it.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsHint = Math.round(13 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = GOLDHI;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('The White Whale', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = colA(ASH, a4(0.9));
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№627 · 2003 · 09 · 30', 18, 18 + fsTitle * 0.8 + fsSub + 8);

    // ---- State word, top-right, and brittleness bar under it.
    var fsState = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    ctx.font = '600 ' + fsState + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = (st.phase === 'UNRAVELLING' || st.phase === 'ONE LINE') ? colA(ASH, a4(0.95)) : colA(GOLDHI, a4(0.95));
    ctx.fillText(st.phase, W - 18, 18 + fsState);
    var brit = (ch) ? Math.max(ch.brittleness || 0, ch.dissolveBoost || 0) : 0;
    if (brit > 0.02) {
      var bw = 90, bx = W - 18 - bw, by = 18 + fsState + 8;
      ctx.fillStyle = colA(ASHD, a4(0.6));
      ctx.fillRect(bx, by, bw, 3);
      ctx.fillStyle = colA(GOLD, a4(0.95));
      ctx.fillRect(bx, by, bw * clamp(brit / 2.5, 0, 1), 3);
      ctx.font = fsState + 'px Georgia, "Times New Roman", serif';
      ctx.fillStyle = colA(ASH, a4(0.8));
      ctx.fillText('BRITTLE', W - 18, by + fsState + 8);
    }
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom, dark gold pill.
    var hint = 'Drag to chase it.';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var px = (W - hw) / 2 - 12, py = H - fsHint - 22, pw = hw + 24, ph = fsHint + 12;
    ctx.fillStyle = 'rgba(23,19,12,0.92)';
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = colA(GOLD, a4(0.45));
    ctx.lineWidth = 1;
    ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
    ctx.fillStyle = GOLDHI;
    ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  // ---- Pointer: drag to chase, release to abandon. Never
  // click-to-reload: a tap with no drag does nothing but a brief
  // hold, and the piece keeps its own cycle regardless.
  function posX(e) {
    try {
      var r = (canvas.getBoundingClientRect) ? canvas.getBoundingClientRect() : null;
      if (r && typeof e.clientX === 'number') { return e.clientX - r.left; }
    } catch (err) {}
    return (typeof e.clientX === 'number') ? e.clientX : W / 2;
  }
  try {
    if (typeof canvas.addEventListener === 'function') {
      canvas.addEventListener('pointerdown', function (e) {
        if (e && typeof e.preventDefault === 'function') { e.preventDefault(); }
        chasePress(posX(e));
      });
      canvas.addEventListener('pointermove', function (e) { chaseMove(posX(e)); });
      var endDrag = function () { chaseRelease(); };
      canvas.addEventListener('pointerup', endDrag);
      canvas.addEventListener('pointercancel', endDrag);
      canvas.addEventListener('pointerleave', endDrag);
    }
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(chase.c, chase); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(chase.c, chase); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock
  // and no chase, window.__piece1968 exposes the composition
  // state and the drag simulation used by the probes.
  try {
    window.__draw = function (t) { draw(t, { peakX: W / 2, brittleness: 0, dissolveBoost: 0 }); };
    window.__piece1968 = {
      firstT: FIRST_T,
      state: function (t) { return compState(t); },
      press: function (x) { chasePress(x); },
      move: function (x) { chaseMove(x); },
      release: function () { chaseRelease(); },
      step: function (dt) { chaseStep(dt); },
      liveT: function () { return chase.c; },
      chaseState: function () { return { holding: chase.holding, brittleness: chase.brittleness, dissolveBoost: chase.dissolveBoost, holdRamp: chase.holdRamp, peakX: chase.peakX }; },
      drawLive: function () { draw(chase.c, chase); },
      redraw: function (t) { draw(t, { peakX: W / 2, brittleness: 0, dissolveBoost: 0 }); }
    };
  } catch (e) {}

  resize();
  chase.peakX = W / 2;
  draw(probeT !== null ? probeT : FIRST_T, { peakX: W / 2, brittleness: 0, dissolveBoost: 0 }); // one synchronous frame at load

  // Motion loop: the form builds, almost lands, and unravels on
  // a 22 s closed-form cycle, the survivor line vibrating slowly.
  // All motion is on multi second timescales, well under the
  // 14 Hz ceiling. Guarded so node-canvas QA (no
  // requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var last = start;
    var loop = function (now) {
      var dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      chaseStep(dt);
      draw(chase.c, chase);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
