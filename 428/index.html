<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.428 Leaf Picnic</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#6FA84F; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.428 Leaf Picnic (yaelhofri, EXPANSION #46).
// After Yael Hofri's Sweetemberdays26 Prompt 3: the
// sharing moment, not the eaters. A pink checked
// picnic blanket lies rotated as a diamond over
// grass, bleeding off every edge; at its centre a
// lattice-topped pie; exactly four hands (three skin
// tones, four sleeve colours) enter from the top,
// left, right and bottom edges; the right hand holds
// a coffee pot pouring a dotted stream into a blue
// mug at the bottom right; fall leaves rest on the
// blanket, tumble across its edge and drift down
// through the air. No faces, no text anywhere.
// DOUBLE-TAP advances the centre dish through a
// FIXED AUTHORED TABLE of exactly 4 (lattice pie,
// cake, bread basket, fruit bowl); the blanket and
// the leaf grammar never change. DRAG rotates the
// airborne leaves (the tumblers and the fallers)
// mid-air; on release the rotation offset springs
// back to exactly zero and the leaves keep their
// loop paths. Ambient 24s slow loop: the coffee
// stream pours in looping dots (each dot makes 3
// whole trips per loop), two leaves tumble across
// the blanket edge (one crossing each, twice per
// loop), five leaves fall on whole-cycle wraps, the
// resting leaves sway a breath on 2 whole cycles.
// Frame one is the full scene at the constant phase
// T = 7.0s, pie centred, coffee mid-pour; the clock
// is anchored there and advances in fixed 1/60
// ticks, never from a wall clock. Flat colour only,
// one canvas, no offscreen canvas, no gradients, no
// shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette (closed) -----------------------------------
var BLANKET = '#F6D7DE';   // blanket base pink
var CHECK = '#F06A8A';     // blanket checks
var CRUST = '#D9A441';     // pie crust, cake, rolls
var LATTICE = '#B9832F';   // lattice brown, basket
var COFFEE = '#4A2E1E';    // coffee, pot
var MUG = '#3E7CB1';       // mug blue, plate, bowl
var LEAF1 = '#D94F2B';     // leaf red-orange, cherries
var LEAF2 = '#E8872B';     // leaf orange
var LEAF3 = '#C9A24B';     // leaf gold
var SKINA = '#F2C49B';     // hand skin, light
var SKINB = '#C98D5E';     // hand skin, mid
var SKINC = '#8A5A33';     // hand skin, deep
var GRASS = '#6FA84F';     // grass ground

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 24;
if (LOOP !== 24) throw new Error('Leaf Picnic ambient loop must be 24s');
var TICK = 1 / 60;
var T0 = 7.0;
var T = T0;

// ---- the blanket ------------------------------------------
// A square of side 1640 centred on (640, 470), rotated
// by BANG, so its corners bleed off every frame edge
// and grass triangles show at the frame corners.
// Gingham checks are drawn in blanket-local space.
var BCX = 640, BCY = 470, BSIDE = 1640, BANG = Math.PI / 5, CELL = 92;

// ---- the dish table ---------------------------------------
// Exactly 4 authored centre dishes, in table order.
// Double-tap advances one step; nothing else changes.
var DCX = 620, DCY = 455;
var DISH_NAMES = ['lattice pie', 'cake', 'bread basket', 'fruit bowl'];
if (DISH_NAMES.length !== 4) throw new Error('dish table must hold exactly 4 dishes');
var dishIdx = 0;

// ---- the hands ----------------------------------------------
// Exactly 4 hands, three skin tones across them.
// x, y = wrist point in design space; rot = direction
// the fingers point (local +Y rotated by rot); sleeve
// and cuff are palette colours.
var HANDS = [
  { x: 452,  y: 150, rot: 0,             skin: SKINA, sleeve: CHECK, cuff: BLANKET },
  { x: 140,  y: 428, rot: -Math.PI / 2,  skin: SKINB, sleeve: MUG,   cuff: BLANKET },
  { x: 1152, y: 494, rot: Math.PI / 2,   skin: SKINC, sleeve: GRASS, cuff: BLANKET },
  { x: 748,  y: 762, rot: Math.PI,       skin: SKINA, sleeve: CRUST, cuff: BLANKET }
];
if (HANDS.length !== 4) throw new Error('Leaf Picnic must hold exactly 4 hands');
var skinSet = {};
for (var hi = 0; hi < HANDS.length; hi++) skinSet[HANDS[hi].skin] = true;
var skinCount = 0; for (var hk in skinSet) skinCount++;
if (skinCount !== 3) throw new Error('the 4 hands must span exactly 3 skin tones');

// ---- the pot, stream and mug ---------------------------------
// The pot hangs from its spout tip: the group is drawn
// in tip-local space and rotated about the tip.
var TIPX = 1026, TIPY = 606, POTANG = -0.30;
var MUGX = 1064, MUGY = 700;         // mug coffee surface centre
var STREAM_END = { x: 1058, y: 692 };
var NDOTS = 9;
if (NDOTS !== 9) throw new Error('coffee stream must hold exactly 9 dots');

// ---- the leaves ----------------------------------------------
// Resting leaves scattered on the blanket and grass:
// x, y, size, resting rotation, colour, sway phase.
var SCATTER = [
  { x: 268, y: 210, s: 30, rot: 0.7,  col: LEAF1, ph: 0.0 },
  { x: 1052, y: 168, s: 26, rot: 2.2, col: LEAF2, ph: 1.1 },
  { x: 180, y: 620, s: 34, rot: -0.6, col: LEAF3, ph: 2.0 },
  { x: 330, y: 760, s: 27, rot: 1.8,  col: LEAF2, ph: 0.6 },
  { x: 905, y: 250, s: 24, rot: -1.4, col: LEAF1, ph: 1.5 },
  { x: 1150, y: 380, s: 31, rot: 0.3,  col: LEAF3, ph: 2.6 },
  { x: 520, y: 130, s: 25, rot: 2.8,  col: LEAF2, ph: 0.9 },
  { x: 120, y: 330, s: 28, rot: -2.1, col: LEAF1, ph: 1.9 },
  { x: 960, y: 830, s: 29, rot: 1.2,  col: LEAF2, ph: 0.3 },
  { x: 560, y: 800, s: 26, rot: -0.9, col: LEAF3, ph: 2.3 },
  { x: 60, y: 90, s: 32, rot: 1.5,   col: LEAF3, ph: 1.3 },
  { x: 1230, y: 90, s: 27, rot: -1.8, col: LEAF1, ph: 0.8 },
  { x: 420, y: 330, s: 22, rot: 2.5,  col: LEAF3, ph: 2.9 }
];
if (SCATTER.length !== 13) throw new Error('scatter table must hold exactly 13 leaves');

// Large foreground leaves, drawn last, overlapping
// the blanket edge and frame corners.
var FG = [
  { x: 96,  y: 838, s: 58, rot: 0.9,  col: LEAF1 },
  { x: 1196, y: 806, s: 52, rot: -1.2, col: LEAF2 },
  { x: 700, y: 62,  s: 48, rot: 2.6,  col: LEAF3 }
];
if (FG.length !== 3) throw new Error('foreground table must hold exactly 3 leaves');

// Falling leaves: bx = base x, ph = phase, k = whole
// field falls per loop, m = whole sway cycles per
// loop, turns = whole tumble turns per loop.
var FALLERS = [
  { bx: 210, ph: 0.13, k: 1, m: 2, turns: 1, col: LEAF2, s: 24 },
  { bx: 480, ph: 0.57, k: 2, m: 3, turns: 2, col: LEAF1, s: 20 },
  { bx: 760, ph: 0.31, k: 1, m: 2, turns: 1, col: LEAF3, s: 26 },
  { bx: 1010, ph: 0.78, k: 2, m: 4, turns: 2, col: LEAF2, s: 21 },
  { bx: 1180, ph: 0.44, k: 1, m: 3, turns: 1, col: LEAF1, s: 23 }
];
if (FALLERS.length !== 5) throw new Error('faller table must hold exactly 5 leaves');

// Tumbling leaves: each crosses the frame exactly
// once per loop along its blanket-edge band, so the
// blanket edge sees two crossings per 24s loop.
var TUMBLERS = [
  { y: 238, ph: 0.0, dir: 1,  col: LEAF1, s: 30 },
  { y: 694, ph: 0.5, dir: -1, col: LEAF3, s: 27 }
];
if (TUMBLERS.length !== 2) throw new Error('tumbler table must hold exactly 2 leaves');

// ---- state ---------------------------------------------------
var dragging = false;
var spin = 0, spinVel = 0, flingVel = 0;
var lastPtrX = 0, lastMoveStamp = -1;
var lastTapT = -10, lastTapX = 0, lastTapY = 0;
var lastNow = -1, acc = 0;

// QA hook via the renderer's query string (?seed=...):
// dish=N starts the piece on dish N of the table.
// Default play is unaffected.
var QS = (typeof location !== 'undefined' && location.search) || '';
var dm = QS.match(/dish=(\d)/);
if (dm) dishIdx = clampInt(parseInt(dm[1], 10), 0, 3);
function clampInt(v, a, b) { return v < a ? a : (v > b ? b : v); }

// ---- small helpers --------------------------------------------
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function frac(v) { return v - Math.floor(v); }
function lerp(a, b, u) { return a + (b - a) * u; }
function ell(x, y, rx, ry, rot, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill();
}
function circ(x, y, r, col) { ell(x, y, r, r, 0, col); }
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function rr(x, y, w, h, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath(); ctx.fill();
}
function seg(x1, y1, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function curve(x1, y1, cx, cy, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke();
}
function poly(pts, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var j = 2; j < pts.length; j += 2) ctx.lineTo(pts[j], pts[j + 1]);
  ctx.closePath(); ctx.fill();
}

// ---- the leaf ---------------------------------------------------
// A five-lobed fall leaf drawn from a polar lobe
// function, with a short stem and, for the large
// leaves, a centre vein in lattice brown at flat
// alpha.
function drawLeaf(x, y, s, rot, col, vein) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  var k, th, r, lobe;
  for (k = 0; k <= 60; k++) {
    th = -Math.PI / 2 + k / 60 * Math.PI * 2;
    lobe = Math.pow(Math.abs(Math.cos(2.5 * (th + Math.PI / 2))), 2.6);
    r = s * (0.34 + 0.80 * lobe);
    var px = Math.cos(th) * r, py = Math.sin(th) * r * 0.92;
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
  if (vein) {
    ctx.save(); ctx.globalAlpha = 0.35;
    seg(0, -s * 0.55, 0, s * 0.62, Math.max(1.8, s * 0.05), LATTICE);
    ctx.restore();
  }
  seg(0, s * 0.62, 0, s * 1.0, Math.max(2.5, s * 0.09), col);
  ctx.restore();
}

// ---- the blanket --------------------------------------------------
function drawBlanket() {
  ctx.save();
  ctx.translate(BCX, BCY); ctx.rotate(BANG);
  rect(-BSIDE / 2, -BSIDE / 2, BSIDE, BSIDE, BLANKET);
  ctx.save();
  ctx.beginPath(); ctx.rect(-BSIDE / 2, -BSIDE / 2, BSIDE, BSIDE); ctx.clip();
  ctx.globalAlpha = 0.30; ctx.fillStyle = CHECK;
  var k, p;
  for (k = 0; k < 19; k++) {
    p = -BSIDE / 2 + k * CELL;
    if (k % 2 === 0) ctx.fillRect(p, -BSIDE / 2, CELL, BSIDE);
    if (k % 2 === 0) ctx.fillRect(-BSIDE / 2, p, BSIDE, CELL);
  }
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = 0.55; ctx.strokeStyle = CHECK; ctx.lineWidth = 10;
  ctx.strokeRect(-BSIDE / 2 + 34, -BSIDE / 2 + 34, BSIDE - 68, BSIDE - 68);
  ctx.restore();
  ctx.restore();
}

// ---- the dishes -----------------------------------------------------
function drawPie() {
  // Tin base, crust body, darker filling.
  ell(DCX, DCY + 12, 218, 150, 0, LATTICE);
  ell(DCX, DCY, 214, 148, 0, CRUST);
  ell(DCX, DCY, 190, 128, 0, LATTICE);
  // Woven lattice: vertical strips, horizontal
  // strips, then vertical patches redrawn at the
  // even crossings so the weave reads over/under.
  ctx.save();
  ctx.beginPath(); ctx.ellipse(DCX, DCY, 190, 128, 0, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = CRUST;
  var xs = [], ys = [], i, j, v;
  for (v = DCX - 180; v <= DCX + 180; v += 60) xs.push(v);
  for (v = DCY - 120; v <= DCY + 120; v += 60) ys.push(v);
  for (i = 0; i < xs.length; i++) ctx.fillRect(xs[i] - 20, DCY - 130, 40, 260);
  for (j = 0; j < ys.length; j++) ctx.fillRect(DCX - 192, ys[j] - 20, 384, 40);
  for (i = 0; i < xs.length; i++)
    for (j = 0; j < ys.length; j++)
      if ((i + j) % 2 === 0) ctx.fillRect(xs[i] - 20, ys[j] - 20, 40, 40);
  ctx.restore();
  // Crimped rim: a thick crust ring with lattice
  // pinches around it.
  ctx.beginPath(); ctx.ellipse(DCX, DCY, 201, 137, 0, 0, Math.PI * 2);
  ctx.strokeStyle = CRUST; ctx.lineWidth = 17; ctx.stroke();
  var k2, a;
  for (k2 = 0; k2 < 18; k2++) {
    a = k2 / 18 * Math.PI * 2;
    circ(DCX + Math.cos(a) * 201, DCY + Math.sin(a) * 137, 6.5, LATTICE);
  }
}
function drawCake() {
  ell(DCX, DCY + 16, 216, 140, 0, MUG);          // plate
  ell(DCX, DCY + 6, 196, 122, 0, CRUST);        // sponge side
  ell(DCX, DCY - 8, 172, 100, 0, CHECK);        // frosting top
  ell(DCX, DCY - 8, 62, 36, 0, BLANKET);        // cream dollop
  var k, a;
  for (k = 0; k < 6; k++) {                      // cherries on the ring
    a = k / 6 * Math.PI * 2 + 0.3;
    var cxp = DCX + Math.cos(a) * 122, cyp = DCY - 8 + Math.sin(a) * 68;
    curve(cxp, cyp - 10, cxp + 8, cyp - 24, cxp + 16, cyp - 26, 3.5, LATTICE);
    circ(cxp, cyp, 13, LEAF1);
  }
}
function drawBasket() {
  // Bread rolls behind the rim.
  var rolls = [[-112, -52], [0, -72], [112, -52]], i;
  for (i = 0; i < rolls.length; i++) {
    var rx = DCX + rolls[i][0], ry = DCY + rolls[i][1];
    ell(rx, ry, 64, 42, 0, CRUST);
    curve(rx - 26, ry - 12, rx - 8, ry - 22, rx + 12, ry - 14, 5, LATTICE);
    curve(rx - 8, ry + 6, rx + 8, ry - 4, rx + 28, ry + 2, 5, LATTICE);
  }
  // Basket body: a trapezoid woven with crust strips.
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(DCX - 200, DCY - 28); ctx.lineTo(DCX + 200, DCY - 28);
  ctx.lineTo(DCX + 158, DCY + 118); ctx.lineTo(DCX - 158, DCY + 118);
  ctx.closePath();
  ctx.fillStyle = LATTICE; ctx.fill();
  ctx.clip();
  ctx.fillStyle = CRUST;
  for (i = 0; i < 10; i++) ctx.fillRect(DCX - 200 + i * 44, DCY - 30, 20, 150);
  ctx.fillRect(DCX - 200, DCY + 16, 400, 13);
  ctx.fillRect(DCX - 200, DCY + 64, 400, 13);
  ctx.restore();
  rr(DCX - 210, DCY - 44, 420, 30, 13, CRUST);   // rim band
}
function drawBowl() {
  // The bowl opening first: a shallow rim with the
  // dark interior inside it. The fruit is drawn over
  // the opening so it sits in the bowl, and the body
  // front then tucks the fruit bottoms behind the rim.
  ell(DCX, DCY - 14, 208, 17, 0, MUG);
  ell(DCX, DCY - 14, 188, 11, 0, COFFEE);
  circ(DCX - 96, DCY - 44, 42, LEAF1);
  circ(DCX + 2, DCY - 62, 46, LEAF2);
  circ(DCX + 98, DCY - 42, 42, LEAF3);
  circ(DCX - 44, DCY - 82, 34, LEAF2);
  circ(DCX + 52, DCY - 84, 33, LEAF1);
  drawLeaf(DCX - 10, DCY - 98, 25, -0.5, GRASS, false);
  drawLeaf(DCX + 30, DCY - 92, 21, 0.7, GRASS, false);
  ctx.beginPath();
  ctx.moveTo(DCX - 208, DCY - 14);
  ctx.ellipse(DCX, DCY - 14, 208, 118, 0, 0, Math.PI);
  ctx.closePath();
  ctx.fillStyle = MUG; ctx.fill();
  poly([DCX - 54, DCY + 92, DCX + 54, DCY + 92, DCX + 68, DCY + 118, DCX - 68, DCY + 118], MUG);
}
var DISH_DRAW = [drawPie, drawCake, drawBasket, drawBowl];
if (DISH_DRAW.length !== 4) throw new Error('dish draw table must hold exactly 4 dishes');

// ---- the mug ---------------------------------------------------------
function drawMug() {
  ctx.beginPath(); ctx.arc(MUGX + 72, MUGY + 44, 25, -1.15, 1.15);
  ctx.strokeStyle = MUG; ctx.lineWidth = 13; ctx.stroke();
  rr(MUGX - 58, MUGY, 116, 88, 14, MUG);
  ell(MUGX, MUGY, 58, 14, 0, COFFEE);
}

// ---- the pot ------------------------------------------------------------
// Drawn in spout-tip-local space: the tip is (0, 0),
// the body sits up and to the right, the handle loops
// off the body's right side where the right hand grips.
function drawPot() {
  ctx.save();
  ctx.translate(TIPX, TIPY); ctx.rotate(POTANG);
  poly([30, -70, -2, -4, 6, 3, 46, -46], COFFEE);        // spout
  rr(14, -128, 108, 104, 22, COFFEE);                    // body
  ell(68, -128, 44, 13, 0, LATTICE);                     // lid
  circ(68, -139, 9, LATTICE);                            // knob
  ctx.beginPath(); ctx.arc(140, -78, 26, -1.2, 1.2);
  ctx.strokeStyle = COFFEE; ctx.lineWidth = 11; ctx.stroke();  // handle
  ctx.restore();
}

// ---- the coffee stream -----------------------------------------------------
// Nine dots pour from the spout tip to the mug. Each
// dot makes 3 whole trips per 24s loop, so the pour
// never breaks the seam; frame one catches it
// mid-pour.
function drawStream(lt) {
  var i, u, x, y;
  for (i = 0; i < NDOTS; i++) {
    u = frac(lt / 8 + i / NDOTS);
    x = lerp(TIPX, STREAM_END.x, u) + 3 * Math.sin(u * Math.PI);
    y = lerp(TIPY, STREAM_END.y, Math.pow(u, 1.35));
    circ(x, y, 4.6, COFFEE);
  }
  // A small splash where the stream lands.
  ctx.save(); ctx.globalAlpha = 0.5 + 0.2 * Math.sin(Math.PI * 2 * 3 * (lt / LOOP));
  ell(STREAM_END.x, STREAM_END.y + 2, 13, 4.5, 0, COFFEE);
  ctx.restore();
}

// ---- the hands ----------------------------------------------------------------
// A flat mitten hand in local space: the sleeve runs
// off the top (local -Y) to the wrist at (0, 0), the
// palm rounds below it, and four finger capsules of
// varied length hang from the palm with bare gaps
// between them, the notches. A thumb capsule rides
// the side.
function drawHand(h) {
  ctx.save();
  ctx.translate(h.x, h.y); ctx.rotate(h.rot);
  rr(-40, -216, 80, 198, 18, h.sleeve);          // sleeve
  rr(-43, -32, 86, 32, 11, h.cuff);              // cuff
  ell(0, 30, 37, 37, 0, h.skin);                 // palm
  var fl = [36, 47, 43, 31], fx = [-27, -9, 9, 27], i;
  for (i = 0; i < 4; i++) rr(fx[i] - 8, 46, 16, fl[i], 8, h.skin);
  ctx.save();
  ctx.translate(35, 16); ctx.rotate(0.7);
  rr(-8, -4, 16, 35, 8, h.skin);                 // thumb
  ctx.restore();
  ctx.restore();
}

// ---- draw -----------------------------------------------------------------------
function draw() {
  var lt = T % LOOP;
  rect(-2400, -2400, DW + 4800, DH + 4800, GRASS);
  drawBlanket();
  var i, lf, sway;
  for (i = 0; i < SCATTER.length; i++) {
    lf = SCATTER[i];
    sway = 0.03 * Math.sin(Math.PI * 2 * 2 * (lt / LOOP) + lf.ph);
    drawLeaf(lf.x, lf.y, lf.s, lf.rot + sway, lf.col, false);
  }
  DISH_DRAW[dishIdx]();
  drawMug();
  drawPot();
  drawStream(lt);
  for (i = 0; i < HANDS.length; i++) drawHand(HANDS[i]);
  // Tumblers: one crossing each per loop along their
  // blanket-edge bands, end over end.
  var tb, u;
  for (i = 0; i < TUMBLERS.length; i++) {
    tb = TUMBLERS[i];
    u = frac(lt / LOOP + tb.ph);
    var tx = tb.dir > 0 ? -70 + u * 1420 : 1350 - u * 1420;
    var ty = tb.y + 26 * Math.sin(Math.PI * 2 * 2 * u + tb.ph * 9);
    drawLeaf(tx, ty, tb.s, tb.dir * u * Math.PI * 8 + spin, tb.col, true);
  }
  // Fallers: whole field falls per loop, sway on
  // whole cycles, tumble on whole turns. The drag
  // spin rides on top of both airborne families.
  var fl2;
  for (i = 0; i < FALLERS.length; i++) {
    fl2 = FALLERS[i];
    var fy = -50 + frac(fl2.ph + lt / LOOP * fl2.k) * 1000;
    var fx2 = fl2.bx + 34 * Math.sin(Math.PI * 2 * fl2.m * (lt / LOOP) + fl2.ph * 7);
    var fr = Math.PI * 2 * fl2.turns * (lt / LOOP) + fl2.ph * 5 + spin;
    drawLeaf(fx2, fy, fl2.s, fr, fl2.col, true);
  }
  for (i = 0; i < FG.length; i++) drawLeaf(FG[i].x, FG[i].y, FG[i].s, FG[i].rot, FG[i].col, true);
}

// ---- step -------------------------------------------------------------------------
// Only the drag spin has state: while dragging it is
// set directly by pointer moves; after release a
// damped spring on fixed ticks returns it to exactly
// zero, snapping the last epsilon away so the leaves
// settle back onto their pure loop paths.
function step() {
  if (dragging) return;
  spinVel += (-120 * spin - 14 * spinVel) * TICK;
  spin += spinVel * TICK;
  if (Math.abs(spin) < 0.0008 && Math.abs(spinVel) < 0.008) { spin = 0; spinVel = 0; }
}

// ---- pointer: drag spins the airborne leaves, double-tap changes the dish ------------
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  dragging = true;
  spinVel = 0; flingVel = 0;
  lastPtrX = p.x; lastMoveStamp = (e.timeStamp !== undefined) ? e.timeStamp : -1;
  var dxT = p.x - lastTapX, dyT = p.y - lastTapY;
  if (T - lastTapT < 0.34 && Math.sqrt(dxT * dxT + dyT * dyT) < 60) {
    dishIdx = (dishIdx + 1) % 4;
    lastTapT = -10;
  } else {
    lastTapT = T; lastTapX = p.x; lastTapY = p.y;
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var p = toDesign(e);
  var dx = p.x - lastPtrX;
  lastPtrX = p.x;
  spin += dx * 0.0075;
  var stamp = (e.timeStamp !== undefined) ? e.timeStamp : -1;
  if (stamp > 0 && lastMoveStamp > 0 && stamp > lastMoveStamp) {
    var inst = clamp(dx * 0.0075 / ((stamp - lastMoveStamp) / 1000), -7, 7);
    flingVel = flingVel * 0.6 + inst * 0.4;
  }
  if (stamp > 0) lastMoveStamp = stamp;
});
function endPointer() {
  if (!dragging) return;
  dragging = false;
  spinVel = flingVel;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

// ---- sizing: full-bleed field, cover-fit ----------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
