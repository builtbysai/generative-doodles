<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eight Minutes — No. 8945</title>
<!-- phantom-fill-8945 -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#101312;color:#e6e2d6;overflow:hidden;
    font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif}
  #fog{position:fixed;inset:0;display:block;opacity:0;transition:opacity 2.5s ease}
  body.open #fog{opacity:1}
  .hud{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;
    padding:28px 32px 26px;transition:opacity 1.2s ease}
  body.open .hud{opacity:.92}
  .top{display:flex;justify-content:space-between;align-items:flex-start}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(26px,4vw,44px);
    line-height:1.05;color:#f2efe4}
  h1 em{font-style:italic;color:#a8b89a}
  .no{font-size:11px;letter-spacing:.28em;color:#7c8577;text-transform:uppercase;text-align:right;line-height:1.9}
  .mid{text-align:left}
  .big{font-family:Georgia,serif;font-size:clamp(64px,13vw,150px);font-style:italic;line-height:.95;
    color:#f2efe4;font-variant-numeric:tabular-nums}
  .big small{font-size:.28em;font-style:normal;letter-spacing:.3em;text-transform:uppercase;
    color:#a8b89a;font-family:"Avenir Next",Arial,sans-serif;vertical-align:middle;margin-left:.3em}
  .label{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#8a937f;margin-top:14px}
  .tide{border-top:1px solid rgba(230,226,214,.16);padding-top:16px;max-width:640px}
  .tide h2{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#7c8577;
    font-weight:600;margin-bottom:12px}
  .rows{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 28px}
  .row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;
    border-bottom:1px dotted rgba(230,226,214,.12);font-variant-numeric:tabular-nums}
  .row .t{color:#cfc9b8}
  .row .s{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#7c8577;padding-top:2px}
  .row.past{opacity:.45}
  .row.now .t{color:#dfe8c9}
  .row.now .s{color:#a8b89a}
  .foot{font-size:11px;color:#6d7568;margin-top:14px;line-height:1.6;max-width:520px}
  @media(max-width:560px){.hud{padding:20px}.rows{grid-template-columns:1fr 1fr}.foot{display:none}}
</style>
</head>
<body>
<canvas id="fog"></canvas>
<div class="hud">
  <div class="top">
    <h1>Eight<br><em>Minutes</em></h1>
    <div class="no">No. 8945<br>Fog windows · 8 min</div>
  </div>
  <div class="mid">
    <div class="big" id="big">--:--<small id="bigUnit"></small></div>
    <div class="label" id="label">until the fog returns</div>
  </div>
  <div>
    <div class="tide">
      <h2>Tide table — recent &amp; next openings</h2>
      <div class="rows" id="rows"></div>
    </div>
    <p class="foot">The fog opens three times an hour, for eight minutes at a time,
    on the clock — :00, :20, :40. The piece only exists inside a window.
    Between them, it waits, and keeps the record.</p>
  </div>
</div>
<script>
(function(){
  // Fog windows: every hour at :00–:08, :20–:28, :40–:48.
  const STARTS=[0,20,40], LEN=8;
  function windowAt(d){
    const m=d.getMinutes()+d.getSeconds()/60;
    for(const s of STARTS){
      if(m>=s && m<s+LEN) return {open:true,start:s,endsAt:s+LEN};
    }
    return {open:false};
  }
  function nextWindow(d){
    const m=d.getMinutes()+d.getSeconds()/60, h=d.getHours();
    for(const s of STARTS) if(m<s) return {h:h,start:s};
    return {h:(h+1)%24,start:STARTS[0]};
  }
  function fmt(h,m){ const hh=((h%12)||12), ap=h<12?'am':'pm';
    return hh+':'+String(m).padStart(2,'0')+ap; }
  // Test hook: force the clock. __eightMinutes.setTestDate(new Date(...)) / .clear()
  let testDate=null;
  window.__eightMinutes={
    windowAt:windowAt, nextWindow:nextWindow,
    setTestDate:function(d){ testDate=d instanceof Date?d:new Date(d); tick(); },
    clearTestDate:function(){ testDate=null; tick(); }
  };
  const now=()=> testDate?new Date(testDate.getTime()+(Date.now()-_t0)) : new Date();
  let _t0=Date.now();
  const big=document.getElementById('big'), bigUnit=document.getElementById('bigUnit'),
    label=document.getElementById('label'), rowsEl=document.getElementById('rows');
  function mmss(sec){ const m=Math.floor(sec/60), s=Math.floor(sec%60);
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
  function buildTide(d){
    // Rolling window: the last 3 openings + the next 6, so the table
    // always fits and the current window is visible.
    const wins=[];
    for(let hh=0;hh<24;hh++) for(const s of STARTS) wins.push({h:hh,s:s});
    const nowMin=d.getHours()*60+d.getMinutes();
    let idx=wins.findIndex(w=>w.h*60+w.s+LEN>nowMin);
    if(idx<0) idx=wins.length;
    const from=Math.max(0,Math.min(idx-3,wins.length-9));
    let html='';
    for(let i=from;i<Math.min(from+9,wins.length);i++){
      const w=wins[i], past=w.h*60+w.s+LEN<=nowMin;
      const isNow=w.h*60+w.s<=nowMin && nowMin<w.h*60+w.s+LEN;
      const cls=isNow?'row now':(past?'row past':'row');
      html+='<div class="'+cls+'"><span class="t">'+fmt(w.h,w.s)+' – '+fmt(w.h,w.s+LEN)+
        '</span><span class="s">'+(isNow?'open now':past?'passed':'—')+'</span></div>';
    }
    rowsEl.innerHTML=html;
  }
  function tick(){
    const d=now(), w=windowAt(d);
    document.body.classList.toggle('open',w.open);
    if(w.open){
      const remain=(w.endsAt-(d.getMinutes()+d.getSeconds()/60))*60;
      big.innerHTML=mmss(remain)+'<small>left</small>';
      label.textContent='the fog is here — it leaves at '+fmt(d.getHours(),w.endsAt);
    }else{
      const n=nextWindow(d);
      const target=new Date(d); target.setHours(n.h,n.start,0,0);
      if(target<=d) target.setHours(target.getHours()+1);
      const remain=Math.max(0,(target-d)/1000);
      big.innerHTML=mmss(remain)+'<small>to go</small>';
      label.textContent='until the fog returns at '+fmt(n.h,n.start);
    }
    buildTide(d);
  }
  tick(); setInterval(tick,1000);
  // ---- fog ----
  const cv=document.getElementById('fog'), ctx=cv.getContext('2d');
  let W,H,dpr,blobs=[];
  function resize(){
    dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    cv.width=W*dpr; cv.height=H*dpr;
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize',resize); resize();
  function blob(init){
    return { x:Math.random()*W, y:H*(.25+Math.random()*.65),
      r:120+Math.random()*260, vx:(Math.random()-.5)*14, vy:(Math.random()-.5)*6,
      a:.07+Math.random()*.10, ph:Math.random()*7 };
  }
  for(let i=0;i<26;i++) blobs.push(blob(true));
  let last=performance.now(), t=0;
  function frame(nowMs){
    const dt=Math.min((nowMs-last)/1000,.05); last=nowMs; t+=dt;
    ctx.clearRect(0,0,W,H);
    for(const b of blobs){
      b.x+=b.vx*dt; b.y+=b.vy*dt+Math.sin(t*.3+b.ph)*.08;
      if(b.x<-b.r) b.x=W+b.r; if(b.x>W+b.r) b.x=-b.r;
      if(b.y<-b.r) b.y=H+b.r; if(b.y>H+b.r) b.y=-b.r;
      const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
      g.addColorStop(0,'rgba(214,220,205,'+b.a.toFixed(3)+')');
      g.addColorStop(1,'rgba(214,220,205,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
