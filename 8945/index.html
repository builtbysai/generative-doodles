<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Eight Minutes · №8945</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0c0f16; overscroll-behavior: none;
  }
  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #cap {
    position: fixed; left: 14px; bottom: 12px; max-width: 70vw;
    font: 400 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: rgba(215, 222, 238, 0.62); letter-spacing: 0.01em;
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  #seedtag {
    position: fixed; right: 14px; bottom: 12px;
    font: 400 11px/1.4 system-ui, sans-serif;
    color: rgba(215, 222, 238, 0.38);
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="cap">Eight minutes of fog, every half hour. Between windows the piece is a countdown and a tide table of past fogs.</div>
<div id="seedtag"></div>
<script>
"use strict";
/* ============================================================
   Eight Minutes — №8945 (2026-07-08), seed 248
   From the fog activation grammar: 8 minutes of fog, every half
   hour. The piece only exists inside its windows (minutes :00-:08
   and :30-:38 of each hour) and is only a countdown between
   them. A log of observed activations persists in localStorage,
   so absence has a shape and reads like a tide table.
   Test hook: ?window=force holds a window open for inspection.
   ============================================================ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const q = new URLSearchParams(location.search);
const sm = /[?&]seed=(\d+)/.exec(location.search);
let seed = sm ? (parseInt(sm[1], 10) >>> 0) : 248;
const forceWindow = q.get("window") === "force";
const forceClosed = q.get("window") === "closed";
document.getElementById("seedtag").textContent = "seed " + seed;

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize); resize();

/* ---------- schedule ---------- */
function windowState(now) {
  if (forceWindow) return { open: true, start: now, end: now + 8 * 60000 };
  if (forceClosed) return { open: false, start: now + 23 * 60000 + 41000, end: now + 31 * 60000 + 41000 };
  const d = new Date(now);
  const m = d.getMinutes(), s = d.getSeconds(), ms = d.getMilliseconds();
  const inFirst = m < 8, inSecond = m >= 30 && m < 38;
  const open = inFirst || inSecond;
  const day = new Date(d); day.setHours(0, 0, 0, 0);
  let start, end;
  if (inFirst) { start = day.getTime() + d.getHours() * 3600000; end = start + 8 * 60000; }
  else if (inSecond) { start = day.getTime() + d.getHours() * 3600000 + 30 * 60000; end = start + 8 * 60000; }
  else if (m < 30) { start = day.getTime() + d.getHours() * 3600000 + 30 * 60000; end = start + 8 * 60000; }
  else { start = day.getTime() + (d.getHours() + 1) * 3600000; end = start + 8 * 60000; }
  return { open, start, end };
}

/* ---------- log ---------- */
const LOG_KEY = "eightminutes_log_v1";
function readLog() {
  try { return JSON.parse(localStorage.getItem(LOG_KEY) || "[]"); }
  catch (e) { return []; }
}
function writeLog(l) {
  try { localStorage.setItem(LOG_KEY, JSON.stringify(l.slice(-40))); } catch (e) {}
}
let log = readLog();
function observe(st, now) {
  const openEntry = log.length && !log[log.length - 1].end ? log[log.length - 1] : null;
  if (st.open && !openEntry) { log.push({ start: now, end: 0 }); writeLog(log); }
  else if (!st.open && openEntry) { openEntry.end = now; writeLog(log); }
}

/* ---------- fog ---------- */
const rnd = mulberry32(seed);
const sprite = document.createElement("canvas");
sprite.width = sprite.height = 96;
{
  const c = sprite.getContext("2d");
  const g = c.createRadialGradient(48, 48, 4, 48, 48, 48);
  g.addColorStop(0, "rgba(200,212,238,0.5)");
  g.addColorStop(0.6, "rgba(180,195,225,0.14)");
  g.addColorStop(1, "rgba(180,195,225,0)");
  c.fillStyle = g; c.fillRect(0, 0, 96, 96);
}
let parts = [];
function stepFog(dt, density) {
  if (Math.random() < density && parts.length < 420) {
    parts.push({
      x: Math.random() * W, y: H * (0.55 + Math.random() * 0.45),
      vx: 8 + Math.random() * 22, vy: -4 - Math.random() * 8,
      sz: 120 + Math.random() * 200, life: 0, max: 14 + Math.random() * 10
    });
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life += dt;
    if (p.life > p.max || p.x > W + 200) parts.splice(i, 1);
  }
}
function drawFog(alpha) {
  for (const p of parts) {
    const a = Math.sin(Math.PI * Math.min(1, p.life / p.max)) * alpha;
    ctx.globalAlpha = a;
    ctx.drawImage(sprite, p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz);
  }
  ctx.globalAlpha = 1;
}

function fmtDur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
  const p2 = (n) => String(n).padStart(2, "0");
  return hh > 0 ? hh + ":" + p2(mm) + ":" + p2(ss) : p2(mm) + ":" + p2(ss);
}
function fmtTime(t) {
  const d = new Date(t);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " +
    String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function drawFrame() {
  const now = Date.now();
  const st = windowState(now);
  observe(st, now);
  ctx.clearRect(0, 0, W, H);
  const pad = Math.min(W, H) * 0.06;
  const narrow = W <= 700;

  ctx.fillStyle = "rgba(215,222,238,0.92)";
  ctx.font = "600 " + Math.round(Math.min(W, H) * 0.032) + "px system-ui, sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText("№8945 · Eight Minutes", pad, pad * 1.7);

  if (st.open) {
    stepFog(1 / 60, 0.9);
    drawFog(0.5);
    ctx.fillStyle = "rgba(240,200,120,0.95)";
    ctx.font = "700 " + Math.round(Math.min(W, H) * 0.05) + "px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("FOG WINDOW · LIVE", W / 2, H * 0.3);
    ctx.fillStyle = "rgba(215,222,238,0.8)";
    ctx.font = "400 " + Math.round(Math.min(W, H) * 0.028) + "px system-ui, sans-serif";
    ctx.fillText(fmtDur(st.end - now) + " of fog remaining", W / 2, H * 0.3 + 44);
    ctx.textAlign = "left";
  } else {
    stepFog(1 / 60, 0.06);
    drawFog(0.16);
    ctx.fillStyle = "rgba(215,222,238,0.5)";
    ctx.font = "400 " + Math.round(Math.min(W, H) * 0.028) + "px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("the fog returns at " + fmtTime(st.start), W / 2, H * 0.26);
    ctx.fillStyle = "rgba(240,200,120,0.95)";
    ctx.font = "700 " + Math.round(Math.min(W, H) * 0.11) + "px system-ui, sans-serif";
    ctx.fillText(fmtDur(st.start - now), W / 2, H * 0.26 + Math.min(W, H) * 0.12);
    ctx.textAlign = "left";
    // tide table
    const lx = narrow ? pad : W * 0.5 - 190, ly = H * 0.52;
    ctx.fillStyle = "rgba(215,222,238,0.65)";
    ctx.font = "600 " + Math.round(Math.min(W, H) * 0.022) + "px system-ui, sans-serif";
    ctx.fillText("tide table of past fogs", lx, ly);
    ctx.font = "400 " + Math.round(Math.min(W, H) * 0.02) + "px system-ui, sans-serif";
    const rows = log.slice(-8).reverse();
    rows.forEach((e, i) => {
      const dur = e.end ? fmtDur(e.end - e.start) + " seen" : "open now";
      ctx.fillStyle = "rgba(215,222,238," + (0.55 - i * 0.05).toFixed(2) + ")";
      ctx.fillText(fmtTime(e.start) + "  ·  " + dur, lx, ly + 26 + i * 24);
    });
    if (!rows.length) {
      ctx.fillStyle = "rgba(215,222,238,0.4)";
      ctx.fillText("no fogs observed yet", lx, ly + 26);
    }
  }
  requestAnimationFrame(drawFrame);
}
requestAnimationFrame(drawFrame);
</script>
</body>
</html>
