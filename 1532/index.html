<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Frame Inside the Frame</title>
<style>
html, body { margin: 0; padding: 0; background: #101014; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';

// Seeded PRNG (mulberry32). No unseeded randomness anywhere.
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rand = mulberry32(1532000);

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// Loop = 120 s. Every wander frequency is a whole number of cycles per
// loop, so the wander path at t = 120 equals the path at t = 0 exactly.
var LOOP = 120;
var STEP = 2.5;
var BLEND = 1.5;

var W = 0, H = 0, phone = false;
var fieldX = 0, fieldY = 0, fieldW = 0, fieldH = 0;

function size() {
  var vw, vh;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  } else { vw = 720; vh = 720; }
  if (vw !== W || vh !== H) {
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
  }
  var sw = W, sh = H;
  if (typeof window !== 'undefined' && window.screen) {
    if (window.screen.width) sw = window.screen.width;
    if (window.screen.height) sh = window.screen.height;
  }
  phone = (Math.min(sw, sh) < 700) || (H > W * 1.15);
  if (phone) { fieldX = 0; fieldY = 0; fieldW = W; fieldH = H; }
  else {
    var side = Math.min(W, H);
    fieldX = (W - side) / 2; fieldY = (H - side) / 2; fieldW = side; fieldH = side;
  }
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function sstep(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

// Rectangle, in field fractions. About a third of the frame, centred.
// Dragging an edge resizes it; it never moves on its own.
var rect = { x: 0.32, y: 0.32, w: 0.36, h: 0.36 };

// Wandering marks. Each wander path is a sum of sines with whole cycles
// per loop, so it is periodic with the loop and fully closed-form.
var marks = [];
(function () {
  for (var i = 0; i < 10; i++) {
    marks.push({
      bx: 0.12 + 0.76 * rand(),
      by: 0.12 + 0.76 * rand(),
      ax1: 0.10 + 0.18 * rand(), ax2: 0.04 + 0.10 * rand(),
      ay1: 0.10 + 0.18 * rand(), ay2: 0.04 + 0.10 * rand(),
      kx1: 1 + Math.floor(rand() * 3), kx2: 3 + Math.floor(rand() * 4),
      ky1: 1 + Math.floor(rand() * 3), ky2: 3 + Math.floor(rand() * 4),
      px1: rand() * Math.PI * 2, px2: rand() * Math.PI * 2,
      py1: rand() * Math.PI * 2, py2: rand() * Math.PI * 2
    });
  }
})();

function wander(m, u) {
  var T = Math.PI * 2 / LOOP;
  var x = m.bx
    + m.ax1 * Math.sin(T * m.kx1 * u + m.px1)
    + m.ax2 * Math.sin(T * m.kx2 * u + m.px2);
  var y = m.by
    + m.ay1 * Math.sin(T * m.ky1 * u + m.py1)
    + m.ay2 * Math.sin(T * m.ky2 * u + m.py2);
  return { x: clamp(x, 0.04, 0.96), y: clamp(y, 0.04, 0.96) };
}

function insideRect(x, y, r) {
  return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
}

// Inside intervals for one mark against one rectangle, over a single loop.
// Computed once per rectangle geometry by sampling the closed-form wander
// path and refining each crossing by bisection. Deterministic: the same
// rectangle always yields the same intervals. An interval may start before
// 0 (wrapped) so a mark inside at loop start is handled.
var intervalCache = {};
function intervalsFor(mi, r) {
  var key = mi + '|' + r.x.toFixed(4) + ',' + r.y.toFixed(4) + ',' + r.w.toFixed(4) + ',' + r.h.toFixed(4);
  if (intervalCache[key]) return intervalCache[key];
  var m = marks[mi];
  var N = 2400, dt = LOOP / N;
  var prev = insideRect(wander(m, 0).x, wander(m, 0).y, r);
  var crossings = [];
  for (var s = 1; s <= N; s++) {
    var t = s * dt;
    var w = wander(m, t % LOOP);
    var cur = insideRect(w.x, w.y, r);
    if (cur !== prev) {
      var lo = (s - 1) * dt, hi = t;
      for (var it = 0; it < 40; it++) {
        var mid = (lo + hi) / 2;
        var wm = wander(m, mid % LOOP);
        if (insideRect(wm.x, wm.y, r) === prev) lo = mid; else hi = mid;
      }
      crossings.push({ t: (lo + hi) / 2, into: cur });
      prev = cur;
    }
  }
  var list = [];
  var open = null;
  if (prev === false && crossings.length === 0) { list = []; }
  else {
    // If inside at t = 0, the first interval opened before the loop.
    if (insideRect(wander(m, 0).x, wander(m, 0).y, r)) {
      // Find the last into-crossing of the previous loop: it is the last
      // into-crossing in this loop, shifted back one loop.
      var lastInto = null;
      for (var c = 0; c < crossings.length; c++) if (crossings[c].into) lastInto = crossings[c].t;
      open = (lastInto === null) ? -LOOP : lastInto - LOOP;
    }
    for (var j = 0; j < crossings.length; j++) {
      if (crossings[j].into) { if (open === null) open = crossings[j].t; }
      else { if (open !== null) { list.push([open, crossings[j].t]); open = null; } }
    }
    if (open !== null) list.push([open, LOOP]);
  }
  intervalCache[key] = list;
  return list;
}

// Seeded pose offset for pose index k of mark mi: a pure function of
// (mark, k), so the same pose always lands in the same place.
function poseOffset(mi, k) {
  if (k <= 0) return { x: 0, y: 0 };
  var r = mulberry32(1532000 + mi * 1000003 + k * 9176);
  return { x: (r() - 0.5) * 0.12, y: (r() - 0.5) * 0.12 };
}

// Mark state at loop-local time u: position (field fractions), inside
// flag, and the inside interval it is in (or null).
function markState(mi, u, r) {
  var m = marks[mi];
  var w = wander(m, u);
  var list = intervalsFor(mi, r);
  var iv = null;
  for (var i = 0; i < list.length; i++) {
    if (u >= list[i][0] && u < list[i][1]) { iv = list[i]; break; }
  }
  if (!iv) return { x: w.x, y: w.y, inside: false, te: 0, tx: 0 };
  var te = iv[0], tx = iv[1];
  var ew = wander(m, ((te % LOOP) + LOOP) % LOOP);
  var k = Math.floor((u - te) / STEP);
  var off = poseOffset(mi, k);
  var inset = 0.02;
  var px = clamp(ew.x + off.x, r.x + inset, r.x + r.w - inset);
  var py = clamp(ew.y + off.y, r.y + inset, r.y + r.h - inset);
  var wgt = Math.min(sstep((u - te) / BLEND), sstep((tx - u) / BLEND));
  return { x: lerp(w.x, px, wgt), y: lerp(w.y, py, wgt), inside: true, te: te, tx: tx };
}

// Drag state. Recorded events only; everything stays closed-form.
var dragMark = -1, dragMX = 0, dragMY = 0;
var dragEdge = null, dragStartX = 0, dragStartY = 0, dragRect0 = null;
var lastT = 0;

function toFrac(clientX, clientY) {
  return { x: (clientX - fieldX) / fieldW, y: (clientY - fieldY) / fieldH };
}
function onDown(e) {
  size();
  var f = toFrac(e.clientX, e.clientY);
  // Nearest mark within 0.035 field wins; else a rectangle edge within
  // 0.022 field wins. Otherwise no drag.
  var best = -1, bestD = 0.035;
  for (var i = 0; i < marks.length; i++) {
    var st = markState(i, lastT % LOOP, rect);
    var d = Math.sqrt((st.x - f.x) * (st.x - f.x) + (st.y - f.y) * (st.y - f.y));
    if (d < bestD) { bestD = d; best = i; }
  }
  if (best >= 0) {
    dragMark = best;
    dragMX = f.x; dragMY = f.y;
  } else {
    var nearL = Math.abs(f.x - rect.x) <= 0.022 && f.y >= rect.y - 0.02 && f.y <= rect.y + rect.h + 0.02;
    var nearR = Math.abs(f.x - (rect.x + rect.w)) <= 0.022 && f.y >= rect.y - 0.02 && f.y <= rect.y + rect.h + 0.02;
    var nearT = Math.abs(f.y - rect.y) <= 0.022 && f.x >= rect.x - 0.02 && f.x <= rect.x + rect.w + 0.02;
    var nearB = Math.abs(f.y - (rect.y + rect.h)) <= 0.022 && f.x >= rect.x - 0.02 && f.x <= rect.x + rect.w + 0.02;
    if (nearL || nearR || nearT || nearB) {
      dragEdge = { l: nearL, r: nearR, t: nearT, b: nearB };
      dragStartX = f.x; dragStartY = f.y;
      dragRect0 = { x: rect.x, y: rect.y, w: rect.w, h: rect.h };
    }
  }
  if (e.preventDefault) e.preventDefault();
}
function onMove(e) {
  if (dragMark < 0 && !dragEdge) return;
  size();
  var f = toFrac(e.clientX, e.clientY);
  if (dragMark >= 0) { dragMX = f.x; dragMY = f.y; }
  if (dragEdge) {
    var dx = f.x - dragStartX, dy = f.y - dragStartY;
    var r0 = dragRect0;
    var nx = r0.x, ny = r0.y, nw = r0.w, nh = r0.h;
    if (dragEdge.l) { nx = r0.x + dx; nw = r0.w - dx; }
    if (dragEdge.r) { nw = r0.w + dx; }
    if (dragEdge.t) { ny = r0.y + dy; nh = r0.h - dy; }
    if (dragEdge.b) { nh = r0.h + dy; }
    nw = clamp(nw, 0.22, 0.52); nh = clamp(nh, 0.22, 0.52);
    nx = clamp(nx, 0.05, 0.95 - nw); ny = clamp(ny, 0.05, 0.95 - nh);
    rect.x = nx; rect.y = ny; rect.w = nw; rect.h = nh;
  }
}
function onUp() { dragMark = -1; dragEdge = null; dragRect0 = null; }
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', size);
  }
  if (window.addEventListener) window.addEventListener('resize', size);
}

function draw(t) {
  size();
  lastT = t;
  var u = ((t % LOOP) + LOOP) % LOOP;

  ctx.fillStyle = '#101014';
  ctx.fillRect(0, 0, W, H);

  var rx = fieldX + rect.x * fieldW, ry = fieldY + rect.y * fieldH;
  var rw = rect.w * fieldW, rh = rect.h * fieldH;

  // Rectangle interior, slightly lighter than the field.
  ctx.fillStyle = '#1c1a20';
  ctx.fillRect(rx, ry, rw, rh);
  // Rectangle line, pale bone.
  ctx.strokeStyle = '#ddd3b8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(rx, ry);
  ctx.lineTo(rx + rw, ry);
  ctx.lineTo(rx + rw, ry + rh);
  ctx.lineTo(rx, ry + rh);
  ctx.closePath();
  ctx.stroke();

  var unit = Math.min(fieldW, fieldH) * 0.028;
  ctx.lineCap = 'round';
  var hookMarks = [];
  for (var i = 0; i < marks.length; i++) {
    var st, inside;
    if (i === dragMark) {
      inside = insideRect(dragMX, dragMY, rect);
      st = { x: dragMX, y: dragMY, inside: inside };
    } else {
      st = markState(i, u, rect);
      inside = st.inside;
    }
    var x = fieldX + st.x * fieldW;
    var y = fieldY + st.y * fieldH;
    var sc = inside ? 1.6 : 1.0;
    var col = inside ? '#ece5d3' : '#7a7568';
    ctx.strokeStyle = col;
    ctx.lineWidth = Math.max(2, unit * 0.14 * sc);
    ctx.beginPath();
    ctx.moveTo(x, y - unit * sc);
    ctx.lineTo(x, y + unit * sc);
    ctx.moveTo(x, y - unit * 0.6 * sc);
    ctx.lineTo(x - unit * 0.8 * sc, y - unit * 0.2 * sc);
    ctx.moveTo(x, y - unit * 0.6 * sc);
    ctx.lineTo(x + unit * 0.8 * sc, y - unit * 0.2 * sc);
    ctx.moveTo(x, y + unit * sc);
    ctx.lineTo(x - unit * 0.55 * sc, y + unit * 1.9 * sc);
    ctx.moveTo(x, y + unit * sc);
    ctx.lineTo(x + unit * 0.55 * sc, y + unit * 1.9 * sc);
    ctx.stroke();
    if (inside) {
      // Second-color accent: a small ochre bar above the torso.
      ctx.fillStyle = '#c98f3d';
      ctx.fillRect(x - unit * 0.5 * sc, y - unit * 1.5 * sc, unit * 1.0 * sc, Math.max(2, unit * 0.22 * sc));
    }
    hookMarks.push({ x: st.x, y: st.y, px: x, py: y, inside: inside, scale: sc, color: col });
  }

  if (typeof window !== 'undefined') {
    window.__t32 = {
      rect: { x: rect.x, y: rect.y, w: rect.w, h: rect.h },
      field: { x: fieldX, y: fieldY, w: fieldW, h: fieldH },
      marks: hookMarks
    };
  }
}

var startT = null;
function loop(ts) {
  if (startT === null) startT = ts;
  draw((ts - startT) / 1000);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
draw(0);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
