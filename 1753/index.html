<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generation Loss</title>
<style>
html, body { margin: 0; padding: 0; background: #A9A49B; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#A9A49B';
var INK = '#17150F';
var SILVER = '#E8E6E0';
var SILVER_DIM = '#CFCBC2';
var RUST = '#A6502E';
var RUST_DEEP = '#8A3E22';
var PLATE = '#B7B2A8';
var PLATE_LINE = 'rgba(23,21,15,0.55)';
var TITLE_INK = '#17150F';
var HINT_INK = '#3A352C';
var FRAME_T = 60.0;
var PASS_LEN = 6.0;
var FADE = 0.72;
var RUST_FADE = 0.88;
var RUST_PASS = 4;
var MARKS_PER_PASS = 96;
var PINNED_N = 12;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- generations are a pure function of piece time.
   passIndex(t) = floor(t / PASS_LEN); frame one t = 60 s gives
   pass 10, so generations 0..10 (eleven deep) are on the field.
   Each pass p draws from its own fixed seed table, never from
   accumulated frame state; the fade is applied by redrawing the
   deterministic pass history with alpha = FADE^age. Pass 4 is the
   rust generation: it fades at RUST_FADE^age, so it refuses to die.
   PINNED_N marks are pinned residue, drawn near full strength
   whatever their age. ---- */
function passIndexAt(t) { return Math.floor(t / PASS_LEN); }
function passMarks(p) {
  var rng = mulberry32(1753 * 7919 + p * 104729);
  var marks = [];
  var i;
  for (i = 0; i < MARKS_PER_PASS; i++) {
    marks.push({
      x: rng(), y: rng(),
      ang: rng() * TAU,
      len: 0.008 + rng() * 0.03,
      rad: 0.002 + rng() * 0.006,
      kind: Math.floor(rng() * 3),
      w: 0.5 + rng() * 1.4
    });
  }
  return marks;
}
var PASS_CACHE = {};
function marksFor(p) {
  if (!PASS_CACHE[p]) PASS_CACHE[p] = passMarks(p);
  return PASS_CACHE[p];
}
var PINNED = (function () {
  var rng = mulberry32(1753 * 31 + 7);
  var out = [];
  var i;
  for (i = 0; i < PINNED_N; i++) {
    out.push({
      x: rng(), y: rng(), ang: rng() * TAU,
      len: 0.012 + rng() * 0.028,
      kind: Math.floor(rng() * 3), w: 0.8 + rng() * 1.2,
      rust: rng() < 0.25
    });
  }
  return out;
})();
function drawMark(m, s) {
  var x = m.x * VW, y = m.y * VH;
  var len = m.len * s;
  var dx = Math.cos(m.ang) * len, dy = Math.sin(m.ang) * len;
  ctx.beginPath();
  if (m.kind === 0) {
    ctx.moveTo(x - dx, y - dy);
    ctx.lineTo(x + dx, y + dy);
  } else if (m.kind === 1) {
    ctx.moveTo(x + Math.max(m.rad * s, 1), y);
    ctx.arc(x, y, Math.max(m.rad * s, 1), 0, TAU);
  } else {
    ctx.moveTo(x - dx, y - dy);
    ctx.lineTo(x + dx, y + dy);
    ctx.moveTo(x - dy * 0.6, y + dx * 0.6);
    ctx.lineTo(x + dy * 0.6, y - dx * 0.6);
  }
  ctx.stroke();
}
function drawField(t) {
  var s = Math.min(VW, VH);
  var cur = passIndexAt(t);
  var p, age, a, marks, i, m;
  ctx.lineCap = 'round';
  /* oldest first so fresh marks land on top of the ghosts */
  for (p = 0; p <= cur; p++) {
    age = cur - p;
    marks = marksFor(p);
    if (p === RUST_PASS) {
      a = Math.pow(RUST_FADE, age);
      ctx.strokeStyle = rgba(RUST, 0.28 + 0.62 * a);
      ctx.lineWidth = Math.max(s * 0.0022, 1);
      for (i = 0; i < marks.length; i++) { m = marks[i]; ctx.lineWidth = Math.max(m.w * s / 900, 0.8); drawMark(m, s); }
      /* rust halo: a few broader, fainter rust strokes from the same pass */
      ctx.strokeStyle = rgba(RUST_DEEP, 0.22 * a + 0.06);
      ctx.lineWidth = Math.max(s * 0.004, 1.4);
      for (i = 0; i < marks.length; i += 5) { drawMark(marks[i], s); }
    } else if (age <= 1) {
      a = Math.pow(FADE, age);
      ctx.strokeStyle = rgba(INK, 0.30 + 0.60 * a);
      for (i = 0; i < marks.length; i++) { m = marks[i]; ctx.lineWidth = Math.max(m.w * s / 900, 0.8); drawMark(m, s); }
    } else {
      a = Math.pow(FADE, age);
      ctx.strokeStyle = rgba(SILVER, 0.10 + 0.55 * a);
      for (i = 0; i < marks.length; i++) { m = marks[i]; ctx.lineWidth = Math.max(m.w * s / 900, 0.8); drawMark(m, s); }
      ctx.strokeStyle = rgba(SILVER_DIM, 0.08 + 0.30 * a);
      for (i = 0; i < marks.length; i += 3) { drawMark(marks[i], s); }
    }
  }
  /* pinned residue: twelve marks that linger across generations */
  ctx.strokeStyle = rgba(INK, 0.72);
  ctx.lineWidth = Math.max(s * 0.0022, 1);
  for (i = 0; i < PINNED.length; i++) {
    m = PINNED[i];
    if (m.rust) ctx.strokeStyle = rgba(RUST, 0.85);
    else ctx.strokeStyle = rgba(INK, 0.72);
    ctx.lineWidth = Math.max(m.w * s / 900, 0.8);
    drawMark(m, s);
  }
}
function drawMargin(t) {
  var gen = passIndexAt(t);
  var smallPx = isPhone ? 11 : 12;
  var y = VH - 7;
  ctx.strokeStyle = rgba(INK, 0.55);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, y + 0.5);
  ctx.lineTo(VW, y + 0.5);
  ctx.stroke();
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('GEN ' + gen, VW - 12, y - 5);
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 15 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Generation Loss').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Generation Loss').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 30').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Generation Loss', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 30', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawField(phaseT);
  drawMargin(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    passIndexAt: function (t) { return passIndexAt(t); },
    passCount: function () { return passIndexAt(phaseT) + 1; },
    marksPerPass: function () { return MARKS_PER_PASS; },
    pinnedCount: function () { return PINNED.length; },
    fade: function () { return FADE; },
    rustFade: function () { return RUST_FADE; },
    passLen: function () { return PASS_LEN; },
    rustPass: function () { return RUST_PASS; },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 60.0 s, pass 10, GEN 10 ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
