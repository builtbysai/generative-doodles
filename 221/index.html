<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.221 Chance Cloud</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#D8D2C4; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.221 Chance Cloud (Kathy McTavish). A pointillist field of ink
// dots on warm gray paper, governed by an energy-sharing rule, never
// random static. Each dot holds energy, shares it with its near
// neighbours, and fades below a threshold; pockets of energy seeded
// into the field bloom into clusters that converge, drain, and go
// extinct on a slow thirty second breath. The few dots that hold the
// most energy burn rust. Watch only: there is nothing to touch.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#D8D2C4', INK = '#14120E', RUST = '#B4552D';
var W = 0, H = 0, phone = false;
var seed = 221221;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
var lastNow = -1, simAcc = 0;

// ---- the field --------------------------------------------------------------------------------
var dots = [], pockets = [], spacing = 30;
function buildField() {
  dots = [];
  spacing = clamp(Math.min(W, H) / 26, 24, 40);
  var cols = Math.max(2, Math.ceil(W / spacing));
  var rows = Math.max(2, Math.ceil(H / spacing));
  var jr = rng(seed + 55);
  for (var j = 0; j < rows; j++) {
    for (var i = 0; i < cols; i++) {
      dots.push({
        x: (i + 0.5) * (W / cols) + (jr() - 0.5) * spacing * 0.55,
        y: (j + 0.5) * (H / rows) + (jr() - 0.5) * spacing * 0.55,
        e: 0.12, i: i, j: j
      });
    }
  }
  // lattice neighbours (the jittered field's near neighbours)
  function at(i, j) { return (i < 0 || j < 0 || i >= cols || j >= rows) ? -1 : j * cols + i; }
  dots.forEach(function (d, ix) {
    d.nb = [];
    var cand = [at(d.i + 1, d.j), at(d.i - 1, d.j), at(d.i, d.j + 1), at(d.i, d.j - 1),
                at(d.i + 1, d.j + 1), at(d.i - 1, d.j - 1), at(d.i + 1, d.j - 1), at(d.i - 1, d.j + 1)];
    for (var q = 0; q < cand.length; q++) if (cand[q] >= 0) d.nb.push(cand[q]);
    dots[ix] = d;
  });
  pockets = [];
  for (var p = 0; p < 5; p++) pockets.push(newPocket(p * 2.2));
  // seed opening pockets of energy so the field starts alive
  for (var s = 0; s < 350; s++) stepSim(1 / 30);
}
function newPocket(age) {
  return { x: W * (0.12 + rand() * 0.76), y: H * (0.12 + rand() * 0.76),
           r: spacing * (2.2 + rand() * 2.4), age: age || 0, life: 7 + rand() * 6 };
}
// one diffusion step: share with neighbours, decay a little, drink
// from the pockets. Energy is conserved nowhere; that is the ecology.
var newE = null;
function stepSim(dt) {
  if (!newE || newE.length !== dots.length) newE = new Float32Array(dots.length);
  for (var p = 0; p < pockets.length; p++) {
    pockets[p].age += dt;
    if (pockets[p].age > pockets[p].life) pockets[p] = newPocket(0);
  }
  for (var i = 0; i < dots.length; i++) {
    var d = dots[i], sum = 0;
    for (var q = 0; q < d.nb.length; q++) sum += dots[d.nb[q]].e;
    var avg = d.nb.length ? sum / d.nb.length : d.e;
    var e = d.e + 0.10 * (avg - d.e) - 0.0016;
    for (var p2 = 0; p2 < pockets.length; p2++) {
      var pk = pockets[p2];
      var dx = d.x - pk.x, dy = d.y - pk.y;
      var dist2 = dx * dx + dy * dy;
      if (dist2 < pk.r * pk.r) {
        var fade = Math.sin(Math.PI * clamp(pk.age / pk.life, 0, 1));
        e += 0.045 * fade * (1 - Math.sqrt(dist2) / pk.r);
      }
    }
    newE[i] = clamp(e, 0, 1);
  }
  for (var i2 = 0; i2 < dots.length; i2++) dots[i2].e = newE[i2];
}

// ---- drawing -------------------------------------------------------------------------------------
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var rs = spacing / 34;
  for (var i = 0; i < dots.length; i++) {
    var d = dots[i];
    if (d.e < 0.03) continue;
    ctx.globalAlpha = clamp(d.e * 1.6, 0, 1);
    ctx.fillStyle = d.e > 0.80 ? RUST : INK;
    ctx.beginPath();
    ctx.arc(d.x, d.y, (1.5 + d.e * 1.4) * rs, 0, 6.284);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---- resize ------------------------------------------------------------------------------------------------
var built = false;
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
  if (!built) { buildField(); built = true; }
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame ------------------------------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  simAcc += dt;
  var steps = 0;
  while (simAcc >= 1 / 30 && steps < 4) { stepSim(1 / 30); simAcc -= 1 / 30; steps++; }
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
