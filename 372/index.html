<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.372 Eye-Spiral Tree</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F5EFE2; }
  canvas { display:block; touch-action:none; cursor:grab; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.372 Eye-Spiral Tree (al_kovalyova_design).
// After Olena Kovalova's vyshyvanka Tree of Life: a
// mirror-symmetric tree on cream, central trunk with
// mirrored branches grown by a recursive symmetric
// generator (depth 3), three tiers of eye-spiral
// flowers - one large at the top, two at mid height,
// three low - each flower a petal ring around an iris
// whose Archimedean spiral slowly rotates, two outline
// birds flanking the top tier, and diamond cross-stitch
// bands across the top and bottom. The symmetry is
// strict: the tree is authored as axis elements plus a
// right half, and drawn twice, the second pass under a
// mirrored transform, so the left half is the right
// half reflected, never independently computed. Drag
// across the tree sways the branches toward the pointer
// and spins the eyes faster with drag velocity; on
// release the sway returns to exactly zero and the
// spin eases back to base speed. Double-tap advances
// the iris palette through three authored palettes,
// structure untouched. Nothing is runtime random: the
// skeleton, the flower anchors, the birds, the bands
// and the palettes are all fixed data below.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#F5EFE2', GREEN = '#4A6B4F', BROWN = '#7A5C44', BIRD = '#4A2E1E';
var DW = 1280, DH = 900, AXIS = 640, BASEY = 806;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 60;
if (LOOP !== 60) throw new Error('Eye-Spiral Tree loop must be 60s');
var TICK = 1 / 60;
// Each eye completes exactly ROT_PER_LOOP whole rotations
// per 60s loop (one turn per 30s, slow and watchful).
var ROT_PER_LOOP = 2;

// ---- iris palettes ----------------------------------------
// Three authored palettes; double-tap advances. Only the
// three iris roles change (iris disc, ring, petals); the
// structure, greens, browns and ground never change.
var PALETTES = [
  { iris: '#3AA6A0', ring: '#C96A1E', petal: '#B5501E' }, // teal-ochre-coral
  { iris: '#6B3A5B', ring: '#C9A24B', petal: '#4A2A44' }, // plum-gold
  { iris: '#3E4E7E', ring: '#B5501E', petal: '#D98E4A' }  // indigo-rust
];
var palIdx = 0;
if (PALETTES.length !== 3) throw new Error('Eye-Spiral Tree needs exactly 3 iris palettes');

// ---- the branch skeleton: recursive, symmetric --------------
// Authored as segments in ABSOLUTE design coords for the
// axis and the right half. A segment is a quadratic limb:
// [x1, y1, cx, cy, x2, y2, width]. The right-half limbs
// are produced by a recursive generator that forks
// symmetric branchlets, depth 3 below each limb tip, so
// the crown has twig detail without hand-placing every
// twig. The left half is never listed: it is drawn by
// reflection (see drawTree).
var LIMBS_AXIS = [
  [640, 806, 640, 700, 640, 560, 15],  // trunk core above the flare
  [640, 545, 642, 410, 640, 280, 10],  // top stem to the crown flower
  [640, 585, 640, 560, 640, 545, 8]    // low-centre flower stem
];
var LIMBS_RIGHT = [
  [640, 660, 735, 615, 905, 522, 13],  // low limb to the low flank flower
  [640, 590, 738, 472, 845, 354, 11],  // mid limb to the mid flower
  [655, 415, 706, 322, 762, 268, 5],   // upper twig, leaf cluster
  [700, 636, 792, 668, 872, 700, 5],   // low drooping twig, leaf cluster
  [742, 498, 812, 470, 884, 428, 5],   // mid twig, leaf cluster
  [700, 262, 830, 240, 1006, 240, 5]   // bird perch twig
];
// Recursive symmetric branchlets: from each listed
// right-half limb tip (except the perch), two short
// twigs fork at fixed offsets; depth counts down from 3
// so the generator is genuinely recursive, and the fork
// offsets are data, not noise. Tips collect leaf sites.
var LEAF_SITES = []; // [x, y, angle, length] in right-half / axis space
function grow(x, y, ang, len, depth) {
  var ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
  LIMBS_RIGHT.push([x, y, x + Math.cos(ang) * len * 0.5, y + Math.sin(ang) * len * 0.5 - 6, ex, ey, Math.max(2.5, depth * 1.6)]);
  if (depth <= 1) {
    LEAF_SITES.push([ex, ey, ang - 0.55, 34]);
    LEAF_SITES.push([ex, ey, ang + 0.5, 30]);
    return;
  }
  grow(ex, ey, ang - 0.42, len * 0.72, depth - 1);
  grow(ex, ey, ang + 0.38, len * 0.72, depth - 1);
}
// Seed the recursion from three right-half limb tips.
grow(905, 522, -0.5, 52, 3);
grow(845, 354, -0.9, 46, 3);
grow(762, 268, -0.35, 40, 3);
// Fixed leaf pairs along the limbs (authored, right half).
LEAF_SITES.push([742, 600, -2.6, 36], [742, 600, -0.7, 32]);
LEAF_SITES.push([800, 560, -2.9, 32], [800, 560, -0.4, 30]);
LEAF_SITES.push([770, 452, -2.4, 34], [770, 452, -1.1, 30]);
LEAF_SITES.push([872, 700, 0.5, 34], [872, 700, 1.6, 30]);
LEAF_SITES.push([884, 428, -0.8, 32], [884, 428, 0.35, 30]);
LEAF_SITES.push([705, 330, -1.9, 30], [705, 330, -0.6, 28]);

// ---- eye-flowers --------------------------------------------
// Half list: axis flowers and right-half flowers. The full
// set is built by reflection and asserted symmetric: 3
// tiers (top 1 large, mid 2, low 3) = 6 flowers. dir
// alternates the spiral sense by tier.
var FLOWERS_HALF = [
  { x: 640, y: 185, r: 92, petals: 8, dir: 1 },   // top, large, on axis
  { x: 845, y: 352, r: 66, petals: 7, dir: -1 },  // mid right
  { x: 640, y: 505, r: 54, petals: 6, dir: 1 },   // low centre, on axis
  { x: 945, y: 522, r: 54, petals: 6, dir: 1 }    // low right
];
var FLOWERS = [];
(function () {
  var i, f;
  for (i = 0; i < FLOWERS_HALF.length; i++) {
    f = FLOWERS_HALF[i];
    FLOWERS.push(f);
    if (f.x !== AXIS) FLOWERS.push({ x: 2 * AXIS - f.x, y: f.y, r: f.r, petals: f.petals, dir: f.dir });
  }
  if (FLOWERS.length !== 6) throw new Error('Eye-Spiral Tree needs 6 eye-flowers, got ' + FLOWERS.length);
  for (i = 0; i < FLOWERS.length; i++) {
    f = FLOWERS[i];
    var found = false;
    for (var j = 0; j < FLOWERS.length; j++) {
      var g = FLOWERS[j];
      if (g.x === 2 * AXIS - f.x && g.y === f.y && g.r === f.r) found = true;
    }
    if (!found) throw new Error('eye-flower set is not mirror-symmetric');
  }
})();

// ---- birds ----------------------------------------------------
// One outline bird for the right half, perched on the
// perch twig at (975, 240) feet, facing the axis. The
// mirrored pass produces its twin. Outline only, #4A2E1E.
var BIRD = { x: 975, y: 208 };

// ---- cross-stitch bands ---------------------------------------
// Diamond bands across the top and bottom: 17 diamonds
// per band, symmetric about the axis by construction
// (centres at AXIS + k*56 for k = -8..8), each diamond
// carrying a cross-stitch X, stitch dashes above and
// below, dots between diamonds.
var BAND_YS = [52, 848];
var DIAMONDS = 17;
if (DIAMONDS !== 17) throw new Error('each band needs 17 diamonds');

// ---- motion state ----------------------------------------------
// Constant first-frame phase: T = 23.0s into the 60s
// loop, eyes mid-rotation (0.7667 of a turn through the
// double rotation), sway exactly zero, no boost. Frame
// one is drawn synchronously at this constant; the rAF
// loop advances T from the same anchor in fixed ticks.
// Frame one never reads a wall clock.
var T = 23.0;
var lastNow = -1, acc = 0;
// Sway: a shear about the trunk base. Eases toward the
// drag target while dragging; on release eases home and
// snaps to EXACTLY zero below a hair threshold.
var sway = 0, swayTarget = 0;
// Spin boost: extra eye rotation integrated from drag
// speed. boostVel eases toward a drag-derived target
// while dragging and decays to exactly zero after
// release, returning the eyes to base speed.
var boostAngle = 0, boostVel = 0, velSmooth = 0;
var dragging = false, lastPX = 0, lastPT = 0;

function spiralAngle(f) {
  return f.dir * (Math.PI * 2 * ROT_PER_LOOP * ((T % LOOP) / LOOP)) + boostAngle * f.dir;
}

// ---- drawing pieces ---------------------------------------------
function drawLimb(L) {
  ctx.strokeStyle = GREEN;
  ctx.lineWidth = L[6];
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(L[0], L[1]);
  ctx.quadraticCurveTo(L[2], L[3], L[4], L[5]);
  ctx.stroke();
}
function drawLeaf(x, y, ang, len) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.fillStyle = GREEN;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(len * 0.5, -len * 0.30, len, 0);
  ctx.quadraticCurveTo(len * 0.5, len * 0.30, 0, 0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function drawTrunk() {
  // Symmetric filled trunk with root flare, authored on
  // the axis so both mirror passes draw it identically.
  ctx.fillStyle = GREEN;
  ctx.beginPath();
  ctx.moveTo(AXIS - 22, BASEY);
  ctx.quadraticCurveTo(AXIS - 15, 680, AXIS - 7, 552);
  ctx.lineTo(AXIS + 7, 552);
  ctx.quadraticCurveTo(AXIS + 15, 680, AXIS + 22, BASEY);
  ctx.quadraticCurveTo(AXIS, BASEY - 10, AXIS - 22, BASEY);
  ctx.closePath();
  ctx.fill();
  // Cross-stitch Xs down the trunk, in band brown.
  ctx.strokeStyle = BROWN;
  ctx.lineWidth = 1.8;
  ctx.lineCap = 'round';
  for (var y = 580; y <= 776; y += 28) {
    ctx.beginPath();
    ctx.moveTo(AXIS - 5, y - 5); ctx.lineTo(AXIS + 5, y + 5);
    ctx.moveTo(AXIS + 5, y - 5); ctx.lineTo(AXIS - 5, y + 5);
    ctx.stroke();
  }
}
function drawBird(bx, by) {
  // Outline bird facing the axis (beak toward -x in
  // right-half space; the mirrored pass flips it).
  ctx.save();
  ctx.translate(bx, by);
  ctx.strokeStyle = BIRD;
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // tail fan
  ctx.beginPath();
  ctx.moveTo(24, 2); ctx.lineTo(46, -8);
  ctx.moveTo(25, 6); ctx.lineTo(47, 6);
  ctx.stroke();
  // body: back curve, belly curve
  ctx.beginPath();
  ctx.moveTo(26, 0);
  ctx.quadraticCurveTo(2, -16, -20, -12);
  ctx.quadraticCurveTo(-30, -10, -31, -2);
  ctx.quadraticCurveTo(-30, 10, -8, 13);
  ctx.quadraticCurveTo(10, 15, 26, 6);
  ctx.closePath();
  ctx.stroke();
  // head and beak
  ctx.beginPath(); ctx.arc(-27, -13, 9.5, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-35, -16); ctx.lineTo(-50, -11); ctx.lineTo(-35, -7);
  ctx.closePath(); ctx.stroke();
  // eye dot
  ctx.fillStyle = BIRD;
  ctx.beginPath(); ctx.arc(-29, -14.5, 1.7, 0, Math.PI * 2); ctx.fill();
  // wing arc
  ctx.beginPath();
  ctx.moveTo(-8, -6);
  ctx.quadraticCurveTo(6, -2, 16, 4);
  ctx.stroke();
  // legs to the perch
  ctx.beginPath();
  ctx.moveTo(-4, 14); ctx.lineTo(-5, 32);
  ctx.moveTo(7, 14); ctx.lineTo(8, 32);
  ctx.stroke();
  ctx.restore();
}
function drawFlower(f) {
  var P = PALETTES[palIdx];
  var i, a;
  // petal ring
  for (i = 0; i < f.petals; i++) {
    a = (i / f.petals) * Math.PI * 2;
    var px = f.x + Math.cos(a) * f.r * 0.70;
    var py = f.y + Math.sin(a) * f.r * 0.70;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(a);
    ctx.fillStyle = P.petal;
    ctx.strokeStyle = P.ring;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, f.r * 0.34, f.r * 0.19, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
  // iris: ring disc, iris disc
  ctx.fillStyle = P.ring;
  ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 0.50, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = P.iris;
  ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 0.41, 0, Math.PI * 2); ctx.fill();
  // the eye: an Archimedean spiral in ground cream,
  // rotated by the loop phase plus any drag boost
  var ang = spiralAngle(f);
  ctx.strokeStyle = GROUND;
  ctx.lineWidth = Math.max(2, f.r * 0.065);
  ctx.lineCap = 'round';
  ctx.beginPath();
  var turns = 4.5 * Math.PI, steps = 90;
  for (i = 0; i <= steps; i++) {
    var th = (i / steps) * turns;
    var rr = (f.r * 0.36) * (th / turns);
    var sx = f.x + Math.cos(th + ang) * rr;
    var sy = f.y + Math.sin(th + ang) * rr;
    if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
  }
  ctx.stroke();
  // pupil dot in ring colour at the spiral heart
  ctx.fillStyle = P.ring;
  ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 0.05, 0, Math.PI * 2); ctx.fill();
}
function drawBand(cy) {
  ctx.strokeStyle = BROWN;
  ctx.lineCap = 'round';
  // stitch dash lines above and below the diamond row
  ctx.lineWidth = 2;
  for (var s = -1; s <= 1; s += 2) {
    var y = cy + s * 27;
    ctx.beginPath();
    for (var x = 196; x + 10 <= 1084; x += 18) { ctx.moveTo(x, y); ctx.lineTo(x + 10, y); }
    ctx.stroke();
  }
  // diamonds with cross-stitch Xs and spacer dots
  ctx.lineWidth = 2;
  for (var k = -8; k <= 8; k++) {
    var cx = AXIS + k * 56;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 15); ctx.lineTo(cx + 21, cy); ctx.lineTo(cx, cy + 15); ctx.lineTo(cx - 21, cy);
    ctx.closePath();
    ctx.stroke();
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(cx - 8, cy - 7); ctx.lineTo(cx + 8, cy + 7);
    ctx.moveTo(cx + 8, cy - 7); ctx.lineTo(cx - 8, cy + 7);
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.fillStyle = BROWN;
    ctx.beginPath(); ctx.arc(cx, cy, 1.8, 0, Math.PI * 2); ctx.fill();
    if (k < 8) {
      ctx.beginPath(); ctx.arc(cx + 28, cy, 2.1, 0, Math.PI * 2); ctx.fill();
    }
  }
}
function drawHalfTree() {
  // The axis-and-right-half pass. Called twice: once
  // normally, once under a mirrored transform.
  var i;
  for (i = 0; i < LIMBS_RIGHT.length; i++) drawLimb(LIMBS_RIGHT[i]);
  for (i = 0; i < LEAF_SITES.length; i++) drawLeaf(LEAF_SITES[i][0], LEAF_SITES[i][1], LEAF_SITES[i][2], LEAF_SITES[i][3]);
  drawBird(BIRD.x, BIRD.y);
  for (i = 0; i < FLOWERS_HALF.length; i++) {
    if (FLOWERS_HALF[i].x !== AXIS) drawFlower(FLOWERS_HALF[i]);
  }
}
function drawTree() {
  // Sway: shear about the trunk base, applied to the
  // whole tree group so the mirror holds while leaning.
  ctx.save();
  ctx.translate(AXIS, BASEY);
  ctx.transform(1, 0, sway, 1, 0, 0);
  ctx.translate(-AXIS, -BASEY);
  drawTrunk();
  var i;
  for (i = 0; i < LIMBS_AXIS.length; i++) drawLimb(LIMBS_AXIS[i]);
  drawHalfTree();
  ctx.save();
  ctx.translate(2 * AXIS, 0);
  ctx.scale(-1, 1);
  drawHalfTree();
  ctx.restore();
  // axis flowers last, on top of both passes
  for (i = 0; i < FLOWERS_HALF.length; i++) {
    if (FLOWERS_HALF[i].x === AXIS) drawFlower(FLOWERS_HALF[i]);
  }
  ctx.restore();
}
function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-2000, -2000, DW + 4000, DH + 4000);
  drawBand(BAND_YS[0]);
  drawTree();
  drawBand(BAND_YS[1]);
}

// ---- sizing: centred fit, page ground is the cream --------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- pointer: drag sways and spins, double-tap advances the palette --
function toDesign(e) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return [((e.clientX - rect.left) - OX) / S, ((e.clientY - rect.top) - OY) / S];
}
var grab = null, downAt = 0, lastTapAt = -1000, lastTapPos = null;
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  grab = { x: p[0], y: p[1], moved: false };
  dragging = true;
  lastPX = p[0]; lastPT = T;
  velSmooth = 0;
  swayTarget = Math.max(-0.14, Math.min(0.14, (p[0] - AXIS) / 380 * 0.14));
  downAt = T;
});
canvas.addEventListener('pointermove', function (e) {
  if (!grab) return;
  var p = toDesign(e);
  if (Math.abs(p[0] - grab.x) + Math.abs(p[1] - grab.y) > 2) grab.moved = true;
  var dt = T - lastPT;
  if (dt > 0.001) {
    var v = (p[0] - lastPX) / dt; // design px per second
    velSmooth = 0.65 * velSmooth + 0.35 * v;
    lastPX = p[0]; lastPT = T;
  }
  swayTarget = Math.max(-0.14, Math.min(0.14, (p[0] - AXIS) / 380 * 0.14));
});
function endPointer(e) {
  var wasTap = false;
  if (grab) {
    wasTap = !grab.moved && (T - downAt) < 0.3;
    grab = null;
  }
  dragging = false;
  swayTarget = 0;
  if (!wasTap || !e) return;
  var p = toDesign(e);
  var dt = T - lastTapAt;
  if (dt < 0.35 && lastTapPos && Math.abs(p[0] - lastTapPos[0]) < 30 && Math.abs(p[1] - lastTapPos[1]) < 30) {
    palIdx = (palIdx + 1) % PALETTES.length;
    lastTapAt = -1000;
    lastTapPos = null;
  } else {
    lastTapAt = T;
    lastTapPos = p;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { grab = null; dragging = false; swayTarget = 0; });

function step() {
  // sway easing: toward the target while dragging,
  // homeward after release, snapping to exactly zero
  var rate = dragging ? 8 : 3;
  sway += (swayTarget - sway) * Math.min(1, TICK * rate);
  if (!dragging && Math.abs(sway) < 0.0004) sway = 0;
  // spin boost: target from drag speed while dragging,
  // zero after release; velocity eases and snaps off
  var boostTarget = dragging ? Math.min(2.6, Math.abs(velSmooth) * 0.004) : 0;
  boostVel += (boostTarget - boostVel) * Math.min(1, TICK * (dragging ? 10 : 1.5));
  if (!dragging && boostVel < 0.001) boostVel = 0;
  boostAngle += boostVel * TICK;
  velSmooth *= 0.92;
}

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
