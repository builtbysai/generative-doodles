<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sitter's Ghost</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #E8DCC3; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var GROUND = '#E8DCC3';
  var DESK = '#4A3226';
  var LAMP = '#D9261C';
  var DARK = '#1A1512';

  var PHASE = 6.0; // fixed pre-roll: first frame is fully developed and constant

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(457055);
  // load-time layout jitter, seeded, tiny: keeps the drawing from feeling stamped
  var jitter = (rng() - 0.5) * 0.004;

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (!DPR || DPR < 1) DPR = 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw(PHASE); // deterministic frame after any resize
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  // ---- legs: spring state, one per cabriole leg ----
  var legs = [
    { sway: 0, vel: 0, side: -1 },
    { sway: 0, vel: 0, side: 1 }
  ];

  function stepSprings(dt) {
    var k = 90, damp = 7.5;
    for (var i = 0; i < legs.length; i++) {
      var L = legs[i];
      var acc = -k * L.sway - damp * L.vel;
      L.vel += acc * dt;
      L.sway += L.vel * dt;
      if (Math.abs(L.sway) < 0.0004 && Math.abs(L.vel) < 0.0004) { L.sway = 0; L.vel = 0; }
    }
  }

  function roundRect(x, y, w, h, r) {
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }

  function drawLeg(leg, cx, deskTopY, D) {
    var s = leg.side;
    var swayPx = leg.sway * D * 0.16;
    var hipX = cx + s * D * 0.088 + jitter * D;
    var hipY = deskTopY + D * 0.075;
    var kneeX = cx + s * D * 0.172 + swayPx * 0.55;
    var kneeY = deskTopY + D * 0.235;
    var ankX = cx + s * D * 0.152 + swayPx;
    var ankY = deskTopY + D * 0.415;

    ctx.strokeStyle = DESK;
    ctx.fillStyle = DESK;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // thigh: hip down and out to the knee
    ctx.lineWidth = D * 0.064;
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.quadraticCurveTo(hipX + s * D * 0.045, (hipY + kneeY) / 2, kneeX, kneeY);
    ctx.stroke();

    // shin: knee down to the ankle, near vertical
    ctx.lineWidth = D * 0.049;
    ctx.beginPath();
    ctx.moveTo(kneeX, kneeY);
    ctx.quadraticCurveTo(kneeX + s * D * 0.006, (kneeY + ankY) / 2, ankX, ankY);
    ctx.stroke();

    // cabriole foot that also reads as a shoe: flat, pointing outward
    var footLen = D * 0.115, footH = D * 0.042;
    var fx = (s < 0) ? ankX - footLen + D * 0.024 : ankX - D * 0.024;
    roundRect(fx, ankY, footLen, footH, footH * 0.45);
    ctx.fill();
  }

  function draw(t) {
    if (!W || !H) return;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    // ground: flat beige field, page ground matches it
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var phone = isPhone();
    var D = Math.min(W * (phone ? 0.86 : 0.78), H * 0.92);
    var cx = W / 2;
    var deskTopY = H / 2 - D * 0.055;

    // ---- lamp glow: the only glow, breathing subtly ----
    var lampCx = cx - D * 0.335;
    var shadeCy = deskTopY - D * 0.205;
    var breathe = 0.5 + 0.5 * Math.sin(t * 0.9);
    var glowR = D * (0.150 + 0.022 * breathe);
    var grad = ctx.createRadialGradient(lampCx, shadeCy, glowR * 0.08, lampCx, shadeCy, glowR);
    grad.addColorStop(0, 'rgba(217,38,28,0.20)');
    grad.addColorStop(0.55, 'rgba(217,38,28,0.08)');
    grad.addColorStop(1, 'rgba(217,38,28,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(lampCx, shadeCy, glowR, 0, Math.PI * 2);
    ctx.fill();

    // ---- chair-back silhouette, centered behind the desk ----
    var chairW = D * 0.335, chairH = D * 0.315;
    var chairX = cx - chairW / 2, chairY = deskTopY - chairH + D * 0.012;
    ctx.fillStyle = DARK;
    roundRect(chairX, chairY, chairW, chairH, D * 0.055);
    ctx.fill();
    // slot cut out of the chair back, in ground colour, so it reads as a chair
    ctx.fillStyle = GROUND;
    roundRect(cx - chairW * 0.30, chairY + chairH * 0.20, chairW * 0.60, chairH * 0.13, chairH * 0.06);
    ctx.fill();

    // ---- legs first, so the apron covers their tops ----
    drawLeg(legs[0], cx, deskTopY, D);
    drawLeg(legs[1], cx, deskTopY, D);

    // ---- desk: apron, then the top slab ----
    ctx.fillStyle = DESK;
    roundRect(cx - D * 0.44, deskTopY + D * 0.038, D * 0.88, D * 0.082, D * 0.012);
    ctx.fill();
    roundRect(cx - D / 2, deskTopY, D, D * 0.046, D * 0.014);
    ctx.fill();

    // ---- lamp on the left of the desk ----
    var lampBaseY = deskTopY;
    var stemTopY = deskTopY - D * 0.155;
    ctx.strokeStyle = LAMP;
    ctx.lineCap = 'round';
    ctx.lineWidth = D * 0.017;
    ctx.beginPath();
    ctx.moveTo(lampCx, lampBaseY - D * 0.012);
    ctx.lineTo(lampCx, stemTopY);
    ctx.stroke();
    // base
    ctx.fillStyle = LAMP;
    roundRect(lampCx - D * 0.048, lampBaseY - D * 0.016, D * 0.096, D * 0.017, D * 0.008);
    ctx.fill();
    // shade: trapezoid, wider at the bottom
    var shTop = stemTopY - D * 0.052, shBot = stemTopY + D * 0.038;
    ctx.beginPath();
    ctx.moveTo(lampCx - D * 0.038, shTop);
    ctx.lineTo(lampCx + D * 0.038, shTop);
    ctx.lineTo(lampCx + D * 0.068, shBot);
    ctx.lineTo(lampCx - D * 0.068, shBot);
    ctx.closePath();
    ctx.fill();
  }

  // ---- drag: a fingertip through the legs sets them fidgeting ----
  var dragging = false, lastX = 0, lastY = 0, lastT = 0;

  function pointerPos(e) {
    return { x: e.clientX, y: e.clientY };
  }

  function disturb(x, y, vx) {
    var D = Math.min(W * 0.86, H * 0.92);
    var cx = W / 2;
    var deskTopY = H / 2 - D * 0.055;
    if (y < deskTopY + D * 0.05 || y > deskTopY + D * 0.52) return;
    for (var i = 0; i < legs.length; i++) {
      var legCx = cx + legs[i].side * D * 0.14;
      var prox = 1 - Math.min(1, Math.abs(x - legCx) / (D * 0.30));
      if (prox > 0) legs[i].vel += vx * 0.0035 * prox * (0.6 + 0.4 * Math.random());
    }
  }

  canvas.addEventListener('pointerdown', function (e) {
    dragging = true;
    var p = pointerPos(e);
    lastX = p.x; lastY = p.y; lastT = 0;
    disturb(p.x, p.y, 6 * (Math.random() - 0.5));
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = pointerPos(e);
    var vx = p.x - lastX;
    disturb(p.x, p.y, vx);
    lastX = p.x; lastY = p.y;
  });
  function endDrag() { dragging = false; }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', endDrag);

  // ---- run ----
  resize();
  draw(PHASE);

  var startStamp = null;
  var prevElapsed = 0;
  if (typeof requestAnimationFrame === 'function') {
    var loop = function (stamp) {
      if (startStamp === null) { startStamp = stamp; prevElapsed = 0; }
      var elapsed = (stamp - startStamp) / 1000;
      var dt = elapsed - prevElapsed;
      prevElapsed = elapsed;
      if (dt > 0.05) dt = 0.05;
      if (dt > 0) stepSprings(dt);
      draw(PHASE + elapsed);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
