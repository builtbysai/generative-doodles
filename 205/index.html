<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.205 Tun State</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0906; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.205 Tun State (Asia Ward). A tardigrade, a water bear, in
// muted amber: plump segmented body, eight clawed legs, a blunt
// cylindrical snout. The mechanic is idleness. Left alone for
// twenty seconds it presses pause the way the animal does: legs
// fold in, the body wrinkles and collapses inward over six
// seconds into the dark tun, a dehydrated blob that sits dormant
// with a single faint pulse now and then, suspended, not dead.
// A tap is rain: over four seconds the blob unfolds, legs reach
// out, the amber plumps back, and it resumes its slow amble.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0B0906';
var BODY = [200, 162, 75], SEG = [168, 131, 59], SNOUT = [212, 180, 94];
var BLOB = [92, 74, 46], CLAW = '#E8D8A8';
var W = 0, H = 0, phone = false;
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
function mixc(a, b, k) {
  return 'rgb(' + Math.round(lerp(a[0], b[0], k)) + ',' + Math.round(lerp(a[1], b[1], k)) + ',' + Math.round(lerp(a[2], b[2], k)) + ')';
}

// ---- hydration state ------------------------------------------------------------------
var T = 4, lastNow = -1;        // frame one: hydrated, mid-amble
var h = 1, hTarget = 1;
var lastTouch = 0;              // the load itself counts as company
canvas.addEventListener('pointerdown', function () {
  lastTouch = T; hTarget = 1;
});
canvas.addEventListener('pointermove', function () {
  // a passing hand is weather too, but only a touch counts as rain
});

// ---- resize ----------------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700;
  if (!phone && !(sw > 0)) phone = H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- the animal --------------------------------------------------------------------------------
// Body space: x from -1 (rear) to 1 (snout), spine runs left to right.
function spineY(x) { return Math.sin((x + 1) * 1.35) * 0.05 - 0.02; }
function bodyR(x) {
  // plump profile: thin at the rear, fat through the middle, blunt at the head
  var t = (x + 1) / 2;
  return 0.16 + Math.sin(Math.min(1, t * 1.12) * 3.1416) * 0.155;
}
function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && now > 0) {
    dt = Math.min(0.05, (now - lastNow) / 1000);
    T += dt;
  }
  lastNow = now;
  // idleness is the mechanic
  if (T - lastTouch > 20) hTarget = 0;
  if (dt > 0) {
    if (hTarget > h) h = Math.min(hTarget, h + dt / 4);        // rehydrate over 4s
    else h = Math.max(hTarget, h - dt / 6);                    // dry over 6s
  }
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var U = Math.min(W * 0.33, H * (phone ? 0.34 : 0.46));       // half body length in px
  var cx = W / 2, groundY = H * (phone ? 0.62 : 0.66);
  // dormant pulse: in the tun, a faint swell every seven seconds
  var pulse = 0;
  if (h < 0.05) {
    var pk = (T % 7) / 7;
    pulse = Math.exp(-Math.pow((pk - 0.5) * 4.4, 2)) * 0.05;
  }
  var lenK = (0.30 + 0.70 * h) * (1 + pulse);                   // spine shortens to 30%
  var plumpK = (0.52 + 0.48 * h) * (1 + pulse);
  var walk = T * 1.9;                                          // amble phase
  var bodyY = groundY - U * 0.34 * plumpK - U * 0.10;
  // the low horizon and the shadow it stands on
  ctx.strokeStyle = 'rgba(212,180,94,0.16)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W * 0.08, groundY); ctx.lineTo(W * 0.92, groundY); ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.beginPath();
  ctx.ellipse(cx, groundY + U * 0.03, U * lenK * 1.05, U * 0.07, 0, 0, 6.2832);
  ctx.fill();
  // legs: four pairs, far side first, drawn from their spine stations
  var legCol = mixc(BLOB, SEG, h);
  for (var side = 0; side < 2; side++) {
    for (var li = 0; li < 4; li++) {
      var lx = -0.62 + li * 0.42;
      var sx = cx + lx * U * lenK;
      var sy = bodyY + spineY(lx) * U + bodyR(lx) * U * plumpK * 0.55;
      var gait = Math.sin(walk - li * 1.05 + side * 0.5) * h;
      var ext = 0.22 + 0.78 * h;                               // legs fold to stubs
      var kneeX = sx + (0.05 + gait * 0.05) * U * ext + (side ? U * 0.03 : -U * 0.01);
      var kneeY = sy + U * 0.16 * ext;
      var footX = kneeX + (0.1 + gait * 0.09) * U * ext;
      var footY = groundY;
      ctx.strokeStyle = legCol;
      ctx.lineWidth = Math.max(1.6, U * 0.045 * (0.5 + 0.5 * h));
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(kneeX, kneeY);
      ctx.lineTo(footX, footY);
      ctx.stroke();
      // the claws: three small pale strokes at each foot that is out
      if (h > 0.25) {
        ctx.strokeStyle = CLAW;
        ctx.lineWidth = Math.max(1, U * 0.014);
        for (var ci = -1; ci <= 1; ci++) {
          ctx.beginPath();
          ctx.moveTo(footX, footY);
          ctx.lineTo(footX + (0.045 + ci * 0.02) * U * h, footY + 0.028 * U * h);
          ctx.stroke();
        }
      }
    }
  }
  // body: a chain of overlapping segment ellipses along the spine
  var N = 16;
  for (var i = 0; i < N; i++) {
    var bx = -1 + (i / (N - 1)) * 2;
    var px = cx + bx * U * lenK;
    var py = bodyY + spineY(bx) * U + Math.sin(walk * 0.5 + bx * 2) * U * 0.006 * h;
    var r = bodyR(bx) * U * plumpK;
    ctx.fillStyle = i % 2 ? mixc(BLOB, BODY, h) : mixc(BLOB, SEG, h);
    ctx.beginPath();
    ctx.ellipse(px, py, r * 0.62, r, 0, 0, 6.2832);
    ctx.fill();
  }
  // wrinkles: crease arcs that arrive as the water leaves,
  // strongest in the last of the drying, still ghosting the tun
  var wAmt = clamp((0.75 - h) / 0.6, 0, 1);
  if (wAmt > 0.02) {
    ctx.strokeStyle = 'rgba(11,9,6,' + (0.5 * wAmt).toFixed(3) + ')';
    ctx.lineWidth = Math.max(1, U * 0.012);
    for (var wi = 0; wi < 7; wi++) {
      var wx = -0.8 + wi * 0.27;
      var wy = bodyY + spineY(wx) * U;
      var wr = bodyR(wx) * U * plumpK;
      ctx.beginPath();
      ctx.ellipse(cx + wx * U * lenK, wy, wr * 0.34, wr * 0.92, 0, -0.9, 0.9);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(cx + wx * U * lenK, wy, wr * 0.34, wr * 0.92, 0, 3.1416 - 0.9, 3.1416 + 0.9);
      ctx.stroke();
    }
  }
  // the snout: a blunt cylinder at the head, with its dark mouth ring
  var hx = cx + 1.0 * U * lenK, hy = bodyY + spineY(1) * U;
  var sr = bodyR(1) * U * plumpK;
  ctx.fillStyle = mixc(BLOB, SNOUT, h);
  ctx.beginPath();
  ctx.ellipse(hx + sr * 0.34 * h, hy, sr * (0.34 + 0.3 * h), sr * 0.62, 0, 0, 6.2832);
  ctx.fill();
  if (h > 0.3) {
    ctx.strokeStyle = 'rgba(11,9,6,0.55)';
    ctx.lineWidth = Math.max(1, U * 0.012);
    ctx.beginPath();
    ctx.ellipse(hx + sr * (0.34 * h + 0.3 + 0.3 * h) * 0.92, hy, sr * 0.1, sr * 0.3, 0, 0, 6.2832);
    ctx.stroke();
  }
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
