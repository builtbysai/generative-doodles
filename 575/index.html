<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Sociedad del Cansancio, Leída por Cato</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#F5F0E0; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

/* ---------- palette (strict, PP7) ---------- */
var INK = '#1A1A1A', CATO = '#F5F2EA', PINK = '#F2A7C3',
    GLOW = '#7AB8D9', YEL = '#F5D90A', PAPER = '#F5F0E0';
var HAND = '"Segoe Print","Bradley Hand","Comic Sans MS","Trebuchet MS",sans-serif';

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rng = mulberry32(575069);

/* ---------- precomputed paper speckle (seeded data, drawn directly) ---------- */
var speckles = [];
for (var si = 0; si < 200; si++){
  speckles.push({ x: rng()*1000, y: rng()*1000, r: 0.8 + rng()*1.3, a: 0.03 + rng()*0.05 });
}

/* ---------- deterministic wobble (hash of position, frame-stable) ---------- */
function wob(x, y){ return Math.sin(x*0.121 + y*0.317) * 2.4; }
function wob2(x, y){ return Math.cos(x*0.213 - y*0.149) * 2.4; }

/* ---------- path helpers ---------- */
function pathFrom(pts, close){
  ctx.beginPath();
  ctx.moveTo(pts[0][0] + wob(pts[0][0], pts[0][1]), pts[0][1] + wob2(pts[0][0], pts[0][1]));
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0] + wob(pts[i][0], pts[i][1]), pts[i][1] + wob2(pts[i][0], pts[i][1]));
  if (close) ctx.closePath();
}
function strokePts(pts, w, close, col){
  ctx.save(); ctx.strokeStyle = col || INK; ctx.lineWidth = w || 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  pathFrom(pts, close); ctx.stroke(); ctx.restore();
}
function fillPts(pts, col, close){
  ctx.save(); ctx.fillStyle = col; pathFrom(pts, close); ctx.fill(); ctx.restore();
}
function circP(cx, cy, r, n){ var p = [], i, a; n = n || 28; for (i = 0; i < n; i++){ a = i/n*Math.PI*2; p.push([cx + Math.cos(a)*r, cy + Math.sin(a)*r]); } return p; }
function ellP(cx, cy, rx, ry, n){ var p = [], i, a; n = n || 30; for (i = 0; i < n; i++){ a = i/n*Math.PI*2; p.push([cx + Math.cos(a)*rx, cy + Math.sin(a)*ry]); } return p; }
function circle(cx, cy, r, fill, w, col){
  if (fill){ fillPts(circP(cx, cy, r), fill, true); }
  if (w){ strokePts(circP(cx, cy, r), w, true, col); }
}
function ellipse(cx, cy, rx, ry, fill, w, col){
  if (fill){ fillPts(ellP(cx, cy, rx, ry), fill, true); }
  if (w){ strokePts(ellP(cx, cy, rx, ry), w, true, col); }
}
function rrect(x, y, w, h, r){
  var pts = [], i, t;
  var cs = [[x+r, y+r, -Math.PI, -Math.PI/2], [x+w-r, y+r, -Math.PI/2, 0], [x+w-r, y+h-r, 0, Math.PI/2], [x+r, y+h-r, Math.PI/2, Math.PI]];
  for (var c = 0; c < 4; c++){ for (i = 0; i <= 4; i++){ t = cs[c][2] + (cs[c][3]-cs[c][2]) * i/4; pts.push([cs[c][0] + Math.cos(t)*r, cs[c][1] + Math.sin(t)*r]); } }
  return pts;
}
function rr(x, y, w, h, r, fill, lw, col){
  if (fill){ fillPts(rrect(x, y, w, h, r), fill, true); }
  if (lw){ strokePts(rrect(x, y, w, h, r), lw, true, col); }
}
function ear(x, y, s, dir){ /* triangle ear, dir -1 left +1 right */
  return [[x, y], [x + dir*s*0.9, y - s*0.25], [x + dir*s*0.25, y - s]];
}
function txt(str, x, y, size, weight, align, col, alpha){
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.fillStyle = col || INK; ctx.font = (weight || 700) + ' ' + size + 'px ' + HAND;
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y); ctx.restore();
}

/* ---------- the wobbly panel frame (stage 1000x1000) ---------- */
var FRAME = { x: 48, y: 48, w: 904, h: 904, r: 30 };
function drawFrame(){
  strokePts(rrect(FRAME.x, FRAME.y, FRAME.w, FRAME.h, FRAME.r), 5.5, true);
}
function clipPanel(){
  ctx.save();
  pathFrom(rrect(FRAME.x + 4, FRAME.y + 4, FRAME.w - 8, FRAME.h - 8, FRAME.r - 4), true);
  ctx.clip();
}
function unclip(){ ctx.restore(); }

/* ---------- Cato parts ---------- */
/* eyes: mode 'closed' | 'dots' | 'wide' | 'half'; look = [dx,dy] pupil offset */
function catoEyes(x, y, gap, mode, look){
  var lx = x - gap, rx = x + gap, i;
  if (mode === 'closed'){
    for (i = 0; i < 2; i++){ var ex = i ? rx : lx;
      ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(ex, y - 4, 11, Math.PI*1.12, Math.PI*1.88); ctx.stroke(); ctx.restore();
    }
  } else if (mode === 'half'){
    for (i = 0; i < 2; i++){ var hx = i ? rx : lx;
      strokePts([[hx - 12, y], [hx + 12, y]], 3.4, false);
      circle(hx, y + 7, 3.4, INK, 0);
    }
  } else if (mode === 'wide'){
    for (i = 0; i < 2; i++){ var wx = i ? rx : lx;
      circle(wx, y, 17, '#FFFFFF', 3.2);
      circle(wx + (look ? look[0] : 0), y + (look ? look[1] : 0), 6.4, INK, 0);
    }
  } else { /* dots */
    for (i = 0; i < 2; i++){ var dx2 = i ? rx : lx;
      circle(dx2 + (look ? look[0] : 0), y + (look ? look[1] : 0), 5.2, INK, 0);
    }
  }
}
function catoFace(x, y, mode, look, mouthDy){
  catoEyes(x, y, 30, mode, look);
  /* nose + flat deadpan mouth */
  strokePts([[x - 5, y + 16], [x + 5, y + 16]], 2.8, false);
  strokePts([[x - 15, y + 34 + (mouthDy || 0)], [x + 15, y + 34 + (mouthDy || 0)]], 3.4, false);
  /* whiskers */
  strokePts([[x - 52, y + 12], [x - 92, y + 6]], 2.2, false);
  strokePts([[x - 52, y + 26], [x - 90, y + 32]], 2.2, false);
  strokePts([[x + 52, y + 12], [x + 92, y + 6]], 2.2, false);
  strokePts([[x + 52, y + 26], [x + 90, y + 32]], 2.2, false);
}

/* THE TAIL: a separate character. Articulated chain rising from a base point,
   ending in its own head with its own eyes and eyeline. Sways on its own phase. */
function drawTail(bx, by, t, opt){
  opt = opt || {};
  var len = opt.len || 250, rise = opt.rise || 190;
  var sway = Math.sin(t * 1.35 + (opt.phase || 0)) * 16;
  var sway2 = Math.sin(t * 1.35 + (opt.phase || 0) + 0.7) * 10;
  var pts = [], i, f, x, y;
  for (i = 0; i <= 5; i++){
    f = i / 5;
    x = bx + Math.sin(f * 1.9) * 34 + sway * f * f + f * (opt.lean || 30);
    y = by - rise * f + Math.sin(f * Math.PI) * -12;
    pts.push([x, y]);
  }
  /* chain body: thick tapered strokes */
  for (i = 1; i < pts.length; i++){
    ctx.save(); ctx.strokeStyle = INK; ctx.lineCap = 'round';
    ctx.lineWidth = 21 - i * 1.6;
    ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    ctx.strokeStyle = CATO; ctx.lineWidth = 13 - i * 1.2;
    ctx.beginPath(); ctx.moveTo(pts[i-1][0], pts[i-1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
    ctx.restore();
  }
  /* tail head */
  var tip = pts[pts.length - 1];
  circle(tip[0], tip[1] - 8, 27, CATO, 3.6);
  fillPts(ear(tip[0] - 20, tip[1] - 26, 17, -1), CATO, true); strokePts(ear(tip[0] - 20, tip[1] - 26, 17, -1), 3, true);
  fillPts(ear(tip[0] + 20, tip[1] - 26, 17, 1), CATO, true); strokePts(ear(tip[0] + 20, tip[1] - 26, 17, 1), 3, true);
  /* tail eyes: their own eyeline; pink in panel 3 */
  var look = opt.look || [0, 0], pinkEyes = !!opt.pinkEyes;
  var e1 = [tip[0] - 11, tip[1] - 12], e2 = [tip[0] + 11, tip[1] - 12];
  if (pinkEyes){
    circle(e1[0], e1[1], 8.6, PINK, 2.8);
    circle(e2[0], e2[1], 8.6, PINK, 2.8);
    circle(e1[0] + look[0], e1[1] + look[1], 3.4, INK, 0);
    circle(e2[0] + look[0], e2[1] + look[1], 3.4, INK, 0);
  } else if (opt.sleepy){
    strokePts([[e1[0] - 8, e1[1]], [e1[0] + 8, e1[1]]], 3, false);
    strokePts([[e2[0] - 8, e2[1]], [e2[0] + 8, e2[1]]], 3, false);
  } else {
    circle(e1[0] + look[0], e1[1] + look[1], 5, INK, 0);
    circle(e2[0] + look[0], e2[1] + look[1], 5, INK, 0);
  }
  /* tail mouth: small flat line, unimpressed */
  strokePts([[tip[0] - 8, tip[1] + 8], [tip[0] + 8, tip[1] + 8]], 2.8, false);
  return tip;
}

/* ---------- PANEL 1: asleep on the pink, with the book ---------- */
function panel1(t){
  txt('LEÍDO POR: CATO Y SU COLA', 500, 128, 47, 700, 'center');
  /* pink surface */
  rr(104, 438, 792, 448, 36, PINK, 4);
  strokePts([[140, 846], [860, 846]], 2.4, false);
  /* the book, beside the paws */
  ctx.save(); ctx.translate(664, 742); ctx.rotate(0.06);
  rr(-84, -56, 168, 112, 8, CATO, 3.6);
  strokePts([[0, -52], [0, 52]], 2.6, false);
  strokePts([[-66, -26], [-16, -26]], 2.4, false); strokePts([[-66, -6], [-16, -6]], 2.4, false); strokePts([[-66, 14], [-16, 14]], 2.4, false);
  strokePts([[16, -26], [66, -26]], 2.4, false); strokePts([[16, -6], [66, -6]], 2.4, false); strokePts([[16, 14], [56, 14]], 2.4, false);
  ctx.restore();
  /* Cato lying, loafed long */
  ellipse(452, 690, 218, 92, CATO, 4);
  /* haunch shading line */
  strokePts([[560, 622], [592, 690], [566, 756]], 2.6, false);
  /* front paws stretched */
  ellipse(268, 756, 52, 17, CATO, 3.4);
  /* head resting low, left */
  fillPts(ear(238, 606, 44, -1), CATO, true); strokePts(ear(238, 606, 44, -1), 3.4, true);
  fillPts(ear(330, 600, 44, 1), CATO, true); strokePts(ear(330, 600, 44, 1), 3.4, true);
  circle(284, 652, 66, CATO, 4);
  catoFace(284, 644, 'closed', null, 2);
  /* sleep drifting up */
  ctx.save(); ctx.globalAlpha = 0.75;
  txt('z', 200, 536, 30, 700, 'center');
  txt('z', 176, 486, 40, 700, 'center');
  txt('z', 146, 402, 52, 700, 'center');
  ctx.restore();
  /* the tail, awake on its own, watching the room */
  drawTail(636, 700, t, { rise: 218, lean: 56, look: [2, 1] });
}

/* ---------- PANEL 2: the bird shouts the thesis ---------- */
function panel2(t){
  /* ground */
  strokePts([[92, 838], [908, 838]], 3, false);
  /* Cato sitting small, looking up */
  ellipse(322, 756, 118, 84, CATO, 4);
  fillPts(ear(256, 648, 42, -1), CATO, true); strokePts(ear(256, 648, 42, -1), 3.4, true);
  fillPts(ear(302, 642, 42, 1), CATO, true); strokePts(ear(302, 642, 42, 1), 3.4, true);
  circle(278, 690, 62, CATO, 4);
  catoFace(278, 676, 'dots', [3, -4], 0);
  /* the tail beside him, also watching the bird */
  drawTail(428, 792, t, { rise: 240, lean: 40, look: [4, -4] });
}
function panel2Bird(t){
  /* bird crosses, drawn AFTER the frame so it breaks the border */
  var bx = -190 + ((t * 105 + 330) % 1390);
  var by = 268 + Math.sin(t * 2.2) * 16;
  var flap = Math.floor(t * 7) % 3;              /* 3-frame flap */
  var wang = [-0.95, -0.1, 0.65][flap];
  ctx.save(); ctx.translate(bx, by);
  /* far wing */
  ctx.save(); ctx.rotate(wang * 0.7 + 0.5);
  fillPts([[0, 0], [62, -16], [16, 14]], INK, true);
  ctx.restore();
  /* tail feathers */
  fillPts([[-58, 2], [-104, -14], [-96, 8], [-106, 22], [-56, 16]], INK, true);
  /* body + head */
  ellipse(0, 0, 66, 27, INK, 0);
  circle(58, -16, 25, INK, 0);
  fillPts([[78, -20], [112, -12], [78, -6]], INK, true);   /* beak */
  circle(64, -20, 4.6, PAPER, 0);                          /* eye */
  /* near wing */
  ctx.save(); ctx.rotate(wang);
  fillPts([[2, 4], [74, 30], [20, 30]], INK, true);
  ctx.restore();
  ctx.restore();
  /* the shout, in a burst that overlaps the top border */
  var cx = 618, cy = 118, spikes = [], i, a, rad;
  for (i = 0; i < 28; i++){
    a = i / 28 * Math.PI * 2;
    rad = (i % 2 === 0) ? 1 : 0.86;
    spikes.push([cx + Math.cos(a) * 268 * rad, cy + Math.sin(a) * 96 * rad]);
  }
  fillPts(spikes, '#FFFFFF', true); strokePts(spikes, 3.6, true);
  txt('LA VIOLENCIA', cx, cy - 34, 35, 700, 'center');
  txt('DE LA DESTRUCCIÓN', cx, cy + 4, 35, 700, 'center');
  txt('SUAVE', cx, cy + 42, 35, 700, 'center');
}

/* ---------- PANEL 3: the phone; the tail watches, pink-eyed ---------- */
function panel3(t){
  /* pink cushion */
  ellipse(492, 806, 252, 46, PINK, 4);
  /* tail first (behind body on the right) */
  drawTail(636, 742, t, { rise: 300, lean: 84, pinkEyes: true, look: [-3, 3] });
  /* body upright */
  ellipse(492, 668, 148, 142, CATO, 4);
  /* head */
  fillPts(ear(408, 466, 50, -1), CATO, true); strokePts(ear(408, 466, 50, -1), 3.6, true);
  fillPts(ear(480, 462, 50, 1), CATO, true); strokePts(ear(480, 462, 50, 1), 3.6, true);
  circle(444, 520, 76, CATO, 4);
  catoFace(444, 508, 'wide', [0, 5], 4);
  /* phone glow */
  ctx.save(); ctx.globalAlpha = 0.35; circle(492, 726, 108, GLOW, 0); ctx.restore();
  ctx.save(); ctx.globalAlpha = 0.55;
  strokePts([[408, 640], [372, 606]], 4, false, GLOW);
  strokePts([[576, 640], [612, 606]], 4, false, GLOW);
  strokePts([[492, 606], [492, 566]], 4, false, GLOW);
  ctx.restore();
  /* the phone, clutched */
  ctx.save(); ctx.translate(492, 726); ctx.rotate(-0.03);
  rr(-52, -84, 104, 168, 14, INK, 0);
  rr(-40, -62, 80, 106, 6, GLOW, 0);
  circle(0, 62, 8, CATO, 0);
  strokePts([[-26, -38], [26, -38]], 4, false, '#FFFFFF');
  strokePts([[-26, -14], [12, -14]], 4, false, '#FFFFFF');
  ctx.restore();
  /* paws clutching the sides */
  ellipse(428, 716, 20, 34, CATO, 3.4);
  ellipse(556, 716, 20, 34, CATO, 3.4);
}

/* ---------- PANEL 4: the floor, the notifications, the refusal ---------- */
var notifSpots = [];
(function(){
  var r2 = mulberry32(99173);
  var spots = [
    [182, 300], [330, 214], [770, 300], [818, 452], [178, 486], [798, 600],
    [196, 640], [700, 168], [520, 128], [182, 170], [822, 180], [640, 716],
    [256, 100], [452, 236], [814, 712], [182, 762]
  ];
  for (var i = 0; i < spots.length; i++){
    notifSpots.push({ x: spots[i][0], y: spots[i][1], rot: (r2()*2 - 1) * 0.09 });
  }
})();
var pileBase = 0;   /* accumulated drag pile, 0..1, kept on release */
function panel4(t, dragPile){
  var pile = Math.min(1, pileBase + dragPile);
  var spawned = Math.min(6, 2 + Math.floor(t / 1.5));
  var extra = Math.floor(pile * 10);
  var count = Math.min(notifSpots.length, spawned + extra);
  var sink = Math.min(54, count * 3.4) + pile * 26;
  /* floor */
  strokePts([[80, 828], [920, 828]], 3.2, false);
  /* thought bubble: the refusal. Fill bumps, stroke them, refill smaller
     so only the outer rim of the stroke survives as the cloud outline. */
  var bx = 626, by = 268, i;
  var bumps = [[0, 0, 116], [-94, -26, 62], [90, -32, 68], [-106, 24, 56], [104, 22, 60], [-48, 50, 62], [52, 52, 64]];
  for (i = 0; i < bumps.length; i++) circle(bx + bumps[i][0], by + bumps[i][1], bumps[i][2], '#FFFFFF', 0);
  for (i = 0; i < bumps.length; i++) circle(bx + bumps[i][0], by + bumps[i][1], bumps[i][2], null, 3.4);
  for (i = 0; i < bumps.length; i++) circle(bx + bumps[i][0] * 0.92, by + bumps[i][1] * 0.92, bumps[i][2] * 0.9, '#FFFFFF', 0);
  ellipse(bx, by, 148, 78, '#FFFFFF', 0);
  txt('PREFERIRÍA NO', bx, by - 22, 33, 700, 'center');
  txt('HACERLO...', bx, by + 24, 33, 700, 'center');
  /* thought trail down to Cato */
  circle(528, 420, 13, '#FFFFFF', 3);
  circle(500, 462, 9, '#FFFFFF', 3);
  /* the tail, flat on the floor, eyes shut: even it is done */
  drawTail(560, 800 + sink * 0.4, t, { rise: 60, lean: 120, sleepy: true, phase: 2.1 });
  /* Cato sunk on the floor */
  var cy = 736 + sink;
  ellipse(392, cy, 178, 62, CATO, 4);
  fillPts(ear(252, cy - 92, 38, -1), CATO, true); strokePts(ear(252, cy - 92, 38, -1), 3.2, true);
  fillPts(ear(312, cy - 96, 38, 1), CATO, true); strokePts(ear(312, cy - 96, 38, 1), 3.2, true);
  circle(282, cy - 44, 58, CATO, 4);
  catoFace(282, cy - 52, 'half', null, 6);
  ellipse(520, cy + 40, 56, 14, CATO, 3.2);
  /* notifications piling up */
  for (i = 0; i < count; i++){
    var s = notifSpots[i];
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    rr(-118, -25, 236, 50, 12, YEL, 3.4);
    txt('BEEP BEEP BEEP!', 0, 1, 25, 700, 'center');
    ctx.restore();
  }
}

/* ---------- state & draw ---------- */
var panel = 0;           /* 0..3 */
var curT = 0;
var panelT0 = 0;         /* curT when the current panel arrived */
var viewW = 300, viewH = 300, dpr = 1;
var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : { width: 300, height: 300 };
var isPhone = Math.min(scr.width, scr.height) < 700;
if (!isPhone && viewH > viewW * 1.15 && Math.min(viewW, viewH) < 700) isPhone = true;

function draw(){
  canvas.style.width = viewW + 'px'; canvas.style.height = viewH + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, canvas.width, canvas.height);
  var s = Math.min(viewW/1000, viewH/1000);
  var ox = (viewW - 1000*s)/2, oy = (viewH - 1000*s)/2;
  ctx.setTransform(dpr*s, 0, 0, dpr*s, dpr*ox, dpr*oy);
  var i;
  for (i = 0; i < speckles.length; i++){ var sp = speckles[i]; ctx.save(); ctx.globalAlpha = sp.a; ctx.fillStyle = INK; ctx.fillRect(sp.x, sp.y, sp.r, sp.r); ctx.restore(); }
  var pt = curT - panelT0;
  var dragPile = (pdown && panel === 3 && pdown.dy > 0) ? Math.min(1, pdown.dy / 300) : 0;
  clipPanel();
  if (panel === 0) panel1(pt);
  else if (panel === 1) panel2(pt);
  else if (panel === 2) panel3(pt);
  else panel4(pt, dragPile);
  unclip();
  drawFrame();
  if (panel === 1) panel2Bird(pt);
  /* counter + hint */
  txt((panel + 1) + ' / 4', 84, 918, 24, 700, 'left', INK, 0.55);
  txt(panel === 3 ? 'drag' : 'tap', 916, 918, 24, 700, 'right', INK, 0.55);
}

/* ---------- sizing (Visual Viewport API) ---------- */
function resize(){
  var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
  viewW = vv ? vv.width : window.innerWidth;
  viewH = vv ? vv.height : window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  draw();
}
if (typeof window !== 'undefined' && window.visualViewport) window.visualViewport.addEventListener('resize', resize);
if (typeof window !== 'undefined') window.addEventListener('resize', resize);

/* ---------- interaction: tap advances; panel 4 drag-down piles up ---------- */
function toStage(e){
  var r = { left: 0, top: 0 };
  if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect();
  var s = Math.min(viewW/1000, viewH/1000);
  return { x: ((e.clientX - r.left) - (viewW - 1000*s)/2) / s, y: ((e.clientY - r.top) - (viewH - 1000*s)/2) / s };
}
var pdown = null;
canvas.addEventListener('pointerdown', function(e){
  var p = toStage(e);
  pdown = { x: p.x, y: p.y, dy: 0, moved: false };
});
canvas.addEventListener('pointermove', function(e){
  if (!pdown) return;
  var p = toStage(e);
  pdown.dy = p.y - pdown.y;
  if (Math.abs(p.x - pdown.x) > 9 || Math.abs(pdown.dy) > 9) pdown.moved = true;
  if (panel === 3) draw();
});
function endPointer(){
  if (!pdown) return;
  if (panel === 3 && pdown.dy > 26){
    /* drag-down on panel 4: the pile grows and stays */
    pileBase = Math.min(1, pileBase + Math.min(1, pdown.dy / 300));
  } else if (!pdown.moved){
    panel = (panel + 1) % 4;
    panelT0 = curT;
  }
  pdown = null;
  draw();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function(){ pdown = null; });

/* ---------- go: synchronous first frame at constant phase, then the loop ---------- */
resize();
var PHASE0 = 0;
curT = PHASE0; panelT0 = PHASE0;
draw();
var baseTs = null;
function loop(ts){
  if (baseTs === null) baseTs = ts;
  curT = PHASE0 + (ts - baseTs) / 1000;
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
</script>
</body>
