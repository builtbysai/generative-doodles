<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>A Space for Reflection</title>
<style>
  html, body { margin: 0; padding: 0; background: #101214; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1246 "A Space for Reflection" - Adan De La Garza study block ADG7.
   After his 2012 room of mirrors and a rotating LRAD speaker: the sound
   bounces off the mirrored surfaces filling the space, and since the
   speakers rotate, the sound moves in a way that can be disorienting or
   pleasing. Here the beam is SOUND made spatial: an amber cone sweeps the
   room on a slow 60-second rotation, bounces off three tall mirror planes
   (thinner and brighter each bounce), and every bounce point sheds
   expanding teal sound-rings across the floor.
   Ships silent by house rule: the prompt's spatialized noise score is
   present only as the ripple geometry. Flat fills only; no pixel buffers;
   seeded hashes only. Drag re-aims the speaker; on release the sweep
   resumes from that angle. Double-tap reseeds the room (a new layout). */

var T0 = 18;                 // fixed first-frame phase, seconds into the sweep
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1, phone = false;

var PAL = {
  room: '#101214', backWall: '#15181C', sideWall: '#0C0E10', floor: '#17191D',
  floorLine: 'rgba(201,205,211,0.055)',
  silver: '#B9BEC6', silverEdge: 'rgba(233,238,242,0.40)', frame: '#2A2D33',
  sheen: 'rgba(255,255,255,0.10)',
  amber: '#E8B71A', housing: '#2A2D33', teal: '#3E6E7A'
};

/* ---------- seeded hash (integer, deterministic) ---------- */
function ih(a, b) {
  var x = ((a | 0) * 374761393 + (b | 0) * 668265263) >>> 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, f) { return a + (b - a) * f; }

/* ---------- time ---------- */
function perfNow() {
  return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : 0;
}
var startPerf = perfNow();
function pieceNow() { return T0 + (perfNow() - startPerf); }

/* ---------- room geometry (floor plane: u left->right, v front->back) ---------- */
var SPK = { u: 0.5, v: 0.03 };            // speaker position in the floor plane
var LAYOUTS = [
  [ { u1: 0.05, v1: 0.60, u2: 0.26, v2: 0.82 },   // 0: left, angled along the left wall
    { u1: 0.55, v1: 0.55, u2: 0.75, v2: 0.80 },   //    center-right, freestanding diagonal
    { u1: 0.88, v1: 0.62, u2: 0.99, v2: 0.44 } ], //    right, angled toward the viewer
  [ { u1: 0.74, v1: 0.82, u2: 0.95, v2: 0.60 },   // 1: mirror image of 0
    { u1: 0.25, v1: 0.80, u2: 0.45, v2: 0.55 },
    { u1: 0.01, v1: 0.44, u2: 0.12, v2: 0.62 } ],
  [ { u1: 0.10, v1: 0.52, u2: 0.34, v2: 0.70 },   // 2: shallower room, wide center mirror
    { u1: 0.58, v1: 0.66, u2: 0.82, v2: 0.56 },
    { u1: 0.90, v1: 0.80, u2: 0.99, v2: 0.56 } ]
];
var salt = 0;                              // double-tap reseeds the room
function mirrors() {
  var base = LAYOUTS[salt % LAYOUTS.length], out = [];
  for (var i = 0; i < base.length; i++) {
    var m = base[i], j = (salt > 0) ? 1 : 0;
    out.push({
      u1: m.u1 + j * (ih(salt * 31 + 7, i * 4 + 0) - 0.5) * 0.04,
      v1: m.v1 + j * (ih(salt * 31 + 7, i * 4 + 1) - 0.5) * 0.04,
      u2: m.u2 + j * (ih(salt * 31 + 7, i * 4 + 2) - 0.5) * 0.04,
      v2: m.v2 + j * (ih(salt * 31 + 7, i * 4 + 3) - 0.5) * 0.04
    });
  }
  return out;
}

/* ---------- sweep / aim ---------- */
var AMP = 50 * Math.PI / 180;              // sweep half-arc: 100 degrees total
var OMEGA = 2 * Math.PI / 60;              // one full rotation cycle: 60 seconds
var aimSegs = [{ kind: 'auto', start: 0, phase: 0 }];
function autoPhi(seg, t) { return -AMP * Math.cos(OMEGA * (t - seg.phase)); }
function theta(t) {
  var seg = aimSegs[0];
  for (var i = 0; i < aimSegs.length; i++) if (aimSegs[i].start <= t) seg = aimSegs[i];
  if (seg.kind === 'auto') return autoPhi(seg, t);
  var s = seg.samples, ph = s[0].phi;      // drag segment: piecewise-constant samples
  for (var k = 0; k < s.length; k++) if (s[k].t <= t) ph = s[k].phi;
  return ph;
}

/* ---------- raycast in the floor plane ---------- */
function segInt(ox, oy, dx, dy, ax, ay, bx, by) {
  var ex = bx - ax, ey = by - ay;
  var den = dx * ey - dy * ex;
  if (Math.abs(den) < 1e-12) return null;
  var s = ((ax - ox) * ey - (ay - oy) * ex) / den;
  var r = ((ax - ox) * dy - (ay - oy) * dx) / den;
  if (s > 1e-6 && r >= -1e-9 && r <= 1 + 1e-9) return { s: s, r: clamp(r, 0, 1) };
  return null;
}
var WALLS = [
  { u1: 0, v1: 0, u2: 0, v2: 1 }, { u1: 1, v1: 0, u2: 1, v2: 1 },
  { u1: 0, v1: 1, u2: 1, v2: 1 }, { u1: 0, v1: 0, u2: 1, v2: 0 }
];
function beamSegments(t) {
  var mir = mirrors();
  var phi = theta(t), dx = Math.sin(phi), dy = Math.cos(phi);
  var ox = SPK.u, oy = SPK.v, segs = [];
  for (var b = 0; b < 3; b++) {
    var best = null, i, h;
    for (i = 0; i < mir.length; i++) {
      h = segInt(ox, oy, dx, dy, mir[i].u1, mir[i].v1, mir[i].u2, mir[i].v2);
      if (h && (!best || h.s < best.s)) best = { s: h.s, r: h.r, m: i };
    }
    for (i = 0; i < WALLS.length; i++) {
      h = segInt(ox, oy, dx, dy, WALLS[i].u1, WALLS[i].v1, WALLS[i].u2, WALLS[i].v2);
      if (h && (!best || h.s < best.s)) best = { s: h.s, r: h.r, m: -1 };
    }
    if (!best) best = { s: 3, r: 0, m: -1 };
    var hx = ox + dx * best.s, hy = oy + dy * best.s;
    segs.push({ x0: ox, y0: oy, x1: hx, y1: hy, m: best.m, r: best.r, len: best.s });
    if (best.m < 0) break;
    var mm = mir[best.m], ex = mm.u2 - mm.u1, ey = mm.v2 - mm.v1;
    var el = Math.sqrt(ex * ex + ey * ey), tx = ex / el, ty = ey / el;
    var dot = dx * tx + dy * ty;           // reflect: d' = 2(d.t)t - d
    dx = 2 * dot * tx - dx; dy = 2 * dot * ty - dy;
    ox = hx; oy = hy;
  }
  return segs;
}

/* ---------- ripples: spawn events derived by stepping the beam ---------- */
var simT = 0, ripples = [], acc = [0, 0, 0], lastKey = ['', '', ''];
var CAD = [1.1, 1.7, 2.3];                 // spawn cadence per bounce depth, seconds
var RIP_LIFE = 4;                          // rings expand and fade over 4 s
function spawnRip(t, seg) {
  ripples.push({ t0: t, u: seg.x1, v: seg.y1 });
  if (ripples.length > 40) ripples.splice(0, ripples.length - 40);
}
function stepSim(toT) {
  var guard = 0;
  while (simT < toT - 1e-9 && guard++ < 20000) {
    var nt = Math.min(simT + 1 / 30, toT), step = nt - simT;
    simT = nt;
    var segs = beamSegments(simT);
    for (var i = 0; i < 3; i++) {
      if (i < segs.length) {
        var key = segs[i].m >= 0 ? 'm' + segs[i].m : 'wall';
        if (key !== lastKey[i]) { spawnRip(simT, segs[i]); lastKey[i] = key; acc[i] = 0; }
        acc[i] += step;
        if (acc[i] >= CAD[i]) { acc[i] -= CAD[i]; spawnRip(simT, segs[i]); }
      } else { lastKey[i] = ''; acc[i] = 0; }
    }
  }
  for (var k = ripples.length - 1; k >= 0; k--) if (toT - ripples[k].t0 > RIP_LIFE + 0.2) ripples.splice(k, 1);
}

/* ---------- projection ---------- */
function yBack() { return H * 0.26; }
function yFront() { return H * 0.94; }
function fullW(v) { return lerp(W * 0.98, W * 0.60, v); }
function persp(v) { return lerp(1.0, 0.58, v); }
function proj(u, v) {
  return { x: W / 2 + (u - 0.5) * fullW(v), y: yFront() - v * (yFront() - yBack()) };
}
function poly(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fill();
}

/* ---------- draw ---------- */
function draw(t) {
  if (!W) return;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  stepSim(t);
  var mir = mirrors();
  var segs = beamSegments(t);
  var i, j;
  /* walls and floor */
  ctx.fillStyle = PAL.room; ctx.fillRect(0, 0, W, H);
  var b00 = proj(0, 1), b11 = proj(1, 1), f00 = proj(0, 0), f11 = proj(1, 0);
  ctx.fillStyle = PAL.backWall; poly([0, 0, W, 0, b11.x, b11.y, b00.x, b00.y]);
  ctx.fillStyle = PAL.sideWall;
  poly([0, 0, b00.x, b00.y, f00.x, f00.y, 0, H]);
  poly([W, 0, W, H, f11.x, f11.y, b11.x, b11.y]);
  ctx.fillStyle = PAL.floor; poly([f00.x, f00.y, f11.x, f11.y, b11.x, b11.y, b00.x, b00.y]);
  ctx.strokeStyle = PAL.floorLine; ctx.lineWidth = 1;
  for (i = 1; i < 4; i++) {
    var a = proj(0, i / 4), bq = proj(1, i / 4);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(bq.x, bq.y); ctx.stroke();
    var c = proj(i / 4, 0), d = proj(i / 4, 1);
    ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.stroke();
  }
  /* ripples: expanding sound-rings on the floor, one path each */
  for (i = 0; i < ripples.length; i++) {
    var rp = ripples[i], age = t - rp.t0;
    if (age < 0 || age > RIP_LIFE) continue;
    var pc = proj(rp.u, rp.v), sc = persp(rp.v);
    var R = age * 62 * sc, al = 0.55 * (1 - age / RIP_LIFE);
    ctx.strokeStyle = 'rgba(62,110,122,' + al.toFixed(3) + ')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(pc.x, pc.y, Math.max(R, 0.1), Math.max(R * 0.40, 0.1), 0, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(62,110,122,' + (al * 0.7).toFixed(3) + ')'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.ellipse(pc.x, pc.y, Math.max(R * 0.62, 0.1), Math.max(R * 0.62 * 0.40, 0.1), 0, 0, Math.PI * 2); ctx.stroke();
  }
  /* beam cones across the floor: hard-edged, thinner and brighter per bounce */
  var HALF = [4, 1.6, 0.9], BALPHA = [0.15, 0.26, 0.38];
  for (i = 0; i < segs.length; i++) {
    var sg = segs[i];
    var ddx = sg.x1 - sg.x0, ddy = sg.y1 - sg.y0;
    var dl = Math.sqrt(ddx * ddx + ddy * ddy) || 1; ddx /= dl; ddy /= dl;
    var hw = Math.tan(HALF[i] * Math.PI / 180) * sg.len;
    var px = -ddy * hw, py = ddx * hw;
    var ap = proj(sg.x0, sg.y0), e1 = proj(sg.x1 + px, sg.y1 + py), e2 = proj(sg.x1 - px, sg.y1 - py);
    ctx.fillStyle = 'rgba(232,183,26,' + BALPHA[i] + ')';
    poly([ap.x, ap.y, e1.x, e1.y, e2.x, e2.y]);
  }
  /* termination glow where the last segment meets a wall */
  var last = segs[segs.length - 1];
  if (last && last.m < 0) {
    var wp = proj(last.x1, last.y1);
    ctx.fillStyle = 'rgba(232,183,26,0.20)';
    ctx.beginPath(); ctx.ellipse(wp.x, wp.y, 17 * persp(last.y1), 7 * persp(last.y1), 0, 0, Math.PI * 2); ctx.fill();
  }
  /* mirrors: dark frame, silver plane, flat sheen */
  var MH = H * 0.42;
  for (i = 0; i < mir.length; i++) {
    var m = mir[i];
    var A = proj(m.u1, m.v1), B = proj(m.u2, m.v2);
    var At = { x: A.x, y: A.y - MH * persp(m.v1) }, Bt = { x: B.x, y: B.y - MH * persp(m.v2) };
    var cx = (A.x + B.x + At.x + Bt.x) / 4, cy = (A.y + B.y + At.y + Bt.y) / 4;
    function out(p, k) { return { x: p.x + (p.x - cx) * k, y: p.y + (p.y - cy) * k }; }
    var fA = out(A, 0.045), fB = out(B, 0.045), fAt = out(At, 0.045), fBt = out(Bt, 0.045);
    ctx.fillStyle = PAL.frame; poly([fA.x, fA.y, fB.x, fB.y, fBt.x, fBt.y, fAt.x, fAt.y]);
    ctx.fillStyle = PAL.silver; poly([A.x, A.y, B.x, B.y, Bt.x, Bt.y, At.x, At.y]);
    ctx.fillStyle = PAL.sheen;
    poly([lerp(At.x, Bt.x, 0.52), lerp(At.y, Bt.y, 0.52), lerp(At.x, Bt.x, 0.82), lerp(At.y, Bt.y, 0.82),
          lerp(A.x, B.x, 0.44), lerp(A.y, B.y, 0.44), lerp(A.x, B.x, 0.16), lerp(A.y, B.y, 0.16)]);
    ctx.strokeStyle = PAL.silverEdge; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineTo(Bt.x, Bt.y); ctx.lineTo(At.x, At.y); ctx.closePath(); ctx.stroke();
    m._scr = { A: A, B: B, At: At, Bt: Bt };   // screen quad cached for streaks
  }
  /* bright streak up each mirror the beam strikes + a floor glow at the bounce */
  for (i = 0; i < segs.length; i++) {
    if (segs[i].m < 0) continue;
    var mm2 = mir[segs[i].m], q = mm2._scr, r = segs[i].r;
    var bu = lerp(mm2.u1, mm2.u2, r), bv = lerp(mm2.v1, mm2.v2, r);
    var bp = proj(bu, bv);
    ctx.fillStyle = 'rgba(232,183,26,0.45)';
    ctx.beginPath(); ctx.ellipse(bp.x, bp.y, 6 * persp(bv), 2.6 * persp(bv), 0, 0, Math.PI * 2); ctx.fill();
    var ux = q.B.x - q.A.x, uy = q.B.y - q.A.y;
    var ul = Math.sqrt(ux * ux + uy * uy) || 1; ux /= ul; uy /= ul;
    var swd = (i === 0 ? 5 : 3.2) * (phone ? 1.3 : 1);
    var bx = lerp(q.A.x, q.B.x, r), by = lerp(q.A.y, q.B.y, r);
    var txp = lerp(q.At.x, q.Bt.x, r), typ = lerp(q.At.y, q.Bt.y, r);
    var topX = bx + (txp - bx) * 0.8, topY = by + (typ - by) * 0.8;
    ctx.fillStyle = 'rgba(255,246,214,' + (0.50 - i * 0.09).toFixed(2) + ')';
    poly([bx - ux * swd, by - uy * swd, bx + ux * swd, by + uy * swd,
          topX + ux * swd * 0.7, topY + uy * swd * 0.7, topX - ux * swd * 0.7, topY - uy * swd * 0.7]);
  }
  /* speaker on its stand */
  var sp = proj(SPK.u, SPK.v);
  var ss = clamp(Math.min(W, H) / 700, 0.6, 1.3) * (phone ? 1.15 : 1);
  ctx.fillStyle = PAL.housing;
  poly([sp.x - 7 * ss, sp.y - H * 0.012, sp.x + 7 * ss, sp.y - H * 0.012, sp.x + 15 * ss, H * 0.995, sp.x - 15 * ss, H * 0.995]);
  var phi = theta(t);
  var aimP = proj(SPK.u + Math.sin(phi) * 0.25, SPK.v + Math.cos(phi) * 0.25);
  var lens = { x: sp.x, y: sp.y - H * 0.035 };
  var ang = Math.atan2(aimP.y - lens.y, aimP.x - lens.x);
  ctx.save(); ctx.translate(lens.x, lens.y); ctx.rotate(ang);
  ctx.fillStyle = PAL.housing; ctx.fillRect(-20 * ss, -12 * ss, 40 * ss, 24 * ss);
  ctx.fillStyle = PAL.amber; ctx.fillRect(14 * ss, -7 * ss, 6 * ss, 14 * ss);
  ctx.restore();
  ctx.fillStyle = 'rgba(232,183,26,0.85)';
  ctx.beginPath(); ctx.arc(lens.x + Math.cos(ang) * 21 * ss, lens.y + Math.sin(ang) * 21 * ss, 2.6 * ss, 0, Math.PI * 2); ctx.fill();
}

/* ---------- interaction: drag re-aims; release resumes the sweep ---------- */
var dragSeg = null, downInfo = null, lastTapPerf = -10;
function pointerPhi(e) {
  var yb = yBack(), yf = yFront();
  var v = clamp((yf - e.clientY) / (yf - yb), 0.06, 1);
  var u = 0.5 + (e.clientX - W / 2) / fullW(v);
  return clamp(Math.atan2(u - SPK.u, v - SPK.v), -1.35, 1.35);
}
canvas.addEventListener('pointerdown', function (e) {
  var t = pieceNow();
  dragSeg = { kind: 'drag', start: t, samples: [{ t: t, phi: pointerPhi(e) }] };
  aimSegs.push(dragSeg);
  downInfo = { x: e.clientX, y: e.clientY, perf: perfNow(), moved: false };
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragSeg) return;
  dragSeg.samples.push({ t: pieceNow(), phi: pointerPhi(e) });
  if (downInfo && Math.abs(e.clientX - downInfo.x) + Math.abs(e.clientY - downInfo.y) > 8) downInfo.moved = true;
});
function endPointer() {
  if (!dragSeg) return;
  var t = pieceNow(), phiR = dragSeg.samples[dragSeg.samples.length - 1].phi;
  var pre = aimSegs[aimSegs.length - 2] || aimSegs[0];       // sweep direction before the drag
  var dirPos = 1;
  if (pre.kind === 'auto') dirPos = Math.sin(OMEGA * (dragSeg.start - pre.phase)) >= 0 ? 1 : -1;
  var c = clamp(-phiR / AMP, -1, 1);
  var th = Math.atan2(dirPos * Math.sqrt(Math.max(0, 1 - c * c)), c);
  aimSegs.push({ kind: 'auto', start: t, phase: t - th / OMEGA });
  dragSeg = null;
  if (downInfo && !downInfo.moved && perfNow() - downInfo.perf < 0.35) {
    if (perfNow() - lastTapPerf < 0.35) {                    // double-tap: a new room
      salt++;
      ripples.length = 0; acc = [0, 0, 0]; lastKey = ['', '', ''];
      lastTapPerf = -10;
    } else lastTapPerf = perfNow();
  }
  downInfo = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

/* ---------- sizing: Visual Viewport API ---------- */
function resize() {
  var vv = window.visualViewport;
  W = Math.floor(vv ? vv.width : window.innerWidth);
  H = Math.floor(vv ? vv.height : window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
  phone = sw < 700 || H > W * 1.15;
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { resize(); draw(pieceNow()); });
window.addEventListener('resize', function () { resize(); draw(pieceNow()); });

resize();
draw(T0);                                            // synchronous fixed-phase first frame
if (typeof requestAnimationFrame === 'function') {
  var tick = function () {
    draw(pieceNow());
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
