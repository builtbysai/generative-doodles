<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.261 Path of Hope</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#BFD9E8; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.261 Path of Hope (Stanzin Tsepel). After his 2024
// print on chiffon, a 1 by 4 metre banner: a winding trail
// of footprints in snow, heavy boots and light steps side
// by side, curving between dark rocky walls toward distant
// blue peaks. The trail is a record, not an event: it is
// all there from the first frame. Only a slow snowfall and
// a faint breathing of light move, over 40 seconds.
// Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var SNOW = '#F4F6F7', SHADE = '#C9D4DC', ROCK = '#33383D', PEAK = '#7FB2D9', SKY = '#BFD9E8';
var DW = 400, DH = 1600; // the 1:4 scroll
var W = 0, H = 0, phone = false;
var T = 6.2, lastNow = -1; // frame one: the full trail in place, snow falling

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) {
  var c = hexRGB(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(s0) {
  var s = s0 >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }

// ---- the trail: a winding path up the scroll -----------------------------------
// t: 0 at the near foreground (bottom), 1 at the distant peaks (top)
function trailX(t) { return 200 + Math.sin(t * 5.1 + 0.4) * 92 * (1 - t * 0.55); }
function trailY(t) { return 1568 - t * 1330; }
function trailDir(t) {
  var e = 0.004;
  var dx = trailX(t + e) - trailX(t - e), dy = trailY(t + e) - trailY(t - e);
  var l = Math.sqrt(dx * dx + dy * dy);
  return [dx / l, dy / l];
}
// one footprint, drawn in local space: heel at the origin, toe up (-y)
function printPath(len, wid) {
  ctx.beginPath();
  // the sole: a long rounded wedge
  ctx.moveTo(-wid * 0.42, -len * 0.30);
  ctx.bezierCurveTo(-wid * 0.52, -len * 0.78, -wid * 0.30, -len, 0, -len);
  ctx.bezierCurveTo(wid * 0.30, -len, wid * 0.52, -len * 0.78, wid * 0.42, -len * 0.30);
  ctx.bezierCurveTo(wid * 0.36, -len * 0.08, -wid * 0.36, -len * 0.08, -wid * 0.42, -len * 0.30);
  ctx.closePath();
  // the heel: a separate pad below the waist
  ctx.moveTo(-wid * 0.34, len * 0.06);
  ctx.bezierCurveTo(-wid * 0.40, len * 0.26, -wid * 0.22, len * 0.34, 0, len * 0.34);
  ctx.bezierCurveTo(wid * 0.22, len * 0.34, wid * 0.40, len * 0.26, wid * 0.34, len * 0.06);
  ctx.bezierCurveTo(wid * 0.28, -len * 0.02, -wid * 0.28, -len * 0.02, -wid * 0.34, len * 0.06);
  ctx.closePath();
}
// the whole walk, precomputed: two walkers side by side,
// heavy boots and light steps, feet alternating
var prints = [];
(function () {
  var r = rng(26111);
  var lanes = [
    { off: -22, len: 52, wid: 19, a: 0.42 },  // the heavy boots
    { off: 19, len: 33, wid: 12.5, a: 0.24 }  // the light steps
  ];
  for (var L = 0; L < lanes.length; L++) {
    var lane = lanes[L];
    var n = 30;
    for (var i = 0; i < n; i++) {
      var t = 0.015 + (i + (L ? 0.5 : 0)) / n * 0.965;
      var sc = 1.85 - t * 1.55;                       // perspective shrink
      var d = trailDir(t);
      var px = -d[1], py = d[0];                     // perpendicular
      var side = (i % 2 === 0) ? -1 : 1;
      var lat = lane.off * sc + side * 6.5 * sc;
      prints.push({
        x: trailX(t) + px * lat + (r() - 0.5) * 3,
        y: trailY(t) + py * lat + (r() - 0.5) * 3,
        ang: Math.atan2(d[1], d[0]) + Math.PI / 2 + (r() - 0.5) * 0.14,
        len: lane.len * sc, wid: lane.wid * sc,
        a: lane.a * (0.8 + 0.4 * r())
      });
    }
  }
})();
// ---- rocky walls, sparkle, snowfall ----------------------------------------------
var wallJit = [], spark = [], flakes = [];
(function () {
  var r = rng(26123);
  for (var i = 0; i <= 26; i++) wallJit.push((r() - 0.5) * 26);
  var r2 = rng(26137);
  for (var j = 0; j < 260; j++) spark.push({ x: r2() * DW, y: 240 + r2() * 1340, s: 0.8 + r2() * 1.4, ph: r2() * Math.PI * 2 });
  var r3 = rng(26149);
  for (var k = 0; k < 110; k++) flakes.push({ fx: r3(), fy: r3(), sz: 1.1 + r3() * 2.1, ph: r3() * Math.PI * 2, fall: 9 + r3() * 13 });
})();

function wallPath(side) {
  // side: -1 left wall, +1 right wall. The valley narrows with height.
  ctx.beginPath();
  var steps = 26;
  for (var i = 0; i <= steps; i++) {
    var f = i / steps;                    // 0 bottom .. 1 top
    var y = DH - f * (DH - 190);
    var valley = trailX(1 - f) + side * (118 - f * 62);
    var x = side < 0 ? valley - 26 + wallJit[i] * (side < 0 ? 1 : 1) : valley + 26 + wallJit[steps - i];
    if (i === 0) ctx.moveTo(side < 0 ? -6 : DW + 6, DH + 6);
    if (i === 0) ctx.lineTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.lineTo(side < 0 ? -6 : DW + 6, 184);
  ctx.closePath();
}

function draw() {
  // sky at the head of the scroll
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, DW, DH);
  // distant peaks: layered silhouettes
  ctx.fillStyle = mix(PEAK, SKY, 0.35);
  ctx.beginPath();
  ctx.moveTo(-6, 268); ctx.lineTo(70, 168); ctx.lineTo(128, 238); ctx.lineTo(196, 138); ctx.lineTo(262, 226); ctx.lineTo(330, 160); ctx.lineTo(406, 252); ctx.lineTo(406, 300); ctx.lineTo(-6, 300);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = PEAK;
  ctx.beginPath();
  ctx.moveTo(-6, 292); ctx.lineTo(96, 196); ctx.lineTo(168, 262); ctx.lineTo(238, 182); ctx.lineTo(316, 268); ctx.lineTo(406, 208); ctx.lineTo(406, 320); ctx.lineTo(-6, 320);
  ctx.closePath(); ctx.fill();
  // snow caps on the far peaks
  ctx.fillStyle = SNOW;
  ctx.beginPath();
  ctx.moveTo(84, 208); ctx.lineTo(96, 196); ctx.lineTo(110, 210); ctx.lineTo(102, 214); ctx.lineTo(96, 208); ctx.lineTo(90, 215);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(226, 194); ctx.lineTo(238, 182); ctx.lineTo(252, 196); ctx.lineTo(244, 200); ctx.lineTo(238, 193); ctx.lineTo(232, 201);
  ctx.closePath(); ctx.fill();

  // the snow field
  ctx.fillStyle = SNOW;
  ctx.fillRect(0, 288, DW, DH - 288);
  // soft shadow drifts across the field
  ctx.fillStyle = rgba(SHADE, 0.35);
  var drifts = [[70, 620, 120, 20], [300, 830, 130, 24], [90, 1080, 140, 26], [280, 1330, 120, 22], [180, 1480, 150, 26], [250, 430, 110, 16]];
  for (var d = 0; d < drifts.length; d++) {
    ctx.beginPath(); ctx.ellipse(drifts[d][0], drifts[d][1], drifts[d][2], drifts[d][3], 0, 0, Math.PI * 2); ctx.fill();
  }

  // rocky walls on both sides
  ctx.fillStyle = mix(ROCK, SKY, 0.10);
  wallPath(-1); ctx.fill();
  wallPath(1); ctx.fill();
  // a pale rim where the rock edge catches the snow light
  ctx.strokeStyle = rgba(SHADE, 0.28);
  ctx.lineWidth = 4;
  wallPath(-1); ctx.stroke();
  wallPath(1); ctx.stroke();
  // strata strokes on the rock
  ctx.strokeStyle = rgba(SNOW, 0.10);
  ctx.lineWidth = 3;
  for (var s = 0; s < 12; s++) {
    var sy = 340 + s * 104;
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(56 + (s % 3) * 22, sy + 14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(DW, sy + 52); ctx.lineTo(DW - 56 - (s % 3) * 22, sy + 66); ctx.stroke();
  }
  // soft contact shade on the snow where it meets the rock
  ctx.fillStyle = rgba(SHADE, 0.17);
  for (var cs = 0; cs < 13; cs++) {
    var cf = cs / 12, cy2 = 400 + cf * 1160;
    var ccx = trailX(1 - (DH - cy2) / (DH - 190));
    var chw = 118 - ((DH - cy2) / (DH - 190)) * 62;
    ctx.beginPath(); ctx.ellipse(ccx - chw + 8, cy2, 13, 62, 0.06, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(ccx + chw - 8, cy2, 13, 62, -0.06, 0, Math.PI * 2); ctx.fill();
  }

  // ---- the trail itself: still, complete, a record --------------------------------
  for (var i = 0; i < prints.length; i++) {
    var p = prints[i];
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.ang);
    printPath(p.len, p.wid);
    ctx.fillStyle = rgba(SHADE, p.a + 0.38);
    ctx.fill();
    // a faint compressed-snow rim on the light side of each print
    ctx.translate(0.8, -0.8);
    printPath(p.len, p.wid);
    ctx.strokeStyle = rgba('#FFFFFF', 0.35);
    ctx.lineWidth = 0.9;
    ctx.stroke();
    ctx.restore();
  }

  // sparkle in the snow, kept to the open field between the walls
  for (var j = 0; j < spark.length; j++) {
    var sk = spark[j];
    var sf = Math.min(1, Math.max(0, (DH - sk.y) / (DH - 190)));
    var scx = trailX(1 - sf), shw = 118 - sf * 62 + 14;
    if (Math.abs(sk.x - scx) > shw) continue;
    var tw = 0.5 + 0.5 * Math.sin(T * 0.7 + sk.ph);
    ctx.fillStyle = rgba('#FFFFFF', 0.25 + 0.45 * tw);
    ctx.fillRect(sk.x, sk.y, sk.s, sk.s);
  }
  // the faint breathing of light over the whole scroll
  ctx.fillStyle = rgba('#FFFFFF', 0.028 + 0.028 * Math.sin(T * Math.PI * 2 / 40));
  ctx.fillRect(0, 0, DW, DH);
  // snowfall: slow, low density, drifting inside the scroll
  for (var k = 0; k < flakes.length; k++) {
    var fl = flakes[k];
    var fy = (fl.fy * DH + T * fl.fall) % DH;
    var fx = fl.fx * DW + Math.sin(T * 0.32 + fl.ph) * 9;
    ctx.fillStyle = rgba('#FFFFFF', 0.55);
    ctx.beginPath(); ctx.arc(fx, fy, fl.sz, 0, Math.PI * 2); ctx.fill();
  }
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  // the page ground takes the piece's sky tone
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, W, H);
  // contain-fit: on desktop the 1:4 scroll centres at its own ratio;
  // on phones it fills the width and nearly all the height
  var S = Math.min(W / DW, H / DH);
  ctx.setTransform(S, 0, 0, S, (W - DW * S) / 2, (H - DH * S) / 2);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
