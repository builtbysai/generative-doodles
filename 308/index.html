<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.308 Tiny Hut Row</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1B1A18; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.308 Tiny Hut Row (Xanthe Caesia).
// Five tiny ceramic incense cottages in a loose row across the
// lower third under a generous night sky. Each hut has a gabled
// roof, exactly one glowing window, a chimney and two stubby
// chicken feet. Bodies are slipcast cream clay with soot
// blackened bases, slightly lopsided by seed, never symmetrical.
// Exactly one hut carries the moss planter treatment. Idle is
// watch only: incense smoke curls from every chimney out of a
// pooled, recycled particle system, and exactly one hut per
// 15 second beat, in seeded rotation, does a scratch and settle
// feet dance, so the full idle cycle is 75 seconds. Tapping a
// hut flares only that hut window and pours a thicker plume
// from only that hut chimney for 3 seconds. Fixed seeds, no
// randomness at runtime.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var CREAM = '#EDE4D2', SOOT = '#2B2622', AMBER = '#F2B45C';
var MOSS = '#7A8B6F', SMOKE = '#9AA0A3', NIGHT = '#1B1A18';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var CYCLE = 75, BEAT = 15;
// Start inside the first beat so frame one shows smoke already
// rising from all five chimneys and one hut mid dance.
var T = 1.15, lastNow = -1, acc = 0;
var TICK = 1 / 60;

function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, u) { return a + (b - a) * u; }
function smooth(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }
function oval(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
// Deterministic seeded generator, used only to build fixed data.
function RNG(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
var rng = RNG(308915);

// ---- huts --------------------------------------------------------------
// Fields: centre x, body width, body height, roof height, tilt,
// window offset, chimney side, moss flag, corner jitters.
var GROUND_Y = 742;
var HUTS = [
  { x: 188, bw: 150, bh: 126, rh: 76,  tilt: -0.022, winDX: -8, winDY: -6, chim: 1,  moss: false, j: [-4, 3, 5, -3] },
  { x: 414, bw: 138, bh: 148, rh: 94,  tilt: 0.018,  winDX: 10, winDY: 2,  chim: -1, moss: false, j: [3, -5, -4, 4] },
  { x: 640, bw: 164, bh: 118, rh: 70,  tilt: -0.012, winDX: 0,  winDY: -2, chim: 1,  moss: true,  j: [-3, 4, 3, -5] },
  { x: 866, bw: 142, bh: 156, rh: 100, tilt: 0.025,  winDX: -12, winDY: 4, chim: -1, moss: false, j: [5, -3, -5, 3] },
  { x: 1092, bw: 152, bh: 132, rh: 82,  tilt: -0.018, winDX: 8,  winDY: 0,  chim: 1,  moss: false, j: [-5, 5, 4, -4] }
];
if (HUTS.length !== 5) throw new Error('Tiny Hut Row needs exactly 5 huts');
var mossCount = 0, i;
for (i = 0; i < HUTS.length; i++) if (HUTS[i].moss) mossCount++;
if (mossCount !== 1) throw new Error('Tiny Hut Row needs exactly 1 moss-planter hut');
// Seeded dance rotation: one hut per beat, full cycle 75 seconds.
var ROT = [2, 0, 4, 1, 3];
if (ROT.length !== 5) throw new Error('Tiny Hut Row needs exactly 5 rotation entries');
// Each hut has exactly one window.
var WINDOWS_PER_HUT = 1;
if (WINDOWS_PER_HUT !== 1) throw new Error('Tiny Hut Row needs exactly 1 window per hut');
// Tap state per hut: start time of the current flare, or -99.
var tapAt = [-99, -99, -99, -99, -99];
function flare(h) {
  var dt = T - tapAt[h];
  return dt >= 0 && dt < 3 ? 1 - smooth(dt / 3) * 0.35 : 0;
}
function hutBodyTop(hut) { return GROUND_Y - 30 - hut.bh; }
function chimneyTip(hut) {
  var top = hutBodyTop(hut);
  var apexY = top - hut.rh;
  var cx = hut.x + hut.chim * hut.bw * 0.26;
  // point on the roof slope at the chimney x, then up the stack
  var slopeY = apexY + hut.rh * Math.abs(hut.chim * 0.26 + 0.5 - 0.5) * 0;
  var roofYat = apexY + (hut.rh) * (Math.abs(cx - hut.x) / (hut.bw * 0.62));
  return { x: cx, y: roofYat - 42 };
}

// ---- stars -------------------------------------------------------------
var STARS = [];
for (i = 0; i < 46; i++) {
  STARS.push({ x: 30 + rng() * 1220, y: 28 + rng() * 330, r: 0.9 + rng() * 1.7, a: 0.18 + rng() * 0.42, ph: rng() * 6.28 });
}
if (STARS.length !== 46) throw new Error('Tiny Hut Row needs exactly 46 stars');

// ---- smoke pool --------------------------------------------------------
// Pooled, recycled particles: fixed data, age wraps in place.
// Curl drift is a deterministic field of sines, no runtime random.
var SMOKE_PER_HUT = 20;
var POOL = [];
for (var h = 0; h < 5; h++) {
  for (i = 0; i < SMOKE_PER_HUT; i++) {
    POOL.push({
      hut: h,
      off: (i / SMOKE_PER_HUT) * 6.4 + rng() * 0.55,
      dur: 6.4 + rng() * 0.9,
      ph: rng() * 6.28318,
      ph2: rng() * 6.28318,
      sz: 0.82 + rng() * 0.45
    });
  }
}
if (POOL.length !== 100) throw new Error('Tiny Hut Row needs exactly 100 pooled smoke particles');
// Extra burst particles, drawn only for a tapped hut during its
// 3 second plume, cycling fast from the tap moment.
var BURST = [];
for (i = 0; i < 14; i++) {
  BURST.push({ off: (i / 14) * 1.4 + rng() * 0.2, dur: 1.5 + rng() * 0.4, ph: rng() * 6.28318, sz: 0.9 + rng() * 0.5 });
}
if (BURST.length !== 14) throw new Error('Tiny Hut Row needs exactly 14 burst particles');

function curlX(p, ph, ph2, amp) {
  return (Math.sin(p * 5.1 + ph) * 20 + Math.sin(p * 11.3 + ph2) * 7) * p * amp;
}
function drawSmokePuff(x, y, r, alpha) {
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.fillStyle = SMOKE;
  oval(x, y, r * 1.18, r * 0.88); ctx.fill();
  oval(x - r * 0.42, y + r * 0.14, r * 0.62, r * 0.48); ctx.fill();
  oval(x + r * 0.44, y + r * 0.1, r * 0.58, r * 0.44); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawSmoke() {
  var k, p, age, hut, tip, fl;
  for (k = 0; k < POOL.length; k++) {
    p = POOL[k]; hut = HUTS[p.hut]; tip = chimneyTip(hut); fl = flare(p.hut);
    age = (T + p.off) % p.dur;
    var u = age / p.dur;
    var x = tip.x + curlX(u, p.ph, p.ph2, 1);
    var y = tip.y - 12 - u * 218;
    var r = (5.5 + u * 27) * p.sz * (1 + fl * 0.35);
    var a = Math.sin(Math.min(1, u) * 3.14159) * 0.34 * (1 - u * 0.35) + fl * 0.10 * (1 - u);
    drawSmokePuff(x, y, r, a);
  }
  // tap plumes: thicker, faster, only from the tapped hut
  for (var hh = 0; hh < 5; hh++) {
    fl = flare(hh);
    if (fl <= 0) continue;
    hut = HUTS[hh]; tip = chimneyTip(hut);
    var since = T - tapAt[hh];
    for (k = 0; k < BURST.length; k++) {
      p = BURST[k];
      age = (since + p.off) % p.dur;
      var bu = age / p.dur;
      drawSmokePuff(
        tip.x + curlX(bu, p.ph, p.ph * 1.7, 0.6),
        tip.y - 10 - bu * 150,
        (6 + bu * 20) * p.sz,
        Math.sin(bu * 3.14159) * 0.42 * fl
      );
    }
  }
}

// ---- dance -------------------------------------------------------------
// Returns the dance state for hut index h at the current time:
// envelope 0..1 and a scratch phase, or null when it is not its beat.
function danceState(h) {
  var beat = Math.floor(T / BEAT) % 5;
  if (ROT[beat] !== h) return null;
  var local = T - Math.floor(T / BEAT) * BEAT;
  if (local > 3.6) return null;
  var env = smooth(local / 0.35) * (1 - smooth((local - 2.7) / 0.9));
  return { env: clamp(env, 0, 1), local: local };
}

// ---- one hut -----------------------------------------------------------
function drawFoot(x, y, lift, back, toeCurl) {
  // stubby chicken foot in cream clay: three thick toes fanning
  // from the ankle point, readable against the night ground
  ctx.strokeStyle = CREAM; ctx.lineCap = 'round';
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(x, y - 4); ctx.lineTo(x + back, y); ctx.stroke();
  ctx.lineWidth = 4.6;
  var tx = x + back, ty = y;
  var toes = [-21, 0, 21];
  for (var k = 0; k < 3; k++) {
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx + toes[k] * 0.7, ty - lift - toeCurl);
    ctx.lineTo(tx + toes[k], ty - lift - toeCurl * 0.4 + 2);
    ctx.stroke();
  }
}
function drawHut(hut, idx) {
  var ds = danceState(idx);
  var env = ds ? ds.env : 0;
  var scratch = ds ? Math.sin(ds.local * 10.5) : 0;
  var scratchFast = ds ? Math.sin(ds.local * 21) : 0;
  var bob = env * (Math.abs(scratch) * -5 + scratchFast * 1.2);
  var rock = hut.tilt + env * scratch * 0.028;
  var top = hutBodyTop(hut);
  var fl = flare(idx);
  ctx.save();
  ctx.translate(hut.x, GROUND_Y - 28);
  ctx.rotate(rock);
  ctx.translate(-hut.x, -(GROUND_Y - 28));
  ctx.translate(0, bob);
  // ground shadow
  ctx.globalAlpha = 0.55; ctx.fillStyle = SOOT;
  oval(hut.x, GROUND_Y + 10 - bob, hut.bw * 0.72, 13); ctx.fill();
  ctx.globalAlpha = 1;
  // feet and legs, behind the body. The dancer scratches with
  // its right foot: that ankle drags back and lifts in bursts.
  var legTop = GROUND_Y - 30;
  var lx = hut.x - hut.bw * 0.26, rx = hut.x + hut.bw * 0.26;
  ctx.strokeStyle = CREAM; ctx.lineCap = 'round'; ctx.lineWidth = 7.5;
  ctx.beginPath(); ctx.moveTo(lx, legTop - 10); ctx.lineTo(lx, GROUND_Y - 4); ctx.stroke();
  var rBack = env * scratch * 16, rLift = env * Math.max(0, scratch) * 9;
  ctx.beginPath(); ctx.moveTo(rx, legTop - 10); ctx.lineTo(rx + rBack, GROUND_Y - 4 - rLift); ctx.stroke();
  drawFoot(lx, GROUND_Y + 2, 0, 0, 0);
  drawFoot(rx, GROUND_Y + 2 - rLift, rLift, rBack, env * Math.max(0, -scratch) * 3);
  // body: a slightly lopsided quadrilateral in cream clay
  var x0 = hut.x - hut.bw / 2, x1 = hut.x + hut.bw / 2;
  ctx.beginPath();
  ctx.moveTo(x0 + hut.j[0], top + hut.j[1]);
  ctx.lineTo(x1 + hut.j[1], top + hut.j[2]);
  ctx.lineTo(x1 + hut.j[2], legTop + 4);
  ctx.lineTo(x0 + hut.j[3], legTop + 4);
  ctx.closePath();
  ctx.fillStyle = CREAM; ctx.fill();
  ctx.strokeStyle = SOOT; ctx.lineWidth = 3.2; ctx.lineJoin = 'round'; ctx.stroke();
  // handmade surface ticks on the clay
  ctx.strokeStyle = SOOT; ctx.globalAlpha = 0.28; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(x0 + 16, top + hut.bh * 0.34); ctx.lineTo(x0 + 38, top + hut.bh * 0.30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1 - 42, top + hut.bh * 0.52); ctx.lineTo(x1 - 18, top + hut.bh * 0.48); ctx.stroke();
  ctx.globalAlpha = 1;
  // soot blackened base: filled translucent bands clipped to
  // the body, darkest at the foot line and thinning upward with
  // uneven wavy tops, as incense smoke darkens the clay
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x0 + hut.j[0], top + hut.j[1]);
  ctx.lineTo(x1 + hut.j[1], top + hut.j[2]);
  ctx.lineTo(x1 + hut.j[2], legTop + 4);
  ctx.lineTo(x0 + hut.j[3], legTop + 4);
  ctx.closePath();
  ctx.clip();
  var bands = [[52, 0.14], [40, 0.26], [29, 0.42], [19, 0.62], [10, 0.85]];
  for (var sIdx = 0; sIdx < bands.length; sIdx++) {
    ctx.globalAlpha = bands[sIdx][1];
    ctx.fillStyle = SOOT;
    ctx.beginPath();
    ctx.moveTo(x0 - 4, legTop + 5);
    ctx.lineTo(x0 - 4, legTop - bands[sIdx][0] + (sIdx % 2) * 3);
    ctx.quadraticCurveTo(hut.x, legTop - bands[sIdx][0] - 6, x1 + 4, legTop - bands[sIdx][0] + ((sIdx + 1) % 2) * 3);
    ctx.lineTo(x1 + 4, legTop + 5);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
  // chimney, behind the roof line on its slope
  var tip = chimneyTip(hut);
  ctx.fillStyle = SOOT;
  ctx.fillRect(tip.x - 11, tip.y, 22, 52);
  ctx.fillRect(tip.x - 14, tip.y - 3, 28, 9);
  ctx.fillStyle = NIGHT;
  oval(tip.x, tip.y - 2, 9, 3.4); ctx.fill();
  ctx.strokeStyle = SMOKE; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(tip.x - 14, tip.y + 6); ctx.lineTo(tip.x + 14, tip.y + 6); ctx.stroke();
  ctx.globalAlpha = 1;
  // gabled roof: a lopsided triangle with a thick soot edge
  var apexX = hut.x + hut.j[0] * 1.6, apexY = top - hut.rh;
  var rx0 = x0 - 14, rx1 = x1 + 14;
  ctx.beginPath();
  ctx.moveTo(rx0, top + 8); ctx.lineTo(apexX, apexY); ctx.lineTo(rx1, top + 8);
  ctx.closePath();
  ctx.fillStyle = SOOT; ctx.fill();
  ctx.strokeStyle = SOOT; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.stroke();
  // roof handmade ridge ticks in cream
  ctx.strokeStyle = CREAM; ctx.globalAlpha = 0.35; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(lerp(rx0, apexX, 0.35), lerp(top + 8, apexY, 0.35) + 7); ctx.lineTo(lerp(rx0, apexX, 0.55), lerp(top + 8, apexY, 0.55) + 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(lerp(apexX, rx1, 0.45), lerp(apexY, top + 8, 0.45) + 7); ctx.lineTo(lerp(apexX, rx1, 0.65), lerp(apexY, top + 8, 0.65) + 7); ctx.stroke();
  ctx.globalAlpha = 1;
  // the one glowing window: layered translucency halo, amber
  // core, soot frame and a cross mullion
  var wx = hut.x + hut.winDX, wy = top + hut.bh * 0.44 + hut.winDY;
  var haloR = 30 + fl * 30 + Math.sin(T * 2.1 + idx * 1.7) * 2.5;
  ctx.globalAlpha = 0.10 + fl * 0.14; ctx.fillStyle = AMBER;
  oval(wx, wy, haloR, haloR * 0.86); ctx.fill();
  ctx.globalAlpha = 0.16 + fl * 0.18;
  oval(wx, wy, haloR * 0.62, haloR * 0.53); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = SOOT;
  ctx.fillRect(wx - 17, wy - 21, 34, 42);
  ctx.fillStyle = AMBER;
  ctx.fillRect(wx - 12, wy - 16, 24, 32);
  if (fl > 0) { ctx.globalAlpha = fl * 0.75; ctx.fillStyle = CREAM; ctx.fillRect(wx - 6, wy - 9, 12, 18); ctx.globalAlpha = 1; }
  ctx.strokeStyle = SOOT; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(wx, wy - 16); ctx.lineTo(wx, wy + 16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(wx - 12, wy); ctx.lineTo(wx + 12, wy); ctx.stroke();
  // moss planter treatment on the one flagged hut: a planter
  // box at the front right with moss mounds, plus roof moss
  if (hut.moss) {
    ctx.fillStyle = SOOT;
    ctx.fillRect(hut.x + hut.bw * 0.18, legTop - 22, 56, 20);
    ctx.fillStyle = MOSS;
    var mounds = [[0, 0, 13], [18, -5, 16], [38, -2, 12], [50, 2, 9]];
    for (var mIdx = 0; mIdx < mounds.length; mIdx++) {
      oval(hut.x + hut.bw * 0.18 + 6 + mounds[mIdx][0], legTop - 24 + mounds[mIdx][1], mounds[mIdx][2], mounds[mIdx][2] * 0.62);
      ctx.fill();
    }
    // moss creeping on the roof edge and body corner
    ctx.globalAlpha = 0.9;
    oval(rx0 + 34, top + 5, 16, 8); ctx.fill();
    oval(rx0 + 52, top + 10, 11, 6); ctx.fill();
    oval(x0 + 14, top + hut.bh * 0.62, 8, 11); ctx.fill();
    oval(x0 + 22, top + hut.bh * 0.62 + 8, 6, 8); ctx.fill();
    oval(x0 + 8, top + hut.bh * 0.62 + 10, 5, 7); ctx.fill();
    ctx.globalAlpha = 1;
    // tiny moss sprigs
    ctx.strokeStyle = MOSS; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hut.x + hut.bw * 0.18 + 24, legTop - 38); ctx.lineTo(hut.x + hut.bw * 0.18 + 22, legTop - 48); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hut.x + hut.bw * 0.18 + 30, legTop - 37); ctx.lineTo(hut.x + hut.bw * 0.18 + 34, legTop - 46); ctx.stroke();
  }
  ctx.restore();
}

function draw() {
  ctx.fillStyle = NIGHT;
  ctx.fillRect(0, 0, DW, DH);
  // stars, gentle seeded twinkle from the loop time
  for (var k = 0; k < STARS.length; k++) {
    var st = STARS[k];
    ctx.globalAlpha = clamp(st.a + Math.sin(T * 0.9 + st.ph) * 0.10, 0.05, 0.7);
    ctx.fillStyle = CREAM;
    oval(st.x, st.y, st.r, st.r); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // small moon, upper right, in cream with a night bite
  oval(1128, 118, 34, 34); ctx.fillStyle = CREAM; ctx.globalAlpha = 0.92; ctx.fill(); ctx.globalAlpha = 1;
  oval(1144, 106, 29, 29); ctx.fillStyle = NIGHT; ctx.fill();
  // ground band across the lower third
  ctx.fillStyle = SOOT; ctx.globalAlpha = 0.5;
  ctx.fillRect(0, GROUND_Y + 8, DW, DH - GROUND_Y - 8);
  ctx.globalAlpha = 1;
  ctx.strokeStyle = SMOKE; ctx.globalAlpha = 0.22; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(40, GROUND_Y + 9); ctx.lineTo(1240, GROUND_Y + 9); ctx.stroke();
  ctx.globalAlpha = 1;
  // scattered ground stones in smoke grey
  ctx.fillStyle = SMOKE;
  var stones = [[96, 788, 9], [322, 806, 7], [520, 782, 8], [758, 810, 9], [982, 786, 7], [1186, 804, 8], [640, 824, 6]];
  for (k = 0; k < stones.length; k++) { ctx.globalAlpha = 0.30; oval(stones[k][0], stones[k][1], stones[k][2], stones[k][2] * 0.5); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (k = 0; k < HUTS.length; k++) drawHut(HUTS[k], k);
  drawSmoke();
}

function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function onTap(e) {
  var cx = e.clientX, cy = e.clientY;
  if (cx === undefined && e.touches && e.touches.length) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
  if (cx === undefined) return;
  var dx = (cx - OX) / S, dy = (cy - OY) / S;
  for (var k = 0; k < HUTS.length; k++) {
    var hut = HUTS[k], top = hutBodyTop(hut) - hut.rh - 52;
    if (dx > hut.x - hut.bw * 0.72 && dx < hut.x + hut.bw * 0.72 && dy > top && dy < GROUND_Y + 16) {
      tapAt[k] = T;
      return;
    }
  }
}
canvas.addEventListener('pointerdown', onTap);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = NIGHT;
  ctx.fillRect(0, 0, W, H);
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
