<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№8934 · Family of Blobs · Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  #stage {
    width: min(94vw, 66vh);

  #stage canvas { display: block; width: 100%; height: 100%; }

  @media (max-width: 480px) {

    #stage { width: min(94vw, 58vh); }

</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№8934</span> · Family of Blobs</h1>
  <p>The same seeded blob, built four ways: folded from <b>sine waves</b>,
  <b>grown</b> until it wrinkles, traced as <b>contours</b> in a seeded field,
  and melted out of <b>circles</b>. One ink, four honest strategies.</p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer><span id="seedNote"></span> · click anywhere for a new family · <a href="../">all doodles</a></footer>

<script>
"use strict";
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const seedEl = document.getElementById('seedNote');

const INK = '#292318';
const LABEL = '#4a4232';
const CLAUSE = '#8a7f68';
const CONSTR = 'rgba(150,133,94,0.85)';   // shared construction-line ink
const DOTTED = 'rgba(120,104,74,0.55)';
const PAPER = '#f5f0e3';

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- the shared skeleton: one seeded anchor constellation ---------- */
function baseShape(rng){
  const nA = 5 + Math.floor(rng() * 3);           // 5..7 lobes
  const anchors = [];
  for (let i = 0; i < nA; i++){
    const ang = (i / nA) * Math.PI * 2 + (rng() - 0.5) * (Math.PI * 2 / nA) * 0.6;
    const rad = 0.78 + rng() * 0.26;              // 0.78..1.04
    anchors.push({ x: Math.cos(ang) * rad, y: Math.sin(ang) * rad });
  }
  // closed Catmull-Rom through the anchors, 256 samples (normalized units)
  const pts = [];
  const M = 256;
  for (let s = 0; s < M; s++){
    const seg = (s / M) * nA;
    const i0 = Math.floor(seg) % nA;
    const t = seg - Math.floor(seg);
    const p = (j) => anchors[(i0 + j + nA) % nA];
    const p0 = p(-1), p1 = p(0), p2 = p(1), p3 = p(2);
    pts.push({
      x: catmull(p0.x, p1.x, p2.x, p3.x, t),
      y: catmull(p0.y, p1.y, p2.y, p3.y, t)
    });
  }
  return { anchors, pts };
}
function catmull(a, b, c, d, t){
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
}

/* ---------- strategy 1: harmonic outline (complex Fourier descriptors) ---------- */
function harmonicOutline(pts, K){
  const N = pts.length;
  const coefs = [];
  for (let k = -K; k <= K; k++){
    let re = 0, im = 0;
    for (let n = 0; n < N; n++){
      const ang = -2 * Math.PI * k * n / N;
      const co = Math.cos(ang), si = Math.sin(ang);
      re += pts[n].x * co + pts[n].y * si;
      im += pts[n].y * co - pts[n].x * si;
    }
    coefs.push({ k, re: re / N, im: im / N });
  }
  const out = [];
  for (let m = 0; m < 256; m++){
    const t = m / 256;
    let x = 0, y = 0;
    for (const c of coefs){
      const ang = 2 * Math.PI * c.k * t;
      const co = Math.cos(ang), si = Math.sin(ang);
      x += c.re * co - c.im * si;
      y += c.re * si + c.im * co;
    }
    out.push({ x, y });
  }
  return out;
}

/* ---------- strategy 2: differential growth ---------- */
function resampleClosed(pts, count){
  const per = [0];
  let total = 0;
  for (let i = 1; i <= pts.length; i++){
    total += Math.hypot(pts[i % pts.length].x - pts[i - 1].x, pts[i % pts.length].y - pts[i - 1].y);
    per.push(total);
  }
  const out = [];
  for (let j = 0; j < count; j++){
    const target = total * j / count;
    let i = 1;
    while (per[i] < target) i++;
    const f = (target - per[i - 1]) / (per[i] - per[i - 1] || 1);
    const a = pts[(i - 1) % pts.length], b = pts[i % pts.length];
    out.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f });
  }
  return out;
}
function growBlob(base, rng){
  let P = resampleClosed(base, 120);
  const CAP = 1.12;               // hard ceiling in normalized units: never leaves its cell
  const REP = 0.14;               // separation distance
  const LMAX = 0.06;              // subdivide threshold while growing
  const cell = REP;               // hash cell size
  // wrinkle budget: grow until the front carries TARGET times the base outline's length
  let basePer = 0;
  for (let i = 0; i < base.length; i++){
    const a = base[i], b = base[(i + 1) % base.length];
    basePer += Math.hypot(b.x - a.x, b.y - a.y);
  }
  const TARGET = basePer * 1.38;
  for (let step = 0; step < 420; step++){
    const n = P.length;
    const fx = new Float64Array(n), fy = new Float64Array(n);
    let per = 0;
    for (let i = 0; i < n; i++){
      const a = P[i], b = P[(i + 1) % n];
      per += Math.hypot(b.x - a.x, b.y - a.y);
    }
    const growing = per < TARGET;
    // neighbor straightening
    for (let i = 0; i < n; i++){
      const a = P[(i - 1 + n) % n], b = P[(i + 1) % n], v = P[i];
      fx[i] += ((a.x + b.x) / 2 - v.x) * (growing ? 0.08 : 0.12);
      fy[i] += ((a.y + b.y) / 2 - v.y) * (growing ? 0.08 : 0.12);
    }
    // non-neighbor separation via spatial hash
    const hash = new Map();
    const key = (x, y) => Math.floor(x / cell) + ':' + Math.floor(y / cell);
    for (let i = 0; i < n; i++){
      const k = key(P[i].x, P[i].y);
      if (!hash.has(k)) hash.set(k, []);
      hash.get(k).push(i);
    }
    for (let i = 0; i < n; i++){
      const v = P[i];
      const gx = Math.floor(v.x / cell), gy = Math.floor(v.y / cell);
      for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++){
        const bucket = hash.get((gx + ox) + ':' + (gy + oy));
        if (!bucket) continue;
        for (const j of bucket){
          let dj = Math.abs(i - j);
          dj = Math.min(dj, n - dj);
          if (dj <= 2) continue;
          const dx = v.x - P[j].x, dy = v.y - P[j].y;
          const d2 = dx * dx + dy * dy;
          if (d2 < REP * REP && d2 > 1e-9){
            const d = Math.sqrt(d2);
            const f = (REP - d) / REP * 0.6 * (d / (d + 0.02));
            fx[i] += dx / d * f; fy[i] += dy / d * f;
          }
        }
      }
    }
    // outward growth along the local normal + seeded jitter
    for (let i = 0; i < n; i++){
      const a = P[(i - 1 + n) % n], b = P[(i + 1) % n], v = P[i];
      let nx = -(b.y - a.y), ny = (b.x - a.x);
      const nl = Math.hypot(nx, ny) || 1;
      nx /= nl; ny /= nl;
      if (nx * v.x + ny * v.y < 0){ nx = -nx; ny = -ny; }
      const grow = growing ? 0.0045 * Math.max(0, 1 - Math.hypot(v.x, v.y) / CAP) : 0;
      fx[i] += nx * grow + (rng() - 0.5) * 0.0025;
      fy[i] += ny * grow + (rng() - 0.5) * 0.0025;
    }
    // integrate in small clamped steps, with radius cap
    for (let i = 0; i < n; i++){
      let mx = fx[i], my = fy[i];
      const ml = Math.hypot(mx, my), MAXMOVE = 0.012;
      if (ml > MAXMOVE){ mx *= MAXMOVE / ml; my *= MAXMOVE / ml; }
      P[i].x += mx; P[i].y += my;
      const r = Math.hypot(P[i].x, P[i].y);
      if (r > CAP){ P[i].x *= CAP / r; P[i].y *= CAP / r; }
    }
    // subdivide stretched edges while the front still wants length
    if (growing && P.length < 900){
      const out = [];
      for (let i = 0; i < P.length; i++){
        const a = P[i], b = P[(i + 1) % P.length];
        out.push(a);
        if (Math.hypot(b.x - a.x, b.y - a.y) > LMAX){
          out.push({ x: (a.x + b.x) / 2 + (rng() - 0.5) * 0.012,
                     y: (a.y + b.y) / 2 + (rng() - 0.5) * 0.012 });
        }
      }
      P = out;
    }
  }
  return P;
}

/* ---------- marching squares (strategies 3 and 4) ---------- */
function contourSegments(field, N, level){
  // field: Float32Array (N+1)^2 over square domain; returns segment list in grid coords
  const segs = [];
  const idx = (i, j) => j * (N + 1) + i;
  for (let j = 0; j < N; j++){
    for (let i = 0; i < N; i++){
      const a = field[idx(i, j)], b = field[idx(i + 1, j)],
            c = field[idx(i + 1, j + 1)], d = field[idx(i, j + 1)];
      let code = 0;
      if (a > level) code |= 8;
      if (b > level) code |= 4;
      if (c > level) code |= 2;
      if (d > level) code |= 1;
      if (code === 0 || code === 15) continue;
      const top = () => [i + (level - a) / (b - a), j];
      const right = () => [i + 1, j + (level - b) / (c - b)];
      const bottom = () => [i + (level - d) / (c - d), j + 1];
      const left = () => [i, j + (level - a) / (d - a)];
      const seg = (p, q) => segs.push([p[0], p[1], q[0], q[1]]);
      // saddle cases (5,10) resolved by corner average
      const avg = (a + b + c + d) / 4;
      switch (code){
        case 1: case 14: seg(left(), bottom()); break;
        case 2: case 13: seg(bottom(), right()); break;
        case 3: case 12: seg(left(), right()); break;
        case 4: case 11: seg(top(), right()); break;
        case 6: seg(top(), bottom()); break;
        case 7: case 8: seg(left(), top()); break;
        case 9: seg(top(), bottom()); break;
        case 5:
          if (avg > level){ seg(left(), top()); seg(bottom(), right()); }
          else { seg(left(), bottom()); seg(top(), right()); }
          break;
        case 10:
          if (avg > level){ seg(left(), bottom()); seg(top(), right()); }
          else { seg(left(), top()); seg(bottom(), right()); }
          break;
      }
    }
  }
  return segs;
}
function sampleField(fn, N, half){
  const f = new Float32Array((N + 1) * (N + 1));
  for (let j = 0; j <= N; j++){
    for (let i = 0; i <= N; i++){
      f[j * (N + 1) + i] = fn(-half + 2 * half * i / N, -half + 2 * half * j / N);
    }
  }
  return f;
}

/* ---------- drawing helpers ---------- */
function drawClosedPath(pts, toX, toY, color, width){
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.setLineDash([]);
  ctx.beginPath();
  pts.forEach((p, i) => {
    const x = toX(p.x), y = toY(p.y);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.stroke();
}
function drawSegs(segs, N, half, toX, toY, color, width){
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.setLineDash([]);
  ctx.beginPath();
  for (const s of segs){
    ctx.moveTo(toX(-half + 2 * half * s[0] / N), toY(-half + 2 * half * s[1] / N));
    ctx.lineTo(toX(-half + 2 * half * s[2] / N), toY(-half + 2 * half * s[3] / N));
  }
  ctx.stroke();
}
function dashedCircle(cx, cy, r, color, dash){
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.setLineDash(dash);
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ---------- the plate ---------- */
let seed = (() => {
  const q = new URLSearchParams(location.search).get('seed');
  const n = q !== null ? parseInt(q, 10) : NaN;
  return Number.isFinite(n) ? n : 272;
})();

function draw(){
  const size = stage.clientWidth;
  if (!size) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const W = size, H = size;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);

  // paper grain (fixed seed, same for every family)
  const grain = mulberry32(7);
  ctx.fillStyle = 'rgba(120,100,60,0.05)';
  for (let i = 0; i < 700; i++){
    ctx.fillRect(grain() * W, grain() * H, 1, 1);
  }

  // build the family from the seed
  const rng = mulberry32((seed * 2654435761) >>> 0);
  const { anchors, pts: base } = baseShape(rng);

  // plate geometry
  const S = W;
  const cs = S / 2;
  const pad = Math.max(10, cs * 0.055);
  const Rb = cs * 0.315;

  // shared baseline grid: fine dotted lattice across the whole plate
  ctx.fillStyle = 'rgba(140,124,90,0.22)';
  const gstep = S / 24;
  for (let gx = gstep; gx < S; gx += gstep){
    for (let gy = gstep; gy < S; gy += gstep){
      ctx.fillRect(gx - 0.5, gy - 0.5, 1, 1);
    }
  }

  // plate border + hairline dividers
  ctx.strokeStyle = 'rgba(150,132,92,0.75)';
  ctx.lineWidth = 1;
  ctx.setLineDash([]);
  ctx.strokeRect(0.5, 0.5, S - 1, S - 1);
  ctx.beginPath();
  ctx.moveTo(S / 2, 0); ctx.lineTo(S / 2, S);
  ctx.moveTo(0, S / 2); ctx.lineTo(S, S / 2);
  ctx.stroke();

  const strategies = [
    { name: 'HARMONIC OUTLINE',        clause: 'eight sines folded into one loop' },
    { name: 'DIFFERENTIAL GROWTH',     clause: 'points nudged apart until they wrinkle' },
    { name: 'ISOCONTOURS',             clause: 'one height traced in a seeded field' },
    { name: 'METABALL UNION',          clause: 'circles melted into a single edge' }
  ];

  // per-cell data, all from the same seed stream
  const harmonic = harmonicOutline(base, 8);
  const grown = growBlob(base, rng);

  const HALF = 1.42, GN = 110;
  const CS3 = 1.14;   // sample the contour field slightly far out, so shorelines sit inside the cell
  const contourField = sampleField((x, y) => {
    x *= CS3; y *= CS3;
    let v = 0.36 * Math.exp(-(x * x + y * y) / (2 * 0.9 * 0.9));
    for (const a of anchors){
      const dx = x - a.x, dy = y - a.y;
      v += Math.exp(-(dx * dx + dy * dy) / (2 * 0.34 * 0.34));
    }
    return v;
  }, GN, HALF);
  let fmax = 0;
  for (let i = 0; i < contourField.length; i++) if (contourField[i] > fmax) fmax = contourField[i];

  const balls = anchors.map(a => ({
    x: a.x * 0.52, y: a.y * 0.52,
    r: 0.32 + rng() * 0.16
  }));
  const metaField = sampleField((x, y) => {
    let v = 0;
    for (const b of balls){
      const dx = x - b.x, dy = y - b.y;
      v += (b.r * b.r) / (dx * dx + dy * dy + 1e-6);
    }
    return v;
  }, GN, HALF);

  for (let cell = 0; cell < 4; cell++){
    const col = cell % 2, row = Math.floor(cell / 2);
    const ox = col * cs, oy = row * cs;
    const cx = ox + cs / 2, cy = oy + cs / 2 + cs * 0.06;
    const toX = (u) => cx + u * Rb;
    const toY = (u) => cy + u * Rb;

    // label block, shared annotation grammar
    ctx.fillStyle = LABEL;
    ctx.font = '600 ' + Math.max(9, cs * 0.052) + 'px Georgia, serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    try { ctx.letterSpacing = '1.5px'; } catch (e) {}
    ctx.fillText((cell + 1) + ' · ' + strategies[cell].name, ox + pad + 2, oy + pad + Math.max(10, cs * 0.05));
    try { ctx.letterSpacing = '0px'; } catch (e) {}
    ctx.fillStyle = CLAUSE;
    ctx.font = 'italic ' + Math.max(8.5, cs * 0.046) + 'px Georgia, serif';
    ctx.fillText(strategies[cell].clause, ox + pad + 2, oy + pad + Math.max(10, cs * 0.05) + Math.max(12, cs * 0.062));

    // shared construction: dashed guide circle, one blob radius
    dashedCircle(cx, cy, Rb, 'rgba(150,133,94,0.5)', [4, 4]);

    if (cell === 0){
      // the original outline, dotted; the truncated reconstruction, ink
      ctx.strokeStyle = DOTTED;
      ctx.lineWidth = 1;
      ctx.setLineDash([1.5, 3]);
      ctx.beginPath();
      base.forEach((p, i) => {
        const x = toX(p.x), y = toY(p.y);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.stroke();
      ctx.setLineDash([]);
      drawClosedPath(harmonic, toX, toY, INK, Math.max(1.4, cs * 0.008));
    }

    if (cell === 1){
      // where it started, dotted; the grown front, ink with its nodes
      ctx.strokeStyle = DOTTED;
      ctx.lineWidth = 1;
      ctx.setLineDash([1.5, 3]);
      ctx.beginPath();
      base.forEach((p, i) => {
        const x = toX(p.x), y = toY(p.y);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.stroke();
      ctx.setLineDash([]);
      drawClosedPath(grown, toX, toY, INK, Math.max(1.1, cs * 0.006));
      ctx.fillStyle = INK;
      for (const p of grown){
        ctx.beginPath();
        ctx.arc(toX(p.x), toY(p.y), Math.max(0.7, cs * 0.0032), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (cell === 2){
      // faint field samples
      ctx.fillStyle = 'rgba(41,35,24,0.28)';
      for (let j = 0; j <= GN; j += 7){
        for (let i = 0; i <= GN; i += 7){
          const v = contourField[j * (GN + 1) + i] / fmax;
          if (v < 0.12) continue;
          const x = -HALF + 2 * HALF * i / GN, y = -HALF + 2 * HALF * j / GN;
          ctx.beginPath();
          ctx.arc(toX(x), toY(y), 0.6 + v * 1.3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // anchor markers
      ctx.strokeStyle = CONSTR;
      ctx.lineWidth = 1;
      for (const a of anchors){
        ctx.beginPath();
        ctx.arc(toX(a.x / CS3), toY(a.y / CS3), 3, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.fillStyle = INK;
      for (const a of anchors){
        ctx.beginPath();
        ctx.arc(toX(a.x / CS3), toY(a.y / CS3), 1.3, 0, Math.PI * 2);
        ctx.fill();
      }
      // three heights: shoreline strong, the rest lighter
      drawSegs(contourSegments(contourField, GN, fmax * 0.42), GN, HALF, toX, toY, INK, Math.max(1.4, cs * 0.008));
      drawSegs(contourSegments(contourField, GN, fmax * 0.62), GN, HALF, toX, toY, 'rgba(41,35,24,0.55)', Math.max(1, cs * 0.005));
      drawSegs(contourSegments(contourField, GN, fmax * 0.80), GN, HALF, toX, toY, 'rgba(41,35,24,0.35)', Math.max(1, cs * 0.005));
    }

    if (cell === 3){
      // the fences: dashed source circles with centers
      for (const b of balls){
        dashedCircle(toX(b.x), toY(b.y), b.r * Rb, CONSTR, [4, 4]);
      }
      ctx.fillStyle = INK;
      for (const b of balls){
        ctx.beginPath();
        ctx.arc(toX(b.x), toY(b.y), 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
      // the melted union, ink
      drawSegs(contourSegments(metaField, GN, 1.0), GN, HALF, toX, toY, INK, Math.max(1.4, cs * 0.008));
    }
  }

  seedEl.textContent = 'seed ' + seed;
}

function reseed(){
  seed = Math.floor(Math.random() * 999999) + 1;
  draw();
}
document.body.addEventListener('click', (e) => {
  if (e.target.closest('a')) return;
  reseed();
});
document.body.addEventListener('keydown', (e) => {
  if (e.key === 'n' || e.key === 'N') reseed();
});
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(draw, 120);
});
draw();
</script>
