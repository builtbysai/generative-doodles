<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Territory</title>
<style>
  html, body { margin:0; padding:0; background:#0B0E13; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
'use strict';
/* №1184 — Signal Territory (Jeff Kolar JK1, RANGE: Local, Distant, Fringe)
   One transmitter at center divides the field into three territories.
   400 particles drift on closed-form currents; territory (from distance
   to center) sets how each renders: LOCAL bright with a trail, DISTANT
   stuttering amber, FRINGE a rare blue blink. A pulse ring expands every
   4s and upgrades particles it crosses for that frame. Dragging lays an
   interference shadow: particles inside drop one territory for 3s.
   Silent — the broadcast is drawn. */

// ---------- seeded RNG ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hash01(n){var x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}

// ---------- constants ----------
var BG='#0B0E13';
var ORANGE='#FF6A00', LOCALC='#FFD9A0', DISTC='#C77B3F', FRINGEC='#4D9FFF';
var T0=6.3;                  // frame one: pulse at phase 0.575, mid-field
var PULSE_T=4;               // pulse period, seconds
var N=400;

// ---------- particles (seeded, closed-form drift) ----------
var rng=mulberry32(1184001);
var P=[];
for(var i=0;i<N;i++){
  P.push({
    bx:rng()*2-1, by:rng()*2-1,              // base position, unit field coords
    ax:0.03+rng()*0.09, ay:0.03+rng()*0.09,  // drift amplitude (unit coords)
    wx:0.05+rng()*0.16, wy:0.05+rng()*0.16,  // drift frequency (rad/s, slow)
    px:rng()*6.2832, py:rng()*6.2832         // drift phase
  });
}
function posAt(p,t){
  return [p.bx + p.ax*Math.sin(p.wx*t+p.px),
          p.by + p.ay*Math.sin(p.wy*t+p.py)];
}

// ---------- canvas / view ----------
var canvas=document.getElementById('cv');
var ctx=canvas.getContext('2d');
var W=0,H=0,phone=false;
function viewW(){ var vv=window.visualViewport; return vv?vv.width:window.innerWidth; }
function viewH(){ var vv=window.visualViewport; return vv?vv.height:window.innerHeight; }
function fit(){
  W=viewW(); H=viewH();
  canvas.width=W; canvas.height=H;
  var sw=window.screen?Math.min(window.screen.width,window.screen.height):9999;
  phone = sw<700 || H>W*1.15;
}
if(window.visualViewport){ window.visualViewport.addEventListener('resize',fit); }
window.addEventListener('resize',fit);
fit();

// ---------- interference shadow (drag samples) ----------
var shadow=[]; // {x,y,t} pixel coords + piece-time
function shadowLevel(x,y,t){
  for(var k=0;k<shadow.length;k++){
    var s=shadow[k], age=t-s.t;
    if(age<0||age>=3) continue;
    var dx=x-s.x, dy=y-s.y;
    if(dx*dx+dy*dy<46*46) return true;
  }
  return false;
}

// ---------- drawing ----------
function draw(t){
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
  var cx=W/2, cy=H/2;
  var side=Math.min(W,H)*(phone?0.94:0.88); // square field, centered
  var R=side/2;                              // half-width of the field
  var unit=R;                                // unit coords -> px

  // pulse state
  var phase=(t%PULSE_T)/PULSE_T;
  var pulseR=phase*R*1.02;                   // expands to the edge

  // ----- territory rings -----
  // FRINGE: dashed arcs, rotating very slowly
  ctx.strokeStyle=FRINGEC; ctx.globalAlpha=0.40; ctx.lineWidth=1;
  var rot=t*0.02;
  for(var d=0;d<8;d++){
    var a0=rot+d*(Math.PI/4), a1=a0+Math.PI/7;
    ctx.beginPath(); ctx.arc(cx,cy,R,a0,a1); ctx.stroke();
  }
  // DISTANT: wobbly ring, polyline
  ctx.strokeStyle=ORANGE; ctx.globalAlpha=0.45; ctx.lineWidth=1;
  ctx.beginPath();
  for(var a=0;a<=64;a++){
    var th=a/64*Math.PI*2;
    var rr=0.55*R+Math.sin(th*7+t*0.7)*3;
    var x=cx+Math.cos(th)*rr, y=cy+Math.sin(th)*rr;
    if(a===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.stroke();
  // LOCAL: crisp circle
  ctx.strokeStyle=ORANGE; ctx.globalAlpha=0.90; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(cx,cy,0.25*R,0,Math.PI*2); ctx.stroke();
  ctx.globalAlpha=1;

  // ----- pulse ring -----
  ctx.strokeStyle=ORANGE; ctx.globalAlpha=(1-phase)*0.8; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,pulseR,0,Math.PI*2); ctx.stroke();
  ctx.globalAlpha=1;

  // ----- particles -----
  var step6=Math.floor(t*6), step2=Math.floor(t*2);
  for(var i=0;i<N;i++){
    var p=P[i], pos=posAt(p,t);
    var x=cx+pos[0]*unit, y=cy+pos[1]*unit;
    if(x<-8||x>W+8||y<-8||y>H+8) continue;
    var dx=x-cx, dy=y-cy, dist=Math.sqrt(dx*dx+dy*dy);
    var terr = dist<0.25*R ? 0 : (dist<0.55*R ? 1 : 2); // 0 LOCAL 1 DISTANT 2 FRINGE
    // pulse upgrade: inside the band, one level up
    if(Math.abs(dist-pulseR)<=18 && terr>0) terr--;
    // interference shadow: one level down
    if(shadowLevel(x,y,t)){ if(terr<2) terr++; else continue; } // FRINGE -> silence

    if(terr===0){
      // LOCAL: short clean trail + sharp bright dot
      var h1=posAt(p,t-0.3), h2=posAt(p,t-0.6);
      ctx.fillStyle=LOCALC;
      ctx.globalAlpha=0.28; ctx.fillRect(cx+h2[0]*unit-1, cy+h2[1]*unit-1, 2, 2);
      ctx.globalAlpha=0.55; ctx.fillRect(cx+h1[0]*unit-1.25, cy+h1[1]*unit-1.25, 2.5, 2.5);
      ctx.globalAlpha=1;    ctx.fillRect(x-1.5, y-1.5, 3, 3);
    } else if(terr===1){
      // DISTANT: stuttering amber dot
      var s=hash01(i*31.7+step6*7.13);
      var al = s<0.22 ? 0.12 : (s<0.55 ? 0.45 : 0.9);
      ctx.fillStyle=DISTC; ctx.globalAlpha=al;
      ctx.fillRect(x-1.25, y-1.25, 2.5, 2.5);
    } else {
      // FRINGE: fragment, visible only on rare frames
      if(hash01(i*17.3+step2*13.7)<0.3){
        ctx.fillStyle=FRINGEC; ctx.globalAlpha=0.75;
        ctx.fillRect(x-2, y-1, 4, 2);
      }
    }
  }
  ctx.globalAlpha=1;

  // ----- interference shadow discs (subtle, newest samples) -----
  for(var k2=Math.max(0,shadow.length-14);k2<shadow.length;k2++){
    var s2=shadow[k2], age2=t-s2.t;
    if(age2<0||age2>=3) continue;
    var fade=1-age2/3;
    ctx.fillStyle='#000000'; ctx.globalAlpha=0.35*fade;
    ctx.beginPath(); ctx.arc(s2.x,s2.y,46,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=FRINGEC; ctx.globalAlpha=0.18*fade; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(s2.x,s2.y,46,0,Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha=1;

  // ----- transmitter -----
  ctx.fillStyle=ORANGE;
  ctx.beginPath(); ctx.arc(cx,cy,5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=ORANGE; ctx.lineWidth=1.5; ctx.globalAlpha=0.9;
  ctx.beginPath();
  ctx.moveTo(cx-11,cy); ctx.lineTo(cx-7,cy);
  ctx.moveTo(cx+7,cy);  ctx.lineTo(cx+11,cy);
  ctx.moveTo(cx,cy-11); ctx.lineTo(cx,cy-7);
  ctx.moveTo(cx,cy+7);  ctx.lineTo(cx,cy+11);
  ctx.stroke(); ctx.globalAlpha=1;
  ctx.fillStyle=ORANGE; ctx.font='10px monospace'; ctx.textAlign='left';
  ctx.fillText('TX', cx+13, cy+3);

  // ----- territory labels along the top-right diagonal -----
  ctx.font='10px monospace';
  var lx=cx+0.25*R*0.707+8, ly=cy-0.25*R*0.707-8;
  ctx.fillStyle=LOCALC;  ctx.fillText('LOCAL', lx, ly);
  lx=cx+0.55*R*0.707+8; ly=cy-0.55*R*0.707-8;
  ctx.fillStyle=DISTC;   ctx.fillText('DISTANT', lx, ly);
  lx=cx+0.90*R*0.707+8; ly=cy-0.90*R*0.707-8;
  if(lx>W-56) lx=W-56; if(ly<12) ly=12;
  ctx.fillStyle=FRINGEC; ctx.fillText('FRINGE', lx, ly);
}

// ---------- pointer: interference shadow ----------
var tOffset=0; // piece-time offset, set on first frame
var dragging=false, lastSample=-1;
function nowSec(){ return performance.now()/1000; }
canvas.addEventListener('pointerdown',function(e){ dragging=true; lastSample=-1; addSample(e); });
canvas.addEventListener('pointermove',function(e){ if(dragging) addSample(e); });
window.addEventListener('pointerup',function(){ dragging=false; });
function addSample(e){
  var t=T0+(nowSec()-t0wall);
  if(t-lastSample<0.06) return;
  lastSample=t;
  shadow.push({x:e.clientX, y:e.clientY, t:t});
  if(shadow.length>60) shadow.splice(0, shadow.length-60);
}

// ---------- run ----------
var t0wall=nowSec();
draw(T0);
if(typeof requestAnimationFrame==='function'){
  var loop=function(){
    draw(T0+(nowSec()-t0wall));
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
