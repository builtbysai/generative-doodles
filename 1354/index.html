<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirror Shield Line</title>
<style>
  html, body { margin: 0; padding: 0; background: #201a14; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). Never Math.random: frame one must be reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var GROUND = '#201a14';
  var PLYWOOD = '#a9825a';
  var PLYWOOD_DARK = '#7a5c38';
  var SILVER = '#c8ccd2';
  var TAPE = '#6e6e6e';
  var WARM = '#e8d9a0';

  // Sky bands in unit space (top to bottom). Layered flat-alpha rects only,
  // never gradients: the prompt's "drifting gradient" is bands by design.
  var SKY_BANDS = [
    { y: 0.00, h: 0.30, c: '#6f93b8' },
    { y: 0.30, h: 0.22, c: '#9db8cc' },
    { y: 0.52, h: 0.16, c: '#d8cfa8' },
    { y: 0.68, h: 0.17, c: '#c89a72' },
    { y: 0.85, h: 0.15, c: '#8a6a58' }
  ];
  var DISC_U = 0.62, DISC_V = 0.30; // warm disc fixed in sky space

  var N = 6;
  var layout = null; // per-shield {cx, cy, w, h, base, period, phase}
  var lastW = -1, lastH = -1, lastT = 0;
  var pointers = {}; // pointerId -> {shield, startX, startTilt, tilt}
  var releases = {}; // shield index -> {t, tilt, swayAtRelease}

  function viewport() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.width === 'number') {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    return { w: w, h: h };
  }

  function computeLayout(W, H) {
    var rng = mulberry32(1354000);
    var gap = W >= 700 ? 26 : 8;
    var w = Math.min(150, Math.floor((W - 32 - (N - 1) * gap) / N));
    if (w < 30) w = 30;
    var h = Math.round(w * 1.4);
    var total = N * w + (N - 1) * gap;
    var x0 = (W - total) / 2;
    var midY = H * 0.5;
    var arcDip = W >= 700 ? 20 : 8;
    var halfSpan = total / 2;
    var arr = [];
    for (var i = 0; i < N; i++) {
      var cx = x0 + i * (w + gap) + w / 2;
      var dx = (cx - W / 2) / halfSpan;
      var cy = midY + arcDip * (1 - dx * dx);
      var base = (rng() * 2 - 1) * 0.15;
      var period = 7 + rng() * 6;
      var phase = rng() * Math.PI * 2;
      arr.push({ cx: cx, cy: cy, w: w, h: h, base: base, period: period, phase: phase });
    }
    return arr;
  }

  function swayAt(i, t) {
    var s = layout[i];
    return 0.015 * Math.sin((t / s.period) * Math.PI * 2 + s.phase);
  }

  function currentTilt(i, t) {
    // A held pointer owns its shield's tilt outright (multi-touch chord).
    for (var id in pointers) {
      if (pointers[id].shield === i) return pointers[id].tilt;
    }
    var s = layout[i];
    var sway = swayAt(i, t);
    var rel = releases[i];
    if (rel) {
      // Slow drift back (tau 6 s): a single pointer can still build the
      // chord shield by shield before the row relaxes to its own bases.
      var decay = Math.exp(-(t - rel.t) / 6);
      return s.base + sway + (rel.tilt - (s.base + rel.sway)) * decay;
    }
    return s.base + sway;
  }

  function drawSkyFace(x, y, w, h, slice, t, seedBase) {
    // Silver base.
    ctx.fillStyle = SILVER;
    ctx.fillRect(x, y, w, h);
    var drift = 0.03 * Math.sin((t / 75) * Math.PI * 2);
    var shift = slice + drift;
    var yy, band;
    for (var b = 0; b < SKY_BANDS.length; b++) {
      band = SKY_BANDS[b];
      var y0 = band.y + shift;
      y0 = y0 - Math.floor(y0);
      ctx.fillStyle = band.c;
      ctx.fillRect(x, y + y0 * h, w, band.h * h + 1);
      ctx.fillRect(x, y + (y0 - 1) * h, w, band.h * h + 1);
    }
    // Warm disc fixed in sky space; visible only when inside this shield's window.
    var winU0 = 0.5 + slice * 0.55;
    var winW = 0.36;
    if (DISC_U >= winU0 && DISC_U <= winU0 + winW) {
      var dv = DISC_V + shift;
      dv = dv - Math.floor(dv);
      var dcx = x + ((DISC_U - winU0) / winW) * w;
      var dcy = y + dv * h;
      var r = 0.08 * w;
      ctx.fillStyle = WARM;
      ctx.beginPath();
      ctx.arc(dcx, dcy, r, 0, Math.PI * 2);
      ctx.fill();
    }
    // Seeded vertical film streaks (static per shield, low alpha).
    var rng = mulberry32(seedBase);
    for (var k = 0; k < 5; k++) {
      var sx = x + rng() * w;
      ctx.fillStyle = k % 2 === 0 ? 'rgba(255,255,255,0.05)' : 'rgba(40,44,52,0.06)';
      ctx.fillRect(sx, y, 1 + rng() * 2, h);
    }
  }

  function draw(t) {
    lastT = t;
    var vp = viewport();
    var W = vp.w, H = vp.h;
    if (W < 1) W = 1;
    if (H < 1) H = 1;
    if (canvas.width !== W) canvas.width = W;
    if (canvas.height !== H) canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    if (!layout || W !== lastW || H !== lastH) {
      layout = computeLayout(W, H);
      lastW = W; lastH = H;
    }

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // Current tilts and alignment: all within tolerance -> sky snaps whole.
    var tilts = [];
    var i, mn = 1e9, mx = -1e9, sum = 0;
    for (i = 0; i < N; i++) {
      var ti = currentTilt(i, t);
      tilts.push(ti);
      if (ti < mn) mn = ti;
      if (ti > mx) mx = ti;
      sum += ti;
    }
    var aligned = (mx - mn) < 0.09;
    var meanTilt = sum / N;

    var border = Math.max(6, Math.round(layout[0].w * 0.055));
    for (i = 0; i < N; i++) {
      var s = layout[i];
      var tilt = tilts[i];
      var slice = aligned ? meanTilt * 0.55 : tilt * 0.55;

      // Soft ground shadow (one flat-alpha ellipse).
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(s.cx, s.cy + s.h / 2 + border + 6, s.w * 0.55, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(s.cx, s.cy);
      ctx.rotate(tilt * 0.5);

      // Plywood body.
      ctx.fillStyle = PLYWOOD;
      ctx.fillRect(-s.w / 2 - border, -s.h / 2 - border, s.w + border * 2, s.h + border * 2);
      // Seeded grain flecks on the plywood.
      var grng = mulberry32(1354000 + i * 7919);
      for (var g = 0; g < 24; g++) {
        var gx = -s.w / 2 - border + grng() * (s.w + border * 2);
        var gy = -s.h / 2 - border + grng() * (s.h + border * 2);
        var onFace = gx > -s.w / 2 && gx < s.w / 2 && gy > -s.h / 2 && gy < s.h / 2;
        if (onFace) continue;
        ctx.fillStyle = g % 2 === 0 ? 'rgba(60,42,22,0.20)' : 'rgba(255,240,210,0.12)';
        ctx.fillRect(gx, gy, 1.5, 1.5);
      }
      // Nail dots at the plywood corners.
      ctx.fillStyle = PLYWOOD_DARK;
      var nx = s.w / 2 + border - 4, ny = s.h / 2 + border - 4;
      ctx.beginPath();
      ctx.arc(-nx, -ny, 2, 0, Math.PI * 2);
      ctx.arc(nx, -ny, 2, 0, Math.PI * 2);
      ctx.arc(-nx, ny, 2, 0, Math.PI * 2);
      ctx.arc(nx, ny, 2, 0, Math.PI * 2);
      ctx.fill();

      // Reflective face, clipped to the shield rect.
      ctx.save();
      ctx.beginPath();
      ctx.rect(-s.w / 2, -s.h / 2, s.w, s.h);
      ctx.clip();
      drawSkyFace(-s.w / 2, -s.h / 2, s.w, s.h, slice, t, 1354000 + i * 7919 + 77);
      if (aligned) {
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
      }
      ctx.restore();

      // Face outline.
      ctx.strokeStyle = 'rgba(30,26,20,0.55)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-s.w / 2, -s.h / 2, s.w, s.h);

      // Duct-tape: top strip, corner patches, one vertical seam.
      ctx.fillStyle = TAPE;
      ctx.globalAlpha = 0.9;
      ctx.fillRect(-s.w / 2, -s.h / 2 - border, s.w, border);
      ctx.fillRect(-s.w / 2 - 2, -s.h / 2 - border - 2, 14, 12);
      ctx.fillRect(s.w / 2 - 12, -s.h / 2 - border - 2, 14, 12);
      ctx.globalAlpha = 0.75;
      ctx.fillRect(-s.w / 6 - 1.5, -s.h / 2, 3, s.h);
      ctx.globalAlpha = 1;

      ctx.restore();
    }
  }

  function hitShield(x, y) {
    if (!layout) return -1;
    var best = -1, bestD = 1e9;
    for (var i = 0; i < N; i++) {
      var s = layout[i];
      var dx = Math.abs(x - s.cx), dy = Math.abs(y - s.cy);
      if (dx <= s.w / 2 + 12 && dy <= s.h / 2 + 12) {
        var d = dx + dy;
        if (d < bestD) { bestD = d; best = i; }
      }
    }
    return best;
  }

  function pid(ev) {
    return (ev.pointerId !== undefined && ev.pointerId !== null) ? ev.pointerId : 'mouse';
  }

  function onDown(ev) {
    var id = pid(ev);
    if (pointers[id]) return;
    var i = hitShield(ev.clientX, ev.clientY);
    if (i < 0) return;
    var t0 = currentTilt(i, lastT);
    pointers[id] = { shield: i, startX: ev.clientX, startTilt: t0, tilt: t0 };
    if (ev.preventDefault) ev.preventDefault();
    draw(lastT);
  }

  function onMove(ev) {
    var p = pointers[pid(ev)];
    if (!p) return;
    var dx = ev.clientX - p.startX;
    p.tilt = Math.max(-0.42, Math.min(0.42, p.startTilt + dx * 0.0035));
    draw(lastT);
  }

  function onUp(ev) {
    var id = pid(ev);
    var p = pointers[id];
    if (!p) return;
    releases[p.shield] = { t: lastT, tilt: p.tilt, sway: swayAt(p.shield, lastT) };
    delete pointers[id];
    draw(lastT);
  }

  function onResize() {
    layout = null;
    draw(lastT);
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', onResize);
    }
    if (window.addEventListener) {
      window.addEventListener('resize', onResize);
    }
  }

  // Frame one: synchronous, constant phase. The clock starts only with the rAF loop.
  draw(0);
  if (typeof requestAnimationFrame === 'function') {
    var startTs = null;
    // Plain function declaration: a named function expression here would
    // throw ReferenceError in a real browser (the No.1278 lesson).
    function loop(ts) {
      if (startTs === null) startTs = ts;
      draw((ts - startTs) / 1000);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
