<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№128 · Free Mint</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0E0D0B; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(232,226,210,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">touch and lift to mint an edition</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry32(seed){ let a=seed>>>0; return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

// No.128 Free Mint: a calm field of faint drifting strokes. Wherever a finger
// lifts, a small seeded composition blooms (200-400 strokes, one of five
// micro-generators, its own two-ink duo), signs itself with a tiny edition
// number, then detaches and drifts to a slow orbit around the frame edge.
// The frame becomes the visitor's collection wall. Cap 24, oldest fade out.
const GROUND='#0E0D0B', DRIFT='#3A352C', GREY='#8A8578';
const DUOS=[['#C08A3E','#F2E3C2'],['#33406E','#E8E2D2'],['#A34A28','#F2EDE4'],['#8A5A2B','#EDE6D6'],['#46586E','#E6DFCE'],['#7A3B2E','#F0E7D3']];
const GENNAMES=['arcs','flow','rings','hatch','knot'];
let W=0,H=0;
let strokes=[], editions=[], counter=0, mintSeed=987123;
let touch=null, lastTapMs=-9999, tapX=0, tapY=0, clearAt=-1, lastMs=null;

function slotPos(i,n){
  // slots around the perimeter of an inset rectangle, evenly by index
  const m=80, x0=m, y0=m, x1=W-m, y1=H-m, pw=x1-x0, ph=y1-y0, per=2*(pw+ph);
  let d=(i+0.5)/Math.max(1,n)*per;
  if(d<pw) return [x0+d,y0];
  d-=pw; if(d<ph) return [x1,y0+d];
  d-=ph; if(d<pw) return [x1-d,y1];
  d-=pw; return [x0,y1-d];
}
function bloomStrokes(seed,gen){
  const R=mulberry32(seed), out=[], S=200;
  const seg=(x1,y1,x2,y2,c)=>out.push({x1,y1,x2,y2,c});
  if(gen===0){ // arcs: nested partial circles around two poles
    const p1=[60+R()*80,60+R()*80], p2=[60+R()*80,60+R()*80];
    for(let i=0;i<300;i++){ const p=R()<0.5?p1:p2, r=6+R()*86, a0=R()*6.283, sw=0.4+R()*1.8, c=R()<0.72?0:1, n=3;
      for(let k=0;k<n;k++){ const a=a0+sw*k/n; seg(p[0]+Math.cos(a)*r,p[1]+Math.sin(a)*r,p[0]+Math.cos(a+sw/n)*r,p[1]+Math.sin(a+sw/n)*r,c); } }
  } else if(gen===1){ // flow burst: curl-ish streamers from a source
    const sx=50+R()*100, sy=50+R()*100;
    for(let i=0;i<50;i++){ let x=sx+(R()-0.5)*36, y=sy+(R()-0.5)*36, a=R()*6.283; const c=R()<0.7?0:1;
      for(let k=0;k<7;k++){ const na=a+Math.sin(x*0.045+seed)*0.65+Math.cos(y*0.05)*0.4; const nx=x+Math.cos(na)*13, ny=y+Math.sin(na)*13; seg(x,y,nx,ny,c); x=nx; y=ny; a=na; } }
  } else if(gen===2){ // rings: offset concentric rings with breaks
    const cx=100+(R()-0.5)*24, cy=100+(R()-0.5)*24;
    for(let ring=0;ring<9;ring++){ const r=10+ring*10+R()*4, gap=R()*6.283, gw=0.5+R()*1.1, c=ring%3===2?1:0, n=34;
      for(let k=0;k<n;k++){ const a=k/n*6.283; let d=Math.abs(((a-gap)%6.283+6.283)%6.283); if(d<gw||d>6.283-gw*0.3) continue; const a2=(k+1)/n*6.283; seg(cx+Math.cos(a)*r,cy+Math.sin(a)*r,cx+Math.cos(a2)*r,cy+Math.sin(a2)*r,c); } }
  } else if(gen===3){ // hatch square: two crossing hatch directions in a square
    const x0=18+R()*14, y0=18+R()*14, s=150+R()*24, gap=5+R()*2.5;
    for(let x=x0;x<x0+s;x+=gap){ const c=R()<0.78?0:1; const t=R()*0.3; seg(x,y0+s*t,x,y0+s,c); }
    for(let y=y0;y<y0+s;y+=gap){ const c=R()<0.85?0:1; const t=R()*0.3; seg(x0+s*t,y,x0+s,y,c); }
  } else { // string knot: chords between two circles of points
    const c1=[64+R()*30,100+(R()-0.5)*36], c2=[136-R()*30,100+(R()-0.5)*36], pts=[];
    for(let i=0;i<16;i++){ const a=i/16*6.283; pts.push([c1[0]+Math.cos(a)*42,c1[1]+Math.sin(a)*42]); pts.push([c2[0]+Math.cos(a)*42,c2[1]+Math.sin(a)*42]); }
    for(let i=0;i<300;i++){ const p=pts[(R()*pts.length)|0], q=pts[(R()*pts.length)|0]; if(p===q) continue; seg(p[0],p[1],q[0],q[1],R()<0.75?0:1); }
  }
  return out;
}
function mint(x,y){
  counter++; mintSeed=(mintSeed*1103515245+12345)&0x7fffffff;
  const gen=(mintSeed+counter*2)%5, duo=DUOS[((mintSeed>>3)+counter*2)%DUOS.length];
  const ed={ n:counter, gen, duo, strokes:bloomStrokes(mintSeed*31+counter*777,gen),
    x, y, sx:x, sy:y, rot:(Math.random()-0.5)*0.14, born:performance.now() };
  editions.push(ed);
  if(editions.length>24) editions.shift();
  editions.forEach((e,i)=>{ const p=slotPos(i,editions.length); e.sx=p[0]; e.sy=p[1]; });
  return ed;
}
function drawEdition(ed,nowMs){
  const age=nowMs-ed.born;
  const grow=clamp(age/650,0,1), ease=1-Math.pow(1-grow,3);
  const detach=clamp((age-1400)/2600,0,1), de=1-Math.pow(1-detach,3);
  const ox=ed.x+(ed.sx-ed.x)*de, oy=ed.y+(ed.sy-ed.y)*de;
  const sc=(0.3+0.7*ease)*(1-0.38*de); // blooms full size, settles smaller in orbit
  const fade=editions.length>=24 && ed===editions[0]?0.55:1;
  const al=clamp(age/300,0,1)*fade;
  ctx.save();
  ctx.translate(ox,oy); ctx.rotate(ed.rot*Math.min(1,age/2000)); ctx.scale(sc,sc); ctx.translate(-100,-100);
  ctx.lineWidth=1.3;
  for(const s of ed.strokes){ ctx.strokeStyle=ed.duo[s.c]; ctx.globalAlpha=al*(s.c?0.95:0.85); ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke(); }
  ctx.globalAlpha=al; ctx.fillStyle=GREY; ctx.font='10px Menlo, Consolas, monospace'; ctx.textAlign='right'; ctx.textBaseline='alphabetic';
  ctx.fillText('#'+ed.n,192,196);
  ctx.restore(); ctx.globalAlpha=1;
}
function stepField(){
  if(strokes.length<130 && Math.random()<0.6){
    const a=Math.random()*6.283;
    strokes.push({ x:Math.random()*W, y:Math.random()*H, a, len:8+Math.random()*20, life:1 });
  }
  for(const s of strokes){ s.x+=Math.cos(s.a)*0.22; s.y+=Math.sin(s.a)*0.22; s.a+=Math.sin(s.x*0.004+s.y*0.003)*0.004; s.life-=0.0016; }
  strokes=strokes.filter(s=>s.life>0 && s.x>-30 && s.x<W+30 && s.y>-30 && s.y<H+30);
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h); W=w; H=h;
  let dt=0; if(lastMs!==null) dt=Math.min(0.05,(nowMs-lastMs)/1000); lastMs=nowMs;
  stepField();
  if(clearAt>0 && nowMs>=clearAt){ editions=[]; counter=0; clearAt=-1; }
  ctx.fillStyle=GROUND; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle=DRIFT; ctx.lineWidth=1;
  for(const s of strokes){ ctx.globalAlpha=0.5*s.life; ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x+Math.cos(s.a)*s.len, s.y+Math.sin(s.a)*s.len); ctx.stroke(); }
  ctx.globalAlpha=1;
  for(const ed of editions) drawEdition(ed,nowMs);
  if(touch){ ctx.strokeStyle='rgba(232,226,210,0.35)'; ctx.beginPath(); ctx.arc(touch.x,touch.y,13+3*Math.sin(nowMs*0.012),0,6.283); ctx.stroke(); }
  return {};
}
function frame(nowMs){ return drawFrame(nowMs); }

canvas.addEventListener('pointerdown',e=>{
  const now=performance.now();
  if(now-lastTapMs<320 && Math.abs(e.clientX-tapX)<28 && Math.abs(e.clientY-tapY)<28){
    clearAt=now+420; lastTapMs=-9999; touch=null; return; // double-tap clears, after a heartbeat pause
  }
  lastTapMs=now; tapX=e.clientX; tapY=e.clientY;
  touch={x:e.clientX,y:e.clientY};
});
canvas.addEventListener('pointermove',e=>{ if(touch){ touch.x=e.clientX; touch.y=e.clientY; } });
function endP(e){
  if(touch){ mint(touch.x,touch.y); touch=null; }
}
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',()=>{ touch=null; });

// staged first frame: a young collection already on the wall, so the piece
// opens as a collection, not an empty room
function preRoll(){
  const [w,h]=viewportWH(); W=w; H=h; prep(w,h);
  for(let i=0;i<160;i++) stepField();
  const demos=[[0.30,0.34],[0.72,0.30],[0.5,0.66]];
  for(const d of demos){ const ed=mint(w*d[0],h*d[1]); ed.born=performance.now()-6000; }
  editions.forEach((e,i)=>{ const p=slotPos(i,editions.length); e.sx=p[0]; e.sy=p[1]; e.x=p[0]; e.y=p[1]; });
}
preRoll();
function loop(nowMs){ frame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
frame(performance.now());
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
