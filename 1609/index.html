<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Field of Scales</title>
<style>
html, body { margin: 0; padding: 0; background: #5B7A8C; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PHASE = 0.0;
var BREATH_S = 26.0;
var BREATH_AMP = 0.32;
var FADE_S = 2.0;
var PALETTES = [
  { name: 'slate day',   ground: '#5B7A8C', cloud: '#DCE6EC', line: '#2F4858', text: '#2F4858' },
  { name: 'ivory dawn',  ground: '#F2EAD8', cloud: '#FFFDF6', line: '#8A6F3E', text: '#8A6F3E' },
  { name: 'ember night', ground: '#0C0605', cloud: '#E84A1E', line: '#7A1408', text: '#7A1408' }
];
var SEEDS = [1609001, 1609017, 1609043, 1609079, 1609121, 1609183];
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}

/* ---- field generation: one seeded tiling per mint ---- */
function genField(seed) {
  var rng = mulberry32(seed);
  var i, j;
  /* low-frequency noise grid for the size drift */
  var GN = 6, grid = [];
  for (i = 0; i < GN * GN; i++) grid.push(rng());
  function noise(nx, ny) {
    var gx = clamp(nx, 0, 0.999) * (GN - 1), gy = clamp(ny, 0, 0.999) * (GN - 1);
    var x0 = Math.floor(gx), y0 = Math.floor(gy);
    var fx = gx - x0, fy = gy - y0;
    var sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    var a = grid[y0 * GN + x0], b = grid[y0 * GN + x0 + 1];
    var c = grid[(y0 + 1) * GN + x0], d = grid[(y0 + 1) * GN + x0 + 1];
    return (a + (b - a) * sx) + ((c + (d - c) * sx) - (a + (b - a) * sx)) * sy;
  }
  var unit = 0.04 * Math.max(VW, VH);
  var colStep = unit * 0.88, rowStep = unit * 0.38;
  var cx = VW / 2, cy = VH / 2;
  var maxR = Math.sqrt(cx * cx + cy * cy) + 1e-6;
  var cells = [], r = 0, x, y, dx, dy, dist, f;
  for (y = -rowStep; y < VH + rowStep; y += rowStep, r++) {
    var off = (r % 2) * colStep / 2;
    for (x = -colStep + off; x < VW + colStep; x += colStep) {
      dx = x - cx; dy = y - cy;
      dist = Math.sqrt(dx * dx + dy * dy) / maxR;
      f = 0.72 + 0.58 * Math.pow(dist, 1.4) + 0.14 * (noise(x / VW, y / VH) - 0.5);
      f = clamp(f, 0.65, 1.4);
      cells.push({
        x: x, y: y,
        w: unit * f, h: unit * f * 0.72,
        base: -0.5 + rng() * 1.0,
        phase: rng() * TAU
      });
    }
  }
  return { seed: seed, cells: cells };
}
var fieldCache = {};
function fieldFor(seed) {
  var key = seed + ':' + VW + 'x' + VH;
  if (!fieldCache[key]) fieldCache[key] = genField(seed);
  return fieldCache[key];
}

/* ---- mint state: one palette per mint, tap cycles the fixed sequence ---- */
var mintIdx = 0;
var cur = { pal: 0, seed: SEEDS[0] };
var prev = null;
var fadeStart = -1;
function fadeK(t) {
  if (!prev || fadeStart < 0) return 1;
  return smooth((t - fadeStart) / FADE_S);
}
function nextMint(t) {
  prev = cur;
  mintIdx++;
  cur = { pal: mintIdx % 3, seed: SEEDS[mintIdx % SEEDS.length] };
  fadeStart = t;
  if (reduced) { prev = null; fadeStart = -1; }
  draw(lastT);
}

/* ---- scale unit: arched path, cross-hatched inside ---- */
function scalePath(w, h) {
  ctx.beginPath();
  ctx.moveTo(-w / 2, h * 0.12);
  ctx.quadraticCurveTo(-w * 0.48, -h * 0.55, 0, -h * 0.5);
  ctx.quadraticCurveTo(w * 0.48, -h * 0.55, w / 2, h * 0.12);
  ctx.quadraticCurveTo(0, h * 0.42, -w / 2, h * 0.12);
  ctx.closePath();
}
function drawScale(cell, t, pal) {
  var w = cell.w, h = cell.h;
  var angle = cell.base + BREATH_AMP * Math.sin(TAU * t / BREATH_S + cell.phase);
  var cloud = hexRgb(pal.cloud), line = hexRgb(pal.line);
  ctx.save();
  ctx.translate(cell.x, cell.y);
  scalePath(w, h);
  ctx.fillStyle = rgba(cloud, 0.96);
  ctx.fill();
  ctx.strokeStyle = rgba(line, 0.9);
  ctx.lineWidth = Math.max(1, w * 0.02);
  ctx.stroke();
  /* cross-hatch, clipped to the scale */
  ctx.save();
  ctx.rotate(angle);
  scalePath(w, h);
  ctx.clip();
  var sp = w / 6, lx;
  ctx.strokeStyle = rgba(line, 0.5);
  ctx.lineWidth = Math.max(0.8, w * 0.014);
  ctx.beginPath();
  for (lx = -w / 2; lx <= w / 2 + 0.01; lx += sp) {
    ctx.moveTo(lx, -h);
    ctx.lineTo(lx, h);
  }
  ctx.stroke();
  ctx.rotate(1.15);
  ctx.beginPath();
  for (lx = -w / 2; lx <= w / 2 + 0.01; lx += sp) {
    ctx.moveTo(lx, -h);
    ctx.lineTo(lx, h);
  }
  ctx.stroke();
  ctx.restore();
  ctx.restore();
}
function drawField(mint, t, alpha) {
  if (alpha <= 0.001) return;
  var pal = PALETTES[mint.pal];
  var field = fieldFor(mint.seed);
  ctx.save();
  ctx.globalAlpha = alpha;
  var i;
  for (i = 0; i < field.cells.length; i++) drawScale(field.cells[i], t, pal);
  ctx.restore();
}
function drawText(pal, alpha) {
  if (alpha <= 0.001) return;
  var tc = hexRgb(pal.text);
  var pc = hexRgb(pal.cloud);
  var titlePx = isPhone ? 15 : 17;
  var smallPx = isPhone ? 11 : 12;
  var pad = isPhone ? 7 : 9;
  var title = 'A Field of Scales';
  var date = '2006 · 06 · 08';
  var hint = 'Tap for a new mint.';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  /* solid cloud-colored backing plates so the text reads over the field:
     ground plates left dark line text on mid-slate ground too faint, so the
     plate is the mint's cloud color and the text stays in line color */
  var topY = Math.max(8, 0.016 * VH);
  ctx.font = 'bold ' + titlePx + 'px monospace';
  var wTitle = ctx.measureText(title).width;
  ctx.font = smallPx + 'px monospace';
  var wDate = ctx.measureText(date).width;
  var wHint = ctx.measureText(hint).width;
  var plateW = Math.max(wTitle, wDate) + pad * 2;
  var plateH = titlePx + 5 + smallPx + pad * 2;
  ctx.fillStyle = rgba(pc, alpha);
  ctx.fillRect(VW / 2 - plateW / 2, topY - pad, plateW, plateH);
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = rgba(tc, 1.0 * alpha);
  ctx.fillText(title, VW / 2, topY);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(tc, 0.9 * alpha);
  ctx.fillText(date, VW / 2, topY + titlePx + 5);
  var hintY = VH - smallPx - 10;
  var hintW = wHint + pad * 2;
  var hintH = smallPx + pad * 2;
  ctx.fillStyle = rgba(pc, alpha);
  ctx.fillRect(VW / 2 - hintW / 2, hintY - pad, hintW, hintH);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(tc, 0.95 * alpha);
  ctx.fillText(hint, VW / 2, hintY);
}
function draw(t) {
  lastT = t;
  size();
  var k = fadeK(t);
  var curPal = PALETTES[cur.pal];
  ctx.fillStyle = curPal.ground;
  ctx.fillRect(0, 0, VW, VH);
  if (prev) {
    var prevPal = PALETTES[prev.pal];
    ctx.fillStyle = prevPal.ground;
    ctx.fillRect(0, 0, VW, VH);
    /* new ground fades in over the old one, then the new field over the old */
    ctx.save();
    ctx.globalAlpha = k;
    ctx.fillStyle = curPal.ground;
    ctx.fillRect(0, 0, VW, VH);
    ctx.restore();
    drawField(prev, t, 1 - k);
    drawField(cur, t, k);
    if (k >= 1) { prev = null; fadeStart = -1; }
  } else {
    drawField(cur, t, 1);
  }
  /* soft vignette darkening at the corners */
  var cx = VW / 2, cy = VH / 2;
  var r1 = 0.95 * Math.max(VW, VH);
  var vg = ctx.createRadialGradient(cx, cy, r1 * 0.45, cx, cy, r1);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.30)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VW, VH);
  if (prev) {
    drawText(PALETTES[prev.pal], 1 - k);
    drawText(curPal, k);
  } else {
    drawText(curPal, 1);
  }
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('click', function () { nextMint(lastT); });
}
if (typeof window !== 'undefined') {
  window.__scales1609 = { draw: draw, nextMint: nextMint, PALETTES: PALETTES, SEEDS: SEEDS };
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
