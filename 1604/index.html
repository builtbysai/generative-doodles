<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hand, Visible Again</title>
<style>
html, body { margin: 0; padding: 0; background: #F5F1E8; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = [245, 241, 232];
var INK = [20, 20, 20];
var WASH = [185, 180, 168];
var CORAL = [232, 115, 74];
var PINK = [232, 180, 184];
var PHASE = 24.0;
var PAINT_S = 45.0;
var REST_S = 10.0;
var CYCLE_S = 55.0;
var SEED = 1604001;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function compRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH) * 0.96;
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}

/* ---- recorded gestures: seeded hand paths, closed-form spring tip ---- */
/* Hand path H is a seeded random walk. Tip T is a fixed lagged blend of
   recent hand points, so tip position, tip speed and line width are all
   pure functions of piece time: no accumulated state, no frame stepping. */
function genStroke(rng, kind) {
  var N = 110;
  var x, y, heading;
  if (kind === 'coral') {
    x = 0.28 + rng() * 0.30; y = 0.72 + rng() * 0.10;
    heading = -Math.PI / 2 + (rng() - 0.5) * 0.5;
  } else if (kind === 'wash') {
    x = 0.20 + rng() * 0.25; y = 0.35 + rng() * 0.30;
    heading = rng() * TAU;
  } else {
    x = 0.18 + rng() * 0.50; y = 0.25 + rng() * 0.50;
    heading = rng() * TAU;
  }
  var H = [], i;
  var ph1 = rng() * TAU, ph2 = rng() * TAU;
  for (i = 0; i < N; i++) {
    H.push({ x: x, y: y });
    if (kind === 'coral') {
      heading += (rng() - 0.5) * 0.55 + (-Math.PI / 2 - heading) * 0.06;
    } else {
      heading += (rng() - 0.5) * 0.85;
      var dx = x - 0.5, dy = y - 0.5;
      var r = Math.sqrt(dx * dx + dy * dy);
      if (r > 0.34) {
        var want = Math.atan2(-dy, -dx);
        var d = want - heading;
        while (d > Math.PI) d -= TAU;
        while (d < -Math.PI) d += TAU;
        heading += d * 0.25;
      }
    }
    var step = kind === 'wash' ? 0.011 : 0.010;
    x += Math.cos(heading) * step;
    y += Math.sin(heading) * step;
    x = clamp(x, 0.10, 0.90); y = clamp(y, 0.10, 0.90);
  }
  /* bristle skips, drawn from the same rng stream as the first build */
  var skipCoarse = [];
  for (i = 0; i < N; i++) skipCoarse.push(rng() < 0.04);
  /* subdivide the walk so stroke segments are short enough that the
     thin wash lines render continuous instead of beaded */
  var HD = [];
  for (i = 0; i < N - 1; i++) {
    HD.push(H[i]);
    HD.push({ x: (H[i].x + H[i + 1].x) / 2, y: (H[i].y + H[i + 1].y) / 2 });
  }
  HD.push(H[N - 1]);
  var M = HD.length;
  /* speed profile: slow and fast passages along the stroke */
  var f = [], k;
  for (k = 0; k < M; k++) {
    var s1 = 0.5 + 0.5 * Math.sin(ph1 + k * 0.0425 + 0.7 * Math.sin(k * 0.0105 + ph2));
    var s2 = 0.5 + 0.5 * Math.sin(ph2 * 1.3 + k * 0.0155);
    f.push(0.28 + 2.3 * s1 * 0.6 + 1.1 * s2 * 0.4);
  }
  var tt = [0], cum = 0;
  for (k = 1; k < M; k++) { cum += 1 / Math.max(0.2, f[k]); tt.push(cum); }
  /* spring tip: lagged blend of recent hand points */
  var T = [];
  for (k = 0; k < M; k++) {
    var a = HD[k], b = HD[Math.max(0, k - 6)], c = HD[Math.max(0, k - 16)], dd = HD[Math.max(0, k - 32)];
    T.push({ x: 0.5 * a.x + 0.25 * b.x + 0.15 * c.x + 0.10 * dd.x,
             y: 0.5 * a.y + 0.25 * b.y + 0.15 * c.y + 0.10 * dd.y });
  }
  var speeds = [0], mean = 0;
  for (k = 1; k < M; k++) {
    var dt = tt[k] - tt[k - 1];
    var dist = Math.sqrt((T[k].x - T[k - 1].x) * (T[k].x - T[k - 1].x) + (T[k].y - T[k - 1].y) * (T[k].y - T[k - 1].y));
    var sp = dt > 0 ? dist / dt : 0;
    speeds.push(sp); mean += sp;
  }
  mean /= (M - 1);
  /* width = inverse of tip speed: fast thins to a hairline, slow blooms */
  var w = [], skip = [], pools = [];
  for (k = 0; k < M; k++) {
    var spk = k === 0 ? mean : speeds[k];
    var wk = 0.0038 * mean / Math.max(spk, 0.12 * mean);
    wk = clamp(wk, 0.0011, 0.018);
    if (kind === 'wash') wk = wk * 1.9;
    w.push(wk);
    skip.push(skipCoarse[Math.floor(k / 2)]);
    if (wk > (kind === 'wash' ? 0.012 : 0.0105)) pools.push(k);
  }
  return { H: HD, T: T, tt: tt, w: w, skip: skip, pools: pools, N: M };
}
function genVariant(v) {
  var rng = mulberry32(SEED + v * 977);
  var nStrokes = 6, durs = [], gaps = [], i;
  for (i = 0; i < nStrokes; i++) durs.push(4.5 + rng() * 3.5);
  for (i = 0; i < nStrokes - 1; i++) gaps.push(0.9 + rng() * 1.3);
  var total = 0;
  for (i = 0; i < nStrokes; i++) { total += durs[i]; if (i < nStrokes - 1) total += gaps[i]; }
  var scale = PAINT_S / total;
  var strokes = [], t = 0;
  for (i = 0; i < nStrokes; i++) {
    var kind = i === 1 ? 'wash' : (i === 2 ? 'coral' : 'ink');
    var st = genStroke(rng, kind);
    st.start = t; st.end = t + durs[i] * scale; st.kind = kind;
    strokes.push(st);
    t = st.end + (i < nStrokes - 1 ? gaps[i] * scale : 0);
  }
  return { strokes: strokes };
}
var VARIANTS = [genVariant(0), genVariant(1), genVariant(2), genVariant(3)];

/* paper grain: fixed seeded dots and fibres, drawn every frame */
var GRAIN = (function () {
  var rng = mulberry32(SEED + 555);
  var g = [], i;
  for (i = 0; i < 420; i++) {
    g.push({ x: rng(), y: rng(), a: 0.02 + rng() * 0.035, s: rng() < 0.5 ? 1 : 2 });
  }
  return g;
})();
var FIBRES = (function () {
  var rng = mulberry32(SEED + 777);
  var g = [], i;
  for (i = 0; i < 26; i++) {
    g.push({ x: rng(), y: rng(), a: 0.03 + rng() * 0.03, l: 0.008 + rng() * 0.02, an: rng() * TAU });
  }
  return g;
})();

function drawStroke(st, rect, u, alpha) {
  var total = st.tt[st.N - 1];
  var upto = 0;
  while (upto < st.N && st.tt[upto] / total <= u) upto++;
  if (upto < 2) return;
  var i, p0, p1, wpx;
  /* bleed under-pass: soft wash halo around the stroke */
  for (i = 1; i < upto; i++) {
    p0 = st.T[i - 1]; p1 = st.T[i];
    wpx = Math.max(0.75, st.w[i] * rect.w);
    if (st.kind === 'wash') {
      ctx.strokeStyle = rgba(PINK, 0.10 * alpha);
      ctx.lineWidth = wpx * 2.4;
    } else {
      ctx.strokeStyle = rgba(WASH, 0.10 * alpha);
      ctx.lineWidth = wpx * 1.9;
    }
    ctx.beginPath();
    ctx.moveTo(rect.x + p0.x * rect.w, rect.y + p0.y * rect.h);
    ctx.lineTo(rect.x + p1.x * rect.w, rect.y + p1.y * rect.h);
    ctx.stroke();
  }
  /* main pass: bristle skips leave dry-brush gaps */
  for (i = 1; i < upto; i++) {
    if (st.skip[i]) continue;
    p0 = st.T[i - 1]; p1 = st.T[i];
    wpx = Math.max(0.75, st.w[i] * rect.w);
    if (st.kind === 'wash') {
      ctx.strokeStyle = rgba(WASH, 0.30 * alpha);
      ctx.lineWidth = wpx * 1.6;
    } else if (st.kind === 'coral') {
      ctx.strokeStyle = rgba(CORAL, 0.92 * alpha);
      ctx.lineWidth = wpx;
    } else {
      ctx.strokeStyle = rgba(INK, 0.92 * alpha);
      ctx.lineWidth = wpx;
    }
    ctx.beginPath();
    ctx.moveTo(rect.x + p0.x * rect.w, rect.y + p0.y * rect.h);
    ctx.lineTo(rect.x + p1.x * rect.w, rect.y + p1.y * rect.h);
    ctx.stroke();
  }
  /* ink pooling where the tip slowed and the line bloomed */
  for (var j = 0; j < st.pools.length; j++) {
    var k = st.pools[j];
    if (st.tt[k] / total > u) continue;
    var p = st.T[k];
    var r = st.w[k] * rect.w * 1.7;
    ctx.fillStyle = rgba(st.kind === 'wash' ? PINK : WASH, (st.kind === 'wash' ? 0.20 : 0.15) * alpha);
    ctx.beginPath();
    ctx.moveTo(rect.x + p.x * rect.w + r, rect.y + p.y * rect.h);
    ctx.arc(rect.x + p.x * rect.w, rect.y + p.y * rect.h, r, 0, TAU);
    ctx.fill();
  }
}

function brushState(g, s) {
  var i, st;
  if (s >= PAINT_S) return { x: 0.88, y: 0.87, ang: -0.6, size: 0.004 };
  for (i = 0; i < g.strokes.length; i++) {
    st = g.strokes[i];
    if (s < st.start) {
      if (i === 0) return { x: st.H[0].x, y: st.H[0].y, ang: 0, size: 0.004 };
      var prev = g.strokes[i - 1];
      var k = smooth((s - prev.end) / Math.max(0.001, st.start - prev.end));
      var hx = prev.H[prev.N - 1].x + (st.H[0].x - prev.H[prev.N - 1].x) * k;
      var hy = prev.H[prev.N - 1].y + (st.H[0].y - prev.H[prev.N - 1].y) * k;
      return { x: hx, y: hy, ang: Math.atan2(st.H[0].y - prev.H[prev.N - 1].y, st.H[0].x - prev.H[prev.N - 1].x), size: 0.004 };
    }
    if (s <= st.end) {
      var u = (s - st.start) / (st.end - st.start);
      var total = st.tt[st.N - 1];
      var kk = 0;
      while (kk < st.N && st.tt[kk] / total <= u) kk++;
      kk = Math.max(1, kk - 1);
      var p = st.T[kk], q = st.T[Math.max(0, kk - 1)];
      return { x: p.x, y: p.y, ang: Math.atan2(p.y - q.y, p.x - q.x), size: st.w[kk] };
    }
  }
  return { x: 0.88, y: 0.87, ang: -0.6, size: 0.004 };
}

function drawBrush(b, rect, alpha) {
  var x = rect.x + b.x * rect.w, y = rect.y + b.y * rect.h;
  var r = Math.max(2.5, b.size * rect.w * 0.9 + 1.5);
  /* ferrule stub trailing the tip: the brush, no hand */
  ctx.strokeStyle = rgba(INK, 0.80 * alpha);
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x - Math.cos(b.ang) * 13, y - Math.sin(b.ang) * 13);
  ctx.lineTo(x - Math.cos(b.ang) * 3, y - Math.sin(b.ang) * 3);
  ctx.stroke();
  ctx.fillStyle = rgba(INK, 0.90 * alpha);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();
}

function draw(t) {
  lastT = t;
  size();
  ctx.fillStyle = 'rgb(' + PAPER[0] + ',' + PAPER[1] + ',' + PAPER[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  var rect = compRect();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  var cyc = ((t % CYCLE_S) + CYCLE_S) % CYCLE_S;
  var vi = Math.floor(t / CYCLE_S) % 4;
  if (vi < 0) vi += 4;
  var g = VARIANTS[vi];
  var s = cyc;
  var alpha = 1;
  if (s >= PAINT_S) alpha = 1 - smooth((s - 47) / 7);
  alpha = clamp(alpha, 0, 1);
  /* paper grain and fibres */
  var i;
  for (i = 0; i < GRAIN.length; i++) {
    var gr = GRAIN[i];
    ctx.fillStyle = rgba(INK, gr.a);
    ctx.fillRect(rect.x + gr.x * rect.w, rect.y + gr.y * rect.h, gr.s, gr.s);
  }
  ctx.strokeStyle = rgba(WASH, 0.05);
  ctx.lineWidth = 1;
  for (i = 0; i < FIBRES.length; i++) {
    var fb = FIBRES[i];
    ctx.strokeStyle = rgba(WASH, fb.a);
    ctx.beginPath();
    ctx.moveTo(rect.x + fb.x * rect.w, rect.y + fb.y * rect.h);
    ctx.lineTo(rect.x + (fb.x + Math.cos(fb.an) * fb.l) * rect.w, rect.y + (fb.y + Math.sin(fb.an) * fb.l) * rect.h);
    ctx.stroke();
  }
  /* the recorded gesture, re-performed */
  for (i = 0; i < g.strokes.length; i++) {
    var st = g.strokes[i];
    if (s <= st.start) continue;
    var u = clamp((s - st.start) / (st.end - st.start), 0, 1);
    drawStroke(st, rect, u, alpha);
  }
  /* the brush itself, moving with no hand attached */
  if (alpha > 0.02 || s < PAINT_S) {
    var b = brushState(g, s);
    drawBrush(b, rect, 1);
  }
  var titlePx = isPhone ? 15 : 17;
  var smallPx = isPhone ? 11 : 12;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillStyle = rgba(INK, 0.70);
  ctx.fillText('The Hand, Visible Again', rect.x + rect.w / 2, rect.y + Math.max(6, 0.012 * rect.h));
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK, 0.50);
  ctx.fillText('2006 · 06 · 03', rect.x + rect.w / 2, rect.y + Math.max(6, 0.012 * rect.h) + titlePx + 5);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = rgba(INK, 0.55);
  ctx.fillText('Watch only. The gesture re-performs itself.', rect.x + rect.w / 2, rect.y + rect.h - smallPx - 10);
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
if (typeof window !== 'undefined') {
  window.__hand1604 = { draw: draw, variants: VARIANTS };
}
draw(PHASE);
if (!reduced) {
  var startT = null;
  function loop(ts) {
    if (startT === null) startT = ts;
    var t = PHASE + (ts - startT) / 1000;
    draw(t);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
</script>
</body>
</html>
