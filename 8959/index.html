<!DOCTYPE html>
<!-- phantom-fill-8959 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Possible Worlds — №8959</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#efe9db;color:#221f1a;font-family:Georgia,serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  .hud{position:absolute;z-index:2;pointer-events:none}
  #title{top:22px;left:26px}
  #title h1{font-size:16px;letter-spacing:.35em;font-weight:400}
  #title p{font-size:11px;letter-spacing:.13em;color:#7a7263;margin-top:6px;font-family:"Courier New",monospace;line-height:1.8}
  #num{top:22px;right:26px;text-align:right;font-size:11px;letter-spacing:.25em;color:#7a7263;font-family:"Courier New",monospace}
  #cells{position:absolute;inset:0;z-index:2}
  .cell{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-family:"Courier New",monospace;font-size:14px;color:#221f1a;
    border:1px solid transparent;transition:background .15s,border-color .15s}
  .cell:hover{border-color:#8c2f1b;background:rgba(140,47,27,.08)}
  .cell.sel{background:#8c2f1b;color:#efe9db}
  #panel{position:absolute;top:0;right:0;bottom:0;width:min(430px,92vw);background:#221f1a;color:#efe9db;
    z-index:4;padding:28px 30px;transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);
    overflow-y:auto}
  #panel.open{transform:translateX(0)}
  #panel .lab{font-family:"Courier New",monospace;font-size:10px;letter-spacing:.3em;color:#a89f8c}
  #panel h2{font-size:24px;font-weight:400;margin:10px 0 4px;letter-spacing:.04em}
  #panel .sub{font-family:"Courier New",monospace;font-size:12px;color:#a89f8c;letter-spacing:.08em;line-height:1.7}
  #diagram{width:100%;height:280px;margin:18px 0 6px}
  #panel p{font-size:14px;line-height:1.75;color:#d8d2c0}
  #panel p b{color:#e8c85a;font-weight:400}
  #close{position:absolute;top:16px;right:20px;background:none;border:none;color:#a89f8c;font-size:22px;cursor:pointer;font-family:Georgia,serif}
  #close:hover{color:#efe9db}
  #mute{position:absolute;right:26px;bottom:24px;z-index:3;background:none;border:1px solid #221f1a;color:#221f1a;font-family:"Courier New",monospace;font-size:11px;letter-spacing:.25em;padding:9px 16px;cursor:pointer}
  #mute:hover{background:#221f1a;color:#efe9db}
  #foot{left:26px;bottom:24px;font-size:11px;letter-spacing:.15em;color:#7a7263;font-family:"Courier New",monospace;line-height:1.8;z-index:2}
  @media(max-width:640px){.cell{width:36px;height:36px;font-size:12px}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hud" id="title"><h1>POSSIBLE WORLDS</h1><p>№8959 — PASCAL'S TRIANGLE AS A MAP OF CHORD WORLDS.<br>EACH CELL COUNTS THE k-NOTE CHORDS IN AN n-NOTE UNIVERSE.</p></div>
<div class="hud" id="num">GENERATIVE<br>DOODLES<br>8959</div>
<div id="cells"></div>
<div class="hud" id="foot">CLICK A CELL TO OPEN ITS WORLD.<br>THE CLICK IS THE NAVIGATION.</div>
<button id="mute">SOUND ON</button>
<aside id="panel">
  <button id="close" aria-label="close">×</button>
  <div class="lab" id="pLab">CELL (n, k)</div>
  <h2 id="pTitle">—</h2>
  <div class="sub" id="pSub"></div>
  <canvas id="diagram" width="740" height="560"></canvas>
  <p id="pBody"></p>
</aside>
<script>
(function(){
  "use strict";
  var ROWS=8; // n = 0..7
  var cellsEl=document.getElementById('cells'), panel=document.getElementById('panel');
  var pLab=document.getElementById('pLab'),pTitle=document.getElementById('pTitle'),
      pSub=document.getElementById('pSub'),pBody=document.getElementById('pBody');
  var dcv=document.getElementById('diagram'),dctx=dcv.getContext('2d');
  var cv=document.getElementById('stage'),ctx=cv.getContext('2d'),W,H;
  function size(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';layout();}
  function C(n,k){if(k<0||k>n)return 0;var r=1;for(var i=0;i<k;i++)r=r*(n-i)/(i+1);return Math.round(r);}
  // --- layout the triangle ---
  var cellEls=[];
  function layout(){
    cellsEl.innerHTML='';cellEls=[];
    var cx=W/devicePixelRatio*0.42, top=110, rowH=Math.min(56,(innerHeight-220)/ROWS), colW=54;
    for(var n=0;n<ROWS;n++){
      for(var k=0;k<=n;k++){
        var el=document.createElement('div');
        el.className='cell';el.textContent=C(n,k);
        el.style.left=(cx+(k-n/2)*colW)+'px';
        el.style.top=(top+n*rowH)+'px';
        el.dataset.n=n;el.dataset.k=k;
        el.title='C('+n+','+k+') = '+C(n,k);
        el.addEventListener('click',function(){openCell(+this.dataset.n,+this.dataset.k,this);});
        cellsEl.appendChild(el);cellEls.push(el);
      }
    }
    drawLinks();
  }
  function drawLinks(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(34,31,26,0.14)';ctx.lineWidth=1*devicePixelRatio;
    cellEls.forEach(function(el){
      var n=+el.dataset.n,k=+el.dataset.k;
      if(n>=ROWS-1)return;
      var x1=parseFloat(el.style.left),y1=parseFloat(el.style.top);
      [[n+1,k],[n+1,k+1]].forEach(function(t){
        var t2=cellEls.find(function(e){return +e.dataset.n===t[0]&&+e.dataset.k===t[1];});
        if(t2){ctx.beginPath();ctx.moveTo(x1*devicePixelRatio,y1*devicePixelRatio);
          ctx.lineTo(parseFloat(t2.style.left)*devicePixelRatio,parseFloat(t2.style.top)*devicePixelRatio);ctx.stroke();}
      });
    });
  }
  // --- audio: sound the chord when its world opens ---
  var AC=null, master=null, muted=false;
  var muteBtn=document.getElementById('mute');
  muteBtn.addEventListener('click',function(){
    muted=!muted;
    if(AC){master.gain.value=muted?0:0.9;if(!muted)AC.resume();}
    muteBtn.textContent=muted?'SOUND OFF':'SOUND ON';
  });
  function ensureAudio(){
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();master.gain.value=muted?0:0.9;master.connect(AC.destination);}
    if(AC.state==='suspended'&&!muted)AC.resume();
  }
  function suspend(){if(AC&&AC.state==='running')AC.suspend();}
  function resume(){if(AC&&AC.state==='suspended'&&!muted)AC.resume();}
  document.addEventListener('visibilitychange',function(){document.hidden?suspend():resume();});
  addEventListener('blur',suspend);addEventListener('focus',resume);
  addEventListener('pagehide',suspend);addEventListener('beforeunload',suspend);
  // most-even k-subset of n (Euclidean spread)
  function evenSet(n,k){
    var s=[];
    for(var i=0;i<k;i++)s.push(Math.floor(i*n/k));
    return s;
  }
  function openCell(n,k,el){
    cellEls.forEach(function(e){e.classList.remove('sel');});
    if(el)el.classList.add('sel');
    var count=C(n,k), set=evenSet(n,k);
    pLab.textContent='CELL (n = '+n+', k = '+k+') — C('+n+','+k+') = '+count;
    pTitle.textContent=count===1?'One world':count.toLocaleString()+' possible worlds';
    pSub.textContent=(k===0?'the empty chord':k===1?'single notes':k+'-note chords')+' in a '+n+'-note universe';
    pBody.innerHTML='There are <b>'+count+'</b> ways to choose '+k+' note'+(k===1?'':'s')+
      ' from '+n+'. Each choice is a chord, each chord a world. The diagram shows one of them — '+
      'the most even spread, positions '+(set.length?set.join(', '):'—')+' around the '+n+'-cycle.'+
      (n>=5&&k>=3?' <b>'+count+' worlds</b> is a lot of harmony to walk.':'');
    drawDiagram(n,k,set);
    panel.classList.add('open');
    ensureAudio();
    if(AC&&!muted&&set.length){
      var t=AC.currentTime+0.03;
      set.forEach(function(pos){
        var semi=pos*(12/n), o=AC.createOscillator(), g=AC.createGain();
        o.type='sine';o.frequency.value=220*Math.pow(2,semi/12);
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.22,t+0.03);
        g.gain.exponentialRampToValueAtTime(0.0001,t+2.2);
        o.connect(g);g.connect(master);o.start(t);o.stop(t+2.3);
      });
    }
  }
  function drawDiagram(n,k,set){
    var w=dcv.width,h=dcv.height,cx=w/2,cy=h/2,R=Math.min(w,h)*0.36;
    dctx.clearRect(0,0,w,h);
    dctx.strokeStyle='rgba(239,233,219,0.35)';dctx.lineWidth=2;
    dctx.beginPath();dctx.arc(cx,cy,R,0,Math.PI*2);dctx.stroke();
    var pts=[];
    for(var i=0;i<n;i++){
      var a=i/n*Math.PI*2-Math.PI/2;
      pts.push({x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R});
    }
    if(set.length>1){
      dctx.beginPath();
      set.forEach(function(p,i){i===0?dctx.moveTo(pts[p].x,pts[p].y):dctx.lineTo(pts[p].x,pts[p].y);});
      dctx.closePath();
      dctx.fillStyle='rgba(232,200,90,0.22)';dctx.fill();
      dctx.strokeStyle='#e8c85a';dctx.lineWidth=2.5;dctx.stroke();
    }
    pts.forEach(function(p,i){
      var on=set.indexOf(i)>=0;
      dctx.beginPath();dctx.arc(p.x,p.y,on?13:7,0,Math.PI*2);
      dctx.fillStyle=on?'#e8c85a':'rgba(239,233,219,0.5)';dctx.fill();
      dctx.fillStyle=on?'#221f1a':'#efe9db';dctx.textAlign='center';
      dctx.font='bold 13px "Courier New",monospace';
      dctx.fillText(i,p.x,p.y+4.5);
    });
    dctx.fillStyle='rgba(239,233,219,0.75)';dctx.textAlign='center';
    dctx.font='16px Georgia,serif';
    dctx.fillText(k+' of '+n+' — the even spread',cx,h-18);
  }
  document.getElementById('close').addEventListener('click',function(){
    panel.classList.remove('open');
    cellEls.forEach(function(e){e.classList.remove('sel');});
  });
  addEventListener('resize',size);
  size();
  // open a default world so the first paint is not empty
  setTimeout(function(){
    var def=cellEls.find(function(e){return e.dataset.n==='6'&&e.dataset.k==='3';});
    if(def)openCell(6,3,def);
  },400);
})();
</script>
</body>
</html>
