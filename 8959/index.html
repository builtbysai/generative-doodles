<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Possible Worlds · №8959</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #f4ecdc;
    overscroll-behavior: none;
  }
  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #cap {
    position: fixed; left: 14px; bottom: 12px; max-width: 70vw;
    font: 400 13px/1.45 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: rgba(74, 64, 48, 0.78); letter-spacing: 0.01em;
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  #seedtag {
    position: fixed; right: 14px; bottom: 12px;
    font: 400 11px/1.4 ui-rounded, system-ui, sans-serif;
    color: rgba(74, 64, 48, 0.45);
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="cap">A map of possible chord worlds. Tap a red cell to open it.</div>
<div id="seedtag"></div>
<script>
"use strict";
/* ============================================================
   Possible Worlds - No.8959 (2026-07-22)
   Seed 260 (Pascal Zoom): every combination-product set is one
   cell k)n of Pascal's triangle. The hexany is the single cell
   2)4 = 6. The triangle is drawn as a map; each named world
   opens into its own flat-ink diagram. Zooming feels like
   choosing a physics. Flat ink faces, visible labels, no chrome.
   ============================================================ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const sm = /[?&]seed=(\d+)/.exec(location.search);
let seed = sm ? (parseInt(sm[1], 10) >>> 0) : 895901;
document.getElementById("seedtag").textContent = "seed " + seed;

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

const PAPER = "#f4ecdc", INK = "#33291d", RUST = "#7a3b22";

function C(n, k) {
  if (k < 0 || k > n) return 0;
  k = Math.min(k, n - k);
  let r = 1;
  for (let i = 0; i < k; i++) r = r * (n - i) / (i + 1);
  return Math.round(r);
}

// named worlds: "k,n" -> {name, count, blurb, kind}
const WORLDS = {
  "2,4": { name: "hexany", count: 6, kind: "octa",
    blurb: "Six tones from four factors. Eight triads: four bright, four dark." },
  "2,5": { name: "dekany", count: 10, kind: "ring",
    blurb: "Ten tones from five factors. Every pair of factors sounds once." },
  "2,6": { name: "pentadekany", count: 15, kind: "ring",
    blurb: "Fifteen tones from six factors. The pairs draw a full web." },
  "2,7": { name: "21-world", count: 21, kind: "ring",
    blurb: "Twenty-one tones from seven factors. Wilson never named it." },
  "2,8": { name: "28-world", count: 28, kind: "ring",
    blurb: "Twenty-eight tones from eight factors. Deep water." },
  "3,6": { name: "eikosany", count: 20, kind: "lattice",
    blurb: "Twenty tones from six factors, taken three at a time. A lattice, not a ring." },
  "3,7": { name: "35-world", count: 35, kind: "ring",
    blurb: "Thirty-five tones from seven factors, three at a time." },
  "3,8": { name: "56-world", count: 56, kind: "dots",
    blurb: "Fifty-six tones from eight factors. Past drawing every chord." },
  "4,8": { name: "70-world", count: 70, kind: "dots",
    blurb: "Seventy tones from eight factors, four at a time. A whole weather system." }
};

let W = 0, H = 0, DPR = 1;
let scene = "map";       // "map" or "k,n"
let anim = 1;            // 0..1 transition progress
let animFrom = "map", animTo = "map";
let cells = [];          // map cell hit rects

function layoutMap() {
  cells = [];
  const rows = [];
  for (let n = 2; n <= 8; n++) rows.push(n);
  const p = Math.min(W * 0.94 / 9, H * 0.098, 118); // cell pitch
  const top = H * 0.20;
  rows.forEach((n, ri) => {
    for (let k = 0; k <= n; k++) {
      const x = W / 2 + (k - n / 2) * p;
      const y = top + ri * p * 0.86;
      cells.push({ n, k, x: x - p * 0.44, y: y - p * 0.38, w: p * 0.88, h: p * 0.76, cx: x, cy: y });
    }
  });
}

function drawMap(a) {
  // a: 1 = fully map, 0 = fully zoomed away
  ctx.save();
  ctx.globalAlpha = a;
  const fs = Math.min(W, H) / 30;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const c of cells) {
    const key = c.k + "," + c.n;
    const w = WORLDS[key];
    if (w) {
      ctx.fillStyle = RUST;
      ctx.beginPath();
      ctx.arc(c.cx, c.cy, Math.min(c.w, c.h) * 0.46, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = PAPER;
      ctx.font = "700 " + fs * 0.52 + "px ui-rounded, system-ui, sans-serif";
      ctx.fillText(C(c.n, c.k), c.cx, c.cy - fs * 0.18);
      ctx.font = "400 " + fs * 0.34 + "px ui-rounded, system-ui, sans-serif";
      ctx.fillText(c.k + ")" + c.n, c.cx, c.cy + fs * 0.30);
    } else {
      ctx.fillStyle = "rgba(51,41,29,0.10)";
      ctx.beginPath();
      ctx.arc(c.cx, c.cy, Math.min(c.w, c.h) * 0.30, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = "rgba(51,41,29,0.42)";
      ctx.font = "400 " + fs * 0.34 + "px ui-rounded, system-ui, sans-serif";
      ctx.fillText(C(c.n, c.k), c.cx, c.cy);
    }
  }
  ctx.fillStyle = INK;
  ctx.font = "700 " + fs * 1.15 + "px ui-rounded, system-ui, sans-serif";
  ctx.fillText("POSSIBLE WORLDS", W / 2, H * 0.07);
  ctx.font = "400 " + fs * 0.52 + "px ui-rounded, system-ui, sans-serif";
  ctx.fillStyle = "rgba(51,41,29,0.62)";
  ctx.fillText("every combination-product set lives in one cell of the triangle", W / 2, H * 0.07 + fs * 0.95);
  ctx.restore();
}

function drawDetail(key, a) {
  const w = WORLDS[key];
  if (!w) return;
  ctx.save();
  ctx.globalAlpha = a;
  const cx = W / 2, cy = H * 0.46;
  const R = Math.min(W, H) * 0.30;
  const fs = Math.min(W, H) / 30;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  ctx.strokeStyle = INK; ctx.fillStyle = INK;
  if (w.kind === "octa") {
    // flat octahedron: hexagon perimeter + i to i+2 edges (12 edges)
    const labels = ["3", "5", "7", "35", "21", "15"];
    const pts = labels.map((_, i) => {
      const t = -Math.PI / 2 + i * Math.PI / 3;
      return [cx + R * Math.cos(t), cy + R * Math.sin(t)];
    });
    ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) {
      const p1 = pts[i], p2 = pts[(i + 2) % 6];
      ctx.beginPath(); ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]);
      ctx.strokeStyle = "rgba(51,41,29,0.55)"; ctx.stroke();
    }
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.5, R / 130);
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.closePath(); ctx.stroke();
    ctx.font = "700 " + fs * 0.8 + "px ui-rounded, system-ui, sans-serif";
    labels.forEach((L, i) => {
      ctx.fillStyle = PAPER;
      ctx.beginPath(); ctx.arc(pts[i][0], pts[i][1], fs * 0.62, 0, 6.2832); ctx.fill();
      ctx.fillStyle = INK;
      ctx.fillText(L, pts[i][0], pts[i][1] + 1);
    });
  } else if (w.kind === "ring") {
    const n = w.count;
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(51,41,29,0.5)";
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.stroke();
    if (n <= 21) {
      ctx.strokeStyle = "rgba(122,59,34,0.20)";
      const pts = [];
      for (let i = 0; i < n; i++) {
        const t = -Math.PI / 2 + i * 2 * Math.PI / n;
        pts.push([cx + R * Math.cos(t), cy + R * Math.sin(t)]);
      }
      ctx.beginPath();
      for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
        ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[j][0], pts[j][1]);
      }
      ctx.stroke();
    }
    ctx.fillStyle = RUST;
    for (let i = 0; i < n; i++) {
      const t = -Math.PI / 2 + i * 2 * Math.PI / n;
      ctx.beginPath();
      ctx.arc(cx + R * Math.cos(t), cy + R * Math.sin(t), Math.max(2, R / 60), 0, 6.2832);
      ctx.fill();
    }
  } else if (w.kind === "lattice") {
    // 20 dots in offset rows
    const rowsN = [4, 5, 6, 5];
    const s = R * 0.42;
    ctx.fillStyle = INK;
    rowsN.forEach((rn, ri) => {
      for (let i = 0; i < rn; i++) {
        const x = cx + (i - (rn - 1) / 2) * s;
        const y = cy + (ri - 1.5) * s * 0.9;
        ctx.beginPath(); ctx.arc(x, y, Math.max(2.5, R / 55), 0, 6.2832); ctx.fill();
      }
    });
    ctx.strokeStyle = "rgba(51,41,29,0.4)";
    ctx.lineWidth = 1;
    ctx.strokeRect(cx - 2.6 * s, cy - 2 * s, 5.2 * s, 4 * s);
  } else { // dots
    const n = w.count;
    const cols = Math.ceil(Math.sqrt(n * W / H));
    const rowsN2 = Math.ceil(n / cols);
    const s = Math.min(W * 0.8 / cols, H * 0.5 / rowsN2);
    ctx.fillStyle = "rgba(51,41,29,0.75)";
    for (let i = 0; i < n; i++) {
      const x = cx + ((i % cols) - (cols - 1) / 2) * s;
      const y = cy + (Math.floor(i / cols) - (rowsN2 - 1) / 2) * s;
      ctx.beginPath(); ctx.arc(x, y, Math.max(1.6, s * 0.22), 0, 6.2832); ctx.fill();
    }
  }

  // header
  ctx.fillStyle = INK;
  ctx.font = "700 " + fs * 1.2 + "px ui-rounded, system-ui, sans-serif";
  const kn = key.split(",");
  ctx.fillText(kn[0] + ")" + kn[1] + " · " + w.name + " · " + w.count + " tones", W / 2, H * 0.08);
  ctx.font = "400 " + fs * 0.58 + "px ui-rounded, system-ui, sans-serif";
  ctx.fillStyle = "rgba(51,41,29,0.66)";
  wrapText(w.blurb, W / 2, H * 0.82, W * 0.8, fs * 0.58);

  // back button
  ctx.fillStyle = "rgba(51,41,29,0.08)";
  const bw = fs * 7, bh = fs * 1.7, bx = W / 2 - bw / 2, by = H * 0.90;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, bh / 2); else ctx.rect(bx, by, bw, bh);
  ctx.fill();
  ctx.fillStyle = INK;
  ctx.font = "600 " + fs * 0.6 + "px ui-rounded, system-ui, sans-serif";
  ctx.fillText("back to the triangle", W / 2, by + bh / 2 + 1);
  scene_backRect = { x: bx, y: by, w: bw, h: bh };
  ctx.restore();
}

let scene_backRect = null;

function wrapText(text, x, y, maxW, lh) {
  const words = text.split(" ");
  const lines = [];
  let line = "";
  for (const wd of words) {
    const t = line ? line + " " + wd : wd;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = wd; }
    else line = t;
  }
  lines.push(line);
  lines.forEach((L, i) => ctx.fillText(L, x, y + i * lh * 1.35));
}

function goTo(target) {
  if (target === scene) return;
  animFrom = scene; animTo = target;
  anim = 0;
}

function draw() {
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, W, H);
  if (anim < 1) {
    const e = anim * anim * (3 - 2 * anim);
    if (animFrom === "map") drawMap(1 - e); else drawDetail(animFrom, 1 - e);
    if (animTo === "map") drawMap(e); else drawDetail(animTo, e);
  } else {
    scene = animTo;
    if (scene === "map") drawMap(1); else drawDetail(scene, 1);
  }
}

let last = 0;
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000 || 0);
  last = t;
  if (anim < 1) { anim = Math.min(1, anim + dt / 0.6); draw(); }
  else if (scene !== animTo) draw();
  else if (!loop.drawn) { draw(); loop.drawn = true; }
}
loop.drawn = false;

canvas.addEventListener("pointerdown", function (e) {
  loop.drawn = false;
  if (anim < 1) return;
  if (scene === "map") {
    for (const c of cells) {
      const key = c.k + "," + c.n;
      if (WORLDS[key] && Math.hypot(e.clientX - c.cx, e.clientY - c.cy) < Math.min(c.w, c.h) * 0.55) {
        goTo(key);
        return;
      }
    }
  } else if (scene_backRect) {
    const b = scene_backRect;
    if (e.clientX > b.x && e.clientX < b.x + b.w && e.clientY > b.y && e.clientY < b.y + b.h) goTo("map");
  }
});

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layoutMap();
  loop.drawn = false;
}
window.addEventListener("resize", resize);
resize();
// deep link: ?open=2,4 starts inside a world
const om = /[?&]open=(\d+),(\d+)/.exec(location.search);
if (om && WORLDS[om[1] + "," + om[2]]) goTo(om[1] + "," + om[2]);
draw();
requestAnimationFrame(loop);
</script>
</body>
</html>
