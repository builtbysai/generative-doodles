<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Block Carver's Table</title>
<style>
  html, body { margin: 0; padding: 0; background: #201913; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG (no Math.random anywhere) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Motif variant is fixed for the whole piece (seeded once): the block and
  // its print must always show the SAME motif, correct-reading vs reverse.
  // Reseeding the motif per loop would leave a triangle block beside a
  // rosette print at every loop seam, breaking the premise. Per-loop reseed
  // still applies to starvation rate, jitter, and the re-carved groove.
  var MOTIF_VARIANT = mulberry32(1292)() < 0.5 ? 0 : 1;

  // ---------- palette ----------
  var TEAK = '#8A5A34', CARVE_SHADOW = '#4A2E1C', CUT_HIGHLIGHT = '#B98A58';
  var PRINT_INK = '#211D18', PRINT_PAPER = '#EFE7D2', GRID_BLUE = '#7A93B8';
  var GROUND = '#201913', RECESS = '#6E4526';

  // ---------- sizing (Visual Viewport API, never innerWidth alone) ----------
  var W = 0, H = 0;
  function viewport() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        window.visualViewport.width && window.visualViewport.height) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    return { w: w, h: h };
  }
  function isPhone() {
    if (typeof window !== 'undefined' && window.screen &&
        window.screen.width && window.screen.height) {
      return Math.min(window.screen.width, window.screen.height) < 700;
    }
    return H > W * 1.15;
  }
  function size() {
    var vp = viewport();
    W = vp.w; H = vp.h;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // ---------- loop parameters (seeded per loop; loop -1 seeds frame one) ----------
  var LOOP = 24;
  var STAMP_TIMES = [6.5, 10.5, 14.5];
  function loopParams(k) {
    var r = mulberry32(1292 * 1000 + k * 7919);
    var starve = 0.08 + r() * 0.06; // ink loss per stamp, 8-14%
    var groove = Math.floor(r() * 8); // re-carved petal index (rosette only)
    var jx = [], jy = [], jr = [];
    for (var i = 0; i < 3; i++) {
      jx.push((r() - 0.5) * 4);
      jy.push((r() - 0.5) * 4);
      jr.push((r() - 0.5) * 3); // degrees
    }
    return { starve: starve, groove: groove, jx: jx, jy: jy, jr: jr };
  }

  // ---------- geometry (rebuilt on resize) ----------
  var G = null;
  function build() {
    var phone = isPhone();
    var cw = Math.floor(W * (phone ? 0.94 : 0.88));
    var ch = Math.floor(Math.min(H * 0.72, cw * 0.55));
    var cx0 = Math.floor((W - cw) / 2);
    var cy0 = Math.floor((H - ch) / 2);
    var gap = Math.floor(cw * 0.10);
    var bw = Math.floor(cw * 0.45);
    var pw = cw - bw - gap;
    var bx = cx0, px = cx0 + bw + gap;
    var ruleX = cx0 + bw + Math.floor(gap / 2);
    var gr = mulberry32(1292);
    var grain = [];
    for (var i = 0; i < 6; i++) {
      grain.push({ y: 0.12 + i * 0.15 + (gr() - 0.5) * 0.04,
                   amp: 2 + gr() * 3, ph: gr() * 6.28 });
    }
    G = { cw: cw, ch: ch, cx0: cx0, cy0: cy0, bw: bw, pw: pw,
          bx: bx, px: px, ruleX: ruleX, grain: grain };
  }

  // ---------- helpers ----------
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(a, b, x) {
    var t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function diamond(cx, cy, rx, ry) {
    ctx.beginPath();
    ctx.moveTo(cx, cy - ry);
    ctx.lineTo(cx + rx, cy);
    ctx.lineTo(cx, cy + ry);
    ctx.lineTo(cx - rx, cy);
    ctx.closePath();
  }
  function poly(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
  }

  // Motif unit. style: 'carve' (block face, recessed) or 'print' (ink on paper).
  // mirror: true on the block (carved in reverse), false on the print.
  function drawMotif(cx, cy, s, mirror, style, deepGroove) {
    var ink = style === 'print';
    ctx.save();
    ctx.translate(cx, cy);
    if (mirror) ctx.scale(-1, 1);
    if (G.variant === 0) {
      // ajrakh rosette: center diamond, 8 petal diamonds, 8 dots between
      var i, a, px, py, ux, uy;
      for (i = 0; i < 8; i++) {
        a = i * Math.PI / 4;
        ux = Math.cos(a); uy = Math.sin(a);
        px = ux * s * 0.28; py = uy * s * 0.28;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(a);
        var deep = (deepGroove === i);
        if (ink) {
          ctx.fillStyle = PRINT_INK;
          diamond(0, 0, s * 0.065, s * 0.14);
          ctx.fill();
        } else {
          ctx.fillStyle = RECESS;
          diamond(0, 0, s * 0.065, s * 0.14);
          ctx.fill();
          ctx.strokeStyle = deep ? '#2E1A0E' : CARVE_SHADOW;
          ctx.lineWidth = Math.max(1.5, s * (deep ? 0.035 : 0.02));
          diamond(0, 0, s * 0.065, s * 0.14);
          ctx.stroke();
          ctx.strokeStyle = CUT_HIGHLIGHT;
          ctx.lineWidth = Math.max(1, s * 0.008);
          ctx.beginPath();
          ctx.moveTo(-s * 0.05, s * 0.13);
          ctx.lineTo(s * 0.05, s * 0.13);
          ctx.stroke();
        }
        ctx.restore();
      }
      if (ink) {
        ctx.fillStyle = PRINT_INK;
        diamond(0, 0, s * 0.09, s * 0.09);
        ctx.fill();
      } else {
        ctx.fillStyle = RECESS;
        diamond(0, 0, s * 0.09, s * 0.09);
        ctx.fill();
        ctx.strokeStyle = CARVE_SHADOW;
        ctx.lineWidth = Math.max(1.5, s * 0.02);
        diamond(0, 0, s * 0.09, s * 0.09);
        ctx.stroke();
      }
      // small dots between petals
      for (i = 0; i < 8; i++) {
        a = (i + 0.5) * Math.PI / 4;
        px = Math.cos(a) * s * 0.44; py = Math.sin(a) * s * 0.44;
        ctx.fillStyle = ink ? PRINT_INK : CARVE_SHADOW;
        diamond(px, py, s * 0.028, s * 0.028);
        ctx.fill();
      }
    } else {
      // architectural triangles: brise-soleil diagonals, 3 rows x 4 cols
      var cols = 4, rows = 3, cw2 = s * 0.9 / cols, ch2 = s * 0.9 / rows;
      var ox = -s * 0.45, oy = -s * 0.45;
      for (var r2 = 0; r2 < rows; r2++) {
        for (var c2 = 0; c2 < cols; c2++) {
          var x0 = ox + c2 * cw2, y0 = oy + r2 * ch2;
          var tri = [[x0 + cw2 * 0.15, y0 + ch2 * 0.85],
                     [x0 + cw2 * 0.85, y0 + ch2 * 0.85],
                     [x0 + cw2 * 0.85, y0 + ch2 * 0.15]];
          if (ink) {
            ctx.fillStyle = PRINT_INK;
            poly(tri);
            ctx.fill();
          } else {
            ctx.fillStyle = RECESS;
            poly(tri);
            ctx.fill();
            ctx.strokeStyle = CARVE_SHADOW;
            ctx.lineWidth = Math.max(1.5, s * 0.02);
            poly(tri);
            ctx.stroke();
          }
        }
      }
    }
    ctx.restore();
  }

  // ---------- draw ----------
  function draw(t) {
    if (!G) build();
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // registration grid, faint blue behind everything
    ctx.strokeStyle = 'rgba(122,147,184,0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var gx = 23; gx < W; gx += 46) { ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
    for (var gy = 23; gy < H; gy += 46) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
    ctx.stroke();

    var loop = Math.floor(t / LOOP);
    var lt = t - loop * LOOP;
    var P = loopParams(loop);
    var Pp = loopParams(loop - 1);
    G.variant = MOTIF_VARIANT;

    var y0 = G.cy0, y1 = G.cy0 + G.ch;

    // ---- block (left): depth side, face, grain, motif, ink, roller, lift ----
    var lift = 0;
    for (var si = 0; si < 3; si++) {
      var st = STAMP_TIMES[si];
      lift += -14 * smooth(st - 0.6, st - 0.1, lt) * (1 - smooth(st + 0.1, st + 0.5, lt));
    }
    var bDepth = 10, bFaceX = G.bx, bFaceY = y0 + lift;
    ctx.fillStyle = '#3A2415';
    ctx.fillRect(bFaceX + bDepth, bFaceY + bDepth + 2, G.bw, G.ch);
    ctx.fillStyle = TEAK;
    ctx.fillRect(bFaceX, bFaceY, G.bw, G.ch);
    // bevel: highlight top/left, shadow bottom/right
    ctx.fillStyle = CUT_HIGHLIGHT;
    ctx.fillRect(bFaceX, bFaceY, G.bw, 2);
    ctx.fillRect(bFaceX, bFaceY, 2, G.ch);
    ctx.fillStyle = CARVE_SHADOW;
    ctx.fillRect(bFaceX, bFaceY + G.ch - 2, G.bw, 2);
    ctx.fillRect(bFaceX + G.bw - 2, bFaceY, 2, G.ch);
    // stylized wood grain: wavy horizontal lines, flat alpha
    ctx.strokeStyle = 'rgba(74,46,28,0.45)';
    ctx.lineWidth = 1;
    for (var gi = 0; gi < G.grain.length; gi++) {
      var grn = G.grain[gi];
      var gy2 = bFaceY + grn.y * G.ch;
      ctx.beginPath();
      ctx.moveTo(bFaceX + 6, gy2);
      for (var gx2 = 6; gx2 <= G.bw - 6; gx2 += 12) {
        ctx.lineTo(bFaceX + gx2, gy2 + Math.sin(gx2 * 0.05 + grn.ph) * grn.amp);
      }
      ctx.stroke();
    }
    // roller pass 4-6s: dark band sweeps the face, leaving an ink sheen
    var rollerX = bFaceX + smooth(4, 6, lt) * G.bw;
    var inkSheen = 0;
    if (lt >= 4) {
      var stampsDone = 0;
      for (var sd = 0; sd < 3; sd++) if (lt >= STAMP_TIMES[sd]) stampsDone++;
      inkSheen = Math.max(0, 0.30 - 0.06 * stampsDone);
    }
    if (lt > 4 && lt < 6) {
      ctx.fillStyle = 'rgba(33,29,24,0.35)';
      ctx.fillRect(rollerX - G.bw * 0.09, bFaceY, G.bw * 0.18, G.ch);
    }
    if (inkSheen > 0) {
      ctx.fillStyle = 'rgba(33,29,24,' + inkSheen.toFixed(3) + ')';
      ctx.fillRect(bFaceX, bFaceY, G.bw, G.ch);
    }
    // carved motif, mirrored (reverse), with mid-loop re-carve deepening one groove
    var deep = smooth(12, 13.5, lt) > 0 ? P.groove : -1;
    var ms = Math.min(G.bw, G.ch) * 0.62;
    drawMotif(bFaceX + G.bw / 2, bFaceY + G.ch / 2, ms, true, 'carve', deep);

    // ---- thin vertical rule ----
    ctx.strokeStyle = 'rgba(239,231,210,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(G.ruleX, y0);
    ctx.lineTo(G.ruleX, y1);
    ctx.stroke();

    // ---- print (right): paper, registration crosshairs, impressions ----
    ctx.fillStyle = PRINT_PAPER;
    ctx.fillRect(G.px, y0, G.pw, G.ch);
    ctx.strokeStyle = 'rgba(122,147,184,0.5)';
    ctx.lineWidth = 1;
    var chs = [[G.px + 10, y0 + 10], [G.px + G.pw - 10, y0 + 10],
               [G.px + 10, y1 - 10], [G.px + G.pw - 10, y1 - 10]];
    ctx.beginPath();
    for (var ci = 0; ci < 4; ci++) {
      var cxp = chs[ci][0], cyp = chs[ci][1];
      ctx.moveTo(cxp - 5, cyp); ctx.lineTo(cxp + 5, cyp);
      ctx.moveTo(cxp, cyp - 5); ctx.lineTo(cxp, cyp + 5);
    }
    ctx.stroke();

    // impressions: current-loop stamps already made, then older ones to fill to 3,
    // drawn oldest first so the newest sits on top, fading down-right.
    var imps = [];
    var cur = [];
    for (var cj = 0; cj < 3; cj++) {
      if (lt >= STAMP_TIMES[cj]) {
        var alphaJ = Math.pow(1 - P.starve, cj) * smooth(STAMP_TIMES[cj], STAMP_TIMES[cj] + 0.5, lt);
        cur.push({ a: alphaJ, jx: P.jx[cj], jy: P.jy[cj], jr: P.jr[cj] });
      }
    }
    var prev = [];
    for (var pj = 2; pj >= 0; pj--) {
      prev.push({ a: Math.pow(1 - Pp.starve, pj) * 0.8,
                  jx: Pp.jx[pj], jy: Pp.jy[pj], jr: Pp.jr[pj] });
    }
    var shown = cur.slice();
    var need = 3 - shown.length;
    for (var ni = 0; ni < need && ni < prev.length; ni++) shown.unshift(prev[ni]);
    // draw oldest first
    for (var di = 0; di < shown.length; di++) {
      var imp = shown[di];
      if (imp.a <= 0.01) continue;
      var ox2 = di * 7 + imp.jx, oy2 = di * 6 + imp.jy;
      var icx = G.px + G.pw / 2 + ox2, icy = y0 + G.ch / 2 + oy2;
      ctx.save();
      ctx.translate(icx, icy);
      ctx.rotate(imp.jr * Math.PI / 180);
      ctx.globalAlpha = imp.a;
      drawMotif(0, 0, ms * 0.92, false, 'print', -1);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  // ---------- boot: frame one at exactly t = 0, clock starts with rAF ----------
  size();
  build();
  draw(0);
  var T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function now() {
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - T0) / 1000;
    return 0;
  }
  function loop() {
    draw(now());
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () { size(); build(); draw(now()); });
    }
    window.addEventListener('resize', function () { size(); build(); draw(now()); });
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
