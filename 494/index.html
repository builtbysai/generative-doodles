<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Edge Type</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#1E1B4B; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  // Palette: exactly the prompt colors. Nothing else.
  var GROUND = '#1E1B4B';   // deep indigo
  var INK    = '#FFFFFF';   // edge type white
  var RIBBON_COLORS = ['#E8722A', '#7C5CBF', '#9DC3E6']; // orange, violet, light blue

  // 48s seamless loop. Each ribbon's wave pattern is periodic along its
  // own axis and advances by a whole number of wavelengths per loop, so
  // the wrap is invisible. First frame is the fixed pre-roll PHASE0.
  var LOOP = 48.0;
  var PHASE0 = 19.0;
  var SEED_WORD = 494003;          // yields the invented word CUDRO
  var SEED_RIB = 494101, SEED_STEP = 7919;

  // Seeded RNG (mulberry32): every viewer sees the same weave and the
  // same word; every QA render is byte-identical.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------------- invented word ----------------
  // Syllable assembly only; never a real wine or brand name (the source
  // labels' own names are blocklisted, along with common wine words).
  var CON = 'BCDFGLMNPRSTVZ', VOW = 'AEIOU';
  var TPL = ['CVCV', 'CVCVC', 'VCVC', 'VCVCV', 'CVCCV', 'CVCVCV'];
  var BLOCK = { ALBA:1, SBROK:1, VINO:1, VINA:1, BAROLO:1, CHIANTI:1,
    BRUNELLO:1, PROSECCO:1, VALPOLICELLA:1, MONTEPULCIANO:1 };
  function genWord(rng) {
    for (var a = 0; a < 80; a++) {
      var tpl = TPL[Math.floor(rng() * TPL.length)], w = '';
      for (var i = 0; i < tpl.length; i++) {
        w += tpl[i] === 'C' ? CON[Math.floor(rng() * CON.length)]
                            : VOW[Math.floor(rng() * VOW.length)];
      }
      if (BLOCK[w] !== 1) return w;
    }
    return 'VORLAM';
  }
  var WORD = genWord(mulberry32(SEED_WORD));

  // ---------------- ribbons ----------------
  // A ribbon is a uniform band whose centreline is a sine wave along its
  // own axis. Sliding the phase slides the wave along the band; because
  // the wave is wavelength-periodic and the band runs past the field
  // edges, the slide wraps seamlessly. Bands are clipped to the field
  // right of the type guard, so they can never touch the type.
  function buildRibbons(idx) {
    var rng = mulberry32(SEED_RIB + idx * SEED_STEP);
    var count = 6 + Math.floor(rng() * 3);       // 6-8 bands
    var bands = [];
    for (var i = 0; i < count; i++) {
      var neg = rng() < 0.5;
      var ang = (neg ? -1 : 1) * (24 + rng() * 27);   // diagonal, degrees
      bands.push({
        ang: ang * Math.PI / 180,
        slot: (i + 0.5) / count,
        jitter: (rng() - 0.5) * 0.7,
        wFrac: 0.050 + rng() * 0.055,           // width / min(W,H)
        lamFrac: 0.55 + rng() * 0.35,           // wavelength / axis extent
        ampFrac: 0.045 + rng() * 0.040,         // amplitude / wavelength
        color: RIBBON_COLORS[Math.floor(rng() * 3)],
        alpha: 0.55 + rng() * 0.15,             // 55-70% opacity
        waves: 1 + Math.floor(rng() * 2),       // whole wavelengths per loop
        dir: rng() < 0.5 ? 1 : -1,
        phase: rng()                              // fraction of a wavelength
      });
    }
    return bands;
  }
  var reseed = 0;
  var ribbons = buildRibbons(0);

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (!DPR || DPR < 1) DPR = 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw(PHASE0);
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  // Tap reseeds the weave (colors and angles). Not a page reload; the
  // word and the type placement never change.
  function onTap() {
    reseed++;
    ribbons = buildRibbons(reseed);
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onTap);
    canvas.addEventListener('touchstart', onTap);
  }

  function drawBand(b, lt, cf, Eu, Ev) {
    var ux = Math.cos(b.ang), uy = Math.sin(b.ang);
    var vx = -uy, vy = ux;
    var lam = b.lamFrac * Eu;
    var amp = b.ampFrac * lam;
    var base = -Ev / 2 + Ev * (b.slot + b.jitter / Math.max(6, ribbons.length));
    var phase = b.phase * lam + b.dir * (lt / LOOP) * b.waves * lam;
    var S = Math.min(W, H);
    ctx.save();
    ctx.globalAlpha = b.alpha;
    ctx.strokeStyle = b.color;
    ctx.lineWidth = b.wFrac * S;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    var steps = 110;
    var s0 = -Eu / 2 - lam * 0.6, s1 = Eu / 2 + lam * 0.6;
    for (var i = 0; i <= steps; i++) {
      var s = s0 + (s1 - s0) * (i / steps);
      var off = amp * Math.sin(2 * Math.PI * (s - phase) / lam);
      var x = cf.x + ux * s + vx * (base + off);
      var y = cf.y + uy * s + vy * (base + off);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawType(typeX, guardX) {
    // Condensed caps, rotated -90 degrees so the word reads bottom to
    // top along the left edge. Drawn last: it sits above the weave.
    var probe = 100;
    ctx.font = '700 ' + probe + 'px "Arial Narrow", "Liberation Sans Narrow", "Helvetica Neue", Arial, sans-serif';
    var spacing = probe * 0.045;
    var total = 0, i, widths = [];
    for (i = 0; i < WORD.length; i++) {
      var w = ctx.measureText(WORD[i]).width;
      widths.push(w);
      total += w + spacing;
    }
    total -= spacing;
    var target = H * 0.80;
    var size = probe * target / total;
    // Cap height must fit the type column with air on both sides.
    var maxSize = (Math.min(typeX, guardX - typeX) - 6) / 0.36;
    if (size > maxSize) size = maxSize;
    if (size < 24) size = 24;
    var scale = size / probe;
    var totalScaled = total * scale;
    ctx.save();
    ctx.translate(typeX, H / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.scale(0.62, 1);   // condense horizontally, whatever the stack
    ctx.font = '700 ' + probe + 'px "Arial Narrow", "Liberation Sans Narrow", "Helvetica Neue", Arial, sans-serif';
    ctx.fillStyle = INK;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    var x = -totalScaled / 2 / 0.62;
    for (i = 0; i < WORD.length; i++) {
      ctx.fillText(WORD[i], x, 0);
      x += (widths[i] + spacing) * scale / 0.62;
    }
    ctx.restore();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var lt = ((t % LOOP) + LOOP) % LOOP;

    var typeX = W * 0.145;
    var guardX = W * 0.295;
    var cf = { x: (guardX + W) / 2, y: H / 2 };
    // Field extents: max projections of the field corners.
    var corners = [
      { x: guardX, y: 0 }, { x: W, y: 0 },
      { x: guardX, y: H }, { x: W, y: H }
    ];

    // Weave, clipped to the field right of the guard.
    ctx.save();
    ctx.beginPath();
    ctx.rect(guardX, -2, W - guardX + 2, H + 4);
    ctx.clip();
    for (var i = 0; i < ribbons.length; i++) {
      var b = ribbons[i];
      var ux = Math.cos(b.ang), uy = Math.sin(b.ang);
      var vx = -uy, vy = ux;
      var Eu = 0, Ev = 0;
      for (var ci = 0; ci < corners.length; ci++) {
        var dx = corners[ci].x - cf.x, dy = corners[ci].y - cf.y;
        Eu = Math.max(Eu, Math.abs(dx * ux + dy * uy));
        Ev = Math.max(Ev, Math.abs(dx * vx + dy * vy));
      }
      drawBand(b, lt, cf, Eu * 2, Ev * 2);
    }
    ctx.restore();

    drawType(typeX, guardX);
  }

  resize();
  draw(PHASE0);

  if (typeof requestAnimationFrame === 'function') {
    var startMs = null;
    var loop = function (now) {
      if (startMs === null) startMs = now;
      draw(PHASE0 + (now - startMs) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
