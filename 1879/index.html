<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Guitars Facing Each Other</title>
<style>
html, body { margin: 0; padding: 0; background: #050505; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Two Guitars Facing Each Other: two faint amber spot pools face each
   other across a black stage, a classical guitar left, an archtop right.
   Each instrument unspools a melodic trail from its soundhole; the
   second line rises to meet it, they tangle briefly, separate, and
   dissolve. Phrases are generated, never looped. Occasionally both fall
   silent and only the breathing of the spots remains. Tap to reseed:
   a fresh dialogue from a new seed, same two voices. The stage stays,
   the players stay, only the music begins again. */
var TAU = Math.PI * 2;
var GROUND = '#050505';
var BLACK = '#000000';
var SPOT = '#E8A33D';
var SPOT_DEEP = '#B97A1E';
var SPOT_PALE = '#F2C063';
var TRAIL_WHITE = '#F5EFE0';
var TRAIL_GOLD = '#E8C878';
var BODY = '#171208';
var BODY_EDGE = '#1E160C';
var PLATE = '#0A0806';
var PLATE_LINE = 'rgba(232,163,61,0.30)';
var TITLE_INK = '#F5EFE0';
var HINT_INK = '#D8B878';
var FRAME_T = 9.0;        /* fixed phase: mid dialogue, both trails crossing */
var SEED0 = 1879;         /* fixed seed for the first dialogue, thumb stable */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* ---- phrase agents: a call-and-response state machine, generated ---- */
/* A phrase is generated from a seeded RNG: agent (0 nylon left, 1 archtop
   right), start, duration, and a contour of 5 to 8 notes in [-1, 1].
   The schedule alternates voices, sometimes overlaps the answer over the
   statement, and sometimes leaves a silence where only the spots breathe.
   The whole timeline is a pure function of the seed, so frame one is
   reproducible and a tap simply swaps in a fresh seed. */
var phrases = [];
var phraseOrigin = 0;     /* phaseT value the current dialogue started at */
var phraseSeed = SEED0;
var audioCtx = null;
var audioReady = false;
var lastPhraseIdx = -1;
function genPhrases(seed) {
  var rng = mulberry32(seed);
  var list = [];
  var cursor = 0.5;
  var agent = rng() < 0.5 ? 0 : 1;
  var i, j, n, dur, gap, contour;
  while (cursor < 90) {
    dur = 2.2 + rng() * 1.6;
    n = 5 + Math.floor(rng() * 4);
    contour = [];
    var v = (rng() * 2 - 1) * 0.5;
    for (j = 0; j < n; j++) {
      v = clamp(v + (rng() * 2 - 1) * 0.45, -1, 1);
      contour.push(v);
    }
    list.push({ agent: agent, start: cursor, dur: dur, notes: contour });

       the tail of the statement, sometimes after a silence */
    var roll = rng();
    if (roll < 0.30) {
      cursor = cursor + dur * (0.62 + rng() * 0.18); /* overlap: tangle */
    } else if (roll < 0.52) {
      cursor = cursor + dur + 1.2 + rng() * 0.9;     /* silence: spots breathe */
    } else {
      cursor = cursor + dur + 0.15 + rng() * 0.5;    /* straight answer */
    }
    agent = 1 - agent;
    if (rng() < 0.12) agent = 1 - agent; /* same voice twice, a second thought */

}
phrases = genPhrases(SEED0);
/* ---- WebAudio: plucked strings, lazy, only inside a user gesture ---- */
function ensureAudio() {
  if (audioCtx) return;

    var AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return;
    audioCtx = new AC();

}
function pluck(freq, when, voice, dur) {

    var g = audioCtx.createGain();

      osc.type = 'triangle';
      f.type = 'lowpass'; f.frequency.value = 1400;
    } else { /* archtop: brighter sawtooth, open lowpass */
      osc.type = 'sawtooth';
      f.type = 'lowpass'; f.frequency.value = 3200;

    g.gain.setValueAtTime(0.0001, when);

    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);

  try {
    var base = p.agent === 0 ? 220.0 : 196.0; /* A3 nylon, G3 archtop */
    var now = audioCtx.currentTime + 0.02;
    var i, semi, freq;
    for (i = 0; i < p.notes.length; i++) {

}
function reseedDialogue() {
  var s = (Math.random() * 1000000000) | 0;

  phrases = genPhrases(s);
  phraseOrigin = phaseT;
  lastPhraseIdx = -1;
  ensureAudio();
  if (audioCtx && audioReady) {

}
function size() {
  var vw = 0, vh = 0;

  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {

/* Centered geometric composition: full-bleed on phones, a centered

function fieldRect() {

}
function guitarGeom(sc, U) {

  var gx = sceneU * 0.235;

    cx: cx, cy: cy, gx: gx, bodyH: bodyH, U: sceneU,

/* Classical guitar silhouette: figure-eight body, round soundhole with
   rosette, bridge, short neck and slotted headstock, six strings. */
function drawClassical(g, U) {
  var x = g.left.x, y = g.left.y;
  var w = U * 0.115, h = g.bodyH;
  var tilt = -0.10;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);
  /* body: two overlapping bouts, fill only, then one faint outline each
     so no seam cuts across the waist */
  ctx.fillStyle = BODY;
  ctx.beginPath();
  ctx.moveTo(w * 0.62, h * 0.22);
  ctx.ellipse(0, h * 0.22, w * 0.62, h * 0.30, 0, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(w * 0.46, -h * 0.22);
  ctx.ellipse(0, -h * 0.22, w * 0.46, h * 0.20, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(SPOT, 0.16);
  ctx.lineWidth = Math.max(1, U * 0.004);
  ctx.beginPath();
  ctx.moveTo(w * 0.62, h * 0.22);
  ctx.ellipse(0, h * 0.22, w * 0.62, h * 0.30, 0, 0, TAU);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(w * 0.46, -h * 0.22);
  ctx.ellipse(0, -h * 0.22, w * 0.46, h * 0.20, 0, 0, TAU);
  ctx.stroke();

  ctx.strokeStyle = rgba(SPOT, 0.6);
  ctx.lineWidth = Math.max(1, U * 0.006);
  ctx.beginPath();
  ctx.arc(0, h * 0.22, w * 0.62, -Math.PI * 0.45, Math.PI * 0.45, false);
  ctx.stroke();
  /* soundhole and rosette */
  ctx.fillStyle = BLACK;
  ctx.beginPath();
  ctx.moveTo(w * 0.15, -h * 0.06);
  ctx.arc(0, -h * 0.06, w * 0.15, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(SPOT_PALE, 0.75);
  ctx.lineWidth = Math.max(1, U * 0.005);
  ctx.beginPath();
  ctx.moveTo(w * 0.19, -h * 0.06);
  ctx.arc(0, -h * 0.06, w * 0.19, 0, TAU);
  ctx.stroke();
  /* bridge */
  ctx.fillStyle = '#241A0C';
  ctx.fillRect(-w * 0.28, h * 0.13, w * 0.56, h * 0.035);
  /* neck and frets, short so the body carries the silhouette */
  ctx.fillStyle = BODY;
  ctx.fillRect(-w * 0.085, -h * 0.80, w * 0.17, h * 0.62);
  ctx.strokeStyle = rgba(SPOT_PALE, 0.35);
  ctx.lineWidth = Math.max(0.6, U * 0.002);
  var f;
  for (f = 0; f < 4; f++) {
    ctx.beginPath();
    ctx.moveTo(-w * 0.085, -h * (0.68 - f * 0.12));
    ctx.lineTo(w * 0.085, -h * (0.68 - f * 0.12));
    ctx.stroke();

  /* headstock */
  ctx.fillStyle = BODY;
  ctx.strokeStyle = rgba(SPOT, 0.30);
  ctx.lineWidth = Math.max(1, U * 0.004);
  ctx.beginPath();
  ctx.moveTo(-w * 0.12, -h * 0.80);
  ctx.lineTo(w * 0.12, -h * 0.80);
  ctx.lineTo(w * 0.10, -h * 0.95);
  ctx.lineTo(-w * 0.10, -h * 0.95);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.strokeStyle = rgba(TRAIL_WHITE, 0.5);
  ctx.lineWidth = Math.max(0.6, U * 0.0016);
  var s, sx;
  for (s = 0; s < 6; s++) {
    sx = -w * 0.07 + s * w * 0.028;

/* Archtop silhouette: single rounded body, two f-holes, floating bridge,

  var x = g.right.x, y = g.right.y;
  var w = U * 0.115, h = g.bodyH;
  var tilt = 0.08;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);
  ctx.fillStyle = BODY;
  ctx.beginPath();
  ctx.moveTo(w * 0.60, h * 0.14);
  ctx.ellipse(0, h * 0.14, w * 0.60, h * 0.34, 0, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = rgba(SPOT, 0.16);
  ctx.lineWidth = Math.max(1, U * 0.004);
  ctx.beginPath();
  ctx.moveTo(w * 0.60, h * 0.14);
  ctx.ellipse(0, h * 0.14, w * 0.60, h * 0.34, 0, 0, TAU);
  ctx.stroke();
  /* amber rim on the side facing the other player */
  ctx.strokeStyle = rgba(SPOT, 0.6);
  ctx.lineWidth = Math.max(1, U * 0.006);
  ctx.beginPath();
  ctx.arc(0, h * 0.14, w * 0.60, Math.PI * 0.58, Math.PI * 1.42, false);
  ctx.stroke();

  ctx.lineWidth = Math.max(1, U * 0.006);

    ctx.moveTo(side * w * 0.28, h * 0.00);
    ctx.quadraticCurveTo(side * w * 0.42, h * 0.08, side * w * 0.28, h * 0.18);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(side * w * 0.28 + w * 0.05, h * 0.00);
    ctx.arc(side * w * 0.28, h * 0.00, w * 0.05, 0, TAU);
    ctx.stroke();

  ctx.fillStyle = '#241A0C';
  ctx.fillRect(-w * 0.30, h * 0.16, w * 0.60, h * 0.03);
  ctx.beginPath();
  ctx.moveTo(-w * 0.16, h * 0.40);
  ctx.lineTo(w * 0.16, h * 0.40);
  ctx.lineTo(w * 0.10, h * 0.46);
  ctx.lineTo(-w * 0.10, h * 0.46);
  ctx.closePath();
  ctx.fill();
  /* neck with markers, short so the body carries the silhouette */
  ctx.fillStyle = BODY;
  ctx.fillRect(-w * 0.095, -h * 0.82, w * 0.19, h * 0.64);
  ctx.fillStyle = rgba(SPOT_PALE, 0.55);

  for (f = 0; f < 3; f++) {

  ctx.lineTo(w * 0.13, -h * 0.82);
  ctx.lineTo(w * 0.10, -h * 0.97);
  ctx.lineTo(-w * 0.10, -h * 0.97);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  /* six strings, tailpiece to headstock */
  ctx.strokeStyle = rgba(TRAIL_GOLD, 0.5);
  ctx.lineWidth = Math.max(0.6, U * 0.0016);

  for (s = 0; s < 6; s++) {
    sx = -w * 0.075 + s * w * 0.03;
    ctx.beginPath();
    ctx.moveTo(sx, h * 0.40);
    ctx.lineTo(sx * 0.75, -h * 0.95);
    ctx.stroke();
  }
  ctx.restore();
}
/* Trail points for one phrase: from the speaker's soundhole, across the

  ctx.font = smallPx + 'px monospace';

    pg.addColorStop(1, rgba(SPOT, 0));

    ctx.beginPath();
    ctx.moveTo(px + poolR, cy);
    ctx.arc(px, cy, poolR, 0, TAU);

    fg.addColorStop(1, rgba(SPOT, 0));
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(px + SU * 0.16, cy + g.bodyH * 0.62);
    ctx.arc(px, cy + g.bodyH * 0.62, SU * 0.16, 0, TAU);
    ctx.fill();

  drawClassical(g, SU);
  drawArchtop(g, SU);

/* ---- frame one: fixed phase t = 9.0 s, seed 1879, dialogue mid phrase ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (canvas && typeof canvas.addEventListener === 'function') {
  canvas.addEventListener('pointerdown', function (ev) {
    if (ev && ev.preventDefault) ev.preventDefault();
    reseedDialogue();
  });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      /* when a phrase begins and audio is live, play its notes */
      if (audioReady) {
        var tt = phaseT - phraseOrigin;
        var i;
        for (i = 0; i < phrases.length; i++) {
          if (phrases[i].start <= tt && tt < phrases[i].start + 0.1 && i !== lastPhraseIdx) {
            lastPhraseIdx = i;
            playPhrase(phrases[i]);
            break;
          }
        }
      }
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
