<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Self-Portrait in Thread</title>
<style>
  html,body{margin:0;padding:0;background:#161311;overflow:hidden;height:100%;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var cv = document.getElementById('c');
var ctx = cv.getContext('2d');

/* ---------- seeded rng (fixed seed: deterministic) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var R = mulberry32(1273);
function rr(a,b){return a+R()*(b-a);}
function pick(arr){return arr[Math.floor(R()*arr.length)];}
function hexRgb(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mixc(h1,h2,f){var a=hexRgb(h1),b=hexRgb(h2);return 'rgb('+Math.round(a[0]+(b[0]-a[0])*f)+','+Math.round(a[1]+(b[1]-a[1])*f)+','+Math.round(a[2]+(b[2]-a[2])*f)+')';}

/* ---------- palette ---------- */
var ROSE='#C9A59A', UMBER='#7A5C42', MAGENTA='#B01E5A', RUST='#A6502E',
    SEAM='#3A332C', GROUND='#161311';

/* ---------- viewport sizing ---------- */
var W=0,H=0,S=0,OX=0,OY=0;
function size(){
  var vv=(typeof visualViewport!=='undefined'&&visualViewport)?visualViewport:null;
  var w=vv?vv.width:(typeof window!=='undefined'&&window.innerWidth?window.innerWidth:1280);
  var h=vv?vv.height:(typeof window!=='undefined'&&window.innerHeight?window.innerHeight:900);
  W=w;H=h;S=Math.min(w,h);OX=(w-S)/2;OY=(h-S)/2;
  cv.width=w;cv.height=h;
  cv.style.width=w+'px';cv.style.height=h+'px';
}
size();
if(typeof window!=='undefined'){
  if(typeof visualViewport!=='undefined'&&visualViewport&&visualViewport.addEventListener){
    visualViewport.addEventListener('resize',function(){size();});
  }
  if(window.addEventListener){window.addEventListener('resize',function(){size();});}
}

/* ---------- tapestry fragments (1000x1000 square space) ---------- */
function jaggedEdge(p1,p2){
  var pts=[p1],n=3;
  for(var i=1;i<n;i++){
    var f=i/n;
    pts.push([p1[0]+(p2[0]-p1[0])*f+rr(-13,13), p1[1]+(p2[1]-p1[1])*f+rr(-13,13)]);
  }
  pts.push(p2);
  return pts;
}
function polyFromCorners(corners){
  var pts=[];
  for(var i=0;i<corners.length;i++){
    var edge=jaggedEdge(corners[i],corners[(i+1)%corners.length]);
    for(var j=0;j<edge.length-1;j++) pts.push(edge[j]);
  }
  return pts;
}
var frags=[];
(function buildFragments(){
  var cols=4,rows=4,step=250;
  var gx=[],gy=[];
  for(var i=0;i<=cols;i++) gx.push(i===0?0:(i===cols?1000:i*step+rr(-20,20)));
  for(var j=0;j<=rows;j++) gy.push(j===0?0:(j===rows?1000:j*step+rr(-20,20)));
  /* shared jagged edges: neighbours reuse the same edge so no gaps open */
  var H=[],V=[];
  for(var j=0;j<=rows;j++){H.push([]);for(var i=0;i<cols;i++) H[j].push(jaggedEdge([gx[i],gy[j]],[gx[i+1],gy[j]]));}
  for(var i=0;i<=cols;i++){V.push([]);for(var j=0;j<rows;j++) V[i].push(jaggedEdge([gx[i],gy[j]],[gx[i],gy[j+1]]));}
  function chain(edges){
    var pts=[];
    for(var e=0;e<edges.length;e++){
      var ed=edges[e];
      for(var k=0;k<ed.length-1;k++) pts.push(ed[k]);
    }
    return pts;
  }
  function rev(ed){var out=[];for(var k=ed.length-1;k>=0;k--) out.push(ed[k]);return out;}
  var bases=[ROSE,UMBER,mixc(ROSE,UMBER,0.45),mixc(ROSE,'#EFE6D0',0.35),mixc(UMBER,'#3A332C',0.3)];
  for(var j=0;j<rows;j++)for(var i=0;i<cols;i++){
    var poly=chain([H[j][i],V[i+1][j],rev(H[j+1][i]),rev(V[i][j])]);
    var base=pick(bases);
    var motifs=[];
    for(var mx=gx[i]+40;mx<gx[i+1]-20;mx+=88){
      for(var my=gy[j]+40;my<gy[j+1]-20;my+=88){
        motifs.push([mx+rr(-14,14),my+rr(-14,14),rr(0.7,1.15)]);
      }
    }
    frags.push({poly:poly,base:base,motifs:motifs,
      motifCol:mixc(base,UMBER,0.45),drags:[]});
  }
})();
function tracePoly(c,pts){
  c.beginPath();
  c.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++) c.lineTo(pts[i][0],pts[i][1]);
  c.closePath();
}
function distToSeg(px,py,a,b){
  var dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy;
  var t=L2?Math.max(0,Math.min(1,((px-a[0])*dx+(py-a[1])*dy)/L2)):0;
  var x=a[0]+t*dx,y=a[1]+t*dy;
  return Math.hypot(px-x,py-y);
}
function fragOffset(f,t){
  var ox=0,oy=0;
  for(var i=0;i<f.drags.length;i++){
    var d=f.drags[i];
    if(d.upT===null||t<d.upT){ox+=d.dx*0.6;oy+=d.dy*0.6;}
    else{
      var dt=t-d.upT,dec=Math.exp(-dt*2.2)*Math.cos(dt*7);
      ox+=d.endDx*0.6*dec;oy+=d.endDy*0.6*dec;
    }
  }
  return [Math.max(-45,Math.min(45,ox)),Math.max(-45,Math.min(45,oy))];
}

/* ---------- figure: silhouette + face paths, sampled into thread dashes ---------- */
function oval(cx,cy,rx,ry,a0,a1,n,jit){
  var pts=[];
  for(var i=0;i<=n;i++){
    var a=a0+(a1-a0)*i/n;
    pts.push([cx+Math.cos(a)*rx+rr(-jit,jit),cy+Math.sin(a)*ry+rr(-jit,jit)]);
  }
  return pts;
}
var PATHS=[
  /* head outline, slightly asymmetric jaw (rust) */
  {col:RUST,pts:oval(600,232,72,96,-Math.PI/2,Math.PI*1.5,26,3)},
  /* face: brows, eyes, nose, mouth (magenta) */
  {col:MAGENTA,pts:[[566,212],[582,206],[598,208]]},
  {col:MAGENTA,pts:[[612,208],[628,206],[644,212]]},
  {col:MAGENTA,pts:[[572,228],[588,230],[586,236]]},
  {col:MAGENTA,pts:[[622,230],[638,228],[636,236]]},
  {col:MAGENTA,pts:[[600,232],[596,258],[606,268]]},
  {col:MAGENTA,pts:[[582,282],[600,288],[618,282]]},
  /* neck + torso outline (rust) */
  {col:RUST,pts:[[572,318],[570,352],[516,372],[508,470],[522,560],[512,640]]},
  {col:RUST,pts:[[630,318],[632,352],[688,368],[696,470],[682,560],[690,640]]},
  /* arms: left hangs, right bent across (rust) */
  {col:RUST,pts:[[516,372],[478,452],[462,548],[458,622]]},
  {col:RUST,pts:[[688,368],[742,448],[726,512],[676,556]]},
  /* legs + feet (rust) */
  {col:RUST,pts:[[512,640],[528,760],[540,892],[556,908]]},
  {col:RUST,pts:[[690,640],[676,760],[664,892],[648,908]]},
  {col:RUST,pts:[[576,640],[582,760],[584,892]]},
  {col:RUST,pts:[[628,640],[624,760],[622,892]]},
  /* inner seam lines: waist + hem (magenta) */
  {col:MAGENTA,pts:[[522,560],[600,552],[682,560]]},
  {col:MAGENTA,pts:[[512,640],[600,648],[690,640]]}
];
var dashes=[];
(function buildDashes(){
  var order=0;
  for(var p=0;p<PATHS.length;p++){
    var path=PATHS[p].pts;
    for(var s=0;s<path.length-1;s++){
      var a=path[s],b=path[s+1];
      var len=Math.hypot(b[0]-a[0],b[1]-a[1]);
      var ux=(b[0]-a[0])/len,uy=(b[1]-a[1])/len;
      var px=-uy,py=ux,d=0;
      while(d<len){
        var dl=rr(8,12),gl=rr(5,7);
        var x1=a[0]+ux*d+px*rr(-1.5,1.5),y1=a[1]+uy*d+py*rr(-1.5,1.5);
        var ang=Math.atan2(uy,ux)+rr(-0.12,0.12);
        var x2=x1+Math.cos(ang)*dl,y2=y1+Math.sin(ang)*dl;
        dashes.push({x1:x1,y1:y1,x2:x2,y2:y2,col:PATHS[p].col,order:order++});
        d+=dl+gl;
      }
    }
  }
})();
var TOTAL=dashes.length, STITCH_T=20;
function dashAlpha(d,t){
  var baseT=d.order/TOTAL*STITCH_T;
  var baseA=0;
  if(t>=baseT) baseA=Math.min(1,(t-baseT)/0.15);
  else if(d.order<28) baseA=1; /* frame one: the first stitches are already down */
  var ev=null;
  for(var i=0;i<restitches.length;i++){
    var e=restitches[i];
    if(Math.hypot((d.x1+d.x2)/2-e.x,(d.y1+d.y2)/2-e.y)<e.r) ev=e;
  }
  if(!ev||t<ev.t) return baseA;
  var dt=t-ev.t;
  if(dt<0.3) return baseA*(1-dt/0.3);
  var local=0;
  for(var j=0;j<dashes.length;j++){
    var o=dashes[j];
    if(o===d) break;
    if(Math.hypot((o.x1+o.x2)/2-ev.x,(o.y1+o.y2)/2-ev.y)<ev.r) local++;
  }
  var effT=ev.t+local*0.04;
  if(t<effT) return 0;
  return Math.min(1,(t-effT)/0.15);
}

/* ---------- interaction state (closed-form over recorded events + t) ---------- */
var restitches=[];
var liveDrag=null, holdTimer=null, holdPt=null;
function toSquare(e){
  var r=cv.getBoundingClientRect();
  var x=(e.clientX-r.left-OX)/S*1000, y=(e.clientY-r.top-OY)/S*1000;
  return [x,y];
}
function elapsed(){
  var now=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
  return (now-t0)/1000;
}
var t0=(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();
if(cv.addEventListener){
  cv.addEventListener('pointerdown',function(e){
    var p=toSquare(e),t=elapsed();
    holdPt={x:p[0],y:p[1],t:t,moved:false};
    holdTimer=setTimeout(function(){
      if(holdPt&&!holdPt.moved) restitches.push({t:elapsed(),x:holdPt.x,y:holdPt.y,r:110});
      holdTimer=null;
    },380);
    /* nearest fragment edge within 28 units starts a nudge drag */
    var best=null,bd=1e9;
    for(var i=0;i<frags.length;i++){
      var poly=frags[i].poly;
      for(var k=0;k<poly.length;k++){
        var dd=distToSeg(p[0],p[1],poly[k],poly[(k+1)%poly.length]);
        if(dd<bd){bd=dd;best=frags[i];}
      }
    }
    if(best&&bd<28){
      var drag={dx:0,dy:0,endDx:0,endDy:0,upT:null};
      best.drags.push(drag);
      liveDrag={f:best,drag:drag,sx:p[0],sy:p[1]};
    }
  });
  cv.addEventListener('pointermove',function(e){
    if(!holdPt&&!liveDrag) return;
    var p=toSquare(e);
    if(holdPt&&Math.hypot(p[0]-holdPt.x,p[1]-holdPt.y)>12){
      holdPt.moved=true;
      if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}
    }
    if(liveDrag){
      liveDrag.drag.dx=p[0]-liveDrag.sx;
      liveDrag.drag.dy=p[1]-liveDrag.sy;
    }
  });
  function endPointer(){
    if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}
    holdPt=null;
    if(liveDrag){
      liveDrag.drag.endDx=liveDrag.drag.dx;
      liveDrag.drag.endDy=liveDrag.drag.dy;
      liveDrag.drag.upT=elapsed();
      liveDrag=null;
    }
  }
  cv.addEventListener('pointerup',endPointer);
  cv.addEventListener('pointercancel',endPointer);
}

/* ---------- draw ---------- */
function draw(t){
  ctx.fillStyle=GROUND;
  ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(OX,OY);
  ctx.scale(S/1000,S/1000);
  /* tapestry fragments */
  for(var i=0;i<frags.length;i++){
    var f=frags[i],off=fragOffset(f,t);
    ctx.save();
    ctx.translate(off[0],off[1]);
    tracePoly(ctx,f.poly);
    ctx.fillStyle=f.base;
    ctx.fill();
    ctx.save();
    tracePoly(ctx,f.poly);
    ctx.clip();
    ctx.fillStyle=f.motifCol;
    for(var m=0;m<f.motifs.length;m++){
      var mt=f.motifs[m],mx=mt[0],my=mt[1],sc=mt[2];
      ctx.save();
      ctx.translate(mx,my);
      ctx.globalAlpha=0.22;
      ctx.fillRect(-3*sc,-9*sc,6*sc,18*sc);
      ctx.fillRect(-9*sc,-3*sc,18*sc,6*sc);
      ctx.globalAlpha=0.35;
      ctx.fillRect(-3*sc,-3*sc,6*sc,6*sc);
      ctx.restore();
    }
    ctx.restore();
    tracePoly(ctx,f.poly);
    ctx.strokeStyle=SEAM;
    ctx.lineWidth=3;
    ctx.stroke();
    ctx.restore();
  }
  /* thread figure */
  ctx.lineCap='round';
  for(var d=0;d<dashes.length;d++){
    var dash=dashes[d],a=dashAlpha(dash,t);
    if(a<=0) continue;
    ctx.globalAlpha=a;
    ctx.strokeStyle=dash.col;
    ctx.lineWidth=3.4;
    ctx.beginPath();
    ctx.moveTo(dash.x1,dash.y1);
    ctx.lineTo(dash.x2,dash.y2);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

draw(0);
if(typeof requestAnimationFrame!=='undefined'){
  (function loop(){
    draw(elapsed());
    requestAnimationFrame(loop);
  })();
}
})();
</script>
</body>
</html>
