<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Petalclouds</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0E15; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashSeed(a, b) {
    var h = (a * 374761393 + b * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (h ^ (h >>> 16)) >>> 0;
  }

  var qs = '';
  try { qs = (window.location && window.location.search) || ''; } catch (e) { qs = ''; }
  var seedMatch = /[?&]seed=(\d+)/.exec(qs);
  var BASE_SEED = seedMatch ? parseInt(seedMatch[1], 10) : 113003;
  var generation = 0;

  // ---------- palette ----------
  var SKY = '#0A0E15';
  var FLOOR = '#060910';
  var HORIZON = '#1A2230';
  var LIT = '#C9CED6';
  var SHADOW = '#454B54';
  var GLINT = '#FFE3B3';
  var POOL_DARK = '#241D14';
  var POOL_MID = '#4A3620';

  // ---------- world constants ----------
  var WW = 2.2;                 // world width, in stage widths
  var VIEW_X = 0.55;            // left edge of the view window in world units
  var TRAVERSE = WW / 300;      // world units per second: full migration ~5 min
  var T0 = 26;                  // fixed phase for frame one (seconds)

  // depth layers: 2 near, 3 mid, 1 far
  var LAYERS = [
    { count: 2, scale: 1.00, par: 1.00, alpha: 1.00, leaves: 18 },
    { count: 3, scale: 0.62, par: 0.55, alpha: 0.92, leaves: 15 },
    { count: 1, scale: 0.36, par: 0.25, alpha: 0.80, leaves: 12 }
  ];
  // target screen positions at frame one (fractions of stage W / H)
  var SLOTS = [
    { sx: 0.20, sy: 0.13 }, { sx: 0.80, sy: 0.21 },   // near
    { sx: 0.06, sy: 0.27 }, { sx: 0.50, sy: 0.15 }, { sx: 0.95, sy: 0.31 }, // mid
    { sx: 0.38, sy: 0.10 }                            // far
  ];

  var clouds = [];
  function buildClouds() {
    clouds = [];
    var rng = mulberry32(hashSeed(BASE_SEED, generation));
    var slot = 0;
    for (var li = 0; li < LAYERS.length; li++) {
      var L = LAYERS[li];
      for (var ci = 0; ci < L.count; ci++) {
        var s = SLOTS[slot++];
        var cloud = {
          layer: L,
          // world x chosen so that at t=T0 (with traverse applied) it sits at the slot
          baseWX: s.sx + VIEW_X - TRAVERSE * T0 + (rng() - 0.5) * 0.03,
          cy: s.sy + (rng() - 0.5) * 0.02,
          rx: 0.21 * L.scale * (0.9 + rng() * 0.25),
          ry: 0.21 * L.scale * (0.9 + rng() * 0.25),
          poolYOff: rng() * 0.075,
          morphPh: rng() * Math.PI * 2,
          stretchPh: rng() * Math.PI * 2,
          swirl: 0.5 + rng() * 0.7,
          bobPh: rng() * Math.PI * 2,
          leaves: []
        };
        for (var k = 0; k < L.leaves; k++) {
          cloud.leaves.push({
            baseAng: (k / L.leaves) * Math.PI * 2 + (rng() - 0.5) * 0.55,
            baseRad: 0.25 + rng() * 0.75,
            ph1: rng() * Math.PI * 2,
            ph2: rng() * Math.PI * 2,
            len: (0.078 + rng() * 0.062) * L.scale,
            wid: 0.40 + rng() * 0.14,      // width as fraction of length
            spin: (rng() - 0.5) * 0.6
          });
        }
        clouds.push(cloud);
      }
    }
  }
  buildClouds();

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var cssW = 0, cssH = 0, dpr = 1;

  function isPhone() {
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) {}
    var mn = Math.min(sw, sh);
    if (mn > 0 && mn < 700) return true;
    return cssH > cssW * 1.15;
  }

  function fit() {
    var w = 0, h = 0;
    try {
      if (window.visualViewport) { w = window.visualViewport.width; h = window.visualViewport.height; }
    } catch (e) {}
    if (!w || !h) { w = window.innerWidth; h = window.innerHeight; }
    cssW = w; cssH = h;
    dpr = 1;
    try { dpr = Math.min(window.devicePixelRatio || 1, 2); } catch (e) { dpr = 1; }
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
  }
  fit();
  try {
    if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { fit(); draw(currentT()); });
  } catch (e) {}
  try { window.addEventListener('resize', function () { fit(); draw(currentT()); }); } catch (e) {}

  // ---------- interaction state (recorded events; offsets are closed-form in t) ----------
  var panDrag = null;      // {startX, startPan} while dragging empty space
  var panRelease = null;   // {t, pan} after release: decays back to 0
  var nudges = [];         // {ci, li, t0, dx, dy} leaf nudge events
  var lastTap = null;      // {t, x, y}

  function panAt(t) {
    if (panDrag) return panDrag.pan;
    if (panRelease) {
      var dt = t - panRelease.t;
      if (dt < 0) return panRelease.pan;
      return panRelease.pan * Math.exp(-dt / 2.4);
    }
    return 0;
  }

  function nowT() { return currentT(); }
  var startStamp = null;
  function currentT() {
    if (startStamp === null) return T0;
    return T0 + (startStamp.elapsed || 0);
  }

  // ---------- geometry ----------
  function wrapX(x) {
    var v = x % WW;
    return v < 0 ? v + WW : v;
  }

  // screen x (in stage-width units) for a world x at time t with parallax factor
  function screenX(wx, par, t, counterRate) {
    var rate = counterRate ? -1.4 * TRAVERSE : TRAVERSE;
    var moved = wrapX(wx + rate * t);
    return wrapX(moved - VIEW_X - panAt(t) * par);
  }

  // leaf world position (fractions: x of stage W, y of stage H) at time t
  function leafPos(cloud, leaf, t) {
    var cyc = (Math.PI * 2) * (t / 60) + cloud.morphPh;
    var ang = leaf.baseAng + cloud.swirl * 0.35 * Math.sin(cyc + leaf.ph1);
    var rad = leaf.baseRad * (1 + 0.30 * Math.sin(cyc + leaf.ph2));
    var sx = 1 + 0.25 * Math.sin(cyc + cloud.stretchPh);
    var sy = 1 - 0.18 * Math.sin(cyc + cloud.stretchPh);
    var lx = Math.cos(ang) * rad * cloud.rx * sx;
    var ly = Math.sin(ang) * rad * cloud.ry * sy * 0.62;
    var bob = 0.012 * Math.sin((Math.PI * 2) * (t / 47) + cloud.bobPh);
    return { lx: lx, ly: ly + bob };
  }

  // nudge offset (closed-form damped spring) for leaf (ci, li) at time t
  function nudgeOffset(ci, li, cloud, leafIdxInCloud, t) {
    var ox = 0, oy = 0;
    for (var i = 0; i < nudges.length; i++) {
      var n = nudges[i];
      if (n.ci !== ci) continue;
      var w = (n.li === li) ? 1 : 0.35;             // neighbours re-balance at 0.35
      var delay = (n.li === li) ? 0 : 0.12 + 0.05 * Math.abs(n.li - li);
      var s = t - n.t0 - delay;
      if (s <= 0) continue;
      var env = Math.exp(-2.0 * s) * (Math.cos(3.6 * s) + 0.55 * Math.sin(3.6 * s));
      ox += n.dx * w * env * -1;                     // spring overshoots back through rest
      oy += n.dy * w * env * -1;
    }
    return { x: ox, y: oy };
  }

  function drawLeaf(x, y, lenPx, widPx, ang, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    // shadow body (full leaf)
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(-lenPx / 2, 0);
    ctx.quadraticCurveTo(-lenPx * 0.08, -widPx / 2, lenPx / 2, 0);
    ctx.quadraticCurveTo(-lenPx * 0.08, widPx / 2, -lenPx / 2, 0);
    ctx.closePath();
    ctx.fillStyle = SHADOW;
    ctx.fill();
    // lit upper face
    ctx.beginPath();
    ctx.moveTo(-lenPx / 2, 0);
    ctx.quadraticCurveTo(-lenPx * 0.08, -widPx / 2, lenPx / 2, 0);
    ctx.quadraticCurveTo(-lenPx * 0.02, widPx * 0.14, -lenPx / 2, 0);
    ctx.closePath();
    ctx.fillStyle = LIT;
    ctx.fill();
    // warm glint along the top edge
    ctx.globalAlpha = alpha * 0.55;
    ctx.beginPath();
    ctx.moveTo(-lenPx / 2, 0);
    ctx.quadraticCurveTo(-lenPx * 0.08, -widPx / 2, lenPx / 2, 0);
    ctx.strokeStyle = GLINT;
    ctx.lineWidth = Math.max(1, lenPx * 0.018);
    ctx.stroke();
    ctx.restore();
  }

  function draw(t) {
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var W = cssW, H = cssH;
    var horizon = H * 0.76;

    // sky
    ctx.globalAlpha = 1;
    ctx.fillStyle = SKY;
    ctx.fillRect(0, 0, W, H);

    // faint top light (layered flat-alpha ellipses, no gradients)
    ctx.fillStyle = GLINT;
    var glowW = [0.95, 0.7, 0.45], glowA = [0.030, 0.025, 0.02];
    for (var g = 0; g < 3; g++) {
      ctx.globalAlpha = glowA[g];
      ctx.beginPath();
      ctx.ellipse(W * 0.5, -H * 0.06, W * glowW[g] * 0.5, H * 0.10, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // floor
    ctx.globalAlpha = 1;
    ctx.fillStyle = FLOOR;
    ctx.fillRect(0, horizon, W, H - horizon);
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = HORIZON;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, horizon + 0.5);
    ctx.lineTo(W, horizon + 0.5);
    ctx.stroke();

    // floor pools: counter-drifting warm ellipses (drawn before clouds)
    var pi, ci, cloud, L, sxu, px, poolY;
    for (pi = 0; pi < clouds.length; pi++) {
      cloud = clouds[pi]; L = cloud.layer;
      sxu = screenX(cloud.baseWX, 0.45, t, true);
      var cand = [sxu, sxu - WW];
      for (var q = 0; q < 2; q++) {
        if (cand[q] < -0.45 || cand[q] > 1.45) continue;
        px = cand[q] * W;
        poolY = horizon + H * (0.085 + cloud.poolYOff);
        var pw = W * (cloud.rx * 0.9 + 0.03);
        var ph = H * 0.020 * L.scale + H * 0.006;
        ctx.fillStyle = POOL_DARK;
        ctx.globalAlpha = 0.7 * L.alpha;
        ctx.beginPath(); ctx.ellipse(px, poolY, pw, ph, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = POOL_MID;
        ctx.globalAlpha = 0.22 * L.alpha;
        ctx.beginPath(); ctx.ellipse(px, poolY, pw * 0.62, ph * 0.62, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = GLINT;
        ctx.globalAlpha = 0.05 * L.alpha;
        ctx.beginPath(); ctx.ellipse(px, poolY, pw * 0.34, ph * 0.4, 0, 0, Math.PI * 2); ctx.fill();
      }
    }

    // clouds, far to near (clouds array is already grouped near-first; draw reversed)
    lastLeafScreen.length = 0;
    for (ci = clouds.length - 1; ci >= 0; ci--) {
      cloud = clouds[ci]; L = cloud.layer;
      sxu = screenX(cloud.baseWX, L.par, t, false);
      var cands = [sxu, sxu - WW];
      for (var c2 = 0; c2 < 2; c2++) {
        var scx = cands[c2];
        if (scx < -0.5 || scx > 1.5) continue;
        var cxPx = scx * W;
        var cyPx = cloud.cy * H;
        for (var li2 = 0; li2 < cloud.leaves.length; li2++) {
          var leaf = cloud.leaves[li2];
          var p1 = leafPos(cloud, leaf, t);
          var p2 = leafPos(cloud, leaf, t + 0.35);
          var no = nudgeOffset(ci, li2, cloud, li2, t);
          var x = cxPx + (p1.lx + no.x) * W;
          var y = cyPx + (p1.ly + no.y) * W;
          var vx = (p2.lx - p1.lx), vy = (p2.ly - p1.ly);
          var ang = (Math.abs(vx) + Math.abs(vy) > 1e-6) ? Math.atan2(vy, vx) : leaf.baseAng;
          ang += leaf.spin * Math.sin((Math.PI * 2) * (t / 60) + leaf.ph1) * 0.4;
          var lenPx = leaf.len * W * (isPhone() ? 1.25 : 1);
          drawLeaf(x, y, lenPx, lenPx * leaf.wid, ang, L.alpha);
          if (c2 === 0) lastLeafScreen.push({ ci: ci, li: li2, x: x, y: y, r: lenPx * 0.55 });
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  var lastLeafScreen = [];

  // ---------- pointer interaction ----------
  function evtPos(e) {
    var x = 0, y = 0;
    if (e.offsetX !== undefined && e.offsetX !== null) { x = e.offsetX; y = e.offsetY; }
    else {
      try {
        var r = canvas.getBoundingClientRect();
        x = e.clientX - r.left; y = e.clientY - r.top;
      } catch (err) { x = e.clientX || 0; y = e.clientY || 0; }
    }
    return { x: x, y: y };
  }

  var activePtr = null;   // {mode:'pan'|'leaf', startX, startY, ci, li, moved}
  function onDown(e) {
    var t = nowT();
    var p = evtPos(e);
    // double-tap: reseed
    if (lastTap && (t - lastTap.t) < 0.34 && Math.abs(p.x - lastTap.x) < 30 && Math.abs(p.y - lastTap.y) < 30) {
      generation++;
      buildClouds();
      nudges.length = 0;
      panDrag = null; panRelease = null; activePtr = null; lastTap = null;
      draw(t);
      return;
    }
    lastTap = { t: t, x: p.x, y: p.y };
    // leaf hit test (nearest within radius)
    var best = null, bestD = 1e9;
    for (var i = 0; i < lastLeafScreen.length; i++) {
      var s = lastLeafScreen[i];
      var d = Math.hypot(s.x - p.x, s.y - p.y);
      if (d < s.r && d < bestD) { bestD = d; best = s; }
    }
    if (best) {
      activePtr = { mode: 'leaf', ci: best.ci, li: best.li, startX: p.x, startY: p.y, curX: p.x, curY: p.y, nudged: false };
    } else {
      activePtr = { mode: 'pan', startX: p.x };
      panDrag = { pan: panAt(t) };
      panRelease = null;
    }
  }
  function onMove(e) {
    if (!activePtr) return;
    var t = nowT();
    var p = evtPos(e);
    if (activePtr.mode === 'pan' && panDrag) {
      var dx = (p.x - activePtr.startX) / cssW;
      var np = Math.max(-0.4, Math.min(0.4, dx));
      panDrag.pan = np;
    } else if (activePtr.mode === 'leaf') {
      activePtr.curX = p.x; activePtr.curY = p.y;
    }
    draw(t);
  }
  function onUp(e) {
    if (!activePtr) return;
    var t = nowT();
    if (activePtr.mode === 'pan' && panDrag) {
      panRelease = { t: t, pan: panDrag.pan };
      panDrag = null;
    } else if (activePtr.mode === 'leaf') {
      var dxs = (activePtr.curX - activePtr.startX) / cssW;
      var dys = (activePtr.curY - activePtr.startY) / cssW;
      if (Math.abs(dxs) > 0.004 || Math.abs(dys) > 0.004) {
        nudges.push({ ci: activePtr.ci, li: activePtr.li, t0: t, dx: dxs, dy: dys });
        if (nudges.length > 24) nudges.shift();
      }
    }
    activePtr = null;
    draw(t);
  }
  try {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  } catch (e) {}

  // ---------- run ----------
  draw(T0);
  if (typeof requestAnimationFrame === 'function') {
    var first = null;
    var loop = function (now) {
      if (first === null) { first = now; startStamp = { elapsed: 0 }; }
      startStamp.elapsed = (now - first) / 1000;
      draw(currentT());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
