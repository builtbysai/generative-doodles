<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Eye Garden — №8972</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #f6f0dd;
    overscroll-behavior: none;
  }
  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #cap {
    position: fixed; left: 14px; bottom: 12px; max-width: 70vw;
    font: 400 13px/1.45 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: rgba(90, 78, 58, 0.72); letter-spacing: 0.01em;
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
  #seedtag {
    position: fixed; right: 14px; bottom: 12px;
    font: 400 11px/1.4 ui-rounded, system-ui, sans-serif;
    color: rgba(90, 78, 58, 0.42);
    pointer-events: none; user-select: none; -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="cap">Sweep through the garden and the eyes widen to look at you. Tap to grow a fresh garden.</div>
<div id="seedtag"></div>
<script>
"use strict";
/* ============================================================
   Eye Garden — №8972 (2026-08-04)
   A field of eye-pair sprouts. Each sprout is a small chain-follow
   creature with its own energy meter: pointer proximity feeds the
   meter, the pupils dilate, the stem leans toward the pointer, and
   the meter drains over a couple of seconds so a sweep leaves a
   wake of widening eyes that relaxes back. Click/tap plants a new
   seeded garden.
   ============================================================ */

// ---------- seeded PRNG ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const q = new URLSearchParams(location.search);
const sm = /[?&]seed=(\d+)/.exec(location.search);
let seed = sm ? (parseInt(sm[1], 10) >>> 0) : 75;
const pinPx = q.has("px") ? parseFloat(q.get("px")) : null;
const pinPy = q.has("py") ? parseFloat(q.get("py")) : null;

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const seedtag = document.getElementById("seedtag");
let W = 0, H = 0, DPR = 1;

let sprouts = [];
let tufts = [];
let pebbles = [];
let sun = { x: 0.8, y: 0.18, r: 46 };

// toy-like pastel iris palette (seeded per sprout)
const IRIS = ["#8fd0c2", "#9cc3e8", "#f2b8c6", "#c3aee6", "#f7d774", "#a8d5a2", "#f0a988"];

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildGarden(seed);
}

function buildGarden(s) {
  const rng = mulberry32(s);
  sprouts = []; tufts = []; pebbles = [];

  // ---- garden bed: sprouts on a soft hill, back rows smaller ----
  const hillTop = H * 0.52, hillBot = H * 1.02;
  const cell = Math.max(120, Math.min(190, Math.sqrt((W * H) / 64)));
  const cols = Math.max(3, Math.floor(W / cell));
  const rows = Math.max(2, Math.floor((hillBot - hillTop) / (cell * 0.82)));
  let id = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (rng() < 0.08) continue; // a few gaps keep it airy
      const depth = rows <= 1 ? 1 : r / (rows - 1);          // 0 back … 1 front
      const sc = 0.52 + depth * 0.66;                        // size by depth
      const x = Math.min(W - 46, Math.max(46, (c + 0.5 + (rng() - 0.5) * 0.9) * (W / cols)));
      const baseY = hillTop + depth * (hillBot - hillTop) + (rng() - 0.5) * cell * 0.5;
      const h = (86 + rng() * 96) * sc * Math.min(1.15, Math.max(0.7, H / 800));
      const segs = 4 + Math.floor(rng() * 3);
      const lean = (rng() - 0.5) * 0.24;
      sprouts.push({
        id: id++,
        x: x, baseY: baseY, h: h, sc: sc,
        n: segs, segLen: h / segs,
        pts: [], vel: { x: 0, y: 0 },
        lean0: lean,
        energy: 0,
        blinkT: 1 + rng() * 5, blink: 0,
        iris: IRIS[Math.floor(rng() * IRIS.length)],
        leaf: rng() < 0.62, leafSide: rng() < 0.5 ? -1 : 1,
        leafAt: 1 + Math.floor(rng() * (segs - 2)),
        phase: rng() * Math.PI * 2,
        swaySpd: 0.5 + rng() * 0.5,
        lookX: 0, lookY: 0,
        eyeGap: 0.78 + rng() * 0.3,
        eyeR: (13 + rng() * 7) * sc,
      });
    }
  }
  // init chain points at rest
  for (const s of sprouts) {
    s.pts = [];
    for (let i = 0; i < s.n; i++) {
      s.pts.push({ x: s.x, y: s.baseY - (i + 1) * s.segLen });
    }
  }
  // back-row sprouts drawn first
  sprouts.sort((a, b) => a.baseY - b.baseY);

  // ---- static garden texture (seeded, motionless) ----
  const tuftN = Math.floor((W * H) / 26000);
  for (let i = 0; i < tuftN; i++) {
    tufts.push({
      x: rng() * W,
      y: hillTop + rng() * (H - hillTop),
      s: 0.5 + rng() * 0.8,
      a: rng() * Math.PI * 2,
      blades: 3 + Math.floor(rng() * 3),
    });
  }
  const pebN = Math.floor((W * H) / 42000);
  for (let i = 0; i < pebN; i++) {
    pebbles.push({
      x: rng() * W,
      y: hillTop + rng() * (H - hillTop),
      r: 1.5 + rng() * 3.5,
      sh: 0.82 + rng() * 0.18,
    });
  }
  seedtag.textContent = "garden " + s;
}

// ---------- pointer ----------
const pointer = { x: 0, y: 0, active: false, lastSeen: -10 };
let tNow = 0;

function setPointer(x, y) {
  pointer.x = x; pointer.y = y; pointer.active = true; pointer.lastSeen = tNow;
}
window.addEventListener("pointermove", (e) => setPointer(e.clientX, e.clientY), { passive: true });
window.addEventListener("pointerdown", (e) => setPointer(e.clientX, e.clientY), { passive: true });
document.addEventListener("mouseleave", () => { pointer.active = false; });
window.addEventListener("blur", () => { pointer.active = false; });

// tap (not drag) plants a fresh garden
let downPos = null, downT = 0;
window.addEventListener("pointerdown", (e) => { downPos = { x: e.clientX, y: e.clientY }; downT = performance.now(); }, { passive: true });
window.addEventListener("pointerup", (e) => {
  if (!downPos) return;
  const dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
  const dtms = performance.now() - downT;
  downPos = null;
  if (Math.hypot(dx, dy) < 14 && dtms < 600) {
    seed = (Math.random() * 1e9) | 0;
    try { history.replaceState(null, "", "?seed=" + seed); } catch (err) { /* file:// may throw */ }
    buildGarden(seed);
  }
}, { passive: true });

window.addEventListener("resize", resize);

// ---------- helpers ----------
function smooth01(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }
function lerp(a, b, t) { return a + (b - a) * t; }

function drawTuft(t) {
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.rotate(t.a * 0.1);
  ctx.strokeStyle = "rgba(122, 150, 92, 0.55)";
  ctx.lineWidth = 2.2 * t.s;
  ctx.lineCap = "round";
  for (let b = 0; b < t.blades; b++) {
    const ang = -Math.PI / 2 + (b - (t.blades - 1) / 2) * 0.42;
    const len = (10 + ((b * 37) % 9)) * t.s;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(Math.cos(ang) * len * 0.5, Math.sin(ang) * len * 0.6,
      Math.cos(ang) * len, Math.sin(ang) * len - 2 * t.s);
    ctx.stroke();
  }
  ctx.restore();
}

function drawLeaf(x, y, ang, s, rngShade) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  const L = 26 * s, Wd = 11 * s;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(L * 0.4, -Wd, L * 0.9, -Wd * 0.5, L, 0);
  ctx.bezierCurveTo(L * 0.9, Wd * 0.5, L * 0.4, Wd, 0, 0);
  ctx.closePath();
  ctx.fillStyle = rngShade < 0.5 ? "#8fb56a" : "#7ba85e";
  ctx.fill();
  ctx.strokeStyle = "#5d8a48";
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(2, 0); ctx.lineTo(L * 0.92, 0);
  ctx.strokeStyle = "rgba(93, 138, 72, 0.7)";
  ctx.lineWidth = 1.1;
  ctx.stroke();
  ctx.restore();
}

// ---------- main loop ----------
let lastT = performance.now();
const INFLUENCE = 250;   // px radius feeding the energy meter
const LEAN_MAX = 44;     // px of tip lean toward the pointer
const RELAX_TAU = 2.1;   // seconds for the wake to relax

function frame() {
  const now = performance.now();
  let dt = (now - lastT) / 1000;
  lastT = now;
  dt = Math.min(dt, 0.05);
  tNow = now / 1000;

  // pinned pointer for deterministic renders (?px=&py=)
  if (pinPx !== null && pinPy !== null) {
    pointer.x = pinPx * W; pointer.y = pinPy * H;
    pointer.active = true; pointer.lastSeen = tNow;
  }
  if (pointer.active && tNow - pointer.lastSeen > 1.2) pointer.active = false;

  drawScene(dt);
  requestAnimationFrame(frame);
}

function drawScene(dt) {
  // --- light ground: warm ivory sky to soft grass ---
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#fdf9ee");
  g.addColorStop(0.52, "#f7efda");
  g.addColorStop(1, "#efe3c6");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // --- soft sun ---
  const sx = sun.x * W, sy = sun.y * H, sr = sun.r * Math.min(1.2, Math.max(0.7, W / 1280));
  const sg = ctx.createRadialGradient(sx, sy, sr * 0.2, sx, sy, sr * 2.2);
  sg.addColorStop(0, "rgba(255, 236, 170, 0.85)");
  sg.addColorStop(0.45, "rgba(255, 240, 190, 0.35)");
  sg.addColorStop(1, "rgba(255, 240, 190, 0)");
  ctx.fillStyle = sg;
  ctx.fillRect(sx - sr * 2.4, sy - sr * 2.4, sr * 4.8, sr * 4.8);

  // --- hill band ---
  const hillTop = H * 0.52;
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(0, hillTop + H * 0.05);
  ctx.bezierCurveTo(W * 0.3, hillTop - H * 0.03, W * 0.7, hillTop + H * 0.09, W, hillTop + H * 0.02);
  ctx.lineTo(W, H);
  ctx.closePath();
  const hg = ctx.createLinearGradient(0, hillTop - H * 0.05, 0, H);
  hg.addColorStop(0, "#e3e7c2");
  hg.addColorStop(1, "#d5dcae");
  ctx.fillStyle = hg;
  ctx.fill();

  // --- pebbles + tufts (static) ---
  for (const p of pebbles) {
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.r, p.r * 0.7, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(150, 140, 115," + (0.28 * p.sh) + ")";
    ctx.fill();
  }
  for (const t of tufts) drawTuft(t);

  // --- sprouts ---
  for (const s of sprouts) updateSprout(s, dt);
  for (const s of sprouts) drawSprout(s);
}

function updateSprout(s, dt) {
  const tip = s.pts[s.n - 1];

  // rest position: gentle seeded sway so the garden breathes
  const sway = Math.sin(tNow * s.swaySpd + s.phase) * 5 * s.sc;
  let tx = s.x + s.lean0 * s.h * 0.4 + sway;
  let ty = s.baseY - s.h;

  // lean toward the pointer when it is near
  let prox = 0;
  if (pointer.active) {
    const dx = pointer.x - tx, dy = pointer.y - ty;
    const d = Math.hypot(dx, dy);
    if (d < INFLUENCE && d > 1) {
      prox = 1 - d / INFLUENCE;
      const pull = prox * prox * LEAN_MAX * s.sc;
      tx += (dx / d) * pull;
      ty += (dy / d) * pull * 0.55;
    }
  }

  // springy tip, then chain-follow the rest of the segments
  const k = 110, damp = Math.exp(-7 * dt);
  s.vel.x = (s.vel.x + (tx - tip.x) * k * dt) * damp;
  s.vel.y = (s.vel.y + (ty - tip.y) * k * dt) * damp;
  tip.x += s.vel.x * dt * 60 * 0.16;
  tip.y += s.vel.y * dt * 60 * 0.16;

  // distance-constrained chain back to the pinned base
  for (let pass = 0; pass < 3; pass++) {
    let px = s.x, py = s.baseY;
    for (let i = 0; i < s.n; i++) {
      const p = s.pts[i];
      let dx = p.x - px, dy = p.y - py;
      let d = Math.hypot(dx, dy);
      if (d < 1e-4) { dx = 0; dy = -1; d = 1; }
      p.x = px + (dx / d) * s.segLen;
      p.y = py + (dy / d) * s.segLen;
      px = p.x; py = p.y;
    }
  }

  // energy meter: proximity feeds it, it drains over RELAX_TAU
  if (pointer.active) {
    const d = Math.hypot(pointer.x - tip.x, pointer.y - tip.y);
    if (d < INFLUENCE) {
      const f = 1 - d / INFLUENCE;
      s.energy = Math.min(1, s.energy + f * f * dt * 3.2);
    }
  }
  s.energy *= Math.exp(-dt / RELAX_TAU);

  // pupils look at the pointer, ease back to forward when it leaves
  let lx = 0, ly = 0;
  if (pointer.active) {
    const dx = pointer.x - tip.x, dy = pointer.y - tip.y;
    const d = Math.hypot(dx, dy) || 1;
    const m = Math.min(d, s.eyeR * 2.2) / d * 0.42;
    lx = dx * m; ly = dy * m;
  }
  const le = 1 - Math.exp(-dt * 8);
  s.lookX += (lx - s.lookX) * le;
  s.lookY += (ly - s.lookY) * le;

  // blink timer
  s.blinkT -= dt;
  if (s.blinkT <= 0) { s.blink = 0.16; s.blinkT = 2 + Math.random() * 5; }
  if (s.blink > 0) s.blink -= dt;
}

function drawSprout(s) {
  const tip = s.pts[s.n - 1];

  // soft ground shadow
  ctx.beginPath();
  ctx.ellipse(s.x, s.baseY + 3, 16 * s.sc, 5 * s.sc, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(110, 105, 80, 0.14)";
  ctx.fill();

  // stem: tapered rounded chain, outline + inner light
  const drawStem = (widthScale, style) => {
    ctx.strokeStyle = style;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    let px = s.x, py = s.baseY;
    for (let i = 0; i < s.n; i++) {
      const p = s.pts[i];
      const w = (7.5 - (i / s.n) * 3.6) * s.sc * widthScale;
      ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(p.x, p.y); ctx.stroke();
      px = p.x; py = p.y;
    }
  };
  drawStem(1.35, "#4f7a42");
  drawStem(1.0, "#79a85e");

  // leaf on a mid segment
  if (s.leaf) {
    const li = Math.min(s.leafAt, s.n - 1);
    const a = s.pts[li], b = li > 0 ? s.pts[li - 1] : { x: s.x, y: s.baseY };
    const segAng = Math.atan2(a.y - b.y, a.x - b.x);
    drawLeaf(a.x, a.y, segAng + s.leafSide * 1.15, s.sc * (0.8 + (s.id % 5) * 0.08), (s.id % 2));
  }

  // head: eye pair at the tip, angled across the stem direction
  const prev = s.pts[s.n - 2] || { x: s.x, y: s.baseY };
  const stemAng = Math.atan2(tip.y - prev.y, tip.x - prev.x);
  const across = stemAng + Math.PI / 2;
  const dil = smooth01(s.energy);
  const er = s.eyeR * (1 + 0.22 * dil);
  const gap = er * s.eyeGap;
  const ex1 = tip.x + Math.cos(across) * gap, ey1 = tip.y + Math.sin(across) * gap;
  const ex2 = tip.x - Math.cos(across) * gap, ey2 = tip.y - Math.sin(across) * gap;

  // blush when excited
  if (dil > 0.03) {
    ctx.fillStyle = "rgba(244, 150, 160," + (0.32 * dil) + ")";
    const bx = Math.cos(across), by = Math.sin(across);
    ctx.beginPath();
    ctx.ellipse(ex1 + bx * er * 0.5, ey1 + by * er * 0.5 + er * 0.72, er * 0.42, er * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(ex2 - bx * er * 0.5, ey2 - by * er * 0.5 + er * 0.72, er * 0.42, er * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  drawEye(ex1, ey1, er, dil, s);
  drawEye(ex2, ey2, er, dil, s);
}

function drawEye(ex, ey, er, dil, s) {
  // blink reads as a quick vertical squash, never a colored blob
  let sy = 1;
  if (s.blink > 0) {
    const p = 1 - Math.max(0, s.blink) / 0.16; // 0 … 1 across the blink
    sy = Math.max(0.06, 1 - Math.sin(p * Math.PI) * 0.94);
  }
  ctx.save();
  ctx.translate(ex, ey);
  ctx.scale(1, sy);

  // white
  ctx.beginPath();
  ctx.arc(0, 0, er, 0, Math.PI * 2);
  ctx.fillStyle = "#fffdf8";
  ctx.fill();
  ctx.strokeStyle = "rgba(120, 108, 88, 0.5)";
  ctx.lineWidth = 1.6;
  ctx.stroke();

  // iris ring blooms with dilation, pupil dilates with it
  const irisR = er * lerp(0.40, 0.66, dil);
  const pupR = er * lerp(0.20, 0.52, dil);
  ctx.beginPath();
  ctx.arc(s.lookX, s.lookY, irisR, 0, Math.PI * 2);
  ctx.fillStyle = s.iris;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(s.lookX, s.lookY, pupR, 0, Math.PI * 2);
  ctx.fillStyle = "#2c2b31";
  ctx.fill();
  // specular
  ctx.beginPath();
  ctx.arc(s.lookX - pupR * 0.35, s.lookY - pupR * 0.4, Math.max(1.2, pupR * 0.22), 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.95)";
  ctx.fill();

  ctx.restore();
}

// ---------- go ----------
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
