<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rose Wind</title>
<style>
html, body { margin: 0; padding: 0; background: #F4EDDF; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#F4EDDF';
var BAND_TOP = '#DCA9A2';
var BAND_MID = '#C98A8A';
var BAND_BOT = '#D6A39C';
var PLATE = '#2B1A1A';
var PLATE_LINE = 'rgba(214,140,120,0.55)';
var TITLE_INK = '#F4EDDF';
var HINT_INK = '#E9A86A';
var PERIOD = 24;
var FRAME_T = 3.0;
var VORTICES = 5;
var STREAMLINES = 110;
var LINE_COLORS = [
  '#A4161A', /* crimson */
  '#C1272D', /* crimson light */
  '#7F0E14', /* deep crimson */
  '#E08A1E', /* amber */
  '#F2B705', /* golden yellow */
  '#D96C2B'  /* burnt amber */
];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1721);
var phaseT = FRAME_T;
/* ---- drag vortex: 0 at frame one, stirred by the pointer, decays after release ---- */
var dragX = 0.5, dragY = 0.5, dragS = 0, dragging = false;
var lastPX = 0, lastPY = 0;
/* ---- seeded streamlines: fixed seeds, cluster centres and lengths, all from rng ---- */
var SEEDS = [];
(function () {
  var i, cx, cy, r;
  var clusters = [];
  for (i = 0; i < 4; i++) {
    clusters.push({ x: 0.12 + rng() * 0.76, y: 0.38 + rng() * 0.24 });
  }
  for (i = 0; i < STREAMLINES; i++) {
    if (rng() < 0.62) {
      var cl = clusters[Math.floor(rng() * clusters.length)];
      cx = cl.x + (rng() - 0.5) * 0.22;
      cy = cl.y + (rng() - 0.5) * 0.16;
    } else {
      cx = rng();
      cy = 0.34 + rng() * 0.32;
    }
    /* a few faint wisps drift into the calm cream margins */
    if (rng() < 0.10) cy = rng() < 0.5 ? 0.08 + rng() * 0.16 : 0.76 + rng() * 0.16;
    r = rng();
    SEEDS.push({
      x: clamp(cx, 0.02, 0.98),
      y: clamp(cy, 0.04, 0.96),
      steps: 40 + Math.floor(rng() * 160),
      color: LINE_COLORS[Math.floor(rng() * LINE_COLORS.length)],
      width: 0.9 + rng() * 1.3,
      alpha: 0.45 + rng() * 0.45,
      margin: r < 0.10
    });
  }
})();
/* ---- vortices: slow drifting weather systems, closed-form positions of t ---- */
function vortexAt(i, t) {
  var ph = TAU * t / PERIOD;
  var cx = 0.18 + 0.16 * i + 0.05 * Math.sin(ph + i * 1.7);
  var cy = 0.50 + 0.07 * Math.sin(ph * 0.7 + i * 2.3);
  var strength = (i % 2 === 0 ? 1 : -1) * (0.9 + 0.35 * Math.sin(ph * 0.5 + i));
  var radius = 0.16 + 0.05 * Math.sin(ph * 0.6 + i * 1.3);
  return { x: cx, y: cy, s: strength, r: radius };
}
/* ---- vector field: eastward base flow plus vortex swirl plus slow weather sway ---- */
function field(u, v, t, st) {
  var ph = TAU * t / PERIOD;
  var fx = 0.55 + 0.25 * Math.sin(ph * 0.8 + v * 6.0);
  var fy = 0.10 * Math.sin(ph + u * 5.0 + 1.2);
  var i, vt, dx, dy, d2, fall, sw;
  for (i = 0; i < VORTICES; i++) {
    vt = vortexAt(i, t);
    dx = u - vt.x; dy = (v - vt.y) * (st.h / st.w);
    d2 = dx * dx + dy * dy;
    fall = Math.exp(-d2 / (vt.r * vt.r));
    sw = vt.s * fall;
    fx += -dy * sw * 2.2;
    fy += dx * sw * 2.2;
  }
  /* drag vortex stirs the local field */
  if (dragS > 0.001) {
    dx = u - dragX; dy = (v - dragY) * (st.h / st.w);
    d2 = dx * dx + dy * dy;
    fall = Math.exp(-d2 / 0.0289);
    sw = dragS * fall;
    fx += -dy * sw * 2.6;
    fy += dx * sw * 2.6;
  }
  return { x: fx, y: fy };
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: square on desktop, full-bleed on phones (field-like composition) ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function drawBand(st) {
  var bandY = st.y + st.h / 3, bandH = st.h / 3;
  var g = ctx.createLinearGradient(0, bandY, 0, bandY + bandH);
  g.addColorStop(0, BAND_TOP);
  g.addColorStop(0.5, BAND_MID);
  g.addColorStop(1, BAND_BOT);
  ctx.fillStyle = g;
  ctx.fillRect(st.x, bandY, st.w, bandH);
  /* feather the band edges into the cream */
  var feather = bandH * 0.22;
  var gt = ctx.createLinearGradient(0, bandY, 0, bandY + feather);
  gt.addColorStop(0, rgba('#F4EDDF', 0.85));
  gt.addColorStop(1, rgba('#F4EDDF', 0));
  ctx.fillStyle = gt;
  ctx.fillRect(st.x, bandY, st.w, feather);
  var gb = ctx.createLinearGradient(0, bandY + bandH - feather, 0, bandY + bandH);
  gb.addColorStop(0, rgba('#F4EDDF', 0));
  gb.addColorStop(1, rgba('#F4EDDF', 0.85));
  ctx.fillStyle = gb;
  ctx.fillRect(st.x, bandY + bandH - feather, st.w, feather);
  /* faint calm streaks across the band */
  var i, sy;
  for (i = 0; i < 5; i++) {
    sy = bandY + bandH * (0.14 + i * 0.18);
    ctx.strokeStyle = rgba('#F4EDDF', 0.10);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(st.x, sy);
    ctx.lineTo(st.x + st.w, sy + (i % 2 === 0 ? 4 : -4));
    ctx.stroke();
  }
}
function drawStreamlines(st) {
  var t = phaseT;
  var i, s, x, y, px, py, f, step, k;
  var stepPx = Math.max(4, st.w / 160);
  var bandTop = st.y + st.h / 3, bandBot = st.y + 2 * st.h / 3;
  var topLimit = bandTop - st.h * 0.06, botLimit = bandBot + st.h * 0.12;
  for (i = 0; i < SEEDS.length; i++) {
    s = SEEDS[i];
    x = st.x + s.x * st.w;
    y = st.y + s.y * st.h;
    ctx.beginPath();
    ctx.moveTo(x, y);
    var maxSteps = s.margin ? Math.min(s.steps, 26) : s.steps;
    for (k = 0; k < maxSteps; k++) {
      f = field((x - st.x) / st.w, (y - st.y) / st.h, t, st);
      var len = Math.sqrt(f.x * f.x + f.y * f.y);
      if (len < 0.0001) break;
      px = x + (f.x / len) * stepPx;
      py = y + (f.y / len) * stepPx * (st.w / st.h);
      if (px < st.x - 4 || px > st.x + st.w + 4 || py < st.y - 4 || py > st.y + st.h + 4) break;
      if (!s.margin && (py < topLimit || py > botLimit)) break;
      ctx.lineTo(px, py);
      x = px; y = py;
    }
    ctx.strokeStyle = rgba(s.color, s.margin ? s.alpha * 0.22 : s.alpha);
    ctx.lineWidth = s.width;
    ctx.lineCap = 'round';
    ctx.stroke();
  }
}
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  ctx.save();
  ctx.beginPath();
  ctx.rect(st.x, st.y, st.w, st.h);
  ctx.clip();
  drawBand(st);
  drawStreamlines(st);
  ctx.restore();
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Rose Wind').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Rose Wind').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 28').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Rose Wind', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 28', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag to disturb the wind.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function pointerPos(e) {
  var r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function stageNorm(p, st) {
  return { x: clamp((p.x - st.x) / st.w, 0, 1), y: clamp((p.y - st.y) / st.h, 0, 1) };
}
function onDown(e) {
  dragging = true;
  var p = pointerPos(e);
  var st = stageRect();
  var n = stageNorm(p, st);
  dragX = n.x; dragY = n.y; dragS = 2.4;
  lastPX = p.x; lastPY = p.y;
  if (e.preventDefault) e.preventDefault();
}
function onMove(e) {
  if (!dragging) return;
  var p = pointerPos(e);
  var st = stageRect();
  var n = stageNorm(p, st);
  dragX = n.x; dragY = n.y;
  dragS = Math.min(dragS + 0.35, 2.6);
  lastPX = p.x; lastPY = p.y;
  if (e.preventDefault) e.preventDefault();
}
function onUp() { dragging = false; }
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    streamlineCount: function () { return STREAMLINES; },
    vortexCount: function () { return VORTICES; },
    dragStrength: function () { return dragS; },
    phaseT: function () { return phaseT; }
  };
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('pointerleave', onUp);
}
/* ---- frame one: fixed phase t = 3.0s of a 24s period, drag vortex at rest ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      if (!dragging && dragS > 0) dragS *= Math.exp(-dt / 1.5);
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
