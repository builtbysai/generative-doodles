<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№56 · Egg Trace</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b0b0e; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(245,242,233,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to bend the egg</div>
<script>
'use strict';
const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '56', 10) || 0;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
const ctx = canvas.getContext('2d');
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}
function smooth(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }

let dragFreq=null, dragTilt=null, relAt=-1e9, relFreq=0.2, relTilt=0;
let curFreq=0.2, curTilt=0;
const NU=40, NV=30;
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#0b0b0e'; ctx.fillRect(0,0,w,h);
  const t=(nowMs/1000)%8, ph=t/8;
  // ease drag params back after release
  if(dragFreq===null && nowMs-relAt>0){
    const k=smooth((nowMs-relAt)/3000);
    curFreq=relFreq+(0.2-relFreq)*k; curTilt=relTilt+(0-relTilt)*k;
  } else if(dragFreq!==null){ curFreq=dragFreq; curTilt=dragTilt||0; }
  let drawFrac, dissolve=0;
  if(ph<0.5) drawFrac=ph/0.5; else if(ph<0.75){ drawFrac=1; } else { drawFrac=1; dissolve=(ph-0.75)/0.25; }
  const rot=t*Math.PI*2/8*1 + curTilt*0; // one full turn per loop
  const rotA=(nowMs/1000)*(Math.PI*2/8);
  const tiltX=0.35+curTilt;
  const cx=w/2, cy=h/2, S=Math.min(w,h)*0.235;
  const cosR=Math.cos(rotA), sinR=Math.sin(rotA), cosT=Math.cos(tiltX), sinT=Math.sin(tiltX);
  const maxJ=Math.floor(drawFrac*(NV-1));
  function proj(u,v){
    const r=0.9+curFreq*v;
    let x=r*Math.sin(v)*Math.cos(u), y=1.65*Math.cos(v), z=r*Math.sin(v)*Math.sin(u);
    // dissolve offset along approx normal (radial from axis + y)
    if(dissolve>0){
      const ph2=Math.sin(u*3+v*5)*dissolve*0.18*Math.sin(dissolve*Math.PI);
      x+=x*ph2; z+=z*ph2; y+=Math.cos(u*2+v*3)*ph2*0.5;
    }
    const X=x*cosR - z*sinR, Z=x*sinR + z*cosR;
    const Y2=y*cosT - Z*sinT, Z2=y*sinT + Z*cosT;
    const persp=1/(1+Z2*0.12);
    return [cx+X*S*persp, cy+Y2*S*persp];
  }
  // ring lines
  ctx.lineWidth=1;
  for(let j=0;j<=maxJ;j++){
    const v=j/(NV-1)*Math.PI;
    const newest=(j===maxJ && ph<0.5);
    ctx.strokeStyle=newest?'#e8a33d':'#4a4a52';
    ctx.beginPath();
    for(let i=0;i<=NU;i++){
      const u=i/NU*Math.PI*2;
      const [px,py]=proj(u,v);
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  // points
  ctx.fillStyle='#f5f2e9';
  for(let j=0;j<=maxJ;j++){
    const v=j/(NV-1)*Math.PI;
    for(let i=0;i<NU;i++){
      const u=i/NU*Math.PI*2;
      const [px,py]=proj(u,v);
      ctx.fillRect(px-1,py-1,2,2);
    }
  }
  return {};
}

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(3000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);

let lastPX=null,lastPY=null;
canvas.addEventListener('pointerdown',ev=>{lastPX=ev.clientX;lastPY=ev.clientY;});
canvas.addEventListener('pointermove',ev=>{
  if(lastPX===null) return;
  const [w,h]=viewportWH();
  dragFreq=Math.max(0.05,Math.min(0.45, 0.2 + (ev.clientX/w-0.5)*0.5));
  dragTilt=Math.max(-0.5,Math.min(0.5,(ev.clientY/h-0.5)*0.8));
});
function endDrag56(){ if(lastPX!==null){ relAt=performance.now(); relFreq=curFreq; relTilt=curTilt; dragFreq=null; dragTilt=null; lastPX=null; } }
canvas.addEventListener('pointerup',endDrag56); canvas.addEventListener('pointercancel',endDrag56);

window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
