<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№47 · Pigment Water</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b0b0e; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(232,228,216,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to stir in pigment</div>
<script>
'use strict';
// No47 Pigment Water (after darien.brito, prompt 12 via Bug).
// A Gray-Scott reaction-diffusion field on a 96 by 96 grid, seeded
// and pre-run at load so the first frame is already formed. Three
// pigment territories (red, amber, teal) claim the field by seeded
// centers; where the concentration sits in a narrow band, the cell
// stays black, which draws the thin separating lines where pigments
// meet. Feed rate breathes on a 24 second cycle. Drag injects
// chemical under the finger.

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '47', 10) || 47;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ctx = canvas.getContext('2d');
const GROUND = '#0b0b0e';
const PIG = [[226, 87, 76], [232, 163, 61], [76, 201, 226]];
const GN = 96;
let U = new Float32Array(GN * GN).fill(1);
let V = new Float32Array(GN * GN);
const rng = mulberry32(seed * 7919);
const CENTERS = [[0.30, 0.34], [0.68, 0.60], [0.42, 0.78]];
for (let s = 0; s < 26; s++){
  const cx0 = 14 + rng() * (GN - 28), cy0 = 14 + rng() * (GN - 28), rad = 2 + rng() * 4;
  for (let y = 0; y < GN; y++) for (let x = 0; x < GN; x++){
    const d = Math.hypot(x - cx0, y - cy0);
    if (d < rad){ const i = y * GN + x; V[i] = 0.5 + rng() * 0.3; U[i] = 0.5; }
  }
}
function fieldRect(w, h){
  if (isPhone()) return [0, 0, w, h];
  const s = Math.min(w, h);
  return [(w - s) / 2, (h - s) / 2, s, s];
}
function stepGS(F){
  const nU = new Float32Array(GN * GN), nV = new Float32Array(GN * GN);
  const K = 0.062, Du = 0.16, Dv = 0.08;
  for (let y = 0; y < GN; y++) for (let x = 0; x < GN; x++){
    const i = y * GN + x;
    const xm = (x + GN - 1) % GN, xp = (x + 1) % GN, ym = (y + GN - 1) % GN, yp = (y + 1) % GN;
    const lapU = U[ym * GN + x] + U[yp * GN + x] + U[y * GN + xm] + U[y * GN + xp] - 4 * U[i];
    const lapV = V[ym * GN + x] + V[yp * GN + x] + V[y * GN + xm] + V[y * GN + xp] - 4 * V[i];
    const uvv = U[i] * V[i] * V[i];
    nU[i] = Math.max(0, Math.min(1, U[i] + Du * lapU - uvv + F * (1 - U[i])));
    nV[i] = Math.max(0, Math.min(1, V[i] + Dv * lapV + uvv - (F + K) * V[i]));
  }
  U = nU; V = nV;
}
for (let s = 0; s < 900; s++) stepGS(0.0545);
let pointer = null;
function pigmentAt(x, y){
  let best = 0, bw = -1;
  for (let c = 0; c < 3; c++){
    const dx = x / GN - CENTERS[c][0], dy = y / GN - CENTERS[c][1];
    const wgt = Math.exp(-(dx * dx + dy * dy) * 5.5) + 0.08 * Math.sin((x + c * 31) * 0.11) * Math.cos((y - c * 17) * 0.13);
    if (wgt > bw){ bw = wgt; best = c; }
  }
  return best;
}
const PIGIDX = new Uint8Array(GN * GN);
for (let y = 0; y < GN; y++) for (let x = 0; x < GN; x++) PIGIDX[y * GN + x] = pigmentAt(x, y);

function drawFrame(nowMs){
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)){
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  ctx.fillStyle = GROUND; ctx.fillRect(0, 0, w, h);
  const t = nowMs / 1000;
  const F = 0.0545 + 0.006 * Math.sin((t % 24) / 24 * Math.PI * 2);
  for (let s = 0; s < 5; s++) stepGS(F);
  if (pointer){
    const [rx, ry, rw, rh] = fieldRect(w, h);
    const gx = (pointer.x - rx) / rw * GN, gy = (pointer.y - ry) / rh * GN;
    for (let y = 0; y < GN; y++) for (let x = 0; x < GN; x++){
      if (Math.hypot(x - gx, y - gy) < 5){ const i = y * GN + x; V[i] = Math.min(1, V[i] + 0.35); U[i] = Math.max(0, U[i] - 0.2); }
    }
  }
  const [rx, ry, rw, rh] = fieldRect(w, h);
  const cw = rw / GN, ch = rh / GN;
  for (let y = 0; y < GN; y++) for (let x = 0; x < GN; x++){
    const v = V[y * GN + x];
    if (v < 0.10) continue;
    if (v > 0.19 && v < 0.235){ ctx.fillStyle = '#000000'; }
    else {
      const c = PIG[PIGIDX[y * GN + x]];
      const a = Math.min(1, 0.25 + v * 1.6);
      ctx.fillStyle = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(3) + ')';
    }
    ctx.fillRect(rx + x * cw - 0.5, ry + y * ch - 0.5, cw + 1, ch + 1);
  }
  return {};
}
function loop(nowMs){ drawFrame(nowMs); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); }
drawFrame(3000);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
canvas.addEventListener('pointerdown', ev => { pointer = { x: ev.clientX, y: ev.clientY }; });
canvas.addEventListener('pointermove', ev => { if (pointer) pointer = { x: ev.clientX, y: ev.clientY }; });
function endDrag(){ pointer = null; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
