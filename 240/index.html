<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.240 Training Models</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#EFEAE0; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.240 Training Models (James Woodfill). After the Code
// Practice wall models of 2019 and the Certain Objects and
// Certain Systems animations: a workshop shelf of boxy wood tone
// forms, birch, white and grey with exactly one green accent,
// alive in stop motion. Every half second each form snaps to a
// neighbouring grid cell or turns by fifteen degrees, with a two
// pixel handmade jitter on every step. No tweening, no easing,
// no smooth anything: quantized animation only. A drag may nudge
// a form off its cell; on release it snaps back into the walk.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#EFEAE0';
var BIRCH = '#D9B98A', WHITE = '#FAFAFA', GREY = '#9A9A9A', ACCENT = '#4FA34F';
// Panel space 1200 x 800 units (3:2), grid of 100 unit cells.
var CELL = 100, GC = 12, GR = 8;
var W = 0, H = 0, phone = false;
var T = 0, lastNow = -1;
var STEP = 0.5;
var stepIdx = -1;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(2402019);
function hashJ(n) {
  var s = Math.sin(n * 39.7 + 17.3) * 24634.6345;
  return (s - Math.floor(s)) * 2 - 1;
}

// Seven forms: boxes and frames, one of them the green accent.
var forms = [
  { w: 2, h: 1, col: BIRCH,  frame: false, gx: 1, gy: 1, rot: 0 },
  { w: 1, h: 1, col: WHITE,  frame: false, gx: 4, gy: 1, rot: 15 },
  { w: 1, h: 2, col: GREY,   frame: false, gx: 6, gy: 0, rot: 0 },
  { w: 1, h: 1, col: ACCENT, frame: false, gx: 8, gy: 2, rot: 30 },
  { w: 3, h: 1, col: BIRCH,  frame: true,  gx: 2, gy: 4, rot: 0 },
  { w: 2, h: 1, col: WHITE,  frame: true,  gx: 7, gy: 5, rot: 15 },
  { w: 1, h: 1, col: GREY,   frame: false, gx: 10, gy: 4, rot: 15 }
];
function overlaps(f, gx, gy) {
  for (var i = 0; i < forms.length; i++) {
    var q = forms[i];
    if (q === f) continue;
    if (gx < q.gx + q.w && gx + f.w > q.gx && gy < q.gy + q.h && gy + f.h > q.gy) return true;
  }
  return false;
}
var DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function advanceStep() {
  stepIdx++;
  forms.forEach(function (f) {
    if (dragF === f) return;
    var roll = rng();
    if (roll < 0.52) {
      var d = DIRS[Math.floor(rng() * 4)];
      var nx = f.gx + d[0], ny = f.gy + d[1];
      if (nx >= 0 && ny >= 0 && nx + f.w <= GC && ny + f.h <= GR && !overlaps(f, nx, ny)) {
        f.gx = nx; f.gy = ny;
      }
    } else if (roll < 0.78) {
      // turns stay shelf-like: frames tip at most 15 degrees,
      // boxes at most 30, always in 15 degree steps
      var lim = f.frame ? 15 : 30;
      var nr = f.rot + (rng() < 0.5 ? 15 : -15);
      if (nr > lim) nr = lim; if (nr < -lim) nr = -lim;
      f.rot = nr;
    }
  });
}
// Pre-roll so frame one is mid walk, forms scattered.
for (var pr = 0; pr < 14; pr++) advanceStep();

function panelRect() {
  var pw = W * (phone ? 1 : 0.96);
  var ph = pw * 2 / 3;
  if (ph > H * 0.94) { ph = H * 0.94; pw = ph * 1.5; }
  return { x: (W - pw) / 2, y: (H - ph) / 2, w: pw, s: pw / 1200 };
}

function drawForm(f, cx, cy, s) {
  var wpx = f.w * CELL * s, hpx = f.h * CELL * s;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(f.rot * Math.PI / 180);
  if (f.frame) {
    ctx.strokeStyle = f.col;
    ctx.lineWidth = 13 * s;
    ctx.strokeRect(-wpx / 2 + 6 * s, -hpx / 2 + 6 * s, wpx - 12 * s, hpx - 12 * s);
    ctx.lineWidth = 3 * s;
    ctx.strokeRect(-wpx / 2 + 20 * s, -hpx / 2 + 20 * s, wpx - 40 * s, hpx - 40 * s);
  } else {
    ctx.fillStyle = f.col;
    ctx.fillRect(-wpx / 2, -hpx / 2, wpx, hpx);
    ctx.strokeStyle = GREY;
    ctx.lineWidth = 1.6 * s;
    ctx.strokeRect(-wpx / 2, -hpx / 2, wpx, hpx);
    if (f.col === BIRCH) { // a clamp across the top, Code Practice hardware
      ctx.fillStyle = GREY;
      ctx.fillRect(-24 * s, -hpx / 2 - 5 * s, 48 * s, 10 * s);
    }
  }
  ctx.restore();
}

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var p = panelRect(), s = p.s;
  forms.forEach(function (f, i) {
    var cx, cy;
    if (dragF === f) {
      cx = p.x + dragX * s; cy = p.y + dragY * s;
    } else {
      var jx = hashJ(stepIdx * 31 + i * 7) * 3;
      var jy = hashJ(stepIdx * 47 + i * 13) * 3;
      cx = p.x + (f.gx + f.w / 2) * CELL * s + jx * s;
      cy = p.y + (f.gy + f.h / 2) * CELL * s + jy * s;
    }
    drawForm(f, cx, cy, s);
  });
}

// ---- interaction: drag nudges a form; release snaps it home ----------------------------
var dragF = null, dragX = 0, dragY = 0, grabDX = 0, grabDY = 0;
function toUnits(e) {
  var p = panelRect();
  return { x: (e.clientX - p.x) / p.s, y: (e.clientY - p.y) / p.s };
}
canvas.addEventListener('pointerdown', function (e) {
  var pt = toUnits(e), p = panelRect();
  for (var i = forms.length - 1; i >= 0; i--) {
    var f = forms[i];
    var cx = (f.gx + f.w / 2) * CELL, cy = (f.gy + f.h / 2) * CELL;
    if (Math.abs(pt.x - cx) <= f.w * CELL / 2 + 14 && Math.abs(pt.y - cy) <= f.h * CELL / 2 + 14) {
      dragF = f; grabDX = pt.x - cx; grabDY = pt.y - cy;
      dragX = cx; dragY = cy;
      return;
    }
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragF) return;
  var pt = toUnits(e);
  dragX = pt.x - grabDX; dragY = pt.y - grabDY;
});
function endDrag() {
  if (!dragF) return;
  var f = dragF;
  var nx = Math.round(dragX / CELL - f.w / 2), ny = Math.round(dragY / CELL - f.h / 2);
  nx = Math.max(0, Math.min(GC - f.w, nx));
  ny = Math.max(0, Math.min(GR - f.h, ny));
  if (!overlaps(f, nx, ny)) { f.gx = nx; f.gy = ny; }
  dragF = null;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  var want = Math.floor(T / STEP) + 14;
  while (stepIdx < want) advanceStep();
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
