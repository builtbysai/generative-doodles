<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9070 · Orchard</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#131711; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(233,238,220,0.40); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.7); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another orchard</div>
<script>
'use strict';
// No9070 Orchard.
// A canopy from above: circles packed by dart throwing, big trees first,
// then smaller ones fitted into the gaps, until the ground is mostly
// covered. Each tree is a flat disc from a greens palette, chosen by
// size: the largest trees are deep green, mid trees lighter, the small
// infill almost yellow. Some discs carry one smaller rust disc inside
// them, fruit seen from above. Packing is measured, not hoped for: the
// build counts placed trees and their total coverage and rejects seeds
// that come out sparse (fewer than 150 trees or under half the square
// covered), because an orchard with holes reads as a diagram of circles.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9070', 10) || 9070;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#20241a';
const GREENS = ['#274434', '#2f5b3c', '#3d7350', '#5b8f5e', '#8fae62', '#c2bd7a'];
const FRUIT = '#b3502e';

function compose(s) {
  const rnd = mulberry32(s);
  const trees = [];
  let attempts = 0;
  // Radius ladder: start with big trees, step down as gaps shrink.
  for (let rung = 0; rung < 7; rung++) {
    const rMax = 0.085 - rung * 0.011;
    const rMin = rMax * 0.72;
    const tries = 900 + rung * 500;
    for (let t = 0; t < tries; t++) {
      attempts++;
      const r = rMin + rnd() * (rMax - rMin);
      const x = r + rnd() * (1 - 2 * r);
      const y = r + rnd() * (1 - 2 * r);
      let ok = true;
      for (const o of trees) {
        const d = Math.hypot(x - o.x, y - o.y);
        if (d < r + o.r + 0.004) { ok = false; break; }
      }
      if (ok) trees.push({ x, y, r, fruit: rnd() < 0.20, fa: rnd() * Math.PI * 2 });
    }
  }
  let area = 0;
  for (const o of trees) area += Math.PI * o.r * o.r;
  return { trees, coverage: area, attempts };
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 10; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best || p.coverage > best.coverage) best = p;
    if (p.trees.length >= 150 && p.coverage >= 0.50) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#131711';
  ctx.fillRect(0, 0, w, h);
  const S = Math.min(w, h);
  const ox = (w - S) / 2, oy = (h - S) / 2;

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  ctx.fillStyle = GROUND;
  ctx.fillRect(ox, oy, S, S);
  ctx.save();
  ctx.beginPath(); ctx.rect(ox, oy, S, S); ctx.clip();

  // Big trees first (they were placed first), small infill last.
  for (const t of p.trees) {
    const ci = Math.max(0, Math.min(GREENS.length - 1,
      Math.round((0.080 - t.r) / 0.012) + ((t.x * 7 + t.y * 13) % 1 < 0.3 ? 1 : 0)));
    ctx.fillStyle = GREENS[ci];
    ctx.beginPath();
    ctx.arc(ox + t.x * S, oy + t.y * S, t.r * S, 0, Math.PI * 2);
    ctx.fill();
  }
  for (const t of p.trees) {
    if (!t.fruit) continue;
    const fx = t.x + Math.cos(t.fa) * t.r * 0.38;
    const fy = t.y + Math.sin(t.fa) * t.r * 0.38;
    ctx.fillStyle = FRUIT;
    ctx.beginPath();
    ctx.arc(ox + fx * S, oy + fy * S, Math.max(1.5, t.r * S * 0.26), 0, Math.PI * 2);
    ctx.fill();
  }

  const rnd = mulberry32((seed ^ 0x6a09e6) >>> 0);
  for (let g = 0; g < 1600; g++) {
    const x = ox + rnd() * S, y = oy + rnd() * S;
    ctx.fillStyle = rnd() < 0.5 ? 'rgba(10,12,8,0.06)' : 'rgba(233,238,220,0.04)';
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.restore();
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
