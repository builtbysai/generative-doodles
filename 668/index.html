<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Trompetas de Caracol</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F4EFE2; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict): paper, ink, and the blush inside the mouths only.
  var PAPER = '#F4EFE2';
  var INK = '#151412';
  var BLUSH = '#D9A08A';

  var BASE_SEED = 668001;
  var TURN_S = 600;         // one full drift rotation per 10 minutes
  var FORCE_T = -1;         // QA hook: -1 = live clock, else fixed elapsed seconds

  // QA seed hook: ?seed=tNN pins the elapsed time (used by the headless renderer).
  try {
    if (typeof location !== 'undefined' && location.search) {
      var qm = /[?&]seed=t([0-9]+(?:\.[0-9]+)?)/.exec(location.search);
      if (qm) FORCE_T = parseFloat(qm[1]);
    }
  } catch (e) { /* live mode */ }

  // Seeded RNG (mulberry32).
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // ------------------------------------------------------------------
  // Arrangement. Shells are data in normalized frame space (nx, ny in
  // 0..1, radius as a fraction of S = min(W, H)). Generation 0 is the
  // launch arrangement; a double-tap advances the generation and the
  // whole arrangement is rebuilt from the new seed. The largest shell
  // always sits lower-left.
  // ------------------------------------------------------------------
  var generation = 0;
  var shells = [];

  function buildArrangement(gen) {
    var rng = mulberry32(BASE_SEED + gen * 7919);
    var count = 4 + (rng() < 0.5 ? 0 : 1); // 4 or 5 shells, never more than 5
    var list = [];
    // The largest shell: fixed lower-left home, seeded size and rotation.
    list.push({
      nx: 0.29 + rng() * 0.05,
      ny: 0.68 + rng() * 0.05,
      r: 0.205 + rng() * 0.02,
      rot0: rng() * Math.PI * 2,
      dir: rng() < 0.5 ? -1 : 1,
      turns: 2.6 + rng() * 0.35,
      phase: rng() * Math.PI * 2
    });
    var tries = 0;
    while (list.length < count && tries < 400) {
      tries++;
      var cand = {
        nx: 0.14 + rng() * 0.72,
        ny: 0.13 + rng() * 0.74,
        r: 0.095 + rng() * 0.06,
        rot0: rng() * Math.PI * 2,
        dir: rng() < 0.5 ? -1 : 1,
        turns: 2.6 + rng() * 0.4,
        phase: rng() * Math.PI * 2
      };
      var ok = true;
      for (var i = 0; i < list.length; i++) {
        var dx = (cand.nx - list[i].nx), dy = (cand.ny - list[i].ny);
        // distance measured roughly in units of S on a square stage
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < (cand.r + list[i].r) * 1.45 + 0.05) { ok = false; break; }
      }
      if (ok) list.push(cand);
    }
    // Pitch by size: the largest shell sounds 110 Hz, the smallest 220 Hz,
    // log-interpolated across the arrangement's size range.
    var rMax = 0, rMin = Infinity;
    for (var j = 0; j < list.length; j++) {
      if (list[j].r > rMax) rMax = list[j].r;
      if (list[j].r < rMin) rMin = list[j].r;
    }
    for (var k = 0; k < list.length; k++) {
      var u = (rMax - list[k].r) / Math.max(0.0001, rMax - rMin);
      list[k].freq = 110 * Math.pow(2, u);
      list[k].pts = spiralPoints(list[k]);
      list[k].mouth = mouthLocal(list[k]);
    }
    return list;
  }

  // Logarithmic spiral in local units (outer radius = 1). Each point
  // carries its stroke width as a fraction of the outer radius: the
  // tube thickens steadily toward the mouth. A faint seeded radial
  // wobble keeps the line hand-drawn rather than machine-true.
  function spiralPoints(sh) {
    var N = 150;
    var pts = [];
    var total = sh.turns * Math.PI * 2;
    for (var i = 0; i <= N; i++) {
      var s = i / N;
      var r = Math.exp(Math.log(0.055) * (1 - s)); // 0.055 at the core, 1 at the rim
      r *= 1 + 0.012 * Math.sin(s * 42 + sh.phase) + 0.006 * Math.sin(s * 97 + sh.phase * 2.7);
      var a = s * total;
      pts.push({
        x: Math.cos(a) * r,
        y: Math.sin(a) * r,
        w: 0.030 + 0.205 * Math.pow(s, 1.7)
      });
    }
    return pts;
  }

  // The mouth (trumpet bell) in local units: centered just past the
  // spiral's outer end along its tangent, major axis across the tangent.
  function mouthLocal(sh) {
    var pts = sh.pts || spiralPoints(sh);
    var end = pts[pts.length - 1];
    var prev = pts[pts.length - 5];
    var tx = end.x - prev.x, ty = end.y - prev.y;
    var tl = Math.sqrt(tx * tx + ty * ty) || 1;
    tx /= tl; ty /= tl;
    return {
      x: end.x + tx * 0.10,
      y: end.y + ty * 0.10,
      ang: Math.atan2(ty, tx) + Math.PI / 2, // rotation of the major axis
      rx: 0.37,
      ry: 0.175
    };
  }

  // ------------------------------------------------------------------
  // Audio. Created LAZILY inside the first tap that lands on a shell,
  // and only there: nothing is constructed at load, nothing ever plays
  // on its own. If the platform has no WebAudio, the tap still draws
  // its ripple and the piece simply stays silent.
  // ------------------------------------------------------------------
  var actx = null;
  var noiseBuf = null;

  function ensureAudio() {
    if (actx) {
      if (actx.state === 'suspended' && actx.resume) { try { actx.resume(); } catch (e) {} }
      return true;
    }
    var AC = null;
    if (typeof AudioContext !== 'undefined') AC = AudioContext;
    else if (typeof window !== 'undefined' && window && window.webkitAudioContext) AC = window.webkitAudioContext;
    if (!AC) return false;
    try { actx = new AC(); } catch (e) { actx = null; return false; }
    try {
      var len = Math.floor(actx.sampleRate * 1.5);
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      var data = noiseBuf.getChannelData(0);
      var nrng = mulberry32(668777);
      for (var i = 0; i < len; i++) data[i] = nrng() * 2 - 1;
    } catch (e) { noiseBuf = null; }
    return true;
  }

  function sound(freq) {
    if (!ensureAudio() || !actx) return;
    try {
      var t = actx.currentTime;
      var master = actx.createGain();
      master.gain.value = 0.5;
      master.connect(actx.destination);
      // Fundamental: a soft sine with a slow attack and a 1.2 s decay.
      var osc = actx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      var og = actx.createGain();
      og.gain.setValueAtTime(0.0001, t);
      og.gain.exponentialRampToValueAtTime(0.55, t + 0.045);
      og.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
      osc.connect(og); og.connect(master);
      osc.start(t); osc.stop(t + 1.25);
      // A breath of the fundamental an octave up, much quieter.
      var osc2 = actx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.value = freq * 2.01;
      var og2 = actx.createGain();
      og2.gain.setValueAtTime(0.0001, t);
      og2.gain.exponentialRampToValueAtTime(0.10, t + 0.03);
      og2.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
      osc2.connect(og2); og2.connect(master);
      osc2.start(t); osc2.stop(t + 0.75);
      // Breath: band-passed noise centered on the fundamental.
      if (noiseBuf) {
        var src = actx.createBufferSource();
        src.buffer = noiseBuf;
        src.loop = true;
        var bp = actx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = freq;
        bp.Q.value = 1.1;
        var ng = actx.createGain();
        ng.gain.setValueAtTime(0.0001, t);
        ng.gain.exponentialRampToValueAtTime(0.30, t + 0.06);
        ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
        src.connect(bp); bp.connect(ng); ng.connect(master);
        src.start(t); src.stop(t + 1.0);
      }
    } catch (e) { /* audio is decoration; the ripple already fired */ }
  }

  // ------------------------------------------------------------------
  // Interaction. A single tap on a shell sounds it (after a short
  // window that lets a second tap turn the gesture into a double-tap
  // reseed instead). A tap on empty paper draws only a faint ripple.
  // ------------------------------------------------------------------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, S = 0, isPhone = false;
  var lastElapsed = 0;
  var ripples = [];        // {x, y, t0, strong}
  var pendingTap = null;   // {x, y, timer}

  function shellWorld(sh, elapsed) {
    var rot = sh.rot0 + sh.dir * (elapsed / TURN_S) * Math.PI * 2;
    return {
      cx: sh.nx * W,
      cy: sh.ny * H,
      R: sh.r * S * (isPhone ? 1.1 : 1),
      rot: rot,
      cos: Math.cos(rot),
      sin: Math.sin(rot)
    };
  }

  function toWorld(sh, w, lx, ly) {
    return {
      x: w.cx + (lx * w.cos - ly * w.sin) * w.R,
      y: w.cy + (lx * w.sin + ly * w.cos) * w.R
    };
  }

  function fireTap(x, y) {
    var now = lastElapsed;
    var best = null, bestScore = Infinity;
    for (var i = 0; i < shells.length; i++) {
      var w = shellWorld(shells[i], now);
      var dx = x - w.cx, dy = y - w.cy;
      var d = Math.sqrt(dx * dx + dy * dy);
      var score = d / (w.R * 1.18);
      if (score < 1 && score < bestScore) { bestScore = score; best = { sh: shells[i], w: w }; }
    }
    if (best) {
      var m = toWorld(best.sh, best.w, best.sh.mouth.x, best.sh.mouth.y);
      ripples.push({ x: m.x, y: m.y, t0: now, strong: true });
      sound(best.sh.freq);
    } else {
      ripples.push({ x: x, y: y, t0: now, strong: false });
    }
    if (ripples.length > 24) ripples.splice(0, ripples.length - 24);
  }

  function onDown(e) {
    var x = 0, y = 0;
    if (e) {
      if (typeof e.clientX === 'number') { x = e.clientX; y = e.clientY; }
      else if (e.touches && e.touches[0]) { x = e.touches[0].clientX; y = e.touches[0].clientY; }
      if (canvas.getBoundingClientRect) {
        var rect = canvas.getBoundingClientRect();
        x -= rect.left; y -= rect.top;
      }
    }
    if (pendingTap) {
      // Second tap inside the window: this is a double-tap. Cancel the
      // pending sound and reseed the arrangement.
      if (pendingTap.timer) { try { clearTimeout(pendingTap.timer); } catch (err) {} }
      pendingTap = null;
      generation++;
      shells = buildArrangement(generation);
      ripples = [];
      draw(lastElapsed);
      return;
    }
    var rec = { x: x, y: y, timer: null };
    pendingTap = rec;
    if (typeof setTimeout === 'function') {
      rec.timer = setTimeout(function () {
        if (pendingTap === rec) { pendingTap = null; fireTap(rec.x, rec.y); draw(lastElapsed); }
      }, 280);
    } else {
      pendingTap = null;
      fireTap(x, y);
    }
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('touchstart', function (e) {
      if (!window.PointerEvent) onDown(e);
    }, { passive: true });
  }

  // ------------------------------------------------------------------
  // Drawing.
  // ------------------------------------------------------------------
  function drawShell(sh, elapsed) {
    var w = shellWorld(sh, elapsed);
    var pts = sh.pts;
    ctx.strokeStyle = INK;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    var prev = toWorld(sh, w, pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) {
      var p = toWorld(sh, w, pts[i].x, pts[i].y);
      ctx.globalAlpha = 0.94;
      ctx.lineWidth = Math.max(0.7, pts[i].w * w.R);
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      prev = p;
    }
    // The mouth: blush inside, ink rim, one inner ink ellipse for depth.
    var m = sh.mouth;
    var mc = toWorld(sh, w, m.x, m.y);
    var mang = m.ang + w.rot;
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.ellipse(mc.x, mc.y, m.rx * w.R, m.ry * w.R, mang, 0, Math.PI * 2);
    ctx.fillStyle = BLUSH;
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(mc.x, mc.y, m.rx * 0.60 * w.R, m.ry * 0.60 * w.R, mang, 0, Math.PI * 2);
    ctx.fillStyle = INK;
    ctx.globalAlpha = 0.20;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.ellipse(mc.x, mc.y, m.rx * w.R, m.ry * w.R, mang, 0, Math.PI * 2);
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1.4, 0.028 * w.R);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(mc.x, mc.y, m.rx * 0.60 * w.R, m.ry * 0.60 * w.R, mang, 0, Math.PI * 2);
    ctx.globalAlpha = 0.65;
    ctx.lineWidth = Math.max(0.8, 0.014 * w.R);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawRipples(elapsed) {
    for (var i = ripples.length - 1; i >= 0; i--) {
      var rp = ripples[i];
      var age = elapsed - rp.t0;
      var life = rp.strong ? 1.7 : 1.1;
      if (age < 0) continue;
      if (age > life) { ripples.splice(i, 1); continue; }
      var u = age / life;
      var maxR = (rp.strong ? 0.30 : 0.10) * S;
      ctx.strokeStyle = INK;
      ctx.lineWidth = rp.strong ? 2 : 1.2;
      ctx.globalAlpha = (1 - u) * (rp.strong ? 0.55 : 0.20);
      ctx.beginPath();
      ctx.ellipse(rp.x, rp.y, 4 + u * maxR, (4 + u * maxR) * 0.82, 0, 0, Math.PI * 2);
      ctx.stroke();
      if (rp.strong && age > 0.16) {
        var u2 = (age - 0.16) / life;
        if (u2 < 1) {
          ctx.globalAlpha = (1 - u2) * 0.35;
          ctx.beginPath();
          ctx.ellipse(rp.x, rp.y, 3 + u2 * maxR * 0.8, (3 + u2 * maxR * 0.8) * 0.82, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  function draw(elapsed) {
    lastElapsed = elapsed;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < shells.length; i++) drawShell(shells[i], elapsed);
    drawRipples(elapsed);
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    S = Math.min(W, H);
    if (window.screen) {
      isPhone = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      isPhone = H > W * 1.15;
    }
    draw(lastElapsed);
  }

  shells = buildArrangement(generation);
  resize();
  draw(FORCE_T >= 0 ? FORCE_T : 0);

  if (typeof window.requestAnimationFrame === 'function') {
    var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var raf = function () {
      var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : t0;
      draw(FORCE_T >= 0 ? FORCE_T : (now - t0) / 1000);
      window.requestAnimationFrame(raf);
    };
    window.requestAnimationFrame(raf);
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (window.addEventListener) window.addEventListener('resize', resize);
})();
</script>
</body>
</html>
