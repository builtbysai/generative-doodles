<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.190 Mock Back</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#060606; }
  canvas { display:block; touch-action:none; }
  #hint { position:fixed; left:0; right:0; bottom:10px; text-align:center;
    font:12px system-ui, sans-serif; color:#9A9AA2; opacity:0.5;
    pointer-events:none; letter-spacing:0.04em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">drag to tilt, tap to perform</div>
<script>
(function () {
'use strict';
// No.190 Mock Back (Eugene Sargent). The Mimic Octopus crossed with
// a mockingbird, rebuilt from scrap: rusted plates, mesh, rebar ribs,
// one big funnel ear and a beak that is really a speaker grille. It
// sleeps with an ember breathing in its chest, stirs, turns its ear,
// and plays back its little repertoire transformed: a bird-like
// chatter, a clang, a low hum, drawn as light tracing its ribs.
// Built to the Sargent house rule and the gallery's rule: ears but
// no microphone. Nothing here listens; the creature performs its
// attract loop and answers a tap instead. Drag tilts its head like
// it is listening to your finger. No eyes, no smile: never cute.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#060606', RUST = '#8A4B2A', STEEL = '#6E737B', EMBER = '#FF6B35', CYAN = '#35F0FF', GOLD = '#F2B233';
var W = 0, H = 0, phone = false;
var seed = 190190;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
var state = seed >>> 0;
function rand() { state = (state * 1664525 + 1013904223) >>> 0; return state / 4294967296; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

// Geometry: horizontal offsets in U units (min viewport dimension),
// vertical positions as fractions of H. One system, no mixing.
var U = 100, CX = 0, GY = 0, ribs = [], speckles = [];
function P(fx, fy) { return [CX + fx * U, H * fy]; }
function buildBody() {
  U = Math.min(W, H);
  CX = W / 2;
  GY = H * 0.90;
  ribs = [];
  for (var r = 0; r < 5; r++) {
    var y0 = 0.475 + r * 0.060;
    var pts = [];
    for (var s = 0; s <= 40; s++) {
      var t = s / 40, v = 1 - t;
      var x = v * v * v * (CX - U * 0.165) + 3 * v * v * t * (CX - U * 0.02) + 3 * v * t * t * (CX + U * 0.215) + t * t * t * (CX + U * 0.125);
      var y = H * (v * v * v * y0 + 3 * v * v * t * (y0 - 0.010) + 3 * v * t * t * (y0 + 0.026) + t * t * t * (y0 + 0.045));
      pts.push([x, y]);
    }
    ribs.push(pts);
  }
  speckles = [];
  state = seed >>> 0;
  for (var i = 0; i < 220; i++) {
    speckles.push({ x: CX + (rand() - 0.5) * U * 0.40, y: H * (0.44 + rand() * 0.36), r: 0.6 + rand() * 1.7, rust: rand() < 0.5 });
  }
}
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700;
  if (!phone && !(sw > 0)) phone = H > W * 1.15;
  buildBody();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- interaction ---------------------------------------------------------
var shift = 0, headTilt = 0, headVel = 0, headTarget = 0;
var dragging = false, downX = 0, downY = 0, downAt = 0, lastNow = -1;
canvas.addEventListener('pointerdown', function (e) { dragging = true; downX = e.clientX; downY = e.clientY; downAt = e.timeStamp; });
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  headTarget = clamp((e.clientX - downX) * 0.0022, -0.32, 0.32);
});
canvas.addEventListener('pointerup', function (e) {
  var moved = Math.sqrt((e.clientX - downX) * (e.clientX - downX) + (e.clientY - downY) * (e.clientY - downY));
  dragging = false;
  headTarget = 0;
  if (moved < 8 && e.timeStamp - downAt < 350 && lastNow >= 0) {
    // tap: perform now. Rebase the loop so this moment becomes the stir.
    var u = (((lastNow / 1000 + 26 + shift) % 40) + 40) % 40;
    shift += (14 - u);
  }
});
canvas.addEventListener('pointercancel', function () { dragging = false; headTarget = 0; });

// ---- drawing helpers ------------------------------------------------------
function poly(pts, fill) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill) ctx.fill(); else ctx.stroke();
}

// ---- the performance -------------------------------------------------------
function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (lastNow >= 0 && now > 0) {
    var dt = Math.min(0.05, (now - lastNow) / 1000);
    var hk = Math.pow(2 * Math.PI / 1.6, 2), hc = 2 * 0.35 * Math.sqrt(hk);
    headVel += (-hk * (headTilt - headTarget) - hc * headVel) * dt;
    headTilt += headVel * dt;
  }
  lastNow = now;
  var t = now / 1000 + 26 + shift;
  var u = ((t % 40) + 40) % 40;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);

  // phase levels
  var awake = u < 14 ? 0 : u < 17 ? (u - 14) / 3 : u < 29 ? 1 : u < 33 ? 1 - (u - 29) / 4 : 0;
  var breath = 0.5 + 0.5 * Math.sin(t * Math.PI * 2 / 6);
  var emberA = (0.30 + 0.30 * breath) * (1 - awake * 0.4) + awake * 0.35;
  var earTurn = awake * -0.55;

  // legs: rusted rebar struts and plate feet
  ctx.strokeStyle = RUST;
  ctx.lineWidth = U * 0.016;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(CX - U * 0.10, H * 0.76);
  ctx.lineTo(CX - U * 0.155, GY);
  ctx.moveTo(CX + U * 0.11, H * 0.76);
  ctx.lineTo(CX + U * 0.165, GY);
  ctx.stroke();
  ctx.fillStyle = STEEL;
  ctx.fillRect(CX - U * 0.205, GY - U * 0.004, U * 0.11, U * 0.012);
  ctx.fillRect(CX + U * 0.115, GY - U * 0.004, U * 0.12, U * 0.012);

  // torso: three stacked scrap plates with dark seams
  ctx.fillStyle = STEEL;
  poly([P(-0.145, 0.435), P(0.125, 0.425), P(0.155, 0.56), P(-0.165, 0.565)], true);
  ctx.fillStyle = RUST;
  poly([P(-0.165, 0.565), P(0.155, 0.56), P(0.175, 0.685), P(-0.18, 0.69)], true);
  ctx.fillStyle = STEEL;
  poly([P(-0.18, 0.69), P(0.175, 0.685), P(0.16, 0.795), P(-0.165, 0.80)], true);
  ctx.strokeStyle = GROUND;
  ctx.lineWidth = Math.max(1.5, U * 0.003);
  poly([P(-0.145, 0.435), P(0.125, 0.425), P(0.155, 0.56), P(-0.165, 0.565)], false);
  poly([P(-0.165, 0.565), P(0.155, 0.56), P(0.175, 0.685), P(-0.18, 0.69)], false);
  poly([P(-0.18, 0.69), P(0.175, 0.685), P(0.16, 0.795), P(-0.165, 0.80)], false);
  // a smaller rust patch plate, upper right
  ctx.fillStyle = RUST;
  poly([P(0.045, 0.44), P(0.125, 0.435), P(0.14, 0.52), P(0.055, 0.525)], true);
  // mesh patch, lower left: frame plus crosshatch
  ctx.strokeStyle = STEEL;
  ctx.lineWidth = Math.max(1.5, U * 0.0035);
  poly([P(-0.155, 0.705), P(-0.065, 0.705), P(-0.06, 0.785), P(-0.15, 0.785)], false);
  ctx.save();
  poly([P(-0.155, 0.705), P(-0.065, 0.705), P(-0.06, 0.785), P(-0.15, 0.785)], false);
  ctx.clip();
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = 1;
  for (var mi = -5; mi < 6; mi++) {
    ctx.beginPath();
    ctx.moveTo(CX - U * 0.16 + mi * U * 0.018, H * 0.70);
    ctx.lineTo(CX - U * 0.16 + mi * U * 0.018 + U * 0.035, H * 0.79);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(CX - U * 0.16 + mi * U * 0.018, H * 0.79);
    ctx.lineTo(CX - U * 0.16 + mi * U * 0.018 + U * 0.035, H * 0.70);
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // weather speckles and rivets
  for (var si = 0; si < speckles.length; si++) {
    var sp = speckles[si];
    ctx.fillStyle = sp.rust ? RUST : GROUND;
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = GROUND;
  [[-0.125, 0.45], [0.105, 0.445], [-0.145, 0.775], [0.135, 0.77]].forEach(function (rv) {
    ctx.beginPath();
    ctx.arc(CX + rv[0] * U, H * rv[1], U * 0.006, 0, Math.PI * 2);
    ctx.fill();
  });

  // chest ember, breathing, behind the ribs
  var ex = CX - U * 0.01, ey = H * 0.615;
  var eg = ctx.createRadialGradient(ex, ey, 0, ex, ey, U * 0.075);
  eg.addColorStop(0, 'rgba(255,107,53,' + (0.85 * emberA).toFixed(3) + ')');
  eg.addColorStop(0.45, 'rgba(255,107,53,' + (0.35 * emberA).toFixed(3) + ')');
  eg.addColorStop(1, 'rgba(255,107,53,0)');
  ctx.fillStyle = eg;
  ctx.beginPath();
  ctx.arc(ex, ey, U * 0.075, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = STEEL;
  ctx.lineWidth = U * 0.005;
  ctx.beginPath();
  ctx.arc(ex, ey, U * 0.033, 0, Math.PI * 2);
  ctx.stroke();

  // rebar ribs across the torso
  ctx.strokeStyle = RUST;
  ctx.lineWidth = U * 0.009;
  for (var r = 0; r < ribs.length; r++) {
    ctx.beginPath();
    ctx.moveTo(ribs[r][0][0], ribs[r][0][1]);
    for (var s2 = 1; s2 < ribs[r].length; s2++) ctx.lineTo(ribs[r][s2][0], ribs[r][s2][1]);
    ctx.stroke();
  }

  // neck strut
  ctx.fillStyle = STEEL;
  poly([P(-0.035, 0.44), P(0.055, 0.435), P(0.05, 0.385), P(-0.03, 0.39)], true);

  // ---- light traces: the repertoire, as light on the ribs ----
  ctx.globalCompositeOperation = 'lighter';
  function dot(x, y, rad, col, a) {
    ctx.fillStyle = col;
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (u >= 17 && u < 21) {
    var step = Math.floor((u - 17) / 0.16);
    for (var cr2 = 0; cr2 < ribs.length; cr2++) {
      var idx = (step * 7 + cr2 * 11) % 41;
      var idx2 = (step * 13 + cr2 * 5) % 41;
      dot(ribs[cr2][idx][0], ribs[cr2][idx][1], U * 0.007, GOLD, 0.9);
      dot(ribs[cr2][idx2][0], ribs[cr2][idx2][1], U * 0.0045, GOLD, 0.55);
    }
  } else if (u >= 21 && u < 25) {
    var ck = u - 21;
    if (ck < 1.5) {
      ctx.strokeStyle = GOLD;
      ctx.globalAlpha = 0.65 * (1 - ck / 1.5);
      ctx.lineWidth = U * 0.006;
      ctx.beginPath();
      ctx.arc(CX + U * 0.145, H * 0.335, U * 0.03 + ck * U * 0.22, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    var prog = clamp(ck / 2.2, 0, 1);
    for (var sr = 0; sr < ribs.length; sr++) {
      var upto = Math.floor(prog * 41);
      for (var sj = 0; sj <= upto; sj += 2) {
        var fade = 1 - Math.abs(sj / 41 - prog);
        dot(ribs[sr][sj][0], ribs[sr][sj][1], U * 0.0045, GOLD, 0.5 * fade);
      }
    }
  } else if (u >= 25 && u < 29) {
    for (var hr2 = 0; hr2 < ribs.length; hr2++) {
      for (var hj = 0; hj <= 40; hj += 2) {
        var ha = 0.5 + 0.5 * Math.sin(hj * 0.30 - (u - 25) * 3.6 + hr2 * 0.8);
        dot(ribs[hr2][hj][0], ribs[hr2][hj][1], U * 0.004, GOLD, 0.14 + 0.5 * ha);
      }
    }
  }
  ctx.globalCompositeOperation = 'source-over';

  // ---- head group ----
  var neckX = CX + U * 0.01, neckY = H * 0.375;
  ctx.save();
  ctx.translate(neckX, neckY);
  ctx.rotate(headTilt + 0.012 * Math.sin(t * 0.9));
  // head plate
  ctx.fillStyle = STEEL;
  poly([[-0.105, -0.075], [0.125, -0.095], [0.16, 0.005], [0.03, 0.06], [-0.10, 0.03]].map(function (p) { return [p[0] * U, p[1] * U]; }), true);
  ctx.fillStyle = RUST;
  poly([[-0.105, -0.075], [0.02, -0.088], [0.005, -0.02], [-0.10, -0.01]].map(function (p) { return [p[0] * U, p[1] * U]; }), true);
  ctx.strokeStyle = GROUND;
  ctx.lineWidth = Math.max(1.5, U * 0.003);
  poly([[-0.105, -0.075], [0.125, -0.095], [0.16, 0.005], [0.03, 0.06], [-0.10, 0.03]].map(function (p) { return [p[0] * U, p[1] * U]; }), false);
  // beak grille: slatted trapezoid at the front
  ctx.fillStyle = GROUND;
  poly([[0.105, -0.062], [0.155, -0.05], [0.16, 0.008], [0.108, 0.024]].map(function (p) { return [p[0] * U, p[1] * U]; }), true);
  ctx.strokeStyle = STEEL;
  ctx.lineWidth = U * 0.004;
  for (var gs = 0; gs < 4; gs++) {
    var gy2 = -0.048 + gs * 0.018;
    ctx.beginPath();
    ctx.moveTo(U * 0.108, U * gy2);
    ctx.lineTo(U * 0.157, U * (gy2 + 0.011));
    ctx.stroke();
  }
  // funnel ear on its hinge
  ctx.save();
  ctx.translate(-U * 0.05, -U * 0.07);
  ctx.rotate(earTurn + headTilt * 0.4);
  ctx.fillStyle = STEEL;
  poly([[0, 0], [-0.05, -0.05], [-0.105, -0.08], [-0.095, -0.012], [-0.04, 0.012]].map(function (p) { return [p[0] * U, p[1] * U]; }), true);
  ctx.fillStyle = RUST;
  poly([[0, 0], [-0.05, -0.05], [-0.028, -0.008]].map(function (p) { return [p[0] * U, p[1] * U]; }), true);
  ctx.save();
  ctx.translate(-U * 0.118, -U * 0.055);
  ctx.rotate(-0.55);
  ctx.strokeStyle = STEEL;
  ctx.lineWidth = U * 0.007;
  ctx.beginPath();
  ctx.ellipse(0, 0, U * 0.050, U * 0.033, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = GROUND;
  ctx.beginPath();
  ctx.ellipse(0, 0, U * 0.048, U * 0.031, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = STEEL;
  ctx.lineWidth = U * 0.0035;
  ctx.beginPath();
  ctx.ellipse(0, 0, U * 0.032, U * 0.020, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(0, 0, U * 0.017, U * 0.010, 0, 0, Math.PI * 2);
  ctx.stroke();
  if (awake > 0) {
    ctx.strokeStyle = CYAN;
    ctx.globalAlpha = 0.65 * awake;
    ctx.lineWidth = U * 0.005;
    ctx.beginPath();
    ctx.ellipse(0, 0, U * 0.050, U * 0.033, 0, Math.PI * 0.9, Math.PI * 1.7);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.restore();
  ctx.restore();
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
