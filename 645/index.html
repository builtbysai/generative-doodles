<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№645 One Eye Stays Sharp</title>
<style>
  html, body { margin: 0; padding: 0; background: #5d6b62; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №1986 One Eye Stays Sharp, MC3 / PP1233, study #259
  // mateo-villanueva-brandt. An extreme close-up of a face
  // seen through rippled water. Features smear and double,
  // the mouth stretches into wave geometry, while one blue
  // eye remains perfectly sharp and anchors the frame. The
  // ripples move slowly, the warp breathing, the eye never
  // wavers. Drag tilts the water surface, changing the warp
  // direction and intensity. Release, and the ripples settle
  // back. The distortion stays gentle and aqueous, never
  // horror-like. Study ref: M3 mediated portraiture.
  var GROUND = '#5d6b62'; // page ground, water green-grey

  // Fixed-phase first frame: FIRST_T = 4.5 s. The warp
  // breathes on a 36 s cycle, amplitude rising from 72
  // percent of base to full and back on a smooth sine. At
  // t = 4.5 the warp is mid-breath, near full strength, so
  // the first frame shows the smear and the doubling clearly
  // while the eye sits crisp at the golden point.
  var FIRST_T = 4.5;
  var CYCLE = 36;
  var SEED = 1986;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Deterministic 1D value noise, pure function of x.
  function hash1(i) {
    var s = Math.sin(i * 127.1 + SEED * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function vnoise(x) {
    var i = Math.floor(x), f = x - i;
    var u = f * f * (3 - 2 * f);
    return hash1(i) * (1 - u) + hash1(i + 1) * u;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palettes: water green-grey, desaturated skin, one vivid blue iris.
  var WATER_TOP = [125, 139, 128];
  var WATER_MID = [103, 118, 108];
  var WATER_LOW = [78, 92, 84];
  var SKIN_HI = [185, 170, 149];
  var SKIN_MID = [168, 154, 133];
  var SKIN_LO = [138, 125, 107];
  var SKIN_COOL = [96, 110, 98];
  var HAIR = [56, 50, 43];
  var HAIR_LITE = [120, 105, 85];
  var LIP = [150, 104, 95];
  var LIP_DARK = [110, 74, 68];
  var LIP_HI = [200, 170, 150];
  var BROW = [69, 59, 49];
  var IRIS_HI = [74, 155, 232];
  var IRIS_MID = [30, 111, 208];
  var IRIS_LO = [14, 58, 114];
  var CREAM = [242, 234, 216];

  // Offscreen canvases. In a browser document.createElement
  // supplies them. The node-canvas QA harness shims document
  // with getElementById only, so fall back to the node-canvas
  // module there. This branch never runs in a browser.
  function makeCanvas(w, h) {
    try {
      if (typeof document !== 'undefined' && typeof document.createElement === 'function') {
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        return c;
      }
    } catch (e) {}
    try {
      if (typeof require === 'function') {
        var cv = require('/home/hatch/workspace/tools/ncanvas/node_modules/canvas');
        return cv.createCanvas(w, h);
      }
    } catch (e) {}
    return null;
  }

  var faceCv = null, faceCtx = null;   // the drawn face, unwarped
  var patchCv = null, patchCtx = null; // feathered sharp region around the eye
  var patchX = 0, patchY = 0, patchW = 0, patchH = 0;

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.faceCX = W * 0.50;
    L.faceCY = H * 0.56;
    L.faceRX = W * 0.47;
    L.faceRY = H * 0.60;
    L.eyeX = W * 0.618; // golden point
    L.eyeY = H * 0.382;
    L.eyeW = W * 0.088;
    L.eyeH = H * 0.034;
    L.otherEyeX = W * 0.325;
    L.otherEyeY = H * 0.40;
    L.mouthY = H * 0.755;
    L.rippleCX = function (t) { return W * (0.32 + 0.06 * Math.sin(t * 0.05)); };
    L.rippleCY = function (t) { return H * (0.30 + 0.04 * Math.cos(t * 0.04)); };
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
    layout();
    buildFace();
  }

  // ---- Water ground ----------------------------------------------
  function waterGradient(f) {
    var g = f.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(WATER_TOP));
    g.addColorStop(0.5, rgb(WATER_MID));
    g.addColorStop(1, rgb(WATER_LOW));
    return g;
  }

  // ---- The drawn face --------------------------------------------
  // Static: no term of t enters this function. The face is
  // drawn once per resize onto faceCv, then warped at blit
  // time. The right eye is drawn here muted, so the sharp
  // patch region has a socket to restore; the vivid eye is
  // overdrawn sharply on the main canvas every frame.
  function drawFace(f) {
    f.fillStyle = waterGradient(f);
    f.fillRect(0, 0, W, H);

    // Faint horizontal ripple bands in the water.
    var rng = mulberry32(SEED * 7 + 3);
    for (var i = 0; i < 26; i++) {
      var by = rng() * H;
      f.strokeStyle = rgba([214, 228, 218], a4(0.03 + rng() * 0.05));
      f.lineWidth = 1 + rng() * 2;
      f.beginPath();
      f.moveTo(0, by);
      f.bezierCurveTo(W * 0.3, by + (rng() - 0.5) * 10, W * 0.7, by + (rng() - 0.5) * 10, W, by);
      f.stroke();
    }

    // Skin: a big oval filling the frame.
    var sg = f.createRadialGradient(W * 0.46, H * 0.42, W * 0.05, L.faceCX, L.faceCY, W * 0.55);
    sg.addColorStop(0, rgb(SKIN_HI));
    sg.addColorStop(0.6, rgb(SKIN_MID));
    sg.addColorStop(1, rgb(SKIN_LO));
    f.fillStyle = sg;
    f.beginPath();
    f.moveTo(L.faceCX + L.faceRX, L.faceCY);
    f.ellipse(L.faceCX, L.faceCY, L.faceRX, L.faceRY, 0, 0, Math.PI * 2);
    f.fill();

    // Cool green-grey wash over the right side of the face.
    var cw = f.createLinearGradient(W * 0.45, 0, W, 0);
    cw.addColorStop(0, rgba(SKIN_COOL, 0));
    cw.addColorStop(1, rgba(SKIN_COOL, a4(0.28)));
    f.fillStyle = cw;
    f.beginPath();
    f.moveTo(L.faceCX + L.faceRX, L.faceCY);
    f.ellipse(L.faceCX, L.faceCY, L.faceRX, L.faceRY, 0, 0, Math.PI * 2);
    f.fill();

    // Hair: a dark mass framing the top and sides, covering
    // everything above the hairline.
    f.fillStyle = rgb(HAIR);
    f.beginPath();
    f.moveTo(0, 0);
    f.lineTo(W, 0);
    f.lineTo(W * 0.98, H * 0.58);
    f.quadraticCurveTo(W * 0.94, H * 0.30, W * 0.86, H * 0.16);
    f.quadraticCurveTo(W * 0.50, H * 0.06, W * 0.14, H * 0.16);
    f.quadraticCurveTo(W * 0.06, H * 0.30, W * 0.02, H * 0.58);
    f.lineTo(0, H * 0.58);
    f.closePath();
    f.fill();
    // Side locks falling past the jaw.
    f.beginPath();
    f.moveTo(W * 0.03, H * 0.40);
    f.quadraticCurveTo(W * 0.10, H * 0.60, W * 0.07, H * 0.82);
    f.quadraticCurveTo(W * 0.02, H * 0.62, W * 0.03, H * 0.40);
    f.closePath();
    f.fill();
    f.beginPath();
    f.moveTo(W * 0.97, H * 0.40);
    f.quadraticCurveTo(W * 0.90, H * 0.60, W * 0.93, H * 0.82);
    f.quadraticCurveTo(W * 0.98, H * 0.62, W * 0.97, H * 0.40);
    f.closePath();
    f.fill();
    // A few lighter strands.
    f.strokeStyle = rgba(HAIR_LITE, a4(0.30));
    f.lineWidth = Math.max(1, W * 0.002);
    for (var s = 0; s < 14; s++) {
      var sx = W * (0.10 + hash1(s * 3.1) * 0.80);
      f.beginPath();
      f.moveTo(sx, H * (0.06 + hash1(s * 7.7) * 0.06));
      f.quadraticCurveTo(sx + W * 0.02, H * 0.16, sx - W * 0.01, H * (0.20 + hash1(s * 5.3) * 0.10));
      f.stroke();
    }

    // Forehead light, soft radial wash, not a hard oval.
    var fl = f.createRadialGradient(W * 0.50, H * 0.24, 0, W * 0.50, H * 0.24, W * 0.22);
    fl.addColorStop(0, rgba([215, 203, 182], a4(0.14)));
    fl.addColorStop(1, rgba([215, 203, 182], 0));
    f.fillStyle = fl;
    f.fillRect(W * 0.28, H * 0.10, W * 0.44, H * 0.28);

    // Brows.
    f.strokeStyle = rgb(BROW);
    f.lineWidth = Math.max(2, H * 0.011);
    f.lineCap = 'round';
    f.beginPath();
    f.moveTo(W * 0.245, H * 0.375);
    f.quadraticCurveTo(W * 0.325, H * 0.350, W * 0.405, H * 0.358);
    f.stroke();
    f.beginPath();
    f.moveTo(W * 0.520, H * 0.335);
    f.quadraticCurveTo(W * 0.615, H * 0.308, W * 0.700, H * 0.318);
    f.stroke();
    f.lineCap = 'butt';

    // The other eye, muted grey-blue: it smears with the warp.
    drawMutedEye(f, L.otherEyeX, L.otherEyeY, W * 0.075, H * 0.028, [113, 128, 138]);

    // The golden-point eye, drawn muted here so the sharp
    // patch has a socket to restore. The vivid eye is
    // overdrawn on the main canvas every frame.
    drawMutedEye(f, L.eyeX, L.eyeY, L.eyeW, L.eyeH, [95, 125, 148]);

    // Nose: bridge shadow, tip light, nostril shadow.
    f.strokeStyle = rgba([90, 78, 66], a4(0.35));
    f.lineWidth = Math.max(1, W * 0.008);
    f.beginPath();
    f.moveTo(W * 0.485, H * 0.43);
    f.quadraticCurveTo(W * 0.478, H * 0.52, W * 0.475, H * 0.585);
    f.stroke();
    f.beginPath();
    f.moveTo(W * 0.520, H * 0.43);
    f.quadraticCurveTo(W * 0.528, H * 0.52, W * 0.530, H * 0.585);
    f.stroke();
    f.fillStyle = rgba([215, 203, 182], a4(0.20));
    f.beginPath();
    f.moveTo(W * 0.50 + W * 0.018, H * 0.60);
    f.ellipse(W * 0.50, H * 0.60, W * 0.018, H * 0.012, 0, 0, Math.PI * 2);
    f.fill();
    f.fillStyle = rgba([60, 50, 42], a4(0.5));
    f.beginPath();
    f.moveTo(W * 0.50 + W * 0.020, H * 0.625);
    f.ellipse(W * 0.50, H * 0.625, W * 0.020, H * 0.008, 0, 0, Math.PI * 2);
    f.fill();

    // Cheek shadows under the cheekbones, soft radial washes.
    var ck;
    ck = f.createRadialGradient(W * 0.33, H * 0.52, 0, W * 0.33, H * 0.52, W * 0.10);
    ck.addColorStop(0, rgba([90, 80, 66], a4(0.12)));
    ck.addColorStop(1, rgba([90, 80, 66], 0));
    f.fillStyle = ck;
    f.fillRect(W * 0.23, H * 0.42, W * 0.20, H * 0.20);
    ck = f.createRadialGradient(W * 0.68, H * 0.52, 0, W * 0.68, H * 0.52, W * 0.10);
    ck.addColorStop(0, rgba([90, 80, 66], a4(0.12)));
    ck.addColorStop(1, rgba([90, 80, 66], 0));
    f.fillStyle = ck;
    f.fillRect(W * 0.58, H * 0.42, W * 0.20, H * 0.20);

    // Mouth stretched into wave geometry: a wide wavy band.
    var mx0 = W * 0.30, mx1 = W * 0.72;
    var waveA = H * 0.024, waveN = 1.5;
    function mouthY(x) {
      var u = (x - mx0) / (mx1 - mx0);
      return L.mouthY + Math.sin(u * Math.PI * 2 * waveN) * waveA;
    }
    f.fillStyle = rgb(LIP);
    f.beginPath();
    var mx;
    for (mx = mx0; mx <= mx1; mx += (mx1 - mx0) / 48) {
      if (mx === mx0) { f.moveTo(mx, mouthY(mx) - H * 0.016); }
      else { f.lineTo(mx, mouthY(mx) - H * 0.016); }
    }
    for (mx = mx1; mx >= mx0; mx -= (mx1 - mx0) / 48) {
      f.lineTo(mx, mouthY(mx) + H * 0.016);
    }
    f.closePath();
    f.fill();
    // Dark centre line of the mouth, following the wave.
    f.strokeStyle = rgb(LIP_DARK);
    f.lineWidth = Math.max(1, H * 0.004);
    f.beginPath();
    for (mx = mx0; mx <= mx1; mx += (mx1 - mx0) / 48) {
      if (mx === mx0) { f.moveTo(mx, mouthY(mx)); }
      else { f.lineTo(mx, mouthY(mx)); }
    }
    f.stroke();
    // Upper lip highlight.
    f.strokeStyle = rgba(LIP_HI, a4(0.35));
    f.lineWidth = Math.max(1, H * 0.003);
    f.beginPath();
    for (mx = mx0; mx <= mx1; mx += (mx1 - mx0) / 48) {
      if (mx === mx0) { f.moveTo(mx, mouthY(mx) - H * 0.014); }
      else { f.lineTo(mx, mouthY(mx) - H * 0.014); }
    }
    f.stroke();
    // Corner shadows.
    f.fillStyle = rgba([60, 50, 42], a4(0.4));
    f.beginPath();
    f.moveTo(mx0 + W * 0.008, mouthY(mx0));
    f.ellipse(mx0, mouthY(mx0), W * 0.008, H * 0.006, 0, 0, Math.PI * 2);
    f.fill();
    f.beginPath();
    f.moveTo(mx1 + W * 0.008, mouthY(mx1));
    f.ellipse(mx1, mouthY(mx1), W * 0.008, H * 0.006, 0, 0, Math.PI * 2);
    f.fill();

    // Chin shadow, soft radial wash.
    var cn = f.createRadialGradient(W * 0.50, H * 0.86, 0, W * 0.50, H * 0.86, W * 0.08);
    cn.addColorStop(0, rgba([90, 80, 66], a4(0.12)));
    cn.addColorStop(1, rgba([90, 80, 66], 0));
    f.fillStyle = cn;
    f.fillRect(W * 0.42, H * 0.78, W * 0.16, H * 0.16);
    var bg = f.createLinearGradient(0, H * 0.90, 0, H);
    bg.addColorStop(0, rgba([70, 66, 58], 0));
    bg.addColorStop(1, rgba([70, 66, 58], a4(0.25)));
    f.fillStyle = bg;
    f.fillRect(0, H * 0.90, W, H * 0.10);
  }

  // A muted eye for the offscreen face: almond, soft iris,
  // lash line. It is meant to smear under the warp.
  function drawMutedEye(f, ex, ey, ew, eh, irisCol) {
    f.beginPath();
    f.moveTo(ex - ew, ey);
    f.quadraticCurveTo(ex - ew * 0.3, ey - eh * 1.15, ex + ew * 0.9, ey - eh * 0.25);
    f.quadraticCurveTo(ex + ew * 0.35, ey + eh * 0.9, ex - ew, ey);
    f.closePath();
    f.save();
    f.clip();
    f.fillStyle = '#cfc9bd';
    f.fillRect(ex - ew, ey - eh * 1.2, ew * 2, eh * 2.4);
    var ir = eh * 1.2;
    f.fillStyle = rgb(irisCol);
    f.beginPath();
    f.moveTo(ex + ir, ey);
    f.arc(ex, ey, ir, 0, Math.PI * 2);
    f.fill();
    f.fillStyle = '#20262a';
    f.beginPath();
    f.moveTo(ex + ir * 0.45, ey);
    f.arc(ex, ey, ir * 0.45, 0, Math.PI * 2);
    f.fill();
    f.restore();
    f.strokeStyle = rgb(BROW);
    f.lineWidth = Math.max(1.5, H * 0.004);
    f.beginPath();
    f.moveTo(ex - ew, ey);
    f.quadraticCurveTo(ex - ew * 0.3, ey - eh * 1.15, ex + ew * 0.9, ey - eh * 0.25);
    f.stroke();
  }

  // Build the static face and the feathered sharp patch.
  // Called on resize; the face has no term of t.
  function buildFace() {
    if (W <= 0 || H <= 0) { return; }
    faceCv = makeCanvas(Math.round(W), Math.round(H));
    if (!faceCv) { return; }
    try { faceCtx = faceCv.getContext('2d'); } catch (e) { faceCtx = null; }
    if (!faceCtx) { return; }
    drawFace(faceCtx);

    // Sharp patch: the eye region redrawn unwarped from the
    // face canvas, feathered with a radial alpha mask so its
    // edge melts into the warped face instead of cutting a
    // hard rectangle.
    patchW = Math.round(W * 0.30);
    patchH = Math.round(H * 0.22);
    patchX = Math.round(L.eyeX - patchW / 2);
    patchY = Math.round(L.eyeY - patchH / 2);
    patchCv = makeCanvas(patchW, patchH);
    if (!patchCv) { return; }
    try { patchCtx = patchCv.getContext('2d'); } catch (e) { patchCtx = null; }
    if (!patchCtx) { return; }
    patchCtx.drawImage(faceCv, patchX, patchY, patchW, patchH, 0, 0, patchW, patchH);
    patchCtx.globalCompositeOperation = 'destination-in';
    patchCtx.save();
    patchCtx.translate(patchW / 2, patchH / 2);
    patchCtx.scale(1, patchH / patchW);
    var mg = patchCtx.createRadialGradient(0, 0, patchW * 0.28, 0, 0, patchW * 0.5);
    mg.addColorStop(0, 'rgba(0,0,0,1)');
    mg.addColorStop(0.7, 'rgba(0,0,0,1)');
    mg.addColorStop(1, 'rgba(0,0,0,0)');
    patchCtx.fillStyle = mg;
    patchCtx.fillRect(-patchW / 2, -patchW / 2, patchW, patchW);
    patchCtx.restore();
    patchCtx.globalCompositeOperation = 'source-over';
  }

  // ---- Warp ------------------------------------------------------
  // Breathing amplitude on the 36 s cycle: 72 percent of base
  // at the trough, full at the crest. The base is gentle, so
  // the smear stays aqueous, never violent.
  function warpAmp(t) {
    var p = ((t % CYCLE) + CYCLE) % CYCLE;
    var breathe = 0.72 + 0.28 * Math.sin(2 * Math.PI * p / CYCLE);
    return W * 0.016 * breathe;
  }
  // Signed displacement magnitude for one strip, layered
  // slow sine waves plus a slow radial ripple term.
  function warpMag(y, t) {
    var amp = warpAmp(t);
    var w = Math.sin(y * 0.028 + t * 0.45) * 0.7 +
            Math.sin(y * 0.009 - t * 0.18 + 1.7) * 0.5 +
            Math.sin(y * 0.05 - t * 0.9 + 0.4) * 0.3;
    return amp * w;
  }

  // Drag state: target tilt from the pointer, current tilt
  // eased toward it every frame. Tilt is a unit-ish vector:
  // its direction is the drag direction, its length is the
  // drag intensity, 0 to 1. Release returns the target to
  // zero and the ripples settle back.
  var tiltT = { x: 0, y: 0 };
  var tilt = { x: 0, y: 0 };
  var dragging = false;
  var dragSX = 0, dragSY = 0;

  function warpPass(t, phase, alpha) {
    ctx.globalAlpha = alpha;
    var sh = Math.max(3, Math.round(H / 220));
    var len = Math.min(1, Math.sqrt(tilt.x * tilt.x + tilt.y * tilt.y));
    var dirX = 1, dirY = 0, ampScale = 1;
    if (len > 0.02) {
      var ang = Math.atan2(tilt.y, tilt.x);
      dirX = (1 - len) + len * Math.cos(ang);
      dirY = len * 0.55 * Math.sin(ang);
      ampScale = 1 + 0.9 * len;
    }
    for (var y = 0; y < H; y += sh) {
      var hh = Math.min(sh + 1, H - y);
      var m = warpMag(y + hh / 2 + phase, t) * ampScale;
      var dx = m * dirX;
      var dy = m * dirY;
      ctx.drawImage(faceCv, 0, y, W, hh, dx, y + dy, W, hh);
    }
    ctx.globalAlpha = 1;
  }

  // ---- Ripple highlights -----------------------------------------
  function drawRipples(t) {
    var rcx = L.rippleCX(t), rcy = L.rippleCY(t);
    var k, r, a;
    for (k = 0; k < 4; k++) {
      r = ((t * 14 + k * 46) % 200) * (W / 900);
      a = (1 - r / (200 * (W / 900))) * 0.09;
      if (a <= 0.01) { continue; }
      ctx.strokeStyle = rgba([220, 235, 225], a4(a));
      ctx.lineWidth = Math.max(1, W * 0.002);
      ctx.beginPath();
      ctx.moveTo(rcx + Math.cos(0.5) * r, rcy + Math.sin(0.5) * r);
      ctx.arc(rcx, rcy, r, 0.5, Math.PI * 2 - 0.5);
      ctx.stroke();
    }
    // Two slow diagonal caustic streaks, very faint.
    ctx.strokeStyle = rgba([225, 238, 228], a4(0.05));
    ctx.lineWidth = Math.max(2, W * 0.006);
    ctx.beginPath();
    ctx.moveTo(W * 0.08, H * (0.18 + 0.03 * Math.sin(t * 0.11)));
    ctx.lineTo(W * 0.42, H * (0.30 + 0.03 * Math.sin(t * 0.11)));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(W * 0.60, H * (0.68 + 0.03 * Math.cos(t * 0.09)));
    ctx.lineTo(W * 0.94, H * (0.80 + 0.03 * Math.cos(t * 0.09)));
    ctx.stroke();
  }

  // ---- The sharp eye ---------------------------------------------
  // Drawn last, over the warp, with no term of t: it never
  // wavers, never smears, never blinks.
  function drawEye() {
    var ex = L.eyeX, ey = L.eyeY;
    var ew = L.eyeW, eh = L.eyeH;
    // Lid crease above.
    ctx.strokeStyle = rgba([52, 44, 38], a4(0.55));
    ctx.lineWidth = Math.max(1, H * 0.003);
    ctx.beginPath();
    ctx.moveTo(ex - ew * 0.95, ey - eh * 1.5);
    ctx.quadraticCurveTo(ex, ey - eh * 2.1, ex + ew * 0.95, ey - eh * 1.35);
    ctx.stroke();

    // Almond, clipped: sclera, vivid blue iris, pupil, highlight.
    ctx.beginPath();
    ctx.moveTo(ex - ew, ey);
    ctx.quadraticCurveTo(ex - ew * 0.3, ey - eh * 1.15, ex + ew * 0.9, ey - eh * 0.25);
    ctx.quadraticCurveTo(ex + ew * 0.35, ey + eh * 0.9, ex - ew, ey);
    ctx.closePath();
    ctx.save();
    ctx.clip();
    ctx.fillStyle = '#dcd8cb';
    ctx.fillRect(ex - ew, ey - eh * 1.2, ew * 2, eh * 2.4);
    var ir = eh * 1.25;
    var ig = ctx.createRadialGradient(ex, ey, ir * 0.1, ex, ey, ir);
    ig.addColorStop(0, rgb(IRIS_HI));
    ig.addColorStop(0.55, rgb(IRIS_MID));
    ig.addColorStop(1, rgb(IRIS_LO));
    ctx.fillStyle = ig;
    ctx.beginPath();
    ctx.moveTo(ex + ir, ey);
    ctx.arc(ex, ey, ir, 0, Math.PI * 2);
    ctx.fill();
    // Iris striations, seeded and static.
    var rng = mulberry32(SEED * 31 + 7);
    ctx.strokeStyle = rgba([10, 40, 90], a4(0.25));
    ctx.lineWidth = Math.max(0.6, W * 0.0006);
    for (var i = 0; i < 24; i++) {
      var a = rng() * Math.PI * 2;
      var r0 = ir * (0.42 + rng() * 0.08);
      var r1 = ir * (0.88 + rng() * 0.08);
      ctx.beginPath();
      ctx.moveTo(ex + Math.cos(a) * r0, ey + Math.sin(a) * r0);
      ctx.lineTo(ex + Math.cos(a) * r1, ey + Math.sin(a) * r1);
      ctx.stroke();
    }
    // Pupil.
    ctx.fillStyle = '#070b0f';
    ctx.beginPath();
    ctx.moveTo(ex + ir * 0.42, ey);
    ctx.arc(ex, ey, ir * 0.42, 0, Math.PI * 2);
    ctx.fill();
    // Catchlight.
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath();
    ctx.moveTo(ex - ir * 0.35 + ir * 0.16, ey - ir * 0.35);
    ctx.arc(ex - ir * 0.35, ey - ir * 0.35, ir * 0.16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.moveTo(ex + ir * 0.30 + ir * 0.08, ey + ir * 0.30);
    ctx.arc(ex + ir * 0.30, ey + ir * 0.30, ir * 0.08, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Upper lash line, thick and dark, with a slight wing.
    ctx.strokeStyle = '#221c18';
    ctx.lineWidth = Math.max(1.5, H * 0.005);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(ex - ew, ey);
    ctx.quadraticCurveTo(ex - ew * 0.3, ey - eh * 1.15, ex + ew * 0.95, ey - eh * 0.25);
    ctx.stroke();
    // Lower lid line, soft.
    ctx.strokeStyle = rgba([70, 60, 50], a4(0.6));
    ctx.lineWidth = Math.max(1, H * 0.0025);
    ctx.beginPath();
    ctx.moveTo(ex - ew * 0.8, ey + eh * 0.75);
    ctx.quadraticCurveTo(ex + ew * 0.1, ey + eh * 1.05, ex + ew * 0.85, ey + eh * 0.35);
    ctx.stroke();
    // Outer corner lashes.
    ctx.strokeStyle = '#221c18';
    ctx.lineWidth = Math.max(1, H * 0.002);
    for (var l = 0; l < 5; l++) {
      var lx = ex + ew * (0.55 + l * 0.09);
      var ly = ey - eh * (0.55 - l * 0.06);
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx + ew * 0.10, ly - eh * 0.55);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
  }

  // ---- Frame -----------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    // Ease the tilt toward its target, so a release settles.
    tilt.x += (tiltT.x - tilt.x) * 0.09;
    tilt.y += (tiltT.y - tilt.y) * 0.09;
    if (Math.abs(tiltT.x - tilt.x) < 0.001) { tilt.x = tiltT.x; }
    if (Math.abs(tiltT.y - tilt.y) < 0.001) { tilt.y = tiltT.y; }

    // Water ground first, so any strip gap blends in.
    ctx.fillStyle = waterGradient(ctx);
    ctx.fillRect(0, 0, W, H);

    if (faceCv) {
      // Warped face, then a faint phase-shifted second pass
      // for the doubling.
      warpPass(t, 0, 1);
      warpPass(t, 37, 0.28);
    }

    drawRipples(t);

    // Soft vignette, before the sharp region.
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, rgba([30, 38, 32], 0));
    vg.addColorStop(1, rgba([30, 38, 32], a4(0.28)));
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    // The masked sharp region, then the vivid eye itself.
    if (patchCv) {
      ctx.drawImage(patchCv, patchX, patchY, patchW, patchH);
    }
    drawEye();

    // Caption, top left, and the hint, bottom center. Cream
    // stays readable over the water green-grey.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CREAM, a4(0.88));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№645 · One Eye Stays Sharp', W * 0.04, H * 0.055);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(CREAM, a4(0.92));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Drag to tilt the water.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  // ---- Interaction -----------------------------------------------
  // Drag tilts the water surface: the drag direction sets the
  // warp direction, the drag distance sets its intensity.
  // Release returns the target to zero and the ripples
  // settle back. No click action exists; a tap does nothing.
  function pointerPos(e) {
    var r = { left: 0, top: 0 };
    try {
      if (typeof canvas.getBoundingClientRect === 'function') {
        r = canvas.getBoundingClientRect();
      }
    } catch (err) {}
    var x = (typeof e.clientX === 'number') ? e.clientX - r.left : 0;
    var y = (typeof e.clientY === 'number') ? e.clientY - r.top : 0;
    return { x: x, y: y };
  }
  function onDown(e) {
    var p = pointerPos(e);
    dragging = true;
    dragSX = p.x; dragSY = p.y;
    try {
      if (typeof canvas.setPointerCapture === 'function' && e.pointerId !== undefined) {
        canvas.setPointerCapture(e.pointerId);
      }
    } catch (err) {}
    if (typeof e.preventDefault === 'function') { e.preventDefault(); }
  }
  function onMove(e) {
    if (!dragging) { return; }
    var p = pointerPos(e);
    var dx = p.x - dragSX, dy = p.y - dragSY;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var inten = clamp(dist / (W * 0.28), 0, 1);
    if (dist > 4) {
      tiltT.x = (dx / dist) * inten;
      tiltT.y = (dy / dist) * inten;
    } else {
      tiltT.x = 0; tiltT.y = 0;
    }
    draw(lastT);
  }
  function onUp() {
    dragging = false;
    tiltT.x = 0; tiltT.y = 0;
    draw(lastT);
  }
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece1986 exposes the cycle state and the tilt.
  // setTilt(angleRadians, intensity0to1, snap) drives a
  // scripted drag probe: with snap true the tilt applies at
  // once instead of easing in over frames.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece1986 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      state: function (t) { return { warpAmp: warpAmp(t), tilt: { x: tilt.x, y: tilt.y } }; },
      warpAmp: warpAmp,
      setTilt: function (ang, inten, snap) {
        tiltT.x = Math.cos(ang) * clamp(inten, 0, 1);
        tiltT.y = Math.sin(ang) * clamp(inten, 0, 1);
        if (snap) { tilt.x = tiltT.x; tilt.y = tiltT.y; }
      },
      getTilt: function () { return { x: tilt.x, y: tilt.y, tx: tiltT.x, ty: tiltT.y }; },
      redraw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: slow ripples, breathing warp, settling tilt.
  // The eye has no term of t and never moves. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
