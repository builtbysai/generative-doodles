<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bad Speaker</title>
<style>
html, body { margin: 0; padding: 0; background: #0A0908; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#0A0908';
var PLATE = '#161211';
var PLATE_LINE = 'rgba(217,179,108,0.55)';
var TITLE_INK = '#F2E8D8';
var HINT_INK = '#E8C887';
var PERIOD = 20;
var FRAME_T = 10.0;
var WARM = ['#C98F3D', '#D9A85A', '#E8C887', '#A86F2E', '#8F5E28'];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1743);
var phaseT = FRAME_T;
/* ---- the mic: fixed start off-center, eases toward the drag target ---- */
var mic = { x: 0.38, y: 0.40, tx: 0.38, ty: 0.40 };
var dragging = false;
/* ---- the cone field: a virtual plane of warm lo-fi texture.
   The circle is a small window into it; moving the mic slides a
   different patch of the field under the grille, so the texture's
   character changes with position. All seeded, no wall clock. ---- */
var BLOBS = [], GRAIN = [];
(function () {
  var i;
  for (i = 0; i < 90; i++) {
    BLOBS.push({
      u: rng(), v: rng(),
      r: 0.05 + rng() * 0.16,
      color: WARM[Math.floor(rng() * WARM.length)],
      alpha: 0.10 + rng() * 0.22
    });
  }
  for (i = 0; i < 420; i++) {
    GRAIN.push({
      u: rng(), v: rng(),
      r: 0.004 + rng() * 0.010,
      warm: rng() < 0.6,
      alpha: 0.05 + rng() * 0.14
    });
  }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function circleR() {
  /* about a tenth of the frame's short side; the smallness is the point */
  return Math.min(VW, VH) * 0.05;
}
function setTarget(clientX, clientY) {
  var rect = { left: 0, top: 0 };
  try { rect = canvas.getBoundingClientRect(); } catch (e) { rect = { left: 0, top: 0 }; }
  mic.tx = clamp((clientX - rect.left) / VW, 0.06, 0.94);
  mic.ty = clamp((clientY - rect.top) / VH, 0.06, 0.94);
}
function pointerPos(e) {
  var x = e.clientX, y = e.clientY;
  if (typeof x !== 'number' && e.touches && e.touches.length) {
    x = e.touches[0].clientX; y = e.touches[0].clientY;
  }
  return [x, y];
}
function onDown(e) {
  dragging = true;
  var p = pointerPos(e);
  setTarget(p[0], p[1]);
  if (e.preventDefault) { try { e.preventDefault(); } catch (err) {} }
}
function onMove(e) {
  if (!dragging) return;
  var p = pointerPos(e);
  setTarget(p[0], p[1]);
  if (e.preventDefault) { try { e.preventDefault(); } catch (err) {} }
}
function onUp() { dragging = false; }
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', onDown);
  canvas.addEventListener('touchmove', onMove);
  canvas.addEventListener('touchend', onUp);
}
function drawTexture(cx, cy, r) {
  var i, b, g, sx, sy, sr;
  /* the field is 3 circle-diameters wide in view; blobs slide through
     the window as the mic moves, so each spot on the cone sounds different */
  var spread = r * 6;
  for (i = 0; i < BLOBS.length; i++) {
    b = BLOBS[i];
    sx = cx + (b.u - mic.x) * spread;
    sy = cy + (b.v - mic.y) * spread;
    sr = b.r * spread;
    if (sx < cx - r - sr || sx > cx + r + sr || sy < cy - r - sr || sy > cy + r + sr) continue;
    var grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
    grad.addColorStop(0, rgba(b.color, b.alpha));
    grad.addColorStop(1, rgba(b.color, 0));
    ctx.fillStyle = grad;
    ctx.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
  }
  for (i = 0; i < GRAIN.length; i++) {
    g = GRAIN[i];
    sx = cx + (g.u - mic.x) * spread;
    sy = cy + (g.v - mic.y) * spread;
    if (sx < cx - r || sx > cx + r || sy < cy - r || sy > cy + r) continue;
    ctx.fillStyle = g.warm ? rgba('#E8C887', g.alpha) : rgba('#6B4A26', g.alpha);
    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(g.r * spread, 0.5), 0, TAU);
    ctx.fill();
  }
  /* warm wash: brighter toward the cone center, softened at the rim */
  var wash = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  wash.addColorStop(0, 'rgba(232,200,135,0.20)');
  wash.addColorStop(0.7, 'rgba(201,143,61,0.08)');
  wash.addColorStop(1, 'rgba(20,12,6,0.35)');
  ctx.fillStyle = wash;
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
}
function drawGrille(cx, cy, r) {
  /* perforated grille, fixed to the circle: concentric rings of holes */
  var ring, k, n, ang, hx, hy;
  var rings = [0.22, 0.42, 0.62, 0.82];
  for (ring = 0; ring < rings.length; ring++) {
    var rr = rings[ring] * r;
    n = Math.max(6, Math.round(TAU * rr / (r * 0.16)));
    for (k = 0; k < n; k++) {
      ang = (k / n) * TAU + ring * 0.35;
      hx = cx + Math.cos(ang) * rr;
      hy = cy + Math.sin(ang) * rr;
      ctx.fillStyle = 'rgba(5,3,2,0.55)';
      ctx.beginPath();
      ctx.arc(hx, hy, Math.max(r * 0.038, 0.8), 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(232,200,135,0.18)';
      ctx.beginPath();
      ctx.arc(hx + r * 0.012, hy + r * 0.012, Math.max(r * 0.02, 0.5), 0, TAU);
      ctx.fill();
    }
  }
  /* center hole and rim */
  ctx.fillStyle = 'rgba(5,3,2,0.6)';
  ctx.beginPath();
  ctx.arc(cx, cy, Math.max(r * 0.045, 1), 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(217,179,108,0.65)';
  ctx.lineWidth = Math.max(r * 0.03, 1);
  ctx.beginPath();
  ctx.arc(cx, cy, r - ctx.lineWidth / 2, 0, TAU);
  ctx.stroke();
}
function draw() {
  size();
  /* ease the mic toward the drag target on every frame */
  mic.x += (mic.tx - mic.x) * 0.18;
  mic.y += (mic.ty - mic.y) * 0.18;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var r = circleR();
  var cx = mic.x * VW, cy = mic.y * VH;
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, TAU);
  ctx.clip();
  /* deep amber ground inside the mic so the circle never reads empty */
  var base = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  base.addColorStop(0, '#3A2410');
  base.addColorStop(0.6, '#241708');
  base.addColorStop(1, '#120B04');
  ctx.fillStyle = base;
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  drawTexture(cx, cy, r);
  /* slow shimmer, 0.25 Hz by construction: a warm breath over the cone */
  var shimmer = 0.05 + 0.05 * Math.sin((phaseT / PERIOD) * TAU);
  var glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  glow.addColorStop(0, 'rgba(232,200,135,' + shimmer.toFixed(4) + ')');
  glow.addColorStop(1, 'rgba(232,200,135,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  drawGrille(cx, cy, r);
  ctx.restore();
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Bad Speaker').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Bad Speaker').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 20').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Bad Speaker', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 20', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag the mic across the cone.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    setPointer: function (x, y) {
      mic.tx = clamp(x / VW, 0.06, 0.94);
      mic.ty = clamp(y / VH, 0.06, 0.94);
      dragging = true;
    },
    release: function () { dragging = false; },
    circlePos: function () { return { x: mic.x, y: mic.y, tx: mic.tx, ty: mic.ty, r: circleR(), vw: VW, vh: VH }; },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 10.0 s, mic at (0.38, 0.40), off-center ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
