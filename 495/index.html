<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palm Tones</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #101010; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var GROUND = '#101010';

  // Five printed colorways, after the SELVA poster's five colorazioni.
  // accent = the color used for star dots and the micro-type label.
  var COLORWAYS = [
    { cols: ['#E8401F', '#8A8F98'],             accent: '#8A8F98' },
    { cols: ['#B8D62E', '#1F7A6D', '#F2E8C9'],  accent: '#F2E8C9' },
    { cols: ['#F2E8C9', '#C33E21'],             accent: '#C33E21' },
    { cols: ['#B9A8E0', '#0E3B2C'],             accent: '#B9A8E0' },
    { cols: ['#FAFAF6', '#E8722A'],             accent: '#E8722A' }
  ];
  var cwIndex = 1; // first frame: colorway 2, the three-color one

  var PHASE = 4.2; // fixed pre-roll: palms mid-sway, dots mid-twinkle

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var seed = 495007;
  var palms = []; // {x,y (fractions), h (height in unit fractions), type, colorIx, swayPhase, fronds:[...]}
  var stars = []; // {x,y (fractions), r, phase, speed, big}

  // ---- frond geometry, precomputed per frond so frames stay deterministic ----
  function makeFrond(rng, baseAngle, len, droop) {
    var leaflets = [];
    var n = 12 + Math.floor(rng() * 3); // 12..14 stations, a fine feather
    for (var i = 0; i < n; i++) {
      var t = 0.12 + (0.86 * i) / (n - 1);
      // leaflets longest a little past the middle of the rib
      var prof = Math.sin(Math.PI * (0.08 + 0.84 * t));
      var L = len * (0.10 + 0.17 * prof) * (0.9 + rng() * 0.2);
      leaflets.push({
        t: t,
        len: L,
        wid: len * 0.0095 * (0.8 + rng() * 0.4),
        ang: 0.62 + rng() * 0.12, // ~36-42 degrees off the rib, swept toward the tip
        side: (i % 2 === 0) ? 1 : -1
      });
    }
    return { baseAngle: baseAngle, len: len, droop: droop, leaflets: leaflets };
  }

  function makeCrown(rng, crownR, fan) {
    var fronds = [];
    var n = 6 + Math.floor(rng() * 2); // 6..7 fronds
    for (var i = 0; i < n; i++) {
      var f = n === 1 ? 0.5 : i / (n - 1);
      var ang, droop;
      if (fan === 'corner') {
        // cluster near a top corner: fan sweeps up, left, and down-left, never right
        ang = -Math.PI * (0.45 + 0.75 * f); // -81deg .. -216deg
        droop = 0.26 + rng() * 0.2;
      } else {
        // full crown: fan across the upper hemisphere
        ang = -Math.PI * (0.933 - 0.867 * f); // -168deg .. -12deg
        droop = 0.20 + rng() * 0.18;
      }
      var len = crownR * (0.82 + 0.36 * Math.sin(Math.PI * f)) * (0.9 + rng() * 0.2);
      fronds.push(makeFrond(rng, ang, len, droop));
    }
    return fronds;
  }

  function buildLayout(s) {
    var rng = mulberry32(s);
    palms = [];
    stars = [];
    // structured slots keep the black space generous; jitter keeps it alive
    var slots = [
      { x: 0.27, y: 0.97, h: 0.46, type: 'tree',  fan: 'full'   },  // big left
      { x: 0.72, y: 0.99, h: 0.44, type: 'tree',  fan: 'full'   },  // big right
      { x: 0.52, y: 0.94, h: 0.33, type: 'tree',  fan: 'full'   },  // medium centre
      { x: 0.40, y: 0.90, h: 0.23, type: 'tree',  fan: 'full'   },  // small-medium
      { x: 0.62, y: 0.88, h: 0.17, type: 'tree',  fan: 'full'   },  // small
      { x: 0.13, y: 0.86, h: 0.14, type: 'tree',  fan: 'full'   },  // small far left
      { x: 0.82, y: 0.30, h: 0.21, type: 'crown', fan: 'corner' },  // big fronds, upper right
      { x: 0.20, y: 0.38, h: 0.14, type: 'crown', fan: 'full'   }   // small crown, mid left
    ];
    for (var i = 0; i < slots.length; i++) {
      var sl = slots[i];
      var h = sl.h * (0.92 + rng() * 0.16);
      // frond lengths live in palm-height units: crown radius is a fraction of h
      var crownR = (sl.type === 'tree') ? 0.46 : 1.0;
      palms.push({
        x: sl.x + (rng() - 0.5) * 0.03,
        y: sl.y,
        h: h,
        type: sl.type,
        colorIx: Math.floor(rng() * 3), // resolved mod palette size at draw
        swayPhase: rng() * Math.PI * 2,
        swaySpeed: 0.45 + rng() * 0.25,
        lean: (rng() - 0.5) * 0.10,
        fronds: makeCrown(rng, crownR, sl.fan)
      });
    }
    var nStars = 24 + Math.floor(rng() * 8);
    for (var j = 0; j < nStars; j++) {
      stars.push({
        x: 0.04 + rng() * 0.92,
        y: 0.04 + rng() * 0.80,
        r: 0.0022 + rng() * 0.0038,
        phase: rng() * Math.PI * 2,
        speed: 0.7 + rng() * 1.1,
        big: rng() < 0.3
      });
    }
  }
  buildLayout(seed);

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999;
      sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = (typeof window !== 'undefined' && window.devicePixelRatio) ? window.devicePixelRatio : 1;
    if (!DPR || DPR < 1) DPR = 1;
    if (DPR > 2) DPR = 2;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    draw(PHASE); // deterministic frame after any resize
  }

  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  // ---- drawing ----

  function quad(x1, y1, x2, y2, x3, y3, x4, y4) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
  }

  // point + tangent angle on a frond's droop curve at parameter t
  function frondPoint(fr, t) {
    var ca = Math.cos(fr.baseAngle), sa = Math.sin(fr.baseAngle);
    // local curve: rises out of the crown, then droops at the tip
    var p1x = ca * fr.len * 0.45, p1y = sa * fr.len * 0.45 - fr.len * 0.22;
    var p2x = ca * fr.len,        p2y = sa * fr.len + fr.len * fr.droop;
    var u = 1 - t;
    var x = 2 * u * t * p1x + t * t * p2x;
    var y = 2 * u * t * p1y + t * t * p2y;
    var dx = 2 * u * p1x + 2 * t * (p2x - p1x);
    var dy = 2 * u * p1y + 2 * t * (p2y - p1y);
    return { x: x, y: y, ang: Math.atan2(dy, dx) };
  }

  function drawFrond(fr, color) {
    ctx.fillStyle = color;
    // leaflets first: tapered quads angled off the rib, alternating sides
    for (var k = 0; k < fr.leaflets.length; k++) {
      var lf = fr.leaflets[k];
      var base = frondPoint(fr, lf.t);
      var dirA = base.ang + lf.side * lf.ang;
      var dx = Math.cos(dirA), dy = Math.sin(dirA);
      var px = Math.cos(dirA + Math.PI / 2), py = Math.sin(dirA + Math.PI / 2);
      var tipx = base.x + dx * lf.len, tipy = base.y + dy * lf.len;
      var tw = lf.wid * 0.18;
      quad(
        base.x + px * lf.wid, base.y + py * lf.wid,
        tipx + px * tw, tipy + py * tw,
        tipx - px * tw, tipy - py * tw,
        base.x - px * lf.wid, base.y - py * lf.wid
      );
    }
    // rib last: a clean tapering arc over the leaflet bases, organising the eye
    var steps = 9;
    var left = [], right = [];
    for (var i = 0; i <= steps; i++) {
      var t = i / steps;
      var p = frondPoint(fr, t);
      var hw = fr.len * 0.013 * (1 - t) + fr.len * 0.002;
      var nx = Math.cos(p.ang + Math.PI / 2), ny = Math.sin(p.ang + Math.PI / 2);
      left.push({ x: p.x + nx * hw, y: p.y + ny * hw });
      right.push({ x: p.x - nx * hw, y: p.y - ny * hw });
    }
    ctx.beginPath();
    ctx.moveTo(left[0].x, left[0].y);
    for (var a = 1; a < left.length; a++) ctx.lineTo(left[a].x, left[a].y);
    for (var b = right.length - 1; b >= 0; b--) ctx.lineTo(right[b].x, right[b].y);
    ctx.closePath();
    ctx.fill();
  }

  function drawPalm(p, U, t) {
    var cw = COLORWAYS[cwIndex];
    var color = cw.cols[p.colorIx % cw.cols.length];
    var bx = p.x * W, by = p.y * H;
    var ph = p.h * U;
    var sway = Math.sin(t * p.swaySpeed + p.swayPhase) * 0.026; // ~1.5 degrees
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(sway + p.lean * 0.3);
    ctx.scale(ph, ph); // local space: 1 unit = palm height
    if (p.type === 'tree') {
      // trunk: a gently leaning tapered strip from base to crown
      var trunkH = 0.58;
      var leanX = p.lean;
      var w0 = 0.021, w1 = 0.011;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(-w0, 0);
      ctx.lineTo(leanX * 0.4 - w0 * 0.8, -trunkH * 0.5);
      ctx.lineTo(leanX - w1, -trunkH);
      ctx.lineTo(leanX + w1, -trunkH);
      ctx.lineTo(leanX * 0.4 + w0 * 0.8, -trunkH * 0.5);
      ctx.lineTo(w0, 0);
      ctx.closePath();
      ctx.fill();
      ctx.translate(leanX, -trunkH);
    }
    for (var i = 0; i < p.fronds.length; i++) drawFrond(p.fronds[i], color);
    ctx.restore();
  }

  function drawStar(s, U, t) {
    var cw = COLORWAYS[cwIndex];
    var tw = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
    ctx.save();
    ctx.globalAlpha = 0.25 + 0.75 * tw * tw;
    ctx.fillStyle = cw.accent;
    var x = s.x * W, y = s.y * H, r = s.r * U;
    if (s.big) {
      // four-point sparkle: a diamond with pinched waist
      ctx.beginPath();
      ctx.moveTo(x, y - r * 2.1);
      ctx.lineTo(x + r * 0.42, y - r * 0.42);
      ctx.lineTo(x + r * 2.1, y);
      ctx.lineTo(x + r * 0.42, y + r * 0.42);
      ctx.lineTo(x, y + r * 2.1);
      ctx.lineTo(x - r * 0.42, y + r * 0.42);
      ctx.lineTo(x - r * 2.1, y);
      ctx.lineTo(x - r * 0.42, y - r * 0.42);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(x, y - r);
      ctx.lineTo(x + r, y);
      ctx.lineTo(x, y + r);
      ctx.lineTo(x - r, y);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function draw(t) {
    if (!W || !H) return;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);
    var U = Math.min(W, H);
    var i;
    for (i = 0; i < stars.length; i++) drawStar(stars[i], U, t);
    for (i = 0; i < palms.length; i++) drawPalm(palms[i], U, t);
    // micro-type label, one line, bottom-left, accent color
    var cw = COLORWAYS[cwIndex];
    var fs = Math.max(9, U * 0.017);
    ctx.fillStyle = cw.accent;
    ctx.font = '600 ' + fs + 'px ui-monospace, Menlo, Consolas, monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('SELVA · COLORAZIONE 0' + (cwIndex + 1) + ' / 05', U * 0.045, H - U * 0.042);
  }

  // ---- interaction: tap cycles colorway, double-tap reseeds layout ----
  var downX = 0, downY = 0, downT = 0;
  var lastTapT = -1000, pendingTimer = null;

  function onTap(now) {
    if (now - lastTapT < 330) {
      // double-tap: reseed the palm layout, keep the colorway
      if (pendingTimer !== null) { clearTimeout(pendingTimer); pendingTimer = null; }
      lastTapT = -1000;
      seed = (seed * 1103515245 + 12345) % 2147483648;
      buildLayout(seed);
      draw(PHASE);
      return;
    }
    lastTapT = now;
    pendingTimer = setTimeout(function () {
      pendingTimer = null;
      cwIndex = (cwIndex + 1) % COLORWAYS.length;
      draw(PHASE);
    }, 330);
  }

  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      downX = e.clientX; downY = e.clientY;
      downT = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    });
    canvas.addEventListener('pointerup', function (e) {
      var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
      var moved = Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY);
      if (moved < 14 && now - downT < 500) onTap(now);
    });
  }

  // ---- boot + loop: first frame synchronous at the fixed phase ----
  resize();
  draw(PHASE);

  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    draw(PHASE + (ts - startStamp) / 1000);
    if (typeof window !== 'undefined' && window.requestAnimationFrame) {
      window.requestAnimationFrame(frame);
    }
  }
  if (typeof window !== 'undefined' && typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
