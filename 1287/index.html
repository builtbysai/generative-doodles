<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grandmother's Garden</title>
<style>
html,body{margin:0;padding:0;background:#141210;overflow:hidden;width:100%;height:100%}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var W=0,H=0,phone=false,lastT=0;

// Seeded RNG (mulberry32) — no Math.random anywhere.
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rnd=mulberry(1287);

// Palette
var INK='#141210',PAPER='#DCD6C8',GREEN='#4E6B3A',LEAF='#7BA05B',
    SARI='#B02E5C',GOLD='#D9A441',EARTH='#6B4E33',THREAD='#A6343C',
    SKIN='#C9A87A',DARK='#2E3B22';

// Precomputed garden: rows of plants converging to a high vanishing point.
// Each plant: relative x across the row (-1..1), row depth, leaf count, sway phase.
var plants=[];
(function(){
  var r2=mulberry(987);
  for(var row=0;row<9;row++){
    var depth=row/8;
    var count=4+Math.round(depth*10);
    for(var i=0;i<count;i++){
      var fx=(count===1)?0:(-1+2*i/(count-1));
      plants.push({row:row,depth:depth,fx:fx+(r2()-0.5)*0.12,
        leaves:3+Math.floor(r2()*4),phase:r2()*6.283,seed:r2()});
    }
  }
})();

// Precomputed soil dots on the earth mound (unit space, seeded).
var soil=[];
(function(){
  var r3=mulberry(55);
  for(var i=0;i<26;i++){soil.push({x:(r3()-0.5)*1.7,y:(r3()-0.5)*0.5,s:1+r3()*2.2});}
})();

// Viewpoint state: closed-form functions of recorded pointer events and t.
var drag=null,relView=0,relT=-10;
function viewAt(t){
  if(drag){return Math.max(0,Math.min(1,-drag.dy*0.0016));}
  return relView*Math.exp(-(t-relT)/0.9);
}
function pos(e){
  var r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():{left:0,top:0};
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
canvas.addEventListener('pointerdown',function(e){var p=pos(e);drag={y0:p.y,dy:0};});
canvas.addEventListener('pointermove',function(e){if(!drag)return;var p=pos(e);drag.dy=p.y-drag.y0;});
canvas.addEventListener('pointerup',function(e){
  if(!drag)return;relView=viewAt(lastT);relT=lastT;drag=null;
});
canvas.addEventListener('pointercancel',function(){
  if(!drag)return;relView=viewAt(lastT);relT=lastT;drag=null;
});

function size(){
  var vw=window.innerWidth,vh=window.innerHeight;
  if(window.visualViewport){vw=window.visualViewport.width;vh=window.visualViewport.height;}
  W=Math.round(vw);H=Math.round(vh);
  canvas.width=W;canvas.height=H;
  var sw=9999,sh=9999;
  if(window.screen&&window.screen.width&&window.screen.height){
    sw=Math.min(window.screen.width,window.screen.height);
    sh=Math.max(window.screen.width,window.screen.height);
  }
  phone=(sw<700)||(H>W*1.15);
}
size();
if(window.visualViewport&&window.visualViewport.addEventListener){
  window.visualViewport.addEventListener('resize',function(){size();draw(lastT);});
}
window.addEventListener('resize',function(){size();draw(lastT);});

function dot(x,y,r,col){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arc(x,y,r,0,6.2832);ctx.fill();
}
function leaf(x,y,len,ang,col){
  // A leaf as one closed path (never a batched ellipse subpath).
  ctx.fillStyle=col;ctx.beginPath();
  ctx.moveTo(x,y);
  var tx=x+Math.cos(ang)*len,ty=y+Math.sin(ang)*len;
  var px=x+Math.cos(ang+1.5708)*len*0.32,py=y+Math.sin(ang+1.5708)*len*0.32;
  var qx=x+Math.cos(ang-1.5708)*len*0.32,qy=y+Math.sin(ang-1.5708)*len*0.32;
  ctx.quadraticCurveTo(px,py,tx,ty);
  ctx.quadraticCurveTo(qx,qy,x,y);
  ctx.fill();
}
function wash(x,y,rx,ry,col,alpha){
  ctx.globalAlpha=alpha;ctx.fillStyle=col;ctx.save();
  ctx.translate(x,y);ctx.scale(rx,ry);ctx.beginPath();ctx.arc(0,0,1,0,6.2832);
  ctx.fill();ctx.restore();ctx.globalAlpha=1;
}

function draw(t){
  lastT=t;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  var view=viewAt(t);
  var horizonY=H*0.20-view*H*0.05;
  var vx=W*0.5,unit=Math.min(W,H);

  // Ground and paper.
  ctx.fillStyle=INK;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=PAPER;ctx.fillRect(0,0,W,H);

  // Loose wash blobs: distant foliage and sky wash above the horizon.
  wash(W*0.18,horizonY*0.55,unit*0.30,unit*0.10,GREEN,0.16);
  wash(W*0.78,horizonY*0.45,unit*0.26,unit*0.09,LEAF,0.14);
  wash(W*0.52,horizonY*0.70,unit*0.34,unit*0.08,GREEN,0.12);

  // Garden rows, converging to the high vanishing point, swaying in slow waves.
  ctx.save();
  ctx.translate(0,-view*H*0.02);
  for(var i=0;i<plants.length;i++){
    var p=plants[i],d=p.depth;
    var y=horizonY+(H-unit*0.06-horizonY)*Math.pow(d,1.55);
    var x=vx+p.fx*(W*0.52)*(0.12+0.88*d);
    var sway=Math.sin(6.283*t/7+p.phase+p.fx*1.5)*(1.5+4.5*d);
    var sc=0.25+1.15*d;
    var stemH=unit*0.030*sc;
    ctx.strokeStyle=GREEN;ctx.lineWidth=Math.max(1,unit*0.0022*sc);
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+sway*0.3,y-stemH);ctx.stroke();
    for(var l=0;l<p.leaves;l++){
      var la=-2.4+l*(1.35/Math.max(1,p.leaves-1))+Math.sin(6.283*t/7+p.phase+l)*0.18;
      var ll=unit*0.016*sc*(0.8+0.25*Math.sin(p.seed*20+l));
      leaf(x+sway*0.3+Math.cos(la)*ll*0.4,y-stemH+Math.sin(la)*ll*0.3,ll,la,
        (l%2===0)?LEAF:GREEN);
    }
  }
  ctx.restore();

  // Grandmother, seen from behind: sari drape dominating the upper two-thirds.
  // Figure proportions keyed to unit (min dimension) so desktop and phone read alike.
  var cx=W*0.5;
  var shoulderW=unit*0.30,bodyH=unit*0.62;
  var top=H*0.5-bodyH*0.55;
  ctx.fillStyle=SARI;
  ctx.beginPath();
  ctx.moveTo(cx-shoulderW*0.42,top+unit*0.10);
  ctx.quadraticCurveTo(cx-shoulderW*0.62,top+unit*0.16,cx-shoulderW*0.55,top+bodyH*0.55);
  ctx.quadraticCurveTo(cx-shoulderW*0.62,top+bodyH*0.86,cx-shoulderW*0.30,top+bodyH);
  ctx.quadraticCurveTo(cx,top+bodyH*1.04,cx+shoulderW*0.30,top+bodyH);
  ctx.quadraticCurveTo(cx+shoulderW*0.62,top+bodyH*0.86,cx+shoulderW*0.55,top+bodyH*0.55);
  ctx.quadraticCurveTo(cx+shoulderW*0.62,top+unit*0.16,cx+shoulderW*0.42,top+unit*0.10);
  ctx.quadraticCurveTo(cx,top+unit*0.02,cx-shoulderW*0.42,top+unit*0.10);
  ctx.fill();
  // Gold sari border along the drape edge.
  ctx.strokeStyle=GOLD;ctx.lineWidth=Math.max(1.5,unit*0.004);
  ctx.beginPath();
  ctx.moveTo(cx-shoulderW*0.50,top+unit*0.18);
  ctx.quadraticCurveTo(cx-shoulderW*0.58,top+bodyH*0.55,cx-shoulderW*0.30,top+bodyH*0.97);
  ctx.moveTo(cx+shoulderW*0.50,top+unit*0.18);
  ctx.quadraticCurveTo(cx+shoulderW*0.58,top+bodyH*0.55,cx+shoulderW*0.30,top+bodyH*0.97);
  ctx.stroke();
  // Head, from behind: hair bun, no face.
  ctx.fillStyle='#3A2A24';
  ctx.beginPath();ctx.moveTo(cx+unit*0.045,top+unit*0.055);
  ctx.arc(cx,top+unit*0.055,unit*0.045,0,6.2832);ctx.fill();
  dot(cx,top-unit*0.005,unit*0.016,'#3A2A24');
  // Arms reaching down-forward to the earth at center, in a darker sari
  // shade so they read against the drape.
  var knead=Math.sin(6.283*t/2.4);
  ctx.strokeStyle='#7E2248';ctx.lineCap='round';
  ctx.lineWidth=Math.max(3,unit*0.016);
  ctx.beginPath();
  ctx.moveTo(cx-shoulderW*0.40,top+unit*0.22);
  ctx.quadraticCurveTo(cx-unit*0.10,top+bodyH*0.62,cx-unit*0.055,top+bodyH*0.72+knead*unit*0.008);
  ctx.moveTo(cx+shoulderW*0.40,top+unit*0.22);
  ctx.quadraticCurveTo(cx+unit*0.10,top+bodyH*0.62,cx+unit*0.055,top+bodyH*0.72-knead*unit*0.008);
  ctx.stroke();
  // Earth mound at center, hands kneading it.
  var mx=cx,my=top+bodyH*0.74;
  ctx.fillStyle=EARTH;
  ctx.save();
  ctx.translate(mx,my);ctx.scale(1.35,0.42);ctx.beginPath();ctx.arc(0,0,unit*0.13,0,6.2832);
  ctx.fill();ctx.restore();
  for(var s=0;s<soil.length;s++){
    var sd=soil[s];
    dot(mx+sd.x*unit*0.10,my+sd.y*unit*0.10,sd.s, '#4A3520');
  }
  // Hands: two blobs alternating in the kneading loop, palms down in the earth.
  ctx.fillStyle=SKIN;
  ctx.beginPath();ctx.moveTo(mx-unit*0.055,my-unit*0.01+knead*unit*0.008);
  ctx.arc(mx-unit*0.055,my-unit*0.01+knead*unit*0.008,unit*0.028,0,6.2832);ctx.fill();
  ctx.beginPath();ctx.moveTo(mx+unit*0.055,my-unit*0.01-knead*unit*0.008);
  ctx.arc(mx+unit*0.055,my-unit*0.01-knead*unit*0.008,unit*0.028,0,6.2832);ctx.fill();

  // Thin phulkari border band: dashed red rect with corner diamonds.
  var m=phone?10:16;
  ctx.strokeStyle=THREAD;ctx.lineWidth=Math.max(1.5,unit*0.003);
  ctx.setLineDash([unit*0.014,unit*0.010]);
  ctx.strokeRect(m,m,W-2*m,H-2*m);
  ctx.setLineDash([]);
  var dm=unit*0.012;
  var corners=[[m,m],[W-m,m],[m,H-m],[W-m,H-m]];
  for(var c=0;c<4;c++){
    var px2=corners[c][0],py2=corners[c][1];
    ctx.fillStyle=THREAD;ctx.beginPath();
    ctx.moveTo(px2,py2-dm);ctx.lineTo(px2+dm,py2);ctx.lineTo(px2,py2+dm);
    ctx.lineTo(px2-dm,py2);ctx.closePath();ctx.fill();
  }
}

// Boot flag: the synchronous first frame draws at exactly t = 0.
// The clock starts only with the rAF loop.
draw(0);
if(typeof requestAnimationFrame!=='undefined'){
  var T0=(typeof performance!=='undefined'&&performance.now)?performance.now():0;
  (function loop(){
    var t=(typeof performance!=='undefined'&&performance.now)?
      (performance.now()-T0)/1000:0;
    draw(t);
    requestAnimationFrame(loop);
  })();
}
})();
</script>
</body>
</html>
