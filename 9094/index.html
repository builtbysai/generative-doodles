<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9094 · Perigee</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #08080a; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  // integer frequency ratios -> the orbit closes exactly. one loop, forever.
  var P = {
    a1: 1.00, f1: 3, p1: 0.0,
    a2: 0.42, f2: 2, p2: 1.1,
    b1: 1.00, g1: 2, q1: 1.5708,
    b2: 0.42, g2: 3, q2: 0.4
  };
  var PERIOD = 14000; // ms, one full orbit
  var SAMPLES = 1600;

  var orbit = null;   // offscreen, drawn once
  var glow = null;    // dot glow sprite
  var cx = 0, cy = 0, R = 0;

  function point(t, out) {
    out.x = cx + R * (P.a1 * Math.sin(P.f1 * t + P.p1) + P.a2 * Math.sin(P.f2 * t + P.p2)) / 1.42;
    out.y = cy + R * (P.b1 * Math.sin(P.g1 * t + P.q1) + P.b2 * Math.sin(P.g2 * t + P.q2)) / 1.42;
  }

  function build() {
    var DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    cx = W / 2; cy = H / 2;
    R = Math.min(W, H) * 0.36;

    // render the closed orbit once
    orbit = document.createElement('canvas');
    orbit.width = canvas.width; orbit.height = canvas.height;
    var o = orbit.getContext('2d');
    o.setTransform(DPR, 0, 0, DPR, 0, 0);
    var pt = { x: 0, y: 0 };
    o.strokeStyle = 'rgba(216, 208, 190, 0.55)';
    o.lineWidth = 1;
    o.beginPath();
    for (var i = 0; i <= SAMPLES; i++) {
      point((i / SAMPLES) * Math.PI * 2, pt);
      if (i === 0) o.moveTo(pt.x, pt.y); else o.lineTo(pt.x, pt.y);
    }
    o.closePath();
    o.stroke();

    // faint echo orbit, rotated 90 degrees of phase — the shadow of the path
    o.strokeStyle = 'rgba(216, 208, 190, 0.16)';
    o.beginPath();
    for (i = 0; i <= SAMPLES; i++) {
      var t = (i / SAMPLES) * Math.PI * 2;
      point(t, pt);
      var ex = cx + (pt.x - cx) * 0.62, ey = cy + (pt.y - cy) * 0.62;
      if (i === 0) o.moveTo(ex, ey); else o.lineTo(ex, ey);
    }
    o.closePath();
    o.stroke();

    // dot glow sprite
    glow = document.createElement('canvas');
    glow.width = glow.height = 96;
    var g = glow.getContext('2d');
    var grad = g.createRadialGradient(48, 48, 0, 48, 48, 48);
    grad.addColorStop(0, 'rgba(255, 250, 238, 1)');
    grad.addColorStop(0.25, 'rgba(255, 244, 220, 0.55)');
    grad.addColorStop(1, 'rgba(255, 244, 220, 0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 96, 96);
  }

  // double-tap re-phases the traveler to the tap point's nearest orbit angle
  var lastTap = 0;
  var phase = 0; // extra phase offset, eased toward target
  var phaseTarget = 0;
  canvas.addEventListener('pointerdown', function (e) {
    var now = performance.now();
    if (now - lastTap < 350) {
      // find orbit angle nearest the tap
      var pt = { x: 0, y: 0 }, best = 0, bd = 1e18;
      for (var i = 0; i < SAMPLES; i += 4) {
        point((i / SAMPLES) * Math.PI * 2, pt);
        var dx = pt.x - e.clientX, dy = pt.y - e.clientY;
        var d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = (i / SAMPLES) * Math.PI * 2; }
      }
      var cur = ((now % PERIOD) / PERIOD) * Math.PI * 2 + phase;
      phaseTarget += (best - (cur % (Math.PI * 2)));
    }
    lastTap = now;
  });

  var pt = { x: 0, y: 0 };
  function frame(now) {
    phase += (phaseTarget - phase) * 0.06;
    var t = ((now % PERIOD) / PERIOD) * Math.PI * 2 + phase;
    point(t, pt);

    ctx.fillStyle = '#08080a';
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(orbit, 0, 0, W, H);

    var s = Math.min(W, H) * 0.085;
    ctx.drawImage(glow, pt.x - s / 2, pt.y - s / 2, s, s);
    ctx.fillStyle = '#fffaf0';
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 2.2, 0, Math.PI * 2);
    ctx.fill();

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', build);
  build();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
