<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Contract, Read Aloud</title>
<style>
  html, body { margin: 0; padding: 0; background: #cfc8bc; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32). Never Math.random: frame one must be reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(1445000);

  // Stable per-(line, dash) hash so the pseudo-type never flickers between loops.
  function hash2(a, b) {
    var h = (a * 374761393 + b * 668265263) | 0;
    h = (h ^ (h >>> 13)) | 0;
    h = Math.imul(h, 1274126177);
    h = (h ^ (h >>> 16)) >>> 0;
    return h / 4294967296;
  }

  var W = 0, H = 0;
  var phone = false;

  function size() {
    var vw = (typeof window.visualViewport !== 'undefined' && window.visualViewport)
      ? window.visualViewport.width : window.innerWidth;
    var vh = (typeof window.visualViewport !== 'undefined' && window.visualViewport)
      ? window.visualViewport.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var minDim = Math.min(window.screen.width, window.screen.height);
    phone = minDim < 700 || (H > W * 1.15 && Math.min(W, H) < 700);
    if (typeof document !== 'undefined' && document.body) {
      document.body.style.background = '#cfc8bc';
    }
  }

  // Layout, recomputed per draw so resize never desyncs.
  function layout() {
    var tableTop = Math.round(H * 0.46);
    var tableH = H - tableTop;
    var paperW = phone ? Math.round(W * 0.80) : Math.min(Math.round(W * 0.52), 620);
    var paperH = phone ? Math.max(240, tableH - 170) : Math.max(280, tableH - 110);
    var paperX = Math.round((W - paperW) / 2);
    var paperY = tableTop + (phone ? 24 : 30);
    if (paperY + paperH > H - 14) paperH = H - 14 - paperY;
    var gap = phone ? 12 : 13;
    var topPad = 26, sidePad = 26;
    var nLines = Math.max(8, Math.floor((paperH - topPad - 20) / gap));
    return { tableTop: tableTop, tableH: tableH, paperW: paperW, paperH: paperH,
             paperX: paperX, paperY: paperY, gap: gap, topPad: topPad,
             sidePad: sidePad, nLines: nLines };
  }

  // Interaction state: drag maps pointer y to a line index; release re-anchors
  // the slow read at that line. All closed-form over recorded events, never
  // frame-integrated state.
  var dragging = false;
  var dragLine = 0;
  var anchor = 0; // read time offset: ambient line = floor((t - anchor) / 2) mod N
  var nowT = 0;

  function lineAt(t, L) {
    if (dragging) return dragLine;
    var idx = Math.floor((t - anchor) / 2);
    idx = ((idx % L.nLines) + L.nLines) % L.nLines;
    return idx;
  }

  function pointerLine(clientY, L) {
    var y = clientY - L.paperY - L.topPad;
    var idx = Math.floor(y / L.gap);
    if (idx < 0) idx = 0;
    if (idx > L.nLines - 1) idx = L.nLines - 1;
    return idx;
  }

  function onDown(e) {
    var L = layout();
    dragging = true;
    dragLine = pointerLine(e.clientY, L);
  }
  function onMove(e) {
    if (!dragging) return;
    var L = layout();
    dragLine = pointerLine(e.clientY, L);
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    var L = layout();
    anchor = nowT - dragLine * 2;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function drawDashRow(x0, y, width, lineIdx, lift) {
    // One row of pseudo-type: short charcoal dashes, never legible words.
    var x = x0;
    var d = 0;
    ctx.fillStyle = '#2a2a2a';
    while (x < x0 + width - 8) {
      var len = 4 + hash2(lineIdx, d) * 14;
      var gapAfter = 3 + hash2(lineIdx + 1000, d) * 4;
      ctx.fillRect(x, y + lift, len, 2);
      x += len + gapAfter;
      d++;
    }
  }

  function drawHand(hx, hy, s) {
    // One stylized hand, resting still beside the paper. No figure, no body.
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(-0.12);
    ctx.fillStyle = '#c9a184';
    ctx.fillRect(0, 0, 46 * s, 58 * s); // palm
    for (var f = 0; f < 4; f++) {
      var fw = 10 * s;
      var fh = (26 - f * 2) * s;
      ctx.fillRect((2 + f * 11) * s, -fh, fw, fh + 2 * s);
    }
    ctx.fillRect(-14 * s, 30 * s, 18 * s, 10 * s); // thumb
    ctx.restore();
  }

  function draw(t) {
    nowT = t;
    size();
    var L = layout();
    var read = lineAt(t, L);

    // Wall (empty, warm gray) and table (wood) across the lower frame.
    ctx.fillStyle = '#cfc8bc';
    ctx.fillRect(0, 0, W, L.tableTop);
    ctx.fillStyle = '#7a5a34';
    ctx.fillRect(0, L.tableTop, W, L.tableH);
    // Wood grain: a few darker horizontal lines, seeded and stable.
    ctx.fillStyle = '#5a3a1a';
    for (var g = 0; g < 5; g++) {
      var gy = L.tableTop + 18 + g * Math.max(24, Math.floor(L.tableH / 5));
      if (gy < H - 4) ctx.fillRect(0, gy, W, 2);
    }

    // Contract paper, slightly angled: handled, not aligned.
    ctx.save();
    ctx.translate(L.paperX + L.paperW / 2, L.paperY + L.paperH / 2);
    ctx.rotate(-0.026); // about -1.5 degrees
    ctx.fillStyle = '#4a3822';
    ctx.fillRect(-L.paperW / 2 + 5, -L.paperH / 2 + 7, L.paperW, L.paperH); // soft paper shadow
    ctx.fillStyle = '#f2ead8';
    ctx.fillRect(-L.paperW / 2, -L.paperH / 2, L.paperW, L.paperH);

    var innerW = L.paperW - L.sidePad * 2;
    for (var i = 0; i < L.nLines; i++) {
      var wob = (hash2(i, 777) - 0.5) * 1.6; // the hand in the work: rows wobble
      var ry = -L.paperH / 2 + L.topPad + i * L.gap + wob;
      if (i === read) {
        // Reading line: lifted off the page, glowing amber, as if read aloud.
        ctx.fillStyle = 'rgba(74, 56, 34, 0.25)';
        ctx.fillRect(-L.paperW / 2 + L.sidePad, ry + 5, innerW, 10);
        ctx.fillStyle = 'rgba(232, 184, 58, 0.35)';
        ctx.fillRect(-L.paperW / 2 + L.sidePad - 2, ry - 3, innerW + 4, 11);
        drawDashRow(-L.paperW / 2 + L.sidePad, ry - 4, innerW, i, 0);
      } else {
        drawDashRow(-L.paperW / 2 + L.sidePad, ry, innerW, i, 0);
      }
    }
    ctx.restore();

    // Hand beside the paper; below it on narrow frames so nothing overlaps.
    var handS = phone ? 0.8 : 1;
    var handRight = L.paperX + L.paperW + 24;
    if (W - handRight > 70) {
      drawHand(handRight, L.paperY + L.paperH - 90, handS);
    } else {
      drawHand(W - 70, H - 86, handS);
    }
  }

  // Frame one is drawn synchronously at a constant phase.
  draw(0);

  // rAF loop as a plain function declaration, typeof-guarded.
  var startMs = null;
  function loop(ts) {
    if (startMs === null) startMs = ts;
    draw((ts - startMs) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(loop);
  }

  if (typeof window !== 'undefined') {
    window.__piece = { draw: draw, lineAt: lineAt, layout: layout,
      get dragging() { return dragging; }, get dragLine() { return dragLine; },
      get anchor() { return anchor; } };
    window.addEventListener('resize', function () { draw(nowT); });
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { draw(nowT); });
    }
  }
})();
</script>
</body>
</html>
