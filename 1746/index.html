<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Recycling Loop</title>
<style>
html, body { margin: 0; padding: 0; background: #A9A29A; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#A9A29A';
var TAN = '#C9A876';
var TAN_DARK = '#A9854F';
var TAN_LIGHT = '#DCC49A';
var MOTOR = '#211D1A';
var COTTON = '#F6F1E7';
var WHISKER = '#5E5952';
var PLATE = '#2B2622';
var PLATE_LINE = 'rgba(220,196,154,0.55)';
var TITLE_INK = '#F2E8D8';
var HINT_INK = '#E8C887';
var CYCLE = 180;
var HALF = 90;
var FRAME_T = 8.0;
var N_UNITS = 24;
var PARTS_PER_UNIT = 4;
var TOTAL_PARTS = N_UNITS * PARTS_PER_UNIT;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function ss(a, b, x) {
  var t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1746);
var phaseT = FRAME_T;
var drawnParts = 0;
/* ---- units: fixed seed table. Grid anchors are lattice positions;
   scatter anchors are the same lattice shuffled with jitter, so the
   scatter stays a loose floor scatter with guaranteed separation. ---- */
var units = [];
(function () {
  var i, j, tmp;
  var order = [];
  for (i = 0; i < N_UNITS; i++) order.push(i);
  for (i = N_UNITS - 1; i > 0; i--) {
    j = Math.floor(rng() * (i + 1));
    tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }
  for (i = 0; i < N_UNITS; i++) {
    var col = i % 6, row = Math.floor(i / 6);
    var scol = order[i] % 6, srow = Math.floor(order[i] / 6);
    units.push({
      col: col, row: row,
      scol: scol, srow: srow,
      jx: (rng() - 0.5) * 0.7,
      jy: (rng() - 0.5) * 0.7,
      period: 180 / (62 + Math.floor(rng() * 79)),
      phase: rng() * TAU,
      wbase: -0.9 + rng() * 0.6,
      wig: rng() * TAU
    });
  }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* field rect: full-bleed on phones, centered square on desktop */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var side = Math.min(VW, VH);
  return { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
}
/* safe rect inside the field, clear of the title and hint plates */
function safeRect() {
  var f = fieldRect();
  return {
    x: f.x + 18,
    y: f.y + 100,
    w: f.w - 36,
    h: f.h - 100 - 78
  };
}
function anchors(un, s) {
  var gx = s.x + ((un.col + 0.5) / 6) * s.w;
  var gy = s.y + ((un.row + 0.5) / 4) * s.h;
  var sx = s.x + ((un.scol + 0.5 + un.jx) / 6) * s.w;
  var sy = s.y + ((un.srow + 0.5 + un.jy) / 4) * s.h;
  return { grid: { x: gx, y: gy }, scatter: { x: sx, y: sy } };
}
/* half-cycle phase: h in [0,1) over 90 s.
   tick [0,0.30), detach [0.30,0.45), flow [0.45,0.75),
   reattach [0.75,0.90), tick [0.90,1). */
function spreadAt(h) {
  if (h < 0.30) return 0;
  if (h < 0.45) return ss(0.30, 0.45, h);
  if (h < 0.75) return 1;
  if (h < 0.90) return 1 - ss(0.75, 0.90, h);
  return 0;
}
function mixAt(h) {
  if (h < 0.45) return 0;
  if (h < 0.75) return ss(0.45, 0.75, h);
  return 1;
}
function flowAt(h) {
  if (h < 0.45) return 0;
  if (h < 0.75) return clamp((h - 0.45) / 0.30, 0, 1);
  return 0;
}
function phaseName(t) {
  var h = (t % HALF) / HALF;
  if (h < 0.30) return 'TICKING';
  if (h < 0.45) return 'DISASSEMBLING';
  if (h < 0.75) return 'FLOWING';
  if (h < 0.90) return 'REASSEMBLING';
  return 'TICKING';
}
function drawUnit(un, t, s, u) {
  var h = (t % HALF) / HALF;
  var k = Math.floor(t / HALF) % 2;
  var a = anchors(un, s);
  var from = (k === 0) ? a.grid : a.scatter;
  var to = (k === 0) ? a.scatter : a.grid;
  var sp = spreadAt(h);
  var mx = mixAt(h);
  var f = flowAt(h);
  var ax = from.x + (to.x - from.x) * mx;
  var ay = from.y + (to.y - from.y) * mx;
  var dx = to.x - from.x, dy = to.y - from.y;
  var len = Math.sqrt(dx * dx + dy * dy) || 1;
  var fx = dx / len, fy = dy / len;
  var px = -fy, py = fx;
  var bob = 0.03 * u * Math.sin(TAU * t / un.period + un.phase + 1.3) * (1 - sp);
  ay += bob;
  var wig = Math.sin(Math.PI * f) * u * 0.45;
  var blend = f * 0.75;
  /* part placement: assembled offset + detach vector blended toward
     the flow direction during the river phase, plus a cross-flow wiggle */
  function partPos(ox, oy, ddx, ddy, wigF) {
    var dl = Math.sqrt(ddx * ddx + ddy * ddy);
    var bx = ddx * (1 - blend) + fx * dl * blend;
    var by = ddy * (1 - blend) + fy * dl * blend;
    return {
      x: ax + (ox + bx * sp) * u + px * wig * wigF,
      y: ay + (oy + by * sp) * u + py * wig * wigF
    };
  }
  var tick = Math.sin(TAU * t / un.period + un.phase);
  /* box: flattens into a sheet as it disassembles */
  var bp = partPos(0, 0.06, 0, 0.10, 0.4);
  var bw = 0.62 * u * (1 + 0.85 * sp);
  var bh = 0.50 * u * (1 - 0.72 * sp);
  ctx.fillStyle = TAN;
  ctx.fillRect(bp.x - bw / 2, bp.y - bh / 2, bw, bh);
  ctx.strokeStyle = TAN_DARK;
  ctx.lineWidth = Math.max(u * 0.03, 1);
  ctx.strokeRect(bp.x - bw / 2, bp.y - bh / 2, bw, bh);
  /* fold lines on the sheet, visible as it flattens */
  if (sp > 0.15) {
    ctx.strokeStyle = rgba(TAN_DARK, 0.55 * sp);
    ctx.lineWidth = Math.max(u * 0.02, 0.75);
    ctx.beginPath();
    ctx.moveTo(bp.x - bw * 0.25, bp.y - bh / 2);
    ctx.lineTo(bp.x - bw * 0.25, bp.y + bh / 2);
    ctx.moveTo(bp.x + bw * 0.25, bp.y - bh / 2);
    ctx.lineTo(bp.x + bw * 0.25, bp.y + bh / 2);
    ctx.stroke();
  }
  drawnParts++;
  /* motor: unclamps and lifts away from the box */
  var mp = partPos(-0.06, -0.30, -0.75, -0.85, 1.0);
  var mw = 0.34 * u, mh = 0.24 * u;
  ctx.fillStyle = MOTOR;
  ctx.fillRect(mp.x - mw / 2, mp.y - mh / 2, mw, mh);
  ctx.fillStyle = TAN_LIGHT;
  ctx.beginPath();
  ctx.arc(mp.x, mp.y, Math.max(u * 0.035, 1), 0, TAU);
  ctx.fill();
  drawnParts++;
  /* cotton: lifts off and rides the river */
  var cp = partPos(0.30, -0.30, 0.45, -1.15, 1.3);
  var cr = 0.20 * u;
  ctx.fillStyle = COTTON;
  ctx.beginPath();
  ctx.arc(cp.x, cp.y, cr, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cp.x - cr * 0.55, cp.y + cr * 0.35, cr * 0.62, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cp.x + cr * 0.55, cp.y + cr * 0.30, cr * 0.58, 0, TAU);
  ctx.fill();
  drawnParts++;
  /* whisker: stays with the motor, ticking the whole cycle */
  var wang = un.wbase + 0.85 * tick;
  var wx = mp.x, wy = mp.y - mh / 2;
  var wl = 0.55 * u;
  ctx.strokeStyle = WHISKER;
  ctx.lineWidth = Math.max(u * 0.035, 1);
  ctx.beginPath();
  ctx.moveTo(wx, wy);
  ctx.lineTo(wx + Math.cos(wang) * wl, wy + Math.sin(wang) * wl);
  ctx.stroke();
  ctx.fillStyle = WHISKER;
  ctx.beginPath();
  ctx.arc(wx, wy, Math.max(u * 0.03, 0.8), 0, TAU);
  ctx.fill();
  drawnParts++;
}
function draw() {
  size();
  drawnParts = 0;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var s = safeRect();
  var u = Math.min(s.w / 6, s.h / 4) * 0.66;
  var i;
  for (i = 0; i < units.length; i++) drawUnit(units[i], phaseT, s, u);
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Recycling Loop').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Recycling Loop').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 23').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Recycling Loop', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 23', plateX + 14, plateY + 7 + titlePx + 3);
  /* hint plate, bottom left */
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  /* census plate, bottom right */
  var census = 'PARTS ' + drawnParts + ' / ' + TOTAL_PARTS;
  var sub = '24 BOX · 24 MOTOR · 24 COTTON · 24 WHISKER';
  var cSmall = smallPx;
  ctx.font = smallPx + 'px monospace';
  while (cSmall > 8 && ctx.measureText(sub).width > VW * 0.62) {
    cSmall -= 1;
    ctx.font = cSmall + 'px monospace';
  }
  ctx.font = 'bold ' + smallPx + 'px monospace';
  var cW = Math.max(ctx.measureText(census).width, (function () {
    ctx.font = cSmall + 'px monospace';
    return ctx.measureText(sub).width;
  })());
  var cPlateW = cW + 24;
  var cPlateH = smallPx + cSmall + 20;
  var cPlateX = VW - cPlateW - 12;
  var cPlateY = VH - cPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(cPlateX, cPlateY, cPlateW, cPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(cPlateX + 0.5, cPlateY + 0.5, cPlateW - 1, cPlateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + smallPx + 'px monospace';
  ctx.fillText(census, cPlateX + 12, cPlateY + 7);
  ctx.font = cSmall + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText(sub, cPlateX + 12, cPlateY + 7 + smallPx + 3);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    censusAt: function (t) { phaseT = t; draw(); return { t: t, phase: phaseName(t), parts: drawnParts, total: TOTAL_PARTS }; },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 8.0 s, grid rows ticking, before disassembly ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % CYCLE;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
