<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Over Under — No.8947</title>
<!-- phantom-fill-8947 -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#17140f; cursor:pointer; }
  canvas { display:block; width:100vw; height:100dvh; }
  .label {
    position:fixed; left:0; right:0; bottom:0; padding:14px 18px 16px;
    display:flex; justify-content:space-between; align-items:baseline;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color:#e6dcc4; pointer-events:none; user-select:none;
  }
  .label .t { font-size:11px; letter-spacing:.28em; text-transform:uppercase; opacity:.9; }
  .label .n { font-size:11px; letter-spacing:.18em; opacity:.5; }
  .hint {
    position:fixed; top:16px; right:18px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:10px; letter-spacing:.22em; text-transform:uppercase;
    color:rgba(230,220,196,.55); pointer-events:none; user-select:none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">tap &middot; a fresh knot</div>
<div class="label"><span class="t">Over Under</span><span class="n" id="seed">No. 8947</span></div>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const seedEl = document.getElementById('seed');
  let W, H, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  window.addEventListener('resize', resize);

  // Seeded RNG: the same seed always ties the same knot.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const INK = '#c9b489';   // bone-gold strand
  const EDGE = '#0c0a07';  // dark outline that separates strands
  const GROOVE = '#8a744a';// carved centre line

  let seed = (Math.random() * 0xffffffff) >>> 0;

  function strokePath(fn, width, color) {
    ctx.beginPath(); fn(); ctx.lineWidth = width;
    ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.stroke();
  }
  // One strand segment: dark edge, bone body, carved groove.
  function strand(fn, w) {
    strokePath(fn, w * 1.35, EDGE);
    strokePath(fn, w, INK);
    strokePath(fn, w * 0.28, GROOVE);
  }

  function draw() {
    const rnd = mulberry32(seed);
    seedEl.textContent = 'No. 8947 · seed ' + seed.toString(16).padStart(8, '0');
    ctx.fillStyle = '#17140f';
    ctx.fillRect(0, 0, W, H);

    const side = Math.min(W, H);
    const margin = side * 0.09;
    const N = 8;                       // knot grid, 8 x 8 cells
    const grid = side - margin * 2;
    const s = grid / N;                // cell size
    const ox = (W - grid) / 2, oy = (H - grid) / 2;
    const w = s * 0.30;                // strand width

    // ---- Plaited frame: interlaced diagonal strokes in a band ----
    const band = margin * 0.62;
    ctx.save();
    ctx.beginPath();
    ctx.rect(ox - band, oy - band, grid + band * 2, grid + band * 2);
    ctx.rect(ox, oy, grid, grid);
    ctx.clip('evenodd');
    ctx.strokeStyle = INK; ctx.globalAlpha = 0.75;
    ctx.lineWidth = band * 0.22;
    const step = band * 0.9;
    for (let x = -grid; x < W + grid; x += step) {
      ctx.beginPath(); ctx.moveTo(x, oy - band); ctx.lineTo(x + grid + band * 2, oy + grid + band); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + grid + band * 2, oy - band); ctx.lineTo(x, oy + grid + band); ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = INK; ctx.globalAlpha = 0.5; ctx.lineWidth = 1;
    ctx.strokeRect(ox - band, oy - band, grid + band * 2, grid + band * 2);
    ctx.strokeRect(ox, oy, grid, grid);
    ctx.globalAlpha = 1;

    // ---- Corner bosses ----
    const boss = [[ox - band / 2, oy - band / 2], [ox + grid + band / 2, oy - band / 2],
                  [ox - band / 2, oy + grid + band / 2], [ox + grid + band / 2, oy + grid + band / 2]];
    boss.forEach(function (p) {
      ctx.fillStyle = EDGE;
      ctx.beginPath(); ctx.arc(p[0], p[1], band * 0.52, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = INK;
      ctx.beginPath(); ctx.arc(p[0], p[1], band * 0.38, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = GROOVE;
      ctx.beginPath(); ctx.arc(p[0], p[1], band * 0.15, 0, Math.PI * 2); ctx.fill();
    });

    // ---- Knot field ----
    // Each cell is either a crossing (X) or a turn (two quarter-arcs).
    // Border cells always turn inward: strands turn at every wall.
    // At crossings, the over-strand alternates by (i+j) parity: over, under, over…
    const gap = w * 0.85; // half-gap cut in the under-strand at a crossing
    for (let j = 0; j < N; j++) {
      for (let i = 0; i < N; i++) {
        const x0 = ox + i * s, y0 = oy + j * s;
        const cx = x0 + s / 2, cy = y0 + s / 2;
        const border = (i === 0 || j === 0 || i === N - 1 || j === N - 1);
        const isTurn = border || rnd() < 0.28;
        if (!isTurn) {
          // Crossing: \ and / diagonals; parity decides which passes over.
          const overBackslash = ((i + j) % 2 === 0);
          const diag = function (bs) {
            return bs
              ? [[x0, y0], [x0 + s, y0 + s]]
              : [[x0 + s, y0], [x0, y0 + s]];
          };
          const under = diag(!overBackslash), over = diag(overBackslash);
          // Under-strand in two halves, stopping short of the centre.
          const ux = (under[1][0] - under[0][0]) / 2, uy = (under[1][1] - under[0][1]) / 2;
          const ul = Math.hypot(ux, uy), gx = ux / ul * gap, gy = uy / ul * gap;
          strand(function () {
            ctx.moveTo(under[0][0], under[0][1]); ctx.lineTo(cx - gx, cy - gy);
          }, w);
          strand(function () {
            ctx.moveTo(cx + gx, cy + gy); ctx.lineTo(under[1][0], under[1][1]);
          }, w);
          // Over-strand runs straight through.
          strand(function () {
            ctx.moveTo(over[0][0], over[0][1]); ctx.lineTo(over[1][0], over[1][1]);
          }, w);
        } else {
          // Turn: two quarter-arcs joining adjacent edges.
          // Border cells turn toward the inside; inner turns pick a corner.
          let corner;
          if (border) {
            if (j === 0 && i === 0) corner = 3;            // SE corner arcs
            else if (j === 0 && i === N - 1) corner = 2;
            else if (j === N - 1 && i === 0) corner = 0;
            else if (j === N - 1 && i === N - 1) corner = 1;
            else if (j === 0) corner = rnd() < 0.5 ? 2 : 3;
            else if (j === N - 1) corner = rnd() < 0.5 ? 0 : 1;
            else if (i === 0) corner = rnd() < 0.5 ? 0 : 3;
            else corner = rnd() < 0.5 ? 1 : 2;
          } else {
            corner = Math.floor(rnd() * 4);
          }
          // corner 0: arcs centred on top-left (joins top+left edges, twice offset)
          // corner 1: top-right, 2: bottom-right, 3: bottom-left.
          const px = [x0, x0 + s, x0 + s, x0][corner];
          const py = [y0, y0, y0 + s, y0 + s][corner];
          const a0 = [0, Math.PI / 2, Math.PI, -Math.PI / 2][corner];
          [0.5, 1.0].forEach(function (k) {
            const r = s * 0.5 * k + s * 0.06;
            strand(function () {
              ctx.arc(px, py, r, a0, a0 + Math.PI / 2);
            }, w * 0.9);
          });
        }
      }
    }
  }

  window.addEventListener('pointerdown', function () {
    seed = (Math.random() * 0xffffffff) >>> 0;
    draw();
  });

  resize();
})();
</script>
</body>
</html>
