<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Over Under · №8947</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #efe4cc; overscroll-behavior: none;
  }
  #stage { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: pointer; }
  #cap {
    position: fixed; left: 14px; bottom: 12px; max-width: 72vw;
    font: 400 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.01em; pointer-events: none; user-select: none;
    -webkit-user-select: none; color: #4a3b28;
    opacity: 0; transition: opacity 0.9s ease;
  }
  #seedtag {
    position: fixed; right: 14px; bottom: 12px;
    font: 400 11px/1.4 system-ui, sans-serif;
    pointer-events: none; user-select: none; -webkit-user-select: none; color: #4a3b28;
    opacity: 0.55;
  }
  @media (max-width: 480px) {
    #cap { font-size: 11.5px; max-width: 60vw; }
    #cap .tagline { display: none; }
    #seedtag { font-size: 10px; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="cap">Over Under<span class="tagline"> · a knot that never decides</span> · click for a fresh knot</div>
<div id="seedtag"></div>
<script>
"use strict";
/* ============================================================
   Over Under — №8947 (2026-07-10)
   Seeded Celtic knotwork: strands traced on a barrier grid where
   every wall forces a turn, crossings alternate over/under by
   cell parity, and each strap is shaded as a tube (outline,
   base, inner, highlight) with a cast shadow under every
   over-pass. A two-strand plait braids the full perimeter of
   the frame, pinned at the corners by bosses. Warm grained
   paper, four curated palettes. Click mints a fresh knot.
   ============================================================ */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const sm = /[?&]seed=(\d+)/.exec(location.search);
let seed = sm ? (parseInt(sm[1], 10) >>> 0) : 427;
let rng = mulberry32(seed);

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const capEl = document.getElementById("cap");
const tagEl = document.getElementById("seedtag");
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  generate();
}
window.addEventListener("resize", resize);

/* ---------------- palettes ---------------- */
const PALETTES = [
  { bg: "#f0e6cf", field: "#e9dcbe", grainD: "#8a6f4d", grainL: "#fffbeF",
    straps: ["#7c2f2b", "#31437a"], outline: "#2a1a12", inner: ["#a8544f", "#5a6ea8"],
    hi: "#f3e3c2", boss: "#b98a2f", bossRing: "#6e4f1c", rule: "#6b5638", cap: "#4a3b28" },
  { bg: "#e7e2d4", field: "#ded8c4", grainD: "#7d7260", grainL: "#fbf8ee",
    straps: ["#2f5d3a", "#a34a24"], outline: "#20241a", inner: ["#5d8a64", "#c47a4a"],
    hi: "#efe8d2", boss: "#8a6d2f", bossRing: "#54431c", rule: "#5c5546", cap: "#3d3a2e" },
  { bg: "#232a3f", field: "#1e2436", grainD: "#0d1019", grainL: "#4a5878",
    straps: ["#cfc39f", "#9a5f30"], outline: "#0e121c", inner: ["#e6dcc0", "#c07f45"],
    hi: "#f6efda", boss: "#c9a227", bossRing: "#7a5f14", rule: "#5a6480", cap: "#b9b0a0" },
  { bg: "#dfe0cd", field: "#d5d6bf", grainD: "#8a8a6d", grainL: "#f4f5e6",
    straps: ["#3a5a78", "#7a3b2e"], outline: "#1d2420", inner: ["#6488a8", "#a85f4e"],
    hi: "#ecebce", boss: "#97812f", bossRing: "#5a4d18", rule: "#62624c", cap: "#3f4432" }
];
let PAL = PALETTES[0];

/* ---------------- geometry state ---------------- */
let strands = [];        // {pts:[{x,y}], ci: color index, cross:[{x,y,orient}]}
let crossings = [];      // {x,y,over:'ns'|'ew', strand}
let borderStrands = [];  // {pts, ci}
let borderCross = [];    // {x,y,tx,ty,ci}
let bosses = [];         // {x,y,r}
let frame = null;        // border rect + plait params
let field = null;        // knot field rect
let knotW = 0;           // strap width
let grain = null;
let animT = 1, animating = false, animStart = 0;
const ANIM_MS = 1900;

function shade(hex, f) { // f>0 lighten, f<0 darken
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f >= 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  else { r *= (1 + f); g *= (1 + f); b *= (1 + f); }
  return "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";
}

/* ---------------- knot generation ---------------- */
function generate() {
  rng = mulberry32(seed ^ 0x9e3779b9);
  PAL = PALETTES[(rng() * PALETTES.length) | 0];
  document.body.style.background = PAL.bg;
  capEl.style.color = PAL.cap; tagEl.style.color = PAL.cap;
  tagEl.textContent = "№8947 · seed " + seed;

  const m = Math.max(16, Math.min(W, H) * 0.05);
  const capH = 52;
  const bx0 = m, by0 = m, bx1 = W - m, by1 = H - m - capH;

  // plait params
  const A = Math.max(8, Math.min(20, Math.min(W, H) * 0.022));
  const bw = A * 0.95;
  const r = Math.min(46, Math.min(bx1 - bx0, by1 - by0) * 0.12);
  frame = { x0: bx0, y0: by0, x1: bx1, y1: by1, r: r, A: A, bw: bw };
  buildBorder();

  // knot field inside the frame
  const pad = A * 2 + bw + 20;
  const fx0 = bx0 + pad, fy0 = by0 + pad, fx1 = bx1 - pad, fy1 = by1 - pad;
  field = { x0: fx0, y0: fy0, x1: fx1, y1: fy1 };

  // grid sized to fill the field: cells follow the field aspect
  const s0 = Math.min(fx1 - fx0, fy1 - fy0) / 6.5;
  const gw = Math.max(6, Math.min(12, Math.round((fx1 - fx0) / s0)));
  const gh = Math.max(5, Math.min(16, Math.round((fy1 - fy0) / s0)));
  const s = Math.min((fx1 - fx0) / gw, (fy1 - fy0) / gh);
  const ox = (fx0 + fx1) / 2 - (gw * s) / 2;
  const oy = (fy0 + fy1) / 2 - (gh * s) / 2;
  knotW = s * (0.30 + rng() * 0.08);
  const wp = 0.40 + rng() * 0.12;
  buildKnot(gw, gh, s, ox, oy, wp);

  buildGrain();
  capEl.style.opacity = "0";
  animStart = performance.now(); animT = 0; animating = true;
  requestAnimationFrame(tick);
  setTimeout(() => { capEl.style.opacity = "1"; }, 350);
}

function buildKnot(gw, gh, s, ox, oy, wp) {
  // walls: vedge[i][j] i=0..gw (vertical lines), hedge[i][j] j=0..gh
  const vedge = [], hedge = [];
  for (let i = 0; i <= gw; i++) {
    vedge[i] = [];
    for (let j = 0; j < gh; j++)
      // boundary edges are usually walled so strands turn back and close
      vedge[i][j] = rng() < ((i === 0 || i === gw) ? 0.9 : wp);
  }
  for (let i = 0; i < gw; i++) {
    hedge[i] = [];
    for (let j = 0; j <= gh; j++)
      hedge[i][j] = rng() < ((j === 0 || j === gh) ? 0.9 : wp);
  }
  const wallsOf = (i, j) => ({
    n: hedge[i][j], s: hedge[i][j + 1], w: vedge[i][j], e: vedge[i + 1][j]
  });
  // never allow a fully walled cell
  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
    let w = wallsOf(i, j), n = (w.n ? 1 : 0) + (w.s ? 1 : 0) + (w.w ? 1 : 0) + (w.e ? 1 : 0);
    while (n === 4) {
      const k = ["n", "s", "w", "e"][(rng() * 4) | 0];
      if (k === "n") hedge[i][j] = false;
      else if (k === "s") hedge[i][j + 1] = false;
      else if (k === "w") vedge[i][j] = false;
      else vedge[i + 1][j] = false;
      w = wallsOf(i, j);
      n = (w.n ? 1 : 0) + (w.s ? 1 : 0) + (w.w ? 1 : 0) + (w.e ? 1 : 0);
    }
  }

  const adj = { n: ["e", "w"], e: ["n", "s"], s: ["e", "w"], w: ["n", "s"] };
  const mid = (i, j, e) => {
    if (e === "n") return { x: ox + (i + 0.5) * s, y: oy + j * s };
    if (e === "s") return { x: ox + (i + 0.5) * s, y: oy + (j + 1) * s };
    if (e === "w") return { x: ox + i * s, y: oy + (j + 0.5) * s };
    return { x: ox + (i + 1) * s, y: oy + (j + 0.5) * s };
  };
  const key = (p) => Math.round(p.x * 100) + ":" + Math.round(p.y * 100);

  const segs = [];
  const nodeMap = {};
  const addNode = (p, si) => {
    const k = key(p);
    (nodeMap[k] = nodeMap[k] || []).push(si);
  };
  crossings = [];

  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
    const w = wallsOf(i, j);
    const paired = {}, pairs = [];
    for (const e of ["n", "e", "s", "w"]) {
      if (!w[e] || paired[e]) continue;
      const opts = adj[e].filter((k) => !paired[k]);
      const pick = opts[(rng() * opts.length) | 0];
      paired[e] = pick; paired[pick] = e; pairs.push([e, pick]);
    }
    const rest = ["n", "e", "s", "w"].filter((k) => !paired[k]);
    if (rest.length === 4) pairs.push(["n", "s"], ["e", "w"]);
    else if (rest.length === 2) pairs.push([rest[0], rest[1]]);
    const cx = ox + (i + 0.5) * s, cy = oy + (j + 0.5) * s;
    const isCross = pairs.length === 2 &&
      ((pairs[0][0] === "n" && pairs[0][1] === "s") || (pairs[0][0] === "s" && pairs[0][1] === "n"));
    for (const [a, b] of pairs) {
      const sg = { pts: [mid(i, j, a), { x: cx, y: cy }, mid(i, j, b)], used: false, cross: null };
      if (isCross) {
        const orient = (a === "n" || a === "s") ? "ns" : "ew";
        sg.cross = { x: cx, y: cy, orient: orient };
      }
      const si = segs.length;
      segs.push(sg);
      addNode(sg.pts[0], si); addNode(sg.pts[2], si);
    }
    if (isCross) crossings.push({ x: cx, y: cy, over: ((i + j) % 2 === 0) ? "ns" : "ew", i: i, j: j });
  }

  // trace strands through shared nodes
  strands = [];
  const twoTone = rng() < 0.55;
  for (let si = 0; si < segs.length; si++) {
    if (segs[si].used) continue;
    segs[si].used = true;
    const pts = segs[si].pts.slice();
    const tags = segs[si].cross ? [segs[si].cross] : [];
    for (let end = 0; end < 2; end++) {
      for (;;) {
        const p = end === 0 ? pts[0] : pts[pts.length - 1];
        const cands = (nodeMap[key(p)] || []).filter((c) => !segs[c].used);
        if (!cands.length) break;
        const ns = segs[cands[0]]; ns.used = true;
        if (ns.cross) tags.push(ns.cross);
        const np = ns.pts;
        if (key(np[0]) === key(p)) {
          if (end === 0) pts.unshift(np[1], np[2]); else pts.push(np[1], np[2]);
        } else {
          if (end === 0) pts.unshift(np[1], np[0]); else pts.push(np[1], np[0]);
        }
      }
    }
    strands.push({ pts: pts, cross: tags, ci: 0 });
  }
  strands.forEach((st, idx) => { st.ci = twoTone ? idx % 2 : 0; });
  // resolve over-strand per crossing
  for (const c of crossings) {
    c.strand = null;
    for (const st of strands) {
      for (const t of st.cross) {
        if (Math.abs(t.x - c.x) < 0.01 && Math.abs(t.y - c.y) < 0.01 && t.orient === c.over) {
          c.strand = st; break;
        }
      }
      if (c.strand) break;
    }
  }
}

/* ---------------- plaited border ---------------- */
function buildBorder() {
  const f = frame;
  const segs = [];
  const x0 = f.x0, y0 = f.y0, x1 = f.x1, y1 = f.y1, r = f.r;
  const line = (ax, ay, bx, by) => {
    const len = Math.hypot(bx - ax, by - ay);
    segs.push({ t: "l", ax: ax, ay: ay, bx: bx, by: by, len: len });
  };
  const arc = (cx, cy, a0, a1) => {
    const len = Math.abs(a1 - a0) * r;
    segs.push({ t: "a", cx: cx, cy: cy, a0: a0, a1: a1, len: len });
  };
  line(x0 + r, y0, x1 - r, y0); arc(x1 - r, y0 + r, -Math.PI / 2, 0);
  line(x1, y0 + r, x1, y1 - r); arc(x1 - r, y1 - r, 0, Math.PI / 2);
  line(x1 - r, y1, x0 + r, y1); arc(x0 + r, y1 - r, Math.PI / 2, Math.PI);
  line(x0, y1 - r, x0, y0 + r); arc(x0 + r, y0 + r, Math.PI, Math.PI * 1.5);
  let L = 0;
  for (const s of segs) { s.start = L; L += s.len; }
  const at = (sd) => {
    let d = ((sd % L) + L) % L;
    for (const s of segs) {
      if (d > s.start + s.len + 1e-9) continue;
      const u = Math.min(1, Math.max(0, (d - s.start) / s.len));
      if (s.t === "l") {
        const dx = s.bx - s.ax, dy = s.by - s.ay, l = s.len || 1;
        return { x: s.ax + dx * u, y: s.ay + dy * u, tx: dx / l, ty: dy / l };
      }
      const a = s.a0 + (s.a1 - s.a0) * u;
      const dir = s.a1 > s.a0 ? 1 : -1;
      return { x: s.cx + r * Math.cos(a), y: s.cy + r * Math.sin(a),
               tx: -Math.sin(a) * dir, ty: Math.cos(a) * dir };
    }
    return at(0);
  };
  const k = Math.max(16, Math.min(34, Math.round(L / (f.A * 7))));
  const N = 1500, A = f.A;
  const mk = (sgn) => {
    const pts = [];
    for (let n = 0; n <= N; n++) {
      const sd = (n / N) * L;
      const b = at(sd);
      const off = sgn * A * Math.sin(2 * Math.PI * k * sd / L);
      pts.push({ x: b.x - b.ty * off, y: b.y + b.tx * off });
    }
    return pts;
  };
  borderStrands = [{ pts: mk(1), ci: 0 }, { pts: mk(-1), ci: 1 % PAL.straps.length }];
  if (PAL.straps.length < 2) borderStrands[1].ci = 0;
  borderCross = [];
  const eps = L / 4000;
  for (let mi = 0; mi < 2 * k; mi++) {
    const sd = (mi / (2 * k)) * L;
    const b = at(sd);
    const pA = (dd) => {
      const bb = at(sd + dd);
      const off = A * Math.sin(2 * Math.PI * k * (sd + dd) / L);
      return { x: bb.x - bb.ty * off, y: bb.y + bb.tx * off };
    };
    const p0 = pA(-eps), p1 = pA(eps);
    let tx = p1.x - p0.x, ty = p1.y - p0.y;
    const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    borderCross.push({ x: b.x, y: b.y, tx: tx, ty: ty, ci: (mi % 2 === 0) ? 0 : borderStrands[1].ci });
  }
  bosses = [
    { x: x0 + r, y: y0 + r }, { x: x1 - r, y: y0 + r },
    { x: x1 - r, y: y1 - r }, { x: x0 + r, y: y1 - r }
  ].map((p) => ({ x: p.x, y: p.y, r: A * 1.55 }));
  frame.perim = { at: at, L: L };
}

/* ---------------- paper grain ---------------- */
function buildGrain() {
  grain = document.createElement("canvas");
  grain.width = canvas.width; grain.height = canvas.height;
  const g = grain.getContext("2d");
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const gr = mulberry32((seed ^ 0x51ab) >>> 0);
  const n = Math.round(W * H / 90);
  for (let i = 0; i < n; i++) {
    const x = gr() * W, y = gr() * H;
    g.fillStyle = gr() < 0.55 ? PAL.grainD : PAL.grainL;
    g.globalAlpha = 0.02 + gr() * 0.05;
    const sz = 0.6 + gr() * 1.4;
    g.fillRect(x, y, sz, sz);
  }
  g.globalAlpha = 1;
  g.strokeStyle = PAL.grainD; g.lineWidth = 0.7;
  for (let i = 0; i < 420; i++) {
    const x = gr() * W, y = gr() * H, a = gr() * Math.PI, l = 3 + gr() * 7;
    g.globalAlpha = 0.03 + gr() * 0.04;
    g.beginPath(); g.moveTo(x, y);
    g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  g.globalAlpha = 1;
}

/* ---------------- drawing ---------------- */
function strapCols(ci) {
  const base = PAL.straps[ci % PAL.straps.length];
  const inner = PAL.inner[ci % PAL.inner.length];
  return { outline: PAL.outline, base: base, inner: inner, hi: PAL.hi };
}
function pathFrom(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2;
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
  }
  const l = pts[pts.length - 1];
  ctx.lineTo(l.x, l.y);
}
function polyLen(pts) {
  let L = 0;
  for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
  return L;
}
function tube(pts, w, cols, p) {
  if (!pts.length || p <= 0.001) return;
  pathFrom(pts);
  const len = polyLen(pts);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const layers = [[w * 1.08, cols.outline], [w, cols.base], [w * 0.62, cols.inner], [w * 0.20, cols.hi]];
  for (const [lw, c] of layers) {
    ctx.strokeStyle = c; ctx.lineWidth = lw;
    ctx.setLineDash([Math.max(len * p, 0.001), len + 2]);
    ctx.stroke();
  }
  ctx.setLineDash([]);
}
function overpass(x, y, tx, ty, w, cols, alpha) {
  const L = w * 1.55;
  const x0 = x - tx * L, y0 = y - ty * L, x1 = x + tx * L, y1 = y + ty * L;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineCap = "round";
  ctx.strokeStyle = "rgba(0,0,0,0.32)"; ctx.lineWidth = w * 1.34;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  const layers = [[w * 1.08, cols.outline], [w, cols.base], [w * 0.62, cols.inner], [w * 0.20, cols.hi]];
  for (const [lw, c] of layers) {
    ctx.strokeStyle = c; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }
  ctx.restore();
}
function rr(x0, y0, x1, y1, r) {
  ctx.beginPath();
  ctx.moveTo(x0 + r, y0);
  ctx.lineTo(x1 - r, y0); ctx.arcTo(x1, y0, x1, y0 + r, r);
  ctx.lineTo(x1, y1 - r); ctx.arcTo(x1, y1, x1 - r, y1, r);
  ctx.lineTo(x0 + r, y1); ctx.arcTo(x0, y1, x0, y1 - r, r);
  ctx.lineTo(x0, y0 + r); ctx.arcTo(x0, y0, x0 + r, y0, r);
  ctx.closePath();
}
const ease = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

function draw(p) {
  ctx.fillStyle = PAL.bg;
  ctx.fillRect(0, 0, W, H);
  if (grain) ctx.drawImage(grain, 0, 0, W, H);

  // knot field
  ctx.fillStyle = PAL.field;
  rr(field.x0, field.y0, field.x1, field.y1, 10); ctx.fill();
  ctx.strokeStyle = PAL.rule; ctx.globalAlpha = 0.55; ctx.lineWidth = 1;
  rr(field.x0, field.y0, field.x1, field.y1, 10); ctx.stroke();
  ctx.globalAlpha = 1;

  // frame hairlines
  const f = frame, off = f.A + f.bw * 0.9 + 7;
  ctx.strokeStyle = PAL.rule; ctx.globalAlpha = 0.6; ctx.lineWidth = 1;
  rr(f.x0 - off, f.y0 - off, f.x1 + off, f.y1 + off, f.r + off); ctx.stroke();
  rr(f.x0 + off, f.y0 + off, f.x1 - off, f.y1 - off, Math.max(4, f.r - off)); ctx.stroke();
  ctx.globalAlpha = 1;

  // strands with staggered reveal
  const all = [];
  strands.forEach((s) => all.push({ kind: "k", s: s }));
  borderStrands.forEach((s) => all.push({ kind: "b", s: s }));
  all.forEach((it, idx) => {
    const d = idx * 0.012;
    const lp = Math.min(1, Math.max(0, (p - d) / (1 - d * 2)));
    const w = it.kind === "k" ? knotW : f.bw;
    tube(it.s.pts, w, strapCols(it.s.ci), ease(Math.min(1, lp * 1.15)));
  });

  // over-passes fade in at the end
  const oa = Math.min(1, Math.max(0, (p - 0.86) / 0.14));
  if (oa > 0) {
    for (const c of crossings) {
      if (!c.strand) continue;
      const tx = c.over === "ns" ? 0 : 1, ty = c.over === "ns" ? 1 : 0;
      overpass(c.x, c.y, tx, ty, knotW, strapCols(c.strand.ci), oa);
    }
    for (const c of borderCross) overpass(c.x, c.y, c.tx, c.ty, f.bw, strapCols(c.ci), oa);
    // bosses
    for (const b of bosses) {
      ctx.save(); ctx.globalAlpha = oa;
      ctx.fillStyle = PAL.bossRing;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = PAL.boss;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.72, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = shade(PAL.boss, 0.25);
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.34, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = PAL.outline;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.12, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
}

function tick(now) {
  if (!animating) return;
  animT = Math.min(1, (now - animStart) / ANIM_MS);
  draw(ease(animT));
  if (animT < 1) requestAnimationFrame(tick);
  else { animating = false; draw(1); }
}

canvas.addEventListener("click", () => {
  seed = (Math.random() * 4294967296) >>> 0;
  generate();
});

resize();
</script>
