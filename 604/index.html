<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un Jardín</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#EFE9DC; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var PAPER='#EFE9DC', SAGE='#A8B89A', PEACH='#E8C4A8', GRAY='#B8B4AA',
    INK='#1A1A1A', BLUE='#A8C4D4', NAVY='#2B4A6F', ORANGE='#E09A5A';
var SW=1000, SH=700;
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var vw=SW, vh=SH, dpr=1;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rng=mulberry32(604073);        /* build-time geometry stream */
var spawnRng=mulberry32(604999);  /* interaction stream: advances only on taps */

/* ================= stepped stopmotion clock =================
   STEP seconds per held frame. Every animated value is a pure function of the
   integer step count s = floor(t / STEP), so the picture only ever changes on
   step boundaries: 2-3 held frames per beat, no smooth tweening anywhere. */
var STEP=0.24;
var TRI=[0,0.5,1,0.5,0,-0.5,-1,-0.5];      /* sway table; TRI[0]=TRI[4]=0 */
var JIT=[0,1,-1,0,-1,1];                   /* positional jitter; JIT[0]=0 */
var RUST=[0,1.7,-1.3,0.9,-0.55,0.3,0];      /* rustle decay, in degrees */

/* ================= precomputed shape helpers ================= */
function jit(amt){ return (rng()*2-1)*amt; }
function blobPts(cx,cy,rx,ry,amt,n,flat){
  var pts=[], i, a, x, y;
  n=n||16;
  for(i=0;i<n;i++){ a=i/n*Math.PI*2; x=cx+Math.cos(a)*rx+jit(amt); y=cy+Math.sin(a)*ry+jit(amt);
    if(flat && y>cy+ry*0.55) y=cy+ry*0.55+(y-cy-ry*0.55)*0.25;
    pts.push([x,y]); }
  return pts;
}
function pathOf(pts){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.closePath(); }
function fillPts(pts,color){ pathOf(pts); ctx.fillStyle=color; ctx.fill(); }
function strokePts(pts,color,lw,close){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); if(close) ctx.closePath(); ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.stroke(); }
function cubic(p0,p1,p2,p3,n){
  var pts=[], i, t, u, x, y;
  for(i=0;i<=n;i++){ t=i/n; u=1-t;
    x=u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0];
    y=u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1];
    pts.push([x+jit(0.7),y+jit(0.7)]); }
  return pts;
}
function shadow(x,y,rx,ry,a){
  ctx.save(); ctx.translate(x,y); ctx.scale(rx,ry); ctx.globalAlpha=a; ctx.beginPath(); ctx.arc(0,0,1,0,7); ctx.fillStyle=INK; ctx.fill(); ctx.restore(); }

/* ================= paper grain ================= */
var grain=[], fibers=[];
(function(){ var i;
  for(i=0;i<320;i++) grain.push([rng()*SW, rng()*SH, 0.5+rng()*1.2]);
  for(i=0;i<70;i++) fibers.push([rng()*SW, rng()*SH, (rng()*2-1)*9, (rng()*2-1)*3]);
})();

/* ================= plants =================
   Each plant is built once in local coords (base at 0,0, growing up -y) and
   drawn rotated about its base by a stepped sway angle. layer: 0 back, 1 mid,
   2 front. amp in radians at table peak; hold = steps per sway tick; ph in
   {0,4} so every plant sits at angle 0 on step 0. */
var plants=[];
function addPlant(p){ p.rustleStep=-99; plants.push(p); return p; }

function makeFern(x,y,scale,layer,amp,hold,ph,color){
  var fronds=[], f, i, t;
  var nF=5+Math.floor(rng()*3);
  for(f=0;f<nF;f++){
    var lean=(f-(nF-1)/2)*0.16+jit(0.05), h=(175+rng()*85)*scale, leaf=[];
    var stem=cubic([0,0],[lean*h*0.2,-h*0.45],[lean*h*0.85,-h*0.8],[lean*h,-h],10);
    for(i=2;i<=9;i++){ t=i/10;
      var px=lean*h*t, py=-h*(0.28+0.68*t*t*0.4+0.6*t)*1.0, len=(1-t)*30*scale+5;
      py=-h*(t*0.92+0.08*t*t);
      leaf.push([px,py,px-len,py-len*0.42,px+len,py-len*0.42]);
    }
    fronds.push({stem:stem, leaf:leaf});
  }
  return addPlant({kind:'fern',x:x,y:y,layer:layer,amp:amp,hold:hold,ph:ph,color:color,fronds:fronds,hr:58*scale});
}
function makePod(x,y,scale,layer,amp,hold,ph,color,perf,dots){
  var lean=jit(0.14), h=(150+rng()*55)*scale;
  var stem=cubic([0,0],[lean*h*0.3,-h*0.4],[lean*h*0.7,-h*0.75],[lean*h,-h],10);
  var bulb=blobPts(lean*h,-h-20*scale,26*scale,33*scale,1.6,14,false);
  var holes=[], i;
  if(perf){ var nh=3+Math.floor(rng()*3);
    for(i=0;i<nh;i++) holes.push([lean*h+(rng()*2-1)*14*scale, -h-20*scale+(rng()*2-1)*19*scale, 2.4*scale+rng()*1.6*scale]);
  }
  var dotPts=[];
  if(dots){ for(i=0;i<4;i++) dotPts.push([lean*h+(rng()*2-1)*16*scale, -h-20*scale+(rng()*2-1)*21*scale]); }
  return addPlant({kind:'pod',x:x,y:y,layer:layer,amp:amp,hold:hold,ph:ph,color:color,stem:stem,bulb:bulb,holes:holes,dotPts:dotPts,hr:52*scale});
}
function makeCurl(x,y,scale,layer,amp,hold,ph,color){
  var pts=[], a, r, turns=1.5+ (rng()*0.5), H=(215+rng()*80)*scale, dir=rng()<0.5?1:-1;
  for(a=0;a<=44;a++){ var t=a/44; r=(1-t)*26*scale;
    pts.push([Math.cos(t*turns*Math.PI*2*dir)*r + t*10*scale*dir, -t*H + Math.sin(t*turns*Math.PI*2*dir)*r*0.4 + jit(0.6)]);
  }
  var tip=blobPts(pts[44][0],pts[44][1],5*scale,7*scale,0.8,9,false);
  return addPlant({kind:'curl',x:x,y:y,layer:layer,amp:amp,hold:hold,ph:ph,color:color,pts:pts,tip:tip,lw:3.4*scale,hr:56*scale});
}

/* back layer: paler, smaller, behind the elephants */
makeFern(150,606,0.95,0,0.020,2,0,SAGE);
makeCurl(258,600,1.0,0,0.016,2,4,NAVY);
makePod(648,600,0.92,0,0.022,1,4,SAGE,true,false);
makePod(764,604,0.85,0,0.018,2,0,GRAY,false,true);
makeCurl(884,602,0.92,0,0.020,1,0,SAGE);
makeFern(952,608,0.72,0,0.017,2,4,SAGE);
/* mid layer */
makeFern(64,622,0.95,1,0.024,1,0,SAGE);
makePod(700,624,0.95,1,0.026,1,0,PEACH,true,false);
makeCurl(826,620,0.95,1,0.022,2,4,NAVY);
makeFern(592,620,0.85,1,0.020,2,0,SAGE);
makePod(902,626,0.88,1,0.024,1,4,PEACH,false,true);
/* front layer: big corner pieces */
makeFern(36,694,1.25,2,0.028,1,4,SAGE);
makePod(958,692,1.15,2,0.026,2,0,GRAY,true,false);
makeCurl(120,690,1.05,2,0.020,1,0,NAVY);

function swayAngle(p,s){
  var idx=(Math.floor(s/p.hold)+p.ph)%8; if(idx<0) idx+=8;
  var a=p.amp*TRI[idx];
  var rs=s-p.rustleStep;
  if(rs>=0 && rs<RUST.length) a+=RUST[rs]*Math.PI/180*1.6;
  return a;
}
function drawPlant(p,s){
  ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(swayAngle(p,s));
  shadow(6,4,44,7,p.layer===0?0.05:0.08);
  var i, j;
  if(p.kind==='fern'){
    for(i=0;i<p.fronds.length;i++){
      var f=p.fronds[i];
      strokePts(f.stem,p.color,3,false);
      ctx.strokeStyle=p.color; ctx.lineWidth=2;
      for(j=0;j<f.leaf.length;j++){ var L=f.leaf[j];
        ctx.beginPath(); ctx.moveTo(L[0],L[1]); ctx.lineTo(L[2],L[3]); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(L[0],L[1]); ctx.lineTo(L[4],L[5]); ctx.stroke(); }
    }
  } else if(p.kind==='pod'){
    strokePts(p.stem,p.color,4.2,false);
    fillPts(p.bulb,p.color);
    for(i=0;i<p.holes.length;i++){ ctx.beginPath(); ctx.arc(p.holes[i][0],p.holes[i][1],p.holes[i][2],0,7); ctx.fillStyle=PAPER; ctx.fill(); }
    ctx.fillStyle=ORANGE;
    for(i=0;i<p.dotPts.length;i++){ ctx.beginPath(); ctx.arc(p.dotPts[i][0],p.dotPts[i][1],2.2,0,7); ctx.fill(); }
  } else {
    strokePts(p.pts,p.color,p.lw,false);
    fillPts(p.tip,p.color);
  }
  ctx.restore();
}

/* ================= the elephant pair =================
   One cut shape, precomputed once; drawn big in ink and small in pale blue.
   Local coords: ground line y=0, facing +x. Anchor zone on stage:
   x 195-565, y 400-605 (creatures are zoned to never cross it). */
var ELE={ body:blobPts(0,-98,102,64,2.2,22,false),
          head:blobPts(88,-118,40,40,1.6,16,false),
          ear:blobPts(46,-112,25,33,1.4,14,false),
          trunk:cubic([112,-102],[128,-72],[112,-34],[80,-36],12),
          tail:cubic([-100,-112],[-116,-92],[-114,-66],[-106,-56],8) };
function drawElephant(x,y,scale,color,eyeColor){
  ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
  shadow(0,4,128,13,0.09);
  ctx.fillStyle=color;
  var legs=[[-64,-54,21,54],[-32,-54,19,54],[30,-54,21,54],[62,-54,19,54]], i;
  for(i=0;i<4;i++){ ctx.fillRect(legs[i][0],legs[i][1],legs[i][2],legs[i][3]); }
  strokePts(ELE.tail,color,5,false);
  ctx.beginPath(); ctx.arc(-106,-52,5,0,7); ctx.fill();
  fillPts(ELE.body,color);
  fillPts(ELE.ear,color);
  strokePts(ELE.ear,'rgba(239,233,220,0.45)',1.8,true);
  strokePts(ELE.trunk,color,17,false);
  fillPts(ELE.head,color);
  ctx.beginPath(); ctx.arc(99,-124,3.6,0,7); ctx.fillStyle=eyeColor; ctx.fill();
  ctx.restore();
}

/* ================= Hugos creatures =================
   Zones keep every waypoint loop (and the straight hops between them) clear
   of the elephant zone x 195-565 / y 400-605:
   A: left strip, B: right field, C: front strip below the elephants' feet. */
var ZONES={ A:[40,175,545,650], B:[590,955,530,650], C:[70,930,620,652] };
function makeLoop(zone,n){
  var z=ZONES[zone], pts=[], i;
  for(i=0;i<n;i++) pts.push([z[0]+spawnRng()*(z[1]-z[0]), z[2]+spawnRng()*(z[3]-z[2])]);
  return pts;
}
function loopMetrics(pts){
  var seg=[], total=0, i, a, b, dx, dy, d;
  for(i=0;i<pts.length;i++){ a=pts[i]; b=pts[(i+1)%pts.length]; dx=b[0]-a[0]; dy=b[1]-a[1]; d=Math.sqrt(dx*dx+dy*dy); seg.push(d); total+=d; }
  return {seg:seg,total:total};
}
var CREATURE_COLORS=[SAGE,PEACH,GRAY,NAVY,PEACH,SAGE];
function makeCreature(zone,birthStep,seeded){
  var stream=seeded?rng:spawnRng;
  var col=CREATURE_COLORS[Math.floor(stream()*CREATURE_COLORS.length)];
  var kind=Math.floor(stream()*3);           /* 0 plain, 1 beak, 2 antenna */
  var sc=1.0+stream()*0.5;
  var body=blobPts(0,0,29*sc,23*sc,1.5,14,true);
  var pts=makeLoop(zone,4+Math.floor(spawnRng()*3));
  if(birthStep!==null){ pts.unshift(zone==='A'||zone==='C'&&spawnRng()<0.5?[16,636]:[984,636]); }
  var m=loopMetrics(pts);
  return { body:body, color:col, kind:kind, sc:sc, pts:pts, seg:m.seg, total:m.total,
           hop:4.6+stream()*2.2, birth:(birthStep===null?0:birthStep), phase:Math.floor(stream()*6) };
}
var creatures=[
  makeCreature('A',null,true), makeCreature('B',null,true), makeCreature('C',null,true),
  makeCreature('B',null,true), makeCreature('A',null,true)
];
function creaturePos(c,s){
  var age=s-c.birth; if(age<0) age=0;
  var d=(age*c.hop)%c.total, i=0;
  while(d>c.seg[i]){ d-=c.seg[i]; i=(i+1)%c.pts.length; }
  var a=c.pts[i], b=c.pts[(i+1)%c.pts.length], f=c.seg[i]===0?0:d/c.seg[i];
  return { x:a[0]+(b[0]-a[0])*f, y:a[1]+(b[1]-a[1])*f, dir:(b[0]-a[0])<0?-1:1 };
}
function drawCreature(c,s){
  var p=creaturePos(c,s);
  var age=s-c.birth;
  var pop=age<=0?0.35:(age===1?0.7:1);       /* stepped pop-in over 2 steps */
  var bob=(s%2===0)?0:-3;
  var jx=JIT[(s+c.phase)%6]*0.9;
  ctx.save(); ctx.translate(p.x+jx,p.y+bob); ctx.scale(p.dir*pop,pop);
  shadow(0,3,30*c.sc,5,0.08);
  ctx.strokeStyle=INK; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-10*c.sc,14*c.sc); ctx.lineTo(-10*c.sc,19*c.sc); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10*c.sc,14*c.sc); ctx.lineTo(10*c.sc,19*c.sc); ctx.stroke();
  fillPts(c.body,c.color);
  if(c.kind===2){ ctx.strokeStyle=INK; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(0,-20*c.sc); ctx.quadraticCurveTo(3*c.sc,-30*c.sc,7*c.sc,-31*c.sc); ctx.stroke();
    ctx.beginPath(); ctx.arc(8*c.sc,-31*c.sc,2.6,0,7); ctx.fillStyle=INK; ctx.fill(); }
  ctx.fillStyle=INK;
  ctx.beginPath(); ctx.arc(-8*c.sc,-3*c.sc,2.1,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(7*c.sc,-3*c.sc,2.1,0,7); ctx.fill();
  if(c.kind===1){ ctx.fillStyle=ORANGE; ctx.beginPath();
    ctx.moveTo(11*c.sc,-1*c.sc); ctx.lineTo(19*c.sc,1.5*c.sc); ctx.lineTo(11*c.sc,4*c.sc); ctx.closePath(); ctx.fill(); }
  else { ctx.strokeStyle=INK; ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(0,3*c.sc); ctx.lineTo(6*c.sc,3*c.sc); ctx.stroke(); }
  ctx.restore();
}

/* ================= interaction ================= */
var nowT=0;
var downXY=null, downAt=0, moved=false, lastRustlePlant=null;
function stageXY(e){
  var r=canvas.getBoundingClientRect();
  var px=(e.clientX-r.left), py=(e.clientY-r.top);
  var s=Math.min(vw/SW, vh/SH);
  return [ (px-(vw-SW*s)/2)/s, (py-(vh-SH*s)/2)/s ];
}
function stepNow(){ return Math.floor(nowT/STEP); }
function isEmpty(p,s){
  if(p[0]<14||p[0]>SW-14||p[1]<14||p[1]>SH-10) return false;
  if(p[0]>185&&p[0]<575&&p[1]>392&&p[1]<612) return false;      /* elephants */
  var i, q;
  for(i=0;i<creatures.length;i++){ q=creaturePos(creatures[i],s);
    var dx=q.x-p[0], dy=q.y-p[1]; if(dx*dx+dy*dy<44*44) return false; }
  for(i=0;i<plants.length;i++){ q=plants[i];
    var ddx=q.x-p[0], ddy=q.y-p[1]; if(ddx*ddx+ddy*ddy<q.hr*q.hr) return false; }
  return true;
}
function rustleNear(p){
  var s=stepNow(), best=null, bd=1e9, i, dx, dy, d;
  for(i=0;i<plants.length;i++){ dx=plants[i].x-p[0]; dy=plants[i].y-30-p[1]; d=dx*dx+dy*dy;
    if(d<bd){ bd=d; best=plants[i]; } }
  if(best && bd<150*150 && (best!==lastRustlePlant || s-best.rustleStep>4)){ best.rustleStep=s; lastRustlePlant=best; }
}
canvas.addEventListener('pointerdown',function(e){
  downXY=stageXY(e); downAt=performance.now(); moved=false;
  if(canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',function(e){
  if(!downXY) return;
  var p=stageXY(e);
  if(Math.abs(p[0]-downXY[0])+Math.abs(p[1]-downXY[1])>7){ moved=true; rustleNear(p); }
});
function endPointer(e){
  if(downXY && !moved && performance.now()-downAt<500){
    var p=stageXY(e), s=stepNow();
    if(isEmpty(p,s) && creatures.length<12){
      var zone=p[0]<300?'A':(p[0]>620?'B':'C');
      creatures.push(makeCreature(zone,s,false));
    }
  }
  downXY=null;
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',function(){ downXY=null; });

/* ================= sizing: Visual Viewport API ================= */
function isPhone(){
  var sw=window.screen?Math.min(window.screen.width,window.screen.height):9999;
  return sw<700 || vh>vw*1.15;
}
function resize(){
  var w=window.innerWidth, h=window.innerHeight;
  if(window.visualViewport){ w=window.visualViewport.width; h=window.visualViewport.height; }
  vw=w; vh=h; dpr=Math.min(window.devicePixelRatio||1,2.5);
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
}
if(window.visualViewport){ window.visualViewport.addEventListener('resize',resize); }
window.addEventListener('resize',resize);
resize();

/* ================= draw ================= */
var PHASE0=0;
function draw(t){
  canvas.style.width=vw+'px'; canvas.style.height=vh+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,vw,vh);
  var s=Math.min(vw/SW, vh/SH);
  ctx.translate((vw-SW*s)/2,(vh-SH*s)/2); ctx.scale(s,s);
  void(isPhone);
  var step=Math.floor(t/STEP), i;

  /* grain + fibers */
  ctx.fillStyle=INK; ctx.globalAlpha=0.045;
  for(i=0;i<grain.length;i++) ctx.fillRect(grain[i][0],grain[i][1],grain[i][2],grain[i][2]);
  ctx.globalAlpha=0.13; ctx.strokeStyle=GRAY; ctx.lineWidth=1;
  for(i=0;i<fibers.length;i++){ ctx.beginPath(); ctx.moveTo(fibers[i][0],fibers[i][1]); ctx.lineTo(fibers[i][0]+fibers[i][2],fibers[i][1]+fibers[i][3]); ctx.stroke(); }
  ctx.globalAlpha=1;

  for(i=0;i<plants.length;i++) if(plants[i].layer===0) drawPlant(plants[i],step);

  drawElephant(312,604,1.0,INK,PAPER);
  drawElephant(494,606,0.62,BLUE,INK);

  for(i=0;i<plants.length;i++) if(plants[i].layer===1) drawPlant(plants[i],step);

  var order=creatures.slice().sort(function(a,b){ return creaturePos(a,step).y-creaturePos(b,step).y; });
  for(i=0;i<order.length;i++) drawCreature(order[i],step);

  for(i=0;i<plants.length;i++) if(plants[i].layer===2) drawPlant(plants[i],step);

  /* hint */
  ctx.globalAlpha=0.42; ctx.fillStyle=INK;
  ctx.font='15px "Segoe Print","Bradley Hand","Comic Sans MS",cursive';
  ctx.textAlign='right'; ctx.fillText('tap · drag',SW-26,SH-20);
  ctx.globalAlpha=1;
}

var t0=null;
function frame(ts){
  if(t0===null) t0=ts;
  nowT=PHASE0+(ts-t0)/1000;
  draw(nowT);
  if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
}
draw(PHASE0);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
