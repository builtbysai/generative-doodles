<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№604 Seventeen Meters</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt.
  var VOID = '#000000';
  var VOID2 = '#050505';
  var DRESS = '#f4f6f8';
  var DRESS_SHADE = '#c9d2de';
  var ROPE = '#5a5f66';
  var ROPE_DIM = '#33373c';
  var ICE = '#a8d8ff';      // ice blue, high register (top)
  var ICE_DEEP = '#6fb3f2';
  var EMBER = '#ff6a2a';    // deep ember, low register (bottom)
  var EMBER_DEEP = '#b23c0e';
  var PLATE = '#e8e8e8';
  var PLATE_DIM = '#8a8f96';
  var TICK = '#1c1e22';

  // Fixed-phase first frame: t = 6 s, performer hanging at y = 0.45,
  // mid-descent, ropes taut, swing at rest. Frame one is byte-reproducible.
  var FIRST_T = 6;
  var FIRST_Y = 0.45;

  // State. y is normalized height: 0 = top (high coloratura), 1 = bottom (low ribbon).
  var y = FIRST_Y;
  var targetY = FIRST_Y;
  var swing = 0;        // lateral offset in px, decays after a drag
  var swingVel = 0;
  var dragging = false;
  var dragY0 = 0;
  var lastMoveY = 0;
  var lastMoveT = 0;
  var velY = 0;         // vertical drag velocity, feeds rope slack
  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  // Optional height override for QA: ?y=0.25, or ?seed=0.25 as render-piece passes it.
  var qaY = null;
  try {
    if (typeof location !== 'undefined' && location.search) {
      var q = location.search.replace(/^\?/, '').split('&');
      for (var i = 0; i < q.length; i++) {
        var kv = q[i].split('=');
        if ((kv[0] === 'y' || kv[0] === 'seed') && kv[1] !== undefined) {
          var v = parseFloat(decodeURIComponent(kv[1]));
          if (!isNaN(v) && v >= 0 && v <= 1) { qaY = clamp(v, 0.03, 0.85); }
        }
      }
    }
  } catch (e) { qaY = null; }
  if (qaY !== null) { y = qaY; targetY = qaY; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha

  function hexLerp(h1, h2, t) {
    var r1 = parseInt(h1.slice(1, 3), 16), g1 = parseInt(h1.slice(3, 5), 16), b1 = parseInt(h1.slice(5, 7), 16);
    var r2 = parseInt(h2.slice(1, 3), 16), g2 = parseInt(h2.slice(3, 5), 16), b2 = parseInt(h2.slice(5, 7), 16);
    var r = Math.round(lerp(r1, r2, t)), g = Math.round(lerp(g1, g2, t)), b = Math.round(lerp(b1, b2, t));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      stageH = vh * 0.94;
      stageW = Math.min(vw * 0.6, stageH * 0.62);
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  function hash(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Void.
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, VOID2);
    bg.addColorStop(1, VOID);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Register color: ice blue at the top, deep ember at the bottom.
    var reg = hexLerp(ICE, EMBER, y);
    var regDeep = hexLerp(ICE_DEEP, EMBER_DEEP, y);

    var topPad = isPhone ? 92 : 78;
    var botPad = isPhone ? 64 : 52;
    var cx = W / 2;
    var py = topPad + y * (H - topPad - botPad);
    var px = cx + swing;
    var scale = clamp(Math.min(W, H) / 520, 0.62, 1.35);

    // Seventeen faint meter ticks down the full height of the frame.
    ctx.strokeStyle = TICK;
    ctx.lineWidth = 1;
    for (var m = 0; m < 17; m++) {
      var ty = topPad + (m / 16) * (H - topPad - botPad);
      var tw = (m % 4 === 0) ? W * 0.10 : W * 0.055;
      ctx.beginPath();
      ctx.moveTo(W - 14 - tw, ty);
      ctx.lineTo(W - 14, ty);
      ctx.stroke();
    }

    // Register rail: thin vertical gradient at the right edge, marker at her height.
    var railX = W - 14;
    var rail = ctx.createLinearGradient(0, topPad, 0, H - botPad);
    rail.addColorStop(0, ICE);
    rail.addColorStop(1, EMBER);
    ctx.strokeStyle = hexA('#8a8f96', 0.35);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(railX, topPad); ctx.lineTo(railX, H - botPad); ctx.stroke();
    ctx.fillStyle = reg;
    ctx.beginPath(); ctx.arc(railX, py, 4.5 * scale, 0, Math.PI * 2); ctx.fill();

    // Register glow halo around the performer.
    var haloR = 150 * scale;
    var halo = ctx.createRadialGradient(px, py, 4, px, py, haloR);
    halo.addColorStop(0, hexA(y < 0.5 ? ICE : EMBER, 0.34));
    halo.addColorStop(0.55, hexA(y < 0.5 ? ICE : EMBER, 0.10));
    halo.addColorStop(1, hexA(y < 0.5 ? ICE : EMBER, 0));
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(px, py, haloR, 0, Math.PI * 2); ctx.fill();

    // Ropes: from shoulders to the top edge. Sag grows as she descends
    // and with drag velocity; near the top they run taut.
    var shoulderW = 13 * scale;
    var shoulderY = py - 26 * scale;
    var anchorLX = cx - W * 0.17, anchorRX = cx + W * 0.17;
    var sag = (4 + 30 * y + Math.min(26, Math.abs(velY) * 0.06)) * scale;
    ctx.lineWidth = 1.4 * scale;
    var ropeCol = dragging ? ROPE : ROPE_DIM;
    ctx.strokeStyle = ropeCol;
    var ends = [
      [anchorLX, 0, px - shoulderW, shoulderY],
      [anchorRX, 0, px + shoulderW, shoulderY]
    ];
    for (var r = 0; r < 2; r++) {
      var e = ends[r];
      var mx = (e[0] + e[2]) / 2 + swing * 0.35;
      var my = (e[1] + e[3]) / 2 + sag;
      ctx.beginPath();
      ctx.moveTo(e[0], e[1]);
      ctx.quadraticCurveTo(mx, my, e[2], e[3]);
      ctx.stroke();
    }

    // High-register streak: a thin luminous line rising above her when she is high.
    var streakLen = (1 - y) * 120 * scale;
    if (streakLen > 6) {
      var sg = ctx.createLinearGradient(px, shoulderY, px, shoulderY - streakLen);
      sg.addColorStop(0, hexA(ICE, 0.55));
      sg.addColorStop(1, hexA(ICE, 0));
      ctx.strokeStyle = sg;
      ctx.lineWidth = 1.6 * scale;
      ctx.beginPath();
      ctx.moveTo(px, shoulderY - 4);
      ctx.lineTo(px + swing * 0.2, shoulderY - streakLen);
      ctx.stroke();
    }

    // The dress: a soft luminous shape. Narrow streak at the top,
    // wide heavy ribbon at the bottom.
    var waistY = py + 2 * scale;
    var gownLen = lerp(150, 108, y) * scale;
    var hemHalf = lerp(15, 62, y) * scale;
    var hipHalf = lerp(10, 26, y) * scale;
    var hemY = waistY + gownLen;
    var sway = Math.sin(t * 0.9) * (2 + 5 * y) * scale + swing * 0.12;

    ctx.save();
    ctx.shadowColor = reg;
    ctx.shadowBlur = 26 * scale;
    var dg = ctx.createLinearGradient(0, shoulderY, 0, hemY);
    dg.addColorStop(0, DRESS);
    dg.addColorStop(0.7, DRESS);
    dg.addColorStop(1, DRESS_SHADE);
    ctx.fillStyle = dg;
    ctx.beginPath();
    ctx.moveTo(px - shoulderW, shoulderY);
    ctx.bezierCurveTo(px - shoulderW - 4 * scale, waistY - 8 * scale,
                      px - hipHalf, waistY + gownLen * 0.35,
                      px - hemHalf + sway * 0.4, hemY);
    // Wavy hem.
    ctx.quadraticCurveTo(px - hemHalf * 0.45 + sway * 0.6, hemY + 9 * scale * (0.4 + y),
                         px + sway * 0.5, hemY + 3 * scale);
    ctx.quadraticCurveTo(px + hemHalf * 0.45 + sway * 0.6, hemY + 9 * scale * (0.4 + y),
                         px + hemHalf + sway * 0.4, hemY);
    ctx.bezierCurveTo(px + hipHalf, waistY + gownLen * 0.35,
                      px + shoulderW + 4 * scale, waistY - 8 * scale,
                      px + shoulderW, shoulderY);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Low-register ribbon fold: a second overlapping fold when she is low.
    if (y > 0.55) {
      var foldA = a4((y - 0.55) * 1.1);
      ctx.fillStyle = hexA(DRESS_SHADE, 0.5 * foldA);
      ctx.beginPath();
      ctx.moveTo(px - hemHalf * 0.55 + sway * 0.5, hemY - gownLen * 0.42);
      ctx.quadraticCurveTo(px - hemHalf * 0.9, hemY - gownLen * 0.1,
                           px - hemHalf * 0.7 + sway * 0.7, hemY - 6 * scale);
      ctx.quadraticCurveTo(px - hemHalf * 0.3, hemY - gownLen * 0.18,
                           px - hemHalf * 0.55 + sway * 0.5, hemY - gownLen * 0.42);
      ctx.closePath();
      ctx.fill();
    }

    // Head and shoulders, small and dark against the white dress.
    ctx.fillStyle = '#101114';
    ctx.beginPath(); ctx.arc(px, py - 38 * scale, 7 * scale, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = DRESS;
    ctx.beginPath();
    ctx.moveTo(px - shoulderW, shoulderY);
    ctx.quadraticCurveTo(px, shoulderY - 12 * scale, px + shoulderW, shoulderY);
    ctx.quadraticCurveTo(px + shoulderW * 0.7, waistY - 2 * scale, px - shoulderW * 0.7, waistY - 2 * scale);
    ctx.closePath();
    ctx.fill();

    // Shimmer: slow sparkles held in the stillness at any height.
    // Frequencies stay near 1 to 2 Hz, well under the 14 Hz ceiling.
    for (var s = 0; s < 26; s++) {
      var hx = hash(s * 3 + 1), hy = hash(s * 7 + 2), hp = hash(s * 11 + 3);
      var sx = px + (hx - 0.5) * (hemHalf * 3.4 + 30 * scale);
      var sy = py - 60 * scale + hy * (gownLen + 110 * scale);
      var tw = 0.5 + 0.5 * Math.sin(t * (1.1 + hp * 0.9) + s * 2.3);
      var sa = a4(0.06 + 0.30 * tw * tw);
      ctx.fillStyle = hexA(y < 0.5 ? ICE : EMBER, sa);
      ctx.beginPath(); ctx.arc(sx, sy, (0.8 + hp * 1.4) * scale, 0, Math.PI * 2); ctx.fill();
    }

    // Title plate, drawn on the canvas, top-left.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = PLATE;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Seventeen Meters', 18, 34);
    ctx.fillStyle = PLATE_DIM;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№604 · 2007 · 03 · 26', 18, 34 + fs2 + 8);
    ctx.fillStyle = hexA(PLATE_DIM, 0.9);
    ctx.fillText('Drag her through the register.', 18, H - 20);
  }

  // ---- audio: lazy, inside the first drag gesture only, never autoplay ----
  var audio = null;
  function ensureAudio() {
    if (audio) { return; }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { return; }
      var ac = new AC();
      var osc = ac.createOscillator();
      osc.type = 'sine';
      var vib = ac.createOscillator();
      vib.frequency.value = 5.5;
      var vibGain = ac.createGain();
      vibGain.gain.value = 6;
      vib.connect(vibGain);
      vibGain.connect(osc.frequency);
      var gain = ac.createGain();
      gain.gain.value = 0.0;
      var lp = ac.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 3200;
      osc.connect(lp);
      lp.connect(gain);
      gain.connect(ac.destination);
      osc.start();
      vib.start();
      audio = { ac: ac, osc: osc, gain: gain };
    } catch (e) { audio = null; }
  }
  function audioUpdate() {
    if (!audio) { return; }
    try {
      // High register (top, y=0) sings near 1175 Hz; low register (bottom, y=1) near 220 Hz.
      var f = 220 * Math.pow(1175 / 220, 1 - y);
      var t0 = audio.ac.currentTime;
      audio.osc.frequency.setTargetAtTime(f, t0, 0.08);
      audio.gain.gain.setTargetAtTime(dragging ? 0.045 : 0.028, t0, 0.15);
    } catch (e) {}
  }

  // ---- interaction: drag moves her through the vertical space ----
  function canvasPos(ev) {
    var rect = { left: stageX, top: stageY, width: stageW, height: stageH };
    try { rect = canvas.getBoundingClientRect(); } catch (e) {}
    var cx = ev.clientX, cy = ev.clientY;
    if (typeof ev.touches !== 'undefined' && ev.touches && ev.touches.length) {
      cx = ev.touches[0].clientX; cy = ev.touches[0].clientY;
    }
    return { x: cx - rect.left, y: cy - rect.top };
  }
  function onDown(ev) {
    ensureAudio();
    dragging = true;
    canvas.classList.add('dragging');
    var p = canvasPos(ev);
    dragY0 = p.y;
    lastMoveY = p.y;
    lastMoveT = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    targetY = clamp(p.y / H, 0.03, 0.85);
    y = targetY;
    audioUpdate();
    if (ev.preventDefault) { ev.preventDefault(); }
  }
  function onMove(ev) {
    if (!dragging) { return; }
    var p = canvasPos(ev);
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var dt = Math.max(1, now - lastMoveT);
    var newVel = (p.y - lastMoveY) / dt * 16;
    velY = velY * 0.6 + newVel * 0.4;
    swingVel += (p.x - (W / 2 + swing)) * 0.00012;
    lastMoveY = p.y;
    lastMoveT = now;
    targetY = clamp(p.y / H, 0.03, 0.85);
    y = targetY;
    audioUpdate();
    if (ev.preventDefault) { ev.preventDefault(); }
  }
  function onUp() {
    dragging = false;
    canvas.classList.remove('dragging');
    velY = 0;
    audioUpdate(); // she hangs where you put her; the voice settles, it does not stop
  }

  try {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onUp);
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var lastT = start;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      var dt = Math.min(0.05, Math.max(0.001, (now - lastT) / 1000));
      lastT = now;
      if (!dragging) {
        // Ease toward the held height; swing decays like a pendulum.
        y += (targetY - y) * Math.min(1, dt * 6);
        swingVel += (-swing * 0.9 - swingVel * 1.6) * dt * 8;
        swing += swingVel * dt * 8;
        velY *= Math.pow(0.02, dt);
      } else {
        swingVel *= Math.pow(0.05, dt);
        swing += swingVel * dt * 8;
      }
      draw(t);
      audioUpdate();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
