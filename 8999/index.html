<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№8999 · Storm Grid — Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #14110c;
    color: #e8e2d2;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 620px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #8f8875; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; }
  header h1 .num { color: #d9a441; }
  header p { color: #8f8875; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #c9c2ad; font-weight: normal; }
  #stage {
    width: min(92vw, 760px);
    aspect-ratio: 1 / 1;
    background: #f4edda;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  footer { margin-top: 4vmin; color: #6b6455; font-size: 13px; font-style: italic; }
  footer a { color: #d9a441; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№8999</span> · Storm Grid</h1>
  <p>Forty-nine nested squares, drawn with a plotter's patience. The disorder
  budget is tiny and deliberate: two or three cells where the hand slipped.
  <b>Click the piece for a new plot.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 899901;
const TAU = Math.PI * 2;
const VU = 1000;
const PAPER = "#f4edda";

function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }

// draw one closed square as a trembling polyline: jitter is a smooth
// periodic function around the perimeter, so corners always close
function tremblingSquare(ctx, cx, cy, half, rnd, jitter, rot, cornerJit){
  const corners = [];
  for (let i = 0; i < 4; i++){
    const a = Math.PI / 4 + i * Math.PI / 2 + rot;
    let px = cx + Math.cos(a) * half * Math.SQRT2;
    let py = cy + Math.sin(a) * half * Math.SQRT2;
    if (cornerJit > 0){
      px += (rnd() - 0.5) * 2 * cornerJit;
      py += (rnd() - 0.5) * 2 * cornerJit;
    }
    corners.push([px, py]);
  }
  const f1 = 1 + ((rnd() * 3) | 0), f2 = f1 + 1 + ((rnd() * 2) | 0);
  const p1 = rnd() * TAU, p2 = rnd() * TAU;
  const a1 = 0.7 + rnd() * 0.3, a2 = 0.3 + rnd() * 0.3;
  const seg = 16;
  ctx.beginPath();
  for (let e = 0; e < 4; e++){
    const A = corners[e], B = corners[(e + 1) % 4];
    const ex = B[0] - A[0], ey = B[1] - A[1];
    const el = Math.hypot(ex, ey) || 1;
    const nx = -ey / el, ny = ex / el;
    for (let s = 0; s < seg; s++){
      const t = (e * seg + s) / (4 * seg);
      const f = s / seg;
      const off = jitter * (a1 * Math.sin(TAU * f1 * t + p1) + a2 * Math.sin(TAU * f2 * t + p2));
      const px = A[0] + ex * f + nx * off;
      const py = A[1] + ey * f + ny * off;
      if (e === 0 && s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
  }
  ctx.closePath();
  ctx.stroke();
}

function generate(){
  const rnd = mulberry32(seed);
  const N = 7;
  const margin = 92;
  const cell = (VU - 2 * margin) / N;
  const cells = [];
  // pick 2-3 storm cells, never adjacent
  const storms = [];
  let guard = 0;
  const nStorm = 2 + (rnd() < 0.5 ? 1 : 0);
  while (storms.length < nStorm && guard++ < 200){
    const i = (rnd() * N) | 0, j = (rnd() * N) | 0;
    let ok = true;
    for (const s of storms)
      if (Math.abs(s[0] - i) + Math.abs(s[1] - j) < 2){ ok = false; break; }
    if (ok) storms.push([i, j]);
  }
  const isStorm = (i, j) => storms.some(s => s[0] === i && s[1] === j);
  for (let i = 0; i < N; i++)
    for (let j = 0; j < N; j++){
      const cx = margin + (i + 0.5) * cell, cy = margin + (j + 0.5) * cell;
      const storm = isStorm(i, j);
      const rings = storm ? 8 + ((rnd() * 4) | 0) : 4 + ((rnd() * 3) | 0);
      const gap = cell * (0.062 + rnd() * 0.012);
      cells.push({
        cx, cy, storm,
        half: cell * (0.40 + rnd() * 0.04),
        rings, gap,
        rot: storm ? (rnd() - 0.5) * 0.14 : (rnd() - 0.5) * 0.006,
        jitter: storm ? 2.6 + rnd() * 2.2 : 0.5 + rnd() * 0.5,
        cornerJit: storm ? cell * 0.075 : 0,
        passes: storm ? 3 : 1
      });
    }
  return cells;
}

let ctx;
function setupCanvas(){
  const canvas = document.getElementById("c");
  const stage = document.getElementById("stage");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const S = stage.clientWidth;
  const K = S / VU;
  canvas.width = S * dpr; canvas.height = S * dpr;
  ctx = canvas.getContext("2d");
  ctx.setTransform(dpr * K, 0, 0, dpr * K, 0, 0);
}

function drawPaper(){
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VU, VU);
  const rnd = mulberry32(seed ^ 0x3f2a);
  for (let i = 0; i < 1800; i++){
    const x = rnd() * VU, y = rnd() * VU, r = 2 + rnd() * 12;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rnd() < 0.5 ? "rgba(120,95,55,0.028)" : "rgba(255,253,244,0.032)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  ctx.strokeStyle = "rgba(31,26,20,0.35)";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(56, 56, VU - 112, VU - 112);
}

function render(){
  const cells = generate();
  setupCanvas();
  drawPaper();
  ctx.lineCap = "round";
  for (const c of cells){
    const rnd = mulberry32(seed ^ ((c.cx * 13 + c.cy * 7) | 0));
    for (let p = 0; p < c.passes; p++){
      ctx.strokeStyle = `rgba(31,26,20,${c.storm ? 0.62 : 0.85})`;
      ctx.lineWidth = c.storm ? 1.9 : 1.5;
      for (let r = 0; r < c.rings; r++){
        const half = c.half - r * c.gap;
        if (half < 3) break;
        tremblingSquare(ctx, c.cx, c.cy, half, rnd, c.jitter, c.rot, c.cornerJit);
      }
    }
  }
  const vg = ctx.createRadialGradient(500, 500, 340, 500, 500, 780);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(60,45,25,0.14)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, VU, VU);
}

window.addEventListener("resize", render);
document.getElementById("stage").addEventListener("click", () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, "", "?seed=" + seed);
  render();
});
render();
</script>
</body>
</html>
