<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1918 Dolomite Water</title>
<style>
  html, body { margin: 0; padding: 0; background: #ece9e1; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt.
  var BG = '#ece9e1';        // mist white ground, page ground too
  var INK = '#2e3438';       // title, dark slate
  var INK_SOFT = '#5c6670';  // date line, rain-slate
  var RAIN = '#5c6670';      // rain-slate streaks
  var CYAN = '#4a90a4';      // glacial cyan, stream and particle
  var CYAN_LT = '#7fc4d4';   // pale glacial cyan, stream lines
  var LIME = '#b8b4ac';      // limestone grey, strata
  var LIME_DK = '#8f8a80';   // deeper limestone, strata lines
  var MIST = '#f7f4ec';      // mist white, mist zone
  var MEADOW = '#6d8a63';    // muted meadow green, Peitlerkofel meadow
  var PEAK = '#6a7076';      // peak silhouette, grey
  var OCHRE = '#a87c2e';     // Italian stream ink
  var RUST = '#9c4a2a';      // German stream ink
  var PINE = '#3d6b4f';      // Ladin stream ink
  var IRON = '#3a5a7a';      // English stream ink

  // Fixed-phase first frame: t = 32 s of a 120 s cycle. The particle is
  // mid-stream (stage 2 of 5), the stream zone fills most of the frame
  // with rain below and the lake above, and two caption streams sit at
  // full strength with the other two mid-fade. Frame one is
  // byte-reproducible: every streak, line, caption and wisp is a pure
  // function of t.
  var FIRST_T = 32;

  // Timeline: 120 s cycle, five 24 s stages. The journey runs
  // bottom-to-top: rain, stream, lake, limestone seep, mist over the
  // meadow. The world scrolls upward past the particle, which climbs
  // slowly from near the bottom of the frame to near the top.
  var CYCLE = 120;
  var STAGES = 5;
  var ZONE = 0.62; // each stage zone is 0.62 of the stage height, in world units

  // Stage-naming words in four Dolomites languages. Short original words,
  // never translated, never subtitled; each language keeps its own timer.
  var WORDS = [
    { ink: OCHRE, period: 11, words: ['pioggia', 'ruscello', 'lago', 'calcare', 'nebbia'] },   // Italian
    { ink: RUST,  period: 13, words: ['Regen', 'Bach', 'See', 'Kalkstein', 'Nebel'] },        // German
    { ink: PINE,  period: 17, words: ['plöia', 'ruf', 'lech', 'sas', 'nëbia'] },              // Ladin
    { ink: IRON,  period: 9,  words: ['rain', 'stream', 'lake', 'limestone', 'mist'] }        // English
  ];

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hash(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Journey geometry. The world is five stacked zones, zone 0 (rain) at
  // the bottom, zone 4 (mist) at the top, each ZONE * H tall. The camera
  // follows the particle so the particle climbs slowly up the frame while
  // the world scrolls past it.
  function geom(t) {
    var frac = ((t % CYCLE) + CYCLE) % CYCLE / CYCLE;
    var worldH = STAGES * ZONE * H;
    var py = frac * worldH; // particle height in world units, from the bottom
    var scrY = H * (0.80 - 0.55 * frac); // particle screen y, top-down
    var camY = py - (H - scrY); // world height at the bottom edge of the screen
    return { frac: frac, worldH: worldH, py: py, scrY: scrY, camY: camY,
             stage: Math.min(STAGES - 1, Math.floor(frac * STAGES)) };
  }

  // World height (from the bottom of the world) to screen y (top-down).
  function wy2sy(g, wy) { return H - (wy - g.camY); }

  // The journey column: a vertical band in the centre of the frame.
  function colX() { return { x0: W * 0.30, x1: W * 0.70 }; }

  function drawRain(g, t, yTop, yBot) {
    var c = colX();
    // Rain streaks: diagonal, falling slowly, wrapping inside the zone.
    var span = yBot - yTop;
    if (span <= 0) { return; }
    ctx.strokeStyle = hexA(RAIN, 0.5);
    ctx.lineWidth = Math.max(1, H * 0.0016);
    ctx.lineCap = 'round';
    for (var i = 0; i < 26; i++) {
      var rx = c.x0 + (c.x1 - c.x0) * hash(i * 3 + 1);
      var fall = ((t * 0.09 + hash(i * 7 + 2) * 1.0) % 1.0);
      var ry = yTop + fall * span;
      if (ry > H * 0.92) { continue; } // keep the hint line clear
      var len = H * 0.028;
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx - len * 0.25, ry + len);
      ctx.stroke();
    }
  }

  function drawStream(g, t, yTop, yBot) {
    var c = colX();
    // Wavy flow lines running left to right, drifting with the current.
    var span = yBot - yTop;
    if (span <= 0) { return; }
    var lines = 5;
    for (var i = 0; i < lines; i++) {
      var ly = yTop + span * (i + 0.5) / lines;
      ctx.strokeStyle = hexA(i % 2 === 0 ? CYAN : CYAN_LT, 0.55);
      ctx.lineWidth = Math.max(1, H * (i === 2 ? 0.003 : 0.0018));
      ctx.beginPath();
      var step = Math.max(3, (c.x1 - c.x0) / 60);
      var first = true;
      for (var x = c.x0; x <= c.x1; x += step) {
        var u = (x - c.x0) / (c.x1 - c.x0);
        var y = ly + Math.sin(u * Math.PI * 3.0 + t * 0.5 + i * 1.4) * H * 0.008
              + Math.sin(u * Math.PI * 7.0 - t * 0.3 + i * 0.7) * H * 0.003;
        if (first) { ctx.moveTo(x, y); first = false; }
        else { ctx.lineTo(x, y); }
      }
      ctx.stroke();
    }
  }

  function drawLake(g, t, yTop, yBot) {
    var c = colX();
    var span = yBot - yTop;
    if (span <= 0) { return; }
    var cx = (c.x0 + c.x1) / 2;
    var cy = yTop + span * 0.5;
    var rw = (c.x1 - c.x0) * 0.46;
    var rh = Math.min(span * 0.30, H * 0.09, rw * 0.55);
    // The high lake: one still ellipse, barely rippled.
    ctx.fillStyle = hexA(CYAN_LT, 0.35);
    ctx.beginPath();
    ctx.moveTo(cx + rw, cy); ctx.ellipse(cx, cy, rw, rh, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = hexA(CYAN, 0.6);
    ctx.lineWidth = Math.max(1, H * 0.002);
    ctx.beginPath();
    ctx.moveTo(cx + rw, cy); ctx.ellipse(cx, cy, rw, rh, 0, 0, Math.PI * 2); ctx.stroke();
    // Two still reflection lines across the water.
    for (var i = 0; i < 2; i++) {
      var ry = cy + (i === 0 ? -rh * 0.35 : rh * 0.4);
      var wob = Math.sin(t * 0.25 + i * 2.0) * H * 0.002;
      ctx.strokeStyle = hexA(CYAN, 0.35);
      ctx.lineWidth = Math.max(1, H * 0.0015);
      ctx.beginPath();
      ctx.moveTo(cx - rw * 0.7, ry + wob);
      ctx.lineTo(cx + rw * 0.7, ry - wob);
      ctx.stroke();
    }
  }

  function drawLimestone(g, t, yTop, yBot) {
    var c = colX();
    var span = yBot - yTop;
    if (span <= 0) { return; }
    // Limestone strata: horizontal bands with faint vertical cracks.
    var bands = 6;
    for (var i = 0; i < bands; i++) {
      var by = yTop + span * (i + 0.5) / bands;
      ctx.strokeStyle = hexA(LIME_DK, 0.55);
      ctx.lineWidth = Math.max(1, H * 0.002);
      ctx.beginPath();
      ctx.moveTo(c.x0, by);
      ctx.lineTo(c.x1, by);
      ctx.stroke();
      // A crack dropping from this band to the next.
      var cx = c.x0 + (c.x1 - c.x0) * hash(i * 5 + 4);
      ctx.strokeStyle = hexA(LIME_DK, 0.3);
      ctx.lineWidth = Math.max(1, H * 0.0012);
      ctx.beginPath();
      ctx.moveTo(cx, by);
      ctx.lineTo(cx + H * 0.006, by + span / bands * 0.8);
      ctx.stroke();
    }
  }

  function drawMist(g, t, yTop, yBot) {
    var c = colX();
    var span = yBot - yTop;
    if (span <= 0) { return; }
    // Drifting mist: soft white ellipses, slow and low.
    for (var i = 0; i < 6; i++) {
      var drift = Math.sin(t * 0.12 + i * 1.9) * (c.x1 - c.x0) * 0.12;
      var mx = c.x0 + (c.x1 - c.x0) * (0.2 + hash(i * 11 + 6) * 0.6) + drift;
      var my = yTop + span * (0.15 + hash(i * 13 + 9) * 0.7);
      var mr = H * (0.03 + hash(i * 17 + 3) * 0.03);
      ctx.fillStyle = hexA(MIST, 0.75);
      ctx.beginPath();
      ctx.moveTo(mx + mr, my); ctx.ellipse(mx, my, mr, mr * 0.45, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  // The meadow that closes the piece: a green band at the top of the
  // world with the Peitlerkofel peak rising behind it. It scrolls into
  // view as the cycle ends.
  function drawMeadow(g) {
    var c = colX();
    var meadowBot = g.worldH; // top of the mist zone
    var meadowTop = g.worldH + H * 0.30;
    var yBot = wy2sy(g, meadowBot);
    var yTop = wy2sy(g, meadowTop);
    if (yBot < 0 || yTop > H) { return; }
    var cy0 = clamp(yTop, 0, H), cy1 = clamp(yBot, 0, H);
    ctx.fillStyle = MEADOW;
    ctx.fillRect(c.x0, cy0, c.x1 - c.x0, cy1 - cy0);
    // The peak, rising above the meadow band.
    var px = (c.x0 + c.x1) / 2;
    var peakTop = yTop - H * 0.10;
    var peakBase = yTop + H * 0.02;
    if (peakBase > 0) {
      ctx.fillStyle = PEAK;
      ctx.beginPath();
      ctx.moveTo(px - (c.x1 - c.x0) * 0.48, peakBase);
      ctx.lineTo(px, Math.max(peakTop, -H * 0.05));
      ctx.lineTo(px + (c.x1 - c.x0) * 0.48, peakBase);
      ctx.closePath();
      ctx.fill();
      // A small snow cap on the peak.
      ctx.fillStyle = hexA(MIST, 0.9);
      ctx.beginPath();
      ctx.moveTo(px - (c.x1 - c.x0) * 0.10, peakTop + H * 0.035);
      ctx.lineTo(px, Math.max(peakTop, -H * 0.05));
      ctx.lineTo(px + (c.x1 - c.x0) * 0.10, peakTop + H * 0.035);
      ctx.closePath();
      ctx.fill();
    }
    // Meadow grass ticks.
    ctx.strokeStyle = hexA('#4a6b42', 0.6);
    ctx.lineWidth = Math.max(1, H * 0.0015);
    for (var i = 0; i < 14; i++) {
      var gx = c.x0 + (c.x1 - c.x0) * hash(i * 19 + 8);
      var gy = clamp(yBot - H * 0.01 - hash(i * 23 + 5) * H * 0.05, cy0, cy1);
      ctx.beginPath();
      ctx.moveTo(gx, gy);
      ctx.lineTo(gx, gy - H * 0.012);
      ctx.stroke();
    }
  }

  // Particle screen position at time t (pure function of t).
  function particlePos(g, t) {
    var frac = g.frac;
    var px = W / 2;
    var py = g.scrY;
    var st = g.stage;
    if (st === 0) { // rain: falls with a slight slant
      px += Math.sin(t * 0.8) * W * 0.01;
    } else if (st === 1) { // stream: carried sideways by the current
      px += Math.sin(t * 1.1) * W * 0.03;
      py += Math.sin(t * 0.7) * H * 0.006;
    } else if (st === 2) { // lake: slow drift, almost still
      px += Math.sin(t * 0.3) * W * 0.04;
      py += Math.cos(t * 0.22) * H * 0.004;
    } else if (st === 3) { // seep: sinks slowly through the strata
      px += Math.sin(t * 0.5) * W * 0.008;
      py += H * 0.012 * Math.sin(t * 0.4 + 1.0);
    } else { // mist: rises and softens
      px += Math.sin(t * 0.45) * W * 0.05;
      py -= H * 0.008 * Math.sin(t * 0.3);
    }
    return { x: px, y: py, stage: st };
  }

  function drawParticle(g, t) {
    // A faint trail of where the particle has been.
    var dt = 0.45;
    for (var k = 9; k >= 1; k--) {
      var pg = geom(t - k * dt);
      var pp = particlePos(pg, t - k * dt);
      var a = 0.28 * (1 - k / 10);
      ctx.fillStyle = hexA(CYAN, a4(a));
      ctx.beginPath();
      ctx.moveTo(pp.x + H * 0.005, pp.y); ctx.arc(pp.x, pp.y, H * 0.005, 0, Math.PI * 2); ctx.fill();
    }
    var p = particlePos(g, t);
    var st = p.stage;
    // Stage-specific wake.
    if (st === 0) { // rain streak above the drop
      ctx.strokeStyle = hexA(RAIN, 0.6);
      ctx.lineWidth = Math.max(1, H * 0.0018);
      ctx.beginPath();
      ctx.moveTo(p.x + H * 0.004, p.y - H * 0.03);
      ctx.lineTo(p.x, p.y - H * 0.008);
      ctx.stroke();
    } else if (st === 2) { // lake: one faint expanding ring
      var ring = H * 0.012 + H * 0.010 * (0.5 + 0.5 * Math.sin(t * 0.5));
      ctx.strokeStyle = hexA(CYAN, 0.35);
      ctx.lineWidth = Math.max(1, H * 0.0015);
      ctx.beginPath();
      ctx.moveTo(p.x + ring, p.y); ctx.arc(p.x, p.y, ring, 0, Math.PI * 2); ctx.stroke();
    } else if (st === 3) { // seep: drip dots sinking below
      for (var d = 1; d <= 3; d++) {
        ctx.fillStyle = hexA(CYAN, a4(0.4 - d * 0.1));
        ctx.beginPath();
        ctx.moveTo(p.x + H * 0.003, p.y + d * H * 0.012); ctx.arc(p.x, p.y + d * H * 0.012, H * 0.003, 0, Math.PI * 2); ctx.fill();
      }
    } else if (st === 4) { // mist: a soft halo
      ctx.fillStyle = hexA(MIST, 0.5);
      ctx.beginPath();
      ctx.moveTo(p.x + H * 0.016, p.y); ctx.arc(p.x, p.y, H * 0.016, 0, Math.PI * 2); ctx.fill();
    }
    // The particle itself: a bright glacial drop with a white core.
    ctx.fillStyle = hexA(CYAN, 0.9);
    ctx.beginPath();
    ctx.moveTo(p.x + H * 0.011, p.y); ctx.arc(p.x, p.y, H * 0.011, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = hexA(MIST, 0.95);
    ctx.beginPath();
    ctx.moveTo(p.x + H * 0.005, p.y); ctx.arc(p.x, p.y, H * 0.005, 0, Math.PI * 2); ctx.fill();
  }

  // Four caption streams along the left margin, each language on its own
  // timer, each word fading in and out around its change.
  function drawCaptions(t) {
    var fs = Math.round(clamp(W / 46, 12, 16));
    ctx.font = 'italic ' + fs + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    var slots = [0.22, 0.34, 0.46, 0.58];
    for (var i = 0; i < WORDS.length; i++) {
      var w = WORDS[i];
      var ph = t / w.period;
      var idx = Math.floor(ph) % w.words.length;
      var f = ph - Math.floor(ph); // 0..1 within the current word
      var a = 1;
      if (f < 0.08) { a = f / 0.08; }
      else if (f > 0.85) { a = (1 - f) / 0.15; }
      a = clamp(a, 0.3, 1);
      ctx.fillStyle = hexA(w.ink, a4(0.92 * a));
      ctx.fillText(w.words[idx], 18, H * slots[i]);
    }
    ctx.textAlign = 'left';
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var g = geom(t);
    var c = colX();

    // Zone tints, bottom to top.
    var tints = ['#dfe3e2', '#cfe3e6', '#d5e4e6', '#ddd9d0', '#f2efe8'];
    for (var z = 0; z < STAGES; z++) {
      var zBot = wy2sy(g, z * ZONE * H);
      var zTop = wy2sy(g, (z + 1) * ZONE * H);
      var cy0 = clamp(zTop, 0, H), cy1 = clamp(zBot, 0, H);
      if (cy1 <= 0 || cy0 >= H) { continue; }
      ctx.fillStyle = tints[z];
      ctx.fillRect(c.x0, cy0, c.x1 - c.x0, cy1 - cy0);
      // Zone marks, clipped to the visible slice.
      if (z === 0) { drawRain(g, t, cy0, cy1); }
      else if (z === 1) { drawStream(g, t, cy0, cy1); }
      else if (z === 2) { drawLake(g, t, cy0, cy1); }
      else if (z === 3) { drawLimestone(g, t, cy0, cy1); }
      else { drawMist(g, t, cy0, cy1); }
    }

    drawMeadow(g);

    // The column edges, two quiet limestone lines framing the journey.
    ctx.strokeStyle = hexA(LIME_DK, 0.5);
    ctx.lineWidth = Math.max(1, H * 0.0015);
    ctx.beginPath();
    ctx.moveTo(c.x0, 0); ctx.lineTo(c.x0, H);
    ctx.moveTo(c.x1, 0); ctx.lineTo(c.x1, H);
    ctx.stroke();

    drawParticle(g, t);
    drawCaptions(t);

    // The glacial drone: one slow deep line along the bottom edge, the
    // bass sitting underneath the whole journey.
    ctx.strokeStyle = hexA('#2f5d6b', 0.55);
    ctx.lineWidth = Math.max(1.5, H * 0.003);
    ctx.beginPath();
    var step = Math.max(3, W / 120);
    var first = true;
    for (var x = 0; x <= W; x += step) {
      var y = H - 6 + Math.sin(x / W * Math.PI * 2 + t * 0.2) * H * 0.004;
      if (first) { ctx.moveTo(x, y); first = false; }
      else { ctx.lineTo(x, y); }
    }
    ctx.stroke();

    // Title plate, top-left.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Dolomite Water', 18, 34);
    ctx.fillStyle = INK_SOFT;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1918 · 2007 · 04 · 13', 18, 34 + fs2 + 8);
    ctx.fillStyle = hexA(INK_SOFT, 0.9);
    ctx.textAlign = 'center';
    var hint = 'Watch the particle make its slow journey.';
    ctx.font = Math.round(fs2 * 0.95) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText(hint, W / 2, H - 20);
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Watch only: no pointer handlers, no audio. All motion runs under 1 Hz,
  // well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
