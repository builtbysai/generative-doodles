<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Shortest Stack</title>
<style>
  html, body { margin: 0; padding: 0; background: #0E0F13; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- constants ----------
  var GROUND = '#0E0F13';
  var HEM = '#08090C';
  var RIB = '#3A3D46';
  var HIGHLIGHT = '#FFC44F';
  var RATE = 7;               // strips placed per second
  var SLIDE_DUR = 0.12;       // seconds for a strip to drop onto its stack
  var GLOW_DUR = 0.8;         // seconds a landed strip keeps its amber glow
  var T0 = 50.07;             // frame-one machine time: season 1 done, season 2 growing, a strip mid-drop
  var DEFAULT_SEED = 7;

  // Palettes: two yarns only per season. [zeroColor, oneColor, oneIsLight]
  var PALETTES = [
    { zero: '#111216', one: '#F2EFE6', glow: HIGHLIGHT },  // classic
    { zero: '#F2EFE6', one: '#111216', glow: HIGHLIGHT },  // inverted
    { zero: '#111216', one: '#FFC44F', glow: '#F2EFE6' }   // amber on black
  ];

  // ---------- helpers ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  var seedParam = 0;
  try {
    var m = /[?&]seed=(\d+)/.exec(location.search || '');
    if (m) seedParam = parseInt(m[1], 10);
  } catch (e) { /* no location in some contexts */ }
  var BASE_SEED = seedParam || DEFAULT_SEED;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 720, H = 720, DPR = 1;

  function isPhone() {
    try {
      var sw = window.screen ? window.screen.width : W;
      var sh = window.screen ? window.screen.height : H;
      if (Math.min(sw, sh) < 700) return true;
    } catch (e) { /* fall through */ }
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : (window.innerWidth || 720);
    var h = vv ? vv.height : (window.innerHeight || 720);
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(); });
  }
  if (window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(); });
  }

  // ---------- the counting machine ----------
  function genSeedFor(gen) {
    return (BASE_SEED ^ Math.imul(gen + 1, 0x85EBCA6B)) >>> 0;
  }

  function seasonParams(genSeed, s, phone) {
    var rng = mulberry32((genSeed + Math.imul(s + 1, 0x9E3779B9)) >>> 0);
    var baseN = 14 + Math.floor(rng() * 7);              // 14..20
    var jit = Math.round((rng() * 2 - 1) * 2);           // -2..+2 per season
    var N = Math.max(12, Math.min(22, baseN + jit));
    var bitW = rng() < 0.5 ? 8 : 9;
    if (phone) { bitW = 8; N = clamp(N, 20, 22); }       // keep stitches >= 3px on phones
    return { N: N, bitW: bitW, maxCount: bitW === 8 ? 255 : 511 };
  }

  // A season is fully precomputed: the counting is a pure function of the seed.
  function buildSeason(genSeed, s, phone) {
    var p = seasonParams(genSeed, s, phone);
    var total = p.maxCount + 1;
    var heights = [];
    var i, c;
    for (i = 0; i < p.N; i++) heights.push(0);
    var strips = [];        // strips[k] = stack index that count k lands on
    var posInStack = [];    // posInStack[k] = strip's order within its stack
    var stackCounts = [];   // stackCounts[i] = [{c, k}] in placement order
    for (i = 0; i < p.N; i++) stackCounts.push([]);
    var running = [];
    for (i = 0; i < p.N; i++) running.push(0);
    for (c = 0; c < total; c++) {
      var best = 0;
      for (i = 1; i < p.N; i++) if (heights[i] < heights[best]) best = i;
      strips.push(best);
      posInStack.push(running[best]);
      stackCounts[best].push({ c: c, k: c });
      running[best]++;
      heights[best] += p.bitW;
    }
    var maxStackStrips = 0;
    for (i = 0; i < p.N; i++) if (running[i] > maxStackStrips) maxStackStrips = running[i];
    return {
      N: p.N, bitW: p.bitW, maxCount: p.maxCount, total: total,
      strips: strips, posInStack: posInStack, stackCounts: stackCounts,
      maxCols: maxStackStrips * p.bitW,
      duration: total / RATE, start: 0, end: 0
    };
  }

  // ---------- generation (one sweater) ----------
  var genIndex = 0;
  var paletteIndex = 0;
  var seasonCache = {};
  var phoneMode = false;

  function getSeason(idx) {
    var key = genIndex + ':' + idx;
    if (!seasonCache[key]) {
      var s = buildSeason(genSeedFor(genIndex), idx, phoneMode);
      s.start = idx === 0 ? 0 : getSeason(idx - 1).end;
      s.end = s.start + s.duration;
      seasonCache[key] = s;
    }
    return seasonCache[key];
  }

  function stateAt(t) {
    var idx = 0;
    while (t >= getSeason(idx).end) idx++;
    return { season: getSeason(idx), index: idx, local: t - getSeason(idx).start };
  }

  // ---------- audio (lazy, gesture-gated, guarded) ----------
  var AC = null;
  function audio() {
    if (AC) return AC;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      AC = new Ctx();
    } catch (e) { return null; }
    return AC;
  }
  function tone(freq, dur, type, gain, slideTo) {
    var ac = audio(); if (!ac) return;
    try {
      var o = ac.createOscillator(), g = ac.createGain();
      var t = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* silent */ }
  }
  function sndClick(count) { tone(380 + (count % 96) * 6, 0.045, 'square', 0.05); }
  function sndThump() { tone(88, 0.16, 'sine', 0.12); }
  function sndZip() { tone(880, 0.35, 'sawtooth', 0.04, 180); }

  // ---------- interaction ----------
  var mt = T0;               // machine time (piece clock, offset for frame one)
  var holding = false;
  var holdPhase = 0;
  var downAt = 0, downX = 0, downY = 0, lastTapAt = -1000, tapTimer = null;

  function newSweater() {
    genIndex++;
    seasonCache = {};
    mt = 0;
  }
  function changeYarn() {
    paletteIndex = (paletteIndex + 1) % PALETTES.length;
    newSweater();
  }
  function onTap() {
    var now = perfNow();
    if (now - lastTapAt < 350) {
      lastTapAt = -1000;
      if (tapTimer !== null) { clearTimeout(tapTimer); tapTimer = null; }
      changeYarn();
    } else {
      lastTapAt = now;
      if (typeof setTimeout === 'function') {
        tapTimer = setTimeout(function () { tapTimer = null; newSweater(); }, 360);
      } else {
        newSweater();
      }
    }
  }
  function perfNow() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  }
  canvas.addEventListener('pointerdown', function (ev) {
    audio();
    holding = true; holdPhase = 0;
    downAt = perfNow(); downX = ev.clientX || 0; downY = ev.clientY || 0;
  });
  function endPointer(ev) {
    if (!holding) return;
    holding = false;
    var dt = perfNow() - downAt;
    var dx = (ev.clientX || 0) - downX, dy = (ev.clientY || 0) - downY;
    if (dt < 250 && Math.sqrt(dx * dx + dy * dy) < 12) onTap();
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', function () { holding = false; });

  // ---------- drawing ----------
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawStitch(x, y, w, h, one, pal, withRib) {
    ctx.fillStyle = one ? pal.one : pal.zero;
    rr(x, y, w, h, Math.min(2, h * 0.3));
    ctx.fill();
    if (withRib && w >= 3) {
      var light = one ? (pal.one === '#F2EFE6' || pal.one === '#FFC44F') : (pal.zero === '#F2EFE6');
      ctx.strokeStyle = light ? 'rgba(58,61,70,0.25)' : 'rgba(242,239,230,0.06)';
      ctx.lineWidth = 1;
      var cx = x + w / 2;
      ctx.beginPath();
      ctx.moveTo(cx, y + 1);
      ctx.lineTo(cx, y + h - 1);
      ctx.stroke();
    }
  }

  function stripCells(S, k) {
    // returns array of 0/1 bits for count k, MSB first
    var bits = [];
    for (var j = S.bitW - 1; j >= 0; j--) bits.push((k >> j) & 1);
    return bits;
  }

  function drawStripAt(S, k, x, y, cellW, sh, pal, alpha, glowAlpha) {
    var bits = stripCells(S, k);
    var sw = Math.max(1.5, cellW * 0.84);
    ctx.save();
    ctx.globalAlpha = alpha;
    for (var j = 0; j < S.bitW; j++) {
      drawStitch(x + j * cellW + (cellW - sw) / 2, y, sw, sh, bits[j] === 1, pal, true);
    }
    if (glowAlpha > 0) {
      ctx.globalAlpha = glowAlpha;
      ctx.fillStyle = pal.glow;
      for (var q = 0; q < S.bitW; q++) {
        rr(x + q * cellW + (cellW - sw) / 2, y, sw, sh, Math.min(2, sh * 0.3));
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawSeason(S, placed, x, y, w, h, alpha, pal, age) {
    var rowH = h / S.N;
    var cellW = w / S.maxCols;
    var sh = Math.max(1.5, Math.min(rowH * 0.78, cellW * 1.6));
    var withRib = age < 2;
    ctx.save();
    ctx.globalAlpha = alpha;
    for (var i = 0; i < S.N; i++) {
      var ry = y + i * rowH + (rowH - sh) / 2;
      var list = S.stackCounts[i];
      for (var n = 0; n < list.length; n++) {
        if (list[n].k >= placed) break;
        var sx = x + n * S.bitW * cellW;
        var bits = stripCells(S, list[n].c);
        var sw = Math.max(1.5, cellW * 0.84);
        for (var j = 0; j < S.bitW; j++) {
          drawStitch(sx + j * cellW + (cellW - sw) / 2, ry, sw, sh, bits[j] === 1, pal, withRib);
        }
      }
    }
    ctx.restore();
  }

  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    phoneMode = isPhone();
    var pal = PALETTES[paletteIndex];
    var hem = phoneMode ? 12 : 16;

    // hem + ground
    ctx.fillStyle = HEM;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = GROUND;
    ctx.fillRect(hem, hem, W - 2 * hem, H - 2 * hem);
    // hem ribs: ticks perpendicular to each edge
    ctx.strokeStyle = 'rgba(58,61,70,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    var step = 7, x, y;
    for (x = hem * 0.4; x < W - hem * 0.4; x += step) {
      ctx.moveTo(x, 2); ctx.lineTo(x, hem - 2);
      ctx.moveTo(x, H - hem + 2); ctx.lineTo(x, H - 2);
    }
    for (y = hem * 0.4; y < H - hem * 0.4; y += step) {
      ctx.moveTo(2, y); ctx.lineTo(hem - 2, y);
      ctx.moveTo(W - hem + 2, y); ctx.lineTo(W - 2, y);
    }
    ctx.stroke();

    var fx = hem, fy = hem, fw = W - 2 * hem, fh = H - 2 * hem;
    var st = stateAt(mt);
    var cur = st.season;

    // visible seasons: current + up to 3 previous, newest on top
    var vis = [];
    for (var a = 0; a < 4; a++) {
      var idx = st.index - a;
      if (idx < 0) break;
      vis.push({ S: getSeason(idx), age: a });
    }
    var weights = [1, 0.8, 0.62, 0.46];
    var alphas = [1, 0.82, 0.66, 0.5];
    var wsum = 0;
    for (var v = 0; v < vis.length; v++) wsum += weights[vis[v].age];
    var by = fy;
    for (v = 0; v < vis.length; v++) {
      var bh = fh * weights[vis[v].age] / wsum;
      vis[v].y = by; vis[v].h = bh;
      by += bh;
    }

    // older seasons first (below), current season last (top band)
    for (v = vis.length - 1; v >= 1; v--) {
      drawSeason(vis[v].S, vis[v].S.total, fx, vis[v].y, fw, vis[v].h, alphas[vis[v].age], pal, vis[v].age);
    }

    // current season: landed strips
    var placedFloat = st.local * RATE;
    var placed = Math.min(cur.total, Math.floor(placedFloat));
    var frac = placedFloat - Math.floor(placedFloat);
    drawSeason(cur, placed, fx, vis[0].y, fw, vis[0].h, 1, pal, 0);

    var rowH = vis[0].h / cur.N;
    var cellW = fw / cur.maxCols;
    var sh = Math.max(1.5, Math.min(rowH * 0.78, cellW * 1.6));

    // landed glow: last few strips keep an amber fade
    for (var k = Math.max(0, placed - 8); k < placed; k++) {
      var ageS = mt - (cur.start + (k + 1) / RATE);
      if (ageS < 0 || ageS > GLOW_DUR) continue;
      var stk = cur.strips[k];
      var gx = fx + cur.posInStack[k] * cur.bitW * cellW;
      var gy = vis[0].y + stk * rowH + (rowH - sh) / 2;
      ctx.save();
      ctx.globalAlpha = 0.5 * (1 - ageS / GLOW_DUR);
      ctx.fillStyle = pal.glow;
      var sw2 = Math.max(1.5, cellW * 0.84);
      for (var q = 0; q < cur.bitW; q++) {
        rr(gx + q * cellW + (cellW - sw2) / 2, gy, sw2, sh, Math.min(2, sh * 0.3));
        ctx.fill();
      }
      ctx.restore();
    }

    // in-flight strip: hovers, slides to its stack
    if (placed < cur.total) {
      var k2 = placed;
      var stk2 = cur.strips[k2];
      var tx = fx + cur.posInStack[k2] * cur.bitW * cellW;
      var ty = vis[0].y + stk2 * rowH + (rowH - sh) / 2;
      var p = clamp(frac * (1 / RATE) / SLIDE_DUR, 0, 1);
      var ease = 1 - (1 - p) * (1 - p);
      var yStart = vis[0].y - rowH * 0.5;
      var sy = yStart + (ty - yStart) * ease;
      var glowA = holding ? 0.35 + 0.2 * Math.sin(holdPhase * 5) : 0.5;
      drawStripAt(cur, k2, tx, sy, cellW, sh, pal, 1, glowA);
    }

    // counter strip in the bottom hem: current count as bit cells
    var curCount = Math.min(cur.maxCount, placed < cur.total ? placed : cur.maxCount);
    var bits = stripCells(cur, curCount);
    var cw = Math.min(11, hem * 0.62);
    var chh = hem * 0.52;
    var cy = H - hem + (hem - chh) / 2;
    var cx0 = hem + 6;
    for (var j2 = 0; j2 < cur.bitW; j2++) {
      ctx.fillStyle = bits[j2] === 1 ? pal.one : pal.zero;
      rr(cx0 + j2 * (cw + 2), cy, cw, chh, 1.5);
      ctx.fill();
    }
  }

  // ---------- main loop ----------
  resize();
  draw();

  var lastTs = null;
  var lastPlacedKey = '';
  var lastSeasonIdx = stateAt(mt).index;
  var lastMinFloor = -1;

  function minFloor(S, placed) {
    var counts = [];
    var i;
    for (i = 0; i < S.N; i++) counts.push(0);
    for (var k = 0; k < placed && k < S.total; k++) counts[S.strips[k]]++;
    var mn = Infinity;
    for (i = 0; i < S.N; i++) if (counts[i] < mn) mn = counts[i];
    return mn;
  }

  function frame(ts) {
    if (lastTs === null) lastTs = ts;
    var dt = Math.min(0.1, (ts - lastTs) / 1000);
    lastTs = ts;
    if (holding) {
      holdPhase += dt;
    } else if (dt > 0) {
      var before = stateAt(mt);
      var beforePlaced = Math.floor((mt - before.season.start) * RATE);
      mt += dt;
      var after = stateAt(mt);
      var afterPlaced = Math.floor((mt - after.season.start) * RATE);
      if (AC) {
        if (after.index !== before.index) {
          sndZip();
        } else if (afterPlaced > beforePlaced) {
          var n = Math.min(3, afterPlaced - beforePlaced);
          for (var i = 0; i < n; i++) sndClick(beforePlaced + i);
          var mf = minFloor(after.season, afterPlaced);
          if (lastMinFloor >= 0 && mf > lastMinFloor) sndThump();
          lastMinFloor = mf;
        }
      }
      if (after.index !== lastSeasonIdx) { lastSeasonIdx = after.index; lastMinFloor = -1; }
    }
    draw();
    requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
