<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ribbon Twist</title>
<style>
html, body { margin: 0; padding: 0; background: #1E40AF; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#1E40AF';
var PLATE = '#17120F';
var PLATE_LINE = 'rgba(244,114,182,0.55)';
var TITLE_INK = '#F6F0DF';
var HINT_INK = '#F9A8D4';
var WHITE = '#FFFFFF';
var PERIOD = 16;
var FRAME_T = 4.0;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1718);
var phaseT = FRAME_T;
/* ---- spine: cubic Bezier, enters the left edge low, exits the right edge mid-high ---- */
var P0 = { x: -0.03, y: 0.30 };
var P3 = { x: 1.03, y: 0.62 };
/* control points flex with piece time; flex is a closed-form function of phaseT */
function spineCtrl(t) {
  var f = Math.sin(TAU * t / PERIOD);
  var f2 = Math.sin(TAU * t / PERIOD + 1.1);
  return {
    c1: { x: 0.30 + 0.03 * f2, y: 0.12 + 0.10 * f },
    c2: { x: 0.70 + 0.03 * f, y: 0.80 + 0.10 * f2 }
  };
}
function spinePoint(u, t) {
  var c = spineCtrl(t);
  var a = (1 - u) * (1 - u) * (1 - u), b = 3 * (1 - u) * (1 - u) * u,
      d = 3 * (1 - u) * u * u, e = u * u * u;
  return {
    x: a * P0.x + b * c.c1.x + d * c.c2.x + e * P3.x,
    y: a * P0.y + b * c.c1.y + d * c.c2.y + e * P3.y
  };
}
function spineTangent(u, t) {
  var c = spineCtrl(t);
  var dx = 3 * (1 - u) * (1 - u) * (c.c1.x - P0.x) + 6 * (1 - u) * u * (c.c2.x - c.c1.x) + 3 * u * u * (P3.x - c.c2.x);
  var dy = 3 * (1 - u) * (1 - u) * (c.c1.y - P0.y) + 6 * (1 - u) * u * (c.c2.y - c.c1.y) + 3 * u * u * (P3.y - c.c2.y);
  var m = Math.sqrt(dx * dx + dy * dy) || 1;
  return { x: dx / m, y: dy / m };
}
/* ---- twist angle: half turn across the band, travelling with time.
   The band is symmetric under a 180-degree turn, so angle + PI is the
   identical band: the 16s loop wraps with no pop. ---- */
function twistAngle(u, t) {
  return Math.PI * (u + t / PERIOD);
}
/* ---- seeded stipple: dots fixed along the band; they show where the
   twist is edge-on (cos near 0), i.e. where the band turns hardest. ---- */
var STIPPLES = 90;
var stipples = [];
var i;
for (i = 0; i < STIPPLES; i++) {
  stipples.push({
    u: 0.06 + rng() * 0.88,
    side: rng() < 0.5 ? -1 : 1,
    off: 0.55 + rng() * 0.45,   /* fraction of half-width from the spine */
    r: 0.9 + rng() * 1.8,       /* radius factor */
    a: 0.35 + rng() * 0.55
  });
}
var LINES = 15;
var SAMPLES = 64;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: square on desktop, full-bleed on phones ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function draw() {
  size();
  /* ---- blue-to-pink gradient sky fills the whole canvas ---- */
  var g = ctx.createLinearGradient(0, 0, VW, VH);
  g.addColorStop(0, '#1E40AF');
  g.addColorStop(0.42, '#3B82F6');
  g.addColorStop(0.74, '#EC4899');
  g.addColorStop(1, '#F472B6');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var sw = st.w, sh = st.h;
  var t = phaseT;
  var halfW = sh * 0.085; /* ribbon half-width */
  ctx.save();
  ctx.beginPath();
  ctx.rect(st.x, st.y, sw, sh);
  ctx.clip();
  var k, s, sp, tg, nx, ny, ang, co, si, o, px, py;
  /* ---- soft shadow under the ribbon, offset down-right ---- */
  ctx.beginPath();
  for (s = 0; s <= SAMPLES; s++) {
    sp = spinePoint(s / SAMPLES, t);
    px = st.x + sp.x * sw + 5; py = st.y + sp.y * sh + 8;
    if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.lineWidth = halfW * 1.4;
  ctx.strokeStyle = 'rgba(30,20,60,0.07)';
  ctx.lineCap = 'round';
  ctx.stroke();
  /* ---- the ribbon: LINES parallel lines, each a polyline along the spine.
     Lateral offset is o * cos(twist), so the lines pinch together where the
     band turns edge-on and spread where it lies flat: a fabric turn, and
     each line stays separate, never one thick stroked path. ---- */
  ctx.lineCap = 'round';
  for (k = 0; k < LINES; k++) {
    o = (k / (LINES - 1) * 2 - 1) * halfW;
    var edge = Math.abs(o) / halfW;
    ctx.beginPath();
    for (s = 0; s <= SAMPLES; s++) {
      var u = s / SAMPLES;
      sp = spinePoint(u, t);
      tg = spineTangent(u, t);
      nx = -tg.y; ny = tg.x;
      ang = twistAngle(u, t);
      co = Math.cos(ang); si = Math.sin(ang);
      px = st.x + sp.x * sw + nx * o * co + tg.x * o * si * 0.35;
      py = st.y + sp.y * sh + ny * o * co + tg.y * o * si * 0.35;
      if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.lineWidth = Math.max(1, sh * 0.0022);
    ctx.strokeStyle = rgba(WHITE, 0.92 - 0.30 * edge);
    ctx.stroke();
  }
  /* ---- stipple dots along the twist edges, strongest where edge-on ---- */
  for (k = 0; k < STIPPLES; k++) {
    var d = stipples[k];
    ang = twistAngle(d.u, t);
    var edgeOn = 1 - Math.abs(Math.cos(ang));
    if (edgeOn < 0.45) continue;
    sp = spinePoint(d.u, t);
    tg = spineTangent(d.u, t);
    nx = -tg.y; ny = tg.x;
    px = st.x + sp.x * sw + nx * d.side * d.off * halfW;
    py = st.y + sp.y * sh + ny * d.side * d.off * halfW;
    var dr = Math.max(0.7, sh * 0.0011 * d.r);
    ctx.fillStyle = rgba(WHITE, d.a * edgeOn);
    ctx.beginPath();
    ctx.arc(px, py, dr, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Ribbon Twist').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Ribbon Twist').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 09 · 25').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Ribbon Twist', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 09 · 25', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    lineCount: function () { return LINES; },
    twistAngle: function (u, t) { return twistAngle(u, t); },
    phaseT: function () { return phaseT; }
  };
}
/* ---- frame one: fixed phase t = 4.0s of a 16s period (quarter period,
   twist shifted 45 degrees, band mid-twist with the pinch legible) ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % PERIOD;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
