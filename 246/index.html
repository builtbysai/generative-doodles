<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.246 The Collapse</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#E8F0F5; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.246 The Collapse (Avantika Bawa). After A Pink Scaffold:
// The Collapse, 2020: a pink scaffold lying fallen in a white
// salt desert, poles splayed, the bay at the left still
// upright. On a forty five second loop it reassembles itself
// bay by bay, each pole rising with a small overshoot wobble,
// stands whole and full pink for five seconds, then drops
// again in three, staggered pole by pole, and rests. No
// debris, no drama: resilience and resurrection in its bones.
// Watch only.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var SALT = '#FAFAF7', FALLEN = '#FF7FAE', STANDING = '#FF0080';
var SKY = '#E8F0F5', HAZE = '#D8DDE0';
var W = 0, H = 0, phone = false;
var T = 23, lastNow = -1; // frame one: late in the rebuild, last poles still rising

function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mix(h1, h2, f) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f) + ')';
}
function rng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var COLS = 4, LEVELS = 3, SEGLEN = 110, BASEY = 640, X0 = 270, BAYW = 145;
var LOOP = 45;

// Fallen angle per segment (degrees from vertical), columns 0..4,
// segments bottom..top. The left bay barely falls: one corner
// of the structure stays upright even in ruin. Seeded jitter.
var FALL = [];
(function () {
  var table = [
    [2, 4, 6],
    [6, 9, 12],
    [24, 46, 70],
    [42, 76, -88],
    [50, 80, 100]
  ];
  var r = rng(24607);
  for (var c = 0; c <= COLS; c++) {
    FALL.push([]);
    for (var l = 0; l < LEVELS; l++) {
      FALL[c].push(table[c][l] + (r() - 0.5) * 10);
    }
  }
})();

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function easeOutBack(p) { return 1 + 2.0 * Math.pow(p - 1, 3) + 1.0 * Math.pow(p - 1, 2); }

// Segment angles for loop time lt, per the state machine:
// fallen 0-8, building 8-28, standing 28-33, collapsing 33-36,
// rest 36-45.
function anglesAt(lt) {
  var out = [];
  for (var c = 0; c <= COLS; c++) {
    out.push([]);
    for (var l = 0; l < LEVELS; l++) {
      var f = FALL[c][l], a;
      if (lt < 8) {
        a = f;
      } else if (lt < 28) {
        var start = 8 + c * 3.6 + l * 1.15;
        var p = clamp01((lt - start) / 5.2);
        a = p <= 0 ? f : (p >= 1 ? 0 : f * (1 - easeOutBack(p)));
      } else if (lt < 33) {
        a = 0.7 * Math.sin(T * 0.9 + c * 1.3 + l);
      } else if (lt < 36) {
        var d = c * 0.22 + l * 0.12;
        var q = clamp01((lt - 33 - d) / 1.5);
        a = f * Math.pow(q, 1.8);
      } else {
        a = f;
      }
      out[c].push(a);
    }
  }
  return out;
}

function draw() {
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, W, H);
  var s = Math.min(W / 1200, H / 800);
  ctx.save();
  ctx.translate((W - 1200 * s) / 2, (H - 800 * s) / 2);
  ctx.scale(s, s);
  ctx.beginPath();
  ctx.rect(0, 0, 1200, 800);
  ctx.clip();

  // sky, haze band straddling the horizon, salt flat
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, 1200, 320);
  ctx.fillStyle = HAZE;
  ctx.fillRect(0, 296, 1200, 56);
  ctx.fillStyle = SALT;
  ctx.fillRect(0, 320, 1200, 480);
  // contact shading under the structure
  ctx.fillStyle = 'rgba(216,221,224,0.55)';
  ctx.fillRect(240, 634, 640, 16);

  var lt = T % LOOP;
  var ang = anglesAt(lt);

  // node positions per column, cumulative along the segments,
  // resting on the salt if a fallen pole would dip below it
  var nodes = [];
  var standSum = 0, standN = 0;
  for (var c = 0; c <= COLS; c++) {
    nodes.push([{ x: X0 + c * BAYW, y: BASEY }]);
    for (var l = 0; l < LEVELS; l++) {
      var rad = ang[c][l] * Math.PI / 180;
      var prev = nodes[c][l];
      var ny = prev.y - Math.cos(rad) * SEGLEN;
      if (ny > 652) ny = 652;
      nodes[c].push({ x: prev.x + Math.sin(rad) * SEGLEN, y: ny });
      standSum += 1 - Math.min(1, Math.abs(ang[c][l]) / 95);
      standN++;
    }
  }
  var u = standSum / standN; // global standingness
  var levelCol = mix(FALLEN, STANDING, u);

  ctx.lineCap = 'round';
  // diagonals
  ctx.strokeStyle = levelCol;
  ctx.lineWidth = 4;
  ctx.beginPath();
  for (var b = 0; b < COLS; b++) {
    for (var l2 = 0; l2 < LEVELS; l2++) {
      ctx.moveTo(nodes[b][l2].x, nodes[b][l2].y);
      ctx.lineTo(nodes[b + 1][l2 + 1].x, nodes[b + 1][l2 + 1].y);
    }
  }
  ctx.stroke();
  // horizontals at each level
  ctx.lineWidth = 6;
  ctx.beginPath();
  for (var l3 = 0; l3 <= LEVELS; l3++) {
    for (var b2 = 0; b2 < COLS; b2++) {
      ctx.moveTo(nodes[b2][l3].x, nodes[b2][l3].y);
      ctx.lineTo(nodes[b2 + 1][l3].x, nodes[b2 + 1][l3].y);
    }
  }
  ctx.stroke();
  // verticals, coloured per segment by its own standingness
  ctx.lineWidth = 7;
  for (var c2 = 0; c2 <= COLS; c2++) {
    for (var l4 = 0; l4 < LEVELS; l4++) {
      var st = 1 - Math.min(1, Math.abs(ang[c2][l4]) / 95);
      ctx.strokeStyle = mix(FALLEN, STANDING, st);
      ctx.beginPath();
      ctx.moveTo(nodes[c2][l4].x, nodes[c2][l4].y);
      ctx.lineTo(nodes[c2][l4 + 1].x, nodes[c2][l4 + 1].y);
      ctx.stroke();
    }
  }
  // couplers
  ctx.fillStyle = levelCol;
  for (var c3 = 0; c3 <= COLS; c3++) {
    for (var l5 = 0; l5 <= LEVELS; l5++) {
      ctx.beginPath();
      ctx.arc(nodes[c3][l5].x, nodes[c3][l5].y, 4.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore();
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- frame --------------------------------------------------------------------------------
// No interaction handlers at all: watch only.
function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  T += dt;
  draw();
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
