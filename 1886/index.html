<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locking In</title>
<style>
html, body { margin: 0; padding: 0; background: #0D0D0F; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Locking In: two pendulums hang side by side in a dark room, each
   trailing a ribbon of its recent motion, one deep blue, one warm
   amber. They start out of phase, swinging at slightly different
   tempos. Over about a minute the ribbons braid: the tempos converge,
   the swings synchronize, the two ribbons merge into one braided
   band, and a shared beat sounds, one pulse per crossing. It holds,
   breathing slightly, for as long as nobody touches it. Drag either
   pendulum to disturb the lock: the braid unravels, the tempos
   split, and then, on their own, they find each other again. */
var TAU = Math.PI * 2;
var ROOM = '#0D0D0F';
var ROOM_GLOW = '#141419';
var BEAM = '#1C1C20';
var BEAM_EDGE = '#2A2A30';
var BRASS = '#B08D3E';
var BRASS_DEEP = '#7A5F28';
var BRASS_LIGHT = '#D9B45C';
var BLUE = '#1F3A6E';
var BLUE_LIGHT = '#3E63A8';
var AMBER = '#D98A2B';
var AMBER_LIGHT = '#F0A94E';
var GOLD = '#C9A227';
var GOLD_DEEP = '#9A7B1A';
var CREAM = '#EFE6D0';
var CREAM_DIM = '#C9BFA4';
var PLATE = '#141416';
var PLATE_LINE = 'rgba(201,162,39,0.45)';
var TITLE_INK = '#EFE6D0';
var HINT_INK = '#D8B878';
var INK = '#1E1710';
var SEED0 = 1886;
var FRAME_T = 35.0;   /* fixed phase: mid-convergence, braid partly formed */
var AMP = 0.50;       /* swing amplitude, radians */
var LEN = 0.55;       /* pendulum length, fraction of U */
var W1 = 2.856;       /* natural frequency, pendulum 1 (period ~2.20 s) */
var W2 = 2.618;       /* natural frequency, pendulum 2 (period ~2.40 s) */
var TRAIL_N = 72;     /* trail samples, 0.05 s apart, about 3.6 s of motion */
var DT = 0.025;       /* fixed integration substep, seconds */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smooth(f) { f = clamp(f, 0, 1); return f * f * (3 - 2 * f); }
function wrapPi(a) {
  while (a > Math.PI) a -= TAU;
  while (a < -Math.PI) a += TAU;
  return a;
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
/* ---- oscillators: Kuramoto-style coupling that strengthens as the
   phase difference falls and as the first minute passes. The lock is
   a felt phenomenon: two tempos drifting, then finding one beat. ---- */
var osc = [
  { th: 0.30, w: W1, prevSin: 0 },
  { th: 2.20, w: W2, prevSin: 0 }
];
var simT = 0;
var kickT = -1000;    /* sim time of the last drag release; coupling rebuilds over ~30 s after it */
var dragging = -1;      /* which pendulum is held, -1 for none */
var dragAngle = 0;
var dragVelSign = 1;
var lastDragX = 0;
function coupling(t, diff) {
  var base = 0.04 + 0.30 * smooth(t / 50);
  var near = 1 + 1.2 * Math.max(0, 1 - Math.abs(diff) / 0.8);
  /* after a drag the coupling is broken and rebuilds over about
     30 seconds, so the re-lock takes its time instead of snapping */
  var recovery = smooth(clamp((t - kickT) / 30, 0, 1));
  return base * near * (0.12 + 0.88 * recovery);
}
function phaseDiff() { return wrapPi(osc[0].th - osc[1].th); }
function locked() { return Math.abs(phaseDiff()) < 0.35; }
function ampAt(t) { return AMP * (1 + 0.05 * Math.sin(t * 0.15)); }
function angleOf(i, t) {
  if (i === dragging) return dragAngle;
  return ampAt(t) * Math.sin(osc[i].th);
}
/* One fixed integration substep of the coupled phases. The dragged
   pendulum does not integrate; it follows the pointer instead. */
function stepOsc(dt) {
  var d = phaseDiff();
  var k = coupling(simT, d);
  var i, j, dth;
  for (i = 0; i < 2; i++) {
    if (i === dragging) continue;
    j = 1 - i;
    dth = osc[i].w + k * Math.sin(osc[j].th - osc[i].th);
    osc[i].th += dth * dt;
  }
  simT += dt;
}
/* ---- trail: past bob positions, newest last ---- */
var trail = [];   /* {x1, y1, x2, y2} in canvas pixels */
function layout() {
  var U = Math.min(VW, VH);
  var sqX = (VW - U) / 2, sqY = (VH - U) / 2;
  var cx = sqX + U / 2;
  var beamY = sqY + U * 0.14;
  var piv = [
    { x: cx - U * 0.045, y: beamY },
    { x: cx + U * 0.045, y: beamY }

  return { U: U, sqX: sqX, sqY: sqY, cx: cx, beamY: beamY, piv: piv, L: U * LEN };
}
function bobPos(i, t) {
  var lay = layout();
  var a = angleOf(i, t);
  var L = lay.L;
  return {
    x: lay.piv[i].x + L * Math.sin(a),
    y: lay.piv[i].y + L * Math.cos(a),
    a: a
  };
}
function pushTrail() {
  var b0 = bobPos(0, simT), b1 = bobPos(1, simT);
  trail.push({ x1: b0.x, y1: b0.y, x2: b1.x, y2: b1.y });
  while (trail.length > TRAIL_N) trail.shift();
}
/* Deterministic run-up: integrate from t = 0 to FRAME_T with fixed
   substeps, so frame one is a pure function of the seed and the
   constants, never of the wall clock. */
function buildInitial() {
  trail = [];
  simT = 0;
  osc[0].th = 0.30;
  osc[1].th = 2.20;
  var steps = Math.round(FRAME_T / DT);
  var s;
  for (s = 0; s < steps; s++) {
    stepOsc(DT);
    if (s % 2 === 0) pushTrail();
  }
  osc[0].prevSin = Math.sin(osc[0].th);
  osc[1].prevSin = Math.sin(osc[1].th);
}
/* ---- WebAudio: lazy, only inside a user gesture, default silent ---- */
var audioCtx = null;
var audioReady = false;
var soundOn = false;
function ensureAudio() {
  if (audioCtx) return;
  try {
    var AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return;
    audioCtx = new AC();
    audioReady = true;
  } catch (e) { audioCtx = null; audioReady = false; }
}
function tick() {
  if (!audioCtx || !audioReady || !soundOn) return;
  try {
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.value = 170;
    var now = audioCtx.currentTime;
    g.gain.setValueAtTime(0.11, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now); o.stop(now + 0.10);
  } catch (e) { /* audio is a garnish; never break the picture */ }
}
/* One soft wooden tick per crossing, only while the lock holds. */
function beatCheck() {
  var i, s;
  for (i = 0; i < 2; i++) {
    s = Math.sin(osc[i].th);
    if (osc[i].prevSin !== 0 && ((s > 0) !== (osc[i].prevSin > 0))) {
      if (locked()) tick();

    osc[i].prevSin = s;
  }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function drawRoom(lay) {
  var U = lay.U;
  ctx.fillStyle = ROOM;
  ctx.fillRect(0, 0, VW, VH);
  /* faint warm glow behind the beam, so the black room has depth */
  var g = ctx.createRadialGradient(lay.cx, lay.beamY, U * 0.05, lay.cx, lay.beamY + U * 0.25, U * 0.75);
  g.addColorStop(0, 'rgba(31,58,110,0.16)');
  g.addColorStop(0.55, 'rgba(20,20,25,0.10)');
  g.addColorStop(1, 'rgba(13,13,15,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
  /* floor line, low and quiet */
  ctx.strokeStyle = 'rgba(239,230,208,0.07)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, lay.sqY + U * 0.94);
  ctx.lineTo(VW, lay.sqY + U * 0.94);
  ctx.stroke();
  /* the single dark beam the pendulums hang from */
  var beamH = Math.max(6, U * 0.018);
  ctx.fillStyle = BEAM;
  ctx.fillRect(lay.sqX + U * 0.06, lay.beamY - beamH / 2, U * 0.88, beamH);
  ctx.strokeStyle = BEAM_EDGE;
  ctx.lineWidth = 1;
  ctx.strokeRect(lay.sqX + U * 0.06 + 0.5, lay.beamY - beamH / 2 + 0.5, U * 0.88 - 1, beamH - 1);
  var i;
  for (i = 0; i < 2; i++) {
    ctx.fillStyle = BRASS_DEEP;
    ctx.beginPath();
    ctx.moveTo(lay.piv[i].x + U * 0.008, lay.beamY);
    ctx.arc(lay.piv[i].x, lay.beamY, U * 0.008, 0, TAU);
    ctx.fill();
  }
}
/* A ribbon is a tapering strip, drawn as one filled quad per trail
   segment so it stays continuous even where the bob moves fast
   (a stroked polyline with round caps reads as beads at speed). */
function drawRibbon(points, color, light, U) {
  var n = points.length;
  if (n < 2) return;
  var i, f0, f1, w0, w1, dx, dy, len, nx, ny;
  for (i = 1; i < n; i++) {
    f0 = (i - 1) / (n - 1);
    f1 = i / (n - 1);
    w0 = lerp(U * 0.0015, U * 0.014, f0 * f0) / 2;
    w1 = lerp(U * 0.0015, U * 0.014, f1 * f1) / 2;
    dx = points[i].x - points[i - 1].x;
    dy = points[i].y - points[i - 1].y;
    len = Math.hypot(dx, dy) || 1;
    nx = -dy / len; ny = dx / len;
    ctx.fillStyle = rgba(color, 0.06 + 0.80 * f1 * f1);
    ctx.beginPath();
    ctx.moveTo(points[i - 1].x + nx * w0, points[i - 1].y + ny * w0);
    ctx.lineTo(points[i].x + nx * w1, points[i].y + ny * w1);
    ctx.lineTo(points[i].x - nx * w1, points[i].y - ny * w1);
    ctx.lineTo(points[i - 1].x - nx * w0, points[i - 1].y - ny * w0);
    ctx.closePath();
    ctx.fill();
  }
}
/* The braid: the two pendulums hang close together, so when the lock
   holds their ribbons lie nearly on top of each other, and a gold
   band runs along the midpoint path between them, newest first and
   fading back, the two ribbons merged into one braided band. When
   the lock breaks, the band is gone and the ribbons part. */
function drawBraid(U) {
  var n = trail.length;
  if (n < 2 || !locked()) return;
  var i, f;
  var start = Math.floor(n * 0.4);
  var prev = null;
  for (i = start; i < n; i++) {
    var mx = (trail[i].x1 + trail[i].x2) / 2;
    var my = (trail[i].y1 + trail[i].y2) / 2;
    f = i / (n - 1);
    if (prev) {
      var w0 = lerp(U * 0.003, U * 0.009, prev.f) / 2;
      var w1 = lerp(U * 0.003, U * 0.009, f) / 2;
      var dx = mx - prev.x, dy = my - prev.y;
      var len = Math.hypot(dx, dy) || 1;
      var nx = -dy / len, ny = dx / len;
      ctx.fillStyle = rgba(GOLD, 0.75 * smooth((f - 0.4) / 0.6));
      ctx.beginPath();
      ctx.moveTo(prev.x + nx * w0, prev.y + ny * w0);
      ctx.lineTo(mx + nx * w1, my + ny * w1);
      ctx.lineTo(mx - nx * w1, my - ny * w1);
      ctx.lineTo(prev.x - nx * w0, prev.y - ny * w0);
      ctx.closePath();
      ctx.fill();
    }
    prev = { x: mx, y: my, f: f };
  }
}
function drawPendulum(i, lay, t) {
  var U = lay.U;
  var b = bobPos(i, t);
  var p = lay.piv[i];
  /* rod */
  ctx.strokeStyle = i === 0 ? BLUE_LIGHT : AMBER_LIGHT;
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = Math.max(1, U * 0.002);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
  ctx.globalAlpha = 1;
  /* brass bob, with a small highlight so it reads as metal */
  var r = U * 0.032;
  ctx.fillStyle = BRASS_DEEP;
  ctx.beginPath();
  ctx.moveTo(b.x + r, b.y);
  ctx.arc(b.x, b.y, r, 0, TAU);
  ctx.fill();
  ctx.fillStyle = BRASS;
  ctx.beginPath();
  ctx.moveTo(b.x + r * 0.82, b.y);
  ctx.arc(b.x, b.y, r * 0.82, 0, TAU);
  ctx.fill();
  ctx.fillStyle = BRASS_LIGHT;
  ctx.beginPath();
  ctx.moveTo(b.x - r * 0.28, b.y - r * 0.34);
  ctx.arc(b.x - r * 0.30, b.y - r * 0.34, r * 0.22, 0, TAU);
  ctx.fill();
  return b;
}
function drawPlaque(lay) {
  var U = lay.U;
  var text = 'finding the beat that works';
  var fs = isPhone ? 10 : 12;
  ctx.font = fs + 'px monospace';
  var tw = ctx.measureText(text).width;
  while (fs > 8 && tw > U * 0.46) {
    fs -= 1;
    ctx.font = fs + 'px monospace';
    tw = ctx.measureText(text).width;
  }
  var pw = tw + 28;
  var ph = fs + 16;
  var px = lay.cx - pw / 2;
  var py = lay.sqY + U * 0.815;
  ctx.fillStyle = CREAM;
  ctx.fillRect(px, py, pw, ph);
  ctx.strokeStyle = BRASS_DEEP;
  ctx.lineWidth = 1;
  ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
  ctx.fillStyle = INK;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'italic ' + fs + 'px monospace';
  ctx.fillText(text, lay.cx, py + ph / 2 + 1);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';

var soundRect = { x: 0, y: 0, w: 0, h: 0 };
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Locking In').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Locking In').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 03 · 12').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Locking In', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 03 · 12', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Drag a pendulum to break the lock.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  var snd = soundOn ? 'Sound: on' : 'Sound: off';
  ctx.font = smallPx + 'px monospace';
  var sndW = ctx.measureText(snd).width;
  var sndPlateW = sndW + 24;
  var sndPlateH = smallPx + 14;
  var sndPlateX = VW - sndPlateW - 12;
  var sndPlateY = VH - sndPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(sndPlateX, sndPlateY, sndPlateW, sndPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(sndPlateX + 0.5, sndPlateY + 0.5, sndPlateW - 1, sndPlateH - 1);
  ctx.fillStyle = soundOn ? GOLD : HINT_INK;

function draw() {
  size();

/* ---- pointer: drag a pendulum, or tap the sound plate ---- */

function angleFromPointer(i, p) {

    try { if (audioCtx.resume) audioCtx.resume(); } catch (e) { /* ignore */ }

function onMove(ev) {

  lastDragX = p.x;

function onUp() {

/* Debug hook for the QA probe: lets a harness kick a phase and read

    simT: function () { return simT; },
    trailLength: function () { return trail.length; },

/* ---- frame one: fixed phase t = 35 s, mid-convergence ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);

    var acc = 0;
    function step(now) {
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      acc += dt;
      while (acc >= DT) {
        stepOsc(DT);
        pushTrail();
        acc -= DT;
      }
      beatCheck();
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
