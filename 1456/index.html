<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One-Way Ticket</title>
<style>
  html, body { margin: 0; padding: 0; background: #101820; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  // Seeded PRNG (mulberry32). Never Math.random: frame one must be reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1456000);
  // Seeded doorway neon phases (stable every run; neon base glow breathes slowly).
  var neonPhase = [rng() * 6.283, rng() * 6.283, rng() * 6.283];

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
  }
  size();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', size);
    }
    window.addEventListener('resize', size);
  }

  var STREET = '#101820', PAVE = '#232c38', IVORY = '#f2ead8',
      SCARLET = '#c1272d', AMBER = '#e8a33d', TEAL = '#2e6f6a',
      SLATE = '#6b7686';

  function a4(x) { return Math.round(x * 10000) / 10000; }
  function hexRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  function rgba(hex, a) {
    var c = hexRgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a4(a) + ')';
  }
  function rect(x, y, w, h, col) {
    ctx.fillStyle = col;
    ctx.fillRect(x, y, w, h);
  }
  function dot(x, y, r, col) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
  }
  function poly(pts, col) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
  }

  // ---- Motion model: closed-form over piece time and recorded drag events. ----
  // Speed segments: {t, kind:'const'|'decay', v, v0, tau}. Position is the
  // analytic integral of speed, so frame one and every frame are reproducible.
  var segs = [];
  var baseSpeed = 0; // px/s, set per viewport in geom()
  function speedAt(t, seg) {
    if (!seg) return baseSpeed;
    if (seg.kind === 'const') return seg.v;
    return baseSpeed + (seg.v0 - baseSpeed) * Math.exp(-(t - seg.t) / seg.tau);
  }
  function segAt(t) {
    var s = null;
    for (var i = 0; i < segs.length; i++) {
      if (segs[i].t <= t) s = segs[i]; else break;
    }
    return s;
  }
  function distAt(t) {
    var bounds = [0];
    for (var i = 0; i < segs.length; i++) {
      if (segs[i].t > 0 && segs[i].t < t) bounds.push(segs[i].t);
    }
    bounds.push(t);
    var d = 0;
    for (var j = 0; j < bounds.length - 1; j++) {
      var a = bounds[j], b = bounds[j + 1];
      var s = segAt(a);
      if (!s || s.kind === 'const') {
        d += (s ? s.v : baseSpeed) * (b - a);
      } else {
        d += baseSpeed * (b - a) + (s.v0 - baseSpeed) * s.tau *
          (Math.exp(-(a - s.t) / s.tau) - Math.exp(-(b - s.t) / s.tau));
      }
    }
    return d;
  }
  function pushSeg(s) {
    // Drop any later segments (a new drag supersedes them), keep order.
    while (segs.length && segs[segs.length - 1].t >= s.t) segs.pop();
    segs.push(s);
  }

  // Drag state (pointer time is piece time, supplied by the rAF loop).
  var dragging = null; // {lastX, lastT, lastSpeed}
  function onDown(x, y, t) {
    dragging = { lastX: x, lastT: t, lastSpeed: speedAt(t, segAt(t)) };
  }
  function onMove(x, y, t) {
    if (!dragging) return;
    var dt = t - dragging.lastT;
    if (dt <= 0) return;
    var vx = (x - dragging.lastX) / dt; // px per second of drag
    var factor = 1 + vx * 0.004;
    if (factor < 0.15) factor = 0.15;
    if (factor > 4) factor = 4;
    pushSeg({ t: t, kind: 'const', v: baseSpeed * factor });
    dragging.lastX = x; dragging.lastT = t;
    dragging.lastSpeed = baseSpeed * factor;
  }
  function onUp(x, y, t) {
    if (!dragging) return;
    pushSeg({ t: t, kind: 'decay', v0: dragging.lastSpeed, tau: 0.9 });
    dragging = null;
  }

  function geom() {
    var figH = H * 0.42;
    var figW = figH * 0.42;
    var wrap = W + 2 * figW;
    baseSpeed = wrap / 48; // one full street crossing per 48 s
    var paveTop = H * 0.58;
    var doors = [
      { fx: 0.30, w: Math.max(46, W * 0.085) },
      { fx: 0.58, w: Math.max(46, W * 0.085) },
      { fx: 0.84, w: Math.max(46, W * 0.085) }
    ];
    return { figH: figH, figW: figW, wrap: wrap, paveTop: paveTop, doors: doors };
  }
  function mod(n, m) { return ((n % m) + m) % m; }

  function draw(t) {
    var g = geom();
    var figH = g.figH, figW = g.figW, wrap = g.wrap, paveTop = g.paveTop;
    // Night street + pavement band.
    rect(0, 0, W, H, STREET);
    rect(0, paveTop, W, H - paveTop, PAVE);
    // Pavement edge line.
    rect(0, paveTop, W, Math.max(2, H * 0.004), rgba(IVORY, 0.12));

    var dist = distAt(t);
    var x0 = W * 0.32 + figW; // frame one: figure left-of-center
    var px = mod(x0 + dist, wrap) - figW; // figure left edge
    var stride = figH * 0.30;
    var phase = (mod(dist, stride) / stride) * Math.PI * 2;
    var legSwing = Math.sin(phase) * figH * 0.055;

    // Doorways + neon. Flash peaks as the figure passes (distance function).
    var doorFlash = [];
    for (var d = 0; d < g.doors.length; d++) {
      var door = g.doors[d];
      var dx = door.fx * W;
      var dw = door.w, dh = H * 0.30;
      var dy = paveTop - dh;
      var distTo = Math.abs((px + figW * 0.5) - dx);
      var sigma = W * 0.07;
      var flash = Math.exp(-(distTo * distTo) / (2 * sigma * sigma));
      doorFlash.push(flash);
      // Doorway: teal block with a dark interior panel.
      rect(dx - dw / 2, dy, dw, dh, TEAL);
      rect(dx - dw / 2 + dw * 0.18, dy + dh * 0.10, dw * 0.64, dh * 0.90, STREET);
      // Neon sign above the doorway: amber bar, brightness = base + flash.
      var breathe = 0.5 + 0.5 * Math.sin(t * 0.9 + neonPhase[d]);
      var glow = 0.30 + 0.55 * flash + 0.15 * breathe;
      if (glow > 1) glow = 1;
      rect(dx - dw * 0.62, dy - H * 0.045, dw * 1.24, H * 0.022, rgba(AMBER, glow));
      // Flat-alpha halo layers around the sign (never a gradient).
      rect(dx - dw * 0.72, dy - H * 0.065, dw * 1.44, H * 0.062, rgba(AMBER, 0.10 * flash + 0.03));
      rect(dx - dw * 0.66, dy - H * 0.055, dw * 1.32, H * 0.042, rgba(AMBER, 0.16 * flash + 0.04));
    }

    // Chorus: triangle (Social Question), circle (Exact Statistics),
    // square (Common Sense). Small, trailing, always behind the figure.
    // Tilt toward her grows as she nears a bar.
    var nearBar = 0;
    for (var k = 0; k < doorFlash.length; k++) if (doorFlash[k] > nearBar) nearBar = doorFlash[k];
    var tilt = nearBar * 0.38; // radians toward the figure
    // Trailing offsets as fractions of frame width, so the chorus stays
    // visible behind her on phones too (figW-scaled offsets pushed the
    // square off-frame on narrow screens). No wrap: trailing figures may
    // sit off-screen left until she walks further right.
    var offsets = [W * 0.10, W * 0.17, W * 0.24];
    var shapes = ['tri', 'circ', 'sq'];
    var cy = paveTop - figH * 0.82; // head height: clears the coat so the
    // trailing shapes stay readable beside her even on narrow phones
    for (var s = 0; s < 3; s++) {
      var cx = px + figW * 0.5 - offsets[s];
      var r = figH * 0.055;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-tilt);
      if (shapes[s] === 'tri') {
        poly([[0, -r], [r * 0.9, r * 0.8], [-r * 0.9, r * 0.8]], SLATE);
      } else if (shapes[s] === 'circ') {
        dot(0, 0, r, SLATE);
      } else {
        rect(-r * 0.85, -r * 0.85, r * 1.7, r * 1.7, SLATE);
      }
      ctx.restore();
    }

    // Figure: elegant silhouette, scarlet coat block, ivory head/hands/legs.
    var fx = px, fy = paveTop; // feet baseline
    var headR = figH * 0.085;
    var headY = fy - figH + headR;
    var hipY = fy - figH * 0.42;
    var legLen = figH * 0.40;
    var legW = figH * 0.055;
    // Legs: walk cycle of a few frames, phase tied to distance walked.
    var swingA = legSwing, swingB = -legSwing;
    ctx.save();
    ctx.translate(fx + figW * 0.5, 0);
    // Back leg.
    rect(-legW * 0.5 + swingB * 0.4, hipY, legW, legLen, IVORY);
    // Coat: long scarlet trapezoid from shoulders to below the knee.
    var shoulderY = fy - figH * 0.86;
    var coatTop = figW * 0.30, coatBot = figW * 0.52;
    var sway = Math.sin(phase) * figH * 0.012;
    poly([
      [-coatTop / 2 + sway, shoulderY],
      [coatTop / 2 + sway, shoulderY],
      [coatBot / 2, fy - figH * 0.10],
      [-coatBot / 2, fy - figH * 0.10]
    ], SCARLET);
    // Front leg.
    rect(-legW * 0.5 + swingA * 0.4, hipY, legW, legLen, IVORY);
    // Head + hair mass, arms at the sides.
    dot(0, headY, headR, IVORY);
    rect(-figW * 0.34, shoulderY + figH * 0.02, figW * 0.10, figH * 0.30, SCARLET);
    rect(figW * 0.24, shoulderY + figH * 0.02, figW * 0.10, figH * 0.30, SCARLET);
    dot(-figW * 0.29, shoulderY + figH * 0.34, figH * 0.028, IVORY);
    dot(figW * 0.29, shoulderY + figH * 0.34, figH * 0.028, IVORY);
    ctx.restore();
  }

  // Frame one: synchronous constant-phase draw.
  draw(0);

  // Probe hooks (used by the QA harness only; harmless in the browser).
  if (typeof window !== 'undefined') {
    window.__piece = {
      draw: draw, down: onDown, move: onMove, up: onUp,
      distAt: distAt, speedAt: function (t) { return speedAt(t, segAt(t)); }
    };
  }

  // Pointer input: drag moves her along the street faster or slower.
  // Never restarts the walk, never changes her direction, never reloads.
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      onDown(e.clientX, e.clientY, pieceTime());
    });
    canvas.addEventListener('pointermove', function (e) {
      onMove(e.clientX, e.clientY, pieceTime());
    });
    var endDrag = function (e) { onUp(e.clientX, e.clientY, pieceTime()); };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
  }

  var started = false, t0 = 0;
  function pieceTime() {
    if (!started) return 0;
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - t0) / 1000;
    return (Date.now() - t0) / 1000;
  }
  function loop(ts) {
    if (!started) { started = true; t0 = ts; }
    draw((ts - t0) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
