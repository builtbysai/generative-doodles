<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.421 DOGUE</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FF4FA3; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.421 DOGUE (kittyo.illustration, EXPANSION #45).
// After Kitty O'Rourke's DOGUE magazine-cover parody:
// a brown poodle cover girl in a red beret, black
// sunglasses and a cream jacket patterned with red
// hearts, chin up on a flat hot-pink ground. The
// masthead and cover lines are the piece's designed
// text (the set's text rule: no signature anywhere),
// drawn as hand-lettered STROKE PATHS on this one
// canvas, never system fonts, no real magazine
// branding. TAP anywhere re-sets the cover lines:
// each of the three slots advances through a FIXED
// AUTHORED CYCLE of the seven-line humour pool, so
// the three lines on the cover are always distinct
// and always in authored order, never a runtime
// random pick. Each slot flips through scaleX 0 on
// fixed ticks, the words swapping at the midpoint,
// the slots staggered so the flip cascades. Ambient
// 30s loop, all on whole cycles: the beret sways
// 3 degrees, one authored jacket heart pulses, and
// the poodle blinks at fixed slots (the eyes sit
// behind the sunglasses in her recipe, so the blink
// is the shades dipping in height). The barcode box
// is geometric bar data from a fixed table, not a
// scannable code. Frame one is the cover complete at
// the constant phase T = 6.3s with the first three
// pool lines in place; the clock is anchored there
// and advances in fixed 1/60 ticks, never from a wall
// clock. Flat colour only, one canvas, no offscreen
// canvas, no gradients, no shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette (closed) -----------------------------------
var PINK = '#FF4FA3';      // ground
var BROWN = '#8A5A3B';     // poodle
var CURL = '#5A3A24';      // darker curls
var RED = '#E63329';       // beret, jacket hearts
var INK = '#1A1A1A';       // sunglasses, outlines, shadows
var CREAM = '#FFF6E8';     // jacket, lettering
var WHITE = '#FFFFFF';     // barcode box
var YELLOW = '#FFD832';    // patch

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 30;
if (LOOP !== 30) throw new Error('DOGUE ambient loop must be 30s');
var TICK = 1 / 60;
var T0 = 6.3;
var T = T0;

// ---- the fixed authored cover-line pool -----------------
// Seven lines, authored display rows (long lines wrap
// to two rows inside their slot). Frame one shows
// pool entries 0, 1, 2 in slots 1, 2, 3. Tap n shows
// entry (slot + n) mod 7 in each slot.
var POOL = [
  { rows: ['BEST GIRL'] },
  { rows: ['THE LOVE', 'EDIT'] },
  { rows: ['SASSY'] },
  { rows: ['CUPID PUPS'] },
  { rows: ['WAG MORE'] },
  { rows: ['TREAT', 'YOURSELF'] },
  { rows: ['PAWS &', 'POSE'] }
];
if (POOL.length !== 7) throw new Error('humour pool must hold exactly 7 lines');

// Three slots down the left edge, each with its own
// angle. Letter height and anchor per slot.
var SLOTS = [
  { x: 58, y: 330, rot: -0.070, h: 44 },
  { x: 66, y: 486, rot: 0.052, h: 44 },
  { x: 54, y: 636, rot: -0.045, h: 44 }
];
if (SLOTS.length !== 3) throw new Error('cover must hold exactly 3 line slots');

// Blink slots inside the 30s loop (the prompt's 5-8s
// timer made fixed): centres in seconds, 0.22s long,
// one blink at a time, never two together.
var BLINKS = [4.0, 11.5, 19.0, 26.5];
if (BLINKS.length !== 4) throw new Error('blink table must hold exactly 4 slots');

// Barcode bars: fixed authored widths (in bar units),
// decorative geometry only, not a scannable code.
var BARS = [3, 1, 2, 1, 1, 3, 1, 2, 2, 1, 3, 1, 1, 2, 1, 1,
            3, 2, 1, 2, 1, 1, 3, 1, 2, 1, 1, 2, 2, 1, 3, 1];
if (BARS.length !== 32) throw new Error('barcode must hold exactly 32 bars');

// Jacket hearts: fixed authored table (design coords,
// size, tilt). Entry PULSE_HEART is the one that
// pulses on the 30s loop.
var HEARTS = [
  { x: 520, y: 660, s: 26, r: -0.15 }, { x: 640, y: 700, s: 30, r: 0.12 },
  { x: 770, y: 662, s: 24, r: 0.20 },  { x: 905, y: 700, s: 29, r: -0.10 },
  { x: 575, y: 790, s: 29, r: 0.08 },  { x: 712, y: 812, s: 33, r: -0.18 },
  { x: 852, y: 788, s: 26, r: 0.15 },  { x: 972, y: 838, s: 24, r: -0.06 },
  { x: 640, y: 872, s: 25, r: 0.22 },  { x: 838, y: 880, s: 27, r: 0.05 }
];
var PULSE_HEART = 5;
if (HEARTS.length !== 10) throw new Error('jacket must hold exactly 10 hearts');

// ---- seeded data ----------------------------------------
// Fixed-seed LCG, the house pattern: the poodle's curl
// cluster is baked from this at load and never changes
// between frames or renders. No Math.random anywhere.
var seed = 421;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// Curls: rings of circles over the head and the two
// floppy ears. Each curl: offset from its cluster
// centre, radius, and whether it wears the dark tone.
function curlRing(cx, cy, rx, ry, n, rMin, rMax) {
  var out = [];
  for (var i = 0; i < n; i++) {
    var a = rnd() * Math.PI * 2, f = Math.sqrt(rnd());
    out.push({
      x: cx + Math.cos(a) * rx * f, y: cy + Math.sin(a) * ry * f,
      r: rMin + rnd() * (rMax - rMin), dark: (i % 3 === 1)
    });
  }
  return out;
}
var CURLS = [];
CURLS = CURLS.concat(curlRing(745, 415, 148, 128, 52, 17, 30));  // head
CURLS = CURLS.concat(curlRing(598, 452, 44, 96, 22, 15, 26));    // left ear
CURLS = CURLS.concat(curlRing(892, 452, 44, 96, 22, 15, 26));    // right ear
if (CURLS.length !== 96) throw new Error('curl count');

// ---- state -----------------------------------------------
var tapCount = 0;
var flipStart = [-10, -10, -10];   // per slot, in T seconds
var FLIP_LEN = 0.45, FLIP_STAG = 0.07;
var lastNow = -1, acc = 0;

// QA hooks via the renderer's query string (?seed=...):
// tap=N starts the cover at tap state N with flips
// long finished. Default play is unaffected.
var QS = (typeof location !== 'undefined' && location.search) || '';
var tm = QS.match(/tap=(\d+)/);
if (tm) tapCount = parseInt(tm[1], 10);

// ---- small helpers ---------------------------------------
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function ell(x, y, rx, ry, rot, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fill();
}
function circ(x, y, r, col) { ell(x, y, r, r, 0, col); }
function rect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function rr(x, y, w, h, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath(); ctx.fill();
}
function rrStroke(x, y, w, h, r, col, lw) {
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath(); ctx.stroke();
}
function seg(x1, y1, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function curve(x1, y1, cx, cy, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke();
}
function poly(pts, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fill();
}
function pathOf(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
}
function strokeOf(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
}

// ---- hand-lettered stroke-path capitals ------------------
// Each letter is a list of strokes; each stroke is a
// polyline in a unit box (x scaled by the letter's own
// width factor, y 0..1 top to bottom). Bowls are arcs
// sampled to polylines. Drawn with round caps and
// joins at a weight proportional to the letter height,
// so the hand is a marker hand at any size.
function arcPts(cx, cy, rx, ry, a0, a1, n) {
  var pts = [], i, a;
  for (i = 0; i <= n; i++) {
    a = a0 + (a1 - a0) * i / n;
    pts.push(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry);
  }
  return pts;
}
function cubicPts(p0, p1, p2, p3, n) {
  var pts = [], i, t, mt;
  for (i = 0; i <= n; i++) {
    t = i / n; mt = 1 - t;
    pts.push(
      mt * mt * mt * p0[0] + 3 * mt * mt * t * p1[0] + 3 * mt * t * t * p2[0] + t * t * t * p3[0],
      mt * mt * mt * p0[1] + 3 * mt * mt * t * p1[1] + 3 * mt * t * t * p2[1] + t * t * t * p3[1]
    );
  }
  return pts;
}
function catPts() {
  var out = [], i, a = arguments;
  for (i = 0; i < a.length; i++) out = out.concat(a[i]);
  return out;
}
var LETTERS = {
  'A': { w: 0.76, s: [[0, 1, 0.38, 0, 0.76, 1], [0.16, 0.64, 0.60, 0.64]] },
  'B': { w: 0.70, s: [[0, 1, 0, 0],
                      catPts([0, 0, 0.26, 0], arcPts(0.26, 0.25, 0.30, 0.25, -Math.PI / 2, Math.PI / 2, 8), [0.26, 0.5, 0, 0.5]),
                      catPts([0, 0.5, 0.30, 0.5], arcPts(0.30, 0.75, 0.34, 0.25, -Math.PI / 2, Math.PI / 2, 8), [0.30, 1, 0, 1])] },
  'C': { w: 0.74, s: [arcPts(0.40, 0.5, 0.36, 0.5, -0.92, -0.92 - (Math.PI * 2 - 1.84), 14)] },
  'D': { w: 0.76, s: [[0, 1, 0, 0],
                      catPts([0, 0, 0.24, 0], arcPts(0.24, 0.5, 0.48, 0.5, -Math.PI / 2, Math.PI / 2, 12), [0.24, 1, 0, 1])] },
  'E': { w: 0.64, s: [[0.62, 0, 0, 0, 0, 1, 0.64, 1], [0, 0.5, 0.52, 0.5]] },
  'G': { w: 0.78, s: [arcPts(0.42, 0.5, 0.38, 0.5, -0.92, -0.92 - (Math.PI * 2 - 1.84), 14),
                      [0.50, 0.58, 0.79, 0.58, 0.79, 0.92]] },
  'H': { w: 0.76, s: [[0, 0, 0, 1], [0.76, 0, 0.76, 1], [0, 0.5, 0.76, 0.5]] },
  'I': { w: 0.40, s: [[0.20, 0, 0.20, 1], [0.02, 0, 0.38, 0], [0.02, 1, 0.38, 1]] },
  'L': { w: 0.62, s: [[0, 0, 0, 1, 0.60, 1]] },
  'M': { w: 0.94, s: [[0, 1, 0, 0, 0.47, 0.52, 0.94, 0, 0.94, 1]] },
  'O': { w: 0.80, s: [arcPts(0.40, 0.5, 0.38, 0.5, 0, Math.PI * 2, 18)] },
  'P': { w: 0.70, s: [[0, 1, 0, 0],
                      catPts([0, 0, 0.26, 0], arcPts(0.26, 0.26, 0.34, 0.26, -Math.PI / 2, Math.PI / 2, 9), [0.26, 0.52, 0, 0.52])] },
  'R': { w: 0.72, s: [[0, 1, 0, 0],
                      catPts([0, 0, 0.26, 0], arcPts(0.26, 0.26, 0.34, 0.26, -Math.PI / 2, Math.PI / 2, 9), [0.26, 0.52, 0, 0.52]),
                      [0.32, 0.52, 0.70, 1]] },
  'S': { w: 0.68, s: [catPts(cubicPts([0.62, 0.16], [0.45, -0.04], [0.08, 0.06], [0.12, 0.30], 8),
                             cubicPts([0.12, 0.30], [0.16, 0.52], [0.60, 0.44], [0.62, 0.68], 8),
                             cubicPts([0.62, 0.68], [0.64, 0.94], [0.28, 1.06], [0.08, 0.84], 8))] },
  'T': { w: 0.70, s: [[0, 0, 0.70, 0, ], [0.35, 0, 0.35, 1]] },
  'U': { w: 0.76, s: [catPts([0, 0, 0, 0.52], arcPts(0.38, 0.52, 0.38, 0.48, Math.PI, 0, 10), [0.76, 0])] },
  'V': { w: 0.76, s: [[0, 0, 0.38, 1, 0.76, 0]] },
  'W': { w: 1.00, s: [[0, 0, 0.20, 1, 0.50, 0.34, 0.80, 1, 1.00, 0]] },
  'Y': { w: 0.72, s: [[0, 0, 0.36, 0.44, 0.72, 0], [0.36, 0.44, 0.36, 1]] },
  '&': { w: 0.70, s: [arcPts(0.34, 0.28, 0.22, 0.24, 0, Math.PI * 2, 10),
                      [0.52, 0.14, 0.10, 0.92], [0.10, 0.92, 0.28, 0.98, 0.52, 0.80, 0.66, 0.94]] }
};
var SPACE_W = 0.42;
// Fixed per-position hand jitter (rotation, baseline
// lift) so the lettering sits like hand work and is
// identical in every render.
var JIT = [[0.010, 0.004], [-0.014, -0.003], [0.006, 0.006], [-0.008, 0.002],
           [0.013, -0.005], [-0.005, 0.003], [0.009, -0.002], [-0.011, 0.005]];

function wordWidth(str, h) {
  var w = 0, i, L;
  for (i = 0; i < str.length; i++) {
    if (str[i] === ' ') { w += SPACE_W * h; continue; }
    L = LETTERS[str[i]];
    if (!L) continue;
    w += L.w * h + 0.16 * h;
  }
  return w > 0 ? w - 0.16 * h : 0;
}
function strokeWord(str, x, y, h, col, seedOff) {
  // (x, y) is the top-left of the first letter's box.
  ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(2, h * 0.145);
  var cx = x, i, j, L, jit;
  for (i = 0; i < str.length; i++) {
    if (str[i] === ' ') { cx += SPACE_W * h; continue; }
    L = LETTERS[str[i]];
    if (!L) continue;
    jit = JIT[(i + (seedOff || 0)) % JIT.length];
    ctx.save();
    ctx.translate(cx + L.w * h / 2, y + h / 2);
    ctx.rotate(jit[0]);
    ctx.translate(-L.w * h / 2, -h / 2 + jit[1] * h);
    for (j = 0; j < L.s.length; j++) {
      var raw = L.s[j], pts = [], k;
      for (k = 0; k < raw.length; k += 2) pts.push(raw[k] * h, raw[k + 1] * h);
      pathOf(pts); ctx.stroke();
    }
    ctx.restore();
    cx += L.w * h + 0.16 * h;
  }
}
// A word with the set's black shadow: ink pass offset
// down-right, then the face colour on top.
function shadowWord(str, x, y, h, col, seedOff) {
  strokeWord(str, x + h * 0.09, y + h * 0.10, h, INK, seedOff);
  strokeWord(str, x, y, h, col, seedOff);
}

// ---- the heart (path data, drawn per frame) -------------
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.85);
  ctx.bezierCurveTo(x - s * 1.15, y + s * 0.10, x - s * 0.66, y - s * 0.85, x, y - s * 0.30);
  ctx.bezierCurveTo(x + s * 0.66, y - s * 0.85, x + s * 1.15, y + s * 0.10, x, y + s * 0.85);
  ctx.closePath();
}
function heart(x, y, s, rot, col, outline) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot || 0);
  heartPath(0, 0, s);
  ctx.fillStyle = col; ctx.fill();
  if (outline) { ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.restore();
}

// ---- the poodle ------------------------------------------
// Bust centred on CX, chin up (the head group tilts a
// few degrees back about the neck). Curls are the
// seeded table; the face plate stays smooth so the
// snout and shades read.
var CX = 745;
function drawJacket(lt) {
  // Cream jacket body, cut by the bottom edge.
  ctx.beginPath();
  ctx.moveTo(560, 612);
  ctx.bezierCurveTo(520, 700, 452, 790, 428, 912);
  ctx.lineTo(1062, 912);
  ctx.bezierCurveTo(1038, 790, 972, 700, 930, 612);
  ctx.bezierCurveTo(860, 566, 630, 566, 560, 612);
  ctx.closePath();
  ctx.fillStyle = CREAM; ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
  // Collar: a clean V-neck fold, two ink passes.
  ctx.beginPath(); ctx.moveTo(664, 580); ctx.lineTo(745, 672); ctx.lineTo(826, 580);
  ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(688, 578); ctx.lineTo(745, 644); ctx.lineTo(802, 578);
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
  // The heart pattern, clipped to the jacket.
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(560, 612);
  ctx.bezierCurveTo(520, 700, 452, 790, 428, 912);
  ctx.lineTo(1062, 912);
  ctx.bezierCurveTo(1038, 790, 972, 700, 930, 612);
  ctx.bezierCurveTo(860, 566, 630, 566, 560, 612);
  ctx.closePath(); ctx.clip();
  for (var i = 0; i < HEARTS.length; i++) {
    var hp = HEARTS[i];
    var sc = i === PULSE_HEART ? 1 + 0.16 * Math.sin(Math.PI * 2 * lt / LOOP) : 1;
    heart(hp.x, hp.y, hp.s * sc, hp.r, RED, false);
  }
  ctx.restore();
}

function drawPoodle(lt) {
  // Neck first, so the jacket collar overlaps its
  // base and the head sits on it, never floating.
  rr(CX - 48, 500, 96, 140, 22, BROWN);
  drawJacket(lt);
  // Head group, tilted back a touch (chin up) about
  // the neck point.
  ctx.save();
  ctx.translate(CX, 580); ctx.rotate(-0.045); ctx.translate(-CX, -580);
  // Coat: the seeded curl cluster (head, then ears on
  // top at the sides so they hang in front).
  var i, c;
  for (i = 0; i < CURLS.length; i++) {
    c = CURLS[i];
    circ(c.x, c.y, c.r, c.dark ? CURL : BROWN);
  }
  // Smooth face plate.
  ell(CX, 428, 104, 96, 0, BROWN);
  // Snout, high on the face (chin up), dark nose.
  ell(CX, 486, 64, 44, 0, BROWN);
  ctx.beginPath(); ctx.ellipse(CX, 486, 64, 44, 0, 0, Math.PI * 2);
  ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
  ell(CX, 460, 27, 18, 0, INK);
  seg(CX, 476, CX, 492, 5, INK);
  curve(CX - 22, 500, CX - 10, 512, CX, 502, 5, INK);
  curve(CX, 502, CX + 10, 512, CX + 22, 500, 5, INK);
  // Sunglasses: two rounded rects and a bridge. The
  // blink dips their height at the fixed slots.
  var blink = 0, b;
  for (b = 0; b < BLINKS.length; b++) {
    var bd = Math.abs(((lt - BLINKS[b]) % LOOP + LOOP) % LOOP);
    bd = Math.min(bd, LOOP - bd);
    if (bd < 0.11) blink = Math.max(blink, Math.cos(bd / 0.11 * Math.PI / 2));
  }
  var shy = 1 - 0.82 * blink;
  ctx.save();
  ctx.translate(CX, 398); ctx.scale(1, shy); ctx.translate(-CX, -398);
  rr(CX - 118, 366, 106, 64, 18, INK);
  rr(CX + 12, 366, 106, 64, 18, INK);
  seg(CX - 12, 384, CX + 12, 384, 9, INK);
  seg(CX - 118, 380, CX - 148, 372, 9, INK);
  seg(CX + 118, 380, CX + 148, 372, 9, INK);
  // Flat cream highlights, one slash per lens.
  seg(CX - 92, 416, CX - 66, 378, 7, CREAM);
  seg(CX + 38, 416, CX + 64, 378, 7, CREAM);
  ctx.restore();
  ctx.restore();
  // Beret: red tilted ellipse riding the head top,
  // swaying 3 degrees on the whole 30s cycle about
  // its anchor at the head.
  var sway = 3 * Math.PI / 180 * Math.sin(Math.PI * 2 * lt / LOOP);
  ctx.save();
  ctx.translate(CX - 6, 306); ctx.rotate(-0.13 + sway);
  ell(0, 0, 124, 35, 0, RED);
  ctx.beginPath(); ctx.ellipse(0, 0, 124, 35, 0, 0, Math.PI * 2);
  ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
  ell(0, -33, 10, 7, 0, RED);
  ctx.beginPath(); ctx.ellipse(0, -33, 10, 7, 0, 0, Math.PI * 2);
  ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
  ctx.restore();
}

// ---- the cover furniture ---------------------------------
function drawMasthead() {
  var str = 'DOGUE', h = 168;
  var w = wordWidth(str, h);
  shadowWord(str, (DW - w) / 2, 26, h, CREAM, 3);
}

function drawSlots() {
  for (var sIdx = 0; sIdx < SLOTS.length; sIdx++) {
    var sl = SLOTS[sIdx];
    // Flip state: progress through this slot's flip.
    var fs = flipStart[sIdx];
    var p = fs < 0 ? 1 : clamp((T - fs) / FLIP_LEN, 0, 1);
    // Before the flip's midpoint the slot still shows
    // the previous tap state; from the midpoint on it
    // shows the new one.
    var eff = (fs >= 0 && p < 0.5) ? tapCount - 1 : tapCount;
    var entry = POOL[(((sIdx + eff) % POOL.length) + POOL.length) % POOL.length];
    var sx = fs < 0 ? 1 : Math.abs(Math.cos(Math.PI * p));
    if (sx < 0.02) sx = 0.02;
    var rows = entry.rows;
    var blockH = rows.length * sl.h * 1.28 - sl.h * 0.28;
    ctx.save();
    ctx.translate(sl.x, sl.y);
    ctx.rotate(sl.rot);
    ctx.scale(sx, 1);
    for (var r = 0; r < rows.length; r++) {
      shadowWord(rows[r], 0, r * sl.h * 1.28 - blockH / 2, sl.h, CREAM, sIdx * 2 + r);
    }
    ctx.restore();
  }
}

function drawBarcode() {
  var x = 56, y = 752, w = 164, h = 106;
  rect(x, y, w, h, WHITE);
  rrStroke(x, y, w, h, 4, INK, 5);
  var bx = x + 14, bw = (w - 28);
  var total = 0, i;
  for (i = 0; i < BARS.length; i++) total += BARS[i];
  var unit = bw / total;
  for (i = 0; i < BARS.length; i++) {
    var bwid = BARS[i] * unit;
    if (i % 2 === 0) rect(bx, y + 14, Math.max(1.5, bwid * 0.62), h - 28, INK);
    bx += bwid;
  }
}

function drawPatch() {
  ctx.save();
  ctx.translate(988, 800); ctx.rotate(-0.14);
  rr(-104, -34, 208, 68, 12, YELLOW);
  rrStroke(-104, -34, 208, 68, 12, INK, 5);
  // "I" + heart + "DADDY" in ink paths.
  var h = 25;
  strokeWord('I', -88, -h / 2, h, INK, 1);
  heart(-52, 1, 13, 0, RED, true);
  strokeWord('DADDY', -30, -h / 2, h, INK, 2);
  ctx.restore();
}

function draw() {
  var lt = T % LOOP;
  // Page ground: hot pink everywhere, letterbox too.
  rect(-2400, -2400, DW + 4800, DH + 4800, PINK);
  drawMasthead();
  drawSlots();
  drawBarcode();
  drawPoodle(lt);
  drawPatch();
}

// ---- step -------------------------------------------------
function step() {
  // Nothing integrates: the flip and ambient motion
  // are pure functions of the anchored clock.
}

// ---- pointer: tap anywhere re-sets the lines -------------
var downX = -1, downY = -1, downT = 0;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y; downT = T;
});
function endPointer(e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  var moved = Math.sqrt(dx * dx + dy * dy);
  var held = T - downT;
  downX = -1;
  if (moved >= 28 || held >= 0.8) return;
  // A flip already running is left to finish; new taps
  // queue only when all slots are at rest, so the
  // cycle can never land mid-swap.
  if (T - flipStart[0] < FLIP_LEN + 2 * FLIP_STAG) return;
  tapCount++;
  for (var i = 0; i < SLOTS.length; i++) flipStart[i] = T + i * FLIP_STAG;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function () { downX = -1; });

// ---- sizing: centred fit, page ground = hot pink ---------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.min(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  rect(0, 0, W, H, PINK);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
