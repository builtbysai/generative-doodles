<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.398 Five Hundred Pieces</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#F2EAD6; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.398 Five Hundred Pieces (galitskaya-illustration).
// After Anna Galitskaya's digital-to-product puzzle
// pipeline (her Ravensburger "Circle of Colours"
// register): one flat illustration, an ice-cream
// sundae garden with cones, flower beds, a rainbow
// and a cat asleep on a waffle, pre-cut into jigsaw
// pieces. The prompt's offscreen-canvas sprite
// slicing is NOT used: the illustration is JS DATA,
// a flat list of shapes drawn directly on the one
// canvas every frame, and each piece is a clip path
// (its cell rect plus authored tab and blank arcs,
// complementary with its neighbours) inside which
// the data drawing is rendered under that piece's
// current offset and rotation. Exactly 70 pieces,
// asserted at load: the cut grid is 10x7 in
// landscape and 7x10 in portrait, the same 70 cells
// transposed. Scatter comes from a FIXED AUTHORED
// SCATTER TABLE baked from a fixed seed at load,
// never a runtime pick. Frame one is that authored
// scatter at phase 0; assembly then runs on fixed
// ticks, pieces flying home in a ripple from the
// centre, the last piece landing at exactly 20s,
// after which the image sits complete and still and
// the cut lines have faded out. DRAG bursts pieces
// near the pointer away with its velocity and a
// slight rotation in each piece's tabled scatter
// direction; on release the pieces' current offsets
// are captured and the 20s centre ripple restarts.
// DOUBLE-TAP re-scatters to the authored table
// instead of reloading. A tap alone does nothing.
// No win state, no counter, no text anywhere. The
// composition is puzzle-readable: high local
// contrast evenly spread, sprinkle and petal texture
// in every region so no cell is a large flat area.
// Palette closed at the six specced hexes, flat only;
// no offscreen canvas, no gradients, no filters, no
// shadowBlur.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var PAPER = '#F2EAD6', INK = '#2B2620', TEAL = '#2E8B8B';
var CORAL = '#E4572E', MUSTARD = '#E8A93D', CREAM = '#F7EFD9';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var TICK = 1 / 60;
var FLIGHT = 5;        // seconds each piece spends flying home
var ASSEMBLE = 20;     // the whole ripple, centre to corner

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: art scatter, edge
// signs and the piece scatter table are baked from
// this at load and never change between frames or
// renders.
var seed = 398;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

// ---- the illustration, as shape data --------------------
// Every mark in the sundae garden is one record in
// SHAPES: a type, a flat colour and a bounding box.
// Drawing a jigsaw piece means clipping to the piece
// path and replaying, in registration order, only the
// records whose box overlaps the piece. Z-order is
// registration order, so the garden layers exactly as
// authored.
var SHAPES = [];
function reg(t, c, bb, d) {
  var s = { t: t, c: c, bb: bb };
  for (var k in d) s[k] = d[k];
  SHAPES.push(s);
}
function aEll(x, y, rx, ry, rot, c, st, w) {
  reg('e', c, [x - rx - 3, y - ry - 3, x + rx + 3, y + ry + 3],
    { x: x, y: y, rx: rx, ry: ry, rot: rot || 0, s: st || null, w: w || 2 });
}
function aCirc(x, y, r, c, st, w) { aEll(x, y, r, r, 0, c, st, w); }
function aPoly(pts, c, st, w) {
  var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, i;
  for (i = 0; i + 1 < pts.length; i += 2) {
    if (pts[i] < x0) x0 = pts[i]; if (pts[i] > x1) x1 = pts[i];
    if (pts[i + 1] < y0) y0 = pts[i + 1]; if (pts[i + 1] > y1) y1 = pts[i + 1];
  }
  reg('p', c, [x0 - 3, y0 - 3, x1 + 3, y1 + 3], { pts: pts, s: st || null, w: w || 2 });
}
function aSeg(x1, y1, x2, y2, w, c) {
  reg('s', c, [Math.min(x1, x2) - w, Math.min(y1, y2) - w, Math.max(x1, x2) + w, Math.max(y1, y2) + w],
    { x1: x1, y1: y1, x2: x2, y2: y2, w: w });
}
function aCurve(x1, y1, cx, cy, x2, y2, w, c) {
  reg('q', c, [Math.min(x1, cx, x2) - w, Math.min(y1, cy, y2) - w, Math.max(x1, cx, x2) + w, Math.max(y1, cy, y2) + w],
    { x1: x1, y1: y1, cx: cx, cy: cy, x2: x2, y2: y2, w: w });
}
function aArc(x, y, r, a0, a1, w, c) {
  reg('a', c, [x - r - w, y - r - w, x + r + w, y + r + w],
    { x: x, y: y, r: r, a0: a0, a1: a1, w: w });
}
function aRect(x, y, w, h, c) { reg('r', c, [x, y, x + w, y + h], { x: x, y: y, w: w, h: h }); }
function aHalf(x, y, rx, ry, c, st, w) {
  // Bottom half of an ellipse, closed along its diameter.
  reg('h', c, [x - rx - 3, y - 3, x + rx + 3, y + ry + 3],
    { x: x, y: y, rx: rx, ry: ry, s: st || null, w: w || 2 });
}
function dash(x, y, a, c) {
  var ux = Math.cos(a), uy = Math.sin(a), vx = -uy, vy = ux, L = 8, W2 = 2.6;
  aPoly([x + ux * L + vx * W2, y + uy * L + vy * W2,
         x + ux * L - vx * W2, y + uy * L - vy * W2,
         x - ux * L - vx * W2, y - uy * L - vy * W2,
         x - ux * L + vx * W2, y - uy * L + vy * W2], c);
}
function star4(x, y, R, c) {
  var pts = [], k, a, rr;
  for (k = 0; k < 8; k++) {
    a = k * Math.PI / 4 - Math.PI / 2;
    rr = (k % 2 === 0) ? R : R * 0.36;
    pts.push(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  aPoly(pts, c);
}
function flowerHead(x, y, R, petalC, centreC) {
  for (var k = 0; k < 6; k++) {
    var a = k * Math.PI / 3 + 0.5;
    aEll(x + Math.cos(a) * R * 0.58, y + Math.sin(a) * R * 0.58, R * 0.55, R * 0.32, a, petalC);
  }
  aCirc(x, y, R * 0.34, centreC);
  aCirc(x, y, R * 0.13, INK);
}
function miniFlower(x, y, petalC) {
  for (var k = 0; k < 5; k++) {
    var a = k * Math.PI * 2 / 5 - Math.PI / 2;
    aCirc(x + Math.cos(a) * 6.5, y + Math.sin(a) * 6.5, 3.1, petalC);
  }
  aCirc(x, y, 3.2, MUSTARD);
}
function rotPt(x, y, cx, cy, a) {
  var ca = Math.cos(a), sa = Math.sin(a), dx = x - cx, dy = y - cy;
  return [cx + dx * ca - dy * sa, cy + dx * sa + dy * ca];
}

function buildArt() {
  var i, k, x, y, a, c;
  var cycle = [TEAL, CORAL, MUSTARD];
  seed = 39800;
  // Sky sprinkle field: dots, dashes and four-point
  // stars over the whole sky so the top rows of the
  // cut carry texture in every cell.
  for (i = 0; i < 110; i++) {
    x = 26 + rnd() * 1228; y = 22 + rnd() * 310; c = cycle[i % 3];
    if (i % 3 === 0) aCirc(x, y, 3.4, c);
    else if (i % 3 === 1) dash(x, y, rnd() * Math.PI, c);
    else star4(x, y, 8.5, c);
  }
  // Sun, top left: coral ray triangles, mustard disc,
  // cream face plate, closed happy eyes and a smile.
  for (k = 0; k < 12; k++) {
    a = k * Math.PI / 6;
    var a2 = a + 0.20, a3 = a - 0.20;
    aPoly([215 + Math.cos(a) * 148, 150 + Math.sin(a) * 148,
           215 + Math.cos(a2) * 100, 150 + Math.sin(a2) * 100,
           215 + Math.cos(a3) * 100, 150 + Math.sin(a3) * 100], CORAL);
  }
  aCirc(215, 150, 96, MUSTARD);
  aCirc(215, 150, 54, CREAM);
  aArc(198, 146, 7.5, Math.PI, Math.PI * 2, 3, INK);
  aArc(232, 146, 7.5, Math.PI, Math.PI * 2, 3, INK);
  aArc(215, 156, 16, Math.PI * 0.15, Math.PI * 0.85, 3, INK);
  aCirc(178, 164, 5.5, CORAL);
  aCirc(252, 164, 5.5, CORAL);
  // Clouds: cream circle clusters on a flat base bar,
  // each bump shaded by a shallow ink arc hugging its
  // own underside.
  var clouds = [[486, 108, 1], [884, 88, 1.18], [1122, 208, 0.9]];
  for (i = 0; i < clouds.length; i++) {
    x = clouds[i][0]; y = clouds[i][1]; var sc = clouds[i][2];
    var bumps = [[-46, 8, 30], [-12, -8, 40], [28, -2, 34], [58, 10, 24]];
    for (k = 0; k < bumps.length; k++) {
      aCirc(x + bumps[k][0] * sc, y + bumps[k][1] * sc, bumps[k][2] * sc, CREAM);
    }
    aRect(x - 74 * sc, y + 6 * sc, 148 * sc, 20 * sc, CREAM);
    for (k = 0; k < bumps.length; k++) {
      aArc(x + bumps[k][0] * sc, y + bumps[k][1] * sc, bumps[k][2] * sc * 0.8,
        Math.PI * 0.22, Math.PI * 0.78, 2, INK);
    }
  }
  // Rainbow backdrop, three thick flat arcs behind the
  // sundae, the Circle of Colours gesture.
  aArc(640, 664, 472, Math.PI, Math.PI * 2, 40, CORAL);
  aArc(640, 664, 424, Math.PI, Math.PI * 2, 40, MUSTARD);
  aArc(640, 664, 376, Math.PI, Math.PI * 2, 40, TEAL);
  // Side petal-and-dot scatter in the mid paper zones.
  for (i = 0; i < 56; i++) {
    var left = i % 2 === 0;
    x = left ? 30 + rnd() * 396 : 854 + rnd() * 396;
    y = 352 + rnd() * 336; c = cycle[(i + 1) % 3];
    if (i % 3 === 0) aCirc(x, y, 4, c);
    else aEll(x, y, 10.5, 5.2, rnd() * Math.PI, c);
  }
  // Grass band and its texture: mini flowers and ink
  // tufts, so the bottom rows are busy in every cell.
  aRect(0, 712, DW, DH - 712, TEAL);
  for (i = 0; i < 30; i++) {
    x = 18 + rnd() * 1244; y = 730 + rnd() * 152;
    miniFlower(x, y, i % 2 === 0 ? CORAL : CREAM);
  }
  for (i = 0; i < 36; i++) {
    x = 14 + rnd() * 1252; y = 748 + rnd() * 146;
    aSeg(x, y, x - 7, y - 16, 2.4, INK);
    aSeg(x, y, x, y - 21, 2.4, INK);
    aSeg(x, y, x + 7, y - 15, 2.4, INK);
  }
  // Two standing cones flanking the sundae.
  buildCone(190, CORAL, MUSTARD);
  buildCone(1090, TEAL, CORAL);
  // Flower beds, five stems a side.
  var bedL = [92, 162, 242, 322, 396], bedR = [884, 956, 1032, 1112, 1192];
  for (i = 0; i < 5; i++) buildFlower(bedL[i], i, CORAL, MUSTARD);
  for (i = 0; i < 5; i++) buildFlower(bedR[i], i + 1, MUSTARD, CORAL);
  // The sundae itself, then the waffle and its cat.
  buildSundae();
  buildWaffleCat();
}
function buildCone(bx, scoopC, cherryC) {
  var i, a, rr;
  aCirc(bx, 520, 64, scoopC);
  for (i = 0; i < 5; i++) {
    a = Math.PI * (0.18 + i * 0.16);
    aCirc(bx + Math.cos(a) * 52, 520 + Math.sin(a) * 52, 15, scoopC);
  }
  for (i = 0; i < 10; i++) {
    a = rnd() * Math.PI * 2; rr = 44 * Math.sqrt(rnd());
    dash(bx + Math.cos(a) * rr, 520 + Math.sin(a) * rr, rnd() * Math.PI, i % 3 === 0 ? INK : CREAM);
  }
  aCirc(bx, 452, 13, cherryC);
  aCurve(bx + 2, 444, bx + 12, 424, bx + 24, 420, 3.5, INK);
  aPoly([bx - 58, 560, bx + 58, 560, bx, 712], MUSTARD);
  // Crosshatch kept inside the cone triangle.
  var rows = [[578, 44], [606, 33], [634, 22], [662, 12]];
  for (i = 0; i < rows.length; i++) {
    var yy = rows[i][0], hw = rows[i][1];
    aSeg(bx - hw, yy, bx + hw * 0.4, yy + 22, 2.6, INK);
    aSeg(bx + hw, yy, bx - hw * 0.4, yy + 22, 2.6, INK);
  }
}
function buildFlower(bx, idx, petalC, centreC) {
  var topY = 600 + rnd() * 52, lean = (rnd() * 2 - 1) * 14;
  aSeg(bx, 716, bx + lean, topY + 16, 5, TEAL);
  aEll(bx + lean * 0.4 - 13, topY + 62, 16, 7, -0.6, TEAL);
  aEll(bx + lean * 0.6 + 14, topY + 84, 16, 7, 0.6, TEAL);
  flowerHead(bx + lean, topY, 27, petalC, centreC);
}
function scoop(cx, cy, r, c, sprinkleSet) {
  aCirc(cx, cy, r, c);
  for (var i = 0; i < 6; i++) {
    var a = Math.PI * (0.16 + i * 0.136);
    aCirc(cx + Math.cos(a) * (r - 13), cy + Math.sin(a) * (r - 13), r * 0.185, c);
  }
  for (i = 0; i < sprinkleSet; i++) {
    var a2 = rnd() * Math.PI * 2, rr = r * 0.74 * Math.sqrt(rnd());
    dash(cx + Math.cos(a2) * rr, cy + Math.sin(a2) * rr, rnd() * Math.PI,
      [INK, CREAM, TEAL, CORAL, MUSTARD][i % 5] === c ? INK : [INK, CREAM, TEAL, CORAL, MUSTARD][i % 5]);
  }
}
function buildSundae() {
  // Wafer sticks behind the scoops.
  var s1 = [574, 306, 498, 130, 534, 112, 606, 296];
  var s2 = [706, 306, 782, 130, 746, 112, 674, 296];
  aPoly(s1, MUSTARD); aPoly(s2, MUSTARD);
  aSeg(540, 252, 584, 260, 3, INK); aSeg(528, 196, 574, 204, 3, INK); aSeg(518, 142, 562, 150, 3, INK);
  aSeg(696, 260, 740, 252, 3, INK); aSeg(686, 204, 730, 196, 3, INK); aSeg(676, 150, 718, 142, 3, INK);
  // Bowl behind the bottom scoop: cream half-disc,
  // teal stem and foot.
  aRect(616, 560, 48, 66, TEAL);
  aEll(640, 640, 118, 17, 0, TEAL, INK, 2.2);
  aHalf(640, 478, 168, 88, CREAM, INK, 2.5);
  // Scoops, bottom to top.
  scoop(640, 408, 106, TEAL, 14);
  scoop(640, 308, 97, CORAL, 13);
  scoop(640, 218, 87, MUSTARD, 12);
  // Bowl front band over the bottom scoop's hem.
  aArc(640, 478, 150, Math.PI * 0.12, Math.PI * 0.88, 24, CREAM);
  aArc(640, 478, 163, Math.PI * 0.12, Math.PI * 0.88, 2.2, INK);
  aArc(640, 478, 137, Math.PI * 0.12, Math.PI * 0.88, 2.2, INK);
  // Cherry and leaf on top.
  aCirc(640, 124, 25, CORAL);
  aCirc(631, 115, 7, CREAM);
  aCurve(640, 104, 652, 82, 668, 74, 4, INK);
  aEll(678, 70, 15, 7, -0.5, TEAL);
}
function buildWaffleCat() {
  var cx = 880, cy = 768, ang = -0.06, i, p1, p2;
  // Waffle: a rotated mustard slab with an ink grid.
  var corners = [rotPt(745, 690, cx, cy, ang), rotPt(1015, 690, cx, cy, ang),
                 rotPt(1015, 846, cx, cy, ang), rotPt(745, 846, cx, cy, ang)];
  var wpts = [];
  for (i = 0; i < 4; i++) { wpts.push(corners[i][0], corners[i][1]); }
  aPoly(wpts, MUSTARD, INK, 2.5);
  for (i = 1; i <= 4; i++) {
    p1 = rotPt(745 + i * 54, 696, cx, cy, ang); p2 = rotPt(745 + i * 54, 840, cx, cy, ang);
    aSeg(p1[0], p1[1], p2[0], p2[1], 3, INK);
  }
  for (i = 1; i <= 2; i++) {
    p1 = rotPt(751, 690 + i * 52, cx, cy, ang); p2 = rotPt(1009, 690 + i * 52, cx, cy, ang);
    aSeg(p1[0], p1[1], p2[0], p2[1], 3, INK);
  }
  // The cat, asleep curled on top of the waffle.
  aCurve(972, 740, 1014, 706, 966, 664, 17, CREAM);
  aEll(872, 708, 108, 54, 0, CREAM, INK, 2.2);
  aCirc(772, 678, 41, CREAM, INK, 2.2);
  aPoly([748, 648, 755, 615, 771, 643], CREAM, INK, 2);
  aPoly([783, 641, 801, 617, 803, 647], CREAM, INK, 2);
  aPoly([753, 640, 757, 626, 766, 639], CORAL);
  aPoly([789, 635, 797, 624, 799, 639], CORAL);
  aArc(758, 675, 6.5, Math.PI, Math.PI * 2, 2.5, INK);
  aArc(787, 675, 6.5, Math.PI, Math.PI * 2, 2.5, INK);
  aCirc(772, 687, 3.6, CORAL);
  aSeg(738, 684, 722, 680, 1.8, INK); aSeg(738, 692, 723, 693, 1.8, INK);
  aSeg(806, 684, 821, 680, 1.8, INK); aSeg(806, 692, 820, 693, 1.8, INK);
  aArc(772, 706, 30, Math.PI * 0.2, Math.PI * 0.8, 6, CORAL);
  aEll(838, 744, 22, 10, 0, CREAM, INK, 2);
  aEll(908, 746, 22, 10, 0, CREAM, INK, 2);
  aCurve(742, 612, 730, 598, 744, 590, 2.2, INK);
  aCurve(768, 594, 758, 578, 774, 572, 2.2, INK);
}
buildArt();

function drawShape(s) {
  var i;
  ctx.fillStyle = s.c;
  if (s.t === 'e') {
    ctx.beginPath();
    ctx.ellipse(s.x, s.y, s.rx, s.ry, s.rot, 0, Math.PI * 2);
    ctx.fill();
    if (s.s) { ctx.strokeStyle = s.s; ctx.lineWidth = s.w; ctx.stroke(); }
  } else if (s.t === 'p') {
    ctx.beginPath();
    ctx.moveTo(s.pts[0], s.pts[1]);
    for (i = 2; i + 1 < s.pts.length; i += 2) ctx.lineTo(s.pts[i], s.pts[i + 1]);
    ctx.closePath();
    ctx.fill();
    if (s.s) { ctx.strokeStyle = s.s; ctx.lineWidth = s.w; ctx.stroke(); }
  } else if (s.t === 'r') {
    ctx.fillRect(s.x, s.y, s.w, s.h);
  } else if (s.t === 'h') {
    ctx.beginPath();
    ctx.ellipse(s.x, s.y, s.rx, s.ry, 0, 0, Math.PI);
    ctx.closePath();
    ctx.fill();
    if (s.s) { ctx.strokeStyle = s.s; ctx.lineWidth = s.w; ctx.stroke(); }
  } else if (s.t === 's') {
    ctx.strokeStyle = s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
  } else if (s.t === 'q') {
    ctx.strokeStyle = s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.quadraticCurveTo(s.cx, s.cy, s.x2, s.y2); ctx.stroke();
  } else if (s.t === 'a') {
    ctx.strokeStyle = s.c; ctx.lineWidth = s.w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r, s.r, 0, s.a0, s.a1); ctx.stroke();
  }
}
function drawArt(x0, y0, x1, y1) {
  for (var i = 0; i < SHAPES.length; i++) {
    var b = SHAPES[i].bb;
    if (b[2] >= x0 && b[0] <= x1 && b[3] >= y0 && b[1] <= y1) drawShape(SHAPES[i]);
  }
}

// ---- the cut: 70 pieces, tab and blank edges -----------
// The grid is 10x7 in landscape, 7x10 in portrait, the
// same 70 cells transposed. Shared edges get one sign
// each, baked from the fixed seed: HS holds the sign
// of every horizontal boundary (+1: the tab belongs
// to the piece above), VS of every vertical boundary
// (+1: the tab belongs to the piece on the left), so
// a tab on one piece is always the blank on its
// neighbour and the two outlines coincide at home.
var COLS = 0, ROWS = 0, CW = 0, CH = 0;
var HS = [], VS = [];
var PIECES = [];
var SCAT = [];
(function bakeScatter() {
  seed = 39870;
  for (var i = 0; i < 70; i++) {
    var a = rnd() * Math.PI * 2;
    SCAT.push({
      dx: (rnd() * 2 - 1) * 235, dy: (rnd() * 2 - 1) * 165,
      rot: (rnd() * 2 - 1) * 0.36,
      dirx: Math.cos(a), diry: Math.sin(a), rs: rnd() < 0.5 ? -1 : 1
    });
  }
})();
function buildGrid(cols, rows) {
  COLS = cols; ROWS = rows; CW = DW / cols; CH = DH / rows;
  var r, c, i;
  seed = 39807;
  HS = [];
  for (r = 1; r < rows; r++) {
    var hr = [];
    for (c = 0; c < cols; c++) hr.push(rnd() < 0.5 ? -1 : 1);
    HS.push(hr);
  }
  VS = [];
  for (r = 0; r < rows; r++) {
    var vr = [];
    for (c = 1; c < cols; c++) vr.push(rnd() < 0.5 ? -1 : 1);
    VS.push(vr);
  }
  var dmax = Math.hypot(DW / 2, DH / 2);
  for (i = 0; i < 70; i++) {
    var row = Math.floor(i / cols), col = i % cols;
    var hx = col * CW + CW / 2, hy = row * CH + CH / 2;
    var p = PIECES[i];
    if (!p) {
      p = { dx: 0, dy: 0, dr: 0, dvx: 0, dvy: 0, drv: 0, fx: null, fy: 0, fr: 0 };
      PIECES[i] = p;
    }
    p.col = col; p.row = row; p.hx = hx; p.hy = hy;
    // The authored scatter, clamped so every piece
    // still shows on the field at frame one.
    p.sx = clamp(hx + SCAT[i].dx, -30, DW + 30) - hx;
    p.sy = clamp(hy + SCAT[i].dy, -30, DH + 30) - hy;
    p.sr = SCAT[i].rot;
    p.delay = (Math.hypot(hx - DW / 2, hy - DH / 2) / dmax) * (ASSEMBLE - FLIGHT);
    if (p.fx === null) { p.fx = p.sx; p.fy = p.sy; p.fr = p.sr; }
  }
  if (PIECES.length !== 70) throw new Error('Five Hundred Pieces must hold exactly 70 pieces');
}
function topBump(p) { return p.row === 0 ? 0 : (HS[p.row - 1][p.col] > 0 ? -1 : 1); }
function bottomBump(p) { return p.row === ROWS - 1 ? 0 : (HS[p.row][p.col] > 0 ? 1 : -1); }
function rightBump(p) { return p.col === COLS - 1 ? 0 : (VS[p.row][p.col] > 0 ? 1 : -1); }
function leftBump(p) { return p.col === 0 ? 0 : (VS[p.row][p.col - 1] > 0 ? -1 : 1); }
function edgeTo(x0, y0, x1, y1, b) {
  if (!b) { ctx.lineTo(x1, y1); return; }
  var dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  var ux = dx / L, uy = dy / L, nx = uy, ny = -ux;
  var D = Math.min(CW, CH) * 0.21 * b;
  function pt(f, h) { return [x0 + ux * L * f + nx * h, y0 + uy * L * f + ny * h]; }
  var A = pt(0.36, 0), c1 = pt(0.40, D * 0.95), c2 = pt(0.44, D), tip = pt(0.5, D);
  var c3 = pt(0.56, D), c4 = pt(0.60, D * 0.95), B = pt(0.64, 0);
  ctx.lineTo(A[0], A[1]);
  ctx.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], tip[0], tip[1]);
  ctx.bezierCurveTo(c3[0], c3[1], c4[0], c4[1], B[0], B[1]);
  ctx.lineTo(x1, y1);
}
function piecePath(p) {
  var x0 = p.col * CW, y0 = p.row * CH, x1 = x0 + CW, y1 = y0 + CH;
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  edgeTo(x0, y0, x1, y0, topBump(p));
  edgeTo(x1, y0, x1, y1, rightBump(p));
  edgeTo(x1, y1, x0, y1, bottomBump(p));
  edgeTo(x0, y1, x0, y0, leftBump(p));
  ctx.closePath();
}
function tabMargin() { return Math.min(CW, CH) * 0.21 + 3; }

// ---- assembly and drag state ---------------------------
// T is the piece clock in seconds, advanced in fixed
// ticks from load; frame one is drawn synchronously
// at T = 0 with the assembly clock at 0, the authored
// scatter at phase 0. Frame one never reads a wall
// clock. Each piece flies from its captured offset
// (fx, fy, fr) to home once the ripple reaches it:
// delay is its centre distance over the whole
// assembly span, the flight itself takes FLIGHT
// seconds, so the corner pieces land at exactly 20s.
// The drag offsets (dx, dy, dr) ride on top, spring
// damped back to exactly zero.
var T = 0;
var asmT = 0;
var lastNow = -1, acc = 0;
function easeInOut(p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
function pieceEase(p) {
  var raw = clamp((asmT - p.delay) / FLIGHT, 0, 1);
  return easeInOut(raw);
}
function curOffX(p) { return p.fx * (1 - pieceEase(p)) + p.dx; }
function curOffY(p) { return p.fy * (1 - pieceEase(p)) + p.dy; }
function curRot(p) { return p.fr * (1 - pieceEase(p)) + p.dr; }
function tick() {
  asmT += TICK;
  for (var i = 0; i < PIECES.length; i++) {
    var p = PIECES[i];
    p.dvx += (-p.dx) * 0.05; p.dvx *= 0.80; p.dx += p.dvx;
    p.dvy += (-p.dy) * 0.05; p.dvy *= 0.80; p.dy += p.dvy;
    p.drv += (-p.dr) * 0.05; p.drv *= 0.80; p.dr += p.drv;
    if (Math.abs(p.dx) < 0.08 && Math.abs(p.dvx) < 0.08) { p.dx = 0; p.dvx = 0; }
    if (Math.abs(p.dy) < 0.08 && Math.abs(p.dvy) < 0.08) { p.dy = 0; p.dvy = 0; }
    if (Math.abs(p.dr) < 0.001 && Math.abs(p.drv) < 0.001) { p.dr = 0; p.drv = 0; }
  }
}
function captureAndRestart() {
  for (var i = 0; i < PIECES.length; i++) {
    var p = PIECES[i];
    p.fx = curOffX(p); p.fy = curOffY(p); p.fr = curRot(p);
    p.dx = 0; p.dy = 0; p.dr = 0; p.dvx = 0; p.dvy = 0; p.drv = 0;
  }
  asmT = 0;
}
function rescatter() {
  for (var i = 0; i < PIECES.length; i++) {
    var p = PIECES[i];
    p.fx = p.sx; p.fy = p.sy; p.fr = p.sr;
    p.dx = 0; p.dy = 0; p.dr = 0; p.dvx = 0; p.dvy = 0; p.drv = 0;
  }
  asmT = 0;
}

function drawPiece(p) {
  var e = pieceEase(p), inv = 1 - e;
  var ox = p.fx * inv + p.dx, oy = p.fy * inv + p.dy, orot = p.fr * inv + p.dr;
  ctx.save();
  ctx.translate(p.hx + ox, p.hy + oy);
  ctx.rotate(orot);
  ctx.translate(-p.hx, -p.hy);
  piecePath(p);
  ctx.clip();
  var m = tabMargin();
  drawArt(p.col * CW - m, p.row * CH - m, (p.col + 1) * CW + m, (p.row + 1) * CH + m);
  ctx.restore();
  // Cut lines show only while a piece is away from
  // home: full strength at the authored scatter,
  // gone once it has clicked into place.
  var vis = Math.max(inv, Math.min(1, (Math.abs(p.dx) + Math.abs(p.dy)) / 50 + Math.abs(p.dr) * 2.5));
  if (vis > 0.01) {
    ctx.save();
    ctx.translate(p.hx + ox, p.hy + oy);
    ctx.rotate(orot);
    ctx.translate(-p.hx, -p.hy);
    piecePath(p);
    ctx.globalAlpha = 0.5 * vis;
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();
  }
}
function draw() {
  ctx.fillStyle = PAPER;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);
  for (var i = 0; i < PIECES.length; i++) drawPiece(PIECES[i]);
}

// ---- pointer: drag bursts, double-tap re-scatters ------
// A press that moves is a drag: pieces within reach
// of the pointer take a velocity impulse away from it
// (and along its motion), plus a slight rotation in
// their tabled scatter direction. On release their
// current offsets are captured and the 20s centre
// ripple restarts. Two close taps re-scatter to the
// authored table. A tap alone does nothing, and the
// piece never reloads.
var downX = -1, downY = -1, downT = 0, lastTapT = -10;
var dragging = false, lastMX = 0, lastMY = 0;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y; downT = T;
  lastMX = p.x; lastMY = p.y;
  dragging = true;
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging || downX < 0) return;
  var p = toDesign(e);
  var mvx = p.x - lastMX, mvy = p.y - lastMY;
  lastMX = p.x; lastMY = p.y;
  var spd = Math.hypot(mvx, mvy);
  if (spd < 0.5) return;
  var push = Math.min(spd, 46);
  for (var i = 0; i < PIECES.length; i++) {
    var pc = PIECES[i];
    var cx = pc.hx + curOffX(pc), cy = pc.hy + curOffY(pc);
    var dx = cx - p.x, dy = cy - p.y;
    var d = Math.hypot(dx, dy);
    if (d >= 210) continue;
    var fall = 1 - d / 210;
    var ax = d > 1 ? dx / d : SCAT[i].dirx, ay = d > 1 ? dy / d : SCAT[i].diry;
    pc.dvx = clamp(pc.dvx + (ax * push * 0.14 + mvx * 0.12) * fall, -26, 26);
    pc.dvy = clamp(pc.dvy + (ay * push * 0.14 + mvy * 0.12) * fall, -26, 26);
    pc.drv = clamp(pc.drv + SCAT[i].rs * push * 0.0011 * fall, -0.05, 0.05);
  }
});
function endPointer(e, cancelled) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx = p.x - downX, dy = p.y - downY;
  var moved = Math.hypot(dx, dy);
  var held = T - downT;
  downX = -1;
  dragging = false;
  if (cancelled) { captureAndRestart(); return; }
  if (moved >= 28) { captureAndRestart(); return; }
  if (held >= 0.8) return;
  if (T - lastTapT < 0.4) {
    lastTapT = -10;
    rescatter();
  } else {
    lastTapT = T;
  }
}
canvas.addEventListener('pointerup', function (e) { endPointer(e, false); });
canvas.addEventListener('pointercancel', function (e) { endPointer(e, true); });

// ---- sizing: cover fit, grid follows the aspect --------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
  var cols = H > W ? 7 : 10, rows = H > W ? 10 : 7;
  if (cols !== COLS || rows !== ROWS) buildGrid(cols, rows);
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; tick(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
