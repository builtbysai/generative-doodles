<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hind Sight</title>
<style>
  html, body { margin: 0; padding: 0; background: #060608; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette (strict, nothing else)
  var BLACK = '#000000';       // the field
  var EDGE = '138,168,200';    // #8AA8C8 form edge
  var CORE = '200,220,232';    // #C8DCE8 form core
  // Page ground is #060608 (near-black), set in CSS above.

  var LOOP = 720;              // 12-minute cycle: 10 min rise, 2 min fade
  var RISE = 600;              // adaptation ramp ends at minute 10
  var TAU = 240;               // dark-adaptation time constant (seconds)

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0 && minDim < 700) return true;
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.round(w));
    H = Math.max(1, Math.round(h));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }

  // QA hook only: "?seed=tNNN" starts the cycle at second NNN (used for
  // state-forced verification renders). Inert in normal viewing: no seed
  // means the cycle starts at t = 0, pitch black, as specced.
  var T_OFF = 0;
  (function () {
    var s = (typeof location !== 'undefined' && location.search) || '';
    var m = /seed=t(\d+(?:\.\d+)?)/.exec(s);
    if (m) T_OFF = parseFloat(m[1]);
  })();

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  window.addEventListener('resize', function () { resize(); draw(lastT); });

  // Dark-adaptation envelope, closed form in cycle time.
  // Rise: A = 1 - e^(-t/240) (fast in the first 3 minutes, slow after).
  // One gentle pulse (a single sine breath) centered on minute 5.
  // Minutes 10-12: linear fade from the minute-10 value back to black.
  function envelope(tSec) {
    var p = ((tSec % LOOP) + LOOP) % LOOP;
    var aFull = 1 - Math.exp(-RISE / TAU); // value at the top of the ramp
    var a;
    if (p <= RISE) {
      a = 1 - Math.exp(-p / TAU);
      if (p >= 270 && p <= 330) {
        a *= 1 + 0.12 * Math.sin(Math.PI * (p - 270) / 60);
      }
    } else {
      a = aFull * (LOOP - p) / (LOOP - RISE);
    }
    return a;
  }

  // The doorway: a tall form with a semicircular arch top, centered.
  // Drawn as a path at a given scale about the form center.
  function doorwayPath(cx, cy, w, h) {
    var r = w / 2;                    // arch radius
    var x0 = cx - r, x1 = cx + r;
    var yBot = cy + h / 2;
    var yArch = cy - h / 2 + r;       // arch center height
    ctx.beginPath();
    ctx.moveTo(x0, yBot);
    ctx.lineTo(x0, yArch);
    ctx.arc(cx, yArch, r, Math.PI, 0);
    ctx.lineTo(x1, yBot);
    ctx.closePath();
  }

  // Soft edge without gradients: a stack of shrinking alpha layers.
  // Cumulative alpha at the form boundary is ~12% of the edge color;
  // the core layers add ~6% of the lighter core color on top.
  // Every coefficient is multiplied by the adaptation envelope A(t).
  var LAYERS = [
    { s: 1.24, rgb: EDGE, a: 0.035 },
    { s: 1.12, rgb: EDGE, a: 0.040 },
    { s: 1.00, rgb: EDGE, a: 0.050 },
    { s: 0.86, rgb: CORE, a: 0.025 },
    { s: 0.70, rgb: CORE, a: 0.020 },
    { s: 0.52, rgb: CORE, a: 0.018 }
  ];

  var lastT = 0;

  function draw(tSec) {
    lastT = tSec;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    // The field: pure black. Nothing else is ever drawn on it
    // except the form itself.
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = BLACK;
    ctx.fillRect(0, 0, W, H);

    var A = envelope(tSec);
    if (A <= 0.0004) return; // pitch black (frame one lives here)

    var fh = H * 0.40;                 // form occupies 40% of frame height
    var fw = fh * 0.52;
    var cx = W / 2, cy = H / 2;
    if (isPhone()) { fh = H * 0.40; fw = Math.min(fw, W * 0.62); }

    var i, L;
    for (i = 0; i < LAYERS.length; i++) {
      L = LAYERS[i];
      doorwayPath(cx, cy, fw * L.s, fh * L.s);
      ctx.fillStyle = 'rgba(' + L.rgb + ',' + (L.a * A).toFixed(5) + ')';
      ctx.fill();
    }
  }

  resize();
  draw(T_OFF); // deterministic frame one: cycle t = 0, pitch black

  // No pointer handlers at all: input is ignored by design.
  // Turrell demands the price of admission; there is no shortcut.

  var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function frame(now) {
    var elapsed = ((now - t0) / 1000);
    draw(T_OFF + elapsed);
    requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
