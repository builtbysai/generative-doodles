<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.208 Message Wall</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0A0A0A; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.208 Message Wall (Asia Ward). Three plump tardigrade vessels
// rest on a low horizon under a reef-wall of glowing marks. Every
// mark is a contribution: tap anywhere and a mark blooms at the
// touch, drifts up into the wall, and settles into the strata while
// the nearest vessel pulses and its glow shifts a little toward
// the mark's position-hue. The wall remembers the whole session.
// Double-tap clears it back to three fresh empty vessels.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0A0A0A';
var BODY = '#C8A24B', SEG = '#A8833B', MARK = '#E8D8A8', HORIZON = '#1A1A1A';
var GLOWS = ['#4EC8C0', '#C84E8A', '#8AC84E'];
var GLOWHUES = [174, 330, 96];
var W = 0, H = 0, phone = false;
var seed = 208208;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
function hexRGB(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mixc(h1, h2, k) {
  var a = hexRGB(h1), b = hexRGB(h2);
  return 'rgb(' + Math.round(lerp(a[0], b[0], k)) + ',' + Math.round(lerp(a[1], b[1], k)) + ',' + Math.round(lerp(a[2], b[2], k)) + ')';
}
function hueMix(h1, h2, k) { // circular hue blend, returns hex-free hsl string
  var d = ((h2 - h1 + 540) % 360) - 180;
  var h = (h1 + d * k + 360) % 360;
  return { h: h, css: 'hsl(' + h.toFixed(0) + ',52%,58%)' };
}
var T = 0, lastNow = -1;

// ---- wall grid -------------------------------------------------------------------
var cell = 16, cols = 0, rowsTop = 0, rowsBot = 0;
var colFill = [];
var marks = [];   // {col,row,alpha,phase,absorbed}
var flying = [];  // {x,y,tx,ty,t,dur,hue}
var MAXMARKS = 800;
function horizonY() { return H * 0.80; }
function cellXY(c, r) { return [c * cell + cell / 2, horizonY() - (r + 0.5) * cell]; }
function seedWall() {
  marks = []; flying = []; colFill = [];
  for (var c = 0; c < cols; c++) {
    // uneven strata heights, like sediment laid down over time
    var hgt = Math.floor((0.42 + 0.30 * Math.sin(c * 0.35 + 1.2) + 0.14 * Math.sin(c * 0.09 + 0.4) + rand() * 0.22) * rowsBot * 0.62);
    colFill.push(0);
    for (var r = 0; r < hgt; r++) {
      marks.push({ col: c, row: colFill[c]++, alpha: 0.22 + rand() * 0.6, phase: rand() * 6.283, absorbed: r < 2 });
    }
  }
}

// ---- vessels -----------------------------------------------------------------------
var vessels = [];
function makeVessels() {
  vessels = [];
  var xs = [0.22, 0.5, 0.78];
  var held = [14, 23, 9]; // the wall is already in progress at frame one
  var nudge = [-18, 24, -30];
  for (var i = 0; i < 3; i++) {
    vessels.push({ fx: xs[i], hue: GLOWHUES[i] + nudge[i], pulse: 0, phase: i * 2.1, count: held[i] });
  }
}
makeVessels();

// ---- input ---------------------------------------------------------------------------
var pendingTap = null; // {x, y, due}
var lastTapMs = -1000;
canvas.addEventListener('pointerdown', function (e) {
  var now = performance.now();
  if (now - lastTapMs < 320) {
    // double-tap: reseed the wall back to three fresh vessels
    pendingTap = null;
    seedWallFresh();
    lastTapMs = -1000;
    return;
  }
  lastTapMs = now;
  pendingTap = { x: e.clientX, y: e.clientY, due: T + 0.26 };
});
function seedWallFresh() {
  marks = []; flying = [];
  for (var c = 0; c < cols; c++) colFill[c] = 0;
  for (var i = 0; i < 3; i++) { vessels[i].hue = GLOWHUES[i]; vessels[i].count = 0; vessels[i].pulse = 0; }
}
function contribute(x, y) {
  var hue = 20 + clamp(x / W, 0, 1) * 300;
  var c = clamp(Math.round((x / W) * cols + (rand() - 0.5) * 3), 0, cols - 1);
  var r = colFill[c]++;
  var m = { col: c, row: r, alpha: 0.45 + rand() * 0.5, phase: rand() * 6.283, absorbed: false };
  marks.push(m);
  if (marks.length > MAXMARKS) marks.shift();
  var txy = cellXY(c, r);
  flying.push({ x: x, y: y, tx: txy[0], ty: txy[1], t: 0, dur: 1.5 + rand() * 0.4, mark: m });
  // nearest vessel takes the contribution in
  var best = 0, bd = 1e9;
  for (var i = 0; i < 3; i++) {
    var d = Math.abs(vessels[i].fx * W - x);
    if (d < bd) { bd = d; best = i; }
  }
  vessels[best].pulse = 1;
  vessels[best].count++;
  vessels[best].hue = hueMix(vessels[best].hue, hue, 0.10).h;
}

// ---- resize -----------------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
  cell = Math.max(13, Math.round(W * 0.015));
  cols = Math.max(8, Math.floor(W / cell));
  rowsBot = Math.max(6, Math.floor((horizonY() - H * 0.05) / cell));
  if (marks.length === 0 && flying.length === 0) seedWall();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- drawing ------------------------------------------------------------------------------
function drawVessel(v, s) {
  var cx = v.fx * W, base = horizonY();
  var breathe = 1 + Math.sin(T * 0.55 + v.phase) * 0.022 + v.pulse * 0.05;
  // glow of what it holds
  var glowCss = hueMix(v.hue, v.hue, 0).css;
  var gr = s * (2.5 + v.pulse * 0.9);
  var g = ctx.createRadialGradient(cx, base - s * 0.4, s * 0.2, cx, base - s * 0.4, gr);
  g.addColorStop(0, glowCss);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save();
  ctx.globalAlpha = 0.16 + Math.min(0.2, v.count * 0.012) + v.pulse * 0.22;
  ctx.fillStyle = g;
  ctx.fillRect(cx - gr, base - s * 0.4 - gr, gr * 2, gr * 2);
  ctx.restore();
  ctx.save();
  ctx.translate(cx, base);
  ctx.scale(breathe, breathe);
  // stubby legs
  ctx.fillStyle = SEG;
  for (var li = 0; li < 4; li++) {
    var lx = -s * 0.52 + li * s * 0.3;
    ctx.beginPath();
    ctx.ellipse(lx, -s * 0.03, s * 0.085, s * 0.19, 0.25, 0, 6.2832);
    ctx.fill();
  }
  // plump segmented body, head to the right
  for (var si = 4; si >= 0; si--) {
    var bx = -s * 0.55 + si * s * 0.27;
    var br = s * (0.34 - Math.abs(si - 2) * 0.028);
    ctx.fillStyle = si % 2 ? SEG : BODY;
    ctx.beginPath();
    ctx.ellipse(bx, -s * 0.40, br * 1.04, br * 0.86, 0, 0, 6.2832);
    ctx.fill();
  }
  // snout
  ctx.fillStyle = BODY;
  ctx.beginPath();
  ctx.ellipse(s * 0.52, -s * 0.38, s * 0.15, s * 0.115, 0, 0, 6.2832);
  ctx.fill();
  ctx.restore();
}

function draw(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var dt = 0;
  if (lastNow >= 0 && time > 0) { dt = Math.min(0.05, (time - lastNow) / 1000); T += dt; }
  lastNow = time;
  if (pendingTap && T >= pendingTap.due) { contribute(pendingTap.x, pendingTap.y); pendingTap = null; }
  for (var i = 0; i < 3; i++) vessels[i].pulse = Math.max(0, vessels[i].pulse - dt * 0.7);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  // the wall of marks, behind everything
  var ms = cell * 0.52;
  for (var mi = 0; mi < marks.length; mi++) {
    var m = marks[mi];
    var xy = cellXY(m.col, m.row);
    if (xy[1] < H * 0.03) continue;
    var tw = 0.75 + 0.25 * Math.sin(T * 1.7 + m.phase);
    ctx.globalAlpha = m.alpha * tw * (m.absorbed ? 0.45 : 1);
    ctx.fillStyle = MARK;
    var sz = m.absorbed ? ms * 0.7 : ms;
    ctx.fillRect(xy[0] - sz / 2, xy[1] - sz / 2, sz, sz * (m.absorbed ? 0.5 : 1));
  }
  ctx.globalAlpha = 1;
  // marks still drifting home
  for (var fi = flying.length - 1; fi >= 0; fi--) {
    var f = flying[fi];
    f.t += dt;
    var k = clamp(f.t / f.dur, 0, 1);
    var e = 1 - Math.pow(1 - k, 3);
    var fx = lerp(f.x, f.tx, e), fy = lerp(f.y, f.ty, e) - Math.sin(k * 3.1416) * H * 0.05;
    var bloom = 1 + Math.sin(Math.min(1, f.t * 2.4) * 3.1416) * 1.3;
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = MARK;
    var fs = ms * bloom;
    ctx.fillRect(fx - fs / 2, fy - fs / 2, fs, fs);
    if (k >= 1) flying.splice(fi, 1);
  }
  ctx.globalAlpha = 1;
  // horizon and vessels
  ctx.strokeStyle = HORIZON;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, horizonY());
  ctx.lineTo(W, horizonY());
  ctx.stroke();
  var vs = Math.min(W, H) * (phone ? 0.14 : 0.115);
  for (var vi = 0; vi < 3; vi++) drawVessel(vessels[vi], vs);
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
