<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squarewave Glyphs</title>
<style>
html, body { margin: 0; padding: 0; background: #0D0D0C; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var GROUND = '#0D0D0C';
var PLATE = '#171715';
var PLATE_LINE = 'rgba(237,232,219,0.40)';
var BONE = '#EDE8DB';
var BONE_DIM = '#C9C2B2';
var RED = '#E63312';
var GLYPHS = 16;
var CYCLE = 8;
var T0 = 2.0;
var ACCENT_FADE = 1.0;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mixHex(a, b, t) {
  var ca = hexRgb(a), cb = hexRgb(b);
  return 'rgb(' + Math.round(lerp(ca[0], cb[0], t)) + ',' + Math.round(lerp(ca[1], cb[1], t)) + ',' + Math.round(lerp(ca[2], cb[2], t)) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
/* ---- seeded glyph table: duty cycle, wave cycles, fixed phase, snap offset ---- */
var rng = mulberry32(1726);
var duty = [], cycles = [], phase = [], off = [];
var i;
for (i = 0; i < GLYPHS; i++) {
  duty.push(0.30 + rng() * 0.40);
  cycles.push(rng() < 0.5 ? 1 : 2);
  phase.push(rng());
  off.push(rng());
}
var ACCENT = Math.floor(rng() * GLYPHS);
off[ACCENT] = 0.55;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- band: one horizontal band, centered, generous black margins ---- */
function bandRect() {
  if (isPhone) {
    var w = VW * 0.90;
    var h = VW * 0.42;
    return { x: (VW - w) / 2, y: VH * 0.46 - h / 2, w: w, h: h };
  }
  var s = Math.min(VW, VH);
  var bw = s * 0.86, bh = s * 0.30;
  return { x: (VW - bw) / 2, y: (VH - bh) / 2, w: bw, h: bh };
}
/* ---- shared slow clock: 8 s period, hard snap every 4 s, no easing ---- */
function snapState(idx, t) {
  return (Math.floor(t / 4 + off[idx]) % 2 + 2) % 2 === 1 ? 1 : 0;
}
function lastSnapT(idx, t) {
  return 4 * (Math.floor(t / 4 + off[idx]) - off[idx]);
}
var clockT = T0;
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var band = bandRect();
  var t = clockT;
  var gap = band.w * 0.02;
  var cw = (band.w - (GLYPHS - 1) * gap) / GLYPHS;
  var baseY = band.y + band.h;
  var aMax = band.h * 0.86;
  var aMin = band.h * 0.28;
  var lw = Math.max(2, band.h * 0.018);
  /* faint baseline tying the band together */
  ctx.beginPath();
  ctx.moveTo(band.x, baseY + 0.5);
  ctx.lineTo(band.x + band.w, baseY + 0.5);
  ctx.lineWidth = Math.max(1, band.h * 0.006);
  ctx.strokeStyle = 'rgba(237,232,219,0.28)';
  ctx.stroke();
  var g, j, x, y, u, high, amp, yHi, snapAge, fade, col;
  var N = 48;
  ctx.lineJoin = 'miter';
  ctx.lineCap = 'butt';
  for (g = 0; g < GLYPHS; g++) {
    amp = snapState(g, t) ? aMax : aMin;
    yHi = baseY - amp;
    col = BONE;
    if (g === ACCENT) {
      snapAge = t - lastSnapT(g, t);
      fade = clamp(1 - snapAge / ACCENT_FADE, 0, 1);
      if (fade > 0) col = mixHex(BONE, RED, fade);
    }
    ctx.beginPath();
    for (j = 0; j <= N; j++) {
      x = band.x + g * (cw + gap) + cw * j / N;
      u = ((j / N) * cycles[g] + phase[g]) % 1;
      high = u < duty[g];
      y = high ? yHi : baseY;
      if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.lineWidth = lw;
    ctx.strokeStyle = col;
    ctx.stroke();
  }
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Squarewave Glyphs').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Squarewave Glyphs').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 03').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = BONE;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Squarewave Glyphs', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = BONE_DIM;
  ctx.fillText('2006 · 10 · 03', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the glyphs snap.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = BONE_DIM;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (tt) { clockT = tt; draw(); },
    glyphCount: function () { return GLYPHS; },
    accentIndex: function () { return ACCENT; },
    snapState: function (idx, tt) { return snapState(idx, tt); },
    clockT: function () { return clockT; }
  };
}
/* ---- frame one: fixed phase t = 2.0 s, mid-state band, accent mid-flash ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    var prevTs = null, t0 = null;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })(0);
}
</script>
</body>
</html>
