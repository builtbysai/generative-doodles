<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Never Say Goodbye</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #E5A9B0; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette
  var PINK = '#E5A9B0', ROSE = '#C97B84', CREAM = '#F0E6D4', INK = '#3A3330',
      HEART = '#C22E4A', BLUE = '#4E7FB5', GOLD = '#D9A441', DEEP = '#1B1518';

  // Seeded PRNG (mulberry32) - every variation is fixed, never Math.random
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1283);

  var W = 0, H = 0, phone = false;
  var frames = [], hearts = [], bubbles = [], speckles = [];
  var dragEvents = [], glowEvents = [];
  var downPos = null, downTime = 0;

  function isPhone() {
    var minDim = Math.min(window.screen.width, window.screen.height);
    if (minDim < 700) return true;
    var vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    return vh > vw * 1.15;
  }

  function size() {
    var vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    W = vw; H = vh;
    canvas.width = vw; canvas.height = vh;
    phone = isPhone();
    build();
  }

  function build() {
    var r = mulberry32(1283);
    frames = []; hearts = []; bubbles = []; speckles = [];

    // Poster rect: 3 cols x 4 rows of portrait frames, aspect ~0.78 each
    var mx = W * 0.05, my = H * 0.05;
    var pw = W - 2 * mx;
    var g = Math.max(10, Math.min(W, H) * 0.022);
    var fw = (pw - 2 * g) / 3, fh = fw / 0.78;
    var ph = 4 * fh + 3 * g;
    if (ph > H - 2 * my) { var k = (H - 2 * my) / ph; pw *= k; g *= k; fw = (pw - 2 * g) / 3; fh = fw / 0.78; ph = 4 * fh + 3 * g; }
    var px = (W - pw) / 2, py = (H - ph) / 2;

    var wear = [0, 1, 2, 3, 4];
    for (var row = 0; row < 4; row++) {
      for (var col = 0; col < 3; col++) {
        var fx = px + col * (fw + g), fy = py + row * (fh + g);
        frames.push({
          x: fx, y: fy, w: fw, h: fh,
          baseRot: (r() - 0.5) * 0.06,
          swayAmp: 0.008 + r() * 0.008,
          swayPeriod: 5.5 + r() * 4,
          swayPhase: r() * Math.PI * 2,
          lag: 0.6 + r() * 0.4,
          wear: wear[Math.floor(r() * wear.length)],
          skin: r() > 0.5,
          beard: r() > 0.55,
          seed: r() * 1000
        });
      }
    }

    // Chalk speckles across the whole wash
    var nSp = Math.floor(W * H / 900);
    for (var i = 0; i < nSp; i++) {
      speckles.push({ x: r() * W, y: r() * H, s: 0.6 + r() * 1.6, a: 0.05 + r() * 0.12, c: r() > 0.5 ? ROSE : CREAM });
    }

    // Hearts and bubble words scattered, kept out of frame rects
    function insideFrame(x, y, pad) {
      for (var i = 0; i < frames.length; i++) {
        var f = frames[i];
        if (x > f.x - pad && x < f.x + f.w + pad && y > f.y - pad && y < f.y + f.h + pad) return true;
      }
      return false;
    }
    var tries = 0;
    while (hearts.length < 14 && tries < 400) {
      tries++;
      var hx = r() * W, hy = r() * H, hs = 8 + r() * 16;
      if (insideFrame(hx, hy, hs + 6)) continue;
      hearts.push({ x: hx, y: hy, s: hs, rot: (r() - 0.5) * 0.8, phase: r() * Math.PI * 2, lag: 0.5 + r() * 0.5, seed: r() * 1000 });
    }
    tries = 0;
    while (bubbles.length < 10 && tries < 400) {
      tries++;
      var bx = r() * W, by = r() * H, bw = 34 + r() * 44;
      if (insideFrame(bx, by, bw * 0.6)) continue;
      bubbles.push({ x: bx, y: by, w: bw, h: bw * 0.45, rot: (r() - 0.5) * 0.5, c: r() > 0.5 ? BLUE : GOLD, phase: r() * Math.PI * 2, lag: 0.5 + r() * 0.5, n: 2 + Math.floor(r() * 3), seed: r() * 1000 });
    }
  }

  // Breeze from recorded drag events: closed-form sum, exp decay tau 2.2s
  function breeze(t) {
    var b = 0;
    for (var i = 0; i < dragEvents.length; i++) {
      var e = dragEvents[i], dt = t - e.t;
      if (dt >= 0 && dt < 9) b += e.dx * 0.0022 * Math.exp(-dt / 2.2);
    }
    if (b > 0.05) b = 0.05; if (b < -0.05) b = -0.05;
    return b;
  }

  function glowAt(ev, t) {
    var dt = t - ev.t;
    if (dt < 0 || dt > 3.5) return 0;
    if (dt < 0.4) return dt / 0.4;
    if (dt < 2.0) return 1;
    return 1 - (dt - 2.0) / 1.5;
  }

  function dot(x, y, rad, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(x + rad, y); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
  }

  function drawHeart(x, y, s, rot, seed) {
    var r = mulberry32(Math.floor(seed));
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.strokeStyle = HEART; ctx.lineWidth = Math.max(1.2, s * 0.09); ctx.lineJoin = 'round';
    ctx.beginPath();
    var first = true;
    for (var a = 0; a <= Math.PI * 2 + 0.01; a += 0.35) {
      var hx = 16 * Math.pow(Math.sin(a), 3);
      var hy = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a));
      hx = hx / 16 * s; hy = hy / 16 * s;
      hx += (r() - 0.5) * s * 0.06; hy += (r() - 0.5) * s * 0.06;
      if (first) { ctx.moveTo(hx, hy); first = false; } else ctx.lineTo(hx, hy);
    }
    ctx.closePath();
    ctx.fillStyle = HEART; ctx.globalAlpha = 0.16; ctx.fill(); ctx.globalAlpha = 1; ctx.stroke();
    ctx.restore();
  }

  // Decorative bubble word: balloon outline + wavy squiggle glyphs, no legible letters
  function drawBubble(b, t, br) {
    var r = mulberry32(Math.floor(b.seed));
    var bob = br * 26 * b.lag + 1.5 * Math.sin(2 * Math.PI * t / 5 + b.phase);
    ctx.save();
    ctx.translate(b.x, b.y + bob); ctx.rotate(b.rot + br * 0.4 * b.lag);
    ctx.strokeStyle = b.c; ctx.globalAlpha = 0.75; ctx.lineWidth = Math.max(1, b.w * 0.03);
    ctx.beginPath();
    ctx.ellipse(0, 0, b.w / 2, b.h / 2, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 0.9;
    var gy = 0;
    for (var i = 0; i < b.n; i++) {
      var gw = b.w * 0.16, gx = -b.w * 0.32 + i * b.w * 0.22;
      ctx.beginPath();
      for (var s = 0; s <= 1.001; s += 0.2) {
        var px = gx + s * gw, py = gy + Math.sin(s * Math.PI * 2 + r() * 2) * b.h * 0.12 + (r() - 0.5) * 1.5;
        if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawPortrait(f, t, br) {
    var rot = f.baseRot + f.swayAmp * Math.sin(2 * Math.PI * t / f.swayPeriod + f.swayPhase) + br * f.lag;
    ctx.save();
    ctx.translate(f.x + f.w / 2, f.y + f.h / 2);
    ctx.rotate(rot);
    ctx.translate(-f.w / 2, -f.h / 2);

    // Frame: cream field, ink border, slightly hand-drawn
    ctx.fillStyle = CREAM;
    ctx.fillRect(0, 0, f.w, f.h);
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1.2, f.w * 0.02);
    ctx.strokeRect(f.w * 0.03, f.h * 0.03, f.w * 0.94, f.h * 0.94);

    var r = mulberry32(Math.floor(f.seed));
    var cx = f.w / 2, hr = f.w * 0.20, hy = f.h * 0.30;

    // Shoulders
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.moveTo(cx - f.w * 0.34, f.h * 0.90);
    ctx.lineTo(cx - f.w * 0.20, f.h * 0.56);
    ctx.lineTo(cx + f.w * 0.20, f.h * 0.56);
    ctx.lineTo(cx + f.w * 0.34, f.h * 0.90);
    ctx.closePath(); ctx.fill();

    // Head
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.moveTo(cx + hr, hy); ctx.arc(cx, hy, hr, 0, Math.PI * 2); ctx.fill();

    // Cream face oval over the ink head (chalk-ink portrait: ink outline, cream face)
    ctx.fillStyle = CREAM;
    ctx.beginPath(); ctx.moveTo(cx + hr * 0.82, hy + hr * 0.1); ctx.arc(cx, hy + hr * 0.1, hr * 0.82, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, f.w * 0.012);
    ctx.beginPath(); ctx.moveTo(cx + hr * 0.82, hy + hr * 0.1); ctx.arc(cx, hy + hr * 0.1, hr * 0.82, 0, Math.PI * 2); ctx.stroke();

    // Headwear
    ctx.fillStyle = INK;
    if (f.wear === 0) { // turban: rounded mass above head + wrap lines
      ctx.beginPath(); ctx.moveTo(cx - hr * 0.95, hy - hr * 0.35); ctx.arc(cx, hy - hr * 0.35, hr * 0.95, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = CREAM; ctx.lineWidth = Math.max(1, f.w * 0.012);
      ctx.beginPath(); ctx.moveTo(cx - hr * 0.7, hy - hr * 0.7); ctx.lineTo(cx + hr * 0.7, hy - hr * 0.55); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - hr * 0.6, hy - hr * 0.95); ctx.lineTo(cx + hr * 0.6, hy - hr * 0.8); ctx.stroke();
    } else if (f.wear === 1) { // cap band
      ctx.beginPath(); ctx.moveTo(cx - hr * 0.8, hy - hr * 0.3); ctx.arc(cx, hy - hr * 0.3, hr * 0.8, Math.PI, 0); ctx.fill();
    } else if (f.wear === 2) { // side hair blobs
      dot(cx - hr * 0.85, hy + hr * 0.1, hr * 0.28, INK);
      dot(cx + hr * 0.85, hy + hr * 0.1, hr * 0.28, INK);
    } else if (f.wear === 3) { // scarf drape around sides
      ctx.fillRect(cx - hr * 1.05, hy - hr * 0.4, hr * 0.3, hr * 1.5);
      ctx.fillRect(cx + hr * 0.75, hy - hr * 0.4, hr * 0.3, hr * 1.5);
    } else { // bun on top + hair cap
      ctx.beginPath(); ctx.moveTo(cx + hr, hy - hr * 0.5); ctx.arc(cx, hy - hr * 0.5, hr, Math.PI, 0); ctx.fill();
      dot(cx, hy - hr * 1.35, hr * 0.32, INK);
    }

    // Face marks: eyes, mouth, optional beard stubble
    dot(cx - hr * 0.32, hy + hr * 0.15, Math.max(1, hr * 0.07), INK);
    dot(cx + hr * 0.32, hy + hr * 0.15, Math.max(1, hr * 0.07), INK);
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, f.w * 0.012);
    ctx.beginPath(); ctx.moveTo(cx - hr * 0.25, hy + hr * 0.55); ctx.lineTo(cx + hr * 0.25, hy + hr * 0.55); ctx.stroke();
    if (f.beard) {
      for (var i = 0; i < 9; i++) {
        var bx = cx - hr * 0.6 + i * hr * 0.15;
        dot(bx, hy + hr * 0.72 + (r() - 0.5) * hr * 0.1, Math.max(0.8, hr * 0.05), INK);
      }
    }

    // Chalk speckles inside the portrait
    for (var s = 0; s < 14; s++) {
      ctx.globalAlpha = 0.10 + r() * 0.12;
      ctx.fillStyle = INK;
      ctx.fillRect(r() * f.w, r() * f.h, 1.2, 1.2);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function draw(t) {
    ctx.fillStyle = PINK;
    ctx.fillRect(0, 0, W, H);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    // Chalk wash texture
    for (var i = 0; i < speckles.length; i++) {
      var sp = speckles[i];
      ctx.globalAlpha = sp.a;
      ctx.fillStyle = sp.c;
      ctx.fillRect(sp.x, sp.y, sp.s, sp.s);
    }
    ctx.globalAlpha = 1;

    var br = breeze(t);

    // Hearts behind frames
    for (var h = 0; h < hearts.length; h++) {
      var he = hearts[h];
      drawHeart(he.x, he.y + br * 26 * he.lag + 1.5 * Math.sin(2 * Math.PI * t / 5 + he.phase), he.s, he.rot + br * 0.4 * he.lag, he.seed);
    }
    // Bubble words behind frames
    for (var b = 0; b < bubbles.length; b++) drawBubble(bubbles[b], t, br);

    // Frames + warm stage-light glows
    for (var f = 0; f < frames.length; f++) {
      var fr = frames[f];
      var gl = 0;
      for (var gI = 0; gI < glowEvents.length; gI++) {
        if (glowEvents[gI].frame === f) gl = Math.max(gl, glowAt(glowEvents[gI], t));
      }
      if (gl > 0) {
        // Warm glow as layered flat alpha ellipses, never neon
        ctx.fillStyle = GOLD;
        ctx.globalAlpha = 0.10 * gl;
        ctx.beginPath(); ctx.moveTo(fr.x + fr.w / 2 + fr.w * 0.75, fr.y + fr.h / 2); ctx.ellipse(fr.x + fr.w / 2, fr.y + fr.h / 2, fr.w * 0.75, fr.h * 0.65, 0, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 0.08 * gl;
        ctx.beginPath(); ctx.moveTo(fr.x + fr.w / 2 + fr.w * 0.6, fr.y + fr.h / 2); ctx.ellipse(fr.x + fr.w / 2, fr.y + fr.h / 2, fr.w * 0.6, fr.h * 0.52, 0, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
      drawPortrait(fr, t, br);
    }
  }

  function pos(e) {
    var x = (typeof e.clientX !== 'undefined') ? e.clientX : e.offsetX;
    var y = (typeof e.clientY !== 'undefined') ? e.clientY : e.offsetY;
    return { x: x, y: y };
  }
  var lastPos = null;
  canvas.addEventListener('pointerdown', function (e) {
    var p = pos(e);
    downPos = p; lastPos = p;
    downTime = now();
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = pos(e);
    if (downPos && lastPos) {
      var dx = p.x - lastPos.x;
      if (dx !== 0) dragEvents.push({ dx: dx, t: now() });
    }
    lastPos = p;
  });
  canvas.addEventListener('pointerup', function (e) {
    var p = pos(e);
    if (downPos) {
      var moved = Math.abs(p.x - downPos.x) + Math.abs(p.y - downPos.y);
      if (moved < 12 && now() - downTime < 0.6) {
        for (var i = 0; i < frames.length; i++) {
          var f = frames[i];
          if (p.x >= f.x && p.x <= f.x + f.w && p.y >= f.y && p.y <= f.y + f.h) {
            glowEvents.push({ frame: i, t: now() });
            break;
          }
        }
      }
    }
    downPos = null; lastPos = null;
  });

  var T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  var booted = false;
  function now() {
    if (booted && typeof performance !== 'undefined' && performance.now) return (performance.now() - T0) / 1000;
    return 0;
  }

  if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { size(); draw(0); });
  window.addEventListener('resize', function () { size(); draw(0); });

  size();
  draw(0); // boot-flagged fixed-phase first frame
  booted = true;
  if (typeof requestAnimationFrame !== 'undefined') {
    (function loop() {
      draw(now());
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
