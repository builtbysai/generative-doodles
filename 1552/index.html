<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Daily Cell</title>
<style>
html, body { margin: 0; padding: 0; background: #EFEFEF; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = [239, 239, 239];
var FACE = [26, 26, 26];
var GREEN = [39, 239, 39];
var NU = 56, NV = 28;
var K = 1.8;
var BAND = 0.5, HALF = 0.055, CORE = 0.02;
var TILT = -0.38;
var SPIN_PERIOD = 300;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(1552000);
var seedJitter = rng();
function hash3(ix, iy, iz) {
  var h = Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263) ^ Math.imul(iz | 0, 2147483647);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
function lerp(a, b, t) { return a + (b - a) * t; }
function noise3(x, y, z) {
  var ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  var fx = x - ix, fy = y - iy, fz = z - iz;
  var ux = fade(fx), uy = fade(fy), uz = fade(fz);
  var c000 = hash3(ix, iy, iz), c100 = hash3(ix + 1, iy, iz);
  var c010 = hash3(ix, iy + 1, iz), c110 = hash3(ix + 1, iy + 1, iz);
  var c001 = hash3(ix, iy, iz + 1), c101 = hash3(ix + 1, iy, iz + 1);
  var c011 = hash3(ix, iy + 1, iz + 1), c111 = hash3(ix + 1, iy + 1, iz + 1);
  var x00 = lerp(c000, c100, ux), x10 = lerp(c010, c110, ux);
  var x01 = lerp(c001, c101, ux), x11 = lerp(c011, c111, ux);
  var y0 = lerp(x00, x10, uy), y1 = lerp(x01, x11, uy);
  return lerp(y0, y1, uz);
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0;
var drag = null;
var press = 0;
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function isPhone() {
  var w = 0, h = 0;
  if (typeof window !== 'undefined' && window.screen) { w = window.screen.width; h = window.screen.height; }
  if (w && h) return Math.min(w, h) < 700;
  return VH > VW * 1.15;
}
function torusPoint(u, v, R, r, phi) {
  var cu = Math.cos(u), su = Math.sin(u), cv = Math.cos(v), sv = Math.sin(v);
  var x = (R + r * cv) * cu;
  var y = (R + r * cv) * su;
  var z = r * sv;
  var cp = Math.cos(phi), sp = Math.sin(phi);
  var x1 = x * cp + z * sp;
  var z1 = -x * sp + z * cp;
  var ct = Math.cos(TILT), st = Math.sin(TILT);
  var y2 = y * ct - z1 * st;
  var z2 = y * st + z1 * ct;
  return [x1, y2, z2];
}
function stateAt(t) {
  var minDim = Math.min(VW, VH);
  var cx = 0.5 * VW, cy = 0.5 * VH;
  var R = 0.30 * minDim, r = 0.115 * minDim;
  var phi = TAU * t / SPIN_PERIOD;
  var cells = [];
  var holeCount = 0;
  var holeSX = 0, holeSY = 0;
  var du = TAU / NU, dv = TAU / NV;
  for (var i = 0; i < NU; i++) {
    for (var j = 0; j < NV; j++) {
      var u0 = i * du, u1 = (i + 1) * du;
      var v0 = j * dv, v1 = (j + 1) * dv;
      var p00 = torusPoint(u0, v0, R, r, phi);
      var p10 = torusPoint(u1, v0, R, r, phi);
      var p11 = torusPoint(u1, v1, R, r, phi);
      var p01 = torusPoint(u0, v1, R, r, phi);
      var pts = [p00, p10, p11, p01];
      var mx = 0, my = 0, mz = 0;
      for (var k = 0; k < 4; k++) { mx += pts[k][0]; my += pts[k][1]; mz += pts[k][2]; }
      mx /= 4; my /= 4; mz /= 4;
      var f = noise3(mx / R * K + t * 0.030 + seedJitter * 0.001, my / R * K + t * 0.021, mz / R * K - t * 0.017);
      var d = Math.abs(f - BAND);
      var s = clamp((d - CORE) / (HALF - CORE), 0, 1);
      s = s * s * (3 - 2 * s);
      if (drag && drag.active && press > 0) {
        var scx = cx + mx, scy = cy - my;
        var ddx = (scx - drag.x) / minDim, ddy = (scy - drag.y) / minDim;
        var g = Math.exp(-(ddx * ddx + ddy * ddy) / (0.18 * 0.18)) * press;
        if (g > 0.001) {
          var f2 = f + (BAND - f) * g * 0.9;
          var d2 = Math.abs(f2 - BAND);
          var s2 = clamp((d2 - CORE) / (HALF - CORE), 0, 1);
          s = s2 * s2 * (3 - 2 * s2);
        }
      }
      if (s <= 0.02) {
        holeCount++;
        holeSX += cx + mx; holeSY += cy - my;
      }
      var depth = (pts[0][2] + pts[1][2] + pts[2][2] + pts[3][2]) / 4;
      cells.push({ pts: pts, s: s, depth: depth, cx: cx + mx, cy: cy - my });
    }
  }
  cells.sort(function (a, b) { return a.depth - b.depth; });
  return {
    t: t, cells: cells, holeCount: holeCount,
    holeCX: holeCount > 0 ? holeSX / holeCount : -1,
    holeCY: holeCount > 0 ? holeSY / holeCount : -1,
    press: press, dragActive: drag ? drag.active : false,
    cx: cx, cy: cy, R: R, r: r, phone: isPhone()
  };
}
function publishHook(st) {
  if (typeof window !== 'undefined') {
    window.__p1552 = {
      t: st.t, holeCount: st.holeCount, holeCX: st.holeCX, holeCY: st.holeCY,
      press: st.press, dragActive: st.dragActive, cellCount: st.cells.length,
      cx: st.cx, cy: st.cy, R: st.R, phone: st.phone
    };
  }
}
function draw(t) {
  lastT = t;
  size();
  if (drag && drag.active) press = Math.min(1, press + 0.05);
  else press = Math.max(0, press - 0.04);
  var st = stateAt(t);
  ctx.fillStyle = rgb(GROUND);
  ctx.fillRect(0, 0, VW, VH);
  var minDim = Math.min(VW, VH);
  ctx.lineWidth = Math.max(1, minDim * 0.0016);
  ctx.strokeStyle = rgb(GREEN);
  ctx.fillStyle = rgb(FACE);
  for (var i = 0; i < st.cells.length; i++) {
    var c = st.cells[i];
    if (c.s <= 0.02) continue;
    var pts = c.pts;
    var mx = 0, my = 0;
    for (var m = 0; m < 4; m++) { mx += pts[m][0]; my += pts[m][1]; }
    mx /= 4; my /= 4;
    var s = c.s;
    ctx.beginPath();
    for (var n = 0; n < 4; n++) {
      var sx = st.cx + mx + (pts[n][0] - mx) * s;
      var sy = st.cy - my - (pts[n][1] - my) * s;
      if (n === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  publishHook(st);
}
function onDown(e) {
  drag = { active: true, x: e.clientX, y: e.clientY };
  publishHook(stateAt(lastT));
}
function onMove(e) {
  if (!drag) return;
  drag.x = e.clientX; drag.y = e.clientY;
  publishHook(stateAt(lastT));
}
function onUp(e) {
  if (drag) drag.active = false;
  publishHook(stateAt(lastT));
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
function loop(ts) {
  var t = ts / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
