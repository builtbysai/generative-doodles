<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forest Census</title>
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG (mulberry32, fixed seed) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(532064);

  // ---------- palette (flat fills only, no gradients anywhere) ----------
  var RED = '#C0392B', ORANGE = '#E07B39', CREAM = '#F5E9C8',
      GILL = '#7EC8E3', MOSS = '#4E9A3D', INK = '#1A1A1A', PAPER = '#FFFFFF';

  // ---------- layout: 3 cols x 4 rows over a footer band ----------
  var COLS = 3, ROWS = 4, NCELL = 12;
  var MARGIN = 0.032, GUT = 0.016, GRIDBOT = 0.94;
  var CELLW = (1 - 2 * MARGIN - (COLS - 1) * GUT) / COLS;
  var CELLH = (GRIDBOT - 2 * MARGIN - (ROWS - 1) * GUT) / ROWS;
  function cellX(i) { return MARGIN + (i % COLS) * (CELLW + GUT); }
  function cellY(i) { return MARGIN + Math.floor(i / COLS) * (CELLH + GUT); }

  // ---------- species table (sizes are fractions of CELLH) ----------
  // cells 4, 8, 12 (index 3, 7, 11) are the black-and-white ink studies.
  var species = [
    { kind: 'dome',    cap: RED,    capW: 0.80, capH: 0.34, stemH: 0.36, stemW: 0.17, spots: 9, ring: true,  curve: 0.010 }, // 1 classic spotted agaric
    { kind: 'funnel',  cap: ORANGE, capW: 0.82, capH: 0.30, stemH: 0.26, stemW: 0.22, spots: 0, ring: false, curve: 0.0 },   // 2 wavy funnel
    { kind: 'gills',   cap: ORANGE, capW: 0.82, capH: 0.20, stemH: 0.36, stemW: 0.15, spots: 0, ring: false, curve: -0.012 }, // 3 blue gills showing
    { kind: 'inkcone', label: 'Conica textilis' },                                                                             // 4 ink study
    { kind: 'dome',    cap: ORANGE, capW: 1.04, capH: 0.40, stemH: 0.30, stemW: 0.30, spots: 0, ring: false, curve: 0.0, moss: true }, // 5 the giant
    { kind: 'dome',    cap: RED,    capW: 0.74, capH: 0.32, stemH: 0.44, stemW: 0.16, spots: 0, ring: false, curve: 0.014, frills: 3 }, // 6 frilled stem
    { kind: 'cluster', cap: ORANGE, cap2: RED, spots: 0 },                                                                     // 7 cluster of three
    { kind: 'inkpuff', label: 'Globus spinulosa' },                                                                            // 8 ink study
    { kind: 'shelf',   cap: MOSS,   spots: 0 },                                                                                // 9 bracket shelves
    { kind: 'bell',    cap: RED,    capW: 0.42, capH: 0.29, stemH: 0.47, stemW: 0.10, spots: 4, ring: false, curve: -0.010 }, // 10 tall bell on a thread stem
    { kind: 'dome',    cap: ORANGE, capW: 0.86, capH: 0.30, stemH: 0.26, stemW: 0.30, spots: 0, ring: false, curve: 0.0, pores: true }, // 11 stout pore-cap
    { kind: 'inkveil', label: 'Velata umbrina' }                                                                               // 12 ink study
  ];

  // per-species static detail (spots), generated once from the seeded RNG
  species.forEach(function (sp) {
    sp.spotPts = [];
    if (sp.spots) {
      for (var i = 0; i < sp.spots; i++) {
        var a = rng() * Math.PI, r = 0.28 + rng() * 0.54;
        sp.spotPts.push({ dx: Math.cos(a) * r, dy: Math.sin(a) * r, s: 0.030 + rng() * 0.028 });
      }
    }
  });

  // ---------- spores: three color mushrooms shed them (cells 1, 6, 10) ----------
  var sporeCells = [0, 5, 9];
  var spores = [];
  sporeCells.forEach(function (ci) {
    for (var i = 0; i < 7; i++) {
      spores.push({
        cell: ci, xo: (rng() - 0.5) * 0.34, off: rng(),
        dur: 7 + rng() * 5, drift: (rng() - 0.5) * 0.05,
        r: 0.0034 + rng() * 0.0024
      });
    }
  });

  // ---------- ink studies: precomputed hatch line sets (local coords) ----------
  // local space: origin at mushroom base centre, x right, y up, units of CELLH.
  function hatchSet(build) { var arr = []; build(arr); return arr; }
  var inkData = {};
  inkData[3] = { // conical, honeycomb-ridged cap
    outline: 'cone',
    hatch: hatchSet(function (a) {
      var r = mulberry32(4101);
      for (var row = 0; row < 10; row++) {           // horizontal ridge strokes on the cone
        var y = 0.36 + row * 0.042;
        var hw = 0.335 * (1 - (y - 0.30) / 0.52 * 0.86);
        for (var x = -hw * 0.82; x < hw * 0.82; x += 0.062) {
          a.push([x, y, x + 0.04, y + 0.012 + r() * 0.006]);
        }
      }
      for (var v = 0; v < 12; v++) {                 // short vertical ticks between ridges
        var y2 = 0.34 + r() * 0.38, hw2 = 0.335 * (1 - (y2 - 0.30) / 0.52 * 0.86);
        var x2 = (r() * 2 - 1) * hw2 * 0.8;
        a.push([x2, y2, x2 + 0.004, y2 + 0.036]);
      }
      for (var s = 0; s < 7; s++) {                  // stem side shading
        a.push([0.028 + s * 0.006, 0.03 + s * 0.03, 0.052 + s * 0.006, 0.075 + s * 0.03]);
      }
      for (var gI = 0; gI < 9; gI++) {               // ground hatch
        a.push([-0.30 + gI * 0.07, -0.012 - (gI % 2) * 0.012, -0.30 + gI * 0.07 + 0.045, -0.012 - (gI % 2) * 0.012]);
      }
    })
  };
  inkData[7] = { // round puffball with spines
    outline: 'puff',
    hatch: hatchSet(function (a) {
      var r = mulberry32(4102);
      for (var i = 0; i < 34; i++) {                 // curved shading strokes, lower-right of the ball
        var px = -0.02 + r() * 0.30, py = 0.06 + r() * 0.34;
        a.push([px, py, px + 0.045, py - 0.028]);
      }
      for (var j = 0; j < 10; j++) {                 // sparse strokes upper-left for roundness
        var qx = -0.28 + r() * 0.16, qy = 0.30 + r() * 0.24;
        a.push([qx, qy, qx + 0.04, qy - 0.024]);
      }
      for (var gI = 0; gI < 9; gI++) {
        a.push([-0.30 + gI * 0.07, -0.012 - (gI % 2) * 0.012, -0.30 + gI * 0.07 + 0.045, -0.012 - (gI % 2) * 0.012]);
      }
    })
  };
  inkData[11] = { // veiled mushroom: ring, volva, gills
    outline: 'veil',
    hatch: hatchSet(function (a) {
      var r = mulberry32(4103);
      for (var i = 0; i < 22; i++) {                 // cap diagonal hatch, upper-left
        var y = 0.42 + r() * 0.24, hw = 0.36 * Math.sqrt(Math.max(0, 1 - Math.pow((y - 0.36) / 0.32, 2)));
        var x = -hw * (0.25 + r() * 0.6);
        a.push([x, y, x + 0.045, y + 0.03]);
      }
      for (var c = 0; c < 14; c++) {                 // cross-hatch pass, upper-right
        var y2 = 0.44 + r() * 0.2, hw2 = 0.36 * Math.sqrt(Math.max(0, 1 - Math.pow((y2 - 0.36) / 0.32, 2)));
        var x2 = hw2 * (0.1 + r() * 0.55);
        a.push([x2, y2, x2 + 0.04, y2 - 0.028]);
      }
      for (var s = 0; s < 6; s++) {                  // stem vertical shading
        a.push([0.03 + s * 0.008, 0.05 + s * 0.038, 0.036 + s * 0.008, 0.10 + s * 0.038]);
      }
      for (var gI = 0; gI < 9; gI++) {
        a.push([-0.30 + gI * 0.07, -0.012 - (gI % 2) * 0.012, -0.30 + gI * 0.07 + 0.045, -0.012 - (gI % 2) * 0.012]);
      }
    })
  };
  // ink-in cycle: long hold, then hatching redraws over 5s. All cells fully
  // inked at PHASE0 (see offsets).
  var inkCycle = { 3: { L: 34, off: 9 }, 7: { L: 34, off: 18 }, 11: { L: 34, off: 27 } };
  function inkProgress(idx, t) {
    var c = inkCycle[idx];
    var m = ((t - c.off) % c.L + c.L) % c.L;
    return Math.min(1, m / 5);
  }

  // ---------- grain: precomputed seeded specks drawn directly ----------
  var grain = [];
  for (var g = 0; g < 520; g++) {
    grain.push({ x: rng(), y: rng(), a: rng() * Math.PI, l: 1.5 + rng() * 3.5, al: 0.02 + rng() * 0.04 });
  }

  // ---------- viewport / stage ----------
  var W = 0, H = 0, SX = 0, SY = 0, SS = 0;
  var isPhone = false;
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    SS = Math.min(w, h);
    SX = (w - SS) / 2; SY = (h - SS) / 2;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || h > w * 1.15;
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  // ---------- drawing helpers (stage units: u = SS pixels) ----------
  function X(u) { return SX + u * SS; }
  function Y(u) { return SY + u * SS; }
  function fill(col, alpha) { ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = col; }
  function circ(x, y, r, col, alpha) {
    fill(col, alpha); ctx.beginPath(); ctx.arc(X(x), Y(y), r * SS, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
  }
  function ell(x, y, rx, ry, col, alpha) {
    fill(col, alpha); ctx.beginPath(); ctx.ellipse(X(x), Y(y), rx * SS, ry * SS, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
  }
  function seg(x1, y1, x2, y2, w, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.strokeStyle = col; ctx.lineWidth = w * SS; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke(); ctx.globalAlpha = 1;
  }

  // ---------- mushroom primitives (color cells) ----------
  // anchor: base centre (cx, baseY) in stage units; u = CELLH (local scale)
  function stemPath(cx, baseY, u, sp) {
    var h = sp.stemH * u, wb = sp.stemW * u / 2, wt = wb * 0.72;
    var cv = (sp.curve || 0) * u, topY = baseY - h;
    ctx.beginPath();
    ctx.moveTo(X(cx - wb), Y(baseY));
    ctx.quadraticCurveTo(X(cx - wb * 0.9 + cv * 0.4), Y(baseY - h * 0.55), X(cx - wt + cv), Y(topY));
    ctx.lineTo(X(cx + wt + cv), Y(topY));
    ctx.quadraticCurveTo(X(cx + wb * 0.9 + cv * 0.4), Y(baseY - h * 0.55), X(cx + wb), Y(baseY));
    ctx.closePath();
    return { topY: topY, topX: cx + cv };
  }
  function domePath(cx, rimY, w, h) {
    ctx.beginPath();
    ctx.moveTo(X(cx - w / 2), Y(rimY));
    ctx.bezierCurveTo(X(cx - w / 2), Y(rimY - h * 0.95), X(cx - w * 0.22), Y(rimY - h), X(cx), Y(rimY - h));
    ctx.bezierCurveTo(X(cx + w * 0.22), Y(rimY - h), X(cx + w / 2), Y(rimY - h * 0.95), X(cx + w / 2), Y(rimY));
    ctx.closePath();
  }
  function drawColorMushroom(idx, cx, baseY) {
    var sp = species[idx], u = CELLH;
    // soft ground shadow pool (flat, low alpha)
    ell(cx, baseY + 0.006, (sp.kind === 'cluster' ? 0.105 : sp.capW * u * 0.42), 0.008, INK, 0.08);
    if (sp.kind === 'cluster') { drawCluster(cx, baseY, u, sp); return; }
    if (sp.kind === 'shelf') { drawShelf(cx, baseY, u, sp); return; }
    var st = stemPath(cx, baseY, u, sp);
    fill(CREAM); ctx.fill();
    ctx.globalAlpha = 1; ctx.strokeStyle = INK; ctx.globalAlpha = 0.35; ctx.lineWidth = 0.0013 * SS; ctx.stroke(); ctx.globalAlpha = 1;
    var rimY = st.topY, capCx = st.topX;
    var capW = sp.capW * u, capH = sp.capH * u;
    if (sp.frills) { // scalloped frill rings down the stem
      for (var f = 0; f < sp.frills; f++) {
        var fy = baseY - (0.10 + f * 0.115) * u, fw = (sp.stemW * u) * (0.78 - f * 0.07);
        ctx.beginPath();
        for (var q = 0; q <= 10; q++) {
          var px = capCx - fw / 2 + (fw * q) / 10;
          var py = fy + Math.abs(Math.sin(q * Math.PI / 2.5)) * 0.012 * u;
          if (q === 0) ctx.moveTo(X(px), Y(py)); else ctx.lineTo(X(px), Y(py));
        }
        ctx.strokeStyle = INK; ctx.globalAlpha = 0.4; ctx.lineWidth = 0.0016 * SS; ctx.stroke(); ctx.globalAlpha = 1;
        seg(capCx - fw / 2, fy, capCx + fw / 2, fy, 0.0022, CREAM, 1);
      }
    }
    // (the agaric ring is drawn after the cap, inside the dome branch, so it
    // is not hidden behind the cream gill band)
    if (sp.kind === 'funnel') {
      // flared funnel: wavy rim, open top
      var fw2 = capW, fh = capH;
      ctx.beginPath();
      ctx.moveTo(X(capCx - sp.stemW * u * 0.4), Y(rimY));
      ctx.lineTo(X(capCx - fw2 / 2), Y(rimY - fh));
      for (var wI = 0; wI <= 12; wI++) {
        var wx = capCx - fw2 / 2 + (fw2 * wI) / 12;
        var wy = rimY - fh + Math.sin(wI * 1.7) * 0.014 * u;
        ctx.lineTo(X(wx), Y(wy));
      }
      ctx.lineTo(X(capCx + sp.stemW * u * 0.4), Y(rimY));
      ctx.closePath(); fill(sp.cap); ctx.fill();
      ctx.strokeStyle = INK; ctx.globalAlpha = 0.35; ctx.lineWidth = 0.0013 * SS; ctx.stroke(); ctx.globalAlpha = 1;
      ell(capCx, rimY - fh + 0.004, fw2 * 0.30, 0.016 * u, RED, 0.35); // funnel throat
      for (var rd = -2; rd <= 2; rd++) { // ridge lines under the flare
        seg(capCx + rd * 0.016 * u, rimY - fh * 0.25, capCx + rd * 0.030 * u, rimY - 0.004, 0.0016, INK, 0.28);
      }
    } else if (sp.kind === 'gills') {
      // shallow cap lifted so the blue gill fan shows beneath
      domePath(capCx, rimY - 0.028 * u, capW, capH);
      fill(sp.cap); ctx.fill();
      ctx.strokeStyle = INK; ctx.globalAlpha = 0.35; ctx.lineWidth = 0.0013 * SS; ctx.stroke(); ctx.globalAlpha = 1;
      for (var gf = -4; gf <= 4; gf++) { // gill fan
        seg(capCx, rimY - 0.026 * u, capCx + gf * capW * 0.105, rimY + 0.006, 0.0026, GILL, 0.95);
      }
      ell(capCx, rimY + 0.004, capW * 0.46, 0.007, GILL, 0.5);
    } else if (sp.kind === 'bell') {
      ctx.beginPath();
      ctx.moveTo(X(capCx - capW / 2), Y(rimY));
      ctx.bezierCurveTo(X(capCx - capW / 2), Y(rimY - capH * 0.7), X(capCx - capW * 0.18), Y(rimY - capH), X(capCx), Y(rimY - capH));
      ctx.bezierCurveTo(X(capCx + capW * 0.18), Y(rimY - capH), X(capCx + capW / 2), Y(rimY - capH * 0.7), X(capCx + capW / 2), Y(rimY));
      ctx.closePath(); fill(sp.cap); ctx.fill();
      ctx.strokeStyle = INK; ctx.globalAlpha = 0.35; ctx.lineWidth = 0.0013 * SS; ctx.stroke(); ctx.globalAlpha = 1;
      ell(capCx, rimY, capW * 0.5, 0.006, CREAM, 0.9);
    } else { // dome (agaric, giant, frill, bolete)
      domePath(capCx, rimY, capW, capH);
      fill(sp.cap); ctx.fill();
      ctx.strokeStyle = INK; ctx.globalAlpha = 0.35; ctx.lineWidth = 0.0013 * SS; ctx.stroke(); ctx.globalAlpha = 1;
      ell(capCx, rimY, capW * 0.48, 0.0075, CREAM, 0.85); // gill plate line
      if (sp.ring) { // agaric skirt ring hanging below the gill band
        ctx.beginPath();
        ctx.moveTo(X(capCx - sp.stemW * u * 0.66), Y(rimY + 0.004 * u));
        ctx.lineTo(X(capCx + sp.stemW * u * 0.66), Y(rimY + 0.004 * u));
        ctx.lineTo(X(capCx + sp.stemW * u * 0.42), Y(rimY + 0.048 * u));
        ctx.lineTo(X(capCx - sp.stemW * u * 0.42), Y(rimY + 0.048 * u));
        ctx.closePath(); fill(PAPER); ctx.fill();
        ctx.strokeStyle = INK; ctx.globalAlpha = 0.5; ctx.lineWidth = 0.0013 * SS; ctx.stroke(); ctx.globalAlpha = 1;
      }
      if (sp.pores) { // bolete pore surface: dotted band under the rim
        for (var pI = 0; pI < 11; pI++) {
          circ(capCx - capW * 0.4 + pI * capW * 0.08, rimY + 0.006 + (pI % 2) * 0.004, 0.0028, INK, 0.3);
        }
      }
    }
    // cap spots (agaric, bell)
    if (sp.spotPts.length) {
      sp.spotPts.forEach(function (pt) {
        var sx = capCx + pt.dx * capW * 0.5;
        var sy = rimY - capH * (0.25 + pt.dy * 0.62);
        ell(sx, sy, pt.s * u * 0.5, pt.s * u * 0.34, PAPER, 0.95);
      });
    }
    if (sp.moss) { // moss patches at the giant's base
      ell(cx - sp.stemW * u * 0.42, baseY - 0.004, 0.030, 0.011, MOSS, 0.9);
      ell(cx + sp.stemW * u * 0.40, baseY - 0.003, 0.024, 0.009, MOSS, 0.9);
      ell(cx + 0.012, baseY - 0.002, 0.016, 0.007, MOSS, 0.8);
    }
  }
  function drawCluster(cx, baseY, u, sp) {
    var parts = [
      { dx: -0.30, s: 0.62, cap: sp.cap }, { dx: 0.02, s: 0.85, cap: sp.cap2 }, { dx: 0.32, s: 0.55, cap: sp.cap }
    ];
    parts.forEach(function (pt) {
      var mini = { kind: 'dome', cap: pt.cap, capW: 0.62 * pt.s, capH: 0.30 * pt.s, stemH: 0.34 * pt.s, stemW: 0.15 * pt.s, spots: 0, ring: false, curve: 0 };
      var mx = cx + pt.dx * u;
      var st = stemPath(mx, baseY, u, mini);
      fill(CREAM); ctx.fill();
      ctx.strokeStyle = INK; ctx.globalAlpha = 0.35; ctx.lineWidth = 0.0012 * SS; ctx.stroke(); ctx.globalAlpha = 1;
      domePath(st.topX, st.topY, mini.capW * u, mini.capH * u);
      fill(pt.cap); ctx.fill();
      ctx.strokeStyle = INK; ctx.globalAlpha = 0.35; ctx.lineWidth = 0.0012 * SS; ctx.stroke(); ctx.globalAlpha = 1;
    });
  }
  function drawShelf(cx, baseY, u, sp) {
    // short stub trunk
    ctx.beginPath();
    ctx.moveTo(X(cx - 0.05 * u), Y(baseY)); ctx.lineTo(X(cx - 0.035 * u), Y(baseY - 0.30 * u));
    ctx.lineTo(X(cx + 0.035 * u), Y(baseY - 0.30 * u)); ctx.lineTo(X(cx + 0.05 * u), Y(baseY));
    ctx.closePath(); fill(CREAM); ctx.fill();
    ctx.strokeStyle = INK; ctx.globalAlpha = 0.35; ctx.lineWidth = 0.0013 * SS; ctx.stroke(); ctx.globalAlpha = 1;
    // three stacked bracket shelves, alternating reach
    var shelves = [
      { y: 0.16, w: 0.52, dir: -1 }, { y: 0.30, w: 0.62, dir: 1 }, { y: 0.44, w: 0.46, dir: -1 }
    ];
    shelves.forEach(function (sh) {
      var sy = baseY - sh.y * u, sw2 = sh.w * u;
      var x0 = sh.dir < 0 ? cx - sw2 : cx, x1 = sh.dir < 0 ? cx : cx + sw2;
      ctx.beginPath();
      ctx.moveTo(X(x0), Y(sy));
      ctx.bezierCurveTo(X(x0), Y(sy - 0.118 * u), X(x1), Y(sy - 0.118 * u), X(x1), Y(sy));
      ctx.closePath(); fill(sp.cap); ctx.fill();
      ctx.strokeStyle = INK; ctx.globalAlpha = 0.35; ctx.lineWidth = 0.0013 * SS; ctx.stroke(); ctx.globalAlpha = 1;
      ctx.beginPath(); // cream growth band on the shelf rim
      ctx.moveTo(X(x0 + sw2 * 0.08), Y(sy - 0.004));
      ctx.bezierCurveTo(X(x0 + sw2 * 0.1), Y(sy - 0.08 * u), X(x0 + sw2 * 0.9), Y(sy - 0.08 * u), X(x0 + sw2 * 0.92), Y(sy - 0.004));
      ctx.strokeStyle = CREAM; ctx.globalAlpha = 0.85; ctx.lineWidth = 0.0022 * SS; ctx.stroke(); ctx.globalAlpha = 1;
    });
  }

  // ---------- ink study drawing ----------
  function inkOutlinePath(kind, cx, baseY, u) {
    // returns nothing; draws the outline (double-stroked, sketch feel)
    var paths = [];
    if (kind === 'cone') {
      paths.push(function () {
        ctx.moveTo(X(cx - 0.075 * u), Y(baseY));
        ctx.lineTo(X(cx - 0.062 * u), Y(baseY - 0.30 * u));
        ctx.bezierCurveTo(X(cx - 0.30 * u), Y(baseY - 0.36 * u), X(cx - 0.20 * u), Y(baseY - 0.62 * u), X(cx), Y(baseY - 0.84 * u));
        ctx.bezierCurveTo(X(cx + 0.20 * u), Y(baseY - 0.62 * u), X(cx + 0.30 * u), Y(baseY - 0.36 * u), X(cx + 0.062 * u), Y(baseY - 0.30 * u));
        ctx.lineTo(X(cx + 0.075 * u), Y(baseY));
      });
    } else if (kind === 'puff') {
      paths.push(function () {
        ctx.arc(X(cx), Y(baseY - 0.33 * u), 0.315 * u * SS, 0, Math.PI * 2);
      });
      // spines: short radiating strokes (contour, always drawn)
      for (var sI = 0; sI < 30; sI++) {
        var a = (sI / 30) * Math.PI * 2 + 0.1;
        var r0 = 0.315 * u, r1 = 0.345 * u;
        seg(cx + Math.cos(a) * r0, baseY - 0.33 * u + Math.sin(a) * r0,
            cx + Math.cos(a) * r1, baseY - 0.33 * u + Math.sin(a) * r1, 0.0016, INK, 0.8);
      }
    } else { // veil
      paths.push(function () { // cap dome
        ctx.moveTo(X(cx - 0.36 * u), Y(baseY - 0.36 * u));
        ctx.bezierCurveTo(X(cx - 0.36 * u), Y(baseY - 0.66 * u), X(cx - 0.16 * u), Y(baseY - 0.70 * u), X(cx), Y(baseY - 0.70 * u));
        ctx.bezierCurveTo(X(cx + 0.16 * u), Y(baseY - 0.70 * u), X(cx + 0.36 * u), Y(baseY - 0.66 * u), X(cx + 0.36 * u), Y(baseY - 0.36 * u));
      });
      paths.push(function () { // stem + volva cup
        ctx.moveTo(X(cx - 0.075 * u), Y(baseY - 0.36 * u));
        ctx.lineTo(X(cx - 0.068 * u), Y(baseY - 0.07 * u));
        ctx.lineTo(X(cx - 0.125 * u), Y(baseY - 0.005 * u));
        ctx.lineTo(X(cx - 0.10 * u), Y(baseY + 0.035 * u));
        ctx.lineTo(X(cx + 0.10 * u), Y(baseY + 0.035 * u));
        ctx.lineTo(X(cx + 0.125 * u), Y(baseY - 0.005 * u));
        ctx.lineTo(X(cx + 0.068 * u), Y(baseY - 0.07 * u));
        ctx.lineTo(X(cx + 0.075 * u), Y(baseY - 0.36 * u));
      });
      // gill lines under the cap + ring skirt
      for (var gf = -4; gf <= 4; gf++) {
        seg(cx + gf * 0.036 * u, baseY - 0.355 * u, cx + gf * 0.040 * u, baseY - 0.315 * u, 0.0015, INK, 0.75);
      }
      seg(cx - 0.11 * u, baseY - 0.27 * u, cx + 0.11 * u, baseY - 0.27 * u, 0.002, INK, 0.8);
      seg(cx - 0.11 * u, baseY - 0.27 * u, cx - 0.085 * u, baseY - 0.225 * u, 0.0016, INK, 0.7);
      seg(cx + 0.11 * u, baseY - 0.27 * u, cx + 0.085 * u, baseY - 0.225 * u, 0.0016, INK, 0.7);
    }
    paths.forEach(function (p) {
      for (var pass = 0; pass < 2; pass++) {
        ctx.beginPath(); p();
        if (kind !== 'puff' && pass === 0) ctx.closePath();
        ctx.strokeStyle = INK; ctx.globalAlpha = pass === 0 ? 0.9 : 0.4;
        ctx.lineWidth = 0.0018 * SS; ctx.stroke(); ctx.globalAlpha = 1;
        if (pass === 0) { ctx.save(); ctx.translate(0.0016 * SS, 0.0012 * SS); }
        else ctx.restore();
      }
    });
  }
  function drawInkStudy(idx, cx, baseY, t) {
    var data = inkData[idx];
    var u = CELLH * (data.outline === 'cone' ? 0.86 : 1); // cone is the tallest study; scale it into its cell
    ell(cx, baseY + 0.006, 0.30 * u, 0.008, INK, 0.06);
    inkOutlinePath(data.outline, cx, baseY, u);
    var p = inkProgress(idx, t);
    var n = Math.floor(p * data.hatch.length);
    ctx.strokeStyle = INK; ctx.lineWidth = 0.0013 * SS; ctx.lineCap = 'round';
    for (var i = 0; i < n; i++) {
      var L = data.hatch[i];
      ctx.globalAlpha = 0.62;
      ctx.beginPath();
      ctx.moveTo(X(cx + L[0] * u), Y(baseY - L[1] * u));
      ctx.lineTo(X(cx + L[2] * u), Y(baseY - L[3] * u));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- main draw ----------
  function draw(t) {
    // pin canvas css size every frame (house rule)
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    // page ground (paper white; field pieces go full-bleed, this plate fills the stage)
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.beginPath(); ctx.rect(SX, SY, SS, SS); ctx.clip();
    ctx.fillStyle = PAPER; ctx.fillRect(SX, SY, SS, SS);

    for (var i = 0; i < NCELL; i++) {
      var gx = cellX(i), gy = cellY(i);
      // plate frame
      ctx.beginPath(); ctx.rect(X(gx), Y(gy), CELLW * SS, CELLH * SS);
      ctx.strokeStyle = INK; ctx.globalAlpha = (i % 4 === 3) ? 0.65 : 0.4;
      ctx.lineWidth = 0.0016 * SS; ctx.stroke(); ctx.globalAlpha = 1;
      var cx = gx + CELLW / 2;
      var isInk = (i % 4 === 3);
      var baseY = gy + CELLH * (isInk ? 0.76 : 0.84);
      if (isInk) drawInkStudy(i, cx, baseY, t);
      else drawColorMushroom(i, cx, baseY);
      // plate number, field-guide style
      ctx.globalAlpha = 0.78; ctx.fillStyle = INK;
      ctx.font = '700 ' + Math.round(0.016 * SS) + 'px Arial, sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText('FIG. ' + (i + 1), X(gx + 0.009), Y(gy + 0.007));
      ctx.globalAlpha = 1;
      if (isInk) { // pseudo-Latin label under the study
        ctx.globalAlpha = 0.88; ctx.fillStyle = INK;
        ctx.font = 'italic 400 ' + Math.round(0.019 * SS) + 'px Georgia, serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        ctx.fillText(species[i].label, X(cx), Y(gy + CELLH - 0.010));
        ctx.globalAlpha = 1;
      }
    }

    // spores (clipped per source cell), drifting up very slowly
    spores.forEach(function (s) {
      var gx = cellX(s.cell), gy = cellY(s.cell);
      var sp = species[s.cell];
      var capTopY = gy + CELLH * 0.84 - (sp.stemH + sp.capH) * CELLH;
      var prog = ((t / s.dur) + s.off) % 1;
      var sx = gx + CELLW / 2 + s.xo * CELLW + Math.sin(prog * 5 + s.off * 9) * s.drift;
      var sy = capTopY - prog * CELLH * 0.42;
      if (sy < gy + 0.006) return;
      ctx.save();
      ctx.beginPath(); ctx.rect(X(gx), Y(gy), CELLW * SS, CELLH * SS); ctx.clip();
      circ(sx, sy, s.r, GILL, Math.sin(prog * Math.PI) * 0.65);
      ctx.restore();
    });

    // footer band
    seg(MARGIN, GRIDBOT, 1 - MARGIN, GRIDBOT, 0.0018, INK, 0.55);
    ctx.globalAlpha = 0.85; ctx.fillStyle = INK;
    ctx.font = '600 ' + Math.round(0.021 * SS) + 'px Georgia, serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('LAS SETAS DEL BOSC', X(0.5), Y((GRIDBOT + 1) / 2 + 0.002));
    ctx.globalAlpha = 1;
    circ(0.5 - 0.155, (GRIDBOT + 1) / 2 + 0.002, 0.0035, INK, 0.6);
    circ(0.5 + 0.155, (GRIDBOT + 1) / 2 + 0.002, 0.0035, INK, 0.6);

    // grain over everything (precomputed specks, drawn directly)
    grain.forEach(function (s) {
      seg(s.x, s.y, s.x + Math.cos(s.a) * s.l / SS, s.y + Math.sin(s.a) * s.l / SS, 0.0011, INK, s.al);
    });
    ctx.restore();
  }

  // ---------- deterministic first frame + loop ----------
  var PHASE0 = 2.0; // constant loop phase for frame one: spores mid-drift, studies fully inked
  draw(PHASE0);
  var startStamp = null;
  function frame(now) {
    if (startStamp === null) startStamp = now;
    draw(PHASE0 + (now - startStamp) / 1000);
    window.requestAnimationFrame(frame);
  }
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
