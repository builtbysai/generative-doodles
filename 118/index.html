<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№118 · Shiftweave</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#111111; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(242,227,194,0.6); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to deepen the weave</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

// No.118 Shiftweave: horizontal bands in signal red, black and cream, each row
// shifted sideways by a sine plus noise offset array, so the straight bands
// bend into woven curves and chevrons. Rendered chunky: the frame is computed
// into an ImageData buffer in 4px cells, so the weave has visible pixels and
// no anti-aliased curves. Vertical drag changes the shift amplitude,
// horizontal drag shifts the phase; on release the amplitude eases home.
// Palette: #D9042B, #111111, #F2E3C2. Nothing else.
function abgr(r,g,b){ return (255<<24)|(b<<16)|(g<<8)|r; }
const COLS=[abgr(217,4,43), abgr(17,17,17), abgr(242,227,194)];
const SEQ=[0,0,0,1,2,2]; // rhythm: 3 red, 1 black, 2 cream
const bandJitter=[];
{ const rng=mulberry32(118118); for(let i=0;i<128;i++) bandJitter.push(Math.floor(rng()*2)); }
let img=null, buf32=null, imgW=0, imgH=0;
let dragging=false, dragX0=0, dragY0=0, amp0=0, phase0=0, ampOff=0, phaseOff=0, lastMs=null;

function noise1(u){ return Math.sin(u)*0.55+Math.sin(u*2.17+1.3)*0.30+Math.sin(u*4.71+4.1)*0.15; }

function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  let dt=0; if(lastMs!==null) dt=Math.min(0.05,(nowMs-lastMs)/1000); lastMs=nowMs;
  if(!dragging && ampOff!==0){ ampOff*=Math.pow(0.05,dt); if(Math.abs(ampOff)<0.05) ampOff=0; }
  const t=nowMs/1000;
  const DW=canvas.width, DH=canvas.height;
  if(!img||imgW!==DW||imgH!==DH){ img=ctx.createImageData(DW,DH); buf32=new Uint32Array(img.data.buffer); imgW=DW; imgH=DH; }
  const dprCss=DW/w;
  const block=Math.max(2,Math.round(4*dprCss));   // ~4 css px cells
  const bw=46*dprCss, bh=20*dprCss;               // segment width, band height (device px)
  const amp=(24+ampOff)*dprCss;
  const tt=t*0.55;
  const bcols=Math.ceil(DW/block), brows=Math.ceil(DH/block);
  for(let by=0;by<brows;by++){
    const yc=(by+0.5)*block;
    const shift=amp*(Math.sin(yc*0.011/DW*900+tt*0.7)*0.7+Math.sin(yc*0.023/DW*900-tt*0.45)*0.3)
              + amp*0.9*noise1(yc*0.006/DW*900+tt*0.22)
              + phaseOff*dprCss;
    const br=Math.floor(yc/bh);
    const base=(br+bandJitter[((br%128)+128)%128])%SEQ.length;
    const yTop=by*block, yBot=Math.min(DH,yTop+block);
    for(let bx=0;bx<bcols;bx++){
      const xc=(bx+0.5)*block;
      let seg=Math.floor((xc+shift)/bw); seg=((seg%2)+2)%2;
      const col=COLS[ SEQ[(base+seg*3)%SEQ.length] ];
      const xTop=bx*block, xBot=Math.min(DW,xTop+block);
      for(let y=yTop;y<yBot;y++){
        const rowOff=y*DW;
        for(let x=xTop;x<xBot;x++) buf32[rowOff+x]=col;
      }
    }
  }
  ctx.setTransform(1,0,0,1,0,0);
  ctx.putImageData(img,0,0);
  return {};
}
canvas.addEventListener('pointerdown',e=>{ dragging=true; dragX0=e.clientX; dragY0=e.clientY; amp0=ampOff; phase0=phaseOff; });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; ampOff=clamp(amp0+(e.clientY-dragY0)*0.22,-22,64); phaseOff=phase0+(e.clientX-dragX0)*0.6; });
function endP(){ dragging=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(2400);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
