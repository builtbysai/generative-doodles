<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Each Answer Becomes a Frequency</title>
<style>
html, body { margin: 0; padding: 0; background: #0A2A5E; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var BG = [10, 42, 94];
var CYAN = [90, 200, 245];
var ICE = [221, 244, 255];
var VIOLET = [74, 42, 158];
var FLASH = [255, 255, 255];
var PHASE = 15.0;
var BLOOM_EVERY = 3.0;
var ACTIVE_LIFE = 14.0;
var R_MAX_FRAC = 0.55;
var RESIDUE_TAU = 55.0;
var GRID_X = [0.14, 0.38, 0.62, 0.86];
var GRID_Y = [0.18, 0.50, 0.82];
var POS_ORDER = [0, 11, 5, 2, 9, 4, 10, 1, 7, 3, 8, 6];
var TAP_TABLE = [
  { lam1: 0.030, p1: 6,  lam2: 0.019, p2: 10, speed: 0.050 },
  { lam1: 0.042, p1: 8,  lam2: 0.026, p2: 12, speed: 0.062 },
  { lam1: 0.024, p1: 5,  lam2: 0.016, p2: 9,  speed: 0.044 },
  { lam1: 0.036, p1: 10, lam2: 0.021, p2: 14, speed: 0.056 },
  { lam1: 0.048, p1: 7,  lam2: 0.030, p2: 11, speed: 0.068 },
  { lam1: 0.027, p1: 9,  lam2: 0.017, p2: 13, speed: 0.047 },
  { lam1: 0.033, p1: 12, lam2: 0.020, p2: 8,  speed: 0.058 },
  { lam1: 0.045, p1: 6,  lam2: 0.028, p2: 15, speed: 0.065 }
];
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = PHASE, isPhone = false;
var taps = [];
var tapCount = 0;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
function minDim() { return Math.min(VW, VH); }
function mandalaParams(idx) {
  var r = mulberry32(1588000 + idx * 7919);
  var gi = POS_ORDER[idx % 12];
  var gx = GRID_X[gi % 4], gy = GRID_Y[Math.floor(gi / 4)];
  var jx = (r() - 0.5) * 0.06, jy = (r() - 0.5) * 0.06;
  var lam1 = 0.024 + r() * 0.022;
  var p1 = 6 + Math.floor(r() * 7);
  var lam2 = lam1 * (0.55 + r() * 0.30);
  var p2 = p1 + 3 + Math.floor(r() * 6);
  return {
    fx: gx + jx, fy: gy + jy,
    lam1: lam1, p1: p1, lam2: lam2, p2: p2,
    speed: 0.042 + r() * 0.024,
    violetEvery: 4 + Math.floor(r() * 3)
  };
}
function tapParams(n) { return TAP_TABLE[n % TAP_TABLE.length]; }
function ringRadii(age, speedFrac, lamFrac, md) {
  var out = [];
  var reach = age * speedFrac * md;
  var maxR = R_MAX_FRAC * md;
  var mMax = Math.min(14, Math.floor(reach / (lamFrac * md)));
  for (var m = 0; m <= mMax; m++) {
    var r = reach - m * lamFrac * md;
    if (r > 2 && r < maxR) out.push({ m: m, r: r });
  }
  return out;
}
function activeRingRecords(mand, birth, t) {
  var age = t - birth;
  var recs = [];
  if (age <= 0 || age >= ACTIVE_LIFE) return recs;
  var md = minDim();
  var cx = mand.fx * VW, cy = mand.fy * VH;
  var fade = age < 10 ? 1 : Math.max(0, 1 - (age - 10) / 4);
  var env = Math.exp(-age / 28) * fade;
  var comps = [
    { lam: mand.lam1, petals: mand.p1, base: 0.60 },
    { lam: mand.lam2, petals: mand.p2, base: 0.45 }
  ];
  for (var c = 0; c < 2; c++) {
    var comp = comps[c];
    var rings = ringRadii(age, mand.speed, comp.lam, md);
    for (var i = 0; i < rings.length; i++) {
      var ring = rings[i];
      var depth = 1 - ring.r / (R_MAX_FRAC * md);
      var a = comp.base * Math.pow(depth, 0.7) * env;
      if (a < 0.02) continue;
      var col = CYAN;
      if (ring.m % mand.violetEvery === mand.violetEvery - 1) col = VIOLET;
      else if (ring.m % 2 === 1) col = ICE;
      recs.push({
        x: cx, y: cy, r: ring.r, alpha: a, color: col,
        petals: comp.petals, phase: t * 0.2 + ring.m * 0.35,
        width: (col === VIOLET ? 2.4 : 1.7)
      });
    }
  }
  return recs;
}
function residueRecords(mand, birth, t) {
  var age = t - birth;
  var recs = [];
  if (age <= 0) return recs;
  var md = minDim();
  var cx = mand.fx * VW, cy = mand.fy * VH;
  for (var j = 0; j < 5; j++) {
    var depAge = 1.5 + j * 2.2;
    if (age <= depAge) continue;
    var a = 0.11 * Math.exp(-(age - depAge) / RESIDUE_TAU);
    if (a < 0.008) continue;
    var col = (j === 3) ? VIOLET : (j % 2 === 0 ? CYAN : ICE);
    recs.push({
      x: cx, y: cy, r: md * (0.055 + j * 0.042), alpha: a, color: col,
      petals: mand.p1, phase: j * 0.7, width: 1.4
    });
  }
  return recs;
}
function drawRing(rec) {
  var md = minDim();
  var lw = rec.width * (isPhone ? 1.3 : 1.0) * (md / 900 + 0.4);
  var seg = 84;
  var mod = 0.07;
  ctx.strokeStyle = rgba(rec.color, rec.alpha);
  ctx.lineWidth = lw;
  ctx.beginPath();
  for (var s = 0; s <= seg; s++) {
    var th = (s / seg) * TAU;
    var rr = rec.r * (1 + mod * Math.cos(rec.petals * th + rec.phase));
    var px = rec.x + rr * Math.cos(th), py = rec.y + rr * Math.sin(th);
    if (s === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.stroke();
}
function collectFlashes(mands, t) {
  var flashes = [];
  var md = minDim();
  for (var a = 0; a < mands.length; a++) {
    for (var b = a + 1; b < mands.length; b++) {
      var A = mands[a], B = mands[b];
      var ageA = t - A.birth, ageB = t - B.birth;
      if (ageA <= 0 || ageA >= ACTIVE_LIFE || ageB <= 0 || ageB >= ACTIVE_LIFE) continue;
      var ax = A.p.fx * VW, ay = A.p.fy * VH;
      var bx = B.p.fx * VW, by = B.p.fy * VH;
      var d = Math.hypot(bx - ax, by - ay);
      if (d < 4 || d > R_MAX_FRAC * md * 2) continue;
      var ringsA = ringRadii(ageA, A.p.speed, A.p.lam1, md);
      var ringsB = ringRadii(ageB, B.p.speed, B.p.lam1, md);
      var best = 0, bestPt = null;
      for (var i = 0; i < ringsA.length; i++) {
        for (var j = 0; j < ringsB.length; j++) {
          var gap = Math.abs(ringsA[i].r + ringsB[j].r - d);
          if (gap < 10) {
            var s = 1 - gap / 10;
            if (s > best) {
              best = s;
              var f = ringsA[i].r / d;
              bestPt = { x: ax + (bx - ax) * f, y: ay + (by - ay) * f };
            }
          }
        }
      }
      if (best > 0.25 && bestPt) flashes.push({ x: bestPt.x, y: bestPt.y, strength: best });
    }
  }
  flashes.sort(function (u, v) { return v.strength - u.strength; });
  return flashes.slice(0, 6);
}
function drawFlash(f) {
  var md = minDim();
  var s = f.strength;
  var lw = 2.0 * (md / 900 + 0.4);
  var radii = [6, 14, 24];
  for (var i = 0; i < radii.length; i++) {
    ctx.strokeStyle = rgba(FLASH, (s * 0.85 * (1 - i * 0.25)).toFixed(4) * 1);
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.arc(f.x, f.y, radii[i] * (0.6 + 0.8 * s) * (md / 900 + 0.4), 0, TAU);
    ctx.stroke();
  }
  ctx.fillStyle = rgba(FLASH, (s * 0.9).toFixed(4) * 1);
  ctx.beginPath();
  ctx.arc(f.x, f.y, 3 * (md / 900 + 0.4), 0, TAU);
  ctx.fill();
}
function draw(t) {
  lastT = t;
  size();
  ctx.fillStyle = 'rgb(' + BG[0] + ',' + BG[1] + ',' + BG[2] + ')';
  ctx.fillRect(0, 0, VW, VH);
  var mands = [];
  var kMin = Math.max(0, Math.floor((t - 120) / BLOOM_EVERY));
  var kMax = Math.floor(t / BLOOM_EVERY);
  for (var k = kMin; k <= kMax; k++) {
    mands.push({ p: mandalaParams(k), birth: k * BLOOM_EVERY });
  }
  for (var ti = 0; ti < taps.length; ti++) {
    mands.push({ p: taps[ti].p, birth: taps[ti].birth });
  }
  var residue = [];
  var active = [];
  for (var mi = 0; mi < mands.length; mi++) {
    var rr = residueRecords(mands[mi].p, mands[mi].birth, t);
    for (var q = 0; q < rr.length; q++) residue.push(rr[q]);
    var ar = activeRingRecords(mands[mi].p, mands[mi].birth, t);
    for (var q2 = 0; q2 < ar.length; q2++) active.push(ar[q2]);
  }
  for (var ri = 0; ri < residue.length; ri++) drawRing(residue[ri]);
  for (var ai = 0; ai < active.length; ai++) drawRing(active[ai]);
  var flashes = collectFlashes(mands, t);
  for (var fi = 0; fi < flashes.length; fi++) drawFlash(flashes[fi]);
}
function onTap(e) {
  var p = tapParams(tapCount);
  var fx = e.clientX / VW, fy = e.clientY / VH;
  taps.push({ p: { fx: fx, fy: fy, lam1: p.lam1, p1: p.p1, lam2: p.lam2, p2: p.p2, speed: p.speed, violetEvery: 5 }, birth: lastT });
  if (taps.length > 24) taps.shift();
  tapCount++;
}
canvas.addEventListener('pointerdown', onTap);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(PHASE);
var startT = null;
function loop(ts) {
  if (startT === null) startT = ts;
  var t = PHASE + (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
