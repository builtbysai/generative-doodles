<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.411 Tuesday Funtivity</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FF4FA3; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.411 Tuesday Funtivity (yeti-iglesias, EXPANSION #44).
// After Yeti Iglesias's cat-series mechanism (Tuesday
// Funtivity / Collecting leaves): one orange striped cat
// with huge sparkle-eyes, wearing a green scarf with an
// orange-dot pattern, sitting inside a brown leaf-bag
// with a gold diamond lattice; autumn leaves falling
// around; a big orange pumpkin beside the bag; hot pink
// ground; starbursts and dots scattered in the sky. Her
// hand-lettered "Yeti" signature sits bottom right as
// stroke paths, the designed-text exception for this
// set; no font text anywhere.
// Calm state is a 24s seamless loop, all of it pure
// functions of the loop clock: 26 leaves fall a whole
// number of field heights per loop with sway and tumble
// on periods that divide 24; the cat blinks at two FIXED
// slots inside the loop (dip centres at 7.0s and 17.0s,
// eye height scale to 0.1 across a 0.25s window); the
// scarf's free end sways on an 8s cycle (3 whole cycles
// per loop); the tail sways on a 12s cycle; the sky
// sparkles twinkle on periods that divide 24.
// DRAG anywhere is a gust (Hans's RETHINK rule: drag
// where the piece is a system to disturb): leaves take
// an impulse along the drag vector with distance
// falloff from the pointer, the tail puffs on a
// thickness spring, the sparkles swirl around the
// composition centre. Gust state lives in offsets that
// ride on top of the loop functions and are pulled by
// damped springs; when an offset and its velocity fall
// below a snap threshold they are set to EXACTLY zero,
// so on release everything settles back to the calm
// 24s loop exactly, bit for bit. A tap alone does
// nothing. Never click-to-reload.
// Grain is fixed dot DATA: exactly 600 speckle dots at
// 0.08 alpha, 300 baked inside the bag's front panel
// and 300 inside the pumpkin, from a fixed seed. Flat
// colour only, one canvas, no offscreen canvas, no
// gradients, no shadowBlur. Frame one is drawn at the
// constant phase T = 9.0s (leaves mid-fall, cat
// composed, eyes open between the blink slots); the
// clock is anchored there and advances in fixed 1/60
// ticks, never from a wall clock.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Hot pink ground; cat orange with dark stripes; scarf
// green with orange dots; bag brown with gold lattice;
// pumpkin orange with darker ribs; leaves in the two
// observed autumn tones; sparkles cream. Nothing else.
var PINK = '#FF4FA3';
var CAT = '#F26A1B', STRIPE = '#B8430F';
var GREEN = '#2E7D4F', DOTOR = '#F5A623';
var BROWN = '#7A3B14', GOLD = '#F5C13B';
var PUMPK = '#FF7B1C', RIB = '#D95F0E';
var LEAF1 = '#E08A2E', LEAF2 = '#6BAE6B';
var CREAM = '#FFF6E8';

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 24;
if (LOOP !== 24) throw new Error('Tuesday Funtivity loop must be 24s');
var TICK = 1 / 60;

// ---- fixed-seed data -----------------------------------
// Fixed-seed LCG, the house pattern: every table below
// is baked from this at load and never changes between
// frames or renders. No Math.random anywhere.
function makeRng(seedStart) {
  var s = seedStart;
  return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}

// Falling leaves: exactly 26 asserted. Each leaf falls
// k whole field spans per loop (span 1040 = design
// height plus margins), sways and tumbles on periods
// that divide 24, so the calm loop is seamless. ox/oy
// and their velocities are the gust offsets, zero in
// the calm state.
var rngLeaf = makeRng(41101);
var LEAVES = [];
var SWAYPERS = [6, 8, 12, 24];
for (var li = 0; li < 26; li++) {
  LEAVES.push({
    x: 40 + rngLeaf() * 1200,
    y0: rngLeaf() * 1040,
    k: li % 3 === 0 ? 2 : 1,
    swayAmp: 14 + rngLeaf() * 16,
    swayPer: SWAYPERS[li % 4],
    swayPh: rngLeaf() * Math.PI * 2,
    rotBase: rngLeaf() * Math.PI * 2,
    rotPer: li % 2 === 0 ? 12 : 8,
    rotPh: rngLeaf() * Math.PI * 2,
    size: 13 + rngLeaf() * 11,
    green: li % 3 === 2,
    front: li % 5 === 4,
    ox: 0, oy: 0, ovx: 0, ovy: 0
  });
}
if (LEAVES.length !== 26) throw new Error('leaves must be exactly 26');

// Sky sparkles: exactly 22 four-point starbursts,
// twinkling on periods that divide 24. During a gust
// they rotate around the composition centre by the
// swirl offset.
var rngSpark = makeRng(41102);
var SPARKS = [];
var TWPER = [3, 4, 6, 8];
for (var si = 0; si < 22; si++) {
  SPARKS.push({
    x: 30 + rngSpark() * 1220,
    y: 26 + rngSpark() * 520,
    r: 6 + rngSpark() * 9,
    per: TWPER[si % 4],
    ph: rngSpark() * Math.PI * 2,
    rot: rngSpark() * 0.6 - 0.3
  });
}
if (SPARKS.length !== 22) throw new Error('sparkles must be exactly 22');

// Small static cream dots scattered in the sky.
var rngDot = makeRng(41103);
var DOTS = [];
for (var di = 0; di < 40; di++) {
  DOTS.push({ x: rngDot() * DW, y: rngDot() * 620, r: 2 + rngDot() * 1.6 });
}
if (DOTS.length !== 40) throw new Error('sky dots must be exactly 40');

// Grain: exactly 600 speckle dots at 0.08 alpha, 300
// inside the bag front panel, 300 inside the pumpkin,
// baked by rejection sampling with a fixed seed.
function inPoly(px, py, pts) {
  var inside = false;
  for (var a = 0, b = pts.length - 1; a < pts.length; b = a++) {
    var xa = pts[a][0], ya = pts[a][1], xb = pts[b][0], yb = pts[b][1];
    if ((ya > py) !== (yb > py) && px < (xb - xa) * (py - ya) / (yb - ya) + xa) inside = !inside;
  }
  return inside;
}
var BAGPOLY = [[378, 556], [822, 556], [848, 692], [842, 810], [800, 830], [400, 830], [358, 810], [352, 692]];
var rngGrain = makeRng(41104);
var GRAINBAG = [];
while (GRAINBAG.length < 300) {
  var gx = 345 + rngGrain() * 510, gy = 548 + rngGrain() * 290;
  if (inPoly(gx, gy, BAGPOLY)) GRAINBAG.push({ x: gx, y: gy, r: 1 + rngGrain() * 1.8 });
}
var GRAINPUM = [];
while (GRAINPUM.length < 300) {
  var px = 885 + (rngGrain() * 2 - 1) * 152, py = 690 + (rngGrain() * 2 - 1) * 132;
  var ex = (px - 885) / 155, ey = (py - 690) / 135;
  if (ex * ex + ey * ey < 0.97) GRAINPUM.push({ x: px, y: py, r: 1 + rngGrain() * 1.8 });
}
if (GRAINBAG.length + GRAINPUM.length !== 600) throw new Error('grain must be exactly 600');

// ---- small drawing helpers (local design coords) -------
function ell(x, y, rx, ry, rot, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  ctx.fill();
}
function ellA(x, y, rx, ry, rot, color, alpha) {
  ctx.globalAlpha = alpha;
  ell(x, y, rx, ry, rot, color);
  ctx.globalAlpha = 1;
}
function seg(x1, y1, x2, y2, w, color) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function segA(x1, y1, x2, y2, w, color, alpha) {
  ctx.globalAlpha = alpha;
  seg(x1, y1, x2, y2, w, color);
  ctx.globalAlpha = 1;
}
function poly(color, pts) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  ctx.fill();
}
function sparkPath(cx, cy, r, rot) {
  // 4-point starburst: long points, tight waist.
  ctx.beginPath();
  for (var i = 0; i < 8; i++) {
    var rr = i % 2 === 0 ? r : r * 0.22;
    var a = rot + i * Math.PI / 4 - Math.PI / 2;
    var X = cx + Math.cos(a) * rr, Y = cy + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  }
  ctx.closePath();
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

// ---- leaf recipe ---------------------------------------
// A pointed oval leaf with a centre vein, centred on
// 0,0, pointing up, drawn at unit size and scaled.
function drawLeaf(leaf, x, y, rot) {
  var s = leaf.size;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = leaf.green ? LEAF2 : LEAF1;
  ctx.beginPath();
  ctx.moveTo(0, -s);
  ctx.quadraticCurveTo(s * 0.78, -s * 0.15, 0, s);
  ctx.quadraticCurveTo(-s * 0.78, -s * 0.15, 0, -s);
  ctx.closePath();
  ctx.fill();
  seg(0, -s * 0.68, 0, s * 0.68, 2, leaf.green ? GREEN : STRIPE);
  ctx.restore();
}
function leafBase(leaf, lt) {
  var bx = leaf.x + Math.sin(Math.PI * 2 * lt / leaf.swayPer + leaf.swayPh) * leaf.swayAmp;
  var by = -70 + ((leaf.y0 + lt / LOOP * leaf.k * 1040) % 1040);
  var rot = leaf.rotBase + Math.sin(Math.PI * 2 * lt / leaf.rotPer + leaf.rotPh) * 0.45;
  return { x: bx + leaf.ox, y: by + leaf.oy, rot: rot };
}

// ---- blink ---------------------------------------------
// Two FIXED slots in the 24s loop: dips centred at 7.0s
// and 17.0s (the prompt's 6-9s cadence resolved to
// fixed slots). Eye height scale reaches 0.1 at the
// centre of each 0.25s window and is 1 outside.
function blinkScale(lt) {
  var centres = [7.0, 17.0];
  for (var i = 0; i < centres.length; i++) {
    var d = Math.abs(lt - centres[i]);
    if (d < 0.125) {
      var u = d / 0.125;
      return 0.1 + 0.9 * u * u;
    }
  }
  return 1;
}

// ---- gust state ----------------------------------------
// Offsets ride on top of the calm loop and spring back
// to exactly zero. puff is the tail thickness offset,
// swirl the sparkle rotation offset (radians).
var puff = 0, puffV = 0;
var swirl = 0, swirlV = 0;
function springToZero(v, vel, k, c, snapV, snapVel) {
  vel += (-v * k - vel * c) * TICK;
  v += vel * TICK;
  if (Math.abs(v) < snapV && Math.abs(vel) < snapVel) { v = 0; vel = 0; }
  return [v, vel];
}
function step() {
  for (var i = 0; i < LEAVES.length; i++) {
    var L = LEAVES[i], r;
    r = springToZero(L.ox, L.ovx, 30, 6.5, 0.05, 0.6); L.ox = r[0]; L.ovx = r[1];
    r = springToZero(L.oy, L.ovy, 30, 6.5, 0.05, 0.6); L.oy = r[0]; L.ovy = r[1];
  }
  var rp = springToZero(puff, puffV, 70, 10, 0.001, 0.01); puff = rp[0]; puffV = rp[1];
  var rs = springToZero(swirl, swirlV, 24, 6, 0.0004, 0.004); swirl = rs[0]; swirlV = rs[1];
}

// ---- the signature: "Yeti" in hand-lettered strokes -----
// Stroke paths only, never font text (the set's
// designed-text exception, the No.302/401 precedent).
var SIG = [
  [[0, 0], [12, 14], [24, 0]], [[12, 14], [12, 34]],
  [[33, 17], [45, 17]],
  [[45, 17], [44, 11], [40, 7], [35, 8], [32, 13], [32, 21], [35, 26], [41, 27], [46, 23]],
  [[57, 2], [57, 26], [61, 29], [65, 26]], [[50, 12], [64, 12]],
  [[77, 12], [77, 28]],
  [[2, 40], [40, 43], [80, 41], [118, 38]]
];
function drawSignature() {
  ctx.save();
  ctx.translate(1124, 836);
  ctx.strokeStyle = BROWN;
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (var i = 0; i < SIG.length; i++) {
    var line = SIG[i];
    ctx.beginPath();
    ctx.moveTo(line[0][0], line[0][1]);
    for (var j = 1; j < line.length; j++) ctx.lineTo(line[j][0], line[j][1]);
    ctx.stroke();
  }
  ell(77, 4, 2.1, 2.1, 0, BROWN); // the i dot
  ctx.restore();
}

// ---- the scene ------------------------------------------
function drawScene(lt) {
  // Page ground: hot pink, everywhere.
  ctx.fillStyle = PINK;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);

  // Static cream dots in the sky.
  for (var di2 = 0; di2 < DOTS.length; di2++) {
    var d0 = DOTS[di2];
    ellA(d0.x, d0.y, d0.r, d0.r, 0, CREAM, 0.5);
  }

  // Sparkles, swirling around the composition centre
  // while a gust lasts, twinkling on whole cycles.
  ctx.save();
  ctx.translate(640, 400);
  ctx.rotate(swirl);
  ctx.translate(-640, -400);
  for (var si2 = 0; si2 < SPARKS.length; si2++) {
    var sp = SPARKS[si2];
    var tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(Math.PI * 2 * lt / sp.per + sp.ph));
    ctx.globalAlpha = tw;
    sparkPath(sp.x, sp.y, sp.r, sp.rot);
    ctx.fillStyle = CREAM;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // Back leaves (behind the subjects).
  for (var bi = 0; bi < LEAVES.length; bi++) {
    if (LEAVES[bi].front) continue;
    var bp = leafBase(LEAVES[bi], lt);
    drawLeaf(LEAVES[bi], bp.x, bp.y, bp.rot);
  }

  // The tail, out of the bag's left side: segmented
  // circles along a quadratic curve, striped, its
  // thickness scaled by the gust puff spring, swaying
  // gently on a 12s cycle.
  var puffScale = 1 + clamp(puff, -0.3, 1.2);
  var tipSway = Math.sin(Math.PI * 2 * lt / 12) * 9;
  var tailPts = [];
  for (var ti = 0; ti <= 8; ti++) {
    var tt = ti / 8;
    var qx = (1 - tt) * (1 - tt) * 398 + 2 * (1 - tt) * tt * 296 + tt * tt * (282 + tipSway * tt);
    var qy = (1 - tt) * (1 - tt) * 646 + 2 * (1 - tt) * tt * 668 + tt * tt * 548;
    tailPts.push([qx, qy]);
  }
  for (var tj = 8; tj >= 0; tj--) {
    var tr = (26 - tj * 1.6) * puffScale;
    ell(tailPts[tj][0], tailPts[tj][1], tr, tr * 0.92, 0, tj % 3 === 2 ? STRIPE : CAT);
  }

  // Bag back silhouette, its mouth dipping in the
  // middle behind the cat.
  ctx.fillStyle = BROWN;
  ctx.beginPath();
  ctx.moveTo(370, 566);
  ctx.quadraticCurveTo(600, 478, 830, 566);
  ctx.lineTo(850, 692);
  ctx.quadraticCurveTo(856, 762, 846, 812);
  ctx.quadraticCurveTo(840, 832, 798, 832);
  ctx.lineTo(402, 832);
  ctx.quadraticCurveTo(360, 832, 354, 812);
  ctx.quadraticCurveTo(344, 762, 350, 692);
  ctx.closePath();
  ctx.fill();

  // Cat body: an ellipse mostly hidden by the bag front.
  ell(600, 548, 118, 106, 0, CAT);
  // Body side stripes, peeking above the bag front.
  segA(498, 512, 528, 524, 7, STRIPE, 0.85);
  segA(702, 512, 672, 524, 7, STRIPE, 0.85);

  // Scarf neck band, drawn before the head so the chin
  // tucks over it: a thick green arc with orange dots.
  ctx.strokeStyle = GREEN;
  ctx.lineWidth = 36;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(510, 462);
  ctx.quadraticCurveTo(600, 516, 690, 462);
  ctx.stroke();
  var bandDots = [[532, 478], [566, 490], [600, 494], [634, 490], [668, 478]];
  for (var bd2 = 0; bd2 < bandDots.length; bd2++) ell(bandDots[bd2][0], bandDots[bd2][1], 5, 5, 0, DOTOR);

  // Head: big circle with two triangle ears.
  poly(CAT, [522, 332, 502, 232, 588, 292]);
  poly(CAT, [678, 332, 698, 232, 612, 292]);
  poly(STRIPE, [526, 316, 516, 256, 566, 294]);
  poly(STRIPE, [674, 316, 684, 256, 634, 294]);
  ell(600, 396, 102, 102, 0, CAT);
  // Forehead and cheek stripes.
  seg(576, 302, 572, 336, 7, STRIPE);
  seg(600, 296, 600, 330, 7, STRIPE);
  seg(624, 302, 628, 336, 7, STRIPE);
  seg(508, 414, 534, 422, 6, STRIPE);
  seg(510, 444, 536, 446, 6, STRIPE);
  seg(692, 414, 666, 422, 6, STRIPE);
  seg(690, 444, 664, 446, 6, STRIPE);
  // Huge sparkle-eyes: dark circles, each holding a
  // cream 4-point sparkle highlight and a tiny cream
  // dot; the blink dips their height scale.
  var bs = blinkScale(lt);
  var eyeXY = [[558, 400], [642, 400]];
  for (var ei = 0; ei < 2; ei++) {
    ctx.save();
    ctx.translate(eyeXY[ei][0], eyeXY[ei][1]);
    ctx.scale(1, bs);
    ell(0, 0, 27, 27, 0, STRIPE);
    sparkPath(8, -8, 13, 0);
    ctx.fillStyle = CREAM;
    ctx.fill();
    ell(-9, 10, 3.6, 3.6, 0, CREAM);
    ctx.restore();
  }
  // Nose, mouth, whiskers.
  ell(600, 446, 11, 8, 0, STRIPE);
  ctx.strokeStyle = STRIPE;
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(589, 454, 10, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(611, 454, 10, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  segA(520, 436, 452, 428, 3, STRIPE, 0.55);
  segA(520, 452, 454, 454, 3, STRIPE, 0.55);
  segA(680, 436, 748, 428, 3, STRIPE, 0.55);
  segA(680, 452, 746, 454, 3, STRIPE, 0.55);

  // Bag front panel with the gold diamond lattice
  // clipped inside it, then its grain dots.
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(372, 556);
  ctx.quadraticCurveTo(600, 606, 828, 556);
  ctx.lineTo(848, 692);
  ctx.quadraticCurveTo(854, 762, 844, 810);
  ctx.quadraticCurveTo(838, 830, 798, 830);
  ctx.lineTo(402, 830);
  ctx.quadraticCurveTo(362, 830, 356, 810);
  ctx.quadraticCurveTo(346, 762, 352, 692);
  ctx.closePath();
  ctx.fillStyle = BROWN;
  ctx.fill();
  ctx.clip();
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 5;
  for (var lx = -560; lx <= 1240; lx += 46) {
    ctx.beginPath(); ctx.moveTo(600 + lx, 520); ctx.lineTo(600 + lx + 330, 850); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(600 + lx, 520); ctx.lineTo(600 + lx - 330, 850); ctx.stroke();
  }
  ctx.restore();
  // Gold stitch line along the panel's top edge.
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(372, 556);
  ctx.quadraticCurveTo(600, 606, 828, 556);
  ctx.stroke();
  for (var gb = 0; gb < GRAINBAG.length; gb++) {
    var gd1 = GRAINBAG[gb];
    ellA(gd1.x, gd1.y, gd1.r, gd1.r, 0, GOLD, 0.08);
  }

  // The pumpkin, front-right, overlapping the bag:
  // orange ellipse, darker rib ellipses clipped
  // inside, a brown stem, then its grain dots.
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(885, 690, 155, 135, 0, 0, Math.PI * 2);
  ctx.fillStyle = PUMPK;
  ctx.fill();
  ctx.clip();
  ctx.strokeStyle = RIB;
  ctx.lineWidth = 5;
  var ribRx = [42, 86, 124];
  for (var ri = 0; ri < ribRx.length; ri++) {
    ctx.beginPath();
    ctx.ellipse(885, 690, ribRx[ri], 133, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = RIB;
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.ellipse(885, 690, 155, 135, 0, 0, Math.PI * 2);
  ctx.stroke();
  poly(BROWN, [868, 560, 902, 560, 896, 522, 876, 518]);
  for (var gp = 0; gp < GRAINPUM.length; gp++) {
    var gd2 = GRAINPUM[gp];
    ellA(gd2.x, gd2.y, gd2.r, gd2.r, 0, BROWN, 0.08);
  }

  // Front paws draped over the bag's rim.
  ell(508, 578, 32, 17, -0.15, CAT);
  ell(742, 586, 32, 17, 0.25, CAT);
  seg(498, 566, 496, 584, 3.5, STRIPE);
  seg(514, 564, 514, 584, 3.5, STRIPE);
  seg(732, 572, 730, 592, 3.5, STRIPE);
  seg(748, 570, 748, 592, 3.5, STRIPE);

  // Scarf knot and free end, draping over the bag
  // front, swaying on an 8s cycle (whole cycles only).
  var sway = Math.sin(Math.PI * 2 * lt / 8) * 0.07;
  ell(690, 494, 18, 18, 0, GREEN);
  ctx.save();
  ctx.translate(688, 500);
  ctx.rotate(sway);
  ctx.fillStyle = GREEN;
  ctx.beginPath();
  ctx.moveTo(-24, 0);
  ctx.lineTo(24, 0);
  ctx.lineTo(20, 148);
  ctx.quadraticCurveTo(0, 158, -20, 148);
  ctx.closePath();
  ctx.fill();
  ell(-8, 34, 5, 5, 0, DOTOR);
  ell(9, 66, 5, 5, 0, DOTOR);
  ell(-8, 98, 5, 5, 0, DOTOR);
  ell(8, 128, 5, 5, 0, DOTOR);
  seg(-14, 148, -14, 162, 3.5, GREEN);
  seg(0, 150, 0, 165, 3.5, GREEN);
  seg(14, 148, 14, 162, 3.5, GREEN);
  ctx.restore();

  // Front leaves (in front of the subjects).
  for (var fi = 0; fi < LEAVES.length; fi++) {
    if (!LEAVES[fi].front) continue;
    var fp = leafBase(LEAVES[fi], lt);
    drawLeaf(LEAVES[fi], fp.x, fp.y, fp.rot);
  }

  drawSignature();
}

function draw() { drawScene(T % LOOP); }

// ---- piece state ----------------------------------------
// Constant first-frame phase: T = 9.0s into the 24s
// loop (leaves mid-fall, cat composed, eyes open
// between the blink slots at 7.0s and 17.0s).
var T = 9.0;
var lastNow = -1, acc = 0;

// Optional QA probe hooks via the query string the
// house renderer passes as ?seed=... : gust sets a
// developed gust state directly (leaf offsets, tail
// puff, sparkle swirl), blink parks the clock at the
// 7.0s blink centre. Deterministic; default play is
// unaffected.
var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
if (/blink/.test(qs)) T = 7.0;
if (/gust/.test(qs)) {
  for (var qi = 0; qi < LEAVES.length; qi++) {
    var qL = LEAVES[qi];
    var qb = leafBase(qL, T);
    var qd = Math.sqrt((qb.x - 640) * (qb.x - 640) + (qb.y - 300) * (qb.y - 300));
    var qf = clamp(1 - qd / 560, 0, 1);
    qL.ox = 150 * (0.2 + 0.8 * qf * qf);
    qL.oy = -70 * (0.2 + 0.8 * qf * qf);
  }
  puff = 0.55;
  swirl = 0.12;
}

// ---- pointer: drag is a gust -----------------------------
// A drag's per-event delta, converted to design space,
// pushes every leaf along the drag vector with
// distance falloff from the pointer, puffs the tail
// and swirls the sparkles. Release stops the input;
// the springs in step() settle every offset back to
// exactly zero. A tap alone does nothing. The piece
// never reloads.
var downX = -1, downY = -1, lastPX = -1, lastPY = -1, dragging = false;
function toDesign(e) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cxp = (e.clientX !== undefined ? e.clientX : 0) - r.left;
  var cyp = (e.clientY !== undefined ? e.clientY : 0) - r.top;
  return { x: (cxp - OX) / S, y: (cyp - OY) / S };
}
function applyGust(dvx, dvy, atX, atY) {
  var sp = Math.sqrt(dvx * dvx + dvy * dvy);
  for (var i = 0; i < LEAVES.length; i++) {
    var L = LEAVES[i];
    var b = leafBase(L, T % LOOP);
    var dd = Math.sqrt((b.x - atX) * (b.x - atX) + (b.y - atY) * (b.y - atY));
    var prox = clamp(1 - dd / 560, 0, 1);
    var f = 0.2 + 0.8 * prox * prox;
    L.ovx += dvx * 1.4 * f;
    L.ovy += dvy * 1.4 * f;
    var lv = Math.sqrt(L.ovx * L.ovx + L.ovy * L.ovy);
    if (lv > 900) { L.ovx = L.ovx / lv * 900; L.ovy = L.ovy / lv * 900; }
  }
  puffV += sp * 0.0012;
  swirlV += dvx * 0.00006;
}
canvas.addEventListener('pointerdown', function (e) {
  var p = toDesign(e);
  downX = p.x; downY = p.y; lastPX = p.x; lastPY = p.y; dragging = false;
});
canvas.addEventListener('pointermove', function (e) {
  if (downX < 0) return;
  var p = toDesign(e);
  var dx0 = p.x - downX, dy0 = p.y - downY;
  if (Math.sqrt(dx0 * dx0 + dy0 * dy0) > 6) dragging = true;
  if (dragging) {
    var dvx = p.x - lastPX, dvy = p.y - lastPY;
    var dl = Math.sqrt(dvx * dvx + dvy * dvy);
    if (dl > 60) { dvx = dvx / dl * 60; dvy = dvy / dl * 60; }
    applyGust(dvx, dvy, p.x, p.y);
  }
  lastPX = p.x; lastPY = p.y;
});
function endPointer() { downX = -1; dragging = false; }
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

// ---- sizing: full-bleed field, cover fit -----------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
