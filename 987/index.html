<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravity Is the Score</title>
<style>
  html, body { margin: 0; padding: 0; background: #05070B; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- constants ----------
  var FIELD = '#05070B';
  var DANCER = '#F5F2EA';
  var CYAN = '#4FD6FF';
  var DIAMOND_BODY = '#0E1118';
  var PAT_COLORS = ['#FF4FD8', '#4FD6FF', '#FFD93B'];
  var DT = 1 / 120;            // fixed sim step, seconds
  var PREROLL = 3600;          // 30 s of sim before frame one
  var N_DRONES = 12;
  var BASE_SEED = 987148;

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720, isPhone = false;

  function resize() {
    var w = W, h = H;
    if (typeof window !== 'undefined') {
      if (window.visualViewport && window.visualViewport.width) {
        w = window.visualViewport.width; h = window.visualViewport.height;
      } else if (window.innerWidth) {
        w = window.innerWidth; h = window.innerHeight;
      }
    }
    W = Math.max(50, Math.floor(w)); H = Math.max(50, Math.floor(h));
    canvas.width = W; canvas.height = H;
    var sw = W, sh = H;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || W; sh = window.screen.height || H;
    }
    isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
  }
  resize();
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', resize);
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
  }

  // ---------- seeded rng ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- state ----------
  var simTime = 0;
  var dancers = [];   // closed-form phrase params
  var drones = [];    // physics agents
  var thermal = null; // {x, until}
  var gustCount = 0;

  function dancerPos(d, t, out) {
    out.x = d.cx + d.a1 * Math.sin(d.w1 * t + d.p1) + d.a2 * Math.sin(d.w2 * t + d.p2);
    out.y = d.cy + d.a3 * Math.sin(d.w3 * t + d.p3) - Math.abs(Math.sin(d.w4 * t + d.p4)) * d.hop;
  }
  var _dp = { x: 0, y: 0 };
  function troupeCentroid(t) {
    var x = 0, y = 0, i;
    for (i = 0; i < dancers.length; i++) { dancerPos(dancers[i], t, _dp); x += _dp.x; y += _dp.y; }
    return { x: x / dancers.length, y: y / dancers.length };
  }

  function initWorld(seed) {
    var rnd = mulberry32(seed);
    var i, j;
    dancers = [];
    for (i = 0; i < 3; i++) {
      dancers.push({
        cx: 0.30 + i * 0.20 + (rnd() - 0.5) * 0.05,
        cy: 0.865 + (rnd() - 0.5) * 0.012,
        a1: 0.05 + rnd() * 0.05, w1: 0.35 + rnd() * 0.30, p1: rnd() * 6.283,
        a2: 0.02 + rnd() * 0.03, w2: 0.8 + rnd() * 0.5, p2: rnd() * 6.283,
        a3: 0.006 + rnd() * 0.006, w3: 1.1 + rnd() * 0.6, p3: rnd() * 6.283,
        w4: 0.9 + rnd() * 0.7, p4: rnd() * 6.283, hop: 0.012 + rnd() * 0.014
      });
    }
    drones = [];
    var c0 = troupeCentroid(0);
    for (i = 0; i < N_DRONES; i++) {
      var ang = rnd() * 6.283, rad = 0.12 + rnd() * 0.22;
      var dots = [];
      for (j = 0; j < 26; j++) dots.push({ x: rnd() * 2 - 1, y: rnd() * 2 - 1 });
      drones.push({
        x: c0.x + Math.cos(ang) * rad, y: 0.38 + (rnd() - 0.5) * 0.25,
        vx: (rnd() - 0.5) * 0.05, vy: (rnd() - 0.5) * 0.05,
        radius: rad, phase: ang,
        omega: (0.22 + rnd() * 0.28) * (rnd() < 0.8 ? 1 : -1),
        ySquash: 0.45 + rnd() * 0.2,
        tau: 0.4 + rnd() * 0.45,          // inertia time constant
        wobF: 0.7 + rnd() * 0.9, wobP: rnd() * 6.283, wobA: 0.010 + rnd() * 0.014,
        tilt: 0,
        patDur: 3.5 + rnd() * 2.5, patOff: rnd() * 6,
        trail: [], trailTick: 0,
        dots: dots
      });
    }
    thermal = null;
    simTime = 0;
  }

  function orbitTarget(d, t, out) {
    var c = troupeCentroid(t);
    var ax = c.x, ay = c.y - 0.48;
    if (ay < 0.20) ay = 0.20;
    out.x = ax + Math.cos(d.phase + d.omega * t) * d.radius;
    out.y = ay + Math.sin(d.phase + d.omega * t) * d.radius * d.ySquash;
  }
  var _t0 = { x: 0, y: 0 }, _t1 = { x: 0, y: 0 };

  function step() {
    var i, j, d;
    simTime += DT;
    // pairwise separation (light)
    for (i = 0; i < N_DRONES; i++) {
      for (j = i + 1; j < N_DRONES; j++) {
        var a = drones[i], b = drones[j];
        var dx = b.x - a.x, dy = b.y - a.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 0.0001 && dist < 0.05) {
          var push = (0.05 - dist) * 1.4 * DT / dist;
          a.vx -= dx * push; a.vy -= dy * push;
          b.vx += dx * push; b.vy += dy * push;
        }
      }
    }
    for (i = 0; i < N_DRONES; i++) {
      d = drones[i];
      orbitTarget(d, simTime, _t0);
      orbitTarget(d, simTime + DT, _t1);
      var fvx = (_t1.x - _t0.x) / DT, fvy = (_t1.y - _t0.y) / DT;
      // desired velocity: feed-forward plus spring toward target
      var dvx = fvx + (_t0.x - d.x) * 1.7;
      var dvy = fvy + (_t0.y - d.y) * 1.7;
      // inertia: velocity relaxes toward desired with time constant tau (lag, overshoot)
      var k = 1 - Math.exp(-DT / d.tau);
      d.vx += (dvx - d.vx) * k;
      d.vy += (dvy - d.vy) * k;
      // gravity: constant down-pull, the sag
      d.vy += 0.052 * DT;
      // wobble: small seeded turbulence
      d.vx += Math.sin(simTime * d.wobF * 2.1 + d.wobP) * d.wobA * DT;
      d.vy += Math.cos(simTime * d.wobF * 1.7 + d.wobP * 1.3) * d.wobA * 0.7 * DT;
      // thermal column: rising air
      if (thermal && simTime < thermal.until && Math.abs(d.x - thermal.x) < 0.085) {
        d.vy -= 0.16 * DT * (1 - Math.abs(d.x - thermal.x) / 0.085);
      }
      // air resistance: damping
      var damp = Math.exp(-0.55 * DT);
      d.vx *= damp; d.vy *= damp;
      // soft bounds: ceiling, floor above the dancers, side walls
      if (d.y < 0.055) d.vy += (0.055 - d.y) * 6 * DT;
      if (d.y > 0.68) d.vy += (0.68 - d.y) * 6 * DT;
      if (d.x < 0.04) d.vx += (0.04 - d.x) * 6 * DT;
      if (d.x > 0.96) d.vx += (0.96 - d.x) * 6 * DT;
      // speed clamp
      var sp = Math.sqrt(d.vx * d.vx + d.vy * d.vy), MAXS = 0.30;
      if (sp > MAXS) { d.vx = d.vx / sp * MAXS; d.vy = d.vy / sp * MAXS; }
      d.x += d.vx * DT;
      d.y += d.vy * DT;
      // bank tilt follows horizontal velocity, smoothed (orientation drives the pattern)
      var targetTilt = Math.max(-0.7, Math.min(0.7, d.vx * 2.0));
      d.tilt += (targetTilt - d.tilt) * (1 - Math.exp(-DT / 0.3));
      // trail recording
      d.trailTick++;
      if (d.trailTick % 2 === 0) {
        d.trail.push(d.x, d.y);
        if (d.trail.length > 280) d.trail.splice(0, d.trail.length - 280);
      }
    }
  }

  function patternIndex(d, t) {
    return Math.floor(t / d.patDur + d.patOff) % 3;
  }
  function patternColor(d, t) {
    var cyc = Math.floor(t / d.patDur + d.patOff);
    return PAT_COLORS[((cyc + drones.indexOf(d)) % 3 + 3) % 3];
  }

  // ---------- drawing ----------
  function drawDiamond(d) {
    var s = Math.min(W, H);
    var cx = d.x * W, cy = d.y * H + s * 0.016; // diamond hangs just under the drone point
    var hw = s * 0.0145, hh = s * 0.0105;
    var tilt = d.tilt;
    var pat = patternIndex(d, simTime);
    var col = patternColor(d, simTime);
    var phase = tilt * 16 + simTime * 1.5;
    // silhouette
    ctx.beginPath();
    ctx.moveTo(cx, cy - hh);
    ctx.lineTo(cx + hw, cy);
    ctx.lineTo(cx, cy + hh);
    ctx.lineTo(cx - hw, cy);
    ctx.closePath();
    ctx.fillStyle = DIAMOND_BODY;
    ctx.fill();
    // mapped pattern, clipped to the diamond, rotating/shifting with orientation
    ctx.save();
    ctx.clip();
    ctx.translate(cx, cy);
    ctx.rotate(tilt * 0.85);
    ctx.strokeStyle = col; ctx.fillStyle = col;
    ctx.globalAlpha = 0.9;
    ctx.lineWidth = Math.max(1, s * 0.0016);
    var stepG = hw * 0.62, off = ((phase % stepG) + stepG) % stepG, gx, gy;
    if (pat === 0) {          // stripes
      ctx.beginPath();
      for (gx = -hw * 2 + off; gx < hw * 2; gx += stepG) { ctx.moveTo(gx, -hh * 2); ctx.lineTo(gx, hh * 2); }
      ctx.stroke();
    } else if (pat === 1) {   // grid
      ctx.beginPath();
      for (gx = -hw * 2 + off; gx < hw * 2; gx += stepG) { ctx.moveTo(gx, -hh * 2); ctx.lineTo(gx, hh * 2); }
      for (gy = -hh * 2 + off; gy < hh * 2; gy += stepG) { ctx.moveTo(-hw * 2, gy); ctx.lineTo(hw * 2, gy); }
      ctx.stroke();
    } else {                  // noise field dots
      var i, px, py;
      for (i = 0; i < d.dots.length; i++) {
        px = d.dots[i].x * hw + Math.sin(phase * 0.4 + i) * hw * 0.12;
        py = d.dots[i].y * hh;
        ctx.beginPath();
        ctx.arc(px, py, Math.max(0.8, s * 0.0016), 0, 6.2832);
        ctx.fill();
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
    // hairline edges plus a center ridge (pyramid read)
    ctx.beginPath();
    ctx.moveTo(cx, cy - hh);
    ctx.lineTo(cx + hw, cy);
    ctx.lineTo(cx, cy + hh);
    ctx.lineTo(cx - hw, cy);
    ctx.closePath();
    ctx.moveTo(cx - hw, cy);
    ctx.lineTo(cx + hw, cy);
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = Math.max(1, s * 0.0012);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var s = Math.min(W, H);
    var i, j, d;
    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);

    // projection beams from an off-frame top corner to each diamond
    ctx.strokeStyle = '#FFFFFF';
    ctx.globalAlpha = 0.06;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (i = 0; i < N_DRONES; i++) {
      d = drones[i];
      ctx.moveTo(-s * 0.05, -s * 0.05);
      ctx.lineTo(d.x * W, d.y * H + s * 0.016);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    // thermal shimmer while a column is live
    if (thermal && simTime < thermal.until) {
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = Math.max(1, s * 0.0015);
      for (i = 0; i < 5; i++) {
        var tx = thermal.x * W + Math.sin(simTime * 1.3 + i * 1.7) * s * 0.02;
        var ty0 = (0.66 - ((simTime * 0.05 + i * 0.13) % 0.5)) * H;
        ctx.globalAlpha = 0.05;
        ctx.beginPath();
        ctx.moveTo(tx, ty0);
        ctx.lineTo(tx + Math.sin(simTime * 2 + i) * s * 0.008, ty0 - s * 0.07);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // trails: fading cyan ribbons
    ctx.lineWidth = Math.max(1, s * 0.0026);
    for (i = 0; i < N_DRONES; i++) {
      d = drones[i];
      var n = d.trail.length / 2;
      if (n < 2) continue;
      ctx.strokeStyle = CYAN;
      for (j = 1; j < n; j++) {
        ctx.globalAlpha = 0.02 + 0.23 * (j / n);
        ctx.beginPath();
        ctx.moveTo(d.trail[(j - 1) * 2] * W, d.trail[(j - 1) * 2 + 1] * H);
        ctx.lineTo(d.trail[j * 2] * W, d.trail[j * 2 + 1] * H);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    // diamonds (projection-mapped payloads)
    for (i = 0; i < N_DRONES; i++) drawDiamond(drones[i]);

    // drone points with layered halos
    for (i = 0; i < N_DRONES; i++) {
      d = drones[i];
      var px = d.x * W, py = d.y * H;
      ctx.globalAlpha = 0.10;
      ctx.fillStyle = CYAN;
      ctx.beginPath(); ctx.arc(px, py, s * 0.020, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 0.30;
      ctx.beginPath(); ctx.arc(px, py, s * 0.010, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(px, py, Math.max(1.4, s * 0.0032), 0, 6.2832); ctx.fill();
    }

    // dancers low on the field
    for (i = 0; i < dancers.length; i++) {
      dancerPos(dancers[i], simTime, _dp);
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = DANCER;
      ctx.beginPath(); ctx.arc(_dp.x * W, _dp.y * H, s * 0.009, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath(); ctx.arc(_dp.x * W, _dp.y * H, Math.max(1.6, s * 0.0042), 0, 6.2832); ctx.fill();
    }
  }

  // ---------- audio (lazy, first gesture only) ----------
  var AC = null, rotorOsc = null, rotorGain = null, noteTimer = 0, lastPatSum = -1;
  function initAudio() {
    if (AC) return;
    try {
      var Ctx = null;
      if (typeof window !== 'undefined') Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      AC = new Ctx();
      var master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
      AC._master = master;
      rotorOsc = AC.createOscillator();
      rotorOsc.type = 'sawtooth';
      rotorOsc.frequency.value = 82;
      var lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320;
      rotorGain = AC.createGain(); rotorGain.gain.value = 0.016;
      rotorOsc.connect(lp); lp.connect(rotorGain); rotorGain.connect(master);
      rotorOsc.start();
    } catch (e) { AC = null; }
  }
  function blip(freq, dur, gain) {
    if (!AC) return;
    try {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(gain, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
      o.connect(g); g.connect(AC._master);
      o.start(); o.stop(AC.currentTime + dur + 0.02);
    } catch (e) {}
  }
  function noiseSweep() {
    if (!AC) return;
    try {
      var len = Math.floor(AC.sampleRate * 0.5);
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var data = buf.getChannelData(0), i;
      for (i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      var src = AC.createBufferSource(); src.buffer = buf;
      var bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
      bp.frequency.setValueAtTime(300, AC.currentTime);
      bp.frequency.exponentialRampToValueAtTime(1600, AC.currentTime + 0.45);
      var g = AC.createGain();
      g.gain.setValueAtTime(0.05, AC.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + 0.5);
      src.connect(bp); bp.connect(g); g.connect(AC._master);
      src.start();
    } catch (e) {}
  }
  function audioFrame(simElapsed) {
    if (!AC) return;
    // rotor whir: pitch by mean altitude (higher flock, higher hum)
    var meanY = 0, i;
    for (i = 0; i < N_DRONES; i++) meanY += drones[i].y;
    meanY /= N_DRONES;
    try { rotorOsc.frequency.value = 130 - meanY * 110; } catch (e) {}
    // pattern-change ticks
    var sum = 0;
    for (i = 0; i < N_DRONES; i++) sum += patternIndex(drones[i], simTime) + Math.floor(simTime / drones[i].patDur + drones[i].patOff) * 4;
    if (lastPatSum >= 0 && sum !== lastPatSum) blip(1900, 0.04, 0.012);
    lastPatSum = sum;
    // low melodic line following the dancer phrase
    noteTimer -= simElapsed;
    if (noteTimer <= 0) {
      noteTimer = 2.4;
      var scale = [110, 130.81, 146.83, 164.81, 196];
      var idx = Math.abs(Math.floor(simTime * 0.7)) % scale.length;
      blip(scale[idx], 1.1, 0.03);
    }
  }

  // ---------- interaction ----------
  var pDown = null, lastTapAt = -10, lastTapX = 0, lastTapY = 0, reseedCount = 0;
  function nowSec() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return Date.now() / 1000;
  }
  function toNorm(e) {
    var r = { x: 0.5, y: 0.5 };
    if (e && typeof e.clientX === 'number') { r.x = e.clientX / W; r.y = e.clientY / H; }
    return r;
  }
  function doGust(nx, ny) {
    var i, d, dx, dy, dist;
    for (i = 0; i < N_DRONES; i++) {
      d = drones[i];
      dx = d.x - nx; dy = d.y - ny;
      dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 0.34) {
        var f = (1 - dist / 0.34) * 0.30;
        if (dist < 0.001) { dx = 0.1; dy = -0.1; dist = 0.14; }
        d.vx += (dx / dist) * f;
        d.vy += (dy / dist) * f - 0.02;
      }
    }
    gustCount++;
    noiseSweep();
  }
  function onDown(e) {
    initAudio();
    var p = toNorm(e);
    pDown = { x: p.x, y: p.y, t: nowSec(), moved: 0 };
  }
  function onMove(e) {
    if (!pDown) return;
    var p = toNorm(e);
    pDown.moved += Math.abs(p.x - pDown.x) + Math.abs(p.y - pDown.y);
    pDown.lastX = p.x; pDown.lastY = p.y;
    // dragging upward opens a thermal right away
    if (p.y < pDown.y - 0.05) thermal = { x: p.x, until: simTime + 10 };
  }
  function onUp(e) {
    if (!pDown) return;
    var p = toNorm(e);
    var quick = nowSec() - pDown.t < 0.35 && pDown.moved < 0.03;
    var wasDragUp = p.y < pDown.y - 0.06;
    if (wasDragUp) thermal = { x: p.x, until: simTime + 10 };
    if (quick) {
      var gap = nowSec() - lastTapAt;
      if (gap < 0.4 && Math.abs(p.x - lastTapX) < 0.08 && Math.abs(p.y - lastTapY) < 0.08) {
        // double tap: a new flock
        reseedCount++;
        initWorld(BASE_SEED + reseedCount * 7919);
        var i; for (i = 0; i < PREROLL; i++) step();
        lastTapAt = -10;
      } else {
        lastTapAt = nowSec(); lastTapX = p.x; lastTapY = p.y;
        doGust(p.x, p.y);
      }
    }
    pDown = null;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
  }

  // ---------- run ----------
  initWorld(BASE_SEED);
  var s0;
  for (s0 = 0; s0 < PREROLL; s0++) step();
  draw();

  var lastReal = null, accum = 0;
  function frame(ts) {
    if (typeof ts !== 'number') ts = 0;
    if (lastReal === null) lastReal = ts;
    var elapsed = (ts - lastReal) / 1000;
    lastReal = ts;
    if (elapsed > 0.25) elapsed = 0.25;
    accum += elapsed;
    var n = Math.floor(accum / DT), i;
    if (n > 24) n = 24;
    for (i = 0; i < n; i++) step();
    accum -= n * DT;
    if (n > 0) { audioFrame(n * DT); draw(); }
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
