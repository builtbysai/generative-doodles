<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9062 · Driftlines</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#141210; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(236,229,211,0.38); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.7); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another drift</div>
<script>
'use strict';
/*
Driftlines, a generative study in tone drawn from velocity.
Hundreds of hairline curves are advected through a domain-warped
fbm flow field. The field carries direction and speed, and the speed
drives everything tonal: where lines seed, how heavy they draw, and
how long they run. Fast reaches pack into dark masses; slow reaches
fall back to sparse whisper-thin traces. Warm-black ink on bone with
a rare rust line. Tyler Hobbs and Fidenza inspired, original build.
*/
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const TAU = Math.PI*2;
const GROUND = '#ece5d3';

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9062', 10) || 9062;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

/* Seeded permutation gradient noise, fbm, and the drift field. */
function makeField(rand){
  const p = new Uint8Array(256);
  for(let i=0;i<256;i++) p[i]=i;
  for(let i=255;i>0;i--){ const j=(rand()*(i+1))|0; const t=p[i]; p[i]=p[j]; p[j]=t; }
  const perm = new Uint8Array(512);
  for(let i=0;i<512;i++) perm[i]=p[i&255];

  function g(h,x,y){ switch(h&3){ case 0: return x+y; case 1: return -x+y; case 2: return x-y; default: return -x-y; } }
  function n2(x,y){
    const X=Math.floor(x), Y=Math.floor(y);
    const xi=X&255, yi=Y&255;
    x-=X; y-=Y;
    const u=x*x*(3-2*x), v=y*y*(3-2*y);
    const aa=perm[perm[xi]+yi], ab=perm[perm[xi]+yi+1];
    const ba=perm[perm[xi+1]+yi], bb=perm[perm[xi+1]+yi+1];
    const x1=g(aa,x,y)*(1-u)+g(ba,x-1,y)*u;
    const x2=g(ab,x,y-1)*(1-u)+g(bb,x-1,y-1)*u;
    return (x1*(1-v)+x2*v)*0.7071;
  }
  function fbm(x,y,oct){
    let a=0.5, f=1, sum=0, norm=0;
    for(let i=0;i<oct;i++){ sum+=a*n2(x*f,y*f); norm+=a; a*=0.5; f*=2.03; }
    return sum/norm;
  }

  /* Field personality, drawn from the seed. */
  const SCALE = 1.4 + rand()*1.8;    /* direction feature scale */
  const WARP  = 3.0 + rand()*2.6;    /* domain warp strength */
  const TW    = 0.70 + rand()*1.0;   /* angle turbulence */
  const SS    = 0.65 + rand()*0.9;   /* speed feature scale */
  const O1x=rand()*40, O1y=rand()*40, O2x=rand()*40, O2y=rand()*40;
  const SOx=rand()*40, SOy=rand()*40;

  function speedAt(nx, ny){
    const m = fbm(nx*SS+SOx, ny*SS+SOy, 4)*0.5+0.5;
    return Math.pow(Math.min(1, Math.max(0, m)), 1.35);
  }
  function angleAt(nx, ny){
    const qx = fbm(nx*SCALE+O1x, ny*SCALE+O1y, 4);
    const qy = fbm(nx*SCALE+O2x, ny*SCALE+O2y, 4);
    return TAU * TW * fbm(nx*SCALE + WARP*qx, ny*SCALE + WARP*qy, 4);
  }
  return { speedAt, angleAt };
}

/* Build one full composition for a seed. Returns paths plus QA stats. */
function compose(rseed, S){
  const rand = mulberry32(rseed);
  const field = makeField(rand);
  const M = S*0.085;                    /* margin, 8.5 percent */
  const inner = S - 2*M;
  const STEP = Math.max(1.7, S/520);
  const GAMMA = 1.6;                    /* density follows speed */

  const cell = inner/46;
  const cols = Math.ceil(inner/cell);
  const paths = [];

  for(let gy=0; gy<cols; gy++){
    for(let gx=0; gx<cols; gx++){
      const jx = rand(), jy = rand();
      const sx = M + (gx+jx)*cell, sy = M + (gy+jy)*cell;
      if(sx < M || sx > S-M || sy < M || sy > S-M) continue;
      const sp0 = field.speedAt(sx/S, sy/S);
      if(rand() > Math.pow(sp0, GAMMA) && rand() > 0.03) continue; /* sparse seeds in slow reaches */

      const rust = rand() < 0.025;
      const maxSteps = Math.round(250 - 150*sp0);

      /* Trace forward and backward from the seed. */
      const pts = [[sx, sy]];
      let sumSp = sp0, nSp = 1;
      for(let dir=1; dir>=-1; dir-=2){
        let x = sx, y = sy;
        for(let i=0;i<maxSteps;i++){
          const a = field.angleAt(x/S, y/S);
          x += Math.cos(a)*STEP*dir;
          y += Math.sin(a)*STEP*dir;
          if(x < M || x > S-M || y < M || y > S-M) break; /* lines die at the margin */
          if(dir < 0) pts.unshift([x, y]); else pts.push([x, y]);
          sumSp += field.speedAt(x/S, y/S); nSp++;
        }
      }
      if(pts.length < 7) continue;
      const mAvg = sumSp/nSp;

      const wScale = S/1000;
      const wdt = (0.55 + 2.0*Math.pow(mAvg, 0.75)) * wScale;
      const alp = rust ? 0.62 + 0.25*mAvg : 0.42 + 0.38*mAvg;
      const jt = (rand()-0.5)*14;
      const col = rust
        ? 'rgba('+(150+jt|0)+','+(52+jt*0.5|0)+','+(40+jt*0.4|0)+','+alp.toFixed(3)+')'
        : 'rgba('+(30+jt|0)+','+(24+jt|0)+','+(18+jt|0)+','+alp.toFixed(3)+')';
      paths.push({ pts, wdt, col });
    }
  }

  /* Tonal QA: density grid over the inner square. */
  const NC = 20, grid = new Float32Array(NC*NC);
  const gs = inner/NC;
  let surviving = 0, maxC = 0;
  for(const pth of paths){
    if(pth.pts.length < 7) continue;
    surviving++;
    for(let i=1;i<pth.pts.length;i++){
      const mx = (pth.pts[i-1][0]+pth.pts[i][0])/2 - M;
      const my = (pth.pts[i-1][1]+pth.pts[i][1])/2 - M;
      const cx = Math.min(NC-1, Math.max(0, (mx/gs)|0));
      const cy = Math.min(NC-1, Math.max(0, (my/gs)|0));
      const v = ++grid[cy*NC+cx];
      if(v > maxC) maxC = v;
    }
  }
  let minC = Infinity;
  for(let i=0;i<NC*NC;i++) if(grid[i] < minC) minC = grid[i];
  const sorted = Float32Array.from(grid).sort();
  const p10 = sorted[(NC*NC*0.10)|0], p90 = sorted[(NC*NC*0.90)|0];
  const tonal = p90 > 0 ? (p90-p10)/p90 : 0;
  return { paths, lines: surviving, tonal, maxC, minC, p10, p90 };
}

function render(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.max(1, Math.round(w*dpr));
  canvas.height = Math.max(1, Math.round(h*dpr));
  canvas.style.width = w+'px';
  canvas.style.height = h+'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const S = Math.min(w, h);
  const ox = (w-S)/2, oy = (h-S)/2;

  ctx.fillStyle = '#141210';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = GROUND;
  ctx.fillRect(ox, oy, S, S);

  /* Every seed must compose: retry with derived seeds on failure. */
  let rseed = seed >>> 0, art = null;
  for(let attempt=0; attempt<8; attempt++){
    art = compose(rseed, S);
    if(art.lines >= 120 && art.tonal >= 0.75 && art.p90 >= 200 && art.p10 <= 120) break;
    rseed = (Math.imul(rseed, 2654435761) + 97 + attempt*13) >>> 0;
  }
  ctx.save();
  ctx.translate(ox, oy);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  /* Thin whisper lines first so dense dark masses settle on top. */
  const order = art.paths.map((p, i) => i).sort((a, b) => art.paths[a].wdt - art.paths[b].wdt);
  for(const i of order){
    const pth = art.paths[i];
    ctx.strokeStyle = pth.col;
    ctx.lineWidth = pth.wdt;
    ctx.beginPath();
    ctx.moveTo(pth.pts[0][0], pth.pts[0][1]);
    for(let k=1;k<pth.pts.length;k++) ctx.lineTo(pth.pts[k][0], pth.pts[k][1]);
    ctx.stroke();
  }

  /* Hairline frame at the margin: the boundary lines never cross. */
  const M = S*0.085;
  ctx.strokeStyle = 'rgba(30,24,18,0.30)';
  ctx.lineWidth = Math.max(1, S/900);
  ctx.strokeRect(M, M, S-2*M, S-2*M);

  /* Restrained paper grain. */
  const gr = mulberry32((seed^0x9e3779b9) >>> 0);
  const NG = 3800;
  for(let i=0;i<NG;i++){
    const x = gr()*S, y = gr()*S, a = 0.02 + gr()*0.05;
    ctx.fillStyle = gr() < 0.6
      ? 'rgba(24,18,12,'+a.toFixed(3)+')'
      : 'rgba(255,252,240,'+a.toFixed(3)+')';
    ctx.fillRect(x, y, 1, 1);
  }
  ctx.restore();
}

let rT = null;
window.addEventListener('resize', () => {
  clearTimeout(rT);
  rT = setTimeout(render, 180);
});
canvas.addEventListener('click', () => {
  seed = (Math.random()*1e9)|0;
  history.replaceState(null, '', '?seed='+seed);
  render();
});
render();
</script>
</body>
</html>
