<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Pole, Chaos Pole</title>
<style>
html, body { margin: 0; padding: 0; background: #FAF9F6; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#FAF9F6';
var KRAFT = '#C2A878';
var KRAFT_EDGE = '#A98F5F';
var WHISKER = '#3A3A3A';
var PLATE = '#FFFFFF';
var PLATE_LINE = 'rgba(58,58,58,0.45)';
var TITLE_INK = '#3A3A3A';
var HINT_INK = '#6B6B6B';
var CYCLE = 120;
var T0 = 0;
var COLS = 12;
var ROWS = 9;
var N = COLS * ROWS;
var WHISKERS = [-0.85, 0, 0.85];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function lerp(a, b, t) { return a + (b - a) * t; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
/* ---- seeded per-unit constants: delay, whisker phase, rate, scatter rotation ---- */
var rng = mulberry32(1747);
var delay = [], phi0 = [], rate = [], rotS = [];
var i;
for (i = 0; i < N; i++) {
  delay.push(rng());
  phi0.push(rng() * TAU);
  rate.push(0.04 + rng() * 0.10);
  rotS.push((rng() - 0.5) * 0.9);
}
/* ---- scatter layout: seeded poisson-ish rejection sampling in unit space ---- */
var rngS = mulberry32(1747 + 991);
var scatterU = [];
(function buildScatter() {
  var minD = 0.078, tries = 0, x, y, ok, j, dx, dy;
  while (scatterU.length < N && tries < 60000) {
    tries++;
    x = 0.03 + rngS() * 0.94;
    y = 0.03 + rngS() * 0.94;
    ok = true;
    for (j = 0; j < scatterU.length; j++) {
      dx = scatterU[j][0] - x; dy = scatterU[j][1] - y;
      if (dx * dx + dy * dy < minD * minD) { ok = false; break; }
    }
    if (ok) scatterU.push([x, y]);
  }
  /* fallback: jittered lattice points, shuffled by the same seeded stream */
  var gx, gy, pool = [];
  for (gy = 0; gy < ROWS; gy++) for (gx = 0; gx < COLS; gx++) {
    pool.push([0.05 + (gx + 0.5 + (rngS() - 0.5) * 0.7) / COLS * 0.9,
               0.05 + (gy + 0.5 + (rngS() - 0.5) * 0.7) / ROWS * 0.9]);
  }
  for (i = pool.length - 1; i > 0; i--) {
    j = Math.floor(rngS() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  var p = 0;
  while (scatterU.length < N && p < pool.length) { scatterU.push(pool[p]); p++; }
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* ---- stage: square on desktop, full-bleed on phones ---- */
function stageRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* ---- field: the stage minus the title-plate strip at the top, so no
        plate ever covers a unit; the formation still spans the frame ---- */
function fieldRect(st) {
  var top = isPhone ? 74 : 80;
  var bottom = 50;
  return { x: st.x, y: st.y + top, w: st.w, h: st.h - top - bottom };
}
/* ---- global morph: 0 grid, 1 scatter; dwells at both poles, smooth both ways ---- */
function morphGlobal(t) {
  var p = ((t / CYCLE) % 1 + 1) % 1;
  if (p < 0.20) return 0;
  if (p < 0.45) return smooth((p - 0.20) / 0.25);
  if (p < 0.55) return 1;
  if (p < 0.80) return 1 - smooth((p - 0.55) / 0.25);
  return 0;
}
function whiskerPhase(idx, t) { return phi0[idx] + rate[idx] * t; }
/* ---- per-unit pose at time t: interpolated position and rotation ---- */
function unitPose(idx, t, st) {
  var f = fieldRect(st);
  var col = idx % COLS, row = Math.floor(idx / COLS);
  var gx = f.x + f.w * (col + 0.5) / COLS;
  var gy = f.y + f.h * (row + 0.5) / ROWS;
  var sx = f.x + f.w * scatterU[idx][0];
  var sy = f.y + f.h * scatterU[idx][1];
  var m = morphGlobal(t);
  var mi = smooth(clamp(m * 1.4 - delay[idx] * 0.4, 0, 1));
  return { x: lerp(gx, sx, mi), y: lerp(gy, sy, mi), rot: rotS[idx] * mi, m: mi };
}
var clockT = T0;
function draw() {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var st = stageRect();
  var t = clockT;
  var box = Math.min(st.w / COLS, st.h / ROWS) * 0.42;
  var wl = box * 1.35;
  var lw = Math.max(1, Math.min(st.w, st.h) * 0.0016);
  var k, a, tick, px, py;
  for (i = 0; i < N; i++) {
    var pose = unitPose(i, t, st);
    tick = 0.45 * Math.sin(whiskerPhase(i, t));
    ctx.save();
    ctx.translate(pose.x, pose.y);
    ctx.rotate(pose.rot);
    /* whiskers first, so the box caps their roots */
    ctx.strokeStyle = WHISKER;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    for (k = 0; k < WHISKERS.length; k++) {
      a = -Math.PI / 2 + WHISKERS[k] + tick;
      ctx.beginPath();
      ctx.moveTo(0, -box * 0.2);
      ctx.lineTo(Math.cos(a) * wl, -box * 0.2 + Math.sin(a) * wl);
      ctx.stroke();
    }
    /* kraft box, identical in both grammars */
    ctx.fillStyle = KRAFT;
    ctx.fillRect(-box / 2, -box / 2, box, box);
    ctx.strokeStyle = KRAFT_EDGE;
    ctx.lineWidth = Math.max(1, box * 0.06);
    ctx.strokeRect(-box / 2, -box / 2, box, box);
    /* pivot dot where the whiskers meet the box */
    ctx.fillStyle = WHISKER;
    ctx.fillRect(-lw, -box * 0.2 - lw, lw * 2, lw * 2);
    ctx.restore();
  }
  drawPlates();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Order Pole, Chaos Pole').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Order Pole, Chaos Pole').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 10 · 24').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Order Pole, Chaos Pole', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 10 · 24', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (tt) { clockT = tt; draw(); },
    count: function () { return N; },
    morphAt: function (tt) { return morphGlobal(tt); },
    pos: function (idx, tt) {
      var st = stageRect();
      var p = unitPose(idx, tt, st);
      return [p.x, p.y, p.m];
    },
    whiskerPhase: function (idx, tt) { return whiskerPhase(idx, tt); },
    meanDisp: function (tA, tB) {
      var st = stageRect(), s = 0, k, pa, pb, dx, dy;
      for (k = 0; k < N; k++) {
        pa = unitPose(k, tA, st); pb = unitPose(k, tB, st);
        dx = pa.x - pb.x; dy = pa.y - pb.y;
        s += Math.sqrt(dx * dx + dy * dy);
      }
      return s / N;
    },
    clockT: function () { return clockT; }
  };
}
/* ---- frame one: t = 0, strict grid state, no pointer input ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var prevTs = null, t0 = null;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
