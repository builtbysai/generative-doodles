<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Shoveler</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0a09; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: 14px; text-align: center;
    font: 12px/1.4 system-ui, -apple-system, sans-serif; letter-spacing: 0.14em;
    color: #8a7a5e; pointer-events: none; user-select: none;
  }
  #soundBtn {
    position: fixed; top: 12px; right: 12px; z-index: 2;
    font: 11px/1 system-ui, -apple-system, sans-serif; letter-spacing: 0.14em;
    color: #b09a72; background: rgba(20, 17, 14, 0.72);
    border: 1px solid rgba(176, 154, 114, 0.45); border-radius: 3px;
    padding: 8px 10px; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="soundBtn" type="button">SOUND OFF</button>
<div class="hint">WATCH ONLY</div>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG, fixed seed: frame one is fully deterministic.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(1827);

  var reduced = false;
  try {
    reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) { reduced = false; }

  function alpha(v) {
    var a = Math.round(v * 10000) / 10000;
    if (a < 0) a = 0;
    if (a > 1) a = 1;
    return a;
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }

  // The fan: exactly 9 parallel steel wires.
  var WIRES = 9;
  var GROUPS = [3, 6, 9];

  // Strike schedule: slow, breathing, never metronomic. Strike k lands at
  // 12 + 11k + 3 sin(1.3k) seconds, so intervals wander between about
  // 8 and 14 seconds. Group size cycles 3, 6, 9. At t = 60 the nearest
  // strikes are 6.7 s behind and 7.6 s ahead, so frame one is settled.
  function strikeTime(k) { return 12 + k * 11 + 3 * Math.sin(k * 1.3); }
  function groupSize(k) { return GROUPS[((k % 3) + 3) % 3]; }
  // Group of 3 strikes the middle three wires; 6 the middle six; 9 all.
  function struckWires(k) {
    var n = groupSize(k);
    var first = Math.floor((WIRES - n) / 2);
    var out = [];
    for (var i = 0; i < n; i++) out.push(first + i);
    return out;
  }
  // Most recent strike at or before time t: { k, age }.
  function recentStrike(t) {
    var k = Math.floor((t - 12) / 11);
    if (k < 0) k = 0;
    var best = null;
    for (var j = k - 1; j <= k + 1; j++) {
      if (j < 0) continue;
      var tk = strikeTime(j);
      if (tk <= t && (!best || tk > best.tk)) best = { k: j, tk: tk, age: t - tk };
    }
    return best;
  }
  // Next strike at or after time t.
  function nextStrike(t) {
    var k = Math.floor((t - 12) / 11);
    if (k < 0) k = 0;
    for (var j = k; j <= k + 2; j++) {
      if (j < 0) continue;
      var tk = strikeTime(j);
      if (tk >= t) return { k: j, tk: tk, dt: tk - t };
    }
    return null;
  }

  // Dust motes drifting in the work light.
  var MOTES = [];
  for (var i = 0; i < 26; i++) {
    MOTES.push({
      x: rnd(), y: rnd(), r: 0.6 + rnd() * 1.3,
      a: 0.04 + rnd() * 0.11,
      px: rnd() * Math.PI * 2, py: rnd() * Math.PI * 2,
      sx: 0.003 + rnd() * 0.007, sy: 0.002 + rnd() * 0.005
    });
  }
  // Workshop plank seams: seeded verticals, faint.
  var PLANKS = [];
  for (var p = 0; p < 7; p++) PLANKS.push(0.06 + p * 0.14 + (rnd() - 0.5) * 0.02);

  var tNow = 60;

  // Wire endpoints in room coordinates: a fan, slightly converging right.
  function wireEnds(i, rx, ry, rw, rh) {
    var ax = rx + rw * 0.02;
    var bx = rx + rw * 0.98;
    var ay = ry + rh * (0.30 + i * 0.052);
    var by = ry + rh * (0.40 + i * 0.034);
    return { ax: ax, ay: ay, bx: bx, by: by };
  }
  // Point on wire i at fraction s (0 left, 1 right).
  function wirePoint(i, s, rx, ry, rw, rh) {
    var e = wireEnds(i, rx, ry, rw, rh);
    return { x: e.ax + (e.bx - e.ax) * s, y: e.ay + (e.by - e.ay) * s };
  }

  // Tool dip: the wooden shoveler lifts slightly, plunges at the strike,
  // then rebounds. Returns vertical offset in px (positive = down).
  function toolDip(t) {
    var rs = recentStrike(t);
    var nx = nextStrike(t);
    var lift = 0;
    if (nx && nx.dt < 0.9) {
      // Anticipation: rise a little, then plunge in the last 0.35 s.
      var u = 1 - nx.dt / 0.9;
      lift = -7 * smooth(u * 1.4) + 16 * smooth((u - 0.6) / 0.4);
    }
    var rebound = 0;
    if (rs && rs.age < 1.6) {
      rebound = 14 * (1 - smooth(rs.age / 1.6)) * Math.exp(-rs.age / 0.9);
    }
    return lift + rebound;
  }

  function draw(t) {
    var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    var W = Math.max(1, Math.floor(vw));
    var H = Math.max(1, Math.floor(vh));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var isPhone = false;
    try {
      var sw = window.screen.width, sh = window.screen.height;
      var mn = Math.min(sw, sh);
      isPhone = mn < 700 || (H > W * 1.15);
    } catch (e) { isPhone = (H > W * 1.15); }

    // Page ground is the piece's own background color on both sizes.
    ctx.fillStyle = '#0b0a09';
    ctx.fillRect(0, 0, W, H);

    // Room rect: full-bleed on phones, centered square on desktop.
    var rw, rh, rx, ry;
    if (isPhone) {
      rx = 0; ry = 0; rw = W; rh = H;
    } else {
      rw = Math.min(W * 0.92, H * 0.92);
      rh = rw;
      rx = (W - rw) / 2;
      ry = (H - rh) / 2;
    }

    // Workshop wall: near-black, faintly lighter toward the work light.
    var wall = ctx.createLinearGradient(rx, ry, rx + rw, ry + rh * 0.4);
    wall.addColorStop(0, '#17130f');
    wall.addColorStop(0.7, '#100d0b');
    wall.addColorStop(1, '#0b0a09');
    ctx.fillStyle = wall;
    ctx.fillRect(rx, ry, rw, rh);

    // Faint vertical plank seams.
    ctx.strokeStyle = 'rgba(255,255,255,' + alpha(0.025) + ')';
    ctx.lineWidth = 1;
    for (var pi = 0; pi < PLANKS.length; pi++) {
      ctx.beginPath();
      ctx.moveTo(rx + rw * PLANKS[pi], ry);
      ctx.lineTo(rx + rw * PLANKS[pi], ry + rh);
      ctx.stroke();
    }

    // Warm work light from the upper right.
    var lampX = rx + rw * 0.88, lampY = ry + rh * 0.06;
    var glow = ctx.createRadialGradient(lampX, lampY, 0, lampX, lampY, rw * 0.75);
    glow.addColorStop(0, 'rgba(216,164,92,' + alpha(0.20) + ')');
    glow.addColorStop(0.5, 'rgba(216,164,92,' + alpha(0.07) + ')');
    glow.addColorStop(1, 'rgba(216,164,92,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(rx, ry, rw, rh);

    var rs = recentStrike(t);
    var struck = rs ? struckWires(rs.k) : [];
    var isStruck = {};
    for (var si = 0; si < struck.length; si++) isStruck[struck[si]] = true;
    var waveAge = rs ? rs.age : 99;

    // The nine wires, drawn in segments so the longitudinal compression
    // wave can brighten and darken along each struck wire.
    var SEG = 140;
    ctx.lineCap = 'round';
    for (var i = 0; i < WIRES; i++) {
      var e = wireEnds(i, rx, ry, rw, rh);
      var dx = (e.bx - e.ax) / SEG, dy = (e.by - e.ay) / SEG;
      var hit = isStruck[i] && waveAge < 6;
      var env = hit ? Math.exp(-waveAge / 1.1) : 0;
      for (var sgi = 0; sgi < SEG; sgi++) {
        var smid = (sgi + 0.5) / SEG;
        // Warm light catches the wires more toward the right.
        var warm = 0.25 + 0.75 * smid;
        var baseR = 150 + 66 * warm, baseG = 156 + 22 * warm, baseB = 164 - 52 * warm;
        // Settled long tone: a faint standing shimmer on every wire.
        var settle = 0.06 * (0.5 + 0.5 * Math.sin(2 * Math.PI * (smid * 2) + t * 0.4 + i * 0.7));
        var bright = 0.55 + settle;
        var a = 0.55;
        if (hit) {
          // Longitudinal compression wave: bright bands travelling along
          // the wire from the strike point, decaying over seconds.
          var ph = 2 * Math.PI * (smid * 5 - waveAge * 2.0);
          var band = 0.5 + 0.5 * Math.sin(ph);
          var near = Math.exp(-Math.abs(smid - 0.44) / 0.22);
          bright = 0.55 + env * (0.55 * band + 0.35 * near);
          a = 0.55 + env * 0.45 * (0.4 + 0.6 * band);
        }
        ctx.strokeStyle = 'rgba(' + Math.round(baseR) + ',' + Math.round(baseG) + ',' +
          Math.round(baseB) + ',' + alpha(a * bright) + ')';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(e.ax + dx * sgi, e.ay + dy * sgi);
        ctx.lineTo(e.ax + dx * (sgi + 1), e.ay + dy * (sgi + 1));
        ctx.stroke();
      }
      // Bright hairline just above each wire, the steel edge.
      ctx.strokeStyle = 'rgba(235,240,245,' + alpha(0.22 + (hit ? env * 0.3 : 0)) + ')';
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(e.ax, e.ay - 1.2);
      ctx.lineTo(e.bx, e.by - 1.2);
      ctx.stroke();
      // Anchor plates at both ends.
      ctx.fillStyle = '#221d18';
      ctx.fillRect(e.ax - 3, e.ay - 4, 6, 8);
      ctx.fillRect(e.bx - 3, e.by - 4, 6, 8);
      ctx.fillStyle = '#6d7278';
      ctx.beginPath();
      ctx.moveTo(e.ax + 2, e.ay);
      ctx.arc(e.ax, e.ay, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(e.bx + 2, e.by);
      ctx.arc(e.bx, e.by, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    // Strike point on the middle wire.
    var sp = wirePoint(4, 0.44, rx, ry, rw, rh);

    // The shoveler tool and the hand, entering from the top edge.
    var dip = toolDip(t);
    var gripX = rx + rw * 0.415, gripY = ry + rh * 0.10;
    var headX = sp.x + rw * 0.012, headY = sp.y - rh * 0.055 + dip;
    var scale = Math.min(rw, rh) / 800;

    // Handle shaft: pale struck wood, from the top edge to the head.
    ctx.strokeStyle = '#c9a06b';
    ctx.lineCap = 'round';
    ctx.lineWidth = 15 * scale;
    ctx.beginPath();
    ctx.moveTo(gripX - (gripX - headX) * 0.35, ry + 10);
    ctx.lineTo(headX, headY);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(138,106,62,' + alpha(0.6) + ')';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(gripX - (gripX - headX) * 0.35 - 4 * scale, ry + 10);
    ctx.lineTo(headX - 4 * scale, headY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(gripX - (gripX - headX) * 0.35 + 4 * scale, ry + 10);
    ctx.lineTo(headX + 4 * scale, headY);
    ctx.stroke();

    // Blade: a flat wooden paddle, wide enough to cover the middle wires,
    // its lower edge resting on the fan at the strike point.
    var bw = 96 * scale, bh = 52 * scale;
    ctx.save();
    ctx.translate(headX, headY + bh * 0.28);
    ctx.rotate(-0.32);
    ctx.fillStyle = '#c9a06b';
    ctx.beginPath();
    ctx.moveTo(-bw / 2 + 8 * scale, -bh / 2);
    ctx.lineTo(bw / 2 - 8 * scale, -bh / 2);
    ctx.quadraticCurveTo(bw / 2, -bh / 2, bw / 2, 0);
    ctx.lineTo(bw / 2, bh / 2 - 6 * scale);
    ctx.quadraticCurveTo(bw / 2, bh / 2, bw / 2 - 8 * scale, bh / 2);
    ctx.lineTo(-bw / 2 + 8 * scale, bh / 2);
    ctx.quadraticCurveTo(-bw / 2, bh / 2, -bw / 2, bh / 2 - 6 * scale);
    ctx.lineTo(-bw / 2, 0);
    ctx.quadraticCurveTo(-bw / 2, -bh / 2, -bw / 2 + 8 * scale, -bh / 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#8a6a3e';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    // Wood grain along the blade.
    ctx.strokeStyle = 'rgba(138,106,62,' + alpha(0.55) + ')';
    ctx.lineWidth = 1;
    for (var gi = -1; gi <= 1; gi++) {
      ctx.beginPath();
      ctx.moveTo(-bw / 2 + 10 * scale, gi * bh * 0.22);
      ctx.quadraticCurveTo(0, gi * bh * 0.22 + 3 * scale, bw / 2 - 10 * scale, gi * bh * 0.22);
      ctx.stroke();
    }
    // Worn striking edge, paler where it meets the wires.
    ctx.fillStyle = 'rgba(232,205,160,' + alpha(0.85) + ')';
    ctx.fillRect(-bw / 2 + 6 * scale, bh / 2 - 4 * scale, bw - 12 * scale, 3 * scale);
    ctx.restore();

    // Forearm and hand: a dark sleeve from the top edge, a faceless hand
    // gripping the shaft. No face, no identity, only the grip.
    var sleeveW = 46 * scale;
    ctx.fillStyle = '#211d19';
    ctx.beginPath();
    ctx.moveTo(gripX - sleeveW / 2 - 6 * scale, ry - 4);
    ctx.lineTo(gripX - sleeveW / 2 + 10 * scale, gripY + 6 * scale);
    ctx.lineTo(gripX + sleeveW / 2 + 10 * scale, gripY + 6 * scale);
    ctx.lineTo(gripX + sleeveW / 2 + 14 * scale, ry - 4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,' + alpha(0.05) + ')';
    ctx.fillRect(gripX - sleeveW / 2 - 4 * scale, ry, 2, gripY - ry + 6 * scale);
    // Hand: a closed grip around the shaft, drawn as a palm ellipse
    // straddling the shaft with fingers wrapping across its front.
    // No face, no identity, only the grip.
    ctx.fillStyle = '#b98d5f';
    ctx.beginPath();
    ctx.moveTo(gripX + 20 * scale, gripY);
    ctx.ellipse(gripX, gripY, 20 * scale, 14 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
    // Thumb bump on the near side of the shaft.
    ctx.fillStyle = '#a87c50';
    ctx.beginPath();
    ctx.moveTo(gripX + 12 * scale, gripY + 6 * scale);
    ctx.ellipse(gripX - 4 * scale, gripY + 7 * scale, 10 * scale, 6 * scale, -0.5, 0, Math.PI * 2);
    ctx.fill();
    // Finger lines wrapping across the shaft.
    ctx.strokeStyle = 'rgba(90,60,30,' + alpha(0.65) + ')';
    ctx.lineWidth = 1.4;
    for (var ki = -1; ki <= 1; ki++) {
      ctx.beginPath();
      ctx.moveTo(gripX - 12 * scale, gripY + ki * 7 * scale - 2 * scale);
      ctx.lineTo(gripX + 12 * scale, gripY + ki * 7 * scale - 2 * scale);
      ctx.stroke();
    }

    // Impact flash: a brief white tick spanning the struck group at the
    // strike point, plus a small radial burst. Gone in a third of a second.
    if (rs && waveAge < 0.5 && struck.length > 0) {
      var fa = Math.exp(-waveAge / 0.12);
      var topP = wirePoint(struck[0], 0.44, rx, ry, rw, rh);
      var botP = wirePoint(struck[struck.length - 1], 0.44, rx, ry, rw, rh);
      ctx.strokeStyle = 'rgba(255,255,255,' + alpha(0.9 * fa) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(sp.x, topP.y - 6);
      ctx.lineTo(sp.x, botP.y + 6);
      ctx.stroke();
      var fg = ctx.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, 46 * scale);
      fg.addColorStop(0, 'rgba(255,255,255,' + alpha(0.55 * fa) + ')');
      fg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.moveTo(sp.x + 46 * scale, sp.y);
      ctx.arc(sp.x, sp.y, 46 * scale, 0, Math.PI * 2);
      ctx.fill();
      // A white tick on each struck wire at the strike point.
      ctx.strokeStyle = 'rgba(255,255,255,' + alpha(0.75 * fa) + ')';
      ctx.lineWidth = 2.4;
      for (var fi = 0; fi < struck.length; fi++) {
        var fp = wirePoint(struck[fi], 0.44, rx, ry, rw, rh);
        ctx.beginPath();
        ctx.moveTo(fp.x - 5, fp.y);
        ctx.lineTo(fp.x + 5, fp.y);
        ctx.stroke();
      }
    }

    // Dust motes drifting in the light.
    for (var m = 0; m < MOTES.length; m++) {
      var mo = MOTES[m];
      var mx = rx + (mo.x + Math.sin(t * mo.sx + mo.px) * 0.02) * rw;
      var my = ry + (mo.y + Math.sin(t * mo.sy + mo.py) * 0.015) * rh;
      ctx.beginPath();
      ctx.moveTo(mx + mo.r, my);
      ctx.arc(mx, my, mo.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(240,210,160,' + alpha(mo.a) + ')';
      ctx.fill();
    }

    // Plates on canvas: title, date, hint.
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#9a917f';
    ctx.font = '600 13px system-ui, -apple-system, sans-serif';
    ctx.fillText('THE SHOVELER', rx + rw * 0.04, ry + rh * 0.055);
    ctx.fillStyle = '#7a7264';
    ctx.font = '11px system-ui, -apple-system, sans-serif';
    ctx.fillText('2007 · 01 · 12', rx + rw * 0.04, ry + rh * 0.055 + 16);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8a7a5e';
    ctx.font = '11px system-ui, -apple-system, sans-serif';
    ctx.fillText('WATCH ONLY · THE TOOL STRIKES 3, 6, THEN 9 WIRES',
      rx + rw / 2, ry + rh - 12);
  }

  // One synchronous frame at load: t = 60, fixed phase, between strikes.
  draw(60);
  tNow = 60;

  function onResize() { draw(tNow); }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);

  // Sound is optional and off by default; the visuals carry the piece.
  // Audio starts only from the button, never on load.
  var audioOn = false;
  var actx = null, master = null, droneNodes = [], nextStrikeK = 0, audioStart = 0;
  var btn = null;
  try { btn = document.getElementById('soundBtn'); } catch (e) { btn = null; }

  function strikeSound(when, n) {
    if (!actx || !master) return;
    var base = 55;
    var first = Math.floor((WIRES - n) / 2);
    for (var i = 0; i < n; i++) {
      var idx = first + i;
      var partials = [1, 2.76, 5.4];
      for (var q = 0; q < partials.length; q++) {
        var osc = actx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = base * partials[q] * (1 + idx * 0.004);
        var g = actx.createGain();
        var peak = 0.16 / (q + 1);
        g.gain.setValueAtTime(0, when);
        g.gain.linearRampToValueAtTime(peak, when + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, when + 1.4);
        osc.connect(g);
        g.connect(master);
        osc.start(when);
        osc.stop(when + 1.5);
      }
    }
    // Wooden crack: a short filtered noise burst.
    var len = Math.floor(actx.sampleRate * 0.05);
    var buf = actx.createBuffer(1, len, actx.sampleRate);
    var data = buf.getChannelData(0);
    for (var s = 0; s < len; s++) data[s] = (Math.random() * 2 - 1) * (1 - s / len);
    var src = actx.createBufferSource();
    src.buffer = buf;
    var bp = actx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 1800;
    bp.Q.value = 1.2;
    var ng = actx.createGain();
    ng.gain.value = 0.5;
    src.connect(bp);
    bp.connect(ng);
    ng.connect(master);
    src.start(when);
  }

  function scheduleAudio() {
    if (!audioOn || !actx) return;
    var now = actx.currentTime;
    var horizon = now + 1.5;
    while (true) {
      var tk = strikeTime(nextStrikeK);
      var when = audioStart + (tk - 60);
      if (when > horizon) break;
      if (when > now - 0.05) strikeSound(Math.max(when, now), groupSize(nextStrikeK));
      nextStrikeK++;
    }
  }

  function toggleSound() {
    if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return;
    if (!audioOn) {
      try {
        var AC = (typeof AudioContext !== 'undefined') ? AudioContext : webkitAudioContext;
        actx = new AC();
        master = actx.createGain();
        master.gain.value = 0;
        master.connect(actx.destination);
        master.gain.linearRampToValueAtTime(0.14, actx.currentTime + 2);
        // Sustained longitudinal drone bed: low partials, slow beating.
        var freqs = [55, 55.4, 110.3, 165.2];
        for (var d = 0; d < freqs.length; d++) {
          var o = actx.createOscillator();
          o.type = d < 2 ? 'sine' : 'triangle';
          o.frequency.value = freqs[d];
          var dg = actx.createGain();
          dg.gain.value = d < 2 ? 0.5 : 0.12;
          o.connect(dg);
          dg.connect(master);
          o.start();
          droneNodes.push(o);
        }
        audioStart = actx.currentTime;
        nextStrikeK = 0;
        while (strikeTime(nextStrikeK) < 60) nextStrikeK++;
        audioOn = true;
        if (btn) btn.textContent = 'SOUND ON';
        setInterval(scheduleAudio, 500);
      } catch (e) { audioOn = false; }
    } else {
      audioOn = false;
      try {
        for (var i = 0; i < droneNodes.length; i++) droneNodes[i].stop();
        if (actx) actx.close();
      } catch (e) {}
      droneNodes = [];
      actx = null;
      master = null;
      if (btn) btn.textContent = 'SOUND OFF';
    }
  }

  if (btn && btn.addEventListener) {
    btn.addEventListener('click', toggleSound);
  }

  if (reduced) return;

  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    tNow = 60 + (ts - start) / 1000;
    draw(tNow);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
