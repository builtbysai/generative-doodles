<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№8987 · Half a Million Grains - Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #efe8d8;
    color: #4a4238;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 4vmin 20px 6vmin;
    overflow: hidden;
  }
  header { text-align: center; margin-bottom: 2.5vmin; max-width: 660px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #a39a86; margin-bottom: 12px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; }
  header h1 .num { color: #c46a2d; }
  header p { color: #a39a86; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #6b5f4c; font-weight: normal; }
  #stage {
    background: #f7f2e4;
    box-shadow: 0 18px 60px rgba(90,70,40,0.25);
    border: 1px solid #ddd2b8;
    cursor: crosshair;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #controls {
    display: flex; gap: 12px; align-items: center; justify-content: center;
    margin-top: 2.2vmin; color: #a39a86; font-size: 13px; font-style: italic;
  }
  #controls button {
    background: #c46a2d; border: none; color: #f7f2e4;
    font-family: Georgia, serif; font-size: 14px; font-weight: bold;
    padding: 9px 22px; cursor: pointer; letter-spacing: 0.08em;
  }
  #controls button:hover { background: #d47a3a; }
  #count { color: #a39a86; font-size: 13px; font-style: italic; margin-top: 1.2vmin; }
  #count b { color: #c46a2d; font-weight: normal; }
  footer { margin-top: 2.2vmin; color: #b3a88f; font-size: 13px; font-style: italic; }
  footer a { color: #c46a2d; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№8987</span> · Half a Million Grains</h1>
  <p>Half a million grains of sandpaint, falling one by one. Nothing is drawn
  except dots, and the picture <b>emerges</b>. Click the paper for a burst.</p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<div id="controls">
  <button id="restart">RESTART</button>
  <span>watch it emerge, or click the paper to hurry it</span>
</div>
<div id="count"></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const countEl = document.getElementById('count');

let W = 0, H = 0, DPR = 1;
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(89870319);

// ridged mountain silhouettes from layered sine noise
function ridge(x, seed){
  return Math.sin(x * 3.1 + seed) * 0.5 + Math.sin(x * 7.7 + seed * 2.3) * 0.3
       + Math.sin(x * 15.3 + seed * 4.1) * 0.2;
}
const sunX = 0.62, sunY = 0.36, sunR = 0.085;
const backY = 0.58, frontY = 0.70;

// target density + color at normalized (x, y)
function field(x, y){
  // sun disc
  const ds = Math.hypot(x - sunX, (y - sunY) * 1.25);
  if (ds < sunR){
    const edge = ds / sunR;
    return { d: 1.0, c: [255 - edge * 40, 196 - edge * 50, 110 - edge * 40] };
  }
  // sun glow
  if (ds < sunR * 2.6){
    const t = (ds - sunR) / (sunR * 1.6);
    return { d: 0.5 * (1 - t), c: [255, 190 - t * 60, 130 - t * 60] };
  }
  const backRidge = backY + ridge(x, 1.7) * 0.045;
  const frontRidge = frontY + ridge(x, 4.2) * 0.05;
  if (y > frontRidge){
    const t = Math.min(1, (y - frontRidge) / 0.25);
    return { d: 0.55 + t * 0.2,
             c: [88 - t * 20 + ridge(x, 9.1) * 14, 52 - t * 12, 74 - t * 14] };
  }
  if (y > backRidge){
    const t = (y - backRidge) / (frontRidge - backRidge);
    return { d: 0.6,
             c: [104 - t * 16, 72 - t * 18, 118 - t * 40] };
  }
  // sky: denser near horizon, warmer near sun's height
  const horiz = 1 - y / backRidge;
  const warmth = Math.max(0, 1 - Math.hypot(x - sunX, y - sunY) * 2.2);
  return { d: 0.16 + horiz * 0.22,
           c: [96 + horiz * 90 + warmth * 70, 110 + horiz * 60 + warmth * 30, 168 - horiz * 60] };
}

let dots = 0, running = true;
const PER_FRAME = new URLSearchParams(location.search).get('fast') ? 40000 : 900;
function paintDot(burst){
  const n = burst || PER_FRAME;
  for (let i = 0; i < n; i++){
    const x = rnd(), y = rnd();
    const f = field(x, y);
    if (rnd() > f.d) continue;
    const j = () => (rnd() - 0.5) * 22;
    const r = Math.max(0, Math.min(255, f.c[0] + j())) | 0;
    const g = Math.max(0, Math.min(255, f.c[1] + j())) | 0;
    const b = Math.max(0, Math.min(255, f.c[2] + j())) | 0;
    ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + (0.10 + rnd() * 0.10).toFixed(2) + ')';
    const rad = (0.8 + rnd() * 1.8) * DPR;
    ctx.beginPath();
    ctx.arc(x * W * DPR, y * H * DPR, rad, 0, 7);
    ctx.fill();
    dots++;
  }
  countEl.innerHTML = '<b>' + dots.toLocaleString() + '</b> grains so far';
}

function restart(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#f7f2e4';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  dots = 0;
  countEl.innerHTML = '';
}

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.min(900, window.innerWidth - 40);
  H = Math.max(320, Math.min(560, window.innerHeight - 400));
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  canvas.width = W * DPR; canvas.height = H * DPR;
  restart();
}
window.addEventListener('resize', resize);

let raf = 0;
function loop(){
  if (running && dots < 600000) paintDot();
  raf = requestAnimationFrame(loop);
}
canvas.addEventListener('pointerdown', e => {
  const r = canvas.getBoundingClientRect();
  const cx = (e.clientX - r.left) / r.width, cy = (e.clientY - r.top) / r.height;
  const ox = cx, oy = cy;
  for (let i = 0; i < 9000; i++){
    const x = ox + (rnd() - 0.5) * 0.3, y = oy + (rnd() - 0.5) * 0.3;
    if (x < 0 || x > 1 || y < 0 || y > 1) continue;
    const f = field(x, y);
    if (rnd() > f.d * 1.4) continue;
    const j = () => (rnd() - 0.5) * 22;
    ctx.fillStyle = 'rgba(' +
      (Math.max(0, Math.min(255, f.c[0] + j())) | 0) + ',' +
      (Math.max(0, Math.min(255, f.c[1] + j())) | 0) + ',' +
      (Math.max(0, Math.min(255, f.c[2] + j())) | 0) + ',' +
      (0.10 + rnd() * 0.10).toFixed(2) + ')';
    ctx.beginPath();
    ctx.arc(x * W * DPR, y * H * DPR, (0.8 + rnd() * 1.8) * DPR, 0, 7);
    ctx.fill();
    dots++;
  }
});

document.getElementById('restart').addEventListener('click', restart);
resize();
loop();
</script>
</body>
</html>
