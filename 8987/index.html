<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Half a Million Grains — No.8987</title>
<!-- phantom-fill-8987 -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; background:#ece1c8; }
  canvas { display:block; width:100vw; height:100dvh; cursor:pointer; }
  .hud {
    position:fixed; top:0; left:0; right:0; padding:18px 22px 0;
    display:flex; justify-content:space-between; align-items:baseline;
    pointer-events:none; user-select:none; color:#2e2620;
  }
  .hud h1 { font-family:Georgia, "Times New Roman", serif; font-weight:400;
    font-size:20px; letter-spacing:.06em;
    background:rgba(236,225,200,.94); padding:2px 8px; }
  .hud .count { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size:11px; letter-spacing:.18em; text-align:right; line-height:1.8;
    background:rgba(236,225,200,.94); padding:2px 8px; }
  .hud .count b { font-weight:400; color:#8a6a3a; }
  .label {
    position:fixed; left:0; right:0; bottom:0; padding:14px 22px 16px;
    display:flex; justify-content:space-between; align-items:baseline;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color:#2e2620; pointer-events:none; user-select:none;
    font-size:11px; letter-spacing:.18em;
  }
  .label .t { text-transform:uppercase; letter-spacing:.28em; color:rgba(46,38,32,.85);
    background:rgba(236,225,200,.94); padding:2px 8px; }
  .label .n { color:rgba(46,38,32,.6); background:rgba(236,225,200,.94); padding:2px 8px; }
  #bar { position:fixed; left:0; bottom:0; height:2px; width:0%;
    background:#8a6a3a; pointer-events:none; }
  @media (max-width:640px) {
    .hud { padding:12px 14px 0; flex-direction:column; align-items:flex-start; gap:6px; }
    .hud h1 { font-size:15px; }
    .hud .count { font-size:10px; text-align:left; }
    .label { padding:12px 14px 14px; font-size:10px;
      flex-direction:column; align-items:flex-start; gap:6px; }
    .label .t { white-space:nowrap; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <h1>Half a Million Grains</h1>
  <div class="count"><span id="settled">0</span> / 500,000 grains<br><b id="state">falling</b></div>
</div>
<div class="label"><span class="t">Half a Million Grains</span><span class="n">No. 8987 &middot; nothing drawn but dots &middot; click the paper for a burst</span></div>
<div id="bar"></div>
<script>
(function () {
  // ---- The picture: a landscape described only as a density function.
  // Nothing is ever drawn except dots; the picture emerges from where
  // the grains are allowed to land. Coordinates are normalized 0..1.
  const TOTAL = 500000;
  const COLORS = ['#d9a441', '#a0805c', '#6b4e36', '#3d2f24',
                  '#4d6076', '#c9b78f', '#b4552d', '#2e2620'];
  const GOLD = 0, FAR = 1, NEAR = 2, FORE = 3, RIVER = 4, DUST = 5, RUST = 6, INK = 7;

  const ASPECT = 16 / 10; // normalized space is wider than tall
  function yFar(u)  { return 0.50 + 0.05 * Math.sin(u * 5.2 + 1.3) + 0.035 * Math.sin(u * 11.7 + 0.6); }
  function yNear(u) { return 0.66 + 0.045 * Math.sin(u * 3.9 + 0.4) + 0.03 * Math.sin(u * 9.1 + 2.2); }
  function riverX(v) { return 0.46 + 0.05 * Math.sin(v * 7.0); }
  function riverW(v) { return 0.02 + (v - 0.66) * 0.085; }
  // Two birds: chevrons made of two short segments each.
  const BIRDS = [
    [[0.30, 0.20], [0.318, 0.185], [0.336, 0.20]],
    [[0.385, 0.155], [0.40, 0.143], [0.415, 0.155]]
  ];
  function segDist(u, v, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const t = Math.max(0, Math.min(1, ((u - ax) * dx + (v - ay) * dy) / (dx * dx + dy * dy)));
    const px = ax + t * dx, py = ay + t * dy;
    return Math.hypot((u - px) * ASPECT, v - py);
  }
  function hash2(x, y) {
    const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  // Returns [colorIndex, density 0..1] for a normalized point.
  function sample(u, v) {
    const sunD = Math.hypot((u - 0.72) * ASPECT, v - 0.24);
    if (sunD < 0.105) return [GOLD, 0.96];
    for (const b of BIRDS) {
      if (segDist(u, v, b[0][0], b[0][1], b[1][0], b[1][1]) < 0.0022 ||
          segDist(u, v, b[1][0], b[1][1], b[2][0], b[2][1]) < 0.0022)
        return [INK, 0.95];
    }
    if (v < yFar(u)) return [DUST, 0.015]; // sky: almost empty paper
    if (v >= 0.66 && Math.abs(u - riverX(v)) < riverW(v)) return [RIVER, 0.9];
    if (v < yNear(u)) return [FAR, 0.85];
    if (v >= 0.86) {
      if (hash2(Math.floor(u * 46), Math.floor(v * 46)) < 0.09) return [RUST, 0.95];
      return [FORE, 0.95];
    }
    return [NEAR, 0.9];
  }

  // ---- Grain targets: 500k points, rejection-sampled from the density.
  const tx = new Float32Array(TOTAL);
  const ty = new Float32Array(TOTAL);
  const tc = new Uint8Array(TOTAL);
  (function seed() {
    let n = 0, guard = 0;
    while (n < TOTAL && guard++ < TOTAL * 12) {
      const u = Math.random(), v = Math.random();
      const s = sample(u, v);
      if (Math.random() < s[1]) { tx[n] = u; ty[n] = v; tc[n] = s[0]; n++; }
    }
    // Guard fallback (never expected): fill the rest with foreground dust.
    while (n < TOTAL) { tx[n] = Math.random(); ty[n] = 0.9 + Math.random() * 0.1; tc[n] = FORE; n++; }
  })();

  // ---- Rendering: one canvas + one offscreen accumulation canvas.
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const settledEl = document.getElementById('settled');
  const stateEl = document.getElementById('state');
  const barEl = document.getElementById('bar');
  const PAPER = '#ece1c8';

  let W, H, dpr, GS; // GS = grain size in device px
  let FX = 0, FY = 0, FW = 0, FH = 0; // letterboxed 16:10 picture frame
  function X(u) { return FX + u * FW; }
  function Y(v) { return FY + v * FH; }
  let paper = null, pctx = null;
  let next = 0;      // next grain index to release
  let settled = 0;
  let burstActive = 0;
  // Active grains, bucketed by colour so each frame sets fillStyle once per bucket.
  const buckets = COLORS.map(function () { return []; });
  const SPAWN = 120;      // grains released per frame (~70s for the full picture)
  const BURST_N = 2500;
  const BURST_FRAMES = 28;

  window.__grains = { total: TOTAL, settled: 0, burstActive: 0 };

  function rebuildPaper() {
    paper = document.createElement('canvas');
    paper.width = W * dpr; paper.height = H * dpr;
    pctx = paper.getContext('2d');
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // Redraw every settled grain at the new size, batched by colour.
    for (let b = 0; b < COLORS.length; b++) {
      pctx.fillStyle = COLORS[b];
      for (let i = 0; i < settled; i++) {
        if (tc[i] === b) pctx.fillRect(X(tx[i]), Y(ty[i]), GS / dpr, GS / dpr);
      }
    }
  }

  function settle(g) {
    pctx.fillStyle = COLORS[tc[g.i]];
    pctx.fillRect(X(tx[g.i]), Y(ty[g.i]), GS / dpr, GS / dpr);
    settled++;
  }

  function spawn(i, burst, bx, by) {
    const g = { i: i, x: 0, y: 0, vx: 0, vy: 0, mode: 'fall', age: 0 };
    if (burst) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 5.5;
      g.x = bx; g.y = by;
      g.vx = Math.cos(a) * sp; g.vy = Math.sin(a) * sp - 2;
      g.mode = 'burst';
      burstActive++;
    } else {
      g.x = X(tx[i]) + (Math.random() - 0.5) * 6;
      g.y = FY - 4 - Math.random() * 30;
      g.vy = 2 + Math.random() * 2;
    }
    buckets[tc[i]].push(g);
  }

  function frame() {
    // Release the next grains.
    for (let k = 0; k < SPAWN && next < TOTAL; k++) spawn(next++, false);
    burstActive = 0;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(paper, 0, 0, W, H);

    for (let b = 0; b < COLORS.length; b++) {
      const arr = buckets[b];
      ctx.fillStyle = COLORS[b];
      for (let j = arr.length - 1; j >= 0; j--) {
        const g = arr[j];
        g.age++;
        if (g.mode === 'burst') {
          g.vy += 0.16;
          g.x += g.vx; g.y += g.vy;
          g.vx *= 0.985;
          burstActive++;
          if (g.age > BURST_FRAMES) { g.mode = 'fall'; g.vy = 2; }
        } else {
          g.vy = Math.min(g.vy + 0.12, 9);
          g.y += g.vy;
          // Drift home toward the grain's own column as it falls.
          g.x += (X(tx[g.i]) - g.x) * 0.02;
          g.x += Math.sin(g.age * 0.3 + g.i) * 0.15;
        }
        const targetY = Y(ty[g.i]);
        if (g.mode === 'fall' && g.y >= targetY) {
          settle(g);
          arr[j] = arr[arr.length - 1];
          arr.pop();
        } else {
          ctx.fillRect(g.x, g.y, GS / dpr, GS / dpr);
        }
      }
    }

    if (settled >= TOTAL && stateEl.textContent !== 'complete') {
      stateEl.textContent = 'complete — the picture is only dots';
    }
    window.__grains.settled = settled;
    window.__grains.burstActive = burstActive;
    requestAnimationFrame(frame);
  }

  // Counter + progress bar, throttled to ~5Hz so the DOM stays out of the way.
  setInterval(function () {
    settledEl.textContent = settled.toLocaleString('en-US');
    barEl.style.width = (settled / TOTAL * 100) + '%';
  }, 200);

  function resize() {
    const oldFX = FX, oldFY = FY, oldFW = FW || 1, oldFH = FH || 1;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    GS = 2 * dpr;
    canvas.width = W * dpr; canvas.height = H * dpr;
    // Letterbox the 16:10 picture frame so the sun stays a circle on any screen.
    if (W / H > 1.6) { FH = H; FW = H * 1.6; FX = (W - FW) / 2; FY = 0; }
    else { FW = W; FH = W / 1.6; FX = 0; FY = (H - FH) / 2; }
    // Rescale falling grains into the new frame.
    for (const arr of buckets) for (const g of arr) {
      g.x = FX + (g.x - oldFX) * (FW / oldFW);
      g.y = FY + (g.y - oldFY) * (FH / oldFH);
    }
    rebuildPaper();
  }
  let rsT;
  window.addEventListener('resize', function () {
    clearTimeout(rsT);
    rsT = setTimeout(resize, 200);
  });

  canvas.addEventListener('click', function (e) {
    for (let k = 0; k < BURST_N && next < TOTAL; k++)
      spawn(next++, true, e.clientX, e.clientY);
  });

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
