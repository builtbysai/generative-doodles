<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>White Light Field</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #F2F0EB;
  }
  canvas {
    display: block;
    position: fixed;
    left: 0;
    top: 0;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- Palette (strict) ----
  var WHITE_A = '#F7F5F0';
  var WHITE_B = '#EFEDE6';
  var SILVER  = '#C9CBCB';
  var TAUPE   = '#B9B2A6';
  var GOLD    = '#F4E8C8'; // warm flare at maximum
  var GROUND  = '#F2F0EB';

  function rgba(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  // ---- Seeded RNG (mulberry32) ----
  function mulberry32(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---- Bands ----
  // Seven vertical bands, full bleed, one dominant center field.
  // Each band has a fixed "view angle" theta. Its flare is a tight lobe of
  // the angle between that view vector and the light azimuth:
  //   flare = pow(max(0, cos(theta - light)), 24) * weight + base
  // so a sweeping light ignites the bands one after another.
  var SWEEP_PERIOD = 30;      // seconds, idle light sweep
  var SWEEP_AMP = 1.35;       // radians, covers the theta spread
  var bands = [];
  (function buildBands() {
    var widths  = [0.11, 0.12, 0.13, 0.28, 0.13, 0.12, 0.11];
    var thetas  = [-1.26, -0.84, -0.42, 0, 0.42, 0.84, 1.26];
    var weights = [0.60, 0.72, 0.86, 1.00, 0.86, 0.72, 0.60];
    var bases   = [WHITE_B, WHITE_A, WHITE_B, WHITE_A, WHITE_B, WHITE_A, WHITE_B];
    var baseA   = [0.50, 0.42, 0.55, 0.40, 0.55, 0.42, 0.50];
    var x = 0;
    for (var i = 0; i < widths.length; i++) {
      bands.push({
        x: x, w: widths[i],
        theta: thetas[i], weight: weights[i],
        base: bases[i], baseA: baseA[i],
        grain: [], strokes: []
      });
      x += widths[i];
    }

    // Per-band microsphere grain: precomputed speckle dots, each with its
    // own density threshold. A dot only shows once the band's flare passes
    // its threshold, so the bead texture condenses out of the light.
    var grainTones = [SILVER, TAUPE, WHITE_A, TAUPE, SILVER];
    for (var b = 0; b < bands.length; b++) {
      var rndG = mulberry32(769100 + b * 977);
      var count = (b === 3) ? 620 : 430;
      for (var g = 0; g < count; g++) {
        bands[b].grain.push({
          x: rndG(),                 // normalized within band
          y: rndG(),                 // normalized over height
          s: 0.7 + rndG() * 1.6,     // px at 720 reference scale
          a: 0.10 + rndG() * 0.30,
          th: rndG() * 0.85,         // flare threshold for this bead
          c: grainTones[Math.floor(rndG() * grainTones.length)]
        });
      }
      // Per-band brushwork: horizontal gestural stroke stripes, revealed
      // only where the flare is strong (visibility gate near flare 0.4).
      var rndS = mulberry32(769500 + b * 613);
      var nStrokes = (b === 3) ? 34 : 26;
      for (var sIdx = 0; sIdx < nStrokes; sIdx++) {
        bands[b].strokes.push({
          y: rndS(),
          h: 0.004 + rndS() * 0.009,         // fraction of H
          x0: rndS() * 0.25,                 // start inset, fraction of band width
          len: 0.45 + rndS() * 0.55,         // fraction of band width
          a: 0.16 + rndS() * 0.26,
          c: (rndS() < 0.62) ? TAUPE : WHITE_A,
          wob: (rndS() - 0.5) * 0.006        // slight vertical drift across the stroke
        });
      }
    }
  })();

  function bandFlare(band, light) {
    var c = Math.cos(band.theta - light);
    if (c < 0) c = 0;
    return Math.pow(c, 24) * band.weight + 0.05;
  }

  function smooth01(v) {
    if (v <= 0) return 0;
    if (v >= 1) return 1;
    return v * v * (3 - 2 * v);
  }

  // ---- Light state ----
  // Idle: azimuth sweeps sinusoidally, anchored at (anchorAz, anchorT).
  // Drag: azimuth follows the pointer; on release the sweep re-anchors at
  // the dragged azimuth, so it resumes from where the visitor left it.
  // Everything is a closed-form function of recorded events and t.
  var anchorAz = 0, anchorT = 0;
  var dragging = false, dragAz = 0, dragStartX = 0, dragStartAz = 0;

  function lightAt(t) {
    if (dragging) return dragAz;
    return anchorAz + SWEEP_AMP * Math.sin((Math.PI * 2 / SWEEP_PERIOD) * (t - anchorT));
  }

  // ---- Canvas / viewport ----
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    var sw = (window.screen && window.screen.width) || 0;
    var sh = (window.screen && window.screen.height) || 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0 && minDim < 700) return true;
    // fallback only: aspect
    return H > W * 1.15;
  }

  function fit() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }

  function drawBand(band, light) {
    var bx = band.x * W;
    var bw = band.w * W;
    var flare = bandFlare(band, light);
    if (flare > 1) flare = 1;

    ctx.save();
    ctx.beginPath();
    ctx.rect(bx, 0, bw, H);
    ctx.clip();

    // Base tone: quiet variation between bands, nearly flat.
    ctx.fillStyle = rgba(band.base, band.baseA);
    ctx.fillRect(bx, 0, bw, H);
    // A whisper of silver in every band so no band is a flat solid.
    ctx.fillStyle = rgba(SILVER, 0.10);
    ctx.fillRect(bx, 0, bw, H);

    // Flare wash: the band warms toward gold and lifts toward white.
    if (flare > 0.02) {
      ctx.fillStyle = rgba(GOLD, flare * 0.52);
      ctx.fillRect(bx, 0, bw, H);
      ctx.fillStyle = rgba(WHITE_A, flare * 0.22);
      ctx.fillRect(bx, 0, bw, H);
    }

    // Brushwork: horizontal strokes, visible only in strong flare.
    var vis = smooth01((flare - 0.38) / 0.45);
    if (vis > 0.01) {
      for (var i = 0; i < band.strokes.length; i++) {
        var st = band.strokes[i];
        var sy = st.y * H;
        var sh = Math.max(1, st.h * H);
        var sx = bx + st.x0 * bw;
        var swd = st.len * bw;
        ctx.fillStyle = rgba(st.c, st.a * vis);
        // two stacked slices with a slight vertical wobble: a hand-dragged feel
        ctx.fillRect(sx, sy, swd, sh * 0.55);
        ctx.fillRect(sx + swd * 0.06, sy + sh * 0.5 + st.wob * H, swd * 0.88, sh * 0.5);
      }
    }

    // Microsphere grain: each bead appears as flare passes its threshold.
    var gs = Math.max(1, H / 720);
    for (var g = 0; g < band.grain.length; g++) {
      var p = band.grain[g];
      var span = 1 - p.th;
      var k = (flare - p.th) / (span > 0.05 ? span : 0.05);
      if (k <= 0) continue;
      if (k > 1) k = 1;
      ctx.fillStyle = rgba(p.c, p.a * k);
      var sz = p.s * gs;
      ctx.fillRect(bx + p.x * bw, p.y * H, sz, sz);
    }

    ctx.restore();

    // Hairline seam between bands.
    ctx.fillStyle = rgba(TAUPE, 0.16);
    ctx.fillRect(bx + bw - 1, 0, 1, H);
  }

  function draw(t) {
    // pin CSS size in px every frame
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    var light = lightAt(t);
    for (var i = 0; i < bands.length; i++) {
      drawBand(bands[i], light);
    }
  }

  fit();
  draw(0); // frame one: synchronous, sweep t=0, center band at full flare

  var lastT = 0;
  function onResize() {
    fit();
    draw(lastT);
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);

  // ---- Drag: the light azimuth follows the hand ----
  function pointerX(e) {
    if (e.clientX !== undefined) return e.clientX;
    if (e.touches && e.touches.length) return e.touches[0].clientX;
    if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientX;
    return 0;
  }
  function onDown(e) {
    dragging = true;
    dragStartX = pointerX(e);
    dragStartAz = lightAt(lastT);
    dragAz = dragStartAz;
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var dx = pointerX(e) - dragStartX;
    // one full frame width of drag sweeps the whole theta range and back
    dragAz = dragStartAz + (dx / Math.max(1, W)) * Math.PI * 2 * 0.45;
    draw(lastT);
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    // resume the idle sweep from the dragged azimuth
    anchorAz = dragAz;
    anchorT = lastT;
    draw(lastT);
  }
  if (window.PointerEvent) {
    canvas.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  } else {
    canvas.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onUp);
    window.addEventListener('touchcancel', onUp);
  }

  var startTs = null;
  function frame(ts) {
    if (startTs === null) startTs = ts;
    var t = (ts - startTs) / 1000;
    lastT = t;
    draw(t);
    window.requestAnimationFrame(frame);
  }
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
