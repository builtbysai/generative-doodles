<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№5 · Contours</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f4efe3; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(74,62,42,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(244,239,227,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another contours</div>
<script>
'use strict';
// No5 Contours.
// Sixty horizontal lines on paper white, each one displaced by the
// same slow wave whose phase drifts a little more on every line, so
// the wave seems to travel down the page as it crosses. One ink, no
// fill, and most of the page left empty: the calm is the point. The
// build measures the total phase drift from first line to last; under
// a quarter turn the lines sit in lockstep and the piece is a comb,
// over two turns it churns, so seeds are gated between the two.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '5', 10) || 5;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f4efe3';
const INK = 'rgba(43,40,34,0.85)';

function compose(s) {
  const rnd = mulberry32(s);
  const drift = (0.35 + rnd() * 1.3) * (rnd() < 0.5 ? 1 : -1);   // total turns, in radians x 2pi scale below
  return {
    k1: 0.9 + rnd() * 0.9,
    k2: 2.3 + rnd() * 1.6,
    a1: 0.55 + rnd() * 0.4,            // amplitude share of line spacing
    a2: 0.16 + rnd() * 0.14,
    p0: rnd() * Math.PI * 2,
    driftTurns: drift,
    ok: Math.abs(drift) >= 0.30 && Math.abs(drift) <= 1.75
  };
}

function buildPiece(baseSeed) {
  let best = null;
  for (let attempt = 0; attempt < 16; attempt++) {
    const p = compose((baseSeed + attempt * 0x9E3779B9) >>> 0);
    if (!best) best = p;
    if (p.ok) return p;
  }
  return best;
}

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: physical screen size, aspect only as fallback.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  const LINES = 60;
  const spacing = RY / (LINES + 6);
  const top = oy + spacing * 3;
  ctx.strokeStyle = INK;
  ctx.lineWidth = Math.max(0.8, RY / 900);
  const SEGS = 140;
  for (let j = 0; j < LINES; j++) {
    const f = j / (LINES - 1);
    const ph = p.p0 + p.driftTurns * Math.PI * 2 * f;
    ctx.beginPath();
    for (let k = 0; k <= SEGS; k++) {
      const u = k / SEGS;
      const y = top + j * spacing
        + Math.sin(u * p.k1 * Math.PI * 2 + ph) * spacing * p.a1
        + Math.sin(u * p.k2 * Math.PI * 2 + ph * 1.7) * spacing * p.a2;
      const x = ox + u * RX;
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
