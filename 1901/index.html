<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1901 Pipes</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0c; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette, hand-picked from the named colors in the prompt.
  var STAGE = '#0a0a0c';     // near-black stage
  var STAGE_DEEP = '#050506';
  var FLOOR = '#101013';
  var PIPE = '#e8e6e0';      // matte white PVC
  var PIPE_SHADE = '#b9b6ad';
  var PIPE_DARK = '#8f8c84';
  var TAPE = '#6e6c66';
  var RING_CYAN = '#a9d6de'; // pale cyan overtone ring, fresh
  var RING_GREY = '#8f8f8f'; // the same ring, faded to grey
  var COLLIDE = '#f5efe4';   // warm white collision field
  var FIGURE = '#17171a';    // players, barely out of the dark
  var FIGURE_RIM = '#33333a';
  var PLATE = '#e8e6e0';
  var PLATE_DIM = '#8a8a86';

  // Fixed-phase first frame: t = 11.5 s. Phase 11.5 sits late inside the
  // both-blow window (8 to 12 s of the 16 s cycle): the rings born at 8 s
  // have had 3.5 s to grow, so the lowest partials are already large open
  // circles well wider than the pipe bundle, fresh rings from both players
  // are still leaving the mouths, and one collision field is forming at
  // midline. Frame one is byte-reproducible: every ring is a pure
  // function of t.
  var FIRST_T = 11.5;

  // Breath cycle, 16 s, pure function of t. A blows 0 to 4, B blows 4 to 8,
  // both blow together 8 to 12, the stage rests 12 to 16.
  var CYCLE = 16;
  var PARTIALS = 6;          // overtone series, integer partials 1 to 6
  var STAGGER = 0.45;        // seconds between one partial's birth and the next
  var LIFE = 6;              // seconds a ring lives before fading out

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hash(i) {
    var x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function hexLerp(h1, h2, t) {
    var r1 = parseInt(h1.slice(1, 3), 16), g1 = parseInt(h1.slice(3, 5), 16), b1 = parseInt(h1.slice(5, 7), 16);
    var r2 = parseInt(h2.slice(1, 3), 16), g2 = parseInt(h2.slice(3, 5), 16), b2 = parseInt(h2.slice(5, 7), 16);
    var r = Math.round(lerp(r1, r2, t)), g = Math.round(lerp(g1, g2, t)), b = Math.round(lerp(b1, b2, t));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function hexA(h, a) {
    // Accept '#rrggbb' and 'rgb(r,g,b)' (hexLerp returns rgb()); the old
    // version sliced rgb() as hex, producing rgba(NaN,...) and invisible strokes.
    var m = /^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/.exec(h);
    if (m) { return 'rgba(' + m[1] + ',' + m[2] + ',' + m[3] + ',' + a4(a) + ')'; }
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      stageH = vh * 0.94;
      stageW = Math.min(vw * 0.72, stageH * 0.92);
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // Pipe mouths: six pipes in a bundle, staggered tops. Partials 1 to 3
  // leave from the left half (player A), 4 to 6 from the right (player B),
  // so the two ring fields meet and collide at midline.
  function pipeGeom() {
    var cx = W / 2;
    var scale = clamp(Math.min(W, H) / 520, 0.62, 1.35);
    var pipeW = 30 * scale;
    var gap = 3 * scale;
    var mouthY = H * 0.40;
    var baseY = H * 0.80;
    var mouths = [];
    for (var p = 0; p < 6; p++) {
      var x = cx + (p - 2.5) * (pipeW + gap);
      var top = mouthY + (hash(p + 1) - 0.5) * 16 * scale;
      mouths.push({ x: x, top: top, w: pipeW });
    }
    return { cx: cx, scale: scale, pipeW: pipeW, mouthY: mouthY, baseY: baseY, mouths: mouths };
  }

  // Breath state at time t. Returns 0 (rest), 1 (A only), 2 (B only), 3 (both).
  function breathState(t) {
    var ph = t - Math.floor(t / CYCLE) * CYCLE;
    if (ph < 4) { return 1; }
    if (ph < 8) { return 2; }
    if (ph < 12) { return 3; }
    return 0;
  }
  function playerBlowing(player, t) {
    var s = breathState(t);
    if (player === 0) { return s === 1 || s === 3; }
    return s === 2 || s === 3;
  }
  // All rings alive at time t: {x, y, r, a, col, player, partial}.
  // Ring radius grows at a rate tied to partial number, and lower partials
  // reach larger radii: speed falls as partial number rises.
  // Blow starts per cycle: A blows at the cycle start and again in the
  // both window; B blows mid-cycle and again in the both window.
  function ringsAt(t, g) {
    var rings = [];
    var unit = Math.min(W, H);
    var starts = [[0, 8], [4, 8]];
    for (var player = 0; player < 2; player++) {
      // Rings born in this cycle and the previous one may still be alive.
      for (var k = -1; k <= 0; k++) {
        var base = Math.floor(t / CYCLE) * CYCLE + k * CYCLE;
        for (var s = 0; s < starts[player].length; s++) {
          var start = base + starts[player][s];
          for (var p = 1; p <= PARTIALS; p++) {
            var m = g.mouths[p - 1];
            var birth = start + (p - 1) * STAGGER;
            var age = t - birth;
            if (age < 0 || age > LIFE) { continue; }
            // Rings are stroked open circles, never filled dots. They grow
            // fast: the lowest partial reaches a radius more than twice the
            // bundle width well within its 6 s life, and lower partials are
            // clearly larger than higher ones at any shared age. Fading is
            // gentle (exponent 0.8) so a large older ring is still plainly
            // visible instead of shrinking to a faint dot.
            var speed = unit * 0.16 / Math.pow(p, 0.45);
            var r = age * speed;
            var fade = Math.pow(1 - age / LIFE, 0.8);
            var rise = Math.min(1, age * 3);
            var a = 0.70 * fade * rise;
            var col = hexLerp(RING_CYAN, RING_GREY, age / LIFE);
            rings.push({ x: m.x, y: m.top, r: r, a: a, col: col, player: player, partial: p, lw: Math.max(1.4, 3.6 - p * 0.32) });
          }
        }
      }
    }
    return rings;
  }

  // Circle-circle intersection points, for the collision field.
  function intersections(c1, c2) {
    var dx = c2.x - c1.x, dy = c2.y - c1.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < 0.001 || d > c1.r + c2.r || d < Math.abs(c1.r - c2.r)) { return []; }
    var a = (c1.r * c1.r - c2.r * c2.r + d * d) / (2 * d);
    var h2 = c1.r * c1.r - a * a;
    if (h2 < 0) { return []; }
    var h = Math.sqrt(h2);
    var xm = c1.x + a * dx / d, ym = c1.y + a * dy / d;
    var rx = -dy * (h / d), ry = dx * (h / d);
    return [{ x: xm + rx, y: ym + ry }, { x: xm - rx, y: ym - ry }];
  }

  function drawFigure(side, t, g) {
    // A player cropped at the frame edge: head and shoulders only, barely
    // out of the dark, with a small breath lamp that brightens while blowing.
    var scale = g.scale;
    var fx = side === 0 ? -W * 0.01 : W * 1.01;
    var fy = H * 0.88;
    var headR = 26 * scale;
    var blowing = playerBlowing(side, t);
    var lamp = blowing ? 0.5 + 0.5 * Math.sin(t * 1.4) * 0.2 : 0.10;
    ctx.fillStyle = FIGURE;
    ctx.beginPath(); ctx.moveTo(fx, H); ctx.lineTo(fx, fy + 10 * scale);
    ctx.quadraticCurveTo(fx + (side === 0 ? 1 : -1) * W * 0.16, fy - 34 * scale,
                         fx + (side === 0 ? 1 : -1) * W * 0.30, fy + 26 * scale);
    ctx.lineTo(fx + (side === 0 ? 1 : -1) * W * 0.30, H);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = FIGURE;
    ctx.beginPath(); ctx.arc(fx, fy - 34 * scale, headR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = hexA(FIGURE_RIM, 0.8);
    ctx.lineWidth = 1.2 * scale;
    ctx.beginPath(); ctx.arc(fx, fy - 34 * scale, headR, side === 0 ? -Math.PI * 0.45 : Math.PI * 0.55, side === 0 ? Math.PI * 0.45 : Math.PI * 1.45); ctx.stroke();
    // Breath lamp: a small pale dot at the player's mouth side.
    var lx = fx + (side === 0 ? 1 : -1) * headR * 0.55;
    var ly = fy - 34 * scale + headR * 0.25;
    ctx.fillStyle = hexA(RING_CYAN, a4(0.15 + 0.65 * lamp));
    ctx.beginPath(); ctx.arc(lx, ly, 3.2 * scale, 0, Math.PI * 2); ctx.fill();
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Near-black stage.
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, STAGE);
    bg.addColorStop(1, STAGE_DEEP);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    var g = pipeGeom();
    var scale = g.scale;

    // Floor line under the bundle.
    ctx.strokeStyle = hexA('#2a2a30', 0.7);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W * 0.18, g.baseY + 2); ctx.lineTo(W * 0.82, g.baseY + 2); ctx.stroke();
    ctx.fillStyle = FLOOR;
    ctx.fillRect(0, g.baseY + 3, W, H - g.baseY - 3);

    // The two players, cropped at the frame edges.
    drawFigure(0, t, g);
    drawFigure(1, t, g);

    // The pipe bundle: six matte white pipes taped together.
    for (var i = 0; i < 6; i++) {
      var m = g.mouths[i];
      var px = m.x - m.w / 2;
      var grad = ctx.createLinearGradient(px, 0, px + m.w, 0);
      grad.addColorStop(0, PIPE_SHADE);
      grad.addColorStop(0.28, PIPE);
      grad.addColorStop(0.75, PIPE);
      grad.addColorStop(1, PIPE_DARK);
      ctx.fillStyle = grad;
      ctx.fillRect(px, m.top, m.w, g.baseY - m.top);
      // Dark mouth opening.
      ctx.fillStyle = '#0c0c0e';
      ctx.beginPath(); ctx.moveTo(px + 1.5, m.top); ctx.lineTo(px + m.w - 1.5, m.top);
      ctx.lineTo(px + m.w - 4, m.top + 5 * scale); ctx.lineTo(px + 4, m.top + 5 * scale);
      ctx.closePath(); ctx.fill();
      // Rim highlight on the mouth lip.
      ctx.strokeStyle = hexA(PIPE, 0.85);
      ctx.lineWidth = 1 * scale;
      ctx.beginPath(); ctx.moveTo(px + 2, m.top + 0.5); ctx.lineTo(px + m.w - 2, m.top + 0.5); ctx.stroke();
    }
    // Tape bands binding the bundle.
    ctx.fillStyle = hexA(TAPE, 0.9);
    var bandY1 = lerp(g.mouthY, g.baseY, 0.34);
    var bandY2 = lerp(g.mouthY, g.baseY, 0.62);
    ctx.fillRect(g.mouths[0].x - g.mouths[0].w / 2 - 1, bandY1, (g.mouths[5].x + g.mouths[5].w / 2) - (g.mouths[0].x - g.mouths[0].w / 2) + 2, 7 * scale);
    ctx.fillRect(g.mouths[0].x - g.mouths[0].w / 2 - 1, bandY2, (g.mouths[5].x + g.mouths[5].w / 2) - (g.mouths[0].x - g.mouths[0].w / 2) + 2, 7 * scale);

    // Overtone rings, additive, allowed to leave the frame.
    var rings = ringsAt(t, g);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var ri = 0; ri < rings.length; ri++) {
      var rg = rings[ri];
      ctx.strokeStyle = hexA(rg.col, a4(rg.a));
      ctx.lineWidth = rg.lw * scale;
      ctx.beginPath(); ctx.moveTo(rg.x + rg.r, rg.y); ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2); ctx.stroke();
    }
    // Collision field: where a ring from A meets a ring from B, mark the
    // crossing points in warm white and wash the midline with a soft glow.
    // Only intersections of rings that are themselves visibly drawn get a
    // mark: a crossing of two faded-out rings must not leave a stray dot
    // floating far from the bundle with no visible ring through it.
    var both = breathState(t) === 3;
    var collidePts = [];
    for (var a = 0; a < rings.length; a++) {
      for (var b = a + 1; b < rings.length; b++) {
        if (rings[a].player === rings[b].player) { continue; }
        var vis = Math.min(rings[a].a, rings[b].a);
        if (vis < 0.12) { continue; }
        var pts = intersections(rings[a], rings[b]);
        for (var q = 0; q < pts.length; q++) {
          collidePts.push({ x: pts[q].x, y: pts[q].y, a: vis });
        }
      }
    }
    if (both && collidePts.length) {
      var glow = ctx.createRadialGradient(g.cx, g.mouthY - H * 0.06, 4, g.cx, g.mouthY - H * 0.06, H * 0.30);
      glow.addColorStop(0, hexA(COLLIDE, 0.10));
      glow.addColorStop(1, hexA(COLLIDE, 0));
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H * 0.7);
    }
    for (var ci = 0; ci < collidePts.length; ci++) {
      var cp = collidePts[ci];
      // Mark alpha tracks the rings it sits on, so a mark is never
      // brighter than the rings crossing there.
      ctx.fillStyle = hexA(COLLIDE, a4(0.85 * cp.a));
      ctx.beginPath(); ctx.arc(cp.x, cp.y, 3.4 * scale, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = hexA(COLLIDE, a4(0.45 * cp.a));
      ctx.lineWidth = 1 * scale;
      ctx.beginPath(); ctx.moveTo(cp.x + 7 * scale, cp.y); ctx.arc(cp.x, cp.y, 7 * scale, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();

    // Title plate, drawn on the canvas, top-left. The bundle sits low and
    // centered, so the plate clears it on desktop and phone alike.
    var fs1 = Math.round((isPhone ? 21 : 20) * clamp(W / 420, 0.85, 1.15));
    var fs2 = Math.round(fs1 * 0.66);
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = PLATE;
    ctx.font = '600 ' + fs1 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Pipes', 18, 34);
    ctx.fillStyle = PLATE_DIM;
    ctx.font = fs2 + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1901 · 2007 · 03 · 27', 18, 34 + fs2 + 8);
    ctx.fillStyle = hexA(PLATE_DIM, 0.9);
    ctx.textAlign = 'center';
    ctx.fillText('Watch the breath turn.', W / 2, H - 20);
    ctx.textAlign = 'left';
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop. Guarded so node-canvas QA (no requestAnimationFrame) still works.
  // Watch only: no pointer handlers, no audio. All motion runs near 1 Hz,
  // well under the 14 Hz ceiling.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
