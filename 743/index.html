<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dream Blots</title>
<style>
  html, body { margin: 0; padding: 0; background: #ECE5D3; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  "use strict";

  var PAPER = "#ECE5D3";    // aged paper ground
  // The six dream colors. One per blot, never mixed within a scene.
  var DREAM = ["#C98A8A", "#2E6B66", "#C99A3C", "#6B5B8A", "#7A8A4A", "#C25E3C"];
  // dusty rose, deep teal, ochre, slate violet, moss, ember

  var CYCLE = 12;           // seconds per blot: reveal, fold, hold 6 s, fade
  var BASE_SEED = 74310231;

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");

  var W = 0, H = 0, DPR = 1;

  function isPhone() {
    try {
      var sw = window.screen ? window.screen.width : 0;
      var sh = window.screen ? window.screen.height : 0;
      var mn = Math.min(sw, sh);
      if (mn > 0 && mn < 700) return true;
    } catch (e) {}
    return H > W * 1.15;
  }

  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
  window.addEventListener("resize", resize);
  resize();

  // mulberry32: independent seeded streams from fixed constants.
  function makeRng(seed) {
    var s = seed | 0;
    return function () {
      s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // The fixed dream sequence for this run: the six tones shuffled once from
  // the base seed, with two seeded repeats drawn back in, for eight steps.
  // The order never changes within the run; only the blot shapes keep
  // varying, seeded per absolute blot index.
  var ORDER = (function () {
    var r = makeRng(BASE_SEED ^ 0x0DE7);
    var idx = [0, 1, 2, 3, 4, 5];
    for (var i = idx.length - 1; i > 0; i--) {
      var j = Math.floor(r() * (i + 1));
      var tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
    }
    var extra1 = Math.floor(r() * 6), extra2 = Math.floor(r() * 6);
    var pos1 = 1 + Math.floor(r() * 5), pos2 = pos1 + 1 + Math.floor(r() * (7 - pos1));
    idx.splice(pos1, 0, extra1);
    idx.splice(pos2, 0, extra2);
    return idx; // length 8
  })();

  // ---- blot construction -------------------------------------------------
  // A blot is a seeded set of overlapping wobbled ellipses on the LEFT half.
  // Each outline is a polygon whose radius is perturbed by three seeded
  // harmonics, so no outline is ever a perfect ellipse. The right half is
  // the exact reflection of the computed left points: the mirror fold is
  // sacred, nothing on the right is generated independently.
  var SEG = 56;
  function buildBlot(k) {
    var r = makeRng((BASE_SEED ^ Math.imul(k + 1, 0x9E3779B9)) | 0);
    var n = 7 + Math.floor(r() * 4); // 7..10 ellipses
    var els = [];
    for (var i = 0; i < n; i++) {
      var big = i < 2; // two larger masses anchor the fold
      var e = {
        cx: big ? (-0.10 + r() * 0.12) : (-0.30 + r() * 0.32),
        cy: big ? (-0.12 + r() * 0.24) : (-0.30 + r() * 0.60),
        rx: big ? (0.13 + r() * 0.05) : (0.05 + r() * 0.11),
        ry: big ? (0.12 + r() * 0.05) : (0.04 + r() * 0.11),
        rot: (r() - 0.5) * 1.9,
        a1: 0.03 + r() * 0.05, p1: r() * Math.PI * 2,
        a2: 0.02 + r() * 0.04, p2: r() * Math.PI * 2,
        a3: 0.01 + r() * 0.03, p3: r() * Math.PI * 2,
        rank: 0
      };
      els.push(e);
    }
    // Reveal order: a seeded shuffle of ranks, then the ellipse nearest the
    // fold is swapped into rank 0 so the first ink touches at the fold.
    var order = [];
    for (var a = 0; a < n; a++) order.push(a);
    for (var b = n - 1; b > 0; b--) {
      var j2 = Math.floor(r() * (b + 1));
      var t2 = order[b]; order[b] = order[j2]; order[j2] = t2;
    }
    for (var c = 0; c < n; c++) els[order[c]].rank = c;
    var near = 0, nearD = Infinity;
    for (var d = 0; d < n; d++) {
      var dd = Math.abs(els[d].cx) + Math.abs(els[d].cy) * 0.5;
      if (dd < nearD) { nearD = dd; near = d; }
    }
    var holder = null;
    for (var f = 0; f < n; f++) if (els[f].rank === 0) holder = f;
    if (holder !== null && holder !== near) {
      els[holder].rank = els[near].rank;
      els[near].rank = 0;
    }
    // Precompute each outline once, in blot units, left half only.
    for (var g = 0; g < n; g++) {
      var e2 = els[g];
      var pts = [];
      for (var sIdx = 0; sIdx < SEG; sIdx++) {
        var th = (sIdx / SEG) * Math.PI * 2;
        var wob = 1 + e2.a1 * Math.sin(2 * th + e2.p1)
                    + e2.a2 * Math.sin(3 * th + e2.p2)
                    + e2.a3 * Math.sin(5 * th + e2.p3);
        var lx = Math.cos(th) * e2.rx * wob;
        var ly = Math.sin(th) * e2.ry * wob;
        var co = Math.cos(e2.rot), si = Math.sin(e2.rot);
        pts.push({ x: e2.cx + lx * co - ly * si, y: e2.cy + lx * si + ly * co });
      }
      e2.pts = pts;
    }
    return { color: DREAM[ORDER[k % ORDER.length]], els: els };
  }

  var blotCacheIdx = -1, blotCache = null;
  function getBlot(k) {
    if (k !== blotCacheIdx) { blotCache = buildBlot(k); blotCacheIdx = k; }
    return blotCache;
  }

  function smooth(x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    return x * x * (3 - 2 * x);
  }

  // ---- interaction: double-tap skips to the next dream -------------------
  // Skips are recorded events: an index offset plus a new cycle origin.
  var skipBase = 0;      // blot index that sits at skipOrigin
  var skipOrigin = 0;    // elapsed time at which skipBase began phase 0
  var lastTapAt = -10;
  var elapsedNow = 0;

  function cyclePos(t) {
    var rel = t - skipOrigin;
    if (rel < 0) rel = 0;
    var idx = skipBase + Math.floor(rel / CYCLE);
    var ct = rel - Math.floor(rel / CYCLE) * CYCLE;
    return { idx: idx, ct: ct };
  }

  function onTap() {
    var now = elapsedNow;
    if (now - lastTapAt < 0.35) {
      var pos = cyclePos(now);
      skipBase = pos.idx + 1;
      skipOrigin = now;
      lastTapAt = -10;
    } else {
      lastTapAt = now;
    }
  }
  if (canvas.addEventListener) canvas.addEventListener("pointerdown", onTap);

  // ---- drawing -------------------------------------------------------------
  function draw(tSec) {
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);

    var pos = cyclePos(tSec);
    var blot = getBlot(pos.idx);
    var ct = pos.ct;

    // Cycle phases (seconds): left reveal 0..~3.3, fold 3.1..4.1,
    // hold 4.1..10.1, fade 10.1..11.4, bare paper 11.4..12.
    var fadeA = 1 - smooth((ct - 10.1) / 1.3);
    var S = Math.min(W, H) * 0.92;
    var CX = W / 2, CY = H * 0.46;
    var phone = isPhone();

    ctx.fillStyle = blot.color;

    var i, e, p, pts, px, py;
    // LEFT half: ellipses appear in seeded rank order, growing from a seed
    // of themselves with an ink-bleed edge that settles as each completes.
    for (i = 0; i < blot.els.length; i++) {
      e = blot.els[i];
      var start = -0.15 + e.rank * 0.32;
      var rp = (ct - start) / 0.6;
      if (rp <= 0) continue;
      if (rp > 1) rp = 1;
      var grow = 0.55 + 0.45 * smooth(rp);
      var bleed = (1 - rp) * 0.016;
      ctx.globalAlpha = fadeA * Math.min(1, rp * 1.6);
      pts = e.pts;
      ctx.beginPath();
      for (p = 0; p < pts.length; p++) {
        var bx = e.cx + (pts[p].x - e.cx) * grow;
        var by = e.cy + (pts[p].y - e.cy) * grow;
        if (bleed > 0) {
          var dx = pts[p].x - e.cx, dy = pts[p].y - e.cy;
          var dl = Math.sqrt(dx * dx + dy * dy) || 1;
          var jig = bleed * Math.sin(p * 7.31 + e.rank * 3.17 + rp * 22.0);
          bx += (dx / dl) * jig;
          by += (dy / dl) * jig;
        }
        px = CX + bx * S;
        py = CY + by * S;
        if (p === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    }
    // RIGHT half: the same points reflected across the fold, unfolding from
    // the fold line. At fold progress 1 the geometry is the exact mirror.
    for (i = 0; i < blot.els.length; i++) {
      e = blot.els[i];
      var fp = smooth((ct - 3.1 - e.rank * 0.03) / 0.8);
      if (fp <= 0) continue;
      if (fadeA <= 0) continue;
      ctx.globalAlpha = fadeA * Math.min(1, fp * 1.4);
      pts = e.pts;
      ctx.beginPath();
      for (p = pts.length - 1; p >= 0; p--) {
        px = CX + (-pts[p].x * fp) * S;
        py = CY + pts[p].y * S;
        if (p === pts.length - 1) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Caption: the only text on the piece, in the blot's own color. During
    // the reveal it starts faint and deepens as the blot completes.
    ctx.globalAlpha = 0.25 + 0.5 * smooth((ct - 0.4) / 2.6);
    ctx.fillStyle = blot.color;
    ctx.font = (phone ? 11 : 13) + "px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText("dream color, unverified", W / 2, H - (phone ? 12 : 16));
    ctx.globalAlpha = 1;
  }

  // ---- time ----------------------------------------------------------------
  // Forced-state hook for QA renders: ?seed=tNN draws one frame at NN
  // seconds and stops. Inert in the gallery, where the URL carries no query.
  var FORCED = null;
  if (typeof location !== "undefined" && location.search) {
    var m = String(location.search).match(/seed=t(\d+(?:\.\d+)?)/);
    if (m) FORCED = parseFloat(m[1]);
  }
  if (FORCED !== null) {
    draw(FORCED);
  } else {
    // Frame one: the synchronous draw at t = 0, first ink at the fold.
    draw(0);
    var t0 = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
    var frame = function (now) {
      elapsedNow = (now - t0) / 1000;
      draw(elapsedNow);
      if (typeof requestAnimationFrame === "function") requestAnimationFrame(frame);
    };
    if (typeof requestAnimationFrame === "function") requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
