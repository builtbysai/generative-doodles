<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№22 · Bricks</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f0e9d8; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(74,62,42,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(240,233,216,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another bricks</div>
<script>
'use strict';
// No22 Bricks.
// A stretcher-bond brick wall drawn as outlines only: rows of bricks,
// alternate rows offset by half a brick, each brick a stroked rounded
// rectangle in a single warm charcoal on cream, mortar showing as the
// paper between. Imperfections by rule: each row has a slight seeded
// horizontal drift, brick heights vary a breath per row, and every
// row hides exactly one vermilion brick. The wall fills its field
// edge to edge; nothing decorates it.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '22', 10) || 22;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f0e9d8';

function compose(s) {
  const rnd = mulberry32(s);
  const rows = [];
  const n = 14;
  for (let j = 0; j < n; j++) {
    rows.push({
      drift: (rnd() - 0.5) * 0.02,
      hVar: 0.92 + rnd() * 0.16,
      redAt: (rnd() * 6) | 0
    });
  }
  return { rows };
}

function buildPiece(baseSeed) { return compose(baseSeed >>> 0); }

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  // Phone layout: physical screen size, aspect only as fallback.
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  const ox = (w - RX) / 2, oy = (h - RY) / 2;

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  const ROWS = p.rows.length;
  const rowH = RY / ROWS;
  const brickW = RX / 5.5;
  ctx.lineWidth = Math.max(0.9, Math.min(RX, RY) / 640);
  p.rows.forEach((row, j) => {
    const bh = rowH * row.hVar;
    const y = oy + j * rowH + (rowH - bh) / 2;
    const offset = (j % 2) * brickW * 0.5 + row.drift * RX;
    let idx = 0;
    for (let x = -brickW; x < RX + brickW; x += brickW, idx++) {
      const bx = ox + x + offset;
      const mortar = Math.min(RX, RY) * 0.006;
      ctx.strokeStyle = idx === row.redAt ? '#b3402a' : 'rgba(64,54,40,0.85)';
      ctx.beginPath();
      ctx.roundRect(bx + mortar, y + mortar, brickW - mortar * 2, bh - mortar * 2, Math.min(RX, RY) * 0.008);
      ctx.stroke();
    }
  });
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
