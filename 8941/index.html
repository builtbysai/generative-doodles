<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8941 — The 3:5:7</title>
<!-- phantom-fill-8941 -->
<style>
  :root{--bg:#0f1216;--ink:#f0e9d8;--dim:#8b8d94;--brass:#c9a227;--line:#262b33}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;display:flex;flex-direction:column;align-items:center;overflow:hidden}
  header{width:100%;max-width:1100px;padding:26px 24px 0;display:flex;justify-content:space-between;align-items:baseline}
  h1{font-size:clamp(22px,4vw,34px);font-weight:400}
  .no{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--dim);letter-spacing:.22em}
  .sub{width:100%;max-width:1100px;padding:8px 24px 0;color:var(--dim);font-style:italic;font-size:15px}
  main{flex:1;width:100%;max-width:1100px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 24px;min-height:0}
  .tritave-row{display:flex;justify-content:flex-end;padding-right:2px}
  .tritave-tag{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.2em;color:var(--brass);border-bottom:1px solid var(--brass);padding-bottom:4px;margin-bottom:6px}
  .stairs{display:flex;align-items:flex-end;gap:4px;height:340px;touch-action:none;user-select:none;-webkit-user-select:none}
  .step{flex:1;position:relative;cursor:pointer;border-top:2px solid rgba(255,255,255,.18);transition:filter .12s}
  .step:hover{filter:brightness(1.25)}
  .step.on{filter:brightness(1.7);box-shadow:0 0 24px rgba(233,178,58,.55)}
  .step .ratio{position:absolute;top:8px;left:0;right:0;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#14100a;font-weight:600}
  .step .idx{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:10px;color:rgba(20,16,10,.65)}
  .floor{height:3px;background:#3a3f47;margin-top:0}
  .readout{display:flex;justify-content:space-between;align-items:baseline;padding:16px 2px 0;font-family:ui-monospace,Menlo,monospace}
  .readout b{font-size:22px;color:var(--brass);font-weight:600}
  .readout span{font-size:11px;letter-spacing:.18em;color:var(--dim)}
  #cadence{color:var(--brass);letter-spacing:.2em;font-size:12px;opacity:0;transition:opacity .3s}
  #cadence.lit{opacity:1}
  footer{padding:16px 24px 24px;display:flex;gap:16px;align-items:center;color:var(--dim);font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.14em}
  button{background:none;border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:11px;letter-spacing:.16em;padding:10px 18px;cursor:pointer}
  button:hover{border-color:var(--brass);color:var(--brass)}
</style>
</head>
<body>
<header><h1>The 3:5:7</h1><div class="no">№ 8941</div></header>
<p class="sub">A brass staircase of thirteen steps to the tritave, lit by odd partials, ending on a 3:5:7 cadence.</p>
<main>
  <div class="tritave-row"><div class="tritave-tag">TRITAVE — 3:1</div></div>
  <div class="stairs" id="stairs"></div>
  <div class="floor"></div>
  <div class="readout">
    <div><b id="ratio">1/1</b> <span id="hz">110.0 Hz — STEP 1</span></div>
    <div id="cadence">✦ CADENCE 3 : 5 : 7 ✦</div>
  </div>
</main>
<footer><span>DRAG ACROSS THE STEPS — OR CLIMB THEM ALL</span><button id="ascend">ASCEND ▸</button><button id="mute">MUTE</button></footer>
<script>
(function(){
"use strict";
// Bohlen-Pierce just ladder: 13 steps, 1/1 to the tritave 3/1, odd partials only.
var STEPS = [
  [1,1],[27,25],[25,21],[9,7],[7,5],[75,49],[5,3],
  [9,5],[49,25],[15,7],[7,3],[63,25],[3,1]
];
var BASE = 110; // A2
var stairsEl = document.getElementById('stairs');
var ratioEl = document.getElementById('ratio'), hzEl = document.getElementById('hz');
var cadEl = document.getElementById('cadence');
var stepEls = [];
STEPS.forEach(function(s, i){
  var d = document.createElement('div');
  d.className = 'step';
  d.style.height = Math.round(52 + i * 22) + 'px';
  d.style.background = 'hsl(43, 48%, ' + (30 + i * 2.2) + '%)';
  d.innerHTML = '<div class="ratio">' + s[0] + '/' + s[1] + '</div><div class="idx">' + (i + 1) + '</div>';
  d.dataset.i = i;
  stairsEl.appendChild(d);
  stepEls.push(d);
});

// --- audio ---
var ctx = null, master = null, muted = false;
function ensureCtx(){
  if(!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    window.__ac = ctx;
    master = ctx.createGain(); master.gain.value = 0.9;
    master.connect(ctx.destination);
  }
  if(ctx.state === 'suspended' && !muted) ctx.resume();
}
document.addEventListener('visibilitychange', function(){
  if(!ctx) return;
  if(document.hidden) ctx.suspend(); else if(!muted) ctx.resume();
});
window.addEventListener('blur', function(){ if(ctx) ctx.suspend(); });
window.addEventListener('focus', function(){ if(ctx && !muted) ctx.resume(); });
window.addEventListener('beforeunload', function(){ if(ctx) ctx.close(); });
document.getElementById('mute').addEventListener('click', function(){
  ensureCtx();
  muted = !muted;
  this.textContent = muted ? 'UNMUTE' : 'MUTE';
  master.gain.setTargetAtTime(muted ? 0 : 0.9, ctx.currentTime, 0.05);
  if(muted) ctx.suspend(); else ctx.resume();
});
function brass(freq, dur){
  var t = ctx.currentTime;
  var o = ctx.createOscillator(), o2 = ctx.createOscillator();
  var f = ctx.createBiquadFilter(), g = ctx.createGain();
  o.type = 'sawtooth'; o.frequency.value = freq;
  o2.type = 'sawtooth'; o2.frequency.value = freq; o2.detune.value = 6;
  f.type = 'lowpass'; f.frequency.setValueAtTime(400, t);
  f.frequency.linearRampToValueAtTime(2200, t + 0.08);
  f.frequency.exponentialRampToValueAtTime(900, t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.22, t + 0.03);
  g.gain.setValueAtTime(0.22, t + Math.max(0.05, dur - 0.25));
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(f); o2.connect(f); f.connect(g); g.connect(master);
  o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}
function cadence(){
  var t = ctx.currentTime;
  [3, 5, 7].forEach(function(p){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = 55 * p;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, t + 3.2);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 3.3);
  });
  cadEl.classList.add('lit');
  setTimeout(function(){ cadEl.classList.remove('lit'); }, 3200);
}
var lastStep = -1;
function playStep(i, fromAscend){
  if(i === lastStep && !fromAscend) return;
  lastStep = i;
  ensureCtx();
  var s = STEPS[i], freq = BASE * s[0] / s[1];
  brass(freq, 1.1);
  ratioEl.textContent = s[0] + '/' + s[1];
  hzEl.textContent = freq.toFixed(1) + ' Hz — STEP ' + (i + 1);
  stepEls.forEach(function(el, j){ el.classList.toggle('on', j === i); });
  if(i === 12) cadence();
}
// drag across the staircase
function stepFromEvent(e){
  var r = stairsEl.getBoundingClientRect();
  var x = Math.min(Math.max(e.clientX - r.left, 0), r.width - 1);
  return Math.min(12, Math.floor(x / r.width * 13));
}
var dragging = false;
stairsEl.addEventListener('pointerdown', function(e){
  dragging = true; stairsEl.setPointerCapture(e.pointerId);
  playStep(stepFromEvent(e), true);
});
stairsEl.addEventListener('pointermove', function(e){
  if(dragging) playStep(stepFromEvent(e));
});
stairsEl.addEventListener('pointerup', function(){ dragging = false; lastStep = -1; });
stairsEl.addEventListener('pointercancel', function(){ dragging = false; lastStep = -1; });
// ascend: climb all 13, then the cadence
var ascending = false;
document.getElementById('ascend').addEventListener('click', function(){
  if(ascending) return;
  ascending = true; ensureCtx();
  STEPS.forEach(function(_, i){
    setTimeout(function(){ playStep(i, true); }, i * 300);
  });
  setTimeout(function(){ ascending = false; }, STEPS.length * 300 + 200);
});
})();
</script>
</body>
</html>
