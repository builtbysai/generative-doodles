<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>&#8470;8941 &middot; The 3:5:7</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #061014;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; display: block; cursor: crosshair; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 100%);
  }
  .ui {
    position: fixed; z-index: 3; pointer-events: none;
    color: rgba(225, 240, 244, 0.62);
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  }
  .ui .num { color: rgba(232, 190, 120, 0.9); }
  #title { top: 18px; left: 20px; }
  #title .sub { display: block; margin-top: 6px; font-size: 9px; letter-spacing: 0.18em; color: rgba(225,240,244,0.36); }
  #hint { bottom: 16px; right: 20px; text-align: right; font-size: 9px; color: rgba(225,240,244,0.36); }
  #seedline { bottom: 16px; left: 20px; font-size: 9px; color: rgba(225,240,244,0.30); }
  #fade {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: #061014; opacity: 1; transition: opacity 0.6s ease;
  }
  @media (max-width: 620px) {
    #seedline { bottom: 38px; }
    #hint { font-size: 8px; }
    #title { font-size: 10px; }
  }
</style>
</head>
<body>
<div class="vignette"></div>
<div class="ui" id="title"><span class="num">&#8470;8941</span> &middot; The 3:5:7<span class="sub">seed 240 &middot; thirteen steps to the tritave, only odd partials allowed</span></div>
<div class="ui" id="hint">tap for sound &middot; click for a new ascent</div>
<div class="ui" id="seedline"></div>
<div id="fade"></div>
<script>
"use strict";
/* Seed 240: Pierce's tritave scale. Thirteen equal steps of 146.3 cents
   span a 3:1 tritave; tones carry only odd partials, like a clarinet.
   The octave is a rumor here. The cadence chord is 3:5:7, and after a
   while it starts to sound like home. */
let seed = 240001;
let rng;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

const STEPS = 13;
let W=0,H=0, mx=0, baseY=0, stepDX=0, stepDY=0, stepW=0, stepH=0;
let walker = {step: 0, x:0, y:0, tx:0, ty:0, trail:[]};
let melody = [], noteIdx = 0, noteT = 0;
let cadence = null;   /* {t:0..1} fires at phrase end */
let pillars = [];     /* lit odd-partial columns per step */
let backdrop = null;  /* static layer: watermark + horizon glow, re-rendered on layout */
let audioOn=false, actx=null, masterGain=null;
let palette;

const NOTE_DUR = 0.5;

function setup(){
  const c = createCanvas(windowWidth, windowHeight);
  c.id('stage');
  rng = mulberry32(seed);
  palette = {
    step: [232, 190, 120], stepEdge: [120, 90, 50],
    odd: [255, 170, 110], walker: [255, 250, 240],
    cad: [150, 230, 220], bg: [6, 16, 20]
  };
  layout();
  makeBackdrop();
  buildMelody();
  document.getElementById('fade').style.opacity = '0';
  updateSeedline();
}

function layout(){
  W = width; H = height;
  mx = Math.max(36, W*0.07);
  baseY = H*0.86;
  stepDX = (W - mx*2) / (STEPS-1);
  stepDY = (H*0.62) / (STEPS-1);
  stepW = stepDX*0.94;
  stepH = 14;
}

function windowResized(){ resizeCanvas(windowWidth, windowHeight); layout(); makeBackdrop(); placeWalker(true); }

function stepPos(s){
  return {x: mx + s*stepDX, y: baseY - s*stepDY};
}

function buildMelody(){
  /* random walk on the 13 steps, biased upward, 26 notes */
  melody = [];
  let s = 0;
  for(let i=0;i<26;i++){
    melody.push(s);
    const up = rng();
    if(up < 0.52 && s < STEPS-1) s++;
    else if(up < 0.72 && s > 0) s--;
    else s = Math.floor(rng()*STEPS);
  }
  melody[melody.length-1] = STEPS-1; /* the ascent always arrives */
  noteIdx = 0; noteT = 0;
  /* note: cadence is intentionally NOT reset here; it plays out over the
     start of the new ascent (advanceWalker fires it, then rebuilds) */
  pillars = [];
  for(let i=0;i<STEPS;i++) pillars.push({e: 0.15});
  placeWalker(true);
}

function placeWalker(snap){
  const p = stepPos(walker.step);
  walker.tx = p.x; walker.ty = p.y - 26;
  if(snap){ walker.x = walker.tx; walker.y = walker.ty; walker.trail = []; }
}

function freqOf(step){
  return 146.83 * Math.pow(3, step/STEPS); /* D3 up one tritave */
}

function draw(){
  background(palette.bg[0], palette.bg[1], palette.bg[2]);
  drawBackdrop();
  drawPillars();
  drawStairs();
  advanceWalker();
  drawWalker();
  drawCadence();
  if(frameCount % 20 === 0) updateSeedline();
}

function drawBackdrop(){
  /* static layer, cached in makeBackdrop: blit it, do not re-rasterize */
  if(backdrop) image(backdrop, 0, 0);
}

function makeBackdrop(){
  /* the giant watermark and horizon glow never change between resizes,
     so render them once instead of every frame */
  backdrop = createGraphics(W, H);
  backdrop.noStroke();
  backdrop.fill(232, 190, 120, 12);
  backdrop.textAlign(CENTER, CENTER);
  backdrop.textSize(Math.min(W,H)*0.42);
  backdrop.textStyle(BOLD);
  backdrop.text('3:1', W/2, H*0.44);
  backdrop.textStyle(NORMAL);
  const ctx = backdrop.drawingContext;
  const g = ctx.createLinearGradient(0, baseY-160, 0, baseY+40);
  g.addColorStop(0, 'rgba(232,190,120,0)');
  g.addColorStop(1, 'rgba(232,190,120,0.07)');
  ctx.fillStyle = g;
  ctx.fillRect(0, baseY-160, W, 200);
}

function drawStairs(){
  for(let s=0;s<STEPS;s++){
    const p = stepPos(s);
    /* slab */
    noStroke();
    fill(20, 34, 40);
    rect(p.x - stepW/2, p.y, stepW, stepH + (baseY - p.y), 3);
    /* brass top */
    const lit = (s === walker.step) ? 1 : 0.55;
    for(let g=3; g>=1; g--){
      fill(palette.step[0], palette.step[1], palette.step[2], 20*g*lit);
      rect(p.x - stepW/2 - g*2, p.y - g*2, stepW + g*4, stepH + g*4, 5);
    }
    fill(palette.step[0]*lit+40, palette.step[1]*lit+30, palette.step[2]*lit+20);
    rect(p.x - stepW/2, p.y, stepW, stepH, 3);
    /* step number + cents */
    fill(225,240,244, s===0||s===STEPS-1 ? 150 : 70);
    textAlign(CENTER, CENTER); textSize(constrain(stepW*0.22, 8, 13));
    const label = s===0 ? '1' : (s===STEPS-1 ? '3' : ''+s);
    text(label, p.x, p.y + stepH/2);
    if(s===0 || s===STEPS-1){
      textSize(8); fill(225,240,244,60);
      text(s===0?'ratio 1':'ratio 3 · 1902¢', p.x, p.y + stepH + 14);
    }
  }
}

function drawPillars(){
  /* odd partials 1,3,5,7,9 as light columns above each step */
  for(let s=0;s<STEPS;s++){
    const p = stepPos(s);
    pillars[s].e += ((s===walker.step?0.9:0.15) - pillars[s].e)*0.06;
    for(let k=0;k<5;k++){
      const partial = 2*k+1;
      const hgt = (stepDY*2.6/partial) * (0.5 + pillars[s].e*0.5);
      const x = p.x - stepW*0.32 + k*(stepW*0.64/4);
      const a = 26 + pillars[s].e*60 - k*7;
      if(a <= 0) continue;
      noStroke();
      fill(palette.odd[0], palette.odd[1], palette.odd[2], a);
      rect(x-2.5, p.y - hgt, 5, hgt, 2);
    }
    /* even partials: explicitly absent, shown as faint hollow slots */
    noFill();
    stroke(120, 140, 150, 26);
    strokeWeight(1);
    for(let k=1;k<=2;k++){
      const x = p.x - stepW*0.32 + (k*2-1)*(stepW*0.64/4) + (stepW*0.64/8);
      line(x, p.y-4, x, p.y-18);
    }
  }
}

function advanceWalker(){
  noteT += deltaTime/1000;
  if(noteT >= NOTE_DUR){
    noteT = 0;
    noteIdx++;
    if(noteIdx >= melody.length){
      fireCadence();
      buildMelody();
      return;
    }
    walker.step = melody[noteIdx];
    placeWalker(false);
    if(audioOn) playStep(freqOf(walker.step), NOTE_DUR*0.9);
  }
  walker.x += (walker.tx - walker.x)*0.16;
  walker.y += (walker.ty - walker.y)*0.16;
  walker.trail.push({x: walker.x, y: walker.y});
  if(walker.trail.length > 30) walker.trail.shift();
}

function drawWalker(){
  noFill();
  for(let g=4; g>=1; g--){
    stroke(palette.walker[0], palette.walker[1], palette.walker[2], 12*g);
    strokeWeight(g*2);
    beginShape();
    for(const p of walker.trail) vertex(p.x, p.y);
    endShape();
  }
  noStroke();
  for(let g=5; g>=1; g--){
    fill(palette.walker[0], palette.walker[1], palette.walker[2], 16*g);
    circle(walker.x, walker.y, g*8);
  }
  fill(255,255,255,240);
  circle(walker.x, walker.y, 8);
  /* current ratio readout */
  const ratio = Math.pow(3, walker.step/STEPS);
  fill(225,240,244,140); textAlign(LEFT, CENTER); textSize(11);
  text('ratio ' + ratio.toFixed(3) + ' · step ' + walker.step + '/12', walker.x+20, walker.y-14);
}

/* the cadence chord 3:5:7: ratios mapped back onto the staircase */
function ratioToStep(r){
  return Math.round(STEPS * Math.log(r) / Math.log(3)) % STEPS;
}

function fireCadence(){
  const steps = [ratioToStep(3), ratioToStep(5), ratioToStep(7)];
  cadence = {t: 0, steps: steps};
  if(audioOn){
    [3,5,7].forEach((r,i)=>{
      setTimeout(()=>playStep(146.83*r, 2.2), i*160);
    });
  }
}

function drawCadence(){
  if(!cadence) return;
  cadence.t += deltaTime/1000;
  const T = cadence.t;
  if(T > 3.2){ cadence = null; return; }
  const fade = T < 0.4 ? T/0.4 : Math.max(0, 1-(T-0.4)/2.8);
  const labels = ['3','5','7'];
  cadence.steps.forEach((s, i)=>{
    const p = stepPos(s);
    const hgt = H*0.55*(1 - T*0.12);
    for(let g=5; g>=1; g--){
      noStroke();
      fill(palette.cad[0], palette.cad[1], palette.cad[2], 14*g*fade);
      rect(p.x - g*7, p.y - hgt, g*14, hgt, 6);
    }
    noStroke();
    fill(palette.cad[0], palette.cad[1], palette.cad[2], 200*fade);
    textAlign(CENTER, CENTER); textSize(15);
    text(labels[i], p.x, p.y - hgt - 20);
  });
  noStroke(); fill(150,230,220, 160*fade);
  textAlign(CENTER, CENTER); textSize(12);
  text('the 3:5:7 cadence', W/2, H*0.10);
}

function updateSeedline(){
  document.getElementById('seedline').textContent =
    'seed ' + seed + ' · ' + (audioOn ? 'sound on' : 'sound off');
}

function mousePressed(){ userTap(); return false; }
function touchStarted(){ userTap(); return false; }

function userTap(){
  if(!audioOn){
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === 'suspended') actx.resume();
      masterGain = actx.createGain();
      masterGain.gain.value = 0.14;
      masterGain.connect(actx.destination);
      audioOn = true;
    }catch(e){ audioOn = false; }
  } else {
    buildMelody(); /* click starts a fresh ascent */
  }
  updateSeedline();
}

function keyPressed(){
  if(key==='r' || key==='R'){ buildMelody(); }
}

/* odd partials only, like the clarinet */
function playStep(f, dur){
  if(!actx) return;
  const t = actx.currentTime;
  for(let k=0;k<5;k++){
    const partial = 2*k+1;
    const o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f*partial;
    const g = actx.createGain();
    const amp = 1/(partial*partial);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(amp, t+0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t+dur+0.05);
  }
}
</script>
</body>
</html>
