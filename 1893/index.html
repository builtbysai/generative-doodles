<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Chamber Swap</title>
<style>
html, body { margin: 0; padding: 0; background: #14100C; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* The Chamber Swap: four voice-lines share one chamber as glowing
   threads. At any moment one thread leads, bright in the foreground,
   while the other three dim to quarter opacity and run as texture.
   Leadership passes on an irregular seeded schedule; the handoff is
   a visible braid where the outgoing and incoming threads wind
   together at a marked exchange point before the new leader emerges.
   The ensemble never stops moving. Watch only. */
var TAU = Math.PI * 2;
var BG = '#14100C';
var BRASS = '#C9A227';
var COPPER = '#B87333';
var IVORY = '#F2EAD8';
var SLATE = '#6B7A8A';
var THREADS = [BRASS, COPPER, IVORY, SLATE];
var NAMES = ['brass', 'copper', 'ivory', 'slate'];
var LANES = [0.20, 0.38, 0.56, 0.74];
var EXCH = [0.30, 0.55, 0.80];   /* marked exchange points */
var BRAID_LEN = 2.5;             /* seconds a handoff braid lasts */
var BRAID_HALF = 0.18;           /* braid window, half width in x */
var BRAID_WAVE = 0.11;           /* braid wind wavelength in x */
var PLATE = '#0D0A07';
var PLATE_LINE = 'rgba(242,234,216,0.40)';
var TITLE_INK = '#F2EAD8';
var HINT_INK = '#F2EAD8';
var SEED0 = 1893;
var FRAME_T = 18.5;   /* fixed phase: mid-braid, copper handing to ivory */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smooth(f) { f = clamp(f, 0, 1); return f * f * (3 - 2 * f); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* QA hook only: ?seed=N is read as a time in seconds. No link in the
   piece uses it. */
try {
  var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
  var ms = qs.match(/[?&]seed=([0-9.]+)/);
  if (ms) phaseT = parseFloat(ms[1]);
} catch (e) { /* keep FRAME_T */ }
FRAME_T = phaseT;
/* ---- leader-rotation scheduler: irregular seeded tenures ---- */
var SEGMENTS = [];   /* {leader, start, end, next, braidStart, exch} */
(function buildSchedule() {
  var rng = mulberry32(SEED0);
  var t = 0, leader = 0, k = 0;
  while (t < 1200 && k < 140) {
    var dur = 7 + rng() * 7;
    var next = (leader + 1 + Math.floor(rng() * 3)) % 4;
    SEGMENTS.push({
      leader: leader, start: t, end: t + dur, next: next,
      braidStart: t + dur - BRAID_LEN, exch: EXCH[k % EXCH.length]
    });
    t += dur; leader = next; k++;
  }
})();
var PHASES = [0.0, 1.7, 3.1, 4.6];   /* per-thread drift phases */
var PHASES2 = [2.2, 0.4, 5.0, 1.1];
function segmentAt(t) {
  var i;
  for (i = 0; i < SEGMENTS.length; i++) {
    if (t < SEGMENTS[i].end) return { seg: SEGMENTS[i], idx: i };
  }
  var last = SEGMENTS[SEGMENTS.length - 1];
  return { seg: last, idx: SEGMENTS.length - 1 };
}
/* braid state at time t: null when no handoff is running, else
   {out, inn, prog, exch} with prog 0..1 across the braid */
function braidAt(t) {
  var s = segmentAt(t).seg;
  if (t < s.braidStart) return null;
  return {
    out: s.leader, inn: s.next,
    prog: smooth((t - s.braidStart) / BRAID_LEN),
    exch: s.exch
  };
}
/* brightness of thread i at time t: leader 1.0, followers 0.25 with a
   slow shimmer; during a braid the pair cross-fades */
function brightness(i, t) {
  var b = braidAt(t);
  if (b) {
    if (i === b.out) return lerp(1.0, 0.25, b.prog);
    if (i === b.inn) return lerp(0.25, 1.0, b.prog);
  } else if (i === segmentAt(t).seg.leader) {
    return 1.0;
  }
  return 0.22 + 0.05 * Math.sin(t * 0.45 + PHASES[i] * 2.0);
}
/* vertical position of thread i at normalized x and time t */
function threadY(i, x, t) {
  var y = LANES[i]
    + 0.035 * Math.sin(x * 4.2 + t * 0.07 + PHASES[i])
    + 0.020 * Math.sin(x * 9.0 - t * 0.11 + PHASES2[i]);
  var b = braidAt(t);
  if (b && (i === b.out || i === b.inn)) {
    var ex = b.exch;
    var d = Math.abs(x - ex);
    if (d < BRAID_HALF) {
      /* braid envelope: smoothstep shoulders, full wind at the center.
         The two strands wind around their shared center line with an
         amplitude of half their lane separation, so they cross each
         other three times across the window like a real braid. */
      var env = smooth((BRAID_HALF - d) / BRAID_HALF);
      var dist = Math.abs(LANES[b.out] - LANES[b.inn]);
      var yc = (LANES[b.out] + LANES[b.inn]) / 2
        + 0.030 * Math.sin(ex * 4.2 + t * 0.07 + 2.0);
      var wind = Math.sin(TAU * (x - ex) / BRAID_WAVE + t * 0.6 +
        (i === b.out ? 0 : Math.PI));
      var braidY = yc + (0.5 * dist + 0.01) * wind * (0.6 + 0.4 * b.prog);
      y = lerp(y, braidY, env);
    }
  }
  return y;
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* The piece rect: full-bleed on phones, a centered square on desktop.
   The page ground is the piece's own warm black. */
function pieceRect() {
  if (isPhone) return { ox: 0, oy: 0, s: Math.min(VW, VH), w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { ox: (VW - s) / 2, oy: (VH - s) / 2, s: s, w: s, h: s };
}
function drawExchangeMarks(R, t) {
  var b = braidAt(t);
  var i;
  ctx.lineCap = 'round';
  for (i = 0; i < EXCH.length; i++) {
    var ex = EXCH[i];
    var active = b && Math.abs(b.exch - ex) < 0.001;
    var mx = R.ox + ex * R.w;
    var top = R.oy + 0.13 * R.h, bot = R.oy + 0.82 * R.h;
    ctx.strokeStyle = rgba(SLATE, active ? 0.55 : 0.22);
    ctx.lineWidth = active ? Math.max(1.5, R.s * 0.002) : Math.max(1, R.s * 0.0012);
    ctx.beginPath();
    ctx.moveTo(mx, top);
    ctx.lineTo(mx, bot);
    ctx.stroke();
    /* small diamond at the chamber center line */
    var cy = R.oy + 0.475 * R.h;
    var r = active ? R.s * 0.012 : R.s * 0.008;
    ctx.fillStyle = rgba(SLATE, active ? 0.8 : 0.35);
    ctx.beginPath();
    ctx.moveTo(mx, cy - r);
    ctx.lineTo(mx + r, cy);
    ctx.lineTo(mx, cy + r);
    ctx.lineTo(mx - r, cy);
    ctx.closePath();
    ctx.fill();
  }
}
function drawThread(R, i, t) {
  var br = brightness(i, t);
  var col = THREADS[i];
  var baseW = (i === segmentAt(t).seg.leader || (braidAt(t) && braidAt(t).inn === i))
    ? R.s * 0.0042 : R.s * 0.0026;
  var passes = [
    { w: baseW * 3.2, a: 0.10 },
    { w: baseW * 1.8, a: 0.35 },
    { w: baseW, a: 1.0 }
  ];
  var p, x, n = 110;
  for (p = 0; p < passes.length; p++) {
    ctx.strokeStyle = rgba(col, clamp(br * passes[p].a, 0, 1));
    ctx.lineWidth = Math.max(0.8, passes[p].w);
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (x = 0; x <= n; x++) {
      var fx = x / n;
      var px = R.ox + fx * R.w;
      var py = R.oy + threadY(i, fx, t) * R.h;
      if (x === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  /* a bright bead rides the leader's right end */
  var b = braidAt(t);
  var isLead = (i === segmentAt(t).seg.leader) ||
    (b && b.inn === i && b.prog > 0.5);
  if (isLead) {
    var bx = R.ox + R.w - R.s * 0.015;
    var by = R.oy + threadY(i, 1, t) * R.h;
    var rr = Math.max(2, R.s * 0.008);
    ctx.fillStyle = rgba(col, 0.95);
    ctx.beginPath();
    ctx.moveTo(bx + rr, by);
    ctx.arc(bx, by, rr, 0, TAU);
    ctx.fill();
  }
}
function drawPlates(R) {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Chamber Swap').width > R.w - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Chamber Swap').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 03 · 19').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = R.ox + 12, plateY = R.oy + 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Chamber Swap', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 03 · 19', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the leader change.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = R.ox + 12;
  var hintPlateY = R.oy + R.h - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var R = pieceRect();
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, VW, VH);
  var t = phaseT;
  var b = braidAt(t);
  var lead = segmentAt(t).seg.leader;
  drawExchangeMarks(R, t);
  /* followers first, braid pair next, leader on top */
  var order = [];
  var i;
  for (i = 0; i < 4; i++) {
    if (i !== lead && !(b && (i === b.out || i === b.inn))) order.push(i);
  }
  if (b) { order.push(b.out); order.push(b.inn); }
  order.push(lead);
  for (i = 0; i < order.length; i++) drawThread(R, order[i], t);
  drawPlates(R);
}
/* ---- frame one: fixed phase t = 18.5 s, mid-braid, copper handing
   the lead to ivory at the middle exchange point, seed 1893 ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = FRAME_T + clockT;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
