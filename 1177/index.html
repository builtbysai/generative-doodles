<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wild at Heart, as a Control Voltage</title>
<style>
  html, body { margin:0; padding:0; background:#0B0B0D; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function(){
'use strict';

// ---------- Wild at Heart, as a Control Voltage — Jason Soliday SD2 ----------
// After "visible in the reflection" (2015): light-dependent resistors taped
// to a display let the film itself play the modules. Here the film is an
// abstract drive-in of drifting red / teal / bone rectangles under grain.
// Three statistics are computed ANALYTICALLY from the rectangle field (never
// pixel-read): brightness, hue rotation, contrast. They travel down three
// patch cables into a module rack. The modules answer the film as it was
// 0.5 s ago — the LDR lag is the mechanism. Dragging on the film is a
// flashlight wipe: it perturbs brightness locally, and the rack follows.
// Silent: the parameters are drawn, not heard.

// ---------- seeded determinism ----------
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; var t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,f){ return a+(b-a)*f; }

// ---------- palette ----------
var BG='#0B0B0D', PANEL='#151517', EDGE='#26262B', INK='#E8E8E8', DIM='#8A8A93';
var FILM_BG='#0D0D0D', FILM_EDGE='#2E2E34', SPROCKET='#1C1C20';
var C_BRIGHT='#FFE14D', C_HUE='#00FFC2', C_CONTRAST='#FF2B6E';
var PAL=[[195,62,62],[46,125,123],[232,224,208]];   // red, teal, bone
var LOOP=40, T0=13, LAG=0.5;

// ---------- the film: 14 seeded rectangles ----------
var rng = mulberry32(1177002);
var RECTS=[];
for (var i=0;i<14;i++){
  RECTS.push({
    bx: rng()*0.92, by: rng()*0.78,
    w: 0.16+rng()*0.30, h: 0.14+rng()*0.30,
    ci: i%3,                                   // palette base index
    ph: rng()*3,                               // own hue-rotation phase offset
    ax: 0.015+rng()*0.045, ay: 0.015+rng()*0.045,
    fx: 5.1+rng()*7.3, fy: 6.3+rng()*8.1,      // incommensurate wander periods
    px: rng()*6.283, py: rng()*6.283,
    br: 16+rng()*15, bq: rng()*6.283          // luminance breathe
  });
}
// grain: seeded speckle field in film space, two scroll layers
var GRAIN=[];
for (var g=0; g<850; g++){
  GRAIN.push({ u:rng(), v:rng(), layer: g%2, white: rng()<0.42, a: 0.07+rng()*0.15, s: rng()<0.85?1.5:2.5 });
}

// hue rotation: the wheel starts mid-reel (phase 0.55) and turns once per loop
function huePhase(t){ var p=(0.55 + t/LOOP)%1; return p<0?p+1:p; }
function mixColor(ci, rot){
  var pos = ci + rot, i0 = Math.floor(pos)%3, f = pos - Math.floor(pos);
  var A = PAL[i0], B = PAL[(i0+1)%3];
  return [lerp(A[0],B[0],f), lerp(A[1],B[1],f), lerp(A[2],B[2],f)];
}
function lumOf(c){ return (0.2126*c[0]+0.7152*c[1]+0.0722*c[2])/255; }
function lamp(t){ return 0.88 + 0.28*Math.sin(6.2832*t/LOOP + 2.2); }   // projector swell
function rectLum(r, t, rot){
  var breathe = 0.86 + 0.14*Math.sin(6.2832*t/r.br + r.bq);
  return lumOf(mixColor(r.ci, r.ph + rot)) * breathe;
}
// film statistics, analytic only. Overlap between rectangles is ignored:
// brightness is the area-weighted mean of rectangle luminances (times the
// lamp swell); contrast is the spread of rectangle luminances, wandered.
function filmStats(t){
  var rot = huePhase(t)*3, i, r, L;
  var wsum=0, msum=0, lmin=9, lmax=-9;
  for (i=0;i<RECTS.length;i++){
    r=RECTS[i]; L=rectLum(r,t,rot);
    var w=r.w*r.h; wsum+=w; msum+=L*w;
    if (L<lmin) lmin=L; if (L>lmax) lmax=L;
  }
  var mean = msum/wsum;
  var bright = clamp((mean*lamp(t) - 0.20)/0.50, 0, 1);
  var wander = 0.8 + 0.2*Math.sin(6.2832*t/27 + 1.3);
  var contrast = clamp(((lmax-lmin) - 0.05)/0.48 * wander, 0, 1);
  return { b:bright, h:huePhase(t), c:contrast };
}

// ---------- phone detection ----------
var sw=(window.screen && window.screen.width)||0;
var sh=(window.screen && window.screen.height)||0;
var isPhone = Math.min(sw||9999, sh||9999) < 700;

// ---------- view / canvas ----------
var canvas=document.getElementById('stage');
var ctx=canvas.getContext('2d');
var W=0, H=0;
function viewW(){ if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width; return window.innerWidth||800; }
function viewH(){ if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height; return window.innerHeight||800; }
function fit(){
  W=viewW(); H=viewH();
  canvas.width=W; canvas.height=H;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  if (!isPhone && H>W*1.15) isPhone=true;
}

// ---------- layout ----------
function layout(){
  var pad = Math.max(10, Math.min(18, W*0.014));
  var titleH = 34;
  var top = titleH, contentH = H - top - pad;
  var film, rack;
  if (isPhone){
    var fh = contentH*0.40;
    film = { x:pad, y:top, w:W-2*pad, h:fh };
    rack = { x:pad, y:top+fh+30, w:W-2*pad, h:contentH-fh-30 };
  } else {
    var gap = 52;
    var avail = W - 2*pad - gap;
    var fw = avail*0.40;
    film = { x:pad, y:top, w:fw, h:contentH };
    rack = { x:pad+fw+gap, y:top, w:avail*0.60, h:contentH };
  }
  var lanes=[], lh = rack.h/4;
  for (var i=0;i<4;i++) lanes.push({ x:rack.x, y:rack.y+i*lh, w:rack.w, h:lh });
  // film-edge jacks: right edge (landscape) or bottom edge (portrait)
  var jacks=[];
  for (var j=0;j<3;j++){
    if (isPhone) jacks.push({ x: film.x + film.w*(0.22+0.28*j), y: film.y + film.h, edge:'b' });
    else jacks.push({ x: film.x + film.w, y: film.y + film.h*(0.24+0.26*j), edge:'r' });
  }
  var laneJacks = lanes.map(function(L){ return { x:L.x, y:L.y + L.h*0.52 }; });
  return { pad:pad, titleH:titleH, film:film, rack:rack, lanes:lanes, jacks:jacks, laneJacks:laneJacks };
}

// ---------- drag interference: flashlight samples (film-normalised) ----------
var samples=[];   // {u, v, t}
var dragging=false;
var lastLayout=null, nowT=T0;
function filmPoint(cx, cy){
  if (!lastLayout) return null;
  var F=lastLayout.film;
  if (cx<F.x || cx>F.x+F.w || cy<F.y || cy>F.y+F.h) return null;
  return { u:(cx-F.x)/F.w, v:(cy-F.y)/F.h };
}
function addSample(cx, cy){
  var p=filmPoint(cx,cy); if (!p) return;
  samples.push({ u:p.u, v:p.v, t:nowT });
  if (samples.length>40) samples.splice(0, samples.length-40);
}
function boostAt(t){
  var s=0;
  for (var i=0;i<samples.length;i++){
    var age=t-samples[i].t;
    if (age>=0 && age<3.6) s += Math.exp(-age/1.2)*0.06;
  }
  return Math.min(0.30, s);
}

// ---------- drawing helpers ----------
function rr(x,y,w,h,r){
  r=Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arc(x+w-r, y+r, r, -Math.PI/2, 0);
  ctx.lineTo(x+w, y+h-r); ctx.arc(x+w-r, y+h-r, r, 0, Math.PI/2);
  ctx.lineTo(x+r, y+h); ctx.arc(x+r, y+h-r, r, Math.PI/2, Math.PI);
  ctx.lineTo(x, y+r); ctx.arc(x+r, y+r, r, Math.PI, Math.PI*1.5);
  ctx.closePath();
}
function dot(cx,cy,r){ ctx.beginPath(); ctx.moveTo(cx+r,cy); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill(); }
function txt(s,x,y,size,color,align){
  ctx.font=size+'px monospace'; ctx.fillStyle=color; ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic';
  ctx.fillText(s,x,y);
}

// ---------- film ----------
function drawFilm(L, t, src){
  var F=L.film, rot=huePhase(t)*3, lampV=lamp(t), i, r;
  ctx.save();
  rr(F.x, F.y, F.w, F.h, 4); ctx.clip();
  ctx.fillStyle=FILM_BG; ctx.fillRect(F.x, F.y, F.w, F.h);
  // rectangles, closed-form wander
  for (i=0;i<RECTS.length;i++){
    r=RECTS[i];
    var nx = r.bx + r.ax*Math.sin(6.2832*t/r.fx + r.px);
    var ny = r.by + r.ay*Math.sin(6.2832*t/r.fy + r.py);
    var c = mixColor(r.ci, r.ph + rot);
    var breathe = 0.86 + 0.14*Math.sin(6.2832*t/r.br + r.bq);
    var k = clamp(lampV*breathe, 0, 1.18);
    ctx.fillStyle = 'rgb('+Math.round(clamp(c[0]*k,0,255))+','+Math.round(clamp(c[1]*k,0,255))+','+Math.round(clamp(c[2]*k,0,255))+')';
    ctx.fillRect(F.x + nx*F.w, F.y + ny*F.h, r.w*F.w, r.h*F.h);
  }
  // flashlight patches: concentric flat-alpha circles per live sample
  for (i=0;i<samples.length;i++){
    var sm=samples[i], age=t-sm.t;
    if (age<0 || age>=3.6) continue;
    var dcy=Math.exp(-age/1.2), px=F.x+sm.u*F.w, py=F.y+sm.v*F.h;
    var radii=[95,58,30], alphas=[0.05,0.08,0.11];
    for (var q=0;q<3;q++){
      ctx.fillStyle='rgba(232,224,208,'+(alphas[q]*dcy).toFixed(3)+')';
      dot(px, py, radii[q]*clamp(F.w/460,0.55,1.1));
    }
  }
  // grain: seeded specks, visible subset scrolls slowly
  for (i=0;i<GRAIN.length;i++){
    var gr=GRAIN[i];
    var vv = (gr.v + t*0.008*(gr.layer+1)) % 1;
    var uu = (gr.u + (gr.layer? t*0.0021 : 0)) % 1;
    ctx.fillStyle = gr.white ? 'rgba(232,224,208,'+gr.a+')' : 'rgba(0,0,0,'+(gr.a+0.06)+')';
    ctx.fillRect(F.x + uu*F.w, F.y + vv*F.h, gr.s, gr.s);
  }
  // sprocket strips
  ctx.fillStyle='#101013'; ctx.fillRect(F.x, F.y, F.w, 13); ctx.fillRect(F.x, F.y+F.h-13, F.w, 13);
  ctx.fillStyle=SPROCKET;
  var step=26;
  for (var sx=F.x+8; sx<F.x+F.w-12; sx+=step){
    ctx.fillRect(sx, F.y+3.5, 13, 6); ctx.fillRect(sx, F.y+F.h-9.5, 13, 6);
  }
  ctx.restore();
  ctx.strokeStyle=FILM_EDGE; ctx.lineWidth=1.5; rr(F.x, F.y, F.w, F.h, 4); ctx.stroke();
  txt('FILM', F.x+10, F.y+26, 10, DIM, 'left');
}

// ---------- cables + LDR jacks ----------
function drawCables(L, src){
  var cols=[C_BRIGHT, C_HUE, C_CONTRAST], vals=[src.b, src.h, src.c];
  for (var j=0;j<3;j++){
    var a=L.jacks[j], b=L.laneJacks[j];
    var mx=(a.x+b.x)/2, my=(a.y+b.y)/2 + 26;
    ctx.strokeStyle=cols[j]; ctx.lineWidth=1.5 + vals[j]*4.5; ctx.globalAlpha=0.9;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(mx, my, b.x, b.y); ctx.stroke();
    ctx.globalAlpha=1;
    // module-end jack
    ctx.fillStyle=cols[j]; dot(b.x, b.y, 3.5);
    // LDR dot on the film edge: flashes stepped when its signal crosses 0.8
    var lit = vals[j] >= 0.8;
    if (lit){ ctx.strokeStyle=cols[j]; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(a.x+9, a.y); ctx.arc(a.x, a.y, 9, 0, Math.PI*2); ctx.stroke(); }
    ctx.fillStyle = lit ? cols[j] : '#3A3A40';
    dot(a.x, a.y, 5);
  }
  // EQ is slaved internally: a thin stub taps the filter (hue) line
  var f=L.laneJacks[1], e=L.laneJacks[3];
  ctx.strokeStyle=C_HUE; ctx.globalAlpha=0.35; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.quadraticCurveTo(f.x + (isPhone?18:-16), (f.y+e.y)/2, e.x, e.y); ctx.stroke();
  ctx.globalAlpha=1; ctx.fillStyle=C_HUE; dot(e.x, e.y, 3);
  // LDR tag
  var j0=L.jacks[0];
  if (isPhone) txt('LDR', j0.x+12, j0.y+22, 9, DIM, 'left');
  else txt('LDR', j0.x-8, j0.y-14, 9, DIM, 'right');
}

// ---------- module lanes ----------
function laneFrame(Ln, label, readout, color){
  ctx.fillStyle=PANEL; rr(Ln.x, Ln.y+3, Ln.w, Ln.h-6, 5); ctx.fill();
  ctx.strokeStyle=EDGE; ctx.lineWidth=1; rr(Ln.x, Ln.y+3, Ln.w, Ln.h-6, 5); ctx.stroke();
  txt(label, Ln.x+12, Ln.y+19, 11, INK, 'left');
  txt(readout, Ln.x+Ln.w-12, Ln.y+19, 11, color, 'right');
}
function statBar(Ln, v, color){
  var x=Ln.x+12, w=Ln.w-24, y=Ln.y+Ln.h-13;
  ctx.fillStyle='#222228'; ctx.fillRect(x, y, w, 4);
  ctx.fillStyle=color; ctx.fillRect(x, y, w*clamp(v,0,1), 4);
}
function drawOsc(Ln, lag){
  var hz = 36*Math.pow(1220/36, lag.b);
  laneFrame(Ln, 'OSCILLATOR', hz.toFixed(0)+' Hz', C_BRIGHT);
  var x0=Ln.x+12, x1=Ln.x+Ln.w-12, ym=Ln.y+Ln.h*0.52, amp=Ln.h*0.20;
  var cycles = clamp(Math.round(2 + lag.b*16), 2, 18);
  ctx.strokeStyle=C_BRIGHT; ctx.lineWidth=2; ctx.beginPath();
  for (var x=x0;x<=x1;x+=3){
    var p=(x-x0)/(x1-x0);
    var y=ym - Math.sin(p*cycles*6.2832)*amp - Math.sin(p*cycles*12.566)*amp*0.25;
    if (x===x0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  statBar(Ln, lag.b, C_BRIGHT);
}
function drawFilter(Ln, lag){
  var fc = 90*Math.pow(14000/90, lag.h);
  laneFrame(Ln, 'FILTER', fc>=1000 ? (fc/1000).toFixed(1)+' kHz' : fc.toFixed(0)+' Hz', C_HUE);
  var x0=Ln.x+12, x1=Ln.x+Ln.w-12, yTop=Ln.y+26, yBot=Ln.y+Ln.h-20;
  ctx.strokeStyle=C_HUE; ctx.lineWidth=2; ctx.beginPath();
  for (var x=x0;x<=x1;x+=3){
    var p=(x-x0)/(x1-x0);
    var resp = 1/(1 + Math.pow(p/Math.max(0.03, lag.h), 4)*24);
    var y = yBot - resp*(yBot-yTop);
    if (x===x0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  statBar(Ln, lag.h, C_HUE);
}
function drawTrem(Ln, lag, t){
  var rate = 0.4 + lag.c*11.6;
  laneFrame(Ln, 'TREMOLO', rate.toFixed(1)+' Hz', C_CONTRAST);
  var x0=Ln.x+12, x1=Ln.x+Ln.w-12, yTop=Ln.y+30, yBot=Ln.y+Ln.h-22;
  var spacing = clamp((x1-x0)/(rate*1.6), 7, 90);
  var off = (t*34) % spacing;
  ctx.strokeStyle=C_CONTRAST; ctx.lineWidth=2;
  ctx.beginPath();
  for (var x=x0-spacing+off; x<x1; x+=spacing){
    if (x<x0) continue;
    ctx.moveTo(x, yBot); ctx.lineTo(x, yTop + (yBot-yTop)*0.25*(0.5+0.5*Math.sin(x*0.11)));
  }
  ctx.stroke();
  // playhead dot rides the pulse train
  ctx.fillStyle=C_CONTRAST;
  var phx = x0 + ((t*34) % (x1-x0));
  dot(phx, yTop-5, 2.5);
  statBar(Ln, lag.c, C_CONTRAST);
}
function drawEQ(Ln, lag){
  laneFrame(Ln, 'EQUALIZER', '3-BAND', DIM);
  var vs=[ clamp(0.65*lag.b + 0.35*lag.c, 0, 1), lag.h, clamp(0.5*lag.c + 0.5*lag.b, 0, 1) ];
  var names=['LO','MID','HI'], cols=[C_BRIGHT, C_HUE, C_CONTRAST];
  var yTop=Ln.y+34, yBot=Ln.y+Ln.h-30;
  for (var i=0;i<3;i++){
    var x = Ln.x + Ln.w*(0.24 + 0.26*i);
    ctx.strokeStyle='#33333A'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(x, yTop); ctx.lineTo(x, yBot); ctx.stroke();
    ctx.strokeStyle='#222228'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x-9, (yTop+yBot)/2); ctx.lineTo(x+9, (yTop+yBot)/2); ctx.stroke();
    var ky = yBot - vs[i]*(yBot-yTop);
    ctx.fillStyle=cols[i]; rr(x-11, ky-6, 22, 12, 3); ctx.fill();
    var db = -12 + 24*vs[i];
    txt(names[i], x, yBot+14, 9, DIM, 'center');
    txt((db>=0?'+':'')+db.toFixed(1), x, Ln.y+Ln.h-4, 9, cols[i], 'center');
  }
}

// ---------- draw ----------
function draw(t){
  nowT=t;
  fit();
  // prune dead samples (list is also capped at 40 on insert)
  samples = samples.filter(function(s){ return t-s.t < 3.6; });
  var L=layout(); lastLayout=L;
  var src=filmStats(t);
  var lag=filmStats(t-LAG);
  lag.b = clamp(lag.b + boostAt(t-LAG), 0, 1);   // the flashlight reaches the rack late too
  src.b = clamp(src.b + boostAt(t), 0, 1);

  ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
  txt('WILD AT HEART, AS A CONTROL VOLTAGE', L.pad, 22, 12, INK, 'left');
  txt('LDR LAG 0.5 s', W-L.pad, 22, 10, DIM, 'right');

  drawFilm(L, t, src);
  drawCables(L, src);
  drawOsc(L.lanes[0], lag);
  drawFilter(L.lanes[1], lag);
  drawTrem(L.lanes[2], lag, t);
  drawEQ(L.lanes[3], lag);
}

// ---------- pointer: drag on the film = flashlight interference ----------
function pt(e){ return { x: (e.clientX||0), y: (e.clientY||0) }; }
if (canvas.addEventListener){
  canvas.addEventListener('pointerdown', function(e){ dragging=true; var p=pt(e); addSample(p.x,p.y); });
  canvas.addEventListener('pointermove', function(e){ if (dragging){ var p=pt(e); addSample(p.x,p.y); } });
  canvas.addEventListener('pointerup', function(){ dragging=false; });
  canvas.addEventListener('touchstart', function(e){ dragging=true; if (e.touches&&e.touches[0]) addSample(e.touches[0].clientX||0, e.touches[0].clientY||0); });
  canvas.addEventListener('touchmove', function(e){ if (dragging && e.touches&&e.touches[0]) addSample(e.touches[0].clientX||0, e.touches[0].clientY||0); });
  canvas.addEventListener('touchend', function(){ dragging=false; });
}

// ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
var lastT=T0;
if (window.addEventListener) window.addEventListener('resize', function(){ draw(lastT); });
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', function(){ draw(lastT); });
draw(T0);
var startStamp=null;
function frame(stamp){
  if (startStamp===null) startStamp=stamp;
  var t=T0+(stamp-startStamp)/1000;
  lastT=t;
  draw(t);
  if (typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame==='function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
