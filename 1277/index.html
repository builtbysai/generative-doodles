<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomads, Dreamers</title>
<style>
  html, body { margin: 0; padding: 0; background: #1A1C1E; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG (mulberry32) — no Math.random anywhere.
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var W = 0, H = 0, isPhone = false;
  function size() {
    var vw = window.innerWidth, vh = window.innerHeight;
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
      vw = window.visualViewport.width; vh = window.visualViewport.height;
    }
    W = vw; H = vh;
    canvas.width = Math.round(W); canvas.height = Math.round(H);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    var minDim = 1e9;
    if (typeof window.screen !== 'undefined' && window.screen) {
      minDim = Math.min(window.screen.width, window.screen.height);
    }
    isPhone = (minDim < 700) || (H > W * 1.15);
  }

  // ---- Scene data (seeded once) ----
  var TAP_COLORS = ['#B3125B', '#1E6B4F', '#22427C', '#B3125B', '#1E6B4F', '#22427C'];
  var tapestries = [];
  (function () {
    for (var i = 0; i < 6; i++) {
      var r = rng(1000 + i * 77);
      var dots = [];
      for (var d = 0; d < 26; d++) {
        dots.push({ x: r(), y: r(), s: 0.008 + r() * 0.014 });
      }
      tapestries.push({
        phase: r() * Math.PI * 2,
        period: 9 + r() * 6,
        dots: dots,
        trim: r() > 0.5
      });
    }
  })();
  var globes = [];
  (function () {
    for (var i = 0; i < 5; i++) {
      var r = rng(5000 + i * 31);
      globes.push({ x: (i + 1) / 6, len: 0.16 + r() * 0.10, phase: r() * Math.PI * 2, col: TAP_COLORS[i] });
    }
  })();

  // ---- Events (closed-form over recorded lists) ----
  var drags = [];   // {t, strength}
  var sweeps = [];  // {t, pod}
  var downPos = null, downTime = 0, moved = 0;
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = pos(e); downPos = p; downTime = now(); moved = 0;
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!downPos) return;
    var p = pos(e);
    var dx = p.x - downPos.x;
    moved = Math.max(moved, Math.abs(dx));
    if (Math.abs(dx) > 4) {
      drags.push({ t: now(), strength: Math.min(1, Math.abs(dx) / 200) });
      downPos = p;
    }
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!downPos) return;
    var p = pos(e);
    if (moved < 12) {
      var pod = podAt(p.x, p.y);
      if (pod >= 0) sweeps.push({ t: now(), pod: pod });
    }
    downPos = null;
  });

  // ---- Clock: boot flag pins frame one to exactly t = 0 ----
  var T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  var booted = false;
  var lastT = 0;
  function now() {
    if (typeof performance !== 'undefined' && performance.now) return (performance.now() - T0) / 1000;
    return 0;
  }
  function breezeAt(t) {
    var b = 0;
    for (var i = 0; i < drags.length; i++) {
      var dt = t - drags[i].t;
      if (dt >= 0) b += drags[i].strength * Math.exp(-dt / 3);
    }
    return Math.min(2.2, b);
  }
  function sweepAt(t, pod) {
    for (var i = sweeps.length - 1; i >= 0; i--) {
      if (sweeps[i].pod === pod) {
        var dt = t - sweeps[i].t;
        if (dt >= 0 && dt < 1.6) return dt / 1.6;
        if (dt >= 1.6) return -1;
      }
    }
    return -1;
  }

  // Layout helpers shared by draw and hit-testing.
  function layout() {
    var horizon = H * 0.70;
    var podW = Math.min(W / 6 * 0.80, H * 0.16);
    var podH = H * 0.20;
    var podTop = horizon + H * 0.02;
    var stripW = W / 6 * 0.84;
    return { horizon: horizon, podW: podW, podH: podH, podTop: podTop, stripW: stripW };
  }
  function podAt(x, y) {
    var L = layout();
    for (var i = 0; i < 6; i++) {
      var cx = (i + 0.5) * W / 6;
      if (x >= cx - L.podW / 2 && x <= cx + L.podW / 2 && y >= L.podTop && y <= L.podTop + L.podH) return i;
    }
    return -1;
  }
  function circle(x, y, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  function draw(t) {
    lastT = t;
    var L = layout();
    var breeze = breezeAt(t);
    var amp = (isPhone ? H * 0.008 : H * 0.010) * (1 + breeze);

    // Ground and sky.
    ctx.fillStyle = '#1A1C1E'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#D8E4E0'; ctx.fillRect(0, 0, W, L.horizon);
    ctx.fillStyle = '#1A1C1E'; ctx.fillRect(0, L.horizon, W, H - L.horizon);
    // Nomadic garden: low dark tufts along the ground line.
    ctx.fillStyle = '#232A26';
    for (var g = 0; g < 40; g++) {
      var gx = ((g * 197.3) % 1000) / 1000 * W;
      var gw = 6 + ((g * 53) % 14);
      ctx.fillRect(gx, L.horizon - 3, gw, 5);
    }

    // Hanging phala globes between pods.
    for (var gi = 0; gi < globes.length; gi++) {
      var gl = globes[gi];
      var gx2 = gl.x * W;
      var sway = Math.sin(2 * Math.PI * t / 11 + gl.phase) * amp * 0.6;
      var gy = L.horizon * gl.len + H * 0.10;
      ctx.strokeStyle = '#8A93A3'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(gx2, 0); ctx.lineTo(gx2 + sway, gy); ctx.stroke();
      ctx.fillStyle = gl.col;
      circle(gx2 + sway, gy + 10, Math.max(6, W * 0.008));
      ctx.strokeStyle = '#D4A017'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(gx2 + sway - 6, gy + 10); ctx.lineTo(gx2 + sway + 6, gy + 10); ctx.stroke();
    }

    // Tapestries: hang from the top edge, spill over the pods to the earth.
    for (var i = 0; i < 6; i++) {
      var tp = tapestries[i];
      var cx = (i + 0.5) * W / 6;
      var sw = Math.sin(2 * Math.PI * t / tp.period + tp.phase) * amp;
      var top = 0, bot = L.podTop + L.podH * 0.55;
      var half = L.stripW / 2;
      ctx.fillStyle = TAP_COLORS[i];
      ctx.beginPath();
      ctx.moveTo(cx - half, top);
      ctx.lineTo(cx + half, top);
      var steps = 10;
      for (var s = 0; s <= steps; s++) {
        var yy = top + (bot - top) * s / steps;
        var off = Math.sin(2 * Math.PI * t / tp.period + tp.phase + s * 0.5) * amp * (s / steps);
        ctx.lineTo(cx + half + off, yy);
      }
      for (var s2 = steps; s2 >= 0; s2--) {
        var yy2 = top + (bot - top) * s2 / steps;
        var off2 = Math.sin(2 * Math.PI * t / tp.period + tp.phase + s2 * 0.5 + 1.3) * amp * (s2 / steps);
        ctx.lineTo(cx - half + off2, yy2);
      }
      ctx.closePath(); ctx.fill();
      // Gold trim along both hanging edges.
      ctx.strokeStyle = '#D4A017'; ctx.lineWidth = Math.max(1.5, W * 0.0018);
      ctx.beginPath(); ctx.moveTo(cx - half, top); ctx.lineTo(cx - half + sw * 0.8, bot); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + half, top); ctx.lineTo(cx + half + sw * 0.8, bot); ctx.stroke();
      // Sari pattern: seeded diamond dots.
      ctx.fillStyle = '#D4A017';
      for (var d = 0; d < tp.dots.length; d++) {
        var dot = tp.dots[d];
        var dx = cx - half + dot.x * L.stripW + sw * dot.y;
        var dy = top + dot.y * (bot - top);
        var ds = dot.s * W;
        ctx.save(); ctx.translate(dx, dy); ctx.rotate(Math.PI / 4);
        ctx.fillRect(-ds / 2, -ds / 2, ds, ds); ctx.restore();
      }
      // Cloth spill at the foot of the tapestry.
      ctx.fillStyle = TAP_COLORS[i];
      ctx.beginPath();
      ctx.moveTo(cx - half * 0.9, bot);
      ctx.lineTo(cx + half * 0.9, bot);
      ctx.lineTo(cx + half * 1.25, bot + H * 0.03);
      ctx.lineTo(cx - half * 1.25, bot + H * 0.03);
      ctx.closePath(); ctx.fill();
    }

    // Pods: six mirror-polished steel monoliths in a circle, seen frontally.
    for (var p = 0; p < 6; p++) {
      var pcx = (p + 0.5) * W / 6;
      var px = pcx - L.podW / 2, py = L.podTop, pw = L.podW, ph = L.podH;
      var rad = pw / 2;
      ctx.fillStyle = '#8A93A3';
      ctx.beginPath();
      ctx.moveTo(px, py + ph);
      ctx.lineTo(px, py + rad);
      ctx.arc(pcx, py + rad, rad, Math.PI, 0);
      ctx.lineTo(px + pw, py + ph);
      ctx.closePath(); ctx.fill();
      // Mirror top: flat light facet.
      ctx.fillStyle = 'rgba(216,228,224,0.55)';
      ctx.beginPath();
      ctx.moveTo(pcx - rad * 0.7, py + rad * 0.55);
      ctx.lineTo(pcx + rad * 0.2, py + rad * 0.15);
      ctx.lineTo(pcx + rad * 0.7, py + rad * 0.55);
      ctx.lineTo(pcx - rad * 0.1, py + rad * 0.85);
      ctx.closePath(); ctx.fill();
      // Tap light sweep across the pod face.
      var swp = sweepAt(t, p);
      if (swp >= 0) {
        var sx = px + swp * (pw + 30) - 15;
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.beginPath();
        ctx.moveTo(sx, py + rad);
        ctx.lineTo(sx + 14, py + rad);
        ctx.lineTo(sx + 4, py + ph);
        ctx.lineTo(sx - 10, py + ph);
        ctx.closePath(); ctx.fill();
      }
      // Pod base shadow.
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(px - 4, py + ph, pw + 8, 4);
    }

    // Walker silhouettes crossing between the pods.
    for (var w = 0; w < 2; w++) {
      var cycle = 34, cross = 16;
      var wt = (t + w * 17 + 8) % cycle;
      if (wt < cross) {
        var wx = -30 + (W + 60) * (wt / cross);
        if (w === 1) wx = W + 30 - (W + 60) * (wt / cross);
        var wy = L.podTop + L.podH + 6;
        var bob = Math.sin(wt * 9) * 1.5;
        ctx.fillStyle = '#0E1012';
        circle(wx, wy - 26 + bob, Math.max(4, W * 0.004));
        ctx.fillRect(wx - 3, wy - 20 + bob, 6, 20);
      }
    }
  }

  function onResize() {
    size();
    draw(lastT);
  }
  if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);

  size();
  draw(0); // boot-flagged first frame: exactly t = 0, never from the live clock.
  booted = true;
  if (typeof requestAnimationFrame !== 'undefined') {
    (function loop() {
      draw(now());
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
