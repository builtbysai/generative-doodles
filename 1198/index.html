<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Moon Burning</title>
<style>
  html, body { margin: 0; padding: 0; background: #04060D; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1198 "Blue Moon Burning" — joncates study JC7, after blueMoonBurning (2024).
   Three movements, hard cuts only, 90 s loop:
     M1  0.00–25.00  glitch blocks + tearing bands on black
     M2 25.00–60.00  flat-shaded planet, rotating, star field
     M3 60.00–89.85  moon surface close-up, slow pan, terminator shadow
     89.85–90.00     white flash, cycle restarts
   Drag = gravity lens. Silent. First frame drawn synchronously at T0 = 41 s. */

var T0 = 41, LOOP = 90;
var SPACE = '#04060D';
var GLITCH = ['#FF2BD1', '#00E5FF', '#FFB000', '#33FF66'];
var TAU = Math.PI * 2;

/* ---------- seeded hashes / rng (no Math.random anywhere) ---------- */
function hash2(a, b) {
  var x = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
  x = (x ^ (x >> 13)) | 0;
  x = Math.imul(x, 1274126177);
  x = (x ^ (x >> 16)) >>> 0;
  return x / 4294967296;
}
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- canvas / viewport ---------- */
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;

function fit() {
  var vv = window.visualViewport;
  W = (vv && vv.width) || window.innerWidth || 1280;
  H = (vv && vv.height) || window.innerHeight || 800;
  canvas.width = W;
  canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
}

/* ---------- clock (anchored: piece time = T0 + elapsed since load) ---------- */
function nowSec() {
  return ((typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now()) / 1000;
}
var startSec = nowSec();
function elapsed() { return nowSec() - startSec; }

/* ---------- gravity lens (pointer) ---------- */
var lens = { on: false, x: 0, y: 0, downT: -100, relT: -100 };
function lensStrength(te) {
  if (lens.on) return Math.min(1, (te - lens.downT) / 0.12 + 0.25);
  var d = te - lens.relT;
  if (d < 0) return 0;
  return Math.exp(-d / 0.45);
}
function lensDisp(x, y, str) {
  if (str <= 0.003) return [x, y];
  var dx = x - lens.x, dy = y - lens.y;
  var d = Math.sqrt(dx * dx + dy * dy);
  if (d > 180 || d < 0.001) return [x, y];
  var f = (1 - d / 180) * 10 * str; /* tangential swirl, max ~10 px */
  return [x + (-dy / d) * f, y + (dx / d) * f];
}
function pDown(e) { lens.on = true; lens.x = e.clientX; lens.y = e.clientY; lens.downT = elapsed(); }
function pMove(e) { if (lens.on) { lens.x = e.clientX; lens.y = e.clientY; } }
function pUp() { if (lens.on) { lens.on = false; lens.relT = elapsed(); } }
canvas.addEventListener('pointerdown', pDown);
canvas.addEventListener('pointermove', pMove);
canvas.addEventListener('pointerup', pUp);
canvas.addEventListener('pointerleave', pUp);
canvas.addEventListener('touchstart', function (e) { if (e.touches && e.touches[0]) pDown(e.touches[0]); }, { passive: true });
canvas.addEventListener('touchmove', function (e) { if (e.touches && e.touches[0]) pMove(e.touches[0]); }, { passive: true });
canvas.addEventListener('touchend', pUp);

/* ---------- precomputed seeded fields (relative coords) ---------- */
/* M1 sparse stars */
var stars1 = [];
(function () { var r = mulberry32(119810); for (var i = 0; i < 30; i++) stars1.push({ x: r(), y: r() }); })();

/* M1 glitch blocks: home zone + base size (fractions of W / H) */
var blocks = [];
(function () {
  var r = mulberry32(119811);
  for (var i = 0; i < 14; i++) blocks.push({
    hx: 0.07 + r() * 0.80, hy: 0.07 + r() * 0.82,
    w: 0.09 + r() * 0.09, h: 0.05 + r() * 0.05,
    seed: (r() * 100000) | 0
  });
})();

/* M2 star field */
var stars2 = [];
(function () {
  var r = mulberry32(119820);
  for (var i = 0; i < 160; i++) stars2.push({ x: r(), y: r(), s: 0.6 + r() * 1.5, p: r() * 10, blue: r() < 0.3 });
})();

/* M2 landmasses: blob polygons in longitude strips */
var lands = [];
(function () {
  for (var i = 0; i < 7; i++) {
    var r = mulberry32(2200 + i * 17);
    var pts = [];
    for (var k = 0; k < 10; k++) {
      var a = k / 10 * TAU, rad = 0.5 + r() * 0.5;
      pts.push([Math.cos(a) * rad, Math.sin(a) * rad * 0.78]);
    }
    lands.push({ lon: -2.4 + i * 0.8 + (r() - 0.5) * 0.5, lat: (r() - 0.5) * 1.05, size: 0.34 + r() * 0.26, pts: pts });
  }
})();

/* M2 cloud wisps: clusters of flat ellipses in longitude strips */
var clouds = [];
(function () {
  for (var i = 0; i < 10; i++) {
    var r = mulberry32(3300 + i * 23);
    var els = [], n = 3 + ((r() * 3) | 0);
    for (var k = 0; k < n; k++) els.push({ dx: (r() - 0.5) * 1.6, dy: (r() - 0.5) * 0.5, rx: 0.35 + r() * 0.5, ry: 0.16 + r() * 0.14 });
    clouds.push({ lon: -2.6 + i * 0.55 + (r() - 0.5) * 0.4, lat: (r() - 0.5) * 1.2, scale: 0.13 + r() * 0.09, els: els });
  }
})();

/* M3 moon surface: mottling + craters in a field larger than the frame */
var mottle = [];
(function () {
  var r = mulberry32(5500);
  for (var i = 0; i < 26; i++) mottle.push({ fx: -0.10 + r() * 1.30, fy: -0.08 + r() * 1.16, rx: 0.05 + r() * 0.11, dark: r() < 0.5 });
})();
var craters = [], bigCrater = 0;
(function () {
  var r = mulberry32(4400);
  for (var i = 0; i < 40; i++) {
    var c = { fx: -0.15 + r() * 1.35, fy: -0.12 + r() * 1.24, r: 0.010 + r() * 0.042 };
    craters.push(c);
    if (c.r > craters[bigCrater].r) bigCrater = i;
  }
})();

/* ---------- movement 1: glitch blocks + tearing bands ---------- */
function drawM1(m, str) {
  var i, k, s = Math.floor(m / 0.4);
  /* sparse stars */
  ctx.fillStyle = '#FFFFFF';
  for (i = 0; i < stars1.length; i++) {
    var p = lensDisp(stars1[i].x * W, stars1[i].y * H, str);
    ctx.globalAlpha = 0.12 + 0.45 * hash2(i * 3 + 1, Math.floor(m * 1.2));
    ctx.fillRect(p[0], p[1], 2, 2);
  }
  ctx.globalAlpha = 1;
  /* tearing bands */
  var bandY = [0.22, 0.52, 0.78];
  for (var b = 0; b < 3; b++) {
    var by = bandY[b] * H, bh = 0.055 * H;
    var ox = (hash2(91 + b * 7, s) - 0.5) * 0.12 * W;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, by, W, bh); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.fillRect(0, by, W, bh);
    for (k = 0; k < 26; k++) {
      var dx = (((k * 0.043 + hash2(b * 13 + 1, s) * 0.02) % 1) * W + ox) % W;
      if (dx < 0) dx += W;
      var dw = (0.01 + hash2(k * 7 + 1, b * 31 + s) * 0.03) * W;
      ctx.fillStyle = GLITCH[(k + b + s) % 4];
      ctx.globalAlpha = 0.5;
      ctx.fillRect(dx, by + (k % 3) * bh / 3 + 2, dw, 2);
    }
    ctx.restore();
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = GLITCH[b % 4];
    ctx.fillRect(0, by, W, 1);
    ctx.globalAlpha = 1;
  }
  /* glitch blocks: jump in hash steps inside home zones */
  for (i = 0; i < blocks.length; i++) {
    var bl = blocks[i];
    var sf = 0.85 + 0.3 * hash2(bl.seed + 9, s);
    var bw = bl.w * W * sf, bh2 = bl.h * H * sf;
    var bx = bl.hx * W + (hash2(bl.seed, s) - 0.5) * 0.07 * W - bw / 2;
    var byy = bl.hy * H + (hash2(bl.seed + 5, s) - 0.5) * 0.06 * H - bh2 / 2;
    bx = Math.max(-0.02 * W, Math.min(W - bw * 0.6, bx));
    byy = Math.max(-0.02 * H, Math.min(H - bh2 * 0.6, byy));
    var ctr = lensDisp(bx + bw / 2, byy + bh2 / 2, str);
    bx += ctr[0] - (bx + bw / 2); byy += ctr[1] - (byy + bh2 / 2);
    var col = GLITCH[(hash2(bl.seed + 3, s) * 4) | 0];
    if (i % 4 === 0) { /* channel-split ghosts */
      var go = 3 + 3 * hash2(bl.seed + 21, s);
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = GLITCH[(i + 1) % 4]; ctx.fillRect(bx - go, byy, bw, bh2);
      ctx.fillStyle = GLITCH[(i + 2) % 4]; ctx.fillRect(bx + go, byy, bw, bh2);
    }
    var mode = i % 3;
    ctx.fillStyle = col;
    if (mode === 2) {
      ctx.globalAlpha = 0.9; ctx.lineWidth = 2; ctx.strokeStyle = col;
      ctx.strokeRect(bx, byy, bw, bh2);
    } else {
      ctx.globalAlpha = mode === 0 ? 0.9 : 0.55;
      ctx.fillRect(bx, byy, bw, bh2);
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------- movement 2: the planet ---------- */
function drawM2(lt, str) {
  var i, k;
  /* star field */
  for (i = 0; i < stars2.length; i++) {
    var st = stars2[i];
    var p = lensDisp(st.x * W, st.y * H, str);
    ctx.globalAlpha = 0.25 + 0.75 * hash2(i * 3 + 1, Math.floor(lt * 1.5 + st.p));
    ctx.fillStyle = st.blue ? '#BFD9FF' : '#FFFFFF';
    ctx.fillRect(p[0], p[1], st.s, st.s);
  }
  ctx.globalAlpha = 1;

  var cx = W / 2, cy = H / 2, R = 0.225 * W; /* planet = 45% of width */
  var rot = (lt / LOOP) * (Math.PI / 6);     /* 30 degrees per 90 s cycle */

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();
  ctx.fillStyle = '#2B6CB0';
  ctx.fillRect(cx - R, cy - R, R * 2, R * 2);

  /* landmasses */
  ctx.fillStyle = '#1E3A2F';
  for (i = 0; i < lands.length; i++) {
    var L = lands[i].lon + rot, c = Math.cos(L);
    if (c <= 0.08) continue;
    var sx = cx + R * Math.sin(L) * 0.94, sy = cy + lands[i].lat * R * 0.9;
    var hw = lands[i].size * R * c, hh = lands[i].size * R * 0.62;
    ctx.globalAlpha = 0.92;
    ctx.beginPath();
    for (k = 0; k < lands[i].pts.length; k++) {
      var px = sx + lands[i].pts[k][0] * hw, py = sy + lands[i].pts[k][1] * hh;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* clouds: own slower rotation + independent drift */
  ctx.fillStyle = '#E8F4FF';
  for (i = 0; i < clouds.length; i++) {
    var cl = clouds[i];
    var LC = cl.lon + rot * 0.5 + lt * 0.0015, cC = Math.cos(LC);
    if (cC <= 0.08) continue;
    var wx = cx + R * Math.sin(LC) * 0.94, wy = cy + cl.lat * R * 0.88;
    var wp = lensDisp(wx, wy, str);
    wx = wp[0]; wy = wp[1];
    ctx.globalAlpha = 0.75;
    for (k = 0; k < cl.els.length; k++) {
      var el = cl.els[k];
      ctx.beginPath();
      ctx.ellipse(wx + el.dx * cl.scale * R * cC, wy + el.dy * cl.scale * R,
                  Math.max(0.15, cC) * el.rx * cl.scale * R, el.ry * cl.scale * R, 0, 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  /* flat shading: two offset tone bands on the right limb (no gradients) */
  ctx.fillStyle = '#1D4E79'; ctx.globalAlpha = 0.45;
  ctx.beginPath(); ctx.arc(cx + 0.50 * R, cy - 0.08 * R, R, 0, TAU); ctx.fill();
  ctx.fillStyle = '#13314E'; ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.arc(cx + 0.88 * R, cy + 0.05 * R, R, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();

  /* rim */
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU);
  ctx.strokeStyle = 'rgba(191,217,255,0.28)'; ctx.lineWidth = 1.5; ctx.stroke();
}

/* ---------- movement 3: the moon ---------- */
function drawM3(lt, str) {
  var m3 = lt - 60;
  var pan = (m3 / 30) * 0.05 * W; /* 5% of width across the movement */
  var i, k;
  ctx.fillStyle = '#9AA0A6';
  ctx.fillRect(0, 0, W, H);

  /* mottling */
  for (i = 0; i < mottle.length; i++) {
    var mo = mottle[i];
    var mp = lensDisp(mo.fx * W - pan, mo.fy * H, str);
    ctx.fillStyle = mo.dark ? '#85898F' : '#ABAEB3';
    ctx.globalAlpha = 0.45;
    ctx.beginPath();
    ctx.ellipse(mp[0], mp[1], mo.rx * W, mo.rx * W * 0.55, 0, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* rays from the largest crater */
  var bc = craters[bigCrater];
  var bx = bc.fx * W - pan, by = bc.fy * H, br = bc.r * W;
  ctx.fillStyle = '#FFFFFF';
  for (k = 0; k < 6; k++) {
    var ang = hash2(77, k) * TAU, len = br * (3 + hash2(78, k) * 3), wHalf = 0.03 + hash2(79, k) * 0.03;
    ctx.globalAlpha = 0.10;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(bx + Math.cos(ang - wHalf) * len, by + Math.sin(ang - wHalf) * len);
    ctx.lineTo(bx + Math.cos(ang + wHalf) * len, by + Math.sin(ang + wHalf) * len);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* craters: darker rim, lighter floor offset to the light, inner shadow */
  for (i = 0; i < craters.length; i++) {
    var cr = craters[i];
    var cp = lensDisp(cr.fx * W - pan, cr.fy * H, str);
    var x = cp[0], y = cp[1], r = cr.r * W;
    if (x + r < -20 || x - r > W + 20 || y + r < -20 || y - r > H + 20) continue;
    ctx.fillStyle = '#82868C';
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#B7BBC0';
    ctx.beginPath(); ctx.arc(x - r * 0.14, y - r * 0.14, r * 0.74, 0, TAU); ctx.fill();
    ctx.fillStyle = '#8E9298'; ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.arc(x + r * 0.30, y + r * 0.30, r * 0.38, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* terminator: flat shadow disc, curved edge, right ~45% in shadow */
  ctx.fillStyle = SPACE; ctx.globalAlpha = 0.88;
  ctx.beginPath(); ctx.arc(W * 1.45, H * 0.5, W * 0.90, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}

/* ---------- main draw ---------- */
function draw(tAbs) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var lt = ((tAbs % LOOP) + LOOP) % LOOP;
  var str = lensStrength(Math.max(0, tAbs - T0));
  ctx.fillStyle = SPACE;
  ctx.fillRect(0, 0, W, H);
  if (lt >= 89.85) { ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H); return; }
  if (lt < 25) drawM1(lt, str);
  else if (lt < 60) drawM2(lt, str);
  else drawM3(lt, str);
}

fit();
draw(T0); /* synchronous first frame at fixed phase T0 = 41 s (movement 2) */
if (typeof requestAnimationFrame === 'function') {
  var loopFn = function () { draw(T0 + elapsed()); requestAnimationFrame(loopFn); };
  requestAnimationFrame(loopFn);
}
if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', function () { fit(); draw(T0 + elapsed()); });
}
window.addEventListener('resize', function () { fit(); draw(T0 + elapsed()); });
</script>
</body>
</html>
