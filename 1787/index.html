<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Hundred and Ninety Objects</title>
<style>
html, body { margin: 0; padding: 0; background: #38342e; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#38342e';
var PANEL = '#2b2823';
var PANEL_EDGE = 'rgba(245,242,232,0.16)';
var INK = '#cfc8b8';
var INK_DIM = '#6e685c';
var CHALK = '#f5f2e8';
var AMBER = '#e8c46a';
var WOOD = '#d9c49a';
var TWINE = '#2a2118';
var FRAME_T = 60.0; /* fixed phase: t = 60 s, 60 names parsed, name 60 mid-parse */
var NAME_DUR = 1.0; /* seconds per name; one name crosses the reading line per second */
var TOTAL = 490; /* objects in a full cycle; cycle = 490 s, then a quiet reset */
var CYCLE = TOTAL * NAME_DUR;
var VOWEL_TINT = { a: '#c98a3d', e: '#d9b45b', i: '#e3d98f', o: '#8a5a2b', u: '#7a6a58' };
var PLATE_FILL = '#ffffff';
var PLATE_LINE = 'rgba(0,0,0,0.28)';
var PLATE_INK = '#2b2b28';
var HINT_INK = '#2b2b28';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
/* hex colour to [r,g,b] */
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* Fixed authored table of 285 real moon-map names: craters, maria, sinus,
   lacus and palus features, montes, mons, valles and rimae. Spelled without
   diacritics, as a typewriter would set them. The 490-object cycle runs
   through the table, then through it again; repeat passes carve a fresh
   object for the same name, with fresh carved jitter from the placement
   index, so the field still reaches 490 distinct forms. */
var NAMES = [
'Tycho','Copernicus','Kepler','Aristarchus','Plato','Clavius','Grimaldi','Eratosthenes','Archimedes','Ptolemaeus',
'Alphonsus','Arzachel','Theophilus','Cyrillus','Catharina','Posidonius','Petavius','Langrenus','Vendelinus','Furnerius',
'Janssen','Maurolycus','Stofler','Maginus','Moretus','Longomontanus','Wilhelm','Hevelius','Riccioli','Schickard',
'Wargentin','Phocylides','Nasmyth','Mersenius','Gassendi','Vitello','Doppelmayer','Hippalus','Campanus','Mercator',
'Capuanus','Kies','Bullialdus','Konig','Euclides','Lansberg','Reinhold','Hortensius','Gambart','Lalande',
'Mosting','Flammarion','Herschel','Pallas','Bode','Ukert','Triesnecker','Hyginus','Agrippa','Godin',
'Manners','Arago','Ritter','Sabine','Delambre','Theon','Taylor','Alpetragius','Argelander','Airy',
'Playfair','Donati','Faye','Delaunay','La Caille','Blanchinus','Werner','Aliacensis','Walther','Regiomontanus',
'Purbach','Hell','Lexell','Ball','Gauricus','Wurzelbauer','Scheiner','Anaxagoras','Anaximander','Pythagoras',
'Philolaus','Carpenter','Pascal','Brianchon','Desargues','Meton','Euctemon','De Sitter','Democritus','Gartner',
'Arnold','Endymion','Atlas','Hercules','Cepheus','Franklin','Berzelius','Geminus','Messala','Cleomedes',
'Burckhardt','Gauss','Hahn','Berosus','Riemann','Schorr','Humboldt','Curie','Barnard','Schomberger',
'Simpelius','Boussingault','Helmholtz','Manzinus','Boguslawsky','Newton','Cabeus','Amundsen','Scott','Shackleton',
'Drygalski','Ashbrook','Boltzmann','Hausen','Anuchin','Lamb','Zeeman','Schrodinger','Planck','Poincare',
'Antoniadi','Minnaert','Lyman','Bell','Comrie','Alder','Von Karman','Oppenheimer','Apollo','Leibnitz',
'Finsen','Leavitt','Van de Graaff','Aitken','Tsiolkovskiy','Fermi','Mendeleev','Pasteur','Hilbert','Milne',
'Guthnick','Billy','Birt','Aratus','Conon','Galilaei','Galle','Dawes','Plinius','Macrobius',
'Taruntius','Proclus','Picard','Peirce','Swift','Yerkes','Lick','Glaisher','Maskelyne','Moltke',
'Torricelli','Dionysius','Censorinus','Gutenberg','Magelhaens','Colombo','Santbech','Cook','Monge','Lindbergh',
'Messier','Lubbock','Secchi',
'Mare Imbrium','Mare Serenitatis','Mare Tranquillitatis','Mare Nubium','Mare Humorum','Mare Crisium','Mare Fecunditatis','Mare Nectaris','Mare Vaporum','Mare Frigoris',
'Mare Cognitum','Mare Insularum','Mare Undarum','Mare Spumans','Mare Smythii','Mare Marginis','Mare Orientale','Mare Ingenii','Mare Moscoviense','Mare Australe',
'Mare Humboldtianum','Mare Anguis','Oceanus Procellarum',
'Sinus Iridum','Sinus Roris','Sinus Aestuum','Sinus Medii','Lacus Mortis','Lacus Somniorum','Palus Somni','Palus Epidemiarum','Palus Putredinis',
'Montes Apenninus','Montes Alpes','Montes Caucasus','Montes Carpatus','Montes Jura','Montes Pyrenaeus','Montes Taurus','Montes Haemus','Montes Riphaeus','Montes Cordillera',
'Montes Rook','Montes Spitzbergen','Montes Harbinger',
'Mons Pico','Mons Piton','Mons Hadley','Mons Huygens','Mons Bradley','Mons Ampere','Mons Argaeus','Mons Blanc','Mons Delisle','Mons Gruithuisen',
'Mons Herodotus','Mons La Hire','Mons Maraldi','Mons Penck','Mons Rumker','Mons Vitruvius','Mons Wolff','Mons Vinogradov','Mons Usov','Mons Esam',
'Mons Agnes','Mons Dieter','Mons Dilip','Mons Ganau','Mons Andre','Mons Christian','Mons Moro','Mons Ardeshir',
'Vallis Schroteri','Vallis Rheita','Vallis Snellius','Vallis Bouvard','Vallis Baade','Vallis Inghirami','Vallis Alpes','Vallis Planck',
'Rima Hyginus','Rima Ariadaeus','Rima Triesnecker','Rima Cauchy','Rima Hadley','Rima Posidonius','Rima Goclenius','Rima Sirsalis','Rima Ramsden','Rima Hypatia',
'Rima Sosigenes'
];
function countVowels(n) {
  var m = n.toLowerCase().match(/[aeiou]/g);
  return m ? m.length : 0;
}
function vowelSeq(n) {
  var m = n.toLowerCase().match(/[aeiou]/g);
  return m ? m.join(' ') : '';
}
/* Tint: pale wood mixed toward the average of the name's vowel tints,
   so the tint shifts with which vowels the name contains. */
function tintFor(n) {
  var m = n.toLowerCase().match(/[aeiou]/g) || [];
  if (!m.length) return WOOD;
  var r = 0, g = 0, b = 0, k;
  for (k = 0; k < m.length; k++) {
    var c = rgb(VOWEL_TINT[m[k]]);
    r += c[0]; g += c[1]; b += c[2];
  }
  r /= m.length; g /= m.length; b /= m.length;
  var w = rgb(WOOD);
  return 'rgb(' + Math.round(w[0] * 0.55 + r * 0.45) + ',' +
    Math.round(w[1] * 0.55 + g * 0.45) + ',' +
    Math.round(w[2] * 0.55 + b * 0.45) + ')';
}
/* Object table: one entry per placement 0..489. Name cycles through the
   table; height is exactly proportional to the vowel count, tint follows
   the vowels, and the carved jitter (width, lean, top shape, grain) is
   seeded from the placement index, never from runtime randomness. */
var OBJ = [];
(function buildObjects() {
  var rng = mulberry32(1787);
  var i;
  for (i = 0; i < TOTAL; i++) {
    var name = NAMES[i % NAMES.length];
    OBJ.push({
      name: name, v: countVowels(name), tint: tintFor(name),
      wj: 0.85 + rng() * 0.30,
      lean: (rng() * 2 - 1) * 0.06,
      top: Math.floor(rng() * 3),
      grain: rng()
    });
  }
})();
/* Surface grain: faint horizontal wood strokes across the field. */
var GRAIN = [];
(function buildGrain() {
  var rng = mulberry32(1787 + 500);
  var g;
  for (g = 0; g < 22; g++) {
    GRAIN.push({ fy: rng(), fx: rng() * 0.3, len: 0.4 + rng() * 0.5, a: 0.04 + rng() * 0.05, wob: (rng() * 2 - 1) * 6 });
  }
})();
/* Twine strands lying on the surface, and drifting wood shavings. */
var TWINE = [];
(function buildTwine() {
  var rng = mulberry32(1787 + 700);
  var s;
  for (s = 0; s < 4; s++) {
    var x0 = rng() * 0.6;
    var x1 = x0 + 0.2 + rng() * 0.25;
    var y0 = 0.5 + rng() * 0.45;
    var y1 = 0.5 + rng() * 0.45;
    TWINE.push({ x0: x0, y0: y0, cx: x0 + (x1 - x0) * 0.5, cy: Math.min(y0, y1) - 0.04 - rng() * 0.06, x1: x1, y1: y1 });
  }
})();
var SHAV = [];
(function buildShavings() {
  var rng = mulberry32(1787 + 900);
  var s;
  for (s = 0; s < 36; s++) {
    SHAV.push({
      bx: rng(), by: rng(), len: 3 + rng() * 5, ang: rng() * TAU,
      amp: 6 + rng() * 9, ph: rng() * TAU, sp: 0.03 + rng() * 0.03
    });
  }
})();
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* layout field */
var PAN = { x: 0, y: 0, w: 0, h: 0 }; /* list panel, left */
var FLD = { x: 0, y: 0, w: 0, h: 0 }; /* object field, right */
var lineY = 0, lineH = 19, namePx = 13, curPx = 16, smallPx = 11, plateH = 52, titlePx = 20;
var COLS = 14, ROWS = 35, cellW = 20, pitch = 20;
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
  titlePx = isPhone ? 16 : 20;
  smallPx = isPhone ? 11 : 12;
  plateH = titlePx + smallPx + 20;
  namePx = isPhone ? 10 : 13;
  curPx = isPhone ? 12 : 16;
  lineH = isPhone ? 15 : 19;
  var panelTop = 12 + plateH + 14;
  var panelW = isPhone ? VW * 0.42 : F.w / 3;
  var panelX = isPhone ? 0 : F.x;
  var fieldBottom = isPhone ? VH : F.y + F.h;
  PAN = { x: panelX, y: panelTop, w: panelW, h: fieldBottom - panelTop - 12 };
  FLD = {
    x: PAN.x + PAN.w + 8,
    y: isPhone ? panelTop : F.y,
    w: (isPhone ? VW : F.x + F.w) - (PAN.x + PAN.w + 8) - 12,
    h: fieldBottom - (isPhone ? panelTop : F.y) - 12
  };
  lineY = PAN.y + PAN.h * 0.45;
  COLS = isPhone ? 8 : 14;
  ROWS = Math.ceil(TOTAL / COLS);
  cellW = FLD.w / COLS;
  pitch = (FLD.h - 40) / ROWS;
}
function cycleT(t) { return ((t % CYCLE) + CYCLE) % CYCLE; }
function parsedCount(t) { return Math.floor(cycleT(t)); }
/* Quiet reset: field fades out over the last 3 s of a cycle and back in
   over the first 4 s of the next. At frame one (t = 60) the fade is 1. */
function fieldFade(t) {
  var ct = cycleT(t);
  if (ct < 4) return ct / 4;
  if (ct > CYCLE - 3) return (CYCLE - ct) / 3;
  return 1;
}
function slotXY(i) {
  var col = i % COLS, row = Math.floor(i / COLS);
  return {
    x: FLD.x + (col + 0.5) * cellW,
    y: FLD.y + FLD.h - 14 - row * pitch,
    col: col, row: row
  };
}
function drawGround() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  var g = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.max(VW, VH) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.16)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, VW, VH);
}
function drawPanel() {
  ctx.fillStyle = PANEL;
  ctx.fillRect(PAN.x, PAN.y, PAN.w, PAN.h);
  ctx.strokeStyle = PANEL_EDGE;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(PAN.x + PAN.w + 0.5, PAN.y);
  ctx.lineTo(PAN.x + PAN.w + 0.5, PAN.y + PAN.h);
  ctx.stroke();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = INK_DIM;
  ctx.fillText('MOON-MAP NAMES', PAN.x + 10, PAN.y + 12);
}
function drawList(t) {
  var ct = cycleT(t);
  var clipTop = PAN.y + 26, clipBot = PAN.y + PAN.h - (isPhone ? 64 : 26);
  ctx.save();
  ctx.beginPath();
  ctx.rect(PAN.x + 2, clipTop, PAN.w - 4, clipBot - clipTop);
  ctx.clip();
  ctx.font = namePx + 'px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  var k0 = Math.max(0, Math.floor(ct - (clipBot - lineY) / lineH) - 1);
  var k1 = Math.min(TOTAL - 1, Math.ceil(ct + (lineY - clipTop) / lineH) + 1);
  var k, y, d, a;
  for (k = k0; k <= k1; k++) {
    y = lineY + (k - ct) * lineH;
    if (Math.abs(y - lineY) < 30) continue; /* parse band: drawn separately */
    if (y > clipBot || y < clipTop) continue;
    d = Math.abs(y - lineY);
    a = d < 60 ? 0.35 + 0.65 * (d - 30) / 30 : 1;
    ctx.fillStyle = y < lineY ? rgba(INK_DIM, a) : rgba(INK, a);
    ctx.fillText(NAMES[k % NAMES.length].toUpperCase(), PAN.x + 10, y);
  }
  ctx.restore();
}
/* The parse moment: the name at the chalk-white reading line, its vowels
   lit amber, and the vowel breakdown with the count below the line. */
function drawParse(t) {
  var ct = cycleT(t);
  var k = Math.floor(ct);
  if (k >= TOTAL) return;
  var nm = NAMES[k % NAMES.length].toUpperCase();
  var o = OBJ[k];
  ctx.strokeStyle = CHALK;
  ctx.lineWidth = isPhone ? 1.5 : 2;
  ctx.beginPath();
  ctx.moveTo(PAN.x + 8, lineY);
  ctx.lineTo(PAN.x + PAN.w - 8, lineY);
  ctx.stroke();
  ctx.fillStyle = CHALK;
  ctx.beginPath();
  ctx.moveTo(PAN.x + 2, lineY - 5);
  ctx.lineTo(PAN.x + 2, lineY + 5);
  ctx.lineTo(PAN.x + 9, lineY);
  ctx.closePath();
  ctx.fill();
  var fs = curPx;
  ctx.font = 'bold ' + fs + 'px monospace';
  while (fs > 8 && ctx.measureText(nm).width > PAN.w - 20) {
    fs -= 1;
    ctx.font = 'bold ' + fs + 'px monospace';
  }
  var x = PAN.x + 10, y = lineY - 12, c;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  for (c = 0; c < nm.length; c++) {
    var ch = nm[c];
    ctx.fillStyle = /[AEIOU]/.test(ch) ? AMBER : CHALK;
    ctx.fillText(ch, x, y);
    x += ctx.measureText(ch).width;
  }
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = INK;
  ctx.fillText(vowelSeq(nm) + ' · ' + o.v + (o.v === 1 ? ' vowel' : ' vowels'), PAN.x + 10, lineY + 15);
}
/* Dotted chalk thread from the reading line to the slot of the object
   being carved now; fades out over 3 s after placement. */
function drawConnector(t) {
  var ct = cycleT(t);
  var k = Math.floor(ct);
  if (k >= TOTAL) return;
  var age = ct - k;
  if (age > 3) return;
  var s = slotXY(k);
  ctx.save();
  ctx.strokeStyle = 'rgba(245,242,232,' + (0.35 * (1 - age / 3)).toFixed(4) + ')';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 4]);
  ctx.beginPath();
  ctx.moveTo(PAN.x + PAN.w - 4, lineY);
  ctx.lineTo(s.x, s.y - 6);
  ctx.stroke();
  ctx.restore();
}
function drawGrain() {
  var g;
  for (g = 0; g < GRAIN.length; g++) {
    var gr = GRAIN[g];
    var gy = FLD.y + 16 + gr.fy * (FLD.h - 32);
    var gx = FLD.x + gr.fx * FLD.w * 0.3;
    var gl = gr.len * FLD.w;
    ctx.strokeStyle = 'rgba(0,0,0,' + gr.a.toFixed(4) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(gx, gy);
    ctx.quadraticCurveTo(gx + gl / 2, gy + gr.wob, gx + gl, gy);
    ctx.stroke();
  }
}
function drawObject(i, t) {
  var o = OBJ[i];
  var s = slotXY(i);
  var age = cycleT(t) - i;
  var settle = age >= 0.8 ? 1 : (1 - Math.pow(1 - age / 0.8, 3));
  var h = pitch * (0.55 + 0.13 * o.v);
  var w = cellW * 0.58 * o.wj;
  var sc = 1 + 0.35 * (1 - settle);
  var yOff = -8 * (1 - settle);
  var hh = h * sc;
  ctx.save();
  ctx.translate(s.x, s.y + yOff);
  ctx.rotate(o.lean * settle);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(0, 0, w * 0.62, Math.max(1.5, w * 0.16), 0, 0, TAU);
  ctx.fill();
  var topW = w * 0.78;
  ctx.fillStyle = o.tint;
  ctx.beginPath();
  ctx.moveTo(-w / 2, 0);
  if (o.top === 0) {
    ctx.lineTo(-topW / 2, -hh);
    ctx.lineTo(topW / 2, -hh);
  } else if (o.top === 1) {
    ctx.lineTo(-topW / 2, -hh * 0.82);
    ctx.quadraticCurveTo(0, -hh * 1.12, topW / 2, -hh * 0.82);
  } else {
    ctx.lineTo(-topW / 2, -hh * 0.8);
    ctx.lineTo(0, -hh * 1.15);
    ctx.lineTo(topW / 2, -hh * 0.8);
  }
  ctx.lineTo(w / 2, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(20,18,15,0.35)';
  ctx.lineWidth = 1;
  ctx.stroke();
  /* carved grain: two wavy vertical strokes */
  var gl;
  for (gl = 0; gl < 2; gl++) {
    var gx = -w * 0.2 + gl * w * 0.35 + (o.grain - 0.5) * w * 0.1;
    ctx.strokeStyle = 'rgba(60,45,25,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(gx, -3);
    ctx.quadraticCurveTo(gx + (o.grain - 0.5) * 4, -hh / 2, gx, -hh + 4);
    ctx.stroke();
  }
  if (o.grain > 0.6) {
    ctx.strokeStyle = 'rgba(60,45,25,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-topW / 2 + 1, -hh * 0.75);
    ctx.lineTo(topW / 2 - 1, -hh * 0.75);
    ctx.stroke();
  }
  ctx.restore();
}
function drawField(t) {
  var ct = cycleT(t);
  var fade = fieldFade(t);
  var parsed = parsedCount(t);
  ctx.save();
  ctx.globalAlpha = fade;
  drawGrain();
  /* Back rows first, front rows last, so nearer objects overlap farther
     ones; placement order is bottom-up, so reverse placement order. */
  var i;
  for (i = Math.min(parsed, TOTAL - 1); i >= 0; i--) drawObject(i, t);
  var s;
  for (s = 0; s < TWINE.length; s++) {
    var tw = TWINE[s];
    ctx.strokeStyle = TWINE;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(FLD.x + tw.x0 * FLD.w, FLD.y + tw.y0 * FLD.h);
    ctx.quadraticCurveTo(FLD.x + tw.cx * FLD.w, FLD.y + tw.cy * FLD.h, FLD.x + tw.x1 * FLD.w, FLD.y + tw.y1 * FLD.h);
    ctx.stroke();
  }
  for (s = 0; s < SHAV.length; s++) {
    var sh = SHAV[s];
    var sx = FLD.x + sh.bx * FLD.w + sh.amp * Math.sin(sh.sp * 10 * ct + sh.ph);
    var sy = FLD.y + sh.by * FLD.h + sh.amp * 0.6 * Math.cos(sh.sp * 7 * ct + sh.ph * 1.7);
    ctx.strokeStyle = 'rgba(227,211,174,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(sx, sy, sh.len, sh.ang, sh.ang + 1.2);
    ctx.stroke();
  }
  ctx.restore();
  /* The rule, stated plainly at the top of the field, kept clear of the
     title plate and split over two lines when the field is narrow. */
  ctx.font = smallPx + 'px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = INK_DIM;
  var legendY = Math.max(FLD.y + 6, 12 + plateH + 8);
  var legend = 'HEIGHT BY VOWEL COUNT · TINT BY THE VOWELS';
  if (ctx.measureText(legend).width > FLD.w - 8) {
    ctx.fillText('HEIGHT BY VOWEL COUNT', FLD.x + 4, legendY);
    ctx.fillText('TINT BY THE VOWELS', FLD.x + 4, legendY + smallPx + 4);
  } else {
    ctx.fillText(legend, FLD.x + 4, legendY);
  }
}
function drawTally(t) {

function draw() {
