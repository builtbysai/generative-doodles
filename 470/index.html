<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Yellow Wall</title>
<style>
  html, body { margin: 0; padding: 0; background: #F5F2EA; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var WALL = '#F5F2EA';
  var PAINT = '#F2C14E';
  var LADDER = '#8A6A45';
  var SWEATER = '#2A2A30';
  var TROUSERS = '#3A3A40';
  var SKIN = '#E8B88A';
  var HANDLE = '#6B5B45';

  var W = 0, H = 0, DPR = 1, PHONE = false;

  // ---- paint layer as data: a coverage grid over the wall, in fractions ----
  var COLS = 100, ROWS = 130;
  var cells = new Uint8Array(COLS * ROWS);
  var paintedCount = 0;

  // ---- layout (recomputed on resize) ----
  var U = 0;            // min(W,H)
  var ladTop = 0, ladBot = 0, ladCX = 0, ladHalf = 0, railW = 0, rungStep = 0;
  var manH = 0;         // man height in px
  var rollW = 0, rollH = 0;

  // ---- state ----
  var feetY = 0, feetTarget = 0;          // man's feet (px)
  var rollX = 0, rollY = 0;               // roller centre, actual (px)
  var rollTX = 0, rollTY = 0;             // roller centre, target (px)
  var stampX = 0, stampY = 0;             // last stamped roller centre
  var painting = false;
  var done = false, returning = false;
  var downX = 0, downY = 0, downT = 0, downMoved = 0;

  function restPose() {
    feetY = feetTarget = ladBot;
    rollX = rollTX = ladCX + ladHalf + rollW * 0.62;
    rollY = rollTY = feetY - manH * 0.92;
    stampX = rollX; stampY = rollY;
  }

  function resize() {
    var vv = window.visualViewport;
    W = vv && vv.width ? vv.width : (window.innerWidth || 0);
    H = vv && vv.height ? vv.height : (window.innerHeight || 0);
    DPR = window.devicePixelRatio || 1;
    if (window.screen && window.screen.width) {
      PHONE = Math.min(window.screen.width, window.screen.height) < 700;
    } else {
      PHONE = H > W * 1.15;
    }
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);

    U = Math.min(W, H);
    ladCX = W * 0.5;
    ladTop = H * 0.10;
    ladBot = H * 0.90;
    ladHalf = Math.max(U * 0.052, 14);
    railW = Math.max(U * 0.011, 4);
    rungStep = H * 0.05;
    manH = (PHONE ? 0.30 : 0.22) * U;
    rollW = manH * 0.92;
    rollH = manH * 0.17;

    if (!resize.done) { restPose(); resize.done = true; }
    else {
      // keep proportions sane after a resize
      feetY = Math.min(feetY, ladBot); feetTarget = Math.min(feetTarget, ladBot);
      rollX = Math.min(Math.max(rollX, 0), W); rollY = Math.min(Math.max(rollY, 0), H);
      rollTX = rollX; rollTY = rollY;
    }
    draw();
  }

  // ---- painting ----
  function stamp(cx, cy) {
    var x0 = (cx - rollW / 2) / W, x1 = (cx + rollW / 2) / W;
    var y0 = (cy - rollH / 2) / H, y1 = (cy + rollH / 2) / H;
    var c0 = Math.max(0, Math.floor(x0 * COLS)), c1 = Math.min(COLS - 1, Math.floor(x1 * COLS));
    var r0 = Math.max(0, Math.floor(y0 * ROWS)), r1 = Math.min(ROWS - 1, Math.floor(y1 * ROWS));
    for (var r = r0; r <= r1; r++) {
      for (var c = c0; c <= c1; c++) {
        var i = r * COLS + c;
        if (!cells[i]) { cells[i] = 1; paintedCount++; }
      }
    }
  }

  function stampSegment(xa, ya, xb, yb) {
    var d = Math.max(Math.abs(xb - xa), Math.abs(yb - ya));
    var steps = Math.max(1, Math.ceil(d / (rollH * 0.4)));
    for (var s = 0; s <= steps; s++) {
      stamp(xa + (xb - xa) * s / steps, ya + (yb - ya) * s / steps);
    }
  }

  function coverage() { return paintedCount / (COLS * ROWS); }

  function reseed() {
    cells = new Uint8Array(COLS * ROWS);
    paintedCount = 0;
    done = false; returning = false; painting = false;
    restPose();
    draw();
  }

  // ---- drawing ----
  function drawPaint() {
    ctx.fillStyle = PAINT;
    var cw = W / COLS, ch = H / ROWS;
    for (var r = 0; r < ROWS; r++) {
      var c = 0;
      while (c < COLS) {
        if (cells[r * COLS + c]) {
          var start = c;
          while (c < COLS && cells[r * COLS + c]) c++;
          ctx.fillRect(start * cw, r * ch, (c - start) * cw + 0.6, ch + 0.6);
        } else c++;
      }
    }
  }

  function drawLadder() {
    ctx.fillStyle = LADDER;
    ctx.fillRect(ladCX - ladHalf - railW / 2, ladTop, railW, ladBot - ladTop);
    ctx.fillRect(ladCX + ladHalf - railW / 2, ladTop, railW, ladBot - ladTop);
    var rungH = Math.max(railW * 0.8, 3);
    for (var y = ladTop + rungStep; y < ladBot - 2; y += rungStep) {
      ctx.fillRect(ladCX - ladHalf, y, ladHalf * 2, rungH);
    }
  }

  function limb(xa, ya, xb, yb, wdt, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = wdt;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(xa, ya);
    ctx.lineTo(xb, yb);
    ctx.stroke();
  }

  function drawMan() {
    var cx = ladCX;
    var hipY = feetY - manH * 0.46;
    var shoY = feetY - manH * 0.74;
    var legW = manH * 0.085, armW = manH * 0.07;
    // legs: feet planted on a rung, slight stance
    limb(cx - manH * 0.02, hipY, cx - manH * 0.07, feetY, legW, TROUSERS);
    limb(cx + manH * 0.03, hipY, cx + manH * 0.09, feetY, legW, TROUSERS);
    // far arm hangs down
    limb(cx - manH * 0.10, shoY, cx - manH * 0.14, feetY - manH * 0.42, armW, SWEATER);
    // torso
    ctx.fillStyle = SWEATER;
    var tw = manH * 0.30;
    ctx.beginPath();
    ctx.moveTo(cx - tw / 2, hipY + manH * 0.03);
    ctx.lineTo(cx - tw / 2 + manH * 0.02, shoY);
    ctx.lineTo(cx + tw / 2 - manH * 0.02, shoY);
    ctx.lineTo(cx + tw / 2, hipY + manH * 0.03);
    ctx.closePath();
    ctx.fill();
    // head
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.arc(cx + manH * 0.02, feetY - manH * 0.885, manH * 0.105, 0, Math.PI * 2);
    ctx.fill();
    // working arm reaches to the roller handle grip, held under the roller
    var gripX = rollX + rollW * 0.30, gripY = rollY + rollH * 2.0;
    limb(cx + manH * 0.09, shoY + manH * 0.02, gripX, gripY, armW, SWEATER);
    // roller frame: shank runs from the grip to the roller's end cap
    ctx.strokeStyle = HANDLE;
    ctx.lineWidth = Math.max(manH * 0.028, 2.5);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(gripX, gripY);
    ctx.lineTo(rollX + rollW / 2 - 2, gripY);
    ctx.lineTo(rollX + rollW / 2 - 2, rollY);
    ctx.stroke();
    ctx.fillStyle = PAINT;
    var rx = rollX - rollW / 2, ry = rollY - rollH / 2, rr = rollH * 0.32;
    ctx.beginPath();
    ctx.moveTo(rx + rr, ry);
    ctx.lineTo(rx + rollW - rr, ry);
    ctx.arc(rx + rollW - rr, ry + rollH / 2, rr, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(rx + rr, ry + rollH);
    ctx.arc(rx + rr, ry + rollH / 2, rr, Math.PI / 2, Math.PI * 1.5);
    ctx.closePath();
    ctx.fill();
  }

  function draw() {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = WALL;
    ctx.fillRect(0, 0, W, H);
    drawPaint();
    drawLadder();
    drawMan();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = LADDER;
    ctx.font = '13px sans-serif';
    ctx.fillText('drag', 14, H - 14);
    ctx.globalAlpha = 1;
  }

  // ---- interaction ----
  function ptr(e) {
    return { x: e.clientX, y: e.clientY };
  }
  canvas.addEventListener('pointerdown', function (e) {
    var p = ptr(e);
    downX = p.x; downY = p.y; downT = e.timeStamp || 0; downMoved = 0;
    if (!done) {
      painting = true;
      rollTX = p.x; rollTY = p.y;
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = ptr(e);
    downMoved = Math.max(downMoved, Math.abs(p.x - downX) + Math.abs(p.y - downY));
    if (painting && !done) { rollTX = p.x; rollTY = p.y; }
  });
  function endPtr(e) {
    var dt = (e.timeStamp || 0) - downT;
    painting = false;
    if (downMoved < 10 && dt < 350) reseed();   // tap: start over
  }
  canvas.addEventListener('pointerup', endPtr);
  canvas.addEventListener('pointercancel', function () { painting = false; });
  canvas.addEventListener('dblclick', function () { reseed(); });

  function tick() {
    // ease roller toward its target; stamp the path while painting
    rollX += (rollTX - rollX) * 0.4;
    rollY += (rollTY - rollY) * 0.4;
    if (painting && !done) {
      stampSegment(stampX, stampY, rollX, rollY);
      if (coverage() >= 0.995) {
        done = true; painting = false; returning = true;
      }
    }
    stampX = rollX; stampY = rollY;
    // the man climbs the ladder to the height the painting has reached
    if (returning) {
      feetTarget = ladBot;
      rollTX = ladCX + ladHalf + rollW * 0.62;
      rollTY = feetTarget - manH * 0.92;
      if (Math.abs(feetY - ladBot) < 1.5) returning = false;
    } else if (!done) {
      feetTarget = Math.min(ladBot, Math.max(ladTop + manH * 0.86, rollY + manH * 0.80));
    }
    feetY += (feetTarget - feetY) * 0.12;
    draw();
  }

  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  resize();           // first frame: synchronous, initial state only
  draw();

  if (typeof requestAnimationFrame === 'function') {
    var loop = function () { tick(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
