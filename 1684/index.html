<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Slant Field</title>
<style>
html, body { margin: 0; padding: 0; background: #F2EAD8; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var PAPER = '#F2EAD8';
var INK = '#2B2620';
var PLATE = '#2B2620';
var PLATE_LINE = 'rgba(242,234,216,0.45)';
var TITLE_INK = '#F2EAD8';
var HINT_INK = '#F2EAD8';
var FIRST_T = 0;
/* DRIVER: a field of rigid cuboids lies flat, then a wave of slant
   passes through it. Each box tilts by an angle set by its position
   in a spatial field, and disorder is a gradient, not noise: the calm
   corner barely stirs while the opposite corner goes chaotic. The
   wave reverses, the boxes settle flat, the field rests a breath,
   and the next wave comes with a different field. Slant is visible
   two ways at once: the box leans, and its faces change shade as
   they catch a fixed light. */
var COLS = 9, ROWS = 9, BOX_COUNT = 81;
var PALETTE = ['#D9481F', '#E8A820', '#D97B7B', '#2E7F7A', '#2B4A8C', '#6B4E8E'];
var MAX_SLANT = 0.55;
var PERIOD = 24;
var RISE_END = 8, HOLD_END = 10, FALL_END = 18;
var FIELD_NAMES = ['diagonal', 'radial', 'swirl'];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function smooth(t) { return t * t * (3 - 2 * t); }
function lerp(a, b, f) { return a + (b - a) * f; }
function hash01(n) {
  var s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mixHex(a, b, f) {
  var ca = hexRgb(a), cb = hexRgb(b);
  var r = Math.round(lerp(ca[0], cb[0], f));
  var g = Math.round(lerp(ca[1], cb[1], f));
  var bl = Math.round(lerp(ca[2], cb[2], f));
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* Square field on desktop, full-bleed on phones. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, s: Math.min(VW, VH), w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, s: s, w: s, h: s };
}
/* The spatial field: magnitude (0 calm to 1 chaotic) and tilt
   direction for a box at normalized field position (u, v). */
function fieldAt(fi, u, v) {
  var dx = 0, dy = 0, mag = 0;
  if (fi === 0) {
    var d = (u + v) / 2;
    mag = 0.12 + 0.88 * d;
    dx = 0.7071; dy = 0.7071;
  } else if (fi === 1) {
    var rx = u - 0.5, ry = v - 0.5;
    var r = Math.sqrt(rx * rx + ry * ry) / 0.7071;
    mag = 0.10 + 0.90 * clamp(r, 0, 1);
    var len = Math.sqrt(rx * rx + ry * ry) || 1;
    dx = rx / len; dy = ry / len;
  } else {
    var sx = u - 0.5, sy = v - 0.5;
    var sr = Math.sqrt(sx * sx + sy * sy) / 0.7071;
    mag = 0.15 + 0.85 * clamp(sr, 0, 1);
    var sl = Math.sqrt(sx * sx + sy * sy) || 1;
    dx = -sy / sl; dy = sx / sl;
  }
  return { mag: mag, dx: dx, dy: dy };
}
function cycleAt(t) {
  var mod = ((t % PERIOD) + PERIOD) % PERIOD;
  var fi = Math.floor(t / PERIOD) % 3;
  var env = 0, front = 0;
  if (mod < RISE_END) {
    var p = mod / RISE_END;
    env = smooth(p);
    front = -0.15 + p * 1.5;
  } else if (mod < HOLD_END) {
    env = 1; front = 2;
  } else if (mod < FALL_END) {
    var q = (mod - HOLD_END) / (FALL_END - HOLD_END);
    env = 1 - smooth(q);
    front = 2;
  } else {
    env = 0; front = 2;
  }
  return { field: fi, env: env, front: front };
}
function boxSlant(cyc, u, v) {
  var f = fieldAt(cyc.field, u, v);
  var d = (u + v) / 2;
  var local = smooth(clamp((cyc.front - d) / 0.45, 0, 1));
  var amp = cyc.env * local;
  return { angle: MAX_SLANT * f.mag * amp, dx: f.dx, dy: f.dy, amp: amp, mag: f.mag };
}
function drawBox(fx, fy, cw, ch, i, j, sl) {
  var u = (i + 0.5) / COLS, v = (j + 0.5) / ROWS;
  var inset = Math.min(cw, ch) * 0.14;
  var wob = 0.82 + 0.16 * hash01(i * 17 + j * 31 + 5);
  var hob = 0.82 + 0.16 * hash01(i * 7 + j * 13 + 9);
  var bw = (cw - inset * 2) * wob;
  var bh = (ch - inset * 2) * hob;
  var bx = fx + (cw - bw) / 2;
  var by = fy + (ch - bh) / 2;
  var color = PALETTE[(i + 2 * j) % PALETTE.length];
  var s = Math.sin(sl.angle) * bh * 0.85;
  var shx = sl.dx * s, shy = sl.dy * s;
  /* Flat shadow, fixed light from the top left, length grows with slant. */
  var lox = 5 + sl.amp * 18, loy = 7 + sl.amp * 22;
  ctx.fillStyle = 'rgba(43,38,32,' + (0.06 + 0.06 * sl.amp).toFixed(3) + ')';
  ctx.beginPath();
  ctx.moveTo(bx + lox, by + loy);
  ctx.lineTo(bx + bw + lox, by + loy);
  ctx.lineTo(bx + bw + lox, by + bh + loy);
  ctx.lineTo(bx + lox, by + bh + loy);
  ctx.closePath();
  ctx.fill();
  /* Side face revealed by the tilt, darkened with slant. */
  if (Math.abs(s) > 0.5) {
    ctx.fillStyle = mixHex(color, '#1A1A1A', 0.28 + 0.35 * sl.amp);
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(bx + bw, by);
    ctx.lineTo(bx + bw + shx, by + shy);
    ctx.lineTo(bx + shx, by + shy);
    ctx.closePath();
    ctx.fill();
  }
  /* Top face: the parallelogram the tilt makes, shading with slant. */
  ctx.fillStyle = mixHex(color, '#1A1A1A', 0.22 * sl.amp);
  ctx.beginPath();
  ctx.moveTo(bx, by + bh);
  ctx.lineTo(bx + bw, by + bh);
  ctx.lineTo(bx + bw + shx, by + shy);
  ctx.lineTo(bx + shx, by + shy);
  ctx.closePath();
  ctx.fill();
  /* A thin dark foot edge when flat, so the cuboid keeps its body. */
  if (Math.abs(s) <= 0.5) {
    ctx.fillStyle = mixHex(color, '#1A1A1A', 0.35);
    ctx.fillRect(bx, by + bh - 2, bw, 2);
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('The Slant Field').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('The Slant Field').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 22').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('The Slant Field', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 08 · 22', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the slant pass through.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  var cyc = cycleAt(t);
  var fr = fieldRect();
  var i, j;
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, VW, VH);
  var cw = fr.w / COLS, ch = fr.h / ROWS;
  for (j = 0; j < ROWS; j++) {
    for (i = 0; i < COLS; i++) {
      var u = (i + 0.5) / COLS, v = (j + 0.5) / ROWS;
      var sl = boxSlant(cyc, u, v);
      drawBox(fr.x + i * cw, fr.y + j * ch, cw, ch, i, j, sl);
    }
  }
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    cycleAt: function (t) { return cycleAt(t); },
    boxCount: function () { return BOX_COUNT; },
    fieldNames: function () { return FIELD_NAMES.slice(); }
  };
}
/* ---- frame one: t = 0, the field flat and at rest before the first wave ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = FIRST_T, prevTs = null, t0 = null;
draw(FIRST_T);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
