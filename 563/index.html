<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hay Que Cerrar el Hociquito</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1E1E2E; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: strict, nothing else. Flat fills only, no gradients.
  var DARK = '#1E1E2E', YELLOW = '#F5D90A', AMBER = '#E8A33D',
      RED = '#A33A3A', INK = '#141414', PAPER = '#F5EEDA';

  var PHASE0 = 1.4; // constant first-frame phase (panel 1, smoke mid-curl)

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(563068);

  // ---- dialogue (all Spanish, per prompt) ----
  var HIS_LINE_1 = 'me gustan las películas que te dejan pensando durante días';
  var HER_LINE_1 = 'o sea, películas traumáticas tipo Todd Solondz';
  var BRAG = 'hice diagramas para explicar Interstellar a mis amigos';
  var CHIPS = ['Interstellar', 'Oppenheimer', 'Origen'];
  var RANT = 'A ver, es que Nolan es espectacular, sí, todo explota muy bonito y la música te deja sordo, pero en el fondo es superficial, es un tráiler de dos horas y media. Los personajes son planos, planos, planos: no hablan como personas, hablan como notas al pie de página, y se pasan media película explicándose la trama el uno al otro por si no te has enterado. ¿Y Origen? Origen es Paprika con presupuesto. Satoshi Kon lo hizo antes, lo hizo mejor y sin necesitar cuatro escenas de señores en traje explicando qué es un sueño dentro de un sueño dentro de un sueño. Y lo de que el amor trasciende el espacio y el tiempo... por favor. Eso lo dice una postal de cumpleaños, no una película seria. Que si el tiempo va para atrás, que si va para adelante, que si la peonza cae o no cae: quince años hablando de una peonza, quince años. Tenet no la entiende ni él, y lo sabe, y le da igual, porque pone un órgano a todo volumen y ya parece profundo. Y te digo más: si tienes que hacer diagramas para que tus amigos entiendan tu película, igual el problema no son tus amigos. El montaje hace trampa, el sonido mezcla los diálogos bajitos a propósito para que parezca complejo, y el final siempre es un señor llorando en cámara lenta mientras todo gira. Espectacular, sí. Vacío también.';
  var HIS_LINE_4 = 'aunque Oppenheimer es demasiado técnica, la verdad. perdón, ¿hola?';
  var CAPTION_4 = 'SE VAN... Y VUELTA A EMPEZAR.';

  // ---- carousel state ----
  var panel = 0;              // 0..3
  var panelStart = PHASE0;    // sim-time when the current panel arrived
  var rantScroll = 0;         // px of rant text scrolled (panel 3)
  var rantScrollMax = 0;

  // ---- helpers ----
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r);
    ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r);
    ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
  function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
  function fs(fill, lw) {
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (lw) { ctx.strokeStyle = INK; ctx.lineWidth = lw; ctx.stroke(); }
  }
  // wobbly rounded rect path (seeded jitter, fixed per call-site seed)
  function wobblyRR(x, y, w, h, r, seed) {
    var r2 = mulberry32(seed);
    var j = function () { return (r2() - 0.5) * 7; };
    ctx.beginPath();
    ctx.moveTo(x + r + j(), y + j());
    ctx.lineTo(x + w - r + j(), y + j());
    ctx.quadraticCurveTo(x + w + j(), y + j(), x + w + j(), y + r + j());
    ctx.lineTo(x + w + j(), y + h - r + j());
    ctx.quadraticCurveTo(x + w + j(), y + h + j(), x + w - r + j(), y + h + j());
    ctx.lineTo(x + r + j(), y + h + j());
    ctx.quadraticCurveTo(x + j(), y + h + j(), x + j(), y + h - r + j());
    ctx.lineTo(x + j(), y + r + j());
    ctx.quadraticCurveTo(x + j(), y + j(), x + r + j(), y + j());
    ctx.closePath();
  }
  function wrap(text, maxW, font) {
    ctx.font = font;
    var words = text.split(' '), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i]; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  }
  function bubble(x, y, w, text, font, size, tailX, tailY, seed) {
    var lines = wrap(text, w - 44, font);
    var lh = size * 1.28, h = lines.length * lh + 30;
    wobblyRR(x, y, w, h, 20, seed); fs(PAPER, 5);
    // tail
    ctx.beginPath();
    ctx.moveTo(tailX - 14, y + h - 4);
    ctx.lineTo(tailX + 14, y + h - 4);
    ctx.lineTo(tailX + (tailX < x + w / 2 ? -6 : 6), tailY);
    ctx.closePath(); fs(PAPER, 0);
    ctx.strokeStyle = INK; ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(tailX - 14, y + h - 2); ctx.lineTo(tailX + (tailX < x + w / 2 ? -6 : 6), tailY);
    ctx.moveTo(tailX + 14, y + h - 2); ctx.lineTo(tailX + (tailX < x + w / 2 ? -6 : 6), tailY);
    ctx.stroke();
    ctx.fillStyle = INK; ctx.font = font; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    for (var i = 0; i < lines.length; i++) ctx.fillText(lines[i], x + 22, y + 15 + i * lh);
    return h;
  }

  var FONT = '700 %dpx "Trebuchet MS", "Comic Sans MS", sans-serif';
  function font(size) { return FONT.replace('%d', size); }

  // ---- figures ----
  // HER face: SAME size in every panel (headR fixed at 62). Deadpan, never smiles.
  var HER_R = 62;
  function drawHer(cx, cy, t) {
    // body
    ctx.beginPath();
    ctx.moveTo(cx - 58, cy + 190);
    ctx.quadraticCurveTo(cx - 52, cy + 78, cx - 30, cy + 58);
    ctx.lineTo(cx + 30, cy + 58);
    ctx.quadraticCurveTo(cx + 52, cy + 78, cx + 58, cy + 190);
    ctx.closePath(); fs(RED, 5);
    // hair: full ink disc; face: paper disc offset down, leaving an ink cap
    circ(cx, cy, HER_R); ctx.fillStyle = INK; ctx.fill();
    circ(cx, cy + 13, HER_R - 9); ctx.fillStyle = PAPER; ctx.fill();
    // deadpan features: flat brows, dot eyes, straight mouth (never smiles)
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 34, cy + 6); ctx.lineTo(cx - 12, cy + 6);
    ctx.moveTo(cx + 12, cy + 6); ctx.lineTo(cx + 34, cy + 6);
    ctx.stroke();
    ctx.fillStyle = INK;
    circ(cx - 23, cy + 22, 5); ctx.fill();
    circ(cx + 23, cy + 22, 5); ctx.fill();
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(cx - 15, cy + 46); ctx.lineTo(cx + 15, cy + 46); ctx.stroke();
  }
  // HIM: gestures inflate per panel via `amp` (arm spread) — face stays ordinary.
  function drawHim(cx, cy, amp, smoking, t) {
    // arms first (behind body)
    ctx.strokeStyle = INK; ctx.lineWidth = 17; ctx.lineCap = 'round';
    var wave = Math.sin(t * 2.2) * 6 * amp;
    ctx.beginPath();
    ctx.moveTo(cx - 34, cy + 88);
    ctx.lineTo(cx - 74 - 30 * amp, cy + 44 - 20 * amp + wave);
    ctx.moveTo(cx + 34, cy + 88);
    ctx.lineTo(cx + 74 + 30 * amp, cy + 40 - 26 * amp - wave);
    ctx.stroke();
    // body
    ctx.beginPath();
    ctx.moveTo(cx - 60, cy + 196);
    ctx.quadraticCurveTo(cx - 54, cy + 82, cx - 32, cy + 60);
    ctx.lineTo(cx + 32, cy + 60);
    ctx.quadraticCurveTo(cx + 54, cy + 82, cx + 60, cy + 196);
    ctx.closePath(); fs(AMBER, 5);
    // head: ink hair, paper face
    circ(cx, cy + 4, 56); ctx.fillStyle = PAPER; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy - 4, 57, Math.PI * 1.05, Math.PI * 1.95); ctx.lineTo(cx - 52, cy + 8); ctx.lineTo(cx + 52, cy + 8); ctx.closePath();
    ctx.fillStyle = INK; ctx.fill();
    // eager face: raised brows, open talking mouth
    ctx.strokeStyle = INK; ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(cx - 32, cy - 2); ctx.quadraticCurveTo(cx - 21, cy - 10, cx - 10, cy - 3);
    ctx.moveTo(cx + 10, cy - 3); ctx.quadraticCurveTo(cx + 21, cy - 10, cx + 32, cy - 2);
    ctx.stroke();
    ctx.fillStyle = INK;
    circ(cx - 21, cy + 12, 5); ctx.fill();
    circ(cx + 21, cy + 12, 5); ctx.fill();
    ell(cx, cy + 36, 11, 8 + 2.5 * Math.abs(Math.sin(t * 3.1))); ctx.fillStyle = INK; ctx.fill();
    if (smoking) {
      // cigarette at right hand + curling smoke
      var hx = cx + 74 + 30 * amp, hy = cy + 40 - 26 * amp - wave;
      ctx.strokeStyle = PAPER; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + 22, hy - 8); ctx.stroke();
      circ(hx + 25, hy - 9, 5); ctx.fillStyle = RED; ctx.fill();
      ctx.strokeStyle = PAPER; ctx.lineWidth = 5; ctx.globalAlpha = 0.75;
      for (var s = 0; s < 3; s++) {
        var ph = t * 0.9 + s * 0.9;
        var sx = hx + 28 + Math.sin(ph * 2.4) * 10, sy = hy - 26 - s * 30 - Math.sin(ph) * 4;
        ctx.beginPath(); ctx.arc(sx, sy, 9 + s * 3, Math.PI * 0.9, Math.PI * 1.9); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }
  function drawTable(cx, cy) {
    ell(cx, cy, 150, 26); fs(RED, 5);
    ctx.fillStyle = INK; ctx.fillRect(cx - 12, cy + 18, 24, 92);
    // two glasses
    ctx.fillStyle = AMBER;
    ctx.fillRect(cx - 62, cy - 34, 20, 30); ctx.fillRect(cx + 44, cy - 34, 20, 30);
    ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.strokeRect(cx - 62, cy - 34, 20, 30); ctx.strokeRect(cx + 44, cy - 34, 20, 30);
  }
  function spotlight(cx, cy, rx, ry) {
    ell(cx, cy, rx, ry); ctx.fillStyle = AMBER; ctx.globalAlpha = 0.16; ctx.fill(); ctx.globalAlpha = 1;
  }
  function frameRect() { wobblyRR(66, 66, 948, 948, 26, 9001); ctx.strokeStyle = PAPER; ctx.lineWidth = 6; ctx.globalAlpha = 0.85; ctx.stroke(); ctx.globalAlpha = 1; }

  // ---- panels (design space 1080x1080) ----
  function panel1(t) {
    spotlight(540, 640, 470, 300);
    drawTable(540, 700);
    drawHim(300, 470, 0.3, false, t);
    drawHer(790, 470, t);
    bubble(120, 120, 430, HIS_LINE_1, font(37), 37, 300, 430, 101);
    bubble(520, 250, 470, HER_LINE_1, font(37), 37, 770, 430, 102);
  }
  function panel2(t) {
    spotlight(540, 640, 470, 300);
    drawTable(540, 716);
    drawHim(310, 480, 0.85, true, t);
    drawHer(800, 480, t);
    // name-drop chips floating over him
    var chipY = [128, 218, 308];
    for (var i = 0; i < CHIPS.length; i++) {
      ctx.font = font(36);
      var w = ctx.measureText(CHIPS[i]).width + 40;
      var bob = Math.sin(t * 1.6 + i * 1.3) * 5;
      wobblyRR(110 + i * 36, chipY[i] + bob, w, 58, 16, 200 + i); fs(i === 1 ? YELLOW : PAPER, 5);
      ctx.fillStyle = INK; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(CHIPS[i], 110 + i * 36 + 20, chipY[i] + bob + 31);
    }
    bubble(430, 700 - 470 + 596, 560, BRAG, font(36), 36, 330, 470, 103);
  }
  function panel3(t) {
    // he rants small at lower-left, she (same-size face) at right edge
    drawHim(215, 830, 1.4, false, t);
    drawHer(905, 800, t);
    // THE GIANT YELLOW BUBBLE: bursts the frame, overlaps the margins
    var bx = 56, by = 66, bw = 968, bh = 700;
    wobblyRR(bx, by, bw, bh, 34, 300); fs(YELLOW, 7);
    // tail down to him
    ctx.beginPath();
    ctx.moveTo(210, by + bh - 6); ctx.lineTo(280, by + bh - 6); ctx.lineTo(228, 838);
    ctx.closePath(); fs(YELLOW, 0);
    ctx.strokeStyle = INK; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(210, by + bh - 4); ctx.lineTo(228, 838); ctx.moveTo(280, by + bh - 4); ctx.lineTo(228, 838); ctx.stroke();
    // rant text clipped inside, scrolled by drag
    var lines = wrap(RANT, bw - 76, font(35));
    var lh = 35 * 1.3, totalH = lines.length * lh;
    var innerH = bh - 60;
    rantScrollMax = Math.max(0, totalH - innerH);
    rantScroll = Math.max(0, Math.min(rantScrollMax, rantScroll));
    ctx.save();
    ctx.beginPath(); ctx.rect(bx + 28, by + 26, bw - 56, bh - 52); ctx.clip();
    ctx.fillStyle = INK; ctx.font = font(35); ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    for (var i = 0; i < lines.length; i++) {
      var ly = by + 30 + i * lh - rantScroll;
      if (ly > by - lh && ly < by + bh) ctx.fillText(lines[i], bx + 38, ly);
    }
    ctx.restore();
    // scroll hint ticks at bubble bottom when more text remains
    if (rantScroll < rantScrollMax - 2) {
      ctx.fillStyle = INK; ctx.font = font(30); ctx.textAlign = 'center';
      ctx.fillText('· · ·', bx + bw / 2, by + bh - 40);
    }
  }
  function panel4(t, local) {
    spotlight(540, 640, 470, 300);
    drawTable(540, 700);
    drawHim(320, 480, 0.5, false, t);
    // her EMPTY chair slides in from the right on arrival, then stays
    var slide = Math.min(1, Math.max(0, local / 0.9));
    var ease = 1 - Math.pow(1 - slide, 3);
    var chX = 790 + (1 - ease) * 300;
    // chair: ink frame, red seat
    ctx.strokeStyle = PAPER; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(chX - 46, 560); ctx.lineTo(chX - 46, 716);
    ctx.moveTo(chX + 46, 560); ctx.lineTo(chX + 46, 716);
    ctx.moveTo(chX - 52, 700); ctx.lineTo(chX + 52, 700);
    ctx.stroke();
    ctx.fillStyle = RED; ctx.fillRect(chX - 54, 668, 108, 22);
    ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.strokeRect(chX - 54, 668, 108, 22);
    bubble(110, 130, 520, HIS_LINE_4, font(37), 37, 320, 440, 104);
    // caption strip
    wobblyRR(190, 884, 700, 74, 14, 400); fs(INK, 0);
    ctx.fillStyle = PAPER; ctx.font = font(38); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(CAPTION_4, 540, 922);
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = DARK; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S / 1080, S / 1080);
    ctx.lineJoin = 'round';
    frameRect();
    var local = t - panelStart;
    if (panel === 0) panel1(t);
    else if (panel === 1) panel2(t);
    else if (panel === 2) panel3(t);
    else panel4(t, local);
    // panel counter
    ctx.fillStyle = PAPER; ctx.globalAlpha = 0.65; ctx.font = font(30);
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.fillText((panel + 1) + ' / 4', 990, 88);
    ctx.globalAlpha = 1;
    // hint
    ctx.save();
    ctx.globalAlpha = 0.55; ctx.fillStyle = PAPER; ctx.font = font(28);
    ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillText(panel === 2 ? 'drag · tap' : 'tap', 1000, 1000);
    ctx.restore();
    ctx.restore();
  }

  // ---- sizing ----
  var W = 0, H = 0, S = 0, OX = 0, OY = 0;
  var simT = PHASE0;
  function isPhone() {
    var sw = window.screen ? window.screen.width : 0;
    var sh = window.screen ? window.screen.height : 0;
    var minDim = Math.min(sw, sh);
    if (minDim > 0) return minDim < 700;
    return H > W * 1.15;
  }
  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (isPhone()) { S = W; OX = 0; OY = (H - S) / 2; }
    else { S = Math.min(W, H); OX = (W - S) / 2; OY = (H - S) / 2; }
    draw(simT);
  }

  // ---- interaction: tap advances; on panel 3, horizontal drag scrolls the rant ----
  var downX = 0, downY = 0, lastX = 0, dragging = false, moved = 0;
  function toDesign(e) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    return { x: (e.clientX - rect.left - OX) / S * 1080, y: (e.clientY - rect.top - OY) / S * 1080 };
  }
  function onDown(e) {
    var p = toDesign(e);
    downX = lastX = p.x; downY = p.y; dragging = true; moved = 0;
  }
  function onMove(e) {
    if (!dragging) return;
    var p = toDesign(e);
    var dx = p.x - lastX;
    moved += Math.abs(dx) + Math.abs(p.y - downY) * 0.0;
    moved = Math.max(moved, Math.abs(p.x - downX));
    if (panel === 2) { rantScroll -= dx * 1.6; rantScroll = Math.max(0, Math.min(rantScrollMax, rantScroll)); }
    lastX = p.x;
    draw(simT);
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    if (moved < 14) {
      panel = (panel + 1) % 4;
      panelStart = simT;
      if (panel === 2) rantScroll = 0;
      draw(simT);
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // ---- animation: anchored at PHASE0 + elapsed ----
  var startStamp = null;
  function frame(ts) {
    if (startStamp === null) startStamp = ts;
    simT = PHASE0 + (ts - startStamp) / 1000;
    draw(simT);
    requestAnimationFrame(frame);
  }
  if (window.visualViewport && window.visualViewport.addEventListener)
    window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);
  resize();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
