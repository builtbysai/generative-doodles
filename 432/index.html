<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.432 Magical Holidays Rink</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1E2A4A; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.432 Magical Holidays Rink (yaelhofri, EXPANSION #46).
// After Yael Hofri's "Magical Holidays" 1000-piece puzzle:
// a winter night rink under a full moon. Four skaters glide
// hand-in-hand around an elliptical path on the ice, their
// blades leaving trail arcs that fade on a fixed decay
// table. A big lit Christmas tree fills the right third,
// toy stalls and a small Santa stand at the left edge,
// snow-capped pines frame both sides, and string lights
// hang on catenary curves across the top, twinkling in
// flat alpha steps. Snow falls from a fixed dot table,
// every flake dropping a whole number of field heights
// per loop so the 40s loop wraps seamlessly.
//
// DRAG pulls a breeze: the breeze value follows the
// pointer's horizontal velocity while dragging, lifts the
// scarves and pushes the snow sideways; on release it
// decays geometrically and snaps to exactly zero, so the
// scarves and snow settle back to exactly the loop
// values. Frame one is drawn synchronously at the
// constant phase T = 11.0s (skaters mid-glide on the
// near arc, trails behind them, lights mid-twinkle);
// the clock is anchored there and advances in fixed
// 1/60 ticks, never from a wall clock. Flat colour only,
// glows are stepped flat-alpha discs, one canvas, no
// offscreen canvas, no gradients, no shadowBlur, no text
// anywhere.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

// ---- palette -------------------------------------------
// Closed set from the prompt, nothing else. Faces take
// the moon cream, hair takes the stall brown, leggings
// take the pine green: the only palette colours that
// read for those parts at this scale.
var SKY = '#1E2A4A', MOON = '#FFF3D6', ICE = '#BFE3F0', TRAIL = '#8FC3D9';
var TREE = '#2E6B4F';
var GOLD = '#F5A623', PINK = '#F06A8A', RED = '#FF4D4D';
var STALL = '#8A5A33', AWNING = '#D94F6B', PINE = '#2E5339', SNOW = '#F6F1E7';
var BLUE = '#3E7CB1', LEAF = '#4E7A3A';
var LIGHTS = [GOLD, PINK, RED];

var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 40;
if (LOOP !== 40) throw new Error('Magical Holidays Rink loop must be 40s');
var TICK = 1 / 60;

// ---- small draw helpers ---------------------------------
function circ(x, y, r, fill) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function ell(x, y, rx, ry, fill) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function line(x0, y0, x1, y1, col, lw) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
}
function rect(x, y, w, h, fill) {
  ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
}

// ---- fixed data: seeded scatter --------------------------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---- the moon and its breathing glow ----------------------
// Three stepped flat-alpha discs behind the moon disc;
// the breath runs on 2 whole cycles per loop, scaling
// the glow radii between 1.0 and 1.06.
var MOON_X = 168, MOON_Y = 138, MOON_R = 52;
function drawMoon(lt) {
  var br = 1 + 0.06 * Math.sin(Math.PI * 2 * 2 * lt / LOOP);
  ctx.globalAlpha = 0.05; circ(MOON_X, MOON_Y, MOON_R * 2.15 * br, MOON);
  ctx.globalAlpha = 0.07; circ(MOON_X, MOON_Y, MOON_R * 1.62 * br, MOON);
  ctx.globalAlpha = 0.09; circ(MOON_X, MOON_Y, MOON_R * 1.30 * br, MOON);
  ctx.globalAlpha = 1;
  circ(MOON_X, MOON_Y, MOON_R, MOON);
  // two flat crater discs in the ice tone, very light
  ctx.globalAlpha = 0.35;
  circ(MOON_X - 16, MOON_Y - 10, 9, ICE);
  circ(MOON_X + 14, MOON_Y + 16, 6.5, ICE);
  ctx.globalAlpha = 1;
}

// ---- string lights on catenary curves ----------------------
// Three strands across the top, each a quadratic curve
// with a sagging control point. Bulbs hang a few px below
// the wire. Twinkle is stepped: each bulb cycles through
// the flat alpha steps [1.0, 0.8, 0.6, 0.8] a whole
// number of times per loop, staggered by its own phase.
var TWINKLE_STEPS = [1.0, 0.8, 0.6, 0.8];
var STRANDS = [
  { x0: -40, y0: 40, x1: 700, y1: 16, sag: 26, n: 11 },
  { x0: 580, y0: 26, x1: 1320, y1: 74, sag: 74, n: 11 },
  { x0: -40, y0: 216, x1: 1320, y1: 186, sag: 58, n: 15 }
];
var BULBS = [];
(function () {
  var rng = mulberry32(1207);
  for (var si = 0; si < STRANDS.length; si++) {
    var st = STRANDS[si];
    var cx = (st.x0 + st.x1) / 2, cy = (st.y0 + st.y1) / 2 + st.sag * 2;
    st.cx = cx; st.cy = cy;
    for (var bi = 1; bi <= st.n; bi++) {
      var t = bi / (st.n + 1), u = 1 - t;
      BULBS.push({
        x: u * u * st.x0 + 2 * u * t * cx + t * t * st.x1,
        y: u * u * st.y0 + 2 * u * t * cy + t * t * st.y1,
        col: LIGHTS[(si + bi) % 3],
        cyc: 2 + Math.floor(rng() * 4),
        ph: rng()
      });
    }
  }
})();
function bulbAlpha(b, lt) {
  var idx = Math.floor(((lt * b.cyc / LOOP) + b.ph) * 4) % 4;
  return TWINKLE_STEPS[idx];
}
function drawStrands(lt) {
  var i;
  for (i = 0; i < STRANDS.length; i++) {
    var st = STRANDS[i];
    ctx.beginPath();
    ctx.moveTo(st.x0, st.y0);
    ctx.quadraticCurveTo(st.cx, st.cy, st.x1, st.y1);
    ctx.strokeStyle = MOON; ctx.globalAlpha = 0.35; ctx.lineWidth = 2; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  for (i = 0; i < BULBS.length; i++) {
    var b = BULBS[i];
    line(b.x, b.y, b.x, b.y + 7, MOON, 1.6);
    ctx.globalAlpha = bulbAlpha(b, lt);
    circ(b.x, b.y + 12, 5.5, b.col);
    ctx.globalAlpha = 1;
  }
}

// ---- pines --------------------------------------------------
// Three tiers of triangles with snow caps, a stall-brown
// trunk. They frame the scene at both edges.
function drawPine(x, base, h) {
  rect(x - 6, base - 14, 12, 14, STALL);
  var tiers = 3;
  for (var j = tiers - 1; j >= 0; j--) {
    var wTier = h * 0.62 * (1 - j * 0.20);
    var yBase = base - 8 - j * h * 0.27;
    var yTop = yBase - h * 0.46;
    ctx.beginPath();
    ctx.moveTo(x - wTier / 2, yBase);
    ctx.lineTo(x + wTier / 2, yBase);
    ctx.lineTo(x, yTop);
    ctx.closePath();
    ctx.fillStyle = PINE; ctx.fill();
    // snow lying on the tier's shoulders
    ctx.beginPath();
    ctx.moveTo(x - wTier * 0.20, yTop + h * 0.155);
    ctx.lineTo(x + wTier * 0.20, yTop + h * 0.155);
    ctx.lineTo(x, yTop);
    ctx.closePath();
    ctx.fillStyle = SNOW; ctx.fill();
  }
}

// ---- the big Christmas tree, right third ---------------------
// Five tiers from y 150 to the ground line, a gold star,
// and 26 ornaments twinkling on the same stepped cycle
// as the string lights.
var TREE_X = 1058, TREE_TOP = 148, TREE_BASE = 668;
var ORNAMENTS = [];
(function () {
  var rng = mulberry32(2512);
  for (var i = 0; i < 26; i++) {
    var fr = 0.10 + 0.86 * (i / 25);
    var halfW = 26 + fr * 150;
    ORNAMENTS.push({
      dx: (rng() * 2 - 1) * halfW * 0.82,
      y: TREE_TOP + 44 + fr * (TREE_BASE - TREE_TOP - 70),
      col: LIGHTS[i % 3],
      cyc: 2 + Math.floor(rng() * 4),
      ph: rng()
    });
  }
})();
if (ORNAMENTS.length !== 26) throw new Error('tree must carry exactly 26 ornaments');
function drawTree(lt) {
  rect(TREE_X - 15, TREE_BASE - 8, 30, 34, STALL);
  var tiers = 5;
  for (var j = tiers - 1; j >= 0; j--) {
    var fr = j / (tiers - 1);
    var wTier = 74 + fr * 268;
    var yBase = TREE_TOP + 60 + fr * (TREE_BASE - TREE_TOP - 52);
    var yTop = yBase - 178 + fr * 26;
    ctx.beginPath();
    ctx.moveTo(TREE_X - wTier / 2, yBase);
    ctx.lineTo(TREE_X + wTier / 2, yBase);
    ctx.lineTo(TREE_X, yTop);
    ctx.closePath();
    ctx.fillStyle = TREE; ctx.fill();
  }
  for (var i = 0; i < ORNAMENTS.length; i++) {
    var o = ORNAMENTS[i];
    ctx.globalAlpha = bulbAlpha(o, lt);
    circ(TREE_X + o.dx, o.y, 5.2, o.col);
    ctx.globalAlpha = 1;
  }
  // four-point star on top
  var sx = TREE_X, sy = TREE_TOP - 16;
  ctx.beginPath();
  ctx.moveTo(sx, sy - 17);
  ctx.quadraticCurveTo(sx, sy, sx + 17, sy);
  ctx.quadraticCurveTo(sx, sy, sx, sy + 17);
  ctx.quadraticCurveTo(sx, sy, sx - 17, sy);
  ctx.quadraticCurveTo(sx, sy, sx, sy - 17);
  ctx.closePath();
  ctx.fillStyle = GOLD; ctx.fill();
}

// ---- toy stalls and Santa, left edge -------------------------
function drawStall(x, w, flip) {
  // awning: slanted quad of alternating stripes
  var ay = 452, ah = 34, slant = 12;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x - 8, ay + slant);
  ctx.lineTo(x + w + 8, ay);
  ctx.lineTo(x + w + 8, ay + ah);
  ctx.lineTo(x - 8, ay + ah + slant);
  ctx.closePath();
  ctx.clip();
  var stripes = 6;
  for (var i = 0; i < stripes; i++) {
    rect(x - 8 + (w + 16) * i / stripes, ay - 4, (w + 16) / stripes, ah + slant + 8, i % 2 === 0 ? AWNING : SNOW);
  }
  ctx.restore();
  // posts, body and counter
  rect(x, ay + ah, 10, 196, STALL);
  rect(x + w - 10, ay + ah, 10, 196, STALL);
  rect(x - 4, 560, w + 8, 118, STALL);
  rect(x - 10, 548, w + 20, 16, STALL);
  // toys on the counter: small boxes and balls in the light colours
  var toys = flip ? [PINK, GOLD, LEAF, RED, BLUE] : [GOLD, RED, PINK, BLUE, LEAF];
  for (var k = 0; k < toys.length; k++) {
    var tx = x + 16 + k * (w - 26) / (toys.length - 1);
    if (k % 2 === 0) circ(tx, 538, 9, toys[k]);
    else rect(tx - 8, 528, 16, 18, toys[k]);
  }
}
function drawSanta() {
  var x = 356, base = 678;
  // legs and boots
  rect(x - 16, base - 26, 13, 26, RED);
  rect(x + 3, base - 26, 13, 26, RED);
  ell(x - 12, base - 2, 11, 5, SKY);
  ell(x + 12, base - 2, 11, 5, SKY);
  // coat body
  ctx.beginPath();
  ctx.moveTo(x - 24, base - 24);
  ctx.quadraticCurveTo(x - 28, base - 78, x - 18, base - 92);
  ctx.lineTo(x + 18, base - 92);
  ctx.quadraticCurveTo(x + 28, base - 78, x + 24, base - 24);
  ctx.closePath();
  ctx.fillStyle = RED; ctx.fill();
  rect(x - 24, base - 58, 48, 9, SKY);
  rect(x - 5, base - 59, 10, 11, GOLD);
  rect(x - 3.5, base - 92, 7, 68, SNOW);
  // one arm raised in a wave
  line(x + 20, base - 84, x + 40, base - 116, RED, 11);
  circ(x + 42, base - 120, 7, SNOW);
  line(x - 20, base - 84, x - 34, base - 52, RED, 11);
  circ(x - 36, base - 48, 7, SNOW);
  // head, beard and hat
  circ(x, base - 108, 14.5, MOON);
  ell(x, base - 94, 13, 10, SNOW);
  ctx.beginPath();
  ctx.moveTo(x - 13, base - 116);
  ctx.lineTo(x + 13, base - 116);
  ctx.lineTo(x + 4, base - 141);
  ctx.closePath();
  ctx.fillStyle = RED; ctx.fill();
  rect(x - 14, base - 119, 28, 6, SNOW);
  circ(x + 5, base - 143, 5.5, SNOW);
}

// ---- snow ground and the rink ---------------------------------
var RINK = { x: 640, y: 706, rx: 440, ry: 118 };
function drawGround() {
  rect(-320, 636, DW + 640, DH - 636 + 320, SNOW);
  ell(300, 668, 420, 52, SNOW);
  ell(1010, 672, 430, 54, SNOW);
  // the ice
  ell(RINK.x, RINK.y, RINK.rx, RINK.ry, ICE);
  ctx.beginPath();
  ctx.ellipse(RINK.x, RINK.y, RINK.rx * 0.74, RINK.ry * 0.72, 0, 0, Math.PI * 2);
  ctx.strokeStyle = TRAIL; ctx.globalAlpha = 0.35; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(RINK.x, RINK.y, RINK.rx * 0.46, RINK.ry * 0.44, 0, 0, Math.PI * 2);
  ctx.strokeStyle = TRAIL; ctx.globalAlpha = 0.28; ctx.lineWidth = 3; ctx.stroke();
  ctx.globalAlpha = 1;
}

// ---- the skaters ------------------------------------------------
// Exactly four, in a hand-holding line on an elliptical
// path inside the rink. Neighbours sit a fixed 0.34 rad
// apart along the path and travel one full revolution
// per loop. Each figure is drawn facing its direction of
// travel; the scale grows on the near arc. The hand-hold
// line joins each skater's forward hand to the next
// skater's back hand, computed from the same anchors the
// arms are drawn to.
var PATH = { x: 640, y: 706, rx: 330, ry: 86 };
var SKATERS = [
  { off: 0.00, coat: AWNING, scarf: GOLD, hat: RED },
  { off: 0.34, coat: BLUE, scarf: PINK, hat: MOON },
  { off: 0.68, coat: GOLD, scarf: AWNING, hat: BLUE },
  { off: 1.02, coat: LEAF, scarf: MOON, hat: PINK }
];
if (SKATERS.length !== 4) throw new Error('rink must have exactly 4 skaters');
var DECAY = [0.50, 0.42, 0.35, 0.29, 0.23, 0.18, 0.13, 0.09];
if (DECAY.length !== 8) throw new Error('trail decay table must hold 8 steps');

function skaterState(sk, lt) {
  var th = Math.PI * 2 * lt / LOOP + sk.off;
  var d = Math.sin(th);
  return {
    th: th,
    x: PATH.x + PATH.rx * Math.cos(th),
    y: PATH.y + PATH.ry * d,
    s: 0.78 + 0.30 * ((d + 1) / 2),
    f: (-Math.sin(th)) >= 0 ? 1 : -1,
    sk: sk
  };
}
function handPoint(st, dir) {
  return { x: st.x + dir * st.f * 17 * st.s, y: st.y - 57 * st.s };
}
function drawTrails(lt) {
  ctx.strokeStyle = TRAIL;
  ctx.lineWidth = 3;
  for (var i = 0; i < SKATERS.length; i++) {
    var st = skaterState(SKATERS[i], lt);
    for (var k = 1; k <= DECAY.length; k++) {
      var a = st.th - k * 0.055;
      ctx.beginPath();
      ctx.ellipse(PATH.x, PATH.y, PATH.rx, PATH.ry, 0, a - 0.026, a + 0.026);
      ctx.globalAlpha = DECAY[k - 1];
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}
function drawSkater(st, lt, breeze) {
  var sk = st.sk, s = st.s, f = st.f;
  ctx.save();
  ctx.translate(st.x, st.y);
  ctx.scale(s, s);
  // stride: the feet alternate on 2 whole cycles per loop
  var sw = Math.sin(Math.PI * 2 * 2 * lt / LOOP + sk.off * 5);
  var fAx = f * (4 + 9 * sw), fBx = f * (-6 - 9 * sw);
  line(0, -40, fAx, -3, PINE, 8);
  line(0, -40, fBx, -3, PINE, 8);
  line(fAx - 9, -1, fAx + 11, -1, TRAIL, 3);
  line(fBx - 9, -1, fBx + 11, -1, TRAIL, 3);
  // coat: a rounded bell from hips to shoulders
  ctx.beginPath();
  ctx.moveTo(-14, -36);
  ctx.quadraticCurveTo(-17, -58, -11, -70);
  ctx.lineTo(11, -70);
  ctx.quadraticCurveTo(17, -58, 14, -36);
  ctx.quadraticCurveTo(0, -31, -14, -36);
  ctx.closePath();
  ctx.fillStyle = sk.coat; ctx.fill();
  // arms out to the hand anchors, snow mittens
  line(-6, -64, f * 17, -57, sk.coat, 7);
  line(6, -64, -f * 17, -57, sk.coat, 7);
  circ(f * 17, -57, 4.2, SNOW);
  circ(-f * 17, -57, 4.2, SNOW);
  // scarf: trails behind the motion, lifted by the breeze.
  var flut = Math.sin(Math.PI * 2 * 3 * lt / LOOP + sk.off * 7);
  var tipX = -f * 30 + breeze * 34;
  var tipY = -62 + flut * 3.2 - Math.abs(breeze) * 11;
  line(-f * 4, -68, tipX, tipY, sk.scarf, 8);
  line(tipX, tipY, tipX - f * 12, tipY + 5 + flut * 2, sk.scarf, 6.5);
  circ(0, -68, 5.5, sk.scarf);
  // head, hair and hat
  circ(0, -84, 11, MOON);
  ctx.beginPath(); ctx.arc(0, -85, 11.5, Math.PI * 1.02, Math.PI * 1.98); ctx.lineTo(0, -85); ctx.closePath();
  ctx.fillStyle = STALL; ctx.fill();
  ctx.beginPath(); ctx.arc(0, -86, 12, Math.PI, Math.PI * 2); ctx.closePath();
  ctx.fillStyle = sk.hat; ctx.fill();
  rect(-12, -89, 24, 4.5, sk.hat);
  circ(0, -99, 4, SNOW);
  ctx.globalAlpha = 0.75;
  circ(-5.5, -80, 2.4, PINK);
  circ(5.5, -80, 2.4, PINK);
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ---- falling snow ------------------------------------------------
// A fixed table of 110 flakes. Each falls a whole number
// of field heights per loop (span 1020, the design height
// plus a margin top and bottom) and wraps, so the field
// repeats exactly at the seam. A gentle sway rides on
// whole cycles; the breeze adds a sideways push that
// vanishes with the breeze value itself.
var SNOW_TABLE = [];
(function () {
  var rng = mulberry32(4328);
  for (var i = 0; i < 110; i++) {
    SNOW_TABLE.push({
      x: -40 + rng() * 1360,
      y0: rng() * 1020,
      falls: 1 + Math.floor(rng() * 2),
      r: 1.4 + rng() * 2.0,
      cyc: 1 + Math.floor(rng() * 3),
      ph: rng() * Math.PI * 2,
      drift: 0.6 + rng() * 0.8
    });
  }
})();
if (SNOW_TABLE.length !== 110) throw new Error('snow table must hold exactly 110 flakes');
function drawSnow(lt, breeze, front) {
  ctx.fillStyle = SNOW;
  for (var i = 0; i < SNOW_TABLE.length; i++) {
    if ((i % 2 === 0) !== front) continue;
    var d = SNOW_TABLE[i];
    var y = ((d.y0 + d.falls * 1020 * lt / LOOP) % 1020) - 60;
    var x = d.x + 8 * Math.sin(Math.PI * 2 * d.cyc * lt / LOOP + d.ph) + breeze * 46 * d.drift;
    ctx.globalAlpha = 0.85;
    circ(x, y, d.r, SNOW);
  }
  ctx.globalAlpha = 1;
}

// ---- scene ---------------------------------------------------------
function draw() {
  var lt = T % LOOP;
  ctx.fillStyle = SKY;
  ctx.fillRect(-320, -360, DW + 640, DH + 720);
  drawMoon(lt);
  drawStrands(lt);
  drawPine(86, 664, 330);
  drawPine(196, 660, 238);
  drawStall(6, 148, false);
  drawStall(164, 148, true);
  drawSanta();
  drawPine(1232, 666, 268);
  drawTree(lt);
  drawGround();
  drawTrails(lt);
  drawSnow(lt, breezeNow, false);
  // hand-hold lines first, then the skaters far to near
  var states = [];
  var i;
  for (i = 0; i < SKATERS.length; i++) states.push(skaterState(SKATERS[i], lt));
  for (i = 0; i < states.length - 1; i++) {
    var h1 = handPoint(states[i], 1);
    var h2 = handPoint(states[i + 1], -1);
    line(h1.x, h1.y, h2.x, h2.y, SNOW, 4);
  }
  var order = states.slice().sort(function (a, b) { return a.y - b.y; });
  for (i = 0; i < order.length; i++) drawSkater(order[i], lt, breezeNow);
  drawSnow(lt, breezeNow, true);
}

// ---- piece state -----------------------------------------------------
// Constant first-frame phase: T = 11.0s into the 40s loop
// (the line of skaters on the near arc, mid-glide). The
// clock advances in fixed 1/60 ticks from there.
//
// The breeze: while dragging, breezeNow eases toward a
// target set by the pointer's smoothed horizontal speed
// and direction; on release it decays geometrically in
// step() and snaps to exactly zero, so every breeze-fed
// value settles back to exactly the loop value. Frame one
// (breeze 0, or the QA probe value) is deterministic.
var T = 11.0;
var lastNow = -1, acc = 0;
var breezeNow = 0, velSm = 0, dragging = false;
if (typeof location !== 'undefined' && location.search && location.search.indexOf('breeze') >= 0) breezeNow = 0.9;

function step() {
  if (dragging) {
    var target = Math.max(-1, Math.min(1, velSm / 1400));
    breezeNow += (target - breezeNow) * 0.10;
    velSm *= 0.92;
  } else {
    breezeNow *= 0.965;
    if (Math.abs(breezeNow) < 0.002) breezeNow = 0;
    velSm = 0;
  }
  T += TICK;
}

// ---- pointer: drag anywhere to pull a breeze --------------------------
function toDesign(ev) {
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cx = (ev.clientX !== undefined ? ev.clientX : (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 0)) - r.left;
  var cy = (ev.clientY !== undefined ? ev.clientY : (ev.touches && ev.touches[0] ? ev.touches[0].clientY : 0)) - r.top;
  return { x: (cx - OX) / S, y: (cy - OY) / S };
}
var lastPX = 0, lastPT = -1;
function onDown(ev) {
  dragging = true;
  var p = toDesign(ev);
  lastPX = p.x;
  lastPT = (typeof ev.timeStamp === 'number') ? ev.timeStamp : -1;
  velSm = 0;
  if (ev.preventDefault) ev.preventDefault();
}
function onMove(ev) {
  if (!dragging) return;
  var p = toDesign(ev);
  var dx = p.x - lastPX;
  var now = (typeof ev.timeStamp === 'number') ? ev.timeStamp : -1;
  if (lastPT >= 0 && now > lastPT) {
    var inst = dx / ((now - lastPT) / 1000);
    velSm = velSm * 0.6 + inst * 0.4;
  }
  lastPX = p.x; lastPT = now;
  if (ev.preventDefault) ev.preventDefault();
}
function onUp() { dragging = false; }
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('touchcancel', onUp);
}

// ---- sizing -------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = SKY;
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
