<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angle. Reflect. Release.</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0C; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// No.859 "Angle. Reflect. Release." - study #105 hsin-chien-huang, PP20 "Resonance Puzzles".
// Sound spheres launch from the bottom edge, bounce off concrete rails, and each
// bounce releases an expanding resonance ring. Overlapping rings glow teal.
// Drag-flick launches, tap rotates the nearest rail 15 degrees, double-tap reseeds.

var VOID = '#0A0A0C', RAIL = '#6E6A63', AMBER = '#E8A020',
    RING = '#D8D2C4', TEAL = '#7FD4C1', PORTAL = '#120A08';

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 720, H = 720, U = 720; // U = min dimension, layout unit

function isPhone() {
  var sw = 9999, sh = 9999;
  if (typeof window !== 'undefined' && window.screen) {
    sw = window.screen.width || 9999; sh = window.screen.height || 9999;
  }
  if (Math.min(sw, sh) < 700) return true;
  return H > W * 1.15;
}

function resize() {
  var w = W, h = H;
  if (typeof window !== 'undefined') {
    if (window.visualViewport) { w = window.visualViewport.width; h = window.visualViewport.height; }
    else if (window.innerWidth) { w = window.innerWidth; h = window.innerHeight; }
  }
  W = Math.max(200, Math.floor(w)); H = Math.max(200, Math.floor(h));
  U = Math.min(W, H);
  canvas.width = W; canvas.height = H;
  layout();
}
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
  if (window.addEventListener) window.addEventListener('resize', resize);
}

// ---------- state ----------
var epoch = 0;
var rails = [];      // {cx, cy, ang, len, half} in px, rebuilt by layout()
var railSpec = [];   // normalized specs per epoch: {x, y, ang, len}
var portal = { x: 0, y: 0, w: 0, h: 0, r: 0 };
var spheres = [];    // {x, y, vx, vy, r, born, pitch, dead}
var rings = [];      // {x, y, born}
var simT = 0;
var lastAuto = 0;
var rng = mulberry32(859001);

var RING_SPEED = 150, RING_LIFE = 2.6, SPHERE_LIFE = 14, MAX_SPHERES = 12;

function buildSpecs() {
  var r = mulberry32(859001 + epoch * 7919);
  function j(v, amt) { return v + (r() * 2 - 1) * amt; }
  // Open triangle: two upper diagonals leaning in, one low cross rail,
  // one short mid rail; gaps left open on purpose.
  railSpec = [
    { x: j(0.30, 0.03), y: j(0.30, 0.03), ang: j(0.62, 0.10), len: j(0.46, 0.04) },
    { x: j(0.70, 0.03), y: j(0.30, 0.03), ang: j(Math.PI - 0.62, 0.10), len: j(0.46, 0.04) },
    { x: j(0.50, 0.03), y: j(0.68, 0.03), ang: j(0.10, 0.12), len: j(0.52, 0.04) },
    { x: j(0.20, 0.03), y: j(0.55, 0.03), ang: j(Math.PI / 2 + 0.25, 0.12), len: j(0.30, 0.04) }
  ];
  rng = r;
}

function layout() {
  rails = railSpec.map(function (s) {
    return {
      cx: s.x * W, cy: s.y * H, ang: s.ang,
      len: s.len * U, half: Math.max(5, U * 0.016)
    };
  });
  var pw = U * 0.16, ph = U * 0.30;
  portal = { w: pw, h: ph, x: W - pw - U * 0.02, y: H * 0.52 - ph / 2, r: U * 0.03 };
}

function railEnds(rl) {
  var dx = Math.cos(rl.ang) * rl.len / 2, dy = Math.sin(rl.ang) * rl.len / 2;
  return { ax: rl.cx - dx, ay: rl.cy - dy, bx: rl.cx + dx, by: rl.cy + dy };
}

function spawnSphere(x, y, vx, vy, born) {
  if (spheres.length >= MAX_SPHERES) spheres.shift();
  var s = {
    x: x, y: y, vx: vx, vy: vy,
    r: Math.max(4, U * 0.013), born: born,
    pitch: 220 * Math.pow(2, Math.floor(rng() * 8) / 12 * 2), dead: false
  };
  spheres.push(s);
  return s;
}

function resetWorld() {
  buildSpecs();
  layout();
  spheres = []; rings = [];
  simT = 0; lastAuto = 0;
  // Frame-one anchor: one sphere pre-launched (born at -1.15 s), placed mid-flight
  // above the low rail, with one fresh ring still expanding from its last bounce
  // point on that rail. All values come from the seeded epoch stream.
  var s = spawnSphere(W * 0.44, H * 0.52, U * 0.16, -U * 0.20, -1.15);
  s.pitch = 330;
  var low = rails[2];
  rings.push({ x: low.cx - low.len * 0.10, y: low.cy - low.half - s.r, born: -0.38 });
}

// ---------- audio (lazy, gesture-gated) ----------
var AC = null, master = null;
function ensureAudio() {
  if (AC) { if (AC.resume) AC.resume(); return; }
  if (typeof AudioContext === 'undefined' && typeof webkitAudioContext === 'undefined') return;
  try {
    var Ctor = (typeof AudioContext !== 'undefined') ? AudioContext : webkitAudioContext;
    AC = new Ctor();
    master = AC.createGain(); master.gain.value = 0.16;
    master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function blip(freq, vol) {
  if (!AC || !master) return;
  try {
    var t = AC.currentTime;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.5);
  } catch (e) { /* silence is fine */ }
}

// ---------- physics ----------
function stepSphere(s, dt) {
  s.vy += U * 0.22 * dt; // gentle gravity, units px/s^2 scaled by U
  s.x += s.vx * dt; s.y += s.vy * dt;
  // side and top walls bounce; the bottom is open (launch edge / exit)
  if (s.x < s.r) { s.x = s.r; s.vx = Math.abs(s.vx); bounceFx(s); }
  if (s.x > W - s.r) { s.x = W - s.r; s.vx = -Math.abs(s.vx); bounceFx(s); }
  if (s.y < s.r) { s.y = s.r; s.vy = Math.abs(s.vy); bounceFx(s); }
  // rails: capsule collision against each segment
  for (var i = 0; i < rails.length; i++) {
    var rl = rails[i], e = railEnds(rl);
    var ex = e.bx - e.ax, ey = e.by - e.ay;
    var L2 = ex * ex + ey * ey;
    var tt = L2 > 0 ? ((s.x - e.ax) * ex + (s.y - e.ay) * ey) / L2 : 0;
    tt = Math.max(0, Math.min(1, tt));
    var px = e.ax + ex * tt, py = e.ay + ey * tt;
    var dx = s.x - px, dy = s.y - py;
    var d = Math.sqrt(dx * dx + dy * dy), minD = s.r + rl.half;
    if (d < minD && d > 0.0001) {
      var nx = dx / d, ny = dy / d;
      var vn = s.vx * nx + s.vy * ny;
      if (vn < 0) {
        s.vx -= 2 * vn * nx; s.vy -= 2 * vn * ny;
        s.vx *= 0.985; s.vy *= 0.985;
        s.x = px + nx * (minD + 0.5); s.y = py + ny * (minD + 0.5);
        rings.push({ x: px + nx * rl.half, y: py + ny * rl.half, born: simT });
        bounceFx(s);
      }
    }
  }
  // portal swallows
  if (s.x > portal.x && s.x < portal.x + portal.w && s.y > portal.y && s.y < portal.y + portal.h) s.dead = true;
  if (s.y > H + s.r * 3) s.dead = true;
  if (simT - s.born > SPHERE_LIFE) s.dead = true;
}
function bounceFx(s) { blip(s.pitch, 0.5); }

function step(dt) {
  simT += dt;
  for (var i = 0; i < spheres.length; i++) stepSphere(spheres[i], dt);
  spheres = spheres.filter(function (s) { return !s.dead; });
  rings = rings.filter(function (rg) { return simT - rg.born < RING_LIFE; });
  if (simT - lastAuto > 9) {
    lastAuto = simT;
    var lx = W * (0.3 + rng() * 0.4);
    spawnSphere(lx, H - U * 0.02, (rng() * 2 - 1) * U * 0.12, -U * (0.52 + rng() * 0.18), simT);
  }
}

// ---------- drawing ----------
function ringRadius(rg) { return Math.max(0.1, (simT - rg.born) * RING_SPEED * (U / 720)); }
function ringAlpha(rg) {
  var a = (simT - rg.born) / RING_LIFE;
  return a < 0 || a > 1 ? 0 : 0.55 * (1 - a);
}

function draw() {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.fillStyle = VOID;
  ctx.fillRect(0, 0, W, H);

  // portal: deep-brown rounded patch at the right side
  ctx.fillStyle = PORTAL;
  ctx.beginPath();
  var p = portal, r = p.r;
  ctx.moveTo(p.x + r, p.y);
  ctx.lineTo(p.x + p.w - r, p.y); ctx.arcTo(p.x + p.w, p.y, p.x + p.w, p.y + r, r);
  ctx.lineTo(p.x + p.w, p.y + p.h - r); ctx.arcTo(p.x + p.w, p.y + p.h, p.x + p.w - r, p.y + p.h, r);
  ctx.lineTo(p.x + r, p.y + p.h); ctx.arcTo(p.x, p.y + p.h, p.x, p.y + p.h - r, r);
  ctx.lineTo(p.x, p.y + r); ctx.arcTo(p.x, p.y, p.x + r, p.y, r);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = RAIL; ctx.globalAlpha = 0.35; ctx.lineWidth = Math.max(1, U * 0.002);
  ctx.stroke(); ctx.globalAlpha = 1;

  // ring overlap glow: lens where two active ring circles intersect
  var act = rings.filter(function (rg) { return ringAlpha(rg) > 0.01; });
  ctx.fillStyle = TEAL;
  for (var i = 0; i < act.length; i++) {
    for (var j = i + 1; j < act.length; j++) {
      var a = act[i], b = act[j];
      var ra = ringRadius(a), rb = ringRadius(b);
      var dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy);
      if (d < ra + rb && d > Math.abs(ra - rb) && d > 0.01) {
        ctx.save();
        ctx.beginPath(); ctx.arc(a.x, a.y, ra, 0, Math.PI * 2); ctx.clip();
        ctx.globalAlpha = 0.16 * Math.min(ringAlpha(a), ringAlpha(b)) / 0.55 + 0.05;
        ctx.beginPath(); ctx.arc(b.x, b.y, rb, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }
  }
  ctx.globalAlpha = 1;

  // resonance rings
  ctx.strokeStyle = RING;
  for (var k = 0; k < rings.length; k++) {
    var al = ringAlpha(rings[k]);
    if (al <= 0) continue;
    ctx.globalAlpha = al;
    ctx.lineWidth = Math.max(1, U * 0.003);
    ctx.beginPath(); ctx.arc(rings[k].x, rings[k].y, ringRadius(rings[k]), 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // rails: thick concrete segments with a worn top edge
  for (var m = 0; m < rails.length; m++) {
    var rl = rails[m], e = railEnds(rl);
    ctx.strokeStyle = RAIL;
    ctx.lineCap = 'round';
    ctx.lineWidth = rl.half * 2;
    ctx.beginPath(); ctx.moveTo(e.ax, e.ay); ctx.lineTo(e.bx, e.by); ctx.stroke();
    ctx.strokeStyle = RING; ctx.globalAlpha = 0.22; ctx.lineWidth = Math.max(1, U * 0.0025);
    ctx.beginPath();
    ctx.moveTo(e.ax, e.ay - rl.half * 0.55); ctx.lineTo(e.bx, e.by - rl.half * 0.55);
    ctx.stroke(); ctx.globalAlpha = 1;
  }

  // spheres: amber core with flat-alpha halo
  for (var n = 0; n < spheres.length; n++) {
    var s = spheres[n];
    var age = simT - s.born;
    var fade = age > SPHERE_LIFE - 1.5 ? Math.max(0, (SPHERE_LIFE - age) / 1.5) : 1;
    ctx.fillStyle = AMBER;
    ctx.globalAlpha = 0.10 * fade;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 3.1, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.22 * fade;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 1.9, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1 * fade;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = RING; ctx.globalAlpha = 0.85 * fade;
    ctx.beginPath(); ctx.arc(s.x - s.r * 0.3, s.y - s.r * 0.3, s.r * 0.32, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ---------- interaction ----------
var drag = null, lastTapT = -10, lastTapX = 0, lastTapY = 0;
function evtPos(ev) {
  var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  var cx = (ev.clientX !== undefined) ? ev.clientX : (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 0);
  var cy = (ev.clientY !== undefined) ? ev.clientY : (ev.touches && ev.touches[0] ? ev.touches[0].clientY : 0);
  return { x: cx - rect.left, y: cy - rect.top };
}
function onDown(ev) {
  ensureAudio();
  var pt = evtPos(ev);
  drag = { sx: pt.x, sy: pt.y, x: pt.x, y: pt.y, t: performanceNow(), moved: false };
  if (ev.preventDefault) ev.preventDefault();
}
function onMove(ev) {
  if (!drag) return;
  var pt = evtPos(ev);
  drag.x = pt.x; drag.y = pt.y;
  if (Math.abs(pt.x - drag.sx) + Math.abs(pt.y - drag.sy) > 12) drag.moved = true;
  if (ev.preventDefault) ev.preventDefault();
}
function onUp(ev) {
  if (!drag) return;
  var now = performanceNow();
  var dt = Math.max(0.05, (now - drag.t) / 1000);
  var pt = { x: drag.x, y: drag.y };
  if (drag.moved) {
    // flick: launch from the bottom edge near the release x, vector from the flick
    var vx = (drag.x - drag.sx) / dt * 0.55;
    var vy = (drag.y - drag.sy) / dt * 0.55;
    var sp = Math.sqrt(vx * vx + vy * vy), maxSp = U * 0.95;
    if (sp > maxSp) { vx *= maxSp / sp; vy *= maxSp / sp; }
    if (vy > -U * 0.18) vy = -U * (0.35 + Math.abs(vx) * 0.0004); // always launch upward into the space
    spawnSphere(Math.max(10, Math.min(W - 10, pt.x)), H - U * 0.02, vx, vy, simT);
    blip(440, 0.25);
  } else {
    // tap: double-tap reseeds; single tap rotates the nearest rail 15 degrees
    var since = (now - lastTapT) / 1000;
    if (since < 0.35 && Math.abs(pt.x - lastTapX) + Math.abs(pt.y - lastTapY) < 60) {
      epoch++;
      resetWorld();
      lastTapT = -10;
    } else {
      var best = null, bd = 1e18;
      for (var i = 0; i < rails.length; i++) {
        var rl = rails[i], ddx = pt.x - rl.cx, ddy = pt.y - rl.cy, dd = ddx * ddx + ddy * ddy;
        if (dd < bd) { bd = dd; best = rl; }
      }
      if (best) { best.ang += Math.PI / 12; blip(196, 0.3); }
      lastTapT = now; lastTapX = pt.x; lastTapY = pt.y;
    }
  }
  drag = null;
  if (ev.preventDefault) ev.preventDefault();
}
function performanceNow() {
  if (typeof performance !== 'undefined' && performance.now) return performance.now();
  return simT * 1000;
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', function () { drag = null; });
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onUp, { passive: false });
}

// ---------- boot + loop ----------
buildSpecs();
resize();
resetWorld();
draw(); // frame one: synchronous, seeded

if (typeof requestAnimationFrame !== 'undefined') {
  var lastTs = null, acc = 0, STEP = 1 / 120;
  var frame = function (ts) {
    if (lastTs === null) lastTs = ts;
    var el = Math.min(0.1, (ts - lastTs) / 1000);
    lastTs = ts;
    acc += el;
    while (acc >= STEP) { step(STEP); acc -= STEP; }
    draw();
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
