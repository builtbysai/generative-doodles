<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№859 One Track, Many Rooms</title>
<style>
  html, body { margin: 0; padding: 0; background: #120709; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №859 One Track, Many Rooms, CK5 / PP1259, study #262 colton-kempf.
  // Many rooms of performance dissolve into one unbroken red surface
  // held together by a single line of music. Dozens of performance
  // glimpses, red stage light, a mic stand, hands on a turntable, a
  // crowd, all blended through soft transparency into one continuous
  // surface. Watch-only. Audio is visual-only in this gallery: the
  // gold line IS the track, no real WebAudio, per the Franke rule.
  var GROUND = '#120709'; // page ground, deep shadow

  // Fixed-phase first frame: FIRST_T = 15 s into a 90 s cycle.
  // Every layer drifts on its own closed-form path; each layer's
  // period divides 90, so the frame at FIRST_T + 90 equals the
  // frame at FIRST_T and the ending loops back to a beginning.
  var FIRST_T = 15;
  var CYCLE = 90;
  var SEED = 859;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }
  function circle(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
  }
  function ellipsePath(x, y, rx, ry, rot) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  }

  // Palette: saturated red stage light dissolving into warm lamplight,
  // deep shadows. The gold line is the single unbroken track.
  var SHADOW = [18, 7, 9];
  var SHADOW_DEEP = [8, 3, 5];
  var RED = [198, 32, 42];
  var RED_HOT = [232, 64, 52];
  var RED_DIM = [120, 22, 30];
  var LAMP = [255, 178, 92];
  var LAMP_SOFT = [238, 150, 70];
  var GOLD = [232, 186, 92];
  var CREAM = [244, 226, 200];
  var SILHOUETTE = [10, 4, 6];
  var CROWD_RIM = [150, 40, 44];

  // ---- Layer table: 6 translucent performance glimpses -------------
  // Each layer drifts on its own closed-form path; period divides
  // the 90 s cycle so the loop is seamless. ph staggers the phase.
  var layerRng = mulberry32(SEED * 13 + 5);
  var LAYERS = [
    { name: 'stage',  period: 90,   ampX: 0.030, ampY: 0.012, ph: 0.0 },
    { name: 'turntable', period: 45, ampX: 0.022, ampY: 0.016, ph: 1.1 },
    { name: 'crowd',  period: 30,   ampX: 0.014, ampY: 0.008, ph: 2.0 },
    { name: 'guitar', period: 45,   ampX: 0.026, ampY: 0.020, ph: 3.4 },
    { name: 'lamp',   period: 22.5, ampX: 0.018, ampY: 0.010, ph: 0.7 },
    { name: 'drums',  period: 18,   ampX: 0.020, ampY: 0.012, ph: 2.6 }
  ];
  var li;
  for (li = 0; li < LAYERS.length; li++) {
    LAYERS[li].ph = LAYERS[li].ph + layerRng() * 0.6;
  }
  function layerOffset(i, t) {
    var L = LAYERS[i];
    var w = 2 * Math.PI * (t - FIRST_T) / L.period;
    // y rides the second harmonic so its period (period/2) still
    // divides the 90 s cycle; the first harmonic would double it.
    return {
      x: L.ampX * Math.sin(w + L.ph),
      y: L.ampY * Math.cos(2 * w + L.ph * 1.7)
    };
  }
  function cycleU(t) {
    var u = ((t - FIRST_T) % CYCLE + CYCLE) % CYCLE / CYCLE;
    return u;
  }
  // Credits presence: arrive late in the cycle, dissolve at the loop
  // restart so the ending feels like a beginning.
  function creditsAlpha(t) {
    var u = cycleU(t);
    var fadeIn = smooth((u - 0.70) / 0.15);
    var fadeOut = 1 - smooth((u - 0.94) / 0.06);
    return fadeIn * fadeOut;
  }

  // ---- Fixed crowd-head table: 11 soft dark heads ------------------
  var crowdRng = mulberry32(SEED * 29 + 11);
  var HEADS = [];
  var hi;
  for (hi = 0; hi < 11; hi++) {
    HEADS.push({
      x: 0.04 + hi * 0.092 + (crowdRng() - 0.5) * 0.03,
      y: 0.90 + crowdRng() * 0.05,
      r: 0.028 + crowdRng() * 0.018,
      ph: crowdRng() * Math.PI * 2
    });
  }

  // ---- Fixed credits table: 12 small portrait silhouettes ---------
  // Each drifts in from an edge late in the cycle, then dissolves.
  var credRng = mulberry32(SEED * 37 + 3);
  var CREDITS = [];
  var ci;
  for (ci = 0; ci < 12; ci++) {
    var edge = ci % 4; // 0 left, 1 right, 2 top, 3 bottom
    var along = 0.08 + credRng() * 0.84;
    var startX, startY, endX, endY;
    if (edge === 0) { startX = -0.10; startY = along; endX = 0.10 + credRng() * 0.12; endY = along; }
    else if (edge === 1) { startX = 1.10; startY = along; endX = 0.78 + credRng() * 0.12; endY = along; }
    else if (edge === 2) { startX = along; startY = -0.10; endX = along; endY = 0.10 + credRng() * 0.10; }
    else { startX = along; startY = 1.10; endX = along; endY = 0.76 + credRng() * 0.10; }
    CREDITS.push({
      sx: startX, sy: startY, ex: endX, ey: endY,
      r: 0.020 + credRng() * 0.012,
      ph: credRng() * Math.PI * 2
    });
  }

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  function X(f) { return f * W; }
  function Y(f) { return f * H; }

  // ---- Base: deep shadow with a red-to-lamp wash -------------------
  function drawBase(t) {
    ctx.fillStyle = rgb(SHADOW);
    ctx.fillRect(0, 0, W, H);
    // Saturated red stage light, left and low, dissolving right.
    var rg = ctx.createRadialGradient(X(0.28), Y(0.42), 0, X(0.28), Y(0.42), W * 0.75);
    rg.addColorStop(0, rgba(RED, a4(0.55)));
    rg.addColorStop(0.55, rgba(RED_DIM, a4(0.28)));
    rg.addColorStop(1, rgba(RED_DIM, 0));
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);
    // Warm lamplight, right and high, dissolving left.
    var lg = ctx.createRadialGradient(X(0.78), Y(0.24), 0, X(0.78), Y(0.24), W * 0.62);
    lg.addColorStop(0, rgba(LAMP, a4(0.34)));
    lg.addColorStop(0.6, rgba(LAMP_SOFT, a4(0.12)));
    lg.addColorStop(1, rgba(LAMP_SOFT, 0));
    ctx.fillStyle = lg;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- Layer 1: red stage, mic stand silhouette --------------------
  function drawStage(t) {
    var o = layerOffset(0, t);
    var cx = X(0.30 + o.x), cy = Y(0.42 + o.y);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var beam = ctx.createLinearGradient(cx, 0, cx, Y(0.78));
    beam.addColorStop(0, rgba(RED_HOT, a4(0.42)));
    beam.addColorStop(1, rgba(RED_HOT, 0));
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.05, 0);
    ctx.lineTo(cx + W * 0.05, 0);
    ctx.lineTo(cx + W * 0.16, Y(0.78));
    ctx.lineTo(cx - W * 0.16, Y(0.78));
    ctx.closePath();
    ctx.fill();
    var halo = ctx.createRadialGradient(cx, Y(0.20), 0, cx, Y(0.20), W * 0.16);
    halo.addColorStop(0, rgba(RED_HOT, a4(0.5)));
    halo.addColorStop(1, rgba(RED_HOT, 0));
    ctx.fillStyle = halo;
    ctx.fillRect(cx - W * 0.16, Y(0.04), W * 0.32, W * 0.32);
    ctx.restore();
    // Mic stand: thin pole, round mic head, small base. Silhouette
    // with a red rim on the lit side.
    ctx.strokeStyle = rgba(SILHOUETTE, a4(0.9));
    ctx.lineWidth = Math.max(1.5, W * 0.004);
    ctx.beginPath();
    ctx.moveTo(cx, Y(0.24));
    ctx.lineTo(cx, Y(0.74));
    ctx.stroke();
    ctx.strokeStyle = rgba(RED_HOT, a4(0.55));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    ctx.beginPath();
    ctx.moveTo(cx + W * 0.002, Y(0.24));
    ctx.lineTo(cx + W * 0.002, Y(0.74));
    ctx.stroke();
    ctx.fillStyle = rgba(SILHOUETTE, a4(0.92));
    circle(cx, Y(0.215), W * 0.022);
    ctx.fill();
    ctx.fillStyle = rgba(RED_HOT, a4(0.5));
    circle(cx - W * 0.004, Y(0.21), W * 0.012);
    ctx.fill();
    ctx.fillStyle = rgba(SILHOUETTE, a4(0.9));
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.035, Y(0.74));
    ctx.lineTo(cx + W * 0.035, Y(0.74));
    ctx.lineTo(cx + W * 0.022, Y(0.72));
    ctx.lineTo(cx - W * 0.022, Y(0.72));
    ctx.closePath();
    ctx.fill();
  }

  // ---- Layer 2: hands on a turntable, bottom right ------------------
  function drawTurntable(t) {
    var o = layerOffset(1, t);
    var cx = X(0.70 + o.x), cy = Y(0.74 + o.y);
    var r = W * 0.16;
    ctx.save();
    ctx.globalAlpha = a4(0.85);
    // Platter: dark disc with a red rim and a warm label.
    ctx.fillStyle = rgba(SILHOUETTE, a4(0.88));
    ellipsePath(cx, cy, r, r * 0.42, 0);
    ctx.fill();
    ctx.strokeStyle = rgba(RED_HOT, a4(0.5));
    ctx.lineWidth = Math.max(1, W * 0.002);
    ellipsePath(cx, cy, r, r * 0.42, 0);
    ctx.stroke();
    ctx.fillStyle = rgba(LAMP, a4(0.55));
    ellipsePath(cx, cy, r * 0.30, r * 0.13, 0);
    ctx.fill();
    ctx.fillStyle = rgba(SHADOW_DEEP, a4(0.9));
    ellipsePath(cx, cy, r * 0.07, r * 0.03, 0);
    ctx.fill();
    // Groove rings.
    ctx.strokeStyle = rgba(CREAM, a4(0.14));
    ctx.lineWidth = Math.max(1, W * 0.001);
    var gi;
    for (gi = 0; gi < 3; gi++) {
      ellipsePath(cx, cy, r * (0.55 + gi * 0.13), r * 0.42 * (0.55 + gi * 0.13), 0);
      ctx.stroke();
    }
    // Tonearm from the platter's edge.
    ctx.strokeStyle = rgba(SILHOUETTE, a4(0.9));
    ctx.lineWidth = Math.max(1.5, W * 0.003);
    ctx.beginPath();
    ctx.moveTo(cx + r * 0.95, cy - r * 0.30);
    ctx.lineTo(cx + r * 0.30, cy - r * 0.05);
    ctx.stroke();
    // Two hands: soft rounded shapes over the record, fingertips
    // toward the label. No detail, just the gesture.
    ctx.fillStyle = rgba([52, 22, 20], a4(0.85));
    ctx.save();
    ctx.translate(cx - r * 0.25, cy - r * 0.28);
    ctx.rotate(-0.5);
    ellipsePath(0, 0, r * 0.34, r * 0.13, 0);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(cx + r * 0.42, cy + r * 0.10);
    ctx.rotate(0.35);
    ellipsePath(0, 0, r * 0.30, r * 0.12, 0);
    ctx.fill();
    ctx.restore();
    // Fingertips: four small warm-lit caps on the first hand.
    ctx.fillStyle = rgba(LAMP_SOFT, a4(0.5));
    var fi;
    for (fi = 0; fi < 4; fi++) {
      circle(cx - r * (0.42 - fi * 0.10), cy - r * (0.30 - fi * 0.015), W * 0.006);
      ctx.fill();
    }
    ctx.restore();
  }

  // ---- Layer 3: crowd as soft dark heads, low in the frame ---------
  function drawCrowd(t) {
    var o = layerOffset(2, t);
    var i, h, hx, hy, bob;
    for (i = 0; i < HEADS.length; i++) {
      h = HEADS[i];
      bob = Math.sin(2 * Math.PI * (t - FIRST_T) / LAYERS[2].period + h.ph) * H * 0.006;
      hx = X(h.x + o.x);
      hy = Y(h.y + o.y) + bob;
      var r = h.r * W;
      ctx.fillStyle = rgba(SILHOUETTE, a4(0.92));
      circle(hx, hy, r);
      ctx.fill();
      // Red rim light on the upper edge of each head.
      ctx.strokeStyle = rgba(CROWD_RIM, a4(0.55));
      ctx.lineWidth = Math.max(1, W * 0.002);
      ctx.beginPath();
      ctx.moveTo(hx - r * 0.7, hy - r * 0.7);
      ctx.arc(hx, hy, r, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
      // Shoulders below the head.
      ctx.fillStyle = rgba(SILHOUETTE, a4(0.85));
      ctx.beginPath();
      ctx.moveTo(hx - r * 1.5, Y(1.02));
      ctx.lineTo(hx - r * 1.5, hy + r * 0.5);
      ctx.quadraticCurveTo(hx, hy - r * 0.3, hx + r * 1.5, hy + r * 0.5);
      ctx.lineTo(hx + r * 1.5, Y(1.02));
      ctx.closePath();
      ctx.fill();
    }
  }

  // ---- Layer 4: guitar neck, diagonal across the blend -------------
  function drawGuitar(t) {
    var o = layerOffset(3, t);
    ctx.save();
    ctx.translate(X(0.42 + o.x), Y(0.58 + o.y));
    ctx.rotate(-0.62);
    ctx.globalAlpha = a4(0.8);
    var len = W * 0.52, wid = W * 0.032;
    // Neck: dark wood with a warm edge.
    ctx.fillStyle = rgba([30, 12, 10], a4(0.9));
    ctx.fillRect(-len / 2, -wid / 2, len, wid);
    ctx.fillStyle = rgba(LAMP_SOFT, a4(0.28));
    ctx.fillRect(-len / 2, -wid / 2, len, Math.max(1, wid * 0.18));
    // Frets.
    ctx.strokeStyle = rgba(CREAM, a4(0.35));
    ctx.lineWidth = Math.max(1, W * 0.0012);
    var fi;
    for (fi = 0; fi < 9; fi++) {
      var fx = -len / 2 + (fi + 0.5) * len / 9;
      ctx.beginPath();
      ctx.moveTo(fx, -wid / 2);
      ctx.lineTo(fx, wid / 2);
      ctx.stroke();
    }
    // Strings, thin gold lines along the neck.
    ctx.strokeStyle = rgba(GOLD, a4(0.45));
    ctx.lineWidth = Math.max(0.75, W * 0.0008);
    var si;
    for (si = 0; si < 3; si++) {
      var sy = -wid / 2 + wid * (0.3 + si * 0.2);
      ctx.beginPath();
      ctx.moveTo(-len / 2, sy);
      ctx.lineTo(len / 2, sy);
      ctx.stroke();
    }
    // Headstock with tuning pegs.
    ctx.fillStyle = rgba([24, 10, 9], a4(0.9));
    ctx.fillRect(len / 2, -wid * 0.75, W * 0.07, wid * 1.5);
    ctx.fillStyle = rgba(CREAM, a4(0.5));
    var pi;
    for (pi = 0; pi < 3; pi++) {
      circle(len / 2 + W * 0.02 + pi * W * 0.018, -wid * 0.75, W * 0.004);
      ctx.fill();
      circle(len / 2 + W * 0.02 + pi * W * 0.018, wid * 0.75, W * 0.004);
      ctx.fill();
    }
    ctx.restore();
  }

  // ---- Layer 5: warm lamp glow, top right --------------------------
  function drawLamp(t) {
    var o = layerOffset(4, t);
    var cx = X(0.80 + o.x), cy = Y(0.16 + o.y);
    var pulse = 0.5 + 0.5 * Math.sin(2 * Math.PI * (t - FIRST_T) / LAYERS[4].period + 0.7);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, W * 0.30);
    g.addColorStop(0, rgba(LAMP, a4(0.42 + 0.14 * pulse)));
    g.addColorStop(0.5, rgba(LAMP_SOFT, a4(0.16)));
    g.addColorStop(1, rgba(LAMP_SOFT, 0));
    ctx.fillStyle = g;
    ctx.fillRect(cx - W * 0.30, cy - W * 0.30, W * 0.60, W * 0.60);
    ctx.restore();
    // Lamp shade: a small warm trapezoid hanging in the glow.
    ctx.fillStyle = rgba([96, 52, 26], a4(0.85));
    ctx.beginPath();
    ctx.moveTo(cx - W * 0.045, cy - W * 0.02);
    ctx.lineTo(cx + W * 0.045, cy - W * 0.02);
    ctx.lineTo(cx + W * 0.065, cy + W * 0.045);
    ctx.lineTo(cx - W * 0.065, cy + W * 0.045);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = rgba(SILHOUETTE, a4(0.8));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    ctx.beginPath();
    ctx.moveTo(cx, cy - W * 0.05);
    ctx.lineTo(cx, cy - W * 0.02);
    ctx.stroke();
  }

  // ---- Layer 6: drum kit edge, bottom left -------------------------
  function drawDrums(t) {
    var o = layerOffset(5, t);
    var cx = X(0.16 + o.x), cy = Y(0.80 + o.y);
    ctx.save();
    ctx.globalAlpha = a4(0.8);
    // Cymbal: a tilted gold ellipse catching the red light.
    ctx.fillStyle = rgba(GOLD, a4(0.5));
    ellipsePath(cx, cy - H * 0.06, W * 0.10, W * 0.022, -0.18);
    ctx.fill();
    ctx.fillStyle = rgba(RED_HOT, a4(0.35));
    ellipsePath(cx, cy - H * 0.06, W * 0.10, W * 0.022, -0.18);
    ctx.fill();
    // Cymbal stand.
    ctx.strokeStyle = rgba(SILHOUETTE, a4(0.9));
    ctx.lineWidth = Math.max(1.5, W * 0.003);
    ctx.beginPath();
    ctx.moveTo(cx, cy - H * 0.06);
    ctx.lineTo(cx - W * 0.01, Y(0.98));
    ctx.stroke();
    // Drum shell: a dark cylinder edge with a warm rim.
    ctx.fillStyle = rgba(SILHOUETTE, a4(0.88));
    ctx.beginPath();
    ctx.moveTo(cx + W * 0.02, cy + H * 0.02);
    ctx.lineTo(cx + W * 0.13, cy + H * 0.02);
    ctx.lineTo(cx + W * 0.13, cy + H * 0.12);
    ctx.lineTo(cx + W * 0.02, cy + H * 0.12);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = rgba(LAMP_SOFT, a4(0.45));
    ctx.lineWidth = Math.max(1, W * 0.0015);
    ctx.beginPath();
    ctx.moveTo(cx + W * 0.02, cy + H * 0.02);
    ctx.lineTo(cx + W * 0.13, cy + H * 0.02);
    ctx.stroke();
    // Drum head: a pale ellipse, half out of frame.
    ctx.fillStyle = rgba(CREAM, a4(0.28));
    ellipsePath(cx + W * 0.075, cy + H * 0.02, W * 0.055, W * 0.012, 0);
    ctx.fill();
    ctx.restore();
  }

  // ---- The single unbroken track: one thin gold line ---------------
  // Weaves across the whole frame, never breaking. Its waveform is
  // a sum of sines whose periods all divide the 90 s cycle, so the
  // line at FIRST_T + 90 is the line at FIRST_T.
  function trackY(xf, t) {
    var u = (t - FIRST_T);
    var w = 2 * Math.PI * u;
    return 0.60
      + 0.045 * Math.sin(2 * Math.PI * xf * 2 + w / CYCLE)
      + 0.028 * Math.sin(2 * Math.PI * xf * 5 - w / 45)
      + 0.016 * Math.sin(2 * Math.PI * xf * 9 + w / 30)
      + 0.010 * Math.sin(2 * Math.PI * xf * 14 - w / 18);
  }
  function trackPhase(t) {
    return ((t - FIRST_T) % CYCLE + CYCLE) % CYCLE / CYCLE;
  }
  function drawTrack(t) {
    var pulse = 0.75 + 0.25 * Math.sin(2 * Math.PI * (t - FIRST_T) / 45);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // Soft glow pass.
    ctx.strokeStyle = rgba(GOLD, a4(0.16 * pulse));
    ctx.lineWidth = Math.max(3, W * 0.006);
    ctx.beginPath();
    var i, xf;
    for (i = 0; i <= 120; i++) {
      xf = i / 120;
      if (i === 0) { ctx.moveTo(X(xf), Y(trackY(xf, t))); }
      else { ctx.lineTo(X(xf), Y(trackY(xf, t))); }
    }
    ctx.stroke();
    // The line itself, thin and unbroken.
    ctx.strokeStyle = rgba(GOLD, a4(0.85 * pulse));
    ctx.lineWidth = Math.max(1.25, W * 0.0018);
    ctx.beginPath();
    for (i = 0; i <= 120; i++) {
      xf = i / 120;
      if (i === 0) { ctx.moveTo(X(xf), Y(trackY(xf, t))); }
      else { ctx.lineTo(X(xf), Y(trackY(xf, t))); }
    }
    ctx.stroke();
    ctx.restore();
  }

  // ---- Credits: many faces arrive, then dissolve -------------------
  function drawCredits(t) {
    var a = creditsAlpha(t);
    if (a < 0.01) { return; }
    var u = cycleU(t);
    var p = smooth((u - 0.70) / 0.15); // 0 at arrival, 1 once in place
    var i, c, cx, cy, r;
    for (i = 0; i < CREDITS.length; i++) {
      c = CREDITS[i];
      cx = X(c.sx + (c.ex - c.sx) * p);
      cy = Y(c.sy + (c.ey - c.sy) * p);
      r = c.r * W;
      ctx.fillStyle = rgba(CREAM, a4(0.5 * a));
      circle(cx, cy, r);
      ctx.fill();
      ctx.fillStyle = rgba(CREAM, a4(0.42 * a));
      ctx.beginPath();
      ctx.moveTo(cx - r * 1.6, cy + r * 3.4);
      ctx.lineTo(cx - r * 1.6, cy + r * 0.9);
      ctx.quadraticCurveTo(cx, cy - r * 0.1, cx + r * 1.6, cy + r * 0.9);
      ctx.lineTo(cx + r * 1.6, cy + r * 3.4);
      ctx.closePath();
      ctx.fill();
    }
  }

  // ---- Caption and hint, in the template's place ----------------------
  function drawText() {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CREAM, a4(0.9));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№859 · One Track, Many Rooms', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(CREAM, a4(0.6));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 19', W * 0.04, H * 0.055 + L.fsDate + 6);
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(CREAM, a4(0.85));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch the rooms drift through the blend.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawBase(t);
    drawStage(t);
    drawGuitar(t);
    drawTurntable(t);
    drawDrums(t);
    drawCrowd(t);
    drawLamp(t);
    drawTrack(t);
    drawCredits(t);
    // Soft vignette: deep shadow gathers at the corners, the blend
    // stays lit at the center.
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42,
      W / 2, H / 2, Math.max(W, H) * 0.78);
    vg.addColorStop(0, rgba(SHADOW_DEEP, 0));
    vg.addColorStop(1, rgba(SHADOW_DEEP, a4(0.45)));
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    drawText();
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece859 exposes layer offsets, the track phase and
  // the credits arrival.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece859 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      layers: LAYERS.length,
      heads: HEADS.length,
      credits: CREDITS.length,
      layerOffset: function (i, t) { return layerOffset(i, t); },
      trackY: function (xf, t) { return trackY(xf, t); },
      trackPhase: function (t) { return trackPhase(t); },
      creditsAlpha: function (t) { return creditsAlpha(t); },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: 90 s blend cycle, closed-form. Guarded so
  // node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
