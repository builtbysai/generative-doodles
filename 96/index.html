<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№96 · Kinetic Word</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#F5EFE0; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(20,18,16,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to ripple the word</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }

// No.96 Kinetic Word: the word MOTION, 6 glyphs, staggered sine pulses then one breath, seamless 7s loop.
// Font route: bold system grotesque stack, no external font load; per-glyph widths measured with
// ctx.measureText and the font size solved so the word fills exactly 80% of the frame width.
const WORD='MOTION';
const GLYPHS=WORD.split('');
const LOOP=7; // seconds
const FONT_STACK='"Helvetica Neue", Helvetica, Arial, "Noto Sans", "DejaVu Sans", sans-serif';
let dragging=false, dragPhase=0, dragStartX=0, dragStartPhase=0, easePhase=0, lastMs=null;

function glyphMetrics(fs){
  ctx.font='800 '+fs+'px '+FONT_STACK;
  const ws=GLYPHS.map(g=>ctx.measureText(g).width);
  const track=fs*0.04;
  const total=ws.reduce((a,b)=>a+b,0)+track*(GLYPHS.length-1);
  return { ws, track, total };
}
function bump(u, c, w){ // smooth raised-cosine bump, 0 outside c +/- w
  const d=Math.abs(u-c); if(d>=w) return 0;
  return 0.5+0.5*Math.cos(Math.PI*d/w);
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  let dt=0; if(lastMs!==null) dt=Math.min(0.05,(nowMs-lastMs)/1000); lastMs=nowMs;
  if(!dragging && easePhase!==0){ easePhase*=Math.pow(0.02, dt); if(Math.abs(easePhase)<0.0005) easePhase=0; }
  const phase = dragging ? dragPhase : easePhase;
  ctx.fillStyle='#F5EFE0'; ctx.fillRect(0,0,w,h);
  const phone=isPhone();
  let ox=0, oy=0, dw=w, dh=h;
  if(!phone){ const S=Math.min(w,h); ox=(w-S)/2; oy=(h-S)/2; dw=S; dh=S; }
  // solve font size for 80% width
  const target=dw*0.8;
  let fs=100; let m=glyphMetrics(fs); fs=fs*target/m.total; m=glyphMetrics(fs);
  const wordW=m.total;
  const startX=ox+(dw-wordW)/2;
  const baseY=oy+dh/2+fs*0.35;
  const tSec=nowMs/1000;
  let u=((tSec/LOOP)+phase)%1; if(u<0) u+=1;
  // whole-word breath late in the cycle
  const breath=bump(u, 0.80, 0.20);
  const wordScale=1+0.05*breath;
  ctx.fillStyle='#141210';
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  let cx=startX;
  for(let i=0;i<GLYPHS.length;i++){
    const gw=m.ws[i];
    const centre=cx+gw/2;
    // staggered pulse, left to right, inside the first two thirds of the cycle
    const p=bump(u, 0.10+i*0.085, 0.085);
    const s=(1+0.25*p)*wordScale;
    const rise=-(fs*0.08)*p - fs*0.02*breath;
    ctx.save();
    ctx.translate(centre, baseY+rise);
    ctx.scale(s,s);
    ctx.font='800 '+fs+'px '+FONT_STACK;
    ctx.fillText(GLYPHS[i], 0, 0);
    ctx.restore();
    cx+=gw+m.track;
  }
  if(GLYPHS.length!==6) console.assert(false,'glyphs',GLYPHS.length);
  return {};
}
function pointerX(e){ return e.clientX; }
canvas.addEventListener('pointerdown',e=>{ dragging=true; dragStartX=pointerX(e); dragStartPhase=(dragging?easePhase:0); dragPhase=easePhase; });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; const [w]=viewportWH(); dragPhase=dragStartPhase+(pointerX(e)-dragStartX)/w*1.5; });
function endP(){ if(dragging){ easePhase=dragPhase; } dragging=false; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(2400);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
