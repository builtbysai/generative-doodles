<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sonic Box</title>
<style>
html,body{margin:0;padding:0;background:#0c0908;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var FRAME_T = 5.0;
var SEED = 1874;
var TAU = Math.PI * 2;

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var rng = mulberry32(SEED);

var canvas = document.getElementById('c');
var ctx = null;
var W = 0, H = 0, S = 0, phone = false, cx = 0, cy = 0, L = 0;
var theta = 0;            /* viewpoint orbit angle, drag driven */
var dragging = false, lastX = 0;
var tNow = FRAME_T;
var reducedMotion = false;
if (typeof window.matchMedia === 'function') {
  try { reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reducedMotion = false; }
}

/* ---------- layout ---------- */
function size(){
  var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
  var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  W = vw; H = vh;
  var minScreen = Math.min(window.screen.width, window.screen.height);
  phone = minScreen < 700 || (H > W * 1.15);
  S = Math.min(W, H);
  cx = W / 2; cy = H / 2;
  L = S * 1.45;
  var dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', function(){ size(); draw(tNow); });
}
window.addEventListener('resize', function(){ size(); draw(tNow); });

/* ---------- body outline: smooth closed spline through profile points ---------- */
function bodyPoints(){
  var top = [
    [-0.50, 0.00], [-0.485, -0.10], [-0.44, -0.22], [-0.36, -0.295],
    [-0.26, -0.285], [-0.16, -0.235], [-0.07, -0.185], [0.02, -0.19],
    [0.10, -0.225], [0.20, -0.265], [0.30, -0.27], [0.40, -0.235],
    [0.47, -0.15], [0.50, -0.05]
  ];
  var bot = [
    [0.47, 0.15], [0.40, 0.235], [0.30, 0.27], [0.20, 0.265],
    [0.10, 0.225], [0.02, 0.19], [-0.07, 0.185], [-0.16, 0.235],
    [-0.26, 0.285], [-0.36, 0.295], [-0.44, 0.22], [-0.485, 0.10]
  ];
  return top.concat(bot);
}
function traceBody(scale){
  var pts = bodyPoints();
  var n = pts.length;
  ctx.beginPath();
  ctx.moveTo(pts[0][0] * L * scale, pts[0][1] * L * scale);
  for (var i = 0; i < n; i++){
    var p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    var c1x = p1[0] * L * scale + (p2[0] - p0[0]) * L * scale / 6;
    var c1y = p1[1] * L * scale + (p2[1] - p0[1]) * L * scale / 6;
    var c2x = p2[0] * L * scale - (p3[0] - p1[0]) * L * scale / 6;
    var c2y = p2[1] * L * scale - (p3[1] - p1[1]) * L * scale / 6;
    ctx.bezierCurveTo(c1x, c1y, c2x, c2y, p2[0] * L * scale, p2[1] * L * scale);
  }
  ctx.closePath();
}

/* ---------- strings ---------- */
var STRINGS = 6;
function stringEnds(i){
  var yTail = (-0.17 + i * 0.068) * L;
  var yNeck = (-0.10 + i * 0.04) * L;
  return { x0: -0.44 * L, y0: yTail, x1: 0.47 * L, y1: yNeck };
}
function stringYAt(i, x){
  var e = stringEnds(i);
  var u = (x - e.x0) / (e.x1 - e.x0);
  if (u < 0) u = 0; if (u > 1) u = 1;
  return e.y0 + (e.y1 - e.y0) * u;
}

/* ---------- drifting objects (seeded, deterministic) ---------- */
var TYPES = {
  screw:      { freq: 233, damp: 0.9960, bright: 1.0,  size: 0.047 },
  clothespin: { freq: 175, damp: 0.9950, bright: 0.8,  size: 0.066 },
  mallet:     { freq: 110, damp: 0.9940, bright: 0.5,  size: 0.086 },
  cloth:      { freq:  98, damp: 0.9920, bright: 0.35, size: 0.090 },
  stone:      { freq: 330, damp: 0.9970, bright: 1.0,  size: 0.050 }
};
var objects = [];
function addObject(type, fx, fy, smallY){
  objects.push({
    type: type,
    fx: fx, fy: fy,
    ax1: (6 + rng() * 12) / 900, ay1: smallY ? (2 + rng() * 3) / 900 : (6 + rng() * 12) / 900,
    ax2: (2 + rng() * 5) / 900,  ay2: smallY ? (1 + rng() * 2) / 900 : (2 + rng() * 5) / 900,
    w1: 0.10 + rng() * 0.14, w2: 0.22 + rng() * 0.20,
    p1: rng() * TAU, p2: rng() * TAU,
    rot0: rng() * TAU, rotW: 0.08 + rng() * 0.10, rotP: rng() * TAU,
    sizeF: TYPES[type].size,
    nearString: -1, prevDist: 1e9
  });
}
addObject('screw', -0.30, 0.06, false);
addObject('screw', 0.05, -0.10, false);
addObject('clothespin', -0.12, 0.12, false);
addObject('clothespin', 0.28, 0.05, false);
addObject('mallet', -0.05, -0.03, false);
addObject('cloth', 0.18, -0.12, false);
/* the stone rests on string 3 (index 2) so frame one holds one string mid-vibration */
addObject('stone', 0.10, -0.0257, true);

function objectPos(o, t){
  return {
    x: o.fx * L + (o.ax1 * Math.sin(o.w1 * t + o.p1) + o.ax2 * Math.sin(o.w2 * t + o.p2)) * S,
    y: o.fy * L + (o.ay1 * Math.sin(o.w1 * 1.3 * t + o.p1 + 1.7) + o.ay2 * Math.sin(o.w2 * 1.1 * t + o.p2 + 0.6)) * S,
    rot: o.rot0 + 0.35 * Math.sin(o.rotW * t + o.rotP)
  };
}
function stringAmp(i, t){
  var amp = 0;
  for (var k = 0; k < objects.length; k++){
    var p = objectPos(objects[k], t);
    var d = Math.abs(p.y - stringYAt(i, p.x));
    var contact = 16 * S / 900;
    if (d < contact) {
      var a = 1 - d / contact;
      if (a > amp) amp = a;
    }
  }
  /* a pluck struck at t = 4.2 keeps string 3 ringing through frame one */
  if (i === 2 && t > 4.2) {
    var ring = Math.exp(-(t - 4.2) * 1.0);
    if (ring > amp) amp = ring;
  }
  return amp;
}

/* ---------- audio: WebAudio only, lazily inside the first drag ---------- */
var AC = null, masterGain = null, panNode = null, filtNode = null, audioReady = false;
function ensureAudio(){
  if (audioReady) return;
  var Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  try {
    AC = new Ctor();
    masterGain = AC.createGain();
    masterGain.gain.value = 0.4;
    filtNode = AC.createBiquadFilter();
    filtNode.type = 'lowpass';
    filtNode.frequency.value = 3400;
    filtNode.Q.value = 0.6;
    if (AC.createStereoPanner) {
      panNode = AC.createStereoPanner();
      panNode.pan.value = theta * 0.7;
      panNode.connect(filtNode);
      filtNode.connect(masterGain);
    } else {
      filtNode.connect(masterGain);
    }
    masterGain.connect(AC.destination);
    audioReady = true;
  } catch (e) { audioReady = false; }
}
function pluck(type, pan){
  if (!audioReady || !AC) return;
  var spec = TYPES[type];
  var sr = AC.sampleRate;
  var dur = 1.8;
  var len = Math.floor(sr * dur);
  var buf = AC.createBuffer(1, len, sr);
  var out = buf.getChannelData(0);
  var N = Math.max(2, Math.round(sr / spec.freq));
  var nrng = mulberry32(SEED + Math.round(spec.freq));
  var ring = new Float32Array(N);
  for (var i = 0; i < N; i++) ring[i] = nrng() * 2 - 1;
  var idx = 0;
  for (var n = 0; n < len; n++){
    var cur = ring[idx];
    var nxt = ring[(idx + 1) % N];
    var v = spec.damp * 0.5 * (cur + nxt);
    ring[idx] = v;
    out[n] = cur * (spec.bright * 0.7 + 0.3);
    idx = (idx + 1) % N;
  }
  var src = AC.createBufferSource();
  src.buffer = buf;
  var g = AC.createGain();
  g.gain.value = 0.5;
  var p = null;
  if (AC.createStereoPanner) {
    p = AC.createStereoPanner();
    p.pan.value = pan;
    src.connect(p); p.connect(filtNode);
  } else {
    src.connect(filtNode);
  }
  src.connect(g);
  g.connect(AC.destination);
  if (p) { try { src.disconnect(g); } catch (e) {} }
  src.start();
}
function audioField(){
  if (!audioReady) return;
  if (panNode) panNode.pan.value = Math.max(-1, Math.min(1, theta * 0.7));
  if (filtNode) filtNode.frequency.value = 3400 - Math.abs(theta) * 1400;
}

/* ---------- object drawing ---------- */
function drawShadow(x, y, r){
  ctx.fillStyle = 'rgba(216,168,96,0.05)';
  ctx.beginPath();
  ctx.ellipse(x, y, r * 1.2, r * 1.2, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(x + r * 0.15, y + r * 0.35, r * 0.9, r * 0.45, 0, 0, TAU);
  ctx.fill();
}
function drawScrew(x, y, rot, s){
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#a8a8a0';
  ctx.beginPath(); ctx.ellipse(0, 0, s * 0.62, s * 0.30, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#c49a4a';
  ctx.fillRect(-s * 0.55, -s * 0.10, s * 1.1, s * 0.20);
  ctx.fillStyle = '#5c5c58';
  ctx.fillRect(-s * 0.34, -s * 0.05, s * 0.68, s * 0.10);
  ctx.strokeStyle = 'rgba(20,16,12,0.6)'; ctx.lineWidth = Math.max(1, s * 0.05);
  ctx.beginPath(); ctx.ellipse(0, 0, s * 0.62, s * 0.30, 0, 0, TAU); ctx.stroke();
  ctx.restore();
}
function drawClothespin(x, y, rot, s){
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#c08a52';
  ctx.beginPath();
  ctx.moveTo(-s * 0.7, -s * 0.22); ctx.lineTo(s * 0.7, -s * 0.22);
  ctx.lineTo(s * 0.55, -s * 0.05); ctx.lineTo(-s * 0.55, -s * 0.05);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-s * 0.7, s * 0.22); ctx.lineTo(s * 0.7, s * 0.22);
  ctx.lineTo(s * 0.55, s * 0.05); ctx.lineTo(-s * 0.55, s * 0.05);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#b08d3e'; ctx.lineWidth = Math.max(1.5, s * 0.09);
  ctx.beginPath(); ctx.arc(0, 0, s * 0.22, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#7a5a30';
  ctx.fillRect(-s * 0.06, -s * 0.30, s * 0.12, s * 0.60);
  ctx.restore();
}
function drawMallet(x, y, rot, s){
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#453a33';
  ctx.beginPath();
  ctx.moveTo(-s * 0.55, -s * 0.42);
  ctx.quadraticCurveTo(0, -s * 0.62, s * 0.55, -s * 0.42);
  ctx.lineTo(s * 0.55, s * 0.30);
  ctx.quadraticCurveTo(0, s * 0.48, -s * 0.55, s * 0.30);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5a4c42';
  ctx.beginPath(); ctx.ellipse(0, -s * 0.05, s * 0.45, s * 0.28, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#6b4a26';
  ctx.fillRect(-s * 0.10, s * 0.30, s * 0.20, s * 0.75);
  ctx.restore();
}
function drawCloth(x, y, rot, s){
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#8a8378';
  ctx.beginPath();
  ctx.moveTo(-s * 0.8, -s * 0.5);
  ctx.quadraticCurveTo(0, -s * 0.62, s * 0.8, -s * 0.5);
  ctx.quadraticCurveTo(s * 0.9, 0, s * 0.8, s * 0.5);
  ctx.quadraticCurveTo(0, s * 0.62, -s * 0.8, s * 0.5);
  ctx.quadraticCurveTo(-s * 0.9, 0, -s * 0.8, -s * 0.5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(30,26,22,0.55)'; ctx.lineWidth = Math.max(1, s * 0.05);
  ctx.beginPath();
  ctx.moveTo(-s * 0.7, -s * 0.18);
  ctx.quadraticCurveTo(0, -s * 0.05, s * 0.7, -s * 0.18);
  ctx.moveTo(-s * 0.7, s * 0.16);
  ctx.quadraticCurveTo(0, s * 0.30, s * 0.7, s * 0.16);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(220,200,170,0.25)';
  ctx.beginPath();
  ctx.moveTo(-s * 0.7, -s * 0.38);
  ctx.quadraticCurveTo(0, -s * 0.28, s * 0.7, -s * 0.38);
  ctx.stroke();
  ctx.restore();
}
function drawStone(x, y, rot, s){
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#6e6a62';
  ctx.beginPath();
  ctx.moveTo(-s * 0.6, -s * 0.1);
  ctx.quadraticCurveTo(-s * 0.3, -s * 0.55, s * 0.25, -s * 0.45);
  ctx.quadraticCurveTo(s * 0.65, -s * 0.2, s * 0.55, s * 0.25);
  ctx.quadraticCurveTo(s * 0.2, s * 0.55, -s * 0.35, s * 0.4);
  ctx.quadraticCurveTo(-s * 0.7, s * 0.2, -s * 0.6, -s * 0.1);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(210,205,195,0.35)';
  ctx.beginPath(); ctx.ellipse(-s * 0.15, -s * 0.2, s * 0.16, s * 0.09, -0.4, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(20,18,16,0.5)';
  ctx.beginPath(); ctx.ellipse(s * 0.2, s * 0.15, s * 0.10, s * 0.06, 0.3, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawObject(o, t){
  var p = objectPos(o, t);
  var sz = o.sizeF * S;
  drawShadow(p.x, p.y, sz);
  if (o.type === 'screw') drawScrew(p.x, p.y, p.rot, sz);
  else if (o.type === 'clothespin') drawClothespin(p.x, p.y, p.rot, sz);
  else if (o.type === 'mallet') drawMallet(p.x, p.y, p.rot, sz);
  else if (o.type === 'cloth') drawCloth(p.x, p.y, p.rot, sz);
  else drawStone(p.x, p.y, p.rot, sz);
}

/* ---------- wood grain ---------- */
var grain = [];
(function(){
  var grng = mulberry32(SEED + 7);
  for (var i = 0; i < 10; i++){
    grain.push({
      y: -0.26 + grng() * 0.52,
      amp: (0.01 + grng() * 0.03),
      ph: grng() * TAU,
      w: 0.10 + grng() * 0.22,
      light: grng() > 0.5
    });
  }
})();
function drawGrain(){
  ctx.save();
  traceBody(0.94);
  ctx.clip();
  for (var i = 0; i < grain.length; i++){
    var g = grain[i];
    ctx.strokeStyle = g.light ? 'rgba(214,150,80,0.12)' : 'rgba(40,20,8,0.20)';
    ctx.lineWidth = Math.max(1, S * 0.0016 * (1 + g.w));
    ctx.beginPath();
    var y0 = g.y * L;
    ctx.moveTo(-0.48 * L, y0);
    for (var x = -0.48; x <= 0.48; x += 0.06){
      var y = y0 + Math.sin(x * 5 + g.ph) * g.amp * L;
      ctx.lineTo(x * L, y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------- f-holes ---------- */
function drawFHole(x, y, rot, s){
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#050303';
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.9);
  ctx.bezierCurveTo(s * 0.34, -s * 0.7, s * 0.30, -s * 0.1, s * 0.10, s * 0.25);
  ctx.bezierCurveTo(-s * 0.05, s * 0.5, -s * 0.22, s * 0.75, -s * 0.30, s * 0.9);
  ctx.bezierCurveTo(-s * 0.10, s * 0.75, s * 0.02, s * 0.55, s * 0.02, s * 0.3);
  ctx.bezierCurveTo(s * 0.02, -s * 0.1, -s * 0.12, -s * 0.5, -s * 0.12, -s * 0.9);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(216,168,96,0.5)';
  ctx.lineWidth = Math.max(1, s * 0.03);
  ctx.stroke();
  ctx.fillStyle = '#050303';
  ctx.beginPath(); ctx.arc(-s * 0.02, -s * 0.98, s * 0.14, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(216,168,96,0.45)';
  ctx.stroke();
  ctx.restore();
}

/* ---------- strings ---------- */
function drawStrings(t){
  for (var i = 0; i < STRINGS; i++){
    var e = stringEnds(i);
    var amp = stringAmp(i, t);
    var segs = 26;
    ctx.beginPath();
    for (var k = 0; k <= segs; k++){
      var u = k / segs;
      var x = e.x0 + (e.x1 - e.x0) * u;
      var y = e.y0 + (e.y1 - e.y0) * u;
      if (amp > 0.02) {
        y += amp * S * 0.020 * Math.sin(Math.PI * u) * Math.sin(TAU * 3 * t + i * 1.3);
      }
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = amp > 0.25 ? '#f0e8d8' : '#c9c9c4';
    ctx.lineWidth = Math.max(1, S * 0.0016);
    ctx.stroke();
  }
}

/* ---------- main draw ---------- */
function draw(t){
  if (!ctx) return;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  var u = S / 900;

  /* ground */
  ctx.fillStyle = '#0c0908';
  ctx.fillRect(0, 0, W, H);
  var g0 = ctx.createRadialGradient(cx, cy, 0, cx, cy, S * 0.75);
  g0.addColorStop(0, 'rgba(58,38,20,0.55)');
  g0.addColorStop(1, 'rgba(12,9,8,0)');
  ctx.fillStyle = g0;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(phone ? -0.62 : -0.38);

  /* back layer: inner walls and grain, parallax against the orbit */
  ctx.save();
  ctx.translate(-theta * 26 * u * 3, theta * 6 * u * 3);
  var gIn = ctx.createLinearGradient(0, -0.3 * L, 0, 0.3 * L);
  gIn.addColorStop(0, '#2a1a0e');
  gIn.addColorStop(0.5, '#1d1108');
  gIn.addColorStop(1, '#160c05');
  traceBody(0.94);
  ctx.fillStyle = gIn;
  ctx.fill();
  drawGrain();
  ctx.restore();

  /* mid layer: strings and drifting preparations */
  ctx.save();
  ctx.translate(theta * 8 * u * 3, 0);
  drawStrings(t);
  for (var k = 0; k < objects.length; k++) drawObject(objects[k], t);
  ctx.restore();

  /* front layer: rim, purfling, glass sheen, f-holes */
  ctx.save();
  ctx.translate(theta * 18 * u * 3, -theta * 4 * u * 3);
  traceBody(1.0);
  ctx.strokeStyle = '#6b4218';
  ctx.lineWidth = Math.max(3, S * 0.014);
  ctx.stroke();
  traceBody(0.985);
  ctx.strokeStyle = '#c98f4a';
  ctx.lineWidth = Math.max(1, S * 0.003);
  ctx.stroke();
  traceBody(0.94);
  ctx.strokeStyle = 'rgba(216,168,96,0.35)';
  ctx.lineWidth = Math.max(1, S * 0.0016);
  ctx.stroke();
  /* glass top sheen */
  ctx.save();
  traceBody(0.94);
  ctx.clip();
  var sheen = ctx.createLinearGradient(-0.5 * L, -0.3 * L, 0.5 * L, 0.3 * L);
  sheen.addColorStop(0, 'rgba(255,235,200,0.00)');
  sheen.addColorStop(0.35, 'rgba(255,235,200,0.07)');
  sheen.addColorStop(0.5, 'rgba(255,235,200,0.02)');
  sheen.addColorStop(1, 'rgba(255,235,200,0.00)');
  ctx.fillStyle = sheen;
  ctx.fillRect(-0.55 * L, -0.35 * L, 1.1 * L, 0.7 * L);
  ctx.restore();
  /* f-holes as windows into the drift */
  drawFHole(0.10 * L, -0.20 * L, 0.35, S * 0.085);
  drawFHole(0.10 * L, 0.20 * L, -0.35, S * 0.085);
  ctx.restore();

  ctx.restore();

  /* ---------- plates, in screen space ---------- */
  var pad = Math.max(14, S * 0.035);
  var titleSize = Math.max(17, S * 0.048);
  var dateSize = Math.max(12, S * 0.028);
  var hintSize = Math.max(12, S * 0.026);

  ctx.fillStyle = 'rgba(8,5,4,0.55)';
  roundRect(pad - 8, pad - 8, titleSize * 5.6, titleSize + dateSize + 26, 8);
  ctx.fill();
  ctx.fillStyle = '#d8a860';
  ctx.font = '600 ' + titleSize + 'px Georgia, serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('The Sonic Box', pad, pad + titleSize);
  ctx.fillStyle = '#a08a6a';
  ctx.font = dateSize + 'px Georgia, serif';
  ctx.fillText('2007 · 02 · 28', pad, pad + titleSize + dateSize + 10);

  var hint = 'Drag to orbit the listening point.';
  ctx.font = hintSize + 'px Georgia, serif';
  var hw = ctx.measureText(hint).width;
  ctx.fillStyle = 'rgba(8,5,4,0.55)';
  roundRect(cx - hw / 2 - 12, H - pad - hintSize - 12, hw + 24, hintSize + 22, 8);
  ctx.fill();
  ctx.fillStyle = '#8a7a66';
  ctx.textAlign = 'center';
  ctx.fillText(hint, cx, H - pad);

  /* orbit dial: where the ear stands */
  var dr = Math.max(14, S * 0.028);
  var dx = W - pad - dr, dy = H - pad - dr;
  ctx.strokeStyle = 'rgba(160,138,106,0.7)';
  ctx.lineWidth = Math.max(1, S * 0.0016);
  ctx.beginPath(); ctx.arc(dx, dy, dr, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#d8a860';
  ctx.beginPath();
  ctx.arc(dx + Math.sin(theta) * dr * 0.7, dy - Math.cos(theta) * dr * 0.7, Math.max(3, dr * 0.22), 0, TAU);
  ctx.fill();
}
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

/* ---------- drag: orbit the listening point ---------- */
function onDown(e){
  dragging = true;
  lastX = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0].clientX);
  ensureAudio();
  if (e.preventDefault) e.preventDefault();
}
function onMove(e){
  if (!dragging) return;
  var x = (e.clientX !== undefined) ? e.clientX : (e.touches && e.touches[0].clientX);
  if (x === undefined) return;
  theta += (x - lastX) * 0.004;
  if (theta > 0.6) theta = 0.6;
  if (theta < -0.6) theta = -0.6;
  lastX = x;
  audioField();
  draw(tNow);
  if (e.preventDefault) e.preventDefault();
}
function onUp(){
  dragging = false;
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
canvas.addEventListener('touchstart', onDown);
canvas.addEventListener('touchmove', onMove);
canvas.addEventListener('touchend', onUp);

/* ---------- string contact sounds, checked per frame ---------- */
function checkContacts(t){
  if (!audioReady) return;
  for (var k = 0; k < objects.length; k++){
    var o = objects[k];
    var p = objectPos(o, t);
    var best = -1, bestD = 1e9;
    for (var i = 0; i < STRINGS; i++){
      var d = Math.abs(p.y - stringYAt(i, p.x));
      if (d < bestD) { bestD = d; best = i; }
    }
    var contact = 16 * S / 900;
    if (bestD < contact && o.prevDist >= contact) {
      pluck(o.type, Math.max(-0.8, Math.min(0.8, p.x / (L * 0.5))));
    }
    o.prevDist = bestD;
    o.nearString = best;
  }
}

/* ---------- animation ---------- */
var t0 = null;
function frame(now){
  var t;
  if (reducedMotion) {
    t = FRAME_T;
  } else {
    if (t0 === null) t0 = now;
    t = FRAME_T + (now - t0) / 1000;
  }
  tNow = t;
  checkContacts(t);
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') {
    requestAnimationFrame(frame);
  }
}

size();
draw(FRAME_T);
if (typeof requestAnimationFrame !== 'undefined') {
  requestAnimationFrame(frame);
}
})();
</script>
