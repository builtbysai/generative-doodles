<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catching Hole</title>
<style>
  html, body { margin: 0; padding: 0; background: #1C1C1E; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  // Seeded PRNG (mulberry32). No Math.random anywhere in this piece.
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Layout for one reseed generation: rotation jitter, gesture variants, tones.
  function makeLayout(seedIndex) {
    var rnd = mulberry32(1309000 + seedIndex * 7919);
    var prints = [];
    var i, g;
    for (i = 0; i < 7; i++) {
      g = {
        fingers: 4 + Math.floor(rnd() * 2),          // 4 or 5 fingers
        curl: 0.15 + rnd() * 0.55,                    // finger curl
        spread: 0.55 + rnd() * 0.45,                  // finger spread
        tilt: (rnd() - 0.5) * 0.5,                    // palm tilt
        open: rnd() > 0.4,                            // open hand vs relaxed
        tone: rnd()                                  // gray wash tone
      };
      prints.push({
        rotJit: (rnd() - 0.5) * 0.16,                 // radians
        yJit: (rnd() - 0.5) * 0.03,                   // fraction of panel
        gesture: g
      });
    }
    return { prints: prints, seedIndex: seedIndex };
  }

  var reseedIndex = 0;
  var layout = makeLayout(0);
  var lastTapT = -1e9;
  var tapCount = 0;

  function onTap(clientX, clientY, tNow) {
    // Double-tap reseeds the fan arrangement and the hand gestures.
    if (tNow - lastTapT < 0.4) {
      reseedIndex += 1;
      layout = makeLayout(reseedIndex);
      lastTapT = -1e9;
    } else {
      lastTapT = tNow;
    }
    tapCount += 1;
  }

  function size() {
    var vw = window.innerWidth, vh = window.innerHeight;
    if (window.visualViewport) {
      vw = window.visualViewport.width;
      vh = window.visualViewport.height;
    }
    W = vw; H = vh;
    var dpr = 1;
    if (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) {
      dpr = window.devicePixelRatio;
    }
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (document.body && document.body.style) {
      document.body.style.background = '#1C1C1E';
    }
  }

  function isPhone() {
    var sw = 0, sh = 0;
    if (window.screen) { sw = window.screen.width; sh = window.screen.height; }
    if (sw > 0 && sh > 0) { return Math.min(sw, sh) < 700; }
    return H > W * 1.15;
  }

  // One procedural hand gesture: palm ellipse plus finger arcs. Line art only,
  // never a photorealistic hand.
  function drawHand(cx, cy, s, g) {
    var i, a, x0, y0, x1, y1, x2, y2, len;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(g.tilt);
    ctx.strokeStyle = '#101010';
    ctx.lineCap = 'round';
    // Palm: ellipse drawn as its own path.
    ctx.lineWidth = Math.max(1.5, s * 0.03);
    ctx.beginPath();
    ctx.ellipse(0, 0, s * 0.32, s * 0.38, 0, 0, Math.PI * 2);
    ctx.stroke();
    // Wrist stub.
    ctx.beginPath();
    ctx.moveTo(-s * 0.14, s * 0.38);
    ctx.lineTo(-s * 0.14, s * 0.62);
    ctx.moveTo(s * 0.14, s * 0.38);
    ctx.lineTo(s * 0.14, s * 0.62);
    ctx.stroke();
    // Fingers: arcs fanning from the top of the palm.
    for (i = 0; i < g.fingers; i++) {
      a = -0.9 + (i / Math.max(1, g.fingers - 1)) * 1.8 * g.spread + (1 - g.spread) * 0.45;
      len = s * (0.42 + (g.open ? 0.22 : 0.05)) * (1 - Math.abs(i - (g.fingers - 1) / 2) * 0.12);
      x0 = Math.sin(a) * s * 0.22;
      y0 = -s * 0.34 + Math.cos(a) * s * 0.05;
      x1 = Math.sin(a) * s * 0.30 + Math.sin(a + g.curl * 0.6) * len * 0.5;
      y1 = y0 - Math.cos(a) * len * 0.5;
      x2 = Math.sin(a + g.curl) * len * 0.55 + Math.sin(a) * s * 0.22;
      y2 = y0 - Math.cos(a + g.curl * 0.5) * len;
      ctx.lineWidth = Math.max(1.5, s * 0.030);
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.quadraticCurveTo(x1, y1, x2, y2);
      ctx.stroke();
    }
    // Palm creases, so the shape reads as a hand rather than a head.
    ctx.lineWidth = Math.max(1, s * 0.018);
    ctx.beginPath();
    ctx.moveTo(-s * 0.18, s * 0.08);
    ctx.quadraticCurveTo(0, s * 0.16, s * 0.18, s * 0.08);
    ctx.moveTo(-s * 0.12, s * 0.22);
    ctx.quadraticCurveTo(0, s * 0.28, s * 0.12, s * 0.22);
    ctx.stroke();
    // Thumb: short arc on the side.
    ctx.lineWidth = Math.max(1.2, s * 0.022);
    ctx.beginPath();
    ctx.moveTo(-s * 0.30, s * 0.05);
    ctx.quadraticCurveTo(-s * 0.52, -s * 0.10, -s * 0.44, -s * 0.30);
    ctx.stroke();
    ctx.restore();
  }

  function draw(t) {
    var phone = isPhone();
    var panel = phone ? Math.min(W, H) : Math.min(W, H) * 0.92;
    var px = (W - panel) / 2;
    var py = (H - panel) / 2;
    var i, pr, base, spread, rot, pw, ph, cx, cy;

    // Ground: dark matte.
    ctx.fillStyle = '#1C1C1E';
    ctx.fillRect(0, 0, W, H);

    // White frame: outer border, thin dark matte inner line.
    ctx.fillStyle = '#F5F3EC';
    ctx.fillRect(px, py, panel, panel);
    ctx.strokeStyle = '#1C1C1E';
    ctx.lineWidth = Math.max(1, panel * 0.008);
    ctx.strokeRect(px + panel * 0.02, py + panel * 0.02, panel * 0.96, panel * 0.96);

    // Inner field: paper, inset by the 12% frame margin total.
    var m = panel * 0.12;
    var ix = px + m, iy = py + m, is = panel - 2 * m;
    ctx.fillStyle = '#F5F3EC';
    ctx.fillRect(ix, iy, is, is);

    // Fan pivot at bottom-center of the inner field.
    var pivX = ix + is / 2;
    var pivY = iy + is * 0.98;
    // Slow breathing: spread oscillates gently on a 14 s sine.
    spread = 1 + 0.09 * Math.sin(t * (Math.PI * 2 / 14));
    pw = is * 0.30;
    ph = is * 0.62;

    for (i = 0; i < 7; i++) {
      pr = layout.prints[i];
      base = (-45 + i * 15) * (Math.PI / 180) * spread;
      rot = base + pr.rotJit;
      ctx.save();
      ctx.translate(pivX, pivY + pr.yJit * is);
      ctx.rotate(rot);
      // Print card, drawn upward from the pivot.
      cx = 0; cy = -ph / 2 - is * 0.05;
      ctx.fillStyle = '#F5F3EC';
      ctx.fillRect(cx - pw / 2, cy - ph / 2, pw, ph);
      // Gray wash tone, flat alpha.
      ctx.fillStyle = 'rgba(119,119,111,' + (0.05 + pr.gesture.tone * 0.08).toFixed(3) + ')';
      ctx.fillRect(cx - pw / 2, cy - ph / 2, pw, ph);
      ctx.strokeStyle = '#101010';
      ctx.lineWidth = Math.max(1, panel * 0.002);
      ctx.strokeRect(cx - pw / 2, cy - ph / 2, pw, ph);
      // Hand gesture, toward the top of the print and toward its
      // counterclockwise edge, so it stays visible above the next
      // print in the fan instead of being covered by it.
      drawHand(cx - pw * 0.18, cy - ph * 0.20, pw * 0.55, pr.gesture);
      ctx.restore();
    }

    // Glass: specular sweep, one 3 s sweep per 18 s cycle, flat alpha bands.
    var cycle = 18, sweepDur = 3;
    var ct = t % cycle;
    if (ct < sweepDur) {
      var prog = ct / sweepDur;
      var sx = ix - is * 0.4 + prog * (is * 1.8);
      ctx.save();
      ctx.beginPath();
      ctx.rect(ix, iy, is, is);
      ctx.clip();
      ctx.fillStyle = 'rgba(207,224,232,0.10)';
      ctx.beginPath();
      ctx.moveTo(sx, iy);
      ctx.lineTo(sx + is * 0.10, iy);
      ctx.lineTo(sx + is * 0.10 - is * 0.25, iy + is);
      ctx.lineTo(sx - is * 0.25, iy + is);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(207,224,232,0.07)';
      ctx.beginPath();
      ctx.moveTo(sx + is * 0.14, iy);
      ctx.lineTo(sx + is * 0.18, iy);
      ctx.lineTo(sx + is * 0.18 - is * 0.25, iy + is);
      ctx.lineTo(sx + is * 0.14 - is * 0.25, iy + is);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  var booted = false;
  var startT = 0;

  function loop(ts) {
    var t = (ts - startT) / 1000;
    if (t < 0) { t = 0; }
    draw(t);
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(loop);
    }
  }

  function boot() {
    size();
    if (!booted) {
      booted = true;
      draw(0); // Frame one: exactly t = 0, deterministic.
    }
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(function (ts) {
        startT = ts;
        loop(ts);
      });
    }
  }

  function onResize() {
    size();
    // Redraw at the current piece time is not available without a clock;
    // redraw frame one only before the loop starts, otherwise keep the
    // last drawn frame until the next rAF tick redraws it.
    if (!booted) { draw(0); }
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize);
  }
  window.addEventListener('resize', onResize);
  canvas.addEventListener('pointerdown', function (ev) {
    var tNow = 0;
    if (typeof performance !== 'undefined' && performance.now) {
      tNow = performance.now() / 1000;
    }
    onTap(ev.clientX, ev.clientY, tNow);
  });

  boot();
})();
</script>
</body>
</html>
