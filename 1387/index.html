<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genre Chassis</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0d08; overflow: hidden; height: 100%; }
  canvas { display: block; background: #0b0d08; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  // Genre Chassis — adam-khalil AK4. A drone-feed HUD that lies about its
  // subjects: a masked figure watering plants, a marching band, a picnic.
  // No readable text anywhere: tags and HUD marks are drawn pseudo-script
  // shapes only. No Math.random anywhere — all randomness is seeded.
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var NIGHT = '#0b0d08', THERM = '#9dff57', CYAN = '#57e6ff',
      HEAT = '#ff7a18', DIM = '#2e4a22', MID = '#5a8f3a';

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Deterministic hash in [0,1) from integer inputs (stable across runs).
  function hash2(a, b) {
    var h = (a * 374761393 + b * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  var W = 0, H = 0, isPhone = false;
  function size() {
    var vw = (typeof window.visualViewport !== 'undefined' && window.visualViewport)
      ? window.visualViewport : null;
    var w = vw ? vw.width : window.innerWidth;
    var h = vw ? vw.height : window.innerHeight;
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    var minDim = Math.min(window.screen.width, window.screen.height);
    isPhone = minDim < 700 || (h > w * 1.15 && minDim < 900);
  }

  // ---- pseudo-script glyphs (drawn shapes, never text) ----
  function glyph(kind, x, y, s, color) {
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = Math.max(1, s * 0.12);
    ctx.beginPath();
    if (kind === 0) { // chevron
      ctx.moveTo(x, y + s * 0.7); ctx.lineTo(x + s * 0.5, y); ctx.lineTo(x + s, y + s * 0.7);
    } else if (kind === 1) { // triangle
      ctx.moveTo(x, y + s); ctx.lineTo(x + s * 0.5, y); ctx.lineTo(x + s, y + s); ctx.closePath();
    } else if (kind === 2) { // cross
      ctx.moveTo(x, y + s * 0.5); ctx.lineTo(x + s, y + s * 0.5);
      ctx.moveTo(x + s * 0.5, y); ctx.lineTo(x + s * 0.5, y + s);
    } else if (kind === 3) { // dot pair
      ctx.moveTo(x + s * 0.25, y + s * 0.5); ctx.arc(x + s * 0.25, y + s * 0.5, s * 0.12, 0, 6.2832);
      ctx.moveTo(x + s * 0.75, y + s * 0.5); ctx.arc(x + s * 0.75, y + s * 0.5, s * 0.12, 0, 6.2832);
    } else if (kind === 4) { // arc
      ctx.arc(x + s * 0.5, y + s * 0.6, s * 0.45, 3.6, 5.8);
    } else if (kind === 5) { // tick
      ctx.moveTo(x, y + s); ctx.lineTo(x + s * 0.8, y + s * 0.2);
    } else if (kind === 6) { // diamond
      ctx.moveTo(x + s * 0.5, y); ctx.lineTo(x + s, y + s * 0.5);
      ctx.lineTo(x + s * 0.5, y + s); ctx.lineTo(x, y + s * 0.5); ctx.closePath();
    } else { // hook
      ctx.moveTo(x, y); ctx.lineTo(x + s * 0.7, y + s * 0.3);
      ctx.lineTo(x + s * 0.7, y + s); ctx.lineTo(x + s * 0.2, y + s);
    }
    ctx.stroke();
  }
  function tagRow(x, y, s, color, seedBase) {
    for (var i = 0; i < 5; i++) {
      var k = Math.floor(hash2(seedBase, i) * 8);
      glyph(k, x + i * s * 1.4, y, s, color);
    }
  }

  // ---- subjects, drawn in world coordinates ----
  function figure(x, y, s, mask, color) {
    // simple standing figure: legs, body, head, optional mask
    ctx.fillStyle = color;
    ctx.fillRect(x - s * 0.14, y, s * 0.12, s * 0.55);
    ctx.fillRect(x + s * 0.04, y, s * 0.12, s * 0.55);
    ctx.fillRect(x - s * 0.22, y - s * 0.75, s * 0.46, s * 0.78);
    ctx.beginPath();
    ctx.arc(x, y - s * 0.95, s * 0.22, 0, 6.2832);
    ctx.fill();
    if (mask) {
      ctx.fillStyle = '#e8e4da';
      ctx.beginPath();
      ctx.arc(x, y - s * 0.95, s * 0.2, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = NIGHT;
      ctx.fillRect(x - s * 0.1, y - s * 1.0, s * 0.07, s * 0.05);
      ctx.fillRect(x + s * 0.04, y - s * 1.0, s * 0.07, s * 0.05);
    }
  }

  function subjectWatering(cx, gy, s, t) {
    // plants row
    for (var i = 0; i < 5; i++) {
      var px = cx - s * 1.6 + i * s * 0.55;
      ctx.fillStyle = THERM;
      ctx.fillRect(px, gy - s * 0.8, s * 0.06, s * 0.8);
      ctx.fillRect(px - s * 0.12, gy - s * 0.7, s * 0.3, s * 0.08);
      ctx.fillRect(px - s * 0.12, gy - s * 0.45, s * 0.3, s * 0.08);
    }
    figure(cx + s * 0.9, gy - s * 0.55, s, true, MID);
    // watering can + droplets (closed-form arc)
    ctx.fillStyle = HEAT;
    ctx.fillRect(cx + s * 0.35, gy - s * 1.15, s * 0.4, s * 0.25);
    ctx.fillRect(cx + s * 0.7, gy - s * 1.1, s * 0.25, s * 0.06);
    ctx.fillStyle = CYAN;
    for (var d = 0; d < 7; d++) {
      var ph = ((t * 0.9 + d * 0.14) % 1);
      var dx = cx + s * 0.95 - ph * s * 0.9;
      var dy = gy - s * 1.05 + ph * ph * s * 0.9;
      ctx.beginPath();
      ctx.arc(dx, dy, s * 0.045, 0, 6.2832);
      ctx.fill();
    }
  }

  function subjectBand(cx, gy, s, t) {
    for (var i = 0; i < 5; i++) {
      var bx = cx - s * 1.8 + i * s * 0.9;
      var bob = Math.sin(t * 3.2 + i * 1.1) * s * 0.07;
      var legSwing = Math.sin(t * 3.2 + i * 1.1) > 0;
      ctx.fillStyle = THERM;
      ctx.fillRect(bx - s * 0.14, gy - s * 0.55 + bob, s * 0.12, legSwing ? s * 0.5 : s * 0.6);
      ctx.fillRect(bx + s * 0.04, gy - s * 0.55 + bob, s * 0.12, legSwing ? s * 0.6 : s * 0.5);
      ctx.fillRect(bx - s * 0.22, gy - s * 1.3 + bob, s * 0.46, s * 0.78);
      ctx.beginPath();
      ctx.arc(bx, gy - s * 1.5 + bob, s * 0.22, 0, 6.2832);
      ctx.fill();
      // instrument: drum or horn
      ctx.fillStyle = (i % 2 === 0) ? HEAT : CYAN;
      if (i % 2 === 0) {
        ctx.beginPath();
        ctx.arc(bx + s * 0.3, gy - s * 1.1 + bob, s * 0.18, 0, 6.2832);
        ctx.fill();
      } else {
        ctx.fillRect(bx + s * 0.25, gy - s * 1.25 + bob, s * 0.35, s * 0.07);
      }
    }
  }

  function subjectPicnic(cx, gy, s, t) {
    // blanket: checker of flat rects
    for (var r = 0; r < 3; r++) {
      for (var c = 0; c < 5; c++) {
        ctx.fillStyle = ((r + c) % 2 === 0) ? HEAT : THERM;
        ctx.fillRect(cx - s * 1.5 + c * s * 0.6, gy - s * 0.35 + r * s * 0.22, s * 0.6, s * 0.22);
      }
    }
    // basket + food dots
    ctx.fillStyle = MID;
    ctx.fillRect(cx - s * 0.4, gy - s * 0.75, s * 0.8, s * 0.4);
    ctx.fillStyle = CYAN;
    var foods = [[-1.1, -0.6], [0.7, -0.55], [1.2, -0.7]];
    for (var i = 0; i < foods.length; i++) {
      ctx.beginPath();
      ctx.arc(cx + foods[i][0] * s, gy + foods[i][1] * s, s * 0.09, 0, 6.2832);
      ctx.fill();
    }
    // two seated figures, one waving slowly (closed-form)
    figure(cx - s * 1.9, gy - s * 0.35, s * 0.8, false, THERM);
    figure(cx + s * 1.7, gy - s * 0.35, s * 0.8, false, CYAN);
    var wave = Math.sin(t * 1.4) * s * 0.12;
    ctx.strokeStyle = CYAN; ctx.lineWidth = Math.max(1, s * 0.05);
    ctx.beginPath();
    ctx.moveTo(cx + s * 1.7 + s * 0.18, gy - s * 0.95);
    ctx.lineTo(cx + s * 1.7 + s * 0.45, gy - s * 1.15 + wave);
    ctx.stroke();
  }

  var SUBJECTS = [
    { draw: subjectWatering, seed: 1387000 },
    { draw: subjectBand, seed: 1387000 + 7919 },
    { draw: subjectPicnic, seed: 1387000 + 15838 }
  ];

  // ---- camera: 36 s cycle, 12 s per subject, 2 s eased moves ----
  function baseCam(t) {
    var seg = Math.floor(t / 12) % 3;
    var local = t % 12;
    var from = seg, to = (seg + 1) % 3;
    if (local < 10) return from * W;
    var u = (local - 10) / 2;
    u = u * u * (3 - 2 * u);
    var d = to - from;
    if (d > 1) d -= 3;
    if (d < -1) d += 3;
    var v = from + d * u;
    if (v < 0) v += 3;
    if (v >= 3) v -= 3;
    return v * W;
  }

  // ---- drag scrub: recorded samples, exponential decay ----
  var dragTotal = 0, dragging = false, lastX = 0;
  var releaseOffset = 0, releaseT = 0, hasRelease = false;
  var lastT = 0;
  function dragOffset(t) {
    if (dragging) return dragTotal;
    if (!hasRelease) return 0;
    return releaseOffset * Math.exp(-(t - releaseT) / 3);
  }
  function onDown(e) {
    dragging = true; lastX = e.clientX;
    dragTotal = dragOffset(lastT);
  }
  function onMove(e) {
    if (!dragging) return;
    dragTotal += -(e.clientX - lastX);
    lastX = e.clientX;
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    releaseOffset = dragTotal; releaseT = lastT; hasRelease = true;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function jitter(t, i) {
    // HUD jitter from quantized time (0.1 s steps), never per-frame random
    var q = Math.floor(t * 10);
    return (hash2(q, i) - 0.5) * 3;
  }

  function draw(t) {
    lastT = t;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var cam = baseCam(t) + dragOffset(t);
    if (cam < 0) cam = 0;
    if (cam > 2 * W) cam = 2 * W;
    var gy = H * 0.62;
    var s = Math.min(W, H) * 0.16;

    // night field
    ctx.fillStyle = NIGHT;
    ctx.fillRect(0, 0, W, H);
    // thermal ground band
    ctx.fillStyle = '#121a0e';
    ctx.fillRect(0, gy - s * 0.4, W, H - gy + s * 0.4);
    // faint thermal patches (seeded, static)
    for (var p = 0; p < 24; p++) {
      var px = hash2(99, p) * W, py = gy + hash2(100, p) * (H - gy) * 0.8;
      ctx.fillStyle = 'rgba(157,255,87,0.05)';
      ctx.fillRect(px, py, W * 0.06, H * 0.05);
    }

    // world
    ctx.save();
    ctx.translate(-cam, 0);
    for (var i = 0; i < 3; i++) {
      var cx = (i + 0.5) * W;
      SUBJECTS[i].draw(cx, gy, s, t);
      // classification tag above each subject (pseudo-script only)
      var tx = cx - s * 0.9, ty = gy - s * 2.1;
      ctx.fillStyle = 'rgba(11,13,8,0.75)';
      ctx.fillRect(tx - s * 0.1, ty - s * 0.15, s * 2.0, s * 0.55);
      ctx.strokeStyle = CYAN; ctx.lineWidth = 1;
      ctx.strokeRect(tx - s * 0.1, ty - s * 0.15, s * 2.0, s * 0.55);
      tagRow(tx, ty, s * 0.22, CYAN, SUBJECTS[i].seed);
    }
    ctx.restore();

    // grain: seeded dots keyed by quantized 0.5 s index
    var q = Math.floor(t * 2);
    for (var g = 0; g < 260; g++) {
      var gx = hash2(g, q) * W, gy2 = hash2(g + 500, q) * H;
      ctx.fillStyle = 'rgba(157,255,87,0.10)';
      ctx.fillRect(gx, gy2, 1.5, 1.5);
    }

    // HUD chrome (screen space, jittered)
    var jx = jitter(t, 1), jy = jitter(t, 2);
    ctx.strokeStyle = CYAN; ctx.lineWidth = 2;
    var m = 18, L = 34;
    // corner brackets
    ctx.beginPath();
    ctx.moveTo(m + jx, m + L + jy); ctx.lineTo(m + jx, m + jy); ctx.lineTo(m + L + jx, m + jy);
    ctx.moveTo(W - m + jx, m + L + jy); ctx.lineTo(W - m + jx, m + jy); ctx.lineTo(W - m - L + jx, m + jy);
    ctx.moveTo(m + jx, H - m - L + jy); ctx.lineTo(m + jx, H - m + jy); ctx.lineTo(m + L + jx, H - m + jy);
    ctx.moveTo(W - m + jx, H - m - L + jy); ctx.lineTo(W - m + jx, H - m + jy); ctx.lineTo(W - m - L + jx, H - m + jy);
    ctx.stroke();
    // center crosshair (abstract ring + ticks, no military symbology)
    var ccx = W / 2 + jx, ccy = H / 2 + jy;
    ctx.beginPath();
    ctx.arc(ccx, ccy, 26, 0, 6.2832);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ccx - 40, ccy); ctx.lineTo(ccx - 30, ccy);
    ctx.moveTo(ccx + 30, ccy); ctx.lineTo(ccx + 40, ccy);
    ctx.moveTo(ccx, ccy - 40); ctx.lineTo(ccx, ccy - 30);
    ctx.moveTo(ccx, ccy + 30); ctx.lineTo(ccx, ccy + 40);
    ctx.stroke();
    // top + bottom HUD strips with pseudo-script
    ctx.fillStyle = 'rgba(11,13,8,0.6)';
    ctx.fillRect(0, 0, W, 12);
    ctx.fillRect(0, H - 12, W, 12);
    tagRow(W * 0.06, 26, 10, THERM, 4242);
    tagRow(W * 0.7, H - 30, 10, HEAT, 5151);
    // tracked-subject brackets around the camera's current subject
    var cur = Math.round(baseCam(t) / W) % 3;
    var scx = (cur + 0.5) * W - cam;
    var bx = scx - s * 1.9, by = gy - s * 2.3, bw = s * 3.8, bh = s * 2.6;
    ctx.strokeStyle = HEAT; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx, by + 26); ctx.lineTo(bx, by); ctx.lineTo(bx + 26, by);
    ctx.moveTo(bx + bw - 26, by); ctx.lineTo(bx + bw, by); ctx.lineTo(bx + bw, by + 26);
    ctx.moveTo(bx, by + bh - 26); ctx.lineTo(bx, by + bh); ctx.lineTo(bx + 26, by + bh);
    ctx.moveTo(bx + bw - 26, by + bh); ctx.lineTo(bx + bw, by + bh); ctx.lineTo(bx + bw, by + bh - 26);
    ctx.stroke();
  }

  size();
  if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
      window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { size(); draw(lastT); });
  }
  window.addEventListener('resize', function () { size(); draw(lastT); });

  draw(0); // frame one at a constant phase
  var start = null;
  function loop(ts) {
    if (start === null) start = ts;
    draw((ts - start) / 1000);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
