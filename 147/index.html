<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sinan's Rings</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B0B0D; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, PHONE = false;
function resize() {
  var vv = window.visualViewport;
  var w = vv ? vv.width : window.innerWidth;
  var h = vv ? vv.height : window.innerHeight;
  W = Math.round(w); H = Math.round(h);
  canvas.width = W; canvas.height = H;
  var sw = (window.screen && window.screen.width) || W;
  var sh = (window.screen && window.screen.height) || H;
  PHONE = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function phase(t, a, b) { return clamp01((t - a) / (b - a)); }
function P(r, deg) { var a = deg * Math.PI / 180; return [Math.cos(a) * r, Math.sin(a) * r]; }
function arcPts(r, a0, a1, n) {
  var out = [], i;
  for (i = 0; i <= n; i++) out.push(P(r, a0 + (a1 - a0) * i / n));
  return out;
}
function curvePts(p0, p1, p2, n) {
  var out = [], i, t, u;
  for (i = 0; i <= n; i++) {
    t = i / n; u = 1 - t;
    out.push([u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0],
              u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]]);
  }
  return out;
}

// The cut design lives on ONE 30 degree wedge (the fundamental domain),
// in unit space where the ring's outer radius is 1. It is replicated by
// the dihedral group D12: twelve rotations, alternate wedges mirrored.
var WEDGE_PATHS = [
  arcPts(0.965, -15, 15, 10),                                  // outer ring
  arcPts(0.715, -15, 15, 10),                                  // second ring
  arcPts(0.345, -15, 15, 8),                                   // inner ring
  curvePts(P(0.375, -15), P(0.585, 0), P(0.375, 15), 12),      // petal, bulging out
  curvePts(P(0.685, -15), P(0.545, 0), P(0.685, 15), 12),      // petal, bulging in
  [P(0.755, 0), P(0.925, 0)],                                  // radial spoke
  arcPts(0.520, -9, 9, 6),                                     // chevron arc
  [P(0.175, -15), P(0.175, 15)],                               // inner chord
  curvePts(P(0.185, -15), P(0.285, 0), P(0.185, 15), 8)       // centre petal
];
var PATH_LENS = [], TOTAL_LEN = 0;
WEDGE_PATHS.forEach(function (pts) {
  var L = 0, i;
  for (i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  PATH_LENS.push(L); TOTAL_LEN += L;
});

function drawPartial(pts, R, frac) {
  // draw the first frac (by arc length) of a polyline, in unit space scaled by R
  if (frac <= 0) return;
  var target = frac * TOTAL_LEN, acc = 0, pi, i, seg, f;
  ctx.beginPath();
  for (pi = 0; pi < pts.length; pi++) {
    var path = pts[pi];
    if (acc >= target) break;
    ctx.moveTo(path[0][0] * R, path[0][1] * R);
    for (i = 1; i < path.length; i++) {
      seg = Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]);
      if (acc + seg <= target) {
        ctx.lineTo(path[i][0] * R, path[i][1] * R); acc += seg;
      } else {
        f = (target - acc) / seg;
        ctx.lineTo((path[i - 1][0] + (path[i][0] - path[i - 1][0]) * f) * R,
                   (path[i - 1][1] + (path[i][1] - path[i - 1][1]) * f) * R);
        acc = target; break;
      }
    }
  }
  ctx.stroke();
}

function drawWedgeCuts(R, frac) {
  ctx.strokeStyle = '#1E3A5F';
  ctx.lineWidth = Math.max(1.4, R * 0.0075);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  drawPartial(WEDGE_PATHS, R, frac);
}
function drawWedgeFold(R, strong) {
  ctx.strokeStyle = 'rgba(192,57,43,' + (strong ? 0.85 : 0.6).toFixed(3) + ')';
  ctx.lineWidth = Math.max(1, R * 0.004);
  ctx.setLineDash([R * 0.02, R * 0.014]);
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(R * 0.93, 0);
  ctx.stroke();
  ctx.setLineDash([]);
}

var LOOP = 30, OFFSET = 21; // frame one opens on the finished ring, held
function draw(now) {
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.fillStyle = '#0B0B0D'; ctx.fillRect(0, 0, W, H);
  var t = ((now / 1000 + OFFSET) % LOOP + LOOP) % LOOP;
  var cx = W / 2, cy = H / 2;
  var R = 0.40 * Math.min(W, H);          // ring fills 80% of the frame
  var HR = R * 1.13;                       // paper hexagon a little larger
  var k;

  // paper sheet: a flat hexagon on the near-black ground
  ctx.fillStyle = '#F5F1E6';
  ctx.beginPath();
  for (k = 0; k < 6; k++) {
    var a = -Math.PI / 2 + k * Math.PI / 3;
    var x = cx + Math.cos(a) * HR, y = cy + Math.sin(a) * HR;
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill();
  // the hexagon's own fold diagonals, faint, there from the start
  ctx.strokeStyle = 'rgba(192,57,43,0.30)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 4]);
  ctx.beginPath();
  for (k = 0; k < 3; k++) {
    var a1 = -Math.PI / 2 + k * Math.PI / 3, a2 = a1 + Math.PI;
    ctx.moveTo(cx + Math.cos(a1) * HR, cy + Math.sin(a1) * HR);
    ctx.lineTo(cx + Math.cos(a2) * HR, cy + Math.sin(a2) * HR);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  var cutP = phase(t, 4, 10);              // cuts draw inside wedge 0
  var bloom = phase(t, 10, 20);            // D12 replication sweeps around
  var hold = t >= 20;

  ctx.save();
  ctx.translate(cx, cy);
  if (bloom <= 0) {
    // folded state: only the fundamental wedge is marked out
    ctx.save();
    ctx.rotate(-Math.PI / 12);
    drawWedgeFold(R, true);
    ctx.rotate(Math.PI / 6);
    drawWedgeFold(R, true);
    ctx.restore();
    if (cutP > 0) {
      ctx.save();
      ctx.rotate(-Math.PI / 12);
      drawWedgeCuts(R, cutP);
      ctx.restore();
    }
  } else {
    for (k = 0; k < 12; k++) {
      var wp = clamp01(bloom * 12 - k);
      if (wp <= 0) continue;
      ctx.save();
      ctx.rotate(k * Math.PI / 6 - Math.PI / 12);
      if (k % 2 === 1) ctx.scale(1, -1);    // the mirror half of D12
      drawWedgeFold(R, false);
      drawWedgeCuts(R, wp);
      ctx.restore();
    }
    // closing fold line of the last wedge
    ctx.save();
    ctx.rotate(-Math.PI / 12);
    drawWedgeFold(R, false);
    ctx.restore();
  }
  if (hold) {
    // construction circles stay on the finished drawing
    ctx.strokeStyle = 'rgba(192,57,43,0.45)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 5]);
    [0.345, 0.715, 0.965].forEach(function (r) {
      ctx.beginPath(); ctx.arc(0, 0, r * R, 0, Math.PI * 2); ctx.stroke();
    });
    ctx.setLineDash([]);
    // the fundamental wedge, outlined at the centre: the making stays visible
    ctx.strokeStyle = 'rgba(192,57,43,0.85)';
    ctx.lineWidth = Math.max(1, R * 0.004);
    var w1 = P(R * 0.93, -15), w2 = P(R * 0.93, 15);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(w1[0], w1[1]);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.93, -Math.PI / 12, Math.PI / 12);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(w2[0], w2[1]);
    ctx.lineTo(0, 0);
    ctx.stroke();
  }
  ctx.fillStyle = '#1E3A5F';
  ctx.beginPath(); ctx.arc(0, 0, Math.max(1.6, R * 0.008), 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  if (t >= 26) {                            // soft fade, then the loop restarts
    ctx.fillStyle = 'rgba(11,11,13,' + ((t - 26) / 4 * 0.96).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

resize();
draw(0);
function frame(ts) {
  draw(ts || 0);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
