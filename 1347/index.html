<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absence Stack</title>
<style>html,body{margin:0;padding:0;background:#232019;overflow:hidden;height:100%}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

var TONES = ['#7A6B5C','#5C6B7A','#6B5C4A','#8A7A68'];
var GROUND = '#232019';
var BACKING = '#D8D2C4';
var REDACT = '#0A0A0A';

/* One mask, the single source of truth: a doorway (two posts + lintel).
   Bars are fractions of the print rect. Each print shifts them by its own
   index x 6px, so at alignment the doorway still reads, slightly stepped. */
var MASK = [
  {x:0.16, y:0.14, w:0.11, h:0.72},
  {x:0.73, y: 0.14, w:0.11, h:0.72},
  {x:0.16, y:0.14, w:0.68, h:0.13}
];

function buildPrint(idx){
  var rng = mulberry32(1347000 + idx * 7919);
  var bands = [];
  var nb = 3 + Math.floor(rng() * 3);
  for (var i = 0; i < nb; i++){
    bands.push({
      y0: rng() * 0.85,
      h: 0.08 + rng() * 0.22,
      tone: TONES[Math.floor(rng() * TONES.length)],
      a: 0.18 + rng() * 0.30
    });
  }
  var grain = [];
  for (var g = 0; g < 260; g++){
    grain.push({x: rng(), y: rng(), s: rng() < 0.5 ? 1 : 2, a: 0.05 + rng() * 0.12, dark: rng() < 0.5});
  }
  var j = [];
  for (var c = 0; c < 4; c++){ j.push((rng() - 0.5) * 6); }
  return {
    idx: idx,
    base: TONES[Math.floor(rng() * TONES.length)],
    bands: bands,
    grain: grain,
    jit: j,
    rot: (rng() - 0.5) * 0.052
  };
}

var PRINTS = [];
for (var p = 0; p < 5; p++){ PRINTS.push(buildPrint(p)); }

var W = 0, H = 0, pw = 0, ph = 0;
function size(){
  var vw = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport.width : window.innerWidth;
  var vh = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport.height : window.innerHeight;
  W = vw; H = vh;
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ph = Math.min(0.66 * H, 0.86 * W * 5 / 4);
  pw = ph * 4 / 5;
}
size();
if (typeof window !== 'undefined'){
  if (window.visualViewport && window.visualViewport.addEventListener){ window.visualViewport.addEventListener('resize', function(){ size(); draw(currentT); }); }
  if (window.addEventListener){ window.addEventListener('resize', function(){ size(); draw(currentT); }); }
}

/* Slot offsets: 8px alternating direction, plus a small vertical step. */
function slotOffset(slot){
  return { x: (slot % 2 === 0 ? -8 : 8), y: (slot - 2) * 3 };
}

/* Stack order at step s: stack[i] = print index (i-s) mod 5.
   Step s means s shuffles have completed. */
function stackAt(step){
  var st = [];
  for (var i = 0; i < 5; i++){ st.push(((i - step) % 5 + 5) % 5); }
  return st;
}

function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
function easeInOut(t){ return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

/* Drag state: recorded events only, closed-form. */
var drag = null; /* {print, dx, dy} while dragging */
var snap = null; /* {print, fromX, fromY, startT, dur} after release */
var currentT = 0;

function printPosAt(printIdx, t){
  var cycle = t % 30;
  var step = Math.floor(cycle / 6);
  var phase = cycle % 6;
  var stack = stackAt(step);
  var slot = stack.indexOf(printIdx);
  var off = slotOffset(slot);
  var cx = W / 2 + off.x, cy = H / 2 + off.y;
  var scale = 1, onTop = false;
  if (phase >= 4){
    var st = easeInOut((phase - 4) / 2);
    var newStack = stackAt(step + 1);
    var newSlot = newStack.indexOf(printIdx);
    var newOff = slotOffset(newSlot);
    var nx = W / 2 + newOff.x, ny = H / 2 + newOff.y;
    if (slot === 4){
      /* Top print travels down-left to the back, bulging out on an arc. */
      var bulge = Math.sin(Math.PI * st);
      cx = cx + (nx - cx) * st - 46 * bulge;
      cy = cy + (ny - cy) * st + 34 * bulge;
      onTop = true;
    } else {
      cx = cx + (nx - cx) * st;
      cy = cy + (ny - cy) * st;
    }
  }
  return { x: cx, y: cy, scale: scale, slot: slot, onTop: onTop };
}

function drawPrint(pr, cx, cy, scale, lifted){
  var w = pw * scale, h = ph * scale;
  var j = pr.jit;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(pr.rot);
  if (lifted){
    /* Shadow as a flat-alpha offset rect, never shadowBlur. */
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(-w / 2 + 7, -h / 2 + 10, w, h);
  }
  /* Backing edge, peeking out behind the print. */
  ctx.fillStyle = BACKING;
  ctx.fillRect(-w / 2 - 3, -h / 2 - 3, w + 6, h + 6);
  /* Print body with irregular edges (jittered corners). */
  ctx.beginPath();
  ctx.moveTo(-w / 2 + j[0], -h / 2 + j[1]);
  ctx.lineTo(w / 2 + j[2], -h / 2 + j[1]);
  ctx.lineTo(w / 2 + j[2], h / 2 + j[3]);
  ctx.lineTo(-w / 2 + j[0], h / 2 + j[3]);
  ctx.closePath();
  ctx.fillStyle = pr.base;
  ctx.fill();
  ctx.save();
  ctx.clip();
  /* Layered flat-alpha landscape strata, never gradients. */
  for (var b = 0; b < pr.bands.length; b++){
    var bd = pr.bands[b];
    ctx.fillStyle = bd.tone;
    ctx.globalAlpha = bd.a;
    ctx.fillRect(-w / 2, -h / 2 + bd.y0 * h, w, bd.h * h);
  }
  ctx.globalAlpha = 1;
  /* Grain as tiny flat rects. */
  for (var g = 0; g < pr.grain.length; g++){
    var gr = pr.grain[g];
    ctx.fillStyle = gr.dark ? 'rgba(0,0,0,' + gr.a.toFixed(3) + ')' : 'rgba(255,255,255,' + gr.a.toFixed(3) + ')';
    ctx.fillRect(-w / 2 + gr.x * w, -h / 2 + gr.y * h, gr.s, gr.s);
  }
  /* Redaction bars: the shared mask, shifted by this print's index x 6px. */
  var shift = pr.idx * 6;
  ctx.fillStyle = REDACT;
  for (var m = 0; m < MASK.length; m++){
    var bar = MASK[m];
    ctx.fillRect(-w / 2 + bar.x * w + shift, -h / 2 + bar.y * h, bar.w * w, bar.h * h);
  }
  ctx.restore();
  ctx.restore();
}

function draw(t){
  currentT = t;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  var cycle = t % 30;
  var step = Math.floor(cycle / 6);
  var phase = cycle % 6;
  var stack = stackAt(step);
  var sliding = (phase >= 4) ? stack[4] : -1;
  /* Draw back to front; the sliding print rides on top during its travel. */
  for (var i = 0; i < 5; i++){
    var pi = stack[i];
    if (pi === sliding){ continue; }
    if (drag && drag.print === pi){ continue; }
    if (snap && snap.print === pi){ continue; }
    var pos = printPosAt(pi, t);
    drawPrint(PRINTS[pi], pos.x, pos.y, 1, false);
  }
  if (sliding >= 0 && !(drag && drag.print === sliding) && !(snap && snap.print === sliding)){
    var sp = printPosAt(sliding, t);
    drawPrint(PRINTS[sliding], sp.x, sp.y, 1, false);
  }
  /* Dragged print on top, lifted. */
  if (drag){
    var dpr = PRINTS[drag.print];
    drawPrint(dpr, drag.x, drag.y, 1.04, true);
  }
  /* Snapping print on top, easing back to its slot. */
  if (snap){
    var k = (t - snap.startT) / snap.dur;
    var tp = printPosAt(snap.print, t);
    if (k >= 1){
      drawPrint(PRINTS[snap.print], tp.x, tp.y, 1, false);
      snap = null;
    } else {
      var e = easeOutCubic(k);
      var sx = snap.fromX + (tp.x - snap.fromX) * e;
      var sy = snap.fromY + (tp.y - snap.fromY) * e;
      drawPrint(PRINTS[snap.print], sx, sy, 1 + 0.04 * (1 - e), true);
    }
  }
}

/* Pointer handling: topmost print first. Drag never changes stack order. */
function pointerPos(ev){
  var r = { x: 0, y: 0 };
  if (ev.clientX !== undefined){ r.x = ev.clientX; r.y = ev.clientY; }
  else if (ev.touches && ev.touches[0]){ r.x = ev.touches[0].clientX; r.y = ev.touches[0].clientY; }
  return r;
}
function hitPrint(x, y, t){
  var cycle = t % 30;
  var step = Math.floor(cycle / 6);
  var stack = stackAt(step);
  for (var i = 4; i >= 0; i--){
    var pi = stack[i];
    var pos = printPosAt(pi, t);
    if (Math.abs(x - pos.x) <= pw / 2 + 10 && Math.abs(y - pos.y) <= ph / 2 + 10){ return pi; }
  }
  return -1;
}
function onDown(ev){
  var pt = pointerPos(ev);
  var pi = hitPrint(pt.x, pt.y, currentT);
  if (pi < 0){ return; }
  var pos = printPosAt(pi, currentT);
  drag = { print: pi, dx: pt.x - pos.x, dy: pt.y - pos.y, x: pos.x, y: pos.y };
  snap = null;
  if (ev.preventDefault){ ev.preventDefault(); }
}
function onMove(ev){
  if (!drag){ return; }
  var pt = pointerPos(ev);
  drag.x = pt.x - drag.dx;
  drag.y = pt.y - drag.dy;
  if (ev.preventDefault){ ev.preventDefault(); }
}
function onUp(ev){
  if (!drag){ return; }
  var pi = drag.print;
  snap = { print: pi, fromX: drag.x, fromY: drag.y, startT: currentT, dur: 0.5 };
  drag = null;
}
if (canvas.addEventListener){
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('touchstart', onDown);
  canvas.addEventListener('touchmove', onMove);
  canvas.addEventListener('touchend', onUp);
}

/* Frame one: boot flag, exactly t = 0, stack aligned in hold phase. */
var booted = false;
function frame(t){
  if (!booted){ booted = true; draw(0); return; }
  draw(t);
}
frame(0);
var startEpoch = 0;
function loop(ts){
  var t = (ts - startEpoch) / 1000;
  frame(t);
  if (typeof requestAnimationFrame === 'function'){ requestAnimationFrame(loop); }
}
if (typeof requestAnimationFrame === 'function'){
  requestAnimationFrame(function(ts){ startEpoch = ts; requestAnimationFrame(loop); });
}
})();
</script>
</body>
</html>
