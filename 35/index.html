<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№35 · Fifteen Chords</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#101010; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
'use strict';
// No35 Fifteen Chords (after ruuddotorg, via Bug's ig-artist-study prompts).
// Six points around a circle can be perfectly matched in exactly 15
// ways. This piece enumerates all 15 matchings by recursion at load
// (pair the first free point with each later free point) and asserts
// the count. One circle fills the frame: six cream dots on a circle,
// three straight neon chords pairing them, crossings drawn plain. The
// chords fade, their endpoints slide along the circle, and the chords
// redraw as the next matching, cycling through all 15. Drag
// horizontally to scrub the sequence. Ground #101010, dots #f4f1ea,
// chords flat neon #d8ff3e, no glow: flat color only.

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '35', 10) || 35;

const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#101010';
const CREAM = '#f4f1ea';
const NEON = '#d8ff3e';

function matchings() {
  const out = [];
  function rec(free, pairs) {
    if (!free.length) { out.push(pairs.slice()); return; }
    const i = free[0];
    for (let k = 1; k < free.length; k++) {
      const j = free[k];
      pairs.push([i, j]);
      rec(free.filter(x => x !== i && x !== j), pairs);
      pairs.pop();
    }
  }
  rec([0, 1, 2, 3, 4, 5], []);
  return out;
}
const MATCHINGS = matchings();                       // exactly 15
const ALLPAIRS = [];
for (let a = 0; a < 6; a++) for (let b = a + 1; b < 6; b++) ALLPAIRS.push([a, b]);
function presence(m) {
  const v = new Array(15).fill(0);
  for (const [a, b] of m) v[ALLPAIRS.findIndex(([x, y]) => x === a && y === b)] = 1;
  return v;
}
const PRES = MATCHINGS.map(presence);
const SLOT = 0.9;                    // seconds per panel
const LOOP = SLOT * 15 + 1.0;         // wave + reset beat

let scrub = 0;
let dragInfo = null;
let holdPos = null, holdUntil = 0;

function layout(w, h) {
  const scrMin = (window.screen && window.screen.width > 0)
    ? Math.min(window.screen.width, window.screen.height) : 0;
  const mobileLayout = (scrMin > 0 && scrMin < 700) || h > w * 1.15;
  const RX = mobileLayout ? w : Math.min(w, h);
  const RY = mobileLayout ? h : Math.min(w, h);
  return { RX, RY, ox: (w - RX) / 2, oy: (h - RY) / 2, mobileLayout };
}
const ease = u => u * u * (3 - 2 * u);

function drawFrame(nowMs) {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  const { RX, RY, ox, oy } = layout(w, h);
  let tPos;
  if (dragInfo) tPos = dragInfo.pos;
  else if (holdPos != null && performance.now() / 1000 < holdUntil) tPos = holdPos;
  else tPos = ((nowMs / 1000 + scrub) % LOOP + LOOP) % LOOP;

  // single circle, centered: morph matching k into k+1
  const k = Math.floor(tPos / SLOT) % 15;
  const cx = ox + RX / 2, cy = oy + RY / 2;
  const R = Math.min(RX, RY) * 0.32;
  const dotR = R * 0.095;
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 3;
    pts.push([cx + R * Math.cos(a), cy + R * Math.sin(a), a]);
  }
  let mix = 0;
  const into = tPos - k * SLOT;
  if (into >= 0) mix = into < SLOT * 0.75 ? ease(into / (SLOT * 0.75)) : 1;
  const from = PRES[k], to = PRES[(k + 1) % 15];
  ctx.lineWidth = Math.max(0.85, R * 0.047);
  ALLPAIRS.forEach(([a, b], pi) => {
    const pv = from[pi] + (to[pi] - from[pi]) * mix;
    if (pv <= 0.03) return;
    // endpoints slide along the circle as presence changes
    const slide = (1 - pv) * 0.35;
    const aa = pts[a][2] + slide, ab = pts[b][2] - slide;
    ctx.strokeStyle = 'rgba(216,255,62,' + (0.18 + 0.82 * pv).toFixed(3) + ')';
    ctx.beginPath();
    ctx.moveTo(cx + R * Math.cos(aa), cy + R * Math.sin(aa));
    ctx.lineTo(cx + R * Math.cos(ab), cy + R * Math.sin(ab));
    ctx.stroke();
  });
  pts.forEach(([x, y]) => {
    ctx.beginPath();
    ctx.arc(x, y, dotR, 0, Math.PI * 2);
    ctx.fillStyle = CREAM;
    ctx.fill();
  });
  return { RX, ox };
}

function loop(nowMs) {
  drawFrame(nowMs);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
drawFrame(4600);
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

function pointerX(ev) {
  const r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0 };
  return ev.clientX - r.left;
}
function currentPos() {
  if (dragInfo) return dragInfo.pos;
  return ((performance.now() / 1000 + scrub) % LOOP + LOOP) % LOOP;
}
canvas.addEventListener('pointerdown', ev => {
  dragInfo = { x: pointerX(ev), startPos: currentPos(), pos: currentPos() };
  holdPos = null;
});
canvas.addEventListener('pointermove', ev => {
  if (!dragInfo) return;
  const [w, h] = viewportWH();
  const L = layout(w, h);
  const dx = pointerX(ev) - dragInfo.x;
  dragInfo.pos = (((dragInfo.startPos + (dx / L.RX) * LOOP) % LOOP) + LOOP) % LOOP;
});
function endDrag() {
  if (!dragInfo) return;
  holdPos = dragInfo.pos;
  holdUntil = performance.now() / 1000 + 4;
  scrub = dragInfo.pos - performance.now() / 1000;
  dragInfo = null;
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => drawFrame(performance.now()));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => drawFrame(performance.now()));
</script>
</body>
</html>
