<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>All My Life (After the Stitcher)</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d0d0f; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- №1219 "All My Life (After the Stitcher)" — Clint Enns study block CE4 ----
  // After All My Life (After Baillie) (2016): panorama software "spit out an
  // extremely large, glitched out panoramic image" — too large to script.
  // Enns kept the failure. Here a landscape is stitched strip by strip, the
  // stitcher overflows, the panorama tears, and the tears are never repaired.

  var T0 = 71;                 // fixed phase of the synchronous first frame (seconds)
  var PASS = 60;               // one stitching pass per minute
  var STRIPS = 24;             // vertical frame strips per pass

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0;

  function isPhone(w, h) {
    var sw = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = Math.min(window.screen.width || 9999, window.screen.height || 9999);
    }
    return sw < 700 || h > w * 1.15;
  }

  function resize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else {
      w = window.innerWidth; h = window.innerHeight;
    }
    W = w; H = h;
    var dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(pieceNow()); });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(pieceNow()); });
  }

  // ---- deterministic seeds ----
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash(n) {  // deterministic hash of an integer -> [0,1)
    var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---- palette ----
  var SKY = '#A8C8E8', GRASS = '#6A8F3C', GRASS_D = '#5F8436', HILL = '#7A8A4A',
      ROAD = '#7A7A7A', FENCE = '#5A4632', FENCE_L = '#6B543C',
      TRUNK = '#4A3826', SUN = '#EFD28F',
      MAGENTA = '#FF2BD9', CYAN = '#00E5FF', SMEAR = '#E8620C',
      BG = '#0D0D0F', EMPTY = '#14161A';
  var LEAF = ['#446B28', '#4E7A2E', '#5D8A36', '#6A8F3C'];

  // ---- the virtual landscape, as data ----
  // All geometry in fractions: x in [0,1] of panorama width, y in [0,1] of strip height.
  var rng = mulberry32(20160);
  var trees = [];
  (function buildTrees() {
    var xs = [0.07, 0.16, 0.30, 0.42, 0.52, 0.63, 0.74, 0.85, 0.94];
    for (var i = 0; i < xs.length; i++) {
      var near = (i === 1 || i === 6);            // two foreground trees
      var hgt = near ? 0.52 + rng() * 0.08 : 0.30 + rng() * 0.16;
      var base = near ? 0.88 : 0.545 + rng() * 0.02;
      var blobs = [];
      var nb = 3 + Math.floor(rng() * 3);
      for (var j = 0; j < nb; j++) {
        blobs.push({
          dx: (rng() - 0.5) * 0.055,
          dy: -hgt + (rng() - 0.5) * 0.07,
          r: (0.045 + rng() * 0.05) * (near ? 1.25 : 1),
          c: LEAF[Math.floor(rng() * LEAF.length)]
        });
      }
      trees.push({ x: xs[i] + (rng() - 0.5) * 0.02, base: base, h: hgt, near: near, blobs: blobs });
    }
  })();
  var bushes = [];
  for (var bi = 0; bi < 12; bi++) {
    bushes.push({ x: rng(), y: 0.53 + rng() * 0.03, r: 0.016 + rng() * 0.02, c: LEAF[Math.floor(rng() * LEAF.length)] });
  }
  var hills = [];
  for (var hi = 0; hi <= 20; hi++) {
    hills.push({ x: hi / 20, y: 0.44 + 0.045 * Math.sin(hi * 1.7 + 0.6) + (hash(hi * 3 + 1) - 0.5) * 0.02 });
  }
  var clouds = [
    { x: 0.36, y: 0.14, s: 1.0 }, { x: 0.58, y: 0.09, s: 0.7 }, { x: 0.83, y: 0.17, s: 0.85 }
  ];
  var dupTree = trees[2];            // the tree near pano fraction 0.30

  // ---- stitch head ----
  // The stitcher races, then crawls as it aligns the last frames of a pass.
  function headFrac(tp) { return Math.pow(clamp(tp / PASS, 0, 1), 0.35); }
  function stripRevealTp(k) {        // pass-local time at which strip k is (re)stitched
    return PASS * Math.pow((k + 1) / STRIPS, 1 / 0.35);
  }

  // ---- damage records ----
  // {time, type: 'dup'|'ghost'|'smear', x (pano fraction), w, tree}
  function scheduledDamage(pass) {
    var evs = [];
    if (pass === 0) {
      evs.push({ time: 14, type: 'dup', x: dupTree.x - 0.065, w: 0.13, tree: dupTree });
      evs.push({ time: 31, type: 'ghost', x: 0.52, w: 0.13 });
      evs.push({ time: 47, type: 'smear', x: 0.64, w: 0.16, y0: 0.30, y1: 0.72 });
    } else if (pass === 1) {
      evs.push({ time: 78, type: 'ghost', x: 0.18, w: 0.13 });
      evs.push({ time: 97, type: 'smear', x: 0.40, w: 0.16, y0: 0.30, y1: 0.72 });
    } else {
      var types = ['dup', 'ghost', 'smear'];
      for (var j = 0; j < 2; j++) {
        var h1 = hash(pass * 31 + j * 7 + 5), h2 = hash(pass * 57 + j * 13 + 2);
        var ty = types[Math.floor(h1 * 3) % 3];
        var xf = 0.08 + 0.8 * h2;
        var ev = { time: pass * PASS + 12 + h1 * 38, type: ty, x: xf, w: ty === 'smear' ? 0.16 : 0.13, y0: 0.30, y1: 0.72 };
        if (ty === 'dup') {
          var best = trees[0], bd = 9;
          for (var ti = 0; ti < trees.length; ti++) {
            var d = Math.abs(trees[ti].x - xf);
            if (d < bd) { bd = d; best = trees[ti]; }
          }
          ev.tree = best; ev.x = best.x - 0.065; ev.w = 0.13;
        }
        evs.push(ev);
      }
    }
    return evs;
  }
  var schedCache = {};
  function damageAt(t) {
    var out = [];
    var maxPass = Math.floor(t / PASS);
    for (var p = 0; p <= maxPass; p++) {
      if (!schedCache[p]) schedCache[p] = scheduledDamage(p);
      for (var i = 0; i < schedCache[p].length; i++) {
        if (schedCache[p][i].time <= t) out.push(schedCache[p][i]);
      }
    }
    for (var v = 0; v < visitorDamage.length; v++) {
      if (visitorDamage[v].time <= t) out.push(visitorDamage[v]);
    }
    out.sort(function (a, b) { return a.time - b.time; });
    return out;
  }

  // ---- visitor-fed overflow ----
  var startWall = nowMs();
  var visitorDamage = [];
  var pending = null;               // {fireAt, type}
  var visitorCount = 0;
  var dragging = false, samples = [], lastTriggerWall = -10;

  function nowMs() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now();
    return Date.now();
  }
  function pieceNow() { return T0 + (nowMs() - startWall) / 1000; }

  function pointerPos(e) {
    var x = (e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0));
    var y = (e.clientY != null ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0));
    return [x, y];
  }
  function onDown(e) { dragging = true; samples = []; }
  function onMove(e) {
    if (!dragging) return;
    var p = pointerPos(e);
    var wt = (nowMs() - startWall) / 1000;
    samples.push({ x: p[0], t: wt });
    if (samples.length > 8) samples.shift();
    if (samples.length >= 2) {
      var a = samples[0], b = samples[samples.length - 1];
      var dt = b.t - a.t;
      if (dt > 0.03) {
        var v = (b.x - a.x) / dt;   // px per second; hard right-to-left is strongly negative
        if (v < -850 && wt - lastTriggerWall > 2.5 && !pending) {
          var types = ['dup', 'ghost', 'smear'];
          pending = { fireAt: T0 + wt + 0.9, type: types[visitorCount % 3] };
          visitorCount++;
          lastTriggerWall = wt;
        }
      }
    }
  }
  function onUp() { dragging = false; samples = []; }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: true });
    canvas.addEventListener('touchmove', onMove, { passive: true });
    canvas.addEventListener('touchend', onUp);
  }

  // ---- drawing ----
  var stripH = 0, stripY = 0;
  function X(f) { return f * W; }
  function Y(f) { return stripY + f * stripH; }

  var paintSolid = null;   // when set, every element fills with this color
  function fill(c) { ctx.fillStyle = paintSolid || c; }

  function circle(cx, cy, r, c) {
    fill(c);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBackgrounds() {
    ctx.fillStyle = paintSolid || SKY;
    ctx.fillRect(0, stripY, W, stripH * 0.52);
    ctx.fillStyle = paintSolid || GRASS;
    ctx.fillRect(0, Y(0.52), W, stripH * 0.48);
    ctx.fillStyle = paintSolid || GRASS_D;
    ctx.fillRect(0, Y(0.9), W, stripH * 0.10);
    // hills
    fill(HILL);
    ctx.beginPath();
    ctx.moveTo(0, Y(0.52));
    for (var i = 0; i < hills.length; i++) ctx.lineTo(X(hills[i].x), Y(hills[i].y));
    ctx.lineTo(W, Y(0.52));
    ctx.closePath();
    ctx.fill();
    // road
    ctx.fillStyle = paintSolid || ROAD;
    ctx.fillRect(0, Y(0.64), W, stripH * 0.11);
  }

  // Discrete elements only (used for the base scene and for damage copies).
  // Caller clips to the region of interest. Damage copies pass sky=false:
  // the stitcher duplicates ground matter, not the sun.
  function drawElements(x0f, x1f, dxPx, sky) {
    var i, j;
    // sun + clouds (sky elements, base pass only)
    if (sky) {
      circle(X(0.22) + dxPx, Y(0.17), stripH * 0.055, SUN);
      for (i = 0; i < clouds.length; i++) {
        var cl = clouds[i];
        if (cl.x + 0.09 < x0f || cl.x - 0.09 > x1f) continue;
        circle(X(cl.x) + dxPx, Y(cl.y), stripH * 0.035 * cl.s, '#FFFFFF');
        circle(X(cl.x) + dxPx - stripH * 0.04 * cl.s, Y(cl.y) + stripH * 0.012, stripH * 0.026 * cl.s, '#FFFFFF');
        circle(X(cl.x) + dxPx + stripH * 0.045 * cl.s, Y(cl.y) + stripH * 0.01, stripH * 0.028 * cl.s, '#E8F0F8');
      }
    }
    // road dashes
    fill('#D8D8D8');
    for (var d = 0; d < 26; d++) {
      var dxf = d / 26 + 0.008;
      if (dxf < x0f || dxf > x1f) continue;
      ctx.fillRect(X(dxf) + dxPx, Y(0.692), W * 0.02, stripH * 0.006);
    }
    // bushes
    for (i = 0; i < bushes.length; i++) {
      var bu = bushes[i];
      if (bu.x < x0f - 0.03 || bu.x > x1f + 0.03) continue;
      circle(X(bu.x) + dxPx, Y(bu.y), bu.r * stripH, bu.c);
    }
    // fence: rails then posts
    fill(FENCE_L);
    ctx.fillRect(X(x0f) + dxPx, Y(0.795), (x1f - x0f) * W, stripH * 0.013);
    ctx.fillRect(X(x0f) + dxPx, Y(0.845), (x1f - x0f) * W, stripH * 0.013);
    fill(FENCE);
    var postStep = 0.045;
    for (var pf = Math.floor(x0f / postStep) * postStep; pf <= x1f; pf += postStep) {
      ctx.fillRect(X(pf) + dxPx - W * 0.003, Y(0.775), W * 0.006, stripH * 0.115);
    }
    // trees
    for (i = 0; i < trees.length; i++) {
      var tr = trees[i];
      if (tr.x + 0.07 < x0f || tr.x - 0.07 > x1f) continue;
      fill(TRUNK);
      ctx.fillRect(X(tr.x) + dxPx - W * 0.005, Y(tr.base - tr.h * 0.92), W * 0.01, stripH * tr.h * 0.92);
      for (j = 0; j < tr.blobs.length; j++) {
        var bl = tr.blobs[j];
        circle(X(tr.x + bl.dx) + dxPx, Y(tr.base + bl.dy), bl.r * stripH, bl.c);
      }
    }
  }

  function regionClip(x0f, x1f, y0f, y1f) {
    ctx.beginPath();
    ctx.rect(X(x0f), Y(y0f), (x1f - x0f) * W, (y1f - y0f) * stripH);
    ctx.clip();
  }

  function drawDamage(rec, t) {
    var age = t - rec.time;
    if (rec.type === 'dup') {
      var offs = [0.048, 0.10];
      for (var k = 0; k < offs.length; k++) {
        var dxF = offs[k];
        ctx.save();
        regionClip(rec.x + dxF - 0.005, rec.x + rec.w + dxF + 0.005, 0, 1);
        paintSolid = MAGENTA;
        drawElements(rec.x, rec.x + rec.w, dxF * W - 3, false);
        drawElements(rec.x, rec.x + rec.w, dxF * W + 3, false);
        paintSolid = null;
        drawElements(rec.x, rec.x + rec.w, dxF * W, false);
        ctx.restore();
      }
    } else if (rec.type === 'ghost') {
      ctx.save();
      regionClip(rec.x, rec.x + rec.w, 0, 1);
      ctx.globalAlpha = 0.35;
      drawElements(rec.x, rec.x + rec.w, 12, false);
      ctx.globalAlpha = 1;
      ctx.restore();
      ctx.fillStyle = CYAN;
      ctx.fillRect(X(rec.x) - 1, stripY, 2, stripH);
      ctx.globalAlpha = 0.4;
      ctx.fillRect(X(rec.x) + 11, stripY, 1, stripH);
      ctx.globalAlpha = 1;
    } else if (rec.type === 'smear') {
      var x0 = X(rec.x), x1 = X(rec.x + rec.w);
      ctx.save();
      regionClip(rec.x, rec.x + rec.w, rec.y0, rec.y1);
      ctx.translate(x0, 0);
      ctx.scale(2.6, 1);
      ctx.translate(-x0, 0);
      drawElements(rec.x, rec.x + rec.w, 0, false);
      ctx.restore();
      ctx.save();
      regionClip(rec.x, rec.x + rec.w, rec.y0, rec.y1);
      ctx.fillStyle = SMEAR;
      ctx.globalAlpha = 0.16;
      ctx.fillRect(x0, Y(rec.y0), x1 - x0, (rec.y1 - rec.y0) * stripH);
      ctx.globalAlpha = 0.5;
      ctx.fillRect(x0, Y(rec.y0) + 3, x1 - x0, 2);
      ctx.fillRect(x0, Y(rec.y1) - 5, x1 - x0, 2);
      ctx.globalAlpha = 1;
      ctx.restore();
    }
    // a fresh tear flares briefly, then settles into the composition
    if (age < 0.6) {
      ctx.save();
      regionClip(rec.x, rec.x + (rec.type === 'dup' ? rec.w + 0.115 : rec.w), 0, 1);
      ctx.fillStyle = '#FFFFFF';
      ctx.globalAlpha = 0.10 * (1 - age / 0.6);
      ctx.fillRect(X(rec.x), stripY, W * 0.2, stripH);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    stripH = Math.round(H * 0.62);
    stripY = Math.round((H - stripH) / 2);

    // a visitor-fed overflow comes due
    if (pending && t >= pending.fireAt) {
      var tpP = pending.fireAt % PASS;
      var rec = { time: pending.fireAt, type: pending.type, x: 0, w: 0.13, y0: 0.30, y1: 0.72 };
      if (pending.type === 'dup') {
        var hf = headFrac(tpP), best = trees[0], bd = 9;
        for (var ti = 0; ti < trees.length; ti++) {
          var dd = Math.abs(trees[ti].x - hf);
          if (dd < bd) { bd = dd; best = trees[ti]; }
        }
        rec.tree = best; rec.x = best.x - 0.065; rec.w = 0.13;
      } else if (pending.type === 'smear') {
        rec.x = clamp(headFrac(tpP) - 0.05, 0, 0.84); rec.w = 0.16;
      } else {
        rec.x = clamp(headFrac(tpP), 0, 0.87);
      }
      visitorDamage.push(rec);
      pending = null;
    }

    var pass = Math.floor(t / PASS);
    var tp = t - pass * PASS;
    var hf = headFrac(tp);

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = EMPTY;
    ctx.fillRect(0, stripY, W, stripH);

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, stripY, W, stripH);
    ctx.clip();

    drawBackgrounds();
    drawElements(0, 1, 0, true);

    var dmg = damageAt(t);
    for (var i = 0; i < dmg.length; i++) drawDamage(dmg[i], t);

    // per-strip freshness: the current pass re-stitches over the torn strip
    for (var k = 0; k < STRIPS; k++) {
      var sx = (k / STRIPS) * W, sw = W / STRIPS + 1;
      var age = tp - stripRevealTp(k);
      if (pass === 0 && age < 0) {
        ctx.fillStyle = EMPTY;
        ctx.fillRect(sx, stripY, sw, stripH);
      } else if (age < 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.06)';
        ctx.fillRect(sx, stripY, sw, stripH);
      } else {
        var boost = 0.16 * Math.exp(-age / 0.9);
        if (boost > 0.004) {
          ctx.fillStyle = 'rgba(255,255,255,' + boost.toFixed(3) + ')';
          ctx.fillRect(sx, stripY, sw, stripH);
        }
      }
    }

    // stitch head
    var hx = hf * W;
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(Math.max(0, hx - 30), stripY, 30, stripH);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(hx - 1, stripY, 2, stripH);

    ctx.restore();

    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, stripY + 0.5, W - 1, stripH - 1);
  }

  resize();
  draw(T0);   // synchronous fixed-phase first frame

  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(pieceNow());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
