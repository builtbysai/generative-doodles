<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№29 · Eclipse</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#f2ecdc; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(60,54,44,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(242,236,220,0.8); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another eclipse</div>
<script>
'use strict';
// No29 Eclipse.
// Concentric rings drawn from two centers instead of one: the ring
// centers drift along a short seeded segment as the radius grows,
// so the rings bunch on one side and stretch on the other, like
// ripples from a moving source, or an eclipse drawn off-axis. The
// drift is the whole deviation from a target piece: same rings, same
// single ink (charcoal on cream), but the center will not sit still.

function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}

const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '29', 10) || 29;

const canvas = document.getElementById('stage');
// viewportWH: prefer the visual viewport so mobile URL-bar show/hide
// (which does not reliably fire window.resize) still resizes the canvas.
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
const ctx = canvas.getContext('2d');

const GROUND = '#f2ecdc';

function compose(s) {
  const rnd = mulberry32(s);
  const ang = rnd() * Math.PI * 2;
  const drift = 0.10 + rnd() * 0.10;          // of radius span
  return {
    dx: Math.cos(ang) * drift, dy: Math.sin(ang) * drift,
    rings: 30 + ((rnd() * 10) | 0),
    ok: drift > 0.08
  };
}

function buildPiece(baseSeed) { return compose(baseSeed >>> 0); }

let piece = null;

function draw() {
  const [w, h] = viewportWH();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Pin the element to the viewport: without this, mobile Chrome sizes
  // the canvas from its 2x backing store and everything renders doubled.
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, w, h);

  if (!piece) piece = buildPiece(seed);
  const p = piece;

  // Centered composition; page ground is the piece's ground.
  const S = Math.min(w, h);
  const cx = w / 2, cy = h / 2;
  const R = S * 0.44;
  ctx.strokeStyle = 'rgba(43,40,34,0.8)';
  ctx.lineWidth = Math.max(0.8, S / 950);
  for (let i = p.rings; i >= 1; i--) {
    const f = i / p.rings;
    ctx.beginPath();
    ctx.arc(cx + p.dx * R * f, cy + p.dy * R * f, R * f, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function redraw() { piece = buildPiece(seed); draw(); }
window.addEventListener('resize', draw);
if (window.visualViewport) window.visualViewport.addEventListener('resize', draw);
canvas.addEventListener('click', () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, '', '?seed=' + seed);
  redraw();
});
draw();
</script>
</body>
</html>
