<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.193 Numbered Sections</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B1026; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.193 Numbered Sections (Eugene Sargent, Hogeye). A dancing boar
// arrives unfinished, as Sargent's builds do: twelve steel sections,
// each stenciled with its number, scattered around the silhouette.
// Drag a section home and it snaps into its own slot with a soft
// clunk-flash; wrong slots simply do not hold. Assemble all twelve
// and the boar rises on its hind legs and dances for twenty seconds,
// front feet pawing the air, amber light under its feet. Double-tap
// scatters it again. No arrows, no instructions: the numbers and the
// slot shapes are the only guide.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#0B1026', STEEL = '#8A8F98', SEAM = '#4A4E55';
var BONE = '#EDE6D6', AMBER = '#FFB13E';
var W = 0, H = 0, phone = false;
var seed = 193193;
var sm = /seed=(\d+)/.exec(location.search || '');
if (sm) seed = parseInt(sm[1], 10) >>> 0;
function rng(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rand = rng(seed);
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, k) { return a + (b - a) * k; }
function smooth(a, b, x) { var k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); }

// ---- the twelve sections (local units, boar faces right, ground y=100) ----
var POLYS = [
  [[-178,-28],[-150,-54],[-136,-30],[-150,-6],[-174,0],[-186,-14]],            // 01 tail
  [[-150,-54],[-104,-68],[-95,-20],[-104,14],[-140,10],[-150,-6],[-136,-30]],  // 02 rump
  [[-104,-68],[-52,-74],[-45,-24],[-52,16],[-104,14],[-95,-20]],              // 03 rear back
  [[-52,-74],[6,-76],[13,-26],[6,18],[-52,16],[-45,-24]],                     // 04 mid back
  [[6,-76],[62,-68],[67,-22],[58,16],[6,18],[13,-26]],                        // 05 shoulder
  [[62,-68],[104,-56],[109,-18],[96,10],[58,16],[67,-22]],                     // 06 neck
  [[104,-56],[146,-50],[170,-31],[173,-16],[158,4],[126,10],[109,-18]],       // 07 head
  [[111,-54],[125,-82],[141,-55],[128,-45]],                                  // 08 ear
  [[-52,16],[58,16],[67,44],[40,59],[-30,57],[-54,40]],                        // 09 belly
  [[58,16],[85,20],[81,58],[89,97],[70,99],[58,60],[47,30]],                  // 10 front leg
  [[-104,14],[-58,16],[-51,52],[-65,84],[-88,83],[-99,44]],                   // 11 hind leg
  [[-88,83],[-65,84],[-60,101],[-97,101],[-100,90]]                           // 12 hind hoof plate
];
var HOME_SET = { 1: true, 3: true, 4: true, 6: true, 8: true, 10: true }; // frame one: partly built (0-based idx)
var SCATTER_FR = [
  [0.09, 0.15], [0.30, 0.08], [0.56, 0.07], [0.83, 0.12], [0.94, 0.36],
  [0.92, 0.66], [0.74, 0.91], [0.46, 0.94], [0.17, 0.91], [0.05, 0.62],
  [0.04, 0.36], [0.20, 0.28]
];
var parts = [];
var scatterIdx = 0;
for (var pi = 0; pi < 12; pi++) {
  var poly = POLYS[pi], cx = 0, cy = 0, i2;
  for (i2 = 0; i2 < poly.length; i2++) { cx += poly[i2][0]; cy += poly[i2][1]; }
  cx /= poly.length; cy /= poly.length;
  var home = !!HOME_SET[pi];
  var sf = SCATTER_FR[scatterIdx % SCATTER_FR.length];
  if (!home) scatterIdx++;
  parts.push({
    poly: poly, anchor: { x: cx, y: cy }, home: home,
    mode: home ? 'home' : 'scatter',
    x: 0, y: 0, rot: 0,
    tx: 0, ty: 0, trot: 0,
    sx: sf[0], sy: sf[1],
    srot: (rand() - 0.5) * 1.0,
    wob: rand() * 6.28
  });
}
var flashes = [];
var state = 'assemble'; // 'assemble' | 'dance' | 'sway'
var danceT = 0;
var T = 0, lastNow = -1;

function unit() { return Math.min(Math.min(W, H) / 430, W / 460); }
function creatureC() { return { x: W / 2, y: H * 0.66 }; }
function homePos(p) {
  var c = creatureC(), u = unit();
  return { x: c.x + p.anchor.x * u, y: c.y + p.anchor.y * u };
}
function scatterPos(p) {
  var u = unit();
  var mx = 62 + 42 * u, my = 56 + 40 * u;
  return {
    x: clamp(p.sx * W + Math.sin(T * 0.3 + p.wob) * 5, mx, W - mx),
    y: clamp(p.sy * H + Math.cos(T * 0.23 + p.wob) * 5, my, H - my)
  };
}
function layoutInit() {
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    if (p.mode === 'home') { var hp = homePos(p); p.x = hp.x; p.y = hp.y; p.rot = 0; }
    else { var sp = scatterPos(p); p.x = sp.x; p.y = sp.y; p.rot = p.srot; }
  }
}
function placedCount() {
  var n = 0;
  for (var i = 0; i < parts.length; i++) if (parts[i].mode === 'home') n++;
  return n;
}

// ---- input ---------------------------------------------------------------------
var drag = null, dragOff = { x: 0, y: 0 };
var lastTapT = -9, lastTapX = 0, lastTapY = 0;
function partAt(x, y) {
  var u = unit();
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    if (p.mode === 'home') continue;
    var dx = x - p.x, dy = y - p.y;
    if (dx * dx + dy * dy < Math.pow(Math.max(52, 46 * u), 2)) return p;
  }
  return null;
}
canvas.addEventListener('pointerdown', function (e) {
  var p = partAt(e.clientX, e.clientY);
  if (p) {
    drag = p; p.mode = 'drag';
    dragOff.x = e.clientX - p.x; dragOff.y = e.clientY - p.y;
  }
});
canvas.addEventListener('pointermove', function (e) {
  if (!drag) return;
  drag.x = e.clientX - dragOff.x;
  drag.y = e.clientY - dragOff.y;
  drag.rot *= 0.92;
});
canvas.addEventListener('pointerup', function (e) {
  if (drag) {
    var p = drag, hp = homePos(p);
    var dx = p.x - hp.x, dy = p.y - hp.y;
    if (dx * dx + dy * dy < Math.pow(74, 2)) {
      p.mode = 'anim'; p.tx = hp.x; p.ty = hp.y; p.trot = 0; p.toHome = true;
    } else {
      var sp = scatterPos(p);
      p.mode = 'anim'; p.tx = sp.x; p.ty = sp.y; p.trot = p.srot; p.toHome = false;
    }
    drag = null;
  }
  // double-tap detection (scatter and restart)
  var now = (e.timeStamp || 0) / 1000;
  if (Math.abs(e.clientX - lastTapX) < 60 && Math.abs(e.clientY - lastTapY) < 60 && now - lastTapT < 0.34) {
    scatterAll();
    lastTapT = -9;
  } else {
    lastTapT = now; lastTapX = e.clientX; lastTapY = e.clientY;
  }
});
canvas.addEventListener('pointercancel', function () { drag = null; });
function scatterAll() {
  if (state === 'dance') return;
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i], sp = scatterPos(p);
    p.mode = 'anim'; p.tx = sp.x; p.ty = sp.y; p.trot = p.srot; p.toHome = false;
  }
  state = 'assemble';
}

// ---- resize -----------------------------------------------------------------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700;
  if (!phone && !(sw > 0)) phone = H > W * 1.15;
  layoutInit();
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

// ---- step ----------------------------------------------------------------------------
function step(dt) {
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    if (p.mode === 'anim') {
      var k = Math.min(1, dt * (p.toHome ? 9 : 5));
      p.x = lerp(p.x, p.tx, k); p.y = lerp(p.y, p.ty, k);
      p.rot = lerp(p.rot, p.trot, k);
      var dx = p.x - p.tx, dy = p.y - p.ty;
      if (dx * dx + dy * dy < 9) {
        if (p.toHome) {
          p.mode = 'home'; p.x = p.tx; p.y = p.ty; p.rot = 0;
          flashes.push({ x: p.x, y: p.y, t: 0 });
          if (placedCount() === 12 && state === 'assemble') { state = 'dance'; danceT = 0; }
        } else {
          p.mode = 'scatter';
        }
      }
    } else if (p.mode === 'scatter') {
      var sp = scatterPos(p);
      p.x = lerp(p.x, sp.x, Math.min(1, dt * 2));
      p.y = lerp(p.y, sp.y, Math.min(1, dt * 2));
    } else if (p.mode === 'home' && state === 'assemble') {
      var hp = homePos(p);
      p.x = hp.x; p.y = hp.y;
    }
  }
  for (var f = flashes.length - 1; f >= 0; f--) {
    flashes[f].t += dt;
    if (flashes[f].t > 0.4) flashes.splice(f, 1);
  }
  if (state === 'dance') {
    danceT += dt;
    if (danceT >= 20) state = 'sway';
  }
}

// ---- draw -------------------------------------------------------------------------------
function drawPartShape(p, ghost) {
  var u = unit();
  ctx.beginPath();
  for (var i = 0; i < p.poly.length; i++) {
    var lx = (p.poly[i][0] - p.anchor.x) * u, ly = (p.poly[i][1] - p.anchor.y) * u;
    if (i === 0) ctx.moveTo(lx, ly); else ctx.lineTo(lx, ly);
  }
  ctx.closePath();
  if (ghost) {
    ctx.fillStyle = 'rgba(138,143,152,0.08)'; ctx.fill();
    ctx.strokeStyle = 'rgba(74,78,85,0.65)'; ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
    return;
  }
  ctx.fillStyle = STEEL; ctx.fill();
  ctx.strokeStyle = SEAM; ctx.lineWidth = 1.6; ctx.stroke();
  // rivets at the corners, drawn in toward the centre
  ctx.fillStyle = SEAM;
  for (var j = 0; j < p.poly.length; j++) {
    var vx = (p.poly[j][0] - p.anchor.x) * u * 0.86, vy = (p.poly[j][1] - p.anchor.y) * u * 0.86;
    ctx.beginPath(); ctx.arc(vx, vy, Math.max(1.4, u * 1.1), 0, 6.284); ctx.fill();
  }
  // stenciled number
  ctx.fillStyle = BONE;
  ctx.font = '700 ' + Math.round(15 * u) + 'px "Arial Narrow", Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var num = (parts.indexOf(p) + 1);
  ctx.fillText((num < 10 ? '0' : '') + num, 0, 1);
}

function drawPart(p, groupTransform) {
  ctx.save();
  if (groupTransform) groupTransform();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot + (p.danceRot || 0));
  drawPartShape(p, false);
  ctx.restore();
}

function draw(now) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (lastNow >= 0 && now > 0) {
    var dt = Math.min(0.05, (now - lastNow) / 1000);
    T += dt;
    step(dt);
  }
  lastNow = now;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, W, H);
  for (var z = 0; z < parts.length; z++) parts[z].danceRot = 0;
  var u = unit(), c = creatureC();
  var groundY = c.y + 100 * u;

  // group transform for dance / sway
  var rear = 0, groupFn = null;
  if (state === 'dance' || state === 'sway') {
    var swayA = state === 'sway' ? Math.sin(T * 0.8) * 0.02 : 0;
    rear = state === 'dance'
      ? smooth(0, 2, danceT) * (1 - smooth(16, 18.5, danceT))
      : 0;
    var bob = state === 'dance' ? Math.sin(danceT * 2.2) * 4 * rear : Math.sin(T * 0.8) * 1.5;
    var spinK = 1;
    if (state === 'dance' && danceT > 8 && danceT < 11) {
      var sk = Math.cos((danceT - 8) / 3 * 6.283);
      spinK = Math.abs(sk) < 0.3 ? 0.3 * Math.sign(sk || 1) : sk;
    }
    var pivot = { x: c.x - 80 * u, y: groundY };
    groupFn = function () {
      ctx.translate(pivot.x, pivot.y + bob);
      ctx.rotate(-0.42 * rear + swayA);
      ctx.scale(spinK, 1);
      ctx.translate(-pivot.x, -pivot.y);
    };
    // per-part dance accents
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.danceRot = 0;
      if (state === 'dance') {
        if (i === 9) p.danceRot = Math.sin(danceT * 5.2) * 0.38 * rear;       // front leg paws
        if (i === 6) p.danceRot = Math.sin(danceT * 2.2 + 1) * 0.07 * rear;  // head bob
        if (i === 0) p.danceRot = Math.sin(danceT * 7) * 0.22 * rear;        // tail wag
      } else if (i === 0) p.danceRot = Math.sin(T * 1.7) * 0.05;
    }
    // amber underlight
    var grd = ctx.createRadialGradient(c.x, groundY, 4, c.x, groundY, 190 * u);
    var al = state === 'dance' ? 0.16 + 0.08 * Math.sin(danceT * 2.2) : 0.08;
    grd.addColorStop(0, 'rgba(255,177,62,' + al + ')');
    grd.addColorStop(1, 'rgba(255,177,62,0)');
    ctx.fillStyle = grd;
    ctx.save();
    ctx.translate(c.x, groundY); ctx.scale(1, 0.22); ctx.translate(-c.x, -groundY);
    ctx.beginPath(); ctx.arc(c.x, groundY, 190 * u, 0, 6.284); ctx.fill();
    ctx.restore();
  }

  // ghost slots for missing sections
  for (var g = 0; g < parts.length; g++) {
    var gp = parts[g];
    if (gp.mode === 'home' || gp.mode === 'drag') continue;
    var hp = homePos(gp);
    ctx.save();
    ctx.translate(hp.x, hp.y);
    drawPartShape(gp, true);
    ctx.restore();
  }
  // home sections (with the group transform while dancing)
  for (var h = 0; h < parts.length; h++) {
    if (parts[h].mode === 'home') drawPart(parts[h], groupFn);
  }
  // amber glow at the pawing front feet while rearing
  if (state === 'dance' && rear > 0.5) {
    var fp = homePos(parts[9]);
    ctx.save();
    if (groupFn) groupFn();
    ctx.fillStyle = 'rgba(255,177,62,0.5)';
    ctx.beginPath(); ctx.arc(fp.x + 20 * u, fp.y + 95 * u, 5 * u, 0, 6.284); ctx.fill();
    ctx.restore();
  }
  // scattered and dragged sections on top
  for (var s = 0; s < parts.length; s++) {
    if (parts[s].mode !== 'home') drawPart(parts[s], null);
  }
  // clunk flashes
  for (var f = 0; f < flashes.length; f++) {
    var fl = flashes[f], k = fl.t / 0.4;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.8 * (1 - k)) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(fl.x, fl.y, 10 + k * 46, 0, 6.284); ctx.stroke();
    ctx.beginPath(); ctx.arc(fl.x, fl.y, 4 + k * 20, 0, 6.284); ctx.stroke();
  }
}

resize();
draw(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
