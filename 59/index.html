<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№59 · Six Twenty Five</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b0b0e; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(245,242,233,0.5); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to scramble a patch</div>
<script>
'use strict';
const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '59', 10) || 0;
const canvas = document.getElementById('stage');
function viewportWH(){
  const vv = window.visualViewport;
  if (vv && vv.width > 0 && vv.height > 0) return [vv.width, vv.height];
  return [window.innerWidth, window.innerHeight];
}
function isPhone(){
  const sw = window.screen ? window.screen.width : 0;
  const sh = window.screen ? window.screen.height : 0;
  if (sw && sh && Math.min(sw, sh) < 700) return true;
  const [w, h] = viewportWH();
  return h > w * 1.15;
}
const ctx = canvas.getContext('2d');
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function prep(w,h){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== Math.round(w*dpr) || canvas.height !== Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
}
function smooth(x){ x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x); }

const GN=25;
const rng59=mulberry(seed*7919+59);
const tiles=[];
for(let y=0;y<GN;y++) for(let x=0;x<GN;x++) tiles.push({hx:x,hy:y,sx:0,sy:0,scrAt:-1e9,scrX:0,scrY:0});
// scrambled positions: seeded permutation of grid coords
const coords=[]; for(let y=0;y<GN;y++) for(let x=0;x<GN;x++) coords.push([x,y]);
for(let i=coords.length-1;i>0;i--){ const j=Math.floor(rng59()*(i+1)); const tmp=coords[i]; coords[i]=coords[j]; coords[j]=tmp; }
tiles.forEach((tl,i)=>{ tl.sx=coords[i][0]; tl.sy=coords[i][1]; });
const maxD=Math.hypot(12,12);
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  ctx.fillStyle='#0b0b0e'; ctx.fillRect(0,0,w,h);
  const total=12, t=(nowMs/1000)%total;
  const cell=Math.min(w,h)/GN;
  const cellW=cell, cellH=cell;
  const ox=(w-cell*GN)/2, oy=(h-cell*GN)/2;
  for(const tl of tiles){
    const d=Math.hypot(tl.hx-12,tl.hy-12)/maxD;
    const start=d*6, dur=2;
    let px=tl.sx, py=tl.sy, state='unsolved';
    // local scramble zone override
    let localScr=false;
    if(nowMs-tl.scrAt<2500 && tl.scrAt>0){ localScr=true; }
    if(localScr){
      const lt=(nowMs-tl.scrAt)/1000;
      if(lt<1.5){ px=tl.scrX; py=tl.scrY; state='unsolved'; }
      else { const p=smooth((lt-1.5)/1); px=tl.scrX+(tl.hx-tl.scrX)*p; py=tl.scrY+(tl.hy-tl.scrY)*p; state=p>=1?'solved':'moving'; }
    } else if(t<8){
      const lt=t-start;
      if(lt<=0){ px=tl.sx; py=tl.sy; state='unsolved'; }
      else if(lt>=dur){ px=tl.hx; py=tl.hy; state='solved'; }
      else {
        const p=smooth(lt/dur);
        // L path: x first half, y second half
        if(p<0.5){ const q=p/0.5; px=tl.sx+(tl.hx-tl.sx)*q; py=tl.sy; }
        else { const q=(p-0.5)/0.5; px=tl.hx; py=tl.sy+(tl.hy-tl.sy)*q; }
        state='moving';
      }
    } else if(t<10){ px=tl.hx; py=tl.hy; state='solved'; }
    else { const p=smooth((t-10)/2); px=tl.hx+(tl.sx-tl.hx)*p; py=tl.hy+(tl.sy-tl.hy)*p; state=p>=1?'unsolved':'moving'; }
    const X=ox+px*cellW, Y=oy+py*cellH;
    ctx.fillStyle=state==='solved'?'#e9e6dc':(state==='moving'?'#e8a33d':'#2b3a55');
    ctx.fillRect(X+1,Y+1,Math.max(1,cellW-2),Math.max(1,cellH-2));
  }
  // pulse ring during solve
  if(t<8){
    const front=(t/6)*maxD;
    ctx.save(); ctx.beginPath(); ctx.rect(ox,oy,cellW*GN,cellH*GN); ctx.clip();
    ctx.strokeStyle='#f5f2e9'; ctx.lineWidth=1.5; ctx.beginPath();
    ctx.arc(ox+12.5*cellW, oy+12.5*cellH, front*cellW, 0, Math.PI*2); ctx.stroke(); ctx.restore();
  }
  return {};
}

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(5000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);

let paint59=false;
function paintTile(ev){
  const [w,h]=viewportWH();
  const cell=Math.min(w,h)/GN; const cellW=cell, cellH=cell;
  const ox=(w-cell*GN)/2, oy=(h-cell*GN)/2;
  const gx=Math.floor((ev.clientX-ox)/cellW), gy=Math.floor((ev.clientY-oy)/cellH);
  for(const tl of tiles){ if(Math.abs(tl.hx-gx)<=1 && Math.abs(tl.hy-gy)<=1){ tl.scrAt=performance.now(); tl.scrX=Math.max(0,Math.min(GN-1, tl.hx + ((gx*7+gy*13)%5)-2)); tl.scrY=Math.max(0,Math.min(GN-1, tl.hy + ((gx*11+gy*3)%5)-2)); } }
}
canvas.addEventListener('pointerdown',ev=>{paint59=true; paintTile(ev);});
canvas.addEventListener('pointermove',ev=>{ if(paint59) paintTile(ev); });
function endDrag59(){ paint59=false; }
canvas.addEventListener('pointerup',endDrag59); canvas.addEventListener('pointercancel',endDrag59);

window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
