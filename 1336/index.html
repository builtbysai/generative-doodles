<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Unbranded</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #DCD2B8; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, phone = false;

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1336000);

  // Seeded glyph patterns: rows of dash lengths, fixed per zone, never random.
  function glyphRows(nrows, minlen, maxlen) {
    var rows = [], i, j, n;
    for (i = 0; i < nrows; i++) {
      var row = [];
      n = 4 + Math.floor(rng() * 4);
      for (j = 0; j < n; j++) row.push(minlen + rng() * (maxlen - minlen));
      rows.push(row);
    }
    return rows;
  }
  var headlineGlyphs = glyphRows(2, 0.10, 0.30);
  var bodyGlyphs = glyphRows(5, 0.06, 0.20);
  var fineGlyphs = glyphRows(2, 0.05, 0.14);
  // Seeded paper flecks.
  var flecks = [], i;
  for (i = 0; i < 240; i++) {
    flecks.push([rng(), rng(), rng() * 2 + 0.6]);
  }

  function size() {
    var vw = window.innerWidth, vh = window.innerHeight;
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      vw = visualViewport.width; vh = visualViewport.height;
    }
    W = Math.round(vw); H = Math.round(vh);
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    var minDim = 99999;
    try {
      if (window.screen) minDim = Math.min(window.screen.width, window.screen.height);
    } catch (e) { minDim = 99999; }
    phone = (minDim < 700) || (H > W * 1.15);
  }
  size();
  if (typeof window !== 'undefined') {
    window.addEventListener('resize', function () { size(); draw(effectiveT()); });
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      visualViewport.addEventListener('resize', function () { size(); draw(effectiveT()); });
    }
  }

  // Cycle clock: 34 s loop. Phase 0 = completed ad (built hold), so frame one
  // opens on the finished advertisement and erasure only follows after.
  var CYCLE = 34;
  var startMs = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  var phaseOffset = 0;
  var dragging = false, dragStartX = 0, dragStartT = 0, dragT = 0;

  function elapsed() {
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    return (now - startMs) / 1000;
  }
  function mod(n, m) { return ((n % m) + m) % m; }
  function effectiveT() {
    if (dragging) return dragT;
    return mod(elapsed() + phaseOffset, CYCLE);
  }

  function zoneErase(t, cStart, cEnd, rStart, rEnd) {
    if (t < cStart) return 0;
    if (t < cEnd) return (t - cStart) / (cEnd - cStart);
    if (t < rStart) return 1;
    if (t < rEnd) return 1 - (t - rStart) / (rEnd - rStart);
    return 0;
  }
  function eraseFor(t) {
    return {
      headline: zoneErase(t, 8, 10.5, 32, 34),
      logo: zoneErase(t, 10.5, 13, 30, 32),
      body: zoneErase(t, 13, 15.5, 28, 30),
      fine: zoneErase(t, 15.5, 18, 26, 28)
    };
  }

  function drawGlyphLines(x, y, w, rows, h, gap, color, alpha) {
    var r, j, cx, len;
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;
    for (r = 0; r < rows.length; r++) {
      cx = x;
      for (j = 0; j < rows[r].length; j++) {
        len = rows[r][j] * w;
        if (cx + len > x + w) break;
        ctx.fillRect(cx, y + r * (h + gap), len, h);
        cx += len + w * 0.045;
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawHero(hx, hy, hw, hh) {
    // Teal field, never moves with the cycle.
    ctx.fillStyle = '#4E7A78';
    ctx.fillRect(hx, hy, hw, hh);
    var u = Math.min(hw, hh);
    // Floor line.
    ctx.fillStyle = '#3E6664';
    ctx.fillRect(hx, hy + hh * 0.82, hw, hh * 0.18);
    // Side table with product bottle (placement, not caricature).
    var tx = hx + hw * 0.68, ty = hy + hh * 0.60;
    ctx.fillStyle = '#2B3A55';
    ctx.fillRect(tx, ty, hw * 0.20, hh * 0.03);
    ctx.fillRect(tx + hw * 0.02, ty + hh * 0.03, hw * 0.02, hh * 0.19);
    ctx.fillRect(tx + hw * 0.16, ty + hh * 0.03, hw * 0.02, hh * 0.19);
    ctx.fillStyle = '#C9973B';
    ctx.fillRect(tx + hw * 0.075, ty - hh * 0.16, hw * 0.05, hh * 0.16);
    ctx.fillRect(tx + hw * 0.085, ty - hh * 0.20, hw * 0.03, hh * 0.04);
    // Figure: navy suit, skin tone, standing, head turned off-frame.
    var fx = hx + hw * 0.30, fy = hy + hh * 0.82;
    var fh = hh * 0.72;
    // Legs.
    ctx.fillStyle = '#2B3A55';
    ctx.fillRect(fx - u * 0.045, fy - fh * 0.38, u * 0.05, fh * 0.38);
    ctx.fillRect(fx + u * 0.005, fy - fh * 0.38, u * 0.05, fh * 0.38);
    // Torso (trapezoid).
    ctx.beginPath();
    ctx.moveTo(fx - u * 0.075, fy - fh * 0.38);
    ctx.lineTo(fx + u * 0.085, fy - fh * 0.38);
    ctx.lineTo(fx + u * 0.065, fy - fh * 0.78);
    ctx.lineTo(fx - u * 0.055, fy - fh * 0.78);
    ctx.closePath();
    ctx.fill();
    // Shirt V.
    ctx.fillStyle = '#F2E9D8';
    ctx.beginPath();
    ctx.moveTo(fx - u * 0.02, fy - fh * 0.78);
    ctx.lineTo(fx + u * 0.03, fy - fh * 0.78);
    ctx.lineTo(fx + u * 0.005, fy - fh * 0.70);
    ctx.closePath();
    ctx.fill();
    // Head, turned: skin circle with a small profile bump to the right.
    ctx.fillStyle = '#8A5A3B';
    ctx.beginPath();
    ctx.moveTo(fx + u * 0.055, fy - fh * 0.86);
    ctx.arc(fx + u * 0.005, fy - fh * 0.86, u * 0.055, 0, Math.PI * 2);
    ctx.fill();
    // Hair cap.
    ctx.fillStyle = '#22201C';
    ctx.beginPath();
    ctx.moveTo(fx - u * 0.05, fy - fh * 0.86);
    ctx.arc(fx + u * 0.005, fy - fh * 0.87, u * 0.055, Math.PI * 0.95, Math.PI * 2.05);
    ctx.fill();
    // Arm down, arm gesturing toward the tabled product.
    ctx.fillStyle = '#2B3A55';
    ctx.fillRect(fx - u * 0.085, fy - fh * 0.74, u * 0.035, fh * 0.30);
    ctx.save();
    ctx.translate(fx + u * 0.07, fy - fh * 0.72);
    ctx.rotate(-0.9);
    ctx.fillRect(-u * 0.017, 0, u * 0.035, fh * 0.30);
    ctx.restore();
  }

  function draw(t) {
    var e = eraseFor(t);
    ctx.fillStyle = '#DCD2B8';
    ctx.fillRect(0, 0, W, H);
    var pw = Math.min(W * 0.86, H * 0.62);
    var ph = pw * 1.35;
    if (ph > H * 0.94) { ph = H * 0.94; pw = ph / 1.35; }
    var px = (W - pw) / 2, py = (H - ph) / 2;
    var pad = pw * 0.055;
    // Panel.
    ctx.fillStyle = '#F2E9D8';
    ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = '#22201C';
    ctx.lineWidth = Math.max(1, pw * 0.003);
    ctx.strokeRect(px + pw * 0.008, py + ph * 0.006, pw * 0.984, ph * 0.988);
    // Seeded paper flecks on the panel.
    var fi;
    ctx.fillStyle = '#8A7F63';
    for (fi = 0; fi < flecks.length; fi++) {
      ctx.globalAlpha = 0.05 + flecks[fi][2] * 0.02;
      ctx.fillRect(px + flecks[fi][0] * pw, py + flecks[fi][1] * ph, 1.5, 1.5);
    }
    ctx.globalAlpha = 1;
    // Hero image.
    var hx = px + pad, hy = py + pad, hw = pw - pad * 2, hh = ph * 0.50;
    drawHero(hx, hy, hw, hh);
    // Headline zone.
    var hzY = hy + hh + ph * 0.035, hzH = ph * 0.075, hzX = hx, hzW = hw;
    var he = e.headline;
    drawGlyphLines(hzX, hzY - he * ph * 0.008, hzW, headlineGlyphs, Math.max(3, ph * 0.018), ph * 0.012, '#B33A2B', 1 - he);
    if (he > 0) {
      ctx.globalAlpha = he * 0.95;
      ctx.fillStyle = '#DCD6C6';
      ctx.fillRect(hzX, hzY, hzW, hzH);
      ctx.globalAlpha = 1;
      drawGlyphLines(hzX, hzY, hzW, headlineGlyphs, Math.max(3, ph * 0.018), ph * 0.012, '#9A958A', 0.12 * he);
    }
    // Body copy zone.
    var bzY = hzY + hzH + ph * 0.03, bzH = ph * 0.16, bzX = hx, bzW = hw * 0.72;
    var be = e.body;
    drawGlyphLines(bzX, bzY, bzW, bodyGlyphs, Math.max(2, ph * 0.007), ph * 0.010, '#22201C', 1 - be);
    if (be > 0) {
      ctx.globalAlpha = be * 0.95;
      ctx.fillStyle = '#DCD6C6';
      ctx.fillRect(bzX, bzY, bzW, bzH);
      ctx.globalAlpha = 1;
      drawGlyphLines(bzX, bzY, bzW, bodyGlyphs, Math.max(2, ph * 0.007), ph * 0.010, '#9A958A', 0.12 * be);
    }
    // Logo plate, bottom-right of the body row.
    var lzX = hx + hw * 0.76, lzY = bzY, lzW = hw * 0.24, lzH = ph * 0.11;
    var le = e.logo;
    var lcX = lzX + lzW / 2, lcY = lzY + lzH / 2, lr = Math.min(lzW, lzH) * 0.42;
    if (le < 1) {
      ctx.globalAlpha = 1 - le;
      ctx.fillStyle = '#C9973B';
      ctx.beginPath();
      ctx.moveTo(lcX + lr, lcY);
      ctx.arc(lcX, lcY, lr, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#F2E9D8';
      ctx.beginPath();
      ctx.moveTo(lcX + lr * 0.55, lcY);
      ctx.arc(lcX, lcY, lr * 0.55, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#B33A2B';
      ctx.fillRect(lcX - lr * 0.7, lcY - lr * 0.08, lr * 1.4, lr * 0.16);
      ctx.globalAlpha = 1;
    }
    if (le > 0) {
      ctx.globalAlpha = le * 0.95;
      ctx.fillStyle = '#DCD6C6';
      ctx.fillRect(lzX, lzY, lzW, lzH);
      ctx.globalAlpha = 1;
    }
    // Fine print zone.
    var fzY = py + ph - pad - ph * 0.045, fzX = hx, fzW = hw;
    var fe = e.fine;
    drawGlyphLines(fzX, fzY, fzW, fineGlyphs, Math.max(1.5, ph * 0.004), ph * 0.006, '#22201C', 1 - fe);
    if (fe > 0) {
      ctx.globalAlpha = fe * 0.95;
      ctx.fillStyle = '#DCD6C6';
      ctx.fillRect(fzX, fzY, fzW, ph * 0.045);
      ctx.globalAlpha = 1;
    }
  }

  function ptrX(ev) {
    var r = canvas.getBoundingClientRect();
    return (ev.clientX - r.left) * (W / Math.max(1, r.width));
  }
  canvas.addEventListener('pointerdown', function (ev) {
    dragging = true;
    dragStartX = ptrX(ev);
    dragStartT = effectiveT();
    dragT = dragStartT;
    try { canvas.setPointerCapture(ev.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (!dragging) return;
    dragT = mod(dragStartT + (ptrX(ev) - dragStartX) * 0.04, CYCLE);
    draw(dragT);
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    phaseOffset = dragT - elapsed();
    draw(effectiveT());
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  draw(0);
  function loop() {
    draw(effectiveT());
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
