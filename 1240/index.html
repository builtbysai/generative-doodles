<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Noise Karaoke</title>
<style>
  html, body { margin: 0; padding: 0; background: #0D0C0C; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1240 "Noise Karaoke" - Adan De La Garza study block ADG1.
   After De La Garza's Dada karaoke (with Flinching Eye, Biennial of the
   Americas): an entire room embracing yelling (and whispering) nonsense.
   A karaoke screen sings generated Dada syllables to a pounding beat -
   each syllable highlights as the beat hits, ball hopping syllable to
   syllable - over a crowd waveform that pulses like a room yelling along.
   Every other 30 s block the screen glitches down into a whisper section:
   tiny syllables crawl at the screen's bottom edge, the waveform nearly
   flat. Drag sideways to change the tempo (never below a whisper), tap
   for the next verse, double-tap to reseed the syllable bank.
   HOUSE ADAPTATION: the prompt's WebAudio noise-burst beat ships as a
   VISUAL beat only - the highlight, the ball and the waveform carry it.
   The piece is silent. Flat fills only; seeded hashes only. */

var T0 = 7.3;                  // fixed first-frame phase: verse block, mid-line
var BLOCK = 30;                // verse / whisper alternation, seconds
var BEAT0 = 0.5;               // seconds per beat at tempo 1
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;

var PAL = {
  room: '#0D0C0C', screen: '#121014', frame: '#D63A2F', curtain: '#A8271E',
  curtainDark: '#7E1B14', yellow: '#F2C230', text: '#F5F2E9',
  whisper: '#6E6F72', green: '#5FA88A', black: '#070707'
};

/* ---------- seeded hash (integer, deterministic) ---------- */
function ih(a, b) {
  var x = ((a | 0) * 374761393 + (b | 0) * 668265263) >>> 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

/* ---------- time ---------- */
function perfNow() {
  return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : 0;
}
var startPerf = perfNow();
function pieceNow() { return T0 + (perfNow() - startPerf); }

/* ---------- beat clock: tempo segments over piece time ---------- */
var segs = [{ t: 0, tempo: 1, phase: 0 }];      // phase = beats elapsed at seg.t
var jumpBeats = 0;                             // tap / reseed offsets, in beats
var salt = 0;                                  // double-tap reseeds the bank
function phaseAt(t) {
  var s = segs[0], i;
  for (i = segs.length - 1; i >= 0; i--) { if (segs[i].t <= t) { s = segs[i]; break; } }
  return s.phase + (t - s.t) * s.tempo / BEAT0;
}
function curTempo() { return segs[segs.length - 1].tempo; }
function commitTempo(nt) {
  var now = pieceNow();
  segs.push({ t: now, tempo: nt, phase: phaseAt(now) });
}
function isWhisper(t) { return Math.floor(t / BLOCK) % 2 === 1; }
/* Beats that count toward the song: the beat clock runs through whisper
   blocks too, but the song holds its place - subtract the phase gained
   inside whisper blocks so verses resume exactly where they left off. */
function songBeatRaw(t) {
  var ph = phaseAt(t), sub = 0, a, k;
  for (k = 1; ; k += 2) {
    a = k * BLOCK;
    if (a >= t) break;
    sub += phaseAt(Math.min(a + BLOCK, t)) - phaseAt(a);
  }
  return ph - sub;
}
function songBeat(t) { return songBeatRaw(t) + jumpBeats; }

/* ---------- Dada syllable bank ---------- */
var ONSETS = ['thw', 'bl', 'shh', 'kw', 'rr', 'mmp', 'zz', 'fr', 'kr', 'br',
              'sn', 'gr', 'pl', 'dr', 'tr', 'skw', 'fl', 'vr'];
var VOWELS = ['eee', 'aa', 'oo', 'uh', 'ee', 'ii', 'a', 'o'];
var CODAS = ['mp', 'p', 'k', 'sh', 'rr', 'm', 'ng', 'ff', 'T', 'ss'];
function genSyllable(seed, i) {
  var s = '';
  if (ih(seed, i * 4 + 11) < 0.92)
    s += ONSETS[Math.floor(ih(seed, i * 4 + 12) * ONSETS.length)];
  s += VOWELS[Math.floor(ih(seed, i * 4 + 23) * VOWELS.length)];
  if (ih(seed, i * 4 + 34) < 0.45)
    s += CODAS[Math.floor(ih(seed, i * 4 + 35) * CODAS.length)];
  var cm = ih(seed, i * 4 + 41);
  if (cm < 0.26) s = s.toUpperCase();
  else if (cm < 0.40 && s.length > 2) s = s.slice(0, s.length - 2) + s.slice(s.length - 2).toUpperCase();
  return s;
}
function genWord(seed, wi) {
  var n = 1 + Math.floor(ih(seed, wi * 7 + 3) * 3), out = [], j;
  for (j = 0; j < n; j++) out.push(genSyllable(seed + 500 + wi * 31, j + wi * 13));
  return out;                                     // array of syllable strings
}
function genLine(seed) {
  /* 4-6 words per line; stop early once the line holds ~10 syllables so
     the type stays big on the screen */
  var maxW = 4 + Math.floor(ih(seed, 77) * 3), words = [], w, total = 0;
  for (w = 0; w < maxW; w++) {
    var word = genWord(seed + 900 + w * 57, w);
    words.push(word); total += word.length;
    if (w >= 3 && total >= 10) break;
  }
  return words;                                   // array of words
}
function genVerse(v) {
  var seed = 38440 + salt * 100003 + v * 7717;
  var lines = [genLine(seed + 1), genLine(seed + 2)], total = 0, li, wi;
  for (li = 0; li < 2; li++)
    for (wi = 0; wi < lines[li].length; wi++) total += lines[li][wi].length;
  return { lines: lines, total: total, beats: total + 1 };   // +1 break beat
}
function locateVerse(sb) {
  var v = 0, acc = 0, verse = genVerse(0), guard = 0;
  while (sb >= acc + verse.beats && guard++ < 100000) {
    acc += verse.beats; v++; verse = genVerse(v);
  }
  return { verse: verse, v: v, local: sb - acc };
}

/* ---------- interaction ---------- */
var dragging = false, downX = 0, downY = 0, curX = 0, curY = 0, downT = 0, lastTapT = -10;
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; downX = curX = e.clientX; downY = curY = e.clientY; downT = perfNow();
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  curX = e.clientX; curY = e.clientY;
  var nt = clamp(1 + (curX - downX) / 280, 0.4, 2.0);
  if (Math.abs(nt - curTempo()) > 0.04) commitTempo(nt);
});
function endPointer() {
  if (!dragging) return; dragging = false;
  var dx = curX - downX, dy = curY - downY, now = perfNow();
  if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
    commitTempo(clamp(1 + dx / 280, 0.4, 2.0));        // a drag sets the tempo
    lastTapT = -10;
  } else if (now - downT < 0.4) {
    if (now - lastTapT < 0.32) {                        // double-tap: reseed bank
      salt++;
      jumpBeats = -songBeatRaw(pieceNow());
      lastTapT = -10;
    } else {                                            // tap: next verse
      var sb = songBeat(pieceNow());
      var loc = locateVerse(sb);
      var verseEnd = sb - loc.local + loc.verse.beats;
      jumpBeats += verseEnd - sb;
      lastTapT = now;
    }
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

/* ---------- layout ---------- */
function isPhone() {
  var s = window.screen;
  if (s && Math.min(s.width, s.height) < 700) return true;
  return H > W * 1.15;
}
function layout() {
  var phone = isPhone();
  var sw = W * (phone ? 0.94 : 0.65);
  var sh = Math.min(sw * 0.56, H * (phone ? 0.52 : 0.58));
  var sy = H * (phone ? 0.07 : 0.10);
  return {
    sx: (W - sw) / 2, sy: sy, sw: sw, sh: sh,
    waveCy: phone ? sy + sh + H * 0.10 : H * 0.875,
    waveHalf: H * 0.052, waveX: W * 0.06, waveW: W * 0.88
  };
}

/* ---------- drawing helpers ---------- */
function rr(x, y, w, h) { ctx.fillRect(x, y, w, h); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function poly(pts) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fill();
}
function seg2(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

/* ---------- the verse on the screen ---------- */
var ROUND = '700 %SIZE%px "Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Trebuchet MS",Verdana,sans-serif';
function lineLayout(words, cx, y, baseSize, availW) {
  /* returns flat syllable list with centers, scaled so the line fits */
  var flat = [], wi, si;
  for (wi = 0; wi < words.length; wi++)
    for (si = 0; si < words[wi].length; si++)
      flat.push({ s: words[wi][si], w: wi, last: si === words[wi].length - 1 });
  var size = baseSize, k, total;
  for (k = 0; k < 3; k++) {
    ctx.font = ROUND.replace('%SIZE%', size.toFixed(1));
    total = 0;
    for (si = 0; si < flat.length; si++) {
      flat[si].tw = ctx.measureText(flat[si].s).width;
      total += flat[si].tw + (flat[si].last ? size * 0.34 : size * 0.05);
    }
    total -= size * 0.34;
    if (total <= availW || size < 9) break;
    size *= availW / total;
  }
  var x = cx - total / 2;
  for (si = 0; si < flat.length; si++) {
    flat[si].cx = x + flat[si].tw / 2;
    flat[si].cy = y;
    x += flat[si].tw + (flat[si].last ? size * 0.34 : size * 0.05);
  }
  return { flat: flat, size: size };
}
function drawVerse(L, t, sb) {
  var loc = locateVerse(sb);
  var beatIdx = Math.floor(loc.local);
  var frac = loc.local - beatIdx;
  var breaking = beatIdx >= loc.verse.total;
  var baseSize = Math.min(L.sw * 0.082, L.sh * 0.17);
  var y0 = L.sy + L.sh * 0.40, y1 = L.sy + L.sh * 0.68;
  var lay0 = lineLayout(loc.verse.lines[0], L.sx + L.sw / 2, y0, baseSize, L.sw * 0.78);
  var lay1 = lineLayout(loc.verse.lines[1], L.sx + L.sw / 2, y1, baseSize, L.sw * 0.78);
  var flatAll = lay0.flat.concat(lay1.flat);
  var sizeOf = lay0.size;
  var li, si, g = 0;
  ctx.textBaseline = 'middle';
  for (li = 0; li < 2; li++) {
    var lay = li === 0 ? lay0 : lay1;
    ctx.font = ROUND.replace('%SIZE%', lay.size.toFixed(1));
    for (si = 0; si < lay.flat.length; si++, g++) {
      var cell = lay.flat[si];
      if (breaking || g < beatIdx) ctx.fillStyle = 'rgba(242,194,48,0.55)';
      else if (g === beatIdx) ctx.fillStyle = PAL.yellow;
      else ctx.fillStyle = PAL.text;
      if (li === 1 && beatIdx < lay0.flat.length) ctx.globalAlpha = 0.45;
      ctx.fillText(cell.s, cell.cx - cell.tw / 2, cell.cy);
      ctx.globalAlpha = 1;
    }
  }
  if (breaking) {
    /* verse break: one beat of glitch bar */
    var by = L.sy + L.sh * 0.52;
    ctx.fillStyle = 'rgba(214,58,47,0.85)'; rr(L.sx + L.sw * 0.06, by, L.sw * 0.88, L.sh * 0.055);
    ctx.fillStyle = 'rgba(95,168,138,0.7)'; rr(L.sx + L.sw * 0.10, by + L.sh * 0.085, L.sw * 0.72, L.sh * 0.028);
    ctx.fillStyle = 'rgba(245,242,233,0.5)'; rr(L.sx + L.sw * 0.04, by - L.sh * 0.06, L.sw * 0.5, L.sh * 0.02);
  } else {
    /* the bouncing ball, stepped at 12 fps */
    var sf = Math.floor(frac * 12) / 12;
    var cur = flatAll[beatIdx];
    var prev = beatIdx > 0 ? flatAll[beatIdx - 1] : cur;
    var bx = prev.cx + (cur.cx - prev.cx) * sf;
    var byy = prev.cy + (cur.cy - prev.cy) * sf - sizeOf * 0.72 - Math.sin(sf * Math.PI) * sizeOf * 0.38;
    ctx.fillStyle = PAL.yellow;
    circ(bx, byy, Math.max(3.5, sizeOf * 0.21));
  }
}

/* ---------- the whisper crawl ---------- */
function whisperString() {
  var parts = [], i;
  for (i = 0; i < 34; i++) {
    var w = genWord(90210 + salt * 31337, i);
    parts.push(w.join('').toLowerCase());
  }
  return parts.join('  ');
}
function drawWhisper(L, t) {
  var size = clamp(L.sh * 0.032, 9, 15);
  ctx.font = '400 ' + size.toFixed(1) + 'px "Trebuchet MS",Verdana,sans-serif';
  ctx.textBaseline = 'middle';
  var str = whisperString();
  var tw = ctx.measureText(str).width + size * 2.2;
  var off = (t * 9) % tw;
  var y = L.sy + L.sh * 0.86;
  ctx.fillStyle = PAL.whisper;
  var x;
  for (x = L.sx + L.sw - off; x > L.sx - tw; x -= tw) ctx.fillText(str, x, y);
  for (x = L.sx + L.sw - off + tw; x < L.sx + L.sw; x += tw) ctx.fillText(str, x, y);
}

/* ---------- crowd waveform ---------- */
function drawWave(L, t, whisper) {
  var env;
  if (whisper) {
    env = 0.12 * (0.7 + 0.3 * Math.sin(t * 1.7));            // <= 12% of verse peak
  } else {
    var fr = songBeat(t) - Math.floor(songBeat(t));
    env = 0.45 + 0.55 * Math.exp(-3.2 * fr);                 // beat pulse, peak 1.0
  }
  var st = Math.floor(t * 12);
  var x, v, y;
  ctx.beginPath();
  for (x = 0; x <= L.waveW; x += 3) {
    v = Math.sin(x * 0.045 + t * 6.0) * 0.55 + Math.sin(x * 0.013 - t * 3.7) * 0.45;
    v += (ih(Math.floor(x / 3), st) - 0.5) * 0.22;
    y = L.waveCy + v * env * L.waveHalf;
    if (x === 0) ctx.moveTo(L.waveX + x, y); else ctx.lineTo(L.waveX + x, y);
  }
  ctx.strokeStyle = PAL.green; ctx.lineWidth = 2; ctx.stroke();
  ctx.lineTo(L.waveX + L.waveW, L.waveCy + L.waveHalf * 1.6);
  ctx.lineTo(L.waveX, L.waveCy + L.waveHalf * 1.6);
  ctx.closePath();
  ctx.fillStyle = 'rgba(95,168,138,0.16)'; ctx.fill();
  ctx.strokeStyle = 'rgba(95,168,138,0.25)'; ctx.lineWidth = 1;
  seg2(L.waveX, L.waveCy, L.waveX + L.waveW, L.waveCy);
}

/* ---------- curtains ---------- */
function curtain(L, flip, dark) {
  ctx.fillStyle = dark ? PAL.curtainDark : PAL.curtain;
  var x0 = flip ? L.sx + L.sw : L.sx;
  var dir = flip ? -1 : 1;
  var wTop = L.sw * 0.068, wBot = L.sw * 0.034, i, pts = [];
  pts.push(x0, L.sy);
  pts.push(x0 + dir * wTop, L.sy);
  for (i = 1; i <= 6; i++) {
    var yy = L.sy + (L.sh * i) / 6;
    var ww = wTop + (wBot - wTop) * (i / 6) + Math.sin(i * 2.4) * L.sw * 0.008;
    pts.push(x0 + dir * ww, yy);
  }
  pts.push(x0, L.sy + L.sh);
  poly(pts);
  /* valance swag along the top */
  ctx.beginPath();
  ctx.moveTo(L.sx, L.sy);
  var n = 5;
  for (i = 0; i <= n; i++) {
    var xx = L.sx + (L.sw * i) / n;
    var yv = L.sy + (i % 2 === 0 ? L.sh * 0.015 : L.sh * 0.062);
    if (i === 0) ctx.moveTo(xx, L.sy); else ctx.lineTo(xx, yv + L.sh * 0.05);
  }
  ctx.lineTo(L.sx + L.sw, L.sy);
  ctx.closePath(); ctx.fill();
}

/* ---------- main draw ---------- */
function draw(t) {
  if (!W) return;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  var L = layout();
  var whisper = isWhisper(t);
  var blk = Math.floor(t / BLOCK);
  var blkFrac = t - blk * BLOCK;
  var glitching = blkFrac < 0.3 && t > 1;

  ctx.fillStyle = PAL.room; rr(0, 0, W, H);

  /* screen frame */
  var fw = Math.max(6, L.sw * 0.016);
  ctx.fillStyle = PAL.frame;
  rr(L.sx - fw, L.sy - fw, L.sw + fw * 2, L.sh + fw * 2);
  ctx.fillStyle = whisper ? '#0C0B0E' : PAL.screen;
  rr(L.sx, L.sy, L.sw, L.sh);

  /* screen content, clipped */
  ctx.save();
  ctx.beginPath(); ctx.rect(L.sx, L.sy, L.sw, L.sh); ctx.clip();
  var jx = glitching ? (ih(blk, 99) - 0.5) * 14 : 0;
  ctx.save(); ctx.translate(jx, 0);
  if (whisper) drawWhisper(L, t); else drawVerse(L, t, Math.max(0, songBeat(t)));
  ctx.restore();
  if (whisper) { ctx.fillStyle = 'rgba(0,0,0,0.35)'; rr(L.sx, L.sy, L.sw, L.sh); }
  if (glitching) {
    for (var gi = 0; gi < 4; gi++) {
      var gy = L.sy + ih(blk, gi * 7 + 1) * L.sh;
      ctx.fillStyle = gi % 3 === 0 ? 'rgba(214,58,47,0.5)'
                    : gi % 3 === 1 ? 'rgba(95,168,138,0.45)' : 'rgba(245,242,233,0.35)';
      rr(L.sx, gy, L.sw, 2 + ih(blk, gi * 7 + 2) * 8);
    }
  }
  ctx.restore();

  curtain(L, false, whisper);
  curtain(L, true, whisper);

  /* the little indicator dot on the frame, breathing with the beat */
  var pulse = whisper ? 0.3 : 0.55 + 0.45 * Math.exp(-3.2 * (songBeat(t) - Math.floor(songBeat(t))));
  ctx.fillStyle = 'rgba(255,120,105,' + pulse.toFixed(3) + ')';
  circ(L.sx + L.sw - fw * 0.02, L.sy - fw * 0.55, Math.max(2, fw * 0.22));

  drawWave(L, t, whisper);
}

/* ---------- sizing: Visual Viewport API ---------- */
function resize() {
  var vv = window.visualViewport;
  W = Math.floor(vv ? vv.width : window.innerWidth);
  H = Math.floor(vv ? vv.height : window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { resize(); draw(pieceNow()); });
window.addEventListener('resize', function () { resize(); draw(pieceNow()); });

resize();
draw(T0);                                            // synchronous fixed-phase first frame
if (typeof requestAnimationFrame === 'function') {
  var tick = function () {
    draw(pieceNow());
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
