<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Measurement Breaks In</title>
<style>
  html, body { margin: 0; padding: 0; background: #2A3340; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict) ----------
  var FIELD   = '#2A3340';
  var MOON    = '#E8E4D8';
  var TONES   = ['#3A4450', '#46525E', '#525E6C'];
  var NEON    = '#7FD4C1';
  var CRIMSON = '#B03030';

  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  var FIELD_RGB = hexRgb(FIELD), MOON_RGB = hexRgb(MOON), CRIM_RGB = hexRgb(CRIMSON);
  var TONE_RGB = [hexRgb(TONES[0]), hexRgb(TONES[1]), hexRgb(TONES[2])];
  function mix(a, b, t) {
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' +
                    Math.round(a[1] + (b[1] - a[1]) * t) + ',' +
                    Math.round(a[2] + (b[2] - a[2]) * t) + ')';
  }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---------- seeded RNG ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(857018);

  // ---------- model constants ----------
  var COLS = 20, ROWS = 20, NCELL = COLS * ROWS;
  var ANCHOR = 20;                 // spread-clock seconds already elapsed at frame one
  var NEVER_FRAC = 0.08;           // top 8% by shatter time never shatter: the hold
  var DRAG_RADIUS = 0.24;          // in unit space (fractions of min dimension)
  var DRAG_RATE = 30;              // spread-seconds of boost per real second at center

  // QA hook: ?seed=<seconds> overrides the anchor (used for hold-state throwaway renders)
  var seedParam = null;
  try {
    var s = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var m = /seed=([0-9.]+)/.exec(s);
    if (m) seedParam = parseFloat(m[1]);
  } catch (e) {}
  if (seedParam !== null && isFinite(seedParam)) ANCHOR = seedParam;

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 720, H = 720, PHONE = false;

  function resize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 720);
    var h = vv ? vv.height : (window.innerHeight || 720);
    W = Math.max(50, Math.round(w));
    H = Math.max(50, Math.round(h));
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var sw = (typeof window !== 'undefined' && window.screen) ? Math.min(window.screen.width || 9999, window.screen.height || 9999) : 9999;
    PHONE = (sw < 700) || (H > W * 1.15);
    draw(currentSpread());
  }
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    if (window.addEventListener) window.addEventListener('resize', resize);
  }

  // ---------- field generation ----------
  // All geometry in unit space: x in [0, W], y in [0, H] computed per draw from
  // normalized coordinates so resize never regenerates the field.
  var pts = [];        // (COLS+1) x (ROWS+1) jittered grid points, normalized
  var cells = [];      // per-cell data
  var moonC = { x: 0.66, y: 0.25 }, moonR = 0.115; // normalized (x by W, y by H, r by min)
  var generation = 0;

  function generate() {
    generation++;
    var i, j, idx;
    pts = [];
    for (j = 0; j <= ROWS; j++) {
      for (i = 0; i <= COLS; i++) {
        var gx = i / COLS, gy = j / ROWS;
        var jx = 0, jy = 0;
        if (i > 0 && i < COLS) jx = (rng() - 0.5) * 0.62 / COLS;
        else if (i === 0 || i === COLS) jx = 0;
        if (j > 0 && j < ROWS) jy = (rng() - 0.5) * 0.62 / ROWS;
        else if (j === 0 || j === ROWS) jy = 0;
        // edge points slide along their edge only
        if (i === 0 || i === COLS) jx = 0;
        if (j === 0 || j === ROWS) jy = 0;
        pts.push({ x: gx + jx, y: gy + jy });
      }
    }
    // seed point: lower-left region, varies per generation (never the same twice)
    var seed = { x: 0.04 + rng() * 0.12, y: 0.80 + rng() * 0.12 };
    moonC = { x: 0.62 + rng() * 0.10, y: 0.22 + rng() * 0.06 };
    moonR = 0.105 + rng() * 0.02;

    cells = [];
    var maxD = 0;
    var raw = [];
    for (j = 0; j < ROWS; j++) {
      for (i = 0; i < COLS; i++) {
        var cx = 0, cy = 0, k;
        var corners = [j * (COLS + 1) + i, j * (COLS + 1) + i + 1, (j + 1) * (COLS + 1) + i + 1, (j + 1) * (COLS + 1) + i];
        for (k = 0; k < 4; k++) { cx += pts[corners[k]].x; cy += pts[corners[k]].y; }
        cx /= 4; cy /= 4;
        var dx = cx - seed.x, dy = cy - seed.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d > maxD) maxD = d;
        raw.push({ i: i, j: j, cx: cx, cy: cy, d: d, noise: rng(), tone: Math.floor(rng() * 3) });
      }
    }
    for (idx = 0; idx < NCELL; idx++) {
      var r = raw[idx];
      var dn = r.d / maxD;
      // moon resistance: cells under the moon shatter late; the core latest of all
      var mdx = (r.cx - moonC.x), mdy = (r.cy - moonC.y);
      var md = Math.sqrt(mdx * mdx + mdy * mdy) / moonR; // in moon radii (aspect-approx)
      var moonBoost = 0;
      var inMoon = md < 1.05;
      if (md < 1.3) moonBoost = 34 * (1.3 - md) / 1.3 + (md < 0.55 ? 46 : 0);
      // decelerating front: fast early, slow late (dn^2.2), so frame one
      // (spread t=20) already shows ~15% coverage while the full spread
      // still takes ~3 minutes to reach the hold
      var start = 150 * Math.pow(dn, 2.2) + r.noise * 12 + moonBoost;
      cells.push({
        i: r.i, j: r.j, cx: r.cx, cy: r.cy,
        start: start,
        dur: 5 + r.noise * 4,
        tone: r.tone,
        inMoon: inMoon,
        boost: 0,
        frozenEff: -1,       // spread-time at which progress froze; -1 = not frozen
        crimson: false,
        never: false
      });
    }
    // the hold: the top NEVER_FRAC by start time never shatter
    var order = cells.slice().sort(function (a, b) { return a.start - b.start; });
    var nNever = Math.round(NCELL * NEVER_FRAC);
    for (idx = NCELL - nNever; idx < NCELL; idx++) order[idx].never = true;
    // crimson donor thread: a seeded cell inside the early patch (never the same place twice)
    var early = [];
    for (idx = 0; idx < NCELL; idx++) {
      if (!cells[idx].never && cells[idx].start > 3 && cells[idx].start < 13) early.push(cells[idx]);
    }
    if (early.length) early[Math.floor(rng() * early.length)].crimson = true;
  }

  // ---------- time ----------
  var epoch = 0; // performance clock origin (ms), reset on reseed
  function nowSec() {
    if (typeof performance !== 'undefined' && performance.now) return performance.now() / 1000;
    return Date.now() / 1000;
  }
  epoch = nowSec();
  function currentSpread() { return ANCHOR + (nowSec() - epoch); }

  function cellProgress(c, S) {
    if (c.never) return 0;
    var eff = S + c.boost;
    if (c.frozenEff >= 0 && eff > c.frozenEff) eff = c.frozenEff;
    return clamp((eff - c.start) / c.dur, 0, 1);
  }

  // ---------- interaction state ----------
  var pointer = { down: false, x: 0, y: 0, lastMoveT: 0, downT: 0, downX: 0, downY: 0, moved: 0 };
  var lastTapT = -10, lastTapX = 0, lastTapY = 0;

  function toUnit(px, py) {
    var mn = Math.min(W, H);
    return { x: px / W, y: py / H, mx: px / mn, my: py / mn };
  }
  function cellAt(ux, uy) {
    var best = null, bd = 1e9;
    for (var k = 0; k < NCELL; k++) {
      var c = cells[k];
      var dx = c.cx - ux, dy = c.cy - uy;
      var d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = c; }
    }
    return best;
  }

  function ensureAudio() {
    if (audio.ctx) { if (audio.ctx.resume) audio.ctx.resume(); return; }
    var AC = (typeof AudioContext !== 'undefined') ? AudioContext :
             (typeof webkitAudioContext !== 'undefined') ? webkitAudioContext : null;
    if (!AC) return;
    try {
      audio.ctx = new AC();
      audio.master = audio.ctx.createGain();
      audio.master.gain.value = 0.5;
      audio.master.connect(audio.ctx.destination);
      audio.lastTickS = currentSpread();
      if (typeof setInterval !== 'undefined') {
        audio.timer = setInterval(tickScheduler, 90);
      }
    } catch (e) { audio.ctx = null; }
  }

  function onDown(e) {
    ensureAudio();
    var p = eventPos(e);
    pointer.down = true;
    pointer.x = p.x; pointer.y = p.y;
    pointer.downX = p.x; pointer.downY = p.y;
    pointer.moved = 0;
    pointer.downT = nowSec();
    pointer.lastMoveT = pointer.downT;
  }
  function onMove(e) {
    if (!pointer.down) return;
    var p = eventPos(e);
    var t = nowSec();
    var dt = Math.min(0.06, Math.max(0, t - pointer.lastMoveT));
    pointer.lastMoveT = t;
    pointer.moved += Math.abs(p.x - pointer.x) + Math.abs(p.y - pointer.y);
    pointer.x = p.x; pointer.y = p.y;
    if (dt <= 0) return;
    // drag = the measurement point: nearby cells gain spread-time
    var mn = Math.min(W, H);
    var ux = p.x / mn, uy = p.y / mn;
    for (var k = 0; k < NCELL; k++) {
      var c = cells[k];
      var cxu = c.cx * W / mn, cyu = c.cy * H / mn;
      var dx = cxu - ux, dy = cyu - uy;
      var d = Math.sqrt(dx * dx + dy * dy);
      // distance is in min-dimension units (positions scaled by 1/mn of pixels)
      if (d < DRAG_RADIUS) {
        var fall = 1 - d / DRAG_RADIUS;
        c.boost += dt * DRAG_RATE * fall * fall;
      }
    }
    draw(currentSpread());
  }
  function onUp(e) {
    if (!pointer.down) return;
    pointer.down = false;
    var t = nowSec();
    var p = eventPos(e);
    var quick = (t - pointer.downT) < 0.28;
    var still = pointer.moved < 7;
    if (quick && still) {
      // tap: double-tap reseeds, single tap freezes the tapped cell
      var dbl = (t - lastTapT) < 0.32 && Math.abs(p.x - lastTapX) < 30 && Math.abs(p.y - lastTapY) < 30;
      lastTapT = t; lastTapX = p.x; lastTapY = p.y;
      if (dbl) {
        generate();
        epoch = nowSec();
        if (audio.ctx) audio.lastTickS = currentSpread();
        lastTapT = -10;
      } else {
        var c = cellAt(p.x / W, p.y / H);
        if (c && !c.never && c.frozenEff < 0) {
          c.frozenEff = currentSpread() + c.boost;
        }
      }
    }
    draw(currentSpread());
  }
  function eventPos(e) {
    if (e && typeof e.clientX === 'number') return { x: e.clientX, y: e.clientY };
    if (e && e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e && e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: pointer.x, y: pointer.y };
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointerup', onUp);
  }

  // ---------- audio: granular ticks on threshold crossings ----------
  var audio = { ctx: null, master: null, timer: null, lastTickS: 0 };
  function tickScheduler() {
    if (!audio.ctx) return;
    var S = currentSpread();
    var ahead = S + 0.18;
    for (var k = 0; k < NCELL; k++) {
      var c = cells[k];
      if (c.never || c.frozenEff >= 0) continue;
      var cross = c.start - c.boost;
      if (cross > audio.lastTickS && cross <= ahead) {
        playTick(audio.ctx.currentTime + Math.max(0, cross - S));
      }
    }
    audio.lastTickS = ahead;
  }
  function playTick(when) {
    var ac = audio.ctx;
    if (!ac) return;
    try {
      var o = ac.createOscillator();
      var g = ac.createGain();
      o.type = 'square';
      o.frequency.value = 1500 + (Math.random() * 700); // audio-only jitter, never drawn
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(0.06, when + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, when + 0.045);
      o.connect(g); g.connect(audio.master);
      o.start(when); o.stop(when + 0.06);
    } catch (e) {}
  }

  // ---------- draw ----------
  function draw(S) {
    var mn = Math.min(W, H);
    ctx.fillStyle = FIELD;
    ctx.fillRect(0, 0, W, H);

    // moon (drawn under the cell layer; unshattered moon cells stay transparent)
    var mx = moonC.x * W, my = moonC.y * H, mr = moonR * mn;
    ctx.fillStyle = MOON;
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, Math.PI * 2);
    ctx.fill();
    // faint flat maria, palette-internal mixes only
    ctx.fillStyle = 'rgba(42,51,64,0.16)';
    ctx.beginPath(); ctx.arc(mx - mr * 0.30, my - mr * 0.18, mr * 0.20, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + mr * 0.24, my + mr * 0.30, mr * 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + mr * 0.05, my - mr * 0.48, mr * 0.11, 0, Math.PI * 2); ctx.fill();

    // drag proximity for edge brightening (live state only; absent in frame one)
    var pux = 0, puy = 0, hasP = false;
    if (pointer.down) {
      pux = pointer.x / mn; puy = pointer.y / mn; hasP = true;
    }

    var ci, c, k;
    // fills
    for (ci = 0; ci < NCELL; ci++) {
      c = cells[ci];
      var p = cellProgress(c, S);
      if (p <= 0) continue;
      var e = smooth(p);
      var target = c.crimson ? CRIM_RGB : TONE_RGB[c.tone];
      ctx.fillStyle = mix(FIELD_RGB, target, e);
      ctx.globalAlpha = c.inMoon ? e : 1;
      cellPath(c);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // edges past 50% personal progress
    ctx.lineWidth = Math.max(1, mn / 560);
    for (ci = 0; ci < NCELL; ci++) {
      c = cells[ci];
      var p2 = cellProgress(c, S);
      if (p2 <= 0.5) continue;
      var a = (p2 - 0.5) * 2;
      var bright = 0.62;
      if (hasP) {
        var dx = c.cx * W / mn - pux, dy = c.cy * H / mn - puy;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < DRAG_RADIUS) bright = 0.62 + 0.38 * (1 - d / DRAG_RADIUS);
      }
      ctx.strokeStyle = NEON;
      ctx.globalAlpha = a * bright;
      cellPath(c);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // frozen markers: small ring at the held cell centroid
    ctx.strokeStyle = NEON;
    ctx.lineWidth = Math.max(1, mn / 640);
    for (ci = 0; ci < NCELL; ci++) {
      c = cells[ci];
      if (c.frozenEff < 0) continue;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.arc(c.cx * W, c.cy * H, mn * 0.012, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  function cellPath(c) {
    var stride = COLS + 1;
    var idxs = [c.j * stride + c.i, c.j * stride + c.i + 1, (c.j + 1) * stride + c.i + 1, (c.j + 1) * stride + c.i];
    ctx.beginPath();
    for (var k = 0; k < 4; k++) {
      var pt = pts[idxs[k]];
      if (k === 0) ctx.moveTo(pt.x * W, pt.y * H);
      else ctx.lineTo(pt.x * W, pt.y * H);
    }
    ctx.closePath();
  }

  // ---------- run ----------
  generate();
  resize();
  draw(ANCHOR); // frame one: synchronous, at the fixed anchor phase
  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(currentSpread());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
