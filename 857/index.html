<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№857 Process Commentary</title>
<style>
  html, body { margin: 0; padding: 0; background: #262021; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №857 Process Commentary, CK3 / PP1257, study #262 colton-kempf.
  // A frame builds itself one narrated pass at a time and the
  // narration never gets mixed out. TAP advances the next build
  // pass: hum, dusk gradient, contrail, figure. Each pass adds
  // exactly one element and one caption line; earlier lines stay
  // stacked at the bottom, dimmer but legible. Audio is visual
  // only in this gallery: there is no real WebAudio here, the
  // caption lines ARE the voice.
  var GROUND = '#262021'; // page ground, the warm dark of the empty frame

  // Fixed-phase first frame: FIRST_T = 12 s into a 90 s cycle.
  // Gradient shimmer and contrail drift are closed-form functions
  // of t, so frame one is fully deterministic. A tap starts a
  // pass transition; its progress is a closed-form function of t
  // and the tap time, so a fixed tap sequence is reproducible too.
  var FIRST_T = 12;
  var CYCLE = 90;
  var TRANS = 2.5; // seconds for a pass to fade or draw itself in
  var SEED = 857;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function lerp(a, b, f) { return a + (b - a) * f; }
  function lerpC(c1, c2, f) {
    return [lerp(c1[0], c2[0], f), lerp(c1[1], c2[1], f), lerp(c1[2], c2[2], f)];
  }
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palette: one dusk gradient, one contrail, one silhouette.
  var EMPTY = [38, 32, 33];       // warm dark of the empty frame
  var HUM = [201, 169, 143];      // faint warm hum line
  var ROSE_A = [224, 138, 126];   // dusk gradient, rose end (shimmer low)
  var ROSE_B = [232, 164, 138];   // dusk gradient, rose end (shimmer high)
  var MAUVE_A = [122, 90, 126];
  var MAUVE_B = [138, 104, 132];
  var BLUE_A = [30, 42, 74];      // dusk gradient, deep blue end (shimmer low)
  var BLUE_B = [38, 54, 92];      // dusk gradient, deep blue end (shimmer high)
  var GROUND_DARK = [23, 19, 26]; // ground below the horizon
  var CONTRAIL = [244, 240, 232];
  var FIGURE = [15, 12, 16];      // the one silhouette
  var CAPTION = [242, 230, 218];
  var HINT = [242, 230, 218];

  // ---- Pass state ------------------------------------------------------
  // pass 0 hum, 1 gradient, 2 contrail, 3 figure. TAP advances one
  // pass and wraps 3 back to 0. transitionStart is the virtual time
  // of the latest tap; pass 0 starts fully present at load.
  var pass = 0;
  var transitionStart = FIRST_T - TRANS;
  var LINES = [
    'The hum starts here.',
    'I am laying the dusk gradient in now.',
    'The contrail goes here.',
    'The figure stands here, and I leave it alone.'
  ];
  function passProgress(p, t) {
    if (p > pass) { return 0; }
    if (p < pass) { return 1; }
    return smooth((t - transitionStart) / TRANS);
  }
  function advancePass(t) {
    pass = (pass + 1) % 4;
    transitionStart = t;
  }

  var HORIZON = 0.72; // horizon fraction of stage height

  var L = {};
  function layout() {
    L.fsCap = Math.round(clamp(W * 0.020, 11, 15));
    L.fsDate = Math.round(clamp(W * 0.016, 9, 12));
    L.fsHint = Math.round(clamp(W * 0.022, 12, 16));
    L.fsLine = Math.round(clamp(W * 0.021, 12, 16));
    L.lineH = L.fsLine * 1.55;
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  function X(f) { return f * W; }
  function Y(f) { return f * H; }

  // Shimmer factor: slow closed-form drift over the 90 s cycle.
  function shimmer(t) {
    return 0.5 + 0.5 * Math.sin(2 * Math.PI * (t - FIRST_T) / CYCLE);
  }

  // ---- Pass 0: the hum line --------------------------------------------
  function drawHum(t) {
    var p = passProgress(0, t);
    if (p <= 0) { return; }
    var pulse = 0.22 + 0.16 * Math.sin(2 * Math.PI * (t - FIRST_T) / 7);
    // The hum line drifts a few pixels up and down over the cycle,
    // so the empty frame is alive even before the first tap.
    var y = Y(0.42 + 0.005 * Math.sin(2 * Math.PI * (t - FIRST_T) / CYCLE));
    ctx.strokeStyle = rgba(HUM, a4(pulse * p));
    ctx.lineWidth = Math.max(1, W * 0.0016);
    ctx.beginPath();
    ctx.moveTo(X(0.10), y);
    ctx.lineTo(X(0.90), y);
    ctx.stroke();
    // A faint second harmonic, barely there.
    ctx.strokeStyle = rgba(HUM, a4(0.06 * p));
    ctx.beginPath();
    ctx.moveTo(X(0.10), y + H * 0.012);
    ctx.lineTo(X(0.90), y + H * 0.012);
    ctx.stroke();
  }

  // ---- Pass 1: the dusk gradient ----------------------------------------
  function drawGradient(t) {
    var p = passProgress(1, t);
    if (p <= 0) { return; }
    var s = shimmer(t);
    var rose = lerpC(ROSE_A, ROSE_B, s);
    var mauve = lerpC(MAUVE_A, MAUVE_B, s);
    var blue = lerpC(BLUE_A, BLUE_B, s);
    var hy = Y(HORIZON);
    var g = ctx.createLinearGradient(0, 0, 0, hy);
    g.addColorStop(0, rgba(rose, a4(p)));
    g.addColorStop(0.55, rgba(mauve, a4(p)));
    g.addColorStop(1, rgba(blue, a4(p)));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, hy);
    // Ground below the horizon, dark and still.
    ctx.fillStyle = rgba(GROUND_DARK, a4(p));
    ctx.fillRect(0, hy, W, H - hy);
    // Horizon line.
    ctx.fillStyle = rgba(CONTRAIL, a4(0.28 * p));
    ctx.fillRect(0, hy, W, Math.max(1, H * 0.0015));
    // A slow shimmer band drifting across the sky, never a flash.
    var bandY = Y(0.30 + 0.06 * Math.sin(2 * Math.PI * (t - FIRST_T) / CYCLE + 1.2));
    var bg = ctx.createLinearGradient(0, bandY - H * 0.05, 0, bandY + H * 0.05);
    bg.addColorStop(0, rgba(rose, 0));
    bg.addColorStop(0.5, rgba(rose, a4(0.10 * p)));
    bg.addColorStop(1, rgba(rose, 0));
    ctx.fillStyle = bg;
    ctx.fillRect(0, bandY - H * 0.05, W, H * 0.10);
  }

  // ---- Pass 2: the contrail ----------------------------------------------
  // One slow arc across the sky. It grows along its path over the
  // cycle: drawn length breathes between 55% and 100% of the arc.
  function contrailPoints(t) {
    var drift = 0.012 * Math.sin(2 * Math.PI * (t - FIRST_T) / CYCLE + 0.6);
    return {
      x0: 0.10, y0: 0.34,
      cx: 0.50, cy: 0.10 + drift,
      x1: 0.90, y1: 0.30
    };
  }
  function contrailPointAt(q, t) {
    var c = contrailPoints(t);
    var u = 1 - q;
    return {
      x: u * u * c.x0 + 2 * u * q * c.cx + q * q * c.x1,
      y: u * u * c.y0 + 2 * u * q * c.cy + q * q * c.y1
    };
  }
  function contrailLength(t) {
    return 0.775 + 0.225 * Math.sin(2 * Math.PI * (t - FIRST_T) / CYCLE + 2.0);
  }
  function drawContrail(t) {
    var p = passProgress(2, t);
    if (p <= 0) { return; }
    var len = clamp(contrailLength(t) * p, 0, 1);
    if (len <= 0.01) { return; }
    var c = contrailPoints(t);
    var steps = 48;
    var n = Math.max(2, Math.floor(steps * len));
    // Soft glow first, then the crisp line.
    var lw = Math.max(1, W * 0.004);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = rgba(CONTRAIL, a4(0.18 * p));
    ctx.lineWidth = lw * 3.2;
    ctx.beginPath();
    var i, pt;
    for (i = 0; i <= n; i++) {
      pt = contrailPointAt(i / steps, t);
      if (i === 0) { ctx.moveTo(X(pt.x), Y(pt.y)); }
      else { ctx.lineTo(X(pt.x), Y(pt.y)); }
    }
    ctx.stroke();
    ctx.strokeStyle = rgba(CONTRAIL, a4(0.92 * p));
    ctx.lineWidth = lw;
    ctx.beginPath();
    for (i = 0; i <= n; i++) {
      pt = contrailPointAt(i / steps, t);
      if (i === 0) { ctx.moveTo(X(pt.x), Y(pt.y)); }
      else { ctx.lineTo(X(pt.x), Y(pt.y)); }
    }
    ctx.stroke();
  }

  // ---- Pass 3: the figure ---------------------------------------------------
  // One dark silhouette standing on the horizon. Abstract, no face:
  // head, shoulders, torso, two legs, still.
  function drawFigure(t) {
    var p = passProgress(3, t);
    if (p <= 0) { return; }
    var fx = X(0.62);
    var hy = Y(HORIZON);
    var fh = H * 0.105; // figure height
    var sway = W * 0.0012 * Math.sin(2 * Math.PI * (t - FIRST_T) / CYCLE + 0.9);
    ctx.fillStyle = rgba(FIGURE, a4(p));
    // Head.
    ctx.beginPath();
    ctx.moveTo(fx + sway + W * 0.013, hy - fh * 0.86);
    ctx.arc(fx + sway, hy - fh * 0.86, W * 0.013, 0, Math.PI * 2);
    ctx.fill();
    // Torso: shoulders to hips, slightly tapered.
    ctx.beginPath();
    ctx.moveTo(fx + sway - W * 0.020, hy - fh * 0.72);
    ctx.lineTo(fx + sway + W * 0.020, hy - fh * 0.72);
    ctx.lineTo(fx + sway + W * 0.014, hy - fh * 0.34);
    ctx.lineTo(fx + sway - W * 0.014, hy - fh * 0.34);
    ctx.closePath();
    ctx.fill();
    // Legs.
    ctx.beginPath();
    ctx.moveTo(fx + sway - W * 0.013, hy - fh * 0.34);
    ctx.lineTo(fx + sway - W * 0.002, hy - fh * 0.34);
    ctx.lineTo(fx + sway - W * 0.004, hy);
    ctx.lineTo(fx + sway - W * 0.015, hy);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(fx + sway + W * 0.002, hy - fh * 0.34);
    ctx.lineTo(fx + sway + W * 0.013, hy - fh * 0.34);
    ctx.lineTo(fx + sway + W * 0.015, hy);
    ctx.lineTo(fx + sway + W * 0.004, hy);
    ctx.closePath();
    ctx.fill();
    // A long soft shadow on the ground, away from the dusk light.
    ctx.fillStyle = rgba(FIGURE, a4(0.45 * p));
    ctx.beginPath();
    ctx.moveTo(fx + sway - W * 0.012, hy);
    ctx.lineTo(fx + sway + W * 0.012, hy);
    ctx.lineTo(fx + sway + W * 0.075, hy + H * 0.012);
    ctx.lineTo(fx + sway + W * 0.055, hy + H * 0.012);
    ctx.closePath();
    ctx.fill();
  }

  // ---- Caption plate, caption track, hint ----------------------------------
  function drawText(t) {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(CAPTION, a4(0.9));
    ctx.font = '600 ' + L.fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№857 · Process Commentary', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(CAPTION, a4(0.6));
    ctx.font = L.fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 17', W * 0.04, H * 0.055 + L.fsDate + 6);
    // Caption track: every line that has been spoken stays, stacked
    // at the bottom. The current line is brightest; earlier lines
    // are dimmer but legible. The making-of never gets mixed out.
    ctx.font = L.fsLine + 'px Georgia, "Times New Roman", serif';
    var bottom = H - L.fsHint * 2.6;
    var i, a;
    for (i = 0; i <= pass; i++) {
      var prog = passProgress(i, t);
      if (prog <= 0) { continue; }
      a = (i === pass) ? 0.95 : 0.55;
      ctx.fillStyle = rgba(CAPTION, a4(a * prog));
      ctx.fillText(LINES[i], W * 0.04, bottom - (pass - i) * L.lineH);
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = rgba(HINT, a4(0.85));
    ctx.font = L.fsHint + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Tap to add the next pass.', W / 2, H - L.fsHint * 0.9);
    ctx.textAlign = 'left';
  }

  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // The empty frame first, then each pass layered on top.
    drawHum(t);
    drawGradient(t);
    drawContrail(t);
    drawFigure(t);
    // Soft vignette, never HDR.
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45,
      W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, rgba([10, 8, 12], 0));
    vg.addColorStop(1, rgba([10, 8, 12], a4(0.14)));
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    drawText(t);
  }

  // ---- Tap: advance one pass, wrap 3 back to 0 ---------------------------
  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      try { if (e && typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
      advancePass(lastT);
      draw(lastT);
    });
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece857 exposes pass state and per-pass progress.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece857 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      pass: function () { return pass; },
      tap: function (t) { advancePass(typeof t === 'number' ? t : lastT); },
      passProgress: function (p, t) { return passProgress(p, t); },
      lines: function () { return LINES.slice(0, pass + 1); },
      shimmer: function (t) { return shimmer(t); },
      contrailLength: function (t) { return contrailLength(t); },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: 90 s shimmer and drift cycle, closed-form. Guarded
  // so node-canvas QA (no requestAnimationFrame) works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
