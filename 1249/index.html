<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Held Empty Frame</title>
<style>
  html, body { margin: 0; padding: 0; background: #E8C9A0; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* No.1249 "Held Empty Frame" - Jenna Maurice study block JM2.
   After Maurice's Concerning the Landscape (2012-14): the camera
   holds a still golden-hour scene for a long time before anyone
   enters. A low sun, a grass field, one tree at the right third -
   and for forty seconds, near-nothing: a heat shimmer you can
   barely see, one blade of grass that twitches now and then.
   Then a small distant figure walks in from the left, crosses to
   the tree, leans into it, stays a while, and leaves. The field
   returns to stillness. Tap skips the hold to the entry; drag
   scrubs the figure along its walk. No birds, no rushing clouds,
   no camera move - the emptiness is the piece. Silent; flat
   layered shapes; seeded hashes only. */

var T0 = 20;                   // fixed first-frame phase: mid-hold, empty field
var HOLD = 40, WALK_IN = 14, LEAN = 6, WALK_OUT = 14;
var CYCLE = HOLD + WALK_IN + LEAN + WALK_OUT;   // 74 s
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;

var PAL = {
  sky: '#E8C9A0',              // sky blush
  sun: '#D9A441',              // golden-hour amber
  olive: '#7A7A3A',            // field olive
  oliveFar: '#8A8A4E',
  oliveNear: '#68682E',
  clump: '#5C5C2A',
  blade: '#4E4E24',
  indigo: '#3B3B5E',           // shadow indigo
  canopy: '#4C4C36',
  canopyHi: '#5E5E3C',
  trunk: '#3A3128',
  figure: '#2A2320'
};

/* ---------- seeded hash (integer, deterministic) ---------- */
function ih(a, b) {
  var x = ((a | 0) * 374761393 + (b | 0) * 668265263) >>> 0;
  x = Math.imul(x ^ (x >>> 13), 1274126177) >>> 0;
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, u) { return a + (b - a) * u; }

/* ---------- time ---------- */
function perfNow() {
  return (typeof performance !== 'undefined' && performance.now) ? performance.now() / 1000 : 0;
}
var startPerf = perfNow();
var phaseSkip = 0;             // tap-to-entry accumulates here
function pieceNow() { return T0 + (perfNow() - startPerf) + phaseSkip; }

/* ---------- state (interaction is recorded, never integrated) ---------- */
var scrubDX = 0;               // drag offset along the walk path, px

/* ---------- layout ---------- */
function isPhone() {
  var s = window.screen;
  if (s && Math.min(s.width, s.height) < 700) return true;
  return H > W * 1.15;
}
function layout() {
  var horizon = H * 0.44;
  var groundY = H * 0.80;      // the figure's walking line; tree stands here too
  var treeX = W * 0.74;
  return {
    phone: isPhone(),
    horizon: horizon,
    groundY: groundY,
    treeX: treeX,
    sunX: W * 0.90,
    sunY: horizon - H * 0.035,
    sunR: H * 0.046,
    figH: H * 0.05
  };
}

/* ---------- drawing helpers (every shape opens its own path:
   node-canvas joins batched subpaths otherwise) ---------- */
function rect(x, y, w, h) { ctx.fillRect(x, y, w, h); }
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function poly(pts) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (var i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fill();
}

/* ---------- cycle phase ---------- */
function phaseOf(t) {
  var p = t % CYCLE;
  if (p < 0) p += CYCLE;
  if (p < HOLD) return { kind: 'hold', u: p / HOLD, p: p };
  p -= HOLD;
  if (p < WALK_IN) return { kind: 'in', u: p / WALK_IN, p: p };
  p -= WALK_IN;
  if (p < LEAN) return { kind: 'lean', u: p / LEAN, p: p };
  p -= LEAN;
  return { kind: 'out', u: p / WALK_OUT, p: p };
}

/* ---------- heat shimmer: three mid-field bands, +/-1 px ---------- */
function shimmerDX(y, t) {
  var bands = [0.55, 0.645, 0.74], k;
  for (k = 0; k < 3; k++) {
    if (Math.abs(y - bands[k] * H) < H * 0.028) {
      return Math.round(Math.sin(t * 0.30 + k * 1.7));
    }
  }
  return 0;
}

/* ---------- the landscape (flat layered shapes) ---------- */
function drawLandscape(t) {
  var L = layout();

  /* sky */
  ctx.fillStyle = PAL.sky; rect(0, 0, W, H);

  /* sun: flat amber disc, two flat alpha halo rings */
  ctx.globalAlpha = 0.10; ctx.fillStyle = PAL.sun;
  circ(L.sunX, L.sunY, L.sunR * 2.7);
  ctx.globalAlpha = 0.20;
  circ(L.sunX, L.sunY, L.sunR * 1.65);
  ctx.globalAlpha = 1;
  ctx.fillStyle = PAL.sun;
  circ(L.sunX, L.sunY, L.sunR);

  /* far hill band: indigo wash ridge */
  var i, x, y;
  ctx.fillStyle = PAL.indigo; ctx.globalAlpha = 0.26;
  ctx.beginPath(); ctx.moveTo(0, L.horizon);
  for (i = 0; i <= 14; i++) {
    x = (i / 14) * W;
    y = L.horizon - H * 0.085 + (ih(1249, i * 3 + 1) - 0.5) * H * 0.022 - Math.sin(i * 0.9) * H * 0.012;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, L.horizon); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;

  /* near hill band: olive ridge, sits lower */
  ctx.fillStyle = PAL.olive; ctx.globalAlpha = 0.55;
  ctx.beginPath(); ctx.moveTo(0, L.horizon);
  for (i = 0; i <= 14; i++) {
    x = (i / 14) * W;
    y = L.horizon - H * 0.038 + (ih(1249, i * 3 + 61) - 0.5) * H * 0.016 + Math.sin(i * 0.7 + 2) * H * 0.008;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, L.horizon); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;

  /* field: three flat olive bands, lighter far, darker near */
  ctx.fillStyle = PAL.oliveFar; rect(0, L.horizon, W, H * 0.16);
  ctx.fillStyle = PAL.olive;    rect(0, L.horizon + H * 0.16, W, H * 0.20);
  ctx.fillStyle = PAL.oliveNear; rect(0, L.horizon + H * 0.36, W, H - (L.horizon + H * 0.36));
  /* golden wash over the far field */
  ctx.fillStyle = PAL.sun; ctx.globalAlpha = 0.10;
  rect(0, L.horizon, W, H * 0.16);
  ctx.globalAlpha = 1;

  /* shimmer strips: faint blush bands that drift a single pixel */
  ctx.fillStyle = PAL.sky;
  var sb;
  for (sb = 0; sb < 3; sb++) {
    var sy = [0.55, 0.645, 0.74][sb] * H;
    ctx.globalAlpha = 0.05;
    rect(shimmerDX(sy, t), sy - H * 0.026, W, H * 0.052);
  }
  ctx.globalAlpha = 1;

  drawShadowsAndClumps(L);
  drawGrass(t, L);
  drawTree(L);
}

/* long shadows stretch left, away from the low right-hand sun */
function drawShadowsAndClumps(L) {
  var i, cx, cy, s;
  ctx.fillStyle = PAL.indigo;
  for (i = 0; i < 14; i++) {
    cx = ih(1249, i * 5 + 201) * W;
    cy = L.horizon + H * 0.06 + ih(1249, i * 5 + 202) * (H * 0.44);
    s = 0.35 + ((cy - L.horizon) / (H * 0.5)) * 0.9;   // nearer = bigger
    /* shadow first: thin wedge running left */
    ctx.globalAlpha = 0.16;
    poly([cx - L.sunR * 0.4 * s, cy,
          cx - W * (0.05 + ih(1249, i * 5 + 203) * 0.07) * s, cy + H * 0.006 * s,
          cx - W * (0.05 + ih(1249, i * 5 + 203) * 0.07) * s, cy + H * 0.016 * s,
          cx + L.sunR * 0.4 * s, cy + H * 0.010 * s]);
    ctx.globalAlpha = 1;
    /* the clump itself */
    ctx.fillStyle = PAL.clump;
    ell(cx, cy, W * 0.011 * s, H * 0.008 * s);
    ell(cx - W * 0.007 * s, cy + H * 0.002 * s, W * 0.007 * s, H * 0.005 * s);
    ctx.fillStyle = PAL.indigo;
  }
}

function drawGrass(t, L) {
  var i, u, v, x, y, persp, len, dx;
  ctx.fillStyle = PAL.blade;
  var N = 720;
  for (i = 0; i < N; i++) {
    u = ih(1249, i * 7 + 301);
    v = ih(1249, i * 7 + 302);
    x = u * W;
    y = L.horizon + H * 0.015 + Math.pow(v, 0.62) * (H - L.horizon - H * 0.03);
    persp = (y - L.horizon) / (H - L.horizon);
    len = 2 + persp * H * 0.016;
    dx = shimmerDX(y, t);
    ctx.globalAlpha = 0.35 + ih(1249, i * 7 + 303) * 0.4;
    rect(x + dx, y - len, Math.max(1, persp * 2.2), len);
  }
  ctx.globalAlpha = 1;
  /* a few tall foreground blades, lower corners */
  ctx.fillStyle = PAL.blade;
  for (i = 0; i < 26; i++) {
    x = ih(1249, i * 5 + 401) * W;
    y = H - ih(1249, i * 5 + 402) * H * 0.05;
    len = H * (0.03 + ih(1249, i * 5 + 403) * 0.035);
    ctx.globalAlpha = 0.8;
    poly([x, y, x + len * 0.16, y - len, x + len * 0.16 + 2.2, y - len + 2, x + 2.2, y]);
  }
  ctx.globalAlpha = 1;
  drawTwitchBlade(t, L);
}

/* ONE blade of grass twitches: a two-frame bend, ~0.3 s every ~7 s.
   At T0 = 20 it is at rest: (20 - 2.3) mod 7 = 3.7 s into its period. */
function drawTwitchBlade(t, L) {
  var bx = W * 0.36, by = H * 0.925, bh = H * 0.055;
  var cyc = (t - 2.3) % 7; if (cyc < 0) cyc += 7;
  var bend = 0;
  if (cyc < 0.3) {
    var step = Math.floor(t * 12) % 2;         // two-frame flick of the tip
    bend = (step === 0 ? 1 : -0.6) * bh * 0.38;
  }
  ctx.fillStyle = PAL.blade; ctx.globalAlpha = 0.95;
  poly([bx - 1.8, by, bx + bend, by - bh, bx + bend + 2.4, by - bh + 3, bx + 1.8, by]);
  ctx.globalAlpha = 1;
}

function drawTree(L) {
  var tx = L.treeX, gy = L.groundY;
  /* long shadow first */
  ctx.fillStyle = PAL.indigo; ctx.globalAlpha = 0.20;
  poly([tx - W * 0.006, gy - H * 0.004,
        tx - W * 0.335, gy + H * 0.010,
        tx - W * 0.335, gy + H * 0.026,
        tx + W * 0.006, gy + H * 0.006]);
  ctx.globalAlpha = 1;
  /* trunk, slight taper, one low branch */
  ctx.fillStyle = PAL.trunk;
  poly([tx - W * 0.0075, gy, tx - W * 0.0045, gy - H * 0.27,
        tx + W * 0.0045, gy - H * 0.27, tx + W * 0.0075, gy]);
  poly([tx, gy - H * 0.17, tx - W * 0.045, gy - H * 0.235,
        tx - W * 0.041, gy - H * 0.248, tx + W * 0.002, gy - H * 0.185]);
  /* canopy: flat blobby cluster, indigo-olive */
  var blobs = [
    [0, -0.335, 0.072, 0.052, 0], [-0.052, -0.315, 0.05, 0.04, 1],
    [0.055, -0.318, 0.052, 0.042, 0], [-0.028, -0.362, 0.048, 0.038, 1],
    [0.034, -0.36, 0.046, 0.036, 0], [0.002, -0.30, 0.055, 0.034, 1],
    [-0.075, -0.335, 0.034, 0.028, 0], [0.08, -0.34, 0.032, 0.027, 1]
  ];
  var i, b;
  for (i = 0; i < blobs.length; i++) {
    b = blobs[i];
    ctx.fillStyle = b[4] === 0 ? PAL.canopy : PAL.canopyHi;
    ell(tx + b[0] * W, gy + b[1] * H, b[2] * W, b[3] * H);
  }
}

/* ---------- the figure ----------
   Local space: origin at the feet, facing +x when dir = 1.        */
function drawFigureBody(fh, swing, lean) {
  ctx.save();
  ctx.rotate(lean);
  var hipY = -fh * 0.52, shoY = -fh * 0.86;
  ctx.fillStyle = PAL.figure;
  /* legs */
  if (swing === 0) {
    poly([-fh * 0.055, hipY, fh * 0.01, hipY, fh * 0.045, 0, -fh * 0.02, 0]);
    poly([fh * 0.0, hipY, fh * 0.065, hipY, fh * 0.10, 0, fh * 0.035, 0]);
  } else {
    var f1 = swing * fh * 0.17, f2 = -swing * fh * 0.15;
    poly([-fh * 0.055, hipY, fh * 0.01, hipY, f1 + fh * 0.03, 0, f1 - fh * 0.03, 0]);
    poly([fh * 0.0, hipY, fh * 0.065, hipY, f2 + fh * 0.03, 0, f2 - fh * 0.03, 0]);
  }
  /* torso, a slight forward pitch while walking */
  var pitch = swing === 0 ? 0 : fh * 0.03;
  poly([-fh * 0.075, hipY + fh * 0.03, fh * 0.075, hipY + fh * 0.03,
        fh * 0.055 + pitch, shoY, -fh * 0.055 + pitch, shoY]);
  /* arm, hanging */
  poly([fh * 0.03 + pitch, shoY + fh * 0.02, fh * 0.085 + pitch, shoY + fh * 0.02,
        fh * 0.10 + pitch, -fh * 0.42, fh * 0.05 + pitch, -fh * 0.42]);
  /* head */
  circ(fh * 0.01 + pitch, -fh * 0.965, fh * 0.088);
  ctx.restore();
}

function drawFigure(t, L) {
  var ph = phaseOf(t);
  if (ph.kind === 'hold') return;
  var xStart = -W * 0.03;
  var xStop = L.treeX - W * 0.016;
  var x, dir = 1, swing = 0, lean = 0;
  var step = Math.floor(t * 6) % 2;            // walk cycle, stepped at 6 fps
  if (ph.kind === 'in') {
    x = lerp(xStart, xStop, ph.u);
    swing = step === 0 ? 1 : -1;
  } else if (ph.kind === 'lean') {
    x = xStop;
    lean = 0.20 * Math.min(1, ph.u / 0.25);    // settles into the trunk, then holds
    if (ph.u > 0.85) lean = 0.20 * (1 - (ph.u - 0.85) / 0.15);
  } else { /* out */
    x = lerp(xStop, xStart, ph.u);
    dir = -1;
    swing = step === 0 ? 1 : -1;
  }
  if (ph.kind !== 'lean') x = clamp(x + scrubDX, xStart, xStop);
  var bob = (ph.kind === 'in' || ph.kind === 'out') ? (step === 0 ? 0 : -L.figH * 0.03) : 0;
  /* its shadow, stretching left like everything else's */
  ctx.fillStyle = PAL.indigo; ctx.globalAlpha = 0.22;
  poly([x - L.figH * 0.10, L.groundY, x - L.figH * 1.15, L.groundY + H * 0.006,
        x + L.figH * 0.12, L.groundY + H * 0.007]);
  ctx.globalAlpha = 1;
  ctx.save();
  ctx.translate(x, L.groundY + bob);
  ctx.scale(dir, 1);
  drawFigureBody(L.figH, ph.kind === 'lean' ? 0 : swing, lean);
  ctx.restore();
}

/* ---------- draw ---------- */
function draw(t) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  drawLandscape(t);
  drawFigure(t, layout());
}

/* ---------- interaction ---------- */
var dragging = false, dragMoved = false, downX = 0, downY = 0, lastX = 0, downT = 0;
canvas.addEventListener('pointerdown', function (e) {
  dragging = true; dragMoved = false;
  downX = e.clientX; downY = e.clientY; lastX = e.clientX; downT = perfNow();
});
canvas.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  var dxs = e.clientX - lastX; lastX = e.clientX;
  if (Math.abs(e.clientX - downX) > 6 || Math.abs(e.clientY - downY) > 6) dragMoved = true;
  if (dragMoved) {
    var ph = phaseOf(pieceNow());
    if (ph.kind === 'in' || ph.kind === 'out') {
      scrubDX = clamp(scrubDX + dxs, -W * 0.02, W * 1.05);
    }
  }
});
function endPointer(e) {
  if (!dragging) return; dragging = false;
  if (dragMoved) return;
  if (perfNow() - downT > 0.5) return;
  /* tap: during the hold, skip straight to the entry moment */
  var ph = phaseOf(pieceNow());
  if (ph.kind === 'hold') phaseSkip += (HOLD - ph.p);
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

/* ---------- sizing: Visual Viewport API ---------- */
function resize() {
  var vv = window.visualViewport;
  W = Math.floor(vv ? vv.width : window.innerWidth);
  H = Math.floor(vv ? vv.height : window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
if (window.visualViewport) window.visualViewport.addEventListener('resize', function () { resize(); draw(pieceNow()); });
window.addEventListener('resize', function () { resize(); draw(pieceNow()); });

resize();
draw(T0);                                        // synchronous fixed-phase first frame
if (typeof requestAnimationFrame === 'function') {
  var tick = function () {
    draw(pieceNow());
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
