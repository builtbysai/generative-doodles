<script>
var TAU = Math.PI * 2;

  { type: 'cube',   num: 'C-96-96',  w: 96,  h: 96, slant: -8,  pal: 2, sub: 3,
    d: { x: 660, y: 208, co: 'above' }, m: { x: 130, y: 375, co: 'below' } },
  { type: 'elbow',  num: 'C-140-32', arm: 140, tube: 32, slant: 0, pal: 1, sub: 1,

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

/* Axis-aligned box of the part in sheet space, slant included. */

  ctx.moveTo(-p.w / 2 + fx, -p.h / 2 - fy);
  ctx.lineTo(p.w / 2 + fx, -p.h / 2 - fy);
  ctx.lineTo(p.w / 2, -p.h / 2);
  ctx.lineTo(-p.w / 2, -p.h / 2);

  ctx.fillStyle = mixHex(col, '#1A1A1A', 0.30);

  ctx.moveTo(p.w / 2, -p.h / 2);
  ctx.lineTo(p.w / 2 + fx, -p.h / 2 - fy);
  ctx.lineTo(p.w / 2 + fx, p.h / 2 - fy);
  ctx.lineTo(p.w / 2, p.h / 2);

  ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);

  ctx.beginPath();
  for (k = 1; k <= p.sub; k++) {

    ctx.moveTo(vx, -p.h / 2); ctx.lineTo(vx, p.h / 2);

  ctx.lineTo(p.w / 2 + fx, -p.h / 2 - fy);
  ctx.lineTo(p.w / 2 + fx, p.h / 2 - fy);
  ctx.lineTo(p.w / 2, p.h / 2);
  ctx.lineTo(-p.w / 2, p.h / 2);

  ctx.lineTo(-t / 2, ay1);
  ctx.lineTo(t / 2, ay1);

  ctx.lineTo(ax0, t / 2);

  ctx.beginPath();
