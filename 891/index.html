<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lit Bottle</title>
<style>
  html, body { margin: 0; padding: 0; background: #08060C; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // Palette (strict)
  var GROUND = '#08060C';
  var DISCHARGE = '#DCD2FF';
  var CORE = '#FFFFFF';
  var SMOKE = '#3A3344';
  var AFTERGLOW = '#8A7AB8';

  // Seeded RNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 300, H = 300;
  function viewW() {
    if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) return window.visualViewport.width;
    return window.innerWidth || 300;
  }
  function viewH() {
    if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight || 300;
  }
  function isPhone(w, h) {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) { sw = window.screen.width || 9999; sh = window.screen.height || 9999; }
    if (Math.min(sw, sh) < 700) return true;
    return h > w * 1.15;
  }

  // ---- Charge model: closed-form over recorded press/release segments ----
  var PRE_CHARGE = 0.35;      // held ambient pre-charge at load (recorded choice)
  var BUILD_RATE = 0.25;      // per second while pressed (full in ~4 s, cap ~5 s of hold)
  var DECAY_RATE = 0.045;     // slow bleed when untouched after interaction
  var segments = [{ t0: 0, mode: 'ambient', c0: PRE_CHARGE }];
  var fxEvents = [];          // {type:'strike'|'crackle'|'ground', t, s}

  function chargeAt(t) {
    var seg = segments[0];
    for (var i = 0; i < segments.length; i++) {
      if (segments[i].t0 <= t) seg = segments[i]; else break;
    }
    if (seg.mode === 'build') return Math.min(1, seg.c0 + BUILD_RATE * (t - seg.t0));
    if (seg.mode === 'idle') return Math.max(0, seg.c0 - DECAY_RATE * (t - seg.t0));
    return seg.c0;
  }
  function pushSeg(t, mode, c0) { segments.push({ t0: t, mode: mode, c0: c0 }); }

  // FX envelopes from the event list
  function flashEnv(t) {
    var e = 0;
    for (var i = 0; i < fxEvents.length; i++) {
      var ev = fxEvents[i];
      if (ev.type !== 'strike') continue;
      var dt = t - ev.t;
      if (dt >= 0 && dt < 0.15) e = Math.max(e, ev.s * (1 - dt / 0.15));
    }
    return e;
  }
  function afterglowEnv(t) {
    var e = 0;
    for (var i = 0; i < fxEvents.length; i++) {
      var ev = fxEvents[i];
      if (ev.type !== 'strike') continue;
      var dt = t - ev.t;
      if (dt >= 0.15 && dt < 4) e = Math.max(e, ev.s * Math.exp(-(dt - 0.15) / 1.1));
    }
    return e;
  }
  function crackleEnv(t) {
    var e = 0;
    for (var i = 0; i < fxEvents.length; i++) {
      var ev = fxEvents[i];
      if (ev.type !== 'crackle') continue;
      var dt = t - ev.t;
      if (dt >= 0 && dt < 0.5) e = Math.max(e, 1 - dt / 0.5);
    }
    return e;
  }
  function darkState(t) {
    // returns {dark:bool, rebuild:0..1 smoke factor}
    var dark = false, rb = 1;
    for (var i = 0; i < fxEvents.length; i++) {
      var ev = fxEvents[i];
      if (ev.type !== 'ground') continue;
      var dt = t - ev.t;
      if (dt >= 0 && dt < 2) { dark = true; rb = 0; }
      else if (dt >= 2 && dt < 4.5) { dark = false; rb = Math.min(rb, (dt - 2) / 2.5); }
    }
    return { dark: dark, rebuild: rb };
  }

  // ---- Smoke: seeded particles, closed-form drift ----
  var smoke = [];
  (function buildSmoke() {
    var rnd = mulberry32(891200);
    for (var i = 0; i < 200; i++) {
      var cx = (rnd() + rnd() + rnd()) / 3;         // centered distribution
      smoke.push({
        bx: 0.5 + (cx - 0.5) * 1.5,                  // spread around the column
        by: rnd(),
        r: 16 + rnd() * 46,                          // base radius in px at 720 ref
        ph: rnd() * Math.PI * 2,
        sp: 0.05 + rnd() * 0.12,
        a: 0.5 + rnd() * 0.5
      });
    }
  })();

  // ---- Bolt geometry: seeded per frame index ----
  function boltFrame(f, w, h, charge) {
    var rnd = mulberry32((891000 + f * 7919) | 0);
    var N = 26;
    var cxBase = w / 2;
    var amp = (0.004 + 0.020 * charge) * w;
    var pts = [];
    var x = cxBase + (rnd() - 0.5) * w * 0.02;
    for (var i = 0; i <= N; i++) {
      if (i > 0) {
        x += (rnd() - 0.5) * 2 * amp * 0.55;
        x += (cxBase - x) * 0.08;
      }
      pts.push({ x: x, y: (h * i) / N });
    }
    // Flicker for this frame
    var flick = 0.72 + 0.28 * rnd();
    // Forks: 2 below charge 0.6, 3 at or above
    var nFork = charge >= 0.6 ? 3 : 2;
    var forks = [];
    for (var k = 0; k < nFork; k++) {
      var oi = 4 + Math.floor(rnd() * (N - 8));
      var side = rnd() < 0.5 ? -1 : 1;
      var segsN = 4 + Math.floor(rnd() * 3);
      var reach = (0.05 + rnd() * 0.09) * w * (0.5 + charge);
      var drop = (0.05 + rnd() * 0.08) * h;
      var fp = [{ x: pts[oi].x, y: pts[oi].y }];
      for (var s = 1; s <= segsN; s++) {
        var fr = s / segsN;
        fp.push({
          x: pts[oi].x + side * reach * fr + (rnd() - 0.5) * w * 0.012,
          y: pts[oi].y + drop * fr * fr + (rnd() - 0.5) * h * 0.006
        });
      }
      forks.push({ pts: fp, a: 0.55 + rnd() * 0.45 });
    }
    return { pts: pts, flick: flick, forks: forks };
  }
  function boltXAt(pts, y) {
    var N = pts.length - 1;
    var fi = Math.max(0, Math.min(N - 0.001, (y / (pts[N].y || 1)) * N));
    var i = Math.floor(fi), fr = fi - i;
    return pts[i].x + (pts[i + 1].x - pts[i].x) * fr;
  }
  function tracePath(p) {
    ctx.beginPath();
    ctx.moveTo(p[0].x, p[0].y);
    for (var i = 1; i < p.length; i++) ctx.lineTo(p[i].x, p[i].y);
    ctx.stroke();
  }

  // ---- Audio: lazy, gesture-gated, typeof-guarded ----
  var AC = null, aNoiseFilter = null, aNoiseGain = null, aHumGain = null, aMaster = null;
  function ensureAudio() {
    if (AC) { if (AC.resume) { try { AC.resume(); } catch (e) {} } return; }
    var Ctor = null;
    if (typeof AudioContext !== 'undefined') Ctor = AudioContext;
    else if (typeof webkitAudioContext !== 'undefined') Ctor = webkitAudioContext;
    if (!Ctor) return;
    try {
      AC = new Ctor();
      aMaster = AC.createGain(); aMaster.gain.value = 0.6;
      aMaster.connect(AC.destination);
      // Noise bed through a bandpass whose frequency follows charge
      var len = 2 * AC.sampleRate;
      var buf = AC.createBuffer(1, len, AC.sampleRate);
      var d = buf.getChannelData(0);
      var rnd = mulberry32(891777);
      for (var i = 0; i < len; i++) d[i] = rnd() * 2 - 1;
      var src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
      aNoiseFilter = AC.createBiquadFilter(); aNoiseFilter.type = 'bandpass'; aNoiseFilter.frequency.value = 400; aNoiseFilter.Q.value = 0.8;
      aNoiseGain = AC.createGain(); aNoiseGain.gain.value = 0;
      src.connect(aNoiseFilter); aNoiseFilter.connect(aNoiseGain); aNoiseGain.connect(aMaster);
      src.start();
      // Low hum
      var hum = AC.createOscillator(); hum.type = 'sine'; hum.frequency.value = 48;
      aHumGain = AC.createGain(); aHumGain.gain.value = 0;
      hum.connect(aHumGain); aHumGain.connect(aMaster);
      hum.start();
    } catch (e) { AC = null; }
  }
  function audioStrike(s) {
    if (!AC) return;
    try {
      var dur = 0.3;
      var buf = AC.createBuffer(1, Math.floor(dur * AC.sampleRate), AC.sampleRate);
      var d = buf.getChannelData(0);
      var rnd = mulberry32(891555);
      for (var i = 0; i < d.length; i++) d[i] = (rnd() * 2 - 1) * Math.pow(1 - i / d.length, 2);
      var src = AC.createBufferSource(); src.buffer = buf;
      var hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1200;
      var g = AC.createGain(); g.gain.value = 0.5 * s;
      src.connect(hp); hp.connect(g); g.connect(aMaster);
      src.start();
    } catch (e) {}
  }
  function audioUpdate(charge) {
    if (!AC) return;
    try {
      var t = AC.currentTime;
      aNoiseFilter.frequency.setTargetAtTime(250 + charge * 2600, t, 0.08);
      aNoiseGain.gain.setTargetAtTime(0.012 + 0.085 * charge, t, 0.1);
      aHumGain.gain.setTargetAtTime(0.015 + 0.05 * charge, t, 0.1);
    } catch (e) {}
  }

  // ---- Interaction ----
  var nowT = 0;
  var pressing = false, pressStart = 0;
  var pendingTap = -10, lastTapRelease = -10;

  function onDown() {
    ensureAudio();
    if (pressing) return;
    pressing = true;
    pressStart = nowT;
    pushSeg(nowT, 'build', chargeAt(nowT));
  }
  function onUp() {
    if (!pressing) return;
    pressing = false;
    var t = nowT;
    var dur = t - pressStart;
    var c = chargeAt(t);
    if (dur < 0.25) {
      // Tap: small fork crackle, unless it completes a double-tap (ground it)
      if (t - lastTapRelease < 0.35 && pendingTap > -5) {
        fxEvents.push({ type: 'ground', t: t, s: 1 });
        pushSeg(t, 'idle', 0);
        pendingTap = -10; lastTapRelease = -10;
      } else {
        fxEvents.push({ type: 'crackle', t: t, s: 1 });
        pushSeg(t, 'idle', c);
        pendingTap = t; lastTapRelease = t;
      }
    } else if (c >= 0.15) {
      // THE STRIKE: exactly one flash per release, scaled by charge
      fxEvents.push({ type: 'strike', t: t, s: c });
      audioStrike(c);
      pushSeg(t, 'idle', 0);
    } else {
      // Fizzle: too little charge for a strike, crackle only
      fxEvents.push({ type: 'crackle', t: t, s: 1 });
      pushSeg(t, 'idle', c);
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointerup', onUp);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pointerup', onUp);
  }

  // ---- Draw ----
  function draw(t) {
    var w = W, h = H;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var phone = isPhone(w, h);
    var charge = chargeAt(t);
    var fl = flashEnv(t);
    var ag = afterglowEnv(t);
    var cr = crackleEnv(t);
    var ds = darkState(t);
    var scale = Math.min(w, h) / 720;

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, w, h);

    if (!ds.dark) {
      var f = Math.floor(t * 30);
      var bolt = boltFrame(f, w, h, charge);
      var bright = (0.30 + 0.70 * charge) * bolt.flick;
      bright = Math.min(1.6, bright * (1 + 2.2 * fl) + cr * 0.15);
      var smokeBoost = (0.30 + 0.70 * charge) * (1 + 3 * fl);

      // Smoke (behind the bolt), lit by distance to the column
      var nS = phone ? 130 : smoke.length;
      for (var pass = 0; pass < 2; pass++) {
        if (pass === 1 && ag < 0.03) break;
        ctx.fillStyle = pass === 0 ? SMOKE : AFTERGLOW;
        for (var i = 0; i < nS; i++) {
          var p = smoke[i];
          var px = p.bx * w + Math.sin(t * p.sp + p.ph) * 9;
          var py = p.by * h + Math.cos(t * p.sp * 0.8 + p.ph) * 11;
          var bx = boltXAt(bolt.pts, Math.max(0, Math.min(h, py)));
          var dx = Math.abs(px - bx);
          var light = Math.exp(-Math.pow(dx / (w * 0.17), 2));
          var a = (0.05 + 0.30 * light) * p.a * smokeBoost * ds.rebuild;
          if (pass === 1) a *= ag * 0.7;
          if (a < 0.004) continue;
          ctx.globalAlpha = Math.min(0.6, a);
          ctx.beginPath();
          ctx.arc(px, py, p.r * (0.7 + scale * 0.6), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Bolt: wide glow pass, discharge body, white core
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.strokeStyle = DISCHARGE;
      ctx.globalAlpha = Math.min(1, 0.16 * bright);
      ctx.lineWidth = Math.max(1.5, 9 * scale * (1 + fl));
      tracePath(bolt.pts);
      ctx.globalAlpha = Math.min(1, 0.55 * bright);
      ctx.lineWidth = Math.max(1, 3.2 * scale * (1 + 0.6 * fl));
      tracePath(bolt.pts);
      ctx.strokeStyle = CORE;
      ctx.globalAlpha = Math.min(1, 0.9 * bright);
      ctx.lineWidth = Math.max(0.8, 1.5 * scale * (1 + 0.4 * fl));
      tracePath(bolt.pts);

      // Afterglow wash over the bolt
      if (ag > 0.02) {
        ctx.strokeStyle = AFTERGLOW;
        ctx.globalAlpha = ag * 0.30;
        ctx.lineWidth = Math.max(1.5, 6 * scale);
        tracePath(bolt.pts);
      }

      // Forks
      var forkBase = (0.25 + 0.75 * charge) * (1 + 1.5 * cr) * (1 + fl);
      for (var k = 0; k < bolt.forks.length; k++) {
        var fk = bolt.forks[k];
        ctx.strokeStyle = DISCHARGE;
        ctx.globalAlpha = Math.min(1, 0.5 * fk.a * forkBase * bolt.flick + cr * 0.2 * fk.a);
        ctx.lineWidth = Math.max(0.8, 1.8 * scale);
        tracePath(fk.pts);
        ctx.strokeStyle = CORE;
        ctx.globalAlpha = Math.min(1, 0.55 * fk.a * forkBase * bolt.flick);
        ctx.lineWidth = Math.max(0.6, 0.8 * scale);
        tracePath(fk.pts);
      }

      // Strike flash: a single overlay per release, gone in ~0.15 s
      if (fl > 0) {
        ctx.fillStyle = CORE;
        ctx.globalAlpha = fl * 0.45;
        ctx.fillRect(0, 0, w, h);
      }
    }

    // Charge meter: thin unlabeled bar at the bottom
    var mw = w * 0.84, mx = w * 0.08, my = h - Math.max(10, 14 * scale) - 4, mh = Math.max(3, 5 * scale);
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = SMOKE;
    ctx.fillRect(mx, my, mw, mh);
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = DISCHARGE;
    ctx.fillRect(mx, my, mw * charge, mh);
    ctx.globalAlpha = 1;
  }

  function resize() {
    W = viewW(); H = viewH();
    if (canvas.width !== W) canvas.width = W;
    if (canvas.height !== H) canvas.height = H;
    draw(nowT);
  }
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', resize);
  }

  resize();
  draw(0);

  // Live loop (guarded: absent in the QA renderer)
  if (typeof requestAnimationFrame === 'function') {
    var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function () {
      nowT = (((typeof performance !== 'undefined' && performance.now) ? performance.now() : 0) - t0) / 1000;
      draw(nowT);
      audioUpdate(chargeAt(nowT));
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
