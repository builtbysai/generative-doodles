<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№616 The Pipe Room</title>
<style>
  html, body { margin: 0; padding: 0; background: #2b2925; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // The Pipe Room, TC6 / PP1204, study #255 tom-challenger.
  // DRIVER: the room itself is the oscillator. A slow wind-pressure
  // cycle drives light through the pipe ranks, each phrase returns as
  // a fading reflection, and the building answers on its own schedule.
  // Watch only. No controls; the building decides.
  var STONE_BG = '#2b2925';   // dark stone ground
  var STONE = '#8a8578';      // stone grey
  var STONE_LT = '#b8b2a4';   // pale stone
  var STONE_DK = '#1d1b18';   // deep stone shadow
  var PIPE = '#c9ced6';       // pipe silver
  var PIPE_DK = '#8f959e';    // pipe silver, shaded side
  var PIPE_SH = '#5c6168';    // pipe shadow edge
  var AMBER = '#e8a33d';      // candle amber
  var AMBER_SOFT = '#f2c46b'; // candle amber, lit
  var BLUE = '#6f97bd';       // window blue
  var BLUE_DK = '#3f5f7d';    // window blue, deep
  var BLUE_LT = '#a8c4dc';    // window blue, bright
  var INK = '#e8e2d4';        // plate ink, bone

  // QA probe hook: ?t=<seconds> renders at a chosen time, and the
  // render harness passes its seed the same way (?seed=<seconds>).
  // Fixed-phase first frame: FIRST_T = 10 s. At t = 10 the wind is
  // high (W about 0.83), the left rank phrase that began at t = 2
  // is eight seconds into its long tail, and the right rank phrase
  // that began at t = 8 is two seconds in and speaking strongly, so
  // frame one shows one rank glowing and fading while the other
  // answers across the nave.
  function queryT() {
    try {
      var s = (typeof location !== 'undefined' && location.search) ? location.search : '';
      var m = s.match(/[?&]t=([0-9.]+)/);
      if (m) { return parseFloat(m[1]); }
      var m2 = s.match(/[?&]seed=([0-9.]+)/);
      if (m2) { return parseFloat(m2[1]); }
    } catch (e) {}
    return null;
  }
  var FIRST_T = 10;
  var qt = queryT();
  if (qt !== null && !isNaN(qt)) { FIRST_T = qt; }

  // Wind-pressure cycle: 48 s period, slow rise and fall.
  // W(t) = 0.5 + 0.5 sin(2 pi t / 48 - 0.6). At FIRST_T = 10, W = 0.83.
  function wind(t) { return 0.5 + 0.5 * Math.sin((2 * Math.PI * t) / 48 - 0.6); }

  // Seeded PRNG, mulberry32. Fresh instances per draw from the piece
  // number, so every frame is reproducible regardless of call order.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Pipe ranks: 7 pipes each side, tallest toward the nave. Heights
  // are seeded fractions of the rank height, fixed at load.
  var LEFT_H = [], RIGHT_H = [], MOTE = [];
  (function buildSeeded() {
    var rng = mulberry32(1957);
    var i;
    for (i = 0; i < 7; i++) {
      // Outer pipes shorter, inner pipes taller: a facade that rises
      // toward the nave on both sides.
      LEFT_H.push(0.34 + 0.30 * (i / 6) + (rng() - 0.5) * 0.05);
      RIGHT_H.push(0.34 + 0.30 * ((6 - i) / 6) + (rng() - 0.5) * 0.05);
    }
    for (i = 0; i < 26; i++) {
      MOTE.push({ x: rng(), y: rng(), r: 0.8 + rng() * 1.8, sp: 0.4 + rng() * 0.9, ph: rng() * Math.PI * 2 });
    }
  })();

  // Phrase schedule: each phrase speaks for a moment, then returns as
  // a long fading reflection (exponential tail, tau 6 s, audible in
  // the light for about 18 s). Left and right ranks alternate so the
  // room answers itself across the nave. Phrases at 12 s spacing.
  var PHRASES = [
    { start: 2,  rank: 'L', pipes: [2, 3, 4, 5] },
    { start: 8,  rank: 'R', pipes: [1, 2, 3, 4] },
    { start: 14, rank: 'L', pipes: [0, 1, 2, 5, 6] },
    { start: 20, rank: 'R', pipes: [3, 4, 5, 6] },
    { start: 26, rank: 'L', pipes: [1, 3, 4] },
    { start: 32, rank: 'R', pipes: [0, 2, 4, 5] },
    { start: 38, rank: 'L', pipes: [2, 3, 4, 5, 6] },
    { start: 44, rank: 'R', pipes: [1, 2, 3] },
    { start: 50, rank: 'L', pipes: [0, 1, 4, 5] },
    { start: 56, rank: 'R', pipes: [2, 3, 4, 5, 6] }
  ];
  var TAU = 6, TAIL = 18;
  function phraseEnv(p, t) {
    var dt = t - p.start;
    if (dt < 0 || dt > TAIL) { return 0; }
    var attack = dt < 0.8 ? dt / 0.8 : 1;
    return attack * Math.exp(-dt / TAU);
  }
  // Strongest live envelope across all phrases: drives the reflection
  // wash on the floor and the arch glow.
  function maxEnv(t) {
    var m = 0, i;
    for (i = 0; i < PHRASES.length; i++) {
      var e = phraseEnv(PHRASES[i], t);
      if (e > m) { m = e; }
    }
    return m;
  }
  // Envelope for one pipe: the phrase it belongs to, if any.
  function pipeEnv(rank, idx, t) {
    var m = 0, i, j;
    for (i = 0; i < PHRASES.length; i++) {
      var p = PHRASES[i];
      if (p.rank !== rank) { continue; }
      for (j = 0; j < p.pipes.length; j++) {
        if (p.pipes[j] === idx) {
          var e = phraseEnv(p, t);
          if (e > m) { m = e; }
        }
      }
    }
    return m;
  }

  // Birdsong motif: twice a minute a small bird crosses the high
  // window, trailing a trill of light dots. Windows at t = 30 and
  // t = 78, each lasting 6 s. At FIRST_T = 10 the window is empty.
  var BIRDS = [{ start: 30 }, { start: 78 }];
  function birdAt(t) {
    var i;
    for (i = 0; i < BIRDS.length; i++) {
      var dt = t - BIRDS[i].start;
      if (dt >= 0 && dt <= 6) { return dt / 6; }
    }
    return -1;
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  // Layout, recomputed in resize() and read by draw().
  var L = {};
  function layout() {
    var headerH = Math.round(H * 0.095);
    var hintH = Math.round(H * 0.055);
    var y0 = headerH + 4;
    var y1 = H - hintH - 6;
    var floorY = y0 + (y1 - y0) * 0.64;
    var plinthY = y0 + (y1 - y0) * 0.86;
    L = {
      headerH: headerH, hintH: hintH,
      y0: y0, y1: y1, floorY: floorY, plinthY: plinthY,
      rankH: plinthY - y0,
      naveX0: W * 0.30, naveX1: W * 0.70,
      rankW: W * 0.28
    };
  }

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
    layout();
  }

  // One organ pipe: silver body, dark mouth slit near the base, and
  // wind-light rising inside it when its phrase is speaking. The
  // light column height follows envelope times wind; a bright band
  // travels slowly up the tube while it speaks.
  function drawPipe(x, w, topY, botY, env, t, phase) {
    var h = botY - topY;
    var g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, PIPE_SH);
    g.addColorStop(0.22, PIPE_DK);
    g.addColorStop(0.5, PIPE);
    g.addColorStop(0.78, PIPE_DK);
    g.addColorStop(1, PIPE_SH);
    ctx.fillStyle = g;
    ctx.fillRect(x, topY, w, h);
    // Cap line at the top.
    ctx.fillStyle = hexA(PIPE_SH, 0.8);
    ctx.fillRect(x, topY, w, Math.max(2, w * 0.12));
    // Mouth slit near the base.
    var mouthY = botY - h * 0.16;
    ctx.fillStyle = STONE_DK;
    ctx.fillRect(x + w * 0.18, mouthY, w * 0.64, Math.max(2, h * 0.012));
    // Wind-light inside the tube.
    var wnd = wind(t);
    var glow = env * (0.45 + 0.55 * wnd);
    if (glow > 0.02) {
      var coreH = h * 0.82 * clamp(glow, 0, 1);
      var cg = ctx.createLinearGradient(0, mouthY, 0, mouthY - coreH);
      cg.addColorStop(0, hexA(AMBER, a4(0.85 * clamp(glow, 0, 1))));
      cg.addColorStop(0.6, hexA(AMBER_SOFT, a4(0.45 * clamp(glow, 0, 1))));
      cg.addColorStop(1, hexA(AMBER_SOFT, 0));
      ctx.fillStyle = cg;
      ctx.fillRect(x + w * 0.22, mouthY - coreH, w * 0.56, coreH);
      // Traveling bright band, rising slowly while the pipe speaks.
      var bandFrac = ((t * 0.12 + phase) % 1);
      var bandY = mouthY - bandFrac * coreH;
      ctx.fillStyle = hexA('#fff3d0', a4(0.75 * clamp(glow, 0, 1)));
      ctx.fillRect(x + w * 0.22, bandY - 2, w * 0.56, 4);
      // Amber spill from the mouth.
      ctx.fillStyle = hexA(AMBER, a4(0.5 * clamp(glow, 0, 1)));
      ctx.fillRect(x + w * 0.18, mouthY, w * 0.64, Math.max(3, h * 0.02));
    }
  }

  function drawRank(side, t) {
    var i;
    var n = 7;
    var x0 = side === 'L' ? W * 0.02 : W * 0.70;
    var pw = L.rankW / n;
    for (i = 0; i < n; i++) {
      var frac = side === 'L' ? LEFT_H[i] : RIGHT_H[i];
      var topY = L.plinthY - frac * L.rankH;
      var env = pipeEnv(side, i, t);
      drawPipe(x0 + i * pw + pw * 0.08, pw * 0.84, topY, L.plinthY, env, t, i * 0.13);
    }
    // Plinth under the rank.
    ctx.fillStyle = STONE_DK;
    ctx.fillRect(x0, L.plinthY, L.rankW, Math.max(3, H * 0.012));
    ctx.fillStyle = hexA(STONE_LT, 0.35);
    ctx.fillRect(x0, L.plinthY, L.rankW, 1.5);
  }

  // Arched high window at the top of the back wall, blue, with a
  // light shaft falling into the nave. The shaft brightens with wind.
  function drawWindow(t) {
    var cx = W / 2;
    var ww = W * 0.13, wh = (L.floorY - L.y0) * 0.52;
    var wx0 = cx - ww / 2, wy0 = L.y0 + (L.floorY - L.y0) * 0.06;
    var wy1 = wy0 + wh;
    var wnd = wind(t);
    // Window glass: blue gradient, brighter at the top.
    var g = ctx.createLinearGradient(0, wy0, 0, wy1);
    g.addColorStop(0, BLUE_LT);
    g.addColorStop(0.55, BLUE);
    g.addColorStop(1, BLUE_DK);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(wx0, wy1);
    ctx.lineTo(wx0, wy0 + ww / 2);
    ctx.arc(cx, wy0 + ww / 2, ww / 2, Math.PI, 0);
    ctx.lineTo(wx0 + ww, wy1);
    ctx.closePath();
    ctx.fill();
    // Mullions: one vertical, two horizontal bars.
    ctx.fillStyle = hexA(STONE_DK, 0.85);
    ctx.fillRect(cx - 1.5, wy0, 3, wh);
    ctx.fillRect(wx0, wy0 + wh * 0.38, ww, 2);
    ctx.fillRect(wx0, wy0 + wh * 0.68, ww, 2);
    // Stone frame around the arch.
    ctx.strokeStyle = STONE_LT;
    ctx.lineWidth = Math.max(2, W * 0.006);
    ctx.beginPath();
    ctx.moveTo(wx0 - 4, wy1);
    ctx.lineTo(wx0 - 4, wy0 + ww / 2);
    ctx.arc(cx, wy0 + ww / 2, ww / 2 + 4, Math.PI, 0);
    ctx.lineTo(wx0 + ww + 4, wy1);
    ctx.stroke();
    // Light shaft falling from the window into the nave, brighter
    // when the wind is high.
    var shaftA = 0.05 + 0.13 * wnd;
    var sg = ctx.createLinearGradient(0, wy1, 0, L.plinthY);
    sg.addColorStop(0, hexA(BLUE_LT, a4(shaftA)));
    sg.addColorStop(1, hexA(BLUE_LT, 0));
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.moveTo(wx0 + ww * 0.1, wy1);
    ctx.lineTo(wx0 + ww * 0.9, wy1);
    ctx.lineTo(cx + W * 0.10, L.plinthY);
    ctx.lineTo(cx - W * 0.10, L.plinthY);
    ctx.closePath();
    ctx.fill();
    // Birdsong: a small bird crossing the window, trailing trill dots.
    var b = birdAt(t);
    if (b >= 0) {
      var bx = wx0 + ww * 0.1 + b * ww * 0.8;
      var by = wy0 + wh * (0.42 + 0.10 * Math.sin(b * Math.PI * 3));
      ctx.strokeStyle = STONE_DK;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(bx - 7, by);
      ctx.lineTo(bx - 1, by - 4);
      ctx.lineTo(bx + 5, by);
      ctx.stroke();
      var k;
      for (k = 0; k < 3; k++) {
        var dx = bx - 10 - k * 9;
        var dy = by - 6 - k * 5 + Math.sin(t * 6 + k * 2) * 2;
        var da = clamp(0.9 - k * 0.25 - b * 0.3, 0.05, 0.9);
        ctx.fillStyle = hexA(BLUE_LT, a4(da));
        ctx.beginPath(); ctx.moveTo(dx + 2.5, dy); ctx.arc(dx, dy, 2.5, 0, Math.PI * 2); ctx.fill();
      }
    }
    return { wx0: wx0, wy0: wy0, ww: ww, wh: wh };
  }

  // Nave floor: stone slabs in perspective, converging on the window,
  // with the amber reflection wash of the latest phrase pooling
  // at the center and fading with the tail.
  function drawFloor(t) {
    var i;
    var fy = L.floorY, py = L.plinthY;
    var g = ctx.createLinearGradient(0, fy, 0, py);
    g.addColorStop(0, '#3a362e');
    g.addColorStop(1, '#211f1b');
    ctx.fillStyle = g;
    ctx.fillRect(L.naveX0, fy, L.naveX1 - L.naveX0, py - fy);
    // Slab joints: lines converging toward a vanishing point on the
    // floor's top edge, so they stay on the floor and never climb
    // the back wall.
    var vpx = W / 2, vpy = fy;
    ctx.strokeStyle = hexA(STONE, 0.35);
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (i = -3; i <= 3; i++) {
      var bx = W / 2 + i * (L.naveX1 - L.naveX0) * 0.22;
      ctx.moveTo(bx, py);
      ctx.lineTo(vpx + i * W * 0.015, vpy);
    }
    ctx.stroke();
    ctx.beginPath();
    for (i = 1; i <= 3; i++) {
      var ry = fy + (py - fy) * (i / 4);
      ctx.moveTo(L.naveX0 + (W / 2 - L.naveX0) * (i / 5), ry);
      ctx.lineTo(L.naveX1 - (L.naveX1 - W / 2) * (i / 5), ry);
    }
    ctx.stroke();
    // Reflection wash: the room answering, amber, fading with the
    // strongest live phrase tail.
    var env = maxEnv(t);
    if (env > 0.02) {
      var rg = ctx.createRadialGradient(W / 2, py - (py - fy) * 0.25, 4, W / 2, py - (py - fy) * 0.25, W * 0.20);
      rg.addColorStop(0, hexA(AMBER, a4(0.34 * env)));
      rg.addColorStop(1, hexA(AMBER, 0));
      ctx.fillStyle = rg;
      ctx.fillRect(L.naveX0, fy, L.naveX1 - L.naveX0, py - fy);
    }
  }

  // Candles along the plinth: small amber flames, flickering slowly.
  function drawCandles(t) {
    var i;
    var spots = [0.06, 0.16, 0.84, 0.94];
    for (i = 0; i < spots.length; i++) {
      var cx = W * spots[i];
      var cy = L.plinthY + H * 0.02;
      var fl = 0.72 + 0.28 * Math.sin(t * 2.1 + i * 1.7);
      // Stick.
      ctx.fillStyle = '#d8cfb8';
      ctx.fillRect(cx - 1.5, cy, 3, H * 0.022);
      // Flame.
      ctx.fillStyle = hexA(AMBER_SOFT, a4(0.9 * fl));
      ctx.beginPath();
      ctx.moveTo(cx, cy - H * 0.016 * fl);
      ctx.quadraticCurveTo(cx + 3.5, cy - H * 0.004, cx, cy + 1);
      ctx.quadraticCurveTo(cx - 3.5, cy - H * 0.004, cx, cy - H * 0.016 * fl);
      ctx.fill();
      // Halo.
      ctx.fillStyle = hexA(AMBER, a4(0.16 * fl));
      ctx.beginPath(); ctx.moveTo(cx + 7, cy - H * 0.008); ctx.arc(cx, cy - H * 0.008, 7, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Wind motes drifting through the nave air, carried by the wind.
  function drawMotes(t) {
    var wnd = wind(t);
    var i;
    for (i = 0; i < MOTE.length; i++) {
      var m = MOTE[i];
      var mx = L.naveX0 + ((m.x + t * 0.004 * m.sp * (0.4 + wnd)) % 1) * (L.naveX1 - L.naveX0);
      var my = L.y0 + m.y * (L.plinthY - L.y0) + Math.sin(t * 0.5 + m.ph) * 3;
      ctx.fillStyle = hexA(AMBER_SOFT, a4(0.10 + 0.14 * wnd));
      ctx.beginPath(); ctx.moveTo(mx + m.r, my); ctx.arc(mx, my, m.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = STONE_BG;
    ctx.fillRect(0, 0, W, H);

    // ---- Plates: title top-left, number and date top-right.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(11 * clamp(W / 560, 0.85, 1.1));
    var fsTick = Math.round(12 * clamp(W / 560, 0.85, 1.1));
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('The Pipe Room', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, 0.75);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№616 · 2007 · 05 · 22', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = hexA(INK, 0.6);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('the room itself is the oscillator', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.textAlign = 'left';

    // ---- Back wall: a stone arch framing the nave, lit by the
    // reflection of the latest phrase.
    var env = maxEnv(t);
    var archX0 = L.naveX0 - W * 0.015, archX1 = L.naveX1 + W * 0.015;
    var archTop = L.y0 + (L.floorY - L.y0) * 0.02;
    var ag = ctx.createLinearGradient(0, archTop, 0, L.plinthY);
    ag.addColorStop(0, '#45413a');
    ag.addColorStop(1, '#322f29');
    ctx.fillStyle = ag;
    ctx.beginPath();
    ctx.moveTo(archX0, L.plinthY);
    ctx.lineTo(archX0, archTop + (archX1 - archX0) / 2);
    ctx.arc(W / 2, archTop + (archX1 - archX0) / 2, (archX1 - archX0) / 2, Math.PI, 0);
    ctx.lineTo(archX1, L.plinthY);
    ctx.closePath();
    ctx.fill();
    // Arch glow from the answering reflection.
    if (env > 0.02) {
      ctx.fillStyle = hexA(AMBER, a4(0.10 * env));
      ctx.beginPath();
      ctx.moveTo(archX0, L.plinthY);
      ctx.lineTo(archX0, archTop + (archX1 - archX0) / 2);
      ctx.arc(W / 2, archTop + (archX1 - archX0) / 2, (archX1 - archX0) / 2, Math.PI, 0);
      ctx.lineTo(archX1, L.plinthY);
      ctx.closePath();
      ctx.fill();
    }

    drawWindow(t);
    drawFloor(t);
    drawRank('L', t);
    drawRank('R', t);
    drawMotes(t);
    drawCandles(t);

    // ---- Outer frame, pale stone.
    ctx.strokeStyle = hexA(STONE_LT, 0.55);
    ctx.lineWidth = 2;
    ctx.strokeRect(1, L.y0, W - 2, L.y1 - L.y0);

    // ---- Hint, centered at the bottom.
    ctx.fillStyle = hexA(INK, 0.85);
    ctx.textAlign = 'center';
    ctx.font = Math.round(fsTick * 0.95) + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Watch the room play.', W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  // QA probe hook: lets a node probe redraw at a chosen t and read
  // the live wind and phrase envelopes without a browser.
  try {
    window.__piece1957 = {
      wind: wind,
      maxEnv: maxEnv,
      pipeEnv: pipeEnv,
      birdAt: birdAt,
      redraw: function (t) { draw(t); },
      firstT: FIRST_T
    };
  } catch (e) {}

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop: the wind cycle is 48 s, phrases every 12 s, candles
  // flicker near 0.3 Hz, all motion far under the 14 Hz ceiling.
  // Guarded so node-canvas QA (no requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
