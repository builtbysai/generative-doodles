<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Sketchbook Machine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #F5F0E6; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- palette (strict: one accent per session) ----------
  var PAPER = '#F5F0E6';
  var INK = '#26221E';
  var GRAY = '#8A8578';
  var ACCENT = '#D9A441'; // turmeric, fixed by the load seed for this build

  // ---------- seeded rng ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- canvas / viewport ----------
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 300, H = 300;

  function viewSize() {
    var w, h;
    if (typeof window !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.width === 'number') {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else if (typeof window !== 'undefined' && typeof window.innerWidth === 'number') {
      w = window.innerWidth; h = window.innerHeight;
    } else { w = W; h = H; }
    return { w: Math.max(50, Math.floor(w)), h: Math.max(50, Math.floor(h)) };
  }

  function isPhone() {
    var sw = 9999, sh = 9999;
    if (typeof window !== 'undefined' && window.screen) {
      sw = window.screen.width || 9999; sh = window.screen.height || 9999;
    }
    if (Math.min(sw, sh) < 700) return true;
    return H > W * 1.15; // aspect fallback only
  }

  function resize() {
    var s = viewSize();
    W = s.w; H = s.h;
    canvas.width = W; canvas.height = H;
    layout();
  }

  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', resize);
    }
    if (window.addEventListener) window.addEventListener('resize', resize);
  }

  // ---------- path helpers ----------
  function smooth(pts, per) {
    if (pts.length < 3) return pts;
    var out = [];
    var P = [pts[0]].concat(pts, [pts[pts.length - 1]]);
    for (var i = 1; i < P.length - 2; i++) {
      for (var j = 0; j < per; j++) {
        var t = j / per, t2 = t * t, t3 = t2 * t;
        var x = 0.5 * ((2 * P[i][0]) + (-P[i - 1][0] + P[i + 1][0]) * t +
          (2 * P[i - 1][0] - 5 * P[i][0] + 4 * P[i + 1][0] - P[i + 2][0]) * t2 +
          (-P[i - 1][0] + 3 * P[i][0] - 3 * P[i + 1][0] + P[i + 2][0]) * t3);
        var y = 0.5 * ((2 * P[i][1]) + (-P[i - 1][1] + P[i + 1][1]) * t +
          (2 * P[i - 1][1] - 5 * P[i][1] + 4 * P[i + 1][1] - P[i + 2][1]) * t2 +
          (-P[i - 1][1] + 3 * P[i][1] - 3 * P[i + 1][1] + P[i + 2][1]) * t3);
        out.push([x, y]);
      }
    }
    out.push(pts[pts.length - 1].slice());
    return out;
  }
  function pathLength(pts) {
    var L = 0;
    for (var i = 1; i < pts.length; i++) {
      var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
      L += Math.sqrt(dx * dx + dy * dy);
    }
    return L;
  }
  function strokePartial(pts, prog) {
    if (prog <= 0 || pts.length < 2) return;
    var total = pathLength(pts), target = total * prog;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    var acc = 0;
    for (var i = 1; i < pts.length; i++) {
      var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
      var seg = Math.sqrt(dx * dx + dy * dy);
      if (acc + seg <= target) {
        ctx.lineTo(pts[i][0], pts[i][1]); acc += seg;
      } else {
        var f = seg > 0 ? (target - acc) / seg : 0;
        ctx.lineTo(pts[i - 1][0] + dx * f, pts[i - 1][1] + dy * f);
        acc = target; break;
      }
    }
    ctx.stroke();
  }
  function strokePts(pts) { strokePartial(pts, 1); }
  function circlePts(cx, cy, r, n) {
    var out = [];
    for (var i = 0; i <= n; i++) {
      var a = i / n * Math.PI * 2;
      out.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    return out;
  }
  function fillPts(pts) {
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      if (i === 0) ctx.moveTo(pts[i][0], pts[i][1]); else ctx.lineTo(pts[i][0], pts[i][1]);
    }
    ctx.closePath(); ctx.fill();
  }
  function dot(x, y, r) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  function line(a, b, c, d) {
    ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke();
  }

  // ---------- creature contours (Serra's reading vocabulary) ----------
  // Same contour family as No.609: open profiles whose feet stand on a
  // contour (tangent frame, local -y outward); the fish is radial
  // (local +x outward). Coordinates are in creature units.
  function creaturePaths(type) {
    switch (type) {
      case 'fox': return { tangent: true, lines: [smooth([
        [-0.36, 0.03], [-0.31, -0.18], [-0.25, -0.24], [-0.19, -0.50], [-0.11, -0.25],
        [-0.03, -0.27], [0.04, -0.52], [0.11, -0.26], [0.22, -0.20], [0.40, -0.10],
        [0.24, 0.0], [0.13, 0.05], [0.07, 0.14], [0.01, 0.06],
        [0.10, 0.09], [0.24, 0.05], [0.34, 0.03]
      ], 4)], dots: [[0.08, -0.15]] };
      case 'bird': return { tangent: true, lines: [smooth([
        [-0.32, 0.03], [-0.28, -0.20], [-0.12, -0.31], [0.06, -0.27], [0.16, -0.19],
        [0.48, -0.11], [0.17, -0.05], [0.07, 0.05], [0.15, 0.09], [0.28, 0.03]
      ], 4), smooth([
        [-0.10, -0.28], [-0.22, -0.42], [-0.28, -0.34]
      ], 4)], dots: [[0.03, -0.17]] };
      case 'dancer': return { tangent: true, lines: [
        smooth([[0, 0.03], [0.02, -0.20], [0.05, -0.36], [0.16, -0.54]], 5),
        smooth([[0.14, -0.48], [0.32, -0.60], [0.48, -0.55]], 5),
        smooth([[0.05, -0.36], [-0.20, -0.45], [-0.38, -0.40]], 5),
        circlePts(0.21, -0.65, 0.07, 14)
      ], dots: [] };
      case 'longneck': return { tangent: true, lines: [smooth([
        [-0.22, 0.03], [-0.14, -0.32], [-0.06, -0.64], [0.0, -0.90], [0.05, -1.02],
        [0.15, -1.09], [0.38, -1.01], [0.19, -0.90], [0.12, -0.68], [0.14, -0.36],
        [0.20, 0.03]
      ], 5), smooth([
        [0.07, -1.03], [0.02, -1.20], [0.13, -1.08]
      ], 4)], dots: [[0.17, -0.99]] };
      case 'fish': return { tangent: false, lines: [smooth([
        [0, 0], [0.20, -0.16], [0.46, -0.22], [0.70, -0.12], [0.93, -0.31],
        [0.85, 0], [0.93, 0.31], [0.68, 0.14], [0.42, 0.22], [0.16, 0.14], [0, 0.05]
      ], 5), smooth([
        [0.24, -0.13], [0.32, 0], [0.24, 0.13]
      ], 4)], dots: [[0.15, -0.03]] };
      case 'hood': return { tangent: true, lines: [smooth([
        [-0.27, 0], [-0.25, -0.30], [-0.17, -0.55], [-0.14, -0.72], [0, -0.84],
        [0.14, -0.72], [0.17, -0.55], [0.25, -0.30], [0.27, 0]
      ], 5), [[-0.27, 0], [0.27, 0]]
      ], dots: [], hoodFill: smooth([
        [-0.14, -0.72], [0, -0.84], [0.14, -0.72], [0.11, -0.50], [0, -0.56],
        [-0.11, -0.50]
      ], 5), face: [0, -0.615, 0.082] };
    }
    return { tangent: true, lines: [], dots: [] };
  }

  // Draw a creature in current unit space (caller has translated /
  // rotated / scaled). hoodFill: color for the hood shape, or null.
  function paintCreature(type, prog, hoodFill) {
    var paths = creaturePaths(type);
    ctx.strokeStyle = INK;
    ctx.lineWidth = 0.032;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    for (var i = 0; i < paths.lines.length; i++) strokePartial(paths.lines[i], prog);
    if (prog > 0.85) {
      ctx.fillStyle = INK;
      for (var j = 0; j < paths.dots.length; j++) dot(paths.dots[j][0], paths.dots[j][1], 0.028);
    }
    if (paths.hoodFill && hoodFill && prog > 0.4) {
      ctx.save();
      ctx.globalAlpha = ctx.globalAlpha * Math.min(1, (prog - 0.4) / 0.4) * 0.9;
      ctx.fillStyle = hoodFill;
      fillPts(paths.hoodFill);
      var f = paths.face;
      ctx.fillStyle = PAPER;
      dot(f[0], f[1], f[2]);
      ctx.restore();
    }
  }

  // ---------- motif stamp painters (unit space, roughly [-0.5, 0.5]) ----------
  function inkSetup(lw) {
    ctx.strokeStyle = INK;
    ctx.lineWidth = lw || 0.045;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  }
  // animal
  function pFox() { ctx.save(); ctx.translate(0, 0.30); paintCreature('fox', 1, null); ctx.restore(); }
  function pBird() { ctx.save(); ctx.translate(0, 0.28); paintCreature('bird', 1, null); ctx.restore(); }
  function pFish() { ctx.save(); ctx.translate(-0.45, 0); paintCreature('fish', 1, null); ctx.restore(); }
  // vegetation
  function pFern() {
    inkSetup(0.042);
    strokePts(smooth([[0, 0.44], [0.03, 0.1], [0, -0.16], [0.02, -0.42]], 4));
    for (var i = 0; i < 6; i++) {
      var y = -0.32 + i * 0.125, len = 0.30 * (1 - i * 0.10);
      line(0.01, y, -len, y - 0.085);
      line(0.01, y, len, y - 0.085);
    }
    ctx.fillStyle = ACCENT; dot(0.02, -0.47, 0.035);
  }
  function pPod() {
    inkSetup(0.042);
    strokePts(smooth([[0, 0.44], [0.05, 0.22], [0.01, 0.04]], 3));
    var pod = [];
    for (var i = 0; i <= 20; i++) {
      var a = i / 20 * Math.PI * 2;
      pod.push([Math.cos(a) * 0.17, -0.18 + Math.sin(a) * 0.26]);
    }
    ctx.fillStyle = ACCENT; ctx.globalAlpha *= 0.30; fillPts(pod); ctx.globalAlpha /= 0.30;
    strokePts(pod.concat([pod[0]]));
    ctx.fillStyle = INK;
    dot(-0.05, -0.26, 0.026); dot(0.06, -0.14, 0.026); dot(-0.02, -0.06, 0.026);
  }
  function pSprig() {
    inkSetup(0.042);
    strokePts(smooth([[-0.30, 0.42], [-0.06, 0.10], [0.26, -0.38]], 4));
    var spots = [[-0.20, 0.26, -0.7], [-0.02, 0.02, 0.9], [0.10, -0.16, -0.7], [0.22, -0.30, 0.9]];
    for (var i = 0; i < spots.length; i++) {
      var s = spots[i], pts = [];
      for (var j = 0; j <= 14; j++) {
        var a = j / 14 * Math.PI * 2;
        var lx = Math.cos(a) * 0.15, ly = Math.sin(a) * 0.055;
        var ca = Math.cos(s[2]), sa = Math.sin(s[2]);
        pts.push([s[0] + lx * ca - ly * sa, s[1] + lx * sa + ly * ca]);
      }
      if (i === 1) { ctx.fillStyle = ACCENT; ctx.globalAlpha *= 0.5; fillPts(pts); ctx.globalAlpha /= 0.5; }
      strokePts(pts);
    }
  }
  // character
  function pHood() { ctx.save(); ctx.translate(0, 0.36); paintCreature('hood', 1, ACCENT); ctx.restore(); }
  function pDancer() { ctx.save(); ctx.translate(0, 0.30); paintCreature('dancer', 1, null); ctx.restore(); }
  function pLongneck() { ctx.save(); ctx.translate(0, 0.52); ctx.scale(0.78, 0.78); paintCreature('longneck', 1, null); ctx.restore(); }
  // object
  function pBoat() {
    inkSetup(0.045);
    strokePts(smooth([[-0.42, 0.06], [-0.2, 0.14], [0.2, 0.14], [0.42, 0.06], [0.30, 0.28], [-0.30, 0.28], [-0.42, 0.06]], 3));
    line(0, 0.06, 0, -0.40);
    var sail = [[0.04, -0.36], [0.04, 0.0], [0.32, 0.0]];
    ctx.fillStyle = ACCENT; ctx.globalAlpha *= 0.45; fillPts(sail); ctx.globalAlpha /= 0.45;
    strokePts(sail.concat([sail[0]]));
    strokePts([[ -0.04, -0.30], [-0.04, 0.0], [-0.26, 0.0], [-0.04, -0.30]]);
    strokePts(smooth([[-0.4, 0.42], [-0.2, 0.38], [0, 0.42], [0.2, 0.38], [0.4, 0.42]], 4));
  }
  function pCup() {
    inkSetup(0.045);
    strokePts(smooth([[-0.28, -0.08], [0.24, -0.08], [0.19, 0.24], [-0.20, 0.24], [-0.28, -0.08]], 3));
    ctx.beginPath(); ctx.arc(0.30, 0.06, 0.11, -Math.PI / 2, Math.PI / 2); ctx.stroke();
    line(-0.38, 0.34, 0.34, 0.34);
    ctx.fillStyle = ACCENT; ctx.globalAlpha *= 0.55;
    ctx.fillRect(-0.255, 0.02, 0.475, 0.075);
    ctx.globalAlpha /= 0.55;
    strokePts(smooth([[-0.12, -0.18], [-0.08, -0.30], [-0.13, -0.42]], 3));
    strokePts(smooth([[0.08, -0.18], [0.12, -0.30], [0.07, -0.42]], 3));
  }
  function pKey() {
    inkSetup(0.045);
    strokePts(circlePts(-0.22, -0.04, 0.15, 20));
    line(-0.07, -0.04, 0.38, -0.04);
    line(0.22, -0.04, 0.22, 0.10);
    line(0.36, -0.04, 0.36, 0.16);
    ctx.fillStyle = ACCENT; dot(-0.22, -0.04, 0.045);
  }
  // place
  function pHouse() {
    inkSetup(0.045);
    ctx.strokeRect(-0.30, -0.02, 0.60, 0.38);
    var roof = [[-0.38, -0.02], [0, -0.36], [0.38, -0.02]];
    ctx.fillStyle = ACCENT; ctx.globalAlpha *= 0.40; fillPts(roof.concat([[0.38, -0.02]])); ctx.globalAlpha /= 0.40;
    strokePts(roof);
    ctx.strokeRect(-0.07, 0.12, 0.14, 0.24);
    ctx.strokeRect(0.14, 0.06, 0.11, 0.11);
    ctx.fillStyle = INK; dot(0.035, 0.24, 0.018);
  }
  function pLighthouse() {
    inkSetup(0.045);
    line(-0.13, 0.38, -0.075, -0.16);
    line(0.13, 0.38, 0.075, -0.16);
    line(-0.115, 0.10, 0.115, 0.10);
    line(-0.095, -0.05, 0.095, -0.05);
    ctx.strokeRect(-0.115, -0.33, 0.23, 0.17);
    strokePts([[-0.15, -0.33], [0, -0.46], [0.15, -0.33]]);
    ctx.fillStyle = ACCENT; ctx.fillRect(-0.115, -0.33, 0.23, 0.17);
    line(-0.16, -0.245, -0.30, -0.30);
    line(0.16, -0.245, 0.30, -0.30);
    line(-0.20, 0.38, 0.20, 0.38);
  }
  function pArch() {
    inkSetup(0.045);
    line(-0.26, 0.36, -0.26, -0.02);
    line(0.26, 0.36, 0.26, -0.02);
    var arc = [];
    for (var i = 0; i <= 16; i++) {
      var a = Math.PI - i / 16 * Math.PI;
      arc.push([Math.cos(a) * 0.26, -0.02 - Math.sin(a) * 0.26]);
    }
    strokePts(arc);
    ctx.fillStyle = ACCENT; ctx.globalAlpha *= 0.55; dot(0, -0.02, 0.085); ctx.globalAlpha /= 0.55;
    strokePts(circlePts(0, -0.02, 0.085, 18));
    line(-0.42, 0.36, 0.42, 0.36);
  }

  var CATEGORIES = ['animal', 'vegetation', 'character', 'object', 'place'];
  var MOTIFS = {
    animal: [pFox, pBird, pFish],
    vegetation: [pFern, pPod, pSprig],
    character: [pHood, pDancer, pLongneck],
    object: [pBoat, pCup, pKey],
    place: [pHouse, pLighthouse, pArch]
  };

  // ---------- category glyphs (drawn marks only, no letters) ----------
  function gFox() {
    inkSetup(0.05);
    var head = smooth([
      [-0.42, 0.02], [-0.38, -0.40], [-0.13, -0.18], [0, -0.24], [0.13, -0.18],
      [0.38, -0.40], [0.42, 0.02], [0.20, 0.34], [0, 0.44], [-0.20, 0.34]
    ], 3);
    strokePts(head.concat([head[0]]));
    ctx.fillStyle = INK;
    dot(-0.15, 0.0, 0.035); dot(0.15, 0.0, 0.035); dot(0, 0.28, 0.04);
  }
  function gFern() { ctx.save(); ctx.scale(0.85, 0.85); pFern(); ctx.restore(); }
  function gHood() {
    inkSetup(0.05);
    ctx.beginPath(); ctx.arc(0, 0, 0.30, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0.02, 0.50, Math.PI * 0.82, Math.PI * 2.18); ctx.stroke();
    line(-0.475, 0.17, -0.44, 0.46);
    line(0.475, 0.17, 0.44, 0.46);
    ctx.fillStyle = INK;
    dot(-0.10, -0.02, 0.032); dot(0.10, -0.02, 0.032);
  }
  function gBoat() {
    inkSetup(0.05);
    strokePts(smooth([[-0.44, 0.08], [0, 0.18], [0.44, 0.08], [0.30, 0.32], [-0.30, 0.32], [-0.44, 0.08]], 3));
    line(0, 0.08, 0, -0.40);
    strokePts([[0.05, -0.34], [0.05, 0.02], [0.32, 0.02], [0.05, -0.34]]);
  }
  function gHouse() {
    inkSetup(0.05);
    ctx.save(); ctx.translate(-0.10, 0.02); ctx.scale(0.78, 0.78); pHouse(); ctx.restore();
    line(0.40, 0.38, 0.40, 0.02);
    strokePts(circlePts(0.40, -0.08, 0.13, 14));
  }
  var GLYPHS = [gFox, gFern, gHood, gBoat, gHouse];

  // ---------- paper grain (seeded, static) ----------
  var grainRng = mulberry32(616000);
  var grain = [];
  for (var gi = 0; gi < 240; gi++) {
    grain.push({ x: grainRng(), y: grainRng(), r: 0.6 + grainRng() * 0.9, ink: grainRng() > 0.5 });
  }

  // ---------- pages model ----------
  // A page is a list of marks. Nothing is ever erased; turning a page
  // starts a fresh list and the old one is kept in the array.
  // mark kinds:
  //  stamp: {kind, cat, variant, nx, ny, s, rot, flip, bornAt}
  //  stain: {kind, pts:[[nx,ny]...], type, anchor, bornAt}
  var MAX_PAGES = 12;
  var pages = [];
  var catStreams = {};
  var ci;
  for (ci = 0; ci < CATEGORIES.length; ci++) {
    catStreams[CATEGORIES[ci]] = mulberry32(616100 + ci * 131);
  }
  var stainStream = mulberry32(616500);
  var stainCount = 0;
  var READ_TYPES = ['fox', 'bird', 'longneck', 'fish'];

  function stampMark(cat, variant, nx, ny, s, rot, flip, bornAt) {
    return { kind: 'stamp', cat: cat, variant: variant, nx: nx, ny: ny,
             s: s, rot: rot, flip: flip, bornAt: bornAt };
  }

  // page 1 arrives pre-filed: one stamp from each category
  var starter = { marks: [
    stampMark('animal',    0, 0.22, 0.30, 1.00,  0.05,  1, -10),
    stampMark('vegetation', 0, 0.55, 0.27, 1.05, -0.04,  1, -10),
    stampMark('character', 0, 0.78, 0.50, 1.00,  0.03,  1, -10),
    stampMark('object',    0, 0.36, 0.60, 1.05, -0.05, -1, -10),
    stampMark('place',     0, 0.64, 0.68, 1.00,  0.04,  1, -10)
  ] };
  pages.push(starter);

  function currentPage() { return pages[pages.length - 1]; }

  // ---------- layout ----------
  var stitch = { x: 14, y: 14, w: 100, h: 100 };
  var glyphPos = []; // {x, y, r} in px
  var glyphR = 20;

  function layout() {
    var m = Math.min(W, H);
    var inset = Math.max(12, m * 0.035);
    stitch = { x: inset, y: inset, w: W - inset * 2, h: H - inset * 2 };
    glyphR = Math.max(17, Math.min(30, m * (isPhone() ? 0.052 : 0.042)));
    glyphPos = [];
    var gy = H - inset - glyphR - Math.max(6, m * 0.012);
    for (var i = 0; i < 5; i++) {
      glyphPos.push({ x: W * (0.14 + i * 0.18), y: gy, r: glyphR });
    }
  }

  function stampUnit() { return Math.min(W, H) * (isPhone() ? 0.105 : 0.092); }

  // ---------- drawing ----------
  function drawStamp(mk, t) {
    var age = t - mk.bornAt;
    var aIn = age < 0 ? 1 : Math.min(1, age / 0.35);
    var steps = [0.7, 0.88, 1];
    var sc = age < 0 ? 1 : steps[Math.min(2, Math.floor(Math.max(0, age) / 0.12))];
    var u = stampUnit() * mk.s * sc;
    ctx.save();
    ctx.globalAlpha = 0.94 * aIn;
    ctx.translate(mk.nx * W, mk.ny * H);
    ctx.rotate(mk.rot);
    ctx.scale(u * mk.flip, u);
    MOTIFS[mk.cat][mk.variant]();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function stainGeom(mk) {
    var pts = mk.pts.map(function (p) { return [p[0] * W, p[1] * H]; });
    var cx = 0, cy = 0, i;
    for (i = 0; i < pts.length; i++) { cx += pts[i][0]; cy += pts[i][1]; }
    cx /= pts.length; cy /= pts.length;
    var R = 0;
    for (i = 0; i < pts.length; i++) {
      var dx = pts[i][0] - cx, dy = pts[i][1] - cy;
      R = Math.max(R, Math.sqrt(dx * dx + dy * dy));
    }
    return { pts: pts, cx: cx, cy: cy, R: R + Math.min(W, H) * 0.016 };
  }

  function drawStainWash(pts, alphaMul) {
    var m = Math.min(W, H);
    var baseR = m * 0.030;
    ctx.fillStyle = ACCENT;
    var pass, i;
    for (pass = 0; pass < 2; pass++) {
      ctx.globalAlpha = (pass === 0 ? 0.15 : 0.10) * alphaMul;
      for (i = 0; i < pts.length; i++) {
        var wob = 0.75 + 0.45 * Math.abs(Math.sin(i * 1.7 + pass * 0.9));
        dot(pts[i][0] + (pass ? baseR * 0.25 : 0), pts[i][1] + (pass ? baseR * 0.18 : 0), baseR * wob * (pass ? 0.7 : 1));
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawStain(mk, t) {
    var g = stainGeom(mk);
    var age = t - mk.bornAt;
    var aIn = age < 0 ? 1 : Math.min(1, age / 0.3);
    drawStainWash(g.pts, aIn);
    // the reading: a creature read from the stain's own contour
    var prog = 0;
    if (age < 0) prog = 1;
    else if (age > 0.25) prog = Math.floor(Math.min(1, (age - 0.25) / 0.8) * 6) / 6;
    if (prog <= 0) return;
    var paths = creaturePaths(mk.type);
    var ax = g.cx + Math.cos(mk.anchor) * g.R * 0.92;
    var ay = g.cy + Math.sin(mk.anchor) * g.R * 0.92;
    var rot = paths.tangent ? mk.anchor + Math.PI / 2 : mk.anchor;
    var s = Math.max(Math.min(W, H) * 0.05, Math.min(Math.min(W, H) * 0.20, g.R * 1.05));
    ctx.save();
    ctx.translate(ax, ay);
    ctx.rotate(rot);
    ctx.scale(s * mk.flip, s);
    ctx.globalAlpha = 0.94;
    paintCreature(mk.type, prog, null);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    // page ground
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    // grain
    for (var i = 0; i < grain.length; i++) {
      var gp = grain[i];
      ctx.fillStyle = gp.ink ? INK : GRAY;
      ctx.globalAlpha = gp.ink ? 0.08 : 0.15;
      dot(gp.x * W, gp.y * H, gp.r);
    }
    ctx.globalAlpha = 1;
    // page edge + stitched margin
    ctx.strokeStyle = INK; ctx.globalAlpha = 0.16; ctx.lineWidth = 1.4;
    ctx.strokeRect(1, 1, W - 2, H - 2);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = GRAY; ctx.lineWidth = 1.3;
    ctx.setLineDash([Math.max(4, W * 0.008), Math.max(3, W * 0.006)]);
    ctx.strokeRect(stitch.x, stitch.y, stitch.w, stitch.h);
    ctx.setLineDash([]);
    // current page marks, in the order they were filed
    var marks = currentPage().marks;
    for (i = 0; i < marks.length; i++) {
      if (marks[i].kind === 'stamp') drawStamp(marks[i], t);
      else drawStain(marks[i], t);
    }
    // live stain while dragging
    if (drag && drag.moved > 10 && !drag.glyphCat && drag.path.length > 1) {
      drawStainWash(drag.path.map(function (p) { return [p.x, p.y]; }), 0.8);
    }
    // page counter: tally dots, top-right; current page's dot in accent
    var m = Math.min(W, H);
    var dr = Math.max(2.2, m * 0.0075), dsp = dr * 3.1;
    var tx = stitch.x + stitch.w - dr - 4, ty = stitch.y + dr + 5;
    for (i = 0; i < pages.length; i++) {
      ctx.fillStyle = (i === pages.length - 1) ? ACCENT : INK;
      ctx.globalAlpha = (i === pages.length - 1) ? 0.95 : 0.55;
      dot(tx - (pages.length - 1 - i) * dsp, ty, dr);
    }
    ctx.globalAlpha = 1;
    // category glyph row along the bottom edge
    for (i = 0; i < 5; i++) {
      var gp2 = glyphPos[i];
      ctx.strokeStyle = GRAY; ctx.globalAlpha = 0.75; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.arc(gp2.x, gp2.y, gp2.r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(gp2.x, gp2.y);
      ctx.scale(gp2.r * 1.45, gp2.r * 1.45);
      ctx.globalAlpha = 0.92;
      GLYPHS[i]();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  // ---------- interaction ----------
  var drag = null;
  var lastPageTap = null; // {t, x, y}

  function evtPos(e) {
    if (e.clientX !== undefined) return { x: e.clientX, y: e.clientY };
    if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches.length) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: 0, y: 0 };
  }

  function glyphAt(x, y) {
    for (var i = 0; i < glyphPos.length; i++) {
      var g = glyphPos[i];
      var dx = x - g.x, dy = y - g.y;
      if (Math.sqrt(dx * dx + dy * dy) < g.r * 1.35) return CATEGORIES[i];
    }
    return null;
  }

  function stampFromGlyph(cat, now) {
    var rng = catStreams[cat];
    var page = currentPage();
    var nx = 0.3, ny = 0.4, ok = false, tries = 0;
    while (!ok && tries < 8) {
      tries++;
      nx = 0.14 + rng() * 0.72;
      ny = 0.15 + rng() * 0.58;
      ok = true;
      for (var i = 0; i < page.marks.length; i++) {
        var mk = page.marks[i];
        if (mk.kind !== 'stamp') continue;
        var dx = (mk.nx - nx) * W, dy = (mk.ny - ny) * H;
        if (Math.sqrt(dx * dx + dy * dy) < Math.min(W, H) * 0.13) { ok = false; break; }
      }
    }
    var variant = Math.floor(rng() * 3);
    var rot = (rng() - 0.5) * 0.24;
    var flip = rng() > 0.5 ? -1 : 1;
    var s = 0.9 + rng() * 0.25;
    page.marks.push(stampMark(cat, variant, nx, ny, s, rot, flip, now));
  }

  function onDown(e) {
    var p = evtPos(e);
    drag = { sx: p.x, sy: p.y, lx: p.x, ly: p.y, path: [p], moved: 0, glyphCat: glyphAt(p.x, p.y) };
  }

  function onMove(e) {
    if (!drag) return;
    var p = evtPos(e);
    var dx = p.x - drag.lx, dy = p.y - drag.ly;
    drag.moved += Math.sqrt(dx * dx + dy * dy);
    drag.lx = p.x; drag.ly = p.y;
    // keep path points spaced so the wash reads as a chain of blobs
    var last = drag.path[drag.path.length - 1];
    var ddx = p.x - last.x, ddy = p.y - last.y;
    if (Math.sqrt(ddx * ddx + ddy * ddy) > Math.min(W, H) * 0.02) {
      drag.path.push(p);
      if (drag.path.length > 42) drag.path.shift();
    }
  }

  function onUp(e) {
    if (!drag) return;
    var d = drag; drag = null;
    var p = evtPos(e);
    var now = elapsed();
    if (d.glyphCat) {
      // a tap on a glyph stamps its category; a drag away does not
      var g = null;
      for (var i = 0; i < glyphPos.length; i++) if (CATEGORIES[i] === d.glyphCat) g = glyphPos[i];
      var dx = p.x - d.sx, dy = p.y - d.sy;
      if (g && Math.sqrt((p.x - g.x) * (p.x - g.x) + (p.y - g.y) * (p.y - g.y)) < g.r * 1.35 &&
          Math.sqrt(dx * dx + dy * dy) < g.r * 1.2) {
        stampFromGlyph(d.glyphCat, now);
        lastPageTap = null;
      }
      return;
    }
    if (d.moved < 8) { // tap on the page: two in quick succession turn it
      if (lastPageTap && (now - lastPageTap.t) < 0.35) {
        var ddx = p.x - lastPageTap.x, ddy = p.y - lastPageTap.y;
        if (Math.sqrt(ddx * ddx + ddy * ddy) < 44) {
          if (pages.length < MAX_PAGES) pages.push({ marks: [] }); // the book is full at 12
          lastPageTap = null;
          return;
        }
      }
      lastPageTap = { t: now, x: p.x, y: p.y };
      return;
    }
    // drag on the page: the stain is filed, then read into a creature
    if (d.path.length < 2) return;
    stainCount++;
    var rng = mulberry32(616500 + stainCount * 331);
    var type = READ_TYPES[Math.floor(rng() * READ_TYPES.length)];
    var anchor = -Math.PI / 2 + (rng() - 0.5) * 1.8;
    var flip = rng() > 0.5 ? -1 : 1;
    var pts = d.path.map(function (q) { return [q.x / W, q.y / H]; });
    currentPage().marks.push({ kind: 'stain', pts: pts, type: type, anchor: anchor, flip: flip, bornAt: now });
    lastPageTap = null;
  }

  if (canvas.addEventListener) {
    if (typeof window !== 'undefined' && window.PointerEvent) {
      canvas.addEventListener('pointerdown', onDown);
      canvas.addEventListener('pointermove', onMove);
      canvas.addEventListener('pointerup', onUp);
      canvas.addEventListener('pointercancel', function () { drag = null; });
    } else {
      canvas.addEventListener('mousedown', onDown);
      canvas.addEventListener('mousemove', onMove);
      canvas.addEventListener('mouseup', onUp);
      canvas.addEventListener('touchstart', onDown);
      canvas.addEventListener('touchmove', onMove);
      canvas.addEventListener('touchend', onUp);
    }
  }

  // ---------- time: frame one is synchronous at fixed phase 0 ----------
  var T0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
  function elapsed() {
    if (typeof performance !== 'undefined' && performance.now) {
      return Math.max(0, (performance.now() - T0) / 1000);
    }
    return 0;
  }

  resize();
  draw(0); // frame one: page 1 pre-filed, five starter stamps, one tally dot

  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(elapsed());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
