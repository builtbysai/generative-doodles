<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№1939 Two Voices, One Room</title>
<style>
  html, body { margin: 0; padding: 0; background: #d8cbb2; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Palette: the room in warm stone and daylight, the organ voice in
  // deep umber bands, the wanderer in a thin silver thread.
  var STONE_TOP = '#e9e0cb';   // daylight wash at the top of the room
  var STONE_MID = '#dccfb2';   // warm stone wall
  var STONE_LOW = '#cbb99b';    // warm stone at the base of the wall
  var INK = '#3a2c1c';         // plate ink, dark umber
  var INK_DIM = '#6b5a41';     // muted ink
  var HINT_INK = '#f2ead6';    // hint ink, pale on the dark bands
  var UMBER = ['#3a2817', '#4a3220', '#5d3f27', '#6b4a2f', '#7a5636'];
  var UMBER_SEP = '#e8dcc2';   // pale separator between bands
  var THREAD = '#a8aeb4';       // silver thread, dark enough to read on pale stone
  var THREAD_HEAD = '#f4f6f8';  // bright head of the thread
  var DAYLIGHT = '#f4ecd6';     // daylight patch

  // The duet, as a felt phenomenon: two voices share one room. The low
  // organ voice holds slow chords in the lower half, swelling and
  // receding on a two-minute breath. The wanderer, a thin silver thread,
  // circles the upper half. When the organ swells, the wanderer quiets
  // and moves to the edges; when the organ recedes, the wanderer crosses
  // the center and dips toward the bands. Over long minutes they find a
  // balance and hold it. Neither voice ever wins permanently: both
  // settle into a limit cycle, and a drag is only a nudge to the
  // coupling, never a steering wheel.
  //
  // Fixed-phase first frame: FIRST_T = 75 s. The organ is receding
  // (swell 0.41), the wanderer is mid-crossing at the center of the
  // upper half and dipping toward the bands, so the duet reads at a
  // glance. Frame one is byte-reproducible: every position is a pure
  // function of t and the seeded PRNG, and the interaction state starts
  // at zero.
  var FIRST_T = 75;
  var TAU = Math.PI * 2;

  // Seeded PRNG, mulberry32. A fresh instance is built per draw from the
  // piece number, so every frame is reproducible regardless of call order.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var dragging = false, lastX = 0, lastY = 0;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function hexA(h, a) {
    var r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a4(a) + ')';
  }

  // ---- Coupled negotiation model.
  // Organ swell: a slow two-minute breath, 0..1.
  function swell(t) { return 0.5 + 0.5 * Math.sin(TAU * t / 120 - 0.6); }
  // Interaction state: a gentle nudge, not a steering wheel. Dragging
  // toward the bands raises nudgeTarget (organ yields, wanderer may come
  // closer); dragging away lowers it. Both decay back to zero, so the
  // duet always returns to its own balance.
  var nudge = 0, nudgeTarget = 0;
  var lastT = FIRST_T;
  // Wanderer edge-bias: high when the organ swells, the thread hugs the
  // top and edges; low when the organ recedes, the thread crosses the
  // center and dips toward the bands.
  function edgeBias(t) {
    return clamp(0.25 + 0.55 * swell(t) - nudge, 0.05, 0.95);
  }
  // Organ yield: a downward nudge shrinks the bands a little, an upward
  // nudge lets them swell a little. Never more than a nudge.
  function bandScale() {
    return clamp(1 - 0.30 * Math.max(0, nudge) + 0.10 * Math.max(0, -nudge), 0.7, 1.1);
  }
  // Wanderer head position at simulated time tau. The trail is drawn
  // from past head positions, so the thread reads as a path, not a dot.
  function headPos(tau) {
    var eb = edgeBias(tau);
    var x = W / 2 + (W * 0.30 + W * 0.12 * eb) * Math.sin(TAU * tau / 75);
    var y = H * (0.46 - 0.28 * eb) + Math.sin(TAU * tau / 23) * H * 0.018;
    return { x: clamp(x, W * 0.04, W * 0.96), y: clamp(y, H * 0.10, H * 0.50) };
  }

  // Stone seams: fixed wall joints, from the seeded PRNG.
  var SEAMS = [];
  (function buildSeams() {
    var rng = mulberry32(1939);
    for (var i = 0; i < 3; i++) { SEAMS.push(0.22 + rng() * 0.6); }
  })();

  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  // One organ band: a stacked strip with a slow wavy top edge, drawn
  // from yBottom upward to yTop.
  function drawBand(yBottom, yTop, color, t, phase) {
    var amp = Math.max(2, H * 0.006);
    var wl = W / 3;
    ctx.beginPath();
    ctx.moveTo(0, yBottom);
    ctx.lineTo(0, yTop + Math.sin(phase + t * 0.05) * amp);
    for (var x = 0; x <= W; x += 8) {
      ctx.lineTo(x, yTop + Math.sin(phase + x / wl * TAU + t * 0.05) * amp);
    }
    ctx.lineTo(W, yBottom);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function draw(t) {
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Interaction state decays with simulated time, so a nudge fades
    // and the duet returns to its own balance. dt is floored at zero so
    // a backward clock step (resize redraw at FIRST_T) never rewinds it;
    // a long forward jump simply decays the nudge fully, which is the
    // correct end state after a long idle.
    var dt = Math.max(0, t - lastT);
    if (dt > 0) {
      nudgeTarget *= Math.exp(-dt / 12);
      nudge += (nudgeTarget - nudge) * Math.min(1, dt * 2);
      lastT = t;
    }

    var s = swell(t);
    var eb = edgeBias(t);
    var bs = bandScale();
    var bandTop = H * 0.52;
    var lowerH = H - bandTop;

    // ---- Room: warm stone, daylight at the top.
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, STONE_TOP);
    g.addColorStop(0.45, STONE_MID);
    g.addColorStop(1, STONE_LOW);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Daylight patch, upper right, a soft radial wash, not a disc.
    var dg = ctx.createRadialGradient(W * 0.95, H * 0.02, 0, W * 0.95, H * 0.02, W * 0.55);
    dg.addColorStop(0, hexA(DAYLIGHT, 0.30));
    dg.addColorStop(1, hexA(DAYLIGHT, 0));
    ctx.fillStyle = dg;
    ctx.fillRect(0, 0, W, bandTop);

    // Stone seams, faint vertical joints in the upper wall.
    ctx.strokeStyle = hexA(INK, 0.06);
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var si = 0; si < SEAMS.length; si++) {
      var sx = SEAMS[si] * W;
      ctx.moveTo(sx, H * 0.02);
      ctx.lineTo(sx, bandTop);
    }
    ctx.stroke();

    // ---- Organ voice: stacked umber bands in the lower half. The
    // stack is anchored at the floor line and always fills the lower
    // half at rest; the bands trade height with each other as the organ
    // breathes, and the whole stack yields a little from the bottom
    // under a downward nudge, giving the wanderer more room.
    var fracs = [0.34, 0.26, 0.18, 0.13, 0.09];
    var raws = [], sumRaw = 0;
    for (var b = 0; b < UMBER.length; b++) {
      var ph = 0.75 + 0.25 * Math.sin(TAU * t / 97 + b * 1.3);
      raws.push(fracs[b] * (0.6 + 0.5 * s * ph));
      sumRaw += raws[b];
    }
    var total = lowerH * bs;
    var yCursor = bandTop;
    for (var b2 = 0; b2 < UMBER.length; b2++) {
      var bh = total * raws[b2] / sumRaw;
      var yTop = yCursor, yBot = yCursor + bh;
      drawBand(yBot, yTop, UMBER[b2], t, b2 * 1.7);
      // Pale separator along the wavy top edge.
      ctx.strokeStyle = hexA(UMBER_SEP, 0.14);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, yTop);
      for (var sx2 = 0; sx2 <= W; sx2 += 8) {
        ctx.lineTo(sx2, yTop + Math.sin(b2 * 1.7 + sx2 / (W / 3) * TAU + t * 0.05) * Math.max(2, H * 0.006));
      }
      ctx.stroke();
      yCursor = yBot;
    }
    // When the organ swells, a soft wash rises just above the bands.
    if (s > 0.55) {
      ctx.fillStyle = hexA(UMBER[4], a4((s - 0.55) * 0.12));
      ctx.fillRect(0, bandTop - H * 0.03, W, H * 0.03);
    }
    // Room floor line: the top of the organ stack.
    ctx.strokeStyle = hexA(INK, 0.25);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, bandTop); ctx.lineTo(W, bandTop);
    ctx.stroke();

    // ---- Wanderer: the silver thread, a trail of past positions
    // across the upper half, fading into the past, with a bright head.
    var TRAIL = 48, STEP = 0.6;
    var nSeg = Math.floor(TRAIL / STEP);
    ctx.lineWidth = Math.max(1.6, W * 0.003);
    ctx.lineCap = 'round';
    for (var k = 0; k < nSeg; k++) {
      var tau0 = t - TRAIL + k * STEP;
      var tau1 = tau0 + STEP;
      var p0 = headPos(tau0), p1 = headPos(tau1);
      var fade = (k + 1) / nSeg; // 0 in the deep past, 1 at the head
      ctx.strokeStyle = hexA(THREAD, a4(0.25 + 0.70 * fade * fade));
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();
    }
    // Head: a bright dot with a soft halo, mid-crossing at frame one.
    var head = headPos(t);
    ctx.fillStyle = hexA(THREAD_HEAD, 0.25);
    ctx.beginPath();
    ctx.moveTo(head.x + W * 0.012, head.y);
    ctx.arc(head.x, head.y, W * 0.012, 0, TAU);
    ctx.fill();
    ctx.fillStyle = THREAD_HEAD;
    ctx.beginPath();
    ctx.moveTo(head.x + W * 0.005, head.y);
    ctx.arc(head.x, head.y, W * 0.005, 0, TAU);
    ctx.fill();

    // ---- Plates: title top-left, room name top-right.
    var fsTitle = Math.round(20 * clamp(W / 560, 0.8, 1.15));
    var fsSub = Math.round(fsTitle * 0.62);
    var fsSmall = Math.round(fsTitle * 0.5);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsTitle + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Two Voices, One Room', 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK, 0.75);
    ctx.font = fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№1939 · 2007 · 05 · 04', 18, 18 + fsTitle * 0.8 + fsSub + 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = INK;
    ctx.font = '600 ' + fsSub + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('Hugh Lane Dublin', W - 18, 18 + fsTitle * 0.8);
    ctx.fillStyle = hexA(INK_DIM, 0.9);
    ctx.font = 'italic ' + fsSmall + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('organ below, thread above', W - 18, 18 + fsTitle * 0.8 + fsSmall + 8);
    ctx.textAlign = 'left';

    // ---- Hint, centered at the bottom, pale on the dark bands, with
    // a soft dark offset so it stays readable if the organ yields and
    // pale stone shows beneath.
    ctx.font = Math.round(12 * clamp(W / 560, 0.85, 1.1)) + 'px Georgia, "Times New Roman", serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = hexA(INK, 0.4);
    ctx.fillText('Drag gently to tilt the negotiation.', W / 2, H - 16 + 1.5);
    ctx.fillStyle = hexA(HINT_INK, 0.9);
    ctx.fillText('Drag gently to tilt the negotiation.', W / 2, H - 16);
    ctx.textAlign = 'left';
  }

  // Drag: a gentle vertical nudge to the negotiation. Dragging toward
  // the bands (down) raises the nudge so the organ yields more space;
  // dragging away lowers it. The nudge is clamped small and decays, so
  // it can never steer the duet or let one voice win. No click-to-reload.
  function nudgeBy(dy) {
    nudgeTarget = clamp(nudgeTarget + dy * 0.0012, -0.3, 0.3);
    // Ease partway at once so the tilt answers the hand immediately;
    // the draw loop finishes the ease and decays it back to zero.
    nudge += (nudgeTarget - nudge) * 0.25;
    draw(lastT);
  }
  function pointerPos(e) {
    var rect = { left: stageX, top: stageY };
    try {
      if (typeof canvas.getBoundingClientRect === 'function') {
        rect = canvas.getBoundingClientRect();
      }
    } catch (err) {}
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  if (typeof canvas.addEventListener === 'function') {
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true;
      var p = pointerPos(e);
      lastX = p.x; lastY = p.y;
      try { if (typeof canvas.setPointerCapture === 'function' && e.pointerId !== undefined) { canvas.setPointerCapture(e.pointerId); } } catch (err) {}
      try { if (typeof e.preventDefault === 'function') { e.preventDefault(); } } catch (err) {}
    });
  }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('pointermove', function (e) {
      if (!dragging) { return; }
      var p = pointerPos(e);
      var dy = p.y - lastY;
      lastX = p.x; lastY = p.y;
      nudgeBy(dy);
    });
    window.addEventListener('pointerup', function () { dragging = false; });
    window.addEventListener('pointercancel', function () { dragging = false; });
    window.addEventListener('resize', function () { resize(); draw(FIRST_T); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(FIRST_T); });
    }
  } catch (e) {}

  // QA probe hook: reports the live negotiation state so a node probe
  // can verify a drag tilts the coupling without either voice winning.
  try {
    if (typeof window !== 'undefined') {
      window.__duetProbe = function () {
        return {
          t: lastT, swell: swell(lastT), edgeBias: edgeBias(lastT),
          nudge: nudge, nudgeTarget: nudgeTarget, bandScale: bandScale()
        };
      };
    }
  } catch (e) {}

  resize();
  draw(FIRST_T); // one synchronous frame at load

  // Motion loop: the organ breathes on a two-minute cycle, the thread
  // wanders on a 75-second crossing, all motion well under 1 Hz and
  // under the 14 Hz ceiling. Guarded so node-canvas QA (no
  // requestAnimationFrame) still works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    var loop = function (now) {
      var t = FIRST_T + (now - start) / 1000;
      draw(t);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
