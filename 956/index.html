<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today's Ideology (After)</title>
<style>
  html, body { margin: 0; padding: 0; background: #EDE8DC; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // No.956 "Today's Ideology (After)" - study #117 reas, PP117 "Broadcast Collage".
  // A day's paper, made self-contained: twelve synthetic "photographs"
  // (seeded geometric scenes, no real photos, no faces, no text) in a 3x4
  // newsprint grid, distorted the way a press distorts: horizontal slice
  // bands slide at their own speeds, alternating bands split their color
  // channels, and every ~45 s the twelve cells re-cut with a 1 s stutter.
  // The dateline is the paper's own fictional calendar: it starts at the
  // first edition and advances one day per 3 minutes of piece time; each
  // new day regenerates the twelve scenes. Tap = re-cut now. Vertical
  // drag smears the bands, horizontal drag scrubs the channel split.
  // Double-tap = tomorrow's paper. Everything is closed-form over piece
  // time plus the recorded tap/drag event log, so frame one (piece time
  // 26 s, bands already displaced) is byte-stable. Scenes are data
  // (shape lists) drawn as vectors each frame - no offscreen canvas.

  var PAPER = '#EDE8DC';
  var INK = '#1C1C1C';
  var HALF = '#8B8B84';
  var RED = '#D33A2C';
  var CYAN = '#2E9BB5';
  var HUES = ['#A34A28', '#C99A2E', '#5B6B7A', '#6B7245', '#8C3B2E', '#3E7A74'];
  var GROUNDS = [PAPER, HALF, INK, '#A34A28', '#5B6B7A', PAPER, HALF, '#3E7A74'];
  var MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

  var SEED_BAND = 956117;   // the press: band heights, speeds, smear weights
  var SEED_DAY = 956200;    // per-day scene stream base
  var SEED_PERM = 956300;   // permutation stream base

  var T0 = 26;              // frame one: 26 s into day 1, bands displaced
  var DAY_LEN = 180;        // one paper day per 180 s of piece time
  var RECUT = 45;           // scheduled re-cut every 45 s
  var STUTTER = 1.0;        // re-cut stutter lasts 1 s
  var COLS = 3, ROWS = 4, NCELL = 12;
  var NB = 6;               // slice bands

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, MIN_DIM = 0, U = 1, PHONE = false;
  var currentT = T0;

  // ---- recorded events (live only; frame one has none) ----
  var tapEvents = [];       // {t, kind:'tap'|'dtap'}
  var pendingTap = null;    // tap event object already in tapEvents, may upgrade
  var drag = null;          // active drag {sx, sy, cx, cy, moved}
  var lastDrag = null;      // {smear, scrub, endT}

  // ---- deterministic RNG (mulberry32) ----
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
  function hashN(a, b, c, d) {
    var x = Math.imul(a, 374761393) ^ Math.imul(b, 668265263) ^
            Math.imul(c, 2246822519) ^ Math.imul(d, 3266489917);
    x = Math.imul(x ^ (x >>> 13), 1274126177);
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  }

  // ================= the press: slice bands (seeded once) =================
  var bands = [];
  (function buildBands() {
    var rng = mulberry32(SEED_BAND);
    var raw = [], sum = 0, i, v;
    for (i = 0; i < NB; i++) { v = 0.7 + rng() * 0.6; raw.push(v); sum += v; }
    var acc = 0;
    for (i = 0; i < NB; i++) {
      var frac = raw[i] / sum;
      bands.push({
        f0: acc, f1: acc + frac,
        amp: 10 + rng() * 20,          // px at U = 1
        period: 47 + rng() * 63,       // 47..110 s slide cycle
        phase: rng() * Math.PI * 2,
        smearW: rng() * 2 - 1,         // -1..1 stretch weight under smear
        channel: (i % 2 === 0)
      });
      acc += frac;
    }
  })();
  function bandOffset(i, t) {
    var b = bands[i];
    return b.amp * U * Math.sin((Math.PI * 2 * t) / b.period + b.phase);
  }
  function bandBounds(smear) {
    // cumulative boundaries (fractions of H) with per-band stretch
    var out = [0], acc = 0, tot = 0, i, hgt = [];
    for (i = 0; i < NB; i++) {
      var f = bands[i].f1 - bands[i].f0;
      var m = 1 + 0.55 * smear * bands[i].smearW;
      if (m < 0.25) m = 0.25;
      hgt.push(f * m); tot += f * m;
    }
    for (i = 0; i < NB; i++) { acc += hgt[i] / tot; out.push(acc); }
    return out;
  }

  // ================= the day's scenes (data, not canvases) =================
  var sceneCache = {};
  function buildScenes(day) {
    var rng = mulberry32((SEED_DAY + Math.imul(day, 1009)) | 0);
    var scenes = [], s, i;
    for (s = 0; s < NCELL; s++) {
      var ground = GROUNDS[Math.floor(rng() * GROUNDS.length)];
      var horizon = 0.52 + rng() * 0.28;
      var shapes = [];
      // horizon band: the photograph's ground plane, heavier at the bottom
      shapes.push({ k: 'r', x: 0, y: horizon, w: 1, h: 1 - horizon,
                    c: (ground === INK) ? HALF : INK, a: 0.45, hz: true });
      var n = 4 + Math.floor(rng() * 4);   // 4..7 shapes
      for (i = 0; i < n; i++) {
        var low = rng() < 0.55;
        var kind = Math.floor(rng() * 5);
        var col = (rng() < 0.72) ? HUES[Math.floor(rng() * HUES.length)]
                                 : [INK, HALF, PAPER][Math.floor(rng() * 3)];
        if (col === ground) col = (ground === INK) ? PAPER : INK;
        var sc = low ? 0.16 + rng() * 0.26 : 0.09 + rng() * 0.20;
        var cxp = 0.12 + rng() * 0.76;
        var cyp = low ? horizon - 0.06 + rng() * (1.02 - horizon)
                      : 0.10 + rng() * Math.max(0.08, horizon - 0.16);
        var sh;
        if (kind === 0) sh = { k: 'r', x: cxp - sc / 2, y: cyp - sc * 0.35, w: sc, h: sc * 0.7, c: col, a: 1 };
        else if (kind === 1) sh = { k: 'c', x: cxp, y: cyp, r: sc * 0.42, c: col, a: 1 };
        else if (kind === 2) sh = { k: 'h', x: cxp, y: cyp, r: sc * 0.5, up: rng() < 0.5, c: col, a: 1 };
        else if (kind === 3) sh = { k: 't', x: cxp, y: cyp, w: sc * 0.9, h: sc * 0.66, flip: rng() < 0.5, c: col, a: 1 };
        else sh = { k: 'r', x: cxp - sc * 0.7, y: cyp - 0.03, w: sc * 1.4, h: 0.055 + rng() * 0.05, c: col, a: 1 };
        shapes.push(sh);
      }
      scenes.push({ ground: ground, shapes: shapes });
    }
    return scenes;
  }
  function scenesFor(day) {
    if (!sceneCache[day]) {
      if (Object.keys(sceneCache).length > 4) sceneCache = {};
      sceneCache[day] = buildScenes(day);
    }
    return sceneCache[day];
  }

  // ================= permutations and the transition timeline =================
  function permFor(day, serial) {
    var rng = mulberry32((SEED_PERM + Math.imul(day, 7919) + Math.imul(serial, 131)) | 0);
    var p = [], i;
    for (i = 0; i < NCELL; i++) p.push(i);
    for (i = NCELL - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = p[i]; p[i] = p[j]; p[j] = tmp;
    }
    return p;
  }
  // All transitions up to time t: scheduled re-cuts (45 s), scheduled day
  // boundaries (180 s, which are also re-cuts), taps, double-taps.
  function buildTransitions(t) {
    var list = [], k, T;
    for (k = 1; RECUT * k <= t; k++) {
      T = RECUT * k;
      list.push({ time: T, kind: (T % DAY_LEN === 0) ? 'day' : 'recut', pri: 2 });
    }
    for (var i = 0; i < tapEvents.length; i++) {
      var e = tapEvents[i];
      if (e.t <= t) list.push({ time: e.t, kind: e.kind, pri: (e.kind === 'dtap') ? 0 : 1 });
    }
    list.sort(function (a, b) { return (a.time - b.time) || (a.pri - b.pri); });
    var day = 0;
    for (var m = 0; m < list.length; m++) {
      var tr = list[m];
      tr.dayBefore = day;
      if (tr.kind === 'day' || tr.kind === 'dtap') day += 1;
      tr.dayAfter = day;
      tr.serial = m + 1;
    }
    return { list: list, day: day, last: list.length ? list[list.length - 1] : null };
  }
  function stateAt(t) {
    var tr = buildTransitions(t);
    var L = tr.last;
    if (!L) {
      return { dayPrev: 0, dayNew: 0, permPrev: null, permNew: permFor(0, 0),
               phase: 1, serial: 0 };
    }
    var age = t - L.time;
    if (age >= STUTTER) {
      return { dayPrev: L.dayAfter, dayNew: L.dayAfter, permPrev: null,
               permNew: permFor(L.dayAfter, L.serial), phase: 1, serial: L.serial };
    }
    return { dayPrev: L.dayBefore, dayNew: L.dayAfter,
             permPrev: permFor(L.dayBefore, L.serial - 1),
             permNew: permFor(L.dayAfter, L.serial),
             phase: age / STUTTER, serial: L.serial };
  }

  // ================= drawing =================
  function cellRect(c) {
    var m = Math.max(5, MIN_DIM * 0.022);
    var g = Math.max(2, MIN_DIM * 0.006);
    var gw = W - 2 * m, gh = H - 2 * m;
    var cw = (gw - (COLS - 1) * g) / COLS;
    var ch = (gh - (ROWS - 1) * g) / ROWS;
    var col = c % COLS, row = Math.floor(c / COLS);
    return { x: m + col * (cw + g), y: m + row * (ch + g), w: cw, h: ch };
  }
  function drawShape(sh, R, override) {
    ctx.fillStyle = override || sh.c;
    ctx.globalAlpha = sh.a;
    var x = R.x, y = R.y, w = R.w, h = R.h;
    ctx.beginPath();
    if (sh.k === 'r') {
      ctx.rect(x + sh.x * w, y + sh.y * h, sh.w * w, sh.h * h);
    } else if (sh.k === 'c') {
      ctx.arc(x + sh.x * w, y + sh.y * h, sh.r * Math.min(w, h), 0, Math.PI * 2);
    } else if (sh.k === 'h') {
      var cx = x + sh.x * w, cy = y + sh.y * h, r = sh.r * Math.min(w, h);
      if (sh.up) ctx.arc(cx, cy, r, Math.PI, 0); else ctx.arc(cx, cy, r, 0, Math.PI);
      ctx.closePath();
    } else { // 't' triangle
      var tx = x + sh.x * w, ty = y + sh.y * h, tw = sh.w * w, th = sh.h * h;
      if (sh.flip) {
        ctx.moveTo(tx - tw / 2, ty + th / 2); ctx.lineTo(tx + tw / 2, ty + th / 2); ctx.lineTo(tx, ty - th / 2);
      } else {
        ctx.moveTo(tx - tw / 2, ty - th / 2); ctx.lineTo(tx + tw / 2, ty - th / 2); ctx.lineTo(tx, ty + th / 2);
      }
      ctx.closePath();
    }
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  function drawScene(sc, R, override, alphaMul) {
    ctx.save();
    ctx.beginPath(); ctx.rect(R.x, R.y, R.w, R.h); ctx.clip();
    if (!override) {
      ctx.globalAlpha = alphaMul;
      ctx.fillStyle = sc.ground;
      ctx.fillRect(R.x, R.y, R.w, R.h);
      ctx.globalAlpha = 1;
    }
    for (var i = 0; i < sc.shapes.length; i++) {
      var sh = sc.shapes[i];
      if (override && sh.hz) continue;   // fringe comes from shape edges
      // drawShape sets globalAlpha from sh.a; fold in the pass multiplier
      var keepA = sh.a;
      sh.a = (override ? 1 : sh.a) * alphaMul;
      drawShape(sh, R, override);
      sh.a = keepA;
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  function drawGrid(st, override, alphaMul, bandY0, bandY1) {
    var scenesPrev = scenesFor(st.dayPrev), scenesNew = scenesFor(st.dayNew);
    for (var c = 0; c < NCELL; c++) {
      var R = cellRect(c);
      if (R.y + R.h < bandY0 - 4 * U || R.y > bandY1 + 4 * U) continue;
      var useNew = st.phase >= 1 || st.phase >= ((c % 2 === 0) ? 0.33 : 0.66);
      var sc = useNew ? scenesNew[st.permNew[c]] : scenesPrev[st.permPrev[c]];
      if (st.phase < 1) {
        var step = Math.floor(st.phase * 12);
        R = { x: R.x + (hashN(c, step, st.serial, 1) - 0.5) * 6 * U,
              y: R.y + (hashN(c, step, st.serial, 2) - 0.5) * 6 * U, w: R.w, h: R.h };
      }
      drawScene(sc, R, override, alphaMul);
    }
  }
  function dateline(day) {
    // the paper's fictional calendar: day 0 is the first edition
    var d = new Date(Date.UTC(2026, 9, 21) + day * 86400000);
    var str = d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
    var px = Math.max(9, Math.round(11 * U));
    ctx.font = 'bold ' + px + 'px "Courier New", monospace';
    ctx.textBaseline = 'alphabetic';
    var tw = ctx.measureText(str).width;
    var pad = 4 * U;
    ctx.globalAlpha = 0.92; ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, tw + pad * 2, px + pad * 1.6);
    ctx.globalAlpha = 1; ctx.fillStyle = INK;
    ctx.fillText(str, pad, px + pad * 0.55);
  }
  function dragState(t) {
    var smear = 0, scrub = 0;
    if (drag) {
      smear = clamp((drag.cy - drag.sy) / (0.25 * H), -1, 1);
      scrub = clamp((drag.cx - drag.sx) / (0.20 * W), -1, 1) * 9;
    } else if (lastDrag) {
      var age = t - lastDrag.endT;
      if (age < 2.5) {
        var decay = Math.exp(-age / 0.30);
        smear = lastDrag.smear * decay;
        scrub = lastDrag.scrub * decay;
      }
    }
    return { smear: smear, scrub: scrub };
  }
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var ds = dragState(t);
    var st = stateAt(t);
    var bounds = bandBounds(ds.smear);
    ctx.globalAlpha = 1;
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    var split = (3 + ds.scrub) * U;
    if (split < 0.4 * U) split = 0.4 * U;
    for (var b = 0; b < NB; b++) {
      var y0 = bounds[b] * H, y1 = bounds[b + 1] * H;
      if (y1 - y0 < 1) continue;
      var off = bandOffset(b, t);
      var passes;
      if (bands[b].channel) {
        passes = [{ ov: RED, dx: off - split, am: 0.35 },
                  { ov: CYAN, dx: off + split, am: 0.35 },
                  { ov: null, dx: off, am: 1 }];
      } else {
        passes = [{ ov: null, dx: off, am: 1 }];
      }
      ctx.save();
      ctx.beginPath(); ctx.rect(0, y0, W, y1 - y0); ctx.clip();
      for (var p = 0; p < passes.length; p++) {
        var ps = passes[p];
        var wraps = [ps.dx];
        if (ps.dx > 0) wraps.push(ps.dx - W);
        if (ps.dx < 0) wraps.push(ps.dx + W);
        for (var wi = 0; wi < wraps.length; wi++) {
          ctx.save();
          ctx.translate(wraps[wi], 0);
          drawGrid(st, ps.ov, ps.am, y0, y1);
          ctx.restore();
        }
      }
      ctx.restore();
    }
    dateline(st.phase < 0.5 ? st.dayPrev : st.dayNew);
  }

  // ================= audio (lazy, gesture-only, guarded) =================
  var AC = (typeof AudioContext !== 'undefined') ? AudioContext
         : ((typeof webkitAudioContext !== 'undefined') ? webkitAudioContext : null);
  var audio = null;
  function ensureAudio() {
    if (audio || !AC) return;
    try {
      var ac = new AC();
      var master = ac.createGain(); master.gain.value = 0.12;
      master.connect(ac.destination);
      var bedFilter = ac.createBiquadFilter();
      bedFilter.type = 'lowpass'; bedFilter.frequency.value = 240;
      bedFilter.connect(master);
      var noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      var nd = noiseBuf.getChannelData(0);
      var nr = mulberry32(956999);
      for (var i = 0; i < nd.length; i++) nd[i] = nr() * 2 - 1;
      audio = { ac: ac, master: master, bed: bedFilter, noiseBuf: noiseBuf, nextThump: 0 };
      if (typeof setInterval !== 'undefined') {
        audio.timer = setInterval(scheduleThumps, 300);
      }
    } catch (e) { audio = null; }
  }
  function scheduleThumps() {
    if (!audio) return;
    try {
      var ac = audio.ac;
      if (!audio.nextThump) audio.nextThump = ac.currentTime + 0.1;
      while (audio.nextThump < ac.currentTime + 0.7) {
        var t = audio.nextThump;
        var osc = ac.createOscillator(), g = ac.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(56, t);
        osc.frequency.exponentialRampToValueAtTime(38, t + 0.16);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.5, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        osc.connect(g); g.connect(audio.bed);
        osc.start(t); osc.stop(t + 0.22);
        audio.nextThump += 1.0;   // the press, ~1 Hz
      }
    } catch (e) {}
  }
  function noiseBurst(freq, type, peak, dur, delay) {
    if (!audio) return;
    try {
      var ac = audio.ac, t = ac.currentTime + (delay || 0);
      var src = ac.createBufferSource(); src.buffer = audio.noiseBuf; src.loop = true;
      var f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
      var g = ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(peak, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(f); f.connect(g); g.connect(audio.master);
      src.start(t); src.stop(t + dur + 0.05);
    } catch (e) {}
  }
  function swish() { noiseBurst(800, 'bandpass', 0.35, 0.5, 0); }
  function tear() { noiseBurst(2400, 'highpass', 0.5, 0.13, 0); noiseBurst(1800, 'highpass', 0.35, 0.1, 0.09); }

  // ================= interaction =================
  function evPos(e) {
    var r = { left: 0, top: 0 };
    if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function onDown(e) {
    ensureAudio();
    if (audio && audio.ac && audio.ac.resume) { try { audio.ac.resume(); } catch (err) {} }
    var p = evPos(e);
    drag = { sx: p.x, sy: p.y, cx: p.x, cy: p.y, t0: currentT, moved: false };
  }
  function onMove(e) {
    if (!drag) return;
    var p = evPos(e);
    drag.cx = p.x; drag.cy = p.y;
    if (Math.abs(p.x - drag.sx) > 7 || Math.abs(p.y - drag.sy) > 7) drag.moved = true;
  }
  function onUp(e) {
    if (!drag) return;
    var d = drag; drag = null;
    var tu = currentT;
    if (!d.moved && tu - d.t0 < 0.45) {
      // a tap: commit now; a second tap within 0.35 s upgrades it
      if (pendingTap && tu - pendingTap.t <= 0.35) {
        var idx = tapEvents.indexOf(pendingTap);
        if (idx >= 0) tapEvents.splice(idx, 1);
        tapEvents.push({ t: tu, kind: 'dtap' });
        pendingTap = null;
        tear();
      } else {
        var ev = { t: tu, kind: 'tap' };
        tapEvents.push(ev);
        pendingTap = ev;
        tear();
      }
    } else if (d.moved) {
      var ds = dragState(tu);
      // recompute from the finished drag geometry
      lastDrag = {
        smear: clamp((d.cy - d.sy) / (0.25 * H), -1, 1),
        scrub: clamp((d.cx - d.sx) / (0.20 * W), -1, 1) * 9,
        endT: tu
      };
      swish();
    }
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
  }

  // ================= layout / init =================
  function readSize() {
    var w, h;
    if (window.visualViewport && window.visualViewport.width) {
      w = window.visualViewport.width; h = window.visualViewport.height;
    } else { w = window.innerWidth; h = window.innerHeight; }
    return [Math.max(50, Math.floor(w)), Math.max(50, Math.floor(h))];
  }
  function detectPhone() {
    if (window.screen && window.screen.width) {
      return Math.min(window.screen.width, window.screen.height) < 700;
    }
    return H > W * 1.15;
  }
  function init() {
    var sz = readSize();
    W = sz[0]; H = sz[1]; MIN_DIM = Math.min(W, H); U = MIN_DIM / 720;
    canvas.width = W; canvas.height = H;
    PHONE = detectPhone();
    draw(T0);
  }
  var resizeTimer = null;
  function onResize() {
    if (typeof clearTimeout !== 'undefined' && resizeTimer) clearTimeout(resizeTimer);
    if (typeof setTimeout === 'undefined') return;
    resizeTimer = setTimeout(function () {
      var sz = readSize();
      if (sz[0] !== W || sz[1] !== H) init();
    }, 120);
  }
  if (window.addEventListener) window.addEventListener('resize', onResize);
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', onResize);
  }

  init();

  // ---- live loop: rAF typeof-guarded; frame one above is synchronous ----
  var originTs = -1, prevSerial = 0, prevDay = 0;
  function frame(ts) {
    if (originTs < 0) originTs = ts;
    currentT = T0 + Math.max(0, (ts - originTs) / 1000);
    var st = stateAt(currentT);
    if (audio && st.serial !== prevSerial) {
      if (st.dayNew !== prevDay) tear(); else swish();
    }
    prevSerial = st.serial; prevDay = st.dayNew;
    draw(currentT);
    requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
})();
</script>
</body>
</html>
