<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Complex Silence</title>
<style>
  html, body { margin: 0; padding: 0; background: #141311; overflow: hidden; }
  canvas { display: block; background: #141311; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded deterministic helpers (no Math.random) ----------
  function hash(n) {
    var x = (n * 2654435761) % 4294967296;
    x = (x ^ (x >>> 15)) % 4294967296;
    x = (x * 2246822519) % 4294967296;
    x = (x ^ (x >>> 13)) % 4294967296;
    return x / 4294967296;
  }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  // ---------- viewport ----------
  function viewport() {
    if (typeof visualViewport !== 'undefined' && visualViewport) {
      return { w: visualViewport.width, h: visualViewport.height };
    }
    return { w: window.innerWidth, h: window.innerHeight };
  }
  var W = 0, H = 0;
  function resize() {
    var v = viewport();
    W = v.w; H = v.h;
    canvas.width = Math.round(W);
    canvas.height = Math.round(H);
  }
  resize();
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', function () { resize(); draw(elapsed()); });
    if (typeof visualViewport !== 'undefined' && visualViewport && visualViewport.addEventListener) {
      visualViewport.addEventListener('resize', function () { resize(); draw(elapsed()); });
    }
  }

  // ---------- time: elapsed since load only (fixed-phase frame one) ----------
  var startMs = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  function elapsed() {
    var now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    return (now - startMs) / 1000;
  }

  // ---------- recorded events (closed-form state, never frame-integrated) ----------
  var taps = [];            // { t, x, y } in elapsed seconds / css px
  var lastActivity = 0;     // elapsed seconds of last pointer activity
  function onPointerDown(e) {
    var t = elapsed();
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    taps.push({ t: t, x: (e.clientX || 0) - r.left, y: (e.clientY || 0) - r.top });
    if (taps.length > 24) taps.shift();
    lastActivity = t;
  }
  function onPointerMove() { lastActivity = elapsed(); }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
  }

  // ---------- fragment bank: half-translated memories, mistranslated one-liners ----------
  var BANK = [
    'the rain in Seoul smells like home',
    'mother said, wear a jacket',
    'the bus stops where it used to',
    'I left my name at the airport',
    'the song ends before the chorus',
    'grandmother\u2019s kitchen, translated',
    'the river remembers in Korean',
    'half of this sentence is missing',
    'the winter light, untranslated',
    'I am louder in another language',
    'the apartment hums at night',
    'a letter I never sent, twice',
    'the mountain moved one inch',
    'my voice, smaller than the room',
    'the tide keeps my other name',
    'call your mother, the bus is late'
  ];
  var FRAGS = [];
  for (var i = 0; i < 16; i++) {
    FRAGS.push({
      text: BANK[Math.floor(hash(i * 7 + 3) * BANK.length)],
      dx: (hash(i * 13 + 1) - 0.5) * 2,          // lateral offset factor
      period: 16 + hash(i * 29 + 5) * 9,          // rise cycle seconds
      phase: hash(i * 41 + 11),                   // cycle offset 0..1
      size: 0.85 + hash(i * 17 + 7) * 0.4,        // relative font size
      drift: (hash(i * 23 + 2) - 0.5) * 2,        // lateral sway factor
      seed: i
    });
  }

  // ---------- derived state at time t (pure functions of t + event lists) ----------
  function hushLevel(t) {
    var s = 0;
    for (var k = 0; k < taps.length; k++) {
      var dt = t - taps[k].t;
      if (dt >= 0) s += Math.exp(-dt / 2.2);
    }
    return clamp(s, 0, 1);
  }
  function stillness(t) { return t - lastActivity; }
  function swell01(t) { return clamp((stillness(t) - 5) / 10, 0, 1); }

  // ---------- drawing ----------
  function draw(t) {
    if (!W || !H) resize();
    if (canvas.style) { canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; }
    var u = Math.min(W, H);
    var cx = W / 2;
    var hush = hushLevel(t);
    var swell = swell01(t);

    // room
    ctx.fillStyle = '#141311';
    ctx.fillRect(0, 0, W, H);

    // faint room seams (flat, low alpha)
    ctx.fillStyle = 'rgba(232,223,200,0.05)';
    ctx.fillRect(W * 0.08, 0, 1, H);
    ctx.fillRect(W * 0.92, 0, 1, H);

    // spotlight pool under the mic (flat alpha ellipse)
    ctx.fillStyle = 'rgba(232,223,200,0.06)';
    ctx.beginPath();
    ctx.moveTo(cx + u * 0.30, H * 0.90);
    ctx.ellipse(cx, H * 0.90, u * 0.30, u * 0.035, 0, 0, Math.PI * 2);
    ctx.fill();

    // mic geometry (sway pivots at the base)
    var micH = H * 0.62;
    var baseY = H * 0.90;
    var headW = u * 0.17;
    var headH = micH * 0.26;
    var headTop = H * 0.28 - headH / 2;
    var sway = (0.015 + 0.03 * swell) * (1 - 0.85 * hush) * Math.sin(2 * Math.PI * t / 9);

    ctx.save();
    ctx.translate(cx, baseY);
    ctx.rotate(sway);
    ctx.translate(-cx, -baseY);

    // stand pole
    ctx.fillStyle = '#1C1B1A';
    ctx.fillRect(cx - u * 0.008, headTop + headH, u * 0.016, baseY - (headTop + headH));
    // base
    ctx.fillStyle = '#1C1B1A';
    ctx.beginPath();
    ctx.moveTo(cx + u * 0.11, baseY);
    ctx.ellipse(cx, baseY, u * 0.11, u * 0.018, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(154,160,166,0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx + u * 0.11, baseY);
    ctx.ellipse(cx, baseY, u * 0.11, u * 0.018, 0, 0, Math.PI * 2);
    ctx.stroke();

    // mic body
    var bx = cx - headW / 2, by = headTop;
    ctx.fillStyle = '#1C1B1A';
    ctx.fillRect(bx, by, headW, headH);
    // dome top
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.arc(cx, by, headW / 2, Math.PI, Math.PI * 2);
    ctx.fill();
    // grille lines (silver, across the head)
    ctx.strokeStyle = '#9AA0A6';
    ctx.lineWidth = Math.max(1, u * 0.003);
    var lines = 6;
    for (var g = 0; g < lines; g++) {
      var gy = by + headH * (0.12 + 0.13 * g);
      ctx.beginPath();
      ctx.moveTo(bx + headW * 0.08, gy);
      ctx.lineTo(bx + headW * 0.92, gy);
      ctx.stroke();
    }
    // body outline + band
    ctx.strokeStyle = 'rgba(154,160,166,0.55)';
    ctx.lineWidth = Math.max(1, u * 0.003);
    ctx.strokeRect(bx, by, headW, headH);
    ctx.fillStyle = '#9AA0A6';
    ctx.fillRect(bx, by + headH * 0.86, headW, headH * 0.05);

    ctx.restore();

    // whisper fragments rising from the grille
    var grilleY = headTop + headH * 0.35;
    ctx.textAlign = 'center';
    for (var i = 0; i < FRAGS.length; i++) {
      var f = FRAGS[i];
      // density ramp: first 5 always present; later ones fade in with swell
      var density = 1;
      if (i >= 5) density = clamp(swell * 11 - (i - 5), 0, 1);
      if (density <= 0) continue;
      var cyc = ((t + f.phase * f.period) % f.period) / f.period; // 0..1 rise
      var y = grilleY - cyc * (grilleY - H * 0.04);
      // alpha envelope: fade in, hold, fade out
      var env = 1;
      if (cyc < 0.12) env = cyc / 0.12;
      else if (cyc > 0.78) env = (1 - cyc) / 0.22;
      // scatter from taps: closed-form decaying push per tap
      var sx = 0, sy = 0;
      for (var k2 = 0; k2 < taps.length; k2++) {
        var dt2 = t - taps[k2].t;
        if (dt2 < 0) continue;
        var dcy = Math.exp(-dt2 / 2.5);
        var dir = (hash(f.seed * 31 + k2 * 7 + 1) - 0.5) * 2;
        sx += dir * 46 * dcy;
        sy -= 26 * dcy;
      }
      var fx = cx + f.dx * u * 0.20 + f.drift * Math.sin(2 * Math.PI * cyc * 2 + f.seed) * u * 0.02 + sx;
      var alpha = 0.85 * env * density * (0.25 + 0.75 * (1 - hush));
      if (alpha <= 0.01) continue;
      ctx.fillStyle = 'rgba(232,223,200,' + alpha.toFixed(3) + ')';
      ctx.font = 'italic ' + Math.round(u * 0.024 * f.size) + 'px Georgia, serif';
      ctx.fillText(f.text, fx, y + sy);
    }
  }

  // synchronous first frame at fixed phase t = 0
  draw(0);

  // animation loop, anchored as offset + elapsed-since-load
  function loop() { draw(elapsed()); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
