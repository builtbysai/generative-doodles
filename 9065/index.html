<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№9065 · Faultline</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#141210; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(232,226,210,0.38); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; text-shadow:0 1px 8px rgba(0,0,0,0.7); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">click for another fault</div>
<script>
'use strict';
/*
№9065 · Faultline.
Angular flow. The organic curve is banned: a low frequency noise field is
quantized to eight compass directions, and walkers move in straight segments
with hard turns, like seismic traces or cracked earth. Many hairline
fractures and a few long bold faults cross the plate. Where a fracture
crosses a fault it slips, one side offset by a few pixels, so the strata
visibly shear. Rust and bone inks on charcoal ground.
*/
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
const qs = new URLSearchParams(location.search);
let seed = parseInt(qs.get('seed') || '9065', 10) || 9065;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const SQ = Math.SQRT1_2;
const DIRS = [[1,0],[SQ,SQ],[0,1],[-SQ,SQ],[-1,0],[-SQ,-SQ],[0,-1],[SQ,-SQ]];
const BONE = '#E7E0CB', RUST = '#B0511F', RUST_DEEP = '#7E3A18';

function makeNoise(rand){
  const perm = new Uint8Array(256);
  for(let i=0;i<256;i++) perm[i]=i;
  for(let i=255;i>0;i--){ const j=(rand()*(i+1))|0; const t=perm[i]; perm[i]=perm[j]; perm[j]=t; }
  const p = new Uint8Array(512);
  for(let i=0;i<512;i++) p[i]=perm[i&255];
  const gv = new Float32Array(256);
  for(let i=0;i<256;i++) gv[i]=rand();
  function val(ix,iy){ return gv[p[(p[ix&255]+iy)&255]]; }
  function noise2(x,y){
    const ix=Math.floor(x), iy=Math.floor(y);
    const fx=x-ix, fy=y-iy;
    const ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy);
    const a=val(ix,iy), b=val(ix+1,iy), c=val(ix,iy+1), d=val(ix+1,iy+1);
    return a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy;
  }
  function fbm(x,y,oct){
    let v=0, amp=0.5, f=1, norm=0;
    for(let i=0;i<oct;i++){ v+=amp*noise2(x*f,y*f); norm+=amp; amp*=0.5; f*=2.03; }
    return v/norm;
  }
  return { fbm:fbm };
}

function segIntT(x1,y1,x2,y2,x3,y3,x4,y4){
  const d=(x2-x1)*(y4-y3)-(y2-y1)*(x4-x3);
  if(Math.abs(d)<1e-9) return -1;
  const t=((x3-x1)*(y4-y3)-(y3-y1)*(x4-x3))/d;
  const u=((x3-x1)*(y2-y1)-(y3-y1)*(x2-x1))/d;
  if(t>1e-6 && t<1-1e-6 && u>1e-6 && u<1-1e-6) return t;
  return -1;
}

function composeOnce(s, box){
  const rand = mulberry32(s);
  const nz = makeNoise(rand);
  const turns = 1.6 + rand()*0.8;
  const wAmp = 0.10 + rand()*0.15;
  const fs = 2.0 + rand()*1.0;
  const o1=rand()*40, o2=rand()*40, o3=rand()*40, o4=rand()*40, o5=rand()*40;
  function fieldAngle(u,v){
    const qx = nz.fbm(u*fs+o1, v*fs+o2, 3);
    const qy = nz.fbm(u*fs+o3, v*fs+o4, 3);
    const wu = u + (qx-0.5)*wAmp*2;
    const wv = v + (qy-0.5)*wAmp*2;
    const a = nz.fbm(wu*fs+o5, wv*fs+o1, 3);
    return a*Math.PI*2*turns;
  }
  const qdir = a => ((Math.round(a/(Math.PI/4))%8)+8)%8;
  const qdirAt = (x,y) => qdir(fieldAngle((x-box.x0)/box.w, (y-box.y0)/box.h));

  const faults = [];
  const nFaults = 2 + (rand()<0.45?1:0);
  const baseDir = 1 + 2*((rand()*4)|0);
  const sepChoices = [2,6];
  for(let fi=0; fi<nFaults; fi++){
    const sx = box.x0 + rand()*box.w, sy = box.y0 + rand()*box.h;
    const dir0 = fi===0 ? baseDir : (baseDir + sepChoices[(rand()*sepChoices.length)|0])%8;
    const segLen = box.S*(0.025 + rand()*0.025);
    function walk(sx0, sy0, d0, n){
      const pts=[[sx0,sy0]];
      let cx=sx0, cy=sy0, d=d0;
      let run = 2+((rand()*3)|0);
      for(let i=0;i<n;i++){
        cx += DIRS[d][0]*segLen; cy += DIRS[d][1]*segLen;
        pts.push([cx,cy]);
        if(--run<=0){
          d=(d+(rand()<0.5?1:7)+8)%8;
          run = 2+((rand()*3)|0);
        } else if(rand()<0.02){
          d=(d+(rand()<0.5?1:7))%8;
        }
      }
      return pts;
    }
    const fwd = walk(sx,sy,dir0, 4+((rand()*4)|0));
    const bwd = walk(sx,sy,(dir0+4)%8, 4+((rand()*4)|0));
    bwd.reverse();
    const pts = bwd.concat(fwd.slice(1));
    const segs=[];
    for(let i=1;i<pts.length;i++) segs.push([pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1]]);
    const ax=pts[pts.length-1][0]-pts[0][0], ay=pts[pts.length-1][1]-pts[0][1];
    const al=Math.hypot(ax,ay)||1;
    const sgn = rand()<0.5?-1:1;
    const mag = box.S*(0.009+rand()*0.012)*sgn;
    const slip=[-ay/al*mag, ax/al*mag];
    const w = box.S*(0.006+rand()*0.004);
    const boneFirst = (fi%2===0);
    faults.push({ pts:pts, segs:segs, slip:slip, w:w,
      color: boneFirst?BONE:RUST, core: boneFirst?RUST:BONE });
  }

  const fractures=[];
  let ink=0;
  const branches=[];
  const cell = Math.max(24, box.S/28);
  const gcols = Math.ceil(box.w/cell)+2, grows = Math.ceil(box.h/cell)+2;
  const grid = new Uint16Array(gcols*grows*8);
  function gidx(x,y){
    const gx = Math.floor((x-box.x0)/cell)+1, gy = Math.floor((y-box.y0)/cell)+1;
    return gy*gcols+gx;
  }
  function traceOne(x, y, dir, maxSegs, lenLo, lenHi, turnP, bias){
    const pts=[[x,y]];
    let cx=x, cy=y;
    for(let i=0;i<maxSegs;i++){
      const stepDir = dir;
      const len = lenLo + rand()*(lenHi-lenLo);
      const nx = cx + DIRS[dir][0]*len, ny = cy + DIRS[dir][1]*len;
      if(nx<box.x0+2||nx>box.x1-2||ny<box.y0+2||ny>box.y1-2) break;
      cx=nx; cy=ny; pts.push([cx,cy]);
      const gk = gidx(cx,cy)*8+stepDir;
      grid[gk]++;
      if(grid[gk]>5){
        if(rand()<0.7) break;
        dir=(dir+(rand()<0.5?2:6))%8;
        continue;
      }
      const fd = (qdirAt(cx,cy)+bias+8)%8;
      if(fd!==dir){
        if(rand()<0.92){
          if(rand()<0.06 && branches.length<30) branches.push([cx,cy,(dir+(rand()<0.5?2:6))%8]);
          dir=fd;
        }
      }
      else if(rand()<turnP){
        const r=rand();
        const delta = r<0.45 ? (rand()<0.5?1:7) : (r<0.75 ? (rand()<0.5?2:6) : (rand()<0.5?3:5));
        if(rand()<0.06 && branches.length<30) branches.push([cx,cy,(dir+delta+(rand()<0.5?2:6))%8]);
        dir=(dir+delta)%8;
      }
    }
    return pts;
  }
  function keepFracture(pts){
    if(pts.length<7) return;
    let L=0;
    for(let i=1;i<pts.length;i++) L+=Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
    ink+=L;
    const r=rand();
    const col = r<0.62?BONE:(r<0.90?RUST:RUST_DEEP);
    const mid = rand()<0.06;
    fractures.push({ pts:pts, color:col,
      w: mid ? 1.8+rand()*0.8 : 0.7+rand()*0.7,
      a: 0.28+rand()*0.46 });
  }
  const target = 150 + ((rand()*40)|0);
  const cells=[];
  for(let cy=0;cy<4;cy++) for(let cx=0;cx<4;cx++) cells.push([cx,cy]);
  for(let i=cells.length-1;i>0;i--){ const j=(rand()*(i+1))|0; const t=cells[i]; cells[i]=cells[j]; cells[j]=t; }
  let attempts=0;
  while(fractures.length<target && attempts<target*3){
    const cc = cells[attempts%16];
    attempts++;
    const x = box.x0 + (cc[0]+rand())*box.w/4, y = box.y0 + (cc[1]+rand())*box.h/4;
    const long = rand()<0.10;
    const br = rand();
    const bias = br<0.34?0:(br<0.67?1:7);
    const pts = traceOne(x, y, qdirAt(x,y),
      long ? 40+((rand()*25)|0) : 12+((rand()*26)|0),
      6, 24, 0.03+rand()*0.03, bias);
    keepFracture(pts);
  }
  for(const b of branches){
    keepFracture(traceOne(b[0], b[1], b[2], 6+((rand()*10)|0), 5, 18, 0.10, 0));
  }
  return { faults:faults, fractures:fractures, ink:ink,
    score: fractures.length*1000 + ink };
}

function pathSlipped(pts, faults){
  const active = new Array(faults.length).fill(false);
  let dx=0, dy=0;
  let px=pts[0][0], py=pts[0][1];
  ctx.beginPath();
  ctx.moveTo(px,py);
  for(let i=1;i<pts.length;i++){
    const cx=pts[i][0], cy=pts[i][1];
    let tHit=2, hitJ=-1;
    for(let j=0;j<faults.length;j++){
      const sg=faults[j].segs;
      for(let k=0;k<sg.length;k++){
        const s=sg[k];
        const t=segIntT(px,py,cx,cy,s[0],s[1],s[2],s[3]);
        if(t>=0 && t<tHit){ tHit=t; hitJ=j; }
      }
    }
    if(hitJ>=0){
      const hx=px+(cx-px)*tHit, hy=py+(cy-py)*tHit;
      ctx.lineTo(hx+dx, hy+dy);
      active[hitJ]=!active[hitJ];
      dx=0; dy=0;
      for(let j=0;j<faults.length;j++) if(active[j]){ dx+=faults[j].slip[0]; dy+=faults[j].slip[1]; }
      ctx.lineTo(hx+dx, hy+dy);
    }
    ctx.lineTo(cx+dx, cy+dy);
    px=cx; py=cy;
  }
}

function draw(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const S = Math.min(w,h);
  const gx = (w-S)/2, gy = (h-S)/2;
  const m = S*0.085;
  const box = { x0:gx+m, y0:gy+m, x1:gx+S-m, y1:gy+S-m, S:S };
  box.w = box.x1-box.x0; box.h = box.y1-box.y0;

  let best=null, s=seed>>>0;
  for(let t=0;t<15;t++){
    const c = composeOnce(s, box);
    if(c.faults.length>=2 && c.fractures.length>=60 && c.ink>=30*S){ best=c; break; }
    if(!best || c.score>best.score) best=c;
    s = (Math.imul(s,1664525)+1013904223)>>>0;
  }
  const comp = best;
  const rand = mulberry32((seed^0x9e3779b9)>>>0);

  ctx.fillStyle='#141210';
  ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#171310';
  ctx.fillRect(box.x0,box.y0,box.w,box.h);
  for(let i=0;i<3;i++){
    const bx=box.x0+rand()*box.w, by=box.y0+rand()*box.h;
    const br=box.S*(0.25+rand()*0.3);
    const g=ctx.createRadialGradient(bx,by,0,bx,by,br);
    const boneBlob = rand()<0.5;
    g.addColorStop(0, boneBlob?'rgba(231,224,203,0.030)':'rgba(176,81,31,0.035)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.fillRect(bx-br,by-br,br*2,br*2);
  }

  ctx.save();
  ctx.beginPath();
  ctx.rect(box.x0,box.y0,box.w,box.h);
  ctx.clip();
  ctx.lineJoin='miter';

  comp.faults.forEach(function(F,j){
    const earlier = comp.faults.slice(0,j);
    ctx.lineCap='round';
    pathSlipped(F.pts, earlier);
    ctx.strokeStyle='rgba(0,0,0,0.40)';
    ctx.lineWidth=F.w*1.7;
    ctx.stroke();
    pathSlipped(F.pts, earlier);
    ctx.globalAlpha=0.94;
    ctx.strokeStyle=F.color;
    ctx.lineWidth=F.w;
    ctx.stroke();
    pathSlipped(F.pts, earlier);
    ctx.globalAlpha=0.85;
    ctx.strokeStyle=F.core;
    ctx.lineWidth=Math.max(1, F.w*0.16);
    ctx.stroke();
    ctx.globalAlpha=1;
  });

  ctx.lineCap='butt';
  comp.fractures.forEach(function(fr){
    pathSlipped(fr.pts, comp.faults);
    ctx.globalAlpha=fr.a;
    ctx.strokeStyle=fr.color;
    ctx.lineWidth=fr.w;
    ctx.stroke();
  });
  ctx.globalAlpha=1;
  ctx.restore();

  const gr = mulberry32((seed^0x51ab3f)>>>0);
  for(let i=0;i<3500;i++){
    const x=gx+gr()*S, y=gy+gr()*S;
    const r=gr();
    ctx.fillStyle = r<0.45 ? 'rgba(231,224,203,'+(0.02+gr()*0.05).toFixed(3)+')'
      : (r<0.75 ? 'rgba(176,81,31,'+(0.02+gr()*0.05).toFixed(3)+')'
      : 'rgba(0,0,0,'+(0.03+gr()*0.06).toFixed(3)+')');
    ctx.fillRect(x,y,1,1);
  }
}

function resize(){ draw(); }
window.addEventListener('resize', resize);
canvas.addEventListener('click', function(){
  seed = (Math.random()*1e9)|0;
  try{ history.replaceState(null,'','?seed='+seed); }catch(e){}
  draw();
});
resize();
</script>
</body>
</html>
