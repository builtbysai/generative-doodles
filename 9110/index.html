<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metaballs</title>
<style>html,body{margin:0;padding:0;background:#f2ead8;overflow:hidden;height:100%}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style>
</head><body><canvas id="c"></canvas>
<!-- METABALLS-V4 -->
<script>
var cv=document.getElementById('c'), ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
function rngFrom(s){var a=s>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeSources(seed){
  var r=rngFrom(seed), src=[], i;
  for(i=0;i<8;i++){
    var s={
      cx:0.5+(r()-0.5)*0.36, cy:0.5+(r()-0.5)*0.36,
      ax:0.10+r()*0.12, ay:0.10+r()*0.12,
      wx:0.20+r()*0.22, wy:0.17+r()*0.22,
      px:r()*6.283, py:r()*6.283,
      base:0.060+r()*0.025, pt:0.5+r()*0.5, pr:r()*6.283
    };
    if(s.cx+s.ax>0.80) s.ax=0.80-s.cx;
    if(s.cx-s.ax<0.20) s.ax=s.cx-0.20;
    if(s.cy+s.ay>0.80) s.ay=0.80-s.cy;
    if(s.cy-s.ay<0.20) s.ay=s.cy-0.20;
    src.push(s);
  }
  return src;
}
var seed=20261026, sources=makeSources(seed);
var pointer=null, downPos=null, moved=0;
function fieldAt(x,y,t){
  var sum=0,i,s,px,py,rad,dx,dy,d2;
  for(i=0;i<sources.length;i++){
    s=sources[i];
    px=(s.cx+s.ax*Math.sin(s.wx*t+s.px))*W;
    py=(s.cy+s.ay*Math.sin(s.wy*t+s.py))*H;
    rad=s.base*(1+0.18*Math.sin(s.pt*t+s.pr))*Math.min(W,H);
    dx=x-px; dy=y-py; d2=dx*dx+dy*dy;
    sum+=(rad*rad)/(d2+0.04*rad*rad);
  }
  if(pointer){
    var pr2=0.12*Math.min(W,H);
    dx=x-pointer.x; dy=y-pointer.y; d2=dx*dx+dy*dy;
    sum+=(pr2*pr2)/(d2+0.04*pr2*pr2);
  }
  return sum;
}
function contours(t){
  var cell=Math.max(10, Math.min(W,H)/70), cols=Math.ceil(W/cell), rows=Math.ceil(H/cell);
  var vals=[], y,x,idx, a,b,c,d, centre, centre2, segs=[], map={}, key, i, s;
  for(y=0;y<=rows;y++){ vals[y]=[]; for(x=0;x<=cols;x++){ vals[y][x]=fieldAt(x*cell,y*cell,t); } }
  function pt(x1,y1,v1,x2,y2,v2){ var tt=(1-v1)/(v2-v1); if(tt<0)tt=0; if(tt>1)tt=1; return {x:x1+(x2-x1)*tt, y:y1+(y2-y1)*tt}; }
  for(y=0;y<rows;y++) for(x=0;x<cols;x++){
    a=vals[y][x]; b=vals[y][x+1]; c=vals[y+1][x+1]; d=vals[y+1][x];
    idx=0; if(a>=1)idx|=1; if(b>=1)idx|=2; if(c>=1)idx|=4; if(d>=1)idx|=8;
    if(idx===0||idx===15) continue;
    var x0=x*cell, y0=y*cell, top=pt(x0,y0,a,x0+cell,y0,b), right=pt(x0+cell,y0,b,x0+cell,y0+cell,c), bottom=pt(x0,y0+cell,d,x0+cell,y0+cell,c), left=pt(x0,y0,a,x0,y0+cell,d);
    function add(p,q){ segs.push([p,q]); }
    if(idx===1||idx===14) add(left,top);
    else if(idx===2||idx===13) add(top,right);
    else if(idx===3||idx===12) add(left,right);
    else if(idx===4||idx===11) add(right,bottom);
    else if(idx===5){
      centre=(a+b+c+d)/4;
      if(centre>=1){ add(top,right); add(left,bottom); } else { add(left,top); add(right,bottom); }
    }
    else if(idx===6||idx===9) add(top,bottom);
    else if(idx===7||idx===8) add(left,bottom);
    else if(idx===10){
      centre2=(a+b+c+d)/4;
      if(centre2>=1){ add(left,top); add(right,bottom); } else { add(top,right); add(left,bottom); }
    }
  }
  key=function(p){ return Math.round(p.x*1000)+','+Math.round(p.y*1000); };
  for(i=0;i<segs.length;i++){ var k1=key(segs[i][0]), k2=key(segs[i][1]); (map[k1]=map[k1]||[]).push(i); if(k2!==k1) (map[k2]=map[k2]||[]).push(i); }
  var used=new Array(segs.length).fill(false), loops=[];
  for(s=0;s<segs.length;s++){
    if(used[s]) continue;
    var loop=[segs[s][0],segs[s][1]], cur=segs[s][1], start=segs[s][0];
    used[s]=true; var guard=0, closed=false;
    while(guard++<10000){
      if(key(cur)===key(start)){ closed=true; break; }
      var cand=map[key(cur)]||[], next=-1, ni;
      for(ni=0;ni<cand.length;ni++){ if(!used[cand[ni]]){ next=cand[ni]; break; } }
      if(next<0) break;
      used[next]=true;
      var seg=segs[next];
      if(key(seg[0])===key(cur)){ cur=seg[1]; } else { cur=seg[0]; }
      loop.push(cur);
    }
    if(closed && loop.length>8) loops.push(loop);
  }
  // One closed Chaikin pass.
  return loops.map(function(loop){
    var out=[], j, p, q;
    for(j=0;j<loop.length;j++){ p=loop[j]; q=loop[(j+1)%loop.length]; out.push({x:0.75*p.x+0.25*q.x, y:0.75*p.y+0.25*q.y}); out.push({x:0.25*p.x+0.75*q.x, y:0.25*p.y+0.75*q.y}); }
    return out;
  });
}
function loopArea(loop){ var a=0,i,p,q; for(i=0;i<loop.length;i++){ p=loop[i]; q=loop[(i+1)%loop.length]; a+=p.x*q.y-q.x*p.y; } return Math.abs(a)/2; }
function render(t){
  ctx.fillStyle='#f2ead8'; ctx.fillRect(0,0,W,H);
  var loops=contours(t), i, j, loop;
  ctx.lineWidth=Math.max(3, Math.min(W,H)*0.0075); ctx.strokeStyle='#111111'; ctx.fillStyle='#fffdf4';
  for(i=0;i<loops.length;i++){
    loop=loops[i]; ctx.beginPath(); ctx.moveTo(loop[0].x,loop[0].y);
    for(j=1;j<loop.length;j++) ctx.lineTo(loop[j].x,loop[j].y);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
function resize(){
  DPR=window.devicePixelRatio||1; W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();
var start=Date.now();
function frame(){ render((Date.now()-start)/1000); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
cv.addEventListener('pointerdown',function(e){ downPos={x:e.clientX,y:e.clientY}; moved=0; pointer={x:e.clientX,y:e.clientY}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove',function(e){ if(!pointer) return; moved+=Math.abs(e.clientX-pointer.x)+Math.abs(e.clientY-pointer.y); pointer={x:e.clientX,y:e.clientY}; });
cv.addEventListener('pointerup',function(e){
  if(!pointer) return;
  var wasMoved=moved; pointer=null;
  if(wasMoved<6){ seed++; sources=makeSources(seed); }
});
if(typeof window!=='undefined'){ window.__MB={makeSources:makeSources,fieldAt:fieldAt,contours:contours,loopArea:loopArea,setSize:function(w,h){W=w;H=h;},setSources:function(s){sources=s;},setPointer:function(p){pointer=p;}}; }
</script></body></html>
