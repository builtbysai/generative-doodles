<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№ 9110</title>
<!-- METABALLS-V3 -->
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#f2ead8;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  var canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  var W=0,H=0,DPR=1;
  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    render();
  }
  // Seeded RNG, mulberry32, written from the standard recurrence.
  function rngFrom(seed){
    var a=seed>>>0;
    return function(){
      a=(a+0x6D2B79F5)>>>0;
      var t=a;
      t=Math.imul(t^(t>>>15),t|1);
      t^=t+Math.imul(t^(t>>>7),t|61);
      return ((t^(t>>>14))>>>0)/4294967296;
    };
  }
  // 3D spheres: centre in a unit-ish volume, radius tuned so neighbours merge.
  function makeSpheres(seed){
    var r=rngFrom(seed), spheres=[], i, a, b, rad, rr;
    var n=9;
    for(i=0;i<n;i++){
      // Points inside a flattened ball, biased to the centre so the group stays one body.
      a=r()*Math.PI*2; b=Math.acos(2*r()-1); rr=Math.pow(r(),0.6)*0.72;
      spheres.push({
        x:Math.sin(b)*Math.cos(a)*rr,
        y:Math.sin(b)*Math.sin(a)*rr*0.8,
        z:Math.cos(b)*rr*0.7,
        r:0.48+r()*0.38
      });
    }
    return spheres;
  }
  function fieldAt(spheres,px,py,pz){
    var sum=0,i,s,dx,dy,dz,d2;
    for(i=0;i<spheres.length;i++){
      s=spheres[i];
      dx=px-s.x; dy=py-s.y; dz=pz-s.z; d2=dx*dx+dy*dy+dz*dz;
      if(d2<1e-6) d2=1e-6;
      sum+= (s.r*s.r)/d2;
    }
    return sum;
  }
  // Slice plane through the origin. Normal is the Z axis rotated by rx, ry.
  // u and v are the two in-plane axes.
  function planeAxes(rx,ry){
    var cx=Math.cos(rx), sx=Math.sin(rx), cy=Math.cos(ry), sy=Math.sin(ry);
    // Normal n = Ry(ry) * Rx(rx) * (0,0,1)
    // u = Ry * Rx * (1,0,0), v = Ry * Rx * (0,1,0)
    var u={x:cy, y:0, z:-sy};
    var v={x:sx*sy, y:cx, z:sx*cy};
    return {u:u, v:v};
  }
  function contoursFor(spheres,rx,ry){
    var axes=planeAxes(rx,ry), u=axes.u, v=axes.v;
    var N=160, R=1.55, step=2*R/N, vals=[], i, j, px,py,pz;
    for(j=0;j<=N;j++){
      vals[j]=[];
      for(i=0;i<=N;i++){
        var pu=-R+i*step, pv=-R+j*step;
        px=pu*u.x+pv*v.x; py=pu*u.y+pv*v.y; pz=pu*u.z+pv*v.z;
        vals[j][i]=fieldAt(spheres,px,py,pz);
      }
    }
    function pt(i,j){ return {x:-R+i*step, y:-R+j*step}; }
    function interp(p1,p2,v1,v2){
      var t=(4-v1)/(v2-v1);
      if(!isFinite(t)) t=0.5;
      if(t<0) t=0; if(t>1) t=1;
      return {x:p1.x+(p2.x-p1.x)*t, y:p1.y+(p2.y-p1.y)*t};
    }
    var segs=[];
    for(j=0;j<N;j++){
      for(i=0;i<N;i++){
        var a=vals[j][i], b=vals[j][i+1], c=vals[j+1][i+1], d=vals[j+1][i];
        // corners: a bottom-left, b bottom-right, c top-right, d top-left (in plane coords)
        var idx=0;
        if(a>=4) idx|=1; if(b>=4) idx|=2; if(c>=4) idx|=4; if(d>=4) idx|=8;
        if(idx===0||idx===15) continue;
        var pA=pt(i,j), pB=pt(i+1,j), pC=pt(i+1,j+1), pD=pt(i,j+1);
        var ab=interp(pA,pB,a,b), bc=interp(pB,pC,b,c), cd=interp(pD,pC,d,c), da=interp(pA,pD,a,d);
        // Note: cd runs d->c, so interpolation above uses d as first point; fine.
        if(idx===1||idx===14) segs.push([da,ab]);
        else if(idx===2||idx===13) segs.push([ab,bc]);
        else if(idx===3||idx===12) segs.push([da,bc]);
        else if(idx===4||idx===11) segs.push([bc,cd]);
        else if(idx===5){
          var centre=(a+b+c+d)/4;
          if(centre>=4){ segs.push([da,ab]); segs.push([bc,cd]); }
          else { segs.push([da,cd]); segs.push([ab,bc]); }
        }
        else if(idx===6||idx===9) segs.push([ab,cd]);
        else if(idx===7||idx===8) segs.push([da,cd]);
        else if(idx===10){
          var centre2=(a+b+c+d)/4;
          if(centre2>=4){ segs.push([da,cd]); segs.push([ab,bc]); }
          else { segs.push([da,ab]); segs.push([bc,cd]); }
        }
      }
    }
    // Chain segments into closed loops.
    function key(p){ return p.x.toFixed(3)+','+p.y.toFixed(3); }
    var map={}, s, k;
    for(s=0;s<segs.length;s++){
      k=key(segs[s][0]); (map[k]=map[k]||[]).push(s);
      k=key(segs[s][1]); (map[k]=map[k]||[]).push(s);
    }
    var used=new Array(segs.length).fill(false), loops=[];
    for(s=0;s<segs.length;s++){
      if(used[s]) continue;
      var loop=[segs[s][0],segs[s][1]], cur=segs[s][1], start=segs[s][0];
      used[s]=true;
      var guard=0, closed=false;
      while(guard++<10000){
        if(key(cur)===key(start)){ closed=true; break; }
        var cand=map[key(cur)]||[], next=-1, ni;
        for(ni=0;ni<cand.length;ni++){ if(!used[cand[ni]]){ next=cand[ni]; break; } }
        if(next<0) break;
        used[next]=true;
        var seg=segs[next];
        if(key(seg[0])===key(cur)){ cur=seg[1]; }
        else { cur=seg[0]; }
        loop.push(cur);
      }
      // V3: never render an open chain. Open chains were the thin strokes in V2.
      if(closed && loop.length>8) loops.push(loop);
    }
    // Chaikin smoothing, closed, two passes.
    function smooth(loop){
      var out=loop, pass, i, p, q, nxt=[];
      for(pass=0;pass<2;pass++){
        nxt=[];
        for(i=0;i<out.length;i++){
          p=out[i]; q=out[(i+1)%out.length];
          nxt.push({x:0.75*p.x+0.25*q.x, y:0.75*p.y+0.25*q.y});
          nxt.push({x:0.25*p.x+0.75*q.x, y:0.25*p.y+0.75*q.y});
        }
        out=nxt;
      }
      return out;
    }
    return loops.map(smooth);
  }
  function loopArea(loop){
    var a=0,i,p,q;
    for(i=0;i<loop.length;i++){ p=loop[i]; q=loop[(i+1)%loop.length]; a+=p.x*q.y-q.x*p.y; }
    return Math.abs(a/2);
  }
  // Seed hunting, V3: threshold 4 puts the blob in the frame (V2 used 1,
  // where the inverse-square background alone was >=1 on 99% of the slice,
  // so no seed could pass and the fallback rendered border fragments).
  // Require closed loops, a real area, and no border-touching loop.
  function goodSeed(startSeed,rx,ry){
    var seed=startSeed, tries=0, best=null, bestScore=-1, spheres, loops, area, total, mx, i, j;
    while(tries<500){
      spheres=makeSpheres(seed);
      loops=contoursFor(spheres,rx,ry);
      total=0; loops.forEach(function(l){ total+=loopArea(l); });
      area=total/(3.1*3.1);
      mx=0; loops.forEach(function(l){ l.forEach(function(pt){ mx=Math.max(mx, Math.abs(pt.x), Math.abs(pt.y)); }); });
      // Score: prefer 1-3 loops, area 0.25-0.45, well inside the frame.
      var score=(loops.length>=1 && loops.length<=3 ? 2 : 0) + (area>0.15 && area<0.50 ? 2 : 0) + (mx<1.45 ? 1 : 0) - Math.abs(area-0.35);
      if(score>bestScore){ bestScore=score; best={seed:seed, spheres:spheres, loops:loops}; }
      if(loops.length>=1 && loops.length<=3 && area>0.15 && area<0.50 && mx<1.45){
        return {seed:seed, spheres:spheres, loops:loops};
      }
      seed++; tries++;
    }
    return best;
  }
  var seed=20261025, rx=0.35, ry=-0.45, current=null, pending=false;
  function render(){
    if(!current) current=goodSeed(seed,rx,ry);
    var loops=current.loops, scale, ox, oy, i, j, p;
    ctx.fillStyle='#f2ead8'; ctx.fillRect(0,0,W,H);
    // Very faint paper grain, static, drawn once per render.
    ctx.fillStyle='rgba(0,0,0,0.025)';
    var gr=rngFrom(7);
    for(i=0;i<260;i++){ ctx.fillRect(gr()*W, gr()*H, 1, 1); }
    scale=Math.min(W,H)/(2*1.55)*0.94;
    ox=W/2; oy=H/2;
    ctx.lineJoin='round'; ctx.lineCap='round';
    for(i=0;i<loops.length;i++){
      var loop=loops[i];
      ctx.beginPath();
      for(j=0;j<loop.length;j++){
        p=loop[j];
        var sx=ox+p.x*scale, sy=oy+p.y*scale;
        if(j===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy);
      }
      ctx.closePath();
      ctx.fillStyle='#fffdf4'; ctx.fill();
      ctx.strokeStyle='#111111'; ctx.lineWidth=Math.max(3, Math.min(W,H)*0.0075);
      ctx.stroke();
    }
  }
  function recompute(){ current=goodSeed(seed,rx,ry); render(); }
  function recomputeSameSeed(){ var s=current?current.seed:seed; current={seed:s, spheres:makeSpheres(s), loops:contoursFor(makeSpheres(s),rx,ry)}; render(); }
  // Interaction: tap reseeds, drag rotates the slice plane, then static again.
  var downX=0, downY=0, moved=0, dragging=false, lastX=0, lastY=0;
  canvas.addEventListener('pointerdown',function(e){
    downX=e.clientX; downY=e.clientY; lastX=e.clientX; lastY=e.clientY; moved=0; dragging=true;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove',function(e){
    if(!dragging) return;
    var dx=e.clientX-lastX, dy=e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY;
    moved+=Math.abs(dx)+Math.abs(dy);
    if(moved<4) return;
    ry+=dx*0.008; rx+=dy*0.008;
    if(rx>1.4) rx=1.4; if(rx<-1.4) rx=-1.4;
    if(!pending){
      pending=true;
      requestAnimationFrame(function(){ pending=false; recomputeSameSeed(); });
    }
  });
  function endPointer(e){
    if(!dragging) return;
    dragging=false;
    if(moved<6){
      // Tap: seed hunting to the next satisfying composition.
      seed=current ? current.seed+1 : seed+1;
      recompute();
    } else {
      recomputeSameSeed();
    }
  }
  canvas.addEventListener('pointerup',endPointer);
  canvas.addEventListener('pointercancel',function(){ dragging=false; recomputeSameSeed(); });
  window.addEventListener('resize',resize);
  resize();
})();
</script>
</body>
</html>
