<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№ 9110</title>
<!-- METABALLS-V1 -->
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#050a09;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
  var canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  var W=0,H=0,DPR=1;
  function resize(){
    DPR=Math.min(2, window.devicePixelRatio||1);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize); resize();

  // Seeded RNG, so a reseed is a new system, not a new animation.
  var seed=20261025;
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
  var rnd=mulberry32(seed);

  var sources=[];
  function makeSources(){
    sources=[];
    var n=7;
    for(var i=0;i<n;i++){
      var ang=rnd()*Math.PI*2, rad=(0.18+rnd()*0.28)*Math.min(W,H);
      sources.push({
        x:W/2+Math.cos(ang)*rad, y:H/2+Math.sin(ang)*rad,
        vx:(rnd()-0.5)*0.9, vy:(rnd()-0.5)*0.9,
        r:52+rnd()*58, base:52+rnd()*58,
        phase:rnd()*Math.PI*2, turn:(rnd()-0.5)*0.0016,
        speed:0.45+rnd()*0.65
      });
    }
  }
  makeSources();

  // Interaction: watch-first. Drag = temporary field source. Tap = reseed.
  var disturb={x:0,y:0,active:false,strength:0,r:95};
  var downX=0,downY=0,dragging=false,moved=0;
  function pos(e){
    if(e.touches&&e.touches.length){return {x:e.touches[0].clientX,y:e.touches[0].clientY};}
    return {x:e.clientX,y:e.clientY};
  }
  function onDown(e){
    var p=pos(e); downX=p.x; downY=p.y; moved=0; dragging=false;
    disturb.x=p.x; disturb.y=p.y;
  }
  function onMove(e){
    if(e.cancelable) e.preventDefault();
    var p=pos(e);
    if(Math.abs(p.x-downX)+Math.abs(p.y-downY)>8) dragging=true;
    if(dragging){ disturb.x=p.x; disturb.y=p.y; disturb.active=true; disturb.strength=1; }
  }
  function onUp(){
    if(dragging){ disturb.active=false; }
    else {
      // Tap: reseed the whole driver system.
      seed=(Math.random()*1e9)|0; rnd=mulberry32(seed); makeSources();
    }
    dragging=false;
  }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function fieldAt(x,y){
    var f=0;
    for(var i=0;i<sources.length;i++){
      var s=sources[i], dx=x-s.x, dy=y-s.y, d2=dx*dx+dy*dy+1;
      f += (s.r*s.r)/d2;
    }
    if(disturb.strength>0.01){
      var dx=x-disturb.x, dy=y-disturb.y, d2=dx*dx+dy*dy+1;
      f += disturb.strength*(disturb.r*disturb.r)/d2;
    }
    return f;
  }

  function step(t){
    // Driver: wander on slow curved paths, stay on screen.
    for(var i=0;i<sources.length;i++){
      var s=sources[i];
      var a=Math.atan2(s.vy,s.vx)+s.turn+Math.sin(t*0.0004+s.phase)*0.002;
      s.vx=Math.cos(a)*s.speed; s.vy=Math.sin(a)*s.speed;
      // Gentle pull to centre so sources do not escape or clump in a corner.
      s.vx+=(W/2-s.x)*0.00012; s.vy+=(H/2-s.y)*0.00012;
      s.x+=s.vx; s.y+=s.vy;
      if(s.x<40){s.x=40;s.vx=Math.abs(s.vx);} if(s.x>W-40){s.x=W-40;s.vx=-Math.abs(s.vx);}
      if(s.y<40){s.y=40;s.vy=Math.abs(s.vy);} if(s.y>H-40){s.y=H-40;s.vy=-Math.abs(s.vy);}
      s.r=s.base*(1+0.16*Math.sin(t*0.0011+s.phase));
    }
    if(!disturb.active && disturb.strength>0){
      disturb.strength*=0.94;
      if(disturb.strength<0.01) disturb.strength=0;
    }
  }

  // Marching squares: one threshold, shared contour only.
  var TH=1.0;
  function contourLoops(){
    var cell=Math.max(14, Math.min(22, Math.floor(W/68)));
    var cols=Math.ceil(W/cell), rows=Math.ceil(H/cell);
    var vals=[];
    for(var j=0;j<=rows;j++){
      vals[j]=[];
      for(var i=0;i<=cols;i++) vals[j][i]=fieldAt(i*cell, j*cell);
    }
    var segs=[];
    function interp(ax,ay,av,bx,by,bv){
      var tt=(TH-av)/((bv-av)||0.0001); if(tt<0)tt=0; if(tt>1)tt=1;
      return {x:ax+(bx-ax)*tt, y:ay+(by-ay)*tt};
    }
    for(var y=0;y<rows;y++){
      for(var x=0;x<cols;x++){
        var a=vals[y][x], b=vals[y][x+1], c=vals[y+1][x+1], d=vals[y+1][x];
        var idx=0;
        if(a>=TH)idx|=1; if(b>=TH)idx|=2; if(c>=TH)idx|=4; if(d>=TH)idx|=8;
        if(idx===0||idx===15) continue;
        var x0=x*cell, y0=y*cell, x1=x0+cell, y1=y0+cell;
        var top=interp(x0,y0,a,x1,y0,b), right=interp(x1,y0,b,x1,y1,c),
            bot=interp(x0,y1,d,x1,y1,c), left=interp(x0,y0,a,x0,y1,d);
        var add=function(p,q){segs.push([p,q]);};
        if(idx===1||idx===14) add(left,top);
        else if(idx===2||idx===13) add(top,right);
        else if(idx===3||idx===12) add(left,right);
        else if(idx===4||idx===11) add(right,bot);
        else if(idx===5){ add(left,top); add(right,bot); }
        else if(idx===6||idx===9) add(top,bot);
        else if(idx===7||idx===8) add(left,bot);
        else if(idx===10){ add(top,right); add(left,bot); }
      }
    }
    // Chain segments into closed loops by shared endpoints.
    var key=function(p){return Math.round(p.x*10)+','+Math.round(p.y*10);};
    var map={};
    segs.forEach(function(s,i){
      var k1=key(s[0]), k2=key(s[1]);
      (map[k1]=map[k1]||[]).push(i); (map[k2]=map[k2]||[]).push(i);
    });
    var used=new Array(segs.length).fill(false), loops=[];
    for(var si=0; si<segs.length; si++){
      if(used[si]) continue;
      var loop=[segs[si][0], segs[si][1]]; used[si]=true;
      var guard=0;
      while(guard++<segs.length+10){
        var last=loop[loop.length-1], k=key(last), next=-1, nextPt=null;
        var cand=map[k]||[];
        for(var ci=0;ci<cand.length;ci++){
          if(!used[cand[ci]]){
            var s=segs[cand[ci]];
            if(key(s[0])===k){next=cand[ci]; nextPt=s[1];}
            else if(key(s[1])===k){next=cand[ci]; nextPt=s[0];}
            if(next>=0) break;
          }
        }
        if(next<0) break;
        used[next]=true;
        if(key(nextPt)===key(loop[0])) break;
        loop.push(nextPt);
      }
      if(loop.length>6) loops.push(loop);
    }
    return loops;
  }

  function chaikinClosed(pts){
    var out=[];
    for(var i=0;i<pts.length;i++){
      var p=pts[i], q=pts[(i+1)%pts.length];
      out.push({x:p.x*0.75+q.x*0.25, y:p.y*0.75+q.y*0.25});
      out.push({x:p.x*0.25+q.x*0.75, y:p.y*0.25+q.y*0.75});
    }
    return out;
  }

  function draw(t){
    ctx.fillStyle='#050a09'; ctx.fillRect(0,0,W,H);
    // Faint grid, decoration only, fixed.
    ctx.strokeStyle='rgba(255,255,255,0.04)'; ctx.lineWidth=1; ctx.beginPath();
    for(var gx=0; gx<=W; gx+=72){ctx.moveTo(gx,0); ctx.lineTo(gx,H);}
    for(var gy=0; gy<=H; gy+=72){ctx.moveTo(0,gy); ctx.lineTo(W,gy);}
    ctx.stroke();

    var loops=contourLoops();
    for(var li=0; li<loops.length; li++){
      var pts=chaikinClosed(loops[li]);
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath();
      // One restrained palette: deep teal fill, bright contour, soft glow on contour only.
      ctx.fillStyle='rgba(20,80,72,0.88)'; ctx.fill();
      ctx.save();
      ctx.shadowColor='rgba(110,240,210,0.85)'; ctx.shadowBlur=18;
      ctx.strokeStyle='rgba(140,245,220,0.95)'; ctx.lineWidth=2; ctx.lineJoin='round';
      ctx.stroke();
      ctx.restore();
      ctx.strokeStyle='rgba(140,245,220,0.35)'; ctx.lineWidth=5; ctx.stroke();
    }
  }

  function frame(t){
    step(t); draw(t);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
