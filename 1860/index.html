<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upcycled Plumage</title>
<style>
html, body { margin: 0; padding: 0; background: #8A8D90; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a gray concrete floor where a heap of discarded clothes keeps
   rising up as stitched birds, parading slowly around the room, shedding
   scraps and re-stitching themselves a little different with every lap.
   Nothing is new here; everything is re-worn. */
var TAU = Math.PI * 2;
var GROUND = '#8A8D90';
var FLOOR = '#B7B8B4';
var FLOOR_DARK = '#9A9B97';
var CONCRETE = '#8A8D90';
var CONCRETE_LO = '#6E7174';
var RED = '#B03A2E';
var RED_DK = '#8C2B22';
var ORANGE = '#D97B3F';
var ORANGE_DK = '#B45F2C';
var BLUE = '#3E6E9E';
var BLUE_DK = '#2F5578';
var LACE = '#F2EFE6';
var LACE_DK = '#D8D2C2';
var THREAD = '#26221F';
var PLATE = '#FBFAF7';
var PLATE_LINE = 'rgba(38,34,31,0.30)';
var TITLE_INK = '#26221F';
var HINT_INK = '#5C5954';
var FRAME_T = 60.0;        /* fixed phase for frame one */
var LOOP_S = 240;          /* seconds per full parade lap */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
/* Garment module sets: body patch, wing patch, fin patch. Each lap, every
   creature swaps to the next set, so no creature wears the same clothes
   twice around the loop. */
var MODULES = [
  { body: RED, bodyDk: RED_DK, wing: ORANGE, fin: LACE },
  { body: ORANGE, bodyDk: ORANGE_DK, wing: BLUE, fin: LACE },
  { body: BLUE, bodyDk: BLUE_DK, wing: RED, fin: LACE }
];
/* Three creatures, spaced around the loop. At the fixed first frame one
   stands at the heap re-stitching, one crosses mid-floor, one rounds the
   far corner. */
var CREATURES = [
  { a0: 0.79, size: 1.00, ph: 0.0 },
  { a0: 2.90, size: 0.86, ph: 2.1 },
  { a0: 5.00, size: 0.74, ph: 4.3 }
];
/* Seeded scrap jitter: each creature sheds the same scraps every run. */
var SCRAP_JIT = (function () {
  var rng = mulberry32(1860), out = [], i, j;
  for (i = 0; i < 3; i++) {
    out.push([]);
    for (j = 0; j < 6; j++) {
      out[i].push({ dx: (rng() - 0.5) * 0.05, dy: (rng() - 0.5) * 0.05, rot: (rng() - 0.5) * 1.4, w: 0.012 + rng() * 0.012 });
    }
  }
  return out;
})();
var HEAP_JIT = (function () {
  var rng = mulberry32(1860 + 7), out = [], i;
  var cols = [RED, ORANGE, BLUE, LACE, RED_DK, ORANGE_DK];
  for (i = 0; i < 14; i++) {
    out.push({ fx: (rng() - 0.5) * 0.16, fy: (rng() - 0.5) * 0.09, r: 0.028 + rng() * 0.030, c: cols[i % cols.length], rot: rng() * TAU });
  }
  return out;
})();
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
/* Field-like composition: full-bleed on phones, a centered square on desktop. */
function fieldRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
function loopPoint(a, rc) {
  var cx = rc.x + rc.w * 0.52, cy = rc.y + rc.h * 0.50;
  var rx = rc.w * 0.36, ry = rc.h * 0.30;
  return { x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a), rx: rx, ry: ry };
}
function loopHeading(a, rx, ry) {
  return Math.atan2(ry * Math.cos(a), -rx * Math.sin(a));
}
function drawFloor(rc, t) {
  var m = Math.min(rc.w, rc.h);
  ctx.fillStyle = FLOOR;
  ctx.fillRect(rc.x, rc.y, rc.w, rc.h);
  /* concrete seams and faint stains */
  ctx.strokeStyle = rgba(CONCRETE_LO, 0.35);
  ctx.lineWidth = 1;
  var i;
  for (i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(rc.x + rc.w * i / 4, rc.y);
    ctx.lineTo(rc.x + rc.w * i / 4, rc.y + rc.h);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(rc.x, rc.y + rc.h * i / 4);
    ctx.lineTo(rc.x + rc.w, rc.y + rc.h * i / 4);
    ctx.stroke();
  }
  ctx.fillStyle = rgba(CONCRETE_LO, 0.06);
  ctx.beginPath();
  ctx.moveTo(rc.x + rc.w * 0.62 + m * 0.07, rc.y + rc.h * 0.30);
  ctx.ellipse(rc.x + rc.w * 0.62, rc.y + rc.h * 0.30, m * 0.07, m * 0.04, 0.4, 0, TAU);
  ctx.fill();
  ctx.fillStyle = rgba(CONCRETE_LO, 0.05);
  ctx.beginPath();
  ctx.moveTo(rc.x + rc.w * 0.30 + m * 0.05, rc.y + rc.h * 0.78);
  ctx.ellipse(rc.x + rc.w * 0.30, rc.y + rc.h * 0.78, m * 0.05, m * 0.03, -0.3, 0, TAU);
  ctx.fill();
  /* the parade route, a faint stitched loop on the floor */
  ctx.strokeStyle = rgba(THREAD, 0.28);
  ctx.lineWidth = Math.max(1, m * 0.002);
  ctx.setLineDash([m * 0.012, m * 0.012]);
  ctx.beginPath();
  ctx.moveTo(rc.x + rc.w * 0.52 + rc.w * 0.36, rc.y + rc.h * 0.50);
  ctx.ellipse(rc.x + rc.w * 0.52, rc.y + rc.h * 0.50, rc.w * 0.36, rc.h * 0.30, 0, 0, TAU);
  ctx.stroke();
  ctx.setLineDash([]);
}
function drawHeap(rc, t) {
  var m = Math.min(rc.w, rc.h);
  var hx = rc.x + rc.w * 0.20, hy = rc.y + rc.h * 0.76;
  var i, p, px, py, pr;
  /* soft shadow under the heap */
  ctx.fillStyle = rgba(THREAD, 0.16);
  ctx.beginPath();
  ctx.moveTo(hx + m * 0.11, hy + m * 0.02);
  ctx.ellipse(hx, hy + m * 0.02, m * 0.11, m * 0.035, 0, 0, TAU);
  ctx.fill();
  /* a pile of folded, tattered garments */
  for (i = 0; i < HEAP_JIT.length; i++) {
    p = HEAP_JIT[i];
    px = hx + p.fx * rc.w;
    py = hy + p.fy * rc.h - Math.abs(p.fx) * m * 0.10;
    pr = p.r * m;
    /* folded garments: wide, squashed piles, not balls */
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.moveTo(px + pr, py);
    ctx.ellipse(px, py, pr, pr * 0.62, p.rot * 0.2, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = rgba(THREAD, 0.55);
    ctx.lineWidth = Math.max(1, m * 0.002);
    ctx.setLineDash([m * 0.006, m * 0.005]);
    ctx.beginPath();
    ctx.moveTo(px + pr * 0.8, py - pr * 0.3);
    ctx.arc(px, py, pr * 0.8, -0.5, 1.1);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  /* loose threads spilling from the heap toward the loop */
  var j;
  ctx.strokeStyle = rgba(THREAD, 0.5);
  ctx.lineWidth = Math.max(1, m * 0.002);
  for (j = 0; j < 3; j++) {
    var sx = hx + m * (0.05 + j * 0.03), sy = hy - m * 0.01;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.quadraticCurveTo(sx + m * 0.04, sy + m * 0.03 + j * m * 0.008, sx + m * 0.09, sy + m * 0.015);
    ctx.stroke();
  }
  /* one fresh scrap, just shed, at the heap's edge */
  ctx.fillStyle = ORANGE;
  ctx.save();
  ctx.translate(hx + m * 0.10, hy + m * 0.045);
  ctx.rotate(0.5);
  ctx.fillRect(-m * 0.014, -m * 0.008, m * 0.028, m * 0.016);
  ctx.restore();
}
/* A stitched-bird creature: patched body, sleeve wing, lace fin tail,
   stitch seams, thin stepping legs. Abstract, no face, no mascot. */
function drawCreature(x, y, heading, s, mod, t, ph, ci) {
  var m = Math.min(VW, VH);
  var u = m * 0.055 * s;   /* body unit */
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(heading);
  /* soft shadow on the floor */
  ctx.fillStyle = rgba(THREAD, 0.14);
  ctx.beginPath();
  ctx.moveTo(u * 1.15, u * 0.62);
  ctx.ellipse(0, u * 0.62, u * 1.15, u * 0.22, 0, 0, TAU);
  ctx.fill();
  /* lace fin tail, fanning behind */
  var flap = Math.sin(TAU * t / 9 + ph) * 0.18;
  ctx.strokeStyle = LACE;
  ctx.lineWidth = Math.max(1, u * 0.09);
  var k;
  for (k = -1; k <= 1; k++) {
    ctx.beginPath();
    ctx.moveTo(-u * 0.85, 0);
    ctx.lineTo(-u * 1.55, u * (k * 0.34 + flap * k));
    ctx.stroke();
  }
  ctx.fillStyle = LACE;
  ctx.beginPath();
  ctx.moveTo(-u * 0.80, -u * 0.18);
  ctx.lineTo(-u * 1.30, -u * 0.52);
  ctx.lineTo(-u * 1.05, -u * 0.05);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-u * 0.80, u * 0.18);
  ctx.lineTo(-u * 1.30, u * 0.52);
  ctx.lineTo(-u * 1.05, u * 0.05);
  ctx.closePath();
  ctx.fill();
  /* stepping legs, thin stitch lines */
  var step = Math.sin(TAU * t / 4.5 + ph) * u * 0.14;
  ctx.strokeStyle = THREAD;
  ctx.lineWidth = Math.max(1, u * 0.06);
  ctx.beginPath();
  ctx.moveTo(-u * 0.25, u * 0.42);
  ctx.lineTo(-u * 0.25 + step, u * 0.72);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(u * 0.30, u * 0.42);
  ctx.lineTo(u * 0.30 - step, u * 0.72);
  ctx.stroke();
  /* patched body: two cloth panels stitched together */
  ctx.fillStyle = mod.body;
  ctx.beginPath();
  ctx.moveTo(-u * 0.95, 0);
  ctx.ellipse(0, 0, u * 0.95, u * 0.55, 0, 0, TAU);
  ctx.fill();
  ctx.fillStyle = mod.wing;
  ctx.beginPath();
  ctx.moveTo(u * 0.10, -u * 0.52);
  ctx.quadraticCurveTo(u * 0.75, -u * 0.42, u * 0.62, u * 0.10);
  ctx.quadraticCurveTo(u * 0.30, u * 0.42, u * 0.05, u * 0.30);
  ctx.closePath();
  ctx.fill();
  /* sleeve wing, raised mid-flap */
  var wingLift = 0.35 + 0.30 * Math.sin(TAU * t / 7 + ph);
  ctx.fillStyle = mod.bodyDk;
  ctx.beginPath();
  ctx.moveTo(-u * 0.10, -u * 0.30);
  ctx.quadraticCurveTo(u * 0.35, -u * (0.55 + wingLift), u * 0.85, -u * (0.15 + wingLift * 0.5));
  ctx.quadraticCurveTo(u * 0.45, -u * 0.05, u * 0.05, u * 0.05);
  ctx.closePath();
  ctx.fill();
  /* stitched seams along the body and the patch join */
  ctx.strokeStyle = rgba(THREAD, 0.75);
  ctx.lineWidth = Math.max(1, u * 0.045);
  ctx.setLineDash([u * 0.10, u * 0.08]);
  ctx.beginPath();
  ctx.moveTo(-u * 0.80, -u * 0.28);
  ctx.ellipse(0, 0, u * 0.85, u * 0.48, 0, Math.PI * 1.15, Math.PI * 1.85);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(u * 0.08, -u * 0.50);
  ctx.quadraticCurveTo(u * 0.55, -u * 0.10, u * 0.10, u * 0.45);
  ctx.stroke();
  ctx.setLineDash([]);
  /* beak: a folded scrap triangle, and a stitch cross where an eye would be */
  ctx.fillStyle = ORANGE_DK;
  ctx.beginPath();
  ctx.moveTo(u * 0.92, -u * 0.08);
  ctx.lineTo(u * 1.22, u * 0.02);
  ctx.lineTo(u * 0.92, u * 0.14);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = THREAD;
  ctx.lineWidth = Math.max(1, u * 0.05);
  ctx.beginPath();
  ctx.moveTo(u * 0.62, -u * 0.22);
  ctx.lineTo(u * 0.72, -u * 0.12);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(u * 0.72, -u * 0.22);
  ctx.lineTo(u * 0.62, -u * 0.12);
  ctx.stroke();
  ctx.restore();
  /* scraps shed behind the creature, fading as they fall */
  var sIdx, sp, sa, sj, sw, sh;
  for (sIdx = 0; sIdx < 6; sIdx++) {
    sa = t * TAU / LOOP_S + CREATURES[ci].a0 - (sIdx + 1) * 0.055;
    sj = SCRAP_JIT[ci][sIdx];
    var fp = loopPoint(sa, fieldRect());
    var cols = [RED, ORANGE, BLUE, LACE];
    var aFade = (1 - sIdx / 6) * 0.85;
    ctx.fillStyle = rgba(cols[(ci + sIdx) % 4], aFade);
    ctx.save();
    ctx.translate(fp.x + sj.dx * Math.min(VW, VH), fp.y + sj.dy * Math.min(VW, VH));
    ctx.rotate(sj.rot + sa);
    sw = sj.w * Math.min(VW, VH);
    sh = sw * 0.6;
    ctx.fillRect(-sw / 2, -sh / 2, sw, sh);
    ctx.restore();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Upcycled Plumage').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Upcycled Plumage').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 02 · 14').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Upcycled Plumage', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 02 · 14', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch the parade re-stitch itself.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  var rc = fieldRect();
  var t = phaseT;
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawFloor(rc, t);
  /* heap first, so the creature re-stitching there emerges visibly from it */
  drawHeap(rc, t);
  var i, c, a, p, laps, mod;
  for (i = 0; i < CREATURES.length; i++) {
    c = CREATURES[i];
    a = c.a0 + TAU * t / LOOP_S;
    laps = Math.floor((c.a0 + TAU * t / LOOP_S) / TAU);
    mod = MODULES[((i + laps) % 3 + 3) % 3];
    p = loopPoint(a, rc);
    drawCreature(p.x, p.y, loopHeading(a, p.rx, p.ry), c.size, mod, t, c.ph, i);
  }
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    creatureCount: CREATURES.length
  };
}
/* ---- frame one: fixed phase t = 60.0 s, three creatures mid-parade,
   one just re-stitching at the heap, scraps trailing ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
