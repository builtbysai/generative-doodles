<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>№9013 · Growth — Generative Doodles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #efe9da;
    color: #4a4136;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 5vmin 20px 8vmin;
  }
  header { text-align: center; margin-bottom: 4vmin; max-width: 620px; }
  header .kicker {
    font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #a09a89; margin-bottom: 14px;
  }
  header h1 { font-size: 26px; font-weight: normal; margin-bottom: 10px; color: #3a3226; }
  header h1 .num { color: #a63d40; }
  header p { color: #8a8272; font-size: 14px; line-height: 1.7; font-style: italic; }
  header p b { color: #5c5344; font-weight: normal; }
  #stage {
    width: min(92vw, 760px);
    aspect-ratio: 1 / 1;
    background: #f7f3e9;
    box-shadow: 0 18px 60px rgba(90, 75, 50, 0.25);
    cursor: pointer;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  footer { margin-top: 4vmin; color: #a09a89; font-size: 13px; font-style: italic; }
  footer a { color: #a63d40; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="kicker">Generative Doodles</div>
  <h1><span class="num">№9013</span> · Growth</h1>
  <p>A line that knows only local rules: lean toward your neighbors, keep
  your distance from strangers, split when stretched. Given time it grows
  into something no hand would draw. <b>Click the piece for a new
  growth.</b></p>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<footer><a href="../">← all doodles</a> · drawn with code, no libraries</footer>
<script>
"use strict";
// Seeded PRNG (mulberry32)
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const params = new URLSearchParams(location.search);
let seed = parseInt(params.get("seed") || "", 10);
if (!Number.isFinite(seed)) seed = 90130913;
const tParam = parseFloat(params.get("t"));
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const TAU = Math.PI * 2;
const VU = 1000;
const PAPER = "#f7f3e9";
const CX = 500, CY = 500, BOUND_R = 300;
const MAX_NODES = 4200, MAX_STEPS = 1200;

function gauss(rnd){
  let u = 0, v = 0;
  while (u === 0) u = rnd();
  while (v === 0) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
}

function circleLoop(cx, cy, r, n, tone, rnd){
  const pts = [];
  const wob = 0.15 + rnd() * 0.15;
  for (let i = 0; i < n; i++){
    const a = (i / n) * TAU;
    const rr = r * (1 + (rnd() - 0.5) * wob);
    pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
  }
  return { pts, tone, vx: new Float64Array(n), vy: new Float64Array(n) };
}

function makeSystem(rnd){
  const P = {
    brown: 0.55 + rnd() * 0.35,
    attr: 0.07 + rnd() * 0.05,
    repel: 7 + rnd() * 2,
    repelF: 0.45 + rnd() * 0.25,
    damp: 0.90 + rnd() * 0.04,
    maxSpeed: 3.5 + rnd() * 1.5,
    maxEdge: 6 + rnd() * 2
  };
  const loops = [circleLoop(CX, CY, 170, 30, "24,20,16", rnd)];
  const sa = rnd() * TAU, sr = 60 + rnd() * 50;
  loops.push(circleLoop(
    CX + Math.cos(sa) * sr, CY + Math.sin(sa) * sr,
    30 + rnd() * 14, 14, "122,112,96", rnd));
  return { P, loops, stable: 0, steps: 0, done: false };
}

function substep(sys, rnd){
  const { P, loops } = sys;
  let inserted = 0;
  const cell = P.repel;
  for (const loop of loops){
    const pts = loop.pts, n = pts.length;
    let vx = loop.vx, vy = loop.vy;
    if (vx.length !== n){ vx = new Float64Array(n); vy = new Float64Array(n); }
    // spatial hash (insertion order = node order, deterministic)
    const grid = new Map();
    for (let i = 0; i < n; i++){
      const k = Math.floor(pts[i][0] / cell) + "," + Math.floor(pts[i][1] / cell);
      let arr = grid.get(k);
      if (!arr){ arr = []; grid.set(k, arr); }
      arr.push(i);
    }
    const r2 = P.repel * P.repel;
    for (let i = 0; i < n; i++){
      const px = pts[i][0], py = pts[i][1];
      const prev = (i - 1 + n) % n, next = (i + 1) % n;
      let ax = 0, ay = 0;
      // brownian acceleration
      ax += gauss(rnd) * P.brown;
      ay += gauss(rnd) * P.brown;
      // attraction toward midpoint of path neighbors
      ax += ((pts[prev][0] + pts[next][0]) / 2 - px) * P.attr;
      ay += ((pts[prev][1] + pts[next][1]) / 2 - py) * P.attr;
      // repulsion from NON-neighbor nodes (path neighbors are exempt:
      // they cohere via attraction instead of fighting it)
      const gx = Math.floor(px / cell), gy = Math.floor(py / cell);
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++){
        const arr = grid.get((gx + dx) + "," + (gy + dy));
        if (!arr) continue;
        for (let q = 0; q < arr.length; q++){
          const j = arr[q];
          if (j === i || j === prev || j === next) continue;
          const ddx = px - pts[j][0], ddy = py - pts[j][1];
          const d2 = ddx * ddx + ddy * ddy;
          if (d2 > 0.0001 && d2 < r2){
            const d = Math.sqrt(d2);
            const push = (P.repel - d) / d * P.repelF;
            ax += ddx * push;
            ay += ddy * push;
          }
        }
      }
      // soft circular boundary
      const bx = px - CX, by = py - CY;
      const bd = Math.sqrt(bx * bx + by * by);
      if (bd > BOUND_R){
        const over = (bd - BOUND_R) / BOUND_R;
        ax -= (bx / bd) * over * 8;
        ay -= (by / bd) * over * 8;
      }
      // integrate with damping + speed clamp (inertia lets folds develop)
      let nvx = (vx[i] + ax) * P.damp, nvy = (vy[i] + ay) * P.damp;
      const sp = Math.sqrt(nvx * nvx + nvy * nvy);
      if (sp > P.maxSpeed){ nvx = nvx / sp * P.maxSpeed; nvy = nvy / sp * P.maxSpeed; }
      vx[i] = nvx; vy[i] = nvy;
      pts[i][0] += nvx;
      pts[i][1] += nvy;
    }
    loop.vx = vx; loop.vy = vy;
    // subdivide stretched edges (plus curvature-prioritized insertion);
    // new nodes inherit averaged parent velocity
    const grown = [], gvx = [], gvy = [];
    for (let i = 0; i < n; i++){
      const p = pts[i], q = pts[(i + 1) % n];
      grown.push(p); gvx.push(vx[i]); gvy.push(vy[i]);
      if (n + inserted >= MAX_NODES) continue;
      const dx = q[0] - p[0], dy = q[1] - p[1];
      const len2 = dx * dx + dy * dy;
      let want = len2 > P.maxEdge * P.maxEdge;
      if (!want && len2 > P.maxEdge * P.maxEdge * 0.45){
        // curvature: turning angle at q
        const r = pts[(i + 2) % n];
        const ax = q[0] - p[0], ay = q[1] - p[1];
        const bx = r[0] - q[0], by = r[1] - q[1];
        const la = Math.sqrt(ax * ax + ay * ay) + 1e-6;
        const lb = Math.sqrt(bx * bx + by * by) + 1e-6;
        const dot = (ax * bx + ay * by) / (la * lb);
        if (dot < 0.75) want = true;
      }
      if (want){
        grown.push([(p[0] + q[0]) / 2 + gauss(rnd) * 0.3,
                    (p[1] + q[1]) / 2 + gauss(rnd) * 0.3]);
        const ni = (i + 1) % n;
        gvx.push((vx[i] + vx[ni]) / 2);
        gvy.push((vy[i] + vy[ni]) / 2);
        inserted++;
      }
    }
    loop.pts = grown;
    loop.vx = new Float64Array(gvx);
    loop.vy = new Float64Array(gvy);
  }
  sys.steps++;
  sys.stable = inserted === 0 ? sys.stable + 1 : 0;
  const total = sys.loops.reduce((s, l) => s + l.pts.length, 0);
  // gentle centroid anchoring: keep the composition centered without
  // visibly fighting the local dynamics
  const big = sys.loops[0].pts;
  let acx = 0, acy = 0;
  for (let i = 0; i < big.length; i++){ acx += big[i][0]; acy += big[i][1]; }
  acx /= big.length; acy /= big.length;
  const ox = (CX - acx) * 0.004, oy = (CY - acy) * 0.004;
  for (const loop of sys.loops)
    for (let i = 0; i < loop.pts.length; i++){
      loop.pts[i][0] += ox; loop.pts[i][1] += oy;
    }
  if ((sys.stable >= 60 && sys.steps >= 300) || total >= MAX_NODES || sys.steps >= MAX_STEPS)
    sys.done = true;
}

// ---- rendering ----
const stage = document.getElementById("stage");
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const art = document.createElement("canvas");
const actx = art.getContext("2d");
let rnd = mulberry32(seed), sys = null, scale = 1;

function setupCanvas(){
  const w = stage.clientWidth, h = stage.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  art.width = canvas.width;
  art.height = canvas.height;
  scale = canvas.width / VU;
  actx.fillStyle = PAPER;
  actx.fillRect(0, 0, art.width, art.height);
  // paper speckle
  const gr = mulberry32(seed ^ 0x9e3779b9);
  actx.fillStyle = "rgba(120,105,80,0.05)";
  for (let i = 0; i < 2200; i++)
    actx.fillRect(gr() * art.width, gr() * art.height, 1.4, 1.4);
}

// Chaikin corner-cutting for the rendered trace only (the sim stays raw;
// smoothing just the drawing turns noisy growth into flowing folds).
function chaikin(pts, iters){
  let cur = pts;
  for (let k = 0; k < iters; k++){
    const n = cur.length, out = [];
    for (let i = 0; i < n; i++){
      const p = cur[i], q = cur[(i + 1) % n];
      out.push([p[0] * 0.75 + q[0] * 0.25, p[1] * 0.75 + q[1] * 0.25]);
      out.push([p[0] * 0.25 + q[0] * 0.75, p[1] * 0.25 + q[1] * 0.75]);
    }
    cur = out;
  }
  return cur;
}

function strokeLoop(loop, alpha, lw){
  const pts = chaikin(loop.pts, 2);
  if (pts.length < 2) return;
  actx.beginPath();
  actx.moveTo(pts[0][0] * scale, pts[0][1] * scale);
  for (let i = 1; i < pts.length; i++)
    actx.lineTo(pts[i][0] * scale, pts[i][1] * scale);
  actx.closePath();
  actx.strokeStyle = `rgba(${loop.tone},${alpha})`;
  actx.lineWidth = lw;
  actx.stroke();
}

function trace(alpha){
  actx.lineCap = "round";
  actx.lineJoin = "round";
  for (const loop of sys.loops) strokeLoop(loop, alpha, Math.max(1, 1.1 * scale / Math.min(window.devicePixelRatio || 1, 2)));
}

function present(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(art, 0, 0);
}

let rafId = 0, frames = 0;
const SUBSTEPS_PER_FRAME = 6;

function render(frozenT){
  rnd = mulberry32(seed);
  sys = makeSystem(rnd);
  setupCanvas();
  cancelAnimationFrame(rafId);
  frames = 0;
  if (Number.isFinite(frozenT) || reduced){
    const full = reduced || frozenT >= 1;
    const budget = full ? Infinity : Math.floor(frozenT * 600);
    let k = 0;
    while (!sys.done && k < budget){
      substep(sys, rnd);
      if (k % 8 === 0) trace(0.08);
      k++;
    }
    for (const loop of sys.loops) strokeLoop(loop, 0.35, Math.max(1, 1.4 * scale / Math.min(window.devicePixelRatio || 1, 2)));
    present();
    return;
  }
  const step = () => {
    for (let k = 0; k < SUBSTEPS_PER_FRAME && !sys.done; k++)
      substep(sys, rnd);
    if (frames % 2 === 0) trace(0.08);
    present();
    frames++;
    if (!sys.done && frames < 1400) rafId = requestAnimationFrame(step);
    else { for (const loop of sys.loops) strokeLoop(loop, 0.35, Math.max(1, 1.4 * scale / Math.min(window.devicePixelRatio || 1, 2))); present(); }
  };
  rafId = requestAnimationFrame(step);
}

let frozenProg = Number.isFinite(tParam) ? Math.max(0, Math.min(1, tParam)) : undefined;
window.addEventListener("resize", () => render(frozenProg));
stage.addEventListener("click", () => {
  seed = (Math.random() * 1e9) | 0;
  history.replaceState(null, "", "?seed=" + seed);
  render();
});
render(frozenProg);
</script>
</body>
</html>
