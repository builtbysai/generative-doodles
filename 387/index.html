<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>No.387 Sun Moon Cloud</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#9AA06B; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
'use strict';
// No.387 Sun Moon Cloud (maryna-lagereva, ML3).
// After Maryna Lagereva's Spoonflower folklore
// register: a flat naive celestial field on khaki
// green. Folk suns with closed-eye faces and rust
// centres sway like pendulums, cream and navy
// crescent moons hang sparse, scalloped clouds drift
// across on slow parallax crossings, pine silhouettes
// stand in the mid register, and navy stars twinkle
// over a dense scatter of rust berries. DRAG stirs
// the sky: motifs near the pointer swirl and, on
// release, spring back to exactly their anchors.
// Never click-to-reload. Three registers, counts
// fixed and asserted. Every period in the piece is a
// whole divisor of the 48s loop, so the loop is
// seamless. All scatter is fixed seeded data baked
// at load, and everything is drawn directly as path
// data on this ONE canvas: no sprites, no layers,
// no offscreen, no gradients.
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var GROUND = '#9AA06B', CREAM = '#F3EBDD', NAVY = '#22354F', RUST = '#B4552D';
var DW = 1280, DH = 900;
var W = 0, H = 0, phone = false;
var S = 1, OX = 0, OY = 0;
var LOOP = 48;
if (LOOP !== 48) throw new Error('Sun Moon Cloud loop must be 48s');
var PEND = 24; // 2 whole pendulum swings per loop
if (LOOP % PEND !== 0) throw new Error('pendulum must complete whole cycles per loop');
var TICK = 1 / 60;
var DEG = Math.PI / 180;
var TAU = Math.PI * 2;

// ---- seeded data ---------------------------------------
// Fixed-seed LCG, the house pattern: every random-
// looking value in the piece is baked from this at
// load and never changes between frames or renders.
var seed = 387;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

// Every motif carries a stir offset (sx, sy) and a
// spring velocity (vx, vy); both start at exactly 0.
function stir(m) { m.sx = 0; m.sy = 0; m.vx = 0; m.vy = 0; return m; }

// ---- large register: suns and moons --------------------
// Exactly 6 large motifs asserted (3 suns + 3 moons),
// sparse and hand-placed. Suns pendulum +-3 degrees
// on the 24s swing; moons hang still. One moon is
// navy, the night accent the palette reserves for
// moons and stars; the other two are cream.
var SUNS = [
  stir({ x: 250, y: 205, r: 62, ph: 0.0 }),
  stir({ x: 1075, y: 185, r: 54, ph: 2.1 }),
  stir({ x: 615, y: 468, r: 47, ph: 4.0 })
];
var MOONS = [
  stir({ x: 472, y: 148, r: 44, tilt: -0.42, col: CREAM }),
  stir({ x: 500, y: 348, r: 38, tilt: 0.55, col: CREAM }),
  stir({ x: 128, y: 452, r: 34, tilt: -0.18, col: NAVY })
];
if (SUNS.length !== 3) throw new Error('Sun Moon Cloud needs exactly 3 suns');
if (MOONS.length !== 3) throw new Error('Sun Moon Cloud needs exactly 3 moons');
if (SUNS.length + MOONS.length < 4 || SUNS.length + MOONS.length > 6) throw new Error('large register must hold 4-6 motifs');

function drawSun(s, t) {
  var px = s.x + s.sx, py = s.y + s.sy;
  var ang = 3 * DEG * Math.sin(TAU * (t / PEND) + s.ph);
  var i, a;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(ang);
  // Ray triangles.
  ctx.fillStyle = CREAM;
  for (i = 0; i < 12; i++) {
    a = (i / 12) * TAU;
    var a1 = a - 0.13, a2 = a + 0.13;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a1) * s.r * 1.04, Math.sin(a1) * s.r * 1.04);
    ctx.lineTo(Math.cos(a) * s.r * 1.46, Math.sin(a) * s.r * 1.46);
    ctx.lineTo(Math.cos(a2) * s.r * 1.04, Math.sin(a2) * s.r * 1.04);
    ctx.closePath();
    ctx.fill();
  }
  // Disc.
  ctx.beginPath();
  ctx.arc(0, 0, s.r, 0, TAU);
  ctx.fillStyle = CREAM;
  ctx.fill();
  // Rust centre.
  ctx.beginPath();
  ctx.arc(0, 0, s.r * 0.44, 0, TAU);
  ctx.fillStyle = RUST;
  ctx.fill();
  // Face on the centre: closed eyes and a small
  // smile, stroked in cream.
  ctx.strokeStyle = CREAM;
  ctx.lineWidth = Math.max(1.6, s.r * 0.045);
  ctx.lineCap = 'round';
  var er = s.r * 0.085, ey = -s.r * 0.07, ex = s.r * 0.17;
  ctx.beginPath(); ctx.arc(-ex, ey, er, Math.PI * 0.08, Math.PI * 0.92); ctx.stroke();
  ctx.beginPath(); ctx.arc(ex, ey, er, Math.PI * 0.08, Math.PI * 0.92); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, s.r * 0.06, s.r * 0.15, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  ctx.restore();
}

function drawMoon(m) {
  var px = m.x + m.sx, py = m.y + m.sy;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(m.tilt);
  // Two-arc crescent: outer circle cut by an offset
  // inner circle, filled even-odd.
  ctx.beginPath();
  ctx.arc(0, 0, m.r, 0, TAU);
  ctx.arc(m.r * 0.46, -m.r * 0.16, m.r * 0.82, 0, TAU);
  ctx.fillStyle = m.col;
  ctx.fill('evenodd');
  ctx.restore();
}

// ---- mid register: clouds and pines --------------------
// Exactly 9 clouds asserted. Each cloud crosses the
// field on its own period, every period a whole
// divisor of the 48s loop (48, 24, 16 or 12s per
// crossing), so each cloud completes whole crossings
// per loop and the wrap is seamless. Bigger clouds
// ride slower periods: parallax by register depth.
var CSPAN = DW + 560;
var CPERIODS = [48, 24, 16, 12];
var CLOUDS = [];
(function () {
  var i;
  for (i = 0; i < 9; i++) {
    var w = 128 + rnd() * 104;
    var per = w > 195 ? 48 : (w > 160 ? 24 : (rnd() < 0.5 ? 16 : 12));
    if (LOOP % per !== 0) throw new Error('cloud period must divide the loop');
    var c = stir({
      x0: rnd() * CSPAN,
      y: 84 + rnd() * 330,
      w: w,
      per: per,
      ph: rnd()
    });
    c.ax = cloudX(c, 17.3); c.ay = c.y;
    CLOUDS.push(c);
  }
  if (CLOUDS.length !== 9) throw new Error('Sun Moon Cloud needs exactly 9 clouds');
})();
function cloudX(c, t) {
  var f = (c.ph + t / c.per) % 1;
  return -280 + f * CSPAN;
}
function drawCloud(c, t) {
  var cx = cloudX(c, t) + c.sx, cy = c.y + c.sy;
  var w = c.w, u = w / 200; // bump scale: cloud authored at 200 wide
  ctx.fillStyle = CREAM;
  // Scalloped band: overlapping circles ride on a
  // flat base band in the same fill, every bump
  // bottom landing flush with the band's underside
  // so the cloud reads as one scalloped strip.
  var bumps = [[-0.36, -0.02, 0.28], [-0.16, -0.13, 0.36], [0.08, -0.16, 0.40], [0.30, -0.08, 0.32], [0.44, -0.02, 0.22]];
  var i, b;
  for (i = 0; i < bumps.length; i++) {
    b = bumps[i];
    ctx.beginPath();
    ctx.arc(cx + b[0] * w, cy + b[1] * w, b[2] * w * 0.5, 0, TAU);
    ctx.fill();
  }
  ctx.fillRect(cx - w * 0.50, cy - w * 0.02, w * 1.00, w * 0.15);
}

// Exactly 14 pines asserted: stacked-triangle folk
// silhouettes in cream along the lower field.
var PINES = [];
(function () {
  var i;
  for (i = 0; i < 14; i++) {
    var p = stir({
      x: -120 + rnd() * 1520,
      base: 668 + rnd() * 222,
      h: 64 + rnd() * 68
    });
    p.ax = p.x; p.ay = p.base - p.h / 2;
    PINES.push(p);
  }
  if (PINES.length !== 14) throw new Error('Sun Moon Cloud needs exactly 14 pines');
})();
function drawPine(p) {
  var px = p.x + p.sx, base = p.base + p.sy, h = p.h;
  var tiers = [[0.46, 0.40], [0.36, 0.68], [0.26, 0.94]];
  ctx.fillStyle = CREAM;
  for (var i = 0; i < tiers.length; i++) {
    var halfW = h * tiers[i][0] * 0.5;
    var topY = base - h * tiers[i][1];
    var botY = base - h * (tiers[i][1] - 0.34);
    ctx.beginPath();
    ctx.moveTo(px - halfW, botY);
    ctx.lineTo(px, topY);
    ctx.lineTo(px + halfW, botY);
    ctx.closePath();
    ctx.fill();
  }
}

// ---- micro register: stars and berries -----------------
// Exactly 90 navy stars asserted, each twinkling on
// its own period, every period a whole divisor of
// 48s, opacity held between 0.5 and 1. Exactly 60
// rust berries asserted, a dense still scatter.
var TPERIODS = [4, 6, 8, 12, 16, 24];
var STARS = [];
(function () {
  var i;
  for (i = 0; i < 90; i++) {
    var per = TPERIODS[Math.floor(rnd() * TPERIODS.length)];
    if (LOOP % per !== 0) throw new Error('twinkle period must divide the loop');
    var st = stir({
      x: -150 + rnd() * 1580,
      y: 24 + rnd() * 852,
      r: 3 + rnd() * 3.6,
      per: per,
      ph: rnd() * TAU
    });
    st.ax = st.x; st.ay = st.y;
    STARS.push(st);
  }
  if (STARS.length !== 90) throw new Error('Sun Moon Cloud needs exactly 90 stars');
})();
var BERRIES = [];
(function () {
  var i;
  for (i = 0; i < 60; i++) {
    var b = stir({
      x: -150 + rnd() * 1580,
      y: 30 + rnd() * 846,
      r: 1.8 + rnd() * 1.7
    });
    b.ax = b.x; b.ay = b.y;
    BERRIES.push(b);
  }
  if (BERRIES.length !== 60) throw new Error('Sun Moon Cloud needs exactly 60 berries');
})();
function drawStar(st, t) {
  var px = st.x + st.sx, py = st.y + st.sy, r = st.r;
  ctx.globalAlpha = 0.75 + 0.25 * Math.sin(TAU * (t / st.per) + st.ph);
  ctx.fillStyle = NAVY;
  ctx.beginPath();
  var pts = [[0, -1], [0.28, -0.28], [1, 0], [0.28, 0.28], [0, 1], [-0.28, 0.28], [-1, 0], [-0.28, -0.28]];
  for (var i = 0; i < pts.length; i++) {
    var X = px + pts[i][0] * r, Y = py + pts[i][1] * r;
    if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
}

// Anchors for the stir physics: suns and moons sit
// at their authored centres; the rest recorded ax/ay
// at build (clouds re-anchor every frame below).
var i;
for (i = 0; i < SUNS.length; i++) { SUNS[i].ax = SUNS[i].x; SUNS[i].ay = SUNS[i].y; }
for (i = 0; i < MOONS.length; i++) { MOONS[i].ax = MOONS[i].x; MOONS[i].ay = MOONS[i].y; }
var ALL = SUNS.concat(MOONS, CLOUDS, PINES, STARS, BERRIES);
if (ALL.length !== 179) throw new Error('Sun Moon Cloud register total must be 179');

// ---- drag stir -----------------------------------------
// While the pointer is down, motifs within 190 design
// px of it take a tangential swirl force (plus a
// slight outward push), falling off to the rim. On
// release the force stops and every offset springs
// home; when an offset and its velocity both fall
// below a hair, they snap to exactly zero, so the
// settled field is the authored field, bit for bit.
var POINTER = { down: false, x: 0, y: 0 };
var STIR_R = 190;
function step() {
  var k, m, dx, dy, d, fall, tx, ty;
  for (k = 0; k < ALL.length; k++) {
    m = ALL[k];
    if (POINTER.down) {
      dx = (m.ax + m.sx) - POINTER.x;
      dy = (m.ay + m.sy) - POINTER.y;
      d = Math.sqrt(dx * dx + dy * dy);
      if (d < STIR_R && d > 0.01) {
        fall = 1 - d / STIR_R;
        tx = -dy / d; ty = dx / d;
        m.vx += (tx * 300 + (dx / d) * 55) * fall * TICK;
        m.vy += (ty * 300 + (dy / d) * 55) * fall * TICK;
      }
    }
    m.vx += (-52 * m.sx - 7 * m.vx) * TICK;
    m.vy += (-52 * m.sy - 7 * m.vy) * TICK;
    m.sx += m.vx * TICK;
    m.sy += m.vy * TICK;
    if (!POINTER.down &&
        Math.abs(m.sx) < 0.02 && Math.abs(m.vx) < 0.02 &&
        Math.abs(m.sy) < 0.02 && Math.abs(m.vy) < 0.02) {
      m.sx = 0; m.sy = 0; m.vx = 0; m.vy = 0;
    }
  }
}
function toDesign(e) {
  var r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left - OX) / S, y: (e.clientY - r.top - OY) / S };
}
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function (e) { var p = toDesign(e); POINTER.x = p.x; POINTER.y = p.y; POINTER.down = true; });
  canvas.addEventListener('pointermove', function (e) { if (!POINTER.down) return; var p = toDesign(e); POINTER.x = p.x; POINTER.y = p.y; });
  canvas.addEventListener('pointerup', function () { POINTER.down = false; });
  canvas.addEventListener('pointercancel', function () { POINTER.down = false; });
}
if (window.addEventListener) window.addEventListener('pointerup', function () { POINTER.down = false; });

// ---- motion state --------------------------------------
// Constant first-frame phase: T = 17.3s into the 48s
// loop. Clouds sit mid-crossing at their parallax
// fractions, suns hang mid-swing, stars are spread
// through their twinkles by their phases. Frame one
// is drawn synchronously at this constant; the rAF
// loop advances T from the same anchor in fixed
// ticks. Frame one never reads a wall clock.
var T = 17.3;
var lastNow = -1, acc = 0;

function draw() {
  ctx.fillStyle = GROUND;
  ctx.fillRect(-2400, -2400, DW + 4800, DH + 4800);
  var i;
  // Micro register first: berries, then twinkling stars.
  ctx.fillStyle = RUST;
  for (i = 0; i < BERRIES.length; i++) {
    var b = BERRIES[i];
    ctx.beginPath();
    ctx.arc(b.x + b.sx, b.y + b.sy, b.r, 0, TAU);
    ctx.fill();
  }
  for (i = 0; i < STARS.length; i++) drawStar(STARS[i], T);
  // Mid register: pines, then drifting clouds.
  for (i = 0; i < PINES.length; i++) drawPine(PINES[i]);
  for (i = 0; i < CLOUDS.length; i++) {
    CLOUDS[i].ax = cloudX(CLOUDS[i], T); CLOUDS[i].ay = CLOUDS[i].y;
    drawCloud(CLOUDS[i], T);
  }
  // Large register on top: moons, then suns.
  for (i = 0; i < MOONS.length; i++) drawMoon(MOONS[i]);
  for (i = 0; i < SUNS.length; i++) drawSun(SUNS[i], T);
}

// ---- sizing: cover fit, full-bleed field ---------------
function resize() {
  var vv = window.visualViewport;
  W = Math.round(vv ? vv.width : window.innerWidth);
  H = Math.round(vv ? vv.height : window.innerHeight);
  canvas.width = W; canvas.height = H;
  var sw = window.screen ? window.screen.width : W;
  var sh = window.screen ? window.screen.height : H;
  phone = Math.min(sw, sh) < 700 || H > W * 1.15;
}
if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('resize', resize);

function frame(time) {
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  S = Math.max(W / DW, H / DH);
  OX = (W - DW * S) / 2; OY = (H - DH * S) / 2;
  ctx.setTransform(S, 0, 0, S, OX, OY);
  var dt = 0;
  if (lastNow >= 0 && time > 0) dt = Math.min(0.05, (time - lastNow) / 1000);
  lastNow = time;
  acc += dt;
  var guard = 0;
  while (acc >= TICK && guard < 4) { T += TICK; step(); acc -= TICK; guard++; }
  if (guard === 4) acc = 0;
  draw();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
resize();
frame(0);
if (typeof requestAnimationFrame === 'function') {
  var loop = function (now) { frame(now); if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
</body>
</html>
