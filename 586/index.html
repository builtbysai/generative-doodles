<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seeing in the Dark</title>
<style>
html, body { margin: 0; padding: 0; background: #07080A; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var FRAME_T = 60.0; /* fixed phase: t = 60 s, carriage in dwell at floor 4 */
var DWELL = 9.0; /* seconds the carriage rests at a floor */
var TRAVEL = 5.0; /* seconds the carriage takes between floors */
var LEG = DWELL + TRAVEL; /* 14 s per leg */
var DELAY = 1.5; /* seconds the particle field lags the carriage field */
var FLOORS = 8;
var LAYERS = 26; /* thin settle layers across the shaft */
var NPART = 90;
var NCYAN = 10; /* dim cyan particles among the faint white */
var TRAIL_STEPS = 8;
var TRAIL_DT = 0.18; /* seconds between trail samples */
var SHAFT_BG = '#0D0E11';
var PAGE_BG = '#07080A';
var FLOOR_LINE = '#A0AFBE';
var EDGE_LINE = '#8A99A8';
var WHITE = '#EBF0F5';
var CYAN = '#7FA8B8';
var PLATE_FILL = '#14161A';
var PLATE_LINE = 'rgba(160,175,190,0.25)';
var PLATE_INK = '#C8D2DC';
var HINT_INK = '#C8D2DC';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* ---- carriage schedule, closed form ----
   Floor order per leg (14 legs, 196 s round trip):
   0,1,2,3,4,5,6,7,6,5,4,3,2,1 then repeat.
   Leg k occupies [14k, 14k+14): dwell at floor seq[k] for 9 s,
   then a 5 s smoothstep travel to seq[k+1].
   Arrivals (rebounds) happen at t = 14k.
   At frame one (t = 60 s): k = 4, leg time 4 s, dwell at floor 4,
   arrived at t = 56 s. Next departure at t = 65 s. */
var SEQ = [0, 1, 2, 3, 4, 5, 6, 7, 6, 5, 4, 3, 2, 1];
function floorFrac(f) { return 0.07 + f * (0.86 / (FLOORS - 1)); }
function smooth(u) { return 3 * u * u - 2 * u * u * u; }
function legIndex(t) {
  var k = Math.floor(t / LEG);
  return ((k % 14) + 14) % 14;
}
function carriageY(t) {
  var k = Math.floor(t / LEG);
  var li = ((k % 14) + 14) % 14;
  var lt = t - k * LEG;
  var f0 = SEQ[li];
  var f1 = SEQ[(li + 1) % 14];
  if (lt < DWELL) return floorFrac(f0);
  var u = (lt - DWELL) / TRAVEL;
  return floorFrac(f0) + (floorFrac(f1) - floorFrac(f0)) * smooth(u);
}
/* Carriage acceleration, fraction of shaft height per s^2.
   Zero during dwell; during travel it is the second derivative of
   the smoothstep, scaled by the leg distance over TRAVEL^2. */
function carriageAcc(t) {
  var k = Math.floor(t / LEG);
  var li = ((k % 14) + 14) % 14;
  var lt = t - k * LEG;
  if (lt < DWELL) return 0;
  var f0 = SEQ[li];
  var f1 = SEQ[(li + 1) % 14];
  var u = (lt - DWELL) / TRAVEL;
  var d = floorFrac(f1) - floorFrac(f0);
  return d * (6 - 12 * u) / (TRAVEL * TRAVEL);
}
/* Time of the most recent arrival (rebound) at or before t. */
function lastRebound(t) {
  return Math.floor(t / LEG) * LEG;
}
/* ---- particle table, seed 1803 ----
   Each particle has a seeded home x (fraction of shaft width),
   home y (fraction of shaft height), echo amplitude, decay time,
   echo frequency, wander phases, radius and base alpha.
   Exactly NCYAN particles are dim cyan; the rest are faint white. */
var PARTS = [];
(function buildParts() {
  var rng = mulberry32(1803 + 7);
  var i;
  for (i = 0; i < NPART; i++) {
    PARTS.push({
      x0: 0.06 + rng() * 0.88,
      y0: 0.03 + rng() * 0.94,
      amp: 0.010 + rng() * 0.022,
      tau: 2.5 + rng() * 1.5,
      om: 1.1 + rng() * 0.9,
      ph: rng() * TAU,
      ph2: rng() * TAU,
      r: 1.1 + rng() * 1.1,
      al: 0.42 + rng() * 0.33,
      cyan: i < NCYAN
    });
  }
})();
/* Echo displacement of particle p at time t, fraction of shaft height.
   A delayed copy of the carriage acceleration field: each rebound at
   t_r kicks the cloud 1.5 s later, then rings down with damping.
   Only rebounds within the last 20 s contribute. */
function echoDisp(p, t) {
  var s = 0;
  var k0 = Math.floor((t - DELAY - 20) / LEG);
  var k1 = Math.floor((t - DELAY) / LEG);
  var k;
  for (k = k0; k <= k1; k++) {
    var tr = k * LEG + DELAY;
    if (tr > t) continue;
    var age = t - tr;
    if (age < 0 || age > 20) continue;
    /* arrival direction: sign of the travel that ended at this rebound */
    var li = ((k - 1) % 14 + 14) % 14;
    var dir = floorFrac(SEQ[k % 14]) - floorFrac(SEQ[li]);
    var sgn = dir >= 0 ? 1 : -1;
    s += sgn * p.amp * Math.exp(-age / p.tau) * Math.sin(p.om * age + p.ph);
  }
  return s;
}
function particlePos(p, t, S) {
  /* settle: during a dwell the field is near zero and the particle
     drifts toward its nearest thin layer; the pull grows with time
     since the last rebound, time constant 6 s. */
  var w = 1 - Math.exp(-(t - lastRebound(t)) / 6);
  var layerStep = 1 / (LAYERS - 1);
  var nearest = Math.round(p.y0 / layerStep) * layerStep;
  var yFrac = p.y0 + (nearest - p.y0) * w * 0.85 + echoDisp(p, t);
  var xFrac = p.x0
    + 0.03 * Math.sin(0.11 * t + p.ph)
    + 0.015 * Math.sin(0.23 * t + p.ph2);
  xFrac = clamp(xFrac, 0.04, 0.96);
  return { x: S.x + xFrac * S.w, y: S.y + clamp(yFrac, 0.01, 0.99) * S.h };
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var S = { x: 0, y: 0, w: 0, h: 0 }; /* shaft rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    /* full-bleed on phones: shaft fills the height, central column */
    var w = Math.round(VW * 0.66);
    S = { x: (VW - w) / 2, y: 0, w: w, h: VH };
  } else {
    var sw = Math.min(300, VW * 0.32);
    S = { x: (VW - sw) / 2, y: 24, w: sw, h: VH - 48 };
  }
}
function drawShaft(t) {
  ctx.fillStyle = SHAFT_BG;
  ctx.fillRect(S.x, S.y, S.w, S.h);
  /* shaft edges: two thin vertical lines, cool grey */
  ctx.strokeStyle = rgba(EDGE_LINE, 0.30);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(S.x + 0.5, S.y);
  ctx.lineTo(S.x + 0.5, S.y + S.h);
  ctx.moveTo(S.x + S.w - 0.5, S.y);
  ctx.lineTo(S.x + S.w - 0.5, S.y + S.h);
  ctx.stroke();
  /* floor markers: thin evenly spaced horizontal lines, cool grey */
  var f;
  for (f = 0; f < FLOORS; f++) {
    var y = S.y + floorFrac(f) * S.h;
    ctx.strokeStyle = rgba(FLOOR_LINE, 0.34);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(S.x, y);
    ctx.lineTo(S.x + S.w, y);
    ctx.stroke();
  }
}
function drawParticles(t) {
  var i, j;
  for (i = 0; i < NPART; i++) {
    var p = PARTS[i];
    var head = particlePos(p, t, S);
    var col = p.cyan ? CYAN : WHITE;
    /* trail: closed-form fading history polyline, darker than the head */
    ctx.strokeStyle = rgba(col, p.al * 0.28);
    ctx.lineWidth = Math.max(0.7, p.r * 0.45);
    ctx.beginPath();
    var first = true;
    for (j = TRAIL_STEPS; j >= 0; j--) {
      var pt = particlePos(p, t - j * TRAIL_DT, S);
      if (first) { ctx.moveTo(pt.x, pt.y); first = false; }
      else ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
    /* head: a small flat dot, no glow, no bloom */
    ctx.fillStyle = rgba(col, p.al);
    ctx.beginPath();
    ctx.moveTo(head.x + p.r, head.y);
    ctx.arc(head.x, head.y, p.r, 0, TAU);
    ctx.fill();
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Seeing in the Dark').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Seeing in the Dark').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 12 · 19').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Seeing in the Dark', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 12 · 19', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = PAGE_BG;
  ctx.fillRect(0, 0, VW, VH);
  drawShaft(phaseT);
  drawParticles(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    carriageFloor: function (t) { return SEQ[legIndex(t)]; },
    carriageY: function (t) { return carriageY(t); },
    lastRebound: function (t) { return lastRebound(t); },
    particleAt: function (i, t) { return particlePos(PARTS[i], t, S); }
  };
}
/* ---- frame one: fixed phase t = 60 s ----
   Carriage in dwell at floor 4 (5th floor from the top), arrived at
   t = 56 s; particles mid-echo after that rebound, layers forming.
   No wall clock is read for frame one. Input does nothing by design:
   no pointer or keyboard handlers are registered, so nothing the
   viewer does shortens or changes anything. */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  /* True time: phase is computed from a wall-clock start captured after
     the fixed first frame, so dropped frames never lose time. */
  var startMs = Date.now();
  (function loop() {
    function step() {
      phaseT = FRAME_T + (Date.now() - startMs) / 1000;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
