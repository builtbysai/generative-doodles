<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quero a Minha Mãe</title>
<style>
  html, body { margin: 0; padding: 0; background: #D42B1E; overflow: hidden; }
  canvas { display: block; cursor: grab; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

// ---------- seeded RNG (mulberry32) ----------
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var TAU = Math.PI * 2;
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function clamp01(v) { return clamp(v, 0, 1); }

// ---------- palette (strict, three colors only, julia-barata block 2) ----------
var RED = "#D42B1E";    // flat saturated ground, loud, never softened
var INK = "#1A1A1A";    // loose black ink
var PAPER = "#FAF7F0";  // bodies, bubbles, title fill

// ---------- canvas / viewport ----------
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;

function isPhone() {
  var sw = (window.screen && window.screen.width) || 0;
  var sh = (window.screen && window.screen.height) || 0;
  var mn = Math.min(sw, sh);
  if (mn > 0 && mn < 700) return true;
  return H > W * 1.15;
}

function resize() {
  var vv = window.visualViewport;
  W = vv ? vv.width : window.innerWidth;
  H = vv ? vv.height : window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  draw(currentPhase());
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", resize);
}
window.addEventListener("resize", resize);

// ---------- animation state ----------
// Frame one is the canonical row at scrub 0, drawn synchronously.
// All motion is anchored to PHASE0 + elapsed since load; the wall
// clock is never consulted (performance.now measures elapsed only).
var PHASE0 = 0;
var startStamp = null;
var lastPhase = PHASE0;

function currentPhase() {
  if (startStamp === null) return PHASE0;
  var now = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  return PHASE0 + (now - startStamp) / 1000;
}

// ---------- the sequence ----------
// Canonical belly growth, left to right: the same body redrawn 8 times.
var BELLY = [0.05, 0.18, 0.32, 0.45, 0.58, 0.72, 0.86, 1.00];
// The decaying word, one bubble per figure; figure 7 (index 6) is silent,
// hand on belly. Figure 8 lands the full cry again, as a shout.
var BUBBLES = [
  "QUERO A MINHA MÃE...",
  "MÃE...",
  "MÃE...!",
  "M...",
  "...MÃE?",
  "MÃE!...",
  null,
  "QUERO A MINHA MÃE!"
];
function bubbleLines(text) {
  if (text === "QUERO A MINHA MÃE...") return ["QUERO A MINHA", "MÃE..."];
  if (text === "QUERO A MINHA MÃE!") return ["QUERO A MINHA", "MÃE!"];
  return [text];
}

// ---------- interaction state ----------
var dragging = false;
var dragStartX = 0, dragStartY = 0, dragMoved = 0, dragStartPhase = 0;
var scrub = 0;        // eased scrub value in [-1, 1]
var scrubTarget = 0;  // follows the hand while dragging, 0 on release
var tapFig = -1, tapStart = -1000, tapBelly = 0;

function stageTransform() {
  var s = Math.min(W, H) / 1000;
  return { s: s, ox: (W - 1000 * s) / 2, oy: (H - 1000 * s) / 2 };
}
function toStage(e) {
  var t = stageTransform();
  var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
  return { x: (e.clientX - r.left - t.ox) / t.s, y: (e.clientY - r.top - t.oy) / t.s };
}
canvas.addEventListener("pointerdown", function (e) {
  var p = toStage(e);
  dragging = true; dragMoved = 0;
  dragStartX = p.x; dragStartY = p.y;
  dragStartPhase = currentPhase();
});
canvas.addEventListener("pointermove", function (e) {
  if (!dragging) return;
  var p = toStage(e);
  var dx = p.x - dragStartX;
  dragMoved = Math.max(dragMoved, Math.abs(dx), Math.abs(p.y - dragStartY));
  scrubTarget = clamp(dx / 420, -1, 1);
});
function endPointer(e) {
  if (!dragging) return;
  dragging = false;
  var p = toStage(e);
  var phase = currentPhase();
  if (dragMoved < 9 && phase - dragStartPhase < 0.45) {
    // a tap: freeze that figure mid-stutter, bubble repeats once, larger
    var i = Math.floor(p.x / 125);
    if (i >= 0 && i < 8 && p.y > 250 && p.y < 900) {
      tapFig = i;
      tapStart = phase;
      tapBelly = clamp01(BELLY[i] + scrub * 0.55);
    }
  }
  scrubTarget = 0;
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", function () { dragging = false; scrubTarget = 0; });

// ---------- loose ink helpers ----------
// jitter pulled fresh from a per-figure seed each draw: same figure,
// same wobble, every frame. The body is redrawn, never traced.
function jit(r, amt) { return (r() - 0.5) * 2 * amt; }

function looseLine(x1, y1, x2, y2, r, wob) {
  var mx = (x1 + x2) / 2 + jit(r, wob), my = (y1 + y2) / 2 + jit(r, wob);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo(mx, my, x2, y2);
  ctx.stroke();
}

// ---------- one body ----------
// Origin: cx = center, feetY = ground line. belly in [0,1] drives the
// belly swell, the hip width, the head tilt and the arm swing.
function drawFigure(cx, feetY, belly, idx, phase) {
  var r = mulberry32(586100 + idx * 131);
  var tilt = (belly - 0.5) * 0.35;              // head leans as the belly grows
  var shY = feetY - 398;                        // shoulder line
  var headCY = feetY - 436 + jit(r, 1.5);
  var headCX = cx + tilt * 26 + jit(r, 1.5);
  var headR = 26;
  var hipHW = 27 + belly * 10;                  // hip half width
  var bellyHW = 24 + belly * 24;                // belly side half width
  var bellyBot = feetY - 202 + belly * 26;      // lowest point of the belly curve
  var armSwing = (r() - 0.5) * 14 + belly * 6;

  ctx.strokeStyle = INK;
  ctx.fillStyle = PAPER;
  ctx.lineWidth = 3.4;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // legs: two loose tapered strokes from the hips to small feet
  var hipY = feetY - 192;
  looseLine(cx - hipHW + 9, hipY, cx - 19, feetY - 4, r, 3);
  looseLine(cx + hipHW - 9, hipY, cx + 19, feetY - 4, r, 3);
  looseLine(cx - 19, feetY - 2, cx - 30, feetY - 1, r, 1);   // left foot
  looseLine(cx + 19, feetY - 2, cx + 31, feetY - 1, r, 1);   // right foot

  // torso + belly: one filled outline, white body against the red
  ctx.beginPath();
  ctx.moveTo(cx - 29, shY + jit(r, 2));
  ctx.bezierCurveTo(cx - 33, shY + 55, cx - 21, feetY - 300, cx - bellyHW, feetY - 218);
  ctx.quadraticCurveTo(cx + jit(r, 3), bellyBot + 26, cx + bellyHW, feetY - 218);
  ctx.bezierCurveTo(cx + 21, feetY - 300, cx + 33, shY + 55, cx + 29, shY + jit(r, 2));
  ctx.quadraticCurveTo(cx + jit(r, 2), shY - 9, cx - 29, shY + jit(r, 2));
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // belly arc + navel once there is a belly to speak of
  if (belly > 0.12) {
    ctx.beginPath();
    ctx.moveTo(cx - bellyHW + 7, feetY - 238);
    ctx.quadraticCurveTo(cx + jit(r, 2), bellyBot + 8, cx + bellyHW - 7, feetY - 238);
    ctx.stroke();
  }
  if (belly > 0.35) {
    ctx.beginPath();
    ctx.arc(cx + jit(r, 1), feetY - 228 + belly * 14, 2.2, 0, TAU);
    ctx.fillStyle = INK;
    ctx.fill();
    ctx.fillStyle = PAPER;
  }

  // breasts: two small arcs, her economy of line
  ctx.beginPath();
  ctx.arc(cx - 14, feetY - 338, 7.5, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx + 14, feetY - 338, 7.5, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();

  // arms
  var shL = { x: cx - 30, y: shY + 5 }, shR = { x: cx + 30, y: shY + 5 };
  if (idx === 6) {
    // figure 7: silent, right hand resting on the belly
    looseLine(shL.x, shL.y, cx - 40, feetY - 208, r, 3);
    ctx.beginPath();
    ctx.moveTo(shR.x, shR.y);
    ctx.quadraticCurveTo(cx + 47, feetY - 300, cx + bellyHW - 4, feetY - 252);
    ctx.quadraticCurveTo(cx + bellyHW - 16, feetY - 232, cx + 8, feetY - 228);
    ctx.stroke();
  } else {
    // left arm hangs, swaying a little with the scrub of the sequence
    ctx.beginPath();
    ctx.moveTo(shL.x, shL.y);
    ctx.quadraticCurveTo(cx - 45 - armSwing * 0.3, feetY - 302, cx - 40 - armSwing * 0.4, feetY - 210);
    ctx.stroke();
    if (idx === 0) {
      // figure 1: right hand holds the pregnancy test up
      ctx.beginPath();
      ctx.moveTo(shR.x, shR.y);
      ctx.quadraticCurveTo(cx + 48, feetY - 320, cx + 44, feetY - 262);
      ctx.stroke();
      drawTest(cx + 44, feetY - 262, r);
    } else {
      ctx.beginPath();
      ctx.moveTo(shR.x, shR.y);
      ctx.quadraticCurveTo(cx + 45 + armSwing * 0.3, feetY - 302, cx + 40 + armSwing * 0.4, feetY - 210);
      ctx.stroke();
    }
  }
  if (idx === 0) drawSign(cx - 40, feetY - 210, r);

  // head: circle, dot eyes, small mouth, scribble hair
  ctx.beginPath();
  ctx.arc(headCX, headCY, headR, 0, TAU);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.arc(headCX - 9, headCY + 1, 1.9, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(headCX + 9, headCY + 1, 1.9, 0, TAU); ctx.fill();
  ctx.fillStyle = PAPER;
  looseLine(headCX - 5, headCY + 11, headCX + 5, headCY + 11, r, 1);
  // hair: three loose arcs over the top of the head
  for (var h = 0; h < 3; h++) {
    ctx.beginPath();
    ctx.arc(headCX + jit(r, 2), headCY - 3 - h * 2, headR - 2 - h * 4,
            Math.PI * (1.08 + h * 0.05), Math.PI * (1.92 - h * 0.05));
    ctx.stroke();
  }
}

// figure 1's pregnancy test: a small white stick with two ink marks
function drawTest(hx, hy, r) {
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(-0.5);
  ctx.fillStyle = PAPER;
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.rect(-5, -34, 10, 36);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-5, -24); ctx.lineTo(5, -24);
  ctx.moveTo(-2.5, -18); ctx.lineTo(2.5, -18);
  ctx.stroke();
  ctx.restore();
}

// figure 1's little sign: SIM, hand-lettered on a stick, board angled
// inward over the body so it never leaves the stage at the left edge
function drawSign(hx, hy, r) {
  ctx.strokeStyle = INK;
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(hx + 12, hy - 50);
  ctx.stroke();
  ctx.save();
  ctx.translate(hx + 12, hy - 50);
  ctx.rotate(-0.04);
  ctx.fillStyle = PAPER;
  ctx.beginPath();
  ctx.rect(-27, -36, 54, 36);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = INK;
  ctx.font = "700 20px 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("SIM", jit(r, 0.8), -17 + jit(r, 0.8));
  ctx.restore();
}

// ---------- speech bubbles ----------
// Wobbly hand bubble above each head; they sit on a shallow decaying arc.
function drawBubble(cx, headTopY, text, arcI, scale, glyphJit, seed) {
  var lines = bubbleLines(text);
  var fitW = lines.length > 1 ? 148 : 218;   // the two long cries run narrower, stacked
  var size = 27;
  ctx.font = "700 " + size + "px 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive";
  var maxW = 0, i, w;
  for (i = 0; i < lines.length; i++) { w = ctx.measureText(lines[i]).width; if (w > maxW) maxW = w; }
  while (size > 13 && maxW > fitW) {
    size -= 1;
    ctx.font = "700 " + size + "px 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive";
    maxW = 0;
    for (i = 0; i < lines.length; i++) { w = ctx.measureText(lines[i]).width; if (w > maxW) maxW = w; }
  }
  var bw = (maxW + 30) * scale;
  var bh = (lines.length * size * 1.18 + 20) * scale;
  var bx = clamp(cx, bw / 2 + 4, 1000 - bw / 2 - 4);
  // arc: middle bubbles ride higher, neighbours staggered so the long
  // first bubble and the small second one never swallow each other
  var by = 238 - Math.sin(arcI / 7 * Math.PI) * 74 + (arcI % 2 === 0 ? 22 : -16);
  var r = mulberry32(seed);

  ctx.save();
  ctx.translate(bx, by);
  // tail down to the head
  ctx.strokeStyle = INK;
  ctx.fillStyle = PAPER;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-7, bh / 2 - 2);
  ctx.lineTo(clamp(cx - bx, -bw / 2 + 14, bw / 2 - 14), headTopY - by - 4);
  ctx.lineTo(9, bh / 2 - 2);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // wobbly rounded rect
  var hw = bw / 2, hh = bh / 2, rad = 15 * scale;
  ctx.beginPath();
  ctx.moveTo(-hw + rad + jit(r, 1.6), -hh + jit(r, 1.6));
  ctx.lineTo(hw - rad + jit(r, 1.6), -hh + jit(r, 1.6));
  ctx.quadraticCurveTo(hw + jit(r, 1.6), -hh + jit(r, 1.6), hw + jit(r, 1.6), -hh + rad);
  ctx.lineTo(hw + jit(r, 1.6), hh - rad);
  ctx.quadraticCurveTo(hw + jit(r, 1.6), hh + jit(r, 1.6), hw - rad, hh + jit(r, 1.6));
  ctx.lineTo(-hw + rad, hh + jit(r, 1.6));
  ctx.quadraticCurveTo(-hw + jit(r, 1.6), hh + jit(r, 1.6), -hw + jit(r, 1.6), hh - rad);
  ctx.lineTo(-hw + jit(r, 1.6), -hh + rad);
  ctx.quadraticCurveTo(-hw + jit(r, 1.6), -hh + jit(r, 1.6), -hw + rad, -hh);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // the word itself, hand-lettered with seeded per-glyph wobble
  ctx.fillStyle = INK;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  var fs = size * scale;
  ctx.font = "700 " + fs + "px 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive";
  for (i = 0; i < lines.length; i++) {
    var ly = (i - (lines.length - 1) / 2) * fs * 1.18;
    drawJitterText(lines[i], 0, ly, fs, glyphJit, seed + i * 77);
  }
  ctx.restore();
}

function drawJitterText(text, cx, cy, fs, jitAmt, seed) {
  var r = mulberry32(seed);
  var widths = [], total = 0, i, w;
  for (i = 0; i < text.length; i++) { w = ctx.measureText(text[i]).width; widths.push(w); total += w; }
  var x = cx - total / 2;
  var prevAlign = ctx.textAlign;
  ctx.textAlign = "left";
  for (i = 0; i < text.length; i++) {
    ctx.save();
    ctx.translate(x + widths[i] / 2 + (r() - 0.5) * jitAmt, cy + (r() - 0.5) * jitAmt);
    ctx.rotate((r() - 0.5) * 0.05 * (1 + jitAmt * 0.2));
    ctx.fillText(text[i], -widths[i] / 2, 0);
    ctx.restore();
    x += widths[i];
  }
  ctx.textAlign = prevAlign;
}

// ---------- title: GRAVIDEZ, brushy ----------
// (the book's title, as on her cover; the piece's own title is the cry)
function drawTitle(phase) {
  var word = "GRAVIDEZ";
  var fs = 76;
  ctx.font = "700 " + fs + "px 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive";
  var widths = [], total = 0, i, w;
  for (i = 0; i < word.length; i++) { w = ctx.measureText(word[i]).width * 0.94; widths.push(w); total += w; }
  var x = 500 - total / 2;
  var y = 952;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  for (i = 0; i < word.length; i++) {
    var r = mulberry32(586900 + i * 41);
    var dx = (r() - 0.5) * 3, dy = (r() - 0.5) * 4, rot = (r() - 0.5) * 0.045;
    ctx.save();
    ctx.translate(x + widths[i] / 2 + dx, y + dy);
    ctx.rotate(rot);
    // brush pass: ink ghost offset under a white face, thin ink edge
    ctx.fillStyle = INK;
    ctx.fillText(word[i], -widths[i] / 2 + 2.4, 2.4);
    ctx.fillStyle = PAPER;
    ctx.fillText(word[i], -widths[i] / 2, 0);
    ctx.strokeStyle = INK;
    ctx.lineWidth = 1.1;
    ctx.strokeText(word[i], -widths[i] / 2, 0);
    ctx.restore();
    x += widths[i];
  }
}

// ---------- draw ----------
function draw(phase) {
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  var dt = clamp(phase - lastPhase, 0, 0.1);
  lastPhase = phase;
  // ease the scrub toward the hand (or back to rest on release)
  scrub += (scrubTarget - scrub) * (1 - Math.exp(-dt * 9));
  if (Math.abs(scrub) < 0.0005 && scrubTarget === 0) scrub = 0;

  var t = stageTransform();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = RED;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(DPR * t.s, 0, 0, DPR * t.s, DPR * t.ox, DPR * t.oy);

  // slow auto-drift: the row breathes sideways and back, never fast
  var driftX = Math.sin(phase * TAU / 9) * 9;
  var feetY = 862;
  var stutter = Math.abs(scrub) > 0.03 || dragging;
  var shift = Math.round(scrub * 2.5);

  for (var i = 0; i < 8; i++) {
    var cx = 62.5 + i * 125 + driftX;
    var bob = Math.sin(phase * TAU / 7 + i * 0.9) * 2.2;
    var belly = BELLY[i];
    var glyphJit = 1.4;
    if (i === tapFig && phase - tapStart < 1.6) belly = tapBelly;
    else if (stutter) belly = clamp01(BELLY[i] + scrub * 0.55 + Math.sin(phase * 22 + i * 2.4) * 0.02);
    drawFigure(cx, feetY + bob, belly, i, phase);

    // bubble: canonical text, shifted along the decay chain while scrubbing
    var bi = i;
    if (stutter) bi = clamp(i + shift, 0, 7);
    if (BUBBLES[bi] === null && bi !== i) bi = i;
    var text = BUBBLES[bi];
    var scale = 1;
    if (i === tapFig) {
      var age = phase - tapStart;
      if (age < 1.6) {
        // frozen mid-stutter: flicker to the neighbouring fragment, then
        // the bubble repeats once, larger, and settles
        if (age < 0.42 && Math.floor(age / 0.12) % 2 === 1) {
          var alt = BUBBLES[clamp(i + (i < 7 ? 1 : -1), 0, 7)];
          if (alt) text = alt;
        }
        scale = 1 + 0.38 * Math.sin(Math.PI * clamp01(age / 1.6));
        glyphJit = 2.6;
      }
    }
    if (text) drawBubble(cx, feetY + bob - 462, text, i, scale, glyphJit, 586300 + i * 53);
  }

  drawTitle(phase);

  // hint: one small word, bottom right
  ctx.fillStyle = "rgba(250,247,240,0.55)";
  ctx.font = "400 19px 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive";
  ctx.textAlign = "right";
  ctx.textBaseline = "alphabetic";
  ctx.fillText("drag", 978, 986);
}

// ---------- boot + loop ----------
resize();
if (typeof requestAnimationFrame === "function") {
  startStamp = (typeof performance !== "undefined" && performance.now) ? performance.now() : 0;
  var loop = function () {
    draw(currentPhase());
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
