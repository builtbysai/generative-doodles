<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite Piece, Study in Wax</title>
<style>
html, body { margin: 0; padding: 0; background: #f0a878; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var GROUND = '#f0a878';
var PLATE = '#f7ead8';
var INK = '#2a1428';
/* Warm wax keeps pouring, folding and splitting, and never finishes.
   A closed-form viscous-flow field advects layered color masses
   downward: peach, salmon, pink and amber grounds, hot red-orange
   veins stretched by the same field, deep purple-black pours between
   them, cream highlights on fold ridges, seeded stipple eroding the
   edges of the masses. Frame one is t = 0, a fixed phase. */
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a, b, f) { return a + (b - a) * f; }
function smoothstep(a, b, x) {
  var f = clamp((x - a) / (b - a), 0, 1);
  return f * f * (3 - 2 * f);
}
function rgba(c, a) {
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function hash2(ix, iy, s) {
  var h = Math.imul(ix, 374761393) ^ Math.imul(iy, 668265263) ^ Math.imul(s, 974634239);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  var ix = Math.floor(x), iy = Math.floor(y);
  var fx = x - ix, fy = y - iy;
  var ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  var a = hash2(ix, iy, s), b = hash2(ix + 1, iy, s);
  var c = hash2(ix, iy + 1, s), d = hash2(ix + 1, iy + 1, s);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
}
function fbm(x, y, s) {
  return vnoise(x, y, s) * 0.6 + vnoise(x * 2.13 + 7.7, y * 2.13 + 3.1, s + 11) * 0.28
    + vnoise(x * 4.31 + 13.3, y * 4.31 + 9.4, s + 23) * 0.12;
}
/* Closed-form periods (seconds), all prime and incommensurate, so no
   seam is visible inside any watchable span: the field as a whole
   repeats only at their least common multiple. The downward scroll
   itself never repeats, because the hash noise it scrolls through
   is aperiodic in y. */
var P_WOBBLE = 47, P_SWAY = 61, P_DRIFT = 83, P_FOLD = 97, P_VEIN = 113, P_POUR = 149;
var SEED = 1663;
var PAL = [
  [246, 196, 152],
  [240, 150, 122],
  [232, 150, 168],
  [228, 160, 64],
  [250, 238, 214]
];
var VEIN = [214, 72, 28];
var POUR = [40, 20, 44];
var POUR2 = [58, 26, 56];
var CREAM = [250, 238, 214];
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
if (typeof window !== 'undefined' && window.matchMedia) {
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || (VH > VW * 1.15 && mn < 900);
  }
}
/* The viscous-flow field at normalized (u, v) and piece-time t.
   scroll: slow downward advection, one frame-height per 260 s.
   wobble/sway: lateral breathing of the whole field at prime periods.
   Every term is a closed-form function of t; no frame-integrated
   state anywhere, so any frame is reproducible from t alone. */
function fieldAt(u, v, t) {
  var scroll = t / 260;
  var wob = 0.35 * Math.sin(TAU * t / P_WOBBLE) + 0.22 * Math.sin(TAU * t / P_SWAY + 1.3);
  var sway = 0.30 * Math.sin(TAU * t / P_DRIFT + 0.7);
  var au = u + 0.05 * wob * Math.sin(TAU * (v * 1.4 + t / P_FOLD));
  var av = v + scroll + 0.03 * sway * Math.sin(TAU * (u * 2.0 + t / P_VEIN));
  return { u: au, v: av, scroll: scroll };
}
function palLerp(pos) {
  var p = clamp(pos, 0, PAL.length - 0.001);
  var i = Math.floor(p), f = p - i;
  f = f * f * (3 - 2 * f);
  var a = PAL[i], b = PAL[i + 1];
  return [
    Math.round(lerp(a[0], b[0], f)),
    Math.round(lerp(a[1], b[1], f)),
    Math.round(lerp(a[2], b[2], f))
  ];
}
function drawField(t) {
  var cell = Math.max(8, Math.min(VW, VH) / 96);
  var cols = Math.ceil(VW / cell), rows = Math.ceil(VH / cell);
  var x, y, u, v, f, mass, drip, height, vein, pour, edge, m2;
  var r, g, b, bright, ridge, veinAmt, pourAmt, sp, col;
  for (y = 0; y < rows; y++) {
    for (x = 0; x < cols; x++) {
      u = (x + 0.5) * cell / VW;
      v = (y + 0.5) * cell / VH;
      f = fieldAt(u, v, t);
      /* Layered color masses: broad warm grounds, advected downward. */
      mass = fbm(f.u * 2.1, f.v * 1.5, SEED);
      /* Drips: vertically stretched masses that lengthen as they fall. */
      drip = fbm(f.u * 6.0 + 0.4 * Math.sin(TAU * t / P_SWAY),
                 f.v * 1.15, SEED + 5);
      /* Fold height field: ridges catch cream light, valleys darken. */
      height = fbm(f.u * 3.0 + 0.3 * Math.sin(TAU * t / P_FOLD + 2.1),
                   f.v * 2.0, SEED + 9);
      /* Veins: thin red-orange channels, stretched vertically by the
         same flow, gated by a slow mask so they appear and fade. */
      vein = fbm(f.u * 2.5, f.v * 1.8, SEED + 31);
      var wv = f.u * 5.0 + 0.8 * (vein - 0.5)
        + 0.25 * Math.sin(TAU * t / P_VEIN + f.v * 3.0);
      var thin = Math.pow(1 - Math.abs(Math.sin(Math.PI * wv)), 18);
      var vmask = smoothstep(0.42, 0.62, fbm(f.u * 1.8, f.v * 1.6, SEED + 41));
      veinAmt = thin * vmask * (0.45 + 0.55 * smoothstep(0.35, 0.7, drip));
      /* Purple-black pours between the warm masses. */
      pour = fbm(f.u * 2.2 + 0.2 * Math.sin(TAU * t / P_POUR),
                 f.v * 1.4, SEED + 51);
      pourAmt = smoothstep(0.60, 0.74, pour);
      /* Ground color from the mass field, shifted by the drip field. */
      col = palLerp(mass * 3.999 + (drip - 0.5) * 0.9);
      r = col[0]; g = col[1]; b = col[2];
      /* Drip shading: mass cores stay warm and bright, gaps deepen. */
      bright = 0.88 + 0.28 * drip;
      r = Math.round(r * bright); g = Math.round(g * bright); b = Math.round(b * bright);
      /* Fold ridges: cream highlight band on the crest, valley shade. */
      ridge = smoothstep(0.60, 0.70, height) * (1 - smoothstep(0.70, 0.82, height));
      r = Math.round(lerp(r, CREAM[0], ridge * 0.65));
      g = Math.round(lerp(g, CREAM[1], ridge * 0.65));
      b = Math.round(lerp(b, CREAM[2], ridge * 0.65));
      var valley = smoothstep(0.42, 0.28, height);
      r = Math.round(r * (1 - 0.22 * valley));
      g = Math.round(g * (1 - 0.22 * valley));
      b = Math.round(b * (1 - 0.20 * valley));
      /* Pours over the ground, before the veins. */
      if (pourAmt > 0.001) {
        var pc = pour > 0.68 ? POUR2 : POUR;
        r = Math.round(lerp(r, pc[0], pourAmt));
        g = Math.round(lerp(g, pc[1], pourAmt));
        b = Math.round(lerp(b, pc[2], pourAmt));
      }
      /* Veins over everything, hot and thin. */
      if (veinAmt > 0.001) {
        var va = clamp(veinAmt, 0, 1) * 0.9;
        r = Math.round(lerp(r, VEIN[0], va));
        g = Math.round(lerp(g, VEIN[1], va));
        b = Math.round(lerp(b, VEIN[2], va));
      }
      /* Eroded-stone edge texture: seeded stipple where the mass
         field changes fastest, i.e. at the edges of the pours. */
      m2 = fbm((f.u + 0.02) * 2.1, f.v * 1.5, SEED);
      edge = Math.abs(m2 - mass);
      if (edge > 0.045) {
        sp = hash2(x, y, SEED + 77);
        if (sp < 0.28) {
          var dk = sp < 0.14 ? 0.82 : 1.14;
          r = Math.round(clamp(r * dk, 0, 255));
          g = Math.round(clamp(g * dk, 0, 255));
          b = Math.round(clamp(b * dk, 0, 255));
        }
      }
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      ctx.fillRect(x * cell, y * cell, cell + 0.5, cell + 0.5);
    }
  }
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Infinite Piece, Study in Wax').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Infinite Piece, Study in Wax').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 08 · 01').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = 'rgba(42,20,40,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Infinite Piece, Study in Wax', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = 'rgba(42,20,40,0.8)';
  ctx.fillText('2006 · 08 · 01', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = 'rgba(42,20,40,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = 'rgba(42,20,40,0.9)';
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw(t) {
  size();
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  drawField(t);
  drawPlates();
  ctx.globalCompositeOperation = 'source-over';
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { draw(t); },
    seed: function () { return SEED; }
  };
}
/* ---- frame one: t = 0, a fixed phase of the endless pour ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
var clockT = 0, prevTs = null, t0 = null;
draw(0);
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop(ts) {
    if (t0 === null) t0 = ts;
    if (prevTs === null) prevTs = ts;
    var dt = clamp((ts - prevTs) / 1000, 0, 0.05);
    prevTs = ts;
    clockT += dt;
    draw(clockT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  })(0);
}
</script>
</body>
</html>
