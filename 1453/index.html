<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sailor and Bearded Lady, One Figure</title>
<style>
  html, body { margin: 0; padding: 0; background: #cfc8bc; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  // Seeded PRNG (mulberry32). Never Math.random: frame one must be reproducible.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(1453000);
  // Per-strand seeded phases so the beard sway is stable every loop.
  var STRANDS = 7, strandPhase = [], strandLen = [];
  for (var i = 0; i < STRANDS; i++) {
    strandPhase.push(rng() * Math.PI * 2);
    strandLen.push(0.86 + rng() * 0.28);
  }
  var ribbonPhase = [rng() * 6.283, rng() * 6.283, rng() * 6.283];

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, booted = false;
  var drags = []; // recorded pointer segments: {x,y,t,zone} zone: 'beard'|'arm'|null
  var dragging = null;

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
  }
  size();
  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', size);
    }
    window.addEventListener('resize', size);
  }

  var INK = '#1a1a1a', PAPER = '#f2ead8', GRAY = '#cfc8bc',
      NAVY = '#1a2a5a', WHITE = '#f2f2ee', SKIN = '#e8c8a8',
      TATRED = '#c81a2a', TATBLUE = '#2a2a4a', BEARD = '#5a3418',
      RIBRED = '#d81a2a', RIBGOLD = '#e8a81a';

  function a4(x) { return Math.round(x * 10000) / 10000; }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();
  }
  function ellipse(x, y, rx, ry) {
    ctx.beginPath();
    ctx.moveTo(x + rx, y);
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.closePath();
  }
  function dot(x, y, r, col) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
  }
  function line(x1, y1, x2, y2, col, w) {
    ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.lineCap = 'round'; ctx.stroke();
  }

  // Geometry for the current viewport. Returns all key points in px.
  // Figure height = 0.80 * min(W,H); centered horizontally, near-vertical center.
  function geom() {
    var u = Math.min(W, H) * 0.80; // figure height
    var cx = W / 2, top = (H - u) / 2 + u * 0.02;
    var s = u / 100; // 100-unit figure
    return {
      u: u, cx: cx, top: top, s: s,
      headR: 9 * s,
      headCx: cx, headCy: top + 9 * s,
      beardTop: top + 15 * s, beardBot: top + 46 * s,
      shoulderY: top + 22 * s,
      torsoTop: top + 22 * s, torsoBot: top + 58 * s,
      hipY: top + 58 * s, footY: top + 99 * s,
      armX: cx - 17 * s, // tattooed arm (viewer's left)
      armTop: top + 24 * s, armBot: top + 56 * s
    };
  }

  // Emphasis: 30 s cycle. 0-10 beard foreground, 10-20 sailor side, 20-30 equal.
  // Smooth 1 s crossfades at the boundaries.
  function smooth(x) { return x * x * (3 - 2 * x); }
  function emph(t) {
    var p = t % 30;
    var beard = 0.5, sailor = 0.5;
    if (p < 9) { beard = 1; sailor = 0.35; }
    else if (p < 10) { var f = smooth(p - 9); beard = 1 - 0.65 * f; sailor = 0.35 + 0.65 * f; }
    else if (p < 19) { beard = 0.35; sailor = 1; }
    else if (p < 20) { var g = smooth(p - 19); beard = 0.35 + 0.65 * g; sailor = 1 - 0.65 * g; }
    else if (p < 29) { beard = 1; sailor = 0.35; }
    else { var h = smooth(p - 29); beard = 1 - 0.5 * h; sailor = 0.35 + 0.15 * h; }
    return { beard: beard, sailor: sailor };
  }

  // Drag influence: closed-form over recorded segments, exponential decay.
  function dragBoost(t, zone) {
    var v = 0;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i];
      if (d.zone !== zone) continue;
      var age = t - d.t;
      if (age < 0 || age > 12) continue;
      v += Math.exp(-age / 2) * d.mag;
    }
    return Math.min(v, 1.6);
  }
  function beardPart(t, strandX, strandY) {
    // How far this strand point parts under recent beard drags.
    var dx = 0;
    for (var i = 0; i < drags.length; i++) {
      var d = drags[i];
      if (d.zone !== 'beard') continue;
      var age = t - d.t;
      if (age < 0 || age > 6) continue;
      var ddx = strandX - d.x, ddy = strandY - d.y;
      var dist2 = ddx * ddx + ddy * ddy;
      var sig = 60 * 60;
      dx += Math.exp(-age / 2) * d.mag * Math.exp(-dist2 / sig) * (ddx > 0 ? 1 : -1) * 14;
    }
    return dx;
  }

  function draw(t) {
    var g = geom(), s = g.s, cx = g.cx;
    var e = emph(t);
    // Ground: warm gray full frame, paper panel behind the figure.
    ctx.fillStyle = GRAY;
    ctx.fillRect(0, 0, W, H);
    var panelW = Math.min(W * 0.62, g.u * 0.62);
    var panelH = Math.min(H * 0.94, g.u * 1.12);
    var px = cx - panelW / 2, py = (H - panelH) / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(px + 4, py + 6, panelW, panelH);
    ctx.fillStyle = PAPER;
    ctx.fillRect(px, py, panelW, panelH);
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, s * 0.5);
    ctx.strokeRect(px, py, panelW, panelH);

    var groundY = g.footY + s * 3;
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    ellipse(cx, groundY, s * 26, s * 3);
    ctx.fill();

    var beardScale = 1 + 0.06 * e.beard;
    var ribbonA = a4(0.55 + 0.45 * e.beard);
    var tatA = a4(0.45 + 0.55 * e.sailor);
    var stripeW = Math.max(1, s * 0.7 + s * 0.5 * e.sailor);

    // ---- Legs (navy trousers) ----
    var legW = s * 7.5, legTop = g.hipY, legBot = g.footY - s * 2;
    ctx.fillStyle = NAVY;
    rr(cx - legW - s * 1.5, legTop, legW, legBot - legTop, s * 2); ctx.fill();
    rr(cx + s * 1.5, legTop, legW, legBot - legTop, s * 2); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, s * 0.6);
    ctx.strokeRect(cx - legW - s * 1.5, legTop, legW, legBot - legTop);
    ctx.strokeRect(cx + s * 1.5, legTop, legW, legBot - legTop);
    // Shoes
    ctx.fillStyle = INK;
    rr(cx - legW - s * 2.5, legBot - s * 1, legW + s * 2, s * 3, s * 1); ctx.fill();
    rr(cx + s * 0.5, legBot - s * 1, legW + s * 2, s * 3, s * 1); ctx.fill();

    // ---- Torso: striped sailor top, bare shoulders ----
    var torsoL = cx - s * 15, torsoR = cx + s * 15;
    // Bare shoulders
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.moveTo(cx - s * 15, g.shoulderY + s * 3);
    ctx.quadraticCurveTo(cx - s * 17, g.shoulderY - s * 4, cx - s * 9, g.shoulderY - s * 3);
    ctx.lineTo(cx + s * 9, g.shoulderY - s * 3);
    ctx.quadraticCurveTo(cx + s * 17, g.shoulderY - s * 4, cx + s * 15, g.shoulderY + s * 3);
    ctx.lineTo(cx + s * 15, g.shoulderY + s * 6);
    ctx.lineTo(cx - s * 15, g.shoulderY + s * 6);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, s * 0.6); ctx.stroke();
    // Striped top
    var stripes = 7, stripeH = (g.torsoBot - g.shoulderY - s * 4) / stripes;
    for (var i = 0; i < stripes; i++) {
      ctx.fillStyle = (i % 2 === 0) ? NAVY : WHITE;
      ctx.fillRect(torsoL, g.shoulderY + s * 4 + i * stripeH, torsoR - torsoL, stripeH + 0.5);
    }
    ctx.strokeStyle = INK; ctx.lineWidth = stripeW;
    ctx.strokeRect(torsoL, g.shoulderY + s * 4, torsoR - torsoL, g.torsoBot - g.shoulderY - s * 4);

    // ---- Arms ----
    // Plain arm (viewer's right), hanging.
    var armR = cx + s * 19;
    ctx.fillStyle = SKIN;
    rr(armR - s * 3, g.armTop, s * 6, g.armBot - g.armTop, s * 3); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, s * 0.6);
    ctx.strokeRect(armR - s * 3, g.armTop, s * 6, g.armBot - g.armTop);
    dot(armR, g.armBot + s * 2, s * 3.2, SKIN);
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, s * 0.6);
    ctx.beginPath(); ctx.arc(armR, g.armBot + s * 2, s * 3.2, 0, Math.PI * 2); ctx.stroke();

    // Tattooed arm (viewer's left): slight flex, tattoos vivid with sailor emphasis.
    var flex = Math.sin(t * Math.PI * 2 / 5) * s * 1.2;
    var armL = g.armX + flex * 0.3;
    ctx.fillStyle = SKIN;
    rr(armL - s * 3, g.armTop, s * 6, g.armBot - g.armTop, s * 3); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, s * 0.6);
    ctx.strokeRect(armL - s * 3, g.armTop, s * 6, g.armBot - g.armTop);
    // Anchor tattoo on forearm
    var ay = g.armTop + (g.armBot - g.armTop) * 0.55;
    ctx.save();
    ctx.globalAlpha = tatA;
    ctx.strokeStyle = TATBLUE; ctx.lineWidth = Math.max(1, s * 0.9);
    ctx.beginPath(); ctx.arc(armL, ay - s * 2, s * 2.2, 0, Math.PI * 2); ctx.stroke();
    line(armL, ay - s * 2, armL, ay + s * 5, TATBLUE, Math.max(1, s * 0.9));
    line(armL - s * 3, ay + s * 1, armL + s * 3, ay + s * 1, TATBLUE, Math.max(1, s * 0.9));
    line(armL - s * 2.5, ay + s * 5, armL + s * 2.5, ay + s * 5, TATBLUE, Math.max(1, s * 0.9));
    // Heart tattoo above the anchor
    ctx.fillStyle = TATRED;
    ctx.beginPath();
    ctx.moveTo(armL, ay + s * 2);
    ctx.bezierCurveTo(armL - s * 4, ay - s * 3, armL - s * 1, ay - s * 6, armL, ay - s * 3);
    ctx.bezierCurveTo(armL + s * 1, ay - s * 6, armL + s * 4, ay - s * 3, armL, ay + s * 2);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    // Arm-drag boost: tattoos brighten and the arm lifts slightly.
    var armBoost = dragBoost(t, 'arm');
    if (armBoost > 0.02) {
      ctx.save();
      ctx.globalAlpha = a4(Math.min(0.45 * armBoost, 0.45));
      ctx.fillStyle = TATRED;
      ellipse(armL, ay + s * 1, s * 6, s * 7); ctx.fill();
      ctx.restore();
    }
    dot(armL, g.armBot + s * 2, s * 3.2, SKIN);
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, s * 0.6);
    ctx.beginPath(); ctx.arc(armL, g.armBot + s * 2, s * 3.2, 0, Math.PI * 2); ctx.stroke();

    // ---- Head ----
    var headR = g.headR;
    ctx.fillStyle = SKIN;
    ctx.beginPath(); ctx.arc(cx, g.headCy, headR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, s * 0.7); ctx.stroke();
    // Eyes, proud calm mouth
    dot(cx - headR * 0.35, g.headCy - headR * 0.1, Math.max(1, s * 0.9), INK);
    dot(cx + headR * 0.35, g.headCy - headR * 0.1, Math.max(1, s * 0.9), INK);
    line(cx - headR * 0.3, g.headCy + headR * 0.35, cx + headR * 0.3, g.headCy + headR * 0.35, INK, Math.max(1, s * 0.7));

    // ---- Sailor cap, slight tip (10 s period) ----
    var capTip = Math.sin(t * Math.PI * 2 / 10) * 0.05;
    ctx.save();
    ctx.translate(cx, g.headCy - headR * 0.95);
    ctx.rotate(capTip);
    ctx.fillStyle = WHITE;
    rr(-headR * 1.05, -headR * 0.55, headR * 2.1, headR * 0.55, headR * 0.25); ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, s * 0.6);
    ctx.strokeRect(-headR * 1.05, -headR * 0.55, headR * 2.1, headR * 0.55);
    ctx.fillStyle = NAVY;
    ctx.fillRect(-headR * 1.05, -headR * 0.15, headR * 2.1, headR * 0.18);
    ctx.restore();

    // ---- Beard: plaited strands with sway, ribbons, comb drag ----
    var beardCx = cx, beardTopY = g.beardTop;
    var spread = s * 11 * beardScale;
    for (var k = 0; k < STRANDS; k++) {
      var fx = -1 + (2 * k) / (STRANDS - 1); // -1..1
      var sway = Math.sin(t * Math.PI * 2 / 6 + strandPhase[k]) * s * 1.6;
      var len = s * 26 * strandLen[k] * beardScale;
      var x0 = beardCx + fx * s * 4;
      var x1 = beardCx + fx * spread + sway;
      var y1 = beardTopY + len;
      var part = beardPart(t, (x0 + x1) / 2, (beardTopY + y1) / 2);
      x1 += part;
      // Strand as a tapered plait: two lines + diagonal plait ticks
      ctx.strokeStyle = BEARD; ctx.lineWidth = Math.max(1.5, s * 1.6);
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x0, beardTopY);
      ctx.quadraticCurveTo(x0 + sway * 0.5, beardTopY + len * 0.5, x1, y1);
      ctx.stroke();
      ctx.strokeStyle = '#3a2210'; ctx.lineWidth = Math.max(1, s * 0.7);
      var ticks = 4;
      for (var j = 1; j <= ticks; j++) {
        var ty = beardTopY + (len * j) / (ticks + 1);
        var tx = x0 + (x1 - x0) * (j / (ticks + 1));
        var dir = (j % 2 === 0) ? 1 : -1;
        line(tx - s * 1.6 * dir, ty, tx + s * 1.6 * dir, ty + s * 1.2, '#3a2210', Math.max(1, s * 0.7));
      }
      // Ribbon accents on strands 1, 3, 5
      if (k === 1 || k === 3 || k === 5) {
        var ry = beardTopY + len * 0.62;
        var rx = x0 + (x1 - x0) * 0.62;
        var flut = Math.sin(t * Math.PI * 2 / 3 + ribbonPhase[k % 3]) * 0.18;
        ctx.save();
        ctx.translate(rx, ry); ctx.rotate(flut);
        ctx.globalAlpha = ribbonA;
        ctx.fillStyle = (k === 3) ? RIBGOLD : RIBRED;
        ctx.beginPath();
        ctx.moveTo(0, -s * 2.2); ctx.lineTo(s * 2.2, 0); ctx.lineTo(0, s * 2.2); ctx.lineTo(-s * 2.2, 0);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
    // Beard outline contour (keeps the mass one shape, not loose hair)
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, s * 0.5);
    ctx.beginPath();
    ctx.moveTo(cx - s * 5, beardTopY);
    ctx.quadraticCurveTo(cx - spread - s * 2, beardTopY + s * 12, cx - spread * 0.7, g.beardBot);
    ctx.quadraticCurveTo(cx, g.beardBot + s * 3, cx + spread * 0.7, g.beardBot);
    ctx.quadraticCurveTo(cx + spread + s * 2, beardTopY + s * 12, cx + s * 5, beardTopY);
    ctx.stroke();
  }

  function zoneAt(x, y) {
    var g = geom();
    // Beard zone: face-to-chest band
    if (x > g.cx - g.s * 14 && x < g.cx + g.s * 14 && y > g.beardTop - g.s * 2 && y < g.beardBot + g.s * 2) return 'beard';
    // Tattooed arm zone (viewer's left)
    if (x > g.armX - g.s * 7 && x < g.armX + g.s * 7 && y > g.armTop - g.s * 2 && y < g.armBot + g.s * 6) return 'arm';
    return null;
  }
  function onDown(e) {
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX !== undefined ? e.clientX : e.touches[0].clientX) - r.left;
    var y = (e.clientY !== undefined ? e.clientY : e.touches[0].clientY) - r.top;
    dragging = { zone: zoneAt(x, y), lx: x, ly: y };
    if (dragging.zone) {
      drags.push({ x: x, y: y, t: nowT, zone: dragging.zone, mag: 1 });
    }
  }
  function onMove(e) {
    if (!dragging || !dragging.zone) return;
    var r = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var x = (e.clientX !== undefined ? e.clientX : e.touches[0].clientX) - r.left;
    var y = (e.clientY !== undefined ? e.clientY : e.touches[0].clientY) - r.top;
    var dx = x - dragging.lx, dy = y - dragging.ly;
    var mag = Math.min(Math.sqrt(dx * dx + dy * dy) / 40, 1.5);
    if (mag > 0.05) drags.push({ x: x, y: y, t: nowT, zone: dragging.zone, mag: mag });
    dragging.lx = x; dragging.ly = y;
  }
  function onUp() { dragging = null; }
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  var nowT = 0;
  var startTime = 0, started = false;
  function loop(ts) {
    if (!started) { startTime = ts; started = true; }
    nowT = (ts - startTime) / 1000;
    draw(nowT);
    if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
  }
  // Frame one: synchronous constant-phase draw. Clock starts only with the rAF loop.
  draw(0);
  booted = true;
  if (typeof window !== 'undefined') window.__piece = { draw: draw, geom: geom, emph: emph, drags: drags };
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
})();
</script>
</body>
</html>
