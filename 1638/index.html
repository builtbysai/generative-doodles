<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ineffable Moment</title>
<style>
html, body { margin: 0; padding: 0; background: #fa7a5a; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var CORAL = [250, 122, 90];
var CORAL_DARK = [226, 96, 66];
var INK = [52, 28, 24];
var WHITE = [255, 248, 238];
var RAINBOW = [
  [228, 52, 48],
  [244, 128, 32],
  [248, 203, 38],
  [74, 172, 78],
  [64, 118, 218],
  [144, 88, 198]
];
var FIRST_PHASE = 21; // seconds into minute 0 at load: rainbow partway drawn
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function smooth(p) {
  p = clamp01(p);
  return p * p * (3 - 2 * p);
}
function rgba(c, a) {
  a = Math.round(clamp01(a) * 10000) / 10000;
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, lastT = 0, startT = null;
var paused = false, pauseT = 0, resuming = false;

// ---- composition planner: one seeded plan per minute ----
function planMinute(k) {
  var rng = mulberry32(1638000 + k * 104729);
  var kind = k === 0 ? 0 : Math.floor(rng() * 3); // 0 rainbow, 1 hearts, 2 starburst
  var marks = [];
  var i, j;
  if (kind === 0) {
    // bigger rainbow: six wobbly bands, staggered draw starts
    for (i = 0; i < 6; i++) {
      var wob = [];
      for (j = 0; j < 49; j++) wob.push((rng() - 0.5) * 0.016);
      marks.push({
        type: 'band', color: RAINBOW[i], r: 0.36 - i * 0.042,
        cx: 0.5, cy: 0.60, start: 0.02 + i * 0.055, dur: 0.30, wob: wob
      });
    }
  } else if (kind === 1) {
    // field of hearts: one big heart at the centre, many small ones
    marks.push({ type: 'heart', color: RAINBOW[0], x: 0.5, y: 0.40, s: 0.30,
      start: 0.02, dur: 0.30, wob: [(rng() - 0.5) * 0.05, (rng() - 0.5) * 0.05,
      (rng() - 0.5) * 0.05, (rng() - 0.5) * 0.05] });
    for (i = 0; i < 14; i++) {
      marks.push({ type: 'heart', color: pick(rng, RAINBOW),
        x: 0.10 + rng() * 0.80, y: 0.08 + rng() * 0.62, s: 0.05 + rng() * 0.09,
        start: 0.10 + rng() * 0.55, dur: 0.12,
        wob: [(rng() - 0.5) * 0.05, (rng() - 0.5) * 0.05,
        (rng() - 0.5) * 0.05, (rng() - 0.5) * 0.05] });
    }
  } else {
    // single huge starburst at the centre, small ones around
    var rays = [];
    for (i = 0; i < 16; i++) rays.push(0.75 + rng() * 0.5);
    marks.push({ type: 'burst', color: RAINBOW[4], x: 0.5, y: 0.40, s: 0.34,
      start: 0.02, dur: 0.32, rays: rays, rot: rng() * TAU });
    for (i = 0; i < 6; i++) {
      var r2 = [];
      for (j = 0; j < 8; j++) r2.push(0.7 + rng() * 0.55);
      marks.push({ type: 'burst', color: pick(rng, RAINBOW),
        x: 0.10 + rng() * 0.80, y: 0.08 + rng() * 0.60, s: 0.05 + rng() * 0.07,
        start: 0.15 + rng() * 0.5, dur: 0.12, rays: r2, rot: rng() * TAU });
    }
  }
  // scattered small marks around the dominant motif
  var nSmall = 10 + Math.floor(rng() * 5);
  for (i = 0; i < nSmall; i++) {
    var roll = rng();
    var mx = 0.08 + rng() * 0.84, my = 0.06 + rng() * 0.66;
    var st = 0.05 + rng() * 0.65;
    if (roll < 0.3) {
      marks.push({ type: 'heart', color: pick(rng, RAINBOW), x: mx, y: my,
        s: 0.04 + rng() * 0.06, start: st, dur: 0.10,
        wob: [(rng() - 0.5) * 0.05, (rng() - 0.5) * 0.05,
        (rng() - 0.5) * 0.05, (rng() - 0.5) * 0.05] });
    } else if (roll < 0.55) {
      var r3 = [];
      for (j = 0; j < 8; j++) r3.push(0.7 + rng() * 0.55);
      marks.push({ type: 'burst', color: pick(rng, RAINBOW), x: mx, y: my,
        s: 0.04 + rng() * 0.05, start: st, dur: 0.10, rays: r3, rot: rng() * TAU });
    } else if (roll < 0.8) {
      var wob2 = [];
      for (j = 0; j < 7; j++) wob2.push((rng() - 0.5) * 0.05);
      marks.push({ type: 'streak', color: WHITE, x: mx, y: my,
        s: 0.06 + rng() * 0.08, start: st, dur: 0.08, wob: wob2,
        rot: rng() * TAU });
    } else {
      var wob3 = [];
      for (j = 0; j < 25; j++) wob3.push((rng() - 0.5) * 0.012);
      marks.push({ type: 'arc', color: pick(rng, RAINBOW), x: mx, y: my,
        s: 0.05 + rng() * 0.06, start: st, dur: 0.12, wob: wob3,
        rot: rng() * TAU });
    }
  }
  return { kind: kind, marks: marks };
}
var planCache = {};
function getPlan(k) {
  if (!planCache[k]) planCache[k] = planMinute(k);
  return planCache[k];
}

// ---- geometry ----
function isPhone() {
  var sw = 9999, sh = 9999;
  if (typeof window !== 'undefined' && window.screen) {
    sw = window.screen.width; sh = window.screen.height;
  }
  if (Math.min(sw, sh) < 700) return true;
  return VH > VW * 1.15;
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
}
function geo() {
  if (isPhone()) return { x: 0, y: 0, w: VW, h: VH, phone: true };
  var pw = Math.min(VW * 0.62, VH * 0.72);
  var ph = pw * 1.3;
  if (ph > VH * 0.94) { ph = VH * 0.94; pw = ph / 1.3; }
  return { x: (VW - pw) / 2, y: (VH - ph) / 2, w: pw, h: ph, phone: false };
}

// ---- mark drawing (all in portrait-rect local coords, unit = rect width) ----
function drawBand(g, m, reveal, alpha) {
  var u = g.w;
  var cx = g.x + m.cx * u, cy = g.y + m.cy * g.h;
  var r = m.r * u;
  var span = Math.PI * reveal;
  var lw = u * 0.034;
  var pass, off, a0, a1, k, ang, rr, px, py;
  for (pass = 0; pass < 3; pass++) {
    off = (pass - 1) * lw * 0.22;
    ctx.strokeStyle = rgba(m.color, alpha * (pass === 0 ? 0.92 : 0.38));
    ctx.lineWidth = lw * (pass === 0 ? 1 : 0.55);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round'; // miter joins spike on wobbly near-coincident points
    ctx.beginPath();
    for (k = 0; k <= 48; k++) {
      ang = Math.PI + (span * k) / 48;
      rr = r + off + m.wob[k] * u;
      px = cx + rr * Math.cos(ang); py = cy + rr * Math.sin(ang);
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  // black crayon outline on the outer edge of the band
  ctx.strokeStyle = rgba(INK, alpha * 0.55);
  ctx.lineWidth = Math.max(1, u * 0.004);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (k = 0; k <= 48; k++) {
    ang = Math.PI + (span * k) / 48;
    rr = r + lw * 0.55 + m.wob[k] * u;
    px = cx + rr * Math.cos(ang); py = cy + rr * Math.sin(ang);
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
}
function heartPath(x, y, s, wob) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.38);
  ctx.bezierCurveTo(x - s * 0.58 + wob[0] * s, y - s * 0.22 + wob[1] * s,
    x - s * 0.30 + wob[2] * s, y - s * 0.78, x, y - s * 0.30);
  ctx.bezierCurveTo(x + s * 0.30 - wob[2] * s, y - s * 0.78,
    x + s * 0.58 - wob[0] * s, y - s * 0.22 - wob[1] * s, x, y + s * 0.38);
  ctx.closePath();
}
function drawHeart(g, m, reveal, alpha) {
  var u = g.w;
  var x = g.x + m.x * u, y = g.y + m.y * g.h;
  var s = m.s * u * (0.82 + 0.18 * reveal);
  ctx.fillStyle = rgba(m.color, alpha * smooth(reveal));
  heartPath(x, y, s, m.wob);
  ctx.fill();
  ctx.strokeStyle = rgba(INK, alpha * 0.7 * smooth(reveal));
  ctx.lineWidth = Math.max(1, u * 0.005);
  ctx.lineJoin = 'round';
  heartPath(x, y, s, m.wob);
  ctx.stroke();
}
function drawBurst(g, m, reveal, alpha) {
  var u = g.w;
  var x = g.x + m.x * u, y = g.y + m.y * g.h;
  var s = m.s * u;
  var n = m.rays.length, i, ang, len, ex, ey;
  var count = Math.max(1, Math.floor(n * reveal));
  ctx.strokeStyle = rgba(m.color, alpha * 0.95);
  ctx.lineWidth = Math.max(1.5, s * 0.075);
  ctx.lineCap = 'round';
  for (i = 0; i < count; i++) {
    ang = m.rot + (i / n) * TAU;
    len = s * m.rays[i];
    ex = x + len * Math.cos(ang); ey = y + len * Math.sin(ang);
    ctx.beginPath();
    ctx.moveTo(x + s * 0.10 * Math.cos(ang), y + s * 0.10 * Math.sin(ang));
    ctx.lineTo(ex, ey);
    ctx.stroke();
  }
  // centre dot as paired arcs (node-canvas quirk)
  ctx.fillStyle = rgba(INK, alpha);
  ctx.beginPath();
  ctx.moveTo(x + s * 0.09, y);
  ctx.arc(x, y, s * 0.09, 0, TAU);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + s * 0.09, y);
  ctx.arc(x, y, s * 0.09, 0, TAU);
  ctx.fill();
}
function drawStreak(g, m, reveal, alpha) {
  var u = g.w;
  var x = g.x + m.x * u, y = g.y + m.y * g.h;
  var s = m.s * u;
  var n = 6, k, t, px, py;
  ctx.strokeStyle = rgba(m.color, alpha * 0.9 * smooth(reveal));
  ctx.lineWidth = Math.max(1.5, s * 0.14);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (k = 0; k <= n; k++) {
    t = (k / n) * reveal;
    px = x - s / 2 + s * t + m.wob[k] * u;
    py = y + m.wob[(k + 3) % 6] * u * 0.6;
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
}
function drawArc(g, m, reveal, alpha) {
  var u = g.w;
  var x = g.x + m.x * u, y = g.y + m.y * g.h;
  var r = m.s * u;
  var span = Math.PI * 1.2 * reveal;
  var k, ang, rr, px, py;
  ctx.strokeStyle = rgba(m.color, alpha * 0.95);
  ctx.lineWidth = Math.max(1.5, u * 0.012);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  for (k = 0; k <= 24; k++) {
    ang = m.rot + (span * k) / 24;
    rr = r + m.wob[k] * u;
    px = x + rr * Math.cos(ang); py = y + rr * Math.sin(ang);
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
}
function drawMark(g, m, reveal, alpha) {
  if (reveal <= 0 || alpha <= 0) return;
  if (m.type === 'band') drawBand(g, m, reveal, alpha);
  else if (m.type === 'heart') drawHeart(g, m, reveal, alpha);
  else if (m.type === 'burst') drawBurst(g, m, reveal, alpha);
  else if (m.type === 'streak') drawStreak(g, m, reveal, alpha);
  else if (m.type === 'arc') drawArc(g, m, reveal, alpha);
}

function draw(t) {
  lastT = t;
  size();
  var g = geo();
  ctx.fillStyle = rgb(CORAL);
  ctx.fillRect(0, 0, VW, VH);
  if (!g.phone) {
    ctx.strokeStyle = rgba(CORAL_DARK, 0.8);
    ctx.lineWidth = 2;
    ctx.strokeRect(g.x + 1, g.y + 1, g.w - 2, g.h - 2);
  }
  // fixed-phase clock: first frame is 21s into minute 0
  var te = t + FIRST_PHASE;
  var minute = Math.floor(te / 60);
  var p = (te % 60) / 60;
  var fade = p >= 0.93 ? Math.max(0, 1 - (p - 0.93) / 0.07) : 1;
  var plan = getPlan(minute);
  var i, m, reveal;
  for (i = 0; i < plan.marks.length; i++) {
    m = plan.marks[i];
    reveal = smooth((p - m.start) / m.dur);
    drawMark(g, m, reveal, fade);
  }
  // title, date, hint inside the portrait rect
  var tx = g.x + g.w / 2;
  ctx.textAlign = 'center';
  ctx.fillStyle = rgb(INK);
  ctx.font = 'bold ' + Math.round(g.w * 0.046) + 'px sans-serif';
  ctx.fillText('The Ineffable Moment', tx, g.y + g.h * 0.875);
  ctx.font = Math.round(g.w * 0.034) + 'px sans-serif';
  ctx.fillStyle = rgba(INK, 0.75);
  ctx.fillText('2006 · 07 · 07', tx, g.y + g.h * 0.915);
  ctx.font = Math.round(g.w * 0.030) + 'px sans-serif';
  ctx.fillStyle = rgba(INK, 0.75);
  ctx.fillText(paused ? 'Held · tap to resume' : 'Tap to hold a composition.', tx, g.y + g.h * 0.955);
}

function onTap() {
  if (paused) { paused = false; resuming = true; }
  else { paused = true; pauseT = lastT; }
}
canvas.addEventListener('pointerdown', onTap);
if (typeof window !== 'undefined') {
  if (window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
  if (window.addEventListener) window.addEventListener('resize', size);
}
draw(0);
function loop(ts) {
  if (startT === null) startT = ts;
  if (resuming) { startT = ts - pauseT * 1000; resuming = false; }
  var t = paused ? pauseT : (ts - startT) / 1000;
  draw(t);
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(loop);
</script>
</body>
</html>
