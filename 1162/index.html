<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dear Apple</title>
<style>
  html, body { margin: 0; padding: 0; background: #050505; overflow: hidden; height: 100%; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- Dear Apple — Nick Briz study NB3 (Apple Computers, 2013) ----------
  // An open letter typed live in monospace on near-black, after Briz's remix
  // of Phil Morton: "that impossible reconciliation between my tech
  // dependencies && my politix." Behind the letter, a faint geometric field
  // degrades into codec artifacts in proportion to the letter's progress —
  // the complication made visible. A thin strip across the top meters it.
  //   cycle = 55s: 45s typing (variable cadence, pauses at punctuation),
  //   10s hold, then the next of three prewritten letters.
  //   drag horizontally to scrub through the letter; typing pauses while
  //   scrubbing and resumes from the scrubbed position on release.
  // Everything is closed-form: reveal times are a precomputed table per
  // letter, the field's damage is a pure function of progress p.

  var TYPE_LEN = 45, HOLD_LEN = 10, CYCLE = TYPE_LEN + HOLD_LEN;
  var BG = '#050505';
  var INK = '#D8D8D8', HI = '#FFE14D';
  var PINK = '#FF2B6E', CYAN = '#00FFC2', CURSOR = '#33FF66';
  var STRIP = ['#33FF66', '#FFE14D', '#FF2B6E'];

  // ---------- the letters (segments; hi = highlighted key phrase) ----------
  var LETTERS = [
    [
      { t: 'dear apple, we need to talk about us. i write my work on your machines. i keep my photographs on them, my letters, my half-finished songs. ', hi: false },
      { t: 'i love these tools.', hi: true },
      { t: ' i want to say that first, because what follows is not a breakup. but a tool i cannot open is not entirely mine. when the battery fades, i should be able to change the battery. when a key sticks, i should not need permission to fix it. ', hi: false },
      { t: 'let me open the machine i paid for.', hi: true },
      { t: ' let me keep it longer than your calendar says. i am not asking for much. i am asking for ', hi: false },
      { t: 'what used to be normal.', hi: true }
    ],
    [
      { t: 'dear apple, everything i make passes through your hands first. the notebook, the camera, the little glowing rectangle that wakes me up. i depend on them, and ', hi: false },
      { t: 'dependence is a kind of contract', hi: true },
      { t: ', even when nobody signed anything. so here are my terms, since you showed me yours. do not retire my tools while they still work. do not brick the old to sell the new. ', hi: false },
      { t: 'if i bought it, it is mine', hi: true },
      { t: ' on the days you are bored of it too. i will keep choosing these machines on the day i am free not to. that is the deal i want: ', hi: false },
      { t: 'loyalty that survives being optional.', hi: true }
    ],
    [
      { t: 'dear apple, this is the impossible part, so i will say it plainly. ', hi: false },
      { t: 'my politics live in one pocket and my phone lives in the other', hi: true },
      { t: ', and some days they argue. i need the machine. i also need it to be a machine: screws i can turn, parts i can replace, a battery that comes out like batteries used to. ', hi: false },
      { t: 'a sealed box asks for trust. an openable one earns it.', hi: true },
      { t: ' you taught a generation that computers are friendly. now teach us they can be ours. i will be here, typing on your keys, hoping the next model ', hi: false },
      { t: 'ships with a way in.', hi: true }
    ]
  ];

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded rng + integer hash ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashN(a, b) {
    var h = Math.imul(a + 11, 0x8da6b343) ^ Math.imul(b + 7, 0xd8163841);
    h = Math.imul(h ^ (h >>> 13), 0x165667b1);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  // ---------- per-letter char table + reveal times ----------
  // raw cadence: 11 chars/s base, +0.35s after '.', +0.18s after ',';
  // the raw table is then scaled so the last char lands exactly at 45s.
  var letterData = LETTERS.map(function (segs) {
    var chars = [];
    for (var s = 0; s < segs.length; s++) {
      var txt = segs[s].t;
      for (var i = 0; i < txt.length; i++) chars.push({ ch: txt.charAt(i), hi: segs[s].hi });
    }
    var reveal = [0.35];
    for (var k = 1; k < chars.length; k++) {
      var dt = 1 / 11;
      var prev = chars[k - 1].ch;
      if (prev === '.') dt += 0.35; else if (prev === ',') dt += 0.18;
      reveal.push(reveal[k - 1] + dt);
    }
    var scale = TYPE_LEN / reveal[chars.length - 1];
    for (var j = 0; j < reveal.length; j++) reveal[j] *= scale;
    return { chars: chars, reveal: reveal, n: chars.length };
  });
  function charsShownAt(L, tt) {
    if (tt <= 0) return 0;
    var k = 0;
    while (k < L.n && L.reveal[k] <= tt) k++;
    return k;
  }
  function timeForChars(L, k) {
    if (k <= 0) return 0;
    if (k >= L.n) return TYPE_LEN;
    return L.reveal[k - 1];
  }

  // ---------- fixed first-frame phase: letter 1 at ~55% typed, cursor on ----------
  function blinkOn(t) { return (t % 1) < 0.62; }
  var T0 = (function () {
    var L = letterData[0];
    var idx = Math.floor(0.55 * L.n);
    while (idx < L.n - 1 && !blinkOn(L.reveal[idx])) idx++;
    return L.reveal[idx];
  })();

  // ---------- background field: seeded artifact blocks ----------
  var artifacts = [];
  (function buildArtifacts() {
    var rng = mulberry32(116202);
    for (var i = 0; i < 30; i++) {
      artifacts.push({
        fx: rng() * 0.96, fy: rng() * 0.97,
        fw: 0.02 + rng() * 0.075, fh: 0.012 + rng() * 0.05,
        color: rng() > 0.5 ? PINK : CYAN,
        th: rng() * 0.75
      });
    }
  })();

  // ---------- viewport / sizing ----------
  var W = 0, H = 0, DPR = 1;
  function viewSize() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    var w = vv ? vv.width : (window.innerWidth || 800);
    var h = vv ? vv.height : (window.innerHeight || 600);
    return { w: w, h: h };
  }
  function isPhone() {
    var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : null;
    if (scr && scr.width && scr.height) {
      if (Math.min(scr.width, scr.height) < 700) return true;
    }
    return H > W * 1.15;
  }
  function fit() {
    var s = viewSize();
    W = s.w; H = s.h;
    DPR = Math.min((window.devicePixelRatio || 1), 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }
  fit();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', fit);
  }
  window.addEventListener('resize', fit);

  // ---------- the faint geometric field (drawn whole; bands clip + shift it) ----------
  function drawFieldShapes() {
    var cx = W * 0.5, cy = H * 0.52, i, r;
    ctx.lineWidth = 1.5;
    // concentric rectangles
    ctx.strokeStyle = '#7C8AA5';
    ctx.beginPath();
    for (i = 0; i < 7; i++) {
      var hw = 46 + i * 47, hh = hw * 0.72;
      ctx.rect(cx - hw, cy - hh, hw * 2, hh * 2);
    }
    ctx.stroke();
    // circle rings, two centres (each arc its own path: no batched subpaths)
    ctx.strokeStyle = '#93A0B8';
    for (i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.arc(W * 0.28, H * 0.32, 26 + i * 29, 0, Math.PI * 2);
      ctx.stroke();
    }
    for (i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(W * 0.76, H * 0.7, 20 + i * 24, 0, Math.PI * 2);
      ctx.stroke();
    }
    // diagonal lattice
    ctx.strokeStyle = '#4E5A72';
    ctx.beginPath();
    for (var x = -H * 0.6; x < W; x += 92) {
      ctx.moveTo(x, -10);
      ctx.lineTo(x + H * 0.6, H + 10);
    }
    ctx.stroke();
    // a horizon rule and two filled nodes
    ctx.fillStyle = '#7C8AA5';
    ctx.fillRect(0, H * 0.78, W, 2);
    ctx.beginPath(); ctx.arc(W * 0.28, H * 0.32, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(W * 0.76, H * 0.7, 5, 0, Math.PI * 2); ctx.fill();
  }

  function drawField(p) {
    var BAND = 24;
    var bands = Math.ceil(H / BAND);
    ctx.globalAlpha = 0.25;
    for (var b = 0; b < bands; b++) {
      var off = (hashN(b, 77) - 0.5) * 170 * p;
      // late, deep bands slip an extra block-width, like a lost sync
      if (p > 0.6 && hashN(b, 78) > 0.72) off += 34 * p;
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, b * BAND, W, BAND);
      ctx.clip();
      ctx.translate(off, 0);
      drawFieldShapes();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    // artifact blocks: appear past their threshold, grow with p
    for (var i = 0; i < artifacts.length; i++) {
      var a = artifacts[i];
      if (p <= a.th) continue;
      ctx.globalAlpha = Math.min(0.34, 0.06 + (p - a.th) * 0.85);
      ctx.fillStyle = a.color;
      ctx.fillRect(a.fx * W, a.fy * H, a.fw * W * (0.4 + 0.6 * p), a.fh * H);
    }
    ctx.globalAlpha = 1;
    // macroblock grid fades in with complication
    if (p > 0.4) {
      ctx.globalAlpha = 0.35 * (p - 0.4) / 0.6;
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var gx = 34; gx < W; gx += 34) { ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
      for (var gy = 34; gy < H; gy += 34) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // ---------- text layout: word wrap over the char table ----------
  function layout(L, wrapChars) {
    var lines = [], pos = [];
    var line = [], col = 0, i, j;
    function pushLine() { lines.push(line); line = []; col = 0; }
    i = 0;
    while (i < L.n) {
      // one word = run of non-space chars, plus its trailing space
      var word = [];
      while (i < L.n && L.chars[i].ch !== ' ') { word.push(L.chars[i]); i++; }
      var space = null;
      if (i < L.n && L.chars[i].ch === ' ') { space = L.chars[i]; i++; }
      if (col > 0 && col + word.length > wrapChars) pushLine();
      for (j = 0; j < word.length; j++) {
        pos.push({ line: lines.length, col: col });
        line.push(word[j]); col++;
      }
      if (space) {
        // the trailing space always stays on the current line (it draws as
        // blank); the next word's fit check performs the wrap. This keeps
        // line char counts aligned 1:1 with char indices.
        pos.push({ line: lines.length, col: col });
        line.push(space); col++;
      }
    }
    if (line.length || !lines.length) pushLine();
    pos.push({ line: lines.length - 1, col: lines[lines.length - 1].length });
    return { lines: lines, pos: pos };
  }

  // ---------- interaction: horizontal drag scrubs the letter ----------
  var scrubbing = false, scrubChars = 0;
  function nowMs() {
    return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  }
  var anchorStamp = nowMs(), anchorT = T0;
  function pieceT() { return anchorT + (nowMs() - anchorStamp) / 1000; }
  function currentLetter(t) {
    var cyc = Math.floor(t / CYCLE);
    return { cyc: cyc, ct: t - cyc * CYCLE, L: letterData[cyc % 3] };
  }
  function applyScrub(clientX) {
    var t = pieceT(), cur = currentLetter(t);
    var frac = clientX / (W || 1);
    if (frac < 0) frac = 0; if (frac > 1) frac = 1;
    scrubChars = Math.round(frac * cur.L.n);
  }
  function endScrub() {
    if (!scrubbing) return;
    scrubbing = false;
    var t = pieceT(), cur = currentLetter(t);
    anchorT = cur.cyc * CYCLE + timeForChars(cur.L, scrubChars);
    anchorStamp = nowMs();
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', function (e) {
      scrubbing = true; applyScrub(e.clientX || 0);
    });
    canvas.addEventListener('pointermove', function (e) {
      if (scrubbing) applyScrub(e.clientX || 0);
    });
    canvas.addEventListener('pointerup', endScrub);
    canvas.addEventListener('pointercancel', endScrub);
  }
  window.addEventListener('pointerup', endScrub);

  // ---------- drawing ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var cur = currentLetter(t);
    var L = cur.L;
    var k;
    if (scrubbing) k = scrubChars;
    else if (cur.ct < TYPE_LEN) k = charsShownAt(L, cur.ct);
    else k = L.n;
    var p = L.n ? k / L.n : 0;

    // background field, degraded by complication p
    drawField(p);

    // ---- letter ----
    var phone = isPhone();
    var fs = phone ? 13 : 18;
    ctx.font = fs + 'px "Courier New", monospace';
    var charW = ctx.measureText('MMMMMMMMMM').width / 10;
    var wrapChars = phone ? 42 : 58;
    var colW = wrapChars * charW;
    if (colW > W * 0.94) {
      fs = Math.floor(fs * (W * 0.94) / colW);
      ctx.font = fs + 'px "Courier New", monospace';
      charW = ctx.measureText('MMMMMMMMMM').width / 10;
      colW = wrapChars * charW;
    }
    var lay = layout(L, wrapChars);
    var lineH = fs * 1.5;
    var x0 = (W - colW) / 2;
    var y0 = Math.max(H * 0.15, 54);

    ctx.textBaseline = 'top';
    var shown = 0;
    for (var li = 0; li < lay.lines.length && shown < k; li++) {
      var lineChars = lay.lines[li];
      var take = Math.min(lineChars.length, k - shown);
      // draw in runs of equal highlight flag
      var runStart = 0;
      for (var c = 1; c <= take; c++) {
        if (c === take || lineChars[c].hi !== lineChars[runStart].hi) {
          var str = '';
          for (var m = runStart; m < c; m++) str += lineChars[m].ch;
          ctx.fillStyle = lineChars[runStart].hi ? HI : INK;
          ctx.fillText(str, x0 + runStart * charW, y0 + li * lineH + lineH * 0.16);
          runStart = c;
        }
      }
      shown += take;
    }

    // block cursor at the next char position (blinks in 0.5s steps)
    if (blinkOn(t)) {
      var cp = lay.pos[Math.min(k, L.n)];
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = CURSOR;
      ctx.fillRect(x0 + cp.col * charW, y0 + cp.line * lineH + lineH * 0.16, charW * 0.92, fs * 1.04);
      ctx.globalAlpha = 1;
    }

    // complication strip: 3px across the top, color by thirds (hard steps)
    ctx.fillStyle = STRIP[Math.min(2, Math.floor(p * 3))];
    ctx.fillRect(0, 0, p * W, 3);
  }

  // ---------- run: synchronous fixed-phase first frame, then guarded rAF ----------
  draw(T0);
  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(pieceT());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
