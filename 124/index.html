<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>№124 · Daily Lines</title>
<style>
html,body { margin:0; padding:0; height:100%; overflow:hidden; background:#F3EFE4; touch-action:none; }
#stage { position:fixed; inset:0; display:block; }
.hint { position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); text-align:center; color:rgba(22,21,17,0.55); font:12px/1.4 -apple-system,"Segoe UI",system-ui,sans-serif; letter-spacing:0.14em; pointer-events:none; user-select:none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div class="hint">drag to scan the week</div>
<script>
'use strict';
const canvas=document.getElementById('stage');
function viewportWH(){ const vv=window.visualViewport; if(vv&&vv.width>0&&vv.height>0) return [vv.width,vv.height]; return [window.innerWidth,window.innerHeight]; }
function isPhone(){ const sw=window.screen?window.screen.width:0, sh=window.screen?window.screen.height:0; if(sw&&sh&&Math.min(sw,sh)<700) return true; const wh=viewportWH(); return wh[1]>wh[0]*1.15; }
const ctx=canvas.getContext('2d');
function prep(w,h){ const dpr=Math.min(window.devicePixelRatio||1,2); if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); } ctx.setTransform(dpr,0,0,dpr,0,0); canvas.style.width=w+'px'; canvas.style.height=h+'px'; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function mulberry(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

// No.124 Daily Lines: one seeded line-study per day, last 7 days kept as fading ghosts
const PAPER='#F3EFE4', INK='#161511';
const GREYS=['#8A877C','#9C998E','#ACA9A0','#BCB9B1','#CCCAC2','#D8D4C6'];
function genLine(kind, rnd){
  const pts=[]; const N=300;
  if(kind===0){ // a spiral that forgets its center
    for(let i=0;i<=N;i++){ const f=i/N, a=f*Math.PI*2*5.2;
      const cx=0.5+0.15*Math.sin(a*0.66+0.5), cy=0.5+0.15*Math.cos(a*0.53);
      const r=0.02+0.30*f;
      pts.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r*0.92]);
    }
  } else if(kind===1){ // a wave that argues with itself
    for(let i=0;i<=N;i++){ const f=i/N, x=0.06+0.88*f;
      let y=0.5+0.20*Math.sin(f*9.4+0.4);
      y-=0.16*Math.sin((f-0.52)*26)*Math.exp(-Math.pow((f-0.66)*4.2,2));
      y+=0.05*Math.sin(f*34);
      pts.push([x,y]);
    }
  } else if(kind===2){ // a grid that melts: one continuous snake through sagging rows
    const rows=9;
    for(let rI=0;rI<rows;rI++){
      const yBase=0.10+0.80*(rI/(rows-1)), melt=0.012+0.075*(rI/(rows-1)), dir=rI%2? -1:1;
      const M=44;
      for(let i=0;i<=M;i++){ const f=dir>0? i/M : 1-i/M;
        pts.push([0.07+0.86*f, yBase+Math.sin(f*Math.PI)*melt]);
      }
    }
  } else if(kind===3){ // squares rounding off into a circle, spiralling
    for(let i=0;i<=N;i++){ const f=i/N, a=f*Math.PI*2*4.4;
      const n=6.5-4.3*f, r=0.045+0.315*f;
      const ca=Math.cos(a), sa=Math.sin(a), e=2/n;
      const px=0.5+r*Math.sign(ca)*Math.pow(Math.abs(ca),e);
      const py=0.5+r*Math.sign(sa)*Math.pow(Math.abs(sa),e)*0.94;
      pts.push([px,py]);
    }
  } else if(kind===4){ // a zigzag easing into a wave
    for(let i=0;i<=N;i++){ const f=i/N, x=0.06+0.88*f;
      const tri=Math.abs(((f*7)%1)*2-1)*2-1;
      const y=0.5+(tri*(1-f)+Math.sin(f*7*Math.PI*2)*f)*0.21*(1-0.35*f);
      pts.push([x,y]);
    }
  } else if(kind===5){ // loops along a line, like a row of cursive e's
    for(let i=0;i<=N;i++){ const f=i/N, p=f*Math.PI*2*11;
      const x=0.07+0.86*f+0.016*Math.sin(p);
      const y=0.56-0.15*(0.5-0.5*Math.cos(p))+0.045*Math.sin(f*Math.PI*4);
      pts.push([x,y]);
    }
  } else { // a fan that opens and closes, tips connected
    for(let i=0;i<=N;i++){ const f=i/N, th=-1.08+2.16*f;
      const r=0.30+0.135*Math.cos(f*Math.PI*22)*(1-0.3*Math.abs(f-0.5));
      pts.push([0.5+Math.sin(th)*r, 0.94-Math.cos(th)*r*1.55]);
    }
  }
  return pts;
}
function dateStr(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function lineFor(seedStr){ const rnd=mulberry(hashStr(seedStr)); const kind=(rnd()*7)|0; return genLine(kind, rnd); }
// a double-tap fresh line is remembered for the day, as practice would be
let store={};
try{ const s=window.localStorage? window.localStorage.getItem('daily-lines-124') : null; if(s) store=JSON.parse(s)||{}; }catch(e){ store={}; }
function saveStore(){ try{ if(window.localStorage) window.localStorage.setItem('daily-lines-124', JSON.stringify(store)); }catch(e){} }

let builtDate='', week=[], freshSeed=null, progStart=(typeof performance!=='undefined')? performance.now() : 0;
function buildWeek(){
  builtDate=dateStr(new Date());
  week=[];
  for(let age=0; age<7; age++){
    const d=new Date(); d.setDate(d.getDate()-age);
    let pts;
    if(age===0 && freshSeed!==null) pts=lineFor('fresh-'+freshSeed);
    else if(age===0 && store[builtDate]) pts=lineFor('fresh-'+store[builtDate]);
    else pts=lineFor('day-'+dateStr(d));
    week.push(pts);
  }
}
buildWeek();
let dragging=false, downX=0, scrub=0, scrubTarget=0, lastTapT=-1e9, lastTapPt=null;
function strokePts(pts, frac, w, h){
  const n=Math.max(2, Math.floor(pts.length*clamp(frac,0,1)));
  ctx.beginPath();
  for(let i=0;i<n;i++){ const x=pts[i][0]*w, y=pts[i][1]*h; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  ctx.stroke();
}
function drawFrame(nowMs){
  const [w,h]=viewportWH(); prep(w,h);
  const t=nowMs/1000;
  if(dateStr(new Date())!==builtDate){ buildWeek(); progStart=nowMs; }
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,w,h);
  scrub+=(scrubTarget-scrub)*0.12;
  const progress=clamp((nowMs-progStart)/60000,0,1);
  const scanning=scrub>0.02;
  // ghosts first, oldest deepest
  for(let age=6; age>=1; age--){
    const inkF=scanning? clamp(1-Math.abs(scrub-age),0,1) : 0;
    ctx.strokeStyle=GREYS[age-1]; ctx.lineWidth=1.2; ctx.globalAlpha=0.55-inkF*0.3;
    strokePts(week[age],1,w,h);
    if(inkF>0.03){ ctx.strokeStyle=INK; ctx.lineWidth=2.2; ctx.globalAlpha=inkF*0.95; strokePts(week[age], clamp(1-Math.abs(scrub-age)*1.3,0.06,1), w, h); }
  }
  // today owns the frame
  const todayInk=scanning? clamp(1-scrub,0,1) : 1;
  ctx.strokeStyle=INK; ctx.lineWidth=2.4;
  ctx.globalAlpha=(0.35+0.65*todayInk)*(progress>=1? 0.93+0.07*Math.sin(t*0.8) : 1);
  strokePts(week[0], progress, w, h);
  ctx.globalAlpha=1;
}
canvas.addEventListener('pointerdown',e=>{
  if(e.timeStamp-lastTapT<350 && lastTapPt && Math.abs(e.clientX-lastTapPt[0])<30 && Math.abs(e.clientY-lastTapPt[1])<30){
    freshSeed=Date.now(); store[builtDate]=freshSeed; saveStore(); buildWeek(); progStart=e.timeStamp; lastTapT=-1e9; return;
  }
  lastTapT=e.timeStamp; lastTapPt=[e.clientX,e.clientY];
  dragging=true; downX=e.clientX;
});
canvas.addEventListener('pointermove',e=>{ if(dragging){ const [w]=viewportWH(); scrubTarget=clamp((e.clientX-downX)/(w*0.55),0,1)*6; } });
function endP(){ dragging=false; scrubTarget=0; }
canvas.addEventListener('pointerup',endP); canvas.addEventListener('pointercancel',endP);

function loop(nowMs){ drawFrame(nowMs); if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop); }
drawFrame(47000);
if(typeof requestAnimationFrame==='function') requestAnimationFrame(loop);
window.addEventListener('resize',()=>drawFrame(performance.now()));
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>drawFrame(performance.now()));
</script>
</body>
</html>
