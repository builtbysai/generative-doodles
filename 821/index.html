<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Loops of Nine, Ten, Eleven</title>
<style>
  html, body { margin: 0; padding: 0; background: #0B0B0E; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32) ----------
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  // ---------- palette (strict) ----------
  var TEAL = '#2E7D74';     // inner ring, 9 s loop
  var RUST = '#B3552E';     // middle ring, 10 s loop
  var VIOLET = '#7A6FA8';   // outer ring, 11 s loop
  var GROUND = '#0B0B0E';   // near-black ground

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- viewport sizing (Visual Viewport API) ----------
  function viewSize() {
    var w, h;
    if (window.visualViewport) {
      w = window.visualViewport.width;
      h = window.visualViewport.height;
    } else {
      w = window.innerWidth;
      h = window.innerHeight;
    }
    return { w: w, h: h };
  }
  function isPhone(w, h) {
    var sw = 9999;
    if (window.screen) sw = Math.min(window.screen.width, window.screen.height);
    return sw < 700 || h > w * 1.15;
  }

  var W = 0, H = 0, DPR = 1, PHONE = false;
  var GEO = null;
  function resize() {
    var s = viewSize();
    W = Math.max(1, Math.round(s.w));
    H = Math.max(1, Math.round(s.h));
    DPR = window.devicePixelRatio || 1;
    PHONE = isPhone(W, H);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    buildScene();
  }

  // ---------- rings ----------
  // Periods are exact constants, seconds per revolution. Nothing quantizes
  // them to a common beat: phase_i(t) = phase0_i + 2*pi*(t - t0)/PERIOD_i.
  var RINGS = [
    { color: TEAL,   rFrac: 0.235, period: 9  },
    { color: RUST,   rFrac: 0.330, period: 10 },
    { color: VIOLET, rFrac: 0.425, period: 11 }
  ];
  function buildScene() {
    var minD = Math.min(W, H);
    var outFrac = PHONE ? 0.44 : 0.425;
    var gap = minD * 0.095;
    var rings = [];
    for (var i = 0; i < RINGS.length; i++) {
      var f = RINGS[i].rFrac + (outFrac - 0.425) * (i / (RINGS.length - 1));
      rings.push({ color: RINGS[i].color, R: minD * f, period: RINGS[i].period });
    }
    GEO = {
      cx: W / 2, cy: H / 2, minD: minD, gap: gap,
      rings: rings,
      baseW: Math.max(1, minD * 0.0035),
      coreW: Math.max(1.6, minD * 0.0105),
      midR: minD * 0.330
    };
  }

  // ---------- motif ----------
  // A motif is a short stroke phrase in ring space: a list of segments
  // {off, len, rad} - off/len are radians along the ring from the motif
  // origin, rad is a radial wobble in [-1, 1] (drawn at R + rad*gap*0.5).
  function defaultMotif() {
    var rng = mulberry32(821407);
    var segs = [], off = 0, rad = 0;
    for (var i = 0; i < 5; i++) {
      var len = 0.09 + rng() * 0.15;
      rad = clamp(rad + (rng() - 0.5) * 0.95, -0.85, 0.85);
      segs.push({ off: off, len: len, rad: rad });
      off += len + 0.03 + rng() * 0.07;
    }
    return segs;
  }

  // ---------- timeline: motif segments, closed-form ----------
  // Segment: {t0, motif|null, phase0:[p0,p1,p2]} with phase0 the ring
  // phases at t0. Initial phases carry fixed virtual elapsed times
  // (3.1 s, 5.7 s, 8.2 s of travel) so frame one is already mid-drift.
  var VIRTUAL = [3.1, 5.7, 8.2];
  var segments = [{
    t0: 0,
    motif: defaultMotif(),
    phase0: [
      Math.PI * 2 * VIRTUAL[0] / RINGS[0].period,
      Math.PI * 2 * VIRTUAL[1] / RINGS[1].period,
      Math.PI * 2 * VIRTUAL[2] / RINGS[2].period
    ]
  }];

  function segAt(t) {
    for (var i = segments.length - 1; i >= 0; i--) {
      if (segments[i].t0 <= t) return segments[i];
    }
    return segments[0];
  }
  // State (motif + ring phases) at any time t, evaluated from the closed
  // form of whichever segment contains t. Trails call this at past times,
  // so ghosts older than a motif change correctly show the previous motif.
  function stateAt(t) {
    var s = segAt(t);
    var ph = [];
    for (var i = 0; i < 3; i++) {
      ph[i] = s.phase0[i] + Math.PI * 2 * (t - s.t0) / RINGS[i].period;
    }
    return { motif: s.motif, phases: ph };
  }
  function pushSegment(t, motif) {
    var cur = stateAt(t);
    segments.push({ t0: t, motif: motif, phase0: cur.phases });
    if (segments.length > 24) segments.splice(1, segments.length - 24);
  }

  // ---------- drawing ----------
  var TRAIL_LIFE = 12;        // seconds of visible trail
  var TRAIL_STEP = 1.2;       // seconds between trail ghosts
  var TRAIL_N = 10;           // ghosts at ages 1.2 .. 12.0 s

  function strokeMotif(ring, motif, phase, alpha, width, bloom) {
    ctx.strokeStyle = ring.color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    for (var i = 0; i < motif.length; i++) {
      var s = motif[i];
      var r = ring.R + s.rad * GEO.gap * 0.5;
      var a0 = phase + s.off;
      var a1 = a0 + s.len * bloom;
      ctx.beginPath();
      ctx.arc(GEO.cx, GEO.cy, r, a0, a1);
      ctx.globalAlpha = alpha;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawRingState(ringIdx, t, headAlpha) {
    var ring = GEO.rings[ringIdx];
    // trail ghosts, oldest first
    for (var g = TRAIL_N; g >= 1; g--) {
      var age = g * TRAIL_STEP;
      var st = stateAt(t - age);
      if (!st.motif) continue;
      var fade = Math.pow(1 - age / TRAIL_LIFE, 2.4);
      var bloom = 1 + age * 0.02;    // copies bloom beyond their endpoints
      strokeMotif(ring, st.motif, st.phases[ringIdx], 0.45 * fade * headAlpha, GEO.coreW * 0.9, bloom);
    }
    // head: layered glow pass + core pass
    var now = stateAt(t);
    if (now.motif) {
      strokeMotif(ring, now.motif, now.phases[ringIdx], 0.20 * headAlpha, GEO.coreW * 2.7, 1);
      strokeMotif(ring, now.motif, now.phases[ringIdx], 0.96 * headAlpha, GEO.coreW, 1);
    }
  }

  function draw(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    // base rings, dim
    for (var i = 0; i < 3; i++) {
      var ring = GEO.rings[i];
      ctx.beginPath();
      ctx.arc(GEO.cx, GEO.cy, ring.R, 0, Math.PI * 2);
      ctx.globalAlpha = 0.38;
      ctx.strokeStyle = ring.color;
      ctx.lineWidth = GEO.baseW;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // motif trains + trails, inner to outer
    for (var k = 0; k < 3; k++) drawRingState(k, t, 1);

    // in-progress drawn stroke (the phrase being seeded)
    if (dragPts && dragPts.length > 1) {
      ctx.beginPath();
      ctx.moveTo(dragPts[0].x, dragPts[0].y);
      for (var j = 1; j < dragPts.length; j++) ctx.lineTo(dragPts[j].x, dragPts[j].y);
      ctx.globalAlpha = 0.85;
      ctx.strokeStyle = VIOLET;
      ctx.lineWidth = Math.max(2, GEO.minD * 0.006);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // ---------- interaction ----------
  function nowSec() { return performance.now() / 1000; }
  var startTime = nowSec();
  function pieceT() { return nowSec() - startTime; }
  function evPos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function wrapPi(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }

  var pDown = null;          // {t, x, y, moved}
  var dragPts = null;        // live polyline while dragging
  var lastTapUp = -10;

  canvas.addEventListener('pointerdown', function (e) {
    var p = evPos(e);
    pDown = { t: pieceT(), x: p.x, y: p.y, moved: false };
    dragPts = [p];
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!pDown) return;
    var p = evPos(e);
    var dx = p.x - pDown.x, dy = p.y - pDown.y;
    if (!pDown.moved && Math.sqrt(dx * dx + dy * dy) > 7) pDown.moved = true;
    if (pDown.moved) {
      var last = dragPts[dragPts.length - 1];
      if (Math.abs(p.x - last.x) + Math.abs(p.y - last.y) > 3) dragPts.push(p);
    }
  });

  // Convert a drawn polyline into a motif: resample to a handful of
  // segments in ring space (angle about the center, radius about the
  // middle ring), so the same phrase can ride all three radii.
  function motifFromStroke(pts) {
    if (!pts || pts.length < 2) return null;
    var total = 0, i;
    for (i = 1; i < pts.length; i++) {
      total += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    }
    if (total < 14) return null;
    // resample to up to 7 points, evenly by arc length
    var want = Math.min(7, pts.length);
    var sample = [pts[0]];
    var target = total / (want - 1), acc = 0;
    for (i = 1; i < pts.length && sample.length < want; i++) {
      acc += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      if (acc >= target || i === pts.length - 1) { sample.push(pts[i]); acc = 0; }
    }
    if (sample.length < 2) return null;
    var cx = GEO.cx, cy = GEO.cy;
    function ang(p) { return Math.atan2(p.y - cy, p.x - cx); }
    function rad(p) { return Math.hypot(p.x - cx, p.y - cy); }
    var mid0 = { x: (sample[0].x + sample[1].x) / 2, y: (sample[0].y + sample[1].y) / 2 };
    var a0 = ang(mid0);   // the first segment's midpoint anchors the phrase
    var segs = [];
    for (i = 0; i < sample.length - 1; i++) {
      var dA = wrapPi(ang(sample[i + 1]) - ang(sample[i]));
      var mid = { x: (sample[i].x + sample[i + 1].x) / 2, y: (sample[i].y + sample[i + 1].y) / 2 };
      var len = clamp(Math.abs(dA), 0.03, 0.5);
      var offMid = clamp(wrapPi(ang(mid) - a0), -1.45, 1.45);
      var rr = clamp((rad(mid) - GEO.midR) / GEO.gap, -1, 1);
      segs.push({ off: offMid - len / 2, len: len, rad: rr });
    }
    return segs.length ? segs : null;
  }

  function endPointer(e) {
    if (!pDown) return;
    var t = pieceT();
    if (pDown.moved) {
      var motif = motifFromStroke(dragPts);
      if (motif) pushSegment(t, motif);   // loops take up the new phrase and drift
    } else if (t - pDown.t < 0.3) {
      // a tap: a second tap inside 0.35 s clears to a fresh canvas
      if (t - lastTapUp < 0.35) {
        pushSegment(t, null);
        lastTapUp = -10;
      } else {
        lastTapUp = t;
      }
    }
    pDown = null;
    dragPts = null;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // ---------- run ----------
  resize();
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('resize', resize);

  draw(0); // frame one: synchronous, default motif mid-drift at its seeded phases

  if (typeof requestAnimationFrame === 'function') {
    var loop = function () {
      draw(pieceT());
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
