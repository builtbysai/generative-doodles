<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirror-Drawing</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #101E33; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // Seeded PRNG only. No Math.random anywhere in this piece.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var NIGHT = '#101E33';
  var CLOTH = '#182B47';
  var WEAVE = '#223B5C';
  var FACE = '#DCE4EC';
  var EDGE = '#8FA0B5';
  var LIGHT = '#F0D488';

  var W = 0, H = 0, phone = false;
  var field = { x: 0, y: 0, s: 0 };
  var shards = [];

  function size() {
    var vv = (typeof window !== 'undefined' && window.visualViewport) ? window.visualViewport : null;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    var sw = (typeof window !== 'undefined' && window.screen) ? window.screen.width : W;
    var sh = (typeof window !== 'undefined' && window.screen) ? window.screen.height : H;
    var minDim = Math.min(sw, sh);
    phone = minDim < 700 || H > W * 1.15;
    build();
  }

  // Geometry is rebuilt from a fixed seed on every resize, so the layout
  // is identical at every size and every load. Nothing here reads the clock.
  function build() {
    var rnd = mulberry32(1289);
    var s = Math.min(W, H) * (phone ? 0.98 : 0.92);
    field = { x: (W - s) / 2, y: (H - s) / 2, s: s };
    var cx = W / 2, cy = H / 2;
    var maxR = s * 0.42;
    shards = [];
    var count = 16;
    for (var i = 0; i < count; i++) {
      var frac = i / (count - 1);
      var ang = frac * Math.PI * 2 * 2.2 + (rnd() - 0.5) * 0.7;
      var rad = maxR * (0.10 + 0.72 * frac) + (rnd() - 0.5) * maxR * 0.08;
      var px = cx + Math.cos(ang) * rad;
      var py = cy + Math.sin(ang) * rad;
      var r = 6 + rnd() * 7;
      var nv = 5 + Math.floor(rnd() * 3);
      var verts = [];
      for (var k = 0; k < nv; k++) {
        var va = (k / nv) * Math.PI * 2 + (rnd() - 0.5) * 0.5;
        var vr = r * (0.7 + rnd() * 0.6);
        verts.push([Math.cos(va) * vr, Math.sin(va) * vr]);
      }
      shards.push({ x: px, y: py, r: r, verts: verts });
    }
    // Light parks at a fixed spot clear of every shard, so frame one
    // carries no glint. Glints only ever come from pointer motion.
    light.anchor = { x: cx, y: field.y + s * 0.08 };
    light.anchorT = 0;
    light.target = { x: cx, y: field.y + s * 0.08 };
    light.tau = 0.9;
    light.down = false;
    light.releaseT = -10;
    glints.length = 0;
  }

  // Light state: a closed-form easing between recorded anchors and
  // targets. No frame-integrated state anywhere.
  var light = {
    anchor: { x: 0, y: 0 }, anchorT: 0,
    target: { x: 0, y: 0 }, tau: 0.9,
    down: false, releaseT: -10, lastMoveT: -10, lastMove: { x: 0, y: 0 }, prevMove: { x: 0, y: 0 }
  };
  var glints = [];

  var T0 = 0, started = false;
  function now() {
    if (typeof performance !== 'undefined' && performance.now && started) {
      return (performance.now() - T0) / 1000;
    }
    return 0;
  }

  function lightAt(t) {
    if (t <= light.anchorT) return { x: light.anchor.x, y: light.anchor.y };
    var k = Math.exp(-(t - light.anchorT) / light.tau);
    return {
      x: light.target.x + (light.anchor.x - light.target.x) * k,
      y: light.target.y + (light.anchor.y - light.target.y) * k
    };
  }

  function onDown(e) {
    var t = now();
    var p = { x: e.clientX, y: e.clientY };
    var cur = lightAt(t);
    light.anchor = cur; light.anchorT = t;
    light.target = p; light.tau = 0.35;
    light.down = true;
    light.lastMove = p; light.prevMove = p; light.lastMoveT = t;
    if (e.preventDefault) e.preventDefault();
  }

  function onMove(e) {
    if (!light.down) return;
    var t = now();
    var p = { x: e.clientX, y: e.clientY };
    var cur = lightAt(t);
    light.anchor = cur; light.anchorT = t;
    light.target = p; light.tau = 0.35;
    light.prevMove = light.lastMove; light.lastMove = p; light.lastMoveT = t;
    if (e.preventDefault) e.preventDefault();
  }

  function onUp(e) {
    if (!light.down) return;
    var t = now();
    var dt = t - light.lastMoveT;
    var vx = 0, vy = 0;
    if (dt > 0.001) {
      vx = (light.lastMove.x - light.prevMove.x) / Math.max(dt, 0.05);
      vy = (light.lastMove.y - light.prevMove.y) / Math.max(dt, 0.05);
    }
    var cur = lightAt(t);
    var park = {
      x: Math.max(field.x + 10, Math.min(field.x + field.s - 10, light.lastMove.x + vx * 0.6)),
      y: Math.max(field.y + 10, Math.min(field.y + field.s - 10, light.lastMove.y + vy * 0.6))
    };
    light.anchor = cur; light.anchorT = t;
    light.target = park; light.tau = 0.9;
    light.down = false;
    light.releaseT = t;
    if (e.preventDefault) e.preventDefault();
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  function dot(x, y, r, style) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = style;
    ctx.fill();
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    ctx.fillStyle = NIGHT;
    ctx.fillRect(0, 0, W, H);

    // Flat deep cloth field, centered square, with a faint weave.
    ctx.fillStyle = CLOTH;
    ctx.fillRect(field.x, field.y, field.s, field.s);
    ctx.strokeStyle = WEAVE;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.10;
    ctx.beginPath();
    for (var gy = field.y + 16; gy < field.y + field.s; gy += 16) {
      ctx.moveTo(field.x, gy);
      ctx.lineTo(field.x + field.s, gy);
    }
    ctx.stroke();
    ctx.globalAlpha = 0.06;
    ctx.beginPath();
    for (var gx = field.x + 16; gx < field.x + field.s; gx += 16) {
      ctx.moveTo(gx, field.y);
      ctx.lineTo(gx, field.y + field.s);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    var lp = lightAt(t);

    // Glint detection: only while the light is being carried or still
    // settling after release. Never on its own.
    var settling = (!light.down) && (t - light.releaseT < 2.5);
    var moving = false;
    if (light.down || settling) {
      var lpBack = lightAt(Math.max(0, t - 0.05));
      var dx = lp.x - lpBack.x, dy = lp.y - lpBack.y;
      moving = Math.sqrt(dx * dx + dy * dy) > 1.5;
    }
    if (moving) {
      for (var i = 0; i < shards.length; i++) {
        var sh = shards[i];
        var ddx = lp.x - sh.x, ddy = lp.y - sh.y;
        var dist = Math.sqrt(ddx * ddx + ddy * ddy);
        if (dist < sh.r + 16) {
          var recent = false;
          for (var g = 0; g < glints.length; g++) {
            if (glints[g].shard === i && t - glints[g].t0 < 0.8) { recent = true; break; }
          }
          if (!recent) glints.push({ shard: i, t0: t });
        }
      }
    }

    // Mirror shards: flat faces, irregular polygons, never circles.
    for (var j = 0; j < shards.length; j++) {
      var s2 = shards[j];
      ctx.beginPath();
      ctx.moveTo(s2.x + s2.verts[0][0], s2.y + s2.verts[0][1]);
      for (var v = 1; v < s2.verts.length; v++) {
        ctx.lineTo(s2.x + s2.verts[v][0], s2.y + s2.verts[v][1]);
      }
      ctx.closePath();
      ctx.fillStyle = FACE;
      ctx.globalAlpha = 0.85;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = EDGE;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Glints: brief white flash on the shard plus an expanding ring.
    for (var k = 0; k < glints.length; k++) {
      var gl = glints[k];
      var age = t - gl.t0;
      if (age < 0 || age > 1.2) continue;
      var sh2 = shards[gl.shard];
      var fa = Math.exp(-age / 0.4);
      ctx.beginPath();
      ctx.moveTo(sh2.x + sh2.verts[0][0], sh2.y + sh2.verts[0][1]);
      for (var v2 = 1; v2 < sh2.verts.length; v2++) {
        ctx.lineTo(sh2.x + sh2.verts[v2][0], sh2.y + sh2.verts[v2][1]);
      }
      ctx.closePath();
      ctx.fillStyle = '#FFFFFF';
      ctx.globalAlpha = 0.9 * fa;
      ctx.fill();
      ctx.globalAlpha = 1;
      var rr = 6 + age * 60;
      ctx.beginPath();
      ctx.moveTo(sh2.x + rr, sh2.y);
      ctx.arc(sh2.x, sh2.y, rr, 0, Math.PI * 2);
      ctx.strokeStyle = '#FFFFFF';
      ctx.globalAlpha = 0.7 * Math.exp(-age / 0.5);
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // The light itself: a warm pinpoint with flat-alpha halo circles.
    dot(lp.x, lp.y, 26, 'rgba(240,212,136,0.05)');
    dot(lp.x, lp.y, 16, 'rgba(240,212,136,0.10)');
    dot(lp.x, lp.y, 8, 'rgba(240,212,136,0.25)');
    dot(lp.x, lp.y, 3, 'rgba(240,212,136,0.95)');
  }

  if (typeof window !== 'undefined') {
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', function () { size(); draw(0); });
    }
    window.addEventListener('resize', function () { size(); draw(0); });
  }

  size();
  draw(0);

  // The clock starts with the rAF loop. Frame one above is exactly t = 0.
  if (typeof requestAnimationFrame !== 'undefined') {
    function loop(ts) {
      if (!started) { T0 = ts; started = true; }
      draw((ts - T0) / 1000);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
