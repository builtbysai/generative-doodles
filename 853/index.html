<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>№853 Binocular Girl</title>
<style>
  html, body { margin: 0; padding: 0; background: #6fb7e8; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // №853 Binocular Girl, IA7 / PP1253, study #261 iso-attrill.
  // A bright park scene. A girl in a purple floral raincoat raises
  // binoculars; each time they rise, the view cuts to a tiny distant
  // detail (a bird, a kite, a paper plane), then returns. Palette:
  // saturated park green, floral purple and pink, sky blue. Figure
  // centered, park a soft bright surround; the zoomed detail fills
  // the frame edge to edge. Watch-only. The binoculars rise on a
  // loop; the distant detail changes each cycle. Two alternating
  // scenes with a circular iris wipe through the binocular lenses.
  // Joyful, no cynicism, no desaturation, no menace. Mechanism M7.
  var GROUND = '#6fb7e8'; // page ground, the frame-0 sky colour

  // Fixed-phase first frame: FIRST_T = 5 s. The cycle is 60 s with
  // three 20 s segments, one per detail: bird, kite, paper plane,
  // in fixed rotation. Inside a segment, phase s = t mod 20:
  // s in [0,7) wide park, binoculars down; [7,10) binoculars rise;
  // [9,11) iris opens through the lenses; [11,17) detail fills the
  // frame; [17,19) iris closes; [19,20) binoculars lower. At
  // FIRST_T = 5 the girl stands in the bright park, binoculars at
  // her chest, the first rise two seconds away.
  var FIRST_T = 5;
  var CYCLE = 60;
  var SEG = 20;
  var SEED = 853;

  // QA probe hooks: ?t=<seconds> sets the virtual clock at load.
  // ?seed=<seconds> is an alias for the same clock, so the
  // node-canvas render tool (which passes its probe value as
  // ?seed=) can verify that the frame changes over time.
  // Read at load only.
  var probeT = null;
  try {
    var qs = (typeof location !== 'undefined' && location.search) ? location.search : '';
    var mt = qs.match(/[?&]t=([0-9.]+)/);
    if (mt) { probeT = parseFloat(mt[1]); }
    if (probeT === null) {
      var ms = qs.match(/[?&]seed=([0-9.]+)/);
      if (ms) { probeT = parseFloat(ms[1]); }
    }
  } catch (e) {}

  // Seeded PRNG, mulberry32. Used once at load to build fixed tables.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var reduced = false;
  try {
    if (typeof window.matchMedia === 'function') {
      reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }
  } catch (e) { reduced = false; }

  var W = 0, H = 0, dpr = 1, isPhone = false;
  var stageX = 0, stageY = 0, stageW = 0, stageH = 0;
  var lastT = FIRST_T;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function smooth(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function a4(v) { return Math.round(v * 10000) / 10000; } // avoid scientific-notation alpha
  function rgb(c) {
    return 'rgb(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ')';
  }
  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a4(a) + ')';
  }

  // Palette: saturated park green, floral purple and pink, sky blue.
  var SKY_TOP = [111, 183, 232];
  var SKY_BOT = [198, 230, 246];
  var SUN = [255, 216, 110];
  var CLOUD = [255, 255, 255];
  var GRASS = [58, 168, 84];
  var GRASS_DARK = [38, 138, 66];
  var GRASS_LIGHT = [96, 198, 112];
  var TREE = [34, 130, 70];
  var TREE_LIGHT = [72, 178, 96];
  var TRUNK = [110, 82, 54];
  var PATH = [233, 215, 172];
  var COAT = [123, 79, 166];
  var COAT_DARK = [96, 58, 138];
  var COAT_LIGHT = [150, 106, 190];
  var PINK = [244, 130, 180];
  var PINK_DARK = [226, 92, 150];
  var SKIN = [244, 198, 158];
  var HAIR = [66, 42, 28];
  var BOOT = [70, 48, 90];
  var BINO = [42, 42, 56];
  var GLASS = [158, 204, 232];
  var INK = [38, 66, 44]; // caption ink, dark green
  var HINT_BG = [30, 70, 44];

  // Clouds: fixed authored positions, slow closed-form drift.
  var CLOUDS = [
    { x: 0.18, y: 0.10, w: 0.17, h: 0.020, a: 0.95 },
    { x: 0.72, y: 0.07, w: 0.14, h: 0.017, a: 0.90 },
    { x: 0.50, y: 0.16, w: 0.11, h: 0.014, a: 0.80 },
    { x: 0.88, y: 0.20, w: 0.10, h: 0.013, a: 0.75 }
  ];

  // Flowers scattered on the lawn: fixed seeded positions.
  var flowerRng = mulberry32(SEED * 7 + 3);
  var FLOWERS = [];
  var fi;
  for (fi = 0; fi < 46; fi++) {
    FLOWERS.push({
      x: flowerRng(), y: 0.66 + flowerRng() * 0.30,
      c: flowerRng() > 0.5 ? PINK : [255, 255, 255],
      s: 0.004 + flowerRng() * 0.005
    });
  }
  // Tiny distant birds in the wide sky: fixed seeded positions.
  var birdRng = mulberry32(SEED * 17 + 9);
  var SKYBIRDS = [];
  var bi;
  for (bi = 0; bi < 3; bi++) {
    SKYBIRDS.push({ x: 0.15 + birdRng() * 0.6, y: 0.12 + birdRng() * 0.14, s: 0.008 + birdRng() * 0.006 });
  }
  // Blossoms on the bird detail branch: fixed seeded positions.
  var blosRng = mulberry32(SEED * 23 + 4);
  var BLOSSOMS = [];
  var bl;
  for (bl = 0; bl < 14; bl++) {
    BLOSSOMS.push({ u: blosRng(), v: (blosRng() - 0.5) * 0.05, s: 0.012 + blosRng() * 0.014 });
  }

  var L = {};
  function layout() {
    L.U = Math.min(W, H);
  }
  function resize() {
    var vw = 0, vh = 0;
    try {
      if (typeof window.visualViewport !== 'undefined' && window.visualViewport) {
        vw = window.visualViewport.width; vh = window.visualViewport.height;
      }
    } catch (e) {}
    if (!vw || !vh) { vw = window.innerWidth; vh = window.innerHeight; }
    var sw = 0, sh = 0;
    try { sw = window.screen.width; sh = window.screen.height; } catch (e) { sw = vw; sh = vh; }
    isPhone = Math.min(sw, sh) < 700 || (vh > vw * 1.15);
    if (isPhone) {
      stageW = vw; stageH = vh; stageX = 0; stageY = 0;
    } else {
      var side = Math.min(vw * 0.8, vh * 0.92);
      stageW = side; stageH = side;
      stageX = (vw - stageW) / 2; stageY = (vh - stageH) / 2;
    }
    W = stageW; H = stageH;
    dpr = (typeof window.devicePixelRatio === 'number' && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1;
    canvas.width = Math.max(1, Math.round(stageW * dpr));
    canvas.height = Math.max(1, Math.round(stageH * dpr));
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    canvas.style.left = stageX + 'px';
    canvas.style.top = stageY + 'px';
    canvas.style.position = 'absolute';
  }

  function X(f) { return f * W; }
  function Y(f) { return f * H; }

  // ---- Cycle state -------------------------------------------------
  function segOf(t) {
    var c = ((t % CYCLE) + CYCLE) % CYCLE;
    return c / SEG; // 0..3, fractional segment
  }
  function detailAt(t) {
    return Math.floor(segOf(t)) % 3; // 0 bird, 1 kite, 2 paper plane
  }
  function phaseOf(t) {
    var c = ((t % CYCLE) + CYCLE) % CYCLE;
    return c % SEG; // 0..20 within the segment
  }
  // Binocular raise: 0 down at chest, 1 up at the eyes.
  function raiseOf(t) {
    var s = phaseOf(t);
    if (s < 7) { return 0; }
    if (s < 10) { return smooth((s - 7) / 3); }
    if (s < 19) { return 1; }
    return 1 - smooth((s - 19) / 1);
  }
  // Iris wipe amount: 0 closed (wide scene), 1 open (detail fills frame).
  function irisOf(t) {
    var s = phaseOf(t);
    if (s < 9) { return 0; }
    if (s < 11) { return smooth((s - 9) / 2); }
    if (s < 17) { return 1; }
    if (s < 19) { return 1 - smooth((s - 17) / 2); }
    return 0;
  }

  // ---- Wide park scene ---------------------------------------------
  var HORIZON = 0.62;

  function drawSky(t) {
    var g = ctx.createLinearGradient(0, 0, 0, Y(HORIZON));
    g.addColorStop(0, rgb(SKY_TOP));
    g.addColorStop(1, rgb(SKY_BOT));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, Y(HORIZON) + 1);

    // Sun, top right, soft glow.
    var sx = X(0.84), sy = Y(0.12), sr = 0.045 * L.U;
    var glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr * 4);
    glow.addColorStop(0, rgba(SUN, a4(0.55)));
    glow.addColorStop(1, rgba(SUN, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(sx - sr * 4, sy - sr * 4, sr * 8, sr * 8);
    ctx.fillStyle = rgb(SUN);
    ctx.beginPath();
    ctx.moveTo(sx + sr, sy);
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();

    // Clouds drift slowly, closed-form, 90 s period.
    var ci, c, cx;
    for (ci = 0; ci < CLOUDS.length; ci++) {
      c = CLOUDS[ci];
      cx = X(c.x + 0.008 * Math.sin(2 * Math.PI * t / 90 + ci * 1.9));
      ctx.fillStyle = rgba(CLOUD, a4(c.a));
      ctx.beginPath();
      ctx.moveTo(cx + c.w * W / 2, Y(c.y));
      ctx.ellipse(cx, Y(c.y), c.w * W / 2, c.h * H, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Tiny distant birds, wings beating slowly on a closed-form cycle.
    var b, bx, by, bs, flap;
    for (b = 0; b < SKYBIRDS.length; b++) {
      bx = X(SKYBIRDS[b].x); by = Y(SKYBIRDS[b].y); bs = SKYBIRDS[b].s * W;
      flap = 0.35 + 0.3 * Math.sin(2 * Math.PI * t / 1.6 + b * 2.1);
      ctx.strokeStyle = rgba([52, 52, 66], a4(0.75));
      ctx.lineWidth = Math.max(1, W * 0.002);
      ctx.beginPath();
      ctx.moveTo(bx - bs, by);
      ctx.quadraticCurveTo(bx - bs * 0.4, by - bs * flap, bx, by);
      ctx.quadraticCurveTo(bx + bs * 0.4, by - bs * flap, bx + bs, by);
      ctx.stroke();
    }
  }

  function drawTree(tx, ty, scale, t) {
    // tx, ty: trunk base in stage fractions; scale in units of U.
    var bx = X(tx), by = Y(ty);
    var sway = 0.004 * Math.sin(2 * Math.PI * t / 47 + tx * 20);
    ctx.fillStyle = rgb(TRUNK);
    ctx.fillRect(bx - 0.012 * L.U, by - 0.20 * L.U * scale, 0.024 * L.U, 0.20 * L.U * scale);
    var cy = by - 0.24 * L.U * scale;
    var cx = bx + sway * W;
    ctx.fillStyle = rgb(TREE);
    ctx.beginPath();
    ctx.moveTo(cx + 0.13 * L.U * scale, cy);
    ctx.arc(cx, cy, 0.13 * L.U * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 0.09 * L.U * scale + 0.10 * L.U * scale, cy - 0.05 * L.U * scale);
    ctx.arc(cx - 0.09 * L.U * scale, cy - 0.05 * L.U * scale, 0.10 * L.U * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + 0.09 * L.U * scale + 0.10 * L.U * scale, cy - 0.05 * L.U * scale);
    ctx.arc(cx + 0.09 * L.U * scale, cy - 0.05 * L.U * scale, 0.10 * L.U * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb(TREE_LIGHT);
    ctx.beginPath();
    ctx.moveTo(cx - 0.03 * L.U * scale + 0.07 * L.U * scale, cy - 0.08 * L.U * scale);
    ctx.arc(cx - 0.03 * L.U * scale, cy - 0.08 * L.U * scale, 0.07 * L.U * scale, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawGround(t) {
    // Saturated lawn with a lighter mow band and a winding path.
    ctx.fillStyle = rgb(GRASS);
    ctx.fillRect(0, Y(HORIZON), W, H - Y(HORIZON));
    ctx.fillStyle = rgba(GRASS_LIGHT, a4(0.35));
    ctx.fillRect(0, Y(HORIZON + 0.10), W, H * 0.07);
    // Path: pale, curving from the bottom edge toward the horizon.
    ctx.fillStyle = rgb(PATH);
    ctx.beginPath();
    ctx.moveTo(X(0.36), H);
    ctx.lineTo(X(0.52), H);
    ctx.lineTo(X(0.47), Y(0.66));
    ctx.lineTo(X(0.41), Y(0.66));
    ctx.closePath();
    ctx.fill();

    // Flowers: tiny pink and white blooms on the lawn.
    var i, f, fx, fy, fs;
    for (i = 0; i < FLOWERS.length; i++) {
      f = FLOWERS[i];
      fx = X(f.x); fy = Y(f.y); fs = f.s * W;
      ctx.fillStyle = rgb(f.c);
      ctx.beginPath();
      ctx.moveTo(fx + fs, fy);
      ctx.arc(fx, fy, fs, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = rgb([255, 214, 90]);
      ctx.beginPath();
      ctx.moveTo(fx + fs * 0.4, fy);
      ctx.arc(fx, fy, fs * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- The girl ----------------------------------------------------
  // Geometry in stage space. girlH is the full height; feetY the
  // ground point. All proportions derive from girlH so the figure
  // keeps its shape on a tall phone stage as well as square desktop.
  function girlGeom(raise) {
    var U = L.U;
    var girlH = 0.76 * U;
    var feetY = isPhone ? H * 0.70 : H * 0.82;
    var cx = W / 2;
    var headR = 0.115 * girlH;
    var headCy = feetY - girlH + headR * 1.05;
    var shoulderY = feetY - girlH * 0.70;
    var chestY = feetY - girlH * 0.50;
    var eyeY = headCy - headR * 0.08;
    var lensDX = 0.042 * girlH;
    var lensR = 0.030 * girlH;
    // Binocular centre travels from the chest to the eyes.
    var binX = cx;
    var binY = lerp(chestY, eyeY, raise);
    // Shoulders, elbows and hands interpolate with the raise.
    var shLx = cx - 0.155 * girlH, shRx = cx + 0.155 * girlH;
    var elLx = lerp(cx - 0.17 * girlH, cx - 0.19 * girlH, raise);
    var elRx = lerp(cx + 0.17 * girlH, cx + 0.19 * girlH, raise);
    var elLy = lerp(shoulderY + 0.20 * girlH, shoulderY - 0.04 * girlH, raise);
    var elRy = elLy;
    var haLx = lerp(cx - 0.06 * girlH, cx - lensDX, raise);
    var haRx = lerp(cx + 0.06 * girlH, cx + lensDX, raise);
    var haLy = lerp(chestY, eyeY, raise);
    var haRy = haLy;
    return {
      cx: cx, feetY: feetY, girlH: girlH, headR: headR, headCy: headCy,
      shoulderY: shoulderY, chestY: chestY, eyeY: eyeY,
      lensDX: lensDX, lensR: lensR, binX: binX, binY: binY,
      shLx: shLx, shRx: shRx, elLx: elLx, elRx: elRx, elLy: elLy, elRy: elRy,
      haLx: haLx, haRx: haRx, haLy: haLy, haRy: haRy
    };
  }

  function drawGirl(t) {
    var raise = raiseOf(t);
    var g = girlGeom(raise);
    var U = L.U;
    var gh = g.girlH;
    var cx = g.cx;

    // Legs and boots below the coat hem.
    var hemY = g.feetY - gh * 0.10;
    ctx.fillStyle = rgb([244, 198, 158]);
    ctx.fillRect(cx - 0.055 * gh, hemY, 0.035 * gh, g.feetY - hemY - 0.03 * gh);
    ctx.fillRect(cx + 0.02 * gh, hemY, 0.035 * gh, g.feetY - hemY - 0.03 * gh);
    ctx.fillStyle = rgb(BOOT);
    ctx.beginPath();
    ctx.moveTo(cx - 0.065 * gh, g.feetY);
    ctx.lineTo(cx - 0.065 * gh, g.feetY - 0.035 * gh);
    ctx.lineTo(cx + 0.005 * gh, g.feetY - 0.035 * gh);
    ctx.lineTo(cx + 0.005 * gh, g.feetY);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx + 0.015 * gh, g.feetY);
    ctx.lineTo(cx + 0.015 * gh, g.feetY - 0.035 * gh);
    ctx.lineTo(cx + 0.085 * gh, g.feetY - 0.035 * gh);
    ctx.lineTo(cx + 0.085 * gh, g.feetY);
    ctx.closePath();
    ctx.fill();

    // Raincoat: A-line, purple, flaring to the hem, with a collar.
    var shW = 0.155 * gh, hemW = 0.235 * gh;
    ctx.fillStyle = rgb(COAT);
    ctx.beginPath();
    ctx.moveTo(cx - shW, g.shoulderY);
    ctx.lineTo(cx + shW, g.shoulderY);
    ctx.lineTo(cx + hemW, hemY);
    ctx.lineTo(cx - hemW, hemY);
    ctx.closePath();
    ctx.fill();
    // Coat shade on the right side.
    ctx.fillStyle = rgba(COAT_DARK, a4(0.35));
    ctx.beginPath();
    ctx.moveTo(cx + 0.05 * gh, g.shoulderY);
    ctx.lineTo(cx + shW, g.shoulderY);
    ctx.lineTo(cx + hemW, hemY);
    ctx.lineTo(cx + 0.05 * gh, hemY);
    ctx.closePath();
    ctx.fill();
    // Collar.
    ctx.fillStyle = rgb(COAT_DARK);
    ctx.beginPath();
    ctx.moveTo(cx - 0.06 * gh, g.shoulderY);
    ctx.lineTo(cx + 0.06 * gh, g.shoulderY);
    ctx.lineTo(cx + 0.045 * gh, g.shoulderY - 0.035 * gh);
    ctx.lineTo(cx - 0.045 * gh, g.shoulderY - 0.035 * gh);
    ctx.closePath();
    ctx.fill();
    // Buttons down the front.
    ctx.fillStyle = rgb([255, 255, 255]);
    var by, bi2;
    for (bi2 = 0; bi2 < 3; bi2++) {
      by = g.shoulderY + 0.10 * gh + bi2 * 0.11 * gh;
      ctx.beginPath();
      ctx.moveTo(cx + 0.008 * gh, by);
      ctx.arc(cx, by, 0.008 * gh, 0, Math.PI * 2);
      ctx.fill();
    }
    // Floral print: small pink and white flowers scattered on the coat.
    var flRng = mulberry32(SEED * 31 + 2);
    var fl, fx, fy, fw, fcol;
    for (fl = 0; fl < 12; fl++) {
      var fv = flRng();
      fy = g.shoulderY + 0.06 * gh + fv * (hemY - g.shoulderY - 0.10 * gh);
      var half = lerp(shW, hemW, (fy - g.shoulderY) / (hemY - g.shoulderY));
      fx = cx + (flRng() * 2 - 1) * half * 0.78;
      fw = 0.010 * gh + flRng() * 0.008 * gh;
      fcol = flRng() > 0.45 ? PINK : [255, 255, 255];
      ctx.fillStyle = rgb(fcol);
      ctx.beginPath();
      ctx.moveTo(fx + fw, fy);
      ctx.arc(fx, fy, fw, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = rgb([255, 214, 90]);
      ctx.beginPath();
      ctx.moveTo(fx + fw * 0.4, fy);
      ctx.arc(fx, fy, fw * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }

    // Arms: coat-coloured sleeves from shoulder to elbow to hand.
    ctx.strokeStyle = rgb(COAT);
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(3, 0.045 * gh);
    ctx.beginPath();
    ctx.moveTo(g.shLx, g.shoulderY + 0.02 * gh);
    ctx.lineTo(g.elLx, g.elLy);
    ctx.lineTo(g.haLx, g.haLy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(g.shRx, g.shoulderY + 0.02 * gh);
    ctx.lineTo(g.elRx, g.elRy);
    ctx.lineTo(g.haRx, g.haRy);
    ctx.stroke();
    // Hands: small skin circles where the sleeves end.
    ctx.fillStyle = rgb(SKIN);
    ctx.beginPath();
    ctx.moveTo(g.haLx + 0.02 * gh, g.haLy);
    ctx.arc(g.haLx, g.haLy, 0.02 * gh, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(g.haRx + 0.02 * gh, g.haRy);
    ctx.arc(g.haRx, g.haRy, 0.02 * gh, 0, Math.PI * 2);
    ctx.fill();

    // Hair: dark bob behind the head, with side locks.
    ctx.fillStyle = rgb(HAIR);
    ctx.beginPath();
    ctx.moveTo(cx + g.headR * 1.15, g.headCy);
    ctx.arc(cx, g.headCy - g.headR * 0.1, g.headR * 1.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(cx - g.headR * 1.1, g.headCy - g.headR * 0.2, g.headR * 0.35, g.headR * 1.1);
    ctx.fillRect(cx + g.headR * 0.75, g.headCy - g.headR * 0.2, g.headR * 0.35, g.headR * 1.1);

    // Head.
    ctx.fillStyle = rgb(SKIN);
    ctx.beginPath();
    ctx.moveTo(cx + g.headR, g.headCy);
    ctx.arc(cx, g.headCy, g.headR, 0, Math.PI * 2);
    ctx.fill();
    // Hair fringe across the forehead.
    ctx.fillStyle = rgb(HAIR);
    ctx.beginPath();
    ctx.moveTo(cx - g.headR, g.headCy - g.headR * 0.15);
    ctx.quadraticCurveTo(cx, g.headCy - g.headR * 1.05, cx + g.headR, g.headCy - g.headR * 0.15);
    ctx.quadraticCurveTo(cx + g.headR * 0.5, g.headCy - g.headR * 0.45, cx, g.headCy - g.headR * 0.5);
    ctx.quadraticCurveTo(cx - g.headR * 0.5, g.headCy - g.headR * 0.45, cx - g.headR, g.headCy - g.headR * 0.15);
    ctx.closePath();
    ctx.fill();

    // Face: eyes and smile, hidden behind the binoculars when raised.
    if (raise < 0.6) {
      var fade = 1 - smooth((raise - 0.2) / 0.4);
      ctx.fillStyle = rgba([52, 40, 32], a4(0.9 * fade));
      ctx.beginPath();
      ctx.moveTo(cx - 0.38 * g.headR + 0.07 * g.headR, g.eyeY);
      ctx.arc(cx - 0.38 * g.headR, g.eyeY, 0.07 * g.headR, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx + 0.38 * g.headR + 0.07 * g.headR, g.eyeY);
      ctx.arc(cx + 0.38 * g.headR, g.eyeY, 0.07 * g.headR, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = rgba([150, 70, 60], a4(0.85 * fade));
      ctx.lineWidth = Math.max(1.5, 0.03 * g.headR);
      ctx.beginPath();
      ctx.moveTo(cx - 0.3 * g.headR, g.headCy + 0.42 * g.headR);
      ctx.quadraticCurveTo(cx, g.headCy + 0.62 * g.headR, cx + 0.3 * g.headR, g.headCy + 0.42 * g.headR);
      ctx.stroke();
      // Rosy cheeks.
      ctx.fillStyle = rgba(PINK, a4(0.55 * fade));
      ctx.beginPath();
      ctx.moveTo(cx - 0.62 * g.headR + 0.12 * g.headR, g.headCy + 0.25 * g.headR);
      ctx.arc(cx - 0.62 * g.headR, g.headCy + 0.25 * g.headR, 0.12 * g.headR, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx + 0.62 * g.headR + 0.12 * g.headR, g.headCy + 0.25 * g.headR);
      ctx.arc(cx + 0.62 * g.headR, g.headCy + 0.25 * g.headR, 0.12 * g.headR, 0, Math.PI * 2);
      ctx.fill();
    }

    // Binoculars: two dark barrels with pale glass, riding from the
    // chest to the eyes with the raise.
    var bScale = lerp(0.8, 1.15, raise);
    var bR = g.lensR * bScale;
    var bDX = g.lensDX * bScale;
    var lx1 = g.binX - bDX, lx2 = g.binX + bDX, ly = g.binY;
    ctx.fillStyle = rgb(BINO);
    ctx.beginPath();
    ctx.moveTo(lx1 + bR, ly);
    ctx.arc(lx1, ly, bR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(lx2 + bR, ly);
    ctx.arc(lx2, ly, bR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(lx1 - bR * 0.4, ly - bR, bR * 0.8 + bDX * 2, bR * 2);
    ctx.fillStyle = rgb(GLASS);
    ctx.beginPath();
    ctx.moveTo(lx1 + bR * 0.62, ly);
    ctx.arc(lx1, ly, bR * 0.62, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(lx2 + bR * 0.62, ly);
    ctx.arc(lx2, ly, bR * 0.62, 0, Math.PI * 2);
    ctx.fill();
    // Glass glints.
    ctx.fillStyle = rgba([255, 255, 255], a4(0.85));
    ctx.beginPath();
    ctx.moveTo(lx1 - bR * 0.25 + bR * 0.2, ly - bR * 0.25);
    ctx.arc(lx1 - bR * 0.25, ly - bR * 0.25, bR * 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(lx2 - bR * 0.25 + bR * 0.2, ly - bR * 0.25);
    ctx.arc(lx2 - bR * 0.25, ly - bR * 0.25, bR * 0.2, 0, Math.PI * 2);
    ctx.fill();
    // Neck strap when the binoculars rest at the chest.
    if (raise < 0.5) {
      ctx.strokeStyle = rgba(BINO, a4(0.8));
      ctx.lineWidth = Math.max(1.5, 0.015 * gh);
      ctx.beginPath();
      ctx.moveTo(cx - 0.10 * gh, g.shoulderY + 0.02 * gh);
      ctx.quadraticCurveTo(cx, g.chestY + 0.10 * gh, cx + 0.10 * gh, g.shoulderY + 0.02 * gh);
      ctx.stroke();
    }
  }

  function drawWide(t) {
    drawSky(t);
    drawTree(0.10, 0.66, 1.0, t);
    drawTree(0.90, 0.66, 0.9, t);
    drawTree(0.24, 0.64, 0.55, t);
    drawTree(0.76, 0.64, 0.5, t);
    drawGround(t);
    drawGirl(t);
  }

  // ---- Detail scenes (fill the frame edge to edge) -----------------
  function detailSky(top, bot) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(top));
    g.addColorStop(1, rgb(bot));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawBirdDetail() {
    detailSky([96, 176, 232], [206, 234, 248]);
    // A blossoming branch sweeps across the frame.
    var U = L.U;
    ctx.strokeStyle = rgb([96, 66, 44]);
    ctx.lineWidth = Math.max(3, 0.018 * U);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-0.02 * W, H * 0.82);
    ctx.quadraticCurveTo(W * 0.35, H * 0.62, W * 0.72, H * 0.58);
    ctx.quadraticCurveTo(W * 0.9, H * 0.56, W * 1.02, H * 0.50);
    ctx.stroke();
    ctx.lineWidth = Math.max(2, 0.010 * U);
    ctx.beginPath();
    ctx.moveTo(W * 0.30, H * 0.655);
    ctx.quadraticCurveTo(W * 0.36, H * 0.56, W * 0.42, H * 0.50);
    ctx.stroke();
    // Leaves along the branch.
    ctx.fillStyle = rgb(TREE_LIGHT);
    var li, lx, ly;
    for (li = 0; li < 8; li++) {
      lx = W * (0.08 + li * 0.11);
      ly = H * (0.80 - li * 0.035);
      ctx.beginPath();
      ctx.moveTo(lx + 0.03 * U, ly);
      ctx.ellipse(lx, ly, 0.03 * U, 0.012 * U, -0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    // Pink blossoms along the branch.
    var b, bx, by, bs;
    for (b = 0; b < BLOSSOMS.length; b++) {
      bx = W * BLOSSOMS[b].u;
      by = H * (0.80 - BLOSSOMS[b].u * 0.34) + BLOSSOMS[b].v * H;
      bs = BLOSSOMS[b].s * W;
      ctx.fillStyle = rgb(PINK);
      ctx.beginPath();
      ctx.moveTo(bx + bs, by);
      ctx.arc(bx, by, bs, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = rgb([255, 255, 255]);
      ctx.beginPath();
      ctx.moveTo(bx + bs * 0.4, by);
      ctx.arc(bx, by, bs * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
    // The bird, perched on the branch, large in frame.
    var px = W * 0.60, py = H * 0.545;
    var pr = 0.11 * U;
    // Tail.
    ctx.fillStyle = rgb([46, 92, 110]);
    ctx.beginPath();
    ctx.moveTo(px - pr * 0.7, py + pr * 0.2);
    ctx.lineTo(px - pr * 1.9, py + pr * 0.75);
    ctx.lineTo(px - pr * 1.6, py + pr * 0.95);
    ctx.lineTo(px - pr * 0.5, py + pr * 0.55);
    ctx.closePath();
    ctx.fill();
    // Body: warm coral breast, teal back.
    ctx.fillStyle = rgb([232, 110, 74]);
    ctx.beginPath();
    ctx.moveTo(px + pr, py);
    ctx.ellipse(px, py, pr, pr * 0.82, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb([46, 110, 128]);
    ctx.beginPath();
    ctx.moveTo(px + pr * 0.9, py - pr * 0.2);
    ctx.ellipse(px - pr * 0.15, py - pr * 0.28, pr * 0.85, pr * 0.6, -0.3, 0, Math.PI * 2);
    ctx.fill();
    // Wing.
    ctx.fillStyle = rgb([36, 84, 100]);
    ctx.beginPath();
    ctx.moveTo(px - pr * 0.1 + pr * 0.55, py + pr * 0.05);
    ctx.ellipse(px - pr * 0.1, py + pr * 0.05, pr * 0.55, pr * 0.32, -0.35, 0, Math.PI * 2);
    ctx.fill();
    // Head.
    ctx.fillStyle = rgb([46, 110, 128]);
    ctx.beginPath();
    ctx.moveTo(px + pr * 0.62 + pr * 0.42, py - pr * 0.72);
    ctx.arc(px + pr * 0.62, py - pr * 0.72, pr * 0.42, 0, Math.PI * 2);
    ctx.fill();
    // Beak.
    ctx.fillStyle = rgb([244, 178, 60]);
    ctx.beginPath();
    ctx.moveTo(px + pr * 0.95, py - pr * 0.78);
    ctx.lineTo(px + pr * 1.35, py - pr * 0.62);
    ctx.lineTo(px + pr * 0.95, py - pr * 0.55);
    ctx.closePath();
    ctx.fill();
    // Eye.
    ctx.fillStyle = rgb([30, 26, 24]);
    ctx.beginPath();
    ctx.moveTo(px + pr * 0.72 + pr * 0.07, py - pr * 0.78);
    ctx.arc(px + pr * 0.72, py - pr * 0.78, pr * 0.07, 0, Math.PI * 2);
    ctx.fill();
    // Legs gripping the branch.
    ctx.strokeStyle = rgb([96, 66, 44]);
    ctx.lineWidth = Math.max(1.5, 0.008 * U);
    ctx.beginPath();
    ctx.moveTo(px - pr * 0.15, py + pr * 0.78);
    ctx.lineTo(px - pr * 0.15, py + pr * 0.98);
    ctx.moveTo(px + pr * 0.25, py + pr * 0.78);
    ctx.lineTo(px + pr * 0.25, py + pr * 0.98);
    ctx.stroke();
  }

  function drawKiteDetail() {
    detailSky([110, 184, 234], [210, 236, 248]);
    // Two small clouds.
    ctx.fillStyle = rgba(CLOUD, a4(0.9));
    ctx.beginPath();
    ctx.moveTo(W * 0.16 + 0.07 * W, H * 0.16);
    ctx.ellipse(W * 0.16, H * 0.16, 0.07 * W, 0.016 * H, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(W * 0.84 + 0.05 * W, H * 0.10);
    ctx.ellipse(W * 0.84, H * 0.10, 0.05 * W, 0.013 * H, 0, 0, Math.PI * 2);
    ctx.fill();
    // The kite: a big pink diamond with purple cross bands.
    var U = L.U;
    var kx = W * 0.5, ky = H * 0.36;
    var kw = 0.30 * U, kh = 0.38 * U;
    ctx.fillStyle = rgb(PINK);
    ctx.beginPath();
    ctx.moveTo(kx, ky - kh / 2);
    ctx.lineTo(kx + kw / 2, ky);
    ctx.lineTo(kx, ky + kh / 2);
    ctx.lineTo(kx - kw / 2, ky);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgb(COAT);
    ctx.beginPath();
    ctx.moveTo(kx, ky - kh / 2);
    ctx.lineTo(kx + kw * 0.18, ky);
    ctx.lineTo(kx, ky + kh / 2);
    ctx.lineTo(kx - kw * 0.18, ky);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgb([255, 255, 255]);
    ctx.beginPath();
    ctx.moveTo(kx + 0.05 * U, ky);
    ctx.arc(kx, ky, 0.05 * U, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = rgb(PINK_DARK);
    ctx.beginPath();
    ctx.moveTo(kx + 0.025 * U, ky);
    ctx.arc(kx, ky, 0.025 * U, 0, Math.PI * 2);
    ctx.fill();
    // Kite frame lines.
    ctx.strokeStyle = rgba([120, 60, 110], a4(0.6));
    ctx.lineWidth = Math.max(1.5, 0.006 * U);
    ctx.beginPath();
    ctx.moveTo(kx, ky - kh / 2);
    ctx.lineTo(kx, ky + kh / 2);
    ctx.moveTo(kx - kw / 2, ky);
    ctx.lineTo(kx + kw / 2, ky);
    ctx.stroke();
    // Tail with bows, curving down from the kite.
    var tx = kx, ty = ky + kh / 2;
    ctx.strokeStyle = rgb(COAT_DARK);
    ctx.lineWidth = Math.max(2, 0.008 * U);
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx - 0.06 * U, ty + 0.16 * U, tx + 0.02 * U, ty + 0.30 * U);
    ctx.stroke();
    var bowY, bowX, bowS;
    var bowPts = [[-0.04, 0.10], [0.02, 0.20], [-0.02, 0.28]];
    var bwi;
    for (bwi = 0; bwi < bowPts.length; bwi++) {
      bowX = tx + bowPts[bwi][0] * U;
      bowY = ty + bowPts[bwi][1] * U;
      bowS = 0.028 * U;
      ctx.fillStyle = rgb(bwi % 2 ? [255, 214, 90] : PINK);
      ctx.beginPath();
      ctx.moveTo(bowX - bowS, bowY);
      ctx.lineTo(bowX, bowY - bowS * 0.5);
      ctx.lineTo(bowX + bowS, bowY);
      ctx.lineTo(bowX, bowY + bowS * 0.5);
      ctx.closePath();
      ctx.fill();
    }
    // String running off to the bottom right.
    ctx.strokeStyle = rgba([255, 255, 255], a4(0.85));
    ctx.lineWidth = Math.max(1.5, 0.005 * U);
    ctx.beginPath();
    ctx.moveTo(kx + kw * 0.1, ky + kh * 0.2);
    ctx.quadraticCurveTo(W * 0.72, H * 0.72, W * 0.98, H * 0.97);
    ctx.stroke();
    // Distant treetops along the bottom edge.
    ctx.fillStyle = rgb(TREE);
    var ti, txx;
    for (ti = 0; ti < 9; ti++) {
      txx = W * (ti * 0.12 + 0.02);
      ctx.beginPath();
      ctx.moveTo(txx + 0.06 * W, H);
      ctx.arc(txx, H * 0.965, 0.06 * W, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPlaneDetail() {
    detailSky([120, 188, 236], [214, 238, 250]);
    // Sun, top left.
    var U = L.U;
    var sx = W * 0.14, sy = H * 0.14, sr = 0.04 * U;
    ctx.fillStyle = rgb(SUN);
    ctx.beginPath();
    ctx.moveTo(sx + sr, sy);
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();
    // Clouds.
    ctx.fillStyle = rgba(CLOUD, a4(0.9));
    ctx.beginPath();
    ctx.moveTo(W * 0.62 + 0.08 * W, H * 0.14);
    ctx.ellipse(W * 0.62, H * 0.14, 0.08 * W, 0.018 * H, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(W * 0.30 + 0.06 * W, H * 0.30);
    ctx.ellipse(W * 0.30, H * 0.30, 0.06 * W, 0.014 * H, 0, 0, Math.PI * 2);
    ctx.fill();
    // Motion lines trailing the plane.
    ctx.strokeStyle = rgba([255, 255, 255], a4(0.7));
    ctx.lineWidth = Math.max(2, 0.006 * U);
    var ml;
    for (ml = 0; ml < 3; ml++) {
      var my = H * (0.38 + ml * 0.05);
      ctx.beginPath();
      ctx.moveTo(W * 0.08, my);
      ctx.lineTo(W * 0.26, my);
      ctx.stroke();
    }
    // The paper plane, nose right, large in frame.
    var px = W * 0.52, py = H * 0.44;
    var pw = 0.34 * U, ph = 0.20 * U;
    ctx.fillStyle = rgb([255, 255, 255]);
    ctx.beginPath();
    ctx.moveTo(px + pw / 2, py);
    ctx.lineTo(px - pw / 2, py - ph / 2);
    ctx.lineTo(px - pw * 0.18, py);
    ctx.lineTo(px - pw / 2, py + ph / 2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = rgb([214, 228, 240]);
    ctx.beginPath();
    ctx.moveTo(px + pw / 2, py);
    ctx.lineTo(px - pw * 0.18, py);
    ctx.lineTo(px - pw / 2, py + ph / 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = rgba([140, 160, 180], a4(0.7));
    ctx.lineWidth = Math.max(1.5, 0.005 * U);
    ctx.beginPath();
    ctx.moveTo(px + pw / 2, py);
    ctx.lineTo(px - pw * 0.18, py);
    ctx.stroke();
    // Distant rooftops and a tree along the bottom edge.
    var roofs = [
      [0.06, 0.10, [226, 120, 96]], [0.20, 0.13, [150, 170, 210]],
      [0.38, 0.09, [244, 190, 90]], [0.52, 0.12, [180, 130, 190]],
      [0.68, 0.10, [120, 190, 150]], [0.82, 0.13, [226, 120, 96]]
    ];
    var ri, rx, rw, rh;
    for (ri = 0; ri < roofs.length; ri++) {
      rx = W * roofs[ri][0]; rw = W * roofs[ri][1]; rh = H * 0.06;
      ctx.fillStyle = rgb(roofs[ri][2]);
      ctx.fillRect(rx, H - rh, rw, rh);
      ctx.fillStyle = rgb([120, 90, 70]);
      ctx.beginPath();
      ctx.moveTo(rx - 0.01 * W, H - rh);
      ctx.lineTo(rx + rw / 2, H - rh - 0.035 * H);
      ctx.lineTo(rx + rw + 0.01 * W, H - rh);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = rgb(TREE);
    ctx.beginPath();
    ctx.moveTo(W * 0.94 + 0.05 * W, H * 0.94);
    ctx.arc(W * 0.94, H * 0.94, 0.05 * W, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawDetail(d) {
    if (d === 0) { drawBirdDetail(); }
    else if (d === 1) { drawKiteDetail(); }
    else { drawPlaneDetail(); }
  }

  // ---- Caption and hint, in the template's place -------------------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
    ctx.lineTo(x + w, y + h - r);
    ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
    ctx.lineTo(x + r, y + h);
    ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
    ctx.lineTo(x, y + r);
    ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 1.5);
    ctx.closePath();
  }

  function drawCaption() {
    var fsCap = Math.round(clamp(W * 0.020, 11, 15));
    var fsDate = Math.round(clamp(W * 0.016, 9, 12));
    var fsHint = Math.round(clamp(W * 0.022, 12, 16));
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = rgba(INK, a4(0.85));
    ctx.font = '600 ' + fsCap + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('№853 · Binocular Girl', W * 0.04, H * 0.055);
    ctx.fillStyle = rgba(INK, a4(0.65));
    ctx.font = fsDate + 'px Georgia, "Times New Roman", serif';
    ctx.fillText('2004 · 05 · 13', W * 0.04, H * 0.055 + fsDate + 6);
    // Hint, bottom center, on a soft dark pill so it stays legible
    // over the park lawn and over every detail scene.
    var hint = 'Watch the binoculars rise.';
    ctx.textAlign = 'center';
    ctx.font = fsHint + 'px Georgia, "Times New Roman", serif';
    var hw = ctx.measureText(hint).width;
    var hx = W / 2 - hw / 2 - fsHint * 0.7;
    var hy = H - fsHint * 2.1;
    ctx.fillStyle = rgba(HINT_BG, a4(0.55));
    roundRect(hx, hy, hw + fsHint * 1.4, fsHint * 1.7, fsHint * 0.85);
    ctx.fill();
    ctx.fillStyle = rgba([250, 246, 238], a4(0.95));
    ctx.fillText(hint, W / 2, hy + fsHint * 1.2);
    ctx.textAlign = 'left';
  }

  // ---- Frame -------------------------------------------------------
  function draw(t) {
    lastT = t;
    // Pin the canvas element in draw(), per house rules.
    canvas.style.width = stageW + 'px';
    canvas.style.height = stageH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();

    // Ground is the frame-0 sky colour; the scene fills the stage.
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, 0, W, H);

    drawWide(t);

    // Iris wipe through the binocular lenses: two circles grow from
    // the lens positions and open onto the detail scene.
    var iris = irisOf(t);
    if (iris > 0) {
      var g = girlGeom(1); // lenses sit at the raised position
      var lx1 = g.binX - g.lensDX, lx2 = g.binX + g.lensDX, ly = g.binY;
      var lensR = g.lensR * 1.15;
      var maxR = Math.hypot(W, H);
      var r = lerp(lensR, maxR, iris);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(lx1 + r, ly);
      ctx.arc(lx1, ly, r, 0, Math.PI * 2);
      ctx.moveTo(lx2 + r, ly);
      ctx.arc(lx2, ly, r, 0, Math.PI * 2);
      ctx.clip();
      drawDetail(detailAt(t));
      ctx.restore();
      // Dark lens rims ride the wipe edge while it is mid-flight.
      if (iris > 0 && iris < 1) {
        ctx.strokeStyle = rgba(BINO, a4(0.9));
        ctx.lineWidth = Math.max(2, 0.012 * L.U);
        ctx.beginPath();
        ctx.moveTo(lx1 + r, ly);
        ctx.arc(lx1, ly, r, 0, Math.PI * 2);
        ctx.moveTo(lx2 + r, ly);
        ctx.arc(lx2, ly, r, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    drawCaption();
  }

  if (typeof window.addEventListener === 'function') {
    window.addEventListener('resize', function () { resize(); draw(lastT); });
  }
  try {
    if (typeof window.visualViewport !== 'undefined' && window.visualViewport &&
        typeof window.visualViewport.addEventListener === 'function') {
      window.visualViewport.addEventListener('resize', function () { resize(); draw(lastT); });
    }
  } catch (e) {}

  // QA hooks: window.__draw drives draw() with a virtual clock,
  // window.__piece853 exposes the cycle state.
  try {
    window.__draw = function (t) { draw(t); };
    window.__piece853 = {
      firstT: FIRST_T,
      cycle: CYCLE,
      detailAt: function (t) { return detailAt(t); },
      raiseAt: function (t) { return raiseOf(t); },
      irisAt: function (t) { return irisOf(t); },
      draw: function (t) { draw(t); }
    };
  } catch (e) {}

  resize();
  draw(probeT !== null ? probeT : FIRST_T); // one synchronous frame at load

  // Motion loop: a 60 s cycle, three details in fixed rotation,
  // closed-form throughout. Guarded so node-canvas QA works.
  if (!reduced && typeof requestAnimationFrame === 'function') {
    var start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    requestAnimationFrame(function loop(now) {
      var t = FIRST_T + (now - start) / 1000;
      lastT = t;
      draw(t);
      requestAnimationFrame(loop);
    });
  }
})();
</script>
</body>
</html>
