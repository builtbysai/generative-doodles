<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>№9045 · What Is Generative Art</title>
<style>
  html, body { margin: 0; padding: 0; background: #e8dcc4; }
  body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  #stage { position: relative; }
  canvas { display: block; }
  .cap { font-family: Georgia, 'Times New Roman', serif; font-style: italic;
         color: #4a4132; text-align: center; padding: 14px 20px 26px;
         font-size: 17px; max-width: 720px; }
  .cap b { font-style: normal; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div class="cap"><b>№9045 · What Is Generative Art</b>, the artist writes the rules, the machine rolls the dice, and a family comes out. This is one family. Click for another.</div>
<script>
'use strict';
// What Is Generative Art: a visual essay in print voice.
// One branching system, drawn many times: the rules (hand-written),
// the chance (seeded), the children (one system, many outcomes),
// the keeper (chosen, not drawn).

function mulberry32(a) {
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function parseSeed() {
  const m = /[?&]seed=(\d+)/.exec(location.search);
  if (m) return parseInt(m[1], 10) >>> 0;
  return 90210;
}
let seed = parseSeed();

// 1D value noise for hand wobble
function makeNoise(rand) {
  const p = new Float64Array(256);
  for (let i = 0; i < 256; i++) p[i] = rand();
  const at = (x) => {
    const xi = Math.floor(x), xf = x - xi;
    const a = p[xi & 255], b = p[(xi + 1) & 255];
    const u = xf * xf * (3 - 2 * xf);
    return a + (b - a) * u;
  };
  return at;
}

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const U = 1000; // viewport-invariant units

function fit() {
  const pad = 0;
  const availW = Math.min(window.innerWidth - pad, 900);
  const availH = window.innerHeight - 120;
  const s = Math.max(0.2, Math.min(availW / U, availH / U));
  cv.width = Math.round(U * s); cv.height = Math.round(U * s);
  cv.style.width = cv.width + 'px'; cv.style.height = cv.height + 'px';
}
window.addEventListener('resize', () => { fit(); draw(); });

const INK = [52, 44, 32];

function paper(noise) {
  const g = ctx.createLinearGradient(0, 0, U, U);
  g.addColorStop(0, '#f5ecda'); g.addColorStop(0.55, '#f1e6cf'); g.addColorStop(1, '#e7d8b8');
  ctx.fillStyle = g; ctx.fillRect(0, 0, U, U);
}
function grain(rand) {
  for (let i = 0; i < 5200; i++) {
    const x = rand() * U, y = rand() * U, r = 0.5 + rand() * 1.4;
    ctx.fillStyle = rand() < 0.82
      ? 'rgba(90,74,52,' + (0.03 + rand() * 0.08).toFixed(3) + ')'
      : 'rgba(255,252,240,' + (0.04 + rand() * 0.06).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
}
function vignette() {
  const g = ctx.createRadialGradient(U/2, U/2, U*0.32, U/2, U/2, U*0.75);
  g.addColorStop(0, 'rgba(120,95,60,0)');
  g.addColorStop(1, 'rgba(120,95,60,0.16)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, U, U);
}
function wobblyFrame(noise) {
  ctx.strokeStyle = 'rgba(70,62,50,0.6)'; ctx.lineWidth = 2.2;
  ctx.beginPath();
  const m = 64, S = 44, pts = [];
  const corners = [[m,m],[U-m,m],[U-m,U-m],[m,U-m]];
  for (let e = 0; e < 4; e++) {
    const [x0,y0] = corners[e], [x1,y1] = corners[(e+1)%4];
    for (let i = 0; i <= S; i++) {
      const t = i / S;
      const nx = x0 + (x1-x0)*t, ny = y0 + (y1-y0)*t;
      const off = (noise(e*97 + t*9 + 3) - 0.5) * 7;
      const dx = x1-x0, dy = y1-y0, L = Math.hypot(dx,dy) || 1;
      pts.push([nx + (-dy/L)*off, ny + (dx/L)*off]);
    }
  }
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (const [x,y] of pts) ctx.lineTo(x, y);
  ctx.closePath(); ctx.stroke();
}

// Recursive branching tree. The whole system: branch, shrink, turn, repeat.
function drawTree(rand, noise, x, y, angle, len, wid, depth, maxDepth, alpha) {
  if (depth > maxDepth || len < 2.5) return;
  const segs = 3;
  let px = x, py = y, pa = angle;
  const wob = () => (noise(px * 0.05 + py * 0.03 + depth * 13.7) - 0.5);
  for (let s = 0; s < segs; s++) {
    const sl = len / segs;
    pa += wob() * 0.18;
    // gentle phototropism: lean toward straight up
    pa += ((-Math.PI/2) - pa) * 0.05;
    const cx = px + Math.cos(pa) * sl * 0.5 + Math.cos(pa + Math.PI/2) * wob() * sl * 0.28;
    const cy = py + Math.sin(pa) * sl * 0.5 + Math.sin(pa + Math.PI/2) * wob() * sl * 0.28;
    const nx = px + Math.cos(pa) * sl, ny = py + Math.sin(pa) * sl;
    const wNow = wid * (1 - (s / segs) * 0.3);
    ctx.strokeStyle = 'rgba(' + INK[0] + ',' + INK[1] + ',' + INK[2] + ',' +
      (alpha * (0.82 + rand() * 0.18)).toFixed(3) + ')';
    ctx.lineWidth = Math.max(0.7, wNow);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(px, py);
    ctx.quadraticCurveTo(cx, cy, nx, ny); ctx.stroke();
    px = nx; py = ny;
  }
  const kids = rand() < 0.16 ? 3 : 2;
  for (let k = 0; k < kids; k++) {
    const spread = 0.26 + rand() * 0.22;
    const dir = kids === 2 ? (k === 0 ? -1 : 1) : (k - 1);
    const na = pa + dir * spread + (rand() - 0.5) * 0.24;
    const nl = len * (0.66 + rand() * 0.14);
    drawTree(rand, noise, px, py, na, nl, wid * 0.62, depth + 1, maxDepth, alpha);
  }
}

function annotation(text, x, y, align) {
  ctx.fillStyle = 'rgba(74,65,50,0.88)';
  ctx.font = 'italic 27px Georgia, serif';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(text, x, y);
}
function leader(x0, y0, x1, y1) {
  ctx.strokeStyle = 'rgba(74,65,50,0.45)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.fillStyle = 'rgba(74,65,50,0.55)';
  ctx.beginPath(); ctx.arc(x1, y1, 2.6, 0, 7); ctx.fill();
}

function draw() {
  const s = cv.width / U;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  const rand = mulberry32(seed);
  const noise = makeNoise(mulberry32(seed ^ 0x9e37));

  paper(noise);

  // ---- top strip: the rules and the chance ----
  // rules diagram: one Y, hand drawn
  const rx = 150, ry = 150;
  ctx.strokeStyle = 'rgba(52,44,32,0.9)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(rx, ry + 46);
  ctx.quadraticCurveTo(rx - 4, ry + 12, rx - 2, ry - 8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rx - 2, ry - 8);
  ctx.quadraticCurveTo(rx - 26, ry - 30, rx - 44, ry - 52); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rx - 2, ry - 8);
  ctx.quadraticCurveTo(rx + 20, ry - 26, rx + 34, ry - 56); ctx.stroke();
  annotation('the rules, written by hand', 92, 246);
  ctx.font = 'italic 22px Georgia, serif';
  ctx.fillStyle = 'rgba(74,65,50,0.62)'; ctx.textAlign = 'left';
  ctx.fillText('branch · shrink · turn · repeat', 92, 276);

  // chance: the seed in a wobbly hand circle
  const sx = 830, sy = 158;
  ctx.strokeStyle = 'rgba(52,44,32,0.75)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= 40; i++) {
    const a = (i / 40) * Math.PI * 2;
    const rr = 44 + (noise(i * 0.7 + 51) - 0.5) * 9;
    const px = sx + Math.cos(a) * rr, py = sy + Math.sin(a) * rr * 0.82;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle = 'rgba(52,44,32,0.9)';
  ctx.font = '28px Georgia, serif'; ctx.textAlign = 'center';
  ctx.fillText(String(seed % 100000), sx, sy + 10);
  annotation('the chance, rolled by the machine', 908, 246, 'right');
  ctx.font = 'italic 22px Georgia, serif';
  ctx.fillStyle = 'rgba(74,65,50,0.62)'; ctx.textAlign = 'right';
  ctx.fillText('a seed, like dice', 908, 276);

  // ---- the keeper: one large tree ----
  const hx0 = 92, hx1 = 600, hyBase = 880;
  drawTree(rand, noise, (hx0 + hx1) / 2 + 30, hyBase, -Math.PI / 2 + 0.06, 96, 13, 0, 9, 0.96);
  // ground tick
  ctx.strokeStyle = 'rgba(52,44,32,0.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(hx0 + 40, hyBase + 6);
  ctx.quadraticCurveTo(340, hyBase + 2, hx1 - 30, hyBase + 8); ctx.stroke();
  annotation('the keeper, chosen, not drawn', 92, 918);
  leader(330, 908, 300, 800);

  // ---- the children: six small trees, same system, other seeds ----
  const gx0 = 668, gx1 = 908, gy0 = 330, gy1 = 900;
  const cols = 2, rows = 3;
  const cw = (gx1 - gx0) / cols, ch = (gy1 - gy0) / rows;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const childSeed = (seed ^ Math.imul(r * 2 + c + 1, 0x85ebca6b)) >>> 0;
      const crand = mulberry32(childSeed);
      const cnoise = makeNoise(mulberry32(childSeed ^ 0x51f3));
      const bx = gx0 + c * cw + cw / 2, by = gy0 + r * ch + ch - 26;
      drawTree(crand, cnoise, bx, by, -Math.PI / 2 + (crand() - 0.5) * 0.2,
               32, 5.5, 0, 8, 0.9);
      ctx.strokeStyle = 'rgba(52,44,32,0.4)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(bx - 34, by + 4);
      ctx.quadraticCurveTo(bx, by + 1, bx + 34, by + 5); ctx.stroke();
    }
  }
  annotation('the children, one system', 908, 918, 'right');
  leader(820, 908, 800, 810);

  grain(mulberry32(seed ^ 0x77aa));
  vignette();
  wobblyFrame(noise);
}

fit();
draw();
document.addEventListener('click', () => {
  seed = (Math.random() * 1e9) >>> 0;
  history.replaceState(null, '', '?seed=' + seed);
  draw();
});
</script>
</body>
</html>
