<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slumber Weave</title>
<style>
  html, body { margin: 0; padding: 0; background: #0E1016; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// Slumber Weave (EXPANSION #87 janine-antoni, block 3)
// A sleeper drifts in the dark at left; its sleep signal is drawn as a
// glowing trace on a loom at right and woven, row by row, into a blanket.
// When the blanket is finished it slides over the sleeper and covers it.

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

var COL = {
  night: '#0E1016',
  eeg: '#7FD4C1',
  warp: '#2A2E3A',
  weft: '#8A93A8',
  glow: '#BFD8D2',
  shadow: '#05070A'
};

// Cycle layout, seconds. Loop is 90 s.
var CYCLE = 90;
var DREAM_END = 24;    // trace records across row 0
var WEAVE_END = 66;    // 40 rows woven, one shuttle pass each
var COVER_END = 78;    // blanket slides left over the sleeper
// 78..90: blanket rests, fades, sleeper returns; cycle reseeds.
var ROWS = 40;
var ROW_DUR = (WEAVE_END - DREAM_END) / ROWS;
var SIG_PER_ROW = 4;   // seconds of sleep signal baked into one row

// Geometry, 1000x1000 design space.
var LOOM_X0 = 380, LOOM_X1 = 962;
var BAND_Y0 = 150, BAND_Y1 = 850;
var ROW_H = (BAND_Y1 - BAND_Y0) / ROWS;
var WARP_N = 30;
var SLEEP_CX = 192, SLEEP_CY = 500;
var COVER_DX = -348;

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, isPhone = false;
var curT = 0;
var epoch = 0;
var epochStart = 0;

function smooth(a, b, x) {
  var t = (x - a) / (b - a);
  if (t < 0) t = 0; if (t > 1) t = 1;
  return t * t * (3 - 2 * t);
}
function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }

// ---------------------------------------------------------------------------
// Per-cycle parameters, a pure function of the cycle seed.
// The sleep signal is one seeded sum of sines. The sleeper's vertical wander
// and every woven row are samples of this same signal: row i is the segment
// recorded over [i*SIG_PER_ROW, (i+1)*SIG_PER_ROW].
// ---------------------------------------------------------------------------
function cycleParams(cyc) {
  var seed = 71403 + epoch * 131071 + cyc * 7919;
  var rng = mulberry32(seed);
  var comps = [];
  var baseF = [0.42, 0.83, 1.62, 3.05];
  var baseA = [1.0, 0.62, 0.36, 0.18];
  var norm = 0;
  for (var i = 0; i < 4; i++) {
    var a = baseA[i] * (0.8 + 0.4 * rng());
    comps.push({ f: baseF[i] * (0.82 + 0.36 * rng()), a: a, p: rng() * Math.PI * 2 });
    norm += a;
  }
  var specks = [];
  for (var j = 0; j < 46; j++) {
    specks.push({
      x: 52 + rng() * 288,
      y: 140 + rng() * 720,
      r: 1.0 + rng() * 1.3,
      al: 0.16 + rng() * 0.24
    });
  }
  return {
    comps: comps,
    norm: norm,
    driftP1: rng() * Math.PI * 2,
    driftP2: rng() * Math.PI * 2,
    specks: specks
  };
}

function sleepSignal(P, s) {
  var v = 0;
  for (var i = 0; i < P.comps.length; i++) {
    var c = P.comps[i];
    v += c.a * Math.sin(c.f * s + c.p);
  }
  return v / P.norm;
}

function sleeperPos(P, t) {
  var x = SLEEP_CX
    + 54 * Math.sin(0.113 * t + P.driftP1)
    + 24 * Math.sin(0.041 * t + P.driftP2);
  var y = SLEEP_CY + 148 * sleepSignal(P, t * 0.5 + 3.7);
  return { x: x, y: y };
}

// ---------------------------------------------------------------------------
// Drawing helpers (design coordinates).
// ---------------------------------------------------------------------------
var U = 1, OX = 0, OY = 0;
function px(x) { return OX + x * U; }
function py(y) { return OY + y * U; }

function strokeLine(pts, color, width, alpha) {
  if (pts.length < 2 || alpha <= 0.003) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(0.6, width * U);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(px(pts[0].x), py(pts[0].y));
  for (var i = 1; i < pts.length; i++) ctx.lineTo(px(pts[i].x), py(pts[i].y));
  ctx.stroke();
  ctx.restore();
}

function disc(x, y, r, color, alpha, squash) {
  if (alpha <= 0.003) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(px(x), py(y), Math.max(0.4, r * U), Math.max(0.4, r * U * (squash || 1)), 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// One woven row: the sleep-signal segment for row i drawn across the loom.
// frac limits how much of the row has been laid down (shuttle pass).
function rowPoints(P, i, frac) {
  var n = 64;
  var count = Math.max(2, Math.ceil(frac * n));
  var cy = BAND_Y0 + (i + 0.5) * ROW_H;
  var pts = [];
  for (var j = 0; j < count; j++) {
    var f = j / (n - 1);
    var s = (i + f) * SIG_PER_ROW;
    pts.push({
      x: LOOM_X0 + f * (LOOM_X1 - LOOM_X0),
      y: cy + sleepSignal(P, s) * ROW_H * 0.42
    });
  }
  return pts;
}

function drawRow(P, i, frac, eegAlpha, weftAlpha, dx) {
  if (frac <= 0) return;
  var pts = rowPoints(P, i, frac);
  var shifted = pts.map(function (p) { return { x: p.x + dx, y: p.y }; });
  if (weftAlpha > 0.003) strokeLine(shifted, COL.weft, 1.7, weftAlpha);
  if (eegAlpha > 0.003) {
    strokeLine(shifted, COL.eeg, 5.0, eegAlpha * 0.14);
    strokeLine(shifted, COL.eeg, 1.9, eegAlpha * 0.95);
  }
}

function drawSleeper(P, t, dim) {
  // Fading trail of recent positions, then the layered luminous form.
  var trail = [2.6, 1.7, 0.85];
  for (var k = trail.length - 1; k >= 0; k--) {
    var tp = sleeperPos(P, Math.max(0, t - trail[k]));
    disc(tp.x, tp.y, 34 - k * 6, COL.glow, 0.05 * dim, 0.82);
  }
  var pos = sleeperPos(P, t);
  var layers = [
    { r: 54, a: 0.050 },
    { r: 40, a: 0.080 },
    { r: 29, a: 0.130 },
    { r: 20, a: 0.210 },
    { r: 12, a: 0.360 }
  ];
  for (var i = 0; i < layers.length; i++) {
    disc(pos.x, pos.y, layers[i].r, COL.glow, layers[i].a * dim, 0.82);
  }
}

function draw(tAbs) {
  if (W === 0 || H === 0) return;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  var unit = Math.min(W, H);
  U = unit / 1000;
  OX = (W - unit) / 2;
  OY = (H - unit) / 2;

  ctx.fillStyle = COL.night;
  ctx.fillRect(0, 0, W, H);

  var ct = tAbs - epochStart;
  if (ct < 0) ct = 0;
  var cyc = Math.floor(ct / CYCLE);
  var t = ct - cyc * CYCLE;
  var P = cycleParams(cyc);

  var coverP = smooth(WEAVE_END, COVER_END, t);
  var fadeP = t > COVER_END ? smooth(COVER_END, CYCLE, t) : 0;
  var dx = COVER_DX * coverP;
  var blanketAlpha = 1 - fadeP;

  // Noise-space specks in the sleeper zone.
  for (var s = 0; s < P.specks.length; s++) {
    var sp = P.specks[s];
    disc(sp.x, sp.y, sp.r, COL.warp, sp.al, 1);
  }

  // Sleeper: dims as the cover shadow rises, returns as the blanket fades.
  var dim = 1 - 0.55 * coverP * (1 - fadeP);
  drawSleeper(P, ct, dim);

  // Cover shadow over the sleeper zone.
  var shAlpha = 0.62 * coverP * (1 - fadeP);
  if (shAlpha > 0.003) {
    ctx.save();
    ctx.globalAlpha = shAlpha;
    ctx.fillStyle = COL.shadow;
    ctx.fillRect(px(28), py(96), 348 * U, 808 * U);
    ctx.restore();
  }

  // Loom: warp threads and the two beams. The warp stays when the
  // finished blanket lifts away.
  var warpPts = [];
  for (var wi = 0; wi < WARP_N; wi++) {
    var wx = LOOM_X0 + (wi / (WARP_N - 1)) * (LOOM_X1 - LOOM_X0);
    warpPts.push({ x: wx, y: BAND_Y0 - 16 });
    warpPts.push({ x: wx, y: BAND_Y1 + 16 });
    strokeLine(warpPts, COL.warp, 1.1, 0.85);
    warpPts.length = 0;
  }
  strokeLine([{ x: LOOM_X0 - 14, y: BAND_Y0 - 20 }, { x: LOOM_X1 + 14, y: BAND_Y0 - 20 }], COL.warp, 3.2, 0.95);
  strokeLine([{ x: LOOM_X0 - 14, y: BAND_Y1 + 20 }, { x: LOOM_X1 + 14, y: BAND_Y1 + 20 }], COL.warp, 3.2, 0.95);

  // Rows.
  if (t < DREAM_END) {
    // Dream: the trace records across row 0, glowing, not yet woven.
    var prog = clamp01(t / DREAM_END);
    if (prog > 0.004) {
      drawRow(P, 0, prog, 1, 0, 0);
    } else {
      // Just beginning: the first point of the trace.
      var p0 = rowPoints(P, 0, 0.02);
      disc(p0[0].x, p0[0].y, 2.6, COL.eeg, 0.9, 1);
    }
  } else {
    for (var i = 0; i < ROWS; i++) {
      var local = (t - DREAM_END) / ROW_DUR - i;
      if (local <= 0) continue;
      if (i === 0) {
        // Row 0 was recorded in the dream; it settles into weft now.
        var settle0 = clamp01(local / 0.45);
        drawRow(P, 0, 1, (1 - settle0) * blanketAlpha, settle0 * 0.88 * blanketAlpha, dx);
      } else if (local < 0.55) {
        // Shuttle pass: the glowing trace lays this row down.
        drawRow(P, i, local / 0.55, blanketAlpha, 0, dx);
      } else if (local < 1) {
        var settle = clamp01((local - 0.55) / 0.45);
        drawRow(P, i, 1, (1 - settle) * blanketAlpha, settle * 0.88 * blanketAlpha, dx);
      } else {
        drawRow(P, i, 1, 0, 0.88 * blanketAlpha, dx);
      }
    }
  }
}

// ---------------------------------------------------------------------------
// Tap: reseed. A fresh sleeper path and a fresh blanket begin.
// ---------------------------------------------------------------------------
if (canvas.addEventListener) {
  canvas.addEventListener('pointerdown', function () {
    epoch++;
    epochStart = curT;
    draw(curT);
  });
}

// ---------------------------------------------------------------------------
// Sizing and main loop.
// ---------------------------------------------------------------------------
function resize() {
  var vw = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
  var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  W = Math.round(vw);
  H = Math.round(vh);
  canvas.width = W;
  canvas.height = H;
  var sw = (window.screen && window.screen.width) || 9999;
  var sh = (window.screen && window.screen.height) || 9999;
  isPhone = Math.min(sw, sh) < 700 || H > W * 1.15;
  draw(curT);
}

if (window.visualViewport && window.visualViewport.addEventListener) {
  window.visualViewport.addEventListener('resize', resize);
}
if (window.addEventListener) window.addEventListener('resize', resize);

// Frame one: synchronous draw at cycle t=0 (deterministic; never clock-derived).
resize();

var startStamp = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
if (typeof requestAnimationFrame === 'function') {
  var loop = function () {
    curT = (performance.now() - startStamp) / 1000;
    draw(curT);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
