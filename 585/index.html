<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worn Down Until It Speaks</title>
<style>
html, body { margin: 0; padding: 0; background: #b9c4c4; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var TAU = Math.PI * 2;
var FRAME_T = 60.0; /* fixed phase: t = 60 s, loop 7, degrade 0.52, mid-wear */
var LOOP_S = 8.0; /* one loop lasts eight seconds: the fragment */
var DEGRADE_LOOPS = 14; /* fourteen loops from clean to fully worn */
var TEXTURE_D = 0.92; /* degrade at which the render switches to texture mode */
var TEXTURE_FADE = 0.88; /* crossfade into texture mode starts here */
var WARM_GREY = '#8A8378'; /* the single warm grey everything drifts toward */
var SKY_TOP = '#B9C4C4'; /* flat muted pale blue grey */
var SKY_LOW = '#CFC8B8'; /* warm pale near the horizon */
var SUN = '#E8D9A8'; /* pale muted gold */
var SEA_TOP = '#7E9A94'; /* muted blue green */
var SEA_LOW = '#5E7A76';
var SAND = '#C9B99A'; /* muted warm sand */
var WET_SAND = '#A98F6E';
var HEADLAND = '#6E6A5E'; /* muted dark grey green */
var PEBBLE = '#5A564A';
var PLATE_FILL = '#3A3A34';
var PLATE_LINE = 'rgba(232,226,210,0.28)';
var PLATE_INK = '#E8E2D2';
var HINT_INK = '#E8E2D2';
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rgb(hex) {
  return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}
function rgba(hex, a) {
  var c = rgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
var GREY_RGB = rgb(WARM_GREY);
/* Degrade law: mix a color toward the single warm grey by d, posterize
   toward fewer steps, then stretch contrast around mid grey. All
   closed-form in d, so the frame is a pure function of loop and time. */
function degRgb(hex, d) {
  var c = rgb(hex);
  var steps = Math.round(48 - 42 * d); /* 48 steps clean, 6 steps fully worn */
  var contrast = 1 + 0.8 * d;
  var i, v;
  for (i = 0; i < 3; i++) {
    v = c[i] + (GREY_RGB[i] - c[i]) * d;
    v = Math.round(v / (255 / steps)) * (255 / steps);
    v = (v - 127.5) * contrast + 127.5;
    c[i] = Math.round(clamp(v, 0, 255));
  }
  return c;
}
function degRgba(hex, d, a) {
  var c = degRgb(hex, d);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
/* ---- reset schedule, seed 1801 + 73 ----
   Reset after 23, 25, 23, 24, 20, 24, 19, 17 loops, then the pattern
   repeats. Cumulative loop boundaries: 23, 48, 71, 95, 115, 139, 158,
   175, then +175 per repeat. First resets at t = 184, 384, 568, 760,
   920, 1112, 1264, 1400 s. A long, irregular schedule: the viewer
   cannot summon freshness and cannot predict the restart. */
var RESET_BASE = [23, 25, 23, 24, 20, 24, 19, 17];
var BOUND = [];
(function buildBounds() {
  var cum = 0, k;
  for (k = 0; k < 64; k++) {
    cum += RESET_BASE[k % RESET_BASE.length];
    BOUND.push(cum);
  }
})();
function cycleAt(t) {
  var total = Math.floor(t / LOOP_S);
  var frac = (t - total * LOOP_S) / LOOP_S;
  var start = 0, i;
  for (i = 0; i < BOUND.length; i++) {
    if (total >= BOUND[i]) start = BOUND[i]; else break;
  }
  var loop = total - start;
  /* wear grows half a loop-step inside each loop, so the wearing is
     visible loop by loop and slightly within a loop too */
  var d = Math.min(1, (loop + 0.5 * frac) / DEGRADE_LOOPS);
  return { total: total, loop: loop, frac: frac, d: d, cycleStart: start };
}
/* ---- fixed grain field, seed 1801 + 11 ----
   800 dots, fixed positions, per-dot phase. Alpha is a closed-form
   function of degrade and piece time, so frame one stays comparable. */
var GRAIN = [];
(function buildGrain() {
  var rng = mulberry32(1801 + 11);
  var i;
  for (i = 0; i < 800; i++) {
    GRAIN.push({
      x: rng(), y: rng(),
      s: 0.6 + rng() * 1.6,
      shade: 96 + Math.floor(rng() * 96),
      phase: rng() * TAU,
      ghost: rng() < 0.05 ? 1 : 0
    });
  }
})();
/* ---- fixed pebble table, seed 1801 + 29 ---- */
var PEBBLES = [];
(function buildPebbles() {
  var rng = mulberry32(1801 + 29);
  var i;
  for (i = 0; i < 12; i++) {
    PEBBLES.push({ x: 0.06 + rng() * 0.88, y: 0.78 + rng() * 0.18, r: 0.004 + rng() * 0.007 });
  }
})();
/* ---- fixed smear streak table, seed 1801 + 47 ---- */
var STREAKS = [];
(function buildStreaks() {
  var rng = mulberry32(1801 + 47);
  var i;
  for (i = 0; i < 24; i++) {
    STREAKS.push({ y: rng(), h: 2 + rng() * 4, phase: rng() * TAU });
  }
})();
/* ---- fixed color-ghost blobs, seed 1801 + 61 ---- */
var GHOSTS = [
  { hex: SEA_TOP, x: 0.30, y: 0.55, rx: 0.22, ry: 0.10, phase: 0.0 },
  { hex: SUN, x: 0.70, y: 0.17, rx: 0.10, ry: 0.10, phase: 2.1 },
  { hex: SAND, x: 0.55, y: 0.86, rx: 0.26, ry: 0.08, phase: 4.2 }
];
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var phaseT = FRAME_T;
var F = { x: 0, y: 0, w: 0, h: 0 }; /* field rect */
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
  if (isPhone) {
    F = { x: 0, y: 0, w: VW, h: VH };
  } else {
    var side = Math.min(VW, VH) - 40;
    F = { x: (VW - side) / 2, y: (VH - side) / 2, w: side, h: side };
  }
}
function horizonY() { return F.y + 0.40 * F.h; }
function waterlineY() { return F.y + 0.70 * F.h; }
function drawSun(t, d) {
  var cx = F.x + 0.70 * F.w;
  var cy = F.y + 0.17 * F.h;
  var r = 0.055 * F.w * (1 + 0.40 * d);
  var i;
  /* concentric rings: the disc softens and spreads as it wears */
  for (i = 2; i >= 0; i--) {
    var rr = r * (1 + i * 0.28 * d + i * 0.10);
    var al = (0.85 - 0.55 * d) * (i === 0 ? 1 : 0.30);
    if (al <= 0.01) continue;
    ctx.fillStyle = degRgba(SUN, d, al);
    ctx.beginPath();
    ctx.moveTo(cx + rr, cy);
    ctx.arc(cx, cy, rr, 0, TAU);
    ctx.fill();
  }
}
function drawHeadland(t, d) {
  var hy = horizonY();
  var smear = d * 7;
  var al = 0.9 * (1 - 0.55 * d);
  var pass;
  for (pass = -1; pass <= 1; pass++) {
    ctx.fillStyle = degRgba(HEADLAND, d, pass === 0 ? al : al * 0.30);
    ctx.beginPath();
    var ox = pass * smear;
    ctx.moveTo(F.x + ox, hy);
    ctx.lineTo(F.x + ox, hy - 0.045 * F.h);
    ctx.quadraticCurveTo(F.x + 0.16 * F.w + ox, hy - 0.075 * F.h, F.x + 0.36 * F.w + ox, hy);
    ctx.closePath();
    ctx.fill();
  }
}
function drawSwell(t, d) {
  var hy = horizonY();
  var wl = waterlineY();
  var i, x;
  for (i = 0; i < 3; i++) {
    var frac = 0.24 + i * 0.26;
    var baseY = hy + frac * (wl - hy);
    /* slow drift, seamless across the 8 s loop */
    var drift = Math.sin(TAU * t / LOOP_S + i * 2.1) * 0.006 * F.h;
    /* wear jitter: edges lose their line as d grows */
    var jit = d * 5 * Math.sin(TAU * t / LOOP_S * 0.5 + i * 3.7);
    var al = (0.42 - i * 0.09) * (1 - 0.7 * d);
    if (al <= 0.01) continue;
    ctx.strokeStyle = degRgba(SEA_TOP, d, al);
    ctx.lineWidth = 1 + d * 2;
    ctx.beginPath();
    for (x = F.x; x <= F.x + F.w; x += 10) {
      var y2 = baseY + drift + jit * Math.sin(TAU * (x - F.x) / (F.w * 0.31) + i * 1.9)
        + 0.003 * F.h * Math.sin(TAU * (x - F.x) / (F.w * 0.42) + TAU * t / LOOP_S);
      if (x === F.x) ctx.moveTo(x, y2); else ctx.lineTo(x, y2);
    }
    ctx.stroke();
  }
}
function drawPebbles(t, d) {
  var al = 0.75 * (1 - 0.8 * d);
  if (al <= 0.01) return;
  var i;
  for (i = 0; i < PEBBLES.length; i++) {
    var p = PEBBLES[i];
    var px = F.x + p.x * F.w + d * 4 * Math.sin(p.y * 40);
    var py = F.y + p.y * F.h;
    ctx.fillStyle = degRgba(PEBBLE, d, al);
    ctx.beginPath();
    ctx.moveTo(px + p.r * F.w, py);
    ctx.arc(px, py, p.r * F.w, 0, TAU);
    ctx.fill();
  }
}
function drawGrain(t, d, strength) {
  var i;
  for (i = 0; i < GRAIN.length; i++) {
    var g = GRAIN[i];
    var shimmer = 0.55 + 0.45 * Math.sin(TAU * t / 7 + g.phase);
    var al = strength * shimmer;
    if (al <= 0.004) continue;
    var shade = g.shade;
    ctx.fillStyle = 'rgba(' + shade + ',' + (shade - 4) + ',' + (shade - 10) + ',' + al.toFixed(4) + ')';
    ctx.fillRect(F.x + g.x * F.w, F.y + g.y * F.h, g.s, g.s);
  }
}
function drawStreaks(t, d) {
  if (d <= 0.15) return;
  var i;
  for (i = 0; i < STREAKS.length; i++) {
    var s = STREAKS[i];
    var al = (0.02 + 0.10 * d) * (0.6 + 0.4 * Math.sin(TAU * t / 11 + s.phase));
    ctx.fillStyle = degRgba(WARM_GREY, d, al);
    ctx.fillRect(F.x, F.y + s.y * F.h, F.w, s.h);
  }
}
function drawScene(t, d) {
  var hy = horizonY();
  var wl = waterlineY();
  /* sky: flat muted pale, warming toward grey as it wears */
  var g = ctx.createLinearGradient(0, F.y, 0, hy);
  g.addColorStop(0, degRgba(SKY_TOP, d, 1));
  g.addColorStop(1, degRgba(SKY_LOW, d, 1));
  ctx.fillStyle = g;
  ctx.fillRect(F.x, F.y, F.w, hy - F.y);
  /* sea: flat muted blue green */
  var w2 = ctx.createLinearGradient(0, hy, 0, wl);
  w2.addColorStop(0, degRgba(SEA_TOP, d, 1));
  w2.addColorStop(1, degRgba(SEA_LOW, d, 1));
  ctx.fillStyle = w2;
  ctx.fillRect(F.x, hy, F.w, wl - hy);
  /* wet sand band at the waterline */
  ctx.fillStyle = degRgba(WET_SAND, d, 1);
  ctx.fillRect(F.x, wl, F.w, 0.06 * F.h);
  /* sand */
  ctx.fillStyle = degRgba(SAND, d, 1);
  ctx.fillRect(F.x, wl + 0.06 * F.h, F.w, F.y + F.h - wl - 0.06 * F.h);
  drawSun(t, d);
  drawHeadland(t, d);
  drawSwell(t, d);
  /* waterline: the line itself thickens and fades as it wears */
  ctx.strokeStyle = degRgba(WET_SAND, d, 0.85 * (1 - 0.5 * d));
  ctx.lineWidth = 1 + d * 9;
  ctx.beginPath();
  var x;
  for (x = F.x; x <= F.x + F.w; x += 10) {
    var y2 = wl + 0.002 * F.h * Math.sin(TAU * (x - F.x) / (F.w * 0.37) + TAU * t / LOOP_S);
    if (x === F.x) ctx.moveTo(x, y2); else ctx.lineTo(x, y2);
  }
  ctx.stroke();
  drawPebbles(t, d);
  drawStreaks(t, d);
  /* grain accumulates on the scene as it wears */
  drawGrain(t, d, 0.04 + 0.42 * d * d);
}
function drawTexture(t, d) {
  /* the scene is nearly gone: a breathing monochrome texture of its
     own former shape, with faint color ghosts */
  var breathe = 0.5 + 0.5 * Math.sin(TAU * t / 24);
  ctx.fillStyle = WARM_GREY;
  ctx.fillRect(F.x, F.y, F.w, F.h);
  /* slow breathing wash, a shade lighter and darker by turns */
  ctx.fillStyle = 'rgba(150,144,127,' + (0.10 * breathe).toFixed(4) + ')';
  ctx.fillRect(F.x, F.y, F.w, F.h);
  /* residual shapes: horizon, sun ghost, shoreline, headland ghost */
  var hy = horizonY();
  var wl = waterlineY();
  ctx.strokeStyle = 'rgba(110,104,92,0.16)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(F.x, hy);
  ctx.lineTo(F.x + F.w, hy);
  ctx.stroke();
  ctx.fillStyle = 'rgba(178,170,152,0.12)';
  ctx.beginPath();
  ctx.moveTo(F.x + 0.70 * F.w + 0.05 * F.w, F.y + 0.17 * F.h);
  ctx.arc(F.x + 0.70 * F.w, F.y + 0.17 * F.h, 0.05 * F.w, 0, TAU);
  ctx.fill();
  ctx.strokeStyle = 'rgba(110,104,92,0.14)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  var x;
  for (x = F.x; x <= F.x + F.w; x += 10) {
    var y2 = wl + 0.004 * F.h * Math.sin(TAU * (x - F.x) / (F.w * 0.37) + TAU * t / 24);
    if (x === F.x) ctx.moveTo(x, y2); else ctx.lineTo(x, y2);
  }
  ctx.stroke();
  ctx.fillStyle = 'rgba(96,92,82,0.10)';
  ctx.beginPath();
  ctx.moveTo(F.x, hy);
  ctx.lineTo(F.x, hy - 0.045 * F.h);
  ctx.quadraticCurveTo(F.x + 0.16 * F.w, hy - 0.075 * F.h, F.x + 0.36 * F.w, hy);
  ctx.closePath();
  ctx.fill();
  /* faint color ghosts: the scene's old colors, barely there */
  var i;
  for (i = 0; i < GHOSTS.length; i++) {
    var gh = GHOSTS[i];
    var al = 0.05 + 0.04 * Math.sin(TAU * t / 31 + gh.phase);
    var drift = 0.01 * F.w * Math.sin(TAU * t / 47 + gh.phase);
    ctx.fillStyle = rgba(gh.hex, al);
    ctx.beginPath();
    ctx.moveTo(F.x + (gh.x * F.w + drift) + gh.rx * F.w, F.y + gh.y * F.h);
    ctx.ellipse(F.x + gh.x * F.w + drift, F.y + gh.y * F.h, gh.rx * F.w, gh.ry * F.h, 0, 0, TAU);
    ctx.fill();
  }
  /* dense grain field: the texture itself */
  drawGrain(t, d, 0.16 + 0.30 * breathe);
}
function drawField(t) {
  var cyc = cycleAt(t);
  var d = cyc.d;
  ctx.save();
  ctx.beginPath();
  ctx.rect(F.x, F.y, F.w, F.h);
  ctx.clip();
  drawScene(t, d);
  if (d >= TEXTURE_FADE) {
    var f = clamp((d - TEXTURE_FADE) / (TEXTURE_D - TEXTURE_FADE), 0, 1);
    ctx.save();
    ctx.globalAlpha = f;
    drawTexture(t, d);
    ctx.restore();
  }
  ctx.restore();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Worn Down Until It Speaks').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Worn Down Until It Speaks').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2006 · 12 · 17').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = PLATE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Worn Down Until It Speaks', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2006 · 12 · 17', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE_FILL;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
}
function draw() {
  size();
  ctx.fillStyle = SKY_TOP;
  ctx.fillRect(0, 0, VW, VH);
  drawField(phaseT);
  drawPlates();
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    phaseT: function () { return phaseT; },
    cycleAt: function (t) { return cycleAt(t); }
  };
}
/* ---- frame one: fixed phase t = 60 s ----
   Loop 7 of the first cycle (loops run 0 to 22 before the first reset
   at t = 184 s), intra-loop fraction 0.5, degrade d = 0.52: the
   shoreline is visibly worn, colors halfway toward warm grey, grain
   and smear present, but the scene is still legible. No wall clock
   is read for frame one. Input does nothing by design: no pointer or
   keyboard handlers are registered, so nothing the viewer does
   shortens or changes anything. */
size();
phaseT = FRAME_T;
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  /* True time: phase is computed from a wall-clock start captured after
     the fixed first frame, so dropped frames never lose time. */
  var startMs = Date.now();
  (function loop() {
    function step() {
      phaseT = FRAME_T + (Date.now() - startMs) / 1000;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
