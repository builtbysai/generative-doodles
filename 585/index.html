<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sin Viñetas</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#FAF7F0; overflow:hidden; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

var INK = '#1A1A1A', PAPER = '#FAF7F0', RED = '#D42B1E', WASH = '#E8B4B0';

/* ---------- seeded RNG (mulberry32) ---------- */
function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rng = mulberry32(585071);

/* ---------- geometry helpers (points are jittered ONCE at build, then fixed) ---------- */
function J(pts, amt){ var out=[],i; for(i=0;i<pts.length;i++) out.push([pts[i][0]+(rng()*2-1)*amt, pts[i][1]+(rng()*2-1)*amt]); return out; }
function seg(x1,y1,x2,y2){ var p=[],n=Math.max(2,Math.round(Math.hypot(x2-x1,y2-y1)/13)),i; for(i=0;i<=n;i++) p.push([x1+(x2-x1)*i/n, y1+(y2-y1)*i/n]); return p; }
function circP(cx,cy,r,n){ var p=[],i,a; n=n||26; for(i=0;i<n;i++){ a=i/n*Math.PI*2; p.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } return p; }
function ellP(cx,cy,rx,ry,n){ var p=[],i,a; n=n||30; for(i=0;i<n;i++){ a=i/n*Math.PI*2; p.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]); } return p; }
function arcP(cx,cy,r,a0,a1,n){ var p=[],i,a; n=n||12; for(i=0;i<=n;i++){ a=a0+(a1-a0)*i/n; p.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); } return p; }
function bez(p0,p1,p2,p3,n){ var p=[],i,t,u; n=n||18; for(i=0;i<=n;i++){ t=i/n; u=1-t; p.push([u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0], u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]); } return p; }
function rrP(x,y,w,h,r){ var p=[],i,a,c; var cs=[[x+w-r,y+r,-Math.PI/2,0],[x+w-r,y+h-r,0,Math.PI/2],[x+r,y+h-r,Math.PI/2,Math.PI],[x+r,y+r,Math.PI,Math.PI*1.5]]; for(c=0;c<4;c++){ for(i=0;i<=5;i++){ a=cs[c][2]+(cs[c][3]-cs[c][2])*i/5; p.push([cs[c][0]+Math.cos(a)*r, cs[c][1]+Math.sin(a)*r]); } } return p; }
function dropP(cx,cy,s){ return bez([cx,cy-9*s],[cx+5.5*s,cy+1*s],[cx+4*s,cy+6*s],[cx,cy+7*s],8).concat(bez([cx,cy+7*s],[cx-4*s,cy+6*s],[cx-5.5*s,cy+1*s],[cx,cy-9*s],8)); }

function pathOf(pts, close){ ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]); if (close) ctx.closePath(); }
function stroke(pts, w, color, close){ pathOf(pts, close); ctx.strokeStyle = color || INK; ctx.lineWidth = w || 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
function fillPts(pts, color, alpha){ pathOf(pts, true); ctx.save(); if (alpha !== undefined) ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.fill(); ctx.restore(); }

/* ---------- paper speckle (seeded, drawn directly, bleeds past the stage) ---------- */
var speckles = [];
for (var si = 0; si < 420; si++) speckles.push({ x: -700 + rng()*2400, y: -700 + rng()*2400, r: 0.8 + rng()*1.5, a: 0.03 + rng()*0.05 });

/* ---------- the pink wash: precomputed blobs, thick at the mother, thin elsewhere ---------- */
var blobs = [
  { x:350, y:480, rx:195, ry:155, a:0.34 }, { x:298, y:418, rx:122, ry:96, a:0.30 },
  { x:424, y:542, rx:132, ry:102, a:0.28 }, { x:258, y:472, rx:92,  ry:80, a:0.26 },
  { x:382, y:358, rx:112, ry:70,  a:0.22 }, { x:742, y:792, rx:132, ry:82, a:0.14 },
  { x:520, y:792, rx:112, ry:52,  a:0.14 }, { x:776, y:292, rx:82,  ry:70, a:0.12 },
  { x:622, y:432, rx:122, ry:92,  a:0.08 }, { x:150, y:622, rx:102, ry:82, a:0.08 }
];
for (var bi = 0; bi < blobs.length; bi++){ blobs[bi].pts = J(ellP(blobs[bi].x, blobs[bi].y, blobs[bi].rx, blobs[bi].ry, 34), 7); blobs[bi].sw = 0; }

/* ---------- static ink strokes, built once (the composed chaos) ---------- */
var S = {};
/* rug the mother stands on: one thin ellipse, no floor, no boxes */
S.rug = J(ellP(372, 646, 158, 27), 1.6);
/* laundry line: a sagging curve, drawn, never straight */
S.line = J(bez([58,226],[300,272],[520,262],[706,206], 42), 1.4);
/* mother: dress, legs, reaching arm, cradle arm */
S.dress = J([[336,398],[330,470],[312,606],[430,606],[404,470],[400,398]], 1.8);
S.hem   = J(seg(320,584, 424,584), 1.5);
S.neck  = J(arcP(368,404,33,Math.PI*1.08,Math.PI*1.92,10), 1.2);
S.legL  = J(seg(338,606, 334,652), 1.4); S.legR = J(seg(404,606, 410,652), 1.4);
S.shoeL = J(ellP(328,657,15,6), 1.2);    S.shoeR = J(ellP(416,657,15,6), 1.2);
S.head  = J(circP(364,350,33), 1.5);
S.bun   = J(circP(337,323,12.5), 1.3);
S.hair  = J(arcP(364,348,34,Math.PI*1.02,Math.PI*1.98,12), 1.4);
S.eye   = J(seg(351,353, 366,355), 1);
S.brow  = J(seg(349,341, 367,344), 1);
S.mouth = J(seg(356,373, 369,370), 1);
S.sweat1 = J(dropP(406,336,0.9), 1); S.sweat2 = J(dropP(316,330,0.7), 1);
S.armReach = J(bez([400,406],[428,428],[446,448],[458,472],14), 1.6);
S.hand = J(circP(460,476,7), 1);
S.armCradle = J(bez([340,410],[300,458],[316,506],[364,498],14), 1.6);
/* phone table */
S.tblTop = J(seg(708,332, 838,330), 1.5); S.tblL = J(seg(722,331, 716,394), 1.4); S.tblR = J(seg(826,331, 832,394), 1.4);
/* kettle stand */
S.standTop = J(seg(756,618, 884,618), 1.5); S.standL = J(seg(770,618, 764,650), 1.3); S.standR = J(seg(872,618, 878,650), 1.3);
/* suitcase: base + clothes spilling */
S.caseBase = J([[620,792],[880,792],[868,842],[632,842]], 1.7);
S.caseLid  = J([[0,0],[0,-98],[104,-98],[104,0]], 1.7);
S.shoeOut  = J([[896,842],[928,842],[930,824],[906,818]], 1.5);
S.babyBody = J(ellP(0,0,64,36), 1.2);
S.caseIn   = J(seg(636,806, 864,806), 1.3);
S.cloth1   = J(bez([676,792],[692,824],[716,830],[730,796],12), 1.4);
S.cloth2   = J(bez([742,794],[762,818],[786,820],[796,792],12), 1.4);
S.roll     = J(circP(826,782,17), 1.3); S.rollIn = J(circP(826,782,8), 1);
/* coffee: tipped cup on a small stool + cup lip */
S.cup = J([[428,724],[470,706],[482,744],[442,758]], 1.6);
S.cupLip = J(seg(428,724, 442,758), 1.2);
S.stoolTop = J(seg(422,760, 494,758), 1.5); S.stoolL = J(seg(434,759, 430,794), 1.3); S.stoolR = J(seg(482,758, 486,794), 1.3);
/* toys */
S.ball = J(circP(140,840,30), 1.5); S.ballStripe = J(arcP(140,840,30,-0.5,1.1,10), 1.2);
S.block1 = J([[188,824],[234,818],[238,862],[192,868]], 1.5); S.block1in = J([[202,832],[222,830],[224,850],[204,852]], 1.1);
S.block2 = J([[240,852],[274,850],[276,882],[242,884]], 1.4);
S.bearHead = J(circP(310,824,17), 1.3); S.bearEarL = J(circP(296,810,6), 1); S.bearEarR = J(circP(324,810,6), 1);
S.bearBody = J(ellP(310,856,24,17), 1.3);
S.rattle = J(circP(168,782,13), 1.3); S.rattleStick = J(seg(176,792, 192,812), 1.4);
S.pacifier = J(ellP(566,884,20,11), 1.3); S.pacRing = J(circP(566,868,8), 1.1);

/* laundry items, each hung from a pin on the line (drawn relative to the pin) */
var laundry = [
  { px:150, py:241, kind:'shirt' }, { px:292, py:253, kind:'onesie' },
  { px:428, py:251, kind:'towel' }, { px:556, py:235, kind:'sock' },
  { px:646, py:221, kind:'cloth' }
];
function laundryPts(kind){
  if (kind === 'shirt')  return [[-8,2],[-31,11],[-23,27],[-12,21],[-12,59],[12,59],[12,21],[23,27],[31,11],[8,2]];
  if (kind === 'onesie') return [[-17,3],[-19,34],[-9,48],[0,38],[9,48],[19,34],[17,3]];
  if (kind === 'towel')  return [[-24,3],[24,3],[24,64],[-24,64]];
  if (kind === 'sock')   return [[-7,2],[7,2],[7,34],[15,44],[11,55],[-6,53],[-7,38]];
  return [[-19,3],[19,3],[19,38],[-19,38]];
}
for (var li = 0; li < laundry.length; li++){ var L = laundry[li]; L.pts = J(laundryPts(L.kind), 1.2); L.phase = li * 1.3; }

/* kettle outline (drawn around its own origin, steam is live) */
var kettle = {
  body: J(ellP(0,18,55,42), 1.6),
  spout: J([[-46,4],[-79,-19],[-71,-28],[-34,-13]], 1.5),
  handle: J(arcP(0,-8,36,Math.PI*1.12,Math.PI*1.88,12), 1.5),
  knob: J(circP(0,-24,5), 1)
};

/* phone body (red, the first of only three red things) */
var phoneBody = J(rrP(-27,-45,54,90,9), 1.2);
var phoneScr  = J(rrP(-19,-33,38,58,5), 1);

/* coffee spill (red, the second) — an irregular flat puddle */
var spill = J([[424,788],[452,776],[492,784],[528,774],[566,782],[592,792],[570,806],[524,810],[478,808],[440,802]], 2.5);

/* title underline (red, part of the third red thing: the title) */
var titleLine = J(seg(296,130, 704,126), 2);

/* ---------- thought bubbles (tap a figure) ---------- */
var bubbles = {
  mother: { x:524, y:294, rx:88, ry:50, text:'M...', size:40, tx:398, ty:338 },
  baby:   { x:148, y:398, rx:63, ry:39, text:'¡ay!', size:33, tx:236, ty:446 }
};
function cloudPts(b, sc){
  var p = [], i, a, r;
  for (i = 0; i < 36; i++){ a = i/36*Math.PI*2; r = 1 + Math.sin(a*9 + 1.7)*0.055; p.push([b.x + Math.cos(a)*b.rx*r*sc, b.y + Math.sin(a)*b.ry*r*sc]); }
  return p;
}
var bubbleState = null; /* { who, t0 } */

/* ---------- state ---------- */
var PHASE0 = 1.3;                 /* fixed phase: frame one never comes from a clock */
var curT = PHASE0;
var pdown = null, lastPtr = null;

/* ---------- sizing ---------- */
var viewW = 300, viewH = 300, dpr = 1;
var scr = (typeof window !== 'undefined' && window.screen) ? window.screen : { width:300, height:300 };
var isPhone = Math.min(scr.width, scr.height) < 700;
if (!isPhone && viewH > viewW * 1.15 && Math.min(viewW, viewH) < 700) isPhone = true;

function handFont(size, weight){ return 'italic ' + (weight || 600) + ' ' + size + 'px "Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",cursive,sans-serif'; }
function hash1(n){ var x = Math.sin(n*127.1 + 311.7)*43758.5453; return x - Math.floor(x); }

function stageXform(){
  var s = Math.min(viewW/1000, viewH/1000);
  return { s:s, ox:(viewW - 1000*s)/2, oy:(viewH - 1000*s)/2 };
}

function draw(){
  canvas.style.width = viewW + 'px'; canvas.style.height = viewH + 'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, canvas.width, canvas.height);
  var xf = stageXform(), s = xf.s;
  ctx.setTransform(dpr*s, 0, 0, dpr*s, dpr*xf.ox, dpr*xf.oy);
  var vx0 = -xf.ox/s - 60, vx1 = (viewW - xf.ox)/s + 60, vy0 = -xf.oy/s - 60, vy1 = (viewH - xf.oy)/s + 60;
  var t = curT, i, j;

  /* ghost architect's grid: lines only, across the whole visible paper */
  ctx.save(); ctx.globalAlpha = 0.08; ctx.strokeStyle = INK; ctx.lineWidth = 1.1; ctx.beginPath();
  for (i = Math.floor(vx0/100)*100; i <= vx1; i += 100){ ctx.moveTo(i, vy0); ctx.lineTo(i, vy1); }
  for (j = Math.floor(vy0/100)*100; j <= vy1; j += 100){ ctx.moveTo(vx0, j); ctx.lineTo(vx1, j); }
  ctx.stroke(); ctx.restore();

  /* speckle */
  for (i = 0; i < speckles.length; i++){ var sp = speckles[i]; ctx.save(); ctx.globalAlpha = sp.a; ctx.fillStyle = INK; ctx.fillRect(sp.x, sp.y, sp.r, sp.r); ctx.restore(); }

  /* the wash breathes: thickens and thins, pooled at the mother */
  var breath = 0.7 + 0.45*(0.5 + 0.5*Math.sin(2*Math.PI*t/9 - 1.2));
  for (i = 0; i < blobs.length; i++){
    var b = blobs[i], sc = 1 + 0.38*b.sw;
    ctx.save(); ctx.translate(b.x, b.y); ctx.scale(sc, sc); ctx.translate(-b.x, -b.y);
    fillPts(b.pts, WASH, Math.min(0.62, b.a * breath * (1 + 0.45*b.sw)));
    ctx.restore();
  }

  /* title: red, hand-lettered, the third red thing */
  ctx.save(); ctx.translate(500, 94); ctx.rotate(-0.012);
  ctx.fillStyle = RED; ctx.font = handFont(63, 700); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('SIN VIÑETAS', 0, 0); ctx.restore();
  stroke(titleLine, 3, RED);

  /* laundry line + swaying washing */
  stroke(S.line, 2.6);
  for (i = 0; i < laundry.length; i++){
    var Ld = laundry[i], ang = 0.03*Math.sin(2*Math.PI*t/6.5 + Ld.phase);
    ctx.save(); ctx.translate(Ld.px, Ld.py); ctx.rotate(ang);
    stroke(Ld.pts, 2.6, INK, true);
    if (Ld.kind === 'towel'){ stroke(seg(-24,24, 24,24), 2); stroke(seg(-24,44, 24,44), 2); }
    if (Ld.kind === 'onesie'){ stroke(seg(-19,20, 19,20), 1.8); }
    ctx.fillStyle = INK; ctx.fillRect(-2.5, -5, 5, 9);
    ctx.restore();
  }

  /* the mother, tired, holding the baby */
  stroke(S.rug, 1.8);
  stroke(S.dress, 3.2); stroke(S.hem, 2.2); stroke(S.neck, 2.4);
  stroke(S.legL, 3); stroke(S.legR, 3); stroke(S.shoeL, 2.2, INK, true); stroke(S.shoeR, 2.2, INK, true);
  stroke(S.armReach, 3); stroke(S.hand, 2.2, INK, true);
  stroke(S.head, 3.2, INK, true); stroke(S.hair, 2.6); stroke(S.bun, 2.6, INK, true);
  stroke(S.eye, 2.2); stroke(S.brow, 2); stroke(S.mouth, 2.2);
  stroke(S.sweat1, 1.8, INK, true); stroke(S.sweat2, 1.6, INK, true);

  /* the baby, mid-wail, across her front; her forearm comes over the bundle */
  ctx.save(); ctx.translate(310, 482); ctx.rotate(-0.3);
  stroke(S.babyBody, 3, INK, true);
  stroke(arcP(0,2,46,-0.4,1.5,10), 2);
  stroke(ellP(54,14,7.5,5), 2.2, INK, true); stroke(ellP(58,-4,7.5,5), 2.2, INK, true);
  stroke(seg(-58,-40, -69,-48), 2); stroke(seg(-50,-50, -56,-61), 2); stroke(seg(-65,-29, -77,-33), 2);
  ctx.save(); ctx.translate(-48, -24);
  stroke(circP(0,0,21), 3, INK, true);
  stroke(arcP(0,-3,8,Math.PI*1.12,Math.PI*1.88,8), 2.2);
  stroke(seg(-7,-14, 6,-12), 1.8);
  fillPts(ellP(0,8,5.5,7.5), INK);
  stroke(dropP(-14,5,0.55), 1.6, INK, true); stroke(dropP(13,3,0.5), 1.6, INK, true); stroke(dropP(-17,22,0.5), 1.5, INK, true);
  ctx.restore();
  ctx.restore();
  stroke(S.armCradle, 3);

  /* the phone: red, on its little table; once per loop it buzzes */
  stroke(S.tblTop, 3); stroke(S.tblL, 2.6); stroke(S.tblR, 2.6);
  var lp = t % 12, env = 0;
  if (lp > 4.0 && lp < 4.9) env = Math.sin(Math.PI*(lp - 4.0)/0.9);
  var step = Math.floor(t*26);
  var jx = (hash1(step) - 0.5)*7*env, jy = (hash1(step + 57) - 0.5)*7*env;
  ctx.save(); ctx.translate(774 + jx, 284 + jy); ctx.rotate(-0.1);
  fillPts(phoneBody, RED); stroke(phoneBody, 3, INK, true); stroke(phoneScr, 2.2, INK, true);
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(0, 37, 3.2, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  if (env > 0.03){
    ctx.save(); ctx.globalAlpha = env*0.9;
    stroke(arcP(774 + jx, 284 + jy, 52 + (lp - 4.0)*22, -0.75, 0.75, 10), 2.6);
    stroke(arcP(774 + jx, 284 + jy, 68 + (lp - 4.0)*26, -0.7, 0.7, 10), 2.2);
    ctx.restore();
  }

  /* the kettle, steaming gently */
  ctx.save(); ctx.translate(820, 556);
  for (i = 0; i < 2; i++){
    var sx = -14 + i*30, sph = t*1.4 + i*2.1, sp2 = [];
    for (j = 0; j <= 12; j++){ var sy = -34 - j*6.4; sp2.push([sx + Math.sin(sph + j*0.62)*5.5*(j/12 + 0.25), sy]); }
    ctx.save(); ctx.globalAlpha = 0.55; stroke(sp2, 2.4); ctx.restore();
  }
  stroke(kettle.body, 3.2, INK, true); stroke(kettle.spout, 3, INK, true);
  stroke(kettle.handle, 3); stroke(kettle.knob, 2.2, INK, true);
  ctx.restore();
  stroke(S.standTop, 2.6); stroke(S.standL, 2.6); stroke(S.standR, 2.6);

  /* the open suitcase, clothes escaping */
  ctx.save(); ctx.translate(620, 792); ctx.rotate(-0.52); stroke(S.caseLid, 3.2, INK, true); ctx.restore();
  stroke(S.caseBase, 3.2, INK, true); stroke(S.caseIn, 2.2);
  stroke(S.cloth1, 2.6); stroke(S.cloth2, 2.6); stroke(S.roll, 2.6, INK, true); stroke(S.rollIn, 2, INK, true);
  stroke(S.shoeOut, 2.6, INK, true);

  /* the coffee: tipped cup on its stool, a drip that falls and falls, the red spill */
  fillPts(spill, RED);
  stroke(S.stoolTop, 2.8); stroke(S.stoolL, 2.6); stroke(S.stoolR, 2.6);
  stroke(S.cup, 3, INK, true); stroke(S.cupLip, 2.2);
  var du = (t % 2.6)/2.6;
  if (du < 0.75){
    var dy2 = 744 + 42*Math.pow(du/0.75, 2);
    fillPts(dropP(446, dy2, 0.85), RED);
  } else {
    ctx.save(); ctx.globalAlpha = (1 - (du - 0.75)/0.25)*0.85;
    fillPts(ellP(446, 788, 5 + 13*(du - 0.75)/0.25, 2.2), RED);
    ctx.restore();
  }

  /* scattered toys, bottom left */
  stroke(S.ball, 3, INK, true); stroke(S.ballStripe, 2.2);
  stroke(S.block1, 3, INK, true); stroke(S.block1in, 2);
  stroke(S.block2, 2.8, INK, true);
  stroke(S.bearHead, 2.6, INK, true); stroke(S.bearEarL, 2, INK, true); stroke(S.bearEarR, 2, INK, true); stroke(S.bearBody, 2.6, INK, true);
  stroke(S.rattle, 2.6, INK, true); stroke(S.rattleStick, 2.6);
  stroke(S.pacifier, 2.4, INK, true); stroke(S.pacRing, 2, INK, true);

  /* thought bubble, when a figure has been tapped */
  if (bubbleState){
    var bb = bubbles[bubbleState.who];
    var pop = Math.min(1, (t - bubbleState.t0)/0.18), sc2 = 0.6 + 0.4*(1 - Math.pow(1 - pop, 3));
    ctx.save(); ctx.globalAlpha = pop;
    var cp = cloudPts(bb, sc2); fillPts(cp, PAPER, pop); stroke(cp, 2.6, INK, true);
    var d1 = [bb.x + (bb.tx - bb.x)*0.78, bb.y + (bb.ty - bb.y)*0.78];
    var d2 = [bb.x + (bb.tx - bb.x)*0.9,  bb.y + (bb.ty - bb.y)*0.9];
    fillPts(circP(d1[0], d1[1], 5), INK); fillPts(circP(d2[0], d2[1], 3.4), INK);
    ctx.fillStyle = INK; ctx.font = handFont(bb.size, 600); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(bb.text, bb.x, bb.y + 2);
    ctx.restore();
  }

  /* hint */
  ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = INK; ctx.font = handFont(21, 600);
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic'; ctx.fillText('drag · tap', 972, 962); ctx.restore();
}

/* ---------- sizing listeners (Visual Viewport API + window) ---------- */
function resize(){
  var vv = (typeof window !== 'undefined') ? window.visualViewport : null;
  viewW = vv ? vv.width : window.innerWidth;
  viewH = vv ? vv.height : window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  draw();
}
if (typeof window !== 'undefined' && window.visualViewport) window.visualViewport.addEventListener('resize', resize);
if (typeof window !== 'undefined') window.addEventListener('resize', resize);

/* ---------- interaction: drag smears the wash; tap asks a figure what it thinks ---------- */
function toStage(e){
  var r = { left:0, top:0 };
  if (canvas.getBoundingClientRect) r = canvas.getBoundingClientRect();
  var xf = stageXform();
  return { x: ((e.clientX - r.left) - xf.ox)/xf.s, y: ((e.clientY - r.top) - xf.oy)/xf.s };
}
function smearAt(p, amt){
  for (var i = 0; i < blobs.length; i++){
    var b = blobs[i], d = Math.hypot(b.x - p.x, b.y - p.y);
    if (d < 230) b.sw = Math.min(1.3, b.sw + amt*(1 - d/230));
  }
}
canvas.addEventListener('pointerdown', function(e){
  var p = toStage(e);
  pdown = { x:p.x, y:p.y, moved:false };
  lastPtr = p;
});
canvas.addEventListener('pointermove', function(e){
  if (!pdown) return;
  var p = toStage(e);
  if (Math.abs(p.x - pdown.x) > 8 || Math.abs(p.y - pdown.y) > 8) pdown.moved = true;
  if (pdown.moved){ lastPtr = p; smearAt(p, 0.4); }
});
function endPointer(e){
  if (!pdown) return;
  var wasDrag = pdown.moved; pdown = null;
  if (wasDrag) { draw(); return; }
  var p = toStage(e);
  var mdx = (p.x - 371)/68, mdy = (p.y - 482)/188;
  if (Math.hypot(p.x - 262, p.y - 472) < 76) bubbleState = { who:'baby', t0: curT };
  else if (mdx*mdx + mdy*mdy < 1) bubbleState = { who:'mother', t0: curT };
  else bubbleState = null;
  draw();
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', function(){ pdown = null; });
if (typeof window !== 'undefined') window.addEventListener('pointerup', function(){ pdown = null; });

/* ---------- tick: relax the smear, keep cranking while a drag is held ---------- */
var lastT = PHASE0;
function tick(t){
  var dt = Math.min(0.05, Math.max(0, t - lastT)); lastT = t;
  curT = t;
  var decay = Math.pow(0.3, dt);
  for (var i = 0; i < blobs.length; i++) blobs[i].sw *= decay;
  if (pdown && pdown.moved && lastPtr) smearAt(lastPtr, dt*1.6);
}

/* ---------- go: synchronous first frame, then the loop ---------- */
resize();
var baseTs = null;
function loop(ts){
  if (baseTs === null){ baseTs = ts; lastT = PHASE0; tick(PHASE0); }
  else tick(PHASE0 + (ts - baseTs)/1000);
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
</script>
</body>
