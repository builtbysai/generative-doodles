<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interior Stories</title>
<style>
  html, body { margin: 0; padding: 0; background: #F7F1E3; height: 100%; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---------- seeded RNG (mulberry32, fixed seed) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(536064);

  // ---------- palette (NM8 spec: five riso inks, flat only) ----------
  var BLUE = '#2B4FE0',   // riso blue
      PINK = '#FF4E8A',   // riso pink
      CREAM = '#F7F1E3',  // cream paper / page ground
      INK = '#1A1A1A',    // ink
      GREY = '#9AA3B2';   // rain grey

  // ---------- precomputed scene data (all seeded, static) ----------
  // riso grain specks drawn directly each frame (no offscreen canvas in the QA renderer)
  var grain = [];
  for (var g = 0; g < 750; g++) {
    grain.push({ x: rng(), y: rng(), a: rng() * Math.PI, l: 2 + rng() * 4, al: 0.03 + rng() * 0.05 });
  }
  // rain streaks inside the panel-2 window (window-local 0..1)
  var rain = [];
  for (var r = 0; r < 30; r++) {
    rain.push({ x: rng(), y: rng(), l: 0.10 + rng() * 0.14 });
  }
  // seeded letter jitter for the two sound words
  function wordJit(word) {
    var out = [];
    for (var i = 0; i < word.length; i++) out.push({ dy: (rng() - 0.5) * 0.10, rot: (rng() - 0.5) * 0.16 });
    return out;
  }
  var MIAU_JIT = wordJit('miau'), PLIP_JIT = wordJit('plip');

  // ---------- viewport / stage ----------
  var W = 0, H = 0, SX = 0, SY = 0, SS = 0; // stage origin + size (square)
  var isPhone = false;
  function resize() {
    var vv = window.visualViewport;
    var w = vv ? vv.width : window.innerWidth;
    var h = vv ? vv.height : window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    SS = Math.min(w, h);
    SX = (w - SS) / 2; SY = (h - SS) / 2;
    var sw = window.screen ? Math.min(window.screen.width, window.screen.height) : 9999;
    isPhone = sw < 700 || h > w * 1.15;
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  // ---------- drawing helpers (stage units) ----------
  function X(u) { return SX + u * SS; }
  function Y(u) { return SY + u * SS; }
  function line(x1, y1, x2, y2, wdt, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.strokeStyle = col; ctx.lineWidth = wdt * SS; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function circ(x, y, r, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(X(x), Y(y), r * SS, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function ell(x, y, rx, ry, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(X(x), Y(y), rx * SS, ry * SS, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function rect(x, y, w, h, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.fillRect(X(x), Y(y), w * SS, h * SS);
    ctx.globalAlpha = 1;
  }
  function rrPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(X(x + r), Y(y));
    ctx.lineTo(X(x + w - r), Y(y)); ctx.arcTo(X(x + w), Y(y), X(x + w), Y(y + r), r * SS);
    ctx.lineTo(X(x + w), Y(y + h - r)); ctx.arcTo(X(x + w), Y(y + h), X(x + w - r), Y(y + h), r * SS);
    ctx.lineTo(X(x + r), Y(y + h)); ctx.arcTo(X(x), Y(y + h), X(x), Y(y + h - r), r * SS);
    ctx.lineTo(X(x), Y(y + r)); ctx.arcTo(X(x), Y(y), X(x + r), Y(y), r * SS);
    ctx.closePath();
  }
  function rrFill(x, y, w, h, r, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col; rrPath(x, y, w, h, r); ctx.fill();
    ctx.globalAlpha = 1;
  }
  function rrStroke(x, y, w, h, r, wdt, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.strokeStyle = col; ctx.lineWidth = wdt * SS; ctx.lineJoin = 'round';
    rrPath(x, y, w, h, r); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // panel-relative helpers: p = {x,y,w,h} in stage units, u/v in 0..1 of the panel
  function PU(p, u) { return p.x + u * p.w; }
  function PV(p, v) { return p.y + v * p.h; }
  function pline(p, u1, v1, u2, v2, wdt, col, alpha) { line(PU(p, u1), PV(p, v1), PU(p, u2), PV(p, v2), wdt, col, alpha); }
  function pcirc(p, u, v, r, col, alpha) { circ(PU(p, u), PV(p, v), r * p.w, col, alpha); }
  function pell(p, u, v, rx, ry, col, alpha) { ell(PU(p, u), PV(p, v), rx * p.w, ry * p.w, col, alpha); }
  function prect(p, u, v, w, h, col, alpha) { rect(PU(p, u), PV(p, v), w * p.w, h * p.h, col, alpha); }
  function prr(p, u, v, w, h, r, col, alpha) { rrFill(PU(p, u), PV(p, v), w * p.w, h * p.h, r * p.w, col, alpha); }
  function prrStroke(p, u, v, w, h, r, wdt, col, alpha) { rrStroke(PU(p, u), PV(p, v), w * p.w, h * p.h, r * p.w, wdt, col, alpha); }
  function ppath(p, pts, wdt, col, alpha, close) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.strokeStyle = col; ctx.lineWidth = wdt * SS; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(X(PU(p, pts[0][0])), Y(PV(p, pts[0][1])));
    for (var i = 1; i < pts.length; i++) ctx.lineTo(X(PU(p, pts[i][0])), Y(PV(p, pts[i][1])));
    if (close) ctx.closePath();
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  function pfill(p, pts, col, alpha) {
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(X(PU(p, pts[0][0])), Y(PV(p, pts[0][1])));
    for (var i = 1; i < pts.length; i++) ctx.lineTo(X(PU(p, pts[i][0])), Y(PV(p, pts[i][1])));
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // hand-lettered sound word: letters drawn one by one with seeded jitter
  function soundWord(p, word, jit, u, v, size, col, rot) {
    ctx.save();
    ctx.translate(X(PU(p, u)), Y(PV(p, v)));
    ctx.rotate(rot);
    ctx.font = '700 ' + Math.round(size * p.h * SS) + 'px "Comic Sans MS", "Chalkboard SE", "Segoe Print", sans-serif';
    ctx.textBaseline = 'middle';
    var widths = [], total = 0, i;
    for (i = 0; i < word.length; i++) { var m = ctx.measureText(word[i]).width; widths.push(m); total += m; }
    var cx = -total / 2;
    ctx.fillStyle = col;
    for (i = 0; i < word.length; i++) {
      ctx.save();
      ctx.translate(cx + widths[i] / 2, jit[i].dy * size * p.h * SS);
      ctx.rotate(jit[i].rot);
      ctx.textAlign = 'center';
      ctx.fillText(word[i], 0, 0);
      ctx.restore();
      cx += widths[i];
    }
    ctx.restore();
  }

  // ---------- panel layout: 2 columns x 3 rows, thick gutters ----------
  // rows vary slightly; the rain-window panel (top right) is the widest
  var PANELS = [
    { x: 0.045, y: 0.045, w: 0.428, h: 0.278, dur: 1.1, draw: drawCat },     // 1 cat on books
    { x: 0.497, y: 0.045, w: 0.458, h: 0.278, dur: 1.6, draw: drawRain },    // 2 reading in the rain
    { x: 0.045, y: 0.347, w: 0.443, h: 0.282, dur: 1.4, draw: drawKitchen }, // 3 kitchen table
    { x: 0.512, y: 0.347, w: 0.443, h: 0.282, dur: 1.0, draw: drawHall },    // 4 hallway dog
    { x: 0.045, y: 0.653, w: 0.443, h: 0.302, dur: 1.8, draw: drawBedroom }, // 5 bedroom poster
    { x: 0.512, y: 0.653, w: 0.443, h: 0.302, dur: 1.2, draw: drawZine }     // 6 hands + zine
  ];
  var WASH = [ // subtle riso washes (palette colours at low alpha over the cream)
    [PINK, 0.05], [GREY, 0.14], [BLUE, 0.05], [PINK, 0.04], [BLUE, 0.045], [PINK, 0.05]
  ];

  // ---------- panel 1: cat asleep on a pile of books ----------
  function drawCat(p, pr) {
    prect(p, 0, 0.80, 1, 0.20, GREY, 0.18); // floor band
    // book pile
    prr(p, 0.16, 0.64, 0.48, 0.16, 0.015, BLUE);
    pline(p, 0.19, 0.72, 0.61, 0.72, 0.004, CREAM, 0.8);
    prr(p, 0.20, 0.51, 0.40, 0.14, 0.015, PINK);
    pline(p, 0.23, 0.58, 0.57, 0.58, 0.004, CREAM, 0.8);
    prr(p, 0.24, 0.40, 0.32, 0.12, 0.015, GREY);
    pline(p, 0.27, 0.46, 0.53, 0.46, 0.004, CREAM, 0.8);
    // tail: rests curled, flicks up and wiggles when tapped
    var anim = pr >= 0 && pr < 1;
    var env = anim ? Math.sin(Math.PI * pr) : 0;
    var tailK = 0.30 + 0.70 * env;
    var wig = anim ? Math.sin(pr * 20) * 0.012 * env : 0;
    ctx.strokeStyle = INK; ctx.lineWidth = 0.011 * SS; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(X(PU(p, 0.26)), Y(PV(p, 0.36)));
    ctx.quadraticCurveTo(X(PU(p, 0.16)), Y(PV(p, 0.40)),
                         X(PU(p, 0.145 + wig)), Y(PV(p, 0.38 - 0.13 * tailK)));
    ctx.stroke();
    // cat body + head (ink silhouette, folk simple)
    pell(p, 0.40, 0.345, 0.155, 0.062, INK);
    pcirc(p, 0.535, 0.315, 0.050, INK);
    pfill(p, [[0.505, 0.285], [0.512, 0.245], [0.532, 0.272]], INK); // ear
    pfill(p, [[0.545, 0.272], [0.562, 0.242], [0.570, 0.282]], INK); // ear
    pline(p, 0.520, 0.318, 0.545, 0.318, 0.0035, CREAM, 0.9);        // closed eye
    pcirc(p, 0.578, 0.330, 0.008, PINK);                             // nose
    pline(p, 0.30, 0.40, 0.29, 0.44, 0.009, INK);                    // paw drape
    soundWord(p, 'miau', MIAU_JIT, 0.76, 0.20, 0.17, PINK, -0.10);
  }

  // ---------- panel 2: reading by a rainy window ----------
  function drawRain(p, pr) {
    var anim = pr >= 0 && pr < 1;
    var off = anim ? pr * 0.9 : 0; // streaks slide down while tapped
    // window
    prect(p, 0.07, 0.07, 0.55, 0.64, GREY, 0.55);
    ctx.save();
    ctx.beginPath();
    ctx.rect(X(PU(p, 0.07)), Y(PV(p, 0.07)), 0.55 * p.w * SS, 0.64 * p.h * SS);
    ctx.clip();
    for (var i = 0; i < rain.length; i++) {
      var s = rain[i];
      var yy = 0.07 + ((s.y + off) % 1) * 0.64;
      var xx = 0.07 + s.x * 0.55 - (yy - 0.07) * 0.22;
      pline(p, xx, yy, xx - s.l * 0.22, yy + s.l * 0.64, 0.0035, INK, 0.55);
    }
    ctx.restore();
    prrStroke(p, 0.07, 0.07, 0.55, 0.64, 0.004, 0.010, INK);
    pline(p, 0.345, 0.07, 0.345, 0.71, 0.007, INK);
    pline(p, 0.05, 0.73, 0.64, 0.73, 0.009, INK); // sill
    // plant pot on the sill (blue leaves: palette only)
    prr(p, 0.13, 0.60, 0.09, 0.11, 0.01, PINK);
    pline(p, 0.175, 0.60, 0.145, 0.47, 0.006, BLUE);
    pline(p, 0.175, 0.60, 0.175, 0.44, 0.006, BLUE);
    pline(p, 0.175, 0.60, 0.210, 0.48, 0.006, BLUE);
    // chair + reader
    prect(p, 0.685, 0.28, 0.045, 0.52, INK);
    prect(p, 0.685, 0.60, 0.20, 0.045, INK);
    pline(p, 0.71, 0.645, 0.71, 0.82, 0.008, INK);
    pline(p, 0.865, 0.645, 0.865, 0.82, 0.008, INK);
    prr(p, 0.715, 0.335, 0.115, 0.28, 0.03, BLUE);              // torso
    pcirc(p, 0.775, 0.265, 0.056, CREAM);                        // head
    ctx.beginPath();                                             // pink hair cap
    ctx.arc(X(PU(p, 0.775)), Y(PV(p, 0.258)), 0.058 * p.w * SS, Math.PI * 1.02, Math.PI * 1.98);
    ctx.lineTo(X(PU(p, 0.833)), Y(PV(p, 0.258)));
    ctx.closePath(); ctx.fillStyle = PINK; ctx.fill();
    pline(p, 0.80, 0.45, 0.885, 0.52, 0.016, BLUE);              // arm to book
    pline(p, 0.76, 0.63, 0.86, 0.70, 0.011, INK);                // legs
    pline(p, 0.86, 0.70, 0.85, 0.82, 0.011, INK);
    // open book
    pfill(p, [[0.845, 0.44], [0.905, 0.475], [0.905, 0.60], [0.845, 0.565]], CREAM);
    pfill(p, [[0.965, 0.44], [0.905, 0.475], [0.905, 0.60], [0.965, 0.565]], CREAM);
    ppath(p, [[0.845, 0.44], [0.905, 0.475], [0.965, 0.44], [0.965, 0.565], [0.905, 0.60], [0.845, 0.565], [0.845, 0.44]], 0.004, INK, 1, false);
    pline(p, 0.905, 0.475, 0.905, 0.60, 0.0035, INK);
    // sound word + one resting drip on the sill
    soundWord(p, 'plip', PLIP_JIT, 0.20, 0.885, 0.155, BLUE, 0.09);
    pcirc(p, 0.335, 0.845, 0.010, BLUE);
    pfill(p, [[0.328, 0.838], [0.335, 0.820], [0.342, 0.838]], BLUE);
  }

  // ---------- panel 3: kitchen table, two cups, half-finished drawing ----------
  function drawKitchen(p, pr) {
    var anim = pr >= 0 && pr < 1;
    var env = anim ? Math.sin(Math.PI * pr) : 0;
    var steamK = 0.45 + 0.55 * env;
    prect(p, 0, 0.68, 1, 0.32, PINK, 0.10); // floor wash
    // shelf with jars
    pline(p, 0.58, 0.20, 0.90, 0.20, 0.007, INK);
    prr(p, 0.62, 0.095, 0.07, 0.105, 0.008, BLUE);
    prr(p, 0.72, 0.075, 0.055, 0.125, 0.008, PINK);
    prr(p, 0.805, 0.105, 0.06, 0.095, 0.008, GREY);
    // pendant lamp
    pline(p, 0.30, 0.0, 0.30, 0.10, 0.005, INK);
    pfill(p, [[0.235, 0.185], [0.365, 0.185], [0.325, 0.10], [0.275, 0.10]], PINK);
    pcirc(p, 0.30, 0.20, 0.012, INK);
    // table
    prect(p, 0.10, 0.545, 0.80, 0.035, INK);
    pline(p, 0.15, 0.58, 0.15, 0.90, 0.009, INK);
    pline(p, 0.85, 0.58, 0.85, 0.90, 0.009, INK);
    // half-finished drawing sheet on the table
    ctx.save();
    ctx.translate(X(PU(p, 0.47)), Y(PV(p, 0.53)));
    ctx.rotate(-0.05);
    ctx.fillStyle = CREAM;
    ctx.fillRect(-0.085 * p.w * SS, -0.055 * p.h * SS, 0.17 * p.w * SS, 0.11 * p.h * SS);
    ctx.strokeStyle = INK; ctx.lineWidth = 0.0035 * SS;
    ctx.strokeRect(-0.085 * p.w * SS, -0.055 * p.h * SS, 0.17 * p.w * SS, 0.11 * p.h * SS);
    ctx.beginPath();
    ctx.arc(0, 0, 0.032 * p.w * SS, -0.4, 3.6); // circle left unfinished
    ctx.strokeStyle = BLUE; ctx.lineWidth = 0.004 * SS; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-0.06 * p.w * SS, 0.035 * p.h * SS);
    ctx.lineTo(0.005 * p.w * SS, 0.035 * p.h * SS);
    ctx.stroke();
    ctx.restore();
    // two cups + steam
    drawCup(p, 0.245, 0.545, CREAM, steamK, pr, 0);
    drawCup(p, 0.615, 0.545, PINK, steamK, pr, 2.1);
    // pencil beside the sheet
    pline(p, 0.60, 0.565, 0.70, 0.545, 0.007, INK);
    pfill(p, [[0.70, 0.545], [0.725, 0.552], [0.70, 0.558]], PINK);
  }
  function drawCup(p, u, vBot, col, steamK, pr, phase) {
    prr(p, u, vBot - 0.105, 0.085, 0.105, 0.012, col);
    prrStroke(p, u, vBot - 0.105, 0.085, 0.105, 0.012, 0.004, INK);
    ctx.beginPath(); // handle
    ctx.arc(X(PU(p, u + 0.092)), Y(PV(p, vBot - 0.052)), 0.020 * p.w * SS, -1.2, 1.2);
    ctx.strokeStyle = INK; ctx.lineWidth = 0.0045 * SS; ctx.stroke();
    // steam wisps: present at rest, rise and swell on tap
    ctx.strokeStyle = INK; ctx.lineCap = 'round';
    for (var k = 0; k < 2; k++) {
      ctx.globalAlpha = 0.45 * steamK + 0.12;
      ctx.lineWidth = 0.004 * SS;
      ctx.beginPath();
      for (var s = 0; s <= 8; s++) {
        var f = s / 8;
        var sx = u + 0.018 + k * 0.034 + Math.sin(f * 5.2 + phase + pr * 5.0) * 0.007 * steamK;
        var sy = vBot - 0.125 - f * 0.115 * (0.45 + 0.55 * steamK) - (pr > 0 && pr < 1 ? pr * 0.03 * f : 0);
        if (s === 0) ctx.moveTo(X(PU(p, sx)), Y(PV(p, sy)));
        else ctx.lineTo(X(PU(p, sx)), Y(PV(p, sy)));
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- panel 4: hallway, coats, small dog ----------
  function drawHall(p, pr) {
    var anim = pr >= 0 && pr < 1;
    var twitch = anim ? Math.sin(Math.PI * pr) * (0.55 + 0.45 * Math.sin(pr * 22)) : 0;
    // perspective room + far door
    prrStroke(p, 0.315, 0.15, 0.37, 0.70, 0.004, 0.005, INK, 0.85);
    pline(p, 0.0, 0.0 + 0.001, 0.315, 0.15, 0.0035, INK, 0.5);
    pline(p, 1.0, 0.001, 0.685, 0.15, 0.0035, INK, 0.5);
    pline(p, 0.0, 0.999, 0.315, 0.85, 0.0035, INK, 0.5);
    pline(p, 1.0, 0.999, 0.685, 0.85, 0.0035, INK, 0.5);
    prect(p, 0.425, 0.30, 0.15, 0.55, GREY, 0.25);
    prrStroke(p, 0.425, 0.30, 0.15, 0.55, 0.003, 0.005, INK);
    pcirc(p, 0.555, 0.575, 0.010, INK);
    // coat stand with two coats and a hat
    pline(p, 0.155, 0.20, 0.155, 0.88, 0.009, INK);
    pline(p, 0.10, 0.88, 0.21, 0.88, 0.009, INK);
    pline(p, 0.155, 0.26, 0.095, 0.21, 0.006, INK);
    pline(p, 0.155, 0.26, 0.215, 0.21, 0.006, INK);
    pfill(p, [[0.075, 0.30], [0.155, 0.245], [0.185, 0.30], [0.175, 0.60], [0.095, 0.60]], PINK); // coat 1
    pfill(p, [[0.165, 0.33], [0.225, 0.285], [0.255, 0.33], [0.245, 0.63], [0.185, 0.63]], BLUE); // coat 2
    pell(p, 0.155, 0.175, 0.052, 0.030, INK); // hat crown
    pline(p, 0.085, 0.20, 0.225, 0.20, 0.007, INK); // hat brim
    // rug + dog
    pell(p, 0.72, 0.83, 0.20, 0.045, PINK, 0.75);
    pell(p, 0.70, 0.665, 0.115, 0.062, CREAM); // body
    ctx.beginPath();
    ctx.ellipse(X(PU(p, 0.70)), Y(PV(p, 0.665)), 0.115 * p.w * SS, 0.062 * p.w * SS, 0, 0, Math.PI * 2);
    ctx.strokeStyle = INK; ctx.lineWidth = 0.0035 * SS; ctx.globalAlpha = 0.8; ctx.stroke();
    ctx.globalAlpha = 1;
    pcirc(p, 0.815, 0.615, 0.052, CREAM);       // head
    ctx.beginPath();
    ctx.arc(X(PU(p, 0.815)), Y(PV(p, 0.615)), 0.052 * p.w * SS, 0, Math.PI * 2);
    ctx.strokeStyle = INK; ctx.lineWidth = 0.0035 * SS; ctx.globalAlpha = 0.8; ctx.stroke();
    ctx.globalAlpha = 1;
    // ear: twitches on tap
    ctx.save();
    ctx.translate(X(PU(p, 0.795)), Y(PV(p, 0.575)));
    ctx.rotate(-0.15 - 0.55 * twitch);
    ctx.fillStyle = PINK;
    ctx.beginPath();
    ctx.ellipse(0, 0.030 * p.h * SS, 0.020 * p.w * SS, 0.042 * p.h * SS, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    pline(p, 0.735, 0.585, 0.72, 0.545, 0.007, BLUE); // collar
    pcirc(p, 0.828, 0.608, 0.007, INK);               // eye
    pcirc(p, 0.862, 0.628, 0.010, INK);               // nose
    pline(p, 0.588, 0.65, 0.53, 0.575, 0.008, INK);   // tail
    pline(p, 0.635, 0.72, 0.635, 0.80, 0.008, INK);   // legs
    pline(p, 0.775, 0.72, 0.775, 0.80, 0.008, INK);
  }

  // ---------- panel 5: bedroom with a blue-line figure poster ----------
  var FIGURE = [ // poster-local polyline of the line figure
    [0.50, 0.225], [0.40, 0.28], [0.335, 0.48], [0.375, 0.505], [0.435, 0.345],
    [0.45, 0.55], [0.40, 0.86], [0.465, 0.86], [0.50, 0.615], [0.55, 0.86],
    [0.615, 0.86], [0.575, 0.55], [0.565, 0.345], [0.665, 0.48], [0.625, 0.515],
    [0.565, 0.30], [0.52, 0.225]
  ];
  function drawBedroom(p, pr) {
    var anim = pr >= 0 && pr < 1;
    var prog = anim ? 1 - 0.85 * Math.sin(Math.PI * pr) : 1; // line redraws on tap
    // poster with the blue-line figure
    prect(p, 0.52, 0.09, 0.36, 0.44, CREAM);
    prrStroke(p, 0.52, 0.09, 0.36, 0.44, 0.002, 0.006, INK);
    var fp = { x: PU(p, 0.545), y: PV(p, 0.105), w: 0.31 * p.w, h: 0.41 * p.h };
    // build the figure path in pixels, measure it, dash it by prog
    var pts = [];
    var i, px, py;
    for (i = 0; i < FIGURE.length; i++) pts.push([X(fp.x + FIGURE[i][0] * fp.w), Y(fp.y + FIGURE[i][1] * fp.h)]);
    var headC = [X(fp.x + 0.5 * fp.w), Y(fp.y + 0.135 * fp.h)], headR = 0.078 * fp.w * SS;
    var total = 2 * Math.PI * headR;
    for (i = 1; i < pts.length; i++) {
      var dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
      total += Math.sqrt(dx * dx + dy * dy);
    }
    ctx.strokeStyle = BLUE; ctx.lineWidth = 0.0062 * SS; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.setLineDash([Math.max(0.001, total * prog), total + 1]);
    ctx.beginPath();
    ctx.arc(headC[0], headC[1], headR, 0, Math.PI * 2);
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
    ctx.setLineDash([]);
    pcirc(p, 0.845, 0.155, 0.016, PINK); // small pink sun in the poster corner
    // pink crescent moon on the wall
    pcirc(p, 0.16, 0.17, 0.034, PINK);
    pcirc(p, 0.178, 0.155, 0.030, CREAM);
    // bed
    prect(p, 0.055, 0.40, 0.045, 0.47, INK); // headboard
    prr(p, 0.10, 0.60, 0.82, 0.10, 0.02, CREAM);
    prrStroke(p, 0.10, 0.60, 0.82, 0.10, 0.02, 0.004, INK, 0.8);
    prr(p, 0.10, 0.545, 0.52, 0.115, 0.025, PINK); // blanket
    prrStroke(p, 0.10, 0.545, 0.52, 0.115, 0.025, 0.004, INK, 0.8);
    prr(p, 0.115, 0.475, 0.17, 0.085, 0.02, CREAM); // pillow
    prrStroke(p, 0.115, 0.475, 0.17, 0.085, 0.02, 0.004, INK, 0.8);
    prect(p, 0.10, 0.70, 0.82, 0.17, BLUE, 0.85); // bed base
    pline(p, 0.14, 0.87, 0.14, 0.94, 0.008, INK);
    pline(p, 0.88, 0.87, 0.88, 0.94, 0.008, INK);
  }

  // ---------- panel 6: hands holding a tiny handmade zine ----------
  function drawZine(p, pr) {
    var anim = pr >= 0 && pr < 1;
    prect(p, 0, 0.80, 1, 0.20, GREY, 0.16); // table band
    pline(p, 0.0, 0.80, 1.0, 0.80, 0.005, INK, 0.7);
    // sleeves
    pfill(p, [[0.10, 1.0], [0.13, 0.76], [0.30, 0.80], [0.30, 1.0]], BLUE);
    pfill(p, [[0.90, 1.0], [0.87, 0.76], [0.70, 0.80], [0.70, 1.0]], BLUE);
    // open zine: two cream pages
    pfill(p, [[0.335, 0.24], [0.50, 0.20], [0.50, 0.64], [0.335, 0.68]], CREAM);
    pfill(p, [[0.50, 0.20], [0.665, 0.24], [0.665, 0.68], [0.50, 0.64]], CREAM);
    ppath(p, [[0.335, 0.24], [0.50, 0.20], [0.665, 0.24], [0.665, 0.68], [0.50, 0.64], [0.335, 0.68], [0.335, 0.24]], 0.0045, INK, 1, false);
    pline(p, 0.50, 0.20, 0.50, 0.64, 0.004, INK);
    pcirc(p, 0.50, 0.32, 0.006, INK); // staples
    pcirc(p, 0.50, 0.52, 0.006, INK);
    // tiny drawings on the pages
    pcirc(p, 0.415, 0.36, 0.030, PINK);
    pline(p, 0.375, 0.50, 0.455, 0.50, 0.004, INK, 0.7);
    pline(p, 0.375, 0.555, 0.445, 0.555, 0.004, INK, 0.7);
    pfill(p, [[0.582, 0.30], [0.598, 0.345], [0.645, 0.345], [0.606, 0.372], [0.618, 0.415], [0.582, 0.388], [0.546, 0.415], [0.558, 0.372], [0.511, 0.345], [0.558, 0.345]], BLUE);
    pline(p, 0.545, 0.52, 0.625, 0.52, 0.004, INK, 0.7);
    pline(p, 0.545, 0.575, 0.615, 0.575, 0.004, INK, 0.7);
    // turning page (only mid-flip)
    if (anim) {
      var ang = pr * Math.PI;
      var ex = 0.50 + Math.cos(ang) * 0.165;
      var lift = Math.sin(ang) * 0.035;
      pfill(p, [[0.50, 0.20], [ex, 0.24 - lift], [ex, 0.68 - lift], [0.50, 0.64]], CREAM, 0.96);
      ppath(p, [[0.50, 0.20], [ex, 0.24 - lift], [ex, 0.68 - lift], [0.50, 0.64]], 0.0035, INK, 0.8, true);
      if (Math.cos(ang) < 0) { // back of the turning page shows a small pink heart
        pcirc(p, (0.50 + ex) / 2, 0.42, 0.016, PINK, 0.9);
      }
    }
    // hands: pink riso hands gripping the zine edges, fingers over the pages
    drawHand(p, 0.315, false);
    drawHand(p, 0.685, true);
    // pencil on the table
    pline(p, 0.72, 0.885, 0.845, 0.855, 0.008, INK);
    pfill(p, [[0.845, 0.855], [0.875, 0.862], [0.848, 0.872]], PINK);
  }
  function drawHand(p, u, mirror) {
    var s = mirror ? -1 : 1;
    pell(p, u, 0.75, 0.060, 0.088, PINK); // palm rising from the table edge
    for (var f = 0; f < 3; f++) { // fingertips gripping the page edge
      pell(p, u + s * 0.042, 0.465 + f * 0.078, 0.019, 0.029, PINK);
    }
    pell(p, u + s * 0.038, 0.665, 0.019, 0.027, PINK); // thumb
  }

  // ---------- tap interaction (tap-only; one tap plays one panel once) ----------
  var animStart = [-1, -1, -1, -1, -1, -1]; // panel index -> loop-time when tapped
  var nowT = 0;
  var lastTapMs = -1e9;
  function onTap(cxPx, cyPx) {
    var u = (cxPx - SX) / SS, v = (cyPx - SY) / SS;
    for (var i = 0; i < PANELS.length; i++) {
      var p = PANELS[i];
      if (u >= p.x && u <= p.x + p.w && v >= p.y && v <= p.y + p.h) {
        animStart[i] = nowT;
        return;
      }
    }
  }
  function handleEvent(e) {
    var ms = (typeof performance !== 'undefined' && performance.now) ? performance.now() : 0;
    if (ms - lastTapMs < 350) return; // dedupe pointerdown/mousedown pairs
    lastTapMs = ms;
    var rect = canvas.getBoundingClientRect();
    var cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
    var cy = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
    if (cx === undefined) return;
    onTap(cx - rect.left, cy - rect.top);
  }
  canvas.addEventListener('pointerdown', handleEvent);
  canvas.addEventListener('mousedown', handleEvent);
  canvas.addEventListener('touchstart', handleEvent);

  // ---------- main draw ----------
  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.fillStyle = CREAM; ctx.fillRect(0, 0, W, H);
    ctx.save();

    for (var i = 0; i < PANELS.length; i++) {
      var p = PANELS[i];
      var pr = animStart[i] < 0 ? -1 : (t - animStart[i]) / p.dur;
      if (pr >= 1) { animStart[i] = -1; pr = -1; }
      // panel ground: cream + subtle riso wash
      rect(p.x, p.y, p.w, p.h, CREAM);
      rect(p.x, p.y, p.w, p.h, WASH[i][0], WASH[i][1]);
      // scene, clipped inside the border
      ctx.save();
      ctx.beginPath();
      ctx.rect(X(p.x + 0.004), Y(p.y + 0.004), (p.w - 0.008) * SS, (p.h - 0.008) * SS);
      ctx.clip();
      p.draw(p, pr);
      ctx.restore();
      // thick visible border
      rrStroke(p.x, p.y, p.w, p.h, 0.006, 0.0075, INK);
    }

    // riso grain over everything (precomputed specks, drawn directly)
    for (var gi = 0; gi < grain.length; gi++) {
      var gr = grain[gi];
      ctx.strokeStyle = 'rgba(26,26,26,' + gr.al + ')';
      ctx.lineWidth = Math.max(1, 0.0013 * SS);
      ctx.beginPath();
      ctx.moveTo(X(gr.x), Y(gr.y));
      ctx.lineTo(X(gr.x + Math.cos(gr.a) * gr.l / 1080), Y(gr.y + Math.sin(gr.a) * gr.l / 1080));
      ctx.stroke();
    }

    // hint
    ctx.fillStyle = INK; ctx.globalAlpha = 0.45;
    ctx.font = '600 ' + Math.round((isPhone ? 0.024 : 0.02) * SS) + 'px sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('tap', X(0.018), Y(0.985));
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  // ---------- deterministic first frame + guarded loop ----------
  draw(0);
  var startStamp = null;
  function frame(now) {
    if (startStamp === null) startStamp = now;
    nowT = (now - startStamp) / 1000;
    draw(nowT);
    window.requestAnimationFrame(frame);
  }
  if (typeof window.requestAnimationFrame === 'function') {
    window.requestAnimationFrame(frame);
  }
})();
</script>
</body>
