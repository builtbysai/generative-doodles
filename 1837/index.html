<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Early Computers</title>
<style>
html, body { margin: 0; padding: 0; background: #241811; overflow: hidden; }
canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Driver: a fairground orchestrion playing itself. A long paper roll scrolls
   past a bank of brass hammers, and where the paper is punched the hammers
   fall, so the machine plays pitch combinations no human hand could reach.
   The roll never tears and the mechanism never tires. */
var TAU = Math.PI * 2;
var GROUND = '#241811';
var WALNUT = '#3A2718';
var WALNUT_DARK = '#241811';
var WALNUT_LINE = '#120B06';
var PAPER = '#EFE3C4';
var PAPER_SHADOW = '#DCCFA9';
var PAPER_LINE = 'rgba(90,70,40,0.16)';
var HOLE = '#14100B';
var BRASS = '#C49A3F';
var BRASS_DARK = '#8A6A26';
var STEEL = '#9AA3AD';
var STEEL_DARK = '#5B6470';
var PLATE = '#101013';
var PLATE_LINE = 'rgba(239,227,196,0.30)';
var TITLE_INK = '#EFE3C4';
var HINT_INK = '#B9A87E';
var FRAME_T = 47.8;        /* fixed phase: roll mid-scroll, three lanes striking */
var LANES = 9;
var TILE = 84;             /* hole-pattern tile, columns; canon repeats every tile */
var SCROLL = 0.9;          /* columns per second, right to left */
var PITCH = [261.63, 293.66, 329.63, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25];
/* Nancarrow-like canon: each lane is a voice with its own period and offset */
var VOICE_PERIOD = [3, 5, 4, 7, 3, 8, 5, 11, 6];
var VOICE_OFFSET = [0, 1, 2, 0, 2, 3, 1, 4, 5];
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function rgba(h, a) {
  var c = hexRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a.toFixed(4) + ')';
}
function hash2(x, y) {
  var s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = 0, VH = 0, isPhone = false;
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }
var rng = mulberry32(1837);
var phaseT = FRAME_T;
var soundOn = false;
var audioCtx = null;
var soundPlate = { x: 0, y: 0, w: 0, h: 0 };
var lastT = null;
/* ---- hole pattern: seeded once, fixed at load. Sparse extra holes seeded. ---- */
var EXTRA = [];
(function () {
  var c, L;
  for (c = 0; c < TILE; c++) {
    for (L = 0; L < LANES; L++) {
      if (rng() < 0.05) EXTRA.push(c * LANES + L);
    }
  }
})();
function hasHole(col, lane) {
  var c = ((col % TILE) + TILE) % TILE;
  if ((c + VOICE_OFFSET[lane]) % VOICE_PERIOD[lane] === 0) return true;
  var i;
  for (i = 0; i < EXTRA.length; i++) {
    if (EXTRA[i] === c * LANES + lane) return true;
  }
  return false;
}
function size() {
  var vw = 0, vh = 0;
  if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.width) {
    vw = window.visualViewport.width; vh = window.visualViewport.height;
  } else if (typeof window !== 'undefined' && window.innerWidth) {
    vw = window.innerWidth; vh = window.innerHeight;
  }
  VW = vw; VH = vh;
  canvas.width = VW; canvas.height = VH;
  canvas.style.width = VW + 'px'; canvas.style.height = VH + 'px';
  if (typeof window !== 'undefined' && window.screen) {
    var mn = Math.min(window.screen.width, window.screen.height);
    isPhone = mn < 700 || VH > VW * 1.15;
  }
}
function sceneRect() {
  if (isPhone) return { x: 0, y: 0, w: VW, h: VH };
  var s = Math.min(VW, VH);
  return { x: (VW - s) / 2, y: (VH - s) / 2, w: s, h: s };
}
/* roll geometry: paper band across the lower two thirds of the scene */
function rollGeom(sc) {
  var top = sc.y + sc.h * 0.34;
  var bot = sc.y + sc.h * 0.94;
  var colW = sc.w / 26;
  var laneH = (bot - top) / (LANES + 1);
  return { top: top, bot: bot, colW: colW, laneH: laneH, sceneX: sc.x,
    laneY: function (L) { return top + laneH * (L + 1); },
    strikeX: sc.x + sc.w * 0.62 };
}
function scrollOffset(t) {
  return (t * SCROLL) % 1;
}
/* strike amount for a lane at time t: 1 when a hole is exactly on the line */
function laneStrike(g, lane, t) {
  var off = scrollOffset(t);
  var colF = (g.strikeX - g.sceneX) / g.colW + off;
  var base = Math.floor(colF);
  var best = 0, k, c, dx;
  for (k = -1; k <= 1; k++) {
    c = base + k;
    if (!hasHole(c, lane)) continue;
    /* hole x on screen: sceneX + (c - off) * colW; strike line fixed */
    dx = Math.abs((g.sceneX + (c - off) * g.colW) - g.strikeX);
    var s = 1 - dx / (g.colW * 0.6);
    if (s > best) best = s;
  }
  return clamp(best, 0, 1);
}
function drawCabinet(sc) {
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = WALNUT;
  ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
  ctx.strokeStyle = WALNUT_LINE;
  ctx.lineWidth = 2;
  ctx.strokeRect(sc.x + 1, sc.y + 1, sc.w - 2, sc.h - 2);
  /* brass name strip on the cabinet top; clear of the title plate on phones */
  var sw = Math.min(sc.w * 0.34, 260);
  var sh = Math.max(16, sc.h * 0.028);
  var sx = isPhone ? sc.x + sc.w - sw - 12 : sc.x + (sc.w - sw) / 2;
  var sy = sc.y + sc.h * 0.015;
  ctx.fillStyle = BRASS_DARK;
  ctx.fillRect(sx, sy, sw, sh);
  ctx.strokeStyle = rgba(BRASS, 0.8000);
  ctx.lineWidth = 1;
  ctx.strokeRect(sx + 0.5, sy + 0.5, sw - 1, sh - 1);
  ctx.fillStyle = '#241811';
  ctx.font = 'bold ' + Math.max(9, Math.floor(sh * 0.55)) + 'px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('ORCHESTRION', sx + sw / 2, sy + sh / 2 + 0.5);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
}
function drawRoll(sc, g, t) {
  var off = scrollOffset(t);
  var L, c, x, y, r;
  /* paper */
  ctx.fillStyle = PAPER;
  ctx.fillRect(sc.x, g.top, sc.w, g.bot - g.top);
  /* soft shading at the roll edges */
  ctx.fillStyle = PAPER_SHADOW;
  ctx.fillRect(sc.x, g.top, sc.w, Math.max(2, g.laneH * 0.18));
  ctx.fillRect(sc.x, g.bot - Math.max(2, g.laneH * 0.18), sc.w, Math.max(2, g.laneH * 0.18));
  /* faint lane rules */
  ctx.strokeStyle = PAPER_LINE;
  ctx.lineWidth = 1;
  for (L = 0; L < LANES; L++) {
    y = g.laneY(L);
    ctx.beginPath();
    ctx.moveTo(sc.x, y);
    ctx.lineTo(sc.x + sc.w, y);
    ctx.stroke();
  }
  /* sprocket holes along the top and bottom margins of the paper */
  var spr = Math.max(2, g.colW * 0.10);
  var k, sx;
  var nSpr = Math.ceil(sc.w / (g.colW * 0.5)) + 3;
  for (k = -2; k < nSpr; k++) {
    sx = sc.x + k * g.colW * 0.5 - off * g.colW;
    if (sx < sc.x - g.colW || sx > sc.x + sc.w + g.colW) continue;
    ctx.fillStyle = HOLE;
    ctx.beginPath(); ctx.moveTo(sx + spr, g.top + g.laneH * 0.22);
    ctx.arc(sx, g.top + g.laneH * 0.22, spr, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(sx + spr, g.bot - g.laneH * 0.22);
    ctx.arc(sx, g.bot - g.laneH * 0.22, spr, 0, TAU); ctx.fill();
  }
  /* punched holes, scrolling right to left */
  r = Math.min(g.laneH * 0.26, g.colW * 0.55);
  r = Math.max(3, r);
  var firstCol = Math.floor(off) - 1;
  var lastCol = Math.ceil(sc.w / g.colW) + 2;
  for (c = firstCol; c < lastCol; c++) {
    x = sc.x + (c - off) * g.colW;
    if (x < sc.x - g.colW || x > sc.x + sc.w + g.colW) continue;
    for (L = 0; L < LANES; L++) {
      if (!hasHole(c, L)) continue;
      y = g.laneY(L);
      ctx.fillStyle = HOLE;
      ctx.beginPath(); ctx.moveTo(x + r, y);
      ctx.arc(x, y, r, 0, TAU); ctx.fill();
      /* paper rim highlight on the hole's lower edge */
      ctx.strokeStyle = rgba(PAPER, 0.9000);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x - r * 0.7, y + r * 0.7);
      ctx.arc(x, y, r, Math.PI * 0.25, Math.PI * 0.75);
      ctx.stroke();
    }
  }
  /* strike line: the reader the holes pass under */
  ctx.strokeStyle = rgba(BRASS, 0.5500);
  ctx.lineWidth = Math.max(1, g.colW * 0.05);
  ctx.beginPath();
  ctx.moveTo(g.strikeX, g.top);
  ctx.lineTo(g.strikeX, g.bot);
  ctx.stroke();
  /* walnut rails above and below the paper */
  ctx.fillStyle = WALNUT_DARK;
  ctx.fillRect(sc.x, g.top - Math.max(4, g.laneH * 0.16), sc.w, Math.max(4, g.laneH * 0.16));
  ctx.fillRect(sc.x, g.bot, sc.w, Math.max(4, g.laneH * 0.16));
}
/* The hammer bank: a brass reader bar at the strike line, one hammer per
   lane pivoting off it. Each hammer falls onto its own steel tine exactly
   when a hole in its lane passes the line. */
function drawHammers(sc, g, t) {
  var L, y, s, pivX, pivY, ang, hx, hy, armLen;
  var bankTop = sc.y + sc.h * 0.10;
  /* horizontal brass rod across the bank, with end posts */
  ctx.strokeStyle = BRASS_DARK;
  ctx.lineWidth = Math.max(2, g.laneH * 0.12);
  ctx.beginPath();
  ctx.moveTo(sc.x + 8, bankTop);
  ctx.lineTo(sc.x + sc.w - 8, bankTop);
  ctx.stroke();
  ctx.fillStyle = BRASS;
  ctx.beginPath(); ctx.moveTo(sc.x + 12, bankTop);
  ctx.arc(sc.x + 8, bankTop, Math.max(2, g.laneH * 0.10), 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(sc.x + sc.w - 4, bankTop);
  ctx.arc(sc.x + sc.w - 8, bankTop, Math.max(2, g.laneH * 0.10), 0, TAU); ctx.fill();
  /* reader bar: the strike line, brass, from the bank down through the roll */
  var barW = Math.max(3, g.laneH * 0.10);
  ctx.fillStyle = BRASS_DARK;
  ctx.fillRect(g.strikeX - barW / 2, bankTop, barW, g.bot - bankTop);
  ctx.fillStyle = rgba(BRASS, 0.6500);
  ctx.fillRect(g.strikeX - barW / 2, bankTop, 1, g.bot - bankTop);
  for (L = 0; L < LANES; L++) {
    y = g.laneY(L);
    s = laneStrike(g, L, t);
    armLen = g.laneH * 0.95;
    pivX = g.strikeX;
    pivY = y - armLen;
    /* steel tine: from the pivot down to the paper at this lane */
    ctx.strokeStyle = STEEL;
    ctx.lineWidth = Math.max(1.5, g.laneH * 0.09);
    ctx.beginPath();
    ctx.moveTo(pivX, pivY);
    ctx.lineTo(pivX, y);
    ctx.stroke();
    /* brass hammer: pivots down onto the tine when its hole passes */
    ang = -0.55 + s * 0.55;
    hx = pivX + Math.sin(ang) * armLen;
    hy = pivY + Math.cos(ang) * armLen;
    ctx.strokeStyle = BRASS_DARK;
    ctx.lineWidth = Math.max(2, g.laneH * 0.14);
    ctx.beginPath();
    ctx.moveTo(pivX, pivY);
    ctx.lineTo(hx, hy);
    ctx.stroke();
    ctx.fillStyle = BRASS;
    ctx.beginPath(); ctx.moveTo(hx + g.laneH * 0.20, hy);
    ctx.arc(hx, hy, g.laneH * 0.20, 0, TAU); ctx.fill();
    ctx.fillStyle = BRASS_DARK;
    ctx.beginPath(); ctx.moveTo(hx + g.laneH * 0.09, hy);
    ctx.arc(hx, hy, g.laneH * 0.09, 0, TAU); ctx.fill();
    /* pivot pin */
    ctx.fillStyle = STEEL_DARK;
    ctx.beginPath(); ctx.moveTo(pivX + 3, pivY);
    ctx.arc(pivX, pivY, 3, 0, TAU); ctx.fill();
    /* strike flash on the tine when the hammer lands */
    if (s > 0.55) {
      ctx.fillStyle = rgba(BRASS, (s - 0.55) / 0.45 * 0.9);
      ctx.beginPath(); ctx.moveTo(pivX + g.laneH * 0.28, y - g.laneH * 0.10);
      ctx.arc(pivX, y - g.laneH * 0.10, g.laneH * 0.28, 0, TAU); ctx.fill();
    }
  }
  /* voice count on the walnut rail below the roll */
  ctx.fillStyle = BRASS;
  ctx.font = 'bold ' + Math.max(9, Math.floor(sc.h * 0.016)) + 'px monospace';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillText('9 VOICES', sc.x + sc.w - 10, g.bot + Math.max(4, g.laneH * 0.16) + 4);
  ctx.textAlign = 'left';
}
function drawRollers(sc, g) {
  var cx, cy, r;
  r = Math.max(10, g.laneH * 0.55);
  cy = (g.top + g.bot) / 2;
  cx = sc.x - r * 0.35;
  ctx.fillStyle = WALNUT_DARK;
  ctx.beginPath(); ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = rgba(BRASS, 0.7000);
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx + r * 0.6, cy);
  ctx.arc(cx, cy, r * 0.6, 0, TAU); ctx.stroke();
  cx = sc.x + sc.w + r * 0.35;
  ctx.fillStyle = WALNUT_DARK;
  ctx.beginPath(); ctx.moveTo(cx + r, cy);
  ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = rgba(BRASS, 0.7000);
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx + r * 0.6, cy);
  ctx.arc(cx, cy, r * 0.6, 0, TAU); ctx.stroke();
}
function drawPlates() {
  var smallPx = isPhone ? 11 : 12;
  var titlePx = isPhone ? 16 : 20;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = 'bold ' + titlePx + 'px monospace';
  while (titlePx > 9 && ctx.measureText('Early Computers').width > VW - 60) {
    titlePx -= 1;
    ctx.font = 'bold ' + titlePx + 'px monospace';
  }
  var titleW = ctx.measureText('Early Computers').width;
  ctx.font = smallPx + 'px monospace';
  var dateW = ctx.measureText('2007 · 01 · 22').width;
  var plateW = Math.max(titleW, dateW) + 28;
  var plateH = titlePx + smallPx + 20;
  var plateX = 12, plateY = 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(plateX, plateY, plateW, plateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
  ctx.fillStyle = TITLE_INK;
  ctx.font = 'bold ' + titlePx + 'px monospace';
  ctx.fillText('Early Computers', plateX + 14, plateY + 7);
  ctx.font = smallPx + 'px monospace';
  ctx.fillStyle = HINT_INK;
  ctx.fillText('2007 · 01 · 22', plateX + 14, plateY + 7 + titlePx + 3);
  var hint = 'Watch only.';
  ctx.font = smallPx + 'px monospace';
  var hintW = ctx.measureText(hint).width;
  var hintPlateW = hintW + 24;
  var hintPlateH = smallPx + 14;
  var hintPlateX = 12;
  var hintPlateY = VH - hintPlateH - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(hintPlateX, hintPlateY, hintPlateW, hintPlateH);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(hintPlateX + 0.5, hintPlateY + 0.5, hintPlateW - 1, hintPlateH - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(hint, hintPlateX + 12, hintPlateY + 7);
  var snd = soundOn ? 'Sound: on' : 'Sound: off';
  ctx.font = smallPx + 'px monospace';
  var sndW = ctx.measureText(snd).width;
  soundPlate.w = sndW + 24;
  soundPlate.h = smallPx + 14;
  soundPlate.x = VW - soundPlate.w - 12;
  soundPlate.y = VH - soundPlate.h - 12;
  ctx.fillStyle = PLATE;
  ctx.fillRect(soundPlate.x, soundPlate.y, soundPlate.w, soundPlate.h);
  ctx.strokeStyle = PLATE_LINE;
  ctx.lineWidth = 1;
  ctx.strokeRect(soundPlate.x + 0.5, soundPlate.y + 0.5, soundPlate.w - 1, soundPlate.h - 1);
  ctx.fillStyle = HINT_INK;
  ctx.fillText(snd, soundPlate.x + 12, soundPlate.y + 7);
}
/* ---- sound: closed-form model, real WebAudio only after a tap ---- */
function ensureAudio() {
  if (typeof AudioContext === 'undefined') return null;
  if (!audioCtx) {
    try { audioCtx = new AudioContext(); } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
  return audioCtx;
}
function playPluck(lane) {
  var ac = ensureAudio();
  if (!ac || !soundOn) return;
  var now = ac.currentTime;
  var f = PITCH[lane % PITCH.length];
  try {
    var osc = ac.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(f, now);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.12, now + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
    osc.connect(g);
    g.connect(ac.destination);
    osc.start(now);
    osc.stop(now + 0.47);
  } catch (e) {}
}
function maybePlucks(t) {
  if (!soundOn || lastT === null) return;
  var L;
  for (L = 0; L < LANES; L++) {
    if (laneStrike(rollGeomCache, L, lastT) < 0.9 && laneStrike(rollGeomCache, L, t) >= 0.9) playPluck(L);
  }
}
var rollGeomCache = null;
function draw() {
  size();
  var sc = sceneRect();
  var t = phaseT;
  var g = rollGeom(sc);
  rollGeomCache = g;
  drawCabinet(sc);
  drawRoll(sc, g, t);
  drawHammers(sc, g, t);
  drawRollers(sc, g);
  drawPlates();
  maybePlucks(t);
  lastT = t;
}
if (typeof window !== 'undefined') {
  window.__probe = {
    drawAt: function (t) { phaseT = t; draw(); },
    activeAt: function (t) {
      var sc = sceneRect();
      var g = rollGeom(sc);
      var n = 0, L;
      for (L = 0; L < LANES; L++) if (laneStrike(g, L, t) > 0.5) n++;
      return n;
    },
    holeCount: (function () {
      var n = 0, c, L;
      for (c = 0; c < TILE; c++) for (L = 0; L < LANES; L++) if (hasHole(c, L)) n++;
      return n;
    })()
  };
}
/* ---- frame one: fixed phase t = 47.8 s, roll mid-scroll, two lanes striking ---- */
size();
if (typeof window !== 'undefined' && window.visualViewport && window.visualViewport.addEventListener) window.visualViewport.addEventListener('resize', size);
if (typeof window !== 'undefined' && window.addEventListener) window.addEventListener('resize', size);
if (typeof canvas !== 'undefined' && canvas.addEventListener) {
  canvas.addEventListener('click', function (ev) {
    var rect = { left: 0, top: 0 };
    try { rect = canvas.getBoundingClientRect(); } catch (e) {}
    var x = ev.clientX - rect.left;
    var y = ev.clientY - rect.top;
    if (x >= soundPlate.x && x <= soundPlate.x + soundPlate.w && y >= soundPlate.y && y <= soundPlate.y + soundPlate.h) {
      soundOn = !soundOn;
      if (soundOn) ensureAudio();
      draw();
    }
  });
}
draw();
if (!reduced && typeof requestAnimationFrame !== 'undefined') {
  (function loop() {
    var t0 = null, prevTs = null, clockT = 0;
    function step(now) {
      if (t0 === null) t0 = now;
      if (prevTs === null) prevTs = now;
      var dt = clamp((now - prevTs) / 1000, 0, 0.05);
      prevTs = now;
      clockT += dt;
      phaseT = (FRAME_T + clockT) % 86400;
      var hidden = false;
      try { hidden = document.hidden; } catch (e) { hidden = false; }
      if (!hidden) draw();
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
}
</script>
</body>
</html>
