<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Buttons — №1172</title>
<style>
  html, body { margin: 0; padding: 0; background: #0A0A0C; height: 100%; overflow: hidden; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(function () {
  'use strict';

  // ---------- seeded RNG (mulberry32 only) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- palette ----------
  var BG = '#0A0A0C';
  var INK = '#E8E8E8';       // glyph paper
  var INK_DIM = '#8A8A8A';   // bayer second tone
  var SEL = '#00FFC2';       // selected state
  var GLOW = '#FFE14D';      // front glow
  var GRID = '#1E1E22';      // grid lines
  var STRIP_BG = '#0D0D10';

  // ---------- constants ----------
  var LOOP = 24;             // seconds, four 6s patterns
  var PATTERN_LEN = 6;
  var PATTERN_NAMES = ['SWEEP', 'FUGUE', 'CANON', 'SELECT_ALL'];
  var T0 = 3.2;              // fixed first-frame phase: SWEEP, front mid-grid
  var STRIP_H = 30;

  // glyph types
  var G_RADIO = 0, G_CHECK = 1, G_SCROLL = 2, G_RESIZE = 3, G_CLOSE = 4;

  // ---------- phone detection ----------
  var sw = 0, sh = 0;
  if (typeof window !== 'undefined' && window.screen) {
    sw = window.screen.width || 0;
    sh = window.screen.height || 0;
  }
  var minScreen = Math.min(sw || 9999, sh || 9999);

  // ---------- canvas ----------
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');

  function viewW() {
    if (window.visualViewport && window.visualViewport.width) return window.visualViewport.width;
    return window.innerWidth || 800;
  }
  function viewH() {
    if (window.visualViewport && window.visualViewport.height) return window.visualViewport.height;
    return window.innerHeight || 800;
  }

  var W = 0, H = 0, isPhone = false;

  // ---------- grid model (rebuilt on resize) ----------
  var cols = 0, rows = 0, pitchX = 40, pitchY = 40, glyphSize = 28;
  var cellType = [];   // per-cell glyph type
  var cellTone = [];   // per-cell bayer tone flag (0 bright, 1 dim)

  var BAYER = [
    [0, 8, 2, 10],
    [12, 4, 14, 6],
    [3, 11, 1, 9],
    [15, 7, 13, 5]
  ];

  function buildGrid() {
    var gridH = H - STRIP_H;
    var target = isPhone ? 36 : 40;         // ~28px glyph + 12px gutter
    cols = Math.max(1, Math.floor(W / target));
    rows = Math.max(1, Math.floor(gridH / target));
    pitchX = W / cols;
    pitchY = gridH / rows;
    glyphSize = Math.min(pitchX, pitchY) - 12;
    if (glyphSize < 10) glyphSize = 10;
    cellType = new Array(cols * rows);
    cellTone = new Array(cols * rows);
    var rng = mulberry32(1172005);
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var i = r * cols + c;
        var v = rng();
        cellType[i] = v < 0.30 ? G_RADIO
                    : v < 0.58 ? G_CHECK
                    : v < 0.74 ? G_SCROLL
                    : v < 0.88 ? G_RESIZE
                    : G_CLOSE;
        cellTone[i] = BAYER[r % 4][c % 4] < 8 ? 0 : 1;
      }
    }
  }

  function fit() {
    W = viewW(); H = viewH();
    var aspectPhone = H > W * 1.15;
    isPhone = minScreen < 700 || (minScreen === 9999 && aspectPhone);
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    buildGrid();
  }

  // ---------- pattern state: pure function of (col,row,pattern,pt) ----------
  function frac(x) { return x - Math.floor(x); }
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function tri(x) { var f = frac(x); return f < 0.5 ? f * 2 : 2 - f * 2; }

  // returns {sel:boolean, glow:0..1, thumb:0..1}
  function cellState(c, r, pattern, pt) {
    var diag = (cols + rows - 2) > 0 ? (c + r) / (cols + rows - 2) : 0;
    if (pattern === 0) {
      // SWEEP: diagonal front crosses twice per 6s (3s cycle, phase-offset
      // so the fixed first frame at pt=3.2 sits mid-grid).
      var front = -0.08 + 1.16 * frac((pt + 1.3) / 3);
      var sel = diag <= front;
      var glow = Math.abs(diag - front) <= 0.045 ? 0.20 : 0;
      return { sel: sel, glow: glow, thumb: sel ? 1 : 0 };
    }
    if (pattern === 1) {
      // FUGUE: checkerboard toggling every 0.75s, rows offset in canon.
      var localT = pt + r * 0.1875;
      var tick = Math.floor(localT / 0.75);
      var s = ((c + r + tick) % 2) === 0;
      return { sel: s, glow: 0, thumb: s ? 1 : 0 };
    }
    if (pattern === 2) {
      // CANON: column phase is a triangle wave delayed per column; a cell
      // selects once its column's thumb head has passed its row.
      var phase = tri((pt - c * 0.12) / 3);
      var rowFrac = rows > 1 ? r / (rows - 1) : 0;
      var selC = rowFrac <= phase;
      return { sel: selC, glow: 0, thumb: phase };
    }
    // SELECT_ALL: all select at pt=1, hold, all deselect at pt=4.
    var selA = pt >= 1 && pt < 4;
    var breathe = selA ? 0.08 + 0.05 * (0.5 + 0.5 * Math.sin((pt - 1) * (Math.PI * 2 / 3))) : 0;
    return { sel: selA, glow: breathe, thumb: selA ? 1 : 0 };
  }

  function shudderOffset(pattern, pt) {
    if (pattern !== 3) return 0;
    var inWin = (pt >= 1 && pt < 1.1) || (pt >= 4 && pt < 4.1);
    if (!inWin) return 0;
    var start = pt < 2 ? 1 : 4;
    return (Math.floor((pt - start) / 0.05) % 2 === 0) ? 2 : -2;
  }

  // ---------- glyph drawing ----------
  function drawGlyph(type, x, y, s, state, tone) {
    var stroke = state.sel ? SEL : (tone === 0 ? INK : INK_DIM);
    var cx = x + s / 2, cy = y + s / 2;
    ctx.lineWidth = Math.max(1.6, s * 0.085);
    ctx.strokeStyle = stroke;
    ctx.fillStyle = stroke;

    if (type === G_RADIO) {
      ctx.beginPath();
      ctx.moveTo(cx + s * 0.36, cy);
      ctx.arc(cx, cy, s * 0.36, 0, Math.PI * 2);
      ctx.stroke();
      if (state.sel) {
        ctx.beginPath();
        ctx.moveTo(cx + s * 0.155, cy);
        ctx.arc(cx, cy, s * 0.155, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (type === G_CHECK) {
      var b = s * 0.31;
      if (state.sel) {
        ctx.fillRect(cx - b, cy - b, b * 2, b * 2);
        ctx.strokeStyle = BG;
        ctx.lineWidth = Math.max(1.8, s * 0.1);
        ctx.beginPath();
        ctx.moveTo(cx - b * 0.55, cy + s * 0.01);
        ctx.lineTo(cx - b * 0.12, cy + b * 0.5);
        ctx.lineTo(cx + b * 0.6, cy - b * 0.45);
        ctx.stroke();
      } else {
        ctx.strokeRect(cx - b, cy - b, b * 2, b * 2);
      }
    } else if (type === G_SCROLL) {
      var tw = s * 0.44, th = s * 0.15;
      ctx.strokeRect(cx - tw, cy - th, tw * 2, th * 2);
      var thumbW = s * 0.30;
      var travel = tw * 2 - thumbW;
      var tx = cx - tw + state.thumb * travel;
      if (state.sel) ctx.fillStyle = SEL; else ctx.fillStyle = stroke;
      ctx.fillRect(tx, cy - th, thumbW, th * 2);
    } else if (type === G_RESIZE) {
      // corner grip at bottom-right: two L lines + three dots
      var g = s * 0.34;
      ctx.beginPath();
      ctx.moveTo(cx + g, cy - g * 0.2);
      ctx.lineTo(cx + g, cy + g);
      ctx.lineTo(cx - g * 0.2, cy + g);
      ctx.moveTo(cx + g * 0.45, cy + g * 0.1);
      ctx.lineTo(cx + g * 0.45, cy + g * 0.45);
      ctx.lineTo(cx + g * 0.1, cy + g * 0.45);
      ctx.stroke();
      var dots = [[0.12, 0.62], [0.62, 0.12], [0.62, 0.62]];
      for (var d = 0; d < 3; d++) {
        var dx = cx + dots[d][0] * g;
        var dy = cy + dots[d][1] * g;
        ctx.beginPath();
        ctx.moveTo(dx + s * 0.05, dy);
        ctx.arc(dx, dy, s * 0.05, 0, Math.PI * 2);
        ctx.fill();
      }
    } else { // G_CLOSE
      var q = s * 0.30;
      ctx.strokeRect(cx - q, cy - q, q * 2, q * 2);
      var xi = q * 0.55;
      ctx.beginPath();
      ctx.moveTo(cx - xi, cy - xi);
      ctx.lineTo(cx + xi, cy + xi);
      ctx.moveTo(cx + xi, cy - xi);
      ctx.lineTo(cx - xi, cy + xi);
      ctx.stroke();
      if (state.sel) {
        ctx.fillStyle = SEL;
        ctx.fillRect(cx - q, cy - q, q * 2, q * 0.22);
      }
    }
  }

  // ---------- draw ----------
  function draw(t) {
    fit();
    var loopT = ((t % LOOP) + LOOP) % LOOP;
    var pattern = Math.floor(loopT / PATTERN_LEN) % 4;
    var pt = loopT % PATTERN_LEN;
    var gridH = H - STRIP_H;

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    var ox = shudderOffset(pattern, pt);

    // grid lines
    ctx.strokeStyle = GRID;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var c = 0; c <= cols; c++) {
      var lx = Math.round(c * pitchX) + 0.5;
      ctx.moveTo(lx, 0);
      ctx.lineTo(lx, gridH);
    }
    for (var r = 0; r <= rows; r++) {
      var ly = Math.round(r * pitchY) + 0.5;
      ctx.moveTo(0, ly);
      ctx.lineTo(W, ly);
    }
    ctx.stroke();

    // cells
    for (var rr = 0; rr < rows; rr++) {
      for (var cc = 0; cc < cols; cc++) {
        var i = rr * cols + cc;
        var st = cellState(cc, rr, pattern, pt);
        var cellX = cc * pitchX, cellY = rr * pitchY;
        var gx = cellX + (pitchX - glyphSize) / 2 + ox;
        var gy = cellY + (pitchY - glyphSize) / 2;
        if (st.glow > 0) {
          ctx.globalAlpha = st.glow;
          ctx.fillStyle = GLOW;
          ctx.fillRect(cellX + ox, cellY, pitchX, pitchY);
          ctx.globalAlpha = 1;
        }
        drawGlyph(cellType[i], gx, gy, glyphSize, st, cellTone[i]);
      }
    }

    // status strip
    ctx.fillStyle = STRIP_BG;
    ctx.fillRect(0, gridH, W, STRIP_H);
    ctx.fillStyle = GRID;
    ctx.fillRect(0, gridH, W, 1);
    ctx.fillStyle = INK;
    ctx.font = '13px monospace';
    ctx.textBaseline = 'middle';
    ctx.fillText('PATTERN: ' + PATTERN_NAMES[pattern], 12, gridH + STRIP_H / 2 + 1);
    // pattern progress segment
    var barW = Math.min(140, W * 0.25);
    var barX = W - barW - 12;
    var barY = gridH + STRIP_H / 2 - 3;
    ctx.fillStyle = GRID;
    ctx.fillRect(barX, barY, barW, 6);
    ctx.fillStyle = SEL;
    ctx.fillRect(barX, barY, barW * (pt / PATTERN_LEN), 6);
    // overall loop position dots
    ctx.fillStyle = INK_DIM;
    var dotsLabel = (pattern + 1) + ' / 4';
    ctx.fillText(dotsLabel, barX - 44, gridH + STRIP_H / 2 + 1);
  }

  // ---------- clock: anchored phase + elapsed ----------
  var anchorT = T0;        // loop time at anchorStamp
  var anchorStamp = null;  // rAF timestamp at anchor
  var lastT = T0;
  var dragging = false;
  var dragStartX = 0;
  var dragBaseT = T0;

  function currentT(stamp) {
    if (dragging) return dragBaseT + ((lastPointerX - dragStartX) / Math.max(1, W)) * LOOP;
    if (anchorStamp === null || typeof stamp !== 'number') return anchorT;
    return anchorT + (stamp - anchorStamp) / 1000;
  }

  var lastPointerX = 0;

  function frame(stamp) {
    if (!dragging && anchorStamp === null && typeof stamp === 'number') anchorStamp = stamp;
    var t = currentT(stamp);
    lastT = t;
    draw(t);
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
  }

  // ---------- interaction: horizontal drag scrubs the timeline ----------
  function ptrX(e) {
    if (e.clientX !== undefined) return e.clientX;
    if (e.touches && e.touches[0]) return e.touches[0].clientX;
    return 0;
  }
  function onDown(e) {
    dragging = true;
    dragStartX = ptrX(e);
    lastPointerX = dragStartX;
    dragBaseT = lastT;
    if (e.preventDefault) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    lastPointerX = ptrX(e);
    draw(currentT(null));
  }
  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    // re-anchor: resume from the scrubbed position
    anchorT = ((currentT(null) % LOOP) + LOOP) % LOOP;
    anchorStamp = null; // set on next rAF tick
    lastT = anchorT;
  }
  if (canvas.addEventListener) {
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
    canvas.addEventListener('pointerup', onUp);
    canvas.addEventListener('pointercancel', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onUp);
  }

  if (window.addEventListener) {
    window.addEventListener('resize', function () { draw(lastT); });
  }
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { draw(lastT); });
  }

  // synchronous fixed-phase first frame
  draw(T0);

  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(function (stamp) {
      anchorStamp = stamp;
      frame(stamp);
    });
  }
})();
</script>
</body>
</html>
