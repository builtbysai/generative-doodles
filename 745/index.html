<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ganzfeld Clear</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #46D8C8;
    overflow: hidden;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('field');
  var ctx = canvas.getContext('2d');

  // Palette anchors, in bath order. Nothing else is ever drawn.
  var ANCHORS = [
    [70, 216, 200],   // turquoise #46D8C8
    [224, 74, 208],   // magenta   #E04AD0
    [240, 168, 64],   // amber     #F0A840
    [122, 90, 232]    // violet    #7A5AE8
  ];
  var WHITE = [255, 255, 255];

  var LOOP = 720;        // 12 minutes, seamless
  var SEG = 180;         // one bath segment: 3 minutes
  var HOLD = 160;        // hold, then a 20 s crossfade to the next anchor
  var FADE = SEG - HOLD; // 20
  var BREATH_PERIOD = 24;         // 30 full breaths per loop: seamless
  var BREATH_AMP = 0.03;          // plus or minus 3 percent luminance
  var STROBE_T = 360;             // once per cycle, mid-cycle
  var STROBE_TAU = 0.04;          // fast decay: about 120 ms to near zero

  function smooth(u) {
    if (u <= 0) return 0;
    if (u >= 1) return 1;
    return u * u * (3 - 2 * u);
  }

  function lerp(a, b, u) { return a + (b - a) * u; }

  // The field color as a pure closed-form function of loop time t (seconds).
  function fieldColor(t) {
    var tt = ((t % LOOP) + LOOP) % LOOP;
    var seg = Math.floor(tt / SEG);
    var local = tt - seg * SEG;
    var A = ANCHORS[seg % 4];
    var B = ANCHORS[(seg + 1) % 4];
    var r, g, b;
    if (local < HOLD) {
      r = A[0]; g = A[1]; b = A[2];
    } else {
      var u = smooth((local - HOLD) / FADE);
      r = lerp(A[0], B[0], u);
      g = lerp(A[1], B[1], u);
      b = lerp(A[2], B[2], u);
    }
    // Breathing: a small sinusoidal luminance envelope, phase 0 at t = 0.
    var lum = 1 + BREATH_AMP * Math.sin(2 * Math.PI * tt / BREATH_PERIOD);
    r *= lum; g *= lum; b *= lum;
    // Strobe: one white burst at mid-cycle, exponential decay.
    if (tt >= STROBE_T) {
      var a = Math.exp(-(tt - STROBE_T) / STROBE_TAU);
      if (a > 0.001) {
        r = lerp(r, WHITE[0], a);
        g = lerp(g, WHITE[1], a);
        b = lerp(b, WHITE[2], a);
      }
    }
    function cl(v) { return Math.max(0, Math.min(255, Math.round(v))); }
    return [cl(r), cl(g), cl(b)];
  }

  function rgbString(c) {
    return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
  }

  var W = 0, H = 0, DPR = 1;

  function resize() {
    var vv = window.visualViewport;
    W = vv ? vv.width : window.innerWidth;
    H = vv ? vv.height : window.innerHeight;
    DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
  }

  function draw(t) {
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    var c = fieldColor(t);
    var s = rgbString(c);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = s;
    ctx.fillRect(0, 0, W, H);
    if (document.body && document.body.style) document.body.style.background = s;
  }

  // Inert QA hook (house convention): ?seed=tNN draws frame one at loop
  // time NN seconds. Without the parameter the piece starts at t = 0.
  var startT = 0;
  var searchStr = (window.location && window.location.search) ||
    (typeof location !== 'undefined' ? location.search : '') || '';
  var m = /[?&]seed=t(\d+(?:\.\d+)?)/.exec(searchStr);
  if (m) startT = parseFloat(m[1]);

  resize();
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function () { resize(); draw(startT); });
  }
  window.addEventListener('resize', function () { resize(); draw(startT); });

  // Frame one: the synchronous draw at loop t = 0 (turquoise, breath phase 0).
  draw(startT);

  if (typeof requestAnimationFrame === 'function') {
    var t0 = null;
    var frame = function (ts) {
      if (t0 === null) t0 = ts;
      draw(startT + (ts - t0) / 1000);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
