<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8943 — Wrong Octave, Right Key</title>
<!-- phantom-fill-8943 -->
<style>
  :root{--bg:#f4efe4;--ink:#1c1a16;--dim:#7d7668;--red:#c43d2b;--blue:#2b4c7e;--line:#d8d0bc}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;display:flex;flex-direction:column;align-items:center;overflow:hidden}
  header{width:100%;max-width:1100px;padding:26px 24px 0;display:flex;justify-content:space-between;align-items:baseline}
  h1{font-size:clamp(22px,4vw,34px);font-weight:400}
  .no{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--dim);letter-spacing:.22em}
  .sub{width:100%;max-width:1100px;padding:8px 24px 0;color:var(--dim);font-style:italic;font-size:15px}
  main{flex:1;width:100%;max-width:1100px;min-height:0;padding:14px 24px 0;display:flex;flex-direction:column}
  #roll{width:100%;flex:1;display:block}
  .readout{display:flex;gap:48px;padding:14px 2px 0;font-family:ui-monospace,Menlo,monospace}
  .readout b{display:block;font-size:24px;font-weight:600}
  .readout span{font-size:11px;letter-spacing:.16em;color:var(--dim)}
  #stretchVal{color:var(--red)}
  #drift{color:var(--blue)}
  .controls{width:100%;max-width:1100px;padding:12px 24px 0;display:flex;align-items:center;gap:18px}
  .controls label{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.16em;color:var(--dim);white-space:nowrap}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:var(--line);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--red);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--red);cursor:grab}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--red);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--red);cursor:grab}
  .tick{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim)}
  footer{padding:16px 24px 24px;display:flex;gap:16px;align-items:center;color:var(--dim);font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.14em}
  button{background:none;border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:11px;letter-spacing:.16em;padding:10px 18px;cursor:pointer}
  button:hover{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>
<header><h1>Wrong Octave, Right Key</h1><div class="no">№ 8943</div></header>
<p class="sub">Stretch the octave from 2.0 to 2.6 under a familiar tune. It stays recognizable while the tonic refuses to resolve.</p>
<main>
  <canvas id="roll"></canvas>
  <div class="readout">
    <div><b id="stretchVal">2.00×</b><span>OCTAVE STRETCH</span></div>
    <div><b id="drift">+0¢</b><span>TONIC DRIFT</span></div>
    <div><b id="note">—</b><span>NOW PLAYING</span></div>
  </div>
</main>
<div class="controls">
  <label>STRETCH</label><span class="tick">2.00</span>
  <input type="range" id="stretch" min="2" max="2.6" step="0.01" value="2">
  <span class="tick">2.60</span>
</div>
<footer><span>DRAG THE STRETCH — THE TUNE KEEPS PLAYING</span><button id="play">PLAY ▸</button><button id="reset">RESET 2.00</button><button id="mute">MUTE</button></footer>
<script>
(function(){
"use strict";
// Ode to Joy, semitones above C4. f = 261.63 * stretch^(n/12):
// at stretch 2.0 the tune is normal; at 2.6 every octave is 2.6x wide,
// so intervals keep their shape in log space but the tonic never lands.
var MEL = [4,4,5,7,7,5,4,2,0,0,2,4,4,2,2, 4,4,5,7,7,5,4,2,0,0,2,4,2,0,0];
var NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var F0 = 261.63, STEP_MS = 420;
var stretch = 2.0, playing = false, idx = -1, timer = null;
var stretchEl = document.getElementById('stretch');
var stretchVal = document.getElementById('stretchVal');
var driftEl = document.getElementById('drift'), noteEl = document.getElementById('note');
function freq(n){ return F0 * Math.pow(stretch, n / 12); }

// --- audio ---
var ctx = null, master = null, muted = false;
function ensureCtx(){
  if(!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    window.__ac = ctx;
    master = ctx.createGain(); master.gain.value = 0.9;
    master.connect(ctx.destination);
  }
  if(ctx.state === 'suspended' && !muted) ctx.resume();
}
document.addEventListener('visibilitychange', function(){
  if(!ctx) return;
  if(document.hidden) ctx.suspend(); else if(!muted) ctx.resume();
});
window.addEventListener('blur', function(){ if(ctx) ctx.suspend(); });
window.addEventListener('focus', function(){ if(ctx && !muted) ctx.resume(); });
window.addEventListener('beforeunload', function(){ if(ctx) ctx.close(); });
document.getElementById('mute').addEventListener('click', function(){
  ensureCtx();
  muted = !muted;
  this.textContent = muted ? 'UNMUTE' : 'MUTE';
  master.gain.setTargetAtTime(muted ? 0 : 0.9, ctx.currentTime, 0.05);
  if(muted) ctx.suspend(); else ctx.resume();
});
function pluck(f){
  var t = ctx.currentTime;
  var o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'triangle'; o.frequency.value = f;
  o2.type = 'sine'; o2.frequency.value = f * 2;
  var g2 = ctx.createGain(); g2.gain.value = 0.3;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.3, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
  o.start(t); o2.start(t); o.stop(t + 0.45); o2.stop(t + 0.45);
}
function tick(){
  idx = (idx + 1) % MEL.length;
  var n = MEL[idx];
  pluck(freq(n));
  noteEl.textContent = NAMES[n] + '4 · ' + freq(n).toFixed(1) + ' Hz';
  draw();
}
document.getElementById('play').addEventListener('click', function(){
  ensureCtx();
  playing = !playing;
  this.textContent = playing ? 'PAUSE' : 'PLAY ▸';
  if(playing){ tick(); timer = setInterval(tick, STEP_MS); }
  else { clearInterval(timer); idx = -1; noteEl.textContent = '—'; draw(); }
});
document.getElementById('reset').addEventListener('click', function(){
  stretch = 2.0; stretchEl.value = '2'; updateReadouts(); draw();
});
stretchEl.addEventListener('input', function(){
  stretch = parseFloat(stretchEl.value);
  updateReadouts(); draw();
});
function updateReadouts(){
  stretchVal.textContent = stretch.toFixed(2) + '×';
  var cents = Math.round(1200 * Math.log2(stretch / 2));
  driftEl.textContent = (cents >= 0 ? '+' : '') + cents + '¢';
}

// --- piano roll + octave ruler ---
var cv = document.getElementById('roll'), cx2 = cv.getContext('2d');
function resize(){
  var r = cv.getBoundingClientRect();
  cv.width = r.width; cv.height = r.height;
  draw();
}
window.addEventListener('resize', resize);
function draw(){
  var W = cv.width, H = cv.height;
  if(!W || !H) return;
  cx2.clearRect(0, 0, W, H);
  var rollH = H - 112, top = 8;
  var bw = W / MEL.length;
  // octave gridlines (log2 of 1, 2, 3 in stretched space)
  cx2.strokeStyle = 'rgba(28,26,22,0.10)'; cx2.lineWidth = 1;
  [0, 1].forEach(function(o){
    var y = top + rollH - (o / 1.0) * rollH;
    cx2.beginPath(); cx2.moveTo(0, y); cx2.lineTo(W, y); cx2.stroke();
  });
  // note bars
  MEL.forEach(function(n, i){
    var f = freq(n);
    var lg = Math.log2(f / F0); // 0..~0.78
    var y = top + rollH - (lg / 1.0) * rollH - 7;
    cx2.fillStyle = i === idx ? '#c43d2b' : '#1c1a16';
    cx2.fillRect(i * bw + 2, y, bw - 4, 14);
    if(i === idx){
      cx2.fillStyle = '#c43d2b';
      cx2.font = '11px ui-monospace, Menlo, monospace';
      cx2.textAlign = 'left';
      cx2.fillText(NAMES[n], i * bw + 2, y - 6);
    }
  });
  // playhead
  if(idx >= 0){
    cx2.strokeStyle = 'rgba(196,61,43,0.4)';
    cx2.beginPath();
    cx2.moveTo(idx * bw + bw / 2, top);
    cx2.lineTo(idx * bw + bw / 2, top + rollH);
    cx2.stroke();
  }
  // octave ruler
  var ry = H - 52, rx0 = 60, rx1 = W - 60;
  cx2.strokeStyle = '#1c1a16'; cx2.lineWidth = 1.5;
  cx2.beginPath(); cx2.moveTo(rx0, ry); cx2.lineTo(rx1, ry); cx2.stroke();
  function rulerX(logv){ return rx0 + (logv / 1.5) * (rx1 - rx0); }
  cx2.fillStyle = '#1c1a16';
  cx2.font = '11px ui-monospace, Menlo, monospace';
  cx2.textAlign = 'center';
  // tonic
  cx2.fillRect(rulerX(0) - 1, ry - 8, 2, 16);
  cx2.fillText('TONIC', rulerX(0), ry + 28);
  // expected octave 2.00x
  cx2.fillStyle = '#2b4c7e';
  cx2.fillRect(rulerX(1) - 1, ry - 8, 2, 16);
  cx2.fillText('EXPECTED 2.00×', rulerX(1), ry - 16);
  // actual octave stretch x
  cx2.fillStyle = '#c43d2b';
  var ax = rulerX(Math.log2(stretch));
  cx2.fillRect(ax - 1, ry - 8, 2, 16);
  cx2.fillText('ACTUAL ' + stretch.toFixed(2) + '×', ax, ry + 28);
  // drift bracket
  if(stretch > 2.005){
    cx2.strokeStyle = '#c43d2b'; cx2.lineWidth = 1;
    cx2.beginPath();
    cx2.moveTo(rulerX(1), ry - 26); cx2.lineTo(ax, ry - 26);
    cx2.moveTo(rulerX(1), ry - 30); cx2.lineTo(rulerX(1), ry - 22);
    cx2.moveTo(ax, ry - 30); cx2.lineTo(ax, ry - 22);
    cx2.stroke();
  }
}
updateReadouts();
resize();
})();
</script>
</body>
</html>
