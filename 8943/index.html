<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>&#8470;8943 &middot; Wrong Octave, Right Key</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #070a14;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; display: block; cursor: crosshair; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 100%);
  }
  .ui {
    position: fixed; z-index: 3; pointer-events: none;
    color: rgba(235, 242, 255, 0.62);
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  }
  .ui .num { color: rgba(255, 196, 120, 0.9); }
  #title { top: 18px; left: 20px; }
  #title .sub { display: block; margin-top: 6px; font-size: 9px; letter-spacing: 0.18em; color: rgba(235,242,255,0.36); }
  #hint { bottom: 16px; right: 20px; text-align: right; font-size: 9px; color: rgba(235,242,255,0.36); }
  #seedline { bottom: 16px; left: 20px; font-size: 9px; color: rgba(235,242,255,0.30); }
  #fade {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: #070a14; opacity: 1; transition: opacity 0.6s ease;
  }
  @media (max-width: 620px) {
    #seedline { bottom: 38px; }
    #hint { font-size: 8px; }
    #title { font-size: 10px; }
  }
</style>
</head>
<body>
<div class="vignette"></div>
<div class="ui" id="title"><span class="num">&#8470;8943</span> &middot; Wrong Octave, Right Key<span class="sub">seed 238 &middot; the pseudo-octave stretches, the tune survives</span></div>
<div class="ui" id="hint">drag the stretch &middot; tap for sound &middot; click reseeds</div>
<div class="ui" id="seedline"></div>
<div id="fade"></div>
<script>
"use strict";
/* Seed 238: Mathews/Pierce 1980. Key sensing survives pseudo-octave
   stretching (A=2.0 to 2.6); cadence finality does not. The melody stays
   recognizable the whole way; the tonic chord will not resolve. */
let seed = 238001;
let rng;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

let A = 2.0, targetA = 2.0, autoSweep = true, sweepDir = 1;
let melody, noteIdx = 0, noteT = 0, comet = null, ripples = [];
let audioOn = false, actx = null, masterGain = null;
let tonicNodes = [];
let W = 0, H = 0, towerX = 0, towerTop = 0, towerBot = 0, towerW = 0;
let slider = {x:0, y:0, w:0, h:0, dragging:false};
let palette, dust = [], melodyTrail = [];

/* Frere Jacques in semitone offsets from tonic */
const PHRASE = [0,2,4,0, 0,2,4,0, 4,5,7, 4,5,7, 7,9,7,5,4,0, 7,9,7,5,4,0, 0,-5,0, 0,-5,0];
const NOTE_DUR = 0.42;

function pickPalette(r){
  const sets = [
    {rung:[255,196,120], comet:[255,244,220], tonic:[120,220,200], bg:[7,10,20]},
    {rung:[255,170,150], comet:[255,240,235], tonic:[150,200,255], bg:[10,8,16]},
    {rung:[190,220,255], comet:[240,248,255], tonic:[255,200,140], bg:[6,10,16]},
    {rung:[220,255,190], comet:[250,255,240], tonic:[255,170,190], bg:[8,12,10]}
  ];
  return sets[Math.floor(r()*sets.length)];
}

function setup(){
  const c = createCanvas(windowWidth, windowHeight);
  c.id('stage');
  rng = mulberry32(seed);
  palette = pickPalette(rng);
  layout();
  buildMelody();
  dust = [];
  for(let i=0;i<90;i++) dust.push({x: rng(), y: rng(), s: 0.4+rng()*1.4, v: 0.0002+rng()*0.0006});
  document.getElementById('fade').style.opacity = '0';
  updateSeedline();
}

function layout(){
  W = width; H = height;
  towerX = W*0.5;
  towerTop = H*0.12; towerBot = H*0.74;
  towerW = Math.min(W*0.52, 520);
  slider.w = Math.min(W*0.6, 420); slider.h = 26;
  slider.x = W/2 - slider.w/2; slider.y = H*0.885;
}

function windowResized(){
  resizeCanvas(windowWidth, windowHeight);
  layout();
}

function buildMelody(){
  melody = PHRASE.map(st => ({st: st}));
  noteIdx = 0; noteT = 0;
  melodyTrail = [];
  comet = {st: melody[0].st, x: towerX, y: rungY(0), px: towerX, py: rungY(0)};
  tonicNodes = [0, 4, 7].map(st => ({st: st, phase: rng()*6.28}));
}

function rungY(st){
  /* pitch position: log height under current A, st semitones -> A^(st/12) */
  const oct = st/12;
  const span = Math.log(Math.pow(A, 4)) ; /* 4 pseudo-octaves of travel */
  const t = (oct*Math.log(A)) / span;
  return towerBot - t*(towerBot-towerTop);
}

function rungYFor(st, a){
  const span = Math.log(Math.pow(a, 4));
  const t = (st/12*Math.log(a)) / span;
  return towerBot - t*(towerBot-towerTop);
}

function freqOf(st){
  return 220 * Math.pow(A, st/12);
}

function updateSeedline(){
  document.getElementById('seedline').textContent =
    'seed ' + seed + ' · A = ' + A.toFixed(3) + ' · ' + (audioOn ? 'sound on' : 'sound off');
}

function draw(){
  background(palette.bg[0], palette.bg[1], palette.bg[2]);
  if(autoSweep){
    targetA += 0.0016*sweepDir;
    if(targetA > 2.6){ targetA = 2.6; sweepDir = -1; }
    if(targetA < 2.0){ targetA = 2.0; sweepDir = 1; }
  }
  A += (targetA - A)*0.06;

  drawBackgroundField();
  drawTower();
  drawTonic();
  advanceMelody();
  drawComet();
  drawRipples();
  drawSlider();
  if(frameCount % 20 === 0) updateSeedline();
}

function drawBackgroundField(){
  /* faint field of partial lines: every harmonic of every rung */
  noFill();
  strokeWeight(1);
  for(let k=0;k<=4;k++){
    const baseY = rungYFor(k*12, A);
    for(let n=1;n<=6;n++){
      const y = baseY - (n-1)*14 - k*2;
      if(y < 0 || y > H) continue;
      const a = 14 - n*1.6 - k*1.2;
      if(a <= 0) continue;
      stroke(palette.rung[0], palette.rung[1], palette.rung[2], a);
      line(W*0.06, y, W*0.94, y);
    }
  }
  /* drifting dust */
  noStroke();
  for(const d of dust){
    d.y -= d.v;
    if(d.y < 0) d.y = 1;
    fill(200, 210, 230, 26);
    circle(d.x*W, d.y*H, d.s*2);
  }
}

function drawTower(){
  /* the ladder: rungs at each pseudo-octave, with per-semitone ticks */
  noFill();
  const cx = towerX, hw = towerW/2;
  /* fine semitone ticks along the rails */
  stroke(palette.rung[0], palette.rung[1], palette.rung[2], 34);
  strokeWeight(1);
  for(let st=-6; st<=54; st++){
    const y = rungYFor(st, A);
    if(y < towerTop-40 || y > towerBot+40) continue;
    const w = (st % 12 === 0) ? 0 : (st % 6 === 0 ? 9 : 5);
    if(w === 0) continue;
    line(cx-hw, y, cx-hw+w, y);
    line(cx+hw, y, cx+hw-w, y);
  }
  for(let k=0;k<=4;k++){
    const y = rungYFor(k*12, A);
    const glow = k === 0 ? 1.0 : 0.55;
    for(let g=3; g>=1; g--){
      stroke(palette.rung[0], palette.rung[1], palette.rung[2], 22*g*glow);
      strokeWeight(g*3);
      line(cx-hw, y, cx+hw, y);
    }
    stroke(palette.rung[0], palette.rung[1], palette.rung[2], 200*glow);
    strokeWeight(1.5);
    line(cx-hw, y, cx+hw, y);
    /* side rails */
    stroke(palette.rung[0], palette.rung[1], palette.rung[2], 60);
    strokeWeight(1);
    if(k<4){
      const y2 = rungYFor((k+1)*12, A);
      line(cx-hw, y, cx-hw, y2);
      line(cx+hw, y, cx+hw, y2);
    }
    /* label */
    noStroke();
    fill(palette.rung[0], palette.rung[1], palette.rung[2], 110);
    textAlign(RIGHT, CENTER); textSize(10);
    text('A^' + k, cx-hw-10, y);
  }
  drawMelodyRibbon();
  /* current A readout near tower */
  noStroke(); fill(235,242,255,120); textAlign(CENTER, CENTER); textSize(11);
  text('pseudo-octave A = ' + A.toFixed(2), cx, towerTop - 34);
  const dissolve = constrain((A-2.2)/0.4, 0, 1);
  fill(255,150,140, 90 + dissolve*120); textSize(10);
  if(dissolve > 0.02) text('the tonic will not resolve', cx, towerTop - 16);
}

/* the whole phrase drawn as a ribbon at the base octave, with ghost
   echoes of the same tune climbing the stretched ladder */
function drawMelodyRibbon(){
  for(let k=4; k>=0; k--){
    const alpha = k === 0 ? 120 : 34 - k*4;
    noFill();
    stroke(palette.comet[0], palette.comet[1], palette.comet[2], alpha);
    strokeWeight(k === 0 ? 2.5 : 1.2);
    beginShape();
    for(let i=0;i<melody.length;i++){
      const y = rungYFor(melody[i].st + k*12, A);
      const sway = Math.sin(i*0.7 + frameCount*0.015 + k)* (k===0?10:6);
      vertex(ribbonX(i) + sway*0.3, y);
    }
    endShape();
    /* note dots */
    if(k <= 1){
      noStroke();
      fill(palette.comet[0], palette.comet[1], palette.comet[2], k===0?170:70);
      for(let i=0;i<melody.length;i+=2){
        const y = rungYFor(melody[i].st + k*12, A);
        circle(ribbonX(i), y, k===0?5:3.5);
      }
    }
  }
}

function drawTonic(){
  /* three nodes: root, third, fifth, resting below the tower on the ground.
     As A rises past 2.2 they beat and dim. */
  const dissolve = constrain((A-2.2)/0.4, 0, 1);
  const y = towerBot + 40;
  const labels = ['root', 'third', 'fifth'];
  tonicNodes.forEach((nd, i) => {
    nd.phase += 0.03 + dissolve*0.25;
    const x = towerX + (i-1)*towerW*0.28;
    const wob = Math.sin(nd.phase*3.1)*dissolve*14;
    const bright = 220 - dissolve*140;
    for(let g=4; g>=1; g--){
      noStroke();
      fill(palette.tonic[0], palette.tonic[1], palette.tonic[2], 16*g*(1-dissolve*0.6));
      circle(x + wob, y, g*14);
    }
    noStroke();
    fill(palette.tonic[0], palette.tonic[1], palette.tonic[2], bright);
    circle(x + wob, y, 9);
    fill(235,242,255,100); textAlign(CENTER, CENTER); textSize(9);
    text(labels[i], x, y + 26);
    /* beat shimmer lines between nodes */
    if(dissolve > 0.05 && i < 2){
      stroke(255,150,140, dissolve*110);
      strokeWeight(1);
      const x2 = towerX + i*towerW*0.28;
      for(let s=0;s<5;s++){
        const t = (frameCount*0.05 + s/5) % 1;
        const bx = lerp(x + wob, x2, t);
        line(bx, y-14, bx, y+14);
      }
    }
  });
  noStroke(); fill(235,242,255,100); textAlign(CENTER, CENTER); textSize(10);
  text('the tonic chord', towerX, y - 34);
}

function ribbonX(i){
  return towerX - towerW/2 + (i/(melody.length-1))*towerW;
}

function advanceMelody(){
  noteT += deltaTime/1000;
  if(noteT >= NOTE_DUR){
    noteT = 0;
    noteIdx = (noteIdx + 1) % melody.length;
    const st = melody[noteIdx].st;
    ripples.push({st: st, r: 6, a: 200});
    if(audioOn) playNote(freqOf(st));
  }
  const target = melody[noteIdx].st;
  comet.st += (target - comet.st)*0.18;
  const tx = ribbonX(noteIdx);
  comet.x += (tx - comet.x)*0.2;
  comet.y = rungY(comet.st);
  melodyTrail.push({x: comet.x, y: comet.y});
  if(melodyTrail.length > 46) melodyTrail.shift();
}

function drawComet(){
  /* fading trail along the melody path */
  noFill();
  for(let g=4; g>=1; g--){
    stroke(palette.comet[0], palette.comet[1], palette.comet[2], 10*g);
    strokeWeight(g*2.4);
    beginShape();
    for(const p of melodyTrail) vertex(p.x, p.y);
    endShape();
  }
  noStroke();
  for(let g=5; g>=1; g--){
    fill(palette.comet[0], palette.comet[1], palette.comet[2], 18*g);
    circle(comet.x, comet.y, g*9);
  }
  fill(255,255,255,240);
  circle(comet.x, comet.y, 7);
  /* note name */
  fill(235,242,255,130); textAlign(LEFT, CENTER); textSize(11);
  text(Math.round(comet.st*10)/10 + ' st', comet.x + 18, comet.y - 12);
}

function drawRipples(){
  for(let i=ripples.length-1; i>=0; i--){
    const rp = ripples[i];
    rp.r += 2.2; rp.a -= 4;
    if(rp.a <= 0){ ripples.splice(i,1); continue; }
    const y = rungY(rp.st);
    noFill();
    stroke(palette.comet[0], palette.comet[1], palette.comet[2], rp.a);
    strokeWeight(1.5);
    ellipse(towerX, y, rp.r*2, rp.r*1.1);
  }
}

function drawSlider(){
  const s = slider;
  noStroke(); fill(235,242,255,26);
  rect(s.x, s.y, s.w, s.h, 13);
  const t = (targetA - 2.0)/0.6;
  const kx = s.x + t*s.w;
  noStroke(); fill(palette.rung[0], palette.rung[1], palette.rung[2], 200);
  circle(kx, s.y + s.h/2, 22);
  fill(7,10,20,255); textAlign(CENTER, CENTER); textSize(9);
  text('A', kx, s.y + s.h/2 + 0.5);
  noStroke(); fill(235,242,255,110); textSize(10);
  text('2.0', s.x - 24, s.y + s.h/2);
  text('2.6', s.x + s.w + 24, s.y + s.h/2);
  textAlign(CENTER, CENTER);
  text(autoSweep ? 'sweeping · drag to take over' : 'manual · double-click to resume sweep',
       s.x + s.w/2, s.y + s.h + 18);
}

function inSlider(x, y){
  const s = slider;
  return x > s.x-14 && x < s.x+s.w+14 && y > s.y-14 && y < s.y+s.h+34;
}

function mousePressed(){
  if(inSlider(mouseX, mouseY)){
    slider.dragging = true; autoSweep = false;
    setAFromX(mouseX);
    return false;
  }
  toggleAudio();
  return false;
}

function mouseDragged(){
  if(slider.dragging){ setAFromX(mouseX); return false; }
}

function mouseReleased(){
  slider.dragging = false;
}

function doubleClicked(){
  if(!inSlider(mouseX, mouseY)){ autoSweep = true; }
}

function touchStarted(){
  if(inSlider(mouseX, mouseY)){
    slider.dragging = true; autoSweep = false;
    setAFromX(mouseX);
    return false;
  }
  toggleAudio();
  return false;
}
function touchMoved(){
  if(slider.dragging){ setAFromX(mouseX); return false; }
}
function touchEnded(){ slider.dragging = false; }

function setAFromX(x){
  const t = constrain((x - slider.x)/slider.w, 0, 1);
  targetA = 2.0 + t*0.6;
}

function mouseClicked(){
  /* reseed on plain click away from slider is handled by toggleAudio;
     keep click for reseed via keyboard-like: use 'r' key instead */
}

function keyPressed(){
  if(key === 'r' || key === 'R'){
    seed = (seed*9301+49297) % 233280 + 7;
    rng = mulberry32(seed);
    palette = pickPalette(rng);
    buildMelody();
    updateSeedline();
  }
}

function toggleAudio(){
  if(!audioOn){
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === 'suspended') actx.resume();
      masterGain = actx.createGain();
      masterGain.gain.value = 0.16;
      masterGain.connect(actx.destination);
      audioOn = true;
    }catch(e){ audioOn = false; }
  } else {
    audioOn = false;
  }
  updateSeedline();
}

function playNote(f){
  if(!actx) return;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'triangle';
  o.frequency.value = f;
  const t = actx.currentTime;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(1.0, t+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t+NOTE_DUR*0.95);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+NOTE_DUR);
}
</script>
</body>
</html>
